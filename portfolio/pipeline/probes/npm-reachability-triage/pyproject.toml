[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npm-reachability-triage"
version = "0.1.0"
description = "Report which npm advisory findings describe code a project actually deploys."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
npm-reachability-triage = "triage.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
