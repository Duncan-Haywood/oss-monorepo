<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Handmade Ceramics — online shop</title>
</head>
<body>
  <header>
    <a href="/"><img src="/logo.png" alt="Handmade Ceramics home"></a>
    <form action="/search">
      <label for="q">Search products</label>
      <input type="text" id="q" name="q">
      <button type="submit">Search</button>
    </form>
    <a href="/cart" aria-label="Shopping cart"><span class="icon-cart" aria-hidden="true"></span></a>
  </header>
  <main>
    <h1>Handmade Ceramics</h1>
    <h2>Featured</h2>
    <ul>
      <li>
        <img src="/products/mug.jpg" alt="Blue glazed ceramic mug">
        <a href="/products/mug">Blue mug</a>
        <span>€24</span>
      </li>
    </ul>
    <form action="/subscribe">
      <label for="email">Email for our newsletter</label>
      <input type="email" id="email" name="email">
      <button type="submit">Subscribe</button>
    </form>
  </main>
</body>
</html>
