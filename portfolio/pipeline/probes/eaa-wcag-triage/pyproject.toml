[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaa-wcag-triage"
version = "0.1.0"
description = "Static WCAG 2.2 A/AA triage: the accessibility failures a source-only pass can find, split into task-blocking and degrading, with an explicit statement of what it could not check."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
eaa-wcag-triage = "wcag_triage.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
