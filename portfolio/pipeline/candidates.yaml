    host_venture: null
    scores:
      ai_leverage: 6
      autonomous_ops: 9
      time_to_revenue: 7
      gross_margin: 9
      defensibility: 3
      distribution: 5
      liability_containment: 7
      ethical_robustness: 8
    composite: 6.75
    floor: 3
    floor_dimension: defensibility
    measured:
      ai_leverage: >-
        7 -> 6, PR #207 step 2. 152 real tool-description changes classified;
        the work is deterministic diffing plus a small classifier, not
        model-heavy. Alert volume median 0.00/server/month.
      defensibility: >-
        4 -> 3, PR #245. The archive is public data on the half of the market
        this portfolio can reach: 98.3% of published npm-distributed
        declaration history is still re-downloadable (only 1.7% of versions
        were ever unpublished), and a cold entrant can rebuild the whole
        reachable market's archive in ~18 minutes with this repo's own
        extractor. The 84.5% of servers where a live pin genuinely is the only
        record are remote endpoints, all 8 sampled proxy-denied here.
      distribution: >-
        6 -> 5, PRs #225 and #229. This candidate's channel is exactly the
        free-registry regime those two measured: ~92% of npm listings that
        reach top-decile discovery still carry no price, indistinguishable
        from listings that never reached discovery, and the concentration
        holds on every registry tested.
    mitigation: >-
      Refuted by measurement, and no replacement found. #245 tested the named
      mitigation ("only the retained per-customer pin history accrues") and it
      does not hold on the reachable half of the market. The accruing-archive
      claim survives only for remote-endpoint servers, which need the same
      egress grant as Asks 3/7. Under README.md rule 2 this candidate cannot
      graduate until either that egress is granted or a durable asset other
      than the archive is named and tested.
    first_experiment_days: 14
    first_experiment_budget_usd: 150

  - slug: cra-evidence-desk
    name: CRA evidence desk
    doc: candidates/cra-evidence-desk.md
    verdict: probe
    verdict_changed: >-
      build-now -> probe, 2026-08-20. "Build now, narrow scope" rested on the
      EUVD/ENISA mapping being the wedge; that host is still egress-denied
      (re-confirmed this pass), and both named durable parts turned out to be
      public data or unreachable. What is measured and unblocked is the triage,
      which is a thinner proposition than the one that earned build-now.
    graduate_as: venture
    host_venture: null
    scores:
      ai_leverage: 7
      autonomous_ops: 8
      time_to_revenue: 7
      gross_margin: 9
      defensibility: 3
      distribution: 6
      liability_containment: 6
      ethical_robustness: 8
    composite: 6.75
    floor: 3
    floor_dimension: defensibility
    measured:
      ai_leverage: >-
        8 -> 7, PR #250 step 1. The false-positive rate is 64.6-66.0% across
        3,573 components in 9 real products, and it is bimodal rather than
        average: ~0-4% for server-rendered apps, ~98% for statically-exported
        ones. The discriminating input is the deployment mode - one fact the
        customer already knows and the scanner cannot see. Real value-add, but
        less of it is model work than scored.
      defensibility: >-
        4 -> 3, PRs #250 and #253. Both named durable parts fail: the archive
        half is public advisory data (same conclusion #245 reached for
        mcp-supply-chain-watch), and the EUVD/ENISA mapping half is
        egress-denied. #253 did widen the reachable feed to full canonical
        scope (OSV bulk store, 102 ecosystems; CISA KEV, 1,671 entries) - that
        is a build-capability improvement, not a moat.
    mitigation: >-
      Replaces the refuted one. The durable part is neither the archive nor the
      EUVD mapping but deployment-mode-aware triage: asking the customer the
      one question that collapses a 65% false-positive rate to near zero, and
      retaining the answer per component. That is a workflow asset rather than
      a data asset, it is measured rather than assumed, and it is reachable
      today. It is also visibly easy to copy, which is why this scores 3 and
      not higher.
    first_experiment_days: 10
    first_experiment_budget_usd: 200

