    floor: 5
    floor_dimension: liability_containment
    measured:
      liability_containment: >-
        6 -> 5, the pipeline's first gate measurement. This candidate's
        liability position rests on the evidence record's coverage statement
        being accurate, not on the engine finding everything, and that
        statement had never been checked against anything outside this
        repository. Checked against axe-core 4.13.0 (fetched from
        registry.npmjs.org, which is reachable — the normative index on
        www.w3.org is not, and that was mistaken for the denominator being
        unobtainable): 8 of the 22 automatable A/AA criteria were in neither
        the checked list nor the not-tested list, 6 of them Level A, including
        2.4.1 Bypass Blocks; and criterion-level disclosure hides the rest —
        4.1.2, disclosed as "partial", stands for 3 rules against the
        reference's 29. Verified by running defect markup through both
        engines, not by comparing tables. The 8 are now disclosed; the
        granularity is structural and is what moves the score. Still at the
        gate rather than below it: nothing is filed, signed or certified.
        See portfolio/research/a11y-external-coverage-reference/.
      ethical_robustness: >-
        6 -> 9, 2026-08-21, and the first upward revision in this file. It is
        not a re-estimate: the artifact changed, and the same harness re-ran.
        HISTORY. Earlier the same day this went 9 -> 6, the pipeline's first
        ethical-robustness measurement. The
        dimension asks whether the business gets better for customers as it
        scales; the way an evidence business gets worse is specific — the
        customer acts on a record whose errors are invisible to them, in a
        direction the operator profits from. Measured in
        portfolio/research/error-rate-disclosure/ by rendering this probe's own
        customer record and looking in it. It declares its coverage in full
        (what was not checked, and every undecidable element by reason) and is
        the strongest scope disclosure in the repository, but scope disclosure
        is not accuracy disclosure: the record nowhere states that a finding in
        the list can be wrong (-1), and it does not carry the out-of-sample
        precision of 0.821-0.881 that portfolio/research/a11y-own-sites/ has
        committed, so 12-18% of the list is not a defect and the reader cannot
        tell (-1). The audit is the qualification step that sells a EUR900-1,800
        fixed-price job, which makes over-reporting the direction that converts
        (-1). Mitigation: print the measured precision, and the build-artifact
        filter a11y-own-sites asked for, in the record itself — each is a line
        of rendering and each is worth a point back.
        AMENDED 6 -> 9, same day, same harness: the mitigation was taken. The
        record now carries both committed figures (precision 0.821-0.881 and
        recall 0.975, each with its corpus, its date, its derivation path and
        the reason it is not the last word), names both directions it errs in,
        and states outright that "over-reporting is the error that would pay
        us" — the conflict deduction 3 exists to ask about. All three
        deductions lapse, so the score returns to its prior. Read that prior
        for what it is: the 2026-08-18 screening estimate, restored because no
        disclosure deduction now applies, NOT a finding that this business is
        ethically strong. This rubric measures disclosure and nothing else. The
        residual risks it does not score are unchanged — the precision figure's
        denominator excluded 1.4.3 entirely, the recall figure is one
        comparison on a corpus exercising 2 of 13 criteria, and both were
        measured on this portfolio's own pages rather than on a customer's.
        Those are disclosed in the record rather than resolved.
        AMENDED 2026-08-22: the build-artifact filter a11y-own-sites asked for
        is built (provenance.py in the probe) and the score still does not
        move. On 118 built pages it removes exactly the 7 framework findings
        that directory identified by hand, and keeps the 7 project pages a
        filename-shaped filter would have taken with them. The record's
        precision on the hand-reviewed denominator rises to 0.917-0.983 and the
        printed figure was deliberately left at the measured 0.821-0.881: the
        revision would rest on this engine's own filter rather than on a second
        review by hand, and overstating precision is the direction that costs
        the buyer. What the record gained instead is a disclosure -- every
        excluded document, its marker, its reason and every finding set aside,
        with an invitation to reject the exclusion. See
        portfolio/research/a11y-own-sites/ Finding 5.
    floor_note: >-
