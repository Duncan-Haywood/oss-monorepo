# Scored candidates, machine-readable.
#
# Not ventures. A candidate graduates per its `graduate_as` field: a `venture`
# when someone writes ventures/<name>/VENTURE.yaml, a `product-line` when its
# slug is listed under `product_lines` in its `host_venture`'s VENTURE.yaml.
# Only then does the router see it -- and only if that directory carries no
# NOT-A-VENTURE marker, which wins over a VENTURE.yaml beside it. See
# README.md's opening section.
#
# Scores are 0-10 on the eight dimensions described in README.md. `composite`
# is their mean and `floor` is the lowest single dimension — the floor is
# usually the thing that actually decides, so it is stored rather than derived.
#
# Gates (see README.md): liability_containment or ethical_robustness below 5
# rejects a candidate regardless of composite. Any dimension at 4 or below
# requires a named mitigation before graduation.

# Derived fields (`composite`, `floor`, `floor_dimension`) and the three rubric
# rules are checked by `validate_candidates.py` in this directory. Run it after
# any score edit.
#
# `measured` blocks record which dimensions stopped being estimates. A score
# with no `measured` entry is still the 2026-08-18 screening estimate.

