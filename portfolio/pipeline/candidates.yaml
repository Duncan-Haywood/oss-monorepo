  - slug: public-record-watch
    name: Public-record watch
    doc: candidates/public-record-watch.md
    verdict: probe
    graduate_as: venture
    host_venture: null
    scores:
      ai_leverage: 6
      autonomous_ops: 9
      time_to_revenue: 6
      gross_margin: 9
      defensibility: 5
      distribution: 4
      liability_containment: 8
      ethical_robustness: 9
    composite: 7.0
    floor: 4
    floor_dimension: distribution
    measured:
      ethical_robustness: >-
        6 -> 9, 2026-08-21. The mitigation below was built: subscriber_record.py
        is the customer-facing surface this probe did not have, and the same
        harness re-scored it. It prints the held-out detection rate (6 of 17,
        0.35) and median latency (110d) at the top of every record with their
        corpus, derivation and limits; it names the direction (under-reporting);
        it discloses the conflict verbatim — "a false alarm costs us a
        subscriber, and a miss costs us nothing and is invisible to you, so our
        commercial incentive runs toward tuning this watch to stay quiet"; and
        it refuses to render an absence of alerts as health, carrying instead
        the standing caveat that no alert from us is not evidence a register is
        active. It also names the per-source detectability the mitigation asked
        for: FDA/openfda calibrates to a 2060-day threshold, so the record lists
        it as effectively unwatched rather than leaving "no alert" to be read as
        reassurance. All three deductions lapse. Read the 9 as the screening
        estimate no longer being reduced, NOT as a finding that the product is
        good: this rubric measures disclosure only, and the detector still
        misses roughly two thirds of the dormancy it is sold to find. That is a
        product problem, priced in ai_leverage and distribution, and it is now
        disclosed rather than hidden.
        HISTORY. Earlier the same day this went 9 -> 6,
        portfolio/research/error-rate-disclosure/. This
        probe has no customer-facing record module at all. The closest artifact
        it renders is an operator table which prints MISSED beside a source
        whose dormancy the detector failed to catch, and nothing carries either
        that fact or a rate to a subscriber (-1 direction, -1 rate) — while the
        probe's own README commits a held-out recall of 0.35, six of seventeen
        dormancy episodes. The customer sees the same silence whether a source
        is quiet or the detector missed it, so unlike a false positive this
        error is unobservable from the outside. Nuisance alarms cost the
        operator churn (43 alarm-days per source-year at the high-recall
        setting) while a miss costs nothing, which makes the cheapest tuning
        the one that fails the subscriber (-1). Mitigation: ship the per-source
        detectability with the feed — this source has 37 historical gaps and 14
        of them exceed the silence you are asking us to flag — so the customer
        buys a stated recall rather than an implied one.
    mitigation: Probe tests distribution first, not the product — fifty reachable buyers in one vertical inside a week, or move to the next vertical.
