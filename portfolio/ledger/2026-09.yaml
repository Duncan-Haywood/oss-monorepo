        backgrounds `sleep 30` and never kills it, so on SIGTERM the stub
        exits but the sleep is orphaned holding the test's Popen stdout
        pipe. `communicate()` returns on EOF rather than on the child
        exiting, so the wait lasted the full remaining ~29.5s against its
        own 30s timeout -- passing on about half a second of margin and
        tipping over on any loaded runner, reporting "the entrypoint
        ignored SIGTERM" when the entrypoint had exited promptly. Fixed in
        #3004 (test-only; the stub now kills its sleep in the TERM trap):
        ~30s to 0.83s, margin ~0.5s to ~29s. Merged. #3003 and #3005 were
        merged concurrently by another session.
