        searcher could land on.
      - >-
        This resolves the blocker the two entries above hit rather than
        repeating it. Both dropped a comparison page because the proxy blocks
        egress to the incumbent's domain (etsy.com, ebay.com, amazon.com,
        reverb.com and tiktok.com are all 403 on CONNECT) and the item forbids
