        box ships `hidden` and the script reveals it, so a reader without
        JavaScript still gets all 156 links and never meets a dead control.
        No dependency and no build step (Argo CD delivers this page as a
        ConfigMap), and the haystack is built in the browser from what the
        page already displays rather than written per card -- the whole
        feature is +2.3 KB gzipped, against ~4 KB for the naive shape.
      - >-
        Two real defects found by *measuring the rendered page* rather than
        reading the diff, both fixed inside #2899 before it merged. (1) The
        search field bordered with `--rule`, which measures 1.36:1 against the
        page in light and 1.54:1 in dark -- fine for a card, whose shape a
        reader gets from its fill, and a failure of WCAG 2.1 SC 1.4.11 for the
        one control on the page, where the boundary is what says "you can type
        here". New `--field-edge` token, re-measured at 3.59:1 and 3.96:1.
        (2) Hiding a category's `ul.grid` did nothing, because the UA sheet's
        `[hidden] { display: none }` loses to *any* author `display`
        declaration and `.grid` sets `display: grid`. Filtering to one trade
        left six emptied lists still rendering -- invisible to a sighted
        reader, since a grid with no visible items has no height, and read out
        by a screen reader as six empty lists between the heading and the one
        result. The generalisable lesson: on this page every element a script
        hides needs its own `[hidden]` rule, and a headless pass is what
        catches both of these, since neither is visible in the diff or in the
        markup.
