        the *donor* shard ("safe by construction" in its own comment); the
        *recipient* grows and nothing capped it, so a file larger than
        ~444 KiB would have pushed a shard past the etcd object cap the whole
        sharding design exists to stay under. Added that guard plus a
        keep-one-file guard so the donor cannot drain to an empty ConfigMap,
        and dropped the branch's stale `portfolio-front-tools-7` volume mount,
        which referenced a ConfigMap that does not exist at 7 shards and would
        have broken the front-door pod.
      - >-
        The first draft of the three new tests passed with *and* without the
        fix. Cause worth remembering: the loop read `CLIENT_SIDE_APPLY_CEILING`
        (256 KiB) directly, so at a test-sized ceiling of 1000 bytes every
        shard is a "runt" by definition and the real path never ran. Made the
        threshold a parameter; each test now demonstrably fails against the
        code it guards. `--write` reproduces the committed mirror byte for
