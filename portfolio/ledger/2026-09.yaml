      - >-
        Why it was safe to act rather than wait: the 2026-09-01 ledger entry
        flagged this and left it, reasoning that confirming the routing
        needed live cluster access. That aimed at the wrong risk. The
        network has never been created -- `infra/Makefile` refuses to apply,
        the only Hetzner credential is `HETZNERREADAPIKEY` (read-only), and
        `bootstrap/preflight.sh` still treats "10.42.0.10 not on the box
        yet" as the expected state -- so there was nothing live to observe
        and the fix was four strings. After an apply it would have been
        renumbering a live cluster's node addresses on the box serving
        marisstella.dev. Worth generalising: "we cannot confirm X" is only
        load-bearing when X can actually happen yet.
      - >-
        The half that is easy to miss: `gitops/{prod,ci,agents}/networkpolicy.yaml`
        were blocking the node addresses only as a *side effect* of
        excepting the pod CIDR -- `gitops/ci/networkpolicy.yaml` said so in
        a comment ("inside the pod CIDR already excluded here"), which was
        true and was the bug. Moving the network without moving the
        exception would have opened every runner and worker pod a route to
        both kubelets on :10250. General rule for this repo: moving a CIDR
        silently breaks every rule that named it for a different reason.
      - >-
        Concurrency, handled rather than fought: #2660 landed mid-run fixing
        the same collision from the opposite end -- pinning `--cluster-cidr`
        to `10.244.0.0/16` instead of moving the network. Both were kept,
        because they cover different clusters: a pin takes effect at install
        time and cannot help an already-running cluster (#2660 says so
        itself), while moving the network protects the cluster that exists,
        since what is being created is the network and not the cluster.
        Integrating also surfaced a gap #2660 left -- moving the pod CIDR to
        10.244.0.0/16 moved every pod address out of the 10.42.0.0/16
        exclusion and into the allowed range, so on a fresh install a CI
        runner or Codex worker would have had a route to every pod on :443.
        Excepted in all three policies now, both ranges kept.
