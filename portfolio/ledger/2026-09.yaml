    human_hours: 0
    outcomes:
      - >-
        Investigated a task brief alleging a mass-wrongful-PR-closure
        incident: ~30 PRs (#2694-#2743) all closed within a ~4-hour window
        on 2026-09-02, with `mcp__github__list_pull_requests` (state=closed)
        reporting `merged: false` on every single one -- read as a possible
        repeat of the 2026-08-24 concurrent-close failure CLAUDE.md
        documents (two sessions closing each other's still-open PRs as
        "superseded" within seconds, destroying finished work).
      - >-
        Finding: the incident did not happen. `list_pull_requests`'s
        `merged` field is not populated on that endpoint -- it reads false
        for every row regardless of actual state. The single-PR
        `pull_request_read` (method get) endpoint is authoritative and
        shows `merged: true` / `merged_by` / `merged_at` correctly. Checked
        individually: 45 of the ~50 PRs in #2694-2743 are cleanly merged
        into `main`. The remaining 5 (#2694, #2695, #2704, #2705, #2726)
        are genuinely closed unmerged -- and every one of those five has a
        close comment citing `portfolio/ledger/supersede_check.py` output
        and naming a specific surviving commit/PR, exactly as CLAUDE.md's
        "Duplicate PRs" section requires. Independently re-ran
        `supersede_check.py` on all five myself rather than trusting the
        comment text: #2694, #2695, #2704, #2705 all exit 0 (three via
        identical-merge proof); #2726 exits 1 (a genuine same-feature
        duplicate of #2724's `vs-synder.html`, not a strict line-for-line
        match -- confirmed by reading both files side by side, matching
        CLAUDE.md's explicit "exit 1 does not license an unread close, read
        the pairs" guidance rather than the identical-merge shortcut). None
        of the five should be reopened.
      - >-
        Lesson for future sessions: do not read `list_pull_requests`'s
        `merged` field as evidence of anything. A closed-PR audit needs
        `pull_request_read` (method get) per PR, or the merge commit
        message/SHA, to tell a merged PR from an abandoned one. Trusting
        the list endpoint's `merged: false` at face value is what produced
        this session's starting premise, and would have led to reopening
        45 already-shipped PRs if not independently checked against `main`
        first.
      - >-
        With the presumed incident resolved as a non-event and the PR queue
        genuinely empty at that point, picked up 4 PRs opened by concurrent
        sessions in the same window and merged them after independent local
        verification (not just trusting each PR's own claimed test output):
