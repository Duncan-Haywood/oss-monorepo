      - >-
        The fix is a job-level `if:` on `vars.ROUTINE_TRIGGER_ENABLED`, with
        `workflow_dispatch` bypassing it. The load-bearing property is that a
        job skipped by a false `if:` is skipped *before a runner is
        assigned* -- so the gate belongs on the job, not in a step, which has
        already paid for the runner by the time it runs. Confirmed against
        this repo's own `ci_starvation.py` (a skipped job has
        `runner_id: None`), and then **in production**: the 14:45 scheduled
        run, 33644084322, came back `skipped`, and `ci_starvation.py --run`
        on it reports "0 job(s) that ran ... 1 skipped by the workflow". The
        nine-day burn is over, verified on the live schedule rather than
        argued from the manifest.
