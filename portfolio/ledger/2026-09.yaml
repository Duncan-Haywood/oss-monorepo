period: 2026-09
entries:
  - venture: walmart-marketplace-calculator
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Shipped the marketing-distribution queue item's candidate 2
        (comparison/alternatives page) via #2597: a new
        vs-wfs-cost-estimator.html naming Walmart's own official WFS Cost
        Estimator (seller.walmart.com/wfs/cost-calculator, documented at
        marketplacelearn.walmart.com) as the authoritative live fee lookup,
        while positioning this calculator for the WFS-vs-seller-fulfilled
        decision, the price match, and the returns/inbound costs Walmart's
        own tool documents that it excludes. Follows the
        vs-amazon-revenue-calculator.html pattern #2590 shipped: no dollar
        figure claimed for the incumbent's fees, only links to its own
        domains. Measured before picking per the task's own instruction --
        built the site (169 products, 510 pages, no dead links) and
        confirmed the other three candidates (embed widget, /c/ hub copy,
        /about/ press kit) are already fully covered with no real gap, so
        none were re-picked. Also checked ebay-fee-calculator,
        etsy-profit-calculator, reverb-fee-calculator, and
        tiktok-shop-fee-calculator for the same candidate: none of those
        four marketplaces publish a single obvious official calculator a
        seller would search for by name (only third-party tools), so
        Walmart was the one real remaining gap. Verified: venture
        `node --test` 130/130, full `build.mjs`+`check.mjs`, and
        `platform/pages` suite 837/837, all locally -- 0 check runs on the
        PR (GITHUB_TOKEN-opened, absent CI per repo convention, not a
        failure).
      - >-
        No PR was open on this asset at session start (checked `list_pull_requests`:
        0 open) and no branch or commit already carried a
        vs-wfs-cost-estimator.html or equivalent, so this was new work, not
        a duplicate.
  - venture: tender-bid-readiness
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        product-feature-improvement queue item, run directly (governor
        still owner-gated, per gitops/agents/governor/policy.json
        "enabled": false). Session start: 0 open PRs, so the mandate's
        merge-quota phase was a no-op; ~150 stale branches sampled and
        confirmed superseded via portfolio/ledger/supersede_check.py
        (consistent with #829's own finding that the branch list is
        ~99% landed-or-abandoned noise), so none were converted to PRs.
        Picked tender-bid-readiness as the thinnest shipped venture by
        line count (160 lines) with a real gap: its own guide page,
        should-i-bid-on-this-tender.html, already told bidders that a
        missed mandatory pre-bid meeting or site visit "cannot be
        recovered", but check.mjs had no signal for it -- a solicitation
        with that requirement could score 100% readiness while it went
        undetected. Added a dedicated site-visit signal alongside the
        existing six; updated the FAQ copy and its matching JSON-LD from
        six to seven signals. Merged as #2595.
      - >-
        Verified: node --test in the venture (5/5, 1 new),
        node platform/pages/build.mjs + check.mjs dist (169 products,
        509 pages, no dead links), platform/pages/faq-visible.test.mjs
        (4/4), platform/pages/clauses.mjs tender-bid-readiness
        (no-warranty clause intact), python3 portfolio/router/validate.py
        (182/182 VENTURE.yaml valid).
      - >-
        Also confirmed, before picking: gitops/agents/networkpolicy.yaml's
        DNS-egress scoping (the live exfiltration path a prior session
        fixed) is still correctly scoped on main; platform/pages/build.mjs
        + check.mjs pass clean on an unmodified main (169 products, no
        dead links); and every one of 184 ventures still reads
        live_url_visitors: null in usage.yaml -- public reach remains
        blocked on the single owner seal (portfolio-site-repo) already
        named in DIRECTION.md and the decision queue, not re-raised here.
      - >-
        One new signal worth recording since it contradicts standing
        guidance in CLAUDE.md: #2595's checks ran on real GitHub-hosted
        runners (confirmed with platform/ci/ci_starvation.py --run
        <id> -- runner_id 1000040488, not 0) and all 10 check runs
        (validate, test x3, build x2, check, link-contrast,
        page-integrity, copilot-pull-request-reviewer) completed green
        in under two minutes. CLAUDE.md's "This is not an outage" section
        describes Actions as dark for every workflow since
        2026-08-26T22:41:49Z pending an owner-sealed runner PAT and a
        CI_RUNNER flip to self-hosted. Whatever the account-level cause
        was, it is not blocking this repo's Actions runs as of this
        session (2026-09-01, ~18:23 UTC) -- this was not the self-hosted
        path (gitops/ci/ is unrelated to a GitHub-hosted runner ID), so
        it reads as the account-level condition itself having cleared,
        not the documented unblock having been applied. Flagging for the
        next session to confirm before continuing to treat every red or
        absent check as the known outage; do not re-run the CI_RUNNER
        seal ask on the strength of this one PR alone.
