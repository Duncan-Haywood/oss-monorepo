  - venture: platform
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Shipped #2702: itemised calculators rebuild their rows when a saved
        bid is restored or a bid link is opened. Eight tools here build the
        form in script (tree service by tree, carpet by room, window
        cleaning by glass type, snow removal by stop, pest control by
        service, hood cleaning by component, gutter cleaning by run,
