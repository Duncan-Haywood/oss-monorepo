  - venture: platform
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Put the seven Playwright-backed checks in `platform/pages/` into CI
        for the first time, via #2616 (`.github/workflows/browser-checks-ci.yml`).
        `browser_checks.py`'s own docstring had recorded why nothing ran them
        -- "they need Playwright, which is not a dependency of this repo, so
        no workflow runs them" -- and that stayed true after runners came back
        on 2026-09-01. They do not need to be a repository dependency: the
        workflow installs them into `$RUNNER_TEMP`, outside the checkout, so
        no root `package.json` appears to change what other workflows'
        `node --test` globs see. Nightly plus `workflow_dispatch`, not
        per-PR, and that is a measured decision rather than caution: a run is
        the whole 510-page site (none of the seven has a subsetting knob) and
        `platform/pages/` took 123 commits in the seven days to 2026-09-01,
        so gating those would be hours of metered Actions minutes a day --
        the same allowance whose exhaustion on 2026-08-26 took all 218
        workflows dark for five days.
      - >-
        The suite earned itself on its first run: `sweep` failed at 168/169,
        reporting `ai-engineering-academy` as `NO-CONTROLS -- 2 control(s) on
        the page, none of them usable`. The page is fine. It is the hub
        linking to six electronics calculators, and `sweep.mjs` already has a
        `links-only` branch for exactly it, whose own comment names "the
        nested academy hub". That branch is guarded on `interactive === 0`,
        and `interactive` (sweep.mjs:362) was the only control count in the
        file that did not go through `ownOnly()` -- the helper written to drop
        the bands this build injects. `injectEmbedWidget` (#2561, merged
        2026-08-31) adds a `<textarea>` and a "Copy embed code" `<button>`
        inside `.pf-chrome` to every entry page, so on the one page owning no
        controls of its own the count went 0 to 2, the branch stopped firing,
        and a page doing its job was reported as a dead product. Sweep last
        ran clean on 2026-08-31 -- the day the widget shipped -- and nothing
        ran it in between, which is the argument for the workflow restated as
        an incident.
      - >-
        Verified with a real browser (Playwright 1.56.0 against the
        `chromium-1194` build at `/opt/pw-browsers`, the version pin
        `sweep.mjs`'s header warns about) on a `tools.marisstella.dev`-stamped
        build: before, 168/169 and sweep exit 1; after, 169/169 with
        `ai-engineering-academy` reading `links-only`. All seven checks ran --
        sideways, presets, roundtrip, highlight, contrast, sweep, journey --
        with only sweep failing. Also `platform/pages` 838/838, gitops
        197/197, `validate_workflows.py` 221/221, `publish_surface.py --check`
        matching, and `test_browser_checks` 42/42. `embed.test.mjs` gains the
        other half of the contract (every injected control stays inside
        `.pf-chrome`), mutation-checked by dropping the class and watching it
        fail.
      - >-
        Both of Copilot's findings on #2616 were real and were fixed rather
        than answered: Playwright and axe-core are now pinned (1.56.0 /
        4.13.0), which matters here because Playwright pins a browser *build
        number* and a floating spec would change the browser under test with
        no commit; and the second resolve, `npx --yes playwright install`,
        was the sharper half -- it prefers a local binary but silently fetches
        the latest when it does not find one, so it invokes the pinned CLI at
        its path instead.
      - >-
        Queue state: one open PR at session start (#2609, a dependabot
        browserslist dev-dependency bump), merged after its checks came back
        green on real runners. Zero open PRs at session end. Not a
        three-PR-quota run because three repairable PRs did not exist.
      - >-
        Not shipped, and worth a follow-up: the six calculators under
        `/ai-engineering-academy/*/` are real products `sweep` never opens,
        because the catalog carries one entry for the venture and sweep walks
        the catalog. `contrast` and `check.mjs` do cover those pages; "does
        the sub-calculator still compute in a browser" is covered by nothing.
        Teaching the sweep to follow a hub into its children is a larger
        change than the PR should have carried.
      - >-
        Deployment is still one owner action from live, unchanged by this
        session and re-confirmed: `publish_surface.py --check` reports 0
        hostnames serving content, with the apex and `www` answering on merge
        but 301ing to `tools.marisstella.dev`, which waits on Secret
        `portfolio-site-repo` (`./bootstrap/scripts/seal-owner-secrets.sh
        site`). The Hetzner Codex fleet the owner asked about is likewise
        built and inert: `worker.sh` implements the `CODEX_AUTH_JSON`
        subscription path (the "built-in quota" shape), and it waits on
        `codex-secrets` plus `policy.json` `enabled: true` and unsuspending
        the governor CronJob.
  - venture: platform
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Correction to the `platform` entry above, appended rather than edited
        per this file's own rule ("Append, do not edit -- rewriting history to
        look better destroys the only signal the router has"). The first
        attempt at this correction rewrote that entry's outcome in place, on
        #2621; Copilot caught it against `portfolio/ledger/README.md:25-30`
        and it was reverted. Worth recording that the rule bit the case it was
        written for: the edit was to make a record of my own review round read
        more accurately, which is exactly the shape of "rewriting history to
        look better".
      - >-
        What that entry got wrong. It said "both of Copilot's findings on
        #2616", described one finding's two parts (the floating package specs
        and the `npx` resolve) as though they were the two findings, and so
        omitted the second one entirely -- a comment that said the opposite of
        what it meant, claiming GitHub-hosted `ubuntu-latest` could not
        install Chromium's shared libraries when passwordless sudo is exactly
        why it can. That was fixed on #2616 before merge; only the record of
        it was wrong.
      - >-
        And there was a third finding the entry could not have known about:
        Copilot raised it as a *suppressed* comment rather than a review
        thread, so it never appeared as one and was not seen before #2616
        merged. It was the most important of the three. The workflow exited 0
        when `browser_checks.py` exits 2 ("something did not run"), which
        turned a run that verified nothing into a green nightly. The header's
        justification cited CLAUDE.md's three paragraphs on absent versus
        failed CI and misapplied them: those are about how to *read* a signal
        you were handed, not a licence for a scheduled verification to go
        green having verified nothing. The hole was total rather than
        theoretical -- the Chromium install step is `continue-on-error`, so a
        failed browser install would have left this workflow green forever
        while running no checks at all, and an unknown name in the `checks`
        input does the same. Fixed forward on #2621: exit 2 now fails the job
        and prints an `::error::` naming which checks did not run and that it
        is not a defect in a calculator. Reproduced both ways before and
        after (`--checks sweeep` and `PLAYWRIGHT=/nonexistent`: harness 2, old
        shell job 0, new shell job 2).
      - >-
        Two further findings on #2621 itself, both verified against the source
        before acting rather than taken on the bot's word. The `::error::`
        first read "Nothing was verified", which contradicts the harness: exit
        2 fires when *some* checks skipped and the rest passed
        (`browser_checks.py` prints "N of 7 checks did NOT run" then "the M
        check(s) that ran passed"), so the annotation now says one or more did
        not run and names them. The remediation wording also assumed a command
        fixes it, which is wrong for a typo'd `checks` input. The second was
        the append-only violation this entry opens with.
      - >-
        The standing lesson, which is the same one three times now: this
        repository's recurring defect is a check that cannot report its own
        absence -- `highlight` written and left out of `CHECKS` so "the
        browser checks" ran six of seven silently, `supersede_check.py`
        exiting 1 on 65 of 66 PRs so nobody used it, and now a nightly suite
        that would have gone green while running nothing. Absent CI not being
        failed CI is about reading a signal, never about a gate being allowed
        to stay quiet.
  - venture: platform
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Measured what the red `claude-routine-trigger` workflow actually
        costs, and corrected the `routine-trigger-cadence` row in
        `asks.yaml`, which was overstating it ~5x on fire count and ~17x on
        Actions spend. Both figures assumed the run loops; it does not. On
        401 `fire()` returns 2 and the loop's `case` does `2) exit 1`, so a
        run aborts on its first fire and never reaches the four remaining
        slots or their 240s sleeps. Five consecutive runs (33553452882,
        33551039615, 33549288450, 33547527610, 33545549251) each ran one
        `fire` job for 2-3 seconds on a real runner, `ci_starvation.py
        --run` exit 0 on each; a 5-fire loop would occupy ~16 minutes. So
        the standing waste is 72 API calls a day rather than 360, and ~72
        billed Actions minutes a day -- on the order of $17/month against
        the ~$300 the row's `unlocks` figure quotes for the *working*
        state. Nothing fires, so Claude-side spend and the daily
        routine-run cap sit at zero.
      - >-
        Why the magnitude was worth a commit rather than a note: the row
        read as an urgent drain on the same metered allowance whose
        exhaustion took all 218 workflows dark on 2026-08-26, which argues
        for deleting a file the owner explicitly asked for. At ~$17/month
        it is affordable to leave red while the owner decides. What
        survives the correction is the part that was never about money --
        424 runs, every scheduled one red on its own merits, are the
        standing counter-example to "CI is green".
