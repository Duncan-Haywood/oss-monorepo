period: 2026-09
entries:
  - venture: walmart-marketplace-calculator
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Shipped the marketing-distribution queue item's candidate 2
        (comparison/alternatives page) via #2597: a new
        vs-wfs-cost-estimator.html naming Walmart's own official WFS Cost
        Estimator (seller.walmart.com/wfs/cost-calculator, documented at
        marketplacelearn.walmart.com) as the authoritative live fee lookup,
        while positioning this calculator for the WFS-vs-seller-fulfilled
        decision, the price match, and the returns/inbound costs Walmart's
        own tool documents that it excludes. Follows the
        vs-amazon-revenue-calculator.html pattern #2590 shipped: no dollar
        figure claimed for the incumbent's fees, only links to its own
        domains. Measured before picking per the task's own instruction --
        built the site (169 products, 510 pages, no dead links) and
        confirmed the other three candidates (embed widget, /c/ hub copy,
        /about/ press kit) are already fully covered with no real gap, so
        none were re-picked. Also checked ebay-fee-calculator,
        etsy-profit-calculator, reverb-fee-calculator, and
        tiktok-shop-fee-calculator for the same candidate: none of those
        four marketplaces publish a single obvious official calculator a
        seller would search for by name (only third-party tools), so
        Walmart was the one real remaining gap. Verified: venture
        `node --test` 130/130, full `build.mjs`+`check.mjs`, and
        `platform/pages` suite 837/837, all locally -- 0 check runs on the
        PR (GITHUB_TOKEN-opened, absent CI per repo convention, not a
        failure).
      - >-
        No PR was open on this asset at session start (checked `list_pull_requests`:
        0 open) and no branch or commit already carried a
        vs-wfs-cost-estimator.html or equivalent, so this was new work, not
        a duplicate.
  - venture: tender-bid-readiness
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        product-feature-improvement queue item, run directly (governor
        still owner-gated, per gitops/agents/governor/policy.json
        "enabled": false). Session start: 0 open PRs, so the mandate's
        merge-quota phase was a no-op; ~150 stale branches sampled and
        confirmed superseded via portfolio/ledger/supersede_check.py
        (consistent with #829's own finding that the branch list is
        ~99% landed-or-abandoned noise), so none were converted to PRs.
        Picked tender-bid-readiness as the thinnest shipped venture by
        line count (160 lines) with a real gap: its own guide page,
        should-i-bid-on-this-tender.html, already told bidders that a
        missed mandatory pre-bid meeting or site visit "cannot be
        recovered", but check.mjs had no signal for it -- a solicitation
        with that requirement could score 100% readiness while it went
        undetected. Added a dedicated site-visit signal alongside the
        existing six; updated the FAQ copy and its matching JSON-LD from
        six to seven signals. Merged as #2595.
      - >-
        Verified: node --test in the venture (5/5, 1 new),
        node platform/pages/build.mjs + check.mjs dist (169 products,
        509 pages, no dead links), platform/pages/faq-visible.test.mjs
        (4/4), platform/pages/clauses.mjs tender-bid-readiness
        (no-warranty clause intact), python3 portfolio/router/validate.py
        (182/182 VENTURE.yaml valid).
      - >-
        Also confirmed, before picking: gitops/agents/networkpolicy.yaml's
        DNS-egress scoping (the live exfiltration path a prior session
        fixed) is still correctly scoped on main; platform/pages/build.mjs
        + check.mjs pass clean on an unmodified main (169 products, no
        dead links); and every one of 184 ventures still reads
        live_url_visitors: null in usage.yaml -- public reach remains
        blocked on the single owner seal (portfolio-site-repo) already
        named in DIRECTION.md and the decision queue, not re-raised here.
      - >-
        One new signal worth recording since it contradicts standing
        guidance in CLAUDE.md: #2595's checks ran on real GitHub-hosted
        runners (confirmed with platform/ci/ci_starvation.py --run
        <id> -- runner_id 1000040488, not 0) and all 10 check runs
        (validate, test x3, build x2, check, link-contrast,
        page-integrity, copilot-pull-request-reviewer) completed green
        in under two minutes. CLAUDE.md's "This is not an outage" section
        describes Actions as dark for every workflow since
        2026-08-26T22:41:49Z pending an owner-sealed runner PAT and a
        CI_RUNNER flip to self-hosted. Whatever the account-level cause
        was, it is not blocking this repo's Actions runs as of this
        session (2026-09-01, ~18:23 UTC) -- this was not the self-hosted
        path (gitops/ci/ is unrelated to a GitHub-hosted runner ID), so
        it reads as the account-level condition itself having cleared,
        not the documented unblock having been applied. Flagging for the
        next session to confirm before continuing to treat every red or
        absent check as the known outage; do not re-run the CI_RUNNER
        seal ask on the strength of this one PR alone.
  - venture: portfolio
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Picked up the handoff the previous entry left ("flagging for the next
        session to confirm before continuing to treat every red or absent
        check as the known outage") and closed it. Confirmed independently:
        recent runs carry runner ids in the 1000040xxx range, and #2601 went
        green on merit -- its `gitops` job executed `kustomize build`,
        `kubeconform` and 193 pytest cases rather than dying in 4s. So the
        recovery is real and held for at least the ~19 hours from
        2026-09-01T00:00:53Z. Acted on it rather than re-flagging: #2603
        rewrites the falsified guidance in CLAUDE.md ("this is not an outage
        and it will not pass on its own" -- it did), AGENTS.md ("a red check
        is not a failed check right now") and gitops/agents/workers/mandate.md,
        which the Codex fleet reads on every run. The dangerous error has
        inverted -- it used to be "fixing" green code, it is now waving a real
        failure through as a ghost of the outage -- and three of the repo's
        most-read files were encouraging the new one. Deliberately not
        overcorrected to "fixed forever": the recovery landed at 00:00:53Z on
        the 1st, which is what a metered allowance reset looks like, so the
        text says the ceiling cycles and keeps the full signature and
        ci_starvation.py for when it returns.
      - >-
        Same PR clears `actions-runners-unavailable` from the owner's decision
        queue as a live blocker. It still read "every workflow ... dies in 3-6
        seconds with runner_id: 0 -- confirmed still true as of 2026-08-29",
        i.e. asking the owner to act on a problem that had resolved itself,
        from a `gates deployment` slot competing for attention with the
        `portfolio-site-repo` seal that actually is blocking. asks.yaml has no
        resolved/closed field, so the row's text was rewritten rather than a
        schema state invented or the owner's decision deleted for them; the
        self-hosted-runner path stays as the optional insurance it now is
        (not metered, so it makes the next cycle a non-event), explicitly
        ordered after the two blocking seals. Also corrected two stale
        cross-references that read the old state as permanent
        (portfolio-site-hetzner-deploy's "dark since 2026-08-26" and
        portfolio/hosting/README.md's third stacked Pages blocker, now
        resolved -- two of that list's three still stand). Owner-blocking
        count therefore drops from three seals to two.
      - >-
        Shipped #2601: reordered the Codex queue to match the account owner's
        standing direction for these scheduled runs ("deployment and cicd is
        a priority and building and deploying marketing materials"). Was
        open-pr-repair-merge (7), branch-pr-drain (6), deploy-cicd-readiness
        (5), marketing-distribution (4); now deploy 7, marketing 6, open-pr 5,
        branch-drain 4. Deployment and marketing take 45.4% of the plan quota
        between them instead of 30.3%. The two demoted items held the top
        slots from when the PR/branch backlog was the bottleneck; it is not --
        the repo had zero open PRs, so they were holding 13/25ths of the
        weight over provably empty work, and pick_item's noops damping only
        learns that after spending the runs. Deliberately a demotion and not a
        disabling: at 5 and 4 they keep 11/33 of the queue, every real item
        merges its own PR (delivery: agent) so the ordinary run needs no
        separate drain, and open-pr-repair-merge is the safety net for a run
        whose verification did not come out clean. test_governor.py pins the
        new ordering plus a floor under that item's share; verified the
        assertion is non-vacuous (fails `assert 5 > 6` on the old priorities).
        Also recorded the owner's stated preference for the built-in-quota
        Codex credential (CODEX_AUTH_JSON) in OWNER_CHECKLIST.md item 8,
        which had been presenting it as an open binary. No secret sealed and
        no governor flip made.
      - >-
        Zero open PRs at session start and again before pushing, so the
        three-merge quota in the standing prompt did not apply. Considered and
        dropped a comparison page for etsy-profit-calculator (the strongest
        remaining marketing-distribution candidate): egress to etsy.com is
        blocked by the proxy and that item forbids estimating a competitor's
        numbers. The 2026-09 entry above had already established the stronger
        reason -- Etsy publishes no single official calculator a seller would
        search for by name -- so this is settled, not merely blocked on the
        egress-policy ask. Site re-verified green and unchanged along the way:
        build.mjs 169 tools / 498 pages, check.mjs "169 products, 7 category
        pages, 509 pages, no dead links".
  - venture: cloud-egress-calculator
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Shipped the marketing-distribution queue item's candidate 2 again, on
        the venture two prior sessions could not serve: a new
        vs-google-cloud-pricing-calculator.html naming the Google Cloud
        Pricing Calculator as the authoritative source for a Google Cloud
        number, and positioning this tool for the thing Google's is not built
        around -- two providers' price sheets on one workload, the outbound-GB
        crossover, and the CDN / replica / storage-class follow-ons. The
        venture's own README had already written the thesis ("existing provider
        calculators are vendor-specific") without ever putting it on a page a
        searcher could land on.
      - >-
        This resolves the blocker the two entries above hit rather than
        repeating it. Both dropped a comparison page because the proxy blocks
        egress to the incumbent's domain (etsy.com, ebay.com, amazon.com,
        reverb.com and tiktok.com are all 403 on CONNECT) and the item forbids
        estimating a competitor's numbers. cloud.google.com answers, so every
        claim on this page is a quotation read from Google's own pages on
        2026-09-01 and linked to them: the estimate disclaimer ("This tool
        creates cost estimates based on assumptions that you provide. These
        estimates may not accurately reflect the final costs on your monthly
        Google Cloud bill."), the calculator's own "Add and configure products
        to get a cost estimate to share with your team", the storage price
        list's pointer to it, its three network-charge cases, and its
        definition of outbound data transfer. No dollar figure is asserted for
        Google anywhere -- a test asserts the page contains no `$` followed by
        a digit at all, so a later edit cannot quietly add one.
      - >-
        Verified locally: venture `node --test` 62/62 (3 new, and the FAQ
        visibility assertion was mutation-checked -- deleting one <h3> fails
        exactly one test), `node platform/pages/clauses.mjs
        cloud-egress-calculator` (5 pages carry the no-warranty clause, exit
        0), full `PAGES_BASE_URL=... node platform/pages/build.mjs` +
        `check.mjs` ("169 products, 7 category pages, 511 pages, no dead
        links", up from 510), `platform/pages` suite 837/837, and
        `python3 portfolio/router/validate.py` (182/182). No new third-party
        script, font, CDN, or network call: the built page's only script src is
        the site's own local pf-site.js, which is also what supplies the
        page's usage counting (local-only tool_viewed event, DNT/GPC and
        opt-out respected).
      - >-
        Two open PRs at session start (#2606, #2607), neither touching this
        venture or any comparison page, and no branch or commit carried a
        vs-google-cloud-pricing-calculator.html -- new work, not a duplicate.
        Candidate 1 re-checked before picking and confirmed closed: build.mjs
        reports "Added an embed offer to 169 tool entry page(s)" against 169
        products, so no entry page is silently skipped.
