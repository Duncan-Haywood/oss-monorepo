        Shopify fee calculator clicking "compare what one item nets on Shopify,
        eBay, Etsy, Amazon" was sent to a GitHub page they cannot open instead
        of the where-to-sell calculator one directory away. This is the
        portfolio's only non-search path between products, so it bears directly
        on the marketing-distribution item.
      - >-
        Two things hid it. `check.mjs` reports "no dead links" throughout,
        because by then the link is absolute and it does not follow those. And
        the failure is invisible in the source tree -- every one of these links
        is written correctly as `../<slug>/` and only becomes wrong during the
        build.
      - >-
        This is the same hazard `addSiteChrome` already documents at
        build.mjs:4006 for its own `../` hub link, solved there by running after
        the hub is written. Cross-venture links need every venture written, so
        the copy is now its own pass ahead of everything that reads the finished
        tree. `repairLinks` still runs ahead of `surfaceExternalFetchHosts`
        within the second pass and that order is load-bearing -- a repair can
        rewrite a `<script src>` to a github.com URL, which is a real external
        request the privacy copy must report. Verified unchanged: the
        `externalFetchHosts` of all 169 tools in `catalog.json` are
        byte-identical before and after.
      - >-
        Rejected alternative, recorded so it is not retried: making
        `repairLinks` ask the source tree "will this be published?" instead.
        `copyTree` deliberately does not publish everything under a venture
        (CLI source, and the README/LICENCE cases this feature exists for), so
        "exists in source" is not "will be published" and the test would have
        started wrongly keeping links that really do 404 inside the site.
      - >-
