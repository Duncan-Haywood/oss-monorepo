        products, 531 pages, no dead links); regression test confirmed to fail
        on the unfixed build (`not ok 248`) and pass with the fix; and a full
        diff of the built site before and after -- 6 files differ, 5 restoring a
        working internal link and the 6th `sw.js`'s content-derived cache hash.
