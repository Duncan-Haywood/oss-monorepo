        `Number(row.value || 0) < min`, and `Number("£5,000")` is `NaN` --
        `NaN < min` is always `false`, so the exclusion branch never fired
        for a currency-formatted or comma-grouped value cell no matter how
        far under the minimum the tender actually was. A real tender-portal
        export almost never gives a bare integer, so a £5,000 job filtered
        against a "£20,000 minimum" slipped straight into the shortlist --
        the opposite of what the tool's one headline filter promises.
        Added `parseValueNumber()` (strips thousands-separator commas,
        reads the first signed number out of what remains) and wired
        `filterTenders` to use it; a blank or truly unreadable cell still
        reads as 0, unchanged from before. Shipped and merged #2875.
        `node --test ventures/tender-radar/site/*.test.mjs`: 16/16 pass (3
        new: `parseValueNumber`'s currency/thousands handling, a
