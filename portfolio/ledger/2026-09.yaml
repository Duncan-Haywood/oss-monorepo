  - venture: platform
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Made the front door shipped earlier this session measurable, which it
        deliberately was not at merge. `usage/aggregate.py` selected
        `app=portfolio-site`, and `slug_for("/index.html")` returns the hub key
        for the apex page and the catalogue's front page alike -- so folding
        the new pod in would have added apex visits to `_hub`, answering "did
        anyone find the portfolio" and "did anyone browse the catalogue" with
        one number that nothing downstream could separate again. The selector
        now covers both workloads and an `APP_KEYS` map routes each pod's lines
        by its `app` label: the site keeps its existing keys unprefixed (the
        stored history depends on those names), the front door gets `_front`.
      - >-
        One row rather than a per-path split, because the front door's nginx
        does `try_files /index.html =404` and `$uri` is logged after
        `try_files` resolves -- every request it counts logs the same URI, so a
        breakdown would be fiction. `/healthz` sets `access_log off`, so probes
        never reach the aggregator.
      - >-
        The routing came out of `main()` into `fold_for_app()` so the decision
        that matters is testable without a cluster. Five tests added, including
        one that pins the selector and the key map against each other and
        against the Deployments in `gitops/prod` -- the drift that would
        silently drop a workload's traffic (a pod selected but unkeyed is
        counted nowhere; a key for an app never selected is a row that can
        never appear) is invisible in production, so it is checked in git.
      - >-
        Verified: 299 Python tests (gitops + publish_surface), `kustomize build
        gitops/prod` clean, pyflakes clean, and the set-based selector's URL
        encoding round-trips.
  - venture: platform
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Shipped the portfolio's first surface a stranger can reach.
        `marisstella.dev` and `www.marisstella.dev` have answered since
        2026-08-28, but only as annotation-only 301s into
        `tools.marisstella.dev`, which fails closed on the unsealed Secret
        `portfolio-site-repo` -- so both live hostnames spent five days
        handing every visitor a redirect into nothing, which
        `publish_surface.py --check` printed as a note under each.
        `gitops/prod/portfolio-front.yaml` now serves those two names a
        generated front-door page from a kustomize ConfigMap: no clone at
        pod start, so no token; Argo applies it from `main`, so no Actions
        run and no Pages flip. `--check` reports 2 hostnames serving content
        for the first time. No owner action was involved, and none is
        available that would have done this.
      - >-
        What the page is, so a later session does not mistake it for a
        placeholder: positioning, one card per category with its live tool
        count (169, derived from `launched.json` rather than typed), a
        three-point "how it works", both PRODUCT_PLAYBOOK.md section 5b
        clauses in full -- it is a hosted surface `platform/pages/build.mjs`
        does not build, so the no-SLA injection that covers every tool page
        does not reach it -- and links into the hub, about page and feed
        taken from `build.mjs`'s own exported path constants. Deliberately
        no per-tool listing: `portfolio-apex.yaml` spends a paragraph on why
        two hostnames must not serve the same bytes, and the front door
        carries its own canonical instead.
      - >-
        Measured rather than assumed, and worth not re-deriving: a prior
        session priced ConfigMap-seeding the *whole* site at 34 MB (14.4 MB
        gzipped) against a 1 MiB ceiling and correctly rejected it. That
        verdict does not extend to a front door -- this page is 11 KB, and a
        test fails it past 256 KB.
      - >-
        Two defects found by running the thing rather than reading it. (1)
        The call-to-action button used `--link` as its background with a
        hard-coded white foreground; `--link` inverts in dark mode and the
        text did not, measuring 1.93:1 -- caught by a headless contrast pass
        before it ever shipped, fixed with its own `--cta-bg`/`--cta-fg`
        pair (now 9.46:1 dark, 8.8:1 light), and pinned by a test on the
        mechanism. (2) kustomize 5.4 cannot re-enable a name suffix hash per
        generator once `generatorOptions` disables it globally -- a
        per-generator `disableNameSuffixHash: false` is indistinguishable
        from unset, so the first build produced unhashed ConfigMaps and a
        regenerated page would never have rolled the pods. The global block
        moved onto the one generator that wants it (the usage script, which
        a CronJob names literally). Verified with `kustomize build
        gitops/prod`.
      - >-
        Verified: `kustomize build gitops/prod` clean; 294 Python tests
        (gitops + publish_surface, up from 291 -- two apex tests rewritten
        for the new behaviour, seven added for the new workload); 15 new
        node tests for the generator including a drift check against the
        committed output; 856 platform/pages tests; the pod's own command
        (`build.mjs` + `check.mjs`) still exits 0 at 169 products / 532
        pages; and a headless Chromium pass at 375/768/1280px -- no console
        errors, no horizontal overflow, 7 category cards, valid JSON-LD.
      - >-
        Queue state: zero open PRs at the start of the run (verified against
        the API, not a prior session's list), so the mandate's three-PR
        quota resolved on its "none exist" branch. Fifth consecutive session
        to find no repairable backlog.
      - >-
        Still owner-blocked, unchanged and not re-derived: `portfolio-site-repo`
        (the 169 tools), the Codex `CODEX_AUTH_JSON` seal plus the governor's
        two knobs (the Hetzner dev fleet in `gitops/agents/`, which is code
        complete), and `funding-sponsors-live`. The front door's category
        cards all link into the tools host, so the site seal is now what turns
        a live front door into a live catalogue.
  - venture: platform
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Shipped #2702: itemised calculators rebuild their rows when a saved
        bid is restored or a bid link is opened. Eight tools here build the
        form in script (tree service by tree, carpet by room, window
        cleaning by glass type, snow removal by stop, pest control by
        service, hood cleaning by component, gutter cleaning by run,
        portable restrooms by unit type) with ids like `t3-dbh` off a
        counter that resets every page load, so both bid-handoff features
        matched on ids that are an artefact of click order rather than a
        fact about the job.
      - >-
        The user-visible cost of that: a six-room carpet bid saved fine and
        never restored -- the atomic-or-refused rule correctly refused and
        told the contractor to "add or remove rows until the form matches",
        i.e. rebuild by hand the thing they saved to avoid rebuilding by
        hand -- and `link.mjs` excluded these pages from the share control
        outright, on sound reasoning for the matching rule it had.
      - >-
        Fix: a page opts in with `data-pf-repeat="<prefix>"` on the control
        that appends a row; the runtime clicks that control until the group
        holds as many rows as the record, then compares by position within
        the group instead of by id. Clicking is the only way in, so the rows
        stay the venture's own markup. Still atomic-or-refused and still
        grow-only (no page declares a remove control), and a page declaring
        nothing gets the identity key map -- which is what keeps this off
        the other 161 tools.
      - >-
        Verified: `node --test` in `platform/pages` 853/853; the 8 ventures'
        own suites 476/476; `build.mjs` shareable-bid-link count 151 -> 158;
        `check.mjs` 169 products / 528 pages / no dead links; and a
        Chromium+Playwright pass over the built `dist`, 12/12 -- a 4-tree
        link opened in a fresh browser context rebuilt all 4 rows, carried
        every DBH, and worked out the same $17,785.19 the sender saw, while
        a 7-room + 2-upholstery carpet bid saved, reloaded and restored both
        groups intact.
      - >-
        Concurrent work integrated rather than duplicated: #2699 gave
        `pest-control-bid-calculator` its own `share.mjs` while this branch
        was open. `main` was merged in and the existing gate handles it --
        that page keeps its own control and takes no second button, so 7 of
        the 8 gain the platform link and all 8 gain the saved-bid replay,
        which `jobs.mjs` owns and no share module covers. A test pins the
        7-of-8 split so a venture growing or dropping its own control
        surfaces as a number rather than silently.
      - >-
        Queue state: one PR open at the start of the run (#2697, merged
        after its checks went green on real runners), zero at the end
        besides this run's own #2702, which also merged green. Delivery is
        unchanged and still one owner seal from public --
        `publish_surface.py --check` reports 0 hostnames serving content,
        `portfolio-site-repo` is the step, and no new ask was added.
