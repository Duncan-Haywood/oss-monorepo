        `portfolio-front-tools`, added by #2739 and grown by #2741/#2744,
        could not have been applied to the cluster at all. Argo CD applies
        client-side by default (v3.5.1, per `bootstrap/install-argocd.sh`),
        and a client-side `kubectl apply` stores a second copy of the whole
        object in the `kubectl.kubernetes.io/last-applied-configuration`
        annotation -- which the API server caps at 262144 bytes per object
        (`TotalAnnotationSizeLimitB`). The generated ConfigMap serialises to
        655,213 bytes, so every sync would have failed with
        `metadata.annotations: Too long`, the hashed name
        `portfolio-front.yaml` mounts would never have been created, the new
        pods would have sat in ContainerCreating behind `maxUnavailable: 0`,
        and `prod` would have sat Degraded while the old toolless front door
        kept serving. Fixed by declaring
        `argocd.argoproj.io/sync-options: ServerSideApply=true` on that one
        generator (`options.annotations` in the machine-written
        kustomization, so the change is in
        `platform/marketing/front-door-tools.mjs`'s `renderKustomization`).
      - >-
        The learning worth carrying: **1 MiB is not the first size ceiling a
        ConfigMap in this tree hits.** Every size comment written so far --
