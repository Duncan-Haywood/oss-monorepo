        **#218** (`portfolio/research/publisher-audience/`) tested the
        untested claim `free-listing-demand` closed on — "publishing is
        not distribution, the scarce thing is a referral path." Result:
        softened, not confirmed. A cold npm publisher's odds of reaching
        a category's top decile are 4.9%, vs 16.2% for a publisher who
        already has a package with real usage (984 publishers looked up,
        3.3× pooled handicap, 54 of 198 top-decile listings sampled were
        cold publishers). The handicap varies 2.6× (accessibility) to
        8.5× (SBOM/CRA) by category, so for a cold-by-definition
        portfolio, category choice matters more than listing polish, and
        `cra-evidence-desk` — already the pipeline's defensibility floor
        — is the worst category to be found in. Also measured actual
        channel reachability: of the four free channels
        `channel-inventory.md` names, only npm and PyPI answer from this
        sandbox; `api.wordpress.org`, `open-vsx.org`,
        `marketplace.visualstudio.com`, `docs.github.com`, and both EUVD/
        OSV endpoints all 403 at the egress proxy.
      - >-
        **#219** (`portfolio/research/free-listing-economics/`) put a
        revenue number on Asks 2 and 5, closing the gap #218 and
        `free-listing-demand` both left open ("no pricing signal").
        Method inverts the unknown — reports the revenue-per-download
        each percentile of the *measured* demand distribution would need
        to clear a bar, instead of assuming a conversion rate. Result:
        expected revenue for a free listing published cold is
        $16-$145/month at central assumptions across the three
        candidates ($1-$7 pessimistic, $156-$1,448 optimistic) — Ask 5
        buys a rounding error, not the demand signal the pipeline has
        treated it as for five cycles, and at those figures Ask 2's
        merchant-of-record/tax surface isn't justified by these three
        candidates either. What does change the arithmetic is the buyer:
        on WordPress.org, `active_installs` turns the weakest number in
        the model (a ~2% conversion guess) into a ~1 observation, and
        listed prices run 2-3× higher than npm's implied willingness to
        pay — same model, ~$980/month at 1,000 installs, from a hundredth
        of npm's required reach. So the WordPress.org read-only-egress
        ask #218 flagged is, on this analysis, worth more than either
        Ask 2 or Ask 5 and should be prioritized above both — re-flagging
        here since neither #218 nor #219 edited #139's ask table
