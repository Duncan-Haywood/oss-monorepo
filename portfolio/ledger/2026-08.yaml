        recommended p99 quantile anchor was "selected on the same two
        events it is scored on", with the next step recorded as "re-derive
        it on the next mirrored register that dies". Built
        `holdout_backtest.py`, which replays the detector over every gap in
        the nine mirrors' already-committed full history rather than only
        the 180-day window -- 17 dormancy episodes instead of 2 -- and
        selects the anchor by leave-one-source-out cross-validation, so no
        source is scored under a setting it helped choose. Labels use
        hindsight; the detector never does.
      - >-
        The anchor *family* survives: under a 5 alarm-day/source-year
        nuisance budget 8 of 9 folds independently pick p99, and sweeping
        the dormancy label from 60 to 365 days never moves the selection
        outside {max, p95, p99}. The *operating point* does not: held out,
        p99 detects 6 of 17 episodes (0.35) at 110d median latency against
        8 of 17 in sample, and the recall/nuisance trade is priced for the
        first time -- reaching 14 of 17 costs 43 nuisance alarm-days per
        source-year, so no setting on the curve is both quiet and
        sensitive.
      - >-
        The finding worth carrying furthest is arithmetic, not sampling.
        Nearest-rank p99 is `ordered[ceil(0.99*n) - 1]`, which *is* the
        maximum for any source with fewer than 100 closed gaps.
        `FDA/openfda` has 37, so its p99 threshold is 2060 days -- the same
        5.6-year threshold the previous amendment cited as proof the max
        anchor was broken -- and it carries 9 of the 17 episodes. The
        recommended fix and the rejected one are the same integer on the
        source the fix was diagnosed from; the whole p99-beats-max result
        came from `datasets/covid-19` (744 gaps). Sparse registers are both
        the likeliest to go dark and the ones the fix cannot reach. Also
        tested and recorded as *not confirmed* rather than as support: the
        monotone-stretching mechanism the previous amendment used to
        explain max's failure is directionally consistent and far too small
        to call.
