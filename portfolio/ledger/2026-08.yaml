        ancestor, reusing `wait_for_disk_space`'s climb-to-ancestor
        pattern) captured once per card and re-checked before each
        include's `rsync_copy` call; a mismatch is now recorded as an
        error and that include is skipped rather than silently written
        elsewhere. Scoped to the mount vanishing mid-run (symmetric with
        the existing source-side check), not "never mounted at all,"
        which would need assumptions about the caller's setup the module
        doesn't otherwise make.
