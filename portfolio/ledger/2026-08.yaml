        and every one of them was already patched. On `quick-pick-survey`
        it was the only finding the tool produced.
      - >-
        Root cause: the advisory's second affected range is
        `introduced: "13.0"` -- two components, not valid semver. The
        range therefore failed to parse, and while the engine correctly
        declined to treat an unreadable range as evidence of safety, the
        finding also skipped the suppression stage, so the
        `dev-server-surface` rule written for exactly this advisory never
        fired. Two properties made it worse than one bad row: the failure
        is not proportional to distance from the vulnerable range (one
        malformed bound flags every version of the package -- two products
        were on `next@16.3.1`, three majors past anything the advisory
        describes), and it cannot age out, because the comparison that
        would clear it is the one that fails to parse.
      - >-
        Fixed via `semver.parse_bound`, applying two lossless numeric
        readings to OSV event bounds (zero-fill missing components, strip
        leading zeros), scoped to the OSV path only because an OSV bound
        is a timeline point while `1.2` in an npm range string is the
        X-range `>=1.2.0 <1.3.0`. Checked the boundary against the whole
        feed rather than asserting it: of 227,147 npm advisories, 40 carry
        an unparseable bound, the coercion resolves 32 and still refuses
        8 -- and all 8 refusals are cross-ecosystem records where Ruby,
        Python or git-SHA version grammar leaked into an npm advisory,
        which is exactly the class that must keep reporting.
      - >-
        Worth recording as a general finding: feed-level rarity is not
        product-level rarity. The defect affects 0.02% of advisories but
        lands on `next`, `directus`, `nocodb`, `handlebars`,
        `@solana/web3.js`, `nodebb` and `ckeditor4` -- advisory prevalence
        is uniform across a feed, exposure is weighted by package
        popularity, which is how a 0.02% feed defect produced a 100% hit
        rate across this portfolio's Next.js products.
      - >-
