        unmounted between one `include_path` and the next, `mkdir`
        silently rebuilds the rest of the destination tree on whatever
        filesystem the nearest surviving ancestor sits on (typically the
        boot volume) -- rsync then succeeds writing there, and
        `verify_and_manifest` reports the files "verified" despite them
        being on the wrong disk. No error, clean exit code, silent
        redirection of the media this venture exists to protect --
        exactly the "dangerous case" `offload_exit_code`'s own docstring
        names, and the destination-side gap in a guard that already
        existed for the source side (`card.source.exists()` mid-offload).
      - >-
