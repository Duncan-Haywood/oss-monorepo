      - >-
        `roles/agent_runner/files/agent_runner.py`'s `_process_issue_inner`
        decided whether a coding-agent tool "made changes" using only `git
        status --porcelain` right after the tool exited. `claude.sh`'s own
        comment documents that `auto` permission mode allows the tool to
        commit its own work, not just leave it uncommitted -- when it does,
        the working tree is clean either way, so the runner mislabelled a
        completed run `agent:failed` ("made no changes... declined") and
        then unconditionally `shutil.rmtree`d the workspace, permanently
        destroying real, committed work. Reproduced with plain git: commit
        on the branch -> `git status --porcelain` empty, `git rev-list
        --count main..HEAD` = 1. Secondary bug from the same root cause:
        gitleaks would scan an empty staged diff in this scenario, silently
        skipping the secret scan on content the agent had already
        committed.
      - >-
        Fix: `fold_changes_into_staged()` stages uncommitted edits then
        soft-resets onto `base_branch`, folding any self-made commits back
        into the staged diff before both the change check and the gitleaks
        scan run. Added three regression tests using real git via
        `tmp_path` (confirmed to fail pre-fix, pass post-fix). Verified:
        `pytest` 25/25 (22 pre-existing + 3 new), `ruff check` clean,
        `mypy` clean (one pre-existing unrelated `yaml` stub note), all 4
