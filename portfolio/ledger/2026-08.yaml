  - venture: ai-first-markets
    # Model spend for this run was not instrumented; recording a guess would
    # corrupt the only signal the router has. Left null until spend tracking
    # exists.
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Screened new software/AI business ideas against the portfolio and
        added six that were not already represented: accessibility
        conformance CI, an upgrade/migration agent, an MCP supply-chain
        scanner, a chatbot disclosure monitor, an API-to-MCP gateway, and a
        public-record signal feed (PR #34).
      - >-
        Added a liability and ethics screen to the idea schema and filled it
        for all fourteen ideas, including the original eight. Liability is a
        gate applied before economics, not a dimension averaged into the
        score.
      - >-
        Recorded nine idea categories rejected outright (employment
        screening, consumer legal/medical advice, companion chat, PHI
        tooling, money movement, scraped-data products, mass outreach,
        synthetic likeness, contractor arbitrage) so they are not
        re-proposed on economics alone.
      - >-
        Ranks are now derived from stated milestone weights rather than
        assigned by hand, which moved several earlier positions and fixed a
        rank1m sequence that skipped 1 and ran to 9 across eight ideas.
      - >-
        Duplicate-work note: PRs #17/#18/#20/#27 are four earlier
        candidate-screening passes on the same venture, and this run was
        started before that pattern was visible on main. The distinct
        contribution here is the liability/ethics schema and screen; the
        idea list itself overlaps and should be reconciled against whichever
        of those PRs the owner merges, rather than merged blindly on top.
      - No customer contact, no revenue, no validation of any hypothesis.
    mrr_end: null
