        distribution score of 8 rests on a local-site-studio lead pipeline
        that has no customers, and the app's scan output is the qualified
        lead list it lacks. Its first experiment measures the channel before
        the product is built, and its kill criterion (under 25 installs in
        30 days, or under 2% paid conversion) would also downgrade every
