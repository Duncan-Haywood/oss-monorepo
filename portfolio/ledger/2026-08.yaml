        buying intent (~13k apps, ~$890M/yr developer revenue, no revenue
        share below $1M lifetime) while its median app earns under
        $1k/month; MCP directories do not yet (20k+ servers, under 5% earn
        anything), which is direct evidence against the agent-facing
        candidates' distribution assumptions.
      - >-
        Second finding recorded: the ethics gate is doing selection work,
        not only exclusion work. screened-out.md rejected accessibility
        overlays on ethics, correctly, without noticing the rejection points
        at an opening — the overlay vendors hold the high-intent Shopify
        accessibility category at $9-99/month while the FTC has ordered the
        largest of them to pay $1M and barred it from claiming WCAG
        compliance, roughly 40% of businesses sued in 2025 already had an
        overlay installed, and the honest alternative is only sold at
        $400-3,500/month. Categories whose dominant product is dishonest are
        worth screening into when the honest version fits the channel's
        price point.
      - >-
