        Confirmed the cause rather than inferring it: fetched the file
        from #19's branch and parsed it locally. Two multi-line strings
        — a `git commit -m` body at ~line 55 and a JS template literal
        at ~line 84 — have continuation lines at column 0 inside
        `run: |` block scalars, which terminates the scalar
        (`expected <block end>, but found '-'`). Because GitHub cannot
        parse the file it cannot read its `on:` block either, so it
        attempts a build per event and fails at startup. That is the
        entire signature. This positively causes what #171 had only
        established negatively: Actions was never blocked account-wide.
        At least three sessions spent budget on the account-block
        hypothesis because one broken file on an unmerged branch looks
        identical to a platform outage.
