        so every card-dump-workflow test that expects a route to be found
        gets `blocked` instead (5 tests). Confirmed by reproducing the
        route-selection call directly outside the test harness and reading
        the `writable_capacity` check in source.
      - >-
        This is a real, previously-undocumented risk to the development
        process, not just a one-off curiosity: every scheduled session in
        this repo runs in the same root-uid, quota-capped sandbox profile,
        so any future session running this venture's tests would hit the
        same 6 failures and could easily either misdiagnose them as a
        regression, or worse, "fix" them by loosening the 64GB capacity
        gate or the permission check — both of which exist for genuine
        data-safety reasons (don't recommend importing onto too-small a
        destination; don't claim a file is readable when the OS says it
        isn't). Documented the 6 test names and both root causes directly
        in `ventures/photo-editing/AGENTS.md`, next to the existing
