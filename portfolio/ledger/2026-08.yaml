        steps, which only need something well-formed present) leaks into
        the Integration tests step too, since step-level `env:` adds to
        job-level env rather than replacing it. `applyTestEnv()`'s
        `??=` then can't override it, so the app compares the test's
        real key (22 bytes) against the placeholder (15 bytes) and
        rejects on length before checking content. Fixed by overriding
        `ADMIN_KEY`/`ADMIN_SESSION_SECRET` in that step's own `env:`
        block, the same way it already overrides `POSTGRES_*` for the
        identical reason. No docker/postgres available in this sandbox
