        kill_criteria #1. `sd_offload.py`'s rsync command paired `--partial`
        (keeps a half-copied file so the next run can resume) with
        `--ignore-existing` (skips any file that already exists). Together
        they froze a mid-transfer file at its truncated size forever:
        `--ignore-existing` skipped the partial on every rerun, so an
        interrupted offload could never complete and `verify_and_manifest`
        reported a permanent size-mismatch. Dropped `--ignore-existing`;
        rsync's default size+mtime quick-check already skips fully-copied
        files while re-transferring a partial to completion.
      - >-
