  - venture: portfolio
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Fourth consecutive scheduled session assigned "research new business
        candidates" and fourth to find the answer already written six times
        over. Broke the deadlock the previous three sessions left to the
        account owner, by consolidating into portfolio/pipeline/ (internal
        notes) rather than into ventures/ai-first-markets (live site). The
        stated blocker each prior cycle was that picking a winner would
        publish unverified regulatory claims to a deployed site; that
        blocker applies to five of the six PRs but never applied to #17,
        which alone targeted an internal directory. Consolidating there
        needs no publication or legal-accuracy judgment, so it did not need
        the owner first.
      - >-
        Consolidated PR #17's portfolio/pipeline/ as the base (repo-native
        markdown+YAML, liability_containment and ethical_robustness as hard
        gates rather than weights, screened-out record kept). Reconciled all
        ~36 candidates proposed across #17/#18/#20/#27/#30/#34 down to 9
        archetypes: kept 7 write-ups, added one new candidate
        (mcp-supply-chain-watch, narrowed from #27/#34's scanner framing to
        monitoring only servers the customer already connected), and
        recorded the other ~20 in screened-out.md with a named reason each
        so they are not re-derived next month. Added convergence.md
        analysing what six independent runs agreeing does and does not tell
        us, and an explicit "these claims are unverified internal notes"
        status section.
      - >-
        Verified rather than trusted the diffs: re-ran
        `python3 portfolio/router/validate.py` (all 9 VENTURE.yaml files
        valid, 11 venture dirs covered counting the 2 NOT-A-VENTURE
        markers), the router test suite (12/12 pass), and
        `python3 portfolio/router/allocate.py` against all 9 ventures. Also
        checked every composite/floor in candidates.yaml against its own
        scores arithmetically (7/7 correct, all passing the >=5 ethics and
        liability gates).
      - >-
        Fixed a real pre-existing bug found while verifying: the test command
        documented in portfolio/router/README.md
        (`python3 -m unittest portfolio/router/test_allocate.py`) fails from
        the repo root with ModuleNotFoundError, because the test imports
        `allocate` as a top-level module. Anyone following the README to
        verify the router would have seen a failure unrelated to their
        change. Replaced with the working
        `python3 -m unittest discover -s portfolio/router -t portfolio/router`.
      - >-
        Corrected a stale claim inherited from #17: its README said nine of
        eleven ventures/ directories lacked VENTURE.yaml. That backfill has
        since landed and is CI-enforced, so the note was rewritten to the
        caution that still holds — economics are null portfolio-wide, so the
        router ranks on stage and budget cap, not measured return.
      - >-
        Did not close #18/#20/#27/#30/#34 despite CLAUDE.md's consolidate-and-
        close guidance. They carry app-side work for ai-first-markets that
        this PR does not supersede and does not reproduce; closing them would
        discard content whose publication is still the owner's call. Left
        them open deliberately rather than by omission.
      - >-
        Headline research finding, recorded because it is worth more than the
        candidate list: none of the 36 proposed candidates came from a
        customer, an inbound request, or a user of an existing venture. All
        were things that could be built. Four of seven surviving candidates
        score 4-5 on distribution. Six independent runs reproduced the
        portfolio's real bottleneck instead of addressing it — the next unit
        of effort is worth more spent testing one candidate against a real
        buyer than generating a tenth archetype.
      - >-
        GitHub Actions is broken repo-wide and has been silently broken the
        whole time. All 113 workflow runs on record — every branch including
        main, spanning at least 21:27-23:17 on 2026-08-18 — have conclusion
        `startup_failure`, with the placeholder path `BuildFailed` and an
        empty workflow name. Zero runs of any real workflow exist:
        `portfolio-validate.yml` is registered and active but has a run count
        of 0, despite this branch touching `portfolio/router/**`, one of its
        trigger paths. Consequence: the VENTURE.yaml schema check merged in
        #32 and described in README.md as CI-enforced has never executed
        once, and neither has ai-first-markets CI. Every "verified in CI"
        claim in this repo currently means "verified locally by an agent."
        This corrects the prior cycle's ledger entry, which investigated the
        same `BuildFailed` status from a PR #30 comment and concluded it was
        a deleted leftover that could not affect future commits — new
        `BuildFailed` runs are still being created on every push, including
        two on this branch.
      - >-
        Narrowed the Actions failure to a billing/quota cause by experiment
        rather than inference. Dispatched portfolio-validate.yml manually on
        main: the API accepted it (204 queued) and the run was created and
        correctly attributed to the real workflow file, then went
        startup_failure in the same second with zero jobs allocated (run
        32197159797, created_at == updated_at == 2026-08-18T23:26:11Z). That
        sequence rules out the three cheap explanations. Actions is not
        disabled at repo level, or the dispatch would have returned 403. The
        workflow YAML is not malformed — all four root workflow files parse
        clean locally, and GitHub resolved this one to its real name and
        path rather than the BuildFailed placeholder. Path filters are not
        involved, since workflow_dispatch has none. The runner is plain
        `ubuntu-latest` with stock checkout/setup-python actions, so it is
        not an unavailable custom runner. What is left is that GitHub
        accepts the run and then refuses to allocate a billable runner,
        which on a private repo means Actions minutes exhausted, no valid
        payment method, or a spending limit of zero. Note the repo is
        private (confirmed via the API), so every minute is billable, and
        minutes are pooled per account across all private repos — the quota
        may have been consumed elsewhere, not here. Timeline fits: the last
        and only successful run in this repo was ai-first-markets-ci on
        2026-07-29 (~2 min, success); everything from 2026-08-18T17:23Z
        onward fails at startup. The billing page is the one thing an agent
        cannot read from here, so the owner has to confirm it.
      - >-
        Root cause of the duplicate storm identified, and it is not the
        OpenCode fleet. All six screening PRs plus this one are on branches
        named claude/laughing-pasteur-* — the same scheduled Claude Code task
        identity, firing repeatedly, each run starting fresh and re-deriving
        the same brief. The hourly OpenCode Actions workflow that three prior
        cycles treated as the culprit cannot have produced any of them,
        because Actions has never successfully started a job. Prior cycles
        attributed the waste to the wrong mechanism and therefore proposed
        fixes (pausing the fleet, adding a check-open-PRs guardrail to
        .github/prompts/portfolio-work.md) aimed at a workflow that does not
        run. The guardrail in CLAUDE.md does reach these sessions and did
        work this cycle — it is why this run consolidated instead of opening
        a seventh screening PR — but it depends on each run choosing to
        honour it, which the sixth and seventh runs show is not reliable.
      - >-
        Still unresolved, needs the account owner: (1) fix or disable GitHub
        Actions — nothing in CI is running; (2) change or retire the
        recurring "research new business projects" scheduled task, which is
        the actual source of the duplication and will keep firing against an
        already-answered brief; (3) decide on the five remaining app-side
        screening PRs (merge one, or close all as superseded by
        portfolio/pipeline/); (4) decide on #19 (second unattended agent
        fleet), noting its workflow is already registered from its branch.
    mrr_end: null
