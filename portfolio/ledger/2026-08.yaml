        its own `path`, which is GitHub's fallback when it cannot parse
        the file to read the `name:` key. Its registration timestamp
        (18:43:21 UTC) matches #19's opening (18:43:32 UTC) on
        2026-08-18. Worth reusing: the count mismatch is a cheap,
        general detector for this class of failure.
