    outcomes:
      - >-
        Scheduled session found ~25 PRs opened against main within a few
        hours on 2026-08-18, most from independent scheduled runs that could
        not see each other's work. Recurring duplicate clusters: VENTURE.yaml
        backfill (10+ PRs, now resolved on main), an unreviewed hourly
        20-agent OpenCode fleet added straight to main without a PR (commit
