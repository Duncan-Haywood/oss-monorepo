        `platform/ci/validate_workflows.py` (valid YAML, mapping at top
        level, readable `name:`, an `on:` block, non-empty `jobs:`;
        accepts `on` resolving to boolean `True`, since YAML 1.1 does
        that to an unquoted key) and wired it into
        `portfolio-validate.yml`, widening that workflow's trigger
        `paths` from a single self-reference to `.github/workflows/**`
        plus `platform/ci/**` so the check fires on the pull request
        that introduces the breakage. Under this, #19 would have gone
        red on open. Verified both directions, not just the happy path:
        passes on all 17 current files, exits 1 naming the file and
        line 55 when pointed at #19's. Router suite 21/21,
