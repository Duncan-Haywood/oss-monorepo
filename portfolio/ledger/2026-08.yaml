        matches its raw `longitude / 15`. For most cities away from the
        Greenwich meridian the two diverge enough that the returned `Date`
        lands on the wrong local calendar day once converted back to city
        time: Tokyo's computed sunrise on 2026-06-21 came back dated
        2026-06-22 JST; Los Angeles's sunset the same day came back dated
        2026-06-20 PDT. A full-year, full-catalog numeric sweep (Python port
        of the same formula, cross-checked against `zoneinfo`) found
        sunrise-after-sunset anomalies on ~6,600 of ~14,600 city/day
        combinations -- routine for roughly half the shipped city catalog
        (`los-angeles`, `tokyo`, `sydney`, `singapore`, `hong-kong`, and
        others, every day of the year), not the rare International-Date-Line
        edge case the existing code comment suggested. Directly affects
        `CityClockSnapshot.isDaytime` (wrong day/night icon and gradient for
        the small-widget view) since it only had a fallback for
        `sunrise >= sunset`, not a fix for the underlying date being wrong.
        The one existing ordering test covered only London, which sits at
        the Greenwich meridian where the bug doesn't manifest.
      - >-
        Fixed by checking whether the algorithm's candidate instant actually
        falls on the requested local calendar day in the city's own time
        zone, nudging by +/-1 day until it does. Added three regression
