# Measured state of shared infrastructure that restore routes run on.
#
# This file exists because of a specific error the queue made on 2026-09-04.
# `decision_queue.py`'s outage banner told the owner that the two OUTAGE rows
# were "not downstream of each other", that "granting any one of them alone
# puts the catalogue in front of a stranger", and to "do the cheapest first".
# The first clause is true and the other two were not, because both routes run
# on infrastructure the banner never looked at:
#
#   - `deploy-settings` (GitHub Pages) is built and published by
#     `.github/workflows/portfolio-pages.yml`. That needs an Actions runner.
#   - the self-hosted runner stack that exists as insurance for exactly that
#     (`gitops/ci/`) runs as pods on the k3s cluster.
#   - the cluster is what `hetzner-ssh-key-is-a-public-key` reaches.
#
# So a route can be independent of the other route and still be un-grantable,
# and the queue had no way to say so. An owner reading "do the cheapest first"
# on 2026-09-04 would have flipped Pages on and got nothing, because no runner
# would have picked the deploy job up.
#
# The rule this file follows is the one the repo learned the hard way about
# the public surface: **a reading, never a claim**. Every entry carries the
# run id it was measured from and the command that reads it, so the next
# session can re-measure rather than inherit. A reading older than
# `STALE_AFTER_DAYS` is treated as *unknown*, never as "up" — an absent
# measurement must not read as a healthy one, which is the direction the
# whole 2026-08-30..09-04 "nothing is served" episode failed in.
#
# To re-measure, run the command in each entry's `how:` and update `verdict`,
# `measured` and `run`. Do not edit a verdict without one.

readings:

  github-actions-runners:
    verdict: down
    measured: "2026-09-09"
    run: 34387947196
    how: >-
      Cheapest route, and it costs nothing at all: classify a check that
      already ran on any open PR, by its **job** id rather than a run id --
      `python3 platform/ci/ci_starvation.py <job_id>`. Ordinary PR traffic
      produces these constantly during a starvation window, so there is no
      need to dispatch anything. To dispatch instead, `Public surface check`
      needs no secret: `python3 platform/ci/ci_starvation.py --run <run_id>`.
      Exit 0 means runners are being assigned; exit 1 means starvation.
      Re-measured 2026-09-06: still down. Nine checks across three PRs
      (#3542 job 101543942608, #3544 jobs 101546212616/101546212612/
      101546212714, #3547 jobs 101548826585/101548826210/101548826104) all
      came back `runner_id: 0`, 3s, no steps. So the window that opened
      2026-09-04T22:39Z has now been open three days.
      Note what this reading does NOT cover, because it was measured the same
      day and the two look alike: GitHub's **managed** Pages builder
      (`pages build and deployment`) ran to `success` on `gh-pages` four
      times during this window, including run 34055759342 at 19:42Z. It is
      not an Actions runner and is not metered against this allowance, which
      is why the publish route in `github-pages-branch-route` keeps working
      while everything in `.github/workflows/` starves.
    note: >-
      **Flipped back to `down` at 10:23Z on 2026-09-07, and the pair of
      readings four minutes apart is the point.** Run 34104983650 (09:0xZ)
      took three real runners and passed -- that is the reading the row
      carried, honestly measured. By 09:18Z every run on `main` was back to
      `runner_id: 0` in 3-4s (34105290955, 34105301962), a dispatched `Public
      surface check` starved at 09:24Z (34105796681), and all 21 checks on
      #3691 starved at 10:23Z (jobs 101707659622, 101707660396, 101707660041
      classified individually). So the allowance is not simply spent: it
      admits an occasional job and starves the rest, which is worse than a
      clean cliff because a single green run reads as recovery.
      What that cost, measured the same hour: #3671 merged at 09:18Z with four
      red checks nobody could see, three of them live user-facing defects (a
      calculator rendering "$-1.46", two pages whose FAQ JSON-LD diverged from
      their visible copy). Fixed in #3691. Do not infer recovery from one
      green run -- classify the run you are actually looking at, which is what
      this row's `how` has always said and what the 09:0xZ reading did
      correctly and then over-generalised.
      Starvation recurred mid-session on 2026-09-04, exactly as
      `gitops/ci/README.md` predicted it would when the metered allowance is
      spent again. The cliff is pinned to a nine-minute window: run
      33925827289 (`Portfolio validate`, 22:30:52Z) took real runner
      1000054728 and passed in 196s, and by 22:39:33Z runs 33926434774 and
      33926436491 both came back `runner_id: 0` with no steps. Confirmed a
      third time on a re-dispatch, so it is not a momentary queue.
      The 2026-08-26 window recovered on its own at 00:00:53Z on the first of
      the month, which is what a metered allowance resetting looks like, so
      the reasonable expectation is that this one lifts on 2026-10-01 unless
      the owner raises the ceiling sooner.
      Re-measured 2026-09-05: still down. `Outage triage` run 33929166450 came
      back `runner_id: 0`, 3s, no steps — `ci_starvation.py --run 33929166450`
      exits 1. So the window that opened at 22:39Z on 2026-09-04 is still open
      and `k3s-cluster` below still cannot be re-measured.
      Re-measured again 2026-09-05 00:20Z against ordinary PR traffic rather
      than a dispatch: all nine checks on #3244 came back red in ~4s, and
      `ci_starvation.py --run 33932676830` exits 1 on `runner_id: 0`. That PR
      was merged on locally-verified tests for exactly that reason. Worth
      noting which way the risk runs now: while runners are starved every PR
      here arrives with a wall of red checks that mean nothing, so the
      cheap habit is to wave them through — and the day assignment resumes,
      that habit is how a real failure gets merged. Run the classifier per
      PR rather than inheriting this verdict.
      Re-measured 2026-09-05T07:37Z, from a scheduled autonomous session that
      first drained the open-PR/branch queue (232 branches checked with
      `supersede_check.py`; all either already landed on `main` or were stale
      drafts main has since overtaken — nothing repairable remained). Dispatched
      a fresh `Public surface check` (run 33953052273) rather than trusting the
      prior reading: still `runner_id: 0`, 3s, no steps —
      `ci_starvation.py --run 33953052273` exits 1. Still down, consistent with
      the 2026-10-01 reset expectation above; this venture's own product change
      (a comparison page) was verified with `node --test`, the portfolio
      `build.mjs`/`check.mjs` pair, and `platform/marketing/regen.mjs`, then
      merged on that local verification per this file's own guidance.
      Re-measured 2026-09-05T17:27Z (run 33981018935, a fresh `Public surface
      check` dispatch): still `runner_id: 0`, 4s, no steps —
      `ci_starvation.py --run 33981018935` exits 1. That holds the window open
      for ten hours across three independent dispatches today, so treat the
      2026-10-01 reset as the expectation and stop re-dispatching to confirm
      it within a session; one classification per session is enough.
      Two things were settled the same run and are recorded so they are not
      re-derived. The open-PR queue is empty and the branch backlog is spent,
      independently reaching the 07:37Z session's conclusion above by a
      different method (blob-identity comparison against `main` rather than
      `supersede_check.py`) on the four freshest non-ledger branches —
      `fix/governor-rbac-narrow-jobs-pods-verbs`,
      `ci/hetzner-ssh-key-diagnostic`, `claude/sweet-archimedes-icmubl` and
      `claude/nice-brown-ukg2ky` — each of which `main` already carries, in
      three cases in a strictly better form (the RBAC verbs and their test
      verbatim; the SSH-key classifier refactored into the shared
      `bootstrap/scripts/load-ssh-key.sh`; `renderCatalog` plus an `llms.txt`
      the branch never had). And the Pages *source* remains unreadable from
      any agent session: `/pages` and `/environments` are refused by the agent
      egress proxy, `/deployments` 403s from GitHub itself on token scope, and
      no `pages build and deployment` run appeared after a `gh-pages` push.
      See `platform/ci/pages_state.py`'s docstring for why that third one is
      the interesting failure.
      **That last clause was overturned the same day — see
      `github-pages-branch-route` below.** The source is readable, and this
      note was one step from reading it: "no `pages build and deployment` run
      appeared after a `gh-pages` push" *is* the measurement, written down
      here as a fourth failed attempt rather than as the result it was. What
      was missing was a reason to trust the absence, and the workflow
      *listing* supplies it — `dynamic/pages/` is listed if and only if Pages
      builds from a branch, and the other `dynamic/` entries prove that
      namespace is visible to this token at all. Worth keeping as a shape:
      three refused endpoints in a row make "unreadable" feel like a
      conclusion, and the route that worked was an endpoint this repository
      already calls for something else.
      Re-measured 2026-09-07, and the shape is new: the allowance recovered
      and starved again inside one session. `ci_starvation.py --run
      34089258996` (06:05:17Z, the managed Pages builder's own trigger commit)
      showed three real runner ids (`1000062976`-`1000062978`), all
      `success`. `--run 34091300665` (`Portfolio validate` on this session's
      own merge commit, 06:32:30Z) came back `runner_id: 0`, 3s, no steps —
      starved again 27 minutes later, corroborated by `--run 34091353982`
      (`Outage triage`, 06:33:13Z, same signature) and every other check on
      that push. So this window is not the clean "down for N days, up at
      the reset" shape the rest of this file assumes; it can flip inside a
      session. Classify per push rather than trusting a reading more than
      about half an hour old.
      Re-measured 2026-09-07T09:15:58Z from a scheduled autonomous session,
      via `ci_starvation.py --run 34104983650` against a `portfolio-pages`
      run triggered by this session's own `gh-pages` publish (`build`,
      `deploy` and `report-build-status` jobs, real runner ids
      `1000063591`/`1000063597`/`1000063596`, all `success` in under 12s
      each) — exit 0, up again about 2h43m after the 06:33Z starved reading
      above. Consistent with the "flips inside a session" shape already
      recorded here, not a new pattern. Do not read this as "fixed" any more
      than the 06:33Z entry meant "broken forever" — classify the next push
      on its own merits.
      Re-measured 2026-09-09T18:15:59Z from a scheduled autonomous session:
      still down. `ci_starvation.py --run 34387947196` exits 1 on
      `runner_id: 0`, 3s, no steps — `Pages freshness` on the `main` push of
      eae12000. It was not an isolated job: all five workflow runs that push
      triggered (34387947196, 34387947142, 34387947072, 34387947157,
      34387947161) were created at 18:15:59Z and concluded `failure` at
      18:16:04Z, a five-second wall across the whole push. So the window that
      the 09-07 readings above show flipping open and shut is, two days on,
      still shut, and the 2026-10-01 allowance-reset expectation stands.
      What that costs, stated once rather than re-derived: `main` has been
      merged to repeatedly since, every one of those merges verified only by
      the session that made it. This session ran
      `run_workflow_locally.py --tree` against the tip and it came back 9/9
      workflows, 63/63 `run:` steps in `portfolio-validate.yml` — so `main`
      is genuinely green right now, measured rather than assumed.

  k3s-cluster:
    verdict: down
    measured: "2026-09-04"
    run: 33889983086
    how: >-
      Dispatch `Outage triage` (`.github/workflows/outage-triage.yml`); it
      needs no secret and reports per-port reachability from a runner.
      Note this itself needs a runner, so it cannot be re-measured while
      `github-actions-runners` is down.
    note: >-
      `:6443` refused on both boxes, so the k3s API server is not listening —
      a dead or absent cluster rather than a crashed ingress. `:22` is open
      on both, which is what makes the SSH route credible rather than
      hopeful. Powered on and correctly addressed per the Hetzner read-only
      API, so this is not power, DNS, firewall or TLS.
      Added 2026-09-05: the repair is now a single dispatch —
      `hetzner-gitops CI` with `restore: restore-cluster`, which runs
      `bootstrap/restore-cluster.sh`. It still needs the SSH key rotation
      first, and it needs a runner, so it is downstream of both rows here;
      what changed is that it is no longer downstream of a *person* being
      available to SSH to two boxes in order.
      Corroborated 2026-09-06 from the owner's own browser, which is the first
      reading of the apex this repository has that came from outside a runner
      and outside a sandbox: `https://marisstella.dev/` returns
      `ERR_CONNECTION_REFUSED`. Same signature as run 33889983086 — a refusal,
      not a timeout, so the host is up and nothing is bound. The verdict does
      not move on it (a browser cannot see `:6443`), but it does close the one
      gap the 2026-09-04 measurement had: that reading came from a GitHub
      runner, and nobody had confirmed a visitor sees the same thing.

  codex-host-mode:
    # `up` here means the route is installable and runnable, not that it is
    # installed. Nothing in this repository can install it — that needs SSH,
    # which is `hetzner-ssh-key-is-a-public-key`. What it is *not* downstream
    # of is the two rows that have blocked everything else all week.
    verdict: up
    measured: "2026-09-05"
    # No run id: verified in a session sandbox, not from a dispatch, because
    # a dispatch is precisely what this route does not need. The commands
    # below reproduce it anywhere with bash, python3 and systemd-analyze.
    how: >-
      `python3 -m pytest gitops/tests/test_host_governor.py
      gitops/tests/test_install_codex_host.py` exercises the scheduler and the
      installer end to end, including running the *installed* copy from a
      scratch prefix with a scrubbed environment. `systemd-analyze verify` on
      `gitops/agents/host/codex-governor.{service,timer}` checks the units.
      Neither needs a runner, a cluster or a credential.
    note: >-
      Added 2026-09-05. The Codex worker's dev capacity had exactly two
      schedulers and both are down: the k3s CronJob (`k3s-cluster` below) and,
      as a fallback, GitHub Actions (`github-actions-runners` above). The
      self-hosted runner stack built as insurance against the second runs as
      pods inside the first, so it went down with it — the insurance was
      downstream of the outage it insured. `gitops/agents/host/` is a third
      scheduler that is downstream of neither: a systemd timer on the box,
      reusing `governor.py`'s decision functions unchanged. The boxes are up
      (`:22` open on both, run 33889983086), and the worker spends the owner's
      ChatGPT quota rather than the exhausted Actions allowance.
      What this changes for the queue: it does not add an owner ask. It makes
      the existing one worth more — rotating the SSH key now buys working dev
      capacity in one `install-codex-host.sh` run, not only the cluster
      diagnosis it bought before. Do not rank it as a route to the *public
      surface*; it schedules agents, it serves no traffic.

      **Two friction points closed 2026-09-06, still no owner ask added.**
      First, `enable-codex-governor.sh` — the one sanctioned way to flip
      `policy.json`'s "enabled" field, the single kill switch both the k3s
      CronJob and this host-mode timer read — refused to flip it without a
      k8s SealedSecret in the tree, a precondition host mode never needs (its
      credential is a plain file on the box). That would have made the
      sanctioned script itself the blocker once the owner had SSH and wanted
      host-mode-only dev capacity while the cluster stayed down. It now takes
      `--host-only`, which flips only `policy.json` and leaves `cronjob.yaml`
      suspended. Second, there was no laptop-driven installer for this route
      — only the GitHub-runner one (`setup-runner-from-laptop.sh`) existed;
      an owner had to assemble the rsync/ssh/credential hand-off from
      `gitops/agents/host/README.md`'s prose by hand.
      `bootstrap/scripts/setup-codex-host-from-laptop.sh` does both the
      install and the credential hand-off in one run, mirroring the runner
      script exactly. Neither change touches what is blocked or by what —
      `hetzner-ssh-key-is-a-public-key` is still the one thing standing
      between here and a running worker — they just remove two extra trips
      the owner would otherwise take after that key is rotated.

  hetzner-private-network:
    # `down` rather than a truer-sounding "absent": the schema's three verdicts
    # are about whether a route can run on this today, and for that purpose a
    # network that was never created and one that is broken are the same
    # answer. The note says which it is.
    verdict: down
    measured: "2026-09-05"
    # No run id: this one is read from the tree and from an action log another
    # run already captured, not from a dispatch of its own. Every other
    # reading here cites the run that produced it; this field is left out
    # rather than filled with a run that measured something else.
    how: >-
      Read from `infra/inventory.tf` (the comment at line 53) rather than
      from the API, and confirmed by the absence of any `attach_to_network`
      in the Hetzner action log `Outage triage` run 33889983086 read: both
      boxes show nothing but their own creation burst. To re-measure once
      SSH works, `ip -4 addr show` on either box and look for 10.10.0.10 /
      10.10.0.11; `bootstrap/restore-cluster.sh` does exactly this probe.
    note: >-
      `create_private_network` defaults to true, but `infra/Makefile` refuses
      to apply and the only Hetzner token here is read-only by deliberate
      policy (`infra/scripts/assert_hcloud_read_only.sh` — Hetzner has no
      hard euro spend cap, so a write token in CI is unbounded spend; that
      policy is worth keeping). So no `hcloud_network` exists.
      This matters more than it looks, because the *documented* bootstrap
      order silently depends on it: `install-k3s-server.sh` defaults
      `ADVERTISE_IP=10.10.0.10` and `install-k3s-agent.sh` defaults
      `SERVER_URL=https://10.10.0.10:6443`. Run as written, the server burns
      a 180-second readiness wait on an address that is on no interface and
      exits 1, and the agent retries a join forever. Nothing said so at the
      point of use, and nobody had got far enough past the SSH key to find
      out. `restore-cluster.sh` probes instead of assuming, and falls back to
      public addressing with `flannel-backend=wireguard-native` so the
      node-to-node link is still encrypted — which it must be, because in
      that mode flannel's default vxlan would carry pod traffic between
      Helsinki and Falkenstein in the clear.
      Note k3s `:6443` is world-open in the live firewall
      (`infra/firewall.tf`, `expose_k3s_api_publicly`). Closing it is what
      `infra/network.tf` is already written for, and needs a write-scoped
      token — so it is a follow-up to this row, not a blocker on restore.

  github-pages-plan:
    verdict: unknown
    measured: "2026-09-05"
    run: null
    how: >-
      `python3 platform/ci/pages_state.py` (added 2026-09-05; needs only the
      session's own repository token, no runner, no cluster). Exit 0 means
      the route looks worth the owner's thirty seconds. Then Settings →
      Billing to close it: set `up` if the plan is Pro, Team or Enterprise;
      `down` if it is Free.
      **The sentence this replaced was wrong in a way worth keeping visible.**
      It read: "There is no API call an agent session can make here — the
      repository token cannot see billing, and guessing is what this file
      exists to stop." The first clause is true of *billing* and was being
      read as true of *Pages*, which are different questions. Pages
      configuration is a plain field on the repository object — `has_pages` —
      and every token that can read the repo can read it. Measured
      2026-09-05: this repository is `private: true` **and**
      `has_pages: true`. GitHub does not permit enabling Pages on a private
      repository on the Free plan, so that combination is evidence about the
      plan, obtained without ever asking about the plan.
      The *billing* half really is unreadable, and that half was tested
      rather than assumed on 2026-09-05: `GET /user` with the session's own
      credential authenticates as `Duncan-Haywood` and returns
      `"plan": null`, because a fine-grained PAT omits that field without
      the Plan permission. Worth one call to confirm if the token is ever
      widened, and not worth re-attempting otherwise.
      The verdict stays `unknown` rather than moving to `up`, and the tool
      says `likely-up` rather than `up` for the same reason: `has_pages` is
      sticky. A repository that was public when Pages was switched on, or an
      account that has since downgraded, carries `true` while serving a
      stranger nothing. Evidence, not proof — but a good deal better than
      the `unknown` this row reported while the answer sat in a field
      nobody had read.
    note: >-
      GitHub Pages will not serve a **private** repository's site on the
      Free tier. This repository is private, so the whole `deploy-settings`
      route — both the workflow source and the branch source — is gated on
      the plan. What changed 2026-09-05 is that the gate is no longer
      *unobservable*: `has_pages: true` on a private repository is a state
      the Free plan cannot produce, so the route is now worth ranking rather
      than merely worth asking about.
      This reading was added 2026-09-05 alongside
      `platform/pages/publish-branch.sh`. That script removed the *other*
      prerequisite: it builds the site here and commits it to `gh-pages`,
      so serving it needs no Actions runner and no k3s cluster. Dropping
      `github-actions-runners` from that row without naming what is left
      would have rendered it `up` and put it back at the top of the queue —
      the precise failure `decision_queue.py`'s `runner_free` check was
      written to stop, and it would have been this file's own turn to make
      it. `unknown`, not `up`: the route may well work, and thirty seconds
      in Settings → Billing is what turns this into a real verdict.

  github-pages-branch-route:
    # A third Pages question, distinct from both rows around it.
    #   `github-pages-plan`   — could this account serve a private repo's site?
    #   `github-pages-branch-route` — is the runner-free `gh-pages` branch
    #                                 source the one the site is pointed at?
    #   `github-pages-origin` — does the URL actually return a page?
    # Until 2026-09-05 the middle one was believed unreadable from a session,
    # so it was folded into the third and both stayed `unknown`.
    # CHANGED 2026-09-06: down -> up. The owner flipped the dropdown, or it
    # was already flipped; either way the route this row tracks is live and
    # the 2026-09-05 reading below is superseded rather than deleted, because
    # the way it was wrong is the reusable part.
    verdict: up
    measured: "2026-09-06"
    run: 34055759342
    how: >-
      RE-MEASURED 2026-09-06T19:42Z, run 34055759342, after publishing a
      merge that touched `ventures/**`: the managed builder ran on `gh-pages`
      and concluded `success` again, so the route is not a one-off reading.
      Keeping this row fresh is now load-bearing rather than tidy.
      `decision_queue.py`'s `PUBLIC_ORIGINS` consults it through `reading()`,
      so once it ages past `STALE_AFTER_DAYS` the owner's banner reverts to
      announcing that the catalogue is dark -- which is what it wrongly said
      all day on 2026-09-06 until this row was wired into it. Re-measure it
      on any session that publishes.
      `python3 platform/ci/pages_state.py` and read the **`deployed`** row
      (added 2026-09-06). It lists runs of GitHub's managed builder filtered
      to `gh-pages` and looks for a completed one. A managed Pages build is
      triggered only by a push to the *configured source*, so a successful run
      on `gh-pages` names the branch and shows a real deployment -- which the
      `source` row below cannot do: that one reads whether the builder is
      *listed*, which establishes that some branch source exists but names no
      branch and proves no build ever ran.
      Superseded reading, kept for the shape of the error:
      `python3 platform/ci/pages_state.py` and read the `source` row (added
      2026-09-05). It lists every workflow GitHub reports for this repository
      and looks for the synthetic `dynamic/pages/` path. GitHub creates that
      managed builder if and only if Pages serves from a *branch*; when the
      source is "GitHub Actions" no such workflow exists. The call is
      `GET /repos/{owner}/{repo}/actions/workflows` — the same endpoint
      `ci_starvation.py` already uses, so it needs no new scope, no runner and
      no owner. Re-measure by re-running the tool.
    note: >-
      Measured 2026-09-05 across all 232 workflows in this repository. The
      three `dynamic/` entries are
      `dynamic/agents/copilot-pull-request-reviewer`,
      `dynamic/dependabot/dependabot-updates` and
      `dynamic/dependabot/update-graph`. There is no `dynamic/pages/` entry,
      while `gh-pages` carries commits that would have triggered one — so the
      configured Pages site is pointed at the **Actions** source.
      This is the question `pages_state.py`'s own docstring said no session
      could answer. It was right that `GET /pages` is refused by the agent
      egress proxy and that `/deployments` 403s on token scope; it did not
      consider that the workflow *listing* carries the same fact by
      side-effect. Worth remembering as a shape: a blocked endpoint is not the
      same as an unmeasurable fact.
      **What it changes.** The `deploy-settings` flip is not "turn Pages on" —
      Pages is on. It is one dropdown: Settings → Pages → Source → "Deploy
      from a branch" → `gh-pages` / (root). And it explains the darkness
      without needing the origin fetch: the Actions source deploys via
      `portfolio-pages.yml`, whose deploy job is gated on
      `vars.PAGES_ENABLED == 'true'` (skipped on every run measured to date)
      *and* needs a runner (`github-actions-runners` is down). Two independent
      reasons nothing has been published from it.
      **SUPERSEDED 2026-09-06.** The paragraphs above are the 2026-09-05
      reading and every one of them was correct that day; the source has since
      become the branch. Measured: `platform/pages/publish-branch.sh` pushed a
      fresh `gh-pages` snapshot and GitHub's own
      `dynamic/pages/pages-build-deployment` ran on that branch and concluded
      `success` -- runs 34011996382 (head 1c2254a3) and 34012041708 (head
      e7b5a940). Both ran *while `github-actions-runners` was down*, which is
      the second finding: the managed Pages builder is not drawn from the
      metered Actions allowance, so this delivery route survives the
      starvation that takes every other one out.
      The generalisable half is the same shape the 2026-09-05 note already
      named and then walked into from the other side. That note reasoned from
      *absence* -- no `dynamic/pages/` entry -- and absence goes stale
      silently: nothing re-runs when the fact changes, so the file kept
      asserting `down` after it stopped being true. A reading taken from a
      thing that is *present* (a run, with an id and a conclusion) carries its
      own date. Prefer those.
      **What it does not change.** Whether the origin serves a *stranger*.
      GitHub built and deployed the branch, which is strictly more than
      "configured", but it is still not an unauthenticated HTTP 200: this
      session cannot fetch the URL (the agent egress proxy answers
      `403 to CONNECT` for `github.io`), and a Pages site can in principle be
      access-controlled rather than public. `github-pages-origin` below
      therefore stays `unknown`, and the cheapest way to close it is the owner
      opening the URL in a logged-out browser, or `Public surface check` once
      a runner is available. Nor the
      plan gate: on Free, a private repository's Pages site serves a stranger
      nothing whichever source it points at, so `github-pages-plan` above is
      still the thirty seconds that decides whether this flip is worth taking.

  github-pages-origin:
    # Distinct from `github-pages-plan` above, and the distinction is the whole
    # point of this row. That one asks whether the account *could* serve a
    # private repository's Pages site. This one asks whether
    # `duncan-haywood.github.io/monorepo-projects/` **is serving one right
    # now** — and the honest answer is that nobody has ever asked.
    verdict: unknown
    measured: "2026-09-07"
    run: null
    how: >-
      Dispatch `Public surface check`
      (`.github/workflows/public-surface-check.yml`) and read the Pages row of
      its table; it needs no secret. Or, with a browser and no infrastructure
      at all, open the URL `python3 platform/ci/pages_state.py` now prints
      under `next` — in a logged-out or private window, which is the whole
      point: a signed-in owner receives 200 from an access-controlled Pages
      site too, so a casual check from an ordinary browser cannot tell the
      two apart and is not a reading. The second route is the one that works
      today, because the first needs a runner and `github-actions-runners`
      above is flapping.
      Third route, added 2026-09-07 and usable from a session: ask a search
      engine for pages on the host (`WebSearch` for the exact string
      `duncan-haywood.github.io/monorepo-projects`). This is deliberately
      asymmetric and only one direction of it is a proof. **Any** indexed
      page from that host settles the row `up` outright — a crawler is an
      anonymous stranger, and it could not have read a member-only site.
      Zero hits proves nothing at all; see the note.
    note: >-
      Added 2026-09-05. `platform/ci/public_surface.py` grew a probe for this
      origin in dbf614c74 (#3199), precisely because nothing had ever measured
      it. It has still never run. The last `Public surface check` to get a real
      runner is run 33887885219, on commit 9a87ee6e4 — the commit *before*
      dbf614c74 — and its table carries three rows, all `marisstella.dev`.
      Every dispatch since has returned `runner_id: 0`, including one made from
      this session (run 33968740961, 13:23Z, classified by
      `ci_starvation.py --run`). So the probe exists, is correct, and has
      produced no reading at all.
      Why that matters more than one missing row: `has_pages: true` means a
      Pages site **is configured on this repository**, and the `gh-pages`
      snapshot is `current` (`pages_state.py`, and its 885 sitemap entries and
      712 pages were checked to resolve against the committed artifact in this
      session). Both facts are consistent with the catalogue *already being
      served* at the github.io origin and this repository not knowing it —
      which is the same shape of error CLAUDE.md records the apex having for
      five days, a claim derived from what we ship and never checked against
      what a stranger receives. It is equally consistent with the source still
      being "GitHub Actions", in which case the site is dark for want of a
      runner and the lever is Settings → Pages → Source.
      Do not resolve this by reasoning. One browser request settles it, needs
      no credential, and is the cheapest unread fact in this file.
      2026-09-07, three readings. **One half of the paragraph above is now
      retired**: the source is not "GitHub Actions". `pages_state.py` reports
      `source: branch` and `deployed: served`, from GitHub's managed
      `dynamic/pages/` builder concluding `success` on `gh-pages` (run
      34089258996, 06:05:17Z) — a managed build is triggered only by a push
      to the configured source. So the site is not dark for want of a runner,
      and Settings → Pages → Source is not the lever.
      Second: the repository is private, confirmed from the API rather than
      inferred (`GET /repos/Duncan-Haywood/monorepo-projects` →
      `"visibility": "private"`). That is what keeps the row `unknown` rather
      than resolving it — Pages on a private repository can be public or
      restricted to members, and the field that says which
      (`GET /repos/{owner}/{repo}/pages` → `public`) returns **403** to the
      token these sessions carry. Worth knowing before reaching for it again.
      Third, and it is a *negative* reading, so read the asymmetry above
      before using it: a `WebSearch` for the exact string
      `duncan-haywood.github.io/monorepo-projects` returned zero pages from
      that host. **This is not evidence the site is restricted.** The URL is
      about a day old, and — the part that matters more — the repository is
      private, so there is no public page anywhere linking to it. A crawler
      with no inbound link and no public repository to walk has no route to
      the site whether or not it is allowed in, which makes zero hits the
      expected reading under *both* hypotheses and therefore worth nothing as
      evidence for either.
      That last point is the one with a consequence beyond this row, and it
      is a distribution finding rather than an infrastructure one: the
      catalogue currently ships 192 sitemap entries and a `robots.txt` that
      allows every crawler, from an origin nothing links to. Confirming the
      site is public would therefore be necessary and not sufficient for the
      SEO work in `PRODUCT_PLAYBOOK.md` §5e to reach anyone. Do not read a
      later "still zero indexed" as a regression, or as this row going down.

  agent-session-egress:
    # What a Claude Code web session — the thing that runs most of the work
    # here — can actually reach. `down` means it cannot reach the boxes or any
    # hosted secret store, so it cannot be the machine that deploys.
    verdict: down
    measured: "2026-09-06"
    run: null
    how: >-
      From inside a session: `curl -s -o /dev/null -w '%{http_code}'
      https://api.1password.com` (or any non-allowlisted host), then
      `curl -sS "$HTTPS_PROXY/__agentproxy/status"` and read
      `recentRelayFailures` for the reason. For the boxes,
      `cat < /dev/null > /dev/tcp/89.167.29.39/22`. Re-measure in a session
      rather than reasoning about it; the policy is per-environment and the
      owner can change it.
    note: >-
      Measured 2026-09-06, and it is the reading that decides where secrets
      belong. `api.github.com` returns 200; `vault.example.com`,
      `api.1password.com`, `api.doppler.com`, `app.infisical.com` and
      `api.hetzner.cloud` each come back `gateway answered 403 to CONNECT`
      (policy denial). Raw TCP to `89.167.29.39:22` does not connect and there
      is no `ssh` binary in the image at all.
      Two consequences, and the second is the one this repository kept getting
      wrong. **A hosted secret manager cannot be the answer**: it would put the
      credentials somewhere the automation cannot reach, which is the same
      failure mode as an Actions secret with no runner, so
      `bootstrap/scripts/load-secrets.sh` reads a local directory and a
      committed age file and deliberately has no network source. **And a web
      session can never be the deployer** — no choice of secret store changes
      that, because the block is the egress policy, not the credential. The
      deploy is driven from Cursor or a local Claude Code CLI, which sit on a
      machine with ordinary networking; web sessions build, review and merge.
      Worth stating because the failure is quiet: a session that *has* the SSH
      key would still fail to reach `:22`, and the obvious reading of that
      failure is "the key is wrong" — which is exactly the sentence this
      repository has already spent a week on once.
      This does not supersede `github-actions-runners` or `k3s-cluster`; it is
      orthogonal to both. It says who can act while they are down.
      **Added 2026-09-06: do not port-probe :80 or :443 from a session — the
      answer is a lie, and it lies in the healthy direction.** The row above
      measures the proxy *refusing* (403 to CONNECT) and a raw socket to `:22`
      *timing out*, and both readings are honest failures. A raw socket to
      `:443` is not: the sandbox accepts the connection itself and will even
      complete a TLS handshake, returning an empty peer certificate. So
      `89.167.29.39:443` reads OPEN from here on the same day a browser gets
      `ERR_CONNECTION_REFUSED` from it.
      The control that proves it costs one line and belongs in any such probe:
      TEST-NET-2 `198.51.100.7:443`, an address with nothing listening on it
      anywhere in the world, *also* connects. (TEST-NET-1 `192.0.2.1:443` is
      refused, so a single control can come back clean — use both, or use the
      one that is documented here to answer.)
      Why this is worth a row rather than a footnote: every other measurement
      failure this file records fails toward *unknown*, and the tooling is
      built to treat unknown as never-healthy. This one fails toward **up**. A
      session asking "is the site back?" with `/dev/tcp` gets "yes" from a dead
      origin, which is the 2026-08-30..09-04 "nothing is served" episode run in
      reverse and would be believed faster, because good news is not audited.
      `platform/ci/public_surface.py` is not affected — it goes through the
      proxy, gets the 403, and reports NOT MEASURED (verified in this session,
      28/28 probes blocked). The trap is only for hand-rolled socket probes,
      which is precisely what a session reaches for when the tool says it
      cannot answer.
      **That last sentence was wrong, and it cost three days (corrected
      2026-09-09).** `platform/ci/outage_triage.py` is not a hand-rolled probe
      — it is the committed tool whose entire diagnostic value is the
      open/refused/no-answer distinction — and it called `socket.connect()`
      with no control at all. So this row named the hazard, named the exact
      two-address control that detects it, and the one tool in the repository
      that needed that control did not have it. Same shape `CLAUDE.md` records
      for `platform/proposal/` and the browser checks: the guard was written
      down and never wired into the thing it guards.
      Measured 2026-09-09 from a session, before the fix: the two live nodes
      and TEST-NET-2 returned the *same four states* — 80/443 `open`, 22/6443
      `no answer` — so `outage_triage.py` rendered identical output whether the
      boxes were healthy, dead, or had never existed. Both halves misleading in
      the expensive direction: 443 `open` reads as a serving ingress while the
      origin is down, and 22 `no answer` reads as sshd gone, which is exactly
      the reading the tool's own docstring says would send the owner after
      console access instead of `hetzner-ssh-key-is-a-public-key` — the
      top-ranked ask and the only route back to the origin.
      Closed the same day: `detect_interception()` probes all three RFC 5737
      ranges before layer 2 runs, the port layer is *skipped* rather than
      reported when any of them answers, the verdict refuses to diagnose and
      says in terms that it neither supports nor sinks the SSH ask, and
      `main()` exits 2 so "no reading taken" cannot read as a pass. The
      three-address design is not belt-and-braces: TEST-NET-1 is denylisted by
      the proxy and answers `refused` on every port, so a single control picked
      from it reports a clean transport. Pinned by
      `platform/ci/test_outage_triage.py::InterceptedTransport`, whose tables
      are the readings above rather than invented ones.
