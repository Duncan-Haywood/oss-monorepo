period: 2026-11
entries:
  - venture: parish-office
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        New direction from the owner (2026-11-03): tools for Catholic parishes and
        other religious organisations, for the standard problems they have. Started
        ventures/parish-office with a ROADMAP of the standard parish-office problems
        as modules, and landed the first: a Mass intentions book (the canon 958
        register) that books intentions into free Masses and checks cc. 948, 950,
        951 §1-2, 953, 954, 955 §1-2 and 956, quoting vatican.va text fetched the
        same day; register CSV, year summary, CLI and page. 32 tests on made-up
        books; driven in headless Chromium (load example, book, add Masses, reload)
        with no console errors. Not yet tried on a real parish's book.
    mrr_end: 0
  - venture: monastery-site
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        New direction from the owner (2026-11-03): an opinionated, high-quality
        website builder for Catholic monks' and nuns' communities, with vocations
        and donations set up well. Started ventures/monastery-site: a pure engine
        that builds twelve page types from one community.json, six palettes checked
        to WCAG AA, a launch checklist, a CLI, and a no-code builder page with live
        preview and .zip download; two fictional demo sites. 39 tests; driven in
        headless Chromium with no console errors. Outreach kit (OUTREACH.md) for the
        owner's own emails; nothing sent. Not yet used by a real community.
    mrr_end: 0
  - venture: clothing-design-studio
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Owner request R-0005 (from an interview with a clothing designer):
        AI-assisted clothing design. Started ventures/clothing-design-studio: a
        browser studio where a tee, long-sleeve, crewneck or hoodie (drawn to
        size-M scale) is edited by spoken or typed commands through a
        deterministic parser (each change listed with its words and undoable;
        optional own-key or local model rewrites free speech into the same
        commands) or by drag, resize and rotate; three alternatives to pick by
        voice; 9 fabrics and 8 methods with compatibility notes; landed cost,
        margin after VAT and fees, break-even and target price from a supplier
        sheet (CSV in and out; shipped figures are labelled placeholders); tech
        pack, quote request and launch kit. 54 tests; driven in headless
        Chromium with no console errors. A second interview added a
        sunglasses designer (stock frame, 52x18-145 sizing with range checks,
        logos on temple, lens and case, cost per pair, quote request asking for
        EN ISO 12312-1 and the FDA drop-ball test) and a capsule wardrobe
        planner (audience profile, outfit count by a stated colour rule,
        in-house vs partner-brand pieces, first drop within a budget). 69
        tests. Not yet used by the designer.
    mrr_end: 0
  - venture: concrete-maturity
    agent_spend_usd: null
    human_hours: 0
    outcomes:
      - >-
        Explore run (free choice): started ventures/concrete-maturity, a free
        in-browser and CLI concrete maturity calculator for the construction
        direction. Reads a logger CSV (several sensors, deg F or C, US/ISO/
        day-first timestamps or elapsed time), computes Nurse-Saul or
        equivalent-age maturity, fits logarithmic, hyperbolic and exponential
        strength-maturity curves to lab breaks (chosen by AICc), and reports
        each sensor's estimated strength, time to target or a projection, with
        the lowest sensor marked governing. Explainer page with a worked
        made-up example, llms.txt, post. 23 tests; driven in headless Chromium
        with no console errors and no overflow at 390 px. Not yet run on a real
        project's record.
    mrr_end: 0
