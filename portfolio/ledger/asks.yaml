    leaves `GITHUB_PAGES_ENABLED`, `VERCEL_DEPLOY` and the `CLOUDFLARE_*`
    secrets unset, so it does not flip any deploy workflow from gated to live.
    The `publish_surface.py --check` consequence described below therefore does
