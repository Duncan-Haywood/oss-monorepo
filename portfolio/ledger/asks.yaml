    permissions, plus an expiry; (3) switch on live checkout when you want to
    take money. Webhook destinations can be automated the same way next.
  unlocks:
    - >-
      The only thing that moves the revenue ceiling off $0. Every other item in
      this file changes what is measurable, listed, or deployed; none of them
      lets the portfolio take a dollar.
  blocked_by: []
  note: >-
    Owner, 2026-10-31: "its time to add payout rail of some sort. merchant of
    record sounds fine to me." That answers the binary in `break-even.md` in
    the earning direction. The row stays open because creating the account
    needs a legal person, ID and a bank, which no session may supply. The
    API hosts of all four candidates (`api.polar.sh`, `api.lemonsqueezy.com`,
    `api.paddle.com`, `api.stripe.com`) answered from a session on 2026-10-31,
    so "the egress entry it needs" is no longer needed. The key-safety design
    stays `docs/reports/2026-10-30-billing-plan.md`, Option A: hosted
    checkout, no live key anywhere this repo or its agents can reach.
- id: publication-identity
  asks: [0, 1, 5]
  prs: []
  gates: distribution
  exposure: legal-person
  opened: "2026-08-19"
  action: >-
    Three related grants: one registry account signup (Packagist or RubyGems
    preferred; not Docker Hub), one GitHub App permission change, and one
    standing approval on whether an agent session may publish a *free* listing
    -- no payment, no personal data, no compliance claim -- under this
