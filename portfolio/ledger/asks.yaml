    its email as a Restricted user on the property, and store the key JSON as
    the repository secret `GSC_SERVICE_ACCOUNT_JSON`; `platform/seo/probe.py
    gsc` then reads clicks, impressions and position. (4) Repository About ->
    Website: https://marisstella.app/. Tokens are public by design (each
    engine reads them from the live page); the service-account key is a
    secret and goes only in the secrets store. Remove this row once (1) and
    (2) verify.
