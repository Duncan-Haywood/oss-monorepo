- id: deploy-settings
  asks: [4, 6]
  prs: []
  gates: deployment
  exposure: credential
  opened: "2026-08-19"
  # Measured, current loss of a public surface, per the OUTAGE convention in
  # decision_queue.py: `Public surface check` run 33912053750 (2026-09-04,
  # no credential, every request one a stranger could make) got 404 from
  # `https://duncan-haywood.github.io/monorepo-projects/` — the origin ~670
  # generated pages name in their own `<link rel="canonical">`.
  #
  # This row sat at position 9 for 16 days while the queue's outage banner
  # told the owner that "every other row here is downstream of a host
  # answering at all". That sentence was true of one surface and this is the
  # other one: GitHub Pages needs no k3s, no SSH key and no sealed clone
  # token, so it is not downstream of the cluster and never was. The ranking
  # encoded the pre-#3199 belief that the portfolio had a single origin.
  #
  # CLEARED 2026-09-06. `outage: true` asserts a *measured, current* loss of a
  # public surface -- decision_queue.py is explicit that it "is not a way to
  # say important" -- and the measurement it rested on (the 404 from run
  # 33912053750 on 2026-09-04) has been overtaken. GitHub's managed builder
  # now runs on `gh-pages` and succeeds (runs 34011996382, 34012041708), which
  # happens only for the configured Pages source, so this route is deployed
  # rather than dark. What is left is one logged-out fetch nobody here can
  # make, and "unverified" is not "down": leaving the flag set would keep the
  # banner telling the owner to restore a surface that is already up, which
  # is the same failure in the opposite direction.
  outage: false
  # Until 2026-09-05 this read `requires: [github-actions-runners]`, and that
  # was correct for the only route that existed: `portfolio-pages.yml` had to
  # build the artifact and run `deploy-pages`, and that needs a runner.
  #
  # `platform/pages/publish-branch.sh` (added 2026-09-05) removes that
  # prerequisite rather than waiting on it. It builds the site in a session,
  # checks the artifact, and commits it to an orphan `gh-pages` branch, so the
  # owner's flip becomes Source "Deploy from a branch" — no workflow run, no
  # runner, no k3s cluster. Every one of this repository's three execution
  # routes was down on 2026-09-04 at once; this is the delivery path that is
  # downstream of none of them.
  #
  # What is left is not CI. It is that **this repository is private, and Pages
  # does not serve a private repository's site on the Free tier** — which
  # applies to the branch source exactly as it did to the workflow source.
  # Nothing here can read the account's plan, so it is `unknown`, not `up`:
  # see `github-pages-plan` in `infra_state.yaml`. Swapping one prerequisite
  # for none would have rendered this row `up` and floated it back to the top
  # of the queue on the strength of a measurement nobody took.
  requires: [github-pages-plan]
  runner_free: >-
    `platform/pages/publish-branch.sh` builds and commits the site to the
    `gh-pages` branch from a session; serving it is Settings → Pages →
    Source "Deploy from a branch". No workflow is dispatched at any point,
    so runner starvation does not block this route.
  action: >-
    **GRANTED — measured 2026-09-06. Do not flip anything; one 10-second
    confirmation is all that is left.** GitHub's own managed builder
    `dynamic/pages/pages-build-deployment` ran on `gh-pages` and concluded
    `success` (runs 34011996382 and 34012041708), and a managed Pages build is
    triggered only by a push to the *configured source*. So Pages is on, the
    source is the `gh-pages` branch, and the snapshot built from the tip of
    `main` has been deployed. Both runs also completed while
    `github-actions-runners` was down, so this route does not spend the
    metered Actions allowance.
    What is genuinely left, and it is not a settings change: **open
    https://duncan-haywood.github.io/monorepo-projects/ in a logged-out
    browser and confirm you see the catalogue.** A deploy succeeding is not
    the same as an unauthenticated stranger getting a 200 — a Pages site can be
    access-controlled — and no session can check it, because the agent egress
    proxy answers `403 to CONNECT` for `github.io`. If it loads, this row is
    closed and `github-pages-origin` in `infra_state.yaml` goes `up`. If it
    404s or asks you to log in, that is the plan question below, and only then
    does the rest of this row apply.
    **The standing job for sessions, now that the route is live:** a committed
    artifact does not rebuild itself, so re-run
    `CONFIRM=publish-pages-branch PUSH=1 ./platform/pages/publish-branch.sh`
    after any merge that touches a served surface. That is this route's one
    real cost and it is now the difference between the live site and `main`.
    **And there is a second flip that retires that standing job — added
    2026-09-06, because this row has been describing the drift as permanent
    while the fix sat in the tree unmentioned.**
    `.github/workflows/publish-pages-branch.yml` runs exactly the command
    above on every push to `main` that touches `ventures/**` or
    `platform/pages/**`. It ships switched off, because CLAUDE.md's
    "Automation" rule forbids an unattended workflow that pushes commits
    without your approval — so the gate *is* the approval, the same way
    `PAGES_ENABLED` gates the other Pages route. To arm it: **Settings →
    Secrets and variables → Actions → Variables → `PAGES_BRANCH_PUBLISH` =
    `true`**. Clearing it switches the pushing back off; with it unset the
    workflow still builds the site and runs `check.mjs`, so a dead link the
    copy step introduces turns a merge red instead of reaching a crawler.
    Worth setting now even though it changes nothing today: it needs an
    Actions runner, and `github-actions-runners` has been down since
    2026-09-04, so what setting it buys is that the drift hole closes by
    itself on the day the allowance resets rather than waiting on somebody
    to remember this paragraph then. It is listed here rather than as its
    own queue row because it is the same decision as this one — how the
    Pages route stays published — and CLAUDE.md is explicit about not
    duplicating asks.
    ---
    **Superseded below (2026-09-05 and earlier), kept because the way it went
    stale is the reusable part: every sentence was a correct reading of the
    manifests and the API restated as a claim about what a visitor receives,
    and nothing re-ran when the world changed.**
    **Check the plan first — thirty seconds, and it decides whether the rest
    of this row is worth anything.** Settings → Billing names it. Pages will
    not serve a *private* repository's site on the Free tier, and this
    repository is private, so on Free this row publishes nothing to a
    stranger no matter what else is done. On Pro or above, continue.
    **Expect that check to come back Pro or better** (new 2026-09-05, and
    the reason this row is worth opening at all today):
    `python3 platform/ci/pages_state.py` reads the repository object and
    reports `private: true` **and** `has_pages: true`. GitHub does not let
    the Free plan enable Pages on a private repository, so a Pages site
    already being configured here is evidence the plan permits it — read
    without any billing permission, from a session, with no runner. It is
    evidence and not proof: `has_pages` is sticky across a repo going
    private or an account downgrading, which is exactly why the thirty
    seconds in Billing still settles it and why `github-pages-plan` stays
    `unknown` in `infra_state.yaml` until you look. Also worth knowing
    before you go: the same tool reports the `gh-pages` snapshot as
    **current** — built from the tip of `main` — so the flip publishes
    today's catalogue, not a stale one.
    **Then, the runner-free route (new 2026-09-05, and the one to take):**
    the built site is already committed to the `gh-pages` branch by
