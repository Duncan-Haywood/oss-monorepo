- id: crates-io-token
  asks: []
  prs: []
  gates: distribution
  exposure: credential
  opened: "2026-10-30"
  action: >-
    One-time, about 5 minutes, publishing already approved by the owner on
    2026-10-30 ("publishing to crates io seems fine"). (1) Log in to
    crates.io with GitHub and verify an email (crates.io requires one to
    publish). (2) Create an API token at https://crates.io/settings/tokens
    with the publish-new and publish-update scopes. (3) Add it as the
    repository secret CARGO_REGISTRY_TOKEN. (4) Set the repository variable
    DISTRIBUTE_CRATES to true. (5) Run the `distribute-crates` workflow from
    the Actions tab. It tests the crate, skips any version already published,
    and publishes clonescan 0.1.0.
  unlocks:
    - >-
      `cargo install clonescan` for the Rust copy-paste detector
      (ventures/clonescan), and later crates of the "dev tools in Rust"
      direction through the same workflow (add the crate to its matrix).
  blocked_by: []
  note: >-
    Without the secret and the variable the workflow only runs `cargo publish
    --dry-run`, which passes (checked 2026-10-30: 16 files, 21.5 KiB
    compressed). The name `dupehound` was taken on crates.io by an unrelated
    tool, so the product was renamed clonescan on 2026-10-30 (the owner chose
    the name). After the first release, crates.io Trusted Publishing (GitHub
    OIDC) could replace the token; it can only be set up on a crate that
    already exists.
