    are behind `if:` gates on credentials the owner has not set. The last run
    of each confirms it -- the wrangler step skipped on 2026-08-21, and both
    `deploy` and `deploy-vercel` skipped on 2026-08-24. So merging this fires
    no deploy and regresses no live site, because there is no live site. What
    is actually left to decide is narrower: whether a major framework bump
    across five ventures (six apps) counts as a "breaking change to deployable
    `ventures/*` code" under `CLAUDE.md` while nothing is deployed. That is a
    smaller question than the one this row was posing, and it is the whole of
    what remains -- and since it is the same question `contrast-fixes` and
    every future venture pull request also reduce to, it is now its own row
    (`venture-gate-premise`, Ask 9) rather than a paragraph inside this one.

