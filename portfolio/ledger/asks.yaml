  blocked_by: []
  note: >-
    Verified and CI-green (9/9 checks on the head), `mergeable_state` clean,
    recorded in `verifications.yaml` with BUILD still VALID against the
    current `main`. This is the item with a measured carrying cost: it is the
    third conflict-resolution pass on the #191 -> #208 -> #222 chain, so each
    day it waits has spent a session on re-resolving it rather than on
    anything new.


    Correction, 2026-08-24: this note previously read "owner-gated only
    because merging fires deploys to live sites". That was false, and nothing
    checked it. `platform/ci/publish_surface.py` derives the answer from the
    workflow files and finds no workflow that publishes anything on a push to
    `main`: `ai-first-markets-deploy.yml` is `workflow_dispatch`-only so a
