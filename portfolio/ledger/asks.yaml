- id: deploy-settings
  asks: [4, 6]
  prs: []
  gates: deployment
  exposure: credential
  opened: "2026-08-19"
  action: >-
    Take one Hetzner CX-class VPS (~EUR 4/month with 20 TB of traffic
    included, then ~EUR 1/TB -- a soft ceiling, not a hard one; Hetzner offers
    no halt-at-an-amount control at all, so if a vendor-side stop is required the
    answer is Railway instead -- noting that Vercel's and Railway's own stops
    evaluate usage periodically and so overshoot by minutes rather than halting
    on the instant), point
    `ventures/ubuntu-agent-server/inventory.ini` at it and run that playbook.
    **First create a protected `agent-server` Environment** (Settings ->
    Environments) with yourself as required reviewer, and put the SSH key,
    known-hosts and any Tailscale key in it with `gh secret set --env
    agent-server` -- **and both variables too**, `AGENT_SERVER_PUBKEY` and
    `AGENT_SERVER_HOST`, with `gh variable set --env agent-server`. Neither is
    a secret and both matter as much as the secrets: the public key decides
    which key the playbook installs on a root-equivalent account, and the host
    decides where that key is sent. Left repository-scoped, either lets someone
    with write access swap or retarget it and have a routine-looking approval
    carry it out. Integrity and confidentiality are different questions; only
    the second is about secrecy, and this row named only the public key until a
    review caught the host missing from the same sentence. Repository-scoped secrets do not work here: a write-access
    collaborator can push a branch deleting the workflow's `environment:` line
    and still read them, which is the bypass the environment binding exists to
    close.
    Do **not** add a Hetzner Cloud API
    token to GitHub secrets -- it can create servers, which turns one box
    into a project quota, and Hetzner offers no
    scope below Read & Write; provision in the console by hand. An SSH key in
    secrets is fine and is the intended design: it cannot provision anything,
    so the one-box bound survives it. `agent-server-provision.yml` (added
    in #720, `workflow_dispatch`-only) runs the playbook from CI; the secrets
    and variables it needs are listed at the top of it. It is **not** dry-run by
    default -- Ansible's check mode cannot provision a fresh box, since the
    `user` module only predicts the account and every later task then fails
    against a user that does not exist, so the first dispatch is a real run. Leave
    `agent_runner_start_disabled: true` -- switching the fleet on is a
    separate decision. Leave `GITHUB_PAGES_ENABLED`, `VERCEL_DEPLOY` and the
    `CLOUDFLARE_*` secrets unset. Choose Railway instead (~$5-25/month) if you
    would rather never touch a server; `platform/deployment/README.md` says
    where each of the four candidates wins.
  unlocks:
    - >-
      Compute the repository can use at all: one box that can run the ten web
      apps, the `analytics-sync` daemon and a Postgres, and that
      `ventures/ubuntu-agent-server/` has been automated against since before it
