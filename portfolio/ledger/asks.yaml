    substitutions means re-deriving which classes carry the contrast fix
    against the new structure, closer to redoing the `a11y-contrast-
    decidability` fix than resolving a merge. Flagged as a PR comment on #531
    rather than attempted blind, since correctness there (checkout pricing,
    `BUNDLES` consistency) matters more than speed. The merge-or-decline
    decision is still the owner's; what changed is that "merge" no longer
    means taking the diff as-is.


    Correction, 2026-08-24 (direction, same day): the previous paragraph had
    the direction of #731's rewrite backwards. Verified directly against both
    blobs (pre-#731 `b9e5ea7d` vs. current `main`): the file did *not* move
    from a shared `BUNDLES` source to an inline array -- it went the other
    way. Pre-#731, `page.tsx` hardcoded a `const bundles = [...]` array
    in-file with no pricing import at all. #731 replaced that with one that
    imports `getBundle`/`COMMERCE_ADDON` from `@/lib/pricing/bundles` and
    reads bundle data from there -- #731 *fixed* a single-source-of-truth gap
    in this file, it did not introduce one. The conclusion this row draws
    from that -- #531's conflict is real and structural, not a plain rebase
    -- is unaffected: reapplying 11 colour-token classes onto a file whose
    pricing now comes from a shared module still means re-deriving which
    classes carry the fix, just against a *better*-structured file than
    before, not a worse one.

- id: deployment-platform
  asks: []
  prs: [720]
  gates: deployment
  exposure: credential
  opened: "2026-08-24"
  action: "Merge or decline #720."
  unlocks:
    - >-
      One named deployment platform in place of the three-way menu
      `deploy-settings` had carried for five days. The answer moved as the
      question was sharpened -- Cloudflare on lowest spend risk, Vercel on code
      fit, Railway on all-inclusive-plus-value, and finally **Hetzner** when it
      was put as compute for the monorepo rather than hosting for the ventures.
      The document keeps all four readings side by side, which is the durable
      artifact; the single recommendation is not. Hetzner is the only one that
      can also be the agent host `ventures/ubuntu-agent-server/` already
      automates and has never had a machine to run on. Railway stays the pick
      for anyone who would rather not run a server.
  blocked_by: []
  note: >-
    #720 answers the menu that `deploy-settings` (asks 4/6) posed as an open
    choice. Its own body applies two owner-set criteria in sequence -- a spend
    cap built into the vendor, then best value and most all-inclusive -- and
    keeps the answer per criterion rather than rewriting it, so the earlier
    framings stay auditable. The answer moved from Vercel to Railway when the
    second pair was asked for. Human-gated regardless of the quality of the
    analysis: the document commits to an account registration and standing
    spend that only the owner may authorise, so this is a merge-or-decline
    call, not a session's. The probe it ships
    (`platform/deployment/probe_control_planes.py`) is read-only tooling and is
    the agent-decidable half; the decision is not. It keeps no host table of
    its own -- its 23 control planes were folded into the consolidated egress
    table, now 121 hosts, and it asserts its claim against that. Note the
    measured exceptions: `cloudresourcemanager.googleapis.com` and
    `ec2.amazonaws.com` are both reachable write APIs, so the claim is "every
    vendor control plane probed except GCP's Resource Manager and AWS EC2", not
    a blanket one. The EC2 verdict was a false denial produced by this probe's
    own redirect-following bug and only corrected on re-measurement, which is
    worth knowing about the confidence of the rest.

