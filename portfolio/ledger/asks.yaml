# The account owner's decision queue, as data.
#
# Every item here is `CLAUDE.md`-human-gated: it needs a legal person, creates
# an ongoing outside effect, or both. No session may decide one. This file
# exists so a session can *read* the queue without re-deriving it, and so the
# owner can read it without scrolling.
#
# Why a file and not issue #139. #139 is the living tracker and remains the
# place the owner answers. But its body is ~82KB of prose, rewritten in place
# by whichever session edits last -- and on 2026-08-24 two concurrent sessions
# clobbered it twice in one day (recorded in #697, #698). A queue that two
# agents can corrupt in an afternoon is not a queue the owner can trust. Git
# merges concurrent edits; an issue body does not. So the *structure* of the
# queue lives here, under review, and #139 keeps the discussion.
#
# What this file adds that the #139 asks table does not. That table is sorted
# cheapest-first, which `break-even.md` already faulted for burying the only
# ask that unlocks any revenue. Two axes it does not carry at all:
#
#   - `blocked_by` -- three of the asks cannot do anything if granted today,
#     because a different ask gates them. `CLAUDE.md` states this for Ask 5 in
#     prose ("Ask 5 is currently inert") and the table still lists it as
#     available to grant.
#
# Ask 8 is deliberately absent: `break-even.md` superseded it.
# The 2026-08-24 "may agents merge product PRs?" row is gone: answered yes
# on 2026-08-25. Do not put it back. Product PRs merge; they are not a
# queue item.
#   - `exposure` -- what granting it actually costs the owner in risk. A repo
#     Settings toggle and opening a merchant-of-record account are adjacent
#     rows in a cheapest-first table and are not the same kind of decision.
#
# Read it with:  python3 portfolio/ledger/decision_queue.py
#
# Schema (checked by `decision_queue.py --check` in CI):
#   id           short slug, unique
#   asks         list of #139 ask numbers this decision covers (may be empty)
#   prs          list of pull request numbers this decision relates to --
#                provenance, not liveness. Every one named here was closed by
#                2026-08-27 while the schema still said "open" and the summary
#                line still counted them that way, which made the queue read
#                seven items larger than it was. A decision does not stop
#                being the owner's because its PR closed: `funding-sponsors-
#                live` was merged and then reverted, and is still undecided.
#                So when a PR here closes, re-read the `action` and say what
#                the owner does *now* -- never leave it reading "merge or
#                decline #N", which sends them to a closed page.
#   gates        revenue | distribution | deployment | measurement
#   exposure     none | credential | legal-person
#   opened       "YYYY-MM-DD" the ask first appeared on #139
#   action       the single thing the owner does, stated so it can be done
#                without opening anything else
#   unlocks      what becomes possible, one entry per distinct consequence
#   blocked_by   ids in this file that must be granted first, or [] if none
#   note         provenance and any correction since it was written
#
# Items live under a `decisions:` key rather than at the top level because the
# router globs every *.yaml in this directory as a monthly ledger and reads
# `entries:` off it; a bare list here crashes `allocate.py`.

decisions:

- id: hetzner-ssh-key-is-a-public-key
  asks: []
  prs: [3184]
  gates: deployment
  exposure: credential
  opened: "2026-09-04"
  # Measured, current loss of the public surface: run 33887885219, all three
  # hostnames refusing on 443. See OUTAGE in decision_queue.py for how narrow
  # this flag is meant to be -- it is not a way to say "important".
  outage: true
  runner_free: >-
    `bootstrap/restore-cluster.sh` run from the owner's own machine. It takes
    the SSH key from the local agent and the Argo credential from
    `ARGOCD_REPO_TOKEN` in the environment, so it needs no GitHub Actions
    runner and no repository secret at all. That matters as of 2026-09-05,
    because the workflow route below is deadlocked: every job in
    `hetzner-gitops CI` runs on `${{ vars.CI_RUNNER || 'ubuntu-latest' }}`,
    runner assignment stopped again on 2026-09-04, and the self-hosted
    fallback runs as pods on the very cluster this row exists to restore.
  action: >-
    **Do this from your own machine, not from Settings — as of 2026-09-05 the
    GitHub route cannot work.** Put the private key (the one matching the
    public half already installed on `root@89.167.29.39` and
    `root@157.180.80.188`) and the Argo token into the local secret store
    once, then run the recovery:
    `bootstrap/scripts/load-secrets.sh --put HETZNERSSHKEY < ~/.ssh/<key>`,
    `bootstrap/scripts/load-secrets.sh --put ARGOCD_REPO_TOKEN`, then
    `bootstrap/scripts/load-secrets.sh --exec -- env CONFIRM=restore-cluster
    WITH_CODEX_HOST=1 WITH_GITHUB_RUNNER_HOST=1 WITH_PORTFOLIO_SITE_HOST=1
    SITE_GH_TOKEN=<pat> SITE_TLS_EMAIL=<your address>
    bootstrap/restore-cluster.sh`
    — that is the whole recovery, end to end, and it needs no runner and no
    repository secret. Add `DRY_RUN=1` to the `env` for the plan and the
    detected addressing mode without changing anything.
    **Two more `--put`s are worth making before that run, and as of 2026-09-10
    they finish the job rather than starting a second one.**
    `bootstrap/scripts/load-secrets.sh --put CODEX_AUTH_JSON < ~/.codex/auth.json`
    (after `codex login`, on a machine where you are signed in) and
    `bootstrap/scripts/load-secrets.sh --put RUNNER_TOKEN`. `--exec` exports
    both into the recovery, and `restore-cluster.sh` now hands each one to its
    installer over stdin in the same run — so the Codex worker comes back
    credentialed against your ChatGPT plan's *included* quota, and the
    self-hosted runner comes back registered. Until that change the two steps
    installed and then told you to come back with the SSH key a second time,
    which for the one key every route here is blocked on is the expensive kind
    of friction. `CODEX_AUTH_JSON` is the credential to prefer: `worker.sh`
    resolves it before `OPENAI_API_KEY` and withholds the API key when both are
    present, so a tick on the plan's quota costs nothing extra where a tick on
    the API key is billed per token.
    One deliberate step is still yours afterwards and is not automated on
    purpose: the Codex worker holds until you flip `policy.json`
    (`./bootstrap/scripts/enable-codex-governor.sh --host-only`), commit, and
    re-run the installer. Installing and credentialing are not the same act as
    authorising unattended spend.
    The store is why this is now two pastes and not six: it lives on the
    machine that runs your agents (`infra/SECRETS.md`), so Cursor and a local
    Claude Code session can drive the same recovery without you re-pasting
    anything, and `--exec` holds the credentials in one child process rather
    than in your shell, your history, or `ps`. It also loads the key into a
    throwaway `ssh-agent`, so there is nothing to `ssh-add` first, and
    `bootstrap/scripts/load-secrets.sh` on its own will tell you *before* the
    run whether what you stored is a private key — the check this row exists
    because nobody could make.
    The older form still works if you prefer it:
    `CONFIRM=restore-cluster ARGOCD_REPO_TOKEN=<pat> WITH_CODEX_HOST=1
    WITH_GITHUB_RUNNER_HOST=1 bootstrap/restore-cluster.sh`, with the key in
    your own SSH agent.
    `WITH_CODEX_HOST=1` is optional and worth taking while you are already
    holding the key. It installs the Codex worker's systemd-timer scheduler
    (`gitops/agents/host/`) on the agent box: the same governor, running with
    no k3s underneath it. When this cluster died it took the worker's only
    scheduler with it, and the fallback — self-hosted runners in `gitops/ci/`
    — died too, because those run as pods in this same cluster. That step is
    what makes the *next* cluster loss survivable instead of another week with
    nowhere to run anything. It runs last, cannot fail the restore, and
    enables nothing: the policy still ships `"enabled": false`, so it holds
    until credentials and the switch arrive.
    Changed 2026-09-06, and it matters for the run you are about to make: the
    three host-mode steps now also run when the **cluster** restore fails.
    They used to sit after `set -euo pipefail`, so a fault anywhere in the k3s
    rebuild ended the script before them — and none of the three needs k3s.
    Nobody has ever executed this script against these boxes and the private
    network was never applied, so the addressing steps are its least-proven
    part; the shape that was waiting was a run that dies at node readiness and
    hands you no cluster, no Codex worker, no runner and no public surface,
    with the key in your hand for all four. Now a partial failure still leaves
    you the capacity that never depended on what broke. The script still exits
    non-zero — it tells you the cluster failed and reports each host-mode step
    on its own terms — and every host-mode installer is idempotent, so
    re-running after you fix the cluster fault costs nothing.
    `WITH_GITHUB_RUNNER_HOST=1` is the same fix for the *other* tenant of that
    same cluster: `gitops/ci/`'s self-hosted Actions runners also run as pods
    there, so metered-CI insurance was equally downstream of this outage. It
    installs a GitHub Actions runner as a systemd service on the agent box
    (`gitops/ci/host/`) — no k3s, no Argo, no image pull — and registers with
    GitHub only once you hand it a registration-token PAT via
    `--credentials`; add it while you are already holding the SSH key, for the
    same reason as the Codex step. The `<pat>` is a
    fine-grained PAT with **Contents: Read** on this repository; the script
    masks it and ships it to the box as a mode-600 file rather than putting it
    in argv. Without it the restore *succeeds and the site stays dark*, which
    is the worst outcome available here — the GitOps repository is private, so
    Argo CD would install, apply the root Application, and then fail every
    sync on repository authentication with no error anywhere except Argo's own
    Application status. It cannot be a sealed secret, because sealed-secrets
    is itself deployed by Argo from `gitops/apps` — the credential has to
    exist before the first sync it enables. The same token works for the
    `portfolio-site-repo` seal, so one PAT covers both.
    `WITH_PORTFOLIO_SITE_HOST=1` is the one whose result a stranger can see,
    and it was added on 2026-09-06 (#3468). The two flags above restore what
    *builds*; this restores what *serves* — the portfolio site out of the
    control-plane box's own nginx (`gitops/prod/host/`), downstream of neither
    k3s, Argo, nor a Pages runner. Without it the recovery can finish every
    other step and still leave a visitor to `marisstella.dev` on a refused
    connection. `SITE_GH_TOKEN` is the **same PAT** as above (Contents: Read),
    and unlike the other two this step needs it up front rather than after: the
    origin is private, so the deploy checkout cannot be cloned without it, and
    the step skips rather than half-installing. It reaches the box over stdin,
    never argv. `SITE_TLS_EMAIL` is optional — without it the site serves over
    HTTP and you add the certificate later with `--tls`. Note what running it
    means: on a domain whose DNS already points here, this **is** the decision
    to publish under the portfolio's public name. That is the intent; there is
    deliberately no second gate after it.
    **You do not have to rebuild the cluster to get that one.** Added
    2026-09-10: `bootstrap/scripts/setup-portfolio-site-from-laptop.sh` runs
    the site step on its own, from your machine, in one command — the same
    shape as the Codex and runner drivers, which had one and this route did
    not. It needs no k3s, no Argo and no runner, so it is not downstream of
    the least-proven part of the restore above (the addressing steps). If the
    only thing you want today is `marisstella.dev` answering, run that instead
    and skip the rest; the full recovery stays the right call when you want
    the dev capacity and CI back in the same pass.
    **The GitHub route, for when runners come back:** paste that same private
    key as the Actions secret `HETZNERSSHKEY` (the whole file, `-----BEGIN
    OPENSSH PRIVATE KEY-----` through `-----END …-----`) and the PAT as
    `ARGOCDREPOTOKEN`, then dispatch `hetzner-gitops CI` with `preflight:
    true` to confirm, and again with `restore: restore-cluster`. It reaches
    the same script, and, as of 2026-09-06 (#3543), the same host-mode flags:
    the dispatch form itself now carries `with_codex_host`,
    `with_github_runner_host`, `with_portfolio_site_host` and `site_tls_email`
    inputs, forwarded into the script's env exactly as the laptop route's
    env vars are — tick the boxes you want on the one `restore` dispatch
    rather than re-running it. Before #3543 this route could only ever reach
    steps 1-8 (the k3s/Argo restore): the three flags above existed in the
    script but had no workflow_dispatch input and were never forwarded, so a
    dispatch from here alone left the Codex worker, the self-hosted runner
    and the portfolio site all uninstalled regardless of what was ticked.
    It is worth doing eventually so the recovery is repeatable without a
    laptop, but it buys nothing today: both dispatches return `runner_id: 0`.
    **Why this row was rewritten on 2026-09-05:** it used to lead with the
    Settings route and declared no prerequisites, so the queue rendered it
    `up` and the banner named it as the one row that "can be granted now and
    will change something". Every route it described needed a runner. An owner
    acting on it would have pasted a private key into Settings and then
    watched both dispatches come back `runner_id: 0` — the identical mistake
    `infra_state.yaml` was written to prevent, one row above the row it was
    written about. `check()` now refuses a row whose action says to dispatch a
    workflow unless it declares the dependency or names a runner-free route.
    What did not change is the shape of the recovery:
    `bootstrap/restore-cluster.sh` does it end to end (server,
    agent join, Argo CD, then a Host-header curl for what the apex actually
    returns), refuses to start without the typed confirmation, and never
    overwrites a cluster that is already there. It touches no Hetzner API, so
    the read-only token policy is untouched. It also fixes a trap nobody had
    hit yet, because nobody had got far enough to hit it: the *documented*
    order does not work today. `install-k3s-server.sh` defaults
    `ADVERTISE_IP` to `10.10.0.10` and `install-k3s-agent.sh` defaults
    `SERVER_URL` to `https://10.10.0.10:6443` — addresses on a private network
    `infra/inventory.tf:53` records was **never applied** (`tofu` cannot
    create it with a read-only token), so the server install would have burned
    its 180-second readiness wait and exited 1 while the agent retried a join
    against an address on no interface. The script probes for the NIC and
    falls back to public addressing with `flannel-backend=wireguard-native`,
    so node-to-node traffic is still encrypted.
    **Measured, not inferred:** that dispatch on 2026-09-04 (run 33884253173,
    job 101060068559) exits in under a second on the workflow's own format
    classifier — `HETZNERSSHKEY holds a public key, not a private key` — so
    the preflight has never produced a single reading, and every "SSH to the
    boxes and see" instruction in this repo has been unfollowable since it was
    written. The workflow already normalises literal `\n` escapes and CRLF, so
    a plain paste is fine; the failure is the key half, not the formatting.
    **Re-ranked to first, hours after this row was written, by the measurement
    the same PR made possible.** It said "deliberately ranked below the two
    seals ... this one only lets us look inside a cluster that is already
    serving". The cluster is not already serving. `Public surface check` (run
    33887885219) got `Connection refused` from all three hostnames and 0 of 24
    sampled sitemap URLs — DNS resolves and the IP answers, but nothing is
    listening on 443. So this row is no longer diagnosis-of-a-healthy-system;
    it is the only way to find out why the portfolio's entire public surface
    is down, and `portfolio-site-repo` now ranks *below* it (sealing a clone
    token for a cluster that serves nothing changes nothing a stranger can
    see). Do this one first.
    **Confirmed sufficient 2026-09-04 by `Outage triage` (run 33889983086,
    PR #3188) — this row is no longer a hopeful ask.** A key rotation would
    have bought nothing had sshd been down, and nothing had checked. It is up:
    port 22 accepts connections on both boxes, so the rotated key will get in.
    The same run ruled out every cheaper cause — both servers report `running`
    to the Hetzner read API, and all three hostnames resolve to
    `89.167.29.39`, which is ours — so this is not a power, DNS, firewall or
    TLS problem, and no console visit is needed. **6443 is refused on the
    control plane**, which sharpens the hypothesis before anyone logs in: the
    k3s API server itself is not listening, so this is not a crashed ingress
    but an absent or dead cluster, and no pods exist to serve 80 or 443.
    **Sharpened again 2026-09-04 by PR #3195, and this changes what you should
    expect to find.** `Outage triage` now reads the Hetzner *action log*
    (read-only, same token), which no session had ever queried. Both machines
    return nothing but their own creation burst — `create_server`,
    `enable_backup` and the `start_server` that first boots them, all inside
    fifteen seconds, on 2026-08-24T11:15Z and 2026-08-25T15:29Z. There has
    been **no reboot, no rebuild and no rescue boot on either box since it was
    created**. So k3s did not fail to survive a restart: there has been no
    restart. Combined with this row's own finding — `bootstrap/` is the only
    documented install path, it needs SSH, and `HETZNERSSHKEY` has never held
    a usable key — the leading hypothesis is now that **k3s was never
    installed and the public surface has never once been up**, rather than
    that a working catalogue went dark. Expect a **first bootstrap**, not a
    repair. `ls -l /etc/rancher/k3s/k3s.yaml` settles it in one line the
    moment SSH works; absent means run `bootstrap/install-k3s-server.sh` then
    `install-argocd.sh`, and Argo takes it from there.
  unlocks:
    - "**The portfolio's entire public surface.** Measured 2026-09-04: all three hostnames refuse connections on 443 and 0 of 24 sampled sitemap URLs return anything, so none of the ~184 finished products is reachable by anyone. `Public surface check` detects the outage; `Outage triage` narrows it to a dead k3s on a healthy, powered-on, correctly-addressed box. **'Only SSH can say why k3s is dead' was too strong (corrected #3195):** the Hetzner action log says both boxes have been untouched since creation — no reboot, no rebuild — which eliminates 'k3s did not come back from a restart' without a shell and makes 'never installed' the leading hypothesis. SSH is still what confirms it and what runs the install."
    - "`bootstrap/preflight.sh`'s cluster half — pod state in `prod`, whether k3s is healthy, whether the private NIC is up, disk and node conditions. None of that is observable from outside, and none of it has ever been read. Its own output distinguishes the two live hypotheses in one run: `no /etc/rancher/k3s/k3s.yaml` means the cluster was never installed, while a running k3s with no `prod` pods means it was and something evicted or crash-looped them. The 6443 reading above already favours the first."
    - "#3186 raised a third candidate — a healthy cluster with the fault in front of it (the ingress, a load balancer, or DNS at the node) — and was right that `Connection refused` alone does not choose between the three. #3188 measured it away rather than argued it away: DNS resolves to our own address, both servers report `running`, and :6443 is refused on the control plane itself, which no fault *in front of* a healthy cluster produces. Kept here because the reasoning is the reusable part — a bare status code never picks a cause, and the fix was to go and take a second reading."
  blocked_by: []
  note: >-
    Found by dispatching the preflight rather than by reading anything — no
    document in the repo recorded this, and three of them (`OWNER_CHECKLIST`,
    `bootstrap/README`, `infra/README`) actively said the dispatch was
    available. All three corrected in the same change that opened this row.
    The owner was debugging exactly this on 2026-08-24 via the one-shot
    `tmp/ssh-key-smoke` branch; that diagnostic was folded into the preflight
    job afterwards and then nobody dispatched it again, so the secret has sat
    wrong for eleven days with the repo asserting otherwise.

    **Not a one-off blip, as of 2026-09-04.** The `action` above cites the
    first `Public surface check` run (33887885219); it has since run twice
    more (33888988972, 33888990022), independently `workflow_dispatch`ed,
    same result each time — all three hostnames `Connection refused`. Three
    consistent readings rule out a transient network hiccup at measurement
    time; they don't yet distinguish which of the causes `unlocks` above
    lists. `HETZNERSSHKEY` was still the wrong half of the keypair as of the
    third run. Rerun `Public surface check` (`workflow_dispatch`, no inputs)
    to see if this has since self-resolved before assuming it is still down.

- id: actions-runners-unavailable
  asks: []
  prs: [1842, 2021, 2022]
  gates: deployment
  exposure: credential
  opened: "2026-08-26"
  action: >-
    **Live again as of 2026-09-05, and it is now the widest blocker in this
    queue.** Measured, not inferred: run 33932676830 (`Portfolio validate`,
    00:20:57Z today) came back `runner_id: 0` with no steps, and
    `python3 platform/ci/ci_starvation.py --run 33932676830` exits 1. Every
    check on the PR merged this morning was red for that reason and none of
    them was a real failure. **Do not read the paragraph this replaced.** It
    said "nothing is blocked on you here as of 2026-09-01 — this row is now
    optional", which was true when written and stopped being true on
    2026-09-04 at roughly 22:39Z, when starvation recurred mid-session
    exactly as `gitops/ci/README.md` predicted it would once the metered
    allowance was spent again. A row that announces its own irrelevance ages
    the most dangerously of any row here, because nobody re-reads it.
    What is blocked on this: the GitHub route in
    `hetzner-ssh-key-is-a-public-key`, all of `deploy-settings`, and the
    self-hosted fallback in `gitops/ci/` (its runners are pods on the dead
    cluster, so it cannot substitute). The one route out that needs no runner
    is the laptop command in `hetzner-ssh-key-is-a-public-key` —
    prefer it to waiting for this row. If the August window is a guide, the
    allowance resets on 2026-10-01; the owner can lift it sooner from
    Settings → Billing.
    For history, the earlier recovery really did happen on its own: GitHub
    started assigning real runners again at 2026-09-01T00:00:53Z, recent runs
    then carried runner ids in the `1000040xxx` range, and #2601 that evening
    was the first PR in five days to go green on merit (`gitops` executed
    `kustomize build`, `kubeconform` and 193 pytest cases). So option (a)
    below — checking Settings → Billing → Spending limit for Actions — had
    resolved itself, most likely a monthly allowance reset, and CI is
    working today with no action from you. If you want to spend two
    minutes on it anyway, confirming the payment method is current is the
    thing that keeps the next cycle from happening. Option (b) is the one
    still worth doing eventually, and it is now insurance rather than a
    fix: the self-hosted-runner path #2021/#2022 already shipped on
    hardware you already pay for — seal `actions-runner-secrets` (a
    fine-grained PAT, Administration: Read and write) per
    `gitops/ci/secrets/actions-runner-token.template.yaml`, then set repo
    variable `CI_RUNNER=self-hosted`. Self-hosted runners are not metered,
    so that makes the next allowance cycle a non-event. Typed out as
    owner-checklist item 9 in `infra/OWNER_CHECKLIST.md`; details in
    `gitops/ci/README.md`. **Do this after the two seals that are actually
    blocking** (`portfolio-site-repo` and `codex-secrets`), not before —
    while CI was dark this row was told to sessions as the thing to
    escalate, and it was competing for your attention with the seal that
    stands between the portfolio and a live site.
  unlocks:
    - "**Durability of the fleet's verification, not its existence.** `Portfolio validate`, `Conflict markers`, `duplicate-symbols-ci`, `agent-permission-harness CI` and the Pages build all run again as of 2026-09-01, so merges are no longer landing on local verification alone. What this row still buys is that they keep running through the next allowance cycle instead of going dark again."
    - "The Pages build that `deploy-settings` would publish. This ask no longer gates that one in practice — a runner will build the artifact today. (It did gate it from 2026-08-26 to 2026-09-01.)"
  blocked_by: []
  note: >-
    Recorded as a queue item on 2026-08-27, having been reported only on
    #1842 and in the 2026-08 ledger until then. It belongs here because it
    is owner-only and because it silently weakens every other row: a granted
    ask still cannot ship if nothing can build.


    Updated 2026-08-29: #2021/#2022 shipped the self-hosted-runner
    alternative (all 242 `runs-on` lines across 217 workflows now read
    `${{ vars.CI_RUNNER || 'ubuntu-latest' }}`, gated behind one unset repo
    variable) — see the 2026-08 ledger entry for #2023. This row previously
    named only the billing path and read as though nothing else could be
    done; it can now be closed by whichever unblock the owner prefers
    without waiting on the other.


    Why it reads as normal and is not. `AGENTS.md` already warns that bot
    pull requests opened with `GITHUB_TOKEN` show *zero* checks, so a session
    is trained to treat a blank check list as expected and verify locally.
    This outage looks identical at a glance and is not the same thing: these
    runs exist, were scheduled, and failed before their first step. A run
    that dies with no runner is not a red test and not an absent check —
    it is no signal at all.


    Cost while it stands, measured 2026-08-27T02:41Z: 4.5 hours, 72 commits
    merged to `main` with no workflow having run on any of them. That number
    only grows, and none of it is recoverable after the fact — the guards
    cannot be replayed against history. Until it clears, run the workflows'
    own commands locally before merging and say in the pull request exactly
    what was run, which is what the merges in this window have been doing.

- id: routine-trigger-cadence
  asks: []
  prs: [788]
  gates: deployment
  exposure: none
  opened: "2026-08-24"
  # The whole row is about how often a GitHub Actions workflow fires, and a
  # scheduled workflow is starved exactly as a dispatched one is. Deciding the
  # cadence while nothing can run is deciding the speed of a stopped clock.
  requires: [github-actions-runners]
  action: >-
    Decide whether the 4-minute routine cadence runs, now that the merge half
    is already done: #788 landed on 2026-08-24 and
    `.github/workflows/claude-routine-trigger.yml` is on `main` today.

    **Corrected 2026-09-01: the secret already exists, and its token is
    revoked.** This row said until 2026-09-01 that the secret was unset and
    every run "fails on its first step for want of the secret -- the safe
    state, but a noisy one". That is not what is happening. Read from the job
    log of run 33547527610 (job 99988623632): the step's env shows
    `CLAUDE_TRIGGER_API_KEY: ***`, i.e. the secret is set and masked, and the
    request reaches the API and comes back `HTTP 401 ...
    {"type":"authentication_error","message":"OAuth access token has been
    revoked."}`. An unset value would have exited at the workflow's own
    preflight check (its `-z` guard on the key) before any request, and does not.

    So the choice is now between: **yes**, mint a fresh token on the routine's
    API trigger at https://claude.ai/code/routines and update the existing
    `CLAUDETRIGGERAPIKEY` secret (Settings -> Secrets and variables ->
    Actions), accepting the spend below; or **no**, delete the workflow file,
    which no session may do on its own because the owner requested it.

    **Magnitude corrected 2026-09-01 (second correction, measured).** This
    row said "~360 fires a day are each making a real API call on a real
    runner and getting 401 -- burning Actions minutes on the metered
    allowance whose exhaustion caused the 2026-08-26 starvation window". The
    direction is right and the cost is real, but both figures were about 5x
    and 17x too high, because they assume the run loops. It does not. On 401
    `fire()` returns 2, and the loop's `case` does `2) exit 1` on that value
    (the `2) exit 1` arm of the loop's `case`), so the run aborts on its *first* fire and
    never reaches the four remaining slots or their 240s sleeps.

    Measured, not inferred: five consecutive runs (33553452882, 33551039615,
    33549288450, 33547527610, 33545549251) each ran a single `fire` job for
    **2-3 seconds** on a real runner, `ci_starvation.py --run` exit 0 on
    each. A 5-fire loop would occupy ~16 minutes. So the standing waste is
    **72 API calls a day, not 360** (one per run at `*/20`), and **~72 billed
    Actions minutes a day** (GitHub rounds each job up to the minute) --
    roughly 2,200 minutes, on the order of **$17** a month, against the
    ~37,000 minutes / ~$300 the `unlocks` figure below quotes. That figure is
    not wrong; it describes the *working* state, which is what a fresh token
    would buy. Nothing fires today, so the Claude-side spend and the daily
    routine-run cap are both untouched at zero.

    What survives the correction: it is not free, and it is the standing
    counter-example to "CI is green" -- every scheduled run has been red on
    its own merits since the token was revoked, with no exception yet
    (a fixed run count is not recorded here on purpose: this row is meant to
    stay accurate as the count keeps climbing, not to be re-edited every time
    it does). What does not survive: any reading of this row as an
    urgent drain on the allowance whose exhaustion went dark on 2026-08-26.
    At ~$17/month it is affordable to leave red while the owner decides,
    which is the difference between "delete this today" and "answer it when
    you get to it".

    **The spend and the noise both stopped on 2026-09-02; the decision did
    not.** The `fire` job now carries
    `if: github.event_name == 'workflow_dispatch' || vars.ROUTINE_TRIGGER_ENABLED
    == 'true'`, and the repository variable is unset, so a scheduled run is
    skipped before a runner is assigned -- no minute billed, no red check. The
    workflow file is untouched otherwise and `workflow_dispatch` still runs
    unconditionally, so a fresh token can be tested from the Actions tab
    without flipping anything.

    Read that as the bleeding stopped, not the question answered. **Yes** is
    now three steps rather than one: mint the token, update
    `CLAUDETRIGGERAPIKEY`, dispatch the workflow once to confirm it reports
    `fired:`, then set the variable `ROUTINE_TRIGGER_ENABLED` to `true` under
    Settings -> Secrets and variables -> Actions -> Variables. The variable is
    last on purpose -- it is what re-arms the schedule, and re-arming it before
    the token works just restores the old burn. **No** is unchanged and still
    the owner's alone: delete the workflow file. Leaving it exactly as it is
    now is a third, cost-free option this row did not previously have.
  unlocks:
