# The account owner's decision queue, as data.
#
# Every item here is `CLAUDE.md`-human-gated: it needs a legal person, creates
# an ongoing outside effect, or both. No session may decide one. This file
# exists so a session can *read* the queue without re-deriving it, and so the
# owner can read it without scrolling.
#
# Why a file and not issue #139. #139 is the living tracker and remains the
# place the owner answers. But its body is ~82KB of prose, rewritten in place
# by whichever session edits last -- and on 2026-08-24 two concurrent sessions
# clobbered it twice in one day (recorded in #697, #698). A queue that two
# agents can corrupt in an afternoon is not a queue the owner can trust. Git
# merges concurrent edits; an issue body does not. So the *structure* of the
# queue lives here, under review, and #139 keeps the discussion.
#
# What this file adds that the #139 asks table does not. That table is sorted
# cheapest-first, which `break-even.md` already faulted for burying the only
# ask that unlocks any revenue. Two axes it does not carry at all:
#
#   - `blocked_by` -- three of the asks cannot do anything if granted today,
#     because a different ask gates them. `CLAUDE.md` states this for Ask 5 in
#     prose ("Ask 5 is currently inert") and the table still lists it as
#     available to grant.
#
# Ask 8 is deliberately absent: `break-even.md` superseded it.
# The 2026-08-24 "may agents merge product PRs?" row is gone: answered yes
# on 2026-08-25. Do not put it back. Product PRs merge; they are not a
# queue item.
# Rows `hetzner-ssh-key-is-a-public-key`, `codex-governor-enable` and
# `portfolio-site-hetzner-deploy` are gone: the owner deleted the Hetzner
# servers (89.167.29.39, 157.180.80.188) on 2026-10-01, so the k3s/Argo
# cluster route is retired, not down. Do not put them back or ask for
# HETZNERSSHKEY; GitHub Pages is the only host.
# Rows `egress-policy` and `session-gate-economics-premise` are gone:
# answered by the owner on 2026-10-31. Egress: "absolutely fine" to the
# read-only list, and the same day's re-probe found 94 of 98 hosts already
# reachable (`portfolio/research/egress-reachability/results-2026-10-31.json`).
# Billing: "flat subscriptions on but with limits on usage. but the 16 agent
# runs per hour 24/7 hits limits basically exactly if every run does
# something. undershoots if the runs slack." So BUILD (#813) stands, and an
# idle run wastes capacity rather than saving money. Do not put them back.
# Also answered by the owner on 2026-10-31, rows gone, do not put them back:
#   - `local-site-studio-subtree-gate-crossing`: #731 accepted as merged
#     ("that was fine at the time").
#   - `branch-cleanup-automation`: #829 accepted ("seems reasonable ... keeps
#     from massive ballooning of branches"). A closed PR's commits stay
#     reachable from the PR page, so deleting its head branch loses nothing.
#   - `agent-cross-review-automerge`: not turned on. The owner prefers review
#     driven by prompts and scheduled sessions, and "generally having api
#     token billing running in actions is not ideal at the moment. not a
#     permanent rule just not the current method." The workflows stay inert.
#   - `routine-trigger-cadence`: "delete is fine". The workflow was deleted
#     in the control-plane PR that amended `goals.md` the same day; what is
#     left for the owner is removing the `CLAUDETRIGGERAPIKEY` secret and the
#     routine's API trigger.
#   - `deploy-settings`: the owner confirmed the old GitHub Pages address
#     redirects to marisstella.app.
# Row `print-atelier-stripe-checkout` is gone: the owner's 2026-10-15 rule
# answers it (payment code is fine off by default on the deployer's keys;
# `PRODUCT_PLAYBOOK.md` §6). Its Stripe code already works that way.
#   - `exposure` -- what granting it actually costs the owner in risk. A repo
#     Settings toggle and opening a merchant-of-record account are adjacent
#     rows in a cheapest-first table and are not the same kind of decision.
#
# Read it with:  python3 portfolio/ledger/decision_queue.py
#
# Schema (checked by `decision_queue.py --check` in CI):
#   id           short slug, unique
#   asks         list of #139 ask numbers this decision covers (may be empty)
#   prs          list of pull request numbers this decision relates to --
#                provenance, not liveness. Every one named here was closed by
#                2026-08-27 while the schema still said "open" and the summary
#                line still counted them that way, which made the queue read
#                seven items larger than it was. A decision does not stop
#                being the owner's because its PR closed: `funding-sponsors-
#                live` was merged and then reverted, and is still undecided.
#                So when a PR here closes, re-read the `action` and say what
#                the owner does *now* -- never leave it reading "merge or
#                decline #N", which sends them to a closed page.
#   gates        revenue | distribution | deployment | measurement
#   exposure     none | credential | legal-person
#   opened       "YYYY-MM-DD" the ask first appeared on #139
#   action       the single thing the owner does, stated so it can be done
#                without opening anything else
#   unlocks      what becomes possible, one entry per distinct consequence
#   blocked_by   ids in this file that must be granted first, or [] if none
#   note         provenance and any correction since it was written
#
# Items live under a `decisions:` key rather than at the top level because the
# router globs every *.yaml in this directory as a monthly ledger and reads
# `entries:` off it; a bare list here crashes `allocate.py`.

decisions:

- id: private-monorepo-clone
  asks: []
  prs: [18882]
  gates: deployment
  exposure: none
  opened: "2026-11-25"
  action: >-
    Scheduled sessions attach private-monorepo with add_repo, then the
    session's permission classifier refuses the `git clone` about two times
    in three (28 of 42 run records on 2026-11-25 that mention the repo), so
    those runs cannot touch the bets' product code. Fix once, in the
    scheduled routine's environment settings on claude.ai/code: add
    Duncan-Haywood/private-monorepo as a source repository so it is cloned
    at container start (or add a permission allow rule for that one clone
    command). Agents do not grant themselves this permission.
  unlocks:
    - >-
      Every venture run can build the ranked bets (payapps, jobshop-quote,
      ...) in private-monorepo instead of falling back to their public
      pages, which crowded four parallel runs into pay-app-guides in one
      hour on 2026-11-25.
  blocked_by: []
  note: >-
    Added 2026-11-25 by a process run (backlog P076). Count from
    prompts/runs/2026-11-25-*.json: records naming private-monorepo whose
    text says the clone was refused, denied or blocked. No money, no new
    account, reversible.

