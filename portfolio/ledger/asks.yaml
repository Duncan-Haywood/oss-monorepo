  blocked_by: []
  note: >-
    Originally grouped as two repository settings the owner changes in one
    sitting, with no third party and no ongoing spend. **That description no
    longer fits this row and is retained only as history** -- corrected after
    review, which caught it contradicting the action above. The action now buys
