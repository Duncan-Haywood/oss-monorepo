# The account owner's decision queue, as data.
#
# Every item here is `CLAUDE.md`-human-gated: it needs a legal person, creates
# an ongoing outside effect, or both. No session may decide one. This file
# exists so a session can *read* the queue without re-deriving it, and so the
# owner can read it without scrolling.
#
# Why a file and not issue #139. #139 is the living tracker and remains the
# place the owner answers. But its body is ~82KB of prose, rewritten in place
# by whichever session edits last -- and on 2026-08-24 two concurrent sessions
# clobbered it twice in one day (recorded in #697, #698). A queue that two
# agents can corrupt in an afternoon is not a queue the owner can trust. Git
# merges concurrent edits; an issue body does not. So the *structure* of the
# queue lives here, under review, and #139 keeps the discussion.
#
# What this file adds that the #139 asks table does not. That table is sorted
# cheapest-first, which `break-even.md` already faulted for burying the only
# ask that unlocks any revenue. Two axes it does not carry at all:
#
#   - `blocked_by` -- three of the asks cannot do anything if granted today,
#     because a different ask gates them. `CLAUDE.md` states this for Ask 5 in
#     prose ("Ask 5 is currently inert") and the table still lists it as
#     available to grant.
#
# Ask 8 is deliberately absent: `break-even.md` superseded it.
# The 2026-08-24 "may agents merge product PRs?" row is gone: answered yes
# on 2026-08-25. Do not put it back. Product PRs merge; they are not a
# queue item.
# Rows `hetzner-ssh-key-is-a-public-key`, `codex-governor-enable` and
# `portfolio-site-hetzner-deploy` are gone: the owner deleted the Hetzner
# servers (89.167.29.39, 157.180.80.188) on 2026-10-01, so the k3s/Argo
# cluster route is retired, not down. Do not put them back or ask for
# HETZNERSSHKEY; GitHub Pages is the only host.
# Rows `egress-policy` and `session-gate-economics-premise` are gone:
# answered by the owner on 2026-10-31. Egress: "absolutely fine" to the
# read-only list, and the same day's re-probe found 94 of 98 hosts already
# reachable (`portfolio/research/egress-reachability/results-2026-10-31.json`).
# Billing: "flat subscriptions on but with limits on usage. but the 16 agent
# runs per hour 24/7 hits limits basically exactly if every run does
# something. undershoots if the runs slack." So BUILD (#813) stands, and an
# idle run wastes capacity rather than saving money. Do not put them back.
# Also answered by the owner on 2026-10-31, rows gone, do not put them back:
#   - `local-site-studio-subtree-gate-crossing`: #731 accepted as merged
#     ("that was fine at the time").
#   - `branch-cleanup-automation`: #829 accepted ("seems reasonable ... keeps
#     from massive ballooning of branches"). A closed PR's commits stay
#     reachable from the PR page, so deleting its head branch loses nothing.
#   - `agent-cross-review-automerge`: not turned on. The owner prefers review
#     driven by prompts and scheduled sessions, and "generally having api
#     token billing running in actions is not ideal at the moment. not a
#     permanent rule just not the current method." The workflows stay inert.
#   - `routine-trigger-cadence`: "delete is fine". The workflow was deleted
#     in the control-plane PR that amended `goals.md` the same day; what is
#     left for the owner is removing the `CLAUDETRIGGERAPIKEY` secret and the
#     routine's API trigger.
#   - `deploy-settings`: the owner confirmed the old GitHub Pages address
#     redirects to marisstella.app.
# Rows gone 2026-11-27, answered by the owner; do not put them back:
#   - `private-actions-billing`: the owner will not change the GitHub
#     account ("not happening", 2026-11-26, private-monorepo
#     docs/ci-on-aws.md). Two routes replace it: CodeBuild runners on AWS
#     (platform/aws/stacks/ci-runners, live after aws-turnover steps 1-4) and
#     moving the apps into this public repository, whose Actions minutes are
#     free (task products-to-public-repo). Both are agent work.
#   - `private-monorepo-clone`: "migrate this to public oss one instead"
#     (owner, 2026-11-27). Same task, products-to-public-repo.
# Rows `agent-inboxes-secrets`, `web-analytics-token` and
# `publication-identity` are gone: answered by the owner on 2026-11-27.
# Inboxes and analytics: "all iac stuff instead we will do on aws instead
# once we fully move" and "we will set up more in depth there" -- both move
# into `aws-turnover` (SES receives mail; analytics are built on AWS). Do not
# ask for the Cloudflare MAIL_* secrets, the Cloudflare token's email or Web
# Analytics permissions, or a site token again. Publication identity: dropped
# ("more side project"); registry listings reach developers, none of the
# ranked bets in `portfolio/monetization/bets.md` sells to developers, and the
# row's own estimate was $16-$145/month. No registry signup, GitHub App
# permission change or free-listing approval is pending; do not put it back
# unless a ranked bet needs a registry to reach its buyers.
# Row `print-atelier-stripe-checkout` is gone: the owner's 2026-10-15 rule
# answers it (payment code is fine off by default on the deployer's keys;
# `PRODUCT_PLAYBOOK.md` §6). Its Stripe code already works that way.
#   - `exposure` -- what granting it actually costs the owner in risk. A repo
#     Settings toggle and opening a merchant-of-record account are adjacent
#     rows in a cheapest-first table and are not the same kind of decision.
#
# Read it with:  python3 portfolio/ledger/decision_queue.py
#
# Schema (checked by `decision_queue.py --check` in CI):
#   id           short slug, unique
#   asks         list of #139 ask numbers this decision covers (may be empty)
#   prs          list of pull request numbers this decision relates to --
#                provenance, not liveness. Every one named here was closed by
#                2026-08-27 while the schema still said "open" and the summary
#                line still counted them that way, which made the queue read
#                seven items larger than it was. A decision does not stop
#                being the owner's because its PR closed: `funding-sponsors-
#                live` was merged and then reverted, and is still undecided.
#                So when a PR here closes, re-read the `action` and say what
#                the owner does *now* -- never leave it reading "merge or
#                decline #N", which sends them to a closed page.
#   gates        revenue | distribution | deployment | measurement
#   exposure     none | credential | legal-person
#   opened       "YYYY-MM-DD" the ask first appeared on #139
#   action       the single thing the owner does, stated so it can be done
#                without opening anything else
#   unlocks      what becomes possible, one entry per distinct consequence
#   blocked_by   ids in this file that must be granted first, or [] if none
#   note         provenance and any correction since it was written
#
# Items live under a `decisions:` key rather than at the top level because the
# router globs every *.yaml in this directory as a monthly ledger and reads
# `entries:` off it; a bare list here crashes `allocate.py`.

decisions:

- id: payout-rail
  asks: [2]
  prs: []
  gates: revenue
  exposure: legal-person
  opened: "2026-08-19"
  action: >-
    **Rail open 2026-11-24: Paddle** (owner: "we have payment rails thorugh
    paddle now"). Products and prices are code since 2026-11-25
    (Duncan-Haywood/private-monorepo#36, merged): each app commits a catalog file and
    its production deploy creates them in Paddle with the key already in
    Actions secrets, then reads the price ids back. What is left is yours,
    once per account, not per product: (1) Paddle account verification (the
    domain review wants a live pricing page, terms, privacy and refund
    policy); (2) give the API key product and price read and write
    permissions, plus an expiry. Switching on live checkout is no longer
    yours: owner, 2026-11-26, agents may do it once a product's plans clear
    the margin floor and its PR records a thorough review (`prompts/goals.md`,
    "2026-11-26: agents approve launch"). Operator: Maris Stella Labs LLC,
    Colorado. Webhook destinations can be automated the same way next.
  unlocks:
    - >-
      The only thing that moves the revenue ceiling off $0. Every other item in
      this file changes what is measurable, listed, or deployed; none of them
      lets the portfolio take a dollar.
  blocked_by: []
  note: >-
    Owner, 2026-10-31: "its time to add payout rail of some sort. merchant of
    record sounds fine to me." That answers the binary in `break-even.md` in
    the earning direction. The row stays open because creating the account
    needs a legal person, ID and a bank, which no session may supply. The
    API hosts of all four candidates (`api.polar.sh`, `api.lemonsqueezy.com`,
    `api.paddle.com`, `api.stripe.com`) answered from a session on 2026-10-31,
    so "the egress entry it needs" is no longer needed. The key-safety design
    stays `docs/reports/2026-10-30-billing-plan.md`, Option A: hosted
    checkout, no live key anywhere this repo or its agents can reach.
- id: search-engine-verification
  asks: []
  prs: [12907]
  gates: distribution
  exposure: none
  opened: "2026-11-03"
  action: >-
    Prove to Google and Bing that you own https://marisstella.app/, then hand
    them the sitemap. (1) Google Search Console, https://search.google.com/search-console:
    add a URL-prefix property for https://marisstella.app/, pick the "HTML tag"
    method, and paste only the `content="..."` value into the `google` list in
    `platform/seo/site-verification.json` (or give it to any agent session).
    Merging deploys the tag to the home page; then press Verify, and under
    Sitemaps submit `sitemap.xml`. A Domain property verified by a DNS TXT
    record in Cloudflare works as well and needs no file change.
    (2) Bing Webmaster Tools, https://www.bing.com/webmasters: "Import from
    Google Search Console" after step 1 (no token needed), or the meta-tag
    method into the `bing` list. (3) Optional, for the measurement loop: in
    Google Cloud, enable the Search Console API, create a service account, add
    its email as a Restricted user on the property, and store the key JSON as
    the repository secret `GSC_SERVICE_ACCOUNT_JSON`; `platform/seo/probe.py
    gsc` then reads clicks, impressions and position. (4) Repository About ->
    Website: https://marisstella.app/. Tokens are public by design (each
    engine reads them from the live page); the service-account key is a
    secret and goes only in the secrets store. Remove this row once (1) and
    (2) verify.
  unlocks:
    - >-
      Google indexing on purpose instead of by luck. On 2026-11-03 no
      tracked query (8 of 23 run, `platform/seo/history/observations.jsonl`),
      including the brand name and `site:marisstella.app`, returned a single
      marisstella.app page, while the live audit (`probe.py audit`) found no
      blocker: robots allows all, 1,327 child sitemaps, self canonicals, no
      noindex. The site is crawlable and undiscovered. Search Console is the
      only route to Google's own sitemap submission, URL inspection and
      indexing reports; there is no IndexNow for Google.
    - >-
      Bing Webmaster data. Bing's index also serves several AI assistants'
      web search, so it is the cheapest lever on "AI agents find us".
      IndexNow (Bing, Yandex, Seznam, Naver) was submitted by hand on
      2026-11-03 and answered 200, which means "asked", not "indexed".
    - >-
      Real ranking numbers for the feedback loop (`platform/seo/README.md`):
      without Search Console, Google rankings are read only by agent web
      searches, which are a sample, not a measurement.
  blocked_by: []
  note: >-
    Replaces `pages-custom-domain` (opened 2026-09-10), which asked for a
    custom domain; marisstella.app has served the site since 2026-10-30, so
    that row was done. Its history is in git (`git log -p --
    portfolio/ledger/asks.yaml`). No money, no new account beyond a Google and
    Microsoft login the owner already controls, and fully reversible (remove
    the token, delete the property).

- id: aws-turnover
  asks: []
  prs: [18802]
  gates: revenue
  exposure: legal-person
  opened: "2026-11-24"
  action: >-
    The AWS move (owner decision 2026-11-24) needs ten steps that only you
    can take. They are written once, in order, in the "Owner checklist" of
    docs/runbooks/aws-cutover.md: (1) open the AWS account with your card,
    turn on root MFA, give your future login access to billing, and set
    AWS's own spend limit if the console offers one; (2) paste the bootstrap
    into CloudShell; (3) run platform/aws/github/configure.sh and set
    AWS_BUDGET_ALERT_EMAIL; (4) after the first apply, enable IAM Identity
    Center with MFA for yourself; (5) sign up for Claude Platform on AWS and
    set a workspace spend limit; (6) request SES production access when an
    agent says the email checks are green; (7) close the old Anthropic and
    Resend accounts at the end; (8) move DNS to Route 53 when an agent's PR
    shows zero zone differences: a Zone Read token, lower TTLs, check
    DNSSEC and the registrar, then the nameservers; (9) retire Cloudflare;
    (10) apply .github/rulesets/main.json with an admin token so the merge
    gate is required before CI starts applying.
    Steps 1-4 take about an hour and reach the turnover point: after that CI
    applies every stack on merge. Do not create an AWS Organization or
    enable Identity Center before step 3's first apply. This one row covers
    every AWS step; do not add others.
  unlocks:
    - >-
      CI applies every platform/aws stack (organization, security baseline,
      spend guards, LLM, email, DNS, site, edge API) on each merge, so the
      move onto one host can finish without more owner work.
    - >-
      Spend guarded by code from the first apply: anomaly alerts, budgets
      at 50/80/100 %, a freeze SCP at the hard line, and a kill switch for
      the apps and sandbox accounts.
    - >-
      Private-monorepo CI and deploys get runners again: every workflow picks
      a CodeBuild runner once `configure.sh --private-ci` sets
      CODEBUILD_RUNNER (private-monorepo docs/ci-on-aws.md). First in line is
      PayApps (bet #1): its launch review is merged (private-monorepo#444)
      and its deploy (run 45921558751, 2026-11-27) ended with no runner. Then
      every other paid app's deploy and the Paddle catalog sync.
    - >-
      Agent-managed inboxes (hello@, support@, privacy@, billing@) on SES and
      real visitor analytics, both built on AWS (owner, 2026-11-27) in place
      of the dropped Cloudflare rows. Working support and privacy addresses
      are part of what Paddle's domain review in payout-rail looks for.
  blocked_by: []
  note: >-
    Owner, 2026-11-27: working on it now. Added 2026-11-24 by the aws-spend-guards follow-up (PR 18802) after PR
    18749 landed the stacks and the runbook. It costs money: AWS usage is
    billed to your card from step 1, Claude Platform bills through AWS
    Marketplace from step 5, and step 8 may need a paid domain transfer if
    Cloudflare is the registrar. The cloudflare-mail-and-ruleset row's
    Email Routing part becomes moot once SES receives mail; its ruleset
    part does not.
