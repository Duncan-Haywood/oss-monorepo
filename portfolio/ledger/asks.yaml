    from that -- #531's conflict is real and structural, not a plain rebase
    -- is unaffected: reapplying 11 colour-token classes onto a file whose
    pricing now comes from a shared module still means re-deriving which
    classes carry the fix, just against a *better*-structured file than
    before, not a worse one.

