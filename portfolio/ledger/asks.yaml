    The earlier correction is still worth keeping for the record (#696, and
    #139 comment 5389301893): Ask 6 as originally written described a *failing*
    deploy; it became a silently-skipped one, which is worse for the record and
    unchanged for the site. Sequenced after `egress-policy` in the printed
    queue only because it buys deployment capability rather than measurement --
    nothing blocks it.


    Narrowed 2026-08-24 from a menu to one step. This row previously offered
    the owner a choice between GitHub Pages, Vercel and Cloudflare and asked
    them to make it -- which is why it read as three settings and sat for five
    days. `platform/deployment/README.md` makes that choice, on two criteria
    the owner set: one platform that fits everything, and a spend cap built
    into the vendor rather than assembled from alerts and scripts. That second
    test eliminates AWS, GCP and Azure outright -- none has a native
    halt-at-an-amount control, and the cap you can build for them is itself
    unattended automation that fails silently -- and it also eliminates
    Cloudflare, whose free-tier safety is a quota rather than a cap and whose
    paid tier has no stop control. Vercel and Railway pass it; Vercel wins on
    fit, because seven of the ten web apps are Next.js and every other
    host runs Next.js through a translation layer. The cost is real and is the
    main argument against: $20/seat/month standing, against a portfolio
    earning $0. Railway is the named fallback at roughly a quarter of that if
    the floor is the objection.

    Decided without weighting what is already wired. That framing was given to
    the session in conversation and is recorded here as a session's report of
    it -- not as owner sign-off, which nothing in this repository can evidence:
    every session authenticates as the account owner, so a note claiming owner
    direction is self-assertion and should be read as one. Migration cost is
    recorded in that document rather than counted: two workflows target
    Cloudflare today. Porting them is CI-config work, which `CLAUDE.md`'s
    agent-decidable list covers -- but it is deploy-path work on a platform the
    owner has not chosen yet, so nothing should start on it before this row is
    answered, and no session should read this sentence as authorising itself.

    Not re-verified first-hand -- every vendor documentation host is
    egress-denied from an agent session
    (`platform/deployment/probe_control_planes.py` measures 23 control-plane
    and context hosts against the consolidated table, with both controls), so
    the document flags **four** load-bearing figures for a browser check before
    granting. Corrected after review: those are now Hetzner and Railway
    figures, not the three Vercel ones this row used to name -- the
    recommendation moved and this sentence had not. The load-bearing one is
    Hetzner's traffic overage beyond the 20 TB allowance, since the value case
    rests on it; if the overage rate has jumped or compute has become
    usage-billed, the fallback is Railway. Note also the one measured
    exception: `cloudresourcemanager.googleapis.com` is reachable and is a
    write API, so the reachability claim is "every vendor control plane probed
    except GCP's Resource Manager", not a blanket one. Superseded 2026-08-24:
    `ec2.amazonaws.com` is reachable too -- a false denial this probe's own
    redirect-following bug had produced -- so the exception list is GCP
    Resource Manager *and* AWS EC2. Left dated rather than rewritten. `quick-pick-survey`'s
    Postgres remains a Vercel-marketplace consideration only if Vercel is
    chosen; on Hetzner or Railway it is a service on the platform itself.

    Revised again 2026-08-24 when the owner asked for best *value* and most
    *all-inclusive* rather than best fit. Counting workloads instead of
    frameworks disqualifies Vercel from the all-inclusive half outright:
    `retail-pilot-intel/docker-compose.yml` declares `analytics-sync` as
    `restart: unless-stopped` against a persistent volume. Vercel hosts no
    long-running process and no persistent volume, so choosing it means a
    second platform for that workload. (As first written this paragraph also
    counted `photos-import-tools` as a second such daemon and said Railway and
    Hetzner "host every workload". Both were wrong and are corrected above:
    that venture is macOS tooling driving Apple Photos and runs on no Linux
    host, so Vercel's disqualification rests on one workload, not two. Left in
    place with the correction rather than rewritten, because this paragraph is
    the dated record of why the answer moved.)
    On raw dollars Hetzner wins and it is not close (~$5/month for all of it,
    marginal app $0) but its price is not its cost -- ops hours are the
    currency `CLAUDE.md` calls scarce, and `ubuntu-agent-server`'s Ansible
    roles close only part of that gap since they provision a tailnet agent
    host, not a public web server. Railway is the only option scoring on both
    axes. Note it is also the only one of the three with no workflow written
    yet, which is the honest extra cost of the choice.

    Revised a third time 2026-08-24 when the question was put as "cloud power
    for the monorepo, if it's just one" -- which is a different question from
    where the ventures deploy, and has a different answer. Only Hetzner gives
    the repository compute rather than hosting, and the decisive fact is
    already in the repo: `ventures/ubuntu-agent-server/` is a complete,
    linted Ansible playbook for a 24/7 coding-agent host (Tailscale, Docker,
    Node 22, agent CLIs, systemd timer, unattended-upgrades) whose README
    opens by telling you to go buy a physical Ubuntu box. The automation is
    paid for; the machine is what is missing, and no managed platform can be
    it. That playbook also weakens two objections this row previously carried:
    unattended-upgrades is already configured, and the Tailscale role means
    the box can be reached over the tailnet. Corrected after review: that role
    also opened OpenSSH to the internet and never closed it, so Tailscale added
    a private route without removing the public one -- "private by default" was
    false. Closing it is now a flag (`ssh_public_access`), but it is a choice
    between two postures rather than a hardening step to apply later: a
    GitHub runner is not on the tailnet, so closing the public route also cuts
    CI off from the box. Either provision from CI and leave key-only public SSH
    open as the management route, or provision by hand from a tailnet machine
    and close it. Until closed, the host is publicly reachable by SSH. Note also
    that the CI deploy key is root-equivalent on that box: the same public key
    goes into `root` via the provider console, and the managed account holds
    NOPASSWD sudo so unattended Ansible can run. The boundary is the box, not
    the account, which is why it must hold nothing irreplaceable. What is
    genuinely not automated is nginx/TLS, Postgres and app deploy -- real work
    that Railway would give away, and the honest price of this answer.
    Railway remains the recommendation for anyone who would rather not run a
    server at all.

    Counter-evidence worth watching, added the same day: four ventures now
    carry a `vercel.json` (`quick-pick-survey`, `local-site-studio`,
    `photo-editing/docs-site`, `retail-pilot-intel` twice), up from one when
    this was first written. The codebase is drifting toward Vercel on its own.
    The `analytics-sync` daemon still rules Vercel out of the all-inclusive
    criterion -- on one workload rather than the two an earlier version of this
    row claimed, since `photos-import-tools` is macOS-only and runs on no host
    here -- but
    if a fifth appears before this is decided the fit argument may outweigh
    them -- revisit rather than assume this row is settled.
