    workflows from `gated` to `live`, and that flip is what will turn the
    check red until the snapshot is rewritten to record it.

- id: publication-identity
  asks: [0, 1, 5]
  prs: []
  gates: distribution
  exposure: legal-person
  opened: "2026-08-19"
  action: >-
    Three related grants: one registry account signup (Packagist or RubyGems
    preferred; not Docker Hub), one GitHub App permission change, and one
    standing approval on whether an agent session may publish a *free* listing
    -- no payment, no personal data, no compliance claim -- under this
    portfolio's name.
  unlocks:
    - A demand measurement on a developer-buyer channel, and submission access to the git/PR-based channels.
  blocked_by: [egress-policy]
  note: >-
    Listed as blocked, and this is the correction the #139 table does not
    carry. `CLAUDE.md` states it in prose -- "Ask 5 is currently inert" --
    because every channel nominated as agent-listable (WordPress.org, Open
    VSX, VS Code Marketplace, GitHub Marketplace) measured egress- or
    scope-denied, verified twice on separate dates against a control host. So
    granting the publish approval today publishes nothing. Per #218 a cold
    listing carries roughly 5% odds of reaching the top decile, and per
    #219/#225 the payoff at today's reachable-registry regime is $16-$145/month
    -- a rounding error against the ceiling in `break-even.md`. Worth granting
    after the egress decision, not before it.

- id: venture-gate-premise
  asks: [9]
  prs: []
  gates: deployment
  exposure: none
  opened: "2026-08-24"
  action: >-
    Answer one rule question, and it settles the remaining venture-code pull
    request at once: while `publish_surface.py` reports nothing live, may a
    session merge a `ventures/*` change that publishes nowhere and passes the
    venture's full build, or does the human gate cover venture app code
    regardless of what it deploys? Either answer is fine to give; leaving it
    unanswered is what costs.
  unlocks:
    - >-
      Answered "yes, while nothing is live", `contrast-fixes` leaves this
      queue outright -- one pull request the owner never has to read. This is
      the only row here whose answer makes the queue shorter.
    - >-
      Answered "no, the gate stands regardless", every future `ventures/*`
      pull request stops being re-argued from prose by each session that meets
      one, and `CLAUDE.md`'s wording can stop citing a live site as the reason.
  blocked_by: []
  note: >-
    Raised 2026-08-24, and deliberately raised rather than acted on. #710
    established the fact -- `platform/ci/publish_surface.py` derives from the
    workflow files that 0 of 38 workflows publish on a push to `main` -- and
    amended `CLAUDE.md` to say so while leaving the gate itself in place,
    which is the right conservative order. But that leaves the rule genuinely
    ambiguous: the agent-decidable criterion excludes "`ventures/*` app code
    *that deploys to a live site*" (which now excludes nothing), while the
    human-gated list still covers "breaking changes to deployable
    `ventures/*` code". Both readings are defensible from the current text, so
    sessions will keep deciding it individually and inconsistently until the
    owner picks one. An unattended agent resolving its own merge gate in its
    own favour is the reasoning pattern this portfolio should least want,
    which is why this is a question and not a pull request.
    Independently confirmed on the same day by a second session that measured
    the same 0-of-13-ventures result from a separate implementation before
    finding #710 had landed; that session's duplicate tool was discarded
    rather than shipped alongside.


    Correction, 2026-08-24 (later): this row originally cited `next-16-upgrade`
    (#372) as a second pull request this question would settle. #372 merged
    at 2026-08-24T09:43:08Z, independent of this question, so it is removed
    from the `unlocks` text -- one fewer thing this answer needs to account
    for, not evidence the question itself has narrowed.

    Correction, 2026-08-24: this note previously read "owner-gated only
    because merging fires deploys to live sites". That was false, and nothing
    checked it. `platform/ci/publish_surface.py` derives the answer from the
    workflow files and finds no workflow that publishes anything on a push to
    `main`: `ai-first-markets-deploy.yml` is `workflow_dispatch`-only so a
    push cannot start it, and the Cloudflare and GitHub Pages publish steps
    are behind `if:` gates on credentials the owner has not set. The last run
    of each confirms it -- the wrangler step skipped on 2026-08-21, and both
    `deploy` and `deploy-vercel` skipped on 2026-08-24. So merging this fires
    no deploy and regresses no live site, because there is no live site. What
    is actually left to decide is narrower: whether a major framework bump
    across five ventures (six apps) counts as a "breaking change to deployable
    `ventures/*` code" under `CLAUDE.md` while nothing is deployed. That is a
    smaller question than the one this row was posing, and it is the whole of
    what remains -- and since it is the same question `contrast-fixes` and
    every future venture pull request also reduce to, it is now its own row
    (`venture-gate-premise`, Ask 9) rather than a paragraph inside this one.

