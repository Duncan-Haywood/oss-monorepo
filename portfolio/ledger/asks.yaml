- id: venture-gate-premise
  asks: [9]
  prs: []
  gates: deployment
  exposure: none
  opened: "2026-08-24"
  action: >-
    Answer one rule question, and it settles the remaining venture-code pull
    request at once: while `publish_surface.py` reports nothing live, may a
    session merge a `ventures/*` change that publishes nowhere and passes the
    venture's full build, or does the human gate cover venture app code
    regardless of what it deploys? Either answer is fine to give; leaving it
    unanswered is what costs.
  unlocks:
    - >-
      Answered "yes, while nothing is live", `contrast-fixes` leaves this
      queue outright -- one pull request the owner never has to read. This is
      the only row here whose answer makes the queue shorter.
    - >-
      Answered "no, the gate stands regardless", every future `ventures/*`
      pull request stops being re-argued from prose by each session that meets
      one, and `CLAUDE.md`'s wording can stop citing a live site as the reason.
  blocked_by: []
  note: >-
    Raised 2026-08-24, and deliberately raised rather than acted on. #710
    established the fact -- `platform/ci/publish_surface.py` derives from the
    workflow files that 0 of 38 workflows publish on a push to `main` -- and
    amended `CLAUDE.md` to say so while leaving the gate itself in place,
    which is the right conservative order. But that leaves the rule genuinely
    ambiguous: the agent-decidable criterion excludes "`ventures/*` app code
    *that deploys to a live site*" (which now excludes nothing), while the
    human-gated list still covers "breaking changes to deployable
    `ventures/*` code". Both readings are defensible from the current text, so
    sessions will keep deciding it individually and inconsistently until the
    owner picks one. An unattended agent resolving its own merge gate in its
    own favour is the reasoning pattern this portfolio should least want,
    which is why this is a question and not a pull request.
    Independently confirmed on the same day by a second session that measured
    the same 0-of-13-ventures result from a separate implementation before
    finding #710 had landed; that session's duplicate tool was discarded
    rather than shipped alongside.


    Correction, 2026-08-24 (later): this row originally cited `next-16-upgrade`
    (#372) as a second pull request this question would settle. #372 merged
    at 2026-08-24T09:43:08Z, independent of this question, so it is removed
    from the `unlocks` text -- one fewer thing this answer needs to account
    for, not evidence the question itself has narrowed.

