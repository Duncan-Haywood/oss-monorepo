  - slug: retail-pilot-intel
    scores:
      ai_leverage: 5
      autonomous_ops: 4
      time_to_revenue: 4
      gross_margin: 6
      defensibility: 5
      distribution: 3
    composite: 4.5
    rater_b: 4.333
    floor: 3
    floor_dimension: distribution
    floor_note: >-
      The beachhead is one named boutique in one Italian historic centre, which
      has not agreed to a pilot. There is no repeatable route to the next fifty
      small-format retailers and none is described; consultative sales to
      owner-operated 8-25 m2 shops does not scale without feet or a channel
      partner.
    basis: >-
      By far the highest ARPU in the portfolio -- EUR 1.5-3k setup plus EUR
      149-449/store/month, anchored to basket value rather than sensor count --
      and the most defensible position here, because privacy-first retail
      analytics on the operator's own data is a real differentiator against
      both spreadsheets and camera-based incumbents. Everything else is scored
      against the product's actual state: edge vision and the POS connector are
      stub CLIs, the demo portal runs on illustrative data, and launch gates
      G1/G5/G7 are all No or partial. Autonomous ops is the portfolio's lowest
      at 4 because delivery requires physical edge hardware installed per
      store, which is a person on site.
    gates:
      liability_containment: pass
      ethical_robustness: pass
    gate_note: >-
      Pass, conditionally: in-store analytics in the EU is DPIA territory and
      the plan already treats a signed DPIA as a pilot precondition, which is
      the correct shape. The gate would fail if the product ever moved to
      identifying individual shoppers.

  - slug: ai-engineering-academy
    scores:
      ai_leverage: 8
      autonomous_ops: 5
      time_to_revenue: 1
      gross_margin: 7
      defensibility: 2
      distribution: 3
    composite: 4.333
    rater_b: 4.667
    floor: 1
    floor_dimension: time_to_revenue
    floor_note: >-
      No code exists -- a 491-line brief, a seven-file constitution, and a bare
      static-site scaffold. Its own kill criterion is that the constitution
      cannot be narrowed into a buildable MVP scope, and that scope is still
      unwritten. The mitigation is to write the MVP scope, which is unblocked
      in-repo work; until then this is a document, not a venture.
    basis: >-
      Genuine AI leverage -- mentoring and assessment are model work per
      learner -- and a described free/paid/employer-partnership model with no
      numbers attached. Gross margin is 7 rather than 9 because mentoring is
      token-heavy per active learner, so unlike the static ventures here the
      cost scales with usage. Defensibility 2 and distribution 3 reflect a
      market where the strongest competitor is the underlying model itself,
      offered free, and where learner acquisition is conventionally paid.
    gates:
      liability_containment: pass
      ethical_robustness: pass
    gate_note: >-
      Pass, conditionally: education businesses that make employment or
      earnings claims attract regulatory attention, so the no-outcome-guarantee
      constraint is the same shape as the pipeline's no-claim-of-compliance
      rule and must survive into any customer-facing copy.

  - slug: photos-import-tools
    scores:
