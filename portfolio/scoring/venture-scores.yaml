  - slug: print-atelier
    scores:
      ai_leverage: 6
      autonomous_ops: 5
      time_to_revenue: 2
      gross_margin: 4
      defensibility: 3
      distribution: 3
    composite: 3.833
    rater_b: 4.0
    floor: 2
    floor_dimension: time_to_revenue
    floor_note: >-
      No database has been chosen, orders are in-memory records, and the
      catalog is a typed in-repo mock; the top of docs/BACKLOG.md is roughly
      fifteen consecutive "persist ..." items. It is a two-sided marketplace
      that has never had a real artist or a real buyer, so both sides need cold
      starting at once.
    basis: >-
      A large, heavily-tested demo (128 tests) that models a business rather
      than running one. Gross margin is the portfolio's lowest and structurally
      so: physical prints carry COGS and shipping, and 30% of net profit is
      contracted away to the artist, so this is the one venture here whose unit
      economics are not "inference and hosting, nothing else."
    gates:
      liability_containment: fail
      ethical_robustness: pass
    gate_note: >-
      Liability gate FAILED, and this is the finding on this venture rather
      than its score. It combines the two things CLAUDE.md puts on the
      human-gated list with the two exposures the pipeline rubric rejects
      candidates for: it hosts third-party artwork (copyright and DMCA claims
      against the operator, in a market where infringing uploads are the normal
      failure mode) and it moves money to third parties on a contracted 30%
      net-profit share (a royalty-accounting obligation to people who can sue
      over it). Being wrong here costs a lawsuit, not a refund. Recorded as a
      flag for the account owner, not as a kill decision -- no session should
      retire a venture on its own scoring pass. The narrower version that
      clears the gate is licensed or owner-supplied artwork with a flat fee
      rather than a profit share.
