  # scores, for the record: composite 4.5 (rater_b 4.667), floor 2 on
  # time_to_revenue -- the same conclusion this removal acts on.

  - slug: garmin-world-traveler-watchface
    scores:
      ai_leverage: 1
      autonomous_ops: 9
      time_to_revenue: 2
      gross_margin: 9
      defensibility: 2
      distribution: 4
    composite: 4.5
    rater_b: 4.333
    floor: 1
    floor_dimension: ai_leverage
    floor_note: >-
      As with world-clock-widget: no AI, and no honest way to add one. Judge it
      on the other five or do not fund it.
    basis: >-
      Complete Monkey C source including a hand-rolled 42-city DST catalog, but
      never compiled or run -- the Connect IQ SDK is not installed here, so
      there is no build, no signature, and none of the simulator screenshots
      the store listing requires. Time-to-revenue is 2 rather than 3 because
