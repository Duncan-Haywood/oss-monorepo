      autonomous_ops: 9
      time_to_revenue: 1
      gross_margin: 9
      defensibility: 3
      distribution: 2
    composite: 4.167
    rater_b: 4.333
    floor: 1
    floor_dimension: time_to_revenue
    floor_note: >-
      There is no launch intent to be blocked. No packaging, no pricing, and no
