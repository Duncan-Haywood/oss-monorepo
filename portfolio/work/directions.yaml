  - id: paid-bets
    title: The ranked paid bets, toward $10k MRR (bets.md), and what unblocks them
    kind: area
    set: 2026-11-24
    source: portfolio/monetization/bets.md
    status: active
    # Weight 4, the highest: the North star ("this is the new overarching goal
    # in the repo hit 10k mrr", owner, 2026-11-24). Product code is in
    # private-monorepo until products-to-public-repo lands; its tasks here are
    # the cross-bet ones (CI, deploys, the move, checkout), and each app's
    # ROADMAP holds its own items (`roadmap_claim.py --bets`).
    weight: 4
    # Paths are the cross-bet work only. The bets' customer posts
    # (pay-app-guides, machine-shop-guides, ...) land many commits a day and
    # would make this look covered while CI, the move and checkout sat open.
    paths:
