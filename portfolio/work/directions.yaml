# Directions: the owner's standing directions, one entry each, machine-readable.
#
# The owner, 2026-11-03: "i think it also makes sense to vamp up the structure
# of the task and direction handling system." Before this file, directions
# lived only as prose sections in prompts/goals.md, portfolio/DIRECTION.md and
# portfolio/opinions/, so no script could say which ones were getting work.
#
# The prose stays canonical for the owner's words and the reasoning. This file
# is the index: what each direction is, where its text lives, which paths count
# as work on it, and how much weight it carries when `workctl.py next` picks a
# task. Tasks under a direction live in tasks.yaml.
#
# Fields:
#   id        short slug, used by tasks.yaml
#   title     a short name
#   kind      area (a body of work that takes tasks) or principle (how to
#             work, no tasks; listed so the index is complete)
#   set       date the owner set it (YYYY-MM-DD)
#   source    the file holding the owner's words
#   section   optional: the heading in that file
#   status    active, paused or retired
#   weight    relative pull on `workctl.py next` (1 is normal; agents may tune
#             this with a reason in the PR; the owner's "special focus" is 3)
#   paths     globs of repository paths whose commits count as work on it
#             (`workctl.py coverage`); areas only
#
# Agents may add directions the owner sets, adjust weights and paths, and
# retire a direction only when the owner says so.

