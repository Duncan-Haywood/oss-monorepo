  # ---------------------------------------------------------------------------
  # The paid bets (portfolio/monetization/bets.md, ranked 2026-11-24), one row
  # each, built in private-monorepo and named by `app:` instead of `venture:`.
  # Every tier price below is a PROPOSAL (`status: proposal`, with its `why`),
  # not a measured price: no sale has happened. Comparables are copied from
  # bets.md's sources, read 2026-11-24, many via aggregators (Capterra, G2,
  # Toolradar) that disagree with vendors: re-read the vendor's own page
  # before setting a Paddle price. Rail: Paddle; checkout dark until the owner
  # sets each product's price ids in owner-only config. Cost drivers are the
  # things that scale with customers; their unit costs are not measured yet.
  # ---------------------------------------------------------------------------
  - app: private-monorepo/apps/payapps
    bet: 1
    buyer: specialty-trade subcontractors (electrical, mechanical, drywall, concrete) and small GCs who bill monthly AIA-style pay applications
    liability: medium
    billing: subscription
    model: >-
      Subscription per company, priced by active jobs: pay apps (G702/G703
      layout), retainage, change orders and lien-waiver tracking, with
      QuickBooks Online export, growing into a contractor suite (job costing,
      RFIs, estimating from bet 6). A free G702/G703 template page in the
      public repository is the front door.
    first_offer: monthly pay apps with retainage and lien-waiver tracking for up to a few active jobs
    price_hypothesis: "about $99 to $249 a month (bets.md estimate; untested)"
    tiers:
      - name: Solo
        price: $99 a month
        includes: up to 5 active jobs, pay apps, retainage, change orders, PDF export
        status: proposal
        why: >-
          Matches Trimble Pay's subcontractor plan ($99) and sits between
          PayAppHub's $79.99 and $129.99 plans; bets.md's estimated band starts here.
      - name: Crew
        price: $179 a month
        includes: up to 20 active jobs, lien-waiver tracking, QuickBooks Online export, 3 users
        status: proposal
        why: >-
          Under SubLien's $199 floor while adding pay apps it does not lead with;
          QuickBooks sync is the feature subs say they need from day one.
      - name: Company
        price: $249 a month
        includes: unlimited jobs and users, approvals, audit history
        status: proposal
        why: >-
          The top of bets.md's estimated band; well under JobTread's $199 plus
          $20 a user once a company has several users.
    cost_drivers:
      - storage of pay-app PDFs, backup documents and signed waivers per job
      - QuickBooks Online API calls (sync) and the support load of mismatched charts of accounts
      - e-signature for lien waivers if a third-party signing API is used (per envelope)
      - Paddle's per-transaction fee
    rail: paddle
    checkout: dark
    comparables:
      - what: PayAppHub (Toolradar listing)
        price: $39.99 / $79.99 / $129.99 a month
        source: https://toolradar.com/tools/payapphub
        read: 2026-11-24
      - what: Trimble Pay (Flashtract) subcontractor plan (G2)
        price: $99 a month
        source: https://www.g2.com/products/flashtract/pricing
        read: 2026-11-24
      - what: SubLien (SaaSworthy)
        price: from $199 a month
        source: https://www.saasworthy.com/product/sublien/pricing
        read: 2026-11-24
      - what: JobTread
        price: $199 a month plus $20 a user
        source: https://jobtread.com/blog/jobtread-vs-buildertrend-construction-management-software-comparison
        read: 2026-11-24
    stage: planned
    next: >-
      Build milestone (1) of the payapps flagship row (portfolio/flagships.yaml,
      bet 1) in private-monorepo/apps/payapps, with the Paddle BillingProvider
      copied from apps/grants and left dark. Then the Paddle catalogue for these
      tiers as code, so the owner only sets ids.
    next_owner: false

