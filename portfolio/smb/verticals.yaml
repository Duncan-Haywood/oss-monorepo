      says: 'Iowa provider survey: full collection of fees is a significant barrier; few have auto-deposit
        billing.'
  - pain: Regulatory paperwork (licensing, CACFP)
    evidence:
    - source: https://nafcc.org/docs/reports/NAFCC-Annual-Report-2025.pdf
      says: Lists subsidy and CACFP admin tasks among ongoing demands; paperwork ranked 6th among challenges
        (benefits top 3).
    - source: https://www.oesw.mn.gov/info/reports/Former FCCP Survey Report 2026.pdf
      says: Minnesota closure study cites burdensome regulation for family child care providers.
  compliance:
  - rule: CACFP recordkeeping, 7 CFR 226.18 (homes) / 226.15 (centers)
    authority: USDA FNS via state agency and sponsor
    records: Enrollment documentation, daily attendance, daily meal counts by type, menus; monthly claim
      with source documents
    source: https://www.fns.usda.gov/cacfp/record-maintenance-requirements-family-day-care-home-providers
  - rule: CCDF health and safety minimums and comprehensive background checks
    authority: HHS ACF Office of Child Care; state lead agencies
    records: Staff background checks (incl. FBI fingerprint, registry), health/safety training, immunization
      records, inspections
    source: https://childcareta.acf.hhs.gov/sites/default/files/new-occ/resource/files/center_licensing_trends_brief_2020_final.pdf
  - rule: 'State licensing: child-staff ratios, group size, attendance, immunizations'
    authority: State child care licensing agencies
    records: Daily sign-in/out, ratio by room, child immunization and enrollment files, staff files
    source: https://www.childcareaware.org/families/child-care-regulations/who-regulates-child-care/
  - rule: Subsidy attendance and billing
    authority: State CCDF lead agencies
    records: Attendance supporting subsidy claims, copays (state-specific; exact rule text not found)
    source: https://aspe.hhs.gov/reports/ccdf-state-plan-barriers
  suite_modules:
  - 'attendance and ratios: kiosk/phone check-in, live room ratio, licensing-ready sign-in records'
  - 'billing and autopay: tuition, subsidy copay split, late fees, autopay, ledger'
  - 'subsidy claims: state-specific attendance export and reconciliation'
  - 'CACFP meal counts: point-of-service counts, menus, monthly claim report'
  - 'enrollment and waitlist: inquiries, tours, waitlist, capacity planning'
  - 'staff files and scheduling: background check/training/expiry tracking, ratio-aware schedule'
  - 'parent communication: daily reports, messaging, photos'
  first_module:
    module: attendance + ratios + tuition autopay (single 'front door' module)
    why: Attendance is the source record for licensing, subsidy and CACFP claims, and billing/collections
      is a cited sustainability problem; together they produce the paperwork that the other modules reuse.
      Home providers earn little (35% under $10/hour), so a near-cost price matters more here than in
      any other vertical. Children's records are not HIPAA PHI in this setting but are sensitive; COPPA-style
      care and state privacy rules apply.
