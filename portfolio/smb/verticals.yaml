        News cites ~23% average annual turnover.'
    - source: https://vetmedux.com/industry-insights/2025-veterinary-market-survey-results/
      says: In 2024 the primary concern was finding staff; in 2025 economic uncertainty overtook it.
  - pain: Phones overwhelm the front desk; calls go unanswered and bookings are lost
    evidence:
    - source: https://todaysveterinarybusiness.com/the-six-figure-problem-with-your-phone-system/
      says: '[secondhand, vendor data] 25-30% of calls to small and medium clinics go unanswered.'
    - source: https://whautomate.com/why-patients-dont-book-vet-phone-study/
      says: '[secondhand of Ohio State-linked study] Callers to 5,000+ practices got an appointment 67%
        of the time; failures from not reaching staff or long holds.'
    - source: https://petdesk.com/pet-parent-research-report
      says: '[vendor] More than half of pet parents report problems booking appointments.'
  - pain: Client affordability pressure and financial pressure on the practice
    evidence:
    - source: https://www.veterinarypracticenews.com/?p=55474
      says: 86% of practices report pet owners are cutting back, especially on elective and non-essential
        services.
    - source: https://www.aaha.org/trends-magazine/publications/rising-vet-med-costs-create-challenges/
      says: 'AAHA Trends: rising vet med costs create challenges (title; detail not read).'
  - pain: Legacy PIMS that is slow, crash-prone and charting-heavy
    evidence:
    - source: https://www.capterra.com/p/92887/AVImark/reviews/?page=17
      says: 'User review: lagging issues and ''it locks up every day''.'
    - source: https://www.capterra.com/p/99976/Cornerstone-Practice-Management/reviews/
      says: 'User review: outdated, many steps, ''takes a lot of time for charting''.'
  - pain: Controlled-substance logging and inventory counts
    evidence:
    - source: https://www.deadiversion.usdoj.gov/mtgs/pract_awareness/conf_2019/oct_2019/ikner.pdf
      says: 'DEA presentation: the registrant (not staff) is responsible for controlled substance records.'
    - source: https://vetmed.illinois.edu/?p=31921
      says: Page titled 'Incomplete/Inferior Recordkeeping' on controlled substances (detail not read).
  - pain: Client communication and marketing
    evidence:
    - source: https://software.covetrus.com/emea/veterinary-insights/ebooks/the-2024-trends-survey-an-overview-of-our-insights/
      says: '[vendor] Marketing/client communications and having the right technology listed among practice
        challenges; 41% planned software upgrades in 2025.'
  compliance:
  - rule: DEA controlled substance recordkeeping, 21 CFR Part 1304
    authority: US DEA (plus state boards; some states longer retention)
    records: Initial and biennial inventory; separate Schedule II records; dispensing/administration logs;
      keep 2 years (e.g. Illinois 5 years)
    source: https://www.ecfr.gov/current/title-21/chapter-II/part-1304
  - rule: State PDMP reporting for veterinary dispensing (varies; most states exempt vets)
    authority: State PDMPs / boards (e.g. Virginia mandatory)
    records: Report dispensed controlled substances at state interval where required
    source: https://www.dhp.virginia.gov/Boards/VetMed/PractitionerResources/PrescriptionMonitoringProgram/
  - rule: Rabies vaccination certificate retention
    authority: State health rules (e.g. Texas 25 TAC 169.29 / 22 TAC 573.51)
    records: Copy of each rabies certificate, retrievable for at least 5 years in Texas; 3 years in Arizona
    source: https://law.cornell.edu/regulations/texas/22-Tex-Admin-Code-SS-573-51
  - rule: Veterinary medical record content and retention
    authority: State veterinary boards (e.g. 49 Pa. Code 31.22)
    records: Patient medical records kept at least 3 years from last treatment in Pennsylvania
    source: https://law.cornell.edu/regulations/pennsylvania/49-Pa-Code-SS-31-22
  suite_modules:
  - 'front-desk phone and text inbox: missed-call capture, callback queue, two-way texting, online booking'
  - 'team scheduling and retention: shift scheduling, coverage, credential/CE tracking'
  - 'estimates and payments: treatment estimates, deposits, text-to-pay, payment plans'
  - 'controlled-substance log: per-bottle running balance, biennial inventory, discrepancy alerts, PDMP
    export where required'
  - 'reminders and client communication: vaccine/rabies due reminders, rabies certificate generator'
  - 'inventory: reorder points and expiry tracking'
  first_module:
    module: front-desk phone and text inbox with online booking
    why: Unanswered calls (roughly a quarter in vendor data, with an independent mystery-caller study
      showing a third of booking attempts failing) are lost revenue that a staffing-short clinic cannot
      fix by hiring. It bolts onto any PIMS. Vet records are not HIPAA PHI, so hosting is lighter than
      dental/PT; the controlled-substance log is a strong second module because DEA records are a hard
      obligation.
