    module: Medicare-ready documentation checker + auth/visit tracker
    why: 'Documentation and payer admin are the most-cited and best-evidenced pains (APTA 2025 survey;
      CMS 95.5% insufficient-documentation share for chiro), and they map directly to dollars recovered
      or protected. Heavy PHI: requires HIPAA hosting with BAAs (and a BAA with any LLM provider used
      for note drafting), which raises the cost floor versus salons/fitness.'
