    evidence:
    - source: https://www.naeyc.org/node/5663
      says: Operating costs rose drastically; 65% of centers and 31% of home-based programs raised tuition.
    - source: https://nafcc.org/wp-content/uploads/2026/01/For-Immediate-Release-NAFCC-Annual-Survey-Report.pdf
