    source: https://www.law.cornell.edu/cfr/text/40/441.50
  - rule: Dental X-ray machine registration and periodic inspection
    authority: State radiation control programs (e.g. Texas DSHS, Virginia VDH)
    records: Machine registration/renewal per tube, equipment performance evaluations, inspection reports
      (e.g. VA inspects dental facilities every 3 years)
    source: https://www.dshs.texas.gov/texas-radiation-control/x-ray-machines-x-ray-services/dental-x-ray-machine
  suite_modules:
  - 'insurance-desk: eligibility verification, benefit breakdowns, claim attachment packets, denial/aging
    worklist'
  - 'staff-and-scheduling: hygiene/assistant schedule, temp coverage, credential and CE expiry tracker'
  - 'chair-fill: automated reminders, confirm/reschedule by text, short-notice waitlist to backfill cancellations'
  - 'patient-payments: treatment-plan estimates, text-to-pay, payment plans'
  - 'compliance-binder: OSHA BBP plan and training log, amalgam separator log, X-ray registration renewals,
    HIPAA BAA register'
  - 'front-desk inbox: unified phone/text/web-form queue with call-back tracking'
  first_module:
    module: insurance-desk (eligibility verification + claim/denial worklist)
    why: 'Insurance is the most consistently cited operational pain after staffing (58% in HPI''s 2025
      outlook; verification #1 daily task in billing surveys), software can directly cut front-desk hours,
      and it sits alongside the existing PMS rather than replacing it, so a small shop can sell it without
      a full PMS migration. Staffing ranks higher but is less software-solvable. Handles PHI: needs HIPAA-grade
      hosting with BAAs (and clearinghouse/payer connectivity costs) priced in.'
  unsourced:
  - section: compliance
    rule: State dental board licensure and CE for dentists, hygienists, assistants
    authority: State dental boards
    records: License and CE tracking per staff member
