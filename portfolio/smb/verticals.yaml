      says: '[vendor] Failed payments drive up to 1 in 3 cancellations.'
    - source: https://gymdesk.com/gym-benchmark-report
      says: '[vendor platform data] 96% of unpaid gym revenue was never charged (billing never attempted).'
  - pain: Low owner pay and long hours
    evidence:
    - source: https://twobrainbusiness.com/?p=151763
      says: Average gym owner makes $3,967/month including personal expenses run through the business.
    - source: https://twobrainbusiness.com/soi-hours/
      says: Owners working 51+ hours more likely to be unprofitable; a quarter work 50+ hours.
  - pain: Cancellation/auto-renew compliance exposure
    evidence:
    - source: https://www.fisherphillips.com/en/news-insights/court-strikes-down-ftcs-click-to-cancel-rule.html
      says: FTC click-to-cancel rule vacated but state auto-renewal laws still create major risk.
    - source: https://ag.ny.gov/resources/individuals/consumer-issues/health-clubs-gyms
      says: 'NY Health Club Services Act: non-compliant contracts void and unenforceable.'
  compliance:
  - rule: State automatic renewal laws (e.g. California, strengthened for contracts from July 1, 2025)
    authority: State legislatures/AGs; FTC (ROSCA enforcement)
    records: Clear renewal terms, affirmative consent, renewal reminders where required, online cancellation
      records
    source: https://arnoldporter.com/en/perspectives/advisories/2026/02/ftc-and-state-ags-continue-to-scrutinize-subscription-practices
  - rule: 'Health club services acts: registration and bonding for prepaid memberships'
    authority: State AGs (e.g. Colorado $50,000 bond; Maryland bond capped at $200,000; NH registration)
    records: Registration, surety bond or letter of credit, contract terms, liability reports (MD)
    source: https://coag.gov/licensing/health-club-bonds/
  suite_modules:
  - 'billing that always charges: autopay, dunning, card updater, failed-payment recovery'
  - 'lead-to-trial funnel: web forms, trial booking, follow-up texts, referral tracking'
  - 'retention radar: attendance-drop alerts, at-risk member outreach'
  - class booking and check-in, waivers
  - 'compliant memberships: state-aware contract templates, renewal reminders, one-click cancel log'
