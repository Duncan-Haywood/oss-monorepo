    - source: https://www.prnewswire.com/news-releases/restaurant-delivery-report--nearly-1-000-independent-restaurant-operators-share-their-profitability-and-challenges-with-delivery-300861277.html
      says: '2019 RestaurantOwner.com survey of ~1,000 independents: fees mostly 21-30% of the sale; dissatisfied
