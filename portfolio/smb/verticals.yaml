# Regional SMB verticals: pain points, incumbent software, compliance records.
# Evidence for portfolio/smb/OFFER.md. Validated by
# `python3 portfolio/smb/cost_plus.py --check` (every pain, compliance rule and
# product needs a URL). Rows with no source are under `unsourced`: named so a
# later run can source them, never claimed.
#
# How it was made (2026-11-24): three web-research passes, one per group. All
# evidence was read through search-result summaries; no page was opened, and
# many sources are vendors (marked [vendor]) or secondhand (marked
# [secondhand]). Re-read a source before quoting it in anything user-facing.
- slug: hvac-plumbing-electrical
  name: HVAC, plumbing and electrical contractors
  group: home-services
  size:
    summary: 'IBISWorld [snippet]: HVAC contractors ~120,461 US businesses (2026), avg 5.1 employees;
      plumbers ~129,352 businesses (2026), avg 6.0 employees (https://www.ibisworld.com/industry-statistics/number-of-businesses/plumbers-united-states/);
      electricians ~261,958 businesses (2026), avg 4.9-5.0 employees, industry revenue $312.2bn 2025 (https://www.ibisworld.com/industry-statistics/number-of-businesses/electricians-united-states/).
      IEC study puts NAICS 238210 electrical contractors at an estimated 84,903 firms in 2025 employing
      ~548,000 electricians (https://ieci.org/wp-content/uploads/2026/06/IEC-Economic-Impact-Results-Final-6.23.26.pdf).
      Per-firm revenue: no source found.'
    source: https://ibisworld.com/industry-statistics/number-of-businesses/heating-air-conditioning-contractors-united-states/
  software_today:
  - name: ServiceTitan
    what: Full FSM/CRM for larger residential and commercial trades shops (dispatch, pricebook, memberships,
      reporting)
    list_price: quote only (per-technician pricing; third-party estimates of $245-$500/tech/month plus
      implementation fees are unverified)
    source: https://www.capterra.com/p/150053/ServiceTitan/pricing/
  - name: Housecall Pro
    what: 'SMB field service app: scheduling, dispatch, invoicing, payments'
    list_price: Basic $59/mo annual or $79/mo monthly (1 user); Essentials $149/$189 (up to 5 users);
      MAX $299/$329 (8 users, extra seats $35) [snippet; vendor page not fetchable; Capterra guide may
      date from 2023]
    source: https://capterra.com/p/140363/HouseCall-Pro/pricing/
  - name: Jobber
    what: 'SMB field service app: quotes, scheduling, invoicing, client hub'
    list_price: 'Core ~$39/mo, Connect ~$119/mo, Grow ~$199/mo billed monthly (single user; annual billing
      lower) [snippet][conflict: other 2026 guides give different tiers]'
    source: https://capterra.com/p/127994/Jobber/pricing/
  pain_points:
  - pain: Hiring and keeping qualified technicians
    evidence:
    - source: https://www.achrnews.com/blogs/17-opinions/post/163957-a-new-survey-of-trades-professionals-takes-a-look-at-whats-ahead-for-2025
      says: 'Housecall Pro survey [vendor][snippet]: 60% said the skilled-labor shortage impacted their
        business; 86% said the biggest hiring challenge is a lack of qualified candidates.'
    - source: https://www.contractingbusiness.com/industry-news/news/55373105/2026-hvac-survey-finds-rising-prices-and-ai-interest
      says: 'EGIA 2026 HVAC contractor survey [snippet]: respondents named hiring and retention, lead
        generation and operations management as their biggest business challenges.'
    - source: https://www.achrnews.com/polls/164-hiring-situation/results
      says: '[snippet] In a 2024 ACCA survey, members reported workforce shortages as their top challenge.'
  - pain: 'Lead capture: missed and after-hours calls'
    evidence:
    - source: https://www.contractingbusiness.com/industry-news/news/55373105/2026-hvac-survey-finds-rising-prices-and-ai-interest
      says: 'EGIA 2026 survey [snippet]: lead generation is one of the top three challenges.'
    - source: https://www.servicetitan.com/toolbox/state-of-the-trades/trends/hvac-summer-after-hours-call-spike
      says: '[vendor][snippet] ServiceTitan analysed 2025 inbound calls on its platform: a larger share
        of residential HVAC demand arrives outside business hours in summer. No independent missed-call
        rate found.'
  - pain: Rising costs squeezing margins and pricing
    evidence:
    - source: https://www.achrnews.com/articles/165150-servicetitan-report-shows-revenue-gains-but-rising-costs-for-hvac-contractors
      says: '[snippet] Headline: ServiceTitan report shows revenue gains but rising costs for HVAC contractors.'
    - source: https://www.contractingbusiness.com/industry-news/news/55373105/2026-hvac-survey-finds-rising-prices-and-ai-interest
      says: '[snippet] EGIA 2026 survey headline: rising prices and labor and cost pressures.'
  - pain: Software that is expensive, opaque and slow to onboard
    evidence:
    - source: https://getjobber.com/academy/servicetitan-competitors/
      says: '[competitor][snippet] Jobber article says ServiceTitan is too expensive for small businesses.'
    - source: https://www.capterra.com/p/150053/ServiceTitan/pricing/
      says: '[snippet] Capterra reviewers describe pricing as expensive, with extra costs for features
        and scaling with team size; a separate search summary reported a reviewer''s failed multi-week
        onboarding, but which review page it came from could not be confirmed.'
  - pain: 'Getting paid: unpaid invoices and cash flow'
    evidence:
    - source: https://quickbooks.intuit.com/r/small-business-data/small-business-late-payments-report-2026
      says: '[snippet] QuickBooks 2026 (all small businesses, not trade-specific): owners waiting on invoices
        are owed $17.7K on average; 22% have at least 20% of invoices past 30 days.'
    - source: https://www.housecallpro.com/resources/how-to-collect-hvac-payments/
      says: '[vendor][snippet] A few large unpaid invoices can force an HVAC shop to choose which bills,
        parts orders or payroll to delay.'
  - pain: Admin and paperwork time
    evidence:
    - source: https://www.housecallpro.com/wp-content/uploads/2026/06/062026-HCP-The-AI-Advantage-report.pdf
      says: '[vendor][snippet] Spring 2026 survey of 245+ pros: 38% of AI users say they are less buried
        in paperwork; 1 in 4 save 6+ admin hours a week (vendor says read directionally).'
    - source: https://www.salesforce.com/news/?p=86059
      says: '[snippet; secondhand] Salesforce survey: tradespeople waste more than seven hours per week
        on low-value tasks like manual data entry.'
  - pain: Maintenance agreements lapsing without renewal
    evidence:
    - source: https://www.simprogroup.com/blog/maintenance-agreement-renewals
      says: '[vendor][snippet] Article on keeping service contracts from lapsing; vendor-cited lapse rates
        of 28-40% without structured renewal outreach are unverified.'
    - source: https://www.servicetitan.com/blog/maintenance-agreements
      says: '[vendor][snippet] Guide framing maintenance agreements as the core recurring-revenue program
        for HVAC shops.'
  compliance:
  - rule: Clean Air Act Section 608 refrigerant management (40 CFR 82 Subpart F)
    authority: US EPA
    records: 'Technicians disposing of appliances with 5-50 lb of refrigerant keep disposal records (location,
      recovery date, refrigerant type); leak inspection/verification records for 50+ lb ODS appliances.
      Retention period for technician disposal records: not confirmed in sources read (3 years seen only
      for MVAC shops).'
    source: https://19january2025snapshot.epa.gov/section608/recordkeeping-and-reporting-requirements-stationary-refrigeration/index.html
  - rule: AIM Act Emissions Reduction and Reclamation rule (40 CFR 84, incl. 84.106)
    authority: US EPA
    records: Leak repair, leak-rate calculation, recordkeeping and reporting for HFC appliances with a
      full charge of 15 lb or more; single compliance date Jan 1, 2026.
    source: https://www.epa.gov/system/files/documents/2026-01/er-r-fact-sheet-leak-repair-2026-01-13_1.pdf
  - rule: AIM Act Technology Transitions (refrigerant GWP limits) reconsideration, final rule May 26,
      2026
    authority: US EPA
    records: Which refrigerants may be used in new installs; deadlines extended/loosened per law-firm
      summary [secondhand]. Exact dates not confirmed.
    source: https://www.hklaw.com/en/insights/publications/2026/05/epa-finalizes-changes-to-technology-transitions-provisions
  - rule: 'State contractor licensing (example: Texas air conditioning and refrigeration contractor)'
    authority: Texas Department of Licensing and Regulation
    records: Class A/B license with E/R/C endorsements; commercial general liability insurance must be
      maintained while license is active.
    source: https://www.tdlr.texas.gov/acr/contractor-apply.htm
  - rule: 'State contractor licensing (example: California C-20 HVAC)'
    authority: California Contractors State License Board
    records: Business-level license with a qualifier (experience + law/business and trade exams per vendor
      guide [secondhand]); workers' comp required.
    source: https://www.aptora.com/licensing/hvac/california
  - rule: Backflow prevention assembly testing (plumbers)
    authority: 'State drinking-water agency and local water utility (example: Texas TCEQ)'
    records: Annual test of health-hazard assemblies within 12 months of last test; signed test report
      by licensed tester, original to the public water system.
    source: https://www.tceq.texas.gov/goto/20700
  - rule: Local building/mechanical/electrical permits
    authority: Local building departments
    records: Permit applications and inspections per job; remodelers in an informal 2018 survey averaged
      4.8 staff hours/week pulling permits [snippet].
    source: https://www.jlconline.com/remodeling/got-the-bureaucratic-blues-heres-what-your-remodeler-peers-said-about-pulling-permits_o
  suite_modules:
  - 'Call capture: AI/after-hours answering, missed-call text-back and online booking feeding the schedule'
  - Dispatch and scheduling board with tech mobile app (job notes, photos, signatures)
  - Flat-rate pricebook, good-better-best estimates and invoicing with card/ACH and financing links
  - 'Payments and collections: auto-reminders, card on file, aging dashboard'
  - 'Maintenance-agreement manager: auto-renew, auto-schedule tune-ups, renewal outreach'
  - 'Compliance log: refrigerant recovered/charged per appliance (608/AIM Act 15 lb leak repair timers),
    backflow test reports, permit tracker'
  - 'Hiring and training: applicant pipeline, ride-along checklists, license/cert expiry alerts'
  first_module:
    module: Call capture + online booking with missed-call text-back
    why: Lead generation and hiring are the top named challenges (EGIA 2026); software can't hire techs
      but can stop losing the calls a short-staffed shop already paid to get. It is standalone (works
      beside ServiceTitan/Jobber/HCP), has a measurable ROI per recovered job, and is the cheapest wedge
      into a market where incumbents are criticised as expensive and slow to onboard.
  evidence_read: 2026-11-24, through web-search result summaries; pages not opened (see VERTICALS.md,
    'How sure')
- slug: roofing
  name: Roofing contractors
  group: home-services
  size:
    summary: 'IBISWorld [snippet]: ~109k US roofing businesses in 2026 (3.4% CAGR 2021-26); May 2025 report:
      ~102k businesses, 294k employees, $76.4bn revenue; average 2.1 employees per business (roofing &
      siding variant: 130k businesses, 2.6 employees). NAICS Association lists 59,589 businesses for 238160
      (year/method not stated) [conflict].'
    source: https://www.ibisworld.com/industry-statistics/number-of-businesses/roofing-contractors-united-states/
  software_today:
  - name: AccuLynx
    what: 'Roofing CRM/production: leads, estimates, material orders, crews, insurance jobs'
    list_price: quote only (per user per month per Capterra listing)
    source: https://capterra.com/p/116187/Acculynx/
  - name: JobNimbus
    what: Roofing/exteriors CRM and job boards
    list_price: 'quote only / conflicting: Capterra lists from $300 per user/month; another guide cites
      $225 or $550/mo base plus $20-$75/user [conflict][competitor]'
    source: https://www.capterra.com/p/126797/JobNimbus/pricing/
  - name: Roofr
    what: Measurement reports, proposals, CRM
    list_price: Reports $19 pay-as-you-go or $13 on a subscription; plans Measure+ $109/mo, Instant Estimator
      $149/mo, Essentials $249/mo, Scale $349/mo [snippet]
    source: https://roofr.com/help/roofr-report-update-2024
  - name: EagleView
    what: Aerial roof measurement reports
    list_price: per report, roughly $15-$87 by roof size per third-party guides; official page unreadable;
      subscription quote only [conflict]
    source: https://www.eagleview.com/pricing
  pain_points:
  - pain: Rising and volatile material prices
    evidence:
    - source: https://www.servicetitan.com/guides/exterior-trades-report-2025
      says: '[vendor][snippet] Survey of 1,020 exterior owners (>$1M revenue): fears include increasing
        material prices (64%).'
    - source: https://www.roofingcontractor.com/articles/100718-survey-shows-material-prices-among-biggest-concerns-in-roofing
      says: '[snippet] Headline: survey shows material prices among biggest concerns in roofing.'
  - pain: Labor shortage and overhead
    evidence:
    - source: https://www.servicetitan.com/guides/exterior-trades-report-2025
      says: '[vendor][snippet] Labor shortage (58%) and rising labor and overhead costs (53%).'
    - source: https://www.roofingcontractor.com/articles/101568-2025-commercial-roofing-trends-report
      says: '[snippet] 36% of commercial roofers highlighted a lack of qualified workers.'
    - source: https://nrca.net/RoofingNews/labor-shortage-in-construction-is-main-cause-of-project-delays.9-16-2025.12933/Details/Story
      says: '[snippet] Workforce survey of nearly 1,400 construction companies: labor shortages are the
        main cause of project delays.'
  - pain: Insurance claims, supplements and adjuster delays
    evidence:
    - source: https://www.servicetitan.com/guides/exterior-trades-report-2025
      says: '[vendor][snippet] 40% do insurance work; claims complexity (47%) and adjuster delays (36%)
        create operational drag.'
    - source: https://www.propertyinsurancecoveragelaw.com/blog/the-concerns-and-legality-of-supplemental-claims-and-supplemental-claims-companies/
      says: '[snippet] Supplements with insufficient evidence of extra damage lead to delays, denials
        and disputes.'
  - pain: Lead follow-up and owner-as-salesperson bottleneck
    evidence:
    - source: https://www.jobnimbus.com/blog/missed-calls-missed-forms-missed-revenue-the-roofing-leads-youre-losing-today
      says: '[vendor][snippet] One audit (anecdote) found a company missing 42% of potential leads.'
    - source: https://www.getjobber.com/academy/roofing/how-to-grow-your-roofing-business/
      says: '[vendor][snippet] Owners who are the main salesperson hit a ceiling around $1M revenue and
        become the bottleneck.'
  - pain: 'Cash flow: paying for materials and crews before the customer or insurer pays'
    evidence:
    - source: https://projul.com/blog/roofing-contractor-software
      says: '[vendor][snippet] Waiting 30-60 days for payment strains the ability to buy materials and
        pay crews.'
    - source: https://www.getjobber.com/academy/roofing/how-to-run-the-office-of-a-roofing-company/
      says: '[vendor][snippet] Owners underestimate up-front working capital for materials, labor and
        permits.'
  - pain: 'Production handoffs: crews waiting on job details, redos'
    evidence:
    - source: https://es.rooferscoffeeshop.com/post/danielle-basch-the-struggle-is-real-fix-the-painful-processes-from-the-roof-podcast-transcript
      says: '[snippet] Podcast lists missed follow-ups, redo mistakes, crews waiting around for job details
        and team burnout.'
  compliance:
  - rule: Fall protection in residential construction, 29 CFR 1926.501(b)(13)
    authority: OSHA
    records: Conventional fall protection at 6 ft+; if infeasible, a written site-specific fall protection
      plan under 1926.502(k). Fall protection is OSHA's most-cited standard (14th straight year in FY2024
      per trade press [snippet]).
    source: https://www.osha.gov/residential-fall-protection/faq
  - rule: Insurance deductible waiver ban (Texas HB 2102, 2019)
    authority: Texas Department of Insurance / state law
    records: Contracts and invoices must not waive or rebate the deductible; fines up to $2,000 [snippet].
    source: https://tdi.texas.gov/tips/state-law-cracks-down-on-roof-scams.html
  - rule: Colorado residential roofing contract law (CRS 6-22-105)
    authority: State of Colorado
    records: 'Written contract with cancellation/refund terms and 72-hour rescission; no deductible waivers
      [secondhand: law-firm summary].'
    source: https://www.propertyinsurancecoveragelaw.com/blog/who-pays-the-deductible-requirements-of-roofing-contracts-in-colorado/
  - rule: Storm-chaser / post-storm contract laws (NCOIL model act; state compendium)
    authority: State legislatures / insurance regulators
    records: 'Model: 3-business-day cancellation right; deposits returned within 10 business days. Which
      states adopted it: not confirmed.'
    source: https://ncoil.org/wp-content/uploads/2026/02/NCOIL-Storm-Chaser-Model-November-2025.pdf
  - rule: Heat injury and illness prevention (proposed federal rule; state rules in CA, CO, MD, MN, NV,
      OR, WA per law-firm summary)
    authority: OSHA (proposed, not final as of sources read) and State Plans
    records: Proposed written heat plans; federal rule still not final in 2026 [snippet].
    source: https://www.osha.gov/heat-exposure/rulemaking
  suite_modules:
  - 'Insurance claim workspace: photo/damage documentation, supplement builder, adjuster correspondence
    log, claim status tracker'
  - Lead capture and follow-up CRM with automated cadences and canvassing map
  - 'Estimating and proposals: measurement import (Roofr/EagleView/own), material takeoff, good-better-best'
  - Material ordering and job costing with price-change alerts
  - 'Production scheduling: crew calendar, weather holds, job packet to crew phones'
  - 'Payments: deposit, insurance-check and draw tracking, depreciation/ACV recoverable tracking'
  - 'Safety and compliance: fall-protection plans per site, toolbox talks, state contract templates (rescission,
    no-deductible-waiver)'
  first_module:
    module: Insurance claim and supplement workspace
    why: Material prices and labor are macro problems software can't fix; claims complexity (47%) and
      adjuster delays (36%) are operational drag that documentation software directly reduces, and every
      insurance job's cash depends on it. Incumbents are quote-only, per-user CRMs, so a cheap, focused
      claims tool is a clear wedge that later grows into the CRM.
  evidence_read: 2026-11-24, through web-search result summaries; pages not opened (see VERTICALS.md,
    'How sure')
- slug: landscaping-lawn-care
  name: Landscaping and lawn care
  group: home-services
  size:
    summary: 'IBISWorld [snippet][conflict]: 556,238 businesses (2026) on one page vs 692,777 (2025) on
      another; ~1.39-1.47M employees; average 2.1-2.5 employees per business; market $176.7bn (2026).
      Census 2002 data imply roughly 73% of landscaping units had no employees (209,072 nonemployers vs
      76,102 employer establishments; my calculation, old data) (https://webarchive.library.unt.edu/eot2008/20090829210804/http:/www.census.gov/epcd/nonemployer/2002/us/US000_56.HTM).'
    source: https://www.ibisworld.com/united-states/number-of-businesses/landscaping-services/1497/
  software_today:
  - name: Jobber
    what: SMB quoting, scheduling, invoicing (common for lawn care)
    list_price: Core ~$39/mo, Connect ~$119/mo, Grow ~$199/mo billed monthly [snippet][conflict]
    source: https://capterra.com/p/127994/Jobber/pricing/
  - name: LMN
    what: Landscape estimating, budgeting, crew timesheets
    list_price: 'free tier up to 5 users; Pro $335/mo + $19.97/user; Pro Plus $460/mo + $19.97/user [snippet;
      aggregator][conflict: another aggregator gives $297-$648]'
    source: https://www.softwareadvice.com/landscaping/lmn-profile/
  - name: Service Autopilot
    what: Lawn care scheduling, routing, automation, invoicing
    list_price: from $49/mo plus sign-up fee; higher tiers $139-$499/mo depending on source [conflict]
    source: https://www.getjobber.com/academy/lawn-care/best-lawn-care-software/
  - name: Aspire
    what: Commercial landscape ERP (estimating to invoicing)
    list_price: quote only (tiers by revenue, unlimited users per vendor)
    source: https://www.youraspire.com/blog/lmn-alternatives
  - name: RealGreen (Service Assistant)
    what: Lawn/tree care and pest application businesses (WorkWave)
    list_price: starting $199/mo per Software Advice (Capterra labels it per user) [conflict]
    source: https://www.softwareadvice.com/field-service/service-assistant-profile/
  pain_points:
  - pain: Finding and keeping crew labor (incl. H-2B visa caps)
    evidence:
    - source: https://www.youraspire.com/blog/webinar-recap-where-technology-meets-opportunity
      says: '[vendor][snippet] Aspire 2025 report: 51% classify staffing as one of their biggest risks
        of 2025.'
    - source: https://www.greenindustrypros.com/industry-updates/article/22929768/staying-rooted-2025-state-of-the-green-industry-report
      says: '[snippet] 29% said labor is their most pressing concern.'
    - source: https://sportsfieldmanagementonline.com/2025/12/10/2200-businesses-call-for-immediate-release-of-supplemental-h-2b-visas/18778/
      says: '[snippet] More than 2,200 small businesses called for release of 64,716 supplemental H-2B
        visas.'
    - source: https://blog.landscapeprofessionals.org/talent-trends-for-2026-how-landscape-companies-are-approaching-recruiting/
      says: '[snippet] NALP: finding skilled labor remains one of the primary business challenges.'
  - pain: Rising costs (materials, fuel, equipment, insurance) vs clients' old price expectations
    evidence:
    - source: https://www.lawnandlandscape.com/state-of-industry-report
      says: '[snippet] Contractor: meeting customer demands at five-years-ago pricing is difficult; concerns
        include recession and high fuel prices.'
    - source: https://www.youraspire.com/guides/2026-landscape-industry-trends-report
      says: '[vendor][snippet] Aspire lists rising material costs and winning bids in a competitive market
        among top challenges.'
  - pain: Estimating and bidding accuracy (underpricing)
    evidence:
    - source: https://www.totallandscapecare.com/business-best-practices/lawn-care-estimating-mistakes-to-avoid/
      says: '[snippet] Owners are overconfident in their estimating abilities; warns against pricing by
        eye.'
    - source: https://www.lawnandlandscape.com/article/pricing-residential-mowing
      says: '[snippet] Pricing guidance: if you''re not losing jobs often, your prices are too low.'
  - pain: Seasonal cash flow and late payments
    evidence:
    - source: https://blog.landscapeprofessionals.org/business-smarts-managing-cash-flow-through-the-slow-season/
      says: '[snippet] NALP: revenue falls in winter while insurance, equipment payments and overhead
        continue; levelled monthly billing suggested.'
    - source: https://relayfi.com/blog/seasonal-cash-flow-accounting-landscaping-businesses/
      says: '[vendor][snippet] Late payments are among the most common cash-flow drains, usually from
        missed or forgotten invoices.'
  - pain: Client retention
    evidence:
    - source: https://www.barchart.com/story/news/35280148/new-aspire-software-data-shows-commercial-landscape-contractors-focus-on-client-retention-operational-efficiency-and-smarter-tech-investments
      says: '[vendor][snippet] Aspire data headline: commercial landscape contractors focus on client
        retention and operational efficiency.'
  - pain: Proof of service and disputes over visits
    evidence:
    - source: https://www.youraspire.com/blog/prove-service-delivery-data-ends-disputes
      says: '[vendor][snippet; title only] Photo, GPS and time data to prove service delivery and end
        disputes.'
  compliance:
  - rule: 'H-2B employer obligations: record retention (WHD Fact Sheet 78I) and three-fourths hours guarantee
      (78E)'
    authority: US Department of Labor, Wage and Hour Division
    records: Keep H-2B registration, job order, application, Appendix B, I-129 etc. for 3 years; payroll
      showing hours offered vs worked per workweek for the 3/4 guarantee [snippet].
    source: https://www.dol.gov/agencies/whd/fact-sheets/78i-h2b-record-retention
  - rule: 'Pesticide applicator licensing for lawn/weed treatments (example: California maintenance gardener)'
    authority: California Department of Pesticide Regulation + county agricultural commissioner
    records: Qualified Applicator Certificate Category Q, Maintenance Gardener Pest Control Business License
      ($180), county registration, even for incidental pesticide use.
    source: https://www.cdpr.ca.gov:/docs/license/maintgardeners/brochure.pdf
  - rule: Pesticide application records (state rules; federal floor for restricted-use pesticides)
    authority: State pesticide lead agencies; USDA (7 CFR 110) for RUP
    records: RUP records available 2 years federally; states require 2 (NH) to 3 (CO) to 5 (MN) to 7 years
      (WA), some for all applications with weather data.
    source: https://www.law.cornell.edu/cfr/text/7/110.3
  - rule: Zero-emission small off-road engines (AB 1346 / CARB SORE rule)
    authority: California Air Resources Board
    records: New MY2024+ mowers, blowers, trimmers sold must be zero-emission (generators 2028); affects
      equipment purchasing, not record-keeping.
    source: https://ww2.arb.ca.gov/2021-assembly-bill-1346-berman-marc-small-road-engines-chaptered
  - rule: Heat illness prevention (proposed federal; state rules exist)
    authority: OSHA / State Plans
    records: Proposed written heat plan; not final as of sources read.
    source: https://www.osha.gov/heat-exposure/rulemaking
  suite_modules:
  - 'Estimating: satellite/property measurement, production-rate based pricing, minimum charges, margin
    check'
  - Recurring service scheduling and route optimisation for crews
  - 'Billing: auto-charge card on file, levelled monthly (budget) billing, prepay offers'
  - Crew time tracking and job costing (hours budgeted vs actual)
  - 'H-2B compliance: hours-offered vs worked ledger for the 3/4 guarantee, document vault'
