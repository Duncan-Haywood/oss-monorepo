  - pain: Under-enrollment / enrollment management
    evidence:
    - source: https://www.naeyc.org/node/5663
      says: Nearly half of programs not enrolled at desired capacity.
    - source: https://procaresoftware.com/blog/2025-child-care-trends-grow-your-child-care-centers-enrollment
      says: '[vendor] 39.8% identify enrollment management as a significant obstacle; 41% of centers under
