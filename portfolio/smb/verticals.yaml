  - pain: Member churn / retention
    evidence:
    - source: https://gymdesk.com/blog/gym-retention-rate-benchmarks
      says: '[secondhand of HFA 2025 benchmark] Average annual retention 66.4%: roughly 1 in 3 members
        leave each year.'
