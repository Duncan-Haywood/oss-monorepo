      says: '[URL-to-claim mapping from search summary, unverified] Across 828 clinics, 73% of patients
        missed at least one appointment in an episode of care.'
  - pain: Declining reimbursement and new-patient acquisition (chiropractic)
    evidence:
    - source: https://theamericanchiropractor.com/article/2026/4/1/the-insurance-debate-is-a-false-choice---and-its-killing-independent-practices
      says: '[opinion, secondhand of Chiropractic Economics] Reimbursement rates fell from 69% (2021)
        to 57% (2024).'
    - source: https://www.chirohd.com/blog/4-barriers-to-new-patient-acquisition
      says: '[vendor] 53.2% of chiropractors say growing patient volume is their #1 priority.'
  compliance:
  - rule: HIPAA Privacy/Security; BAA with any cloud host
    authority: HHS OCR
    records: Risk analysis, BAAs, access logs, breach records
    source: https://www.hhs.gov/hipaa/for-professionals/special-topics/cloud-computing
  - rule: Medicare outpatient therapy plan of care certification and KX modifier threshold
    authority: CMS (42 CFR 410.61; Benefit Policy Manual Ch.15 s220)
    records: Certified plan of care; medical-necessity justification in record above threshold ($2,410
      in 2025, $2,480 in 2026); targeted review above $3,000
    source: https://www.cms.gov/data-research/monitoring-programs/medicare-fee-service-compliance-programs/medicare-fee-service-recovery-audit-program/approved-rac-topics/0228-therapy-claims-billed-kx-modifier-medical-necessity-documentation-requirements
  - rule: 'Medicare chiropractic coverage: active treatment of subluxation only, AT modifier'
    authority: CMS
    records: Subluxation documented each visit; treatment plan with frequency, duration, goals; AT modifier
      only for active care
    source: https://www.cms.gov/Outreach-and-Education/Medicare-Learning-Network-MLN/MLNProducts/Downloads/JobAidChiropracticServices-FactSheet-MLN1232664print-friendly.pdf
  - rule: OSHA Bloodborne Pathogens (where exposure exists)
    authority: OSHA
    records: Exposure control plan, training records
    source: https://osha.gov/Publications/osha3187.pdf
  suite_modules:
  - 'documentation assist: templated/AI-drafted daily notes with Medicare-required elements checked (plan
    of care, KX justification, subluxation/PART for chiro)'
  - 'prior auth and visit tracker: auth status, visits used vs authorized, re-cert due dates'
  - 'attendance and plan-of-care adherence: reminders, rebook, dropout alerts'
  - 'billing and claims: claims, denials worklist, patient balances'
  - home exercise programs and patient messaging
  - staff scheduling and credential tracking
