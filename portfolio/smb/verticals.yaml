      says: A caterer said it could not see per-event profit margins in real time until leaving spreadsheets
        (vendor case study).
  compliance:
  - rule: Cold holding of TCS food at 41F (5C) or below; time as a public health control needs written
      procedures kept on premises
    authority: FDA Food Code (model code; adopted and enforced by state and local health departments)
    records: 'Written TPHC procedures available to the inspector; temperature monitoring is the inspection
      basis (temp logs are common practice, exact log mandate varies by jurisdiction: no single source
      found)'
    source: https://www.fda.gov/food/fda-food-code/food-code-2022
  - rule: State adoption example of Food Code 3-501.16 / 3-501.19 (cold holding, 4-hour and 6-hour time-control
      options)
    authority: Wisconsin DATCP (state adoption)
    records: Written procedures for time-as-control; food marked/discarded per time limits
    source: https://docs-preview.legis.wisconsin.gov/code/admin_code/atcp/055/75_/_656?up=1
  - rule: 'Tip credit and tip pools: employer may claim tip credit only after informing employees; may
      not keep any portion of tips; must notify of required tip pool contributions'
    authority: US Department of Labor, Wage and Hour Division (FLSA)
    records: Tip credit notice, tips received per employee, cash wage paid (current recordkeeping detail
