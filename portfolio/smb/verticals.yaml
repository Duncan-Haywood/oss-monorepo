    module: billing + dunning + compliant cancel/renewal (membership ledger)
    why: Lead generation is the top stated concern but is mostly marketing; billing leakage (failed or
      never-attempted charges) and churn are directly software-fixable and recover revenue immediately,
      and the same ledger carries state auto-renewal compliance. No PHI, so hosting is light (payments
      via processor).
  unsourced:
  - section: compliance
    rule: Liability waivers and minors' consent (martial arts/kids programs)
    authority: State contract law
    records: Signed waivers (no authoritative source found)
