    code: platform/distribution/npm.mjs
    workflow: .github/workflows/distribute-npm.yml
    enabled_by: repository variable DISTRIBUTE_NPM=true plus secret NPM_TOKEN (an npm automation token); optional variable NPM_SCOPE (e.g. @yourname) to publish under a scope
    what_it_posts: one npm package per zero-dependency venture CLI on the npm allow-list (portfolio/distribution/allowlist.json, 7 tools on 2026-10-30) (cli.mjs plus the sibling files it imports, an MIT LICENSE, the venture README with a free/open-source/not-advice footer), at most 5 per run, at the version versions.json gives it; a bin wrapper makes `npx <name>` work because npm's bin symlink defeats the CLIs' direct-invocation guard
    dedupe: stateless; a version the registry already has is skipped, and a name owned by another project (its repository URL is not this repo) is skipped with a note, so nothing is ever overwritten. On 2026-10-30 llm-spend-guard and llms-txt-generator were already taken on npm; they publish only under NPM_SCOPE
    terms_to_confirm_by_owner_when_enabling:
      - npm Terms of Use and Open-Source Terms (publishing under your own account; free public packages)
      - npm's policy on name squatting and spam: the run is capped and each package is a working tool, but check the cap suits you
      - decide scope vs unscoped names before the first publish, because a published name cannot be reclaimed
    owner_ask: create or choose the npm account, store NPM_TOKEN as a repository secret, set NPM_SCOPE if wanted, then set DISTRIBUTE_NPM=true
    dry_run: node platform/distribution/npm.mjs
