    what_it_posts: "one git tag `<slug>-v<version>` and one GitHub release per allow-listed tool version (31 tools on 2026-10-30), so users can pin `uses: .../actions/<slug>@<slug>-v0.1.0` and pre-commit `rev:` instead of @main. Notes list the pin lines that exist for that tool (action, pre-commit, and npm/PyPI only when those channels are on), the content hash and a link to the source at the tag. devsec-toolkit's release attaches its `bundle` output as a reproducible devsec-toolkit-<version>.tar.gz (about 130 KB) with its SHA-256. At most 5 releases per run; runs on each change to versions.json and weekly"
    dedupe: stateless; a release that already has its tag is left alone. A run refuses to tag when versions.json is stale, so a tag always points at a commit whose shipped files match the recorded hash
    terms_to_confirm_by_owner_when_enabling:
      - GitHub Terms of Service and Acceptable Use (releases on our own repository are a first-party feature; no third party is contacted)
    owner_ask: set DISTRIBUTE_TOOL_RELEASES=true. The first runs create 31 tags over about seven runs (five per run); release notifications go to anyone watching the repository's releases
