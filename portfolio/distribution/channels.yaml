      - the Public API at gql.hashnode.com documents createDraft, publishPost (originalArticleURL) and Post.canonicalUrl; a personal access token goes in the Authorization header. Agents had no network to Hashnode on build day, so the query shape and the terms are unconfirmed until the first live draft
    owner_ask: create the Hashnode account and publication, generate a personal access token, store it as HASHNODE_TOKEN, set HASHNODE_PUBLICATION_ID and DISTRIBUTE_HASHNODE=true; review the first drafts before setting HASHNODE_PUBLISH=true
