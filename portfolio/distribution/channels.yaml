# One row per distribution channel. Ladder: none -> artifact -> queued -> live -> measured
# (portfolio/distribution/README.md). Terms must be read on the day the channel is built.
channels:
  - id: bluesky-bot
    rung: artifact
    built: 2026-10-15
    code: platform/distribution/bluesky.mjs
    workflow: .github/workflows/distribute-bluesky.yml
    enabled_by: repository variable DISTRIBUTE_BLUESKY=true, plus secrets BSKY_HANDLE and BSKY_APP_PASSWORD (an app password, never the account password)
    what_it_posts: one post per tool launched in the last 3 days (platform/pages/launched.json), at most 3 per run, link back to the tool page, text ends "Automated post."
    dedupe: stateless; reads the account's own recent posts and skips any tool whose URL is already there
    terms_to_confirm_by_owner_when_enabling:
      - Bluesky Terms of Service and Community Guidelines (automated accounts must be labelled; set the account's bot label/bio when creating it)
      - AT Protocol createSession / createRecord are the documented public API; app passwords are the documented credential for scripts
      - rate limits are generous for 3 posts a day; the script never retries a failed post in a loop
    owner_ask: create a Bluesky account for the portfolio, label it as automated, store the app password as a secret, set the variable
    dry_run: node platform/distribution/bluesky.mjs
  - id: mastodon-bot
    rung: artifact
    built: 2026-10-15
    code: platform/distribution/mastodon.mjs
    workflow: .github/workflows/distribute-mastodon.yml
    enabled_by: repository variables DISTRIBUTE_MASTODON=true and MASTODON_INSTANCE (https URL), plus secret MASTODON_TOKEN (an app token with write:statuses and read:accounts only)
    what_it_posts: one status per tool launched in the last 3 days (platform/pages/launched.json), at most 3 per run, link back to the tool page, text ends "Automated post."; unlisted by default (MASTODON_VISIBILITY=public only if the instance allows bots to)
    dedupe: stateless (reads the account's own recent statuses) plus an Idempotency-Key per tool and day
    safety: the script refuses to post unless the account is flagged as a bot in its profile
    terms_to_confirm_by_owner_when_enabling:
      - the chosen instance's server rules on automated accounts and self-promotion (they differ per instance; pick one that welcomes bots)
      - the account is flagged "This is a bot account" and the bio says what it posts
      - Mastodon REST API POST /api/v1/statuses is the documented public API; tokens come from the account's own Development > New application
    owner_ask: pick a bot-friendly instance, create a labelled account, store its token as a secret, set the variables
    dry_run: node platform/distribution/mastodon.mjs
