    next: >-
      History and every trial: README and git. Labelled benchmark landed 2026-11-10 (README "A labelled benchmark", `eval/tcpd.mjs`): 31 Turing Change Point Dataset series, TCPDBench metrics ported (published scores reproduced to 2e-16); BOCPD F1 0.706 and consensus every-setting 0.702 vs best published binseg 0.714 and "no change" 0.663, but the page's default level model 0.477; tier hit rates 39/28/25% now printed under `--consensus`.
      Held out 2026-11-10 (README "Held out", eval/tcpd-heldout.mjs; the 7 univariate series TCPD does not ship, md5-checked): every-setting consensus F1 0.711 (binseg 0.727, zero 0.639), BOCPD 0.622 (so no BOCPD-led summary), warning beat plain level on 6/6; the page now leads with "Agreed changes". Several columns (README "Several columns at once"/"on the page"): CLI --columns 2026-11-10, F1 0.521 on 3 multi-dim series (bocpd 0.480, zero 0.621); page 2026-11-11. Joint noise floor per column 2026-11-11 (README, eval/tcpd-multi-floor.mjs): pre-registered 'auto' floor now the joint default, mean F1 0.172 to 0.286, white-noise power unchanged in 20/20 cells; ar1 + floor 2 scored 0.564 (not primary). Next, most valuable first: (a) ar1 + floor 2 on fresh multi-column labelled data (a lead, not a finding), a trend term per column, several columns in the branded report; (b) Measles answered; (c) agreed changes: the same 2,000-point cap or a worker on the page.
      Open: (0) smooth series over-cut (TCPD: 406 cuts on US population, 178 on bank); (1) slope-break test dates GDP's 1970s break at 1971Q2, not significantly; wanted: a model that dates and tests the 1976 temperature acceleration, a real step inside a cycle, a cycle check not tied to rho, real documented ramps and close steps; (2) steep-bump clumpy-count cell under-covered (173/217); (3) GARCH segment prune leaves 48% false alarms at n=200; (4) driftWarning fires on real shocks: tell a shape from a shock; (5) holiday list: wanted a shop's counts or a yearly term.
