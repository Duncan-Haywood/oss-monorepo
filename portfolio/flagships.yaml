# Flagship ventures: the few with real depth that most venture runs deepen.
#
# The owner, 2026-10-20: "on the one hand I like the thousand plus small tools,
# but on the other hand I want to work on deeper business and engineering
# problems and more of the work to be to deepening and improving existing
# projects that have real depth to them."
#
# `portfolio/router/allocate.py` ranks these first, in this order, with the
# task "Deepen (flagship N): <next>". A run that lands a slice of `next`
# rewrites it to the following milestone in the same PR. The owner can
# reorder, add or drop entries; agents may too, with the evidence in the PR.
#
# Why depth, argued at more length (an opinion, not a rule):
# portfolio/opinions/2026-10-20-build-what-an-agent-would-rather-call.md
#
# Chosen 2026-10-20 from an audit of the largest ventures by source size,
# keeping those whose code works today and whose next step is a hard business
# or engineering problem. Passed over for now: local-site-studio (real
# integrations but bloated, its core site generator is thin),
# sales-export-to-journal (engines copied from sibling ventures),
# retail-pilot-intel, print-atelier and real-estate-agent-photo-app (mostly
# plans and demo UI), workflow-audit and marketplace-fee-compare (thin).
flagships:
  # Added 2026-10-20 first, on the owner's direction that day for research
  # algorithms as tools (prompts/goals.md). New tools of that kind follow
  # portfolio/research-tools/README.md; this entry deepens the first one.
  - venture: changepoint-detector
    why: >-
      PELT and Bayesian online changepoint detection from the papers, exact
      against brute force and a closed-form evidence check, reproducing the
      published Nile 1898 change; page, CLI and agent engine.
    next: >-
      A Poisson cost for counts, a seasonal adjustment (--period n) and an
      AR(1)-aware noise scale (--ar1) are in, each measured on seeded
      synthetic series (README Verification), and --ar1 gives the Bayesian pass a conditional AR(1)
      likelihood (false detections 40/40 -> 0/40, power 40/40 at shift 8, up from 25/40 with prewhitening). The mean and
      mean-and-variance PELT match the independent ruptures package on 100 of 100
      seeded cases (fixture in data/). The Poisson model matches ruptures' PELT with a scipy
      Poisson cost on 90 of 90 seeded cases (fixture in data/). Re-estimating rho for the Bayesian pass from PELT residuals was measured and dropped (27 to 29 of 40 hits, inside noise; README). The PELT side has a joint mean-plus-AR(1) fit (--ar1 joint: 34/40 power at shift 4 against 28/40, same 4/40 false runs). --period --drift --ar1 together is measured (sticky noise: 9.5 -> 1.3 changes per series, README) and choosing the --drift window by leave-one-out error was tried and dropped (worse on all five shapes, README). --model trend (one line per segment, PELT exact) now finds slope breaks and jumps on ramps (README Verification: pure ramp 5.5 -> 0.15 changes per series). Next: a trend inside the seasonal adjustment (--period with a trend currently subtracts the profile, then reads the trend as steps unless --model trend) or a drift window chosen by a rule that rewards clean detection rather than prediction, e.g. minimum PELT segment count on the series itself. --trend (a common slope under steps, composable with --period; 10.1 -> 1.13 changes per series on a ramp with one step, README) sits beside --model trend (a line per segment). --trend with --ar1 is measured on sticky noise over a ramp (the slope loop was cutting the wandering into steps; PELT false runs 28/40 -> 3/40, README). --trend bend now fits one slope change chosen by BIC (knot found at 100.5 for a true 100, 4.58 -> 0.48 changes per series on a ramp whose slope doubles, README). The web page offers it (a "Trend under the steps" menu), and --trend bends adds up to three knots greedily (two-knot ramp, 240 points: 9.55 -> 1.05 changes per series, both knots within 2 points, 0/40 false bends, README). Bends with --ar1 and --period are measured (sticky noise: 9.25 -> 2.0 changes per series with --ar1, but both knots found only 23/40 against 40/40 on white noise; README). Knots are now refined to the point after the greedy search (0.42 against 1.00 changes per series on the 240-point benchmark; README "Knots refined"). An AR(1)-aware BIC for the knot search is in (false bends under sticky noise 11/40 -> 0/40, changes per series 1.98 -> 0.55; README), but both knots are still found in 23/40. --joint-knots scores every pair of grid knots and raises that 23/40 to 36/40 two-knot finds on sticky noise (28/40 within 8 points against 17/40; README), but places knots slightly worse on white noise (24/40 against 30/40). The web page has a switch for --joint-knots. The best pair is now refined to the point before it is compared with the greedy fit (white-noise placement within 8 points 27 -> 33 of 40, level with greedy; README). An exhaustive least-squares knot pair is now offered to the same BIC (white-noise knots within 8 points 32 to 35 of 40, sticky 30 to 33; README). Next: a 10-90% knot range, and the least-squares pair computed after the steps are removed. --knot-margin 0.1 searches knots at 10 to 90% of the series (early knot found within 6 points 0 -> 34 of 40, 0/40 false bends, README "Knot range"). It is measured with --ar1, --period and --joint-knots (early knot found 0 -> 25 to 36 of 40 on each, false bends on ramps 0 to 2 of 40, README) and is on the web page. Late knots with sticky noise are measured too (0 -> 35 of 40) and 0.1 is now the default (README "Knot range"). Seasonal counts are in (--model poisson --period n: multiplicative factors as Poisson exposures, fitted by alternating with PELT; weekly counts, false runs 15/20 -> 0/20 and the planted shift found 20/20, README "Seasonal counts"). Poisson-count trends are in (--model poisson --trend: a common log-linear growth as an exposure, composing with --period; ramp 3.80 -> 0.07 changes per series, step on a ramp found alone 0/40 -> 30/40, README "Count trends"). Bends in the count trend are in (--model poisson --trend bend: changes per series 3.38 -> 0.17 on a growth rate that quadruples at the midpoint, knot within 15 points on 36/40, 0/40 false bends, README "Bends in the count trend"). Count bends with --period are measured (weekly counts: knot within 15 points on 35 of 40, 0 false bends). Overdispersed counts broke the Poisson cost (18 false changes per series on wandering counts) and --overdispersion now scales the penalty by an estimated quasi-Poisson dispersion (0.6 false changes per series; README "Clumpy or sticky counts"), at the price of finding a planted bend on 1 of 40 wandering series. The Bayesian pass is now tempered by the same dispersion (false flags on wandering counts 5.8 -> 0.25 per series, but power at a 1.8x step 22/40 -> 0/40; README). A negative-binomial cost for PELT is in (--overdispersion nb: independent clumpy counts, false changes per series 3.55 Poisson / 0.78 quasi-Poisson -> 0.13, step found 39/40; sticky counts are not helped, 6.75 against 1.20, README "Independent clumpy counts"). The negative binomial now composes with --period and --trend (exposures; weekly clumpy counts, false changes per series 3.92 Poisson / 0.42 quasi-Poisson -> 0.05, and with a trend the step is found 34/40 against 21/40 for quasi-Poisson; README "Clumpy counts with a season or a trend"). The negative binomial is now inside the Bayesian pass (--overdispersion nb: step 3.5x found 38/40 against 16/40 tempered, 0.05 false flags per series against 0.40 for plain Poisson; README), without a season or trend. The negative binomial now also runs in the Bayesian pass with exposures (--period; a grid posterior over the rate, exact predictive; weekly clumpy counts, a 3.5x step found 38/40 against 19/40 quasi-Poisson with 0.05 false flags per series, README "Negative binomial with exposures in the Bayesian pass"). The Bayesian NB pass with --trend is now measured (ramp, step at 105: found 14, 28, 36 of 40 at 1.8x, 2.5x, 3.5x with 0.03 false flags per series, against Poisson's 2.45; README). Two bends for counts are in (--model poisson --trend bends: changes per series 4.08 -> 1.77 on a two-knot growth series, both knots within 15 points on 23/40, 0/40 false bends; README "Two bends in the count trend"). Bends for counts under --period and --overdispersion nb are measured (planted bend kept 15 to 18 of 40, false bends 2 of 40, same as Poisson; a threshold scaled by the NB variance ratio cut false bends to 0 but hits to 9 to 12 of 40 and was dropped; README "Bends on clumpy counts"). The bend search now runs on the NB likelihood itself under --overdispersion nb (planted bend kept 15 to 18 of 40 and knot within 15 points 9 to 13 without a season, 18 to 22 and 13 to 18 weekly, false bends 2 to 0 of 40; README "Bends on clumpy counts"). Next: speed (the NB cost with exposures is O(segment length); a prefix-sum Newton start or caching per knot) and bends for counts with two knots under NB.
  - venture: einvoice-preflight
    why: >-
      Real EN 16931 validator (JSON, UBL, CII, Factur-X PDF; 54+ rules,
      XRechnung, Peppol profiles) with a self-hosted API, Docker and Render
      deploy, ~48 test files, and a regulatory tailwind (EU e-invoicing mandates).
    next: >-
      The official EN 16931 Schematron plus the XRechnung (UBL, CII) and Peppol
      BIS 3 (UBL and CII) add-ons run in Saxon-JS (opt-in, ?schematron=1, picked by
      BT-24); the Docker image bakes them in; all 342 rule ids have an English
      fix; and the web page has an "official Schematron" box that posts XML to
      the self-hosted API and lists the findings (official.mjs). The Peppol
      credit-note and XRechnung CII examples now pass the official rules in
      tests, and the 30 DE-R rules Peppol applies to German invoices have
      English fixes. An in-browser path is in (node build-browser.mjs writes ./browser/ with Saxon-JS's
      browser runtime and the SEFs; checked in headless Chromium, no server). It is not
      on the owner's Pages copy because Saxon-JS's licence bars redistributing it from
      a site that mainly serves it; the owner could ask Saxonica for permission, or the
      rules could be ported to a plain-JS evaluator. A CII credit note (clean) and a UBL credit note with six defects are in, both pinned against the
      official rules. A CII credit note with defects is in too (eight official rules, each with an English fix, pinned by tests). A Factur-X credit note (PDF, 381) is in too, clean under the official rules and read by both tools. A Factur-X credit note with defects is in too (PDF envelope around the defective CII credit note; same findings as the bare XML). A Germany mandate page (germany-e-invoice-mandate.html: receive 2025, issue 2027 and 2028, which formats count, linked from the tool page and sitemap) is in for search. A France mandate page (france-e-invoice-mandate.html: receive 1 Sep 2026, issue 1 Sep 2026 for large and mid-size, 1 Sep 2027 for the rest, Factur-X/UBL/CII, linked from the tool page and sitemap) is in for search. A Belgium mandate page (belgium-e-invoice-mandate.html: structured Peppol B2B since 1 Jan 2026, fines EUR 1,500/3,000/5,000 after the Q1 tolerance, linked from the tool page and sitemap) is in for search. A Poland page (poland-ksef-e-invoice-mandate.html: KSeF 1 Feb and 1 Apr 2026, smallest 1 Jan 2027, penalty deferral to 2028 still a draft bill, FA(3) not validated, said plainly; linked from the tool page and sitemap) is in for search. A Croatia page (croatia-e-invoice-mandate.html: Fiskalizacija 2.0 from 1 Jan 2026, EN 16931 UBL/CII, national profile not checked, said plainly) is in for search. A Spain page (spain-verifactu-e-invoice-mandate.html: Verifactu delayed to 1 Jan 2027 and 1 Jul 2027, not an e-invoicing mandate, Verifactu records not checked, said plainly) is in for search. An Italy page (italy-sdi-e-invoice-mandate.html: SdI and FatturaPA since 2019, not EN 16931, FatturaPA not validated, said plainly) is in for search. A Netherlands page (netherlands-e-invoice-mandate.html: B2G since 2017 and 18 Apr 2019, NLCIUS, B2B still voluntary with a 2030-2032 direction not yet law, NLCIUS rules not checked, said plainly) is in for search. A Romania page (romania-e-factura-e-invoice-mandate.html: RO e-Factura B2B since 1 Jan 2024, B2C 2025, UBL 2.1 RO_CIUS via ANAF SPV, penalty amounts left out because sources conflict, RO_CIUS rules not checked, said plainly) is in for search. A Greece page (greece-mydata-e-invoice-mandate.html: myDATA clearance with a MARK number via certified providers, AADE XML not EN 16931, source dates for the phases conflict and are said so (phase 2 now 2 Nov 2026 per secondary reports of AADE A.1197/2026); linked from the tool page, sitemap and sibling pages) is in for search. A Bulgaria page (bulgaria-e-invoice-mandate.html: no mandate in force, a draft VAT Act amendment in consultation to 23 Oct 2026 proposes NISSEF invoices mostly from 1 Jan 2028, said plainly as a proposal) is in for search. A Portugal page (portugal-e-invoice-mandate.html: no confirmed B2B date, B2G phased in with sources split between 1 Jan 2026 and 2027 for smaller suppliers, certified software and monthly reporting, PDF qualified signature from 1 Jan 2027 per most sources, ATCUD/SAF-T not checked, said plainly) is in for search. A UAE page (uae-e-invoice-mandate.html: go-live 1 Jan 2027 for AED 50m+ revenue, 1 Jul 2027 for the rest, PINT AE through an Accredited Service Provider, PINT AE rules not checked, said plainly; linked from every country page, the tool page and sitemap) is in for search. Next: that decision, or the plain-JS port of the rules; a refresh of the Bulgaria page when the draft passes or changes; NLCIUS/RO_CIUS national rules.
  - venture: shift-roster-builder
    why: >-
      Simulated-annealing scheduler over a dollar cost (availability, rest,
      youth labour rules, state overtime presets, roles) with a self-host
      server, .ics feeds and availability intake.
    next: >-
      The exact check now has a coverage bound (min-cost flow over shifts,
      person-days and weekly hours): on the 32-shift sample week it proves the
      15 uncoverable hours and sits within ~$70 of the roster found, but the
      proof of the cheapest roster still times out (the coverage flow now runs on a sparse graph, 1.7x more nodes in the same 8 s, ~11k nodes/s here, ~94k nodes vs 57k). Symmetry cuts between people who differ only by name are in (equal
      crews of 6-8 on 10 shifts now proven in under 0.5 s, 24x fewer nodes at 4 people; README), but the
      all-different sample week is still not proven. `node cli.mjs --weeks 4 --week-start <Monday>` now plans a month from the terminal (carry-over, dated time off, fairness totals; tested). The bound now skips its flow graph when total capacity already cuts a branch (1.6x more nodes in the same 8 s; still not proven). Measured: the sample week's last $69 is the hours-balance term, not pay (pay in the best roster equals the root bound's pay), and 3.36M nodes / 150 s still does not prove it (README). The balance bound now couples people through the fixed total of covered hours (Lagrangian; sample-week root gap $68.95 -> $55.81, random weeks proven 26 -> 27 of 30, README). Next: a bound that sees whole shifts (the rest of the gap is granularity: per-person subset-sum of hours against target) so full weeks are proven, then
      multi-week rostering that carries fairness and time off across weeks
      (README Limits).
  - venture: photo-editing
    why: >-
      ShootFlow works end to end on real media: checksum-verified ingest,
      catalog, ffmpeg proxies, LUT-graded masters, reels and carousels.
    next: >-
      Sharpness, exposure, motion and dHash near-duplicate grouping now run
      on real frames (src/shootflow/frame_analysis.py). Next: face and
      closed-eye scores and subject framing for the story score (a small
      on-device model, opt-in, behind the same analysis/NNNNN.json contract),
      and RAW stills via a RAW developer so they stop falling back to the
      sha256 stand-in.
  - venture: quick-pick-survey
    why: >-
      Next.js + Postgres app with Glicko-2 ranking, adaptive pairing and a
      Davidson-tie Bradley-Terry conjoint fit, simulation-tested, with a
      deploy-to-your-own-Vercel button.
    next: >-
      The survey builder's back end is in: POST /api/admin/surveys creates a
      survey from an admin's own options (validated in surveyBuilder.ts), and
      GET /api/admin/surveys/[slug]/ranking[?format=csv] returns the pooled
      ranking with random-effects 95% intervals and rank ranges (groupRanking.ts,
      coverage checked on seeded data). The admin form is in (SurveyBuilder on /admin: create a
      survey, copy its link, read the ranking with intervals and rank ranges,
      download the CSV). The /s/[slug] respondent page is in (SurveyRespondent:
      anonymous join via POST /api/surveys/[slug]/join, then the same pair
      questions and Glicko-2 answers as the main flow, resumable from
      localStorage, retry in place). An information-gain pair selector
      (selectNextPairByInformation) is in and measured against the shipped one
      on seeded respondents (docs/INFORMATION-GAIN-SELECTOR.md: rank accuracy
      higher in all four cells, 70 vs 34 items under rd 150 at 300 answers on
      220 items, but 1 vs 5 at 90 answers); not wired in. The dimension-conflict
      bonus and a coverage term are options on it, measured: neither moves
      rd<150 at 90 answers (1 and 0 against 5), the gap is structural (180
      appearances, ~10 each to reach rd 150), so both default off. A staged
      hybrid (selectNextPairHybrid: shipped selector until 120 answers,
      information score after) is in and measured: it equals the shipped one at
      90 answers and keeps 66 of the 70 settled items and the rank gain at 300
      answers on 220 items (docs/INFORMATION-GAIN-SELECTOR.md); not wired in.
      A per-survey `pairSelector` (null follows PAIR_SELECTOR, "standard" or
      "staged"; prisma column, validated in surveyBuilder.ts, a "Question order"
      menu on the admin form, read by /api/trials/next) is in.
      Next: a live check that pair requests stay fast at 220 items, then
      show the admin per-item answer counts so they can see when a list is
      too long for their respondent count.
  - venture: league-schedule-generator
    why: >-
      Circle-method round robins with minimal home/away breaks, court and slot
      assignment under rest constraints, blackouts, play-offs, ladders and
      Swiss formats, with a self-hosted league page.
    next: >-
      Multi-division scheduling on shared venues is in (divisions.mjs, and now
      a browser page, multi-division-league-schedule.html, linked from the
      index and sitemap; venue changes -25% against the naive order on the
      example, unavoidable clashes listed). Venue-to-venue travel times are in
      (`travel` field, minutes per venue pair; -10% road minutes against a flat
      trip count on three venues, README). Rainouts across divisions are in
      (applyDivisionRainouts: a night, a division or named teams, optional make-up date, linked-team aware, re-validated; page step 4).
      A share link now carries the division form (#d=, round-trip tested, opened in headless Chromium).
      Partial nights are filled too (splitRounds, a page box: example league
      on 3 courts 17 -> 13 nights, README). Home/away breaks after rainouts are
      now counted (stats.homeAwayBreaks: 176 -> 395 on 8 seeded leagues) and a
      balance option trims them 12% at +5 days of delay (README), off by default. Home/away flip of moved matches is in
      (`flip: true`, a final pass, no delay: 345 -> 333 breaks on 7 seeds, README; small because teams sit at
      +/-1 home games). Swapping pairs of moved matches was measured and dropped (40 seeds: 1996 -> 1934 with
      single flips, no change from pairs; README). Moving a make-up to an earlier night already on the calendar is in
      (relocate: true; 345 -> 345 alone, 300 -> 296 breaks with balance, no delay, README). Venue fairness
      with multi-season carry-over is in (venueFairness, venueHistory, CLI --history; 3-season imbalance
      5.83 -> 1.29 matches, at +18% venue changes; README). The page has the switch and a box for last season's
      counts, prints next season's history to paste back, and share links carry both (checked in headless
      Chromium). The weight between fairness and travel is in (fairnessWeight, a box on the page; weight 1.5 cuts 3-season imbalance 5.83 -> 1.73 at 1,020 venue changes against 1,028 with fairness off, README). Next: letting a relocation swap two make-ups' nights, or choosing the weight from the league's own travel times.
  - venture: open-tennis-robots
    why: >-
      Parametric CAD (build123d) generating a collector's DXF/STL/STEP
      package, ballistics and tracking planners, ESP32 firmware and a browser
      simulator. Unbuilt hardware, long payoff.
    next: >-
      The feeder CAD v0.1 package is in (manufacturing/feeder/: launcher head,
      trunnion cheeks, turntable, 2040 base with brackets, mast, 3 m net beam,
      poles and camera bar; the build tilts the head through -15..+45 deg for
      collisions and sizes wind ballast). Next: the parts it does not model,
      in this order: the hopper with feed tube and gate, the elevation
      actuator bracket and azimuth drive, then the netting trough that rolls
      balls to the hopper inlet; then check the head's wheel-to-wheel gap
      and plate clearance against the ball path with the flight model's
      launch speeds.
