  - venture: wall-framing-takeoff
    why: >-
      Wall layout engine (studs on layout, kings, jacks, headers, cripples,
      plate splices over studs) with a per-wall self-check, and a Gilmore-Gomory
      cutting-stock order within 0.02% of its LP bound on whole houses; page,
      CLI and agent engine. First tool of the new-home construction program.
    next: >-
      Sheathing landed 2026-10-21 (vertical panels, joints on framing, cut-outs,
      sheet order with a bound; ROADMAP.md milestone 1). Blocking and fire
      blocking landed 2026-10-21 (plan `blocking: {rows, fire}`; engine, cut
      list and order; page controls landed 2026-10-21). A sheathing joint over an opening now comes back as a sized nailer piece (stud size, length from header top to top plate; sheathing result `nailerPieces`, 2026-10-21; rare, since cripples usually give bearing). Nailers are now a cut list and board order of their own (sheathing result `nailerLumber`, CLI; 2026-10-21) and are also pooled into the framing order (`takeoff(plan, nailerCuts(sheathing))`, CLI and page, so they come out of its offcuts). Corner plate laps
      (plan `plateLaps`; top plate through one way, cap the other; totals unchanged) landed 2026-10-21. Two-course
      sheathing for walls taller than the longest sheet landed 2026-10-21 (lower sheet + upper
      course by price per strip, bands cut crosswise, on-edge joint blocking in the cut list). Tee laps (wall `tee: {wall, at, end}`: partition cap runs over the through wall, whose cap is cut for it; engine, CLI, tested) landed 2026-10-21, and the page has a "Butts into" field for it (2026-10-21, clicked through in headless Chromium). Horizontal sheathing landed 2026-10-21 (`orientation: "horizontal"`, CLI `--horizontal`, page tick box; courses, staggered end joints, blocked course joints, cheapest sheet length; clicked through in headless Chromium). Corner overhang landed 2026-10-21 (`sheathing.overhang`, CLI `--overhang`, page tick box; vertical sheets, not horizontal). Rim lap (sheathing runs below the bottom plate over the rim board; `rimLap`, CLI `--rim-lap=`, page field; vertical sheets) landed 2026-10-21. Gable walls landed 2026-10-21 (wall `gable: {pitch}`, symmetric; studs to the roof line, plates along the slope; engine and plan files, not the page; no openings or sheathing on them). An off-centre gable peak landed 2026-10-21 (`gable.peak`; far slope's pitch keeps both eaves level; engine and plan files, not the page). Gable-wall openings under the eave line landed 2026-10-21 (kings and top cripples cut to the slope; bottom plate cut across doors). Openings that rise into the triangle landed 2026-10-21 (header above the eave line, cripples where the roof clears it, rejected if the slope meets the header; engine). Shop drawings landed 2026-10-21 (`drawings.mjs`: a printable sheet per wall with marked members, dimension chain, parts table; CLI `--drawings`, page button; clicked through in headless Chromium). Two-stud corners and ladder blocking at tees landed 2026-10-22 (plan `advanced`, page menu, -4.5% order cost on the example house, clicked through in headless Chromium). Next: single top plate where framing stacks, sheathing the triangle, a 2D reuse of opening cut-outs, then splitting walls into panels on the drawings.
