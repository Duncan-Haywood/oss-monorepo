      An AI sales agent built in stages with a person approving every outbound message; composes icp-lens,
      sales-cadence-builder, sales-call-notes-desk and deal-keeper as its tools. The hard problems are reading
      real replies reliably, keeping consent records, and earning each step of autonomy with measurements.
    next: >-
      History and every measurement: README, eval/README and git (inbox agent,
      daily run, self-host server with TLS and XOAUTH2, research agent, call prep,
      follow-ups, meeting slots and .ics invites, CRM write-back to
      Pipedrive/HubSpot against fake servers only; nineteen agent-written reply
      sets, latest 2026-11-08: false-not-now and wrong-person probe 9/20 before, 15/20 after three narrow changes; false-bounce and false-away probe 9/20 before,
      16/20 after one veto; all sets other than the 117 real bounces, 11 + 12 real
      mail-client emails and the 1,857-reply label mix are agent-written). Real
      people's mail 2026-11-10 (eval/enron.mjs, Enron corpus, 19,153 replies, README):
      stops 70% wrong; vetoes tuned on one half, held-out half scored once: wrong
      stops 30 to 13 per 1,000, right 113 to 108. Next: (1) on the Enron halves, a
      second reader for the labels, the 124 held-out wrong stops left (third-person
      "no need", Lotus Notes quote headers) on the tuning half only; real
      opt-out recall set 2026-11-10 (eval/optout-recall.mjs, Enron 2*-f*,
      README): 103 of 113 caught before, 112 after five patterns, no new wrong
      stop on either half; open: a second reader for its labels; (2)
      real replies to outreach and a real rep's call notes to check the reply rules,
      prep rules and follow-up sorter; (3) M2: score a hosted and a local model
      with eval/model.mjs on the fresh sets (needs a key), with a set labelled by
      a person or another model family before any rule change; (4) run the self-
      host server, OAuth and CRM write-back against a real mailbox, Google or
      Microsoft app and HubSpot or Pipedrive account (all fakes so far); (5) a
      real HubSpot or Pipedrive export for the research agent (none found public).
