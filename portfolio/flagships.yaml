      fairnessWeight box on the page. Swapping pairs of moved matches was
      measured and dropped. Trading two make-ups' nights (`swapNights`, 2026-10-23;
      300 -> 280 breaks on 7 seeds with `balance`). Choosing the fairness weight from the league's own travel (`suggestFairnessWeight`, CLI `--suggest-weight`, 2026-10-24; simulated leagues). Page button "Suggest a weight for my league" landed 2026-10-24 (module worker, suggest-worker.mjs; clicked in Chromium by eval/browser-click.mjs; example league: weight 2, +5% travel). Next: a real league's travel times. Page checkboxes for balance, flip, relocate and swapNights landed 2026-10-23 (share link and CLI too); `node eval/browser-click.mjs` clicks them in Chromium (2026-10-23: 28 checks, ticks survive the share link).

  - venture: open-tennis-robots
    why: >-
      Parametric CAD (build123d) generating a collector's DXF/STL/STEP
      package, ballistics and tracking planners, ESP32 firmware and a browser
      simulator. Unbuilt hardware, long payoff.
    next: >-
      The feeder CAD v0.1 package is in (manufacturing/feeder/: launcher head,
