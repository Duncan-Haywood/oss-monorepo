  - venture: wall-framing-takeoff
    inputs_only: >-
      a real builder's draw schedule, permitted deck plan, architect's DXF,
      framer's takeoff, plumber's drain runs or sub's bids
    why: >-
      Wall layout engine (studs on layout, kings, jacks, headers, cripples,
      plate splices over studs) with a per-wall self-check, and a Gilmore-Gomory
      cutting-stock order within 0.02% of its LP bound on whole houses; page,
      CLI and agent engine. First tool of the new-home construction program.
    next: >-
      History, dates and how each slice was checked: ventures/wall-framing-
      takeoff/README.md and ROADMAP.md (recent: whole-house run on the Schultz IFC
      frames every wood wall on all three floors with `--whole-house`; `--stack`
      2026-11-08 orders several floors' plans together (run on the Schultz floors
      2026-11-08: 49 walls, 0.28% less than ordering apart); stepped walls, door
      and window schedule, wall panels, schedule and cash flow; deck ledger
      fastener check 2026-11-08; winder support boards 2026-11-08). Wanted, all needing real inputs: a real
      builder's activity list and draw schedule for `--schedule` (payment lag,
      retainage); a real permitted deck plan (deck framing, guards and stairs are
      hand arithmetic only); stair stringer and landing post tables, winder radial
      supports, lateral-load connector and anchor sizes; a real architect's DXF; a
      real US wood-framed IFC and a framer's takeoff of the Schultz house to
      compare with (Window Wall French door 39 in sill is in the model's placement, not the engine, ROADMAP 2026-11-09 later; open: 2nd Floor Int 1 and 3rd Floor Int 9 tees and door-near-
      end cases, README); a plumber's real drain runs for `--drilling`; a real
      foundation plan; ceiling steps against a real soffit; trim, drywall and
      siding against real orders and hangs; bid leveling on real bids and a real
      sub's labor rates; gable sheathing nested on real sheets; insulation against
      a real order. Cutting-stock speed is settled for now (exact steepest-edge weights measured, not worth building, ROADMAP 2026-11-09 later). When a slice lands, replace its item here and put its history
      in the README.
  - venture: ai-bookkeeper
    why: >-
      A double-entry ledger in integer cents with a four-layer categorizer that
      learns from each filed line (rules, payee memory, naive Bayes, built-in
      keywords) and an optional bring-your-own-key or local model for the review
      queue. It pairs transfers, reconciles to the statement's running balance,
      and produces a P&L, balance sheet, close checks and QuickBooks, Xero and
      IIF journals; page, CLI and agent engine. Learning curve measured on
      synthetic data (README Verification).
    next: >-
      Tested on fixtures; next are real inputs. Open items, most valuable
      first: (0) built-in keywords on real bank and card exports (HISTORY); Open Collective books (README): learning 63-87% right from memos, 43-65% from payee names; new-payee guess (README): first-time payees 5-21% to 20-65% right; Mint exports (six held out): first-seen 68.7% right, 15.6% wrong; guess held out on Hack Club (wrong 4% to 25%); record gate (seven sets): off, record caps confidence; card MCC 2026-11-11 (README, Scotland and Toronto): first-seen right 41% to 66% and 62% to 73%; next: one-off local merchants via the AI layer; wanted: a firm's own labelled bank books; (1) the AI layer in
      fill-only mode on real bank descriptions, more seeds, a bigger model
      (synthetic so far); (2) the bank readers on real US bank exports (six layouts pinned on made-up rows); (3) a real Stripe, PayPal, eBay, Amazon or Adyen settlement export, and a real 1099-K; (4) a real supplier's terms letter
      checked against the fee and discount rules, and one named lender's own
      schedule against the loan register (`loan check`); (5) receipts
      through real OCR (SROIE totals 76.2%, dates 80.2%, merchants 45.8%;
      wanted: phone photos, real paper); (6) payroll (941, Schedule B, 940,
      deposits, `payroll reconcile`): a real Gusto or ADP report; (7) IRIS
      1099-NEC export done (HISTORY): open: a real upload, 1099-MISC; (8) `salestax
      return` (page card; no-sales-tax states warn): due dates read from the
      state's own page for 11 states (README; OH quarterly unsettled); other states from excerpts or memory; open: a real return layout; (8b) `annualized`
      (Schedule AI): percentages matched to the 2024 form by excerpt
      2026-10-30, factors to state forms, federal text unread (irs.gov
      blocked); (9) EITC: built-in 2025 and 2026 schedules (Schedule EIC
      rows unchecked); 2027 `estimate` takes `--tax-table file.json` until
      the IRS publishes the figures. A run that lands a slice replaces its
      item here; keep this under 2,000 characters.

