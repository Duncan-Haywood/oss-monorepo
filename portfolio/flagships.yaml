# Flagship ventures: the few with real depth that most venture runs deepen.
#
# The owner, 2026-10-20: "on the one hand I like the thousand plus small tools,
# but on the other hand I want to work on deeper business and engineering
# problems and more of the work to be to deepening and improving existing
# projects that have real depth to them."
#
# `portfolio/router/allocate.py` ranks these first, in this order, with the
# task "Deepen (flagship N): <next>". A run that lands a slice of `next`
# rewrites it to the following milestone in the same PR. The owner can
# reorder, add or drop entries; agents may too, with the evidence in the PR.
#
# Why depth, argued at more length (an opinion, not a rule):
# portfolio/opinions/2026-10-20-build-what-an-agent-would-rather-call.md
#
# Chosen 2026-10-20 from an audit of the largest ventures by source size,
# keeping those whose code works today and whose next step is a hard business
# or engineering problem. Passed over for now: local-site-studio (real
# integrations but bloated, its core site generator is thin),
# sales-export-to-journal (engines copied from sibling ventures),
# retail-pilot-intel, print-atelier and real-estate-agent-photo-app (mostly
# plans and demo UI), workflow-audit and marketplace-fee-compare (thin).
flagships:
  # Added 2026-10-20 first, on the owner's direction that day for research
  # algorithms as tools (prompts/goals.md). New tools of that kind follow
  # portfolio/research-tools/README.md; this entry deepens the first one.
  - venture: changepoint-detector
    why: >-
      PELT and Bayesian online changepoint detection from the papers, exact
      against brute force and a closed-form evidence check, reproducing the
      published Nile 1898 change; page, CLI and agent engine.
    next: >-
      A Poisson cost for counts, a seasonal adjustment (--period n) and an
      AR(1)-aware noise scale (--ar1) are in, each measured on seeded
      synthetic series (README Verification), and --ar1 gives the Bayesian pass a conditional AR(1)
      likelihood (false detections 40/40 -> 0/40, power 40/40 at shift 8, up from 25/40 with prewhitening). The mean and
      mean-and-variance PELT match the independent ruptures package on 100 of 100
      seeded cases (fixture in data/). The Poisson model matches ruptures' PELT with a scipy
      Poisson cost on 90 of 90 seeded cases (fixture in data/). Re-estimating rho for the Bayesian pass from PELT residuals was measured and dropped (27 to 29 of 40 hits, inside noise; README). The PELT side has a joint mean-plus-AR(1) fit (--ar1 joint: 34/40 power at shift 4 against 28/40, same 4/40 false runs). --period --drift --ar1 together is measured (sticky noise: 9.5 -> 1.3 changes per series, README) and choosing the --drift window by leave-one-out error was tried and dropped (worse on all five shapes, README). --model trend (one line per segment, PELT exact) now finds slope breaks and jumps on ramps (README Verification: pure ramp 5.5 -> 0.15 changes per series). Next: a trend inside the seasonal adjustment (--period with a trend currently subtracts the profile, then reads the trend as steps unless --model trend) or a drift window chosen by a rule that rewards clean detection rather than prediction, e.g. minimum PELT segment count on the series itself. --trend (a common slope under steps, composable with --period; 10.1 -> 1.13 changes per series on a ramp with one step, README) sits beside --model trend (a line per segment). --trend with --ar1 is measured on sticky noise over a ramp (the slope loop was cutting the wandering into steps; PELT false runs 28/40 -> 3/40, README). --trend bend now fits one slope change chosen by BIC (knot found at 100.5 for a true 100, 4.58 -> 0.48 changes per series on a ramp whose slope doubles, README). The web page offers it (a "Trend under the steps" menu), and --trend bends adds up to three knots greedily (two-knot ramp, 240 points: 9.55 -> 1.05 changes per series, both knots within 2 points, 0/40 false bends, README). Bends with --ar1 and --period are measured (sticky noise: 9.25 -> 2.0 changes per series with --ar1, but both knots found only 23/40 against 40/40 on white noise; README). Knots are now refined to the point after the greedy search (0.42 against 1.00 changes per series on the 240-point benchmark; README "Knots refined"). An AR(1)-aware BIC for the knot search is in (false bends under sticky noise 11/40 -> 0/40, changes per series 1.98 -> 0.55; README), but both knots are still found in 23/40. --joint-knots scores every pair of grid knots and raises that 23/40 to 36/40 two-knot finds on sticky noise (28/40 within 8 points against 17/40; README), but places knots slightly worse on white noise (24/40 against 30/40). The web page has a switch for --joint-knots. The best pair is now refined to the point before it is compared with the greedy fit (white-noise placement within 8 points 27 -> 33 of 40, level with greedy; README). An exhaustive least-squares knot pair is now offered to the same BIC (white-noise knots within 8 points 32 to 35 of 40, sticky 30 to 33; README). Next: a 10-90% knot range, and the least-squares pair computed after the steps are removed. --knot-margin 0.1 searches knots at 10 to 90% of the series (early knot found within 6 points 0 -> 34 of 40, 0/40 false bends, README "Knot range"). It is measured with --ar1, --period and --joint-knots (early knot found 0 -> 25 to 36 of 40 on each, false bends on ramps 0 to 2 of 40, README) and is on the web page. Late knots with sticky noise are measured too (0 -> 35 of 40) and 0.1 is now the default (README "Knot range"). Seasonal counts are in (--model poisson --period n: multiplicative factors as Poisson exposures, fitted by alternating with PELT; weekly counts, false runs 15/20 -> 0/20 and the planted shift found 20/20, README "Seasonal counts"). Poisson-count trends are in (--model poisson --trend: a common log-linear growth as an exposure, composing with --period; ramp 3.80 -> 0.07 changes per series, step on a ramp found alone 0/40 -> 30/40, README "Count trends"). Bends in the count trend are in (--model poisson --trend bend: changes per series 3.38 -> 0.17 on a growth rate that quadruples at the midpoint, knot within 15 points on 36/40, 0/40 false bends, README "Bends in the count trend"). Next: measure count bends with --period and sticky (overdispersed) counts, then more than one knot for counts.
  - venture: einvoice-preflight
    why: >-
      Real EN 16931 validator (JSON, UBL, CII, Factur-X PDF; 54+ rules,
      XRechnung, Peppol profiles) with a self-hosted API, Docker and Render
      deploy, ~48 test files, and a regulatory tailwind (EU e-invoicing mandates).
    next: >-
      The official EN 16931 Schematron plus the XRechnung (UBL, CII) and Peppol
      BIS 3 (UBL and CII) add-ons run in Saxon-JS (opt-in, ?schematron=1, picked by
      BT-24); the Docker image bakes them in; all 342 rule ids have an English
      fix; and the web page has an "official Schematron" box that posts XML to
      the self-hosted API and lists the findings (official.mjs). The Peppol
      credit-note and XRechnung CII examples now pass the official rules in
      tests, and the 30 DE-R rules Peppol applies to German invoices have
      English fixes. An in-browser path is in (node build-browser.mjs writes ./browser/ with Saxon-JS's
      browser runtime and the SEFs; checked in headless Chromium, no server). It is not
      on the owner's Pages copy because Saxon-JS's licence bars redistributing it from
      a site that mainly serves it; the owner could ask Saxonica for permission, or the
      rules could be ported to a plain-JS evaluator. A CII credit note (clean) and a UBL credit note with six defects are in, both pinned against the
      official rules. A CII credit note with defects is in too (eight official rules, each with an English fix, pinned by tests). A Factur-X credit note (PDF, 381) is in too, clean under the official rules and read by both tools. A Factur-X credit note with defects is in too (PDF envelope around the defective CII credit note; same findings as the bare XML). A Germany mandate page (germany-e-invoice-mandate.html: receive 2025, issue 2027 and 2028, which formats count, linked from the tool page and sitemap) is in for search. A France mandate page (france-e-invoice-mandate.html: receive 1 Sep 2026, issue 1 Sep 2026 for large and mid-size, 1 Sep 2027 for the rest, Factur-X/UBL/CII, linked from the tool page and sitemap) is in for search. Next: that decision, or the plain-JS port of the rules.
  - venture: shift-roster-builder
    why: >-
      Simulated-annealing scheduler over a dollar cost (availability, rest,
      youth labour rules, state overtime presets, roles) with a self-host
      server, .ics feeds and availability intake.
    next: >-
      The exact check now has a coverage bound (min-cost flow over shifts,
      person-days and weekly hours): on the 32-shift sample week it proves the
      15 uncoverable hours and sits within ~$70 of the roster found, but the
      proof of the cheapest roster still times out (the coverage flow now runs on a sparse graph, 1.7x more nodes in the same 8 s, ~11k nodes/s here, ~94k nodes vs 57k). Symmetry cuts between people who differ only by name are in (equal
      crews of 6-8 on 10 shifts now proven in under 0.5 s, 24x fewer nodes at 4 people; README), but the
      all-different sample week is still not proven. `node cli.mjs --weeks 4 --week-start <Monday>` now plans a month from the terminal (carry-over, dated time off, fairness totals; tested). The bound now skips its flow graph when total capacity already cuts a branch (1.6x more nodes in the same 8 s; still not proven). Next: close that last gap (an incremental flow reused down the tree, or
      dominance between people where one's availability and limits contain another's at the same wage) so full weeks are proven, then
      multi-week rostering that carries fairness and time off across weeks
      (README Limits).
  - venture: photo-editing
    why: >-
      ShootFlow works end to end on real media: checksum-verified ingest,
      catalog, ffmpeg proxies, LUT-graded masters, reels and carousels.
    next: >-
      Sharpness, exposure, motion and dHash near-duplicate grouping now run
      on real frames (src/shootflow/frame_analysis.py). Next: face and
      closed-eye scores and subject framing for the story score (a small
      on-device model, opt-in, behind the same analysis/NNNNN.json contract),
      and RAW stills via a RAW developer so they stop falling back to the
      sha256 stand-in.
  - venture: quick-pick-survey
    why: >-
      Next.js + Postgres app with Glicko-2 ranking, adaptive pairing and a
      Davidson-tie Bradley-Terry conjoint fit, simulation-tested, with a
      deploy-to-your-own-Vercel button.
    next: >-
      The survey builder's back end is in: POST /api/admin/surveys creates a
      survey from an admin's own options (validated in surveyBuilder.ts), and
      GET /api/admin/surveys/[slug]/ranking[?format=csv] returns the pooled
      ranking with random-effects 95% intervals and rank ranges (groupRanking.ts,
      coverage checked on seeded data). The admin form is in (SurveyBuilder on /admin: create a
      survey, copy its link, read the ranking with intervals and rank ranges,
      download the CSV). The /s/[slug] respondent page is in (SurveyRespondent:
      anonymous join via POST /api/surveys/[slug]/join, then the same pair
      questions and Glicko-2 answers as the main flow, resumable from
      localStorage, retry in place). An information-gain pair selector
      (selectNextPairByInformation) is in and measured against the shipped one
      on seeded respondents (docs/INFORMATION-GAIN-SELECTOR.md: rank accuracy
      higher in all four cells, 70 vs 34 items under rd 150 at 300 answers on
      220 items, but 1 vs 5 at 90 answers); not wired in. Next: add the
      dimension-conflict bonus and active-set staging to its score, re-measure
      rd<150 at 90 answers, then wire it in behind a survey flag.
  - venture: league-schedule-generator
    why: >-
      Circle-method round robins with minimal home/away breaks, court and slot
      assignment under rest constraints, blackouts, play-offs, ladders and
      Swiss formats, with a self-hosted league page.
    next: >-
      Multi-division scheduling on shared venues is in (divisions.mjs, and now
      a browser page, multi-division-league-schedule.html, linked from the
      index and sitemap; venue changes -25% against the naive order on the
      example, unavoidable clashes listed). Venue-to-venue travel times are in
      (`travel` field, minutes per venue pair; -10% road minutes against a flat
      trip count on three venues, README). Rainouts across divisions are in
      (applyDivisionRainouts: a night, a division or named teams, optional make-up date, linked-team aware, re-validated; page step 4).
      A share link now carries the division form (#d=, round-trip tested, opened in headless Chromium).
      Partial nights are filled too (splitRounds, a page box: example league
      on 3 courts 17 -> 13 nights, README). Home/away breaks after rainouts are
      now counted (stats.homeAwayBreaks: 176 -> 395 on 8 seeded leagues) and a
      balance option trims them 12% at +5 days of delay (README), off by default. Next: flip home/away of a moved
      match when the totals allow (the real fix, nothing changes with split
      rounds today), or multi-season carry-over of venue fairness.
  - venture: open-tennis-robots
    why: >-
      Parametric CAD (build123d) generating a collector's DXF/STL/STEP
      package, ballistics and tracking planners, ESP32 firmware and a browser
      simulator. Unbuilt hardware, long payoff.
    next: >-
      The feeder CAD v0.1 package is in (manufacturing/feeder/: launcher head,
      trunnion cheeks, turntable, 2040 base with brackets, mast, 3 m net beam,
      poles and camera bar; the build tilts the head through -15..+45 deg for
      collisions and sizes wind ballast). Next: the parts it does not model,
      in this order: the hopper with feed tube and gate, the elevation
      actuator bracket and azimuth drive, then the netting trough that rolls
      balls to the hopper inlet; then check the head's wheel-to-wheel gap
      and plate clearance against the ball path with the flight model's
      launch speeds.
