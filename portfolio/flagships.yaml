  - venture: changepoint-detector
    why: >-
      PELT and Bayesian online changepoint detection from the papers, exact
      against brute force and a closed-form evidence check, reproducing the
      published Nile 1898 change; page, CLI and agent engine.
    next: >-
      History: README and git. Open: (0) smooth low-noise series over-cut: `--noise-floor k` is uncalibrated and no k isolates GDP's 1970s break; the slope-break test (`--slope-breaks`, README) dates it at 1971Q2 but not significantly; a bar by n and rho landed 2026-11-04 (W 6.5 < bar 9.6, README); wanted: a real break that clears it; cycles and drift: an exact
      AR(2) likelihood inside PELT was no better than AR(1) (README); a real documented step inside a cycle; a cycle
      check not tied to rho (treering: drift not told from a cycle);
      a documented real run of 5+ steps to test the block-variance warning
      (it cannot yet tell drift from steps); BJsales, uspop, US saving rate and US unemployment duration (a 2009 ramp cut 2 to 3 times by every setup; README, 2026-11-06; `ramps` groups those cuts as one rise since 2026-11-07, ungated by any labelled ramp; synthetic check 2026-11-07, README: gap 6 finds 6-point ramps and 6-point step pairs alike (38/40) and misses 24 to 48 point ramps (0 to 8/40): wanted, documented ramps and close steps, and a span-aware rule that does not merge staircases); (1) range95: a closure series quiet outside
      the closure (none of 30 Ansett series is, nor Peace Bridge 2009; README). (2) The steep-
      bump (0.04) clumpy-count cell is under-covered, 65/79 (82%) over six
      seeds (caveat in CLI and JSON). (3) GARCH: a filtered
      series has 1% false alarms but loses the real sd break (97% to 6%);
      a segment-wise GARCH prune (README) keeps it (97% to
      100%) but leaves 48% false alarms at n=200: search cuts jointly. (4) driftWarning fires on real
      shocks and on autocorrelated nulls as well as growing seasons: wanted
      a way to tell a shape from a shock, and to widen the noise scale
      without swallowing a short quarterly shape (--ar1 fixes the rho 0.5
      null but loses UK gas). (4a-4c) Florida juice, Gallup approval and Argentine inflation cases (README): wanted more freezes kept without 148 changes, an over-cut test. (5) Holiday list: helps US births (239 to 205 changes), adds changes on Capital Bikeshare (README); wanted: a shop's counts, or a yearly term.
