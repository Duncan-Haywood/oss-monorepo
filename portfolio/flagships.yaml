      masters is still open. History: ventures/photo-editing/README.md.
  - venture: quick-pick-survey
    why: >-
      Next.js + Postgres app with Glicko-2 ranking, adaptive pairing and a
      Davidson-tie Bradley-Terry conjoint fit, simulation-tested, with a
      deploy-to-your-own-Vercel button.
    next: >-
      Done so far (docs/INFORMATION-GAIN-SELECTOR.md and the READMEs hold
      the numbers): the survey builder (POST /api/admin/surveys, the /admin
      form, the /s/[slug] respondent page, pooled ranking with random-
      effects 95% intervals, rank ranges, CSV, coverage note sized from
      measured answers per respondent); an information-gain pair selector
      and a staged hybrid (equals the shipped one at 90 answers, keeps 66 of
      70 settled items at 300 answers on 220 items), chosen per survey by
      `pairSelector`; an INFO_POOL_CAP of 400 (3000 items 1983 -> 36 ms;
      capped equals uncapped on 600 and 1000 items at 600 answers,
      poolCap.simulation.test.ts); and a live-Postgres ranking integration
      test (ranking.integration.test.ts, 2026-10-22). Pool cap, long budgets, lapses, slot bias and 1000 items were measured 2026-10-22 to 11-04 (docs). The 3000-answer Spearman dip was found and fixed 2026-11-08: the staged selector admitted items alphabetically by id, so ids that follow a meaningful order gave early stages a slice of the range; admission is now by id hash (fixed set 0.62-0.71 -> 0.98 at 3000 answers in process, docs). The live-Postgres noisyRespondents run at 3000 answers confirmed the fix through the routes 2026-11-08 (fixed set 0.979-0.984, docs). The same run with a 20% lapsing answerer (`lapse20`) at 3000 answers 2026-11-09 shows no dip (fixed set 0.924-0.953, docs). Lapses starting at answer 2000 (50%) 2026-11-09: settled items keep 0.98 but items first admitted after the onset end near 0.89 over all items (docs). A rating-based "answers look random" pause was built and measured 2026-11-09 and not wired in (catches 22% of random answering, pauses 7% of honest readings, docs). A repeat-pair consistency probe was measured 2026-11-09 and is not worth building on the selector's own pairs (honest agreement 0.61, 20% lapser 0.57: 3549 repeats to tell them apart; only a lopsided catch pair works, about 100 repeats; docs). Next: more respondents per cell, and a real respondent's answers.

