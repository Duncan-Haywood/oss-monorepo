  # us. to drop prices and increase efficiency this is a long standing project
  # to work on continually." The program is ventures/wall-framing-takeoff/ROADMAP.md.
  - venture: wall-framing-takeoff
    why: >-
      Wall layout engine (studs on layout, kings, jacks, headers, cripples,
      plate splices over studs) with a per-wall self-check, and a Gilmore-Gomory
      cutting-stock order within 0.02% of its LP bound on whole houses; page,
      CLI and agent engine. First tool of the new-home construction program.
    next: >-
      Open items only; landed work is in ventures/wall-framing-takeoff/README.md and ROADMAP.md (roof, foundation,
      gables, sheathing, drywall, budget, schedule and their page controls have all landed on hand-checked fixtures).
      Shop drawings as a PDF with no browser landed 2026-10-27 (`--pdf`, page button; eyeballed on the example house only; per-panel sheets landed 2026-10-28 in the HTML drawings only, not the PDF). DXF floor-plan import landed 2026-10-27 (centre lines, tees, openings; double-line walls paired into centre lines 2026-10-27; closed-rectangle walls with gaps as openings 2026-10-27, checked on Open House Plans output only). Windows 4.5 in or more apart now share kings (2026-10-27; closer is refused, make one opening). A door or window near a wall end now uses the end stud as its king (jacks must clear it; 2026-10-26, hand-checked only). Open: a real architect's DXF through it (block symbols, gaps at openings); a real IFC export (reader landed 2026-10-27 on hand-written fragments only: swept bodies, centred openings, multi-storey); a real foundation plan (the page now has anchor bolt spacing fields, 2026-10-27, wiring test only); ceiling steps checked against a real soffit (engine 2026-10-26, page box 2026-10-27); drywall `jointsOnStuds` (walls 2026-10-26, page control 2026-10-27; ceilings via `ceilingJoistSpacing` 2026-10-26, page control 2026-10-26) checked against a real hang, ceiling joists from the roof (`ceilingJoistsFromRoof` landed 2026-10-26; page option 2026-10-26, source-asserted only); a real sub's labor rates; a real builder's activity list for
      `--schedule`; gable sheathing nested on real sheets (offcut-triangle heights are hand-made); the drywall compound
      rate checked against a product label; the code edition, typed by a person who has the book; insulation (page 2026-10-26, budget lines 2026-10-27; attic bag chart and a real order unchecked); a 2D reuse of
      opening cut-outs, only worth rechecking on a real plan (sample house: 0 panels fit a hole).
  # Added 2026-10-21 third, on the owner's direction that day: "I want to make ai sales agents this is a long term
  # process" (prompts/goals.md, "AI sales agents, a long-term build"). Stages in ventures/sales-agent/ROADMAP.md.
  - venture: sales-agent
    why: >-
      An AI sales agent built in stages with a person approving every outbound message; composes icp-lens,
      sales-cadence-builder, sales-call-notes-desk and deal-keeper as its tools. The hard problems are reading
      real replies reliably, keeping consent records, and earning each step of autonomy with measurements.
    next: >-
      Landed (details in the README and git, not here): M1 inbox agent, M3 daily run, M4a/M4b self-host server
      (fake IMAP and SMTP only; TLS untested), M6a/M6b research agent, M7a call prep, M7b follow-ups.
      Reply rules read 15 of 40, 27 of 41 and 34 of 41 fresh hand-written replies right; prep field rules 12/20 on
      agent-written notes. Header signals (DSN, Auto-Submitted) checked 2026-10-24 on 117 real bounces (flufl.bounce
      data: 102 right before, 116 after fixing 3 hard bounces read as out-of-office; README; mail gem's 5 DSNs 5/5, multi-recipient DSN bug fixed; README). All reply and
      note sets other than that bounce corpus are agent-written. Quote stripping checked 2026-10-24 on 11 real mail-client emails (5 of 11 right before, 11 after; README) and 2026-10-26 on 12 talon emails (11 right; non-English quote headers fixed). Opt-out wording fresh set 2026-10-25 (9 of 18 caught before, 18 of 18 after patching; agent-written, README). Label mix checked against 1,857 real replies 2026-10-25 (opt-outs 1.7% real vs 19% in our sets; eval/README; no text, so no scoring). Next: (1) real human replies and a real rep's call
      notes to check the reply rules, prep rules and follow-up sorter; (2) M2: score a hosted and a local model with
      eval/model.mjs on the fresh sets (needs a key), with a set labelled by a person or another model family before
      any rule change; (3) run the self-host server against a real mailbox (TLS paths tested 2026-10-25 against local TLS servers; a real provider is still untried), then OAuth for Gmail and Microsoft;
      (4) a real HubSpot or Pipedrive export for the research agent.
  # Added 2026-10-20 first, on the owner's direction that day for research
  # algorithms as tools (prompts/goals.md). New tools of that kind follow
  # portfolio/research-tools/README.md; this entry deepens the first one.
  - venture: changepoint-detector
    why: >-
      PELT and Bayesian online changepoint detection from the papers, exact
      against brute force and a closed-form evidence check, reproducing the
      published Nile 1898 change; page, CLI and agent engine.
    next: >-
      Landed history (Poisson, seasonal, AR(1), trend, holidays, bursts, change-date
      range95 for counts, seasonal and trend; real series: Nile, US GDP volatility
      break, UK seat-belt step) and every measurement live in the README and git.
      `meanvar` has min segment 10, a noise warning with Ljung-Box on squares,
      `--robust` (Laplace cost; t3 false alarms 37-63% to 5-8%, but detection 57% vs
      94% on Gaussian n=100) and `--dispersion` (GARCH/t3 false alarms at n=200
      51%/62% to 30%/29%). `--bootstrap` (block-resampled penalty, 2026-10-27) takes GARCH false alarms at n=200 from 51% to 16% (n=100 Gaussian detection 92% to 80%). Real daily FX returns landed 2026-10-26 (README: every mode finds CHF 2015 and Brexit; --bootstrap did NOT cut CHF false alarms because its pilot fit standardises the shock away, kurtosis 111 to 4.3, 2026-10-26; tail-preserving standardisation tried 2026-10-27, per-segment MAD and one global MAD scale: no gain / finds nothing, README; open: a joint fit that dates the shock outside the pilot, UK gas 2026-10-27: raw slope bend 1969Q4 (range 1966-71), log series no bend, --drift cuts the seasonal change into steps, README; open: a multiplicative season on the Gaussian path; `driftWarning` for steps clustered under --drift landed 2026-10-27, threshold unmeasured). Open: bootstrap penalty for counts landed 2026-10-26 (clustered counts false alarms 89% to 11%, but 74% left at log-rate sd 0.4; untested with --trend/holidays/NB; synthetic only); a GARCH-filtered series has 1% false alarms but loses the real sd break (detection 97% to 6%, 2026-10-27), so a GARCH likelihood needs a segment-wise joint fit;
      range95 on a real count series with a true holiday closure or documented slope
      break (log GDP is a near-unit-root; coal disasters hold 1890, 2026-10-26); the growth-change range
      on clumpy (NB) counts reaches ~95% by tempering 1.4, but the large-bump cell
      is still ~86% (fresh seeds 41/77: 101/107 overall, bump 0.04 18/21).
  - venture: einvoice-preflight
    why: >-
      Real EN 16931 validator (JSON, UBL, CII, Factur-X PDF; 54+ rules,
      XRechnung, Peppol profiles) with a self-hosted API, Docker and Render
      deploy, ~48 test files, and a regulatory tailwind (EU e-invoicing mandates).
    next: >-
      Landed history lives in the README and git (UK page: refresh after Budget 2026). FatturaPA XSD 1.2.1 read 2026-10-30 (IT-018..022, matches xmllint on 1,638 mutations). Saudi ZATCA BR-KSA rules (152 checks, SchXslt reader) 2026-10-25. Switzerland page 2026-10-26 (vendor sources only). Open: ZATCA rules on a real sandbox invoice, a real ZATCA credit or debit note (both made-up examples landed 2026-10-25/26), the Saxon route; FatturaPA
      code lists (TD29, RF20 added 2026-10-24 from vendor summaries) and tolerances against the primary spec 1.9 text and any later structure change; Portugal's CIUS-PT add-on (2026-10-25, made-up invoice; AA/RED/INT/NOR fail the EU base BR-CL-17/18 while AMA's own rules admit them, noted in the finding: which validator does AT/eFatura run? try a real sample); Poland's FA(3) (PL-001..017, XSD gate matches xmllint on 4,860 mutations) on a real KSeF test-environment file, more seeds covering the correction, advance and attachment branches;
      the rules and a repair on a real ERP or
      Factur-X export (open the repaired PDF in veraPDF or a viewer); a page
      button for PDFs; PINT SG and A-NZ rules on the Saxon/server route and on a
      real PINT file; RO_CIUS on a real ANAF file and the Saxon route; NLCIUS
      on a real Dutch file (UBL and CII both landed 2026-10-25, made-up examples); India's INV-01 schema check; mandate
      dates read from primary sources where pages cite guides (Denmark, Czech, Estonia, Latvia, Slovenia vendor-only; Luxembourg bill 8815 via law-firm excerpts 2026-10-26, bill text unread; iras.gov.sg,
      ato.gov.au, revenue.ie, CBIC); Mexico CFDI page 2026-10-27, Brazil NF-e page 2026-10-26 (search excerpts only; open: CFDI and NF-e XSD readers, NFS-e); refresh the Bulgaria page when its draft
      passes or changes (consultation closed 2026-10-23, no outcome found 2026-10-26; penalties from 1 Jul 2028 and scope added from adviser reports). A run that lands a slice replaces its item here; keep
      this under 2,000 characters.
  - venture: shift-roster-builder
    why: >-
      Simulated-annealing scheduler over a dollar cost (availability, rest,
      youth labour rules, state overtime presets, roles) with a self-host
      server, .ics feeds and availability intake.
    next: >-
      Landed work and every measurement are in the README and eval/*-bench.mjs.
      State: exact check with a min-cost-flow coverage bound, symmetry cuts, a $0.50
      tolerance, coverage-first pass, ejection chains, contested-shift and whole-
      score pricing, reduced-cost fixing, branching on the priced bound and on the
      open-hours price (coverBranch), and a coverage plateau pass that equals the
      HiGHS ILP optimum (eval/ilp-check.py) on all 12 weeks at 8x22, 10x28, 12x30.
      Floors reach the optimum on 10 of 12 weeks; 10x the branching nodes leaves
      them unchanged, so the open gaps are 12x30 week 1 (72 vs 75) and 10x28 week 4
      (77 vs 78): only a stronger relaxation (person-day clique or LP cuts) closes
      them. Landed 2026-10-26: coverRepair (exact
      large-neighbourhood repair, on with the exact check) reaches the optimum on
      10x28 week 7 and all four 12x30 weeks. Landed 2026-10-27: node
      budget, so it is deterministic; default-on measured: open hours 19 -> 15 but
      open shifts 3 -> 5 on the sample cafe, 547 s suite, so it stays off. Next: an
      a weighted hours-versus-shifts objective (open-shift tiebreak landed 2026-10-28: sample cafe still 15 h / 5 shifts, a real trade-off), or the clique cut; then a tighter pay bound once coverage is proven, then a
      joint multi-week solve. Multi-week fairness is measured (eval/fairness-
      bench.mjs: tough-shift spread 13.2 -> 3.2 over 8 weeks for +0.4% payroll,
      synthetic crews).

