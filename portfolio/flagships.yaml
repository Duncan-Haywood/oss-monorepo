      git (inbox agent, daily run, self-host server with TLS and XOAUTH2,
      research agent, call prep, follow-ups, CRM write-back to
      Pipedrive/HubSpot against fake servers only; ninth reply set 2026-11-04, 23/30 before patching, 0 overreach); 2026-11-05 proposed meeting times read from interested replies and confirmed in the draft (slots.mjs). 2026-11-06 an exact proposed time becomes a tentative zone-less .ics file (invite.mjs); 2026-11-06 the self-host queue serves it behind the token (GET /api/invite, fake mailbox only). Tenth reply set 2026-11-06: 25/30 before patching, 28/30 after, 0 overreach. Eleventh 2026-11-07: 26/30 before, 29/30 after (one overreach left on purpose, a forward-to-CFO one-pager). All reply and note sets
      other than the 117 real bounces, 11 + 12 real mail-client emails and
