# Flagship ventures: the few with real depth that most venture runs deepen.
#
# The owner, 2026-10-20: "on the one hand I like the thousand plus small tools,
# but on the other hand I want to work on deeper business and engineering
# problems and more of the work to be to deepening and improving existing
# projects that have real depth to them."
#
# `portfolio/router/allocate.py` ranks these first, in this order, with the
# task "Deepen (flagship N): <next>". A run that lands a slice of `next`
# rewrites it to the following milestone in the same PR. The owner can
# reorder, add or drop entries; agents may too, with the evidence in the PR.
#
# Why depth, argued at more length (an opinion, not a rule):
# portfolio/opinions/2026-10-20-build-what-an-agent-would-rather-call.md
#
# Chosen 2026-10-20 from an audit of the largest ventures by source size,
# keeping those whose code works today and whose next step is a hard business
# or engineering problem. Passed over for now: local-site-studio (real
# integrations but bloated, its core site generator is thin),
# sales-export-to-journal (engines copied from sibling ventures),
# retail-pilot-intel, print-atelier and real-estate-agent-photo-app (mostly
# plans and demo UI), workflow-audit and marketplace-fee-compare (thin).
flagships:
  # Added 2026-10-21 first, on the owner's direction that day: "I want to make
  # ai accounting systems". It joins up what about ninety single-step
  # accounting tools in ventures/ already did into books that persist and learn.
  - venture: ai-bookkeeper
    why: >-
      A double-entry ledger in integer cents with a four-layer categorizer that
      learns from each filed line (rules, payee memory, naive Bayes, built-in
      keywords) and an optional bring-your-own-key or local model for the review
      queue. It pairs transfers, reconciles to the statement's running balance,
      and produces a P&L, balance sheet, close checks and QuickBooks, Xero and
      IIF journals; page, CLI and agent engine. Learning curve measured on
      synthetic data (README Verification).
    next: >-
      Everything built so far is tested on hand-written fixtures; the next slices
      are about real inputs (landed work is in the README and git history, not
      here). Open items, most valuable first: (0) built-in keywords measured on one real makerspace's bank export (72.7%
      suggested, 96% right, tuned on itself) and on synthetic sets (README Next):
      a second, Hack Club ledger, held out 2026-10-24 (36.5%, 100% right): Actual Budget's BofA sample files 2026-10-25 (28 lines, 25% suggested, no labels, README): HCB page 5 held out 2026-10-25 (44.8%, no labels; README Next): page 6 held out 2026-10-25 (46.0%, no labels): page 7 held out 2026-10-25 (41.3%, no labels): a third, hledger's Open Collective books, had no merchant tail: HCB's card feed has one (35% then 50% suggested, 23.8% to 33.2% held out, no labels; README Next): still wanted, labelled books; (1) the AI layer in fill-only mode
      on real bank descriptions, more seeds, a bigger model (synthetic so far; README Next); (2) the bank readers
      (CSV, OFX/QFX/QIF, Excel, BAI2, Norma 43, CFONB120, statement PDFs, regional
      code pages) on real exports
      from Chase, Bank of America, Wells Fargo, Amex, Capital One and others;
      (3) a real Stripe (payout-row cross-check landed 2026-10-25 on test data), Square, PayPal, eBay or Amazon settlement export for the
      payment-processor import (`form1099k`: try a real 1099-K); (4) a real
      supplier's terms letter checked against the fee and discount rules, and one
      named lender's own schedule against the loan register (`loan check`);
      (5) receipts through real OCR (CORD-v2: 89/95 totals; merchant, date unmeasured) and the reconcile-to-statement command on real paper, and
      reading receipt photos in the page; (6) payroll (941, Schedule B, 940,
      deposits, `payroll reconcile`): a real Gusto or ADP report; (7) one named
      filing service's import layout, from its own spec; (8) `salestax return`:
      due dates still from search excerpts or memory for the states the README
      lists; open: a real return layout; (9) 2027 `estimate`: the indexed QBI
      minimum (199A(i)(3), warns today) and 2027 brackets once the IRS publishes
      the revenue procedure (not out 2026-10-23; the 2027 SS wage base $192,300 is
      in). A run that lands a slice replaces its item here; keep this under 2,000
      characters.

  # Added 2026-10-21 second, on the owner's direction that day: "I want to make
  # tools that can automate part of the new home construction process in the
  # us. to drop prices and increase efficiency this is a long standing project
  # to work on continually." The program is ventures/wall-framing-takeoff/ROADMAP.md.
  - venture: wall-framing-takeoff
    why: >-
      Wall layout engine (studs on layout, kings, jacks, headers, cripples,
      plate splices over studs) with a per-wall self-check, and a Gilmore-Gomory
      cutting-stock order within 0.02% of its LP bound on whole houses; page,
      CLI and agent engine. First tool of the new-home construction program.
    next: >-
      Open items only; landed work is in ventures/wall-framing-takeoff/README.md and ROADMAP.md (roof, foundation,
      gables, sheathing, drywall, budget, schedule and their page controls have all landed on hand-checked fixtures).
      Open: a real foundation plan; ceiling drywall steps; a real sub's labor rates; a real builder's activity list for
      `--schedule`; gable sheathing nested on real sheets (offcut-triangle heights are hand-made); the drywall compound
      rate checked against a product label; the code edition, typed by a person who has the book; insulation on the page (`--insulation` landed on walls and attic loose fill 2026-10-24; attic bag chart unchecked); a 2D reuse of
      opening cut-outs, only worth rechecking on a real plan (sample house: 0 panels fit a hole).
  # Added 2026-10-21 third, on the owner's direction that day: "I want to make ai sales agents this is a long term
  # process" (prompts/goals.md, "AI sales agents, a long-term build"). Stages in ventures/sales-agent/ROADMAP.md.
  - venture: sales-agent
    why: >-
      An AI sales agent built in stages with a person approving every outbound message; composes icp-lens,
      sales-cadence-builder, sales-call-notes-desk and deal-keeper as its tools. The hard problems are reading
      real replies reliably, keeping consent records, and earning each step of autonomy with measurements.
    next: >-
      Landed (details in the README and git, not here): M1 inbox agent, M3 daily run, M4a/M4b self-host server
      (fake IMAP and SMTP only; TLS untested), M6a/M6b research agent, M7a call prep, M7b follow-ups.
      Reply rules read 15 of 40, 27 of 41 and 34 of 41 fresh hand-written replies right; prep field rules 12/20 on
      agent-written notes. Header signals (DSN, Auto-Submitted) checked 2026-10-24 on 117 real bounces (flufl.bounce
      data: 102 right before, 116 after fixing 3 hard bounces read as out-of-office; README; mail gem's 5 DSNs 5/5, multi-recipient DSN bug fixed; README). All reply and
      note sets other than that bounce corpus are agent-written. Quote stripping checked 2026-10-24 on 11 real mail-client emails (5 of 11 right before, 11 after; README). Opt-out wording fresh set 2026-10-25 (9 of 18 caught before, 18 of 18 after patching; agent-written, README). Next: (1) real human replies and a real rep's call
      notes to check the reply rules, prep rules and follow-up sorter; (2) M2: score a hosted and a local model with
      eval/model.mjs on the fresh sets (needs a key), with a set labelled by a person or another model family before
      any rule change; (3) run the self-host server against a real mailbox, then OAuth for Gmail and Microsoft;
      (4) a real HubSpot or Pipedrive export for the research agent.
  # Added 2026-10-20 first, on the owner's direction that day for research
  # algorithms as tools (prompts/goals.md). New tools of that kind follow
  # portfolio/research-tools/README.md; this entry deepens the first one.
  - venture: changepoint-detector
    why: >-
      PELT and Bayesian online changepoint detection from the papers, exact
      against brute force and a closed-form evidence check, reproducing the
      published Nile 1898 change; page, CLI and agent engine.
    next: >-
      Landed history (Poisson, seasonal, --ar1 and joint AR(1), trend, holidays,
      bursts, change-date range95 incl. counts, seasonal and trend, each measured
      on seeded series; slope-change range and growth-change range for counts
      2026-10-22, the latter calibrated to ~95% on three seeded sets) lives in the README
      and git. Landed 2026-10-24: a real volatility break (US GDP growth, Great
      Moderation 1984Q1; `meanvar` finds it, but default min segment 5 reports a
      5-quarter calm patch whose range misses the date; README). Landed 2026-11-03: `meanvar` warns when a segment is under 10 points. Landed 2026-11-09: `meanvar`
      defaults to minimum segment 10 (seeded simulation, README). Landed 2026-11-15: `meanvar` on non-Gaussian noise measured (35-68% false alarms) and a noise warning added (README). Landed 2026-10-25: `--robust` Laplace cost for meanvar (t3 false alarms 37-63% to 5-8%, but 57% vs 94% detection on Gaussian n=100; README). Open: a GARCH-aware cost (Laplace leaves 21-29% false alarms), the robust option on the page and in the Bayesian view; range95 on a real series with a true holiday closure or
      documented slope break (log GDP is a near-unit-root, no clean answer); the growth-change range on clumpy (NB) counts reached ~95% 2026-10-26 by tempering 1.4 (held-out 161/170; the large-bump cell is still ~86%).
