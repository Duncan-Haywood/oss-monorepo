# Flagship ventures: the few with real depth that most venture runs deepen.
#
# The owner, 2026-10-20: "on the one hand I like the thousand plus small tools,
# but on the other hand I want to work on deeper business and engineering
# problems and more of the work to be to deepening and improving existing
# projects that have real depth to them."
#
# `portfolio/router/allocate.py` ranks these first, in this order, with the
# task "Deepen (flagship N): <next>". A run that lands a slice of `next`
# rewrites it to the following milestone in the same PR. The owner can
# reorder, add or drop entries; agents may too, with the evidence in the PR.
#
# Why depth, argued at more length (an opinion, not a rule):
# portfolio/opinions/2026-10-20-build-what-an-agent-would-rather-call.md
#
# Chosen 2026-10-20 from an audit of the largest ventures by source size,
# keeping those whose code works today and whose next step is a hard business
# or engineering problem. Passed over for now: local-site-studio (real
# integrations but bloated, its core site generator is thin),
# sales-export-to-journal (engines copied from sibling ventures),
# retail-pilot-intel, print-atelier and real-estate-agent-photo-app (mostly
# plans and demo UI), workflow-audit and marketplace-fee-compare (thin).
flagships:
  # Added 2026-10-21 first, on the owner's direction that day: "I want to make
  # ai accounting systems". It joins up what about ninety single-step
  # accounting tools in ventures/ already did into books that persist and learn.
  - venture: ai-bookkeeper
    why: >-
      A double-entry ledger in integer cents with a four-layer categorizer that
      learns from each filed line (rules, payee memory, naive Bayes, built-in
      keywords) and an optional bring-your-own-key or local model for the review
      queue. It pairs transfers, reconciles to the statement's running balance,
      and produces a P&L, balance sheet, close checks and QuickBooks, Xero and
      IIF journals; page, CLI and agent engine. Learning curve measured on
      synthetic data (README Verification).
    next: >-
      Tested on fixtures; next are real inputs. Open items, most valuable first: (0) built-in keywords measured on one real makerspace's bank export (72.7%
      suggested, 96% right, tuned on itself) and on synthetic sets (README Next):
      HCB card feed and Actual Budget samples held out (README Next, no labels); wanted: labelled books; (1) the AI layer in fill-only mode
      on real bank descriptions, more seeds, a bigger model (synthetic so far; README Next); (2) the bank readers (fixture sweeps saturated: only a real export adds signal)
      on real exports
      from Chase, Bank of America, Wells Fargo, Amex, Capital One and others;
      (3) a real Stripe PayPal eBay or Amazon settlement export for the
      payment-processor import (`form1099k`: try a real 1099-K; Adyen: wanted a real settlement file); (4) a real
      supplier's terms letter checked against the fee and discount rules, and one
      named lender's own schedule against the loan register (`loan check`);
      (5) receipts through real OCR (SROIE: totals 76.2%, dates 80.2%, merchants 45.8%; wanted: phone photos, real paper); (6) payroll (941, Schedule B, 940,
      deposits, `payroll reconcile`): a real Gusto or ADP report; (7) one named
      filing service's import layout, from its own spec; (8) `salestax return` (page card; no-sales-tax states warn): due dates read from the state's own page only for WA, TX, FL, NY, VA, MN, MO, IL, SC, OH and UT monthly (OH quarterly unseen); TX, FL and GA discounts preset from search excerpts, 1.25% prepayment not modelled; the rest from excerpts or memory; open: a real return layout; (8b) `annualized` (Schedule AI): factors tested, form text unread (irs.gov blocked); (9) EITC: built-in 2025 and 2026 schedules (Schedule EIC rows unchecked); 2027 `estimate` takes `--tax-table file.json` until the IRS publishes the figures. Built-in keywords also probed on 92 + 78 trade descriptors (tuned on themselves, README Next 2026-10-28). A run that lands a slice replaces its item here; keep this under 2,000
      characters.

  # Added 2026-10-21 second, on the owner's direction that day: "I want to make
  # tools that can automate part of the new home construction process in the
  # us. to drop prices and increase efficiency this is a long standing project
  # to work on continually." The program is ventures/wall-framing-takeoff/ROADMAP.md.
  - venture: wall-framing-takeoff
    why: >-
      Wall layout engine (studs on layout, kings, jacks, headers, cripples,
      plate splices over studs) with a per-wall self-check, and a Gilmore-Gomory
      cutting-stock order within 0.02% of its LP bound on whole houses; page,
      CLI and agent engine. First tool of the new-home construction program.
    next: >-
      Open items only; landed work is in ventures/wall-framing-takeoff/README.md and ROADMAP.md. Plan sketch editor landed 2026-10-29 (draw, move, persists, trace-over picture with a two-click scale, move and straighten (level or plumb from two clicks); the picture is kept across reloads on the device, 2026-10-29; README). 
      Siding, eaves, gutters, stairs (`--stairs`; no post sizing or winder framing) landed, hand-checked.  shop drawings PDF, DXF import, shared and end-stud kings, gable plate cuts, nail counts, hold-downs, rafter ties and plate-joint straps have landed (README; hand-checked only). Open: a real architect's DXF through it (jamb-and-arc door symbols from LibreCAD's library read as one door each 2026-10-28, symbols only; door and window block symbols landed on hand-written blocks only; nested and dynamic blocks, gaps at openings); a real IFC export with doors (multi-storey files read one storey at a time, `--storey=N`, checked on KIT's FZK-Haus locally 2026-10-29, not committed; buildingSMART's samples read; swept bodies, centred openings, multi-storey still hand-written only); a real foundation plan (the page now has anchor bolt spacing fields, 2026-10-27, wiring test only); ceiling steps checked against a real soffit (engine, page box); trim boards (a real trim order unchecked); drywall `jointsOnStuds` (walls and ceilings) checked against a real hang, ceiling joists from the roof (`ceilingJoistsFromRoof` landed 2026-10-26; page option 2026-10-26, source-asserted only); bid leveling (`--level-bids`, made-up bids only); a real sub's labor rates; a real builder's activity list for
      `--schedule`; gable sheathing nested on real sheets (offcut-triangle heights are hand-made); insulation  (attic bag chart and a real order unchecked); a 2D reuse of
      opening cut-outs, only worth rechecking on a real plan (sample house: 0 panels fit a hole).
  # Added 2026-10-21 third, on the owner's direction that day: "I want to make ai sales agents this is a long term
  # process" (prompts/goals.md, "AI sales agents, a long-term build"). Stages in ventures/sales-agent/ROADMAP.md.
  - venture: sales-agent
    why: >-
      An AI sales agent built in stages with a person approving every outbound message; composes icp-lens,
      sales-cadence-builder, sales-call-notes-desk and deal-keeper as its tools. The hard problems are reading
      real replies reliably, keeping consent records, and earning each step of autonomy with measurements.
    next: >-
      Landed work, with every measurement, is in the README, eval/README and
      git (inbox agent, daily run, self-host server with TLS and XOAUTH2,
      research agent, call prep, follow-ups, CRM write-back to
      Pipedrive/HubSpot against fake servers only). All reply and note sets
      other than the 117 real bounces, 11 + 12 real mail-client emails and
      the 1,857-reply label mix are agent-written. Next: (1) real human
      replies and a real rep's call notes to check the reply rules, prep
      rules and follow-up sorter; (2) M2: score a hosted and a local model
      with eval/model.mjs on the fresh sets (needs a key), with a set
      labelled by a person or another model family before any rule change;
      (3) run the self-host server, OAuth and CRM write-back against a real
      mailbox, Google or Microsoft app and HubSpot or Pipedrive account (all
      fakes so far); (4) a real HubSpot or Pipedrive export for the research
      agent (none found public).
  # Added 2026-10-20 first, on the owner's direction that day for research
  # algorithms as tools (prompts/goals.md). New tools of that kind follow
  # portfolio/research-tools/README.md; this entry deepens the first one.
  - venture: changepoint-detector
    why: >-
      PELT and Bayesian online changepoint detection from the papers, exact
      against brute force and a closed-form evidence check, reproducing the
      published Nile 1898 change; page, CLI and agent engine.
    next: >-
      Landed history (Poisson, seasonal, AR(1), trend, holidays, bursts,
      --log, change-date range95, bootstrap penalty, excursions,
      driftWarning) and every measurement live in the README and git. Open:
      (1) range95 now holds on a real closure, Ansett's 1989 pilots' dispute
      (4 of 4 setups) and on a real shock, Hurricane Maria in Puerto Rico's
      daily deaths (5 of 5; both 2026-10-29, README); wanted: a closure series quiet
      outside it, as this one returns 24 to 43 other changes (log GDP is a near-unit-root; coal disasters
      hold 1890); (2) the steep-bump (0.04) clumpy-count cell is under-
      covered, 65/79 (82%) over six seeds, and the CLI and JSON carry that
      caveat; (3) a GARCH-filtered series has 1% false alarms but loses the
      real sd break (97% to 6%), so a GARCH likelihood needs a segment-wise
      joint fit; (4) driftWarning fires on growing seasons but also on a
      real shock and rebound (1973 UK driver deaths): wanted a way to tell a
      shape from a shock; net/abs of the window's shifts fails with --trend
      bend, a level-scaled refit and a refit on the log each separate only UK gas
      (2026-10-29, README); a second shock series (Australian arrivals, 2026-10-29) warns in 7 of 8 cells on trend steps; trendless 72-month series (UK lung deaths 1976 spike) warns in 11 of 12 cells but also 3 of 4 on a no-shock null (2026-10-29): wanted a longer one; (5) bootstrap and holiday
      false-alarm cuts are synthetic only.
