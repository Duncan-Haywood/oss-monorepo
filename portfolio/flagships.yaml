      An AI sales agent built in stages with a person approving every outbound message; composes icp-lens,
      sales-cadence-builder, sales-call-notes-desk and deal-keeper as its tools. The hard problems are reading
      real replies reliably, keeping consent records, and earning each step of autonomy with measurements.
    next: >-
      History and every measurement: README, eval/README and git (inbox agent, daily
      run, self-host server with TLS and XOAUTH2, research agent, call prep, follow-ups,
      meeting slots and .ics invites, CRM write-back to Pipedrive/HubSpot against fake
      servers only; nineteen agent-written reply sets). Real people's mail (eval/enron.mjs,
      Enron corpus): seven rule rounds, each scored once on an unread half by a blind agent
      reader; round 7 showed rule rounds had reached the reader's noise. Away policy decided
      2026-11-11 (eval/README "The away policy"): an auto-responder's notice pauses silently,
      a person's away reply pauses and goes to a person (subtype person_away); fresh 7* wrong
      silent stops 3.9 to 1.8 per 1,000, 0 of 365 real auto-replies sent to a person, 2.0
      extra tasks per 1,000 replies. eval/enron.mjs --seen drops text earlier halves fired on:
