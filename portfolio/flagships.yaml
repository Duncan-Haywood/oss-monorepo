# Flagship ventures: the few with real depth that most venture runs deepen.
#
# The owner, 2026-10-20: "on the one hand I like the thousand plus small tools,
# but on the other hand I want to work on deeper business and engineering
# problems and more of the work to be to deepening and improving existing
# projects that have real depth to them."
#
# `portfolio/router/allocate.py` ranks these first, in this order, with the
# task "Deepen (flagship N): <next>". A run that lands a slice of `next`
# rewrites it to the following milestone in the same PR. The owner can
# reorder, add or drop entries; agents may too, with the evidence in the PR.
#
# Why depth, argued at more length (an opinion, not a rule):
# portfolio/opinions/2026-10-20-build-what-an-agent-would-rather-call.md
#
# Chosen 2026-10-20 from an audit of the largest ventures by source size,
# keeping those whose code works today and whose next step is a hard business
# or engineering problem. Passed over for now: local-site-studio (real
# integrations but bloated, its core site generator is thin),
# sales-export-to-journal (engines copied from sibling ventures),
# retail-pilot-intel, print-atelier and real-estate-agent-photo-app (mostly
# plans and demo UI), workflow-audit and marketplace-fee-compare (thin).
flagships:
  # Added 2026-10-21 second, on the owner's direction that day: "I want to make
  # tools that can automate part of the new home construction process in the
  # us. to drop prices and increase efficiency this is a long standing project
  # to work on continually." The program is ventures/wall-framing-takeoff/ROADMAP.md.
  # Moved first on 2026-10-31, on the owner's direction that day to make "deep
  # tech industrial, energy real estate dev and construction" the overarching
  # directions (prompts/goals.md, "Direction: industrial, energy and construction").
  - venture: wall-framing-takeoff
    why: >-
      Wall layout engine (studs on layout, kings, jacks, headers, cripples,
      plate splices over studs) with a per-wall self-check, and a Gilmore-Gomory
      cutting-stock order within 0.02% of its LP bound on whole houses; page,
      CLI and agent engine. First tool of the new-home construction program.
    next: >-
      Landed work, with dates and how each was checked, is in
      ventures/wall-framing-takeoff/README.md and ROADMAP.md (recent, all 2026-11-05/06, mostly hand tests only: dormer, foundation, floor joist, nail, order-by date, paint, electrical, wall tile, HVAC, price sensitivity, fireblocking and plumbing pages, roof nails, wall braces, stepped walls, bench retry with `--gang`; schedule: crews,
      weather, holds, deadline, CSV, risk, and cost-loaded cash flow by week and
      month). Wanted, all needing real inputs: a real builder's activity list
      and draw schedule for `--schedule` (payment lag, retainage); a real
      permitted deck plan (deck framing, guards and stairs are hand arithmetic
      only); stair stringer and landing post tables, winder radial supports,
      connector and anchor sizes; a real architect's DXF; a real US
      wood-framed IFC (the Rust IFC reader, ifc-engine/, is on the page's
      IFC upload as WASM since 2026-11-03 and run in Chromium on the Duplex and
      Schependomlaan models 2026-11-04; a one-wall wood-framed file ran 2026-11-04 and fixed the lost opening sizes; run a whole wood-framed house) to map its
      stud layer to stud sizes;
      a plumber's real drain runs for `--drilling` (stud hole limits, 2026-11-04); a real foundation plan; ceiling steps against a real soffit; trim,
      drywall and siding against real orders and hangs; bid leveling on real
      bids and a real sub's labor rates; gable sheathing nested on real sheets;
      insulation against a real order. When a slice lands, replace its item
      here and put its history in the README.
  - venture: ai-bookkeeper
    why: >-
      A double-entry ledger in integer cents with a four-layer categorizer that
      learns from each filed line (rules, payee memory, naive Bayes, built-in
      keywords) and an optional bring-your-own-key or local model for the review
      queue. It pairs transfers, reconciles to the statement's running balance,
      and produces a P&L, balance sheet, close checks and QuickBooks, Xero and
      IIF journals; page, CLI and agent engine. Learning curve measured on
      synthetic data (README Verification).
    next: >-
      Tested on fixtures; next are real inputs. Open items, most valuable
      first: (0) built-in keywords measured on one real makerspace's bank
      export (72.7% suggested, 96% right, tuned on itself) and on synthetic
      sets (README Next): HCB card feed and Actual Budget samples held out
      (README Next, no labels); wanted: labelled books; (1) the AI layer in
      fill-only mode on real bank descriptions, more seeds, a bigger model
      (synthetic so far; README Next); (2) the bank readers on real exports
      from Chase, Bank of America, Wells Fargo, Amex, Capital One and
      others (six US layouts pinned on made-up rows 2026-11-04); (3) a real Stripe PayPal eBay or Amazon settlement export for
      the payment-processor import (`form1099k`: try a real 1099-K; Adyen:
      wanted a real settlement file); (4) a real supplier's terms letter
      checked against the fee and discount rules, and one named lender's own
      schedule against the loan register (`loan check`); (5) receipts
      through real OCR (SROIE: totals 76.2%, dates 80.2%, merchants 45.8%;
      wanted: phone photos, real paper); (6) payroll (941, Schedule B, 940,
      deposits, `payroll reconcile`): a real Gusto or ADP report; (7) one
      named filing service's import layout, from its own spec; (8) `salestax
      return` (page card; no-sales-tax states warn): due dates read from the
      state's own page only for WA, TX, FL, NY, VA, MN, MO, IL, SC, OH and
      UT monthly (OH quarterly: guides disagree on who files it; OH discount from excerpts); TX, FL and GA discounts
      preset from search excerpts, 1.25% prepayment not modelled; the rest
      from excerpts or memory; open: a real return layout; (8b) `annualized`
      (Schedule AI): percentages matched to the 2024 form by excerpt
      2026-10-30, factors to state forms, federal text unread (irs.gov
      blocked); (9) EITC: built-in 2025 and 2026 schedules (Schedule EIC
      rows unchecked); 2027 `estimate` takes `--tax-table file.json` until
      the IRS publishes the figures. A run that lands a slice replaces its
      item here; keep this under 2,000 characters.

