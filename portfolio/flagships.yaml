      official rules. A CII credit note with defects is in too (eight official rules, each with an English fix, pinned by tests). A Factur-X credit note (PDF, 381) is in too, clean under the official rules and read by both tools. A Factur-X credit note with defects is in too (PDF envelope around the defective CII credit note; same findings as the bare XML). A Germany mandate page (germany-e-invoice-mandate.html: receive 2025, issue 2027 and 2028, which formats count, linked from the tool page and sitemap) is in for search. A France mandate page (france-e-invoice-mandate.html: receive 1 Sep 2026, issue 1 Sep 2026 for large and mid-size, 1 Sep 2027 for the rest, Factur-X/UBL/CII, linked from the tool page and sitemap) is in for search. A Belgium mandate page (belgium-e-invoice-mandate.html: structured Peppol B2B since 1 Jan 2026, fines EUR 1,500/3,000/5,000 after the Q1 tolerance, linked from the tool page and sitemap) is in for search. A Poland page (poland-ksef-e-invoice-mandate.html: KSeF 1 Feb and 1 Apr 2026, smallest 1 Jan 2027, penalty deferral to 2028 still a draft bill, FA(3) not validated, said plainly; linked from the tool page and sitemap) is in for search. A Croatia page (croatia-e-invoice-mandate.html: Fiskalizacija 2.0 from 1 Jan 2026, EN 16931 UBL/CII, national profile not checked, said plainly) is in for search. A Spain page (spain-verifactu-e-invoice-mandate.html: Verifactu delayed to 1 Jan 2027 and 1 Jul 2027, not an e-invoicing mandate, Verifactu records not checked, said plainly) is in for search. An Italy page (italy-sdi-e-invoice-mandate.html: SdI and FatturaPA since 2019, not EN 16931, FatturaPA not validated, said plainly) is in for search. A Netherlands page (netherlands-e-invoice-mandate.html: B2G since 2017 and 18 Apr 2019, NLCIUS, B2B still voluntary with a 2030-2032 direction not yet law, NLCIUS rules not checked, said plainly) is in for search. A Romania page (romania-e-factura-e-invoice-mandate.html: RO e-Factura B2B since 1 Jan 2024, B2C 2025, UBL 2.1 RO_CIUS via ANAF SPV, penalty amounts left out because sources conflict, RO_CIUS rules not checked, said plainly) is in for search. A Greece page (greece-mydata-e-invoice-mandate.html: myDATA clearance with a MARK number via certified providers, AADE XML not EN 16931, source dates for the phases conflict and are said so (phase 2 now 2 Nov 2026 per secondary reports of AADE A.1197/2026); linked from the tool page, sitemap and sibling pages) is in for search. A Bulgaria page (bulgaria-e-invoice-mandate.html: no mandate in force, a draft VAT Act amendment in consultation to 23 Oct 2026 proposes NISSEF invoices mostly from 1 Jan 2028, said plainly as a proposal) is in for search. A Portugal page (portugal-e-invoice-mandate.html: no confirmed B2B date, B2G phased in with sources split between 1 Jan 2026 and 2027 for smaller suppliers, certified software and monthly reporting, PDF qualified signature from 1 Jan 2027 per most sources, ATCUD/SAF-T not checked, said plainly) is in for search. A UAE page (uae-e-invoice-mandate.html: go-live 1 Jan 2027 for AED 50m+ revenue, 1 Jul 2027 for the rest, PINT AE through an Accredited Service Provider, PINT AE rules not checked, said plainly; linked from every country page, the tool page and sitemap) is in for search. Peppol's nine Dutch NL-R rules are shown running on a Dutch credit note (clean and with defects, English fixes, Netherlands page corrected; the endpoint check now accepts EAS 0106 for KVK). FatturaPA files are now read and checked by their own rules (IT-001..IT-017, fatturapa.mjs; Italy page updated). A worked FatturaPA defect example is in (examples/fatturapa-invoice-with-defects.xml, eight rules pinned). Next: verify the FatturaPA code lists and tolerances against the current technical specification, a FatturaPA XSD structure check; a refresh of the Bulgaria page when the draft passes or changes; the NLCIUS and RO_CIUS rules themselves (needs their official Schematron). A Saudi Arabia page (saudi-arabia-zatca-e-invoice-mandate.html: ZATCA Phase 1 since 4 Dec 2021, Fatoora integration in waves, Wave 24 due 30 Jun 2026, Wave 25 above SAR 187,500 due 1 Feb 2027, penalty range from adviser sites only, ZATCA stamp/QR/clearance not checked, said plainly; linked from every country page, the tool page and sitemap) is in for search. A Malaysia page (malaysia-myinvois-e-invoice-mandate.html: MyInvois phased by turnover from 1 Aug 2024, small-business threshold and relaxation end date (31 Dec 2027 vs 30 Jun 2026) conflict between sources and are said so, RM200-20,000 penalty as reported, MyInvois rules not checked, said plainly) is in for search.
  - venture: shift-roster-builder
    why: >-
      Simulated-annealing scheduler over a dollar cost (availability, rest,
      youth labour rules, state overtime presets, roles) with a self-host
      server, .ics feeds and availability intake.
    next: >-
      The exact check now has a coverage bound (min-cost flow over shifts,
      person-days and weekly hours): on the 32-shift sample week it proves the
      15 uncoverable hours and sits within ~$70 of the roster found, but the
      proof of the cheapest roster still times out (the coverage flow now runs on a sparse graph, 1.7x more nodes in the same 8 s, ~11k nodes/s here, ~94k nodes vs 57k). Symmetry cuts between people who differ only by name are in (equal
      crews of 6-8 on 10 shifts now proven in under 0.5 s, 24x fewer nodes at 4 people; README), but the
      all-different sample week is still not proven. `node cli.mjs --weeks 4 --week-start <Monday>` now plans a month from the terminal (carry-over, dated time off, fairness totals; tested). The bound now skips its flow graph when total capacity already cuts a branch (1.6x more nodes in the same 8 s; still not proven). Measured: the sample week's last $69 is the hours-balance term, not pay (pay in the best roster equals the root bound's pay), and 3.36M nodes / 150 s still does not prove it (README). The balance bound now couples people through the fixed total of covered hours (Lagrangian; sample-week root gap $68.95 -> $55.81, random weeks proven 26 -> 27 of 30, README). Next: a bound that sees whole shifts (the rest of the gap is granularity: per-person subset-sum of hours against target) so full weeks are proven, then
      multi-week rostering that carries fairness and time off across weeks
      (README Limits).
