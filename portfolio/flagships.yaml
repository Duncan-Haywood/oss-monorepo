# Flagship ventures: the few with real depth that most venture runs deepen.
#
# The owner, 2026-10-20: "on the one hand I like the thousand plus small tools,
# but on the other hand I want to work on deeper business and engineering
# problems and more of the work to be to deepening and improving existing
# projects that have real depth to them."
#
# `portfolio/router/allocate.py` ranks these first, in this order, with the
# task "Deepen (flagship N): <next>". A run that lands a slice of `next`
# rewrites it to the following milestone in the same PR. The owner can
# reorder, add or drop entries; agents may too, with the evidence in the PR.
#
# Why depth, argued at more length (an opinion, not a rule):
# portfolio/opinions/2026-10-20-build-what-an-agent-would-rather-call.md
#
# Chosen 2026-10-20 from an audit of the largest ventures by source size,
# keeping those whose code works today and whose next step is a hard business
# or engineering problem. Passed over for now: local-site-studio (real
# integrations but bloated, its core site generator is thin),
# sales-export-to-journal (engines copied from sibling ventures),
# retail-pilot-intel, print-atelier and real-estate-agent-photo-app (mostly
# plans and demo UI), workflow-audit and marketplace-fee-compare (thin).
flagships:
  # Added 2026-10-21 second, on the owner's direction that day: "I want to make
  # tools that can automate part of the new home construction process in the
  # us. to drop prices and increase efficiency this is a long standing project
  # to work on continually." The program is ventures/wall-framing-takeoff/ROADMAP.md.
  # Moved first on 2026-10-31, on the owner's direction that day to make "deep
  # tech industrial, energy real estate dev and construction" the overarching
  # directions (prompts/goals.md, "Direction: industrial, energy and construction").
  - venture: wall-framing-takeoff
    why: >-
      Wall layout engine (studs on layout, kings, jacks, headers, cripples,
      plate splices over studs) with a per-wall self-check, and a Gilmore-Gomory
      cutting-stock order within 0.02% of its LP bound on whole houses; page,
      CLI and agent engine. First tool of the new-home construction program.
    next: >-
      History, dates and how each slice was checked: ventures/wall-framing-
      takeoff/README.md and ROADMAP.md (recent: whole-house run on the Schultz IFC
      frames every wood wall on all three floors with `--whole-house`; `--stack`
      2026-11-08 orders several floors' plans together (run on the Schultz floors
      2026-11-08: 49 walls, 0.28% less than ordering apart); stepped walls, door
      and window schedule, wall panels, schedule and cash flow; deck ledger
      fastener check 2026-11-08; winder support boards 2026-11-08). Wanted, all needing real inputs: a real
      builder's activity list and draw schedule for `--schedule` (payment lag,
      retainage); a real permitted deck plan (deck framing, guards and stairs are
      hand arithmetic only); stair stringer and landing post tables, winder radial
      supports, lateral-load connector and anchor sizes; a real architect's DXF; a
      real US wood-framed IFC and a framer's takeoff of the Schultz house to
      compare with (Window Wall French door 39 in sill is in the model's placement, not the engine, ROADMAP 2026-11-09 later; open: 2nd Floor Int 1 and 3rd Floor Int 9 tees and door-near-
      end cases, README); a plumber's real drain runs for `--drilling`; a real
      foundation plan; ceiling steps against a real soffit; trim, drywall and
      siding against real orders and hangs; bid leveling on real bids and a real
      sub's labor rates; gable sheathing nested on real sheets; insulation against
      a real order. Cutting-stock speed is settled for now (exact steepest-edge weights measured, not worth building, ROADMAP 2026-11-09 later). When a slice lands, replace its item here and put its history
      in the README.
  - venture: ai-bookkeeper
    why: >-
      A double-entry ledger in integer cents with a four-layer categorizer that
      learns from each filed line (rules, payee memory, naive Bayes, built-in
      keywords) and an optional bring-your-own-key or local model for the review
      queue. It pairs transfers, reconciles to the statement's running balance,
      and produces a P&L, balance sheet, close checks and QuickBooks, Xero and
      IIF journals; page, CLI and agent engine. Learning curve measured on
      synthetic data (README Verification).
    next: >-
      Tested on fixtures; next are real inputs. Open items, most valuable
      first: (0) built-in keywords measured on one real makerspace's bank
      export (72.7% suggested, 96% right, tuned on itself) and a real Chase card (78.4%), two Apple Cards (56.9% to 63.8%), a Canadian Capital One card (51.9% to 80.0%) and synthetic
      sets (README Next): HCB card feed and Actual Budget samples held out; wanted: labelled books; (1) the AI layer in
      fill-only mode on real bank descriptions, more seeds, a bigger model
      (synthetic so far; README Next); (2) the bank readers on real exports
      from Chase, Bank of America, Wells Fargo, Amex, Capital One and
      others (six US layouts pinned on made-up rows 2026-11-04); (3) a real Stripe PayPal eBay or Amazon settlement export for
      the payment-processor import (`form1099k`: try a real 1099-K; Adyen:
      wanted a real settlement file); (4) a real supplier's terms letter
      checked against the fee and discount rules, and one named lender's own
      schedule against the loan register (`loan check`); (5) receipts
      through real OCR (SROIE: totals 76.2%, dates 80.2%, merchants 45.8%;
      wanted: phone photos, real paper); (6) payroll (941, Schedule B, 940,
      deposits, `payroll reconcile`): a real Gusto or ADP report; (7) one
      named filing service's import layout, from its own spec; (8) `salestax
      return` (page card; no-sales-tax states warn): due dates read from the
      state's own page only for WA, TX, FL, NY, VA, MN, MO, IL, SC, OH and
      UT monthly (OH quarterly: guides disagree on who files it; OH discount from excerpts); other states from excerpts or memory; open: a real return layout; (8b) `annualized`
      (Schedule AI): percentages matched to the 2024 form by excerpt
      2026-10-30, factors to state forms, federal text unread (irs.gov
      blocked); (9) EITC: built-in 2025 and 2026 schedules (Schedule EIC
      rows unchecked); 2027 `estimate` takes `--tax-table file.json` until
      the IRS publishes the figures. A run that lands a slice replaces its
      item here; keep this under 2,000 characters.

  # Added 2026-10-21 third, on the owner's direction that day: "I want to make ai sales agents this is a long term
  # process" (prompts/goals.md, "AI sales agents, a long-term build"). Stages in ventures/sales-agent/ROADMAP.md.
  - venture: sales-agent
    why: >-
      An AI sales agent built in stages with a person approving every outbound message; composes icp-lens,
      sales-cadence-builder, sales-call-notes-desk and deal-keeper as its tools. The hard problems are reading
      real replies reliably, keeping consent records, and earning each step of autonomy with measurements.
    next: >-
      History and every measurement: README, eval/README and git (inbox agent,
      daily run, self-host server with TLS and XOAUTH2, research agent, call prep,
      follow-ups, meeting slots and .ics invites, CRM write-back to
      Pipedrive/HubSpot against fake servers only; nineteen agent-written reply
      sets, latest 2026-11-08: false-not-now and wrong-person probe 9/20 before, 15/20 after three narrow changes; false-bounce and false-away probe 9/20 before,
      16/20 after one veto; all sets other than the 117 real bounces, 11 + 12 real
      mail-client emails and the 1,857-reply label mix are agent-written). Next:
      (1) real mail (false not-now and wrong-person probe 2026-11-11: 9/20 to 18/20); (2)
      real human replies and a real rep's call notes to check the reply rules,
      prep rules and follow-up sorter; (3) M2: score a hosted and a local model
      with eval/model.mjs on the fresh sets (needs a key), with a set labelled by
      a person or another model family before any rule change; (4) run the self-
      host server, OAuth and CRM write-back against a real mailbox, Google or
      Microsoft app and HubSpot or Pipedrive account (all fakes so far); (5) a
      real HubSpot or Pipedrive export for the research agent (none found public).
  # Added 2026-10-20 first, on the owner's direction that day for research
  # algorithms as tools (prompts/goals.md). New tools of that kind follow
  # portfolio/research-tools/README.md; this entry deepens the first one.
  - venture: changepoint-detector
    why: >-
      PELT and Bayesian online changepoint detection from the papers, exact
      against brute force and a closed-form evidence check, reproducing the
      published Nile 1898 change; page, CLI and agent engine.
    next: >-
      History and every trial (real series, sweeps, dates): README and git.
      `--consensus` landed 2026-11-10 (six settings, agreement tiers; README);
      wanted next: the panel on a real drifting series with a documented break.
      Open:
      (0) smooth low-noise series are over-cut: `--noise-floor k` is uncalibrated
      (k=1.5 and `--ar1 joint` each win on synthetic drift at different phi;
      wanted: all three on real drift); the slope-break test dates GDP's 1970s
      break at 1971Q2 but not significantly; real-series trials of 2026-11-09/10 (T-bill variance regime, Mauna Loa CO2 over-cut even with `--trend quad`, global temperature 1946 step and 1976 bend, gold and Sandy bikeshare `--spikes`): README. Wanted: a documented bad print and a count-model spike label; wanted: a model that both dates and tests the 1976 acceleration, a real step inside a cycle, a cycle check not
      tied to rho, a real run of 5+ steps for the block-variance warning, real
      documented ramps and close steps (`ramps` is synthetic only). (1) range95:
      a closure series quiet outside the closure (none found). (2) the steep-
      bump clumpy-count cell is under-covered, 173/217 over ten seeds, not
      retuned. (3) GARCH: a segment-wise prune keeps the real sd break but leaves
      48% false alarms at n=200: search cuts jointly. (4) driftWarning fires on
      real shocks and autocorrelated nulls: wanted a way to tell a shape from a
      shock; (4a-4c) three real series (README). (5) holiday list: helps US
      births, adds changes on Capital Bikeshare; wanted: a shop's counts, or a
      yearly term.

