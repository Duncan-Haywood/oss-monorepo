  - venture: changepoint-detector
    why: >-
      PELT and Bayesian online changepoint detection from the papers, exact
      against brute force and a closed-form evidence check, reproducing the
      published Nile 1898 change; page, CLI and agent engine.
    next: >-
      A Poisson cost for counts, a seasonal adjustment (--period n) and an
      AR(1)-aware noise scale (--ar1) are in, each measured on seeded
      synthetic series (README Verification), and --ar1 gives the Bayesian pass a conditional AR(1)
      likelihood (false detections 40/40 -> 0/40, power 40/40 at shift 8, up from 25/40 with prewhitening). The mean and
      mean-and-variance PELT match the independent ruptures package on 100 of 100
      seeded cases (fixture in data/). The Poisson model matches ruptures' PELT with a scipy
      Poisson cost on 90 of 90 seeded cases (fixture in data/). Re-estimating rho for the Bayesian pass from PELT residuals was measured and dropped (27 to 29 of 40 hits, inside noise; README). The PELT side has a joint mean-plus-AR(1) fit (--ar1 joint: 34/40 power at shift 4 against 28/40, same 4/40 false runs). --period --drift --ar1 together is measured (sticky noise: 9.5 -> 1.3 changes per series, README) and choosing the --drift window by leave-one-out error was tried and dropped (worse on all five shapes, README). --model trend (one line per segment, PELT exact) now finds slope breaks and jumps on ramps (README Verification: pure ramp 5.5 -> 0.15 changes per series). Next: a trend inside the seasonal adjustment (--period with a trend currently subtracts the profile, then reads the trend as steps unless --model trend) or a drift window chosen by a rule that rewards clean detection rather than prediction, e.g. minimum PELT segment count on the series itself. --trend (a common slope under steps, composable with --period; 10.1 -> 1.13 changes per series on a ramp with one step, README) sits beside --model trend (a line per segment). --trend with --ar1 is measured on sticky noise over a ramp (the slope loop was cutting the wandering into steps; PELT false runs 28/40 -> 3/40, README). --trend bend now fits one slope change chosen by BIC (knot found at 100.5 for a true 100, 4.58 -> 0.48 changes per series on a ramp whose slope doubles, README). The web page offers it (a "Trend under the steps" menu), and --trend bends adds up to three knots greedily (two-knot ramp, 240 points: 9.55 -> 1.05 changes per series, both knots within 2 points, 0/40 false bends, README). Bends with --ar1 and --period are measured (sticky noise: 9.25 -> 2.0 changes per series with --ar1, but both knots found only 23/40 against 40/40 on white noise; README). Knots are now refined to the point after the greedy search (0.42 against 1.00 changes per series on the 240-point benchmark; README "Knots refined"). An AR(1)-aware BIC for the knot search is in (false bends under sticky noise 11/40 -> 0/40, changes per series 1.98 -> 0.55; README), but both knots are still found in 23/40. --joint-knots scores every pair of grid knots and raises that 23/40 to 36/40 two-knot finds on sticky noise (28/40 within 8 points against 17/40; README), but places knots slightly worse on white noise (24/40 against 30/40). The web page has a switch for --joint-knots. The best pair is now refined to the point before it is compared with the greedy fit (white-noise placement within 8 points 27 -> 33 of 40, level with greedy; README). An exhaustive least-squares knot pair is now offered to the same BIC (white-noise knots within 8 points 32 to 35 of 40, sticky 30 to 33; README). Next: a 10-90% knot range, and the least-squares pair computed after the steps are removed. --knot-margin 0.1 searches knots at 10 to 90% of the series (early knot found within 6 points 0 -> 34 of 40, 0/40 false bends, README "Knot range"). It is measured with --ar1, --period and --joint-knots (early knot found 0 -> 25 to 36 of 40 on each, false bends on ramps 0 to 2 of 40, README) and is on the web page. Late knots with sticky noise are measured too (0 -> 35 of 40) and 0.1 is now the default (README "Knot range"). Seasonal counts are in (--model poisson --period n: multiplicative factors as Poisson exposures, fitted by alternating with PELT; weekly counts, false runs 15/20 -> 0/20 and the planted shift found 20/20, README "Seasonal counts"). Poisson-count trends are in (--model poisson --trend: a common log-linear growth as an exposure, composing with --period; ramp 3.80 -> 0.07 changes per series, step on a ramp found alone 0/40 -> 30/40, README "Count trends"). Bends in the count trend are in (--model poisson --trend bend: changes per series 3.38 -> 0.17 on a growth rate that quadruples at the midpoint, knot within 15 points on 36/40, 0/40 false bends, README "Bends in the count trend"). Count bends with --period are measured (weekly counts: knot within 15 points on 35 of 40, 0 false bends). Overdispersed counts broke the Poisson cost (18 false changes per series on wandering counts) and --overdispersion now scales the penalty by an estimated quasi-Poisson dispersion (0.6 false changes per series; README "Clumpy or sticky counts"), at the price of finding a planted bend on 1 of 40 wandering series. The Bayesian pass is now tempered by the same dispersion (false flags on wandering counts 5.8 -> 0.25 per series, but power at a 1.8x step 22/40 -> 0/40; README). A negative-binomial cost for PELT is in (--overdispersion nb: independent clumpy counts, false changes per series 3.55 Poisson / 0.78 quasi-Poisson -> 0.13, step found 39/40; sticky counts are not helped, 6.75 against 1.20, README "Independent clumpy counts"). The negative binomial now composes with --period and --trend (exposures; weekly clumpy counts, false changes per series 3.92 Poisson / 0.42 quasi-Poisson -> 0.05, and with a trend the step is found 34/40 against 21/40 for quasi-Poisson; README "Clumpy counts with a season or a trend"). The negative binomial is now inside the Bayesian pass (--overdispersion nb: step 3.5x found 38/40 against 16/40 tempered, 0.05 false flags per series against 0.40 for plain Poisson; README), without a season or trend. The negative binomial now also runs in the Bayesian pass with exposures (--period; a grid posterior over the rate, exact predictive; weekly clumpy counts, a 3.5x step found 38/40 against 19/40 quasi-Poisson with 0.05 false flags per series, README "Negative binomial with exposures in the Bayesian pass"). The Bayesian NB pass with --trend is now measured (ramp, step at 105: found 14, 28, 36 of 40 at 1.8x, 2.5x, 3.5x with 0.03 false flags per series, against Poisson's 2.45; README). Two bends for counts are in (--model poisson --trend bends: changes per series 4.08 -> 1.77 on a two-knot growth series, both knots within 15 points on 23/40, 0/40 false bends; README "Two bends in the count trend"). Bends for counts under --period and --overdispersion nb are measured (planted bend kept 15 to 18 of 40, false bends 2 of 40, same as Poisson; a threshold scaled by the NB variance ratio cut false bends to 0 but hits to 9 to 12 of 40 and was dropped; README "Bends on clumpy counts"). The bend search now runs on the NB likelihood itself under --overdispersion nb (planted bend kept 15 to 18 of 40 and knot within 15 points 9 to 13 without a season, 18 to 22 and 13 to 18 weekly, false bends 2 to 0 of 40; README "Bends on clumpy counts"). The NB cost with a season is now O(classes) per segment (per-class prefix sums; 600 points 109 -> 47 ms, 3000 points 2623 -> 172 ms, identical changes; README "Speed"). The continuous --trend exposure cost is leaner (one log per point, about 1.8x on bends, README Speed). The bend search under NB now ranks knots on the Poisson cost and refits the best 8 under NB (240 points: 6.4 s to 1.8 s, same result; weekly power 22 to 21 kept, knot near 18 to 14 of 40, README Speed). The NB trend cost now warm-starts its rate per segment start (README Speed). A converged fit reuses its last PELT cost (about 15%, identical output). The weekly ranking gap was not the Poisson cost but fine neighbours crowding the NB finalists; finalists are now spread-out grid knots (weekly knot near 14 -> 16 of 40, README Speed). Two bends for counts under NB are measured and the second knot is not found (both knots near the truth 0 to 1 of 40 at rates 10 and 40; false bends gone; lowering the threshold only adds false ones; README "Two bends on clumpy counts"). Next: a sharper two-bend test for clumpy counts (a profile-likelihood or score test on the second hinge instead of the 3 log n cost drop), or the next gap after known holidays (--holidays: one fitted factor on listed rows, composes with --period and --trend; changes per series 3.73 -> 0.07 on 200 daily counts with a 0.3x holiday every 17th day, 2026-10-21, README): fitting the cycle with the holidays held out. A factor per holiday kind landed 2026-10-21 (`label=kind` entries; engine and CLI, README "Holidays of different kinds"; page box not changed). The web page has a holidays box (2026-10-21; page test, and the engine on 200 daily counts with every 17th day a holiday: 6 false changes without the list, 0 with it, factor 0.30). Holidays are now held out of the seasonal factors (2026-10-21; holidays all on one weekday: factor error 0.055 -> 0.020, eval/holiday-heldout.mjs, README). The seasonal PELT pass now sees the holiday exposure (alternating fits, two extra rounds; seasonal-factor error 0.052 -> 0.045, step found 20/20 both ways, eval/holiday-alternate.mjs, 2026-10-21). The second-hinge score test was measured before building it and dropped: the second knot's cost drop does not rank two-bend above one-bend clumpy series (AUC 0.22; data/measure_second_hinge.mjs, README "A sharper second-bend test?", 2026-10-21). Holidays on a real public daily series were tried (2026-10-21: Wikipedia pageviews of "Payroll", 731 days, 18 holidays; factor 0.957, changes 47 -> 45; the series has almost no holiday dip and its changes are bursts; eval/holiday-real.mjs, README "Holidays on a real daily series"). A burst rule landed 2026-10-21 (--bursts [ratio]: isolated days far above both sides' same-phase median are cut back; seeded clumpy weekly counts, changes per series 3.85 -> 0.23 with no step, step found 35 -> 36 of 40, 1.1 ordinary days flagged per series; Payroll pageviews 47 -> 43 changes, since its bursts are mostly runs; eval/bursts.mjs, README Bursts; engine and CLI, not on the page). The page has the burst switch (a checkbox for counts; the spikes cut back are listed under the summary; clicked through in headless Chromium on a 60-day series with one spike: two false changes without it, none with it, 2026-10-22). Next: short-run bursts (2 to 5 days) on the Payroll series, or a real series with a true holiday closure; or drop the clumpy two-bend line and take another gap.
