      XRechnung, Peppol profiles) with a self-hosted API, Docker and Render
      deploy, ~48 test files, and a regulatory tailwind (EU e-invoicing mandates).
    next: >-
      Landed history lives in the README and git (UK page: refresh after Budget 2026). Open: ZATCA rules on a real sandbox invoice, a real ZATCA credit or debit note (both made-up examples landed 2026-10-25/26), the Saxon route; FatturaPA
      code lists (TD29, RF20 added 2026-10-24 from vendor summaries) and tolerances against the primary spec 1.9 text and any later structure change; Portugal's CIUS-PT add-on (made-up invoice; AA/RED/INT/NOR fail EU BR-CL-17/18 though AMA's rules admit them: which validator does AT run?); Poland's FA(3) (PL-001..017, XSD gate matches xmllint on 4,860 mutations; the Ministry's 14 own templates agree with xmllint and 12 are clean, 2026-10-27) on an issued invoice or KSeF test-environment file, more seeds covering the correction, advance and attachment branches;
      the rules and a repair on a real ERP or
      Factur-X export (open the repaired PDF in veraPDF or a viewer); a page
      button for PDFs; PINT SG and A-NZ rules on the Saxon/server route and on a
      real PINT file; RO_CIUS on a real ANAF file and the Saxon route; NLCIUS
      on a real Dutch file (UBL and CII both landed 2026-10-25, made-up examples); India's INV-01 schema check; mandate
      dates read from primary sources where pages cite guides (Denmark, Czech, Estonia, Latvia, Slovenia vendor-only; Luxembourg bill 8815 text unread (status read in search excerpts 2026-10-28: still in committee); iras.gov.sg,
      ato.gov.au, revenue.ie, CBIC); Latin American pages 2026-10-27 (Ecuador SRI sheet unread), Spain B2B dates 2026-10-27 (Order HAC/1028/2026, BOE unread), Brazil NF-e page 2026-10-26 (search excerpts only; open: CFDI and NF-e XSD readers, NFS-e); refresh the Bulgaria page when its draft
      passes or changes (consultation closed 2026-10-23, no outcome found 2026-10-26; penalties from 1 Jul 2028 and scope added from adviser reports). A run that lands a slice replaces its item here; keep
      this under 2,000 characters.
  - venture: shift-roster-builder
    why: >-
      Simulated-annealing scheduler over a dollar cost (availability, rest,
      youth labour rules, state overtime presets, roles) with a self-host
      server, .ics feeds and availability intake.
    next: >-
      Landed work and every measurement are in the README and eval/*-bench.mjs.
      State: exact check with a min-cost-flow coverage bound, symmetry cuts, a $0.50
      tolerance, coverage-first pass, ejection chains, contested-shift and whole-
      score pricing, reduced-cost fixing, branching on the priced bound and on the
      open-hours price (coverBranch), and a coverage plateau pass that equals the
      HiGHS ILP optimum (eval/ilp-check.py) on all 12 weeks at 8x22, 10x28, 12x30.
      Floors reach the optimum on 10 of 12 weeks; 10x the branching nodes leaves
      them unchanged, so the open gaps are 12x30 week 1 (72 vs 75) and 10x28 week 4
      (77 vs 78): only a stronger relaxation (person-day clique or LP cuts) closes
      them. Landed 2026-10-26: coverRepair (exact
      large-neighbourhood repair, on with the exact check) reaches the optimum on
      10x28 week 7 and all four 12x30 weeks. Landed 2026-10-27: node
      budget, so it is deterministic; default-on measured: open hours 19 -> 15 but
      open shifts 3 -> 5 on the sample cafe, 547 s suite, so it stays off. Landed 2026-10-28: open-shift
      tiebreak and `openShiftWeight` (weight 0: 15 h / 5 shifts; 100: 19 h / 3, sample cafe; page select and `--open-shift-hours` landed 2026-10-27). Measured 2026-10-28 (eval/relaxation-check.py): no LP relaxation closes 12x30 week 2 (cliques 68, cover cuts 68.4, Dantzig-Wolfe 72.33; floor 72, optimum 75), so the clique cut is dropped. Next: branch-and-price on the Dantzig-Wolfe LP; then a tighter pay bound once coverage is proven, then a
      joint multi-week solve. Multi-week fairness is measured (eval/fairness-
      bench.mjs: tough-shift spread 13.2 -> 3.2 over 8 weeks for +0.4% payroll,
      synthetic crews).

  - venture: photo-editing
    why: >-
      ShootFlow works end to end on real media: checksum-verified ingest,
      catalog, ffmpeg proxies, LUT-graded masters, reels and carousels.
    next: >-
      `shootflow cull` (2026-10-29) turns that into a standalone folder cull with XMP
      sidecars; `--picks FILE` (2026-10-29) now scores it against a photographer's keepers
      (keeper hit rate, false-reject rate); wanted: a real shoot and its picks to run it on.
      Sharpness, exposure, motion and dHash near-duplicate grouping now run
      on real frames (src/shootflow/frame_analysis.py). Subject framing without a
      model landed 2026-10-21 (detail-energy centroid against thirds points plus
      detail concentration; `framing`, `subject_x/y`, 15% of story_score; synthetic
      patches only, not yet checked against human picks). Horizon tilt
      (tilt_degrees, 2026-10-22; synthetic horizons only) costs a crooked frame up to 8% of story score. Grain (noise_sigma, 2026-10-23; synthetic Gaussian noise only) is taken out of sharpness and costs technical score. Face and closed-eye
      scores landed 2026-10-26 as an opt-in external detector command
      (SHOOTFLOW_FACE_DETECTOR, faces.py; made-up output only). A Haar-cascade
      reference detector (tools/opencv_face_detector.py, 2026-10-29) fills it (one
      real portrait, no real blinks). Next: a trained blink model behind the same
      contract, checked against a photographer's picks (wanted: a labelled portrait set).
      RAW stills are scored from their embedded JPEG preview (raw_preview.py,
      2026-10-22; synthetic containers only, so try real CR2/CR3/NEF/ARW/DNG
      files); developing RAW into proxies and masters (a RAW developer) is
      still open.
  - venture: quick-pick-survey
    why: >-
      Next.js + Postgres app with Glicko-2 ranking, adaptive pairing and a
      Davidson-tie Bradley-Terry conjoint fit, simulation-tested, with a
      deploy-to-your-own-Vercel button.
    next: >-
      Done so far (docs/INFORMATION-GAIN-SELECTOR.md and the READMEs hold
      the numbers): the survey builder (POST /api/admin/surveys, the /admin
      form, the /s/[slug] respondent page, pooled ranking with random-
      effects 95% intervals, rank ranges, CSV, coverage note sized from
      measured answers per respondent); an information-gain pair selector
      and a staged hybrid (equals the shipped one at 90 answers, keeps 66 of
      70 settled items at 300 answers on 220 items), chosen per survey by
      `pairSelector`; an INFO_POOL_CAP of 400 (3000 items 1983 -> 36 ms;
      capped equals uncapped on 600 and 1000 items at 600 answers,
      poolCap.simulation.test.ts); and a live-Postgres ranking integration
      test (ranking.integration.test.ts, 2026-10-22). Pool-cap accuracy at 3000 items measured 2026-10-22 (selector loop,
      2 respondents). Budgets past the list length measured 2026-10-26 (30 items to 1,200
      answers: no stall; hybrid dips below shipped at 300 answers, 5 seeds; 500 items at 2,000
      and 4,000 answers: the cap hides nothing). The 300-answer dip was seed noise (20 seeds, 2026-10-27); with 20% random answers the information selector alone loses to shipped at 120/300 answers and the hybrid does not (docs). Lapse 0.05-0.5 measured 2026-10-27 (hybrid within 0.005 of shipped). First-option bias measured 2026-10-28 (hybrid +0.02 at bias 0.1-0.3, -0.04 at 0.5, 300 answers; docs). First-option fallback landed 2026-10-27 (share >= 0.7 uses shipped; bias 0.5 hybrid 0.592 to 0.651, docs). Second-option fallback landed 2026-10-27 (share <= 0.3 too; bias 0.5 hybrid 0.574 to 0.666, docs). Next: the same check through the route with Postgres, 1000+ items at deep budgets.

