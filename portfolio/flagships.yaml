  - venture: shift-roster-builder
    why: >-
      Simulated-annealing scheduler over a dollar cost (availability, rest,
      youth labour rules, state overtime presets, roles) with a self-host
      server, .ics feeds and availability intake.
    next: >-
      Landed work and every measurement are in the README and eval/*-bench.mjs.
      State: exact check with a min-cost-flow coverage bound, symmetry cuts, a $0.50
      tolerance, coverage-first pass, ejection chains, contested-shift and whole-
      score pricing, reduced-cost fixing, branching on the priced bound and on the
      open-hours price (coverBranch), and a coverage plateau pass that equals the
      HiGHS ILP optimum (eval/ilp-check.py) on all 12 weeks at 8x22, 10x28, 12x30.
      Floors reach the optimum on 10 of 12 weeks; 10x the branching nodes leaves
      them unchanged, so the open gaps are 12x30 week 1 (72 vs 75) and 10x28 week 4
      (77 vs 78): only a stronger relaxation closes them (no LP relaxation tried
      does; eval/relaxation-check.py). 2026-11-04: `--cancel-hours` and `--premium-flat` price `--changes` per kind or in flat dollars. 2026-11-04: `--rest-under` short-turnaround premium report (also across the week boundary with `--last-week`, 2026-11-04). 2026-11-04: weeks over 150 shifts stop on a 20 s time budget (`timeBudgetMs`, `budgetHit`); a 60x392 week took over 110 s before. 2026-11-05: the page's cover finder shows hand-over chains (`coverChain`) when nobody can take a shift outright. 2026-11-05: the CLI gains `--tips` and `--short-under`; 2026-11-06 `--long-over`. 2026-11-04: the CLI takes the page's pay flags (`--burden`, `--split-premium`, `--diff-when`, daily overtime, meal). Landed 2026-10-27 to 2026-11-01 (history in
      the README): open-shift weighting, 14-day-notice page, `--import-shifts`,
      `planStreaks`, `streak:` carry-over, `placeRestBreaks`, `seniorityClaims`.
      Measured: carry-over costs 0 open hours, so a joint multi-week solve is
      dropped; with coverage proven pay is within 0.7% of the bound.
      2026-11-07: `--from-sales` builds shift lines from an hourly sales export at a sales-per-labor-hour target (`demand.mjs`, hand-built sales only); `--skip-dates` and `--half-life` leave out event days and weight recent weeks (hand-built). Next: branch-and-price on the Dantzig-Wolfe LP (the coverage search gap, the one unproven 8x22 week); a real published-schedule export for --import-shifts. 

