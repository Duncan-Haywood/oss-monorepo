      (groupRanking.coverage names options rated by fewer than 3 people and
      suggests waiting or shortening a long list; unit-tested).
      Next: a live check that pair requests stay fast at 220 items, then feed
      measured answers-per-respondent into the shorten-the-list suggestion (it
      now uses median reach).
