      XRechnung, Peppol profiles) with a self-hosted API, Docker and Render
      deploy, ~48 test files, and a regulatory tailwind (EU e-invoicing mandates).
    next: >-
      Landed history (official Schematron, in-browser path, 20+ country mandate
      pages, arithmetic repair, FatturaPA IT-001..IT-018, runs against the
      official EN 16931, XRechnung, Peppol BIS, ZUGFeRD and Factur-X corpora with
      their false positives fixed, Singapore, Australia, Ireland, India and
      RO_CIUS pages and rules, EXTENDED logistics charges read as header
      charges) lives in the README and git. FatturaPA XSD 1.2.1 read 2026-10-30 (IT-018..022, matches xmllint on 1,638 mutations). Saudi ZATCA BR-KSA rules (152 checks, SchXslt reader) 2026-10-25. Czech page (2026-10-25) is vendor-only: read mfcr.cz. Open: ZATCA rules on a real sandbox invoice, a real ZATCA credit or debit note (both made-up examples landed 2026-10-25/26), the Saxon route; FatturaPA
      code lists (TD29, RF20 added 2026-10-24 from vendor summaries) and tolerances against the primary spec 1.9 text and any later structure change; Poland's FA(3) (fa3.mjs PL-001..011; the XSD gate PL-012..017 landed 2026-10-25, 4,860 mutation verdicts match xmllint on 2 seeds) on a real KSeF test-environment file, more seeds covering the correction, advance and attachment branches;
      the rules and a repair on a real ERP or
      Factur-X export (open the repaired PDF in veraPDF or a viewer); a page
      button for PDFs; PINT SG and A-NZ rules on the Saxon/server route and on a
      real PINT file; RO_CIUS on a real ANAF file and the Saxon route; NLCIUS
      (plain-from-xslt.mjs can compile it); India's INV-01 schema check; mandate
      dates read from primary sources where pages cite guides (Denmark page 2026-10-25 now notes the final order BEK 811 of 2026-09-22 but its dates are unconfirmed, erhvervsstyrelsen.dk and retsinformation.dk are blocked here; Estonia secondary only: emta.ee; Latvia, Slovenia pages 2026-10-25 vendor-only (vid.gov.lv, fu.gov.si); iras.gov.sg,
      ato.gov.au, revenue.ie, CBIC); refresh the Bulgaria page when its draft
      passes or changes (consultation closed 2026-10-23, no outcome found 2026-10-25). A run that lands a slice replaces its item here; keep
      this under 2,000 characters.
  - venture: shift-roster-builder
    why: >-
      Simulated-annealing scheduler over a dollar cost (availability, rest,
      youth labour rules, state overtime presets, roles) with a self-host
      server, .ics feeds and availability intake.
    next: >-
      Landed work is in the README and eval/*-bench.mjs, not here. State:
      exact check with a min-cost-flow coverage bound, symmetry cuts, a stated
      $0.50 tolerance, coverage-first pass, ejection chains, contested-shift
      pricing, whole-score pricing and reduced-cost fixing. Measured
      (eval/scale-bench.mjs): proof breaks at larger sizes (6/8 weeks proven at
      6 people x 14 shifts, 4/8 at 8x18, 2/8 at 8x22, 0/8 at 10 people); every
      unproven week at 8-12 people failed at coverage. On 8 x 22 the floor is
      383 h against 387 h open; more subgradient rounds move the bound <0.1%,
      so the root gap is a relaxation gap, not convergence. Branching on the
      priced bound (2026-10-24) cut one 8 x 22 week's gap from 0.66 open hours
      to $2.53; 3 of 4 still unproven. Case 3 stays 36 h open vs floor 35 h at 20x the nodes
      (eval/case-bench.mjs), so more search will not settle it. All six sizes re-measured 2026-10-24 (README: 6x14 8/8 proven, 8x22 3/8, 10x28 and 12x30 still leave up to 26-27 h of coverage unresolved). Next: pair cuts on contested shifts, aimed at 10x28 and 12x30; then a tighter pay bound once coverage is proven (or branching
      on the most contested shift; branch order tried, no gain), the 10 x 28
      and 12 x 30 sizes, then a joint multi-week solve. Multi-week fairness
      measured (eval/fairness-bench.mjs: tough-shift spread 13.2 -> 3.2 over 8
      weeks for +0.4% payroll, synthetic crews).

  - venture: photo-editing
