      a real builder's draw schedule, permitted deck plan, architect's DXF,
      framer's takeoff, plumber's drain runs or sub's bids
    why: >-
      Wall layout engine (studs on layout, kings, jacks, headers, cripples,
      plate splices over studs) with a per-wall self-check, and a Gilmore-Gomory
      cutting-stock order within 0.02% of its LP bound on whole houses; page,
      CLI and agent engine. First tool of the new-home construction program.
    next: >-
      History, dates and how each slice was checked: ventures/wall-framing-
      takeoff/README.md and ROADMAP.md (recent: whole-house run on the Schultz IFC
      frames every wood wall on all three floors with `--whole-house`; `--stack`
      2026-11-08 orders several floors' plans together (run on the Schultz floors
      2026-11-08: 49 walls, 0.28% less than ordering apart); stepped walls, door
      and window schedule, wall panels, schedule and cash flow; deck ledger
      fastener check 2026-11-08; winder support boards 2026-11-08). Wanted, all needing real inputs: a real
      builder's activity list and draw schedule for `--schedule` (payment lag,
      retainage); a real permitted deck plan (deck framing, guards and stairs are
      hand arithmetic only); stair stringer and landing post tables, winder radial
      supports, lateral-load connector and anchor sizes; a real architect's DXF; a
      real US wood-framed IFC and a framer's takeoff of the Schultz house to
      compare with (Window Wall French door 39 in sill is in the model's placement, not the engine, ROADMAP 2026-11-09 later; open: 2nd Floor Int 1 and 3rd Floor Int 9 tees and door-near-
      end cases, README); a plumber's real drain runs for `--drilling`; a real
      foundation plan; ceiling steps against a real soffit; trim, drywall and
      siding against real orders and hangs; bid leveling on real bids and a real
