          tests). Same publishing gate as above — no traffic signal yet.
          Baseline row for the third tool.
      - as_of: 2026-08-24
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          Two tools shipped concurrently by separate sessions, both landing
          as the venture's fourth and fifth: 555-timer-calculator (astable and
          monostable in both directions — analyse given parts, or solve
          backwards from a target frequency, duty cycle, or pulse width to
          nearest-E24 resistors — plus buildability checks the timing
          equations don't make: sub-50% duty cycles a standard astable cannot
          produce, discharge-pin overcurrent, drift-prone resistor values,
          electrolytic-cap tolerance. 29 passing unit tests), and
          rc-filter-calculator (first-order RC/RL filter cutoff frequency and
          time constant across all four topologies, plus a design mode that
          solves for the missing component from a target cutoff and snaps it
          to a buyable preferred value, 24 passing unit tests). Also added
          tools/index.html, a hub listing all five: until now each tool page
          cross-linked only the tools that existed when it was written, so
          resistor-calculator linked to nothing and a visitor who found one
          tool could not discover the others. That is a discoverability
          reading to watch once a public URL exists — entries from the hub
          versus direct entries to a tool. Same publishing gate as above, so
          no traffic signal yet; baseline rows for both tools and the hub.
      - as_of: 2026-08-24
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          Correction, not a new surface: all four tools were counting
          calculations that nobody performed. Each `update()` ran on page
          load to render a first result from the prefilled defaults, and
          recorded an event while doing it — so a visit that bounced
          immediately still logged a calculation. On top of that the
          continuous-input handlers recorded per keystroke, so typing "220"
          into one field logged three more. A single arrive-type-leave
          visit could log a dozen calculations.
          Fixed both: the on-load render no longer counts, and keystroke
          bursts collapse into one event once the input settles (800 ms).
          Verified in headless Chromium — a bare page load now records 0,
          and typing a value records exactly 1.
          No past reading is invalidated, because every reading so far is
          0/null: nothing is deployed, so no inflated number was ever
          recorded. The point of fixing it before launch is that the first
          real reading will mean what it says.
          The fourth tool shipped from a concurrent branch carrying the same
          defect, so the fix covers it too rather than leaving one tool of
          four inflating its own numbers — which would be worse than uniform
          over-counting, because it makes the tools incomparable.
      - as_of: 2026-09-04
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          First question-shaped page for this venture:
          led-resistor-calculator/can-i-use-one-resistor-for-multiple-leds.html,
          comparing a series string, one resistor per LED, and one shared
          resistor across parallel LEDs (18 passing unit tests in
          wiring.test.mjs, numbers derived from Ohm's law by hand rather than
          baselined off a run).
          Counted locally as `led_wiring_compared`, settled the same way as
          the tools above so a page load records nothing and a burst of
          typing records one — kept distinct from the parent tool's
          `led_resistor_calculated` on purpose. The reading worth watching
          once traffic exists is the ratio between the two: this page answers
          the question people search for ("can I use one resistor for
          multiple LEDs"), while the parent answers the one they have after
          deciding, so entries here that go on to the parent are the
          discoverability signal.
          Unlike every earlier row in this entry, this one is **not**
          publishing-gated. The venture's pages have been served from the
          apex at /tools/ai-engineering-academy/ since the mirror learned to
          read ENTRY_OVERRIDES, so this page is publicly reachable from the
          commit that lands it. The zero below is a genuine pre-traffic
          baseline rather than a note about a surface nobody can reach.
      - as_of: 2026-09-04
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          Second question-shaped page for this venture:
          555-timer-calculator/can-i-get-a-50-percent-duty-cycle-from-a-555-timer.html.
          New computed capability, not just prose: designs the diode-mod
          astable (any duty cycle from just above 0% to just below 100%,
          including the 50%-and-below range the plain two-resistor astable
          cannot reach and the parent tool's design panel already rejects
          with an error) — 10 new passing unit tests in calc.test.mjs.
          Counted locally as `diode_astable_designed`, settled the same way
          as every other tool in this venture so a page load records
          nothing and a burst of typing records one. Not publishing-gated,
          same as the LED page above — publicly reachable from the commit
          that lands it. Also linked from the parent calculator's design
          panel this time, next to the "must be above 50" hint that
          previously dead-ended, so this page does not repeat the
          discoverability gap the LED page shipped with (its parent panel
          carries no link back to it). The zero below is a genuine
          pre-traffic baseline.
      - as_of: 2026-09-04
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          Third question-shaped page for this venture:
          voltage-divider-calculator/how-do-i-choose-resistor-values-for-a-loaded-voltage-divider.html.
          New computed capability: designDividerForLoad() sizes R1/R2 from a
          target output, a known load, and a bleeder-current multiple, then
          reports the achieved output and power by calling the venture's
          existing calculateVoltageDivider() rather than a second formula —
          8 new passing unit tests, one of them asserting the achieved
          result is deepEqual to a direct call into that existing function.
          Counted locally as `divider_for_load_designed`, settled the same
          way as the other tools in this venture. Not publishing-gated, same
          as the two pages above. Linked from the parent calculator's
          loaded-output section, next to the load-resistance field it
          extends. The zero below is a genuine pre-traffic baseline.
