# Usage readings per product. See README.md in this directory for what may be
# counted (events, never people) and how to read these numbers.
#
# Add a dated reading rather than overwriting an older one — the trend is the
# signal. A reading of zero is worth recording; it is how a product gets
# retired honestly instead of quietly.
period: 2026-08
products:
  - slug: which-job-first
    surface: static-page-in-repo
    readings:
      - as_of: 2026-09-03
        signals:
          live_url_visitors: null
          ranking_started: 0
          ranking_completed: 0
          exported: 0
        note: >-
          Baseline at publication. The tool ships with a public route on the
          apex from its first commit (`/tools/which-job-first/`), so unlike
          most rows here it has never been an instrumented-but-unreachable
          product. `ranking_completed` against `ranking_started` is the signal
          worth watching: a run abandoned partway means the question count is
          too high for the value returned, which is the one design risk a
          pairwise ranker carries and the thing no amount of copy can settle.
          Counts are local, opt-in, and off by default, so a zero here is the
          expected reading for a tool nobody has switched the counter on for.
  - slug: cra-evidence-desk
    surface: static-page-in-repo
    readings:
      - as_of: 2026-09-03
        signals:
          live_url_visitors: null
          sbom_matched: 0
          record_exported: 0
        note: >-
          First public route. The SBOM/advisory matcher existed only as a
          Python CLI, so nobody could reach it without cloning the repo -- one
          of the 13 ventures still without a public URL after #3076. It also
          only accepted a bespoke component-list shape that no tool emits, so
          even a reader who installed it had to hand-convert their SBOM first.
          This run added CycloneDX/SPDX/OSV support to the canonical Python
          core and ported the rules to dependency-free ESM at `site/`, which
          the canonical build and the front-door mirror both pick up, so it now
          serves from the apex at `/tools/cra-evidence-desk/`. Counts are zero
          because the page is new, not because nothing was measured:
          `sbom_matched` is the activation event (running a match is what the
          tool is for; a page view is not), and the apex nginx log feeds the
          nightly `portfolio-site-usage` job for the server-side half. Local
          counting deliberately records only that a match ran, never which
          components or advisories were in it.
