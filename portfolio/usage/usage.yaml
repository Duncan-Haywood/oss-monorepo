  - slug: ai-engineering-academy
    surface: static-page-in-repo
    readings:
      - as_of: 2026-08-24
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          resistor-calculator shipped; not yet deployed to a public URL
