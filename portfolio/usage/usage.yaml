      - as_of: 2026-08-24
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          Second tool shipped: led-resistor-calculator (E24 nearest-standard
          resistor + power rating for one or more series LEDs, 12 passing
          unit tests). Same publishing gate as above — no traffic signal yet.
          Baseline row for the second tool.
      - as_of: 2026-08-24
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          Third tool shipped: voltage-divider-calculator (unloaded/loaded
          Vout with a load-loading correction, plus a target-Vout design
          mode that snaps R2 to a buyable E24 value, 14 passing unit
          tests). Same publishing gate as above — no traffic signal yet.
          Baseline row for the third tool.
      - as_of: 2026-08-24
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          Two tools shipped concurrently by separate sessions, both landing
          as the venture's fourth and fifth: 555-timer-calculator (astable and
          monostable in both directions — analyse given parts, or solve
          backwards from a target frequency, duty cycle, or pulse width to
          nearest-E24 resistors — plus buildability checks the timing
          equations don't make: sub-50% duty cycles a standard astable cannot
          produce, discharge-pin overcurrent, drift-prone resistor values,
          electrolytic-cap tolerance. 29 passing unit tests), and
          rc-filter-calculator (first-order RC/RL filter cutoff frequency and
          time constant across all four topologies, plus a design mode that
          solves for the missing component from a target cutoff and snaps it
          to a buyable preferred value, 24 passing unit tests). Also added
          tools/index.html, a hub listing all five: until now each tool page
          cross-linked only the tools that existed when it was written, so
          resistor-calculator linked to nothing and a visitor who found one
          tool could not discover the others. That is a discoverability
          reading to watch once a public URL exists — entries from the hub
          versus direct entries to a tool. Same publishing gate as above, so
          no traffic signal yet; baseline rows for both tools and the hub.
      - as_of: 2026-08-24
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          Correction, not a new surface: all four tools were counting
          calculations that nobody performed. Each `update()` ran on page
          load to render a first result from the prefilled defaults, and
          recorded an event while doing it — so a visit that bounced
          immediately still logged a calculation. On top of that the
          continuous-input handlers recorded per keystroke, so typing "220"
          into one field logged three more. A single arrive-type-leave
          visit could log a dozen calculations.
          Fixed both: the on-load render no longer counts, and keystroke
          bursts collapse into one event once the input settles (800 ms).
          Verified in headless Chromium — a bare page load now records 0,
          and typing a value records exactly 1.
          No past reading is invalidated, because every reading so far is
          0/null: nothing is deployed, so no inflated number was ever
          recorded. The point of fixing it before launch is that the first
          real reading will mean what it says.
          The fourth tool shipped from a concurrent branch carrying the same
          defect, so the fix covers it too rather than leaving one tool of
          four inflating its own numbers — which would be worse than uniform
          over-counting, because it makes the tools incomparable.
