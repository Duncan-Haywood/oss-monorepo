# Usage readings per product. See README.md in this directory for what may be
# counted (events, never people) and how to read these numbers.
#
# Add a dated reading rather than overwriting an older one — the trend is the
# signal. A reading of zero is worth recording; it is how a product gets
# retired honestly instead of quietly.
period: 2026-08
products:
  - slug: ai-engineering-academy
    surface: static-page-in-repo
    readings:
      - as_of: 2026-08-24
        signals:
          live_url_visitors: null
          local_events_reported: 0
        note: >-
          resistor-calculator shipped; not yet deployed to a public URL
          (publishing is owner-gated), so there is no traffic signal to read
          and its local-first event counter reports only to the user's own
          browser. Baseline row.
  - slug: repository-branch-hygiene
    surface: github-repository
    readings:
      - as_of: 2026-08-24
        signals:
          local_smoke_scan_findings: 3
          local_smoke_scan_risk: 1
          release_downloads_total: 0
        note: Shipped ancestor detection; local smoke scan found protected and shared refs.
