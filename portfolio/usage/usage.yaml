          about winning — which quotes are still out, which have gone quiet,
          where the price tips, how far under the winner was, how often the yes
          comes — and none of them could tell a contractor whether the work they
          win is worth having. That is the other half of pricing and it is the
          half that decides whether a higher win rate is good news: a shop
          winning 80% at a price that loses money on every job is in deeper
          trouble than one winning 30%, and until now every signal here would
          have read as going well. A won row now carries one optional box for
          what the job came to once it was delivered, the mirror of "Went for"
          on a lost one, and once three are costed the panel reads "The 3 you
          finished here were priced at $2,200 and cost you $1,900 — you kept
          $300, 14% of what you charged. They run from 4% to 40%, so the figure
          above is not what any one of these jobs did — the low end is the one to
          go back over." Three design rules, each of which would fail quietly.
          The share is **pooled** — total kept over total charged — not the mean
          of the per-job shares: on that same book the mean is 16% and 14% is
          what went in the bank, and the mean flatters a shop whose small jobs
          are its profitable ones, which is the common shape in the trades and
          exactly the shape not to be flattered about. A job below its own cost
          is named rather than averaged away, because one job at -15% inside
          five at +18% barely moves a pooled total and is the finding with the
          shortest path to money. And the loss quoted is the deepest in
          *currency*, not in percent — on a book holding a $100 job that cost
          $200 and a $10,000 job that cost $10,500, quoting the worst share
          would point at the small job while the $500 hole went unmentioned.
