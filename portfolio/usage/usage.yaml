          pages_carrying_the_panel: 237
        note: >-
          The same trend reading, moved to where it is worth the most: the
          saved-bid panel on each tool's own page, as `toolTrendSentence`. The
          hub is the page a contractor opens when a customer rings back; the
          tool page is the page they are on while deciding what to charge for
          the next job, which is the only moment the finding can still change an
          outcome. It names no trade there — there is only one, and saying it
          would be telling the reader where they are standing. Both sentences
          are built on one `trendSplit`, so the two pages cannot disagree about
          what moved, and the two injected bundles part company at the sentence
          so neither page pays for the other's. It is the one reading in that
          panel not gated on the page having a headline figure: it counts
          outcomes and never reads a number, so a tool that stores no amounts
          can still tell its user their quotes have stopped landing — a third of
          the pages the panel reaches would otherwise have been silently
          excluded. Counted as `bid_trend_shown`, local only, on change, with no
          name, no trade, no figure and no direction. The reading to take once
          live is `bid_trend_shown` against `saved_bid_trend_shown` — whether
          this finding is met where it can still be acted on or only afterwards
          on the hub, which is the first evidence about which of the two
          surfaces the returning users of this portfolio actually live on. Still
          a baseline row: the public URL remains owner-gated on
          `deploy-settings`.
      - as_of: 2026-08-29
        signals:
          live_url_visitors: null
          saved_bid_mix_shown: 0
          readings_the_hub_now_crosses: 2
        note: >-
          Whether the work a contractor wins is the work that pays. The panel
          could already answer that question twice and had never once asked it:
          `winRateSentence` names the trade that lands most often,
          `keepSentence` names the trade that keeps most of what it charges, and
          a shop reading those two lines one under the other reads two
          compliments and one complaint. Crossed, the same two numbers say the
          opposite. On the fixture the browser step drives — Fence landing 4 of
          5 and keeping 5%, Deck landing 2 of 8 and keeping 28% — the hub now
          reads "The work you win is not the work that pays", names both trades
          with both of their figures, and points the price rise at the trade
          that is *winning* rather than at the one that is losing. That is the
          shape underpricing takes from the inside, and it is invisible from any
          single tool page by construction: one tool knows its own win rate and
          its own kept share, and the finding is that those two disagree between
          trades. It is the strongest argument yet for the hub carrying a bid
          panel at all. The mirror branch is drawn too and is a finding rather
          than a consolation — where the best-landing trade is also the
          best-keeping one, that is the single pairing on the page worth
          answering with more selling rather than a price change. Where the two
          rankings neither clearly oppose nor clearly agree it draws nothing: a
          hedge would be a line on the busiest page in the site that changes
          nothing anyone does. Sample bars are borrowed rather than invented —
          four decided bids for a rate, two costed wins for a share, 40 points
          of rate gap, 15 points of kept-share gap — and a tool must clear all
          of them at once, which makes this strictly rarer than either
          neighbour and is the right price for the one line here that tells
          someone to raise a price. Never a rate, a margin or a mix to aim for,
          pinned by the same test over every branch. Percentages and counts
          only, so a book of dollar and euro jobs compares without a conversion
          this site does not have; a trade priced in two currencies is dropped
          rather than converted. The reading to take once live is
          `saved_bid_mix_shown` against `saved_bid_keep_shown` — how many of
          the contractors who cost their finished jobs have enough decided bids
          on the same trades to get the cross, which is what says whether this
          reading is worth the bar it sets or whether the bar has to come down.
          Counts are per event and carry no name, no slug, no trade, no figure
          and not even which of the two branches drew. Same local, aggregate,
          opt-out and DNT/GPC-respecting path as every other hub event. Still a
          baseline row: the public URL remains owner-gated on
          `deploy-settings`.
      - as_of: 2026-08-29
        signals:
          live_url_visitors: null
          bid_cost_gap_shown: 0
          pages_carrying_the_ask: 160
        note: >-
          Named the narrowest point in this portfolio's money funnel instead of
          going quiet at it. Every money reading built in the last week — the
          tool page's `marginSentence`, the hub's `keepSentence`, the hub's
          `mixSentence` — stands on one input no calculation can supply: what
          the job came to once it was delivered. It is the only field here a
          contractor has to come back *after* the work to fill in, it is
          optional, and until now nothing in the product mentioned it. A
          contractor who won six jobs, marked all six won and costed none saw
          exactly what a fully costed book shows minus one paragraph, with no
          way to tell that was a choice rather than a tool with nothing to
          offer them. `costGapSentence` now says which: "None of the 3 jobs you
          have won here carry what they came to once they were delivered. Put
          that figure in the box beside 3 more of them and this panel starts
          saying what your finished work actually kept — the one question every
          reading above it leaves open, because they are all about winning the
          work rather than about whether the work was worth winning." The
          second branch is the honest one and fires while the margin *is*
          drawing: "Of the 4 jobs you have won here, 3 carry what they came to
          and 1 do not. A kept figure can only be drawn from the 3 — the rest
          are missing from it rather than averaged into it." A pooled figure
          over part of a book, printed where a reader takes it for the whole,
          is the failure `marginSentence`'s own prose could warn about and only
          a count can settle. Deliberately not a banner: it asks for exactly
          what the reading still needs rather than for every row, it never
          appears where costing every won job would still not reach the floor —
          a prompt promising a reading the book cannot support is worse than
          silence — and it disappears the moment the last won job carries a
          cost. No money figure in any branch, so it is safe on a book priced
          in more than one currency, and no "should", no share to aim for. The
          reading to take once live is the funnel itself: `bid_cost_gap_shown`
          as the denominator against `bid_cost_set` as the numerator, which is
          the first direct measurement of whether naming a missing input gets
          it filled in — and `bid_cost_set` against `bid_marked_won` remains
          the outer funnel this sits inside. Counts are per event and carry no
          name, no figure, no cost and not which branch drew. Same local,
          aggregate, opt-out and DNT/GPC-respecting path as every other event.
          Still a baseline row: the public URL remains owner-gated on
          `deploy-settings`.
