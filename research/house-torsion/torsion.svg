<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Garage-line demand over capacity at a 22 ft door for load offsets 0, 5, 10, 15 percent: 100 plf 0.36, 0.38, 0.41, 0.44; 250 plf 0.48, 0.51, 0.55, 0.58; 500 plf 0.59, 0.63, 0.67, 0.71">
<rect width="640" height="360" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Garage-wall line demand over capacity against load offset</text>
<text x="320.0" y="40" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Centred 22 ft door, rigid diaphragm, 115 mph; flexible split gives 1.05</text>
<line x1="60" x2="550" y1="310.0" y2="310.0" stroke="#ddd"/>
<text x="54" y="314.0" text-anchor="end" font-family="sans-serif" font-size="11">0.0</text>
<line x1="60" x2="550" y1="247.5" y2="247.5" stroke="#ddd"/>
<text x="54" y="251.5" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="60" x2="550" y1="185.0" y2="185.0" stroke="#ddd"/>
<text x="54" y="189.0" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="60" x2="550" y1="122.5" y2="122.5" stroke="#ddd"/>
<text x="54" y="126.5" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="60" x2="550" y1="60.0" y2="60.0" stroke="#ddd"/>
<text x="54" y="64.0" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<text x="60.0" y="326" text-anchor="middle" font-family="sans-serif" font-size="11">0%</text>
<text x="223.3" y="326" text-anchor="middle" font-family="sans-serif" font-size="11">5%</text>
<text x="386.7" y="326" text-anchor="middle" font-family="sans-serif" font-size="11">10%</text>
<text x="550.0" y="326" text-anchor="middle" font-family="sans-serif" font-size="11">15%</text>
<text x="305.0" y="352" text-anchor="middle" font-family="sans-serif" font-size="11">load offset from centre, % of house length</text>
<polyline points="60.0,197.5 223.3,191.2 386.7,181.9 550.0,172.5" fill="none" stroke="#8ecae6" stroke-width="2.5"/>
<text x="556.0" y="176.5" font-family="sans-serif" font-size="11" fill="#8ecae6">v = 100 plf</text>
<polyline points="60.0,160.0 223.3,150.6 386.7,138.1 550.0,128.8" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
<text x="556.0" y="132.8" font-family="sans-serif" font-size="11" fill="#2a6f97">v = 250 plf</text>
<polyline points="60.0,125.6 223.3,113.1 386.7,100.6 550.0,88.1" fill="none" stroke="#023047" stroke-width="2.5"/>
<text x="556.0" y="92.1" font-family="sans-serif" font-size="11" fill="#023047">v = 500 plf</text>
</svg>
