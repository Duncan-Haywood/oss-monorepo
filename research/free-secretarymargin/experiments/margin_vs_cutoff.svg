<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the probability of picking the best of 50 candidates against noise level for the tuned cutoff rule and the tuned margin rule; the margin rule is higher by about 0.011 at noise 0.5 and the two converge by noise 2">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Noisy secretary problem, n = 50: tuned margin rule vs tuned cutoff (fresh test draws)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="256.7" y2="256.7" stroke="#ddd"/><text x="58" y="260.7" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="189.4" y2="189.4" stroke="#ddd"/><text x="58" y="193.4" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="122.1" y2="122.1" stroke="#ddd"/><text x="58" y="126.1" text-anchor="end" font-family="sans-serif" font-size="11">0.3</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">noise sd / quality sd</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">P(pick the true best), test draws</text>
<polyline points="64.0,71.2 204.0,166.9 344.0,227.8 624.0,274.1" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="166.9" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="227.8" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="274.1" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">best cutoff</text>
<polyline points="64.0,71.2 204.0,159.5 344.0,223.6 624.0,272.8" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="204.0" cy="159.5" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="223.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="272.8" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">best margin rule</text>
</svg>
