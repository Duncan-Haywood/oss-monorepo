<rect x="315" y="32" width="14" height="10" fill="#1f6fb2"/><text x="335" y="41" font-family="sans-serif" font-size="11">Bayes policy (regression Monte Carlo)</text>
<polyline points="64.0,243.0 204.0,276.2 344.0,300.3 624.0,318.8" fill="none" stroke="#2e8b57" stroke-width="2"/>
