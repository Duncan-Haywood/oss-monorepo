<circle cx="344.0" cy="300.3" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="318.8" r="3" fill="#2e8b57"/>
<rect x="64" y="46" width="14" height="10" fill="#2e8b57"/><text x="84" y="55" font-family="sans-serif" font-size="11">best margin rule</text>
