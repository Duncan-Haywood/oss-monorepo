<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-label="Line plot of the chance of picking the true best candidate against score noise. A Bayes policy that knows the score distribution sits far above the tuned margin and cutoff rules at every noise level and below the clairvoyant upper bound">
<rect width="640" height="394" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Noisy secretary, n = 50: P(pick the true best) on 60,000 test trials</text>
<line x1="64" x2="624" y1="338.0" y2="338.0" stroke="#ddd"/><text x="58" y="342.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="287.4" y2="287.4" stroke="#ddd"/><text x="58" y="291.4" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="236.9" y2="236.9" stroke="#ddd"/><text x="58" y="240.9" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="186.3" y2="186.3" stroke="#ddd"/><text x="58" y="190.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="135.7" y2="135.7" stroke="#ddd"/><text x="58" y="139.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="85.2" y2="85.2" stroke="#ddd"/><text x="58" y="89.2" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="624.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="344.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="12">noise sd sigma (quality sd = 1)</text>
<text x="14" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 204.0)">P(pick the true best)</text>
<polyline points="64.0,85.2 204.0,209.4 344.0,268.7 624.0,307.3" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="85.2" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="209.4" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="268.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="307.3" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">clairvoyant bound (sees all scores)</text>
<polyline points="64.0,189.1 204.0,241.5 344.0,282.5 624.0,312.0" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="189.1" r="3" fill="#1f6fb2"/>
<circle cx="204.0" cy="241.5" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="282.5" r="3" fill="#1f6fb2"/>
