<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the chance of picking the true best candidate against score noise. A Bayes policy that knows the score distribution sits far above the tuned margin and cutoff rules at every noise level and below the clairvoyant upper bound">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Noisy secretary, n = 50: P(pick the true best) on 60,000 test trials</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.4" y2="273.4" stroke="#ddd"/><text x="58" y="277.4" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="222.9" y2="222.9" stroke="#ddd"/><text x="58" y="226.9" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="172.3" y2="172.3" stroke="#ddd"/><text x="58" y="176.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="121.7" y2="121.7" stroke="#ddd"/><text x="58" y="125.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="71.2" y2="71.2" stroke="#ddd"/><text x="58" y="75.2" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">noise sd sigma (quality sd = 1)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">P(pick the true best)</text>
<polyline points="64.0,71.2 204.0,195.4 344.0,254.7 624.0,293.3" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="195.4" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="254.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="293.3" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">clairvoyant bound (sees all scores)</text>
<polyline points="64.0,175.1 204.0,227.5 344.0,268.5 624.0,298.0" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="175.1" r="3" fill="#1f6fb2"/>
<circle cx="204.0" cy="227.5" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="268.5" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="298.0" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">Bayes policy (regression Monte Carlo)</text>
<polyline points="64.0,229.0 204.0,262.2 344.0,286.3 624.0,304.8" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="229.0" r="3" fill="#2e8b57"/>
<circle cx="204.0" cy="262.2" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="286.3" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="304.8" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">best margin rule</text>
<polyline points="64.0,229.0 204.0,265.0 344.0,287.9 624.0,305.2" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="229.0" r="3" fill="#8e44ad"/>
<circle cx="204.0" cy="265.0" r="3" fill="#8e44ad"/>
<circle cx="344.0" cy="287.9" r="3" fill="#8e44ad"/>
<circle cx="624.0" cy="305.2" r="3" fill="#8e44ad"/>
<rect x="574" y="32" width="14" height="10" fill="#8e44ad"/><text x="594" y="41" font-family="sans-serif" font-size="11">best cutoff rule</text>
</svg>
