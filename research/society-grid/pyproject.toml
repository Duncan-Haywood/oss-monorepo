[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-grid"
version = "0.1.0"
description = "Allies as patches on a 2D torus: does the block-versus-neighbourhood rule from the ring carry over"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
