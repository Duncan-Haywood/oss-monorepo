<circle cx="176.0" cy="186.1" r="3" fill="#c0392b"/>
<circle cx="232.0" cy="185.9" r="3" fill="#c0392b"/>
<circle cx="288.0" cy="191.2" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="192.3" r="3" fill="#c0392b"/>
<circle cx="484.0" cy="197.9" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="197.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">re-tuned (both errors <= 0.05)</text>
