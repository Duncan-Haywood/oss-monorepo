<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of mean rollouts against cap as a multiple of the fixed test size: the re-tuned test costs most at a cap equal to the fixed size and falls toward the plain Wald figure as the cap grows; the fixed test is a flat line at 181">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Mean rollouts against the cap, p1 = 1% against p0 = 5%</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="254.2" y2="254.2" stroke="#ddd"/><text x="58" y="258.2" text-anchor="end" font-family="sans-serif" font-size="11">50</text>
<line x1="64" x2="624" y1="184.3" y2="184.3" stroke="#ddd"/><text x="58" y="188.3" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="114.5" y2="114.5" stroke="#ddd"/><text x="58" y="118.5" text-anchor="end" font-family="sans-serif" font-size="11">150</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="120.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.1</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.2</text>
<text x="232.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.3</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.4</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.5</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.75</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">cap as a multiple of the fixed size</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">mean rollouts</text>
