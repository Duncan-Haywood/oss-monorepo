[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducible-refereed-training"
version = "0.1.0"
description = "Measured float32 reduction-order drift, bitwise-reproducible operators, and tolerance-based refereed verification of training traces"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
