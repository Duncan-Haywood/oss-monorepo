[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "control-twin"
version = "0.1.0"
description = "A controller designed in a digital twin with a wrong actuator gain: exact real LQR cost, stability cliff, identifiability under closed loop, and dithered retuning"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
