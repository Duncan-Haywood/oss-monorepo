[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-errlabel"
version = "0.1.0"
description = "How well do the swe-errors keyword rules match a hand-labelled sample of run-record errors?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
