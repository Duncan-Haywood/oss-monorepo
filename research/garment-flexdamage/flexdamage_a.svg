<line x1="64" x2="624" y1="142.6" y2="142.6" stroke="#ddd"/><text x="58" y="146.6" text-anchor="end" font-family="sans-serif" font-size="11">8</text>
<line x1="64" x2="624" y1="97.2" y2="97.2" stroke="#ddd"/><text x="58" y="101.2" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
