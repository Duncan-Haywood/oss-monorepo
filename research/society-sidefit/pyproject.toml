[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-sidefit"
version = "0.1.0"
description = "Does a measured walking-side preference (Moussaid et al. 2009) pin down how many robots tip a crowd?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
