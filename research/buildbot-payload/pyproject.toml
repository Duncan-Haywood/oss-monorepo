[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbot-payload"
version = "0.1.0"
description = "What can a stock Unitree G1 or H1 humanoid lift on a house-building site? Whole-body static payload envelopes in MuJoCo."
requires-python = ">=3.9"
dependencies = ["mujoco>=3.1", "numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
figure = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
