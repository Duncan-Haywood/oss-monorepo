[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-imuarray"
version = "0.1.0"
description = "When do n cheap MEMS gyros, fused, beat one better gyro at the same cost: Allan-variance noise model, correlated errors, break-even price ratio"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
