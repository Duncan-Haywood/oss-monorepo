[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-systolic-edge"
version = "0.1.0"
description = "Edge sweep: wider systolic arrays and more MAC lanes than chip-systolic-fanin tried (generic-gate counts)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
