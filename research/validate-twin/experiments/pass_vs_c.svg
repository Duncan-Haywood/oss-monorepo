<line x1="64" x2="624" y1="71.2" y2="71.2" stroke="#ddd"/><text x="58" y="75.2" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="99.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="215.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.5</text>
<text x="274.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
