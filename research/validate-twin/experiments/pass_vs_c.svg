<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the probability that a twin whose true failure rate is c times its stated rate passes the difference test, for four real-sample sizes n; larger n rejects wrong twins more reliably">
