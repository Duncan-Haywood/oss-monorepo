<line x1="64" x2="624" y1="175.3" y2="175.3" stroke="#ddd"/><text x="58" y="179.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="125.7" y2="125.7" stroke="#ddd"/><text x="58" y="129.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="76.1" y2="76.1" stroke="#ddd"/><text x="58" y="80.1" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.25</text>
<text x="279.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.346</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.375</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">load factor (mean / peak useful power)</text>
