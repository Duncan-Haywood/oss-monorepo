<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the median load-sensing to open-centre shaft-energy ratio against duty-cycle load factor for four open-centre idle models; load-sensing wins (ratio below 1) at every load factor tested except an 8 bar neutral pressure at load factor 0.5, where the ratio is 1.02">
<rect width="640" height="380" fill="#fff"/>
