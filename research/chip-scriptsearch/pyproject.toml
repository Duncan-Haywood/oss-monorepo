[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-scriptsearch"
version = "0.1.0"
description = "Search over ABC pass sequences for a SKY130-mapped MAC: random search, hill climbing and session-written proposals at equal budget"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
