<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-scale line plot of effective sheet resistance against yarn break fraction: it rises from 1 to about 27 times one segment by 50 percent breakage, tracking the effective-medium estimate below 30 percent">
