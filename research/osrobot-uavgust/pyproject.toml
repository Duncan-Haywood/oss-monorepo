[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-uavgust"
version = "0.1.0"
description = "Sizing a purpose-built observation UAV to a wind distribution instead of one wind: extends osrobot-uavwind (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
