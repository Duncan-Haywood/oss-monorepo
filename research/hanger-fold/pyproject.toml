[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanger-fold"
version = "0.1.0"
description = "Hang or fold? A per-fabric stretch-set and crease-set model on top of hanger-fit's 2D drape, and a decision rule a laundry-hanging robot can learn from size, weight and stretch when lifted"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
