[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-graspoffset"
version = "0.1.0"
description = "Grasp force for a cube with an off-centre centre of mass: ball and flat pads, bounds vs MuJoCo"
requires-python = ">=3.9"
dependencies = ["mujoco", "numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
