[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-pricebands"
version = "0.1.0"
description = "How wide are the machine-price bands in which count and mass weighting pick different machines? Price perturbation of simdesign-flipseeds"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
