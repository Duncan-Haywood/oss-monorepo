<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-x line plot of rms horizontal error against number of averaged epochs T: the twin falls from 0.71 to 0.03 while the real error falls only from 1.58 to 0.80">
