<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.45</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">clearance needed between two grasps (m, assumed)</text>
