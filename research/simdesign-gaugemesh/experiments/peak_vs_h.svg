<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the median peak von Mises stress of the gauge-2 bracket designs against mesh size h; every design is at or under the 100 MPa limit at h = 2.5 mm and over it at h = 1.5 mm and finer">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Gauge-2 designs re-solved on finer meshes: median peak stress</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="282.2" y2="282.2" stroke="#ddd"/><text x="58" y="286.2" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="240.5" y2="240.5" stroke="#ddd"/><text x="58" y="244.5" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="198.7" y2="198.7" stroke="#ddd"/><text x="58" y="202.7" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<line x1="64" x2="624" y1="157.0" y2="157.0" stroke="#ddd"/><text x="58" y="161.0" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<line x1="64" x2="624" y1="115.2" y2="115.2" stroke="#ddd"/><text x="58" y="119.2" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="73.5" y2="73.5" stroke="#ddd"/><text x="58" y="77.5" text-anchor="end" font-family="sans-serif" font-size="11">120</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.75</text>
<text x="197.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="386.4" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2.5</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">mesh size h (mm), logarithmic</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">median peak stress (MPa); dashed line = 100 MPa limit</text>
<line x1="64" x2="624" y1="115.2" y2="115.2" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="624.0,116.7 386.4,94.6 197.8,79.7 64.0,71.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="116.7" r="3" fill="#c0392b"/>
<circle cx="386.4" cy="94.6" r="3" fill="#c0392b"/>
<circle cx="197.8" cy="79.7" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="71.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">rules (n=4 meshes)</text>
<polyline points="624.0,115.8 386.4,98.7 197.8,77.9 64.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="624.0" cy="115.8" r="3" fill="#1f6fb2"/>
<circle cx="386.4" cy="98.7" r="3" fill="#1f6fb2"/>
<circle cx="197.8" cy="77.9" r="3" fill="#1f6fb2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">free (n=4 meshes)</text>
