[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-deadline"
version = "0.1.0"
description = "When a pest window sets a deadline, is a scout-and-treater fleet or a fleet of inline weeding robots cheaper?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
