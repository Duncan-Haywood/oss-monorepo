[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-slipmu"
version = "0.1.0"
description = "Does a loose rate threshold stay settings-robust across friction coefficient and lift acceleration in MuJoCo? (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
