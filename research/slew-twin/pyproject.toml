[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slew-twin"
version = "0.1.0"
description = "Slew twin: an actuator rate limit the linear twin lacks; the real response depends on amplitude over rate limit, and the twin is exact only below a computable amplitude"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
