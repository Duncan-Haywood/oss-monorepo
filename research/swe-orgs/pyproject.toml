[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-orgs"
version = "0.1.0"
description = "Cited catalogue of engineering-organisation practices, scored against the agent loop's run ledger"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
