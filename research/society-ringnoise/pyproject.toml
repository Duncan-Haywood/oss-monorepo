[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-ringnoise"
version = "0.1.0"
description = "Is the mean-field gap on the ring walking-side game finite-size noise or memory correlation?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
