[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbot-studfind"
version = "0.1.0"
description = "Stud-finding error budget for a robot nailing sheathing: shared per-stud error, averaging and pooling against the nail windows."
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
figure = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../buildbot-fasten/src"]
