<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Cells times cycles versus parallelism P for 4, 6 and 8-bit weights in a small synthesised classifier">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Area-time product vs parallelism (Yosys cell count x cycles)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="256.8" y2="256.8" stroke="#ddd"/><text x="58" y="260.8" text-anchor="end" font-family="sans-serif" font-size="11">50000</text>
<line x1="64" x2="624" y1="189.6" y2="189.6" stroke="#ddd"/><text x="58" y="193.6" text-anchor="end" font-family="sans-serif" font-size="11">100000</text>
<line x1="64" x2="624" y1="122.5" y2="122.5" stroke="#ddd"/><text x="58" y="126.5" text-anchor="end" font-family="sans-serif" font-size="11">150000</text>
<line x1="64" x2="624" y1="55.3" y2="55.3" stroke="#ddd"/><text x="58" y="59.3" text-anchor="end" font-family="sans-serif" font-size="11">200000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="344.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="12">parallelism P (MAC lanes)</text>
<text x="14" y="182.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 182.0)">cells x cycles (lower is better)</text>
<polyline fill="none" stroke="#c0392b" stroke-width="2" points="64.0,196.8 250.7,241.4 437.3,258.8 624.0,248.8"/>
<circle cx="64.0" cy="196.8" r="2.5" fill="#c0392b"/>
<circle cx="250.7" cy="241.4" r="2.5" fill="#c0392b"/>
<circle cx="437.3" cy="258.8" r="2.5" fill="#c0392b"/>
<circle cx="624.0" cy="248.8" r="2.5" fill="#c0392b"/>
<line x1="76" x2="100" y1="58" y2="58" stroke="#c0392b" stroke-width="2"/><text x="106" y="62" font-family="sans-serif" font-size="11">4-bit weights</text>
<polyline fill="none" stroke="#1f6fb2" stroke-width="2" points="64.0,122.1 250.7,188.1 437.3,211.0 624.0,195.0"/>
<circle cx="64.0" cy="122.1" r="2.5" fill="#1f6fb2"/>
<circle cx="250.7" cy="188.1" r="2.5" fill="#1f6fb2"/>
<circle cx="437.3" cy="211.0" r="2.5" fill="#1f6fb2"/>
<circle cx="624.0" cy="195.0" r="2.5" fill="#1f6fb2"/>
<line x1="76" x2="100" y1="74" y2="74" stroke="#1f6fb2" stroke-width="2"/><text x="106" y="78" font-family="sans-serif" font-size="11">6-bit weights</text>
<polyline fill="none" stroke="#2e8b57" stroke-width="2" points="64.0,56.2 250.7,135.5 437.3,164.3 624.0,133.1"/>
<circle cx="64.0" cy="56.2" r="2.5" fill="#2e8b57"/>
<circle cx="250.7" cy="135.5" r="2.5" fill="#2e8b57"/>
<circle cx="437.3" cy="164.3" r="2.5" fill="#2e8b57"/>
<circle cx="624.0" cy="133.1" r="2.5" fill="#2e8b57"/>
<line x1="76" x2="100" y1="90" y2="90" stroke="#2e8b57" stroke-width="2"/><text x="106" y="94" font-family="sans-serif" font-size="11">8-bit weights</text>
</svg>
