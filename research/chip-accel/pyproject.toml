[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-accel"
version = "0.1.0"
description = "Parameterised MAC-lane accelerator for a tiny quantised MLP: cycle-exact RTL vs NumPy, area and throughput sweep"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
