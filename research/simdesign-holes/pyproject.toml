[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-holes"
version = "0.1.0"
description = "Tension plate with a bolt hole: stress concentration from finite elements vs shortcuts, and hole-to-edge rules by process"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
