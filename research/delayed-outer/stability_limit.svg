<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the largest stable outer step against delay tau from 0 to 16 on a log axis; it falls from 2 to about 0.095 and tracks pi over 2tau plus 1">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Delayed outer step: stability limit c_max vs delay</text>
<line x1="64" x2="624" y1="306.3" y2="306.3" stroke="#ddd"/><text x="58" y="310.3" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="148.7" y2="148.7" stroke="#ddd"/><text x="58" y="152.7" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="99.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="134.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="169.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="239.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">16</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">delay tau (rounds)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">largest stable step c = alpha s</text>
<polyline points="64.0,101.3 99.0,148.7 134.0,181.6 169.0,204.1 239.0,234.7 344.0,264.4 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="101.3" r="3" fill="#c0392b"/>
<circle cx="99.0" cy="148.7" r="3" fill="#c0392b"/>
<circle cx="134.0" cy="181.6" r="3" fill="#c0392b"/>
<circle cx="169.0" cy="204.1" r="3" fill="#c0392b"/>
<circle cx="239.0" cy="234.7" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="264.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">c_max = 2 sin(pi/(4 tau+2))</text>
<polyline points="64.0,70.4 99.0,145.5 134.0,180.5 169.0,203.5 239.0,234.5 344.0,264.2 624.0,309.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#1f6fb2"/>
<circle cx="99.0" cy="145.5" r="3" fill="#1f6fb2"/>
<circle cx="134.0" cy="180.5" r="3" fill="#1f6fb2"/>
<circle cx="169.0" cy="203.5" r="3" fill="#1f6fb2"/>
<circle cx="239.0" cy="234.5" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="264.2" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="309.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">pi/(2 tau+1)</text>
</svg>
