[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-logic-script"
version = "0.1.0"
description = "Popcount, clz and abs-diff rewrites and sweep re-scored under five ABC scripts, with mapped-netlist equivalence checks"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
