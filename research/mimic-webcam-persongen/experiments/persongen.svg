<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-label="Line plot of detector AUROC for three copying generators (1 whole-window replay, 2 50-frame stitch, 3 50-frame join-matched stitch) drawn from the same person's earlier windows or from other people; own-person copies stay near 0.6, pooled copies reach 0.96 once the detector knows the person">
<rect width="640" height="394" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Copying one person versus copying everyone: AUROC</text>
<line x1="64" x2="624" y1="338.0" y2="338.0" stroke="#ddd"/><text x="58" y="342.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="285.9" y2="285.9" stroke="#ddd"/><text x="58" y="289.9" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="233.8" y2="233.8" stroke="#ddd"/><text x="58" y="237.8" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="181.8" y2="181.8" stroke="#ddd"/><text x="58" y="185.8" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="129.7" y2="129.7" stroke="#ddd"/><text x="58" y="133.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="77.6" y2="77.6" stroke="#ddd"/><text x="58" y="81.6" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="624.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="344.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="12">generator (1 replay, 2 stitch 50, 3 stitch 50 + match)</text>
<text x="14" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 204.0)">AUROC vs the person's later windows (0.5 = chance)</text>
<line x1="64" x2="624" y1="207.8" y2="207.8" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,183.6 344.0,167.7 624.0,190.9" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="183.6" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="167.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="190.9" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">own person, population detector</text>
<polyline points="64.0,186.5 344.0,100.3 624.0,121.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="186.5" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="100.3" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="121.1" r="3" fill="#1f6fb2"/>
<rect x="290.2" y="32" width="14" height="10" fill="#1f6fb2"/><text x="310.2" y="41" font-family="sans-serif" font-size="11">pooled people, population detector</text>
<polyline points="64.0,96.9 344.0,85.2 624.0,88.3" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="96.9" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="85.2" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="88.3" r="3" fill="#2e8b57"/>
<rect x="64" y="46" width="14" height="10" fill="#2e8b57"/><text x="84" y="55" font-family="sans-serif" font-size="11">pooled people, profile-aware detector</text>
</svg>
