<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of detector AUROC for three copying generators (1 whole-window replay, 2 50-frame stitch, 3 50-frame join-matched stitch) drawn from the same person's earlier windows or from other people; own-person copies stay near 0.6, pooled copies reach 0.96 once the detector knows the person">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Copying one person versus copying everyone: AUROC</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="271.9" y2="271.9" stroke="#ddd"/><text x="58" y="275.9" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="219.8" y2="219.8" stroke="#ddd"/><text x="58" y="223.8" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="167.8" y2="167.8" stroke="#ddd"/><text x="58" y="171.8" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="115.7" y2="115.7" stroke="#ddd"/><text x="58" y="119.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="63.6" y2="63.6" stroke="#ddd"/><text x="58" y="67.6" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">generator (1 replay, 2 stitch 50, 3 stitch 50 + match)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">AUROC vs the person's later windows (0.5 = chance)</text>
<line x1="64" x2="624" y1="193.8" y2="193.8" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,169.6 344.0,153.7 624.0,176.9" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="169.6" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="153.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="176.9" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">own person, population detector</text>
<polyline points="64.0,172.5 344.0,86.3 624.0,107.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="172.5" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="86.3" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="107.1" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">pooled people, population detector</text>
<polyline points="64.0,82.9 344.0,71.2 624.0,74.3" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="82.9" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="71.2" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="74.3" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">pooled people, profile-aware detector</text>
</svg>
