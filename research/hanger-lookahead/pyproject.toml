[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanger-lookahead"
version = "0.1.0"
description = "Does a laundry-hanging arm gain by also steering clear of the other arm's predicted next pick?"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
