[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-webbuckle"
version = "0.1.0"
description = "Does lateral-torsional buckling justify the w/b <= 8 slenderness rule of the 2 mm laser-cut bracket?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
