<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the 95 percent upper bound on a survivor's per-vector detection probability against the number of clean random vectors, falling roughly as 3 over n">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Detection probability that clean vectors still allow</text>
<line x1="64" x2="624" y1="142.7" y2="142.7" stroke="#ddd"/><text x="58" y="146.7" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1280</text>
<text x="251.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3280</text>
<text x="380.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6280</text>
<text x="497.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">11280</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">21280</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">clean random vectors per survivor</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">95% upper bound on p</text>
<polyline points="64.0,70.4 251.5,150.5 380.9,205.8 497.5,255.6 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="251.5" cy="150.5" r="3" fill="#c0392b"/>
<circle cx="380.9" cy="205.8" r="3" fill="#c0392b"/>
<circle cx="497.5" cy="255.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">bound</text>
</svg>
