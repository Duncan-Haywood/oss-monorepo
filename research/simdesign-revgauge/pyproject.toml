[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-revgauge"
version = "0.1.0"
description = "Is a thicker gauge lighter than a wider web for the reversed-load buckling floor?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
