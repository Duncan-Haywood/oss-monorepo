<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: break-even installed battery price in dollars per kWh against battery size on a measured-derived typical year for Golden, Colorado, for a fixed peak-discharge rule, a rolling optimiser fed yesterday's weather, one fed a clear-sky-index forecast, and one with a perfect forecast; both realistic forecasts fall below the fixed rule, far below the perfect forecast">
