<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Strip plot of the absolute cell-count change of each of the survivors by label; the nine undecided survivors cluster at 0 to 2 cells apart from one at 37, equivalent ones range from 0 to 178" font-family="sans-serif" font-size="12">
<title>Cell-count change of survivors, by Yosys verdict</title>
