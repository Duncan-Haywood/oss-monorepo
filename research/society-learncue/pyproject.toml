[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-learncue"
version = "0.1.0"
description = "Door robots that learn whether to honour an urgency cue: does a self-interested fleet discount it?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
