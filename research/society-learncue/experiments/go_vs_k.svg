<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the learned go probability of door robots against the collision cost k from 1.5 to 6; against partners who send the urgency cue it stays near 0, against others it falls from 0.68 to 0.03">
