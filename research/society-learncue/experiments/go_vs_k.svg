<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="249.1" y2="249.1" stroke="#ddd"/><text x="58" y="253.1" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="174.2" y2="174.2" stroke="#ddd"/><text x="58" y="178.2" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="99.3" y2="99.3" stroke="#ddd"/><text x="58" y="103.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.5</text>
<text x="126.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="375.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">collision cost k</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">learned go probability</text>
<polyline points="64.0,310.5 126.2,323.6 250.7,324.0 375.1,324.0 624.0,324.0" fill="none" stroke="#c0392b" stroke-width="2"/>
