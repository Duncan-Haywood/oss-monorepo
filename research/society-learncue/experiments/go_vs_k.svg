<circle cx="624.0" cy="324.0" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">go against cue senders (gS)</text>
<polyline points="64.0,71.2 126.2,115.0 250.7,183.5 375.1,257.7 624.0,313.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="126.2" cy="115.0" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="183.5" r="3" fill="#1f6fb2"/>
