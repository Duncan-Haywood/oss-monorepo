[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-solrefsafe"
version = "0.1.0"
description = "Is refsafe what breaks a moving grasp at a coarse timestep? refsafe on and off"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
