<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Ratio of the mean's variance to the median's against contamination rate: above 1 the twin's choice of the mean is worse than the median on the real sensor">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Real variance of mean / median vs contamination (stylised)</text>
<line x1="64" x2="624" y1="328.0" y2="328.0" stroke="#ddd"/><text x="58" y="332.0" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="268.3" y2="268.3" stroke="#ddd"/><text x="58" y="272.3" text-anchor="end" font-family="sans-serif" font-size="11">0.3</text>
<line x1="64" x2="624" y1="202.8" y2="202.8" stroke="#ddd"/><text x="58" y="206.8" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="143.1" y2="143.1" stroke="#ddd"/><text x="58" y="147.1" text-anchor="end" font-family="sans-serif" font-size="11">3</text>
<line x1="64" x2="624" y1="77.7" y2="77.7" stroke="#ddd"/><text x="58" y="81.7" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="40.0" y2="40.0" stroke="#ddd"/><text x="58" y="44.0" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<text x="120.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="232.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="344.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="456.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.3</text>
<text x="568.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="202.8" y2="202.8" stroke="#888" stroke-dasharray="4 3"/><text x="620" y="198.8" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555">twin picks mean: ratio 1 = break-even</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">moving-target probability eps</text>
<text x="14" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 184.0)">Var(mean) / Var(median)</text>
<polyline fill="none" stroke="#1f6fb2" stroke-width="2" points="120.0,223.8 232.0,211.0 344.0,200.2 456.0,181.2 568.0,183.8"/>
<circle cx="120.0" cy="223.8" r="3" fill="#1f6fb2"/>
<circle cx="232.0" cy="211.0" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="200.2" r="3" fill="#1f6fb2"/>
<circle cx="456.0" cy="181.2" r="3" fill="#1f6fb2"/>
<circle cx="568.0" cy="183.8" r="3" fill="#1f6fb2"/>
<line x1="390" x2="414" y1="74" y2="74" stroke="#1f6fb2" stroke-width="2"/><text x="420" y="78" font-family="sans-serif" font-size="11">tau = 3</text>
<polyline fill="none" stroke="#c0392b" stroke-width="2" points="120.0,190.7 232.0,135.1 344.0,107.3 456.0,75.0 568.0,88.4"/>
<circle cx="120.0" cy="190.7" r="3" fill="#c0392b"/>
<circle cx="232.0" cy="135.1" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="107.3" r="3" fill="#c0392b"/>
<circle cx="456.0" cy="75.0" r="3" fill="#c0392b"/>
<circle cx="568.0" cy="88.4" r="3" fill="#c0392b"/>
<line x1="390" x2="414" y1="90" y2="90" stroke="#c0392b" stroke-width="2"/><text x="420" y="94" font-family="sans-serif" font-size="11">tau = 10</text>
