[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "randomized-twin"
version = "0.1.0"
description = "Domain randomization over a digital twin in the scalar linear-quadratic setting: exact randomized-training gain, the conservatism it buys against an unstable-plant cliff, and its price when the twin was right"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
