[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-path"
version = "0.1.0"
description = "Line-of-sight guidance for a small surface boat holding a survey line in current and waves"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
