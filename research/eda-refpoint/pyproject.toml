[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-refpoint"
version = "0.1.0"
description = "Does the ranking of design-search proposers survive a change of hypervolume reference point, scaling or quality indicator?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
