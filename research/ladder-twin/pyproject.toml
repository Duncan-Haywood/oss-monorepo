[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ladder-twin"
version = "0.1.0"
description = "Spending a simulation budget across a ladder of twin timestep fidelities (multilevel Monte Carlo): exact level biases and variances, optimal allocation, and the collapse of the saving for a failure-indicator quantity"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
