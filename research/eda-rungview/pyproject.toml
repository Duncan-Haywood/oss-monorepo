[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-rungview"
version = "0.1.0"
description = "What happens to design-search proposers when the cheap objectives are a real generic-gate rung and the truth is SKY130-mapped?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
