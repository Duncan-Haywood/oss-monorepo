[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-abc-order"
version = "0.1.0"
description = "Does the textual order or naming of equivalent RTL change Yosys/ABC's cell count?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
