[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbot-carry"
version = "0.1.0"
description = "Can a stock Unitree G1 or H1 humanoid carry lumber across a building site? Single-support step envelopes with a load in MuJoCo, and a carry-rate comparison with a labourer."
requires-python = ">=3.9"
dependencies = ["mujoco>=3.1", "numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
figure = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../buildbot-payload/src"]
