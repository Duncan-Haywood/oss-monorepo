[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deadband-noise-twin"
version = "0.1.0"
description = "Deadband noise twin: measurement noise and dither on a deadband actuator that the linear twin lacks; the twin error changes sign with noise level"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
