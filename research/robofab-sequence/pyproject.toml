[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-sequence"
version = "0.1.0"
description = "Assembly sequence planning for a printed gearbox: exact search over orders with a stylised collision and support checker"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
