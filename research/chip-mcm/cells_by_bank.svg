<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of mean Yosys generic-gate cells per constant multiplier for banks of 2 to 16 random 8-bit constants, for the operator, per-constant signed-digit and shared-sub-sum forms; the shared form falls furthest as the bank grows">
