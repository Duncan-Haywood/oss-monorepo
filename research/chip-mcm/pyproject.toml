[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-mcm"
version = "0.1.0"
description = "Multiple-constant multiplication: sharing two-digit sub-sums across a bank of fixed weights, cells and depth in Yosys, every variant proved equivalent"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
