[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-blocs"
version = "0.1.0"
description = "How stubborn blocs on the robots' side (L) and the status-quo side (R) move the robot share that tips a crowd's passing side"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
