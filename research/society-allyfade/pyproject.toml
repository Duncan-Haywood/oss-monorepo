[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-allyfade"
version = "0.1.0"
description = "Does a crowd stay tipped to the robots' walking side after an ally bloc fades away?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
