[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-systolic"
version = "0.1.0"
description = "Batch-size sweep: when does an output-stationary systolic array overtake a MAC-lane engine on a tiny quantised MLP (generic-gate counts)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
