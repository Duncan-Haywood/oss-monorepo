[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-auditbudget"
version = "0.1.0"
description = "Stylised: how to split a fixed audit budget between gold and noisy audits"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
