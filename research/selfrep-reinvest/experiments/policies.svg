<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the value of three reinvestment policies as a percentage of the best bang-bang policy, against the machine failure rate from 0 to 0.6: a constant split earns only 9 to 27 percent, while the smooth switch and the piecewise search stay within about 2 percent of bang-bang">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Selfrep-reinvest: policy value vs best bang-bang</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.4" y2="273.4" stroke="#ddd"/><text x="58" y="277.4" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="222.9" y2="222.9" stroke="#ddd"/><text x="58" y="226.9" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="172.3" y2="172.3" stroke="#ddd"/><text x="58" y="176.3" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<line x1="64" x2="624" y1="121.7" y2="121.7" stroke="#ddd"/><text x="58" y="125.7" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<line x1="64" x2="624" y1="71.2" y2="71.2" stroke="#ddd"/><text x="58" y="75.2" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.4</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">failure rate</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">% of bang-bang value</text>
<polyline points="64.0,300.7 250.7,294.7 437.3,282.8 624.0,256.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="300.7" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="294.7" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="282.8" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="256.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">constant split</text>
<polyline points="64.0,71.9 250.7,71.7 437.3,71.4 624.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="71.9" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="71.7" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="71.4" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="71.2" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">smooth switch</text>
<polyline points="64.0,75.2 250.7,71.4 437.3,71.9 624.0,71.4" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="75.2" r="3" fill="#2e8b57"/>
<circle cx="250.7" cy="71.4" r="3" fill="#2e8b57"/>
<circle cx="437.3" cy="71.9" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="71.4" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">piecewise search</text>
</svg>
