[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-hlrtlevel"
version = "0.1.0"
description = "Stylised: size of the parametric-bootstrap LRT of no hard messages, with exact binomial intervals"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
