[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-runcost"
version = "0.1.0"
description = "What does an agent run cost, and what drives it? Per-track cost, concentration and scaling from the cost fields in prompts/runs/"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
