<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Total of interest and material holding cost as a percent of house price against how many lead times before plan materials are ordered: default holding cost: cheapest at 2; free to hold: cheapest at 3; expensive to hold: cheapest at 1.5">
<rect width="720" height="400" fill="#fff"/>
<text x="360.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Ordering earlier shortens the build, until holding the material costs more</text>
<text x="360.0" y="40" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Interest plus holding cost, % of house price; 3,000 builds per point; stylised, assumed costs</text>
<line x1="60" x2="570" y1="350.0" y2="350.0" stroke="#ddd"/>
<text x="54" y="354.0" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="60" x2="570" y1="277.5" y2="277.5" stroke="#ddd"/>
<text x="54" y="281.5" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
<line x1="60" x2="570" y1="205.0" y2="205.0" stroke="#ddd"/>
<text x="54" y="209.0" text-anchor="end" font-family="sans-serif" font-size="11">6</text>
<line x1="60" x2="570" y1="132.5" y2="132.5" stroke="#ddd"/>
<text x="54" y="136.5" text-anchor="end" font-family="sans-serif" font-size="11">8</text>
<line x1="60" x2="570" y1="60.0" y2="60.0" stroke="#ddd"/>
<text x="54" y="64.0" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<text x="60.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="132.9" y="366" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="205.7" y="366" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="278.6" y="366" text-anchor="middle" font-family="sans-serif" font-size="11">1.5</text>
<text x="351.4" y="366" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="424.3" y="366" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="497.1" y="366" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="570.0" y="366" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="315.0" y="392" text-anchor="middle" font-family="sans-serif" font-size="12">order this many mean lead times before the planned start (20 is about day 0)</text>
<polyline points="60.0,286.6 132.9,297.0 205.7,305.9 278.6,312.9 351.4,316.9 424.3,314.0 497.1,293.9 570.0,277.4" fill="none" stroke="#1f6fb2" stroke-width="2.5"/>
<circle cx="351.4" cy="316.9" r="5" fill="#1f6fb2"/>
<text x="578" y="281.4" font-family="sans-serif" font-size="11" fill="#1f6fb2">default holding cost</text>
<polyline points="60.0,293.2 132.9,302.4 205.7,311.4 278.6,319.7 351.4,327.0 424.3,335.6 497.1,335.2 570.0,331.9" fill="none" stroke="#2e8b57" stroke-width="2.5"/>
<circle cx="424.3" cy="335.6" r="5" fill="#2e8b57"/>
<text x="578" y="335.9" font-family="sans-serif" font-size="11" fill="#2e8b57">free to hold</text>
<polyline points="60.0,264.6 132.9,279.0 205.7,288.0 278.6,290.1 351.4,282.0 424.3,236.7 497.1,143.7 570.0,78.4" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="278.6" cy="290.1" r="5" fill="#c0392b"/>
<text x="578" y="82.4" font-family="sans-serif" font-size="11" fill="#c0392b">expensive to hold</text>
</svg>
