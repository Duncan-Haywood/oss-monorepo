<rect x="445.0" y="202.8" width="39.5" height="87.2" fill="#1f6fb2"/><text x="464.8" y="198.8" text-anchor="middle" font-family="sans-serif" font-size="11">0.22</text>
<rect x="488.2" y="105.6" width="39.5" height="184.4" fill="#c0392b"/><text x="508.0" y="101.6" text-anchor="middle" font-family="sans-serif" font-size="11">0.46</text>
