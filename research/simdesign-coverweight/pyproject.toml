[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-coverweight"
version = "0.1.0"
description = "Does weighting parts by mass change which shop process and which machine matters? Mass-weighted coverage of a bracket family"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
