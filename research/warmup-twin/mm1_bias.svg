<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of relative bias of the run mean against job count for three utilisations; the heavier the load the larger and slower-decaying the bias">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Empty-start bias of the mean wait, M/M/1 (|bias| / true mean)</text>
<line x1="64" x2="624" y1="309.6" y2="309.6" stroke="#ddd"/><text x="58" y="313.6" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<line x1="64" x2="624" y1="206.5" y2="206.5" stroke="#ddd"/><text x="58" y="210.5" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="103.4" y2="103.4" stroke="#ddd"/><text x="58" y="107.4" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">500</text>
<text x="323.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2000</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">jobs n</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">|bias| / true mean</text>
<polyline points="64.0,211.2 323.1,309.6 624.0,278.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="211.2" r="3" fill="#c0392b"/>
<circle cx="323.1" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="278.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">rho = 0.5</text>
<polyline points="64.0,171.2 323.1,188.3 624.0,260.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="171.2" r="3" fill="#1f6fb2"/>
<circle cx="323.1" cy="188.3" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="260.4" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">rho = 0.7</text>
<polyline points="64.0,70.4 323.1,124.8 624.0,198.3" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#2e8b57"/>
<circle cx="323.1" cy="124.8" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="198.3" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">rho = 0.9</text>
