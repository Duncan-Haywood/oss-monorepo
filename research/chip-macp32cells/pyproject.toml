[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-macp32cells"
version = "0.1.0"
description = "Is the P=32 vs P=16 MAC-lane synthesis gap a real effect or a tool artefact? Five seeds, five Yosys flows"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
