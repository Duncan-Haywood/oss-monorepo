<circle cx="64.0" cy="317.0" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="317.0" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="317.0" r="3" fill="#1f6fb2"/>
