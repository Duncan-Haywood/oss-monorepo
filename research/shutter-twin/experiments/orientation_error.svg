<line x1="64" x2="624" y1="167.4" y2="167.4" stroke="#ddd"/><text x="58" y="171.4" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="115.3" y2="115.3" stroke="#ddd"/><text x="58" y="119.3" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="63.1" y2="63.1" stroke="#ddd"/><text x="58" y="67.1" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">250</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">500</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">speed range U (px/s)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">RMS theta error (deg)</text>
