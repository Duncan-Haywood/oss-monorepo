[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-converts"
version = "0.1.0"
description = "How fast stubborn people must convert for a committed robot minority to tip a crowd's passing side"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
