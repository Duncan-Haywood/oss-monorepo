[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesign-sar"
version = "0.1.0"
description = "Search-and-rescue wheel-legged rover co-design on stylised rubble, comparing session-agent proposals with random search, CMA-ES and Bayesian optimisation"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "cma", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
