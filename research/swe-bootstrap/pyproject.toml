[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-bootstrap"
version = "0.1.0"
description = "Block-bootstrap intervals over the project history for track-allocation policy comparisons"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
