[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "explanation-twin"
version = "0.1.0"
description = "Cost quoted by a planner from its own digital-twin rollouts: exact selection bias (winner's curse), inflated gaps, naive interval coverage, split-sample repair, and the residual twin-model-error bias"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
