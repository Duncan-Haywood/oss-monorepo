[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-pipeline"
version = "0.1.0"
description = "Does one scout drone feeding several ground treaters make a held fleet cheaper per hectare than inline robots?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
