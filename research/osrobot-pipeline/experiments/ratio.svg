<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">fields on the farm (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">pipeline USD over inline USD</text>
<line x1="64" x2="624" y1="184.3" y2="184.3" stroke="#555" stroke-dasharray="4 3"/>
