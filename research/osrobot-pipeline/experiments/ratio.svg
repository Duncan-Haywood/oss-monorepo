<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the cost ratio of one scout with one treater to the cheapest inline fleet, by number of fields, for three field sizes; the ratio falls below 1 only for 1.62 hectare fields once there are about four fields or more">
