[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-spendoutput"
version = "0.1.0"
description = "Does a bigger run buy more output? Cost against tests added per run record, by track"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
