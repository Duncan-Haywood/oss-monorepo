<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot on a log axis of the number of tasks needed to tell a verifier of informativeness g from a lazy random coin at five percent error rates, against g: weaker verifiers need many more tasks, from 56 at g 0.7 to 329 at g 0.3">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Peer-noise-rent: tasks to detect a lazy verifier</text>
<line x1="64" x2="624" y1="231.3" y2="231.3" stroke="#ddd"/><text x="58" y="235.3" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.3</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.7</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">verifier informativeness g</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">tasks n (log scale)</text>
<polyline points="64.0,70.4 344.0,212.4 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="212.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">tasks needed</text>
</svg>
