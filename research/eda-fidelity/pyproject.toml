[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-fidelity"
version = "0.1.0"
description = "Rank correlation between a chip-design fidelity ladder (cost model, RTL simulation, synthesis) and a successive-halving search that climbs it"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
