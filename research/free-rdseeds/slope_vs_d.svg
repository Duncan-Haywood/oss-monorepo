<line x1="64" x2="624" y1="106.0" y2="106.0" stroke="#ddd"/><text x="58" y="110.0" text-anchor="end" font-family="sans-serif" font-size="11">-0.4</text>
<line x1="64" x2="624" y1="62.5" y2="62.5" stroke="#ddd"/><text x="58" y="66.5" text-anchor="end" font-family="sans-serif" font-size="11">-0.3</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
