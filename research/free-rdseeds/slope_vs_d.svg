<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Fitted exponent of RMSE against n for three Kronecker lattice generators in dimensions 2 to 8; the R_d generator dips to about -0.46 at d=5, worse than its neighbours">
<rect width="640" height="380" fill="#fff"/>
