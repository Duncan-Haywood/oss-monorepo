<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the excess expected cost against the posterior standard deviation tau; the measured loss follows the quadratic-form approximation at small tau and grows roughly with the fourth power">
