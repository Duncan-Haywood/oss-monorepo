[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbot-sheathing"
version = "0.1.0"
description = "Research programme: can a robot hang and fasten wall sheathing to code tolerance; milestone 1, panel gap and sheet placement in the joint-nail budget."
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
figure = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../buildbot-studfind/src"]
