<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log plot of RMSE of a policy-return estimate against the number of scenarios n from 64 to 4096; Halton with a random shift falls fastest, iid sampling slowest">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Evaluation error vs scenarios n (smooth return, d=5)</text>
<line x1="64" x2="624" y1="248.6" y2="248.6" stroke="#ddd"/><text x="58" y="252.6" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="105.1" y2="105.1" stroke="#ddd"/><text x="58" y="109.1" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">64</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">256</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1024</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4096</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">scenarios n (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">RMSE (log scale)</text>
<polyline points="64.0,70.4 250.7,115.3 437.3,158.4 624.0,206.7" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="115.3" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="158.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="206.7" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">iid</text>
<polyline points="64.0,101.9 250.7,156.6 437.3,194.7 624.0,242.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="101.9" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="156.6" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="194.7" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="242.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">Latin hypercube</text>
<polyline points="64.0,114.8 250.7,184.6 437.3,253.2 624.0,309.6" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="114.8" r="3" fill="#2e8b57"/>
<circle cx="250.7" cy="184.6" r="3" fill="#2e8b57"/>
<circle cx="437.3" cy="253.2" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="309.6" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">Halton+shift</text>
<polyline points="64.0,120.6 250.7,174.2 437.3,207.9 624.0,237.7" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="120.6" r="3" fill="#8e44ad"/>
<circle cx="250.7" cy="174.2" r="3" fill="#8e44ad"/>
<circle cx="437.3" cy="207.9" r="3" fill="#8e44ad"/>
<circle cx="624.0" cy="237.7" r="3" fill="#8e44ad"/>
<rect x="574" y="32" width="14" height="10" fill="#8e44ad"/><text x="594" y="41" font-family="sans-serif" font-size="11">R_d+shift</text>
</svg>
