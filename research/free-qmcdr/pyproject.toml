[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-qmcdr"
version = "0.1.0"
description = "Low-discrepancy vs iid sampling of domain-randomised scenarios when a twin evaluates a policy: error rates by return smoothness and dimension"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
