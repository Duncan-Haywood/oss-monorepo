[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abstention-scoring"
version = "0.1.0"
description = "Selective reporting under proper scoring: closed-form abstention regions, the information carried by silence, and the bias of aggregators that ignore it"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
