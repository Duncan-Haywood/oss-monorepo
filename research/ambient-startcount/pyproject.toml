[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-startcount"
version = "0.1.0"
description = "Stylised: how many starts does a likelihood-ranked multi-start need: grid vs random starts at equal compute"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
