<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot on log axes of the breakeven energy per extra flop, in units of one weight fetch, against batch size B from 2 to 16 for layers L1 and L2: it falls roughly as one over B, so batching tolerates a costlier flop; no energy constant is measured">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Accel-fetchprice: breakeven e_flop* against batch size</text>
<line x1="64" x2="624" y1="141.5" y2="141.5" stroke="#ddd"/><text x="58" y="145.5" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">16</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">batch size B (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">e_flop* / e_w (log scale)</text>
<polyline points="64.0,70.4 250.7,137.6 437.3,205.6 624.0,273.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="137.6" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="205.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="273.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">L1</text>
<polyline points="64.0,107.9 250.7,174.8 437.3,242.2 624.0,309.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="107.9" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="174.8" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="242.2" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="309.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">L2</text>
</svg>
