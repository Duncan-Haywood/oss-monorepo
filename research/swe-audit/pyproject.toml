[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-audit"
version = "0.1.0"
description = "Do committed results reproduce? A seeded sample of research/ projects is re-run and compared with the committed output"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
