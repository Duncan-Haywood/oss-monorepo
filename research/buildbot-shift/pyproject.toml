[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbot-shift"
version = "0.1.0"
description = "How many hours of a shift a Unitree G1 can work on battery swaps, and what that does to the buildbot-cost break-even."
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
figure = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
