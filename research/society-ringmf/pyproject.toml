[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-ringmf"
version = "0.1.0"
description = "Local mean-field for the ring walking-side game: does it predict which robot blocks tip the crowd?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
