<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the predicted and simulated median detection delay in steps against dither amplitude v when the twin gain is 40 percent too high: delay shortens as dither grows and the prediction tracks the simulation">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Twin monitor: detection delay vs dither amplitude</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="245.4" y2="245.4" stroke="#ddd"/><text x="58" y="249.4" text-anchor="end" font-family="sans-serif" font-size="11">50</text>
<line x1="64" x2="624" y1="166.8" y2="166.8" stroke="#ddd"/><text x="58" y="170.8" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="88.2" y2="88.2" stroke="#ddd"/><text x="58" y="92.2" text-anchor="end" font-family="sans-serif" font-size="11">150</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="92.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">dither amplitude v</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">detection delay (steps)</text>
<polyline points="64.0,71.2 92.0,85.3 176.0,148.1 624.0,256.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="92.0" cy="85.3" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="148.1" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="256.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">predicted delay</text>
<polyline points="64.0,100.7 92.0,127.5 176.0,174.6 624.0,258.0" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="100.7" r="3" fill="#1f6fb2"/>
<circle cx="92.0" cy="127.5" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="174.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="258.0" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">simulated median delay</text>
</svg>
