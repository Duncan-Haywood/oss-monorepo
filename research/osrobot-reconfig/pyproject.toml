[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-reconfig"
version = "0.1.0"
description = "When does one shared robot beat a dedicated robot per job? A reach-and-changeover model on top of osrobot-specialise"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
