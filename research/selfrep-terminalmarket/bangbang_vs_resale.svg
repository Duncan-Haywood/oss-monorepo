<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the bang-bang policy's value as a percentage of the dynamic-programming policy's against the resale value of a machine as a fraction of the never-switch threshold, for three finite market capacities; tight markets with no resale value cost bang-bang the most">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Self-replicating shop: bang-bang vs the DP policy, by resale value</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.8" y2="273.8" stroke="#ddd"/><text x="58" y="277.8" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="223.5" y2="223.5" stroke="#ddd"/><text x="58" y="227.5" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="173.3" y2="173.3" stroke="#ddd"/><text x="58" y="177.3" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<line x1="64" x2="624" y1="123.0" y2="123.0" stroke="#ddd"/><text x="58" y="127.0" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<line x1="64" x2="624" y1="72.8" y2="72.8" stroke="#ddd"/><text x="58" y="76.8" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.25</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">resale value s / s*</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">bang-bang value, % of DP policy</text>
<polyline points="64.0,74.3 204.0,75.8 344.0,82.4 624.0,72.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="74.3" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="75.8" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="82.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="72.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">c = 100000</text>
<polyline points="64.0,84.1 204.0,88.1 344.0,73.5 624.0,72.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="84.1" r="3" fill="#1f6fb2"/>
<circle cx="204.0" cy="88.1" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="73.5" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="72.1" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">c = 10000</text>
<polyline points="64.0,89.5 204.0,73.0 344.0,71.2 624.0,71.2" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="89.5" r="3" fill="#2e8b57"/>
<circle cx="204.0" cy="73.0" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="71.2" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="71.2" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">c = 1000</text>
</svg>
