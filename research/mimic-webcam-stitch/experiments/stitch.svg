<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of reference-detector AUROC against stitched block length in frames for four stitching modes; AUROC falls from 1.0 at 5 frames to about 0.59 for same-person join-matched 50-frame blocks">
