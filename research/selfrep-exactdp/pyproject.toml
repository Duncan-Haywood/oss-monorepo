[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selfrep-exactdp"
version = "0.1.0"
description = "Interpolation-free dynamic programme (exact on its control set) for the replicating-shop reinvestment problem with a saturating market and a resale value"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
