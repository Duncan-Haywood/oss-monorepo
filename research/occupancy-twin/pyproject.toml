[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "occupancy-twin"
version = "0.1.0"
description = "Committing a grid cell as free or occupied with log-odds tuned in a sensor twin: exact real error rate, Lundberg exponent, tempering fix, and the real-data calibration budget"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
