<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-scale line plot of the exact free-cell error with its lower and upper bounds against the real false-hit rate p0; the design target is 0.001">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Occupancy twin: free-cell error vs real false-hit rate</text>
<line x1="64" x2="624" y1="296.5" y2="296.5" stroke="#ddd"/><text x="58" y="300.5" text-anchor="end" font-family="sans-serif" font-size="11">0.0001</text>
<line x1="64" x2="624" y1="232.1" y2="232.1" stroke="#ddd"/><text x="58" y="236.1" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<line x1="64" x2="624" y1="167.7" y2="167.7" stroke="#ddd"/><text x="58" y="171.7" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="103.3" y2="103.3" stroke="#ddd"/><text x="58" y="107.3" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.15</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.3</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">real false-hit rate p0 (twin says 0.05)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">error probability</text>
<line x1="64" x2="624" y1="232.1" y2="232.1" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,309.6 176.0,228.9 288.0,177.6 400.0,139.0 624.0,84.1" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="228.9" r="3" fill="#c0392b"/>
<circle cx="288.0" cy="177.6" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="139.0" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="84.1" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">lower bound</text>
<polyline points="64.0,274.7 176.0,203.0 288.0,157.3 400.0,123.6 624.0,76.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="274.7" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="203.0" r="3" fill="#1f6fb2"/>
<circle cx="288.0" cy="157.3" r="3" fill="#1f6fb2"/>
<circle cx="400.0" cy="123.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="76.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">exact</text>
<polyline points="64.0,232.1 176.0,174.4 288.0,137.6 400.0,109.9 624.0,70.4" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="232.1" r="3" fill="#2e8b57"/>
<circle cx="176.0" cy="174.4" r="3" fill="#2e8b57"/>
<circle cx="288.0" cy="137.6" r="3" fill="#2e8b57"/>
<circle cx="400.0" cy="109.9" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="70.4" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">upper bound</text>
</svg>
