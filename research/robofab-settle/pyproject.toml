[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-settle"
version = "0.1.0"
description = "Validate a quasi-static support rule for assembly sequencing against MuJoCo settle tests"
requires-python = ">=3.9"
dependencies = ["mujoco>=3.0", "numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
