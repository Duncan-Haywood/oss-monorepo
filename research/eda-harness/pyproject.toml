[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-harness"
version = "0.1.0"
description = "Unattended algorithmic chip-design loop: pluggable proposers, staged checks, cached JSONL evaluation log"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
