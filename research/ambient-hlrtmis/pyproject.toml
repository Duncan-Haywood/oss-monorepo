[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-hlrtmis"
version = "0.1.0"
description = "Stylised: size of the bootstrap LRT of no hard messages when the auditors differ in accuracy"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
