version = "0.1.0"
description = "Does cooling or heating set the heat pump size for the 480 sq ft ADU, and what does the envelope save once both are counted?"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

