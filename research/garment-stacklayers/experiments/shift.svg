<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Garment stack layers: colour shift vs layer count</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="262.2" y2="262.2" stroke="#ddd"/><text x="58" y="266.2" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="200.3" y2="200.3" stroke="#ddd"/><text x="58" y="204.3" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="138.5" y2="138.5" stroke="#ddd"/><text x="58" y="142.5" text-anchor="end" font-family="sans-serif" font-size="11">3</text>
<line x1="64" x2="624" y1="76.7" y2="76.7" stroke="#ddd"/><text x="58" y="80.7" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
<rect x="73.3" y="113.8" width="35.3" height="210.2" fill="#c0392b"/>
<rect x="110.7" y="113.8" width="35.3" height="210.2" fill="#1f6fb2"/>
<text x="110.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2 layers</text>
<rect x="166.7" y="115.0" width="35.3" height="209.0" fill="#c0392b"/>
<rect x="204.0" y="80.4" width="35.3" height="243.6" fill="#1f6fb2"/>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4 layers</text>
<rect x="260.0" y="294.9" width="35.3" height="29.1" fill="#c0392b"/>
<rect x="297.3" y="166.9" width="35.3" height="157.1" fill="#1f6fb2"/>
<text x="297.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6 layers</text>
<rect x="353.3" y="276.4" width="35.3" height="47.6" fill="#c0392b"/>
<rect x="390.7" y="200.3" width="35.3" height="123.7" fill="#1f6fb2"/>
<text x="390.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8 layers</text>
<rect x="446.7" y="288.1" width="35.3" height="35.9" fill="#c0392b"/>
<rect x="484.0" y="188.6" width="35.3" height="135.4" fill="#1f6fb2"/>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10 layers</text>
<rect x="540.0" y="253.5" width="35.3" height="70.5" fill="#c0392b"/>
<rect x="577.3" y="219.5" width="35.3" height="104.5" fill="#1f6fb2"/>
<text x="577.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">12 layers</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">mean dE76 shift</text>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">best</text>
<rect x="194" y="32" width="14" height="10" fill="#1f6fb2"/><text x="214" y="41" font-family="sans-serif" font-size="11">median</text>
