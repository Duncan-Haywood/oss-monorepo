<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Grouped bars of best and median angle-dependent colour shift against layer count for a 620 nm target: best shift drops from 3.4 at two layers to under 1 at six, eight and ten layers (1.1 at twelve)">
