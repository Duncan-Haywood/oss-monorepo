[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-law"
version = "0.1.0"
description = "Exact law for merging independently trained modules (task arithmetic) on random low-rank tasks: optimal scale, 1/m error rate, parallel speedup"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
