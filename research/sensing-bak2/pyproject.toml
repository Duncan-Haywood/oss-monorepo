[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-bak2"
version = "0.1.0"
description = "When the lens has a second radial term the solver does not model, does self-calibrating bundle adjustment still recover the surface?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
