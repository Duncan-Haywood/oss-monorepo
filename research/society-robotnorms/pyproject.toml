[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-robotnorms"
version = "0.1.0"
description = "Robots as a committed minority in a human walking convention: the robot share that tips a crowd's passing side, how it depends on memory and placement, and the conflicts a norm-shifting fleet costs people"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
