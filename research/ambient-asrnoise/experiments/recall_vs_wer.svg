<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">ASR word error rate</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">recall</text>
