<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of recall against word error rate for a wake phrase, a transcript-score threshold and an acoustic-score threshold; the transcript policy falls to the acoustic one near a word error rate of 0.5">
