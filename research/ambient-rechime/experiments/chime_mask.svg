<circle cx="344.0" cy="122.2" r="3" fill="#c0392b"/>
<circle cx="484.0" cy="147.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="168.1" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">one tone or plain glance</text>
