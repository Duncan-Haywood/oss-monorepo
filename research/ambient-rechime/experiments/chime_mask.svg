<line x1="64" x2="624" y1="172.9" y2="172.9" stroke="#ddd"/><text x="58" y="176.9" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="122.6" y2="122.6" stroke="#ddd"/><text x="58" y="126.6" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="72.2" y2="72.2" stroke="#ddd"/><text x="58" y="76.2" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.25</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.75</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">chime_mask (P tone missed = chime_mask x noise)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">mean utility per message</text>
