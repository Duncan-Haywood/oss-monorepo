<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of mean utility for high-urgency messages against the chance a tone is missed in noise; the line allowing up to four tones matches the one-tone line at no masking and sits above it otherwise, widest at moderate masking">
