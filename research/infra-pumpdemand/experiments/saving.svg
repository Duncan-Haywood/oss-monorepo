<circle cx="120.0" cy="91.3" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="78.9" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">full-bill optimum</text>
