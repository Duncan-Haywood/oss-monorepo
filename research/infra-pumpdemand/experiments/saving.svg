<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: percent of the monthly summer pumping bill saved by the bill-minimising schedule against the shipped 01:00 to 15:00 schedule, as the B-19 demand charges are scaled from 0 to 20 times">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Summer bill saved by the best pump-10 schedule vs the shipped one (Net3, PG&E B-19)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="246.4" y2="246.4" stroke="#ddd"/><text x="58" y="250.4" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="168.9" y2="168.9" stroke="#ddd"/><text x="58" y="172.9" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="91.3" y2="91.3" stroke="#ddd"/><text x="58" y="95.3" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="78.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="92.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="120.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">demand-charge multiplier (1 = published rate)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">bill saved, %</text>
<polyline points="64.0,171.2 78.0,123.1 92.0,105.7 120.0,91.3 204.0,78.9 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
