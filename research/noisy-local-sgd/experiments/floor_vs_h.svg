<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the noise floor against local steps H; at alpha=1 it is flat, at alpha=0.05 it falls slowly toward a limit">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Noise floor vs local steps H (section 2, kappa=100, M=1)</text>
<line x1="64" x2="624" y1="292.6" y2="292.6" stroke="#ddd"/><text x="58" y="296.6" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="141.9" y2="141.9" stroke="#ddd"/><text x="58" y="145.9" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="296.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="529.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">local steps H</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">floor</text>
<polyline points="64.0,70.4 204.0,70.4 344.0,70.4 484.0,70.4 624.0,70.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="484.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="70.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">alpha = 1</text>
<polyline points="64.0,277.5 204.0,285.5 344.0,295.2 484.0,304.6 624.0,309.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="277.5" r="3" fill="#1f6fb2"/>
