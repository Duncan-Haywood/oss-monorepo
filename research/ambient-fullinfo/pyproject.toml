[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-fullinfo"
version = "0.1.0"
description = "Does selection bias hurt an always-on assistant that learns from its own feedback? Full-information comparison (simulated)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
