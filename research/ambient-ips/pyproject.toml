[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-ips"
version = "0.1.0"
description = "Inverse-propensity weighting for learning when an always-on assistant should speak (simulated)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
