<line x1="577.5" x2="577.5" y1="50" y2="360" stroke="#ddd"/><text x="577.5" y="376" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<line x1="700.0" x2="700.0" y1="50" y2="360" stroke="#ddd"/><text x="700.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
