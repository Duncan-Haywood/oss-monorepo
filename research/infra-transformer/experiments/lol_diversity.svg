<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="Bar chart, log scale: annual transformer insulation loss of life for 10 homes all with heat pumps under seven heat-pump control cases, Greensboro and Sand Point, median and range over 20 groups; synchronized night setback with strip heat ages the transformer most">
<rect width="720" height="420" fill="#fff"/>
<text x="360.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Transformer loss of life by heat-pump control (100 % heat pumps, loading 0.5)</text>
<line x1="210.0" x2="210.0" y1="50" y2="360" stroke="#ddd"/><text x="210.0" y="376" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<line x1="332.5" x2="332.5" y1="50" y2="360" stroke="#ddd"/><text x="332.5" y="376" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
