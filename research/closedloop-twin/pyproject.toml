[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "closedloop-twin"
version = "0.1.0"
description = "A twin identified from closed-loop logs: held-out validation is blind to what the controller never varied; exact extrapolation variance, min-norm bias without dither, and false stability certification of a new controller"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
