<rect x="655.4" y="268.2" width="31.4" height="41.8" fill="#8e44ad"/>
<text x="623.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="10">hot->mild</text>
<rect x="56" y="376" width="12" height="10" fill="#1f6fb2"/><text x="72" y="385" font-family="sans-serif" font-size="11">fixed closed</text>
<rect x="191" y="376" width="12" height="10" fill="#c0392b"/><text x="207" y="385" font-family="sans-serif" font-size="11">fixed open</text>
<rect x="326" y="376" width="12" height="10" fill="#2e8b57"/><text x="342" y="385" font-family="sans-serif" font-size="11">gate 33.2-34.2</text>
