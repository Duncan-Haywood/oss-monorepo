<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Grouped bars of mean skin-temperature error for fixed closed, fixed open, a skin-temperature gate and the oracle across four temperature steps; the gate stays close to the oracle">
<rect width="720" height="400" fill="#fff"/>
<text x="360.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Mean |skin temperature - 33.7 C| over 180 min, our choice set (lower is better)</text>
<rect x="56" y="40" width="648" height="290" fill="none" stroke="#999"/>
<line x1="56" x2="704" y1="330.0" y2="330.0" stroke="#eee"/><text x="50" y="334.0" text-anchor="end" font-family="sans-serif" font-size="11">-0.3</text>
<line x1="56" x2="704" y1="272.0" y2="272.0" stroke="#eee"/><text x="50" y="276.0" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="56" x2="704" y1="214.0" y2="214.0" stroke="#eee"/><text x="50" y="218.0" text-anchor="end" font-family="sans-serif" font-size="11">1.6</text>
<line x1="56" x2="704" y1="156.0" y2="156.0" stroke="#eee"/><text x="50" y="160.0" text-anchor="end" font-family="sans-serif" font-size="11">2.6</text>
<line x1="56" x2="704" y1="98.0" y2="98.0" stroke="#eee"/><text x="50" y="102.0" text-anchor="end" font-family="sans-serif" font-size="11">3.5</text>
<line x1="56" x2="704" y1="40.0" y2="40.0" stroke="#eee"/><text x="50" y="44.0" text-anchor="end" font-family="sans-serif" font-size="11">4.5</text>
<line x1="56" x2="704" y1="310.0" y2="310.0" stroke="#333"/>
<text x="14" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 185.0)">mean error (C)</text>
<rect x="72.2" y="140.0" width="31.4" height="170.0" fill="#1f6fb2"/>
<rect x="104.6" y="93.6" width="31.4" height="216.4" fill="#c0392b"/>
<rect x="137.0" y="138.4" width="31.4" height="171.6" fill="#2e8b57"/>
<rect x="169.4" y="144.6" width="31.4" height="165.4" fill="#8e44ad"/>
<text x="137.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="10">hot->cool</text>
<rect x="234.2" y="110.1" width="31.4" height="199.9" fill="#1f6fb2"/>
<rect x="266.6" y="60.0" width="31.4" height="250.0" fill="#c0392b"/>
<rect x="299.0" y="114.1" width="31.4" height="195.9" fill="#2e8b57"/>
<rect x="331.4" y="115.3" width="31.4" height="194.7" fill="#8e44ad"/>
<text x="299.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="10">cool->hot</text>
<rect x="396.2" y="262.1" width="31.4" height="47.9" fill="#1f6fb2"/>
<rect x="428.6" y="225.4" width="31.4" height="84.6" fill="#c0392b"/>
<rect x="461.0" y="268.2" width="31.4" height="41.8" fill="#2e8b57"/>
<rect x="493.4" y="268.5" width="31.4" height="41.5" fill="#8e44ad"/>
<text x="461.0" y="346" text-anchor="middle" font-family="sans-serif" font-size="10">mild->hot</text>
<rect x="558.2" y="260.9" width="31.4" height="49.1" fill="#1f6fb2"/>
<rect x="590.6" y="233.9" width="31.4" height="76.1" fill="#c0392b"/>
