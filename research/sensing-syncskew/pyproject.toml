[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-syncskew"
version = "0.1.0"
description = "Camera-to-gyro sync: how much motion the offset fit needs and what clock skew does to a fixed-offset calibration (stylised single axis)"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
