[project]
name = "garment-stackrobust"
version = "0.1.0"
description = "Robustness of angle-stable thin-film stacks to layer-thickness error: nominal versus robust optimisation at equal cost"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../garment-stackopt/src", "../garment-thincolor/src"]
