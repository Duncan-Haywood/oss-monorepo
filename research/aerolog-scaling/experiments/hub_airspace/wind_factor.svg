<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: one layer's en-route conflicts rise with the ratio of wind speed to airspeed, more with the wind along Manhattan's axis than across it, tracking the rise in each flight's time in the layer">
