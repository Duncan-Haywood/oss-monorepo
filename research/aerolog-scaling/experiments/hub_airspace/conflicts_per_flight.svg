<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot: simulated en-route losses of separation per flight grow linearly with flights per hour, about 0.1 at 60 flights/h in one layer; the gas model is about 7 times lower; separating outbound and inbound layers cuts conflicts about 20-fold">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Delivery hub: en-route conflicts per flight (NYC destinations, 20 m/s, R 50 m)</text>
<line x1="64" x2="624" y1="313.5" y2="313.5" stroke="#ddd"/><text x="58" y="317.5" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<line x1="64" x2="624" y1="220.3" y2="220.3" stroke="#ddd"/><text x="58" y="224.3" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="127.1" y2="127.1" stroke="#ddd"/><text x="58" y="131.1" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">15</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">30</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">60</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">120</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">240</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">flights per hour from the hub</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">conflicts per flight outside 250 m</text>
<polyline points="64.0,183.7 204.0,156.5 344.0,128.7 484.0,101.5 624.0,73.0" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="183.7" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="156.5" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="128.7" r="3" fill="#c0392b"/>
<circle cx="484.0" cy="101.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="73.0" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">one layer</text>
<polyline points="64.0,182.0 204.0,153.4 344.0,126.5 484.0,98.6 624.0,70.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="182.0" r="3" fill="#1f6fb2"/>
<circle cx="204.0" cy="153.4" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="126.5" r="3" fill="#1f6fb2"/>
<circle cx="484.0" cy="98.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="70.4" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">one layer, v+-15%</text>
<polyline points="64.0,309.6 204.0,270.4 344.0,246.8 484.0,217.2 624.0,190.3" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#2e8b57"/>
<circle cx="204.0" cy="270.4" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="246.8" r="3" fill="#2e8b57"/>
<circle cx="484.0" cy="217.2" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="190.3" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">split, v+-15%</text>
<polyline points="64.0,262.3 204.0,234.3 344.0,206.2 484.0,178.2 624.0,150.1" fill="none" stroke="#8e44ad" stroke-width="2"/>
