<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the median losses of separation relative to an airspace where every drone uses one altitude reference, against the sd of the mismatch between barometric and GNSS references, for three planners; half the operators on each reference, 25 ft separation, 1 m error per drone">
