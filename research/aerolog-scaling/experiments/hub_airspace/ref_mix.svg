<line x1="64" x2="624" y1="114.5" y2="114.5" stroke="#ddd"/><text x="58" y="118.5" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="72.7" y2="72.7" stroke="#ddd"/><text x="58" y="76.7" text-anchor="end" font-family="sans-serif" font-size="11">1.2</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
