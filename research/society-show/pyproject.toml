[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-show"
version = "0.1.0"
description = "Seeded, labelled-fiction episodes of a simulated robot town: a trust model run with a cast, auto-detected turning points, a narrated summary and a browser replay"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
