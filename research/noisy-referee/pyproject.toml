[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noisy-referee"
version = "0.1.0"
description = "Scoring verifiers against a noisy referee: raw proper scores elicit an affine distortion and can reverse rankings; the unbiased surrogate score is exactly proper, costs a 1/gamma payment spread, and tolerates misestimated flip rates with a closed-form bias"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
