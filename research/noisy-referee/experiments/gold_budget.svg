<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the mean excess true Brier score from estimating the verifier noise rates on m gold items per class, measured by Monte Carlo and predicted by the delta method: the two agree to within about 6 percent and both fall in proportion to 1/m">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Noisy-referee: cost of estimating the noise rates</text>
<line x1="64" x2="624" y1="309.6" y2="309.6" stroke="#ddd"/><text x="58" y="313.6" text-anchor="end" font-family="sans-serif" font-size="11">0.0001</text>
<line x1="64" x2="624" y1="180.8" y2="180.8" stroke="#ddd"/><text x="58" y="184.8" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">25</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">400</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1600</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">gold-check items per class m (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">mean true-Brier excess (log scale)</text>
<polyline points="64.0,70.4 250.7,151.1 437.3,230.7 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="151.1" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="230.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">Monte Carlo</text>
<polyline points="64.0,73.6 250.7,151.1 437.3,228.0 624.0,304.3" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="73.6" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="151.1" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="228.0" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="304.3" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">delta method</text>
</svg>
