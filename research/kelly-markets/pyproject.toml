[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kelly-markets"
version = "0.1.0"
description = "Fractional-Kelly wealth markets as expert routers: risk-tolerance-weighted prices, 1/lambda regret bound, chi-square manipulation cost, switching trade-off"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
