[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holdout-market"
version = "0.1.0"
description = "Paying for model improvements against a hidden holdout: telescoping budgets, holdout overfitting attacks, and a Ladder-style fix"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
