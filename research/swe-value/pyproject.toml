[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-value"
version = "0.1.0"
description = "A value rubric for portfolio projects, scored by two independent passes, with Cohen's kappa and cost per class"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
