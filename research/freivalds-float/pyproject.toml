[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freivalds-float"
version = "0.1.0"
description = "Freivalds-style probabilistic verification of matrix products in floating point: exact miss probabilities for Gaussian probes, worst-case rank-one corruption, probe counts, Rademacher failure, measured float32 noise floor, commit-after-result requirement"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
