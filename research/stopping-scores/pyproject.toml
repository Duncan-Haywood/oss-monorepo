[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stopping-scores"
version = "0.1.0"
description = "Verifiers who choose when to stop checking under a proper score: exact optimal-stopping threshold, Wald cost identity, sequential vs fixed-sample gain, and how the score's curvature sets delivered accuracy"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
