<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: test AUC of a logistic regression against the number of labelled outcomes from 50 to 1600, for numeric features, human emotion codes plus numeric features, tf-idf words plus numeric features, and LSA plus numeric features; all stay between 0.51 and 0.60">
