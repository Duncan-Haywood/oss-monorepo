<line x1="64" x2="624" y1="253.1" y2="253.1" stroke="#ddd"/><text x="58" y="257.1" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="73.9" y2="73.9" stroke="#ddd"/><text x="58" y="77.9" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="512.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">16</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">32</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">delay tau (rounds)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">largest stable alpha*s</text>
<polyline points="64.0,73.9 176.0,111.4 288.0,156.2 400.0,205.4 512.0,256.9 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
