<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">closed form</text>
<polyline points="64.0,73.9 176.0,111.4 288.0,156.2 400.0,205.4 512.0,256.9 624.0,309.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
