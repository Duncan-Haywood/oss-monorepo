[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-ppa-logic"
version = "0.1.0"
description = "Equivalence-gated PPA rewrites of popcount, leading-zero count and absolute difference, against a parameter-sweep baseline"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
