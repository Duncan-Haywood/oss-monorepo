<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log plot of the percent difference of the six-part carry time at 400, 1600 and 6400 nodes from the 25600-node value, for three arm reaches; the error falls by roughly two to three orders of magnitude">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Time-optimal carry: error against the finest grid (wmax 2 rad/s, jaw cap 5x)</text>
<line x1="64" x2="624" y1="312.7" y2="312.7" stroke="#ddd"/><text x="58" y="316.7" text-anchor="end" font-family="sans-serif" font-size="11">1e-05</text>
<line x1="64" x2="624" y1="256.6" y2="256.6" stroke="#ddd"/><text x="58" y="260.6" text-anchor="end" font-family="sans-serif" font-size="11">0.0001</text>
<line x1="64" x2="624" y1="200.4" y2="200.4" stroke="#ddd"/><text x="58" y="204.4" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<line x1="64" x2="624" y1="144.3" y2="144.3" stroke="#ddd"/><text x="58" y="148.3" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="88.2" y2="88.2" stroke="#ddd"/><text x="58" y="92.2" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">400</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1600</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6400</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">nodes n</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">|T(n) - T(25600)| / T(25600) (%)</text>
<polyline points="64.0,70.4 344.0,133.4 624.0,228.9" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="133.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="228.9" r="3" fill="#c0392b"/>
