<circle cx="64.0" cy="89.7" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="182.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="261.0" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">L=0.12 m</text>
<polyline points="64.0,156.2 344.0,237.2 624.0,309.6" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="156.2" r="3" fill="#2e8b57"/>
