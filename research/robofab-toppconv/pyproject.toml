[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-toppconv"
version = "0.1.0"
description = "Node-count convergence of the time-optimal carry solver and its edge over a trapezoid (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
