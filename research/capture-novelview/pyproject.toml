[project]
name = "capture-novelview"
version = "0.1.0"
description = "Depth-based novel-view synthesis between adjacent cameras on a ring around a subject, scored against a ray-traced truth"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
