<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the percentage by which a fixed-step simulation under-reports the true delay margin of a PD-controlled double integrator, against the step size in seconds: about 19 percent at 0.1 s falling to 1 percent at 0.005 s">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">How much delay margin a fixed-step simulator under-reports, against step size (zeta = 0.7)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="256.0" y2="256.0" stroke="#ddd"/><text x="58" y="260.0" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
<line x1="64" x2="624" y1="188.1" y2="188.1" stroke="#ddd"/><text x="58" y="192.1" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="120.1" y2="120.1" stroke="#ddd"/><text x="58" y="124.1" text-anchor="end" font-family="sans-serif" font-size="11">15</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.005</text>
<text x="93.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="152.4" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.02</text>
<text x="329.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">step size dt (s)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">margin under-reported (%)</text>
<polyline points="624.0,71.2 329.3,71.2 152.4,218.7 93.5,292.5 64.0,311.0" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="329.3" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="152.4" cy="218.7" r="3" fill="#c0392b"/>
<circle cx="93.5" cy="292.5" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="311.0" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">explicit Euler</text>
<polyline points="624.0,71.2 329.3,71.2 152.4,218.7 93.5,292.5 64.0,311.0" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="624.0" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="329.3" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="152.4" cy="218.7" r="3" fill="#1f6fb2"/>
