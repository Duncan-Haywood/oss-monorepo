<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: annual electricity bill in dollars for a PI thermostat and for a receding-horizon MPC with a wrong model and a yesterday's-weather forecast, against the peak to off-peak price ratio at a fixed mean price">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Heating and cooling bill against the peak/off-peak price ratio (Greensboro NC)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="268.1" y2="268.1" stroke="#ddd"/><text x="58" y="272.1" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="212.3" y2="212.3" stroke="#ddd"/><text x="58" y="216.3" text-anchor="end" font-family="sans-serif" font-size="11">400</text>
<line x1="64" x2="624" y1="156.4" y2="156.4" stroke="#ddd"/><text x="58" y="160.4" text-anchor="end" font-family="sans-serif" font-size="11">600</text>
<line x1="64" x2="624" y1="100.5" y2="100.5" stroke="#ddd"/><text x="58" y="104.5" text-anchor="end" font-family="sans-serif" font-size="11">800</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">peak / off-peak price ratio</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">annual bill ($)</text>
<polyline points="64.0,93.8 176.0,84.3 288.0,79.0 400.0,75.4 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="93.8" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="84.3" r="3" fill="#c0392b"/>
<circle cx="288.0" cy="79.0" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="75.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">thermostat 20/24</text>
<polyline points="64.0,105.0 176.0,103.6 288.0,105.3 400.0,106.6 624.0,108.3" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="105.0" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="103.6" r="3" fill="#1f6fb2"/>
<circle cx="288.0" cy="105.3" r="3" fill="#1f6fb2"/>
