[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-constmul"
version = "0.1.0"
description = "Fixed-coefficient multipliers: Yosys operator vs binary shift-add vs canonical signed digit, cells and depth, every variant proved equivalent"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
