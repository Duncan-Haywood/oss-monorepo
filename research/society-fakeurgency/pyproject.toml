[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-fakeurgency"
version = "0.1.0"
description = "Costly urgency signals at a door: how much faking tips a reading robot back to yield-all"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
