[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-meshconverge"
version = "0.1.0"
description = "Are the gauge-2 bracket designs found feasible on coarse meshes still feasible under the peak-stress measure on finer meshes?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem", "matplotlib", "shapely"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
