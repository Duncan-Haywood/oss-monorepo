<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of population-detector AUROC for semi-Markov and second-order chains over 8 and 32 quantised states, fitted on one person's earlier windows or on other people's; every line sits at or just under 1.000">
