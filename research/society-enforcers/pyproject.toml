[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-enforcers"
version = "0.1.0"
description = "Can a minority of queue-enforcing robots hold a queueing norm against line-cutting robots"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
