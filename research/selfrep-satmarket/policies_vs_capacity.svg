<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of four simple copy-versus-sell policies as a percentage of the dynamic-programming policy's value against market capacity; constant split falls far behind at low capacity while bang-bang, smooth and piecewise policies stay above 93 percent">
