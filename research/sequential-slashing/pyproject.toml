[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sequential-slashing"
version = "0.1.0"
description = "Anytime-valid slashing of verifiers: e-processes, peeking inflation, detection delay"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
