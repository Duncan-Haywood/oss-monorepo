[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesign-gripper"
version = "0.1.0"
description = "Printable two-finger gripper design scored in MuJoCo, comparing session-agent proposals with random search, CMA-ES and Bayesian optimisation"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "mujoco", "cma", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
