<circle cx="624.0" cy="70.4" r="3" fill="#8e44ad"/>
<rect x="574" y="32" width="14" height="10" fill="#8e44ad"/><text x="594" y="41" font-family="sans-serif" font-size="11">tau = 1000 blocks</text>
</svg>
