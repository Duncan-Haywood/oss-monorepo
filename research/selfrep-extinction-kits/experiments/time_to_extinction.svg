<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot on a log axis of the mean time in hours until a small replicating fleet dies out against mean machine life L; the exact Markov chain and the simulation agree and the time grows roughly a hundredfold from L=75 h to L=300 h">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Replicating shop: mean time to extinction (B=4 kits)</text>
<line x1="64" x2="624" y1="315.6" y2="315.6" stroke="#ddd"/><text x="58" y="319.6" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="195.4" y2="195.4" stroke="#ddd"/><text x="58" y="199.4" text-anchor="end" font-family="sans-serif" font-size="11">1000</text>
<line x1="64" x2="624" y1="75.3" y2="75.3" stroke="#ddd"/><text x="58" y="79.3" text-anchor="end" font-family="sans-serif" font-size="11">10000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">75</text>
<text x="126.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="375.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">200</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">300</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">mean machine life L (h)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">mean time to extinction (h)</text>
<polyline points="64.0,307.4 126.2,279.1 375.1,175.5 624.0,70.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="307.4" r="3" fill="#c0392b"/>
<circle cx="126.2" cy="279.1" r="3" fill="#c0392b"/>
<circle cx="375.1" cy="175.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="70.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">exact chain</text>
<polyline points="64.0,309.6 126.2,280.4 375.1,173.9 624.0,72.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="126.2" cy="280.4" r="3" fill="#1f6fb2"/>
<circle cx="375.1" cy="173.9" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="72.1" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">simulation</text>
</svg>
