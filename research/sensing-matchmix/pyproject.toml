[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-matchmix"
version = "0.1.0"
description = "Does the ordering of gate and RANSAC start survive the mismatch mixes a real matcher produces?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
