<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of simulated good parts per hour against the alarm threshold z for detectors of d' 1, 2, 3 and 4 with a look every 2 minutes; every curve collapses below blind printing when z is below about 2.5 and peaks at z of 3 to 3.5">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Cell throughput against the detector's alarm threshold</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="249.9" y2="249.9" stroke="#ddd"/><text x="58" y="253.9" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="175.7" y2="175.7" stroke="#ddd"/><text x="58" y="179.7" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
<line x1="64" x2="624" y1="101.6" y2="101.6" stroke="#ddd"/><text x="58" y="105.6" text-anchor="end" font-family="sans-serif" font-size="11">6</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.5</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2.5</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="512.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3.5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">alarm threshold z (score units)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">good parts per hour</text>
<line x1="64" x2="624" y1="96.7" y2="96.7" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,240.6 176.0,148.3 288.0,101.2 400.0,95.6 512.0,97.1 624.0,92.7" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="240.6" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="148.3" r="3" fill="#c0392b"/>
<circle cx="288.0" cy="101.2" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="95.6" r="3" fill="#c0392b"/>
<circle cx="512.0" cy="97.1" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="92.7" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">d' = 1.0</text>
<polyline points="64.0,241.0 176.0,142.0 288.0,96.4 400.0,83.8 512.0,85.6 624.0,93.0" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="241.0" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="142.0" r="3" fill="#1f6fb2"/>
<circle cx="288.0" cy="96.4" r="3" fill="#1f6fb2"/>
<circle cx="400.0" cy="83.8" r="3" fill="#1f6fb2"/>
<circle cx="512.0" cy="85.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="93.0" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">d' = 2.0</text>
<polyline points="64.0,240.2 176.0,140.5 288.0,94.2 400.0,74.9 512.0,77.5 624.0,78.2" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="240.2" r="3" fill="#2e8b57"/>
<circle cx="176.0" cy="140.5" r="3" fill="#2e8b57"/>
<circle cx="288.0" cy="94.2" r="3" fill="#2e8b57"/>
<circle cx="400.0" cy="74.9" r="3" fill="#2e8b57"/>
<circle cx="512.0" cy="77.5" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="78.2" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">d' = 3.0</text>
<polyline points="64.0,241.0 176.0,140.1 288.0,92.7 400.0,73.8 512.0,71.2 624.0,73.0" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="241.0" r="3" fill="#8e44ad"/>
<circle cx="176.0" cy="140.1" r="3" fill="#8e44ad"/>
<circle cx="288.0" cy="92.7" r="3" fill="#8e44ad"/>
<circle cx="400.0" cy="73.8" r="3" fill="#8e44ad"/>
<circle cx="512.0" cy="71.2" r="3" fill="#8e44ad"/>
<circle cx="624.0" cy="73.0" r="3" fill="#8e44ad"/>
<rect x="574" y="32" width="14" height="10" fill="#8e44ad"/><text x="594" y="41" font-family="sans-serif" font-size="11">d' = 4.0</text>
</svg>
