[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-cell-detector"
version = "0.1.0"
description = "Discrete-event twin of a robot-arm and 3D-printer cell with a thresholded print-failure detector: where to set the alarm threshold"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
