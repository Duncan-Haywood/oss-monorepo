[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multiclass-tangent-log"
version = "0.1.0"
description = "Bounded-payment multiclass log score by quadratic tangent extension of the negative-entropy generator: exact range, worst-case regret, rare-class curvature per range"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
