<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of curvature per unit payment range against the rare-class probability rho: the tangent score rises from about 1.3 at rho 0.5 to about 490 at rho 0.0001 while Brier stays at 1">
