<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot, for four PyBaMM parameter sets on 64 designs never used to build the forecast, of the set-median Shapley value of measuring each input (1 the node lever's OCP rise, 2 the non-OCP drift, 3 the capacity factor) and 4 the error left when every input is measured, in |ln(L_pred/L_DFN)| at cycle 99. The error left is 0.083 (Ai2020), 0.032 (Chen2020), 0.034 (OKane2022), 0.011 (NCA_Kim2011).">
