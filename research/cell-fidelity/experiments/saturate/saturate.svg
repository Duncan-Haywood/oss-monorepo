<line x1="64" x2="624" y1="257.8" y2="257.8" stroke="#ddd"/><text x="58" y="261.8" text-anchor="end" font-family="sans-serif" font-size="11">0.02</text>
<line x1="64" x2="624" y1="191.6" y2="191.6" stroke="#ddd"/><text x="58" y="195.6" text-anchor="end" font-family="sans-serif" font-size="11">0.04</text>
<line x1="64" x2="624" y1="125.4" y2="125.4" stroke="#ddd"/><text x="58" y="129.4" text-anchor="end" font-family="sans-serif" font-size="11">0.06</text>
<line x1="64" x2="624" y1="59.2" y2="59.2" stroke="#ddd"/><text x="58" y="63.2" text-anchor="end" font-family="sans-serif" font-size="11">0.08</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">forecast: 1 = eta line, 2 = saturating eta, 3 = eta held after cycle 10</text>
