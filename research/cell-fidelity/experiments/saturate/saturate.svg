<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the set-median |ln(q_forecast/q_measured)| of the charge-capacity factor at cycle 99 for four PyBaMM parameter sets: 1 the electrode-balance window with a ten-cycle line in the charge overpotential, 2 the window with a saturating ten-cycle fit, 3 the window with the line held after cycle 10. The saturating forecast's errors are 0.024 (Ai2020), 0.045 (Chen2020), 0.043 (OKane2022), 0.048 (NCA_Kim2011).">
<rect width="640" height="380" fill="#fff"/>
