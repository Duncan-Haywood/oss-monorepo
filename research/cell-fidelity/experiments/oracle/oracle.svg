<line x1="64" x2="624" y1="264.3" y2="264.3" stroke="#ddd"/><text x="58" y="268.3" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="204.7" y2="204.7" stroke="#ddd"/><text x="58" y="208.7" text-anchor="end" font-family="sans-serif" font-size="11">0.02</text>
<line x1="64" x2="624" y1="145.0" y2="145.0" stroke="#ddd"/><text x="58" y="149.0" text-anchor="end" font-family="sans-serif" font-size="11">0.03</text>
<line x1="64" x2="624" y1="85.3" y2="85.3" stroke="#ddd"/><text x="58" y="89.3" text-anchor="end" font-family="sans-serif" font-size="11">0.04</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">30</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">50</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">cycles in the line fit k</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">set median |ln(L_pred/L_DFN)| at cycle 99</text>
