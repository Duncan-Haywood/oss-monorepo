<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the set-median error |ln(L_pred(99)/L_DFN(99))| of the forecast law fed the measured plating-weighted OCP rise, against the number of cycles its line is fitted through, for four PyBaMM parameter sets. At ten cycles the errors are 0.042 (Ai2020), 0.038 (Chen2020), 0.034 (OKane2022) and 0.012 (NCA_Kim2011); at fifty they are 0.010 to 0.016.">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Forecast error with the measured plating lever, line through cycles 2..k (set medians)</text>
