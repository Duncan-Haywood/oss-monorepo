<line x1="64" x2="624" y1="126.3" y2="126.3" stroke="#ddd"/><text x="58" y="130.3" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="76.9" y2="76.9" stroke="#ddd"/><text x="58" y="80.9" text-anchor="end" font-family="sans-serif" font-size="11">0.5</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
