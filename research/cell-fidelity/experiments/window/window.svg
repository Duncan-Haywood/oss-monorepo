<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the set-median |ln(q_forecast/q_measured)| of the charge-capacity factor at cycle 99 for four PyBaMM parameter sets: 1 a straight line through cycles 2..10, 2 the electrode-balance window with a ten-cycle line in the charge overpotential, 3 the window with the overpotential held. The window forecast's errors are 0.076 (Ai2020), 0.067 (Chen2020), 0.068 (OKane2022), 0.036 (NCA_Kim2011).">
