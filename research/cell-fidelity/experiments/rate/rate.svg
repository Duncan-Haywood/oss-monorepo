<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the set-median error |ln(L_pred(99)/L_DFN(99))| of the ten-cycle plating forecast for four PyBaMM parameter sets, for four variants: 1 the measured OCP rise, 2 the measured plating overpotential rise, 3 the OCP rise with the measured charge-capacity factor, 4 the overpotential rise with the measured capacity factor. With both measured the errors are 0.080 (Ai2020), 0.014 (Chen2020), 0.015 (OKane2022), 0.011 (NCA_Kim2011).">
