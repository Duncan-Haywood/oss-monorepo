<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of median charged wall time to reach within 1% of the best 100-cycle DFN design against pool size: cheap whole-pool screens beat GP-EI on pools of 16 to 64 designs, GP-EI catches up by 96">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Time to a design within 1% of the DFN best, by candidate-pool size</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="255.3" y2="255.3" stroke="#ddd"/><text x="58" y="259.3" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="186.5" y2="186.5" stroke="#ddd"/><text x="58" y="190.5" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="117.8" y2="117.8" stroke="#ddd"/><text x="58" y="121.8" text-anchor="end" font-family="sans-serif" font-size="11">300</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">16</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">32</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">64</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">96</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">designs in the candidate pool</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">median seconds to within 1% (30 seeds)</text>
<polyline points="64.0,223.0 176.0,189.3 400.0,172.5 624.0,172.5" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="223.0" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="189.3" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="172.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="172.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">GP-EI on DFN@100</text>
<polyline points="64.0,286.7 176.0,257.7 400.0,208.4 624.0,159.0" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="286.7" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="257.7" r="3" fill="#1f6fb2"/>
<circle cx="400.0" cy="208.4" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="159.0" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">SPM@2 screen</text>
<polyline points="64.0,292.4 176.0,277.5 400.0,214.3 624.0,151.0" fill="none" stroke="#2e8b57" stroke-width="2"/>
