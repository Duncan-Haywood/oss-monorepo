<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">DFN@2 screen</text>
<polyline points="64.0,267.8 176.0,228.5 400.0,149.9 624.0,71.2" fill="none" stroke="#8e44ad" stroke-width="2"/>
