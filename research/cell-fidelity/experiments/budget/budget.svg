<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the set-median Shapley value, in |ln(L_pred/L_DFN)| at cycle 99, of measuring each input of the ten-cycle forecast for four PyBaMM parameter sets: 1 the node lever's OCP rise, 2 the non-OCP plating-overpotential drift, 3 the charge-capacity factor. The OCP rise's values are -0.020 (Ai2020), 0.021 (Chen2020), 0.033 (OKane2022), 0.025 (NCA_Kim2011).">
