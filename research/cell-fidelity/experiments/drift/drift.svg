<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the set-median error |ln(L_pred(99)/L_DFN(99))| of the ten-cycle plating forecast for four PyBaMM parameter sets: 1 the law's own lever, 2 the node lever, 3 the node lever plus a ten-cycle forecast of the non-OCP overpotential drift with a ten-cycle capacity factor, 4 both inputs measured to cycle 99. The ten-cycle forecast's errors are 0.070 (Ai2020), 0.057 (Chen2020), 0.072 (OKane2022), 0.101 (NCA_Kim2011).">
