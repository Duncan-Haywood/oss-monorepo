[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-allywatch"
version = "0.1.0"
description = "Allies who fade when the crowd walks away from them: does the robots' tip survive?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
