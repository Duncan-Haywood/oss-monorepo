[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-imutemp"
version = "0.1.0"
description = "Does a shared temperature coefficient put a floor under n fused cheap gyros, and what does per-unit compensation buy?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
