[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanger-foldrate"
version = "0.1.0"
description = "hanger-cell re-run with the fold time taken from published robot garment-folding rates instead of an assumed 25 s"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
