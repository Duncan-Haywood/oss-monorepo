<circle cx="338.0" cy="315.0" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="319.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">always fold</text>
<polyline points="64.0,71.2 95.0,236.6 109.3,258.0 338.0,310.6 624.0,317.3" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="95.0" cy="236.6" r="3" fill="#1f6fb2"/>
<circle cx="109.3" cy="258.0" r="3" fill="#1f6fb2"/>
