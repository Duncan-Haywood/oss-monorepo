<circle cx="338.0" cy="108.4" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="111.5" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">always hang</text>
