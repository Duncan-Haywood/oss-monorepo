<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Resting error |x| after 2000 steps</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="272.4" y2="272.4" stroke="#ddd"/><text x="58" y="276.4" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="220.7" y2="220.7" stroke="#ddd"/><text x="58" y="224.7" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="169.1" y2="169.1" stroke="#ddd"/><text x="58" y="173.1" text-anchor="end" font-family="sans-serif" font-size="11">3</text>
<line x1="64" x2="624" y1="117.5" y2="117.5" stroke="#ddd"/><text x="58" y="121.5" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
<line x1="64" x2="624" y1="65.8" y2="65.8" stroke="#ddd"/><text x="58" y="69.8" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
<text x="134.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">d=0.05 k=0.5</text>
<rect x="78.0" y="324.0" width="56.0" height="0.0" fill="#c0392b"/>
<rect x="134.0" y="318.8" width="56.0" height="5.2" fill="#1f6fb2"/>
<text x="274.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">d=0.2 k=0.4</text>
<rect x="218.0" y="324.0" width="56.0" height="0.0" fill="#c0392b"/>
<rect x="274.0" y="298.2" width="56.0" height="25.8" fill="#1f6fb2"/>
<text x="414.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">d=0.2 k=0.9</text>
<rect x="358.0" y="324.0" width="56.0" height="0.0" fill="#c0392b"/>
<rect x="414.0" y="312.5" width="56.0" height="11.5" fill="#1f6fb2"/>
<text x="554.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">d=0.5 k=0.1</text>
<rect x="498.0" y="324.0" width="56.0" height="0.0" fill="#c0392b"/>
<rect x="554.0" y="65.8" width="56.0" height="258.2" fill="#1f6fb2"/>
<text x="14" y="182.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 182.0)">final |x|</text>
<rect x="76" y="50" width="14" height="10" fill="#c0392b"/><text x="96" y="60" font-family="sans-serif" font-size="11">twin (no deadband)</text>
<rect x="76" y="66" width="14" height="10" fill="#1f6fb2"/><text x="96" y="76" font-family="sans-serif" font-size="11">real loop (deadband d)</text>
