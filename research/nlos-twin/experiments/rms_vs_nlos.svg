<line x1="64" x2="624" y1="107.7" y2="107.7" stroke="#ddd"/><text x="58" y="111.7" text-anchor="end" font-family="sans-serif" font-size="11">1.5</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
