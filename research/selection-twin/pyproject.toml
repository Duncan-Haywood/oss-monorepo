[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selection-twin"
version = "0.1.0"
description = "Winner's curse when the best of K controllers is selected in a noisy digital twin: exact optimism and regret laws, budget-split optimum, shrinkage and screen-and-verify repairs"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
