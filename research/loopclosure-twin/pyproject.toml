[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loopclosure-twin"
version = "0.1.0"
description = "Loop-closure gating tuned in a too-clean odometry twin: exact chi-square gate costs, closed-form optimal gate, missed-closure claim vs reality, and a fitted-noise repair"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
