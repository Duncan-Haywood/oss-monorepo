[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-hlrt"
version = "0.1.0"
description = "Stylised: likelihood-ratio test of no hard messages for hardness-aware Dawid-Skene, asymptotic vs parametric bootstrap"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
