<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-scale line plot of real observations needed per stream against utilisation: for 10 percent sd from 1300 at rho 0.5 to 84100 at rho 0.95, and four times that for 5 percent">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Input twin: observations needed vs utilisation</text>
<line x1="64" x2="624" y1="320.9" y2="320.9" stroke="#ddd"/><text x="58" y="324.9" text-anchor="end" font-family="sans-serif" font-size="11">1000</text>
<line x1="64" x2="624" y1="221.8" y2="221.8" stroke="#ddd"/><text x="58" y="225.8" text-anchor="end" font-family="sans-serif" font-size="11">10000</text>
<line x1="64" x2="624" y1="122.6" y2="122.6" stroke="#ddd"/><text x="58" y="126.6" text-anchor="end" font-family="sans-serif" font-size="11">100000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="312.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.7</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.8</text>
<text x="561.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.9</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.95</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">utilisation rho</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">real observations per stream</text>
<polyline points="64.0,309.6 312.9,273.8 437.3,243.1 561.8,187.6 624.0,130.1" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="312.9" cy="273.8" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="243.1" r="3" fill="#c0392b"/>
<circle cx="561.8" cy="187.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="130.1" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">n for 10% sd</text>
<polyline points="64.0,249.9 312.9,214.1 437.3,183.4 561.8,127.9 624.0,70.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="249.9" r="3" fill="#1f6fb2"/>
<circle cx="312.9" cy="214.1" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="183.4" r="3" fill="#1f6fb2"/>
<circle cx="561.8" cy="127.9" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="70.4" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">n for 5% sd</text>
