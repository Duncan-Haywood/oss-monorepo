[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-shellaspect"
version = "0.1.0"
description = "3D eigenbuckling versus the slender-beam closed form across bar slenderness"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
