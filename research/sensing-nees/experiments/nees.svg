<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of NEES per degree of freedom against GNSS outage length for four filters; the matched model stays at 1, the random walk tuned at 100 s sits near 1.5, and tuning at 10 s or 1 s falls well below 1">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Does the filter know how wrong it is? NEES/dof after a GNSS outage (1 = honest)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="243.0" y2="243.0" stroke="#ddd"/><text x="58" y="247.0" text-anchor="end" font-family="sans-serif" font-size="11">0.5</text>
<line x1="64" x2="624" y1="161.9" y2="161.9" stroke="#ddd"/><text x="58" y="165.9" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="80.9" y2="80.9" stroke="#ddd"/><text x="58" y="84.9" text-anchor="end" font-family="sans-serif" font-size="11">1.5</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="102.6" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">30</text>
<text x="160.6" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">60</text>
<text x="276.4" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">120</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">300</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">GNSS outage (s)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">NEES / dof</text>
