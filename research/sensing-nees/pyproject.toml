[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-nees"
version = "0.1.0"
description = "Is an INS/GNSS Kalman filter honest about its drift when the accelerometer bias is flicker noise rather than a random walk?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
