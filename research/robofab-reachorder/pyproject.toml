[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-reachorder"
version = "0.1.0"
description = "Does the assembly order change the arm an arm needs to build its own gripper? Reach with state-dependent clearance"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
