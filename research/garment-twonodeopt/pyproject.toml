[project]
name = "garment-twonodeopt"
version = "0.1.0"
description = "An optimal switching-time oracle for an infrared-gating textile under a step in room temperature, compared with the thermostat gate"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
