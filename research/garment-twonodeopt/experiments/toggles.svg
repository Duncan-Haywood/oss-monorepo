<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Grouped bars of mean skin temperature error for the best fixed setting, a gate with no lag, a gate with 10 minutes lag and the best single toggle in four temperature-step scenarios">
