[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-earlystop"
version = "0.1.0"
description = "Formal-timeout (early stop) policies for a check cascade, replayed on the eda-verify mutation log"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
