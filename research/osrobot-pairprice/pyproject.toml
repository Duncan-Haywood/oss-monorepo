[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-pairprice"
version = "0.1.0"
description = "Is a scout drone plus a camera-less ground treater cheaper per hectare than one inline weeding robot, and at what field size?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
