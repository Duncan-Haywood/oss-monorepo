<text x="348.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="560.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">field size (hectares, log scale; 5 and 20 ha extrapolated)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">USD per hectare</text>
