<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of assumed cost per hectare for one inline weeding robot, a scout plus treater charged by minutes worked, and a pair held for the whole job, with the drone pilot's flight time paid; both pair lines stay above the inline robot at every field size, at 2.3 to 3.3 times its cost">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Cost per hectare against field size (assumed prices, pilot paid)</text>
