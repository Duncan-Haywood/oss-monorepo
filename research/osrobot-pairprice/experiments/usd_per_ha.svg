<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of assumed cost per hectare for one inline weeding robot, a scout plus treater charged by minutes worked, and a pair held for the whole job; the unheld pair crosses below the inline robot near 0.5 hectare">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Cost per hectare against field size (assumed prices)</text>
<line x1="64" x2="624" y1="286.5" y2="286.5" stroke="#ddd"/><text x="58" y="290.5" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="60.2" y2="60.2" stroke="#ddd"/><text x="58" y="64.2" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
