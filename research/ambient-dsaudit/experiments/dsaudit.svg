<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of mean utility per message for auditor-label-as-truth, EM with the auditor matrix known, and Dawid-Skene EM with no matrix known, against the number of audits from 50 to 1000, for label accuracy 0.7 and two auditors of accuracy 0.8: Dawid-Skene matches the oracle EM by 1000 audits while the naive reading stays lower">
