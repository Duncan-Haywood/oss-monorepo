[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-dsaudit"
version = "0.1.0"
description = "Stylised: Dawid-Skene with two auditors, and the cost of a wrongly assumed auditor accuracy"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
