<line x1="64" x2="624" y1="114.8" y2="114.8" stroke="#ddd"/><text x="58" y="118.8" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="62.5" y2="62.5" stroke="#ddd"/><text x="58" y="66.5" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
