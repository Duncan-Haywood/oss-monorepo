<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Lines of interval coverage against sample size on a log axis: coverage of the true slope collapses to zero as data grows while coverage of the attenuated slope stays near 95 percent">
