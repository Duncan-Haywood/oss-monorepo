[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-averse-scoring"
version = "0.1.0"
description = "Risk-averse verifiers under proper scoring rules: exact tempering law for log score, implicit law and exact debiasing for Brier, binarised rules as a fix, and the aggregation and decision consequences"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
