[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-gaugebudget"
version = "0.1.0"
description = "How much of the peak-stress price scatter of laser-cutting rules for a bracket is search budget? (search-mesh results; see README)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem", "matplotlib", "shapely"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
