[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-topopt"
version = "0.1.0"
description = "SIMP topology optimisation (after Sigmund's 99-line code) in Python, with conversion of the density field to a printable STL"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
