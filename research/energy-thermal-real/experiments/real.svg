<line x1="64" x2="624" y1="144.4" y2="144.4" stroke="#ddd"/><text x="58" y="148.4" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="77.8" y2="77.8" stroke="#ddd"/><text x="58" y="81.8" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2015</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2016</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2017</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2018</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2019</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">year</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">store minus heat pump (EUR/kWh); below 0 the store wins</text>
<polyline points="64.0,310.7 204.0,324.0 344.0,310.7 484.0,224.2 624.0,277.4" fill="none" stroke="#c0392b" stroke-width="2"/>
