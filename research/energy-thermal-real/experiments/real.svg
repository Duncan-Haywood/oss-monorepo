<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: levelised cost of heat from a house-sized sand store minus an air-source heat pump, in EUR per kWh, for each year 2015 to 2019, for daily and weekly cycling, with the store buying the cheapest quarter of hours">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Sand store minus heat pump: cost of heat on real German day-ahead prices, 2015-2019</text>
<line x1="64" x2="624" y1="277.4" y2="277.4" stroke="#ddd"/><text x="58" y="281.4" text-anchor="end" font-family="sans-serif" font-size="11">-0.02</text>
