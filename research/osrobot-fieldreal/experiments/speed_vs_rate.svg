<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of hectares per hour for inline and scout-then-treat weeding, and the inline kill share, against travel speed from 0.5 to 4 km/h; area rate rises with speed while the kill share falls from 0.65 to 0.38">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Sourced-constant weeding robot: area rate and kill against speed</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="246.1" y2="246.1" stroke="#ddd"/><text x="58" y="250.1" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="168.2" y2="168.2" stroke="#ddd"/><text x="58" y="172.2" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="90.3" y2="90.3" stroke="#ddd"/><text x="58" y="94.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="144.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="304.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">travel speed (km/h)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">ha/h  or  kill share</text>
<polyline points="64.0,292.8 144.0,265.6 304.0,214.9 624.0,117.5" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="292.8" r="3" fill="#c0392b"/>
<circle cx="144.0" cy="265.6" r="3" fill="#c0392b"/>
<circle cx="304.0" cy="214.9" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="117.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">inline: ha/h</text>
<polyline points="64.0,296.7 144.0,269.5 304.0,230.5 624.0,168.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="296.7" r="3" fill="#1f6fb2"/>
<circle cx="144.0" cy="269.5" r="3" fill="#1f6fb2"/>
<circle cx="304.0" cy="230.5" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="168.2" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">scout: ha/h</text>
<polyline points="64.0,71.2 144.0,89.1 304.0,120.3 624.0,174.4" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#2e8b57"/>
<circle cx="144.0" cy="89.1" r="3" fill="#2e8b57"/>
<circle cx="304.0" cy="120.3" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="174.4" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">inline: kill share</text>
</svg>
