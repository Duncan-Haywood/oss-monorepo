[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-prflow"
version = "0.1.0"
description = "Closed pull requests as a measure of the agent loop: merge rate, latency, batch merges and parallel bursts"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
