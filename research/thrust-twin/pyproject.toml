[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thrust-twin"
version = "0.1.0"
description = "Quadratic thrust curve a linear-thrust twin omits: closed-form acceleration error a + a^2/(4g), up/down step asymmetry"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
