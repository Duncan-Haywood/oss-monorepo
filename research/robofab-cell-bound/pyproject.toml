[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-cell-bound"
version = "0.1.0"
description = "Discrete-event twin of a robot-arm, 3D-printer and inspection cell: throughput, bottleneck and dispatch rules"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
