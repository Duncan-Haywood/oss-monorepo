[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-stubborn"
version = "0.1.0"
description = "How a share of stubborn people raises the robot share that tips a crowd's passing side"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
