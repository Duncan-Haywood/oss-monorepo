<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of test accuracy against lookup-table weight width of 2, 4 and 8 bits for post-training quantisation and fine-tuning at 0 and 75 percent sparsity: fine-tuning helps most at 2 bits and at 75 percent sparsity both reach about 0.95 at 4 bits">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Accel-lutft: accuracy against table bit width</text>
<line x1="64" x2="624" y1="313.6" y2="313.6" stroke="#ddd"/><text x="58" y="317.6" text-anchor="end" font-family="sans-serif" font-size="11">0.5</text>
<line x1="64" x2="624" y1="261.6" y2="261.6" stroke="#ddd"/><text x="58" y="265.6" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="209.6" y2="209.6" stroke="#ddd"/><text x="58" y="213.6" text-anchor="end" font-family="sans-serif" font-size="11">0.7</text>
<line x1="64" x2="624" y1="157.5" y2="157.5" stroke="#ddd"/><text x="58" y="161.5" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="105.5" y2="105.5" stroke="#ddd"/><text x="58" y="109.5" text-anchor="end" font-family="sans-serif" font-size="11">0.9</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">table weight width (bits)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">test accuracy (mean of 10 splits)</text>
