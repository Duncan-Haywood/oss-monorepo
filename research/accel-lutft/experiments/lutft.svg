<circle cx="250.7" cy="99.8" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="84.7" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">ft @ 0% sparse</text>
