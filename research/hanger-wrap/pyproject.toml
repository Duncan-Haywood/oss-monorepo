[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanger-wrap"
version = "0.1.0"
description = "A 3D cloth sheet draped over a hanger arm, checked against the 2D hanger-fit model"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
