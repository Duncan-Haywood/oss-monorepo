[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanger-sweep"
version = "0.1.0"
description = "Which hanger-fit findings survive when its assumed fabric constants (bending rigidity, stretch, weight, strip depth) are swept over two orders of magnitude"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy", "hanger-fit"]

[tool.setuptools.packages.find]
where = ["src"]
