[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-gridxfer"
version = "0.1.0"
description = "Do space-filling grid orders still beat lexicographic and random on two other chip-design families (MAC and FIR)?"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
