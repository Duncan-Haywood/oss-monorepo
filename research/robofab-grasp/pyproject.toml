[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-grasp"
version = "0.1.0"
description = "Can a parallel-jaw gripper hold each part of its own toy copy? Friction-grasp force: analytic bound vs MuJoCo"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
