[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civ-levers"
version = "0.1.0"
description = "Opinion dynamics of a polarized two-camp society with bounded confidence and backfire, and which interventions (contact, broadcast, committed moderates, a ladder of voices, nudges, tolerance) merge the camps across settings"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
