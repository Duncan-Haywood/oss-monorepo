<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the share of people driven to the opinion extremes against the rejection threshold tau at tolerance 0.3: with tau 0.9 no bridging dose moves anyone; at tau 0.8 rewiring half the ties sends almost everyone to the extremes, and at tau 0.7 rewiring 10% does">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Bridging two camps: harmless without backfire, polarizing with it</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.4" y2="273.4" stroke="#ddd"/><text x="58" y="277.4" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="222.9" y2="222.9" stroke="#ddd"/><text x="58" y="226.9" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="172.3" y2="172.3" stroke="#ddd"/><text x="58" y="176.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="121.7" y2="121.7" stroke="#ddd"/><text x="58" y="125.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="71.2" y2="71.2" stroke="#ddd"/><text x="58" y="75.2" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.7</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.8</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.9</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">rejection threshold tau (lower = people reject more distant views)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">share of people at the extremes</text>
<polyline points="624.0,324.0 437.3,324.0 250.7,298.7 64.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="324.0" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="324.0" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="298.7" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">no bridging</text>
<polyline points="624.0,324.0 437.3,324.0 250.7,71.2 64.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="624.0" cy="324.0" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="324.0" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">10% of ties rewired</text>
<polyline points="624.0,324.0 437.3,222.9 250.7,71.2 64.0,71.2" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="624.0" cy="324.0" r="3" fill="#2e8b57"/>
<circle cx="437.3" cy="222.9" r="3" fill="#2e8b57"/>
<circle cx="250.7" cy="71.2" r="3" fill="#2e8b57"/>
<circle cx="64.0" cy="71.2" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">25% rewired</text>
