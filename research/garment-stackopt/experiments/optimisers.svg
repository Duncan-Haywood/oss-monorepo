<line x1="56" x2="704" y1="40.0" y2="40.0" stroke="#eee"/><text x="50" y="44.0" text-anchor="end" font-family="sans-serif" font-size="11">27.9</text>
<line x1="56" x2="704" y1="310.0" y2="310.0" stroke="#333"/>
<text x="14" y="185.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 185.0)">median J</text>
<rect x="88.4" y="189.8" width="63.8" height="120.2" fill="#1f6fb2"/>
<rect x="153.2" y="267.7" width="63.8" height="42.3" fill="#c0392b"/>
