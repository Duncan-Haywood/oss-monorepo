<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log plot of the absolute gap in percent between the dynamic-programming table and the Euler value of its own policy, against the number of grid points, for two interpolation rules; the gap shrinks as the grid is refined">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Selfrep-dpgrid: DP table gap vs grid size</text>
<line x1="64" x2="624" y1="175.1" y2="175.1" stroke="#ddd"/><text x="58" y="179.1" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">200</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">400</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">800</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1600</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">grid points</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">|table - J| / J (%)</text>
<polyline points="64.0,131.1 204.0,150.1 344.0,191.8 484.0,251.7 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="131.1" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="150.1" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="191.8" r="3" fill="#c0392b"/>
<circle cx="484.0" cy="251.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">interp = index</text>
<polyline points="64.0,70.4 204.0,107.3 344.0,166.6 484.0,235.5 624.0,300.0" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#1f6fb2"/>
<circle cx="204.0" cy="107.3" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="166.6" r="3" fill="#1f6fb2"/>
<circle cx="484.0" cy="235.5" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="300.0" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">interp = n</text>
</svg>
