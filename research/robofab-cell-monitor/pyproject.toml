[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-cell-monitor"
version = "0.1.0"
description = "Discrete-event twin of a robot-arm and 3D-printer cell with random print failures: blind printing versus camera abort"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
