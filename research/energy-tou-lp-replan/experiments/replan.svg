<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: annual saving over no battery in dollars against the interval in hours between re-plans, on a measured-derived typical year for Golden, Colorado, for an optimiser fed yesterday's weather, a clear-sky-index forecast, a clear-sky-index forecast with a nowcast of the last sunlit hours, and a perfect forecast">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Re-planning the home battery on real weather (Golden CO): saving by re-plan interval</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="269.6" y2="269.6" stroke="#ddd"/><text x="58" y="273.6" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="215.3" y2="215.3" stroke="#ddd"/><text x="58" y="219.3" text-anchor="end" font-family="sans-serif" font-size="11">400</text>
<line x1="64" x2="624" y1="160.9" y2="160.9" stroke="#ddd"/><text x="58" y="164.9" text-anchor="end" font-family="sans-serif" font-size="11">600</text>
<line x1="64" x2="624" y1="106.5" y2="106.5" stroke="#ddd"/><text x="58" y="110.5" text-anchor="end" font-family="sans-serif" font-size="11">800</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="112.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="185.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6</text>
<text x="331.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">12</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">24</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">hours between re-plans (24 = once a day)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">saving $/yr over no battery</text>
