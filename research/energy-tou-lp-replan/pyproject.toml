[project]
name = "energy-tou-lp-replan"
version = "0.1.0"
description = "How much of the optimal home-battery controller's loss to a day-ahead forecast is execution, and how much does re-planning every few hours recover?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../energy-tou-lp-tmy/src", "../energy-tou-lp-forecast/src", "../energy-tou-lp/src", "../energy-tou/src", "../energy-home/src"]
