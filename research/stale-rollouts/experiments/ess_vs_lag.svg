<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the effective sample size of a 1000-sample batch against how many policy updates old it is: it falls from 1000 to about 3 by lag 12">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Stale rollouts: effective samples vs lag (n=1000, drift 0.2)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.4" y2="273.4" stroke="#ddd"/><text x="58" y="277.4" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="222.9" y2="222.9" stroke="#ddd"/><text x="58" y="226.9" text-anchor="end" font-family="sans-serif" font-size="11">400</text>
<line x1="64" x2="624" y1="172.3" y2="172.3" stroke="#ddd"/><text x="58" y="176.3" text-anchor="end" font-family="sans-serif" font-size="11">600</text>
<line x1="64" x2="624" y1="121.7" y2="121.7" stroke="#ddd"/><text x="58" y="125.7" text-anchor="end" font-family="sans-serif" font-size="11">800</text>
<line x1="64" x2="624" y1="71.2" y2="71.2" stroke="#ddd"/><text x="58" y="75.2" text-anchor="end" font-family="sans-serif" font-size="11">1000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="110.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">12</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">lag (policy updates)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">effective sample size</text>
<polyline points="64.0,71.2 110.7,81.1 157.3,108.6 250.7,190.7 437.3,304.5 624.0,323.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="110.7" cy="81.1" r="3" fill="#c0392b"/>
<circle cx="157.3" cy="108.6" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="190.7" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="304.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="323.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">effective sample size</text>
