[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stale-rollouts"
version = "0.1.0"
description = "Stale rollouts in asynchronous swarm RL: exact importance-weight moments, effective sample size e^{-d^2}, closed-form truncation bias and variance, and the maximum useful staleness window"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
