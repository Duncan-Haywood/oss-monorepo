[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-allocation"
version = "0.1.0"
description = "Allocating a limited audit budget across heterogeneous decentralised ML jobs against a best-responding cheater"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
