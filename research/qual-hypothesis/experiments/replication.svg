<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" role="img" aria-labelledby="t d">
<title id="t">Word hypotheses that replicate on held-out comments</title>
<desc id="d">With real labels the number of replicating hypotheses out of 20 rises from 0.8 at 100 discovery comments to 14.7 at 2000; with shuffled labels it stays near zero.</desc>
<style>text{font:13px sans-serif;fill:#222}@media(prefers-color-scheme:dark){text{fill:#eee}}</style>
