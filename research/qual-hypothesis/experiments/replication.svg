<text x="52" y="194.0" text-anchor="end">5</text>
<text x="52" y="144.0" text-anchor="end">10</text>
<text x="52" y="94.0" text-anchor="end">15</text>
<text x="52" y="44.0" text-anchor="end">20</text>
<text x="60.0" y="258" text-anchor="middle">100</text>
<text x="216.66666666666666" y="258" text-anchor="middle">300</text>
