<text x="530.0" y="258" text-anchor="middle">2000</text>
<polyline points="60.0,232.0 216.66666666666666,204.5 373.3333333333333,136.89999999999998 530.0,93.5" fill="none" stroke="#1f6fb2" stroke-width="3"/>
<circle cx="60.0" cy="232.0" r="5" fill="#1f6fb2"/>
<circle cx="216.66666666666666" cy="204.5" r="5" fill="#1f6fb2"/>
<circle cx="373.3333333333333" cy="136.89999999999998" r="5" fill="#1f6fb2"/>
<circle cx="530.0" cy="93.5" r="5" fill="#1f6fb2"/>
<text x="522.0" y="83.5" text-anchor="end" fill="#1f6fb2" style="fill:#1f6fb2">real labels</text>
<polyline points="60.0,239.7 216.66666666666666,239.65 373.3333333333333,239.75 530.0,239.35" fill="none" stroke="#c0392b" stroke-width="3"/>
<circle cx="60.0" cy="239.7" r="5" fill="#c0392b"/>
<circle cx="216.66666666666666" cy="239.65" r="5" fill="#c0392b"/>
<circle cx="373.3333333333333" cy="239.75" r="5" fill="#c0392b"/>
