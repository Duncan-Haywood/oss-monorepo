[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "effort-elicitation"
version = "0.1.0"
description = "Incentivizing costly verification effort with proper scoring rules: implementable efforts, information rent, payout spread"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
