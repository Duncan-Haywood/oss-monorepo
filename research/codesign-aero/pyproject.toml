[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesign-aero"
version = "0.1.0"
description = "Airframe and learned roll-attitude controller sized together for an inspection quadrotor: joint co-design against design-first and frozen-controller pipelines."
requires-python = ">=3.9"
dependencies = ["numpy", "cma", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
