[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tilt-twin"
version = "0.1.0"
description = "Importance sampling of a rare failure in a digital twin: exact variance of mean-shift tilting, optimal and mis-tuned shifts, weight degeneracy and confidence-interval coverage"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
