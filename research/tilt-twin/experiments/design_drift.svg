<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log line plot of relative variance of mean-shift importance sampling against threshold ratio b over b0: a shift tuned once keeps rising away from 1 while a re-tuned shift stays near 5 to 8">
