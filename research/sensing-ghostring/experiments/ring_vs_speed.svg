<polyline points="64.0,74.1 250.7,72.9 437.3,73.4 624.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="74.1" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="72.9" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="73.4" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="71.2" r="3" fill="#1f6fb2"/>
<rect x="914" y="32" width="14" height="10" fill="#1f6fb2"/><text x="934" y="41" font-family="sans-serif" font-size="11">one large-sensor frame</text>
</svg>
