<circle cx="624.0" cy="123.4" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">ring: frame 0 only</text>
<polyline points="64.0,153.7 250.7,148.2 437.3,145.5 624.0,137.4" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="153.7" r="3" fill="#8e44ad"/>
<circle cx="250.7" cy="148.2" r="3" fill="#8e44ad"/>
<circle cx="437.3" cy="145.5" r="3" fill="#8e44ad"/>
<circle cx="624.0" cy="137.4" r="3" fill="#8e44ad"/>
<rect x="574" y="32" width="14" height="10" fill="#8e44ad"/><text x="594" y="41" font-family="sans-serif" font-size="11">ring: temporal median</text>
<polyline points="64.0,108.9 250.7,113.3 437.3,111.0 624.0,112.5" fill="none" stroke="#c0392b" stroke-width="2"/>
