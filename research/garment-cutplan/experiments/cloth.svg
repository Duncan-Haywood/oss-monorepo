<circle cx="250.7" cy="112.1" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="98.1" r="3" fill="#2e8b57"/>
<circle cx="120.0" cy="323.6" r="3" fill="#2e8b57"/>
<circle cx="204.0" cy="323.8" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">any size mix (optimal)</text>
