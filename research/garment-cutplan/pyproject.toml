[project]
name = "garment-cutplan"
version = "0.1.0"
description = "Cutting-order planning: marker mixes and plies that cut a multi-size order from the least cloth"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../garment-markercost/src", "../garment-nesting/src", "../garment-teardown/src"]
