[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-weedpass"
version = "0.1.0"
description = "Does a second weeding pass, or treating on the move, change which laser-weeder plan wins?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
