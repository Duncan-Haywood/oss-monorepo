[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-memory"
version = "0.1.0"
description = "On-device retrieval, extractive summaries and retention limits for an always-on assistant, on simulated days of transcripts"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
