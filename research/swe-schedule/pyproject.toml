[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-schedule"
version = "0.1.0"
description = "Simulation of start-time collisions among parallel agent runs: stagger, claim latency and slot assignment"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
