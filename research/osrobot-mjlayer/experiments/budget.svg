<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the force in newtons, between 0 and 4, at which a 4 millimetre radius spherical tip indents a soft tissue layer bonded to bone to 30 percent of the layer thickness, against layer thickness from 5 to 20 millimetres, for moduli of 4, 10 and 45 kilopascals">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Force that indents a bonded tissue layer to 30 % of its thickness (4 mm tip)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="245.3" y2="245.3" stroke="#ddd"/><text x="58" y="249.3" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="166.5" y2="166.5" stroke="#ddd"/><text x="58" y="170.5" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="87.8" y2="87.8" stroke="#ddd"/><text x="58" y="91.8" text-anchor="end" font-family="sans-serif" font-size="11">3</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">15</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">layer thickness (mm)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">force budget (N)</text>
<polyline points="64.0,320.0 250.7,314.8 437.3,308.6 624.0,301.5" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="320.0" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="314.8" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="308.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="301.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">E=4 kPa, R=4 mm</text>
<polyline points="64.0,314.0 250.7,301.1 437.3,285.5 624.0,267.8" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="314.0" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="301.1" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="285.5" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="267.8" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">E=10 kPa, R=4 mm</text>
<polyline points="64.0,278.9 250.7,220.8 437.3,150.8 624.0,71.2" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="278.9" r="3" fill="#2e8b57"/>
<circle cx="250.7" cy="220.8" r="3" fill="#2e8b57"/>
<circle cx="437.3" cy="150.8" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="71.2" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">E=45 kPa, R=4 mm</text>
</svg>
