[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-reccover"
version = "0.1.0"
description = "Do run records match git? Claimed-PR precision and record coverage of landed sessions"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
