<circle cx="344.0" cy="85.3" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="83.8" r="3" fill="#c0392b"/>
<circle cx="530.7" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="87.9" r="3" fill="#c0392b"/>
