<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the share of sessions that put commits on main per day and also have a run record; about 60% on 13 and 14 October, 82% to 88% from 15 October">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Share of landed sessions with a run record, by day of October 2026</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="266.5" y2="266.5" stroke="#ddd"/><text x="58" y="270.5" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="208.9" y2="208.9" stroke="#ddd"/><text x="58" y="212.9" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="151.4" y2="151.4" stroke="#ddd"/><text x="58" y="155.4" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<line x1="64" x2="624" y1="93.9" y2="93.9" stroke="#ddd"/><text x="58" y="97.9" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">13</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">14</text>
