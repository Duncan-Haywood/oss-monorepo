<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">17</text>
<text x="530.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">18</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">19</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">day of October 2026 (first commit on main)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">sessions with a record (%)</text>
<polyline points="64.0,151.7 157.3,148.3 250.7,89.0 344.0,85.3 437.3,83.8 530.7,71.2 624.0,87.9" fill="none" stroke="#c0392b" stroke-width="2"/>
