[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-assist"
version = "0.1.0"
description = "Spoon-feeding a moving mouth: open-loop, camera-tracked and force-limited assistive arm designs compared on success and lip contact force (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
