<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of median reply latency against the time after end of speech at which the reply pipeline starts: holding the reply until the endpoint is flat at about 1060 ms once the start is early enough, eager replies fall linearly, and no speculation stays at about 1740 ms">
