[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-speculate"
version = "0.1.0"
description = "Speculative start of the reply pipeline during the end-of-speech hangover: latency vs wasted compute (stylised pause model)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
