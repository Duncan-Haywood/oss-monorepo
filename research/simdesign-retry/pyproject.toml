[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-retry"
version = "0.1.0"
description = "Does rolling back a robust topology-optimisation step that spikes compliance and redoing it at half the move beat shrinking the move afterwards?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
