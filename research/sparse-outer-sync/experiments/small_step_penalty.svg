<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the small-step slow-down over uncompressed sync against participation probability p; the unbiased rule follows 1/p while error feedback stays close to 1">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Sparse outer sync: slow-down over uncompressed (N=8, alpha s=0.05)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="264.6" y2="264.6" stroke="#ddd"/><text x="58" y="268.6" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
<line x1="64" x2="624" y1="205.3" y2="205.3" stroke="#ddd"/><text x="58" y="209.3" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="145.9" y2="145.9" stroke="#ddd"/><text x="58" y="149.9" text-anchor="end" font-family="sans-serif" font-size="11">15</text>
<line x1="64" x2="624" y1="86.6" y2="86.6" stroke="#ddd"/><text x="58" y="90.6" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="232.6" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="455.4" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.25</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">participation probability p (logarithmic)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">slow-down factor</text>
<polyline points="64.0,71.2 232.6,201.8 455.4,276.1 624.0,300.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="232.6" cy="201.8" r="3" fill="#c0392b"/>
<circle cx="455.4" cy="276.1" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="300.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">unbiased (simulated)</text>
<polyline points="64.0,86.6 232.6,205.3 455.4,276.5 624.0,300.3" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="86.6" r="3" fill="#1f6fb2"/>
<circle cx="232.6" cy="205.3" r="3" fill="#1f6fb2"/>
<circle cx="455.4" cy="276.5" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="300.3" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">1/p (theory)</text>
<polyline points="64.0,299.6 232.6,306.6 455.4,310.3 624.0,311.5" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="299.6" r="3" fill="#2e8b57"/>
<circle cx="232.6" cy="306.6" r="3" fill="#2e8b57"/>
<circle cx="455.4" cy="310.3" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="311.5" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">error feedback (simulated)</text>
</svg>
