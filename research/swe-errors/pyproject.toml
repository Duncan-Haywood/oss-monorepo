[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-errors"
version = "0.1.0"
description = "What do agent runs record going wrong, how often, and does it relate to partial outcomes or cost?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
