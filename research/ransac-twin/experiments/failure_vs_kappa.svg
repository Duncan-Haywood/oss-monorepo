<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the real RANSAC failure probability at the twin budget K=17 against beta-binomial concentration kappa on a log axis; failure rises from about 0.013 to 0.30 as kappa falls from 1e7 to 1">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">RANSAC twin: real failure rate at the twin-sized budget</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="281.8" y2="281.8" stroke="#ddd"/><text x="58" y="285.8" text-anchor="end" font-family="sans-serif" font-size="11">0.05</text>
<line x1="64" x2="624" y1="239.6" y2="239.6" stroke="#ddd"/><text x="58" y="243.6" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="197.5" y2="197.5" stroke="#ddd"/><text x="58" y="201.5" text-anchor="end" font-family="sans-serif" font-size="11">0.15</text>
<line x1="64" x2="624" y1="155.3" y2="155.3" stroke="#ddd"/><text x="58" y="159.3" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="113.1" y2="113.1" stroke="#ddd"/><text x="58" y="117.1" text-anchor="end" font-family="sans-serif" font-size="11">0.25</text>
<line x1="64" x2="624" y1="70.9" y2="70.9" stroke="#ddd"/><text x="58" y="74.9" text-anchor="end" font-family="sans-serif" font-size="11">0.3</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="144.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="224.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="304.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1000</text>
<text x="384.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10000</text>
<text x="464.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100000</text>
<text x="544.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e+06</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e+07</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">kappa (log scale; small = scenes vary more)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">failure probability</text>
<polyline points="624.0,313.3 199.9,304.2 144.0,264.9 112.2,205.2 88.1,140.8 64.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="313.3" r="3" fill="#c0392b"/>
<circle cx="199.9" cy="304.2" r="3" fill="#c0392b"/>
<circle cx="144.0" cy="264.9" r="3" fill="#c0392b"/>
<circle cx="112.2" cy="205.2" r="3" fill="#c0392b"/>
<circle cx="88.1" cy="140.8" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">failure at twin budget K=17</text>
</svg>
