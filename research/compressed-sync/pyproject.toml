[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compressed-sync"
version = "0.1.0"
description = "Local SGD with compressed pseudo-gradients: exact noise floor and stability limit for coordinate-wise (rand-k) versus norm-scaled (QSGD-style) unbiased compression, where norm scaling makes stiff modes pollute flat ones, and compress-versus-sync-less at equal communication"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
