[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lag-twin"
version = "0.1.0"
description = "Actuator lag a twin does not model: exact stability limit tau* = kd/kp, hunting at the twin's own natural frequency, growth rate, and the real-optimal bandwidth"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
