[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-twin"
version = "0.1.0"
description = "Grip force chosen in a digital twin of a manipulation workcell: exact real slip and crush risk under a too-clean or biased twin, domain-randomisation width, calibration budget"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
