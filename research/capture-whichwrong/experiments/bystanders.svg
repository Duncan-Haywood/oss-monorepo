<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: mean PSNR on 40 held-out scene configurations of the soft disagreement gate, the learned nearest-camera weight and the learned weight with a per-source mix, against the number of bystanders in the scene (0, 1 or 2)">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Source weight against single blend weight, by number of bystanders</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="280.1" y2="280.1" stroke="#ddd"/><text x="58" y="284.1" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
<line x1="64" x2="624" y1="236.2" y2="236.2" stroke="#ddd"/><text x="58" y="240.2" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="192.3" y2="192.3" stroke="#ddd"/><text x="58" y="196.3" text-anchor="end" font-family="sans-serif" font-size="11">15</text>
<line x1="64" x2="624" y1="148.4" y2="148.4" stroke="#ddd"/><text x="58" y="152.4" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="104.5" y2="104.5" stroke="#ddd"/><text x="58" y="108.5" text-anchor="end" font-family="sans-serif" font-size="11">25</text>
<line x1="64" x2="624" y1="60.5" y2="60.5" stroke="#ddd"/><text x="58" y="64.5" text-anchor="end" font-family="sans-serif" font-size="11">30</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">bystanders in the scene</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">PSNR against ray-traced truth (dB)</text>
<polyline points="64.0,81.8 344.0,93.7 624.0,105.1" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="81.8" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="93.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="105.1" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">soft gate</text>
<polyline points="64.0,75.2 344.0,88.9 624.0,101.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="75.2" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="88.9" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="101.1" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">learned blend weight</text>
<polyline points="64.0,71.2 344.0,84.0 624.0,97.2" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="84.0" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="97.2" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">+ per-source weight</text>
</svg>
