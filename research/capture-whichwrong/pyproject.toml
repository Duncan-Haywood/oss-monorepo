[project]
name = "capture-whichwrong"
version = "0.1.0"
description = "Confidence-gated fallback and hole filling for two-view novel-view synthesis from measured stereo depth"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
