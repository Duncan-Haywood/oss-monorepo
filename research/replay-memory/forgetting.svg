<polyline points="64.0,85.1 126.2,109.5 312.9,163.7 624.0,218.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="85.1" r="3" fill="#1f6fb2"/>
<circle cx="126.2" cy="109.5" r="3" fill="#1f6fb2"/>
