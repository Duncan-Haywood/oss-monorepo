<line x1="64" x2="624" y1="216.8" y2="216.8" stroke="#ddd"/><text x="58" y="220.8" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="163.1" y2="163.1" stroke="#ddd"/><text x="58" y="167.1" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="109.5" y2="109.5" stroke="#ddd"/><text x="58" y="113.5" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="126.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="312.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.25</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">replay rate q</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">forgetting / no replay</text>
