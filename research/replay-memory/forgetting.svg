<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of total forgetting as a fraction of no replay against the Bernoulli replay rate q for dimension 128 and 16 stored examples, with 4, 8 or all 16 examples replayed: replaying all 16 at q equals 0.5 cuts forgetting to 17 percent of no replay, replaying 4 only to 60 percent">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Replay-memory: forgetting against replay rate</text>
