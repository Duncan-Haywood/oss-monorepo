<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Grouped bars of mean absolute skin temperature error in degrees C over 180 minutes for five garment gate policies, on training rooms, held-out rooms between them and held-out rooms outside them; the tuned gate beats the default on all three and fixed open is worst">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Gate policies on held-out rooms (choice set ours)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="264.7" y2="264.7" stroke="#ddd"/><text x="58" y="268.7" text-anchor="end" font-family="sans-serif" font-size="11">0.5</text>
<line x1="64" x2="624" y1="205.5" y2="205.5" stroke="#ddd"/><text x="58" y="209.5" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="146.2" y2="146.2" stroke="#ddd"/><text x="58" y="150.2" text-anchor="end" font-family="sans-serif" font-size="11">1.5</text>
<line x1="64" x2="624" y1="87.0" y2="87.0" stroke="#ddd"/><text x="58" y="91.0" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<rect x="82.7" y="219.7" width="27.9" height="104.3" fill="#c0392b"/>
<rect x="112.5" y="213.2" width="27.9" height="110.8" fill="#1f6fb2"/>
<rect x="142.4" y="193.2" width="27.9" height="130.8" fill="#2e8b57"/>
<rect x="172.3" y="137.4" width="27.9" height="186.6" fill="#8e44ad"/>
<rect x="202.1" y="215.0" width="27.9" height="109.0" fill="#c0392b"/>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">train rooms 22-26 C</text>
<rect x="269.3" y="225.2" width="27.9" height="98.8" fill="#c0392b"/>
<rect x="299.2" y="219.5" width="27.9" height="104.5" fill="#1f6fb2"/>
<rect x="329.1" y="197.4" width="27.9" height="126.6" fill="#2e8b57"/>
<rect x="358.9" y="143.9" width="27.9" height="180.1" fill="#8e44ad"/>
<rect x="388.8" y="226.2" width="27.9" height="97.8" fill="#c0392b"/>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">held-out between</text>
<rect x="456.0" y="163.6" width="27.9" height="160.4" fill="#c0392b"/>
<rect x="485.9" y="157.5" width="27.9" height="166.5" fill="#1f6fb2"/>
<rect x="515.7" y="139.5" width="27.9" height="184.5" fill="#2e8b57"/>
<rect x="545.6" y="80.4" width="27.9" height="243.6" fill="#8e44ad"/>
<rect x="575.5" y="162.4" width="27.9" height="161.6" fill="#c0392b"/>
<text x="530.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">held-out outside</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">mean |tsk - 33.7| (C), lower is better</text>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">tuned</text>
<rect x="194" y="32" width="14" height="10" fill="#1f6fb2"/><text x="214" y="41" font-family="sans-serif" font-size="11">default</text>
<rect x="324" y="32" width="14" height="10" fill="#2e8b57"/><text x="344" y="41" font-family="sans-serif" font-size="11">closed</text>
<rect x="454" y="32" width="14" height="10" fill="#8e44ad"/><text x="474" y="41" font-family="sans-serif" font-size="11">open</text>
<rect x="584" y="32" width="14" height="10" fill="#c0392b"/><text x="604" y="41" font-family="sans-serif" font-size="11">oracle</text>
</svg>
