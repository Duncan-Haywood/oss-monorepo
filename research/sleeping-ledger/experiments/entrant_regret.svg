<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of an admitted module's regret and its regret bound against the wealth eps it is admitted with; regret stays below the bound at every eps and both grow as eps shrinks">
