<line x1="64" x2="624" y1="225.5" y2="225.5" stroke="#ddd"/><text x="58" y="229.5" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="176.2" y2="176.2" stroke="#ddd"/><text x="58" y="180.2" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<line x1="64" x2="624" y1="126.9" y2="126.9" stroke="#ddd"/><text x="58" y="130.9" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<line x1="64" x2="624" y1="77.6" y2="77.6" stroke="#ddd"/><text x="58" y="81.6" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.001</text>
<text x="271.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="479.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">entrant starting wealth eps</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">regret over 300 rounds</text>
<polyline points="624.0,317.1 479.0,300.7 271.5,277.0 64.0,253.4" fill="none" stroke="#c0392b" stroke-width="2"/>
