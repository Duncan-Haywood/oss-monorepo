<circle cx="271.5" cy="277.0" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="253.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">entrant regret</text>
<polyline points="624.0,132.4 479.0,116.5 271.5,93.9 64.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="624.0" cy="132.4" r="3" fill="#1f6fb2"/>
<circle cx="479.0" cy="116.5" r="3" fill="#1f6fb2"/>
<circle cx="271.5" cy="93.9" r="3" fill="#1f6fb2"/>
