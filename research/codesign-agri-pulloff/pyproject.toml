[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesign-agri-pulloff"
version = "0.1.0"
description = "Does the strawberry gripper co-design of codesign-agri survive the published range of stem pull-off force?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "cma", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
