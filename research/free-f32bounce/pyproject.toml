[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-f32bounce"
version = "0.1.0"
description = "Does a float32 Sinai-billiard (event-driven contact) simulation keep its long-run statistics? Departure time, event order and mean free path against float64."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
