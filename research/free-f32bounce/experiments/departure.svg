<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: median number of collisions before a float64 run started delta0 away differs from the reference by more than 0.1, rising by about 1.3 per factor e of 1/delta0; a flat line shows float32 arithmetic matches an error near 5e-8">
