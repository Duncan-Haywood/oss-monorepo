<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e-08</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e-06</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.0001</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">deliberate initial error delta0 (float64 control)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">median collisions to |difference| > 0.1</text>
