<line x1="64" x2="624" y1="111.1" y2="111.1" stroke="#ddd"/><text x="58" y="115.1" text-anchor="end" font-family="sans-serif" font-size="11">4000</text>
<line x1="64" x2="624" y1="57.9" y2="57.9" stroke="#ddd"/><text x="58" y="61.9" text-anchor="end" font-family="sans-serif" font-size="11">5000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
