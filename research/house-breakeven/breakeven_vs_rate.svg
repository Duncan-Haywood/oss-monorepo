<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the break-even extra first cost in dollars of the tight envelope against the real discount rate, for four climates; every line falls as the rate rises and colder climates sit higher">
