<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.07</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">real discount rate</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">break-even extra first cost (USD)</text>
