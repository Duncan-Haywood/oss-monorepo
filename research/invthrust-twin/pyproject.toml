[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invthrust-twin"
version = "0.1.0"
description = "Exact (square-root) thrust inverse vs linear inverse for a quadratic thrust curve, with and without a misidentified thrust coefficient"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
