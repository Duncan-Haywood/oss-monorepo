<circle cx="624.0" cy="70.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">CFMM cost</text>
<polyline points="64.0,292.2 274.5,237.0 485.1,196.0 555.2,178.5 611.4,152.7 624.0,130.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="292.2" r="3" fill="#1f6fb2"/>
<circle cx="274.5" cy="237.0" r="3" fill="#1f6fb2"/>
<circle cx="485.1" cy="196.0" r="3" fill="#1f6fb2"/>
<circle cx="555.2" cy="178.5" r="3" fill="#1f6fb2"/>
<circle cx="611.4" cy="152.7" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="130.2" r="3" fill="#1f6fb2"/>
