<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot on a log axis of the cost of pushing a binary market price from 0.5 to p between 0.6 and 0.999; the CFMM cost rises from 0.225 to 30.6 and the LMSR cost from 0.322 to 8.97, so the CFMM is cheaper up to p = 0.9 and dearer from p = 0.95">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">CFMM vs LMSR: cost of pushing a binary price to p (equal worst-case loss)</text>
<line x1="64" x2="624" y1="237.0" y2="237.0" stroke="#ddd"/><text x="58" y="241.0" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="124.8" y2="124.8" stroke="#ddd"/><text x="58" y="128.8" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
<text x="274.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.75</text>
<text x="485.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.9</text>
<text x="555.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.95</text>
<text x="611.4" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.99</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.999</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">target price p</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">cost (log scale)</text>
<polyline points="64.0,309.6 274.5,252.2 485.1,203.2 555.2,178.0 611.4,130.2 624.0,70.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="274.5" cy="252.2" r="3" fill="#c0392b"/>
<circle cx="485.1" cy="203.2" r="3" fill="#c0392b"/>
<circle cx="555.2" cy="178.0" r="3" fill="#c0392b"/>
