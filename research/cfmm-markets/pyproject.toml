[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfmm-markets"
version = "0.1.0"
description = "Constant-product market makers as cost-function prediction markets and expert routers: exact informed-trader profit C0(1 - n GM(pi)), polynomial price tails, and forgiving routing after regime switches"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
