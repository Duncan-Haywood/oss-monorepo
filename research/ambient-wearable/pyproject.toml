[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-wearable"
version = "0.1.0"
description = "Power budget and gating firmware for a pendant-style always-on audio wearable (nRF52840 class)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
