<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Grouped bars of the absolute change in dry heat loss in W per square metre after 60 minutes in a 16 C room when each garment property moves across its span, for our model and the reference: the reference is roughly 1.9 to 2.7 times ours for transmittance, emissivity and clothing insulation">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Dry heat loss effect of each property, cool room 16 C</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="244.9" y2="244.9" stroke="#ddd"/><text x="58" y="248.9" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
<line x1="64" x2="624" y1="165.8" y2="165.8" stroke="#ddd"/><text x="58" y="169.8" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="86.7" y2="86.7" stroke="#ddd"/><text x="58" y="90.7" text-anchor="end" font-family="sans-serif" font-size="11">15</text>
<rect x="78.0" y="195.9" width="54.0" height="128.1" fill="#c0392b"/>
<rect x="134.0" y="80.4" width="54.0" height="243.6" fill="#1f6fb2"/>
<text x="134.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">tau 0 -> 0.8</text>
<rect x="218.0" y="237.0" width="54.0" height="87.0" fill="#c0392b"/>
<rect x="274.0" y="124.7" width="54.0" height="199.3" fill="#1f6fb2"/>
<text x="274.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">eps 0.95 -> 0.2</text>
<rect x="358.0" y="324.0" width="54.0" height="0.0" fill="#c0392b"/>
<rect x="414.0" y="324.0" width="54.0" height="0.0" fill="#1f6fb2"/>
<text x="414.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">alpha 0.9 -> 0.15</text>
<rect x="498.0" y="262.3" width="54.0" height="61.7" fill="#c0392b"/>
<rect x="554.0" y="154.7" width="54.0" height="169.3" fill="#1f6fb2"/>
<text x="554.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">clo 0.7 -> 0.3</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">|change in dry loss| (W/m2)</text>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">ours</text>
<rect x="194" y="32" width="14" height="10" fill="#1f6fb2"/><text x="214" y="41" font-family="sans-serif" font-size="11">ref</text>
</svg>
