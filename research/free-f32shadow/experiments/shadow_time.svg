<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: median time for a float64 run started with an error of size delta0 to differ from the reference by more than 1, falling by about 1.1 per factor e; a flat line shows float32 arithmetic matches an error near 6e-6">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Lorenz: time until a twin leaves the float64 trajectory</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="281.2" y2="281.2" stroke="#ddd"/><text x="58" y="285.2" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
<line x1="64" x2="624" y1="238.4" y2="238.4" stroke="#ddd"/><text x="58" y="242.4" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="195.7" y2="195.7" stroke="#ddd"/><text x="58" y="199.7" text-anchor="end" font-family="sans-serif" font-size="11">15</text>
<line x1="64" x2="624" y1="152.9" y2="152.9" stroke="#ddd"/><text x="58" y="156.9" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="110.1" y2="110.1" stroke="#ddd"/><text x="58" y="114.1" text-anchor="end" font-family="sans-serif" font-size="11">25</text>
<line x1="64" x2="624" y1="67.3" y2="67.3" stroke="#ddd"/><text x="58" y="71.3" text-anchor="end" font-family="sans-serif" font-size="11">30</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e-12</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e-10</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e-08</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e-06</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.0001</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">deliberate initial error delta0 (float64 control)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">median time to |difference| > 1</text>
<polyline points="624.0,246.1 484.0,202.1 344.0,157.6 204.0,115.4 64.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="246.1" r="3" fill="#c0392b"/>
<circle cx="484.0" cy="202.1" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="157.6" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="115.4" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">float64, start moved by delta0</text>
<polyline points="64.0,218.6 624.0,218.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="218.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="218.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">float32 arithmetic</text>
</svg>
