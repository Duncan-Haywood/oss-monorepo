[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-surrogate"
version = "0.1.0"
description = "A surrogate that predicts Yosys synthesis cell counts from word-level RTL features, and what it saves a design-space search"
requires-python = ">=3.9"
dependencies = ["numpy", "scikit-learn"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
