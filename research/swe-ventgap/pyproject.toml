[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-ventgap"
version = "0.1.0"
description = "Why do ventures sessions leave fewer run records? Coverage by prompt version, scope, size and day"
