<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the share of ventures sessions that put commits on main per day and also have a run record, rising from 53% on 14 October to about 84% to 89% on 18 and 19 October">
