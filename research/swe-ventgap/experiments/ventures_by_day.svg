<line x1="64" x2="624" y1="96.0" y2="96.0" stroke="#ddd"/><text x="58" y="100.0" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">14</text>
