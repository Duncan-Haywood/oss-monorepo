[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgetting-audit"
version = "0.1.0"
description = "Auditing under-trained continual-learning jobs from old-task losses: exact forgetting law for partial training and skipped tasks, the audit window, and audit sample sizes"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
