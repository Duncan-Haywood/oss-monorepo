[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alias-twin"
version = "0.1.0"
description = "Radar twin without Doppler folding: ego-velocity estimation from radial speeds that wrap at the unambiguous speed, exact bias of the naive estimator, and the angular-diversity condition for unfolding"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
