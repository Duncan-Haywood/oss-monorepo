[project]
name = "garment-twonodecheck"
version = "0.1.0"
description = "Cross-check of garment-thermal's two-node model against pythermalcomfort's Gagge two-node"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest", "pythermalcomfort==4.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
