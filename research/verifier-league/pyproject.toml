[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier-league"
version = "0.1.0"
description = "Anytime-valid identification of the best of n verifiers under Brier loss: pairwise e-process rates, the binding competitor, multiplicity, elimination cost"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
