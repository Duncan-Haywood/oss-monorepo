<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of total evaluation cost against the number of verifiers in the league; with elimination the cost grows slowly, without it the cost grows much faster">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Verifier league: evaluation cost against league size</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="270.9" y2="270.9" stroke="#ddd"/><text x="58" y="274.9" text-anchor="end" font-family="sans-serif" font-size="11">1000</text>
<line x1="64" x2="624" y1="217.8" y2="217.8" stroke="#ddd"/><text x="58" y="221.8" text-anchor="end" font-family="sans-serif" font-size="11">2000</text>
<line x1="64" x2="624" y1="164.7" y2="164.7" stroke="#ddd"/><text x="58" y="168.7" text-anchor="end" font-family="sans-serif" font-size="11">3000</text>
<line x1="64" x2="624" y1="111.6" y2="111.6" stroke="#ddd"/><text x="58" y="115.6" text-anchor="end" font-family="sans-serif" font-size="11">4000</text>
<line x1="64" x2="624" y1="58.5" y2="58.5" stroke="#ddd"/><text x="58" y="62.5" text-anchor="end" font-family="sans-serif" font-size="11">5000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">12</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">verifiers in the league n</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">evaluation cost (simulated runs)</text>
<polyline points="64.0,297.5 176.0,289.6 400.0,281.6 624.0,269.3" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="297.5" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="289.6" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="281.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="269.3" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">with elimination</text>
<polyline points="64.0,298.5 176.0,253.8 400.0,147.1 624.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="298.5" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="253.8" r="3" fill="#1f6fb2"/>
<circle cx="400.0" cy="147.1" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="71.2" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">no elimination</text>
