<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Highest first-mode frequency reachable within the holder limit against carriage mass: steel is highest, then aluminium, then hardwood, and all fall as the carriage gets heavier">
