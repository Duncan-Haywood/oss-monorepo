<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: the installed battery price in dollars per kWh at which a home battery just pays, for an assumed time-of-use tariff with grid charging and for a flat tariff, falling as the battery grows">
