[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-fieldfill"
version = "0.1.0"
description = "How complete are the run records, by field, track and week? Fill rates with Wilson intervals"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
