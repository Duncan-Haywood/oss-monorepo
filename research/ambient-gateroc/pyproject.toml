[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-gateroc"
version = "0.1.0"
description = "Fixed vs noise-adaptive energy-gate thresholds for an always-on audio pendant: recall, open fraction and battery life on synthetic audio"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
