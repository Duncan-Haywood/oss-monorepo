[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-prlifetime"
version = "0.1.0"
description = "Measures real pull-request lifetimes for research merges and replays each from its real creation time to count shared-file conflicts"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
