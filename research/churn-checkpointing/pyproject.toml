[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-checkpointing"
version = "0.1.0"
description = "Exact checkpoint interval for preemptible decentralised training: Lambert-W optimum, Young-Daly error, synchronous scaling wall"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
