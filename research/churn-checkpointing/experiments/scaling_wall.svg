<circle cx="484.0" cy="218.5" r="3" fill="#c0392b"/>
<circle cx="550.8" cy="281.8" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="317.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">efficiency at optimal interval</text>
