<line x1="64" x2="624" y1="221.4" y2="221.4" stroke="#ddd"/><text x="58" y="225.4" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="170.1" y2="170.1" stroke="#ddd"/><text x="58" y="174.1" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="118.7" y2="118.7" stroke="#ddd"/><text x="58" y="122.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="67.4" y2="67.4" stroke="#ddd"/><text x="58" y="71.4" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
