<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1000</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">workers n (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">efficiency</text>
