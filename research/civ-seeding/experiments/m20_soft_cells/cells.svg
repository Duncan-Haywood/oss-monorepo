<circle cx="64.0" cy="216.0" r="3" fill="#8e44ad"/>
<circle cx="344.0" cy="216.0" r="3" fill="#8e44ad"/>
<circle cx="624.0" cy="216.0" r="3" fill="#8e44ad"/>
