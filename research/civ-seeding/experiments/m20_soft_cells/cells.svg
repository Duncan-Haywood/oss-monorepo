<circle cx="344.0" cy="231.1" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="231.1" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">1 per 4, closing triangles: keep all</text>
