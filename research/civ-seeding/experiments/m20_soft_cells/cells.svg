<circle cx="344.0" cy="209.5" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="178.2" r="3" fill="#1f6fb2"/>
<rect x="321.2" y="32" width="14" height="10" fill="#1f6fb2"/><text x="341.2" y="41" font-family="sans-serif" font-size="11">1 per 4, closing triangles: drop one-sided</text>
