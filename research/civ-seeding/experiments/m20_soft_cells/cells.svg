<line x1="64" x2="624" y1="226.3" y2="226.3" stroke="#ddd"/><text x="58" y="230.3" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="163.5" y2="163.5" stroke="#ddd"/><text x="58" y="167.5" text-anchor="end" font-family="sans-serif" font-size="11">3</text>
<line x1="64" x2="624" y1="100.7" y2="100.7" stroke="#ddd"/><text x="58" y="104.7" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
<text x="64.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="624.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="396" text-anchor="middle" font-family="sans-serif" font-size="12">share of false ties both ends report (kappa)</text>
<text x="14" y="218.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 218.0)">joint median worst-case regret (%)</text>
<line x1="64" x2="624" y1="99.2" y2="99.2" stroke="#555" stroke-dasharray="4 3"/>
