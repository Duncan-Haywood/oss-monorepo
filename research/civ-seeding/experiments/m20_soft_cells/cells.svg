<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" role="img" aria-label="pooled joint median worst-case regret of census degree discount against the share of false ties both ends report, for keeping every report, dropping one-sided ties and keeping them at half weight, at one false tie per four true ones closing triangles and one per two placed at random">
<rect width="640" height="408" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Half weight on one-sided ties, two more false-tie cells (census degree discount, recall 0.85)</text>
