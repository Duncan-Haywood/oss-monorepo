<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="t d">
<title id="t">Worst-case adopters lost by survey share, design and ranking</title>
<desc id="d">For seeding rules that see only a sampled share of households' ties, the largest share of expected adopters lost against the best rule under the information, threshold and reinforcement models fitted to 43 Karnataka villages.</desc>
<rect width="680" height="420" fill="#fff"/>
<text x="64" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Adopters lost under the worst fitted model, by survey share (43 villages)</text>
