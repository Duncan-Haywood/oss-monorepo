<line x1="64" x2="500" y1="177.5" y2="177.5" stroke="#ddd"/><text x="58" y="181.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="11">6%</text>
<line x1="64" x2="500" y1="115.3" y2="115.3" stroke="#ddd"/><text x="58" y="119.3" text-anchor="end" font-family="system-ui, sans-serif" font-size="11">8%</text>
