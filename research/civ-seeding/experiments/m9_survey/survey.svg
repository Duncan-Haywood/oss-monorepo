<text x="64.0" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">10%</text>
<text x="282.0" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">25%</text>
<text x="500.0" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">50%</text>
<text x="282.0" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12">share of households surveyed</text>
<line x1="64" x2="500" y1="236.4" y2="236.4" stroke="#555" stroke-dasharray="2 3"/><text x="506" y="240.4" font-family="system-ui, sans-serif" font-size="11">census top degree 4.1%</text>
