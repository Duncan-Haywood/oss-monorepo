<title id="t">Worst-case seeding regret when the contagion model parameters are uncertain</title>
<desc id="d">For each seeding rule on the 43 Karnataka villages, the worst share of adopters lost against the best rule over the information, threshold and reinforcement models: median and 5 to 95 percent range over a village bootstrap that refits the models in each draw, against the same draws under fixed point fits.</desc>
