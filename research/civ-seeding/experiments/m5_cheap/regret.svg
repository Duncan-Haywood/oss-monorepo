<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" width="720" height="670" font-family="system-ui, sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Regret of census, survey and greedy seeding rules under three fitted contagion models</title>
