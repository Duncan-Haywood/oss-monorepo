<rect x="120" y="280" width="261.1" height="6" fill="#2a6fdb"><title>leaders under I: 6.20%</title></rect>
<rect x="120" y="287" width="439.0" height="6" fill="#d9822b"><title>leaders under T: 10.42%</title></rect>
<rect x="120" y="294" width="259.4" height="6" fill="#3a9d5d"><title>leaders under R: 6.16%</title></rect>
<text x="112" y="325.5" text-anchor="end">ball</text>
<rect x="120" y="311" width="297.5" height="6" fill="#2a6fdb"><title>ball under I: 7.06%</title></rect>
<rect x="120" y="318" width="441.3" height="6" fill="#d9822b"><title>ball under T: 10.48%</title></rect>
<rect x="120" y="325" width="270.1" height="6" fill="#3a9d5d"><title>ball under R: 6.41%</title></rect>
<text x="112" y="356.5" text-anchor="end">random</text>
<rect x="120" y="342" width="289.9" height="6" fill="#2a6fdb"><title>random under I: 6.88%</title></rect>
<rect x="120" y="349" width="509.1" height="6" fill="#d9822b"><title>random under T: 12.09%</title></rect>
<rect x="120" y="356" width="364.1" height="6" fill="#3a9d5d"><title>random under R: 8.65%</title></rect>
<text x="120" y="410" font-size="11">regret = 1 &#8722; adopters / best rule&#8217;s adopters under that model; 200 runs per village</text>
