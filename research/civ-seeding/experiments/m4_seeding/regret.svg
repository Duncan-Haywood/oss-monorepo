<text x="112" y="201.5" text-anchor="end">degree</text>
<rect x="120" y="187" width="136.2" height="6" fill="#2a6fdb"><title>degree under I: 3.23%</title></rect>
<rect x="120" y="194" width="172.9" height="6" fill="#d9822b"><title>degree under T: 4.11%</title></rect>
