<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Regret of ten seeding rules under three fitted contagion models</title>
<desc id="d">For each seeding rule, the share of expected adopters lost against the best rule, under the information, threshold and reinforcement models fitted to the 43 Karnataka villages. Rules sorted by their worst case.</desc>
<style>text{fill:#222}.ax{stroke:#888}@media (prefers-color-scheme:dark){text{fill:#ddd}}</style>
<text x="120" y="22" font-size="14" font-weight="600">Adopters lost against the best rule, by model (43 villages, same seed budget)</text>
<rect x="120" y="34" width="12" height="10" fill="#2a6fdb"/><text x="136" y="43">information (I)</text>
<rect x="290" y="34" width="12" height="10" fill="#d9822b"/><text x="306" y="43">threshold (T)</text>
<rect x="460" y="34" width="12" height="10" fill="#3a9d5d"/><text x="476" y="43">reinforcement (R)</text>
<line class="ax" x1="120.0" y1="56" x2="120.0" y2="370" stroke-opacity="0.3"/><text x="120.0" y="386" text-anchor="middle">0.0%</text>
<line class="ax" x1="232.0" y1="56" x2="232.0" y2="370" stroke-opacity="0.3"/><text x="232.0" y="386" text-anchor="middle">2.7%</text>
<line class="ax" x1="344.0" y1="56" x2="344.0" y2="370" stroke-opacity="0.3"/><text x="344.0" y="386" text-anchor="middle">5.3%</text>
<line class="ax" x1="456.0" y1="56" x2="456.0" y2="370" stroke-opacity="0.3"/><text x="456.0" y="386" text-anchor="middle">8.0%</text>
<line class="ax" x1="568.0" y1="56" x2="568.0" y2="370" stroke-opacity="0.3"/><text x="568.0" y="386" text-anchor="middle">10.6%</text>
<line class="ax" x1="680.0" y1="56" x2="680.0" y2="370" stroke-opacity="0.3"/><text x="680.0" y="386" text-anchor="middle">13.3%</text>
<text x="112" y="77.5" text-anchor="end">greedy-T</text>
<rect x="120" y="63" width="20.7" height="6" fill="#2a6fdb"><title>greedy-T under I: 0.49%</title></rect>
<rect x="120" y="70" width="0.5" height="6" fill="#d9822b"><title>greedy-T under T: 0.00%</title></rect>
<rect x="120" y="77" width="7.1" height="6" fill="#3a9d5d"><title>greedy-T under R: 0.17%</title></rect>
<text x="112" y="108.5" text-anchor="end">greedy-R</text>
<rect x="120" y="94" width="13.2" height="6" fill="#2a6fdb"><title>greedy-R under I: 0.31%</title></rect>
<rect x="120" y="101" width="40.2" height="6" fill="#d9822b"><title>greedy-R under T: 0.95%</title></rect>
<rect x="120" y="108" width="0.5" height="6" fill="#3a9d5d"><title>greedy-R under R: 0.00%</title></rect>
<text x="112" y="139.5" text-anchor="end">greedy-I</text>
<rect x="120" y="125" width="0.5" height="6" fill="#2a6fdb"><title>greedy-I under I: 0.00%</title></rect>
<rect x="120" y="132" width="107.9" height="6" fill="#d9822b"><title>greedy-I under T: 2.56%</title></rect>
<rect x="120" y="139" width="38.7" height="6" fill="#3a9d5d"><title>greedy-I under R: 0.92%</title></rect>
