<rect x="120" y="156" width="119.5" height="6" fill="#2a6fdb"><title>patches under I: 2.84%</title></rect>
<rect x="120" y="163" width="150.9" height="6" fill="#d9822b"><title>patches under T: 3.58%</title></rect>
