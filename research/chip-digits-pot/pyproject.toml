[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-digits-pot"
version = "0.1.0"
description = "Per-channel power-of-two weight scales: an integer-exact shift-per-neuron lane for the quantised digits MLP"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
