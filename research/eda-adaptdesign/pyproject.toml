[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-adaptdesign"
version = "0.1.0"
description = "Design-level bootstrap of the spread-against-random adaptation gap"
requires-python = ">=3.9"
dependencies = ["numpy", "scikit-learn"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
