[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesign-agri"
version = "0.1.0"
description = "Soft-fruit picking gripper co-design on a stylised bruising model, comparing session-agent proposals with random search, CMA-ES and Bayesian optimisation"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "cma", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
