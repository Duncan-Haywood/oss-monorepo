<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-label="Line plot of the contact area in square centimetres that the worst of 200 camera-arm trials needs so that its peak force stays under a pressure limit of 20 or 110 newtons per square centimetre, against approach speed in metres per second, at contact damping 4 and 1000">
<rect width="640" height="394" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Contact area the worst trial needs to stay within a pressure limit</text>
<line x1="64" x2="624" y1="338.0" y2="338.0" stroke="#ddd"/><text x="58" y="342.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="290.7" y2="290.7" stroke="#ddd"/><text x="58" y="294.7" text-anchor="end" font-family="sans-serif" font-size="11">0.5</text>
<line x1="64" x2="624" y1="243.3" y2="243.3" stroke="#ddd"/><text x="58" y="247.3" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="196.0" y2="196.0" stroke="#ddd"/><text x="58" y="200.0" text-anchor="end" font-family="sans-serif" font-size="11">1.5</text>
<line x1="64" x2="624" y1="148.6" y2="148.6" stroke="#ddd"/><text x="58" y="152.6" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="101.3" y2="101.3" stroke="#ddd"/><text x="58" y="105.3" text-anchor="end" font-family="sans-serif" font-size="11">2.5</text>
<text x="64.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">0.02</text>
<text x="157.3" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="312.9" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="624.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="344.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="12">approach speed (m/s)</text>
<text x="14" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 204.0)">area needed (cm2)</text>
<polyline points="64.0,259.4 157.3,258.5 312.9,266.0 624.0,242.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="259.4" r="3" fill="#c0392b"/>
<circle cx="157.3" cy="258.5" r="3" fill="#c0392b"/>
<circle cx="312.9" cy="266.0" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="242.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">b=4, limit 20 N/cm2</text>
<polyline points="64.0,323.8 157.3,323.8 312.9,324.7 624.0,321.0" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="323.8" r="3" fill="#1f6fb2"/>
<circle cx="157.3" cy="323.8" r="3" fill="#1f6fb2"/>
<circle cx="312.9" cy="324.7" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="321.0" r="3" fill="#1f6fb2"/>
<rect x="215.8" y="32" width="14" height="10" fill="#1f6fb2"/><text x="235.8" y="41" font-family="sans-serif" font-size="11">b=4, limit 110 N/cm2</text>
<polyline points="64.0,177.0 157.3,200.7 312.9,162.8 624.0,85.2" fill="none" stroke="#2e8b57" stroke-width="2"/>
