<circle cx="157.3" cy="200.7" r="3" fill="#2e8b57"/>
<circle cx="312.9" cy="162.8" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="85.2" r="3" fill="#2e8b57"/>
<rect x="373.8" y="32" width="14" height="10" fill="#2e8b57"/><text x="393.8" y="41" font-family="sans-serif" font-size="11">b=1000, limit 20 N/cm2</text>
<polyline points="64.0,308.6 157.3,313.4 312.9,305.8 624.0,292.5" fill="none" stroke="#8e44ad" stroke-width="2"/>
