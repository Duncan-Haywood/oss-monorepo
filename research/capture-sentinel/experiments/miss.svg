<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">concentration of facing (kappa; 0 = any direction)</text>
