<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the indentation depth in millimetres that a sphere of radius 4, 15 or 25 millimetres would sink into a soft half-space at 53.3 newtons, against the half-space's Young's modulus in kilopascals between 4 and 45">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Hertz indentation depth at the worst-trial force (53.3 N)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="271.6" y2="271.6" stroke="#ddd"/><text x="58" y="275.6" text-anchor="end" font-family="sans-serif" font-size="11">50</text>
<line x1="64" x2="624" y1="219.2" y2="219.2" stroke="#ddd"/><text x="58" y="223.2" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="166.8" y2="166.8" stroke="#ddd"/><text x="58" y="170.8" text-anchor="end" font-family="sans-serif" font-size="11">150</text>
<line x1="64" x2="624" y1="114.4" y2="114.4" stroke="#ddd"/><text x="58" y="118.4" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="62.0" y2="62.0" stroke="#ddd"/><text x="58" y="66.0" text-anchor="end" font-family="sans-serif" font-size="11">250</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="146.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="282.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">45</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">face modulus (kPa)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">indentation depth (mm)</text>
<polyline points="64.0,71.2 146.0,186.7 282.5,237.5 624.0,273.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="146.0" cy="186.7" r="3" fill="#c0392b"/>
<circle cx="282.5" cy="237.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="273.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">tip R=4 mm</text>
<polyline points="64.0,161.3 146.0,235.7 282.5,268.3 624.0,291.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="161.3" r="3" fill="#1f6fb2"/>
<circle cx="146.0" cy="235.7" r="3" fill="#1f6fb2"/>
<circle cx="282.5" cy="268.3" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="291.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">tip R=15 mm</text>
<polyline points="64.0,186.7 146.0,249.5 282.5,277.1 624.0,296.7" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="186.7" r="3" fill="#2e8b57"/>
<circle cx="146.0" cy="249.5" r="3" fill="#2e8b57"/>
<circle cx="282.5" cy="277.1" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="296.7" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">tip R=25 mm</text>
</svg>
