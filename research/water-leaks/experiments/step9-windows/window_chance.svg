<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-label="Line plot of the probability that random alarms score at least each detector's 2019 detection count, against the match window (14, 30, 60 days), ungated and with a 1 m3/h flow gate; each detector crosses 0.05 under some rule, the location score (not shown) is below 0.001 under all of them">
