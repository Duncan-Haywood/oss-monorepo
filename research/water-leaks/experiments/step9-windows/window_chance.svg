<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the probability that random alarms score at least each detector's 2019 detection count, against the match window (14, 30, 60 days), ungated and with a 1 m3/h flow gate; each detector crosses 0.05 under some rule, the location score (not shown) is below 0.001 under all of them">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">BattLeDIM 2019: detection count against chance, by match window</text>
<line x1="64" x2="624" y1="285.2" y2="285.2" stroke="#ddd"/><text x="58" y="289.2" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<line x1="64" x2="624" y1="203.8" y2="203.8" stroke="#ddd"/><text x="58" y="207.8" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="122.5" y2="122.5" stroke="#ddd"/><text x="58" y="126.5" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">14</text>
<text x="258.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">30</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">60</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">match window (days after onset or gate)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">P(chance >= detections)</text>
<line x1="64" x2="624" y1="146.9" y2="146.9" stroke="#555" stroke-dasharray="4 3"/>
