<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the probability that random alarms score at least each detector's 2019 detection count, against the flow gate phi; D1-F is never below 0.05, the night-flow M3 is below 0.005 at every phi above 0">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">BattLeDIM 2019: detection count against chance, by match gate</text>
<line x1="64" x2="624" y1="287.1" y2="287.1" stroke="#ddd"/><text x="58" y="291.1" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<line x1="64" x2="624" y1="212.4" y2="212.4" stroke="#ddd"/><text x="58" y="216.4" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="137.7" y2="137.7" stroke="#ddd"/><text x="58" y="141.7" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="63.0" y2="63.0" stroke="#ddd"/><text x="58" y="67.0" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="120.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">gate phi (m3/h of leak flow before an alarm can count; 0 = ungated)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">P(chance >= detections)</text>
