[project]
name = "water-leaks"
version = "0.1.0"
description = "Leak detection on the BattLeDIM L-Town benchmark, scored against chance"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
figures = ["matplotlib"]
# steps 11 to 21 simulate with wntr (1.5.0 used); requirements.txt covers the tests only
experiments = ["scipy", "wntr==1.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
