[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-notests"
version = "0.1.0"
description = "Do agent runs that add no tests end partial more often or cost less? Stratified permutation tests"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
