<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" width="760" height="516" role="img" aria-label="Bar chart of the share of a new US home's price by cost item, NAHB 2024; largest: interior finishes 15.5%, finished lot 13.7%, plumbing, electrical, hvac rough-ins 12.4%, builder profit 11.0%, framing 10.7%">
<rect width="760" height="516" fill="#ffffff"/>
<style>text{font-family:system-ui,sans-serif;font-size:13px;fill:#222}</style>
<text x="16" y="24" style="font-size:16px;font-weight:600">Where a new US home's price goes (NAHB 2024 survey, avg $665,299)</text>
<text x="16" y="44" style="fill:#555">Blue: construction stages (64.4% of price). Orange: lot, builder costs and profit.</text>
<text x="292" y="72" text-anchor="end">Interior finishes</text>
<rect x="300" y="56" width="350.0" height="22" fill="#2f6f9f"/>
<text x="656.0" y="72">15.5% · $103k</text>
<text x="292" y="102" text-anchor="end">Finished lot</text>
<rect x="300" y="86" width="309.4" height="22" fill="#b5651d"/>
<text x="615.4" y="102">13.7% · $91k</text>
<text x="292" y="132" text-anchor="end">Plumbing, electrical, HVAC rough-ins</text>
<rect x="300" y="116" width="280.0" height="22" fill="#2f6f9f"/>
<text x="586.0" y="132">12.4% · $82k</text>
<text x="292" y="162" text-anchor="end">Builder profit</text>
<rect x="300" y="146" width="248.4" height="22" fill="#b5651d"/>
<text x="554.4" y="162">11.0% · $73k</text>
<text x="292" y="192" text-anchor="end">Framing</text>
<rect x="300" y="176" width="241.6" height="22" fill="#2f6f9f"/>
<text x="547.6" y="192">10.7% · $71k</text>
<text x="292" y="222" text-anchor="end">Exterior finishes</text>
<rect x="300" y="206" width="194.2" height="22" fill="#2f6f9f"/>
<text x="500.2" y="222">8.6% · $58k</text>
<text x="292" y="252" text-anchor="end">Foundations</text>
<rect x="300" y="236" width="151.3" height="22" fill="#2f6f9f"/>
<text x="457.3" y="252">6.7% · $45k</text>
<text x="292" y="282" text-anchor="end">Overhead</text>
<rect x="300" y="266" width="128.7" height="22" fill="#b5651d"/>
<text x="434.7" y="282">5.7% · $38k</text>
<text x="292" y="312" text-anchor="end">Site work (incl. permit, impact, water fees)</text>
<rect x="300" y="296" width="110.6" height="22" fill="#2f6f9f"/>
<text x="416.6" y="312">4.9% · $33k</text>
<text x="292" y="342" text-anchor="end">Final steps (landscaping, driveway, cleanup)</text>
<rect x="300" y="326" width="94.8" height="22" fill="#2f6f9f"/>
<text x="400.8" y="342">4.2% · $28k</text>
<text x="292" y="372" text-anchor="end">Sales commission</text>
<rect x="300" y="356" width="63.2" height="22" fill="#b5651d"/>
<text x="369.2" y="372">2.8% · $19k</text>
<text x="292" y="402" text-anchor="end">Financing</text>
<rect x="300" y="386" width="33.9" height="22" fill="#b5651d"/>
<text x="339.9" y="402">1.5% · $10k</text>
<text x="292" y="432" text-anchor="end">Other</text>
<rect x="300" y="416" width="29.4" height="22" fill="#2f6f9f"/>
<text x="335.4" y="432">1.3% · $9k</text>
<text x="292" y="462" text-anchor="end">Marketing</text>
<rect x="300" y="446" width="18.1" height="22" fill="#b5651d"/>
<text x="324.1" y="462">0.8% · $6k</text>
<text x="16" y="504" style="fill:#555;font-size:11px">Source: NAHB, Cost of Constructing a Home-2024. Survey of 41 builders; skews larger and dearer than the Census average.</text></svg>
