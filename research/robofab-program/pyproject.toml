[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-program"
version = "0.1.0"
description = "Checking session-written robot programs in a kinematic digital twin at three fidelity levels against a held-out reference twin"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
