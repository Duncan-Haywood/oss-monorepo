<polyline points="64.0,251.5 204.0,242.7 344.0,232.5 624.0,172.8" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="251.5" r="3" fill="#1f6fb2"/>
<circle cx="204.0" cy="242.7" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="232.5" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="172.8" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">sigma 0.3 m</text>
<polyline points="64.0,189.1 204.0,167.4 344.0,155.2 624.0,149.8" fill="none" stroke="#2e8b57" stroke-width="2"/>
