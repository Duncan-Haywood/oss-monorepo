<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: for a drone using the predictive planner at 0.1 people per square metre, contacts per hour against detection latency in seconds, one curve for each detection noise level">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Pedestrian contacts against detection latency, by detection noise</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="256.2" y2="256.2" stroke="#ddd"/><text x="58" y="260.2" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="188.4" y2="188.4" stroke="#ddd"/><text x="58" y="192.4" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="120.7" y2="120.7" stroke="#ddd"/><text x="58" y="124.7" text-anchor="end" font-family="sans-serif" font-size="11">300</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.25</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">detection latency (s)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">contacts per hour (within 0.5 m)</text>
<polyline points="64.0,293.5 204.0,284.7 344.0,260.3 624.0,216.9" fill="none" stroke="#c0392b" stroke-width="2"/>
