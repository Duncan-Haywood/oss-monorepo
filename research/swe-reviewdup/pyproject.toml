[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-reviewdup"
version = "0.1.0"
description = "Do parallel review sessions duplicate each other? Clusters of review-track pull requests merged within minutes, from git and the run records"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
