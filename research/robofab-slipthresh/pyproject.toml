[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-slipthresh"
version = "0.1.0"
description = "Does a rate-based holding criterion make a MuJoCo grasp verdict less dependent on solver settings than a rotation tolerance? (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
