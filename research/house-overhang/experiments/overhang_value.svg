<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the energy saved over 30 years by a south-window overhang against its projection: positive and rising in Miami, small and then negative in Chicago and Albuquerque">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Gross energy value of a south overhang (30-year NPC, gas + AC)</text>
<line x1="64" x2="624" y1="262.9" y2="262.9" stroke="#ddd"/><text x="58" y="266.9" text-anchor="end" font-family="sans-serif" font-size="11">-200</text>
<line x1="64" x2="624" y1="183.0" y2="183.0" stroke="#ddd"/><text x="58" y="187.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="103.1" y2="103.1" stroke="#ddd"/><text x="58" y="107.1" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="484.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">overhang projection (ft)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">NPC of energy saved ($)</text>
<polyline points="64.0,183.0 204.0,144.7 344.0,108.7 484.0,85.5 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="183.0" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="144.7" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="108.7" r="3" fill="#c0392b"/>
<circle cx="484.0" cy="85.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">Miami (1A)</text>
<polyline points="64.0,183.0 204.0,160.6 344.0,165.0 484.0,180.2 624.0,193.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="183.0" r="3" fill="#1f6fb2"/>
<circle cx="204.0" cy="160.6" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="165.0" r="3" fill="#1f6fb2"/>
<circle cx="484.0" cy="180.2" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="193.4" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">Houston (2A)</text>
<polyline points="64.0,183.0 204.0,155.0 344.0,205.4 484.0,260.1 624.0,324.0" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="183.0" r="3" fill="#2e8b57"/>
<circle cx="204.0" cy="155.0" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="205.4" r="3" fill="#2e8b57"/>
<circle cx="484.0" cy="260.1" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="324.0" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">Albuquerque (4B)</text>
<polyline points="64.0,183.0 204.0,178.2 344.0,193.0 484.0,213.8 624.0,232.9" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="183.0" r="3" fill="#8e44ad"/>
<circle cx="204.0" cy="178.2" r="3" fill="#8e44ad"/>
<circle cx="344.0" cy="193.0" r="3" fill="#8e44ad"/>
