[project]
name = "garment-assistloc"
version = "0.1.0"
description = "Stylised exosuit model: does moving the motor and battery from the shank to the waist pay?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../garment-assist/src", "../garment-assistpower/src"]
