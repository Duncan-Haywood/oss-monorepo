<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of net whole-body metabolic change in percent for a shank-mounted and a waist-mounted power train against the ratio of the per-kg penalty at the shank to that at the waist; the shank layout rises steeply">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Net whole-body change by where the power train sits</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="251.8" y2="251.8" stroke="#ddd"/><text x="58" y="255.8" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="179.5" y2="179.5" stroke="#ddd"/><text x="58" y="183.5" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="107.3" y2="107.3" stroke="#ddd"/><text x="58" y="111.3" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="144.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="224.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="384.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">shank/waist penalty ratio</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">net whole-body change (%, negative = saving)</text>
<polyline points="64.0,320.4 144.0,284.6 224.0,249.2 384.0,177.7 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="320.4" r="3" fill="#c0392b"/>
<circle cx="144.0" cy="284.6" r="3" fill="#c0392b"/>
<circle cx="224.0" cy="249.2" r="3" fill="#c0392b"/>
<circle cx="384.0" cy="177.7" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">shank layout</text>
<polyline points="64.0,318.6 144.0,315.3 224.0,312.1 384.0,305.6 624.0,295.8" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="318.6" r="3" fill="#1f6fb2"/>
<circle cx="144.0" cy="315.3" r="3" fill="#1f6fb2"/>
<circle cx="224.0" cy="312.1" r="3" fill="#1f6fb2"/>
<circle cx="384.0" cy="305.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="295.8" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">waist layout (Bowden)</text>
</svg>
