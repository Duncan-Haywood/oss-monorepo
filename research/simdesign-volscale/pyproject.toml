[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-volscale"
version = "0.1.0"
description = "How optimal compliance scales with volume fraction in SIMP topology optimisation, against a uniformly thinned plate"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
