[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-shrinkage"
version = "0.1.0"
description = "Shrinking a real-plant parameter estimate toward a digital twin's prediction: exact James-Stein risk, twin worth in real samples, and the single-coordinate hazard of a twin that never hurts in aggregate"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
