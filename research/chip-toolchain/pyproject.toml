[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-toolchain"
version = "0.1.0"
description = "Reproducible open RTL flow (Yosys, Icarus Verilog, Verilator) with synthesis area and depth for smoke designs"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
