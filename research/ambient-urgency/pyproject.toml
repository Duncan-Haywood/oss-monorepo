[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-urgency"
version = "0.1.0"
description = "Stylised model of urgency, deadlines and a chime-plus-glance mode for an always-on assistant"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
