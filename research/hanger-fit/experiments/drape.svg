<title id="t">Size-M tee draped on four hangers</title>
<desc id="d">Simulated shoulder line and sleeve (solid) over one hanger arm, against the worn shape (dashed). Thin-ended wire and plastic hangers fold the cloth at the tip; the custom hanger holds it close to the worn shape.</desc>
