<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the total carry time of six parts under a min-jerk trajectory and a time-optimal bang-bang one, for two link lengths, against the joint torque limit; time-optimal is faster at every point and carry time falls as the torque limit rises">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Six-part carry time: min-jerk vs time-optimal</text>
<line x1="64" x2="624" y1="293.6" y2="293.6" stroke="#ddd"/><text x="58" y="297.6" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="382.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">torque limit (N m)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">total carry time (s)</text>
<polyline points="64.0,187.1 382.8,236.5 624.0,272.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="187.1" r="3" fill="#c0392b"/>
<circle cx="382.8" cy="236.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="272.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">min-jerk, L=0.08 m</text>
<polyline points="64.0,222.5 382.8,272.4 624.0,309.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="222.5" r="3" fill="#1f6fb2"/>
<circle cx="382.8" cy="272.4" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="309.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">time-optimal, L=0.08 m</text>
<polyline points="64.0,70.4 382.8,118.4 624.0,153.8" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#2e8b57"/>
<circle cx="382.8" cy="118.4" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="153.8" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">min-jerk, L=0.2 m</text>
<polyline points="64.0,95.2 382.8,142.9 624.0,178.8" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="95.2" r="3" fill="#8e44ad"/>
<circle cx="382.8" cy="142.9" r="3" fill="#8e44ad"/>
<circle cx="624.0" cy="178.8" r="3" fill="#8e44ad"/>
<rect x="574" y="32" width="14" height="10" fill="#8e44ad"/><text x="594" y="41" font-family="sans-serif" font-size="11">time-optimal, L=0.2 m</text>
</svg>
