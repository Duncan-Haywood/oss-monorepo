<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-label="Line plot of the total carry time of six parts under a min-jerk trajectory and a time-optimal bang-bang one, for two link lengths, against the joint torque limit; time-optimal is faster at every point and carry time falls as the torque limit rises">
<rect width="640" height="394" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Six-part carry time: min-jerk vs time-optimal</text>
<line x1="64" x2="624" y1="307.6" y2="307.6" stroke="#ddd"/><text x="58" y="311.6" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="233.8" y2="233.8" stroke="#ddd"/><text x="58" y="237.8" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="136.3" y2="136.3" stroke="#ddd"/><text x="58" y="140.3" text-anchor="end" font-family="sans-serif" font-size="11">0.5</text>
<text x="64.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="382.8" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="624.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="344.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="12">torque limit (N m)</text>
<text x="14" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 204.0)">total carry time (s)</text>
<polyline points="64.0,201.1 382.8,250.5 624.0,286.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="201.1" r="3" fill="#c0392b"/>
<circle cx="382.8" cy="250.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="286.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">min-jerk, L=0.08 m</text>
<polyline points="64.0,236.5 382.8,286.4 624.0,323.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="236.5" r="3" fill="#1f6fb2"/>
<circle cx="382.8" cy="286.4" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="323.6" r="3" fill="#1f6fb2"/>
<rect x="209.6" y="32" width="14" height="10" fill="#1f6fb2"/><text x="229.6" y="41" font-family="sans-serif" font-size="11">time-optimal, L=0.08 m</text>
<polyline points="64.0,84.4 382.8,132.4 624.0,167.8" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="84.4" r="3" fill="#2e8b57"/>
<circle cx="382.8" cy="132.4" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="167.8" r="3" fill="#2e8b57"/>
<rect x="380" y="32" width="14" height="10" fill="#2e8b57"/><text x="400" y="41" font-family="sans-serif" font-size="11">min-jerk, L=0.2 m</text>
<polyline points="64.0,109.2 382.8,156.9 624.0,192.8" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="109.2" r="3" fill="#8e44ad"/>
<circle cx="382.8" cy="156.9" r="3" fill="#8e44ad"/>
<circle cx="624.0" cy="192.8" r="3" fill="#8e44ad"/>
<rect x="64" y="46" width="14" height="10" fill="#8e44ad"/><text x="84" y="55" font-family="sans-serif" font-size="11">time-optimal, L=0.2 m</text>
