[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-hull"
version = "0.1.0"
description = "Hull resistance and endurance calculator for small autonomous survey boats (marine-hull programme)"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
