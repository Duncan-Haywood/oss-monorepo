[project]
name = "garment-protective"
version = "0.1.0"
description = "Cunniff-style specific-toughness scaling for protective textile weight, cost and stiffness"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
