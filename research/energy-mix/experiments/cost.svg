<circle cx="567.8" cy="137.4" r="3" fill="#c0392b"/>
<circle cx="595.9" cy="117.8" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">system cost</text>
</svg>
