<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: cost per MWh of a least-cost solar, wind, gas and storage system rises slowly to a 50% cut, then steeply, reaching about 2.2 times the gas-only cost at a 100% cut">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Least-cost system: $/MWh against emissions cut (Germany 2019 hourly)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="252.6" y2="252.6" stroke="#ddd"/><text x="58" y="256.6" text-anchor="end" font-family="sans-serif" font-size="11">50</text>
<line x1="64" x2="624" y1="181.2" y2="181.2" stroke="#ddd"/><text x="58" y="185.2" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="109.8" y2="109.8" stroke="#ddd"/><text x="58" y="113.8" text-anchor="end" font-family="sans-serif" font-size="11">150</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.3</text>
<text x="343.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">50</text>
<text x="511.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">80</text>
<text x="567.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">90</text>
<text x="595.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">95</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">emissions cut vs all-gas (%)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">$/MWh (assumed costs)</text>
<polyline points="64.0,210.9 343.2,202.9 511.7,163.2 567.8,137.4 595.9,117.8 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
