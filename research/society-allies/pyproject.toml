[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-allies"
version = "0.1.0"
description = "Allies placed together: how large a block of committed robots a ring crowd can take before the passing-side convention stops tipping"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
