[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-bootstrap"
version = "0.1.0"
description = "Can a printed gripper assemble the next generation? A stylised bootstrapping-chain model with fixed-size jaw pads"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
