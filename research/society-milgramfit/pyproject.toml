[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-milgramfit"
version = "0.1.0"
description = "Does the observed rate of objection to line-cutting (Milgram et al. 1986) keep a queueing norm in the society-enforcers model"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
