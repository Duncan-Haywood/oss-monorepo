[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-evaluation"
version = "0.1.0"
description = "Evaluating a robot policy with a biased digital twin plus few real rollouts: control-variate estimator, exact variance, cost-optimal allocation, and why a noise-free twin can beat a faithful one"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
