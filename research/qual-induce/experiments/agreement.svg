<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: normalised mutual information between an induced code assignment and the human primary emotion, for NMF topics and k-means with 5 to 60 codes, and for a random assignment of the same sizes; both induced methods sit above chance, but the gap is about 0.1 to 0.15">
