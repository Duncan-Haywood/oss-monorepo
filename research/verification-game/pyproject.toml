[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verification-game"
version = "0.1.0"
description = "Inspection-game economics of refereed (optimistic) verification for decentralised ML training"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
