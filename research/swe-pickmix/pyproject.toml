[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-pickmix"
version = "0.1.0"
description = "Measured track-pick mix and same-track concurrency of agent runs, from git history"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
