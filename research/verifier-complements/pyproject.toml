[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier-complements"
version = "0.1.0"
description = "Value of verifier information for accept/slash decisions: complements, substitutes, and marginal-contribution pay"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
