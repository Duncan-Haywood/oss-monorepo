[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smooth-twin"
version = "0.1.0"
description = "Training through a smoothed (differentiable) twin of a hard contact event: exact overshoot bias, gradient-trap threshold, annealing, and smoothing as an uncontrolled safety margin"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
