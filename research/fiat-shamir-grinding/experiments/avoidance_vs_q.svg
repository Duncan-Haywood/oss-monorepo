<line x1="64" x2="624" y1="282.2" y2="282.2" stroke="#ddd"/><text x="58" y="286.2" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="163.4" y2="163.4" stroke="#ddd"/><text x="58" y="167.4" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">50</text>
<text x="144.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="304.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">200</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">400</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">samples q</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">avoidance probability</text>
<polyline points="64.0,71.1 144.0,99.2 304.0,160.3 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
