<polyline points="64.0,70.4 144.0,96.2 304.0,147.7 624.0,250.9" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#2e8b57"/>
<circle cx="144.0" cy="96.2" r="3" fill="#2e8b57"/>
<circle cx="304.0" cy="147.7" r="3" fill="#2e8b57"/>
