<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the probability that q grinding samples all avoid the bad set, against q: the exact value falls below the with-replacement and exponential approximations">
<rect width="640" height="380" fill="#fff"/>
