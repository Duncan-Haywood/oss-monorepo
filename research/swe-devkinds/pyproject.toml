[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-devkinds"
version = "0.1.0"
description = "Which kind of recorded deviation predicts a partial outcome? Keyword classes with track-stratified permutation tests"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
