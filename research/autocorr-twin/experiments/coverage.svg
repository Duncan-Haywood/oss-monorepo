<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Realised coverage of a nominal 95 percent interval for the true mean wait: the naive interval covers far less, the batch-means interval is close to nominal at moderate load">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Coverage of a nominal 95% interval from one M/M/1 run (stylised simulation)</text>
<line x1="64" x2="624" y1="328.0" y2="328.0" stroke="#ddd"/><text x="58" y="332.0" text-anchor="end" font-family="sans-serif" font-size="11">0.00</text>
<line x1="64" x2="624" y1="256.0" y2="256.0" stroke="#ddd"/><text x="58" y="260.0" text-anchor="end" font-family="sans-serif" font-size="11">0.25</text>
<line x1="64" x2="624" y1="184.0" y2="184.0" stroke="#ddd"/><text x="58" y="188.0" text-anchor="end" font-family="sans-serif" font-size="11">0.50</text>
<line x1="64" x2="624" y1="112.0" y2="112.0" stroke="#ddd"/><text x="58" y="116.0" text-anchor="end" font-family="sans-serif" font-size="11">0.75</text>
<line x1="64" x2="624" y1="40.0" y2="40.0" stroke="#ddd"/><text x="58" y="44.0" text-anchor="end" font-family="sans-serif" font-size="11">1.00</text>
<text x="157.3" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.7</text>
<text x="530.7" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.9</text>
<line x1="64" x2="624" y1="54.4" y2="54.4" stroke="#888" stroke-dasharray="4 3"/><text x="620" y="50.4" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555">nominal 0.95</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">traffic intensity rho</text>
<text x="14" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 184.0)">realised coverage</text>
<polyline fill="none" stroke="#c0392b" stroke-width="2" points="157.3,175.1 344.0,252.3 530.7,302.7"/>
<circle cx="157.3" cy="175.1" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="252.3" r="3" fill="#c0392b"/>
<circle cx="530.7" cy="302.7" r="3" fill="#c0392b"/>
<line x1="390" x2="414" y1="74" y2="74" stroke="#c0392b" stroke-width="2"/><text x="420" y="78" font-family="sans-serif" font-size="11">naive (iid) interval</text>
<polyline fill="none" stroke="#1f6fb2" stroke-width="2" points="157.3,55.3 344.0,58.1 530.7,90.4"/>
<circle cx="157.3" cy="55.3" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="58.1" r="3" fill="#1f6fb2"/>
<circle cx="530.7" cy="90.4" r="3" fill="#1f6fb2"/>
<line x1="390" x2="414" y1="90" y2="90" stroke="#1f6fb2" stroke-width="2"/><text x="420" y="94" font-family="sans-serif" font-size="11">batch means (30 batches)</text>
</svg>
