[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autocorr-twin"
version = "0.1.0"
description = "Confidence intervals from one long digital-twin run: exact variance inflation for autocorrelated output (AR(1) and M/M/1 waits), naive-interval coverage, false SLA certification, and batch-means repair"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
