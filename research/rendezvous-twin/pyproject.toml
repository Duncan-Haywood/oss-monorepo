[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rendezvous-twin"
version = "0.1.0"
description = "Rendezvous interval of a multi-robot mapping team planned in a white-noise odometry twin: closed-form real-drift optimum with a slowly varying bias, error-budget violation, shared-bias relative frames, and a two-lag fitting repair"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
