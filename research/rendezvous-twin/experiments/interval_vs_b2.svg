<polyline points="64.0,90.6 102.6,117.0 237.8,163.3 624.0,209.9" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="90.6" r="3" fill="#1f6fb2"/>
<circle cx="102.6" cy="117.0" r="3" fill="#1f6fb2"/>
<circle cx="237.8" cy="163.3" r="3" fill="#1f6fb2"/>
