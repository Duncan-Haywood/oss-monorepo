<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="102.6" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.03</text>
<text x="237.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.3</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">b2 (bias-rate variance)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">interval between rendezvous</text>
<polyline points="64.0,71.2 102.6,71.2 237.8,71.2 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
