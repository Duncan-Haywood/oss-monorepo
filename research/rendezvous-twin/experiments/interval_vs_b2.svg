<line x1="64" x2="624" y1="211.6" y2="211.6" stroke="#ddd"/><text x="58" y="215.6" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
<line x1="64" x2="624" y1="155.4" y2="155.4" stroke="#ddd"/><text x="58" y="159.4" text-anchor="end" font-family="sans-serif" font-size="11">6</text>
