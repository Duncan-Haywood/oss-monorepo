<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot against bias variance rate b2 from 0.01 to 0.3; the twin interval stays at 9.0 while the real interval needed falls from 8.31 to 4.06">
