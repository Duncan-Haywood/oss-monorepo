[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-morph"
version = "0.1.0"
description = "Does co-designing a planar arm's link lengths and controller beat tuning the controller on a fixed off-the-shelf body, at the same material budget? A stylised dynamics study"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
