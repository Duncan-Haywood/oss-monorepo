[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgetting-law"
version = "0.1.0"
description = "Exact expected catastrophic forgetting for sequential training on random low-rank tasks, and what modular routing buys"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
