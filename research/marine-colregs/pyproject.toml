[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-colregs"
version = "0.1.0"
description = "COLREGs-aware collision avoidance for a small surface boat: rule-based, velocity obstacle and sampling MPC"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
