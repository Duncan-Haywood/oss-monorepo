[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-noisyaudit"
version = "0.1.0"
description = "Stylised: what a noisy auditor does to an assistant that learns a noisy urgency label from audits"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
