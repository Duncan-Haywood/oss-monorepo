<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Grouped bars of marker efficiency for a shirt and a skirt at 0, 1 and 1.5 cm seam allowance: shirt efficiency falls from 0.69 to about 0.63 and skirt from 0.71 to about 0.5 once a seam allowance is added">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Garment marker cost: efficiency vs seam allowance</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="257.0" y2="257.0" stroke="#ddd"/><text x="58" y="261.0" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="190.0" y2="190.0" stroke="#ddd"/><text x="58" y="194.0" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="123.0" y2="123.0" stroke="#ddd"/><text x="58" y="127.0" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="56.0" y2="56.0" stroke="#ddd"/><text x="58" y="60.0" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<rect x="82.7" y="92.2" width="72.7" height="231.8" fill="#c0392b"/>
<rect x="157.3" y="87.2" width="72.7" height="236.8" fill="#1f6fb2"/>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.0 cm allowance</text>
<rect x="269.3" y="112.6" width="72.7" height="211.4" fill="#c0392b"/>
<rect x="344.0" y="153.8" width="72.7" height="170.2" fill="#1f6fb2"/>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.0 cm allowance</text>
<rect x="456.0" y="109.6" width="72.7" height="214.4" fill="#c0392b"/>
<rect x="530.7" y="159.5" width="72.7" height="164.5" fill="#1f6fb2"/>
<text x="530.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.5 cm allowance</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">marker efficiency</text>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">shirt</text>
<rect x="194" y="32" width="14" height="10" fill="#1f6fb2"/><text x="214" y="41" font-family="sans-serif" font-size="11">skirt</text>
</svg>
