[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friction-twin"
version = "0.1.0"
description = "Coulomb friction a viscous twin lacks: a twin that never stops, exact stopping distance, fitted-gain bias, crossover speed and minimax repair"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
