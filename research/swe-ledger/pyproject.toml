[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-ledger"
version = "0.1.0"
description = "What can the run log measure about the agent loop today? Coverage, per-track throughput proxies and follow-up concentration from prompts/runs.jsonl"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
