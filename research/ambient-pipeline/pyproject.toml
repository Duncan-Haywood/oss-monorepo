[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-pipeline"
version = "0.1.0"
description = "Streaming VAD -> ASR -> LLM -> TTS pipeline on a CPU: per-stage latency, real-time factor, memory and a reply-latency budget"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
# Only needed to re-run experiments/run.py; the unit tests need numpy only.
models = ["faster-whisper", "silero-vad-lite", "llama-cpp-python", "piper-tts", "psutil"]

[tool.setuptools.packages.find]
where = ["src"]
