[project]
name = "infra-leakpdd"
version = "0.1.0"
description = "When does demand-driven simulation mislead leak detection? Net3 with pressure-driven demand in WNTR, swept over demand level"
requires-python = ">=3.9"
dependencies = ["numpy", "wntr"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
