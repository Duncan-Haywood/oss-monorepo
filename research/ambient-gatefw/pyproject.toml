[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-gatefw"
version = "0.1.0"
description = "C port of the noise-adaptive energy gate for an always-on audio pendant: exactness, RAM and comparison cost of an exact and a block-minimum noise floor, checked against the Python reference"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
