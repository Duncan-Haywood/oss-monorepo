[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expert-pooling"
version = "0.1.0"
description = "Pooling calibrated modular experts with shared training data: closed-form extremization, saturation, robustness"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
