[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-repair-baseline"
version = "0.1.0"
description = "Feedback loop for RTL generation: lint, simulation and formal checks, with a no-model baseline"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
