<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of excess cost against the drift rate qd on a log axis for the closed-form optimum, the idealised integer optimum, the full model and the closed-form schedule run in the full model: excess cost falls as drift gets slower, and the formula tracks the integer optimum closely">
