[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanger-print"
version = "0.1.0"
description = "Printable parametric hangers for a laundry-hanging robot: hanger-fit's designs as STL and OpenSCAD with a beam strength, deflection and print-bed check"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
