[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-doorway"
version = "0.1.0"
description = "Who yields at a door: people learn from remembered partners in a go-or-yield game with robots that always yield, always go or mix; mean field against simulation"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
