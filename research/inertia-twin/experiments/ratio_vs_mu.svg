<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the frictionless twin acceleration over the real disc acceleration against friction mu: 1.0 at mu=0 rising to 1.5 once the disc rolls at mu about 0.19">
