[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-cutheadroom"
version = "0.1.0"
description = "How many gates could an exact 4-input rewriter remove from real Yosys/ABC netlists?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
