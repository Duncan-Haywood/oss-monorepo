[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "score-recalibration"
version = "0.1.0"
description = "Paying verifiers for resolution, not calibration: exact miscalibration overpayment under Brier and log score, ranking reversals, and the finite-sample cost of recalibrating"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
