<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: the installed battery price in dollars per kWh at which a home battery just pays on an assumed time-of-use tariff, for an optimal dispatch with perfect foresight, a fixed peak-discharge rule, and a flat tariff, falling as the battery grows">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Home battery: break-even price, optimiser vs fixed rule (6 kW PV)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="265.8" y2="265.8" stroke="#ddd"/><text x="58" y="269.8" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="207.6" y2="207.6" stroke="#ddd"/><text x="58" y="211.6" text-anchor="end" font-family="sans-serif" font-size="11">400</text>
<line x1="64" x2="624" y1="149.4" y2="149.4" stroke="#ddd"/><text x="58" y="153.4" text-anchor="end" font-family="sans-serif" font-size="11">600</text>
<line x1="64" x2="624" y1="91.2" y2="91.2" stroke="#ddd"/><text x="58" y="95.2" text-anchor="end" font-family="sans-serif" font-size="11">800</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2.5</text>
<text x="144.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="304.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="464.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">15</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">battery nameplate kWh</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">break-even $/kWh (life-limited)</text>
<polyline points="64.0,84.8 144.0,89.8 304.0,127.9 464.0,176.8 624.0,208.5" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="84.8" r="3" fill="#c0392b"/>
<circle cx="144.0" cy="89.8" r="3" fill="#c0392b"/>
<circle cx="304.0" cy="127.9" r="3" fill="#c0392b"/>
<circle cx="464.0" cy="176.8" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="208.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">optimal dispatch (LP, perfect foresight)</text>
<polyline points="64.0,75.2 144.0,71.2 304.0,108.1 464.0,145.4 624.0,188.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="75.2" r="3" fill="#1f6fb2"/>
<circle cx="144.0" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="304.0" cy="108.1" r="3" fill="#1f6fb2"/>
<circle cx="464.0" cy="145.4" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="188.1" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">fixed rule (energy-tou)</text>
<polyline points="64.0,162.8 144.0,173.9 304.0,194.8 464.0,223.9 624.0,245.7" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="162.8" r="3" fill="#2e8b57"/>
<circle cx="144.0" cy="173.9" r="3" fill="#2e8b57"/>
<circle cx="304.0" cy="194.8" r="3" fill="#2e8b57"/>
<circle cx="464.0" cy="223.9" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="245.7" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">flat tariff, greedy</text>
</svg>
