<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-label="Line plot: the installed battery price in dollars per kWh at which a home battery just pays on an assumed time-of-use tariff, for an optimal dispatch with perfect foresight, a fixed peak-discharge rule, and a flat tariff, falling as the battery grows">
<rect width="640" height="394" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Home battery: break-even price, optimiser vs fixed rule (6 kW PV)</text>
<line x1="64" x2="624" y1="338.0" y2="338.0" stroke="#ddd"/><text x="58" y="342.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="279.8" y2="279.8" stroke="#ddd"/><text x="58" y="283.8" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="221.6" y2="221.6" stroke="#ddd"/><text x="58" y="225.6" text-anchor="end" font-family="sans-serif" font-size="11">400</text>
<line x1="64" x2="624" y1="163.4" y2="163.4" stroke="#ddd"/><text x="58" y="167.4" text-anchor="end" font-family="sans-serif" font-size="11">600</text>
<line x1="64" x2="624" y1="105.2" y2="105.2" stroke="#ddd"/><text x="58" y="109.2" text-anchor="end" font-family="sans-serif" font-size="11">800</text>
<text x="64.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">2.5</text>
<text x="144.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="304.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="464.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">15</text>
<text x="624.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="344.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="12">battery nameplate kWh</text>
<text x="14" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 204.0)">break-even $/kWh (life-limited)</text>
<polyline points="64.0,98.8 144.0,103.8 304.0,141.9 464.0,190.8 624.0,222.5" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="98.8" r="3" fill="#c0392b"/>
<circle cx="144.0" cy="103.8" r="3" fill="#c0392b"/>
<circle cx="304.0" cy="141.9" r="3" fill="#c0392b"/>
<circle cx="464.0" cy="190.8" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="222.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">optimal dispatch (LP, perfect foresight)</text>
<polyline points="64.0,89.2 144.0,85.2 304.0,122.1 464.0,159.4 624.0,202.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="89.2" r="3" fill="#1f6fb2"/>
<circle cx="144.0" cy="85.2" r="3" fill="#1f6fb2"/>
<circle cx="304.0" cy="122.1" r="3" fill="#1f6fb2"/>
<circle cx="464.0" cy="159.4" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="202.1" r="3" fill="#1f6fb2"/>
<rect x="346" y="32" width="14" height="10" fill="#1f6fb2"/><text x="366" y="41" font-family="sans-serif" font-size="11">fixed rule (energy-tou)</text>
<polyline points="64.0,176.8 144.0,187.9 304.0,208.8 464.0,237.9 624.0,259.7" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="176.8" r="3" fill="#2e8b57"/>
<circle cx="144.0" cy="187.9" r="3" fill="#2e8b57"/>
<circle cx="304.0" cy="208.8" r="3" fill="#2e8b57"/>
<circle cx="464.0" cy="237.9" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="259.7" r="3" fill="#2e8b57"/>
<rect x="64" y="46" width="14" height="10" fill="#2e8b57"/><text x="84" y="55" font-family="sans-serif" font-size="11">flat tariff, greedy</text>
