<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the closed-form best noise variance against kappa times a; it rises from 3 at 0.5 to 239 at 0.99, and at 1.0 and above the rule says stay out">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Best noise to add blows up as kappa*a nears 1</text>
<line x1="64" x2="624" y1="248.2" y2="248.2" stroke="#ddd"/><text x="58" y="252.2" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="119.2" y2="119.2" stroke="#ddd"/><text x="58" y="123.2" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="545.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.9</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.99</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">kappa * a (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">closed-form best noise (log scale)</text>
<polyline points="64.0,309.6 545.9,202.5 624.0,70.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="545.9" cy="202.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="70.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">closed-form noise</text>
</svg>
