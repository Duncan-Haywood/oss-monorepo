[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-sandwich"
version = "0.1.0"
description = "Sandwich attacks on LMSR verification markets: exact extraction equals the victim's slippage tolerance, capital and fee thresholds, optimal tolerance, and what batching does and does not fix"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
