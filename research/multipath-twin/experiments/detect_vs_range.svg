<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the probability that a two-ray radar detects a target against range in units of the free-space range, falling from 0.77 at 0.71 to 0 at 2.0, where the free-space twin says certain detection to 1.0 and none beyond">
