<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.707</text>
<text x="190.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="370.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.414</text>
<text x="527.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.778</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">range / free-space range</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">P(detect)</text>
