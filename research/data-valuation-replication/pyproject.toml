[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-valuation-replication"
version = "0.1.0"
description = "Replication attacks on Shapley and leave-one-out contribution payments: exact group payoff, the stand-alone-value limit, and the correlation dial"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
