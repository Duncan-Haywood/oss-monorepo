[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-ghost"
version = "0.1.0"
description = "Burst merging with a moving subject: ghosting of a plain mean merge, median, sigma-clip and reference-guided robust merges, and what each costs in noise efficiency"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
