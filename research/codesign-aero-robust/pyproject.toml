[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesign-aero-robust"
version = "0.1.0"
description = "Does the best airframe-plus-controller design survive widened plant randomisation (motor strength, mass, motor lag)? A robustness test of codesign-aero."
requires-python = ">=3.9"
dependencies = ["numpy", "cma", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
