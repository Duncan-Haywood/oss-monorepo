<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">24</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">28</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">room temperature (C)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">mean |tsk - 33.7| (C)</text>
