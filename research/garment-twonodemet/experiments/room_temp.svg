<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">fixed open</text>
<polyline points="64.0,170.8 344.0,264.2 624.0,269.3" fill="none" stroke="#2e8b57" stroke-width="2"/>
