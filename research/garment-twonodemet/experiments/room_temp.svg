<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of mean skin-temperature error after a rest-to-walk step against room temperature for fixed closed, fixed open, a thermostat gate and the oracle; the gate beats both fixed states only at 24 C">
