[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-uavvalue"
version = "0.1.0"
description = "Value-optimal airframe wind limit and launch threshold for an observation UAV with forecast error: extends osrobot-uavnogo (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
