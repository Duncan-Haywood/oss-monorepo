[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-cell-cv"
version = "0.1.0"
description = "Where does a queueing model of a print-and-inspect cell stop working? A coefficient-of-variation sweep and a measured printer stall share"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
