[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-pnr"
version = "0.1.0"
description = "Synthesis-only versus placed-and-routed PPA on SKY130 with Yosys and OpenROAD"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
