[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-semend"
version = "0.1.0"
description = "Does a sentence-completeness cue let an always-on assistant shorten its end-of-speech hangover? Two-hangover endpointing under a stylised cue and pause model"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
