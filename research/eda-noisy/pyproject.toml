[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-noisy"
version = "0.1.0"
description = "How much error in the cheap objective rung can design-search proposers tolerate before they stop beating random search?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
