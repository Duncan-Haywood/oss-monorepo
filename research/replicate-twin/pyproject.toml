[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "replicate-twin"
version = "0.1.0"
description = "One long twin run or many replications of a fixed simulation budget: exact MSE and exact t-interval coverage under an initial transient, MSE-optimal deletion undercovers, r=1 minimises MSE but replication buys a valid interval"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
