[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-costpermerge"
version = "0.1.0"
description = "What does an agent run cost per merged pull request? Joins priced run records to main's merge history, by track"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
