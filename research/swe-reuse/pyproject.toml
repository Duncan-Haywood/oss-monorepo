[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-reuse"
version = "0.1.0"
description = "Do later research projects build on earlier ones? A reference graph of the portfolio's READMEs."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
