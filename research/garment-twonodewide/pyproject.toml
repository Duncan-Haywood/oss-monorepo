[project]
name = "garment-twonodewide"
version = "0.1.0"
description = "Is the outside-room reversal of the proportional infrared gate a training-range artefact? Retune both gates on a wider set of rooms"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
