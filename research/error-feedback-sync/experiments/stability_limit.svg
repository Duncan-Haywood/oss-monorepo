<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the largest stable step against worker count for compression rate 0.25; error feedback rises from 0.29 to 13.4 while the unbiased scheme saturates near 2">
