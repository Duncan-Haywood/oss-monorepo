[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-callcost"
version = "0.1.0"
description = "How well does a run's tool-call count predict its cost? Log-log fits with cross-validation"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
