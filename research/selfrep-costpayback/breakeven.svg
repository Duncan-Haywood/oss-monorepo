<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the filament price per kilogram at which the shredder and extruder repay their cost in 10, 20 and 50 copies, with a dashed line at the 20 per kilogram base assumption: the price must be about 42 for 50 copies, 138 for 20 and 573 for 10, all above the base assumption">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Selfrep-costpayback: break-even filament price</text>
<line x1="64" x2="624" y1="194.8" y2="194.8" stroke="#ddd"/><text x="58" y="198.8" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="305.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">50</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">payback target N (copies)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">break-even filament price (per kg)</text>
<line x1="64" x2="624" y1="309.6" y2="309.6" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,70.4 305.2,171.8 624.0,256.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="305.2" cy="171.8" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="256.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">break-even price</text>
</svg>
