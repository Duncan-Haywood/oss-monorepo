<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" width="640" height="282" font-family="system-ui,sans-serif" font-size="13" role="img" aria-label="Equirect width needed per lens against an 8K 360 camera">
<rect width="640" height="282" fill="#fff"/>
<text x="120" y="22" font-size="15" font-weight="600">Equirect width a 360 camera needs to crop natively</text>
<text x="120" y="40" fill="#555">into a 1080x1920 vertical reel, by full-frame-equivalent focal length</text>
<text x="110" y="75" text-anchor="end">16 mm eq</text>
<rect x="120" y="61" width="49.4" height="20" fill="#8f5b2e"/>
<text x="175.4" y="75" fill="#333">5,119 px</text>
<text x="110" y="105" text-anchor="end">24 mm eq</text>
<rect x="120" y="91" width="74.1" height="20" fill="#8f5b2e"/>
<text x="200.1" y="105" fill="#333">7,678 px</text>
<text x="110" y="135" text-anchor="end">35 mm eq</text>
<rect x="120" y="121" width="108.0" height="20" fill="#c2255c"/>
<text x="234.0" y="135" fill="#333">11,197 px</text>
<text x="110" y="165" text-anchor="end">50 mm eq</text>
<rect x="120" y="151" width="154.3" height="20" fill="#c2255c"/>
<text x="280.3" y="165" fill="#333">15,995 px</text>
<text x="110" y="195" text-anchor="end">85 mm eq</text>
<rect x="120" y="181" width="262.3" height="20" fill="#c2255c"/>
<text x="388.3" y="195" fill="#333">27,192 px</text>
<text x="110" y="225" text-anchor="end">135 mm eq</text>
<rect x="120" y="211" width="416.7" height="20" fill="#c2255c"/>
<text x="542.7" y="225" fill="#333">43,187 px</text>
<line x1="194.1" y1="52" x2="194.1" y2="240" stroke="#222" stroke-dasharray="4 3"/>
<text x="198.1" y="256" fill="#222">8K (7,680 px): native up to 24 mm eq</text>
<text x="120" y="274" fill="#555" font-size="11">Upper bound: lens sharpness, stitching and compression resolve less.</text>
</svg>
