[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-allyrecent"
version = "0.1.0"
description = "Allies who fade by what they saw in their last k partners: how much does ally memory matter?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
