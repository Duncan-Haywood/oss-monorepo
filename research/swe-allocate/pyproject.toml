[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-allocate"
version = "0.1.0"
description = "Offline comparison of track-allocation policies (uniform, greedy, Thompson, knapsack-UCB) on the run ledger"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
