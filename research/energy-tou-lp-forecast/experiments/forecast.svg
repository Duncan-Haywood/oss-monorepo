<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: break-even installed battery price in dollars per kWh against battery size for a fixed peak-discharge rule, a rolling optimiser fed a seven-day-mean forecast, one fed yesterday's weather, and one with a perfect forecast; the two realistic forecasts fall close to the fixed rule, far below the perfect forecast">
