[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-weedsrc"
version = "0.1.0"
description = "Does the multi-pass laser-weeding result survive a detector fitted to published field detection rates?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
