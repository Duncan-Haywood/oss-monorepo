[project]
name = "capture-residgate"
version = "0.1.0"
description = "Does trimming sync windows by their residual from the fitted clock line, with no tuned threshold, beat the PSR gate on real audio?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../capture-syncgate/src", "../capture-realedit/src", "../capture-syncedit/src", "../capture-realaudio/src", "../capture-audiosync/src", "../capture-edit/src"]
