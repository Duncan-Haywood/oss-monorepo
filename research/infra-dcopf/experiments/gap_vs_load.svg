<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot against load level: the DC OPF reports a cost 2 to 3 percent below the AC optimum, and its dispatch costs 0.7 to 1.9 percent more than the AC optimum once losses are paid">
