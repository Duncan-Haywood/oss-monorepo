<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.8</text>
<text x="512.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">load (multiple of the case)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">% of AC optimal cost</text>
<polyline points="64.0,271.0 288.0,311.3 512.0,324.0 624.0,304.7" fill="none" stroke="#c0392b" stroke-width="2"/>
