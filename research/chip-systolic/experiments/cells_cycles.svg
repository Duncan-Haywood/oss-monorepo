<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="279.9" y2="279.9" stroke="#ddd"/><text x="58" y="283.9" text-anchor="end" font-family="sans-serif" font-size="11">200000</text>
