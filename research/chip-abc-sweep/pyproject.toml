[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-abc-sweep"
version = "0.1.0"
description = "Sweep of the ABC synthesis script on small arithmetic RTL: script versus written structure"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
