[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-check-slashing"
version = "0.1.0"
description = "Sampled audits of committed training traces under flat, proportional and capped slashing"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
