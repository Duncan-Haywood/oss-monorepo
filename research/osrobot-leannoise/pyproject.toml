[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-leannoise"
version = "0.1.0"
description = "Does a noisy or late anticipation by the person fed still let a blind feeding arm do without a camera? (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
