[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-duel"
version = "0.1.0"
description = "Anytime-valid duels between two verifiers scored on the same tasks: the optimal betting e-process grows at exactly KL(q||pi), peeking t-tests inflate false positives, mixtures cost a bounded delay"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
