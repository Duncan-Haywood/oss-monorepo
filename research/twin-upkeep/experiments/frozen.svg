<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the closed-loop regret of a twin whose calibration is never updated, against the number of steps since its last sync, with the regret of a continually tracking twin as a dashed line: the frozen twin regret rises slowly, about 23 percent above the tracker after 100 steps">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Twin-upkeep: regret of a frozen twin</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="279.3" y2="279.3" stroke="#ddd"/><text x="58" y="283.3" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<line x1="64" x2="624" y1="234.7" y2="234.7" stroke="#ddd"/><text x="58" y="238.7" text-anchor="end" font-family="sans-serif" font-size="11">0.002</text>
<line x1="64" x2="624" y1="190.0" y2="190.0" stroke="#ddd"/><text x="58" y="194.0" text-anchor="end" font-family="sans-serif" font-size="11">0.003</text>
<line x1="64" x2="624" y1="145.3" y2="145.3" stroke="#ddd"/><text x="58" y="149.3" text-anchor="end" font-family="sans-serif" font-size="11">0.004</text>
<line x1="64" x2="624" y1="100.7" y2="100.7" stroke="#ddd"/><text x="58" y="104.7" text-anchor="end" font-family="sans-serif" font-size="11">0.005</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="69.6" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="92.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">25</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">500</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">steps since sync</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">regret</text>
<line x1="64" x2="624" y1="124.3" y2="124.3" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,125.2 65.1,124.3 69.6,120.3 75.2,115.4 92.0,103.8 120.0,91.3 176.0,78.8 288.0,72.5 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="125.2" r="3" fill="#c0392b"/>
<circle cx="65.1" cy="124.3" r="3" fill="#c0392b"/>
<circle cx="69.6" cy="120.3" r="3" fill="#c0392b"/>
<circle cx="75.2" cy="115.4" r="3" fill="#c0392b"/>
<circle cx="92.0" cy="103.8" r="3" fill="#c0392b"/>
<circle cx="120.0" cy="91.3" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="78.8" r="3" fill="#c0392b"/>
<circle cx="288.0" cy="72.5" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">frozen twin</text>
