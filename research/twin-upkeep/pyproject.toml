[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-upkeep"
version = "0.1.0"
description = "Keeping a digital twin in sync with a drifting physical plant: closed-form steady-state tracking error of a Kalman twin, its control regret, and the optimal excitation (dither) budget"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
