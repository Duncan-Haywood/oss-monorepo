[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-uptime"
version = "0.1.0"
description = "What does a shared robot cost once it must stay up? Spares and availability on top of osrobot-reconfig"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
