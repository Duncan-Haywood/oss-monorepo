<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the median cost of the cheapest shared fleet relative to a robot per job, against unit availability, with no spares, with spares per job, and with spares so every job is up at once">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Spares favour sharing only when all jobs must run at once</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="249.6" y2="249.6" stroke="#ddd"/><text x="58" y="253.6" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="175.3" y2="175.3" stroke="#ddd"/><text x="58" y="179.3" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="100.9" y2="100.9" stroke="#ddd"/><text x="58" y="104.9" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.9</text>
<text x="375.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.95</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.99</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">unit availability</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">shared cost / dedicated cost</text>
<polyline points="64.0,71.2 375.1,71.2 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="375.1" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">no spares</text>
<polyline points="64.0,71.2 375.1,71.2 624.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="375.1" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="71.2" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">spares per job</text>
<polyline points="64.0,156.7 375.1,71.2 624.0,197.6" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="156.7" r="3" fill="#2e8b57"/>
<circle cx="375.1" cy="71.2" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="197.6" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">spares, every job up at once</text>
</svg>
