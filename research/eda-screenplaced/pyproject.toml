[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-screenplaced"
version = "0.1.0"
description = "Does a cross-family cost model screen a placed area-period Pareto front when one objective is hard to predict?"
requires-python = ">=3.9"
dependencies = ["numpy", "scikit-learn"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
