[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-starts"
version = "0.1.0"
description = "How much does SIMP topology optimisation depend on its starting density field?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
