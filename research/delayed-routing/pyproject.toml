[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delayed-routing"
version = "0.1.0"
description = "Hedge/LMSR routing of modular experts under delayed feedback from heterogeneous devices"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
