[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backlash-twin"
version = "0.1.0"
description = "Backlash a twin does not model: hunting limit cycles the linear twin cannot predict, exact scaling with the gap, describing-function accuracy and bistability"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
