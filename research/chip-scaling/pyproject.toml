[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-scaling"
version = "0.1.0"
description = "How generic-gate count and depth scale with bit width for common arithmetic blocks (Yosys + ABC)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
