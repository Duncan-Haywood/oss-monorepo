[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sybil-stake"
version = "0.1.0"
description = "Identity splitting and merging under stake-weighted reward pools and wagering mechanisms"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
