[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbot-cost"
version = "0.1.0"
description = "What a stock humanoid crew is worth on a house: break-even slowdown, savings per house and per 1,000 crew-hours, swept over wage, price, life and supervision."
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
figure = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
