<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of per-round contraction rate against inner steps H on a log axis; tuned heavy ball is faster than plain averaging at every H">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Outer contraction rate vs inner steps H (E1, kappa=1000)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.3" y2="273.3" stroke="#ddd"/><text x="58" y="277.3" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="222.7" y2="222.7" stroke="#ddd"/><text x="58" y="226.7" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="172.0" y2="172.0" stroke="#ddd"/><text x="58" y="176.0" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="121.3" y2="121.3" stroke="#ddd"/><text x="58" y="125.3" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="70.7" y2="70.7" stroke="#ddd"/><text x="58" y="74.7" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="219.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="374.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="529.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">inner steps H</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">rate per round (lower is faster)</text>
<polyline points="64.0,86.2 157.3,100.8 250.7,127.4 344.0,171.7 437.3,233.9 530.7,296.0 624.0,322.9" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="86.2" r="3" fill="#c0392b"/>
<circle cx="157.3" cy="100.8" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="127.4" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="171.7" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="233.9" r="3" fill="#c0392b"/>
<circle cx="530.7" cy="296.0" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="322.9" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">tuned heavy ball</text>
<polyline points="64.0,71.2 157.3,72.7 250.7,78.6 344.0,100.3 437.3,164.0 530.7,268.6 624.0,321.9" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="157.3" cy="72.7" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="78.6" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="100.3" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="164.0" r="3" fill="#1f6fb2"/>
<circle cx="530.7" cy="268.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="321.9" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">plain average</text>
</svg>
