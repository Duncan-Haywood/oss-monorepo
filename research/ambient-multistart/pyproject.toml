[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-multistart"
version = "0.1.0"
description = "Stylised: does a likelihood-ranked multi-start make hardness-aware Dawid-Skene robust to a poor start"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
