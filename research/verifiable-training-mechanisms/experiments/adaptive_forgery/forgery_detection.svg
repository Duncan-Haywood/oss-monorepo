<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the share of segments caught against the number of the segment's 20 steps skipped and forged, Adam at mean learning rate 4e-3 under warmup-cosine. Checking weights alone, the coast forgery is caught in 1% of segments at 2 skipped steps against 30% for a naive skip; checking the first moment as well catches it in 80% at 1 step and 95% at 2, and adding the second moment 86% and 99%">
