<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of requester cost against the referee tolerance: accepting the margin the tolerance allows costs between 1 and 0.11 compute units; forcing full effort through the score alone costs about 5.8">
