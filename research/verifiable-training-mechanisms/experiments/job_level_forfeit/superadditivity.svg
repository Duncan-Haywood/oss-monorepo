<circle cx="193.2" cy="292.1" r="3" fill="#c0392b"/>
<circle cx="408.6" cy="253.9" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="70.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">cosine</text>
