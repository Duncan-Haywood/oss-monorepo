<polyline points="64.0,304.3 193.2,292.9 408.6,256.8 624.0,70.5" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="304.3" r="3" fill="#2e8b57"/>
<circle cx="193.2" cy="292.9" r="3" fill="#2e8b57"/>
