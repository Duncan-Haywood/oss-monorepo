<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot, log scale, of exact harm over summed single-segment harm for random sets of stalled segments: about 1.1 at 10 segments, 1.3 at 25, 2.5 at 50 and about 60 when all 75 are stalled, on all three learning-rate schedules">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Stalled segments do not add up (40 seeds)</text>
<line x1="64" x2="624" y1="309.6" y2="309.6" stroke="#ddd"/><text x="58" y="313.6" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="175.7" y2="175.7" stroke="#ddd"/><text x="58" y="179.7" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="193.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">25</text>
<text x="408.6" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">50</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">75</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">segments stalled (of 75)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">exact harm / sum of single harms</text>
<line x1="64" x2="624" y1="309.6" y2="309.6" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,303.4 193.2,292.1 408.6,253.9 624.0,70.4" fill="none" stroke="#c0392b" stroke-width="2"/>
