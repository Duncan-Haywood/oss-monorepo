[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-startslot"
version = "0.1.0"
description = "Do agent runs that start alongside others, or at certain hours, go differently? Day-stratified permutation tests on the run records"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
