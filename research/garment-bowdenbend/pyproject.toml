[project]
name = "garment-bowdenbend"
version = "0.1.0"
description = "Stylised exosuit model: how much cable bend can a waist-mounted power train tolerate before the shank layout wins?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../garment-assist/src", "../garment-assistpower/src", "../garment-assistloc/src"]
