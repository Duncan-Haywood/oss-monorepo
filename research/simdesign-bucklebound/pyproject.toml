[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-bucklebound"
version = "0.1.0"
description = "Does a buckling-factor floor replace the w/b ceiling of the laser-cut bracket, and what does the optimiser do at 1 mm gauge?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem", "matplotlib", "shapely"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
