<circle cx="624.0" cy="324.0" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">power at eps/3</text>
<polyline points="64.0,71.2 271.5,71.2 416.5,84.8 479.0,153.2 541.4,324.0 624.0,324.0" fill="none" stroke="#2e8b57" stroke-width="2"/>
