<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of 95% interval coverage against the minimum number of failures required before stopping: coverage is 0.100 with no minimum and about 0.94 once at least one failure is required">
