<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="270.8" y2="270.8" stroke="#ddd"/><text x="58" y="274.8" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="217.5" y2="217.5" stroke="#ddd"/><text x="58" y="221.5" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="164.3" y2="164.3" stroke="#ddd"/><text x="58" y="168.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="111.1" y2="111.1" stroke="#ddd"/><text x="58" y="115.1" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="57.9" y2="57.9" stroke="#ddd"/><text x="58" y="61.9" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="82.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">30</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">minimum failures before stopping</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">coverage</text>
<line x1="64" x2="624" y1="71.2" y2="71.2" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,297.4 82.7,74.4 157.3,74.4 250.7,73.3 624.0,73.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="297.4" r="3" fill="#c0392b"/>
<circle cx="82.7" cy="74.4" r="3" fill="#c0392b"/>
<circle cx="157.3" cy="74.4" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="73.3" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="73.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">coverage of Wald interval</text>
