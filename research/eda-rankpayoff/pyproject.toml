[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-rankpayoff"
version = "0.1.0"
description = "Does a cheap rung's rank correlation with the expensive rung predict how well it works as a top-k screen?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
