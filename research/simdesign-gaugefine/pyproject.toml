[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-gaugefine"
version = "0.1.0"
description = "Does a patch-average stress converge with the mesh where the centroid peak does not?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem", "matplotlib", "shapely"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
