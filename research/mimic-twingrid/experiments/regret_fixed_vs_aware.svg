<rect x="190" y="68" width="447.6" height="9" fill="#d98324"><title>g/L -20% aware: 0.17673</title></rect>
<text x="641.6" y="72" style="font-size:10px">0.0132 / 0.1767</text>
<text x="182" y="98" text-anchor="end">g/L +20%</text>
