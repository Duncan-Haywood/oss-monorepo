[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-uavretry"
version = "0.1.0"
description = "Retrying a scrubbed observation-UAV launch later the same day under persistent wind: extends osrobot-uavnogo (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
