[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-fwdcheck"
version = "0.1.0"
description = "Do the reversed-load buckling-limited L-bracket designs also pass the forward-load buckling, stress and deflection checks?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
