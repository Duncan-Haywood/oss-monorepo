[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-audit"
version = "0.1.0"
description = "Sequentially auditing a digital twin against the real plant with an anytime-valid e-process: closed-loop detection delay, the gap-independent regret paid before detection, and when probing pays for itself"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
