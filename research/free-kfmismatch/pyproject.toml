[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-kfmismatch"
version = "0.1.0"
description = "Exact steady-state cost of mis-specified process noise in a scalar Kalman filter"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
