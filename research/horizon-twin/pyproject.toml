[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-twin"
version = "0.1.0"
description = "Receding-horizon control designed in a twin with the wrong plant pole: exact real cost per horizon, short horizons as implicit robustness, twin-blind horizon choice"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
