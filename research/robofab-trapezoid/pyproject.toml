[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-trapezoid"
version = "0.1.0"
description = "Time-optimal versus min-jerk carry of a printed part under joint torque, jaw force and joint speed limits (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
