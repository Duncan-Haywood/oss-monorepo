[project]
name = "garment-twonodeswitch"
version = "0.1.0"
description = "A skin-temperature-triggered infrared-gating textile with hysteresis and actuation lag in the two-node model"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
