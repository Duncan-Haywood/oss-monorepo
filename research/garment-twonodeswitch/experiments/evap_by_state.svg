<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of evaporative heat loss against ambient temperature for closed and open vent states in two models; opening the vent lowers evaporative loss at 31 C and changes little at 24 C and 16 C">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Two-node garment switch: evaporative loss at 180 min</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="265.3" y2="265.3" stroke="#ddd"/><text x="58" y="269.3" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="206.7" y2="206.7" stroke="#ddd"/><text x="58" y="210.7" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="148.0" y2="148.0" stroke="#ddd"/><text x="58" y="152.0" text-anchor="end" font-family="sans-serif" font-size="11">30</text>
<line x1="64" x2="624" y1="89.4" y2="89.4" stroke="#ddd"/><text x="58" y="93.4" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">16</text>
<text x="362.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">24</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">31</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">ambient temperature (C)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">evaporative loss (W/m2)</text>
<polyline points="624.0,87.6 362.7,269.4 64.0,286.5" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="87.6" r="3" fill="#c0392b"/>
<circle cx="362.7" cy="269.4" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="286.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">ours closed</text>
<polyline points="624.0,124.0 362.7,280.0 64.0,290.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="624.0" cy="124.0" r="3" fill="#1f6fb2"/>
<circle cx="362.7" cy="280.0" r="3" fill="#1f6fb2"/>
<circle cx="64.0" cy="290.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">ours open</text>
<polyline points="624.0,71.2 362.7,263.0 64.0,285.3" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="624.0" cy="71.2" r="3" fill="#2e8b57"/>
<circle cx="362.7" cy="263.0" r="3" fill="#2e8b57"/>
<circle cx="64.0" cy="285.3" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">ref closed</text>
<polyline points="624.0,104.0 362.7,280.0 64.0,289.4" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="624.0" cy="104.0" r="3" fill="#8e44ad"/>
<circle cx="362.7" cy="280.0" r="3" fill="#8e44ad"/>
<circle cx="64.0" cy="289.4" r="3" fill="#8e44ad"/>
<rect x="574" y="32" width="14" height="10" fill="#8e44ad"/><text x="594" y="41" font-family="sans-serif" font-size="11">ref open</text>
</svg>
