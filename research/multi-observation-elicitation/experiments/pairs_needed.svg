<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the disjoint pairs needed at 5 percent size and 80 percent power against the fraction rho by which the verifier under-reports variance, for normal and Laplace noise: the count grows roughly as one over rho squared, and Laplace needs more than normal">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Pairs needed to catch under-reporting</text>
<line x1="64" x2="624" y1="264.6" y2="264.6" stroke="#ddd"/><text x="58" y="268.6" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="119.1" y2="119.1" stroke="#ddd"/><text x="58" y="123.1" text-anchor="end" font-family="sans-serif" font-size="11">1000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="382.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.25</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">under-report fraction rho (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">pairs N (log scale)</text>
<polyline points="624.0,309.6 382.8,221.4 64.0,105.7" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="382.8" cy="221.4" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="105.7" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">Normal</text>
<polyline points="624.0,273.4 382.8,186.2 64.0,70.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="624.0" cy="273.4" r="3" fill="#1f6fb2"/>
<circle cx="382.8" cy="186.2" r="3" fill="#1f6fb2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">Laplace</text>
</svg>
