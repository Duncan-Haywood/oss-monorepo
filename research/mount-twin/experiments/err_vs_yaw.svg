<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of final dead-reckoning error divided by path length against sensor yaw from 1 to 20 degrees, equal to 2 sin(e/2) from 0.017 to 0.347">
