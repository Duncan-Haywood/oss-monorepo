<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Mount twin: relative error vs yaw</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="251.2" y2="251.2" stroke="#ddd"/><text x="58" y="255.2" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="178.4" y2="178.4" stroke="#ddd"/><text x="58" y="182.4" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="105.6" y2="105.6" stroke="#ddd"/><text x="58" y="109.6" text-anchor="end" font-family="sans-serif" font-size="11">0.3</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="93.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="181.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="329.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">sensor yaw e (deg)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">err / |p|</text>
<polyline points="64.0,311.3 93.5,298.6 181.9,260.5 329.3,197.1 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
