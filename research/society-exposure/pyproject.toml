[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-exposure"
version = "0.1.0"
description = "Do stubborn walkers who convert after meeting robots let a small robot minority tip a crowd's passing side?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
