[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-tolerance"
version = "0.1.0"
description = "Per-layer versus total drift tolerances in verifiable training: sum and max tests, worst-case cheating allocation, hidden budget, and a combined test"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
