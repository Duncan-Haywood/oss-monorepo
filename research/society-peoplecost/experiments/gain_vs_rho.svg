<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the gain to people (robots excluded) of a signal-reading door fleet over yield-all against rho, the urgent cue cost relative to normal people, for planner weights 1, 2, 3 and 5 on urgent people; with weight 1 the gain turns positive only below rho about 0.35, with weight 5 below about 0.7">
