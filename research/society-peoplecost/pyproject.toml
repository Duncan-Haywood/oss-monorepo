[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-peoplecost"
version = "0.1.0"
description = "Who a signal-reading door fleet helps: cost to people only and to a planner who weights urgent waiting"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
