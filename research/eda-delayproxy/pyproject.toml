[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-delayproxy"
version = "0.1.0"
description = "Can a cheap, library-free delay estimate on a generic gate netlist rank designs by SKY130-mapped critical-path delay better than logic depth?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
