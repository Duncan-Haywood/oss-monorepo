[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interference-twin"
version = "0.1.0"
description = "Interference twin: an interference-free or mean-noise-rise radar twin vs real mutual FMCW interference between robots; closed-form per-frame detection probability and fixed-geometry mission-level risk"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
