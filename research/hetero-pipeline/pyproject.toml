[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hetero-pipeline"
version = "0.1.0"
description = "Partitioning a model across heterogeneous devices for pipeline parallelism: exact bottleneck partition, device ordering, and the price of heterogeneity"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
