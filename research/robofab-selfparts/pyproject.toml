[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-selfparts"
version = "0.1.0"
description = "Can a parallel-jaw arm assemble its own printed gripper? Grasp and approach-direction constraints in a stylised box model"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
