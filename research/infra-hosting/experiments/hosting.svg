<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: median rooftop PV hosting capacity in kilowatts of the IEEE 13-node feeder against the load level, for no measure, a fixed power factor, volt-var and a lower regulator set-point">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">IEEE 13-node feeder: median PV hosting capacity (300 placements)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="234.7" y2="234.7" stroke="#ddd"/><text x="58" y="238.7" text-anchor="end" font-family="sans-serif" font-size="11">500</text>
<line x1="64" x2="624" y1="145.3" y2="145.3" stroke="#ddd"/><text x="58" y="149.3" text-anchor="end" font-family="sans-serif" font-size="11">1000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.3</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.7</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">load level (fraction of the feeder's 3466 kW peak)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">median hosting capacity, kW</text>
<polyline points="64.0,157.8 176.0,142.6 400.0,142.6 624.0,200.7" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="157.8" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="142.6" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="142.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="200.7" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">baseline</text>
<polyline points="64.0,157.8 176.0,152.5 400.0,156.0 624.0,168.5" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="157.8" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="152.5" r="3" fill="#1f6fb2"/>
<circle cx="400.0" cy="156.0" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="168.5" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">fixed pf 0.95</text>
<polyline points="64.0,151.6 176.0,134.6 400.0,143.5 624.0,207.0" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="151.6" r="3" fill="#2e8b57"/>
<circle cx="176.0" cy="134.6" r="3" fill="#2e8b57"/>
<circle cx="400.0" cy="143.5" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="207.0" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">volt-var</text>
<polyline points="64.0,77.4 176.0,71.2 400.0,72.1 624.0,93.5" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="77.4" r="3" fill="#8e44ad"/>
<circle cx="176.0" cy="71.2" r="3" fill="#8e44ad"/>
<circle cx="400.0" cy="72.1" r="3" fill="#8e44ad"/>
<circle cx="624.0" cy="93.5" r="3" fill="#8e44ad"/>
<rect x="574" y="32" width="14" height="10" fill="#8e44ad"/><text x="594" y="41" font-family="sans-serif" font-size="11">regulator set-point -2 V</text>
</svg>
