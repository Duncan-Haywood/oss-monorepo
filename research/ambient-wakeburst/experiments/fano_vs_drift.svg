<circle cx="344.0" cy="179.3" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="98.3" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">m = 3</text>
<polyline points="64.0,304.6 176.0,265.5 344.0,189.1 624.0,112.3" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="304.6" r="3" fill="#2e8b57"/>
<circle cx="176.0" cy="265.5" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="189.1" r="3" fill="#2e8b57"/>
