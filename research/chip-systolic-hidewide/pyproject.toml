[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-systolic-hidewide"
version = "0.1.0"
description = "Hidden-width sweep (H = 16): output-stationary systolic arrays against a MAC-lane engine on a tiny quantised MLP (generic-gate counts)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
