[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odometry-twin"
version = "0.1.0"
description = "Loop-closure gating and relocalisation interval tuned in an odometry twin with white noise: exact real recall, miss probability and a multi-lag variance repair"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
