[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tail-risk-elicitation"
version = "0.1.0"
description = "Jointly eliciting VaR and expected shortfall of benign-drift with a scale-free Rockafellar-Uryasev score: exact excess-score law, undercoverage of quantile-only tolerances, and the heavy-tail cost of auditing reports"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
