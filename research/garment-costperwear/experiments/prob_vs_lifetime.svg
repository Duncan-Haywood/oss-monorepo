<line x1="64" x2="624" y1="165.2" y2="165.2" stroke="#ddd"/><text x="58" y="169.2" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="112.2" y2="112.2" stroke="#ddd"/><text x="58" y="116.2" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="59.3" y2="59.3" stroke="#ddd"/><text x="58" y="63.3" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">300</text>
<text x="256.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1000</text>
<text x="431.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3000</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">designer median lifetime (wears, log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">probability</text>
