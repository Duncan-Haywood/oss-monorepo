<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: the probability that a designer coat has a lower cost per wear than a replica rises from zero at 300 median wears to about 0.95 at 10,000 wears">
