[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-excitation"
version = "0.1.0"
description = "Which test input should you use to calibrate a mass-spring-damper digital twin? Cramer-Rao bounds versus fitted errors for four equal-energy inputs"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
