[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbot-grounded"
version = "0.1.0"
description = "Buildbot cost model with the swept slowdown replaced by the simulated carry rates and nail coverage of buildbot-carry and buildbot-fasten."
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
figure = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
