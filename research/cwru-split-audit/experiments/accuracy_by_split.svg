<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of test accuracy for four classifiers across four splits: S1 random windows and S2 time split near 100% for the spectrum models, S3 leave-one-load-out still above 94% for three of four, S4 leave-one-fault-size-out between 44% and 71%">
