[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-branchlife"
version = "0.1.0"
description = "Branch lifetime of research pull requests from commit times, and a replay of each from its branch start"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
