[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-shirking"
version = "0.1.0"
description = "Detecting skipped training steps from the loss alone: hidden compute is the loss curve inverted at the noise band, eval-size and seed-noise floors, cheater economics, and the crossover with spot-checks"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
