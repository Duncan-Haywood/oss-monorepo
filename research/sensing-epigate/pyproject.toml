[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-epigate"
version = "0.1.0"
description = "Does an epipolar gate on the matches, fitted from the matches alone, let bundle adjustment survive mismatches?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
