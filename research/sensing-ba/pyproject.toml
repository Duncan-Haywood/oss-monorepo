[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-ba"
version = "0.1.0"
description = "Does bundle adjustment repair noisy camera poses in a synthetic multi-view reconstruction, and how much does it depend on views and pixel noise?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
