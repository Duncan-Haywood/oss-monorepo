<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" role="img" aria-label="Line plot of population-detector AUROC for Markov chains over 8, 32 and 128 quantised states, fitted on one person's earlier windows or on other people's, emitting state centres or real frames; every line sits at 1.000 except pooled 128-state member emission at 0.999">
<rect width="640" height="394" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Markov-chain webcam-signal generators: AUROC against states</text>
<line x1="64" x2="624" y1="338.0" y2="338.0" stroke="#ddd"/><text x="58" y="342.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="287.4" y2="287.4" stroke="#ddd"/><text x="58" y="291.4" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="236.9" y2="236.9" stroke="#ddd"/><text x="58" y="240.9" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="186.3" y2="186.3" stroke="#ddd"/><text x="58" y="190.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="135.7" y2="135.7" stroke="#ddd"/><text x="58" y="139.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="85.2" y2="85.2" stroke="#ddd"/><text x="58" y="89.2" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="344.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">32</text>
<text x="624.0" y="354" text-anchor="middle" font-family="sans-serif" font-size="11">128</text>
<text x="344.0" y="382" text-anchor="middle" font-family="sans-serif" font-size="12">number of states k</text>
<text x="14" y="204.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 204.0)">AUROC vs the person's later windows (0.5 = chance)</text>
<line x1="64" x2="624" y1="211.6" y2="211.6" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,85.2 344.0,85.2 624.0,85.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="85.2" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="85.2" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="85.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">own, centroid emission</text>
<polyline points="64.0,85.2 344.0,85.2 624.0,85.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="85.2" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="85.2" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="85.2" r="3" fill="#1f6fb2"/>
<rect x="234.4" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254.4" y="41" font-family="sans-serif" font-size="11">own, member emission</text>
<polyline points="64.0,85.2 344.0,85.2 624.0,85.2" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="85.2" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="85.2" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="85.2" r="3" fill="#2e8b57"/>
<rect x="392.4" y="32" width="14" height="10" fill="#2e8b57"/><text x="412.4" y="41" font-family="sans-serif" font-size="11">pooled, centroid emission</text>
<polyline points="64.0,85.2 344.0,85.2 624.0,85.4" fill="none" stroke="#8e44ad" stroke-width="2"/>
<circle cx="64.0" cy="85.2" r="3" fill="#8e44ad"/>
