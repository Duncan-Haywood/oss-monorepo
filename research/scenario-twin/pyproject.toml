[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-twin"
version = "0.1.0"
description = "Estimating a real failure probability from a twin whose scenario generator is too narrow: exact importance-sampling variance, the s^2 > 1/2 finiteness cliff, optimal width and a defensive-mixture repair"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
