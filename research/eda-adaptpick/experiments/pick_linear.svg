<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of median absolute percentage error against the number of synthesised designs from the new family, for four ways of choosing them; the farthest-point spread is lowest from three designs on and choosing the smallest designs is worst">
