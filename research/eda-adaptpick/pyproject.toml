[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-adaptpick"
version = "0.1.0"
description = "Which designs of a new family to synthesise, and how much to weight them, when adapting a cell-count surrogate"
requires-python = ">=3.9"
dependencies = ["numpy", "scikit-learn"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
