<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the number of milestones needed against relationship value W: an equal split needs about C/W milestones, which grows to 10000 at W 0.01, while a geometric front-loaded schedule needs only 42">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Milestone-schedules: how many milestones a job needs</text>
<line x1="64" x2="624" y1="281.6" y2="281.6" stroke="#ddd"/><text x="58" y="285.6" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="211.2" y2="211.2" stroke="#ddd"/><text x="58" y="215.2" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="140.8" y2="140.8" stroke="#ddd"/><text x="58" y="144.8" text-anchor="end" font-family="sans-serif" font-size="11">1000</text>
<line x1="64" x2="624" y1="70.4" y2="70.4" stroke="#ddd"/><text x="58" y="74.4" text-anchor="end" font-family="sans-serif" font-size="11">10000</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="233.6" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="403.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="572.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">relationship value W (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">milestones needed (log scale)</text>
<polyline points="624.0,302.8 521.9,260.4 403.3,211.2 284.7,162.0 182.6,119.6 64.0,70.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="302.8" r="3" fill="#c0392b"/>
<circle cx="521.9" cy="260.4" r="3" fill="#c0392b"/>
<circle cx="403.3" cy="211.2" r="3" fill="#c0392b"/>
<circle cx="284.7" cy="162.0" r="3" fill="#c0392b"/>
<circle cx="182.6" cy="119.6" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">equal split</text>
<polyline points="624.0,309.6 521.9,284.8 403.3,265.4 284.7,252.4 182.6,245.1 64.0,237.7" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="624.0" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="521.9" cy="284.8" r="3" fill="#1f6fb2"/>
<circle cx="403.3" cy="265.4" r="3" fill="#1f6fb2"/>
<circle cx="284.7" cy="252.4" r="3" fill="#1f6fb2"/>
<circle cx="182.6" cy="245.1" r="3" fill="#1f6fb2"/>
<circle cx="64.0" cy="237.7" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">geometric front-loaded</text>
</svg>
