[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-loadrobust"
version = "0.1.0"
description = "Multi-load SIMP topology optimisation: how much does a design optimised for one load direction lose when the real load direction differs?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
