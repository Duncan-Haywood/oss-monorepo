[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-sgd-bias"
version = "0.1.0"
description = "Exact fixed point of local-SGD/DiLoCo-style periodic averaging on heterogeneous quadratics: saturating weights, step-count inflation, and the wall-clock optimal sync interval"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
