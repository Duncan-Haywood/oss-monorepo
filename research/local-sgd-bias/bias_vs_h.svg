<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the fixed-point bias of local SGD averaging against local steps H on a log axis; the bias is zero at H=1, swings negative, then turns positive toward its large-H limit">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Fixed-point bias of plain averaging vs local steps H (E1)</text>
<line x1="64" x2="624" y1="253.0" y2="253.0" stroke="#ddd"/><text x="58" y="257.0" text-anchor="end" font-family="sans-serif" font-size="11">-0.05</text>
<line x1="64" x2="624" y1="172.2" y2="172.2" stroke="#ddd"/><text x="58" y="176.2" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="91.4" y2="91.4" stroke="#ddd"/><text x="58" y="95.4" text-anchor="end" font-family="sans-serif" font-size="11">0.05</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="215.4" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="366.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="518.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">local steps H</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">bias (fixed point - optimum)</text>
