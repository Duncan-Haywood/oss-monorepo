<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the slow types share of prizes and of their rate ratio against the number of winners k in a race of eight with four slow entrants: both stay near zero up to k=3 and climb toward the fair share of 0.5 at k=7">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Race: slow-type prize share vs winners k</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="277.2" y2="277.2" stroke="#ddd"/><text x="58" y="281.2" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="230.4" y2="230.4" stroke="#ddd"/><text x="58" y="234.4" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="183.5" y2="183.5" stroke="#ddd"/><text x="58" y="187.5" text-anchor="end" font-family="sans-serif" font-size="11">0.3</text>
<line x1="64" x2="624" y1="136.7" y2="136.7" stroke="#ddd"/><text x="58" y="140.7" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="89.9" y2="89.9" stroke="#ddd"/><text x="58" y="93.9" text-anchor="end" font-family="sans-serif" font-size="11">0.5</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="530.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">7</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">winners k</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">slow type (fair share = 0.5)</text>
<line x1="64" x2="624" y1="89.9" y2="89.9" stroke="#555" stroke-dasharray="4 3"/>
<polyline points="64.0,324.0 157.3,324.0 250.7,322.1 344.0,223.8 437.3,168.6 530.7,133.4 624.0,108.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="324.0" r="3" fill="#c0392b"/>
<circle cx="157.3" cy="324.0" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="322.1" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="223.8" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="168.6" r="3" fill="#c0392b"/>
<circle cx="530.7" cy="133.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="108.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">slow share of prizes</text>
<polyline points="64.0,324.0 157.3,324.0 250.7,322.6 344.0,242.5 437.3,181.2 530.7,126.4 624.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="324.0" r="3" fill="#1f6fb2"/>
<circle cx="157.3" cy="324.0" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="322.6" r="3" fill="#1f6fb2"/>
