[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-bodysearch"
version = "0.1.0"
description = "Co-designing a planar arm body and its IK controller against a fixed off-the-shelf body at equal cost budget, in a stylised model"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
