[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "private-markets"
version = "0.1.0"
description = "Differentially private cost-function prediction markets via the binary-tree mechanism, and the subsidy cost of privacy"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
