<polyline points="64.0,268.0 250.7,256.7 437.3,196.9 624.0,125.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="268.0" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="256.7" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="196.9" r="3" fill="#1f6fb2"/>
