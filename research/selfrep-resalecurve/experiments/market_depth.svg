<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-x line plot of the dynamic-programming value of a replicating shop against used-machine market depth from 1,000 to 1,000,000 machines, for an uncapped goods market and one capped at 10,000: value rises with depth in both cases; finite-depth rows only, the infinite-depth row is omitted">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Selfrep-resalecurve: value vs resale market depth</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="265.4" y2="265.4" stroke="#ddd"/><text x="58" y="269.4" text-anchor="end" font-family="sans-serif" font-size="11">1e+06</text>
<line x1="64" x2="624" y1="206.9" y2="206.9" stroke="#ddd"/><text x="58" y="210.9" text-anchor="end" font-family="sans-serif" font-size="11">2e+06</text>
<line x1="64" x2="624" y1="148.3" y2="148.3" stroke="#ddd"/><text x="58" y="152.3" text-anchor="end" font-family="sans-serif" font-size="11">3e+06</text>
<line x1="64" x2="624" y1="89.8" y2="89.8" stroke="#ddd"/><text x="58" y="93.8" text-anchor="end" font-family="sans-serif" font-size="11">4e+06</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1000</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10000</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100000</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e+06</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">used-machine market depth m (machines)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">DP value J</text>
<polyline points="64.0,165.3 250.7,152.1 437.3,100.1 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
