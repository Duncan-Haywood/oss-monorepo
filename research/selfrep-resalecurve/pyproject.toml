[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selfrep-resalecurve"
version = "0.1.0"
description = "A concave resale value for the finished fleet in the replicating-shop reinvestment problem (dynamic programming)"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
