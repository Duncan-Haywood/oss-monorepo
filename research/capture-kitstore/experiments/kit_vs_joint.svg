<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the number of distinct band-by-viewpoint shots a travel kit reaches against weight budget, choosing the kit alone and choosing it together with offload storage; storage costs three shots at 4 kg">
