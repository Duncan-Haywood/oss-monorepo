<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4000</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5000</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">7000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">weight budget (g)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">distinct shots (max 18)</text>
