<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-x line plot of the share of asymptotic information one worker has gathered against its local step count H: it rises roughly in proportion to H, then saturates, reaching 0.93 at H of 64">
