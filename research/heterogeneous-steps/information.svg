<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">16</text>
<text x="530.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">32</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">64</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">local steps H (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">fraction of asymptotic information</text>
