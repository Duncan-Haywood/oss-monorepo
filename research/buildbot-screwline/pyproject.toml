[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buildbot-screwline"
version = "0.1.0"
description = "Stud-finding error budget for a robot driving drywall screws: wall and ceiling schedules, shared per-stud error, and sheets that tolerate a few missed screws."
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
figure = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
