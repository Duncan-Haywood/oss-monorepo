<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of grams of storage carried against number of cameras, for cards only (one copy) and for nightly offload to two SSD copies within one evening hour; the offload plan is heavier and stops being feasible beyond seven cameras (one reader per card, at most eight readers)">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Storage weight by rig size: cards only vs nightly offload to two SSDs</text>
<line x1="64" x2="624" y1="309.6" y2="309.6" stroke="#ddd"/><text x="58" y="313.6" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="271.2" y2="271.2" stroke="#ddd"/><text x="58" y="275.2" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
<line x1="64" x2="624" y1="242.2" y2="242.2" stroke="#ddd"/><text x="58" y="246.2" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="213.1" y2="213.1" stroke="#ddd"/><text x="58" y="217.1" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="174.7" y2="174.7" stroke="#ddd"/><text x="58" y="178.7" text-anchor="end" font-family="sans-serif" font-size="11">50</text>
<line x1="64" x2="624" y1="145.7" y2="145.7" stroke="#ddd"/><text x="58" y="149.7" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="116.6" y2="116.6" stroke="#ddd"/><text x="58" y="120.6" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="78.2" y2="78.2" stroke="#ddd"/><text x="58" y="82.2" text-anchor="end" font-family="sans-serif" font-size="11">500</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="530.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">7</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">cameras in the rig (4 h/day, 7 days)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">grams of storage (log scale)</text>
<polyline points="64.0,309.6 157.3,286.2 250.7,275.7 344.0,254.2 437.3,244.3 530.7,238.2 624.0,234.5" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="157.3" cy="286.2" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="275.7" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="254.2" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="244.3" r="3" fill="#c0392b"/>
<circle cx="530.7" cy="238.2" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="234.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">cards only</text>
<polyline points="64.0,133.0 157.3,116.5 250.7,116.4 344.0,87.4 437.3,72.2 530.7,70.4 624.0,70.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="133.0" r="3" fill="#1f6fb2"/>
<circle cx="157.3" cy="116.5" r="3" fill="#1f6fb2"/>
