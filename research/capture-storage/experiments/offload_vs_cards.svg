<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of grams of storage carried against number of cameras, for cards only (one copy) and for nightly offload to two SSD copies within one evening hour; the offload plan is heavier and stops being feasible beyond six cameras">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Storage weight by rig size: cards only vs nightly offload to two SSDs</text>
<line x1="64" x2="624" y1="243.1" y2="243.1" stroke="#ddd"/><text x="58" y="247.1" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="147.9" y2="147.9" stroke="#ddd"/><text x="58" y="151.9" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="512.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">cameras in the rig (4 h/day, 7 days)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">grams of storage (log scale)</text>
<polyline points="64.0,309.6 176.0,286.5 288.0,276.1 400.0,255.0 512.0,245.2 624.0,239.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="286.5" r="3" fill="#c0392b"/>
<circle cx="288.0" cy="276.1" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="255.0" r="3" fill="#c0392b"/>
<circle cx="512.0" cy="245.2" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="239.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">cards only</text>
<polyline points="64.0,128.4 176.0,114.2 288.0,109.8 400.0,85.6 512.0,72.0 624.0,70.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="128.4" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="114.2" r="3" fill="#1f6fb2"/>
<circle cx="288.0" cy="109.8" r="3" fill="#1f6fb2"/>
<circle cx="400.0" cy="85.6" r="3" fill="#1f6fb2"/>
<circle cx="512.0" cy="72.0" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="70.4" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">offload x2, 1 h/night</text>
</svg>
