[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-cleanbroken"
version = "0.1.0"
description = "Replays pairs of research merges and checks whether textually clean merges still pass the homepage builder consistency rules"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
