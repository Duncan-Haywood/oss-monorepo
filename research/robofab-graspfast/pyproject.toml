[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-graspfast"
version = "0.1.0"
description = "Friction-grasp force at arm-scale accelerations: analytic bound vs MuJoCo"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
