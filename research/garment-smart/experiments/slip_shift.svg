<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of activity-classification accuracy against test-time garment slip; a classifier trained without slip falls from 99.9 to 45 percent at 1 radian while one trained with slip stays above 94 percent">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Smart garment: accuracy when the garment slips</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.4" y2="273.4" stroke="#ddd"/><text x="58" y="277.4" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="222.8" y2="222.8" stroke="#ddd"/><text x="58" y="226.8" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="172.2" y2="172.2" stroke="#ddd"/><text x="58" y="176.2" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<line x1="64" x2="624" y1="121.5" y2="121.5" stroke="#ddd"/><text x="58" y="125.5" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<line x1="64" x2="624" y1="70.9" y2="70.9" stroke="#ddd"/><text x="58" y="74.9" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="232.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.3</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">test-time garment slip (rad)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">accuracy (%)</text>
<polyline points="64.0,71.2 232.0,119.0 400.0,170.9 624.0,209.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="232.0" cy="119.0" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="170.9" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="209.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">train clean</text>
<polyline points="64.0,73.4 232.0,74.5 400.0,76.7 624.0,85.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="73.4" r="3" fill="#1f6fb2"/>
<circle cx="232.0" cy="74.5" r="3" fill="#1f6fb2"/>
<circle cx="400.0" cy="76.7" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="85.1" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">train with slip 0.6</text>
</svg>
