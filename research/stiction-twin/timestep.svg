<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the normalised stick-slip limit-cycle amplitude against the integration time step on a log axis: the amplitude stays between 0.0832 and 0.0833 from dt 0.01 down to dt 0.00125, so the result is converged">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Stiction-twin: limit-cycle amplitude against time step</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="263.3" y2="263.3" stroke="#ddd"/><text x="58" y="267.3" text-anchor="end" font-family="sans-serif" font-size="11">0.02</text>
<line x1="64" x2="624" y1="202.6" y2="202.6" stroke="#ddd"/><text x="58" y="206.6" text-anchor="end" font-family="sans-serif" font-size="11">0.04</text>
<line x1="64" x2="624" y1="142.0" y2="142.0" stroke="#ddd"/><text x="58" y="146.0" text-anchor="end" font-family="sans-serif" font-size="11">0.06</text>
<line x1="64" x2="624" y1="81.3" y2="81.3" stroke="#ddd"/><text x="58" y="85.3" text-anchor="end" font-family="sans-serif" font-size="11">0.08</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.00125</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.0025</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.005</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">time step dt (s)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">tail amplitude</text>
<polyline points="624.0,71.6 437.3,71.4 250.7,71.3 64.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="71.6" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="71.4" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="71.3" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">tail amplitude</text>
</svg>
