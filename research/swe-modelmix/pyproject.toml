[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-modelmix"
version = "0.1.0"
description = "Opus vs Sonnet per run: cost ratio by track from the run ledger, and the sample needed to compare value per dollar"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
