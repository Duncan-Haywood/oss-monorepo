[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-clocksweep"
version = "0.1.0"
description = "Do the SKY130 area and latency conclusions for a MAC-engine family survive a target clock period?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
