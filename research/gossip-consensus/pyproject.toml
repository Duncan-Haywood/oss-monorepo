[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gossip-consensus"
version = "0.1.0"
description = "Pairwise-gossip consensus for decentralised training: exact contraction laws and a stubborn Byzantine node"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
