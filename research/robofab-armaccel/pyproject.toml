[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-armaccel"
version = "0.1.0"
description = "How fast can an arm carry a printed part? Joint torque limit versus friction grip, planar two-link model"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
