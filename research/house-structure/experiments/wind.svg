<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line chart of wind load on a gable-wall line as a percent of its capacity at 6 inch nailing, by ultimate wind speed: B-like: 90 mph 12%, 115 mph 19%, 130 mph 24%, 150 mph 32%, 170 mph 41%, 200 mph 57%; C-like: 90 mph 16%, 115 mph 27%, 130 mph 34%, 150 mph 45%, 170 mph 58%, 200 mph 80%">
