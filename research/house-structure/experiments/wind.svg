<text x="54" y="74.0" text-anchor="end" font-family="sans-serif" font-size="11">100%</text>
<text x="103.1" y="346" text-anchor="middle" font-family="sans-serif" font-size="11">90</text>
<text x="210.8" y="346" text-anchor="middle" font-family="sans-serif" font-size="11">115</text>
<text x="275.4" y="346" text-anchor="middle" font-family="sans-serif" font-size="11">130</text>
