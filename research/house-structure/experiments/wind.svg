<text x="54" y="178.0" text-anchor="end" font-family="sans-serif" font-size="11">60%</text>
<line x1="60" x2="620" y1="122.0" y2="122.0" stroke="#ddd"/>
<text x="54" y="126.0" text-anchor="end" font-family="sans-serif" font-size="11">80%</text>
