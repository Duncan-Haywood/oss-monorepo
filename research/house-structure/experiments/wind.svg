<text x="320.0" y="40" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">Stylised; capacities from memory of SDPWS; 100% means 6 in edge nailing is just enough</text>
<line x1="60" x2="620" y1="330.0" y2="330.0" stroke="#ddd"/>
