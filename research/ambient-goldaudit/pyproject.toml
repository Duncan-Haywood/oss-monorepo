[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-goldaudit"
version = "0.1.0"
description = "Stylised: how many gold-labelled audits replace noisy ones when the auditor accuracy is unknown"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
