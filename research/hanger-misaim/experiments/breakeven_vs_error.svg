<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the break-even detector time in seconds per pick against the share of wrong aims: about 9 s for a perfect detector, 4.5 s at 50 percent wrong, about 0 when every aim is wrong">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">How long may an opening detector take per pick, given how often it aims wrong?</text>
<line x1="64" x2="624" y1="322.1" y2="322.1" stroke="#ddd"/><text x="58" y="326.1" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="267.8" y2="267.8" stroke="#ddd"/><text x="58" y="271.8" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="213.5" y2="213.5" stroke="#ddd"/><text x="58" y="217.5" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
<line x1="64" x2="624" y1="159.2" y2="159.2" stroke="#ddd"/><text x="58" y="163.2" text-anchor="end" font-family="sans-serif" font-size="11">6</text>
<line x1="64" x2="624" y1="104.8" y2="104.8" stroke="#ddd"/><text x="58" y="108.8" text-anchor="end" font-family="sans-serif" font-size="11">8</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="120.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="232.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.3</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="456.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.7</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">share of aims that are wrong (detector error)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">break-even detector time (s per pick, assumed times)</text>
<polyline points="64.0,71.2 120.0,97.2 176.0,123.9 232.0,151.6 344.0,200.2 456.0,250.4 624.0,324.0" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="120.0" cy="97.2" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="123.9" r="3" fill="#c0392b"/>
<circle cx="232.0" cy="151.6" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="200.2" r="3" fill="#c0392b"/>
<circle cx="456.0" cy="250.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="324.0" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">break-even look time T*</text>
