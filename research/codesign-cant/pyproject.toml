[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codesign-cant"
version = "0.1.0"
description = "When does fixed rotor cant pay on a small multirotor co-designed with its motors and controller?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "cma", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
