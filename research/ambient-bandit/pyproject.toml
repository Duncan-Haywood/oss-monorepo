[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-bandit"
version = "0.1.0"
description = "Learning when an always-on assistant should speak from accept/dismiss feedback alone (simulated)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
