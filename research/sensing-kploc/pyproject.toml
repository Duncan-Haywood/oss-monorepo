[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-kploc"
version = "0.1.0"
description = "How accurately does a real keypoint detector localise features as images get noisier and blurrier?"
requires-python = ">=3.9"
dependencies = ["numpy", "opencv-python-headless", "scikit-image"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
