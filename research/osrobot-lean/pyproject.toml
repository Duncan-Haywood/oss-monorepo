[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-lean"
version = "0.1.0"
description = "Does a user who leans toward the spoon substitute for a camera on a feeding arm? (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
