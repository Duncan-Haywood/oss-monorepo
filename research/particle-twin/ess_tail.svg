<line x1="64" x2="624" y1="242.9" y2="242.9" stroke="#ddd"/><text x="58" y="246.9" text-anchor="end" font-family="sans-serif" font-size="11">0.0001</text>
<line x1="64" x2="624" y1="186.3" y2="186.3" stroke="#ddd"/><text x="58" y="190.3" text-anchor="end" font-family="sans-serif" font-size="11">0.001</text>
<line x1="64" x2="624" y1="129.6" y2="129.6" stroke="#ddd"/><text x="58" y="133.6" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
