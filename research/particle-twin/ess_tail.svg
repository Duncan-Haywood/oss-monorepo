<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.001</text>
<text x="290.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="516.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
