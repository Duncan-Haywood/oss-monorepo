<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot on log axes of the probability that the effective sample size fraction is below theta; the real sensor with outliers has a far heavier tail than the twin, 0.026 versus 6.6e-6 at theta 0.001">
