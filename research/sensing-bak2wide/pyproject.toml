[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-bak2wide"
version = "0.1.0"
description = "Does a wide field of view make the second radial lens term identifiable in self-calibrating bundle adjustment?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
