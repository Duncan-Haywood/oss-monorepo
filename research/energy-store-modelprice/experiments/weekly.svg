<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: store minus heat-pump levelised cost of heat in EUR per kWh for a house-sized weekly-cycled sand store, German prices 2015 to 2019, on the real price and on a residual-load model fitted on the other four years">
