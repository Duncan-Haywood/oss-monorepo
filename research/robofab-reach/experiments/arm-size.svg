<line x1="64" x2="624" y1="260.8" y2="260.8" stroke="#ddd"/><text x="58" y="264.8" text-anchor="end" font-family="sans-serif" font-size="11">50</text>
<line x1="64" x2="624" y1="197.6" y2="197.6" stroke="#ddd"/><text x="58" y="201.6" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="134.4" y2="134.4" stroke="#ddd"/><text x="58" y="138.4" text-anchor="end" font-family="sans-serif" font-size="11">150</text>
