<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the smallest first-link length in millimetres that can place all six free parts of the toy gripper, against the gap between the fixture edge and the part tray, one line per shoulder height: the required link grows with both the gap and the shoulder height">
