[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-adaptfixed"
version = "0.1.0"
description = "Re-score the adaptation-design choosers of eda-adaptpick on one fixed common test set per family"
requires-python = ">=3.9"
dependencies = ["numpy", "scikit-learn"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
