<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of median absolute percentage error against the number of synthesised designs from the new family, for four ways of choosing them; the farthest-point spread is lowest or tied-lowest at every k and choosing the smallest designs is worst at most k">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Choosers on one fixed test set (linear model, new-family weight 5)</text>
<line x1="64" x2="624" y1="166.0" y2="166.0" stroke="#ddd"/><text x="58" y="170.0" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">synthesised designs from the new family (k)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">median error, % (median, 4 families x 5 splits)</text>
<polyline points="64.0,129.5 157.3,176.9 344.0,225.3 624.0,241.9" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="129.5" r="3" fill="#c0392b"/>
<circle cx="157.3" cy="176.9" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="225.3" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="241.9" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">random draw</text>
<polyline points="64.0,70.4 157.3,95.2 344.0,127.0 624.0,209.1" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#1f6fb2"/>
<circle cx="157.3" cy="95.2" r="3" fill="#1f6fb2"/>
<circle cx="344.0" cy="127.0" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="209.1" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">smallest first</text>
<polyline points="64.0,169.5 157.3,196.3 344.0,251.2 624.0,309.6" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="169.5" r="3" fill="#2e8b57"/>
<circle cx="157.3" cy="196.3" r="3" fill="#2e8b57"/>
<circle cx="344.0" cy="251.2" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="309.6" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">farthest-point spread</text>
<polyline points="64.0,75.6 157.3,131.2 344.0,263.9 624.0,298.2" fill="none" stroke="#8e44ad" stroke-width="2"/>
