[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-twin"
version = "0.1.0"
description = "Braking-distance detection certificates from a lidar twin that returns every beam vs a real sensor with per-beam dropout: exact scan-product miss law, certified speed, repair by measured return rate"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
