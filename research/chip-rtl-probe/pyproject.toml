[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-rtl-probe"
version = "0.1.0"
description = "RTL generation with lint, simulation and formal-equivalence feedback on a small task suite"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
