[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier-bribery"
version = "0.1.0"
description = "Bribery and collusion thresholds in refereed verification of decentralised ML training: jackpots raise the bribe floor"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
