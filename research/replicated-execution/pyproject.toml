[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "replicated-execution"
version = "0.1.0"
description = "Replication, stake and blind collusion when decentralised ML jobs are assigned to random workers"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
