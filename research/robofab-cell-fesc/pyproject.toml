[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-cell-fesc"
version = "0.1.0"
description = "Can a flow-equivalent-server decomposition predict a robot-printer cell without enumerating its states?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
