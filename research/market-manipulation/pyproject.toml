[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-manipulation"
version = "0.1.0"
description = "Manipulating an LMSR verification market: exact manipulation cost, informed-entry response and when manipulation raises accuracy"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
