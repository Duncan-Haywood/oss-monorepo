[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-procurement"
version = "0.1.0"
description = "Reverse auctions for buying k units of decentralised compute: exact VCG payments, Myerson reserve, first-price equilibrium"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
