<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot, log scale, of the probability that all eight beams are blocked against beam spacing from 0.05 to 2 m; the exact Poisson-occluder value falls from 0.38 to 0.0039 while the independent-beam twin stays flat at 0.0039">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Occlusion twin: P(8-beam sensor blind) vs beam spacing</text>
<line x1="64" x2="624" y1="260.5" y2="260.5" stroke="#ddd"/><text x="58" y="264.5" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="140.2" y2="140.2" stroke="#ddd"/><text x="58" y="144.2" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="78.4" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="121.4" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.25</text>
<text x="193.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="265.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.75</text>
<text x="336.8" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">beam spacing (m)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">P(all 8 blocked)</text>
<polyline points="64.0,70.4 78.4,89.2 121.4,150.9 193.2,223.9 265.0,259.4 336.8,309.6 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="78.4" cy="89.2" r="3" fill="#c0392b"/>
<circle cx="121.4" cy="150.9" r="3" fill="#c0392b"/>
<circle cx="193.2" cy="223.9" r="3" fill="#c0392b"/>
<circle cx="265.0" cy="259.4" r="3" fill="#c0392b"/>
<circle cx="336.8" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">exact (correlated beams)</text>
<polyline points="64.0,309.6 78.4,309.6 121.4,309.6 193.2,309.6 265.0,309.6 336.8,309.6 624.0,309.6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="78.4" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="121.4" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="193.2" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="265.0" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="336.8" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="309.6" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">independent-beam twin</text>
