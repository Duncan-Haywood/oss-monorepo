[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runlength-twin"
version = "0.1.0"
description = "Length of a real test run sized in a twin with the wrong plant pole: exact variance of the time-averaged cost, sizing error, coverage loss, and a pilot-run repair"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
