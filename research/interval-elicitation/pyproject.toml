[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interval-elicitation"
version = "0.1.0"
description = "Eliciting drift tolerance intervals: Winkler interval score (equal-tailed, unbounded payment) vs a bounded width-plus-miss loss (shortest interval), exact regrets, skewed and heavy-tailed drift"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
