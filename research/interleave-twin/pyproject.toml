[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interleave-twin"
version = "0.1.0"
description = "Interleave twin: a link twin with independent packet loss says repeats should be sent back-to-back; on a bursty link the same repeats are nearly useless unless spaced, and spacing costs latency"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
