[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-liftload"
version = "0.1.0"
description = "Friction-grasp jaw force under lift acceleration and an off-centre centre of mass: bound vs MuJoCo (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
