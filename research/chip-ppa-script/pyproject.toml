[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-ppa-script"
version = "0.1.0"
description = "Proposer files and parameter sweep re-scored under every ABC script, with a mapped-netlist equivalence check"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
