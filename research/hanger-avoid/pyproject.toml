[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hanger-avoid"
version = "0.1.0"
description = "Two laundry-hanging arms on one dryer pile: does picking a free garment instead of waiting recover the blocking loss?"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
