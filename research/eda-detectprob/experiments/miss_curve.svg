<line x1="64" x2="624" y1="56.6" y2="56.6" stroke="#ddd"/><text x="58" y="60.6" text-anchor="end" font-family="sans-serif" font-size="11">0.25</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="72.9" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
