[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-dfm"
version = "0.1.0"
description = "Manufacturability rules (FDM, CNC routing, laser cutting, casting) on a parametric bracket: mass price of each rule set"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem", "matplotlib", "shapely"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
