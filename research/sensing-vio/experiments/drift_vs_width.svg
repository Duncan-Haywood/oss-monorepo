<circle cx="101.3" cy="241.3" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="325.3" cy="277.0" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="290.5" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">planar VIO smoother</text>
</svg>
