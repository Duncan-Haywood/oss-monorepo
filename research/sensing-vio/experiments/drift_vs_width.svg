<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Visual-inertial drift against camera width (synthetic)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="266.9" y2="266.9" stroke="#ddd"/><text x="58" y="270.9" text-anchor="end" font-family="sans-serif" font-size="11">2</text>
<line x1="64" x2="624" y1="209.9" y2="209.9" stroke="#ddd"/><text x="58" y="213.9" text-anchor="end" font-family="sans-serif" font-size="11">4</text>
<line x1="64" x2="624" y1="152.8" y2="152.8" stroke="#ddd"/><text x="58" y="156.8" text-anchor="end" font-family="sans-serif" font-size="11">6</text>
<line x1="64" x2="624" y1="95.8" y2="95.8" stroke="#ddd"/><text x="58" y="99.8" text-anchor="end" font-family="sans-serif" font-size="11">8</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">80</text>
<text x="101.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">160</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">320</text>
<text x="325.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">640</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1280</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">camera width (px)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">rms drift (% of path)</text>
<polyline points="64.0,250.5 101.3,241.3 176.0,71.2 325.3,277.0 624.0,290.5" fill="none" stroke="#c0392b" stroke-width="2"/>
