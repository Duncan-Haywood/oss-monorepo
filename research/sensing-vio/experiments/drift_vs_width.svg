<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the rms position error of a planar visual-inertial smoother as a percentage of path length, against camera width in pixels; the error is lowest at 1280 pixels and highest at 320">
