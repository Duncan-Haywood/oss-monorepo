<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot: a 10 MWh sand store and a 10 MWh hot-water tank, 0.5 m of mineral wool; delivered heat per kWh put in falls as the store stands longer before use">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Heat store: heat delivered per kWh charged vs standby time</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="260.2" y2="260.2" stroke="#ddd"/><text x="58" y="264.2" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="196.5" y2="196.5" stroke="#ddd"/><text x="58" y="200.5" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="132.7" y2="132.7" stroke="#ddd"/><text x="58" y="136.7" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="68.9" y2="68.9" stroke="#ddd"/><text x="58" y="72.9" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="333.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="602.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">days of standby before use</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">heat delivered / energy put in</text>
<polyline points="64.0,71.2 291.6,92.5 461.8,148.3 624.0,241.4" fill="none" stroke="#c0392b" stroke-width="2"/>
