<circle cx="291.6" cy="129.8" r="3" fill="#1f6fb2"/>
<circle cx="461.8" cy="142.3" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="182.4" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">water 90 C</text>
