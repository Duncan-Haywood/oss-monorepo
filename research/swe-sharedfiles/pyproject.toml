[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-sharedfiles"
version = "0.1.0"
description = "Measures, from git history, how often research merges touch the shared index files and how close together they land"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
