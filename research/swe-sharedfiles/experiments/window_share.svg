<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the share of shared-file merges that had an earlier shared-file merge within a window of 5 to 240 minutes; the share rises from 14 percent to 99 percent">
