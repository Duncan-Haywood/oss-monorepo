<circle cx="64.0" cy="288.6" r="3" fill="#c0392b"/>
<circle cx="164.3" cy="264.7" r="3" fill="#c0392b"/>
<circle cx="264.5" cy="229.3" r="3" fill="#c0392b"/>
<circle cx="323.2" cy="197.7" r="3" fill="#c0392b"/>
<circle cx="423.5" cy="134.6" r="3" fill="#c0392b"/>
