<line x1="64" x2="624" y1="170.0" y2="170.0" stroke="#ddd"/><text x="58" y="174.0" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<line x1="64" x2="624" y1="118.7" y2="118.7" stroke="#ddd"/><text x="58" y="122.7" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<line x1="64" x2="624" y1="67.3" y2="67.3" stroke="#ddd"/><text x="58" y="71.3" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5</text>
<text x="164.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="264.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20</text>
<text x="323.2" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">30</text>
<text x="423.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">60</text>
<text x="523.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">120</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">240</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">window (min)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">share of merges (%)</text>
