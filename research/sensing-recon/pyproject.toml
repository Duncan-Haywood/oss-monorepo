[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-recon"
version = "0.1.0"
description = "Synthetic multi-view triangulation of a textured object: Chamfer error and coverage against number of views, baseline and pixel noise"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
