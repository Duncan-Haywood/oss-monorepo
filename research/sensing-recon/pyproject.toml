[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-recon"
version = "0.1.0"
description = "Synthetic multi-view triangulation of a bumpy ellipsoid: surface error and completeness against number of views, baseline, pixel noise and pose error"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
