<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot, log scale, of mean steps to loss of control against noise sd from 0.8 to 2.0; the twin without the actuator limit falls from 2.0e9 to 78 and the real limited plant from 1936 to 13.8, so the twin is far too optimistic at low noise">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Saturation twin: mean steps to loss of control vs noise sd</text>
<line x1="64" x2="624" y1="313.7" y2="313.7" stroke="#ddd"/><text x="58" y="317.7" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="284.4" y2="284.4" stroke="#ddd"/><text x="58" y="288.4" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="255.1" y2="255.1" stroke="#ddd"/><text x="58" y="259.1" text-anchor="end" font-family="sans-serif" font-size="11">1000</text>
<line x1="64" x2="624" y1="225.8" y2="225.8" stroke="#ddd"/><text x="58" y="229.8" text-anchor="end" font-family="sans-serif" font-size="11">10000</text>
<line x1="64" x2="624" y1="196.5" y2="196.5" stroke="#ddd"/><text x="58" y="200.5" text-anchor="end" font-family="sans-serif" font-size="11">100000</text>
<line x1="64" x2="624" y1="167.2" y2="167.2" stroke="#ddd"/><text x="58" y="171.2" text-anchor="end" font-family="sans-serif" font-size="11">1e+06</text>
<line x1="64" x2="624" y1="137.9" y2="137.9" stroke="#ddd"/><text x="58" y="141.9" text-anchor="end" font-family="sans-serif" font-size="11">1e+07</text>
<line x1="64" x2="624" y1="108.6" y2="108.6" stroke="#ddd"/><text x="58" y="112.6" text-anchor="end" font-family="sans-serif" font-size="11">1e+08</text>
<line x1="64" x2="624" y1="79.3" y2="79.3" stroke="#ddd"/><text x="58" y="83.3" text-anchor="end" font-family="sans-serif" font-size="11">1e+09</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.8</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.2</text>
<text x="390.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1.5</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">noise sd s</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">mean steps to loss of control</text>
<polyline points="64.0,70.4 157.3,161.7 250.7,212.0 390.7,253.9 624.0,287.6" fill="none" stroke="#c0392b" stroke-width="2"/>
