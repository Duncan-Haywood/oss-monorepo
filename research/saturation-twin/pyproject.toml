[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saturation-twin"
version = "0.1.0"
description = "A linear-actuator twin of a saturating unstable plant: exact mean time to loss of control on the real plant versus the twin, and where the twin-tuned gain stops being best"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
