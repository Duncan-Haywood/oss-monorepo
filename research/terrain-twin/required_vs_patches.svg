<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the stopping distance real terrain needs for delta=0.001, in units of d0, against the number of friction patches j spanned: it falls from 9.33 at j=1 to 1.05 at j=1000, where it equals what the n=1000 twin certifies">
