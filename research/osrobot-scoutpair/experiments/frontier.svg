<circle cx="60.0" cy="150.0" r="3.5" fill="#1b6ca8"/>
<circle cx="60.0" cy="176.5" r="3.5" fill="#1b6ca8"/>
<circle cx="60.0" cy="211.7" r="3.5" fill="#1b6ca8"/>
<text x="574" y="56" text-anchor="end" fill="#1b6ca8">one robot, inline (speed 0.5 to 3 m/s)</text>
<polyline points="119.1,138.5 90.7,189.5 80.8,220.9 73.1,251.2 68.8,265.8 66.6,269.2" fill="none" stroke="#c0392b" stroke-width="2"/>
