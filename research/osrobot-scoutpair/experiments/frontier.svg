<text x="574" y="72" text-anchor="end" fill="#c0392b">scout + treater, 3 m swath (scout 1 to 12 m/s)</text>
<polyline points="399.4,100.6 232.4,138.5 148.7,189.5" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="399.4" cy="100.6" r="3.5" fill="#2e8b57"/>
<circle cx="232.4" cy="138.5" r="3.5" fill="#2e8b57"/>
<circle cx="148.7" cy="189.5" r="3.5" fill="#2e8b57"/>
<text x="574" y="88" text-anchor="end" fill="#2e8b57">scout + treater, 1 m swath (scout 0.5 to 2 m/s)</text>
