<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="sans-serif" font-size="12" role="img" aria-label="Share of weeds killed against total minutes for one inline robot and for a scout plus a ground treater">
<rect width="100%" height="100%" fill="white"/>
<text x="300.0" y="20" text-anchor="middle" font-size="14">Weeds killed against total minutes (mean of 30 fields)</text>
<line x1="60" y1="270" x2="580" y2="270" stroke="#999"/><line x1="60" y1="40" x2="60" y2="270" stroke="#999"/>
<text x="60" y="286" text-anchor="middle">0</text>
<text x="169" y="286" text-anchor="middle">20</text>
<text x="279" y="286" text-anchor="middle">40</text>
<text x="388" y="286" text-anchor="middle">60</text>
<text x="498" y="286" text-anchor="middle">80</text>
<text x="54" y="274" text-anchor="end">0.0</text>
<text x="54" y="197" text-anchor="end">0.2</text>
<text x="54" y="121" text-anchor="end">0.4</text>
<text x="54" y="44" text-anchor="end">0.6</text>
<text x="320.0" y="304" text-anchor="middle">total minutes (scout flight + ground robot, no overlap)</text>
