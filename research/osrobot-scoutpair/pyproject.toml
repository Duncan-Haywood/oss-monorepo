[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-scoutpair"
version = "0.1.0"
description = "Does a fast scout platform plus a ground treater beat one inline weeding robot, and does a mud-aware tour matter?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
