[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-ghostedge"
version = "0.1.0"
description = "Layered sub-pixel coverage model for the edge ring of a moving subject in a burst merge"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
