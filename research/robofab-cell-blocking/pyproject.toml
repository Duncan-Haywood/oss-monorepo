[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-cell-blocking"
version = "0.1.0"
description = "Can a blocking-aware correction to mean value analysis predict the held-printer robot cell across loads?"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
