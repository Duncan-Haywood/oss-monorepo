[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-uavcal"
version = "0.1.0"
description = "Checks the osrobot-uav multirotor energy model against published battery, mass and endurance figures of three real aircraft"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
