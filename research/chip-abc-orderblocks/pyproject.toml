[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-abc-orderblocks"
version = "0.1.0"
description = "Do the blocks of a carry-select adder share a+b independently under mixed operand orders?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
