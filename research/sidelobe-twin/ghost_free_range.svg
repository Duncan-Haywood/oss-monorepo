<circle cx="437.3" cy="241.3" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="226.8" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">rect</text>
<polyline points="64.0,182.5 250.7,157.5 437.3,140.2 624.0,125.8" fill="none" stroke="#1f6fb2" stroke-width="2"/>
