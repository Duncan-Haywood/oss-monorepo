<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the largest strong-target SNR in dB whose peak-sidelobe ghost stays under a false-alarm limit, against that limit from 1e-5 to 1e-2, for rectangular, Hann and Hamming windows; Hamming is highest, about 39 to 50 dB, and rectangular lowest, about 8 to 19 dB">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Sidelobe twin: largest ghost-free strong-target SNR</text>
