<line x1="64" x2="624" y1="273.4" y2="273.4" stroke="#ddd"/><text x="58" y="277.4" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="222.8" y2="222.8" stroke="#ddd"/><text x="58" y="226.8" text-anchor="end" font-family="sans-serif" font-size="11">20</text>
<line x1="64" x2="624" y1="172.2" y2="172.2" stroke="#ddd"/><text x="58" y="176.2" text-anchor="end" font-family="sans-serif" font-size="11">30</text>
<line x1="64" x2="624" y1="121.5" y2="121.5" stroke="#ddd"/><text x="58" y="125.5" text-anchor="end" font-family="sans-serif" font-size="11">40</text>
<line x1="64" x2="624" y1="70.9" y2="70.9" stroke="#ddd"/><text x="58" y="74.9" text-anchor="end" font-family="sans-serif" font-size="11">50</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1e-05</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.0001</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.001</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">allowed ghost Pfa (log scale)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">ghost-free SNR (dB)</text>
