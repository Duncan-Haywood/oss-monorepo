<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of synthesised area in square micrometres against hidden width 8 to 64 for 2, 3, 4 and 8-bit weights; area grows roughly linearly with width and 8-bit weights add about 3,000 square micrometres over 4-bit">
