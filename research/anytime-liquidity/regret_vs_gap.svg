<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Regret of the market maker against the best outcome for four gap sizes: self-tuning liquidity has lower regret than the fixed square-root schedule at every gap">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Regret vs gap: sqrt-liquidity vs self-tuning liquidity (stylised simulation)</text>
<line x1="64" x2="624" y1="328.0" y2="328.0" stroke="#ddd"/><text x="58" y="332.0" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<line x1="64" x2="624" y1="202.8" y2="202.8" stroke="#ddd"/><text x="58" y="206.8" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="77.7" y2="77.7" stroke="#ddd"/><text x="58" y="81.7" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="134.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="274.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.05</text>
<text x="414.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="554.0" y="344" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">gap between best and second-best outcome</text>
<text x="14" y="184.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 184.0)">regret (log scale)</text>
<polyline fill="none" stroke="#c0392b" stroke-width="2" points="134.0,76.5 274.0,153.7 414.0,224.3 554.0,283.4"/>
<circle cx="134.0" cy="76.5" r="3" fill="#c0392b"/>
<circle cx="274.0" cy="153.7" r="3" fill="#c0392b"/>
<circle cx="414.0" cy="224.3" r="3" fill="#c0392b"/>
<circle cx="554.0" cy="283.4" r="3" fill="#c0392b"/>
<line x1="390" x2="414" y1="74" y2="74" stroke="#c0392b" stroke-width="2"/><text x="420" y="78" font-family="sans-serif" font-size="11">c*sqrt(t) liquidity</text>
<polyline fill="none" stroke="#1f6fb2" stroke-width="2" points="134.0,79.9 274.0,170.4 414.0,239.2 554.0,297.6"/>
<circle cx="134.0" cy="79.9" r="3" fill="#1f6fb2"/>
<circle cx="274.0" cy="170.4" r="3" fill="#1f6fb2"/>
<circle cx="414.0" cy="239.2" r="3" fill="#1f6fb2"/>
<circle cx="554.0" cy="297.6" r="3" fill="#1f6fb2"/>
<line x1="390" x2="414" y1="90" y2="90" stroke="#1f6fb2" stroke-width="2"/><text x="420" y="94" font-family="sans-serif" font-size="11">self-tuning (AdaHedge)</text>
</svg>
