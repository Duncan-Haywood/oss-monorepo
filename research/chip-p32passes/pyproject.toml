[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-p32passes"
version = "0.1.0"
description = "Which Yosys pass between coarse and fine flips the P=32 vs P=16 MAC-engine cell gap?"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
