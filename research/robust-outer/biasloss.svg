<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the bias loss of a median outer loop with two attackers among fifteen workers against the sync interval H: the loss falls from about 0.07 at H=1 to about 0.002 at H=256">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Robust outer loop: bias loss vs sync interval H</text>
<line x1="64" x2="624" y1="199.8" y2="199.8" stroke="#ddd"/><text x="58" y="203.8" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="296.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="529.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">sync interval H</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">bias loss</text>
<polyline points="64.0,70.4 134.0,115.6 204.0,160.7 344.0,247.9 484.0,304.6 624.0,309.6" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<circle cx="134.0" cy="115.6" r="3" fill="#c0392b"/>
<circle cx="204.0" cy="160.7" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="247.9" r="3" fill="#c0392b"/>
<circle cx="484.0" cy="304.6" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">bias loss (median, N=15, f=2)</text>
</svg>
