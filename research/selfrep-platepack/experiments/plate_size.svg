<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of effective doubling time of a printer fleet against parts per print plate for four plate changeover times; with changeover the best plate holds several parts, without it one part per plate is best">
