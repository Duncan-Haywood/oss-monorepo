[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-twinfidelity"
version = "0.1.0"
description = "Does the society-plaza conclusion survive a more humanlike simulated crowd? Heterogeneous speeds, reaction delay and stubborn walkers"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
