[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robofab-edgeconv"
version = "0.1.0"
description = "Node-count convergence of the time-optimal edge over a tuned trapezoid in the carry (stylised)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
