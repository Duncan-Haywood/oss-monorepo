[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-dr"
version = "0.1.0"
description = "Dead-reckoning drift of an underwater vehicle with a DVL and a heading reference, and how often it must surface for a fix"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
