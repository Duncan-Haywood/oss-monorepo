[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeping-incentives"
version = "0.1.0"
description = "Strategic sleeping in wealth ledgers: post-hoc wake declarations earn wealth without saving loss; ex-ante commitment pays exactly for leave-one-out savings"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
