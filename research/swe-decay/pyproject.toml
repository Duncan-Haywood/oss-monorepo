[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-decay"
version = "0.1.0"
description = "Replays track-allocation policies when each track runs out of its best projects (sequential, no replacement)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
