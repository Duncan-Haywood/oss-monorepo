[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantized-reports"
version = "0.1.0"
description = "Finite-precision probability reports under proper scoring rules: regret, optimal grids, minifloat formats"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
