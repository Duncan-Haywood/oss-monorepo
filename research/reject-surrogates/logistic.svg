<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of the ratio of decision regret to surrogate regret for the logistic surrogate, against the distance delta of the class probability above the reject cutoff: the ratio grows roughly as 0.375 over delta, from 4 at delta 0.1 to 375 at delta 0.001, so no linear transfer bound exists">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Reject-surrogates: logistic regret ratio</text>
<line x1="64" x2="624" y1="261.4" y2="261.4" stroke="#ddd"/><text x="58" y="265.4" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="140.0" y2="140.0" stroke="#ddd"/><text x="58" y="144.0" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.001</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">delta above the reject cutoff</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">regret / surrogate regret</text>
<polyline points="624.0,309.6 477.6,248.4 344.0,191.3 197.6,128.2 64.0,70.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="624.0" cy="309.6" r="3" fill="#c0392b"/>
<circle cx="477.6" cy="248.4" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="191.3" r="3" fill="#c0392b"/>
<circle cx="197.6" cy="128.2" r="3" fill="#c0392b"/>
<circle cx="64.0" cy="70.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">logistic surrogate</text>
</svg>
