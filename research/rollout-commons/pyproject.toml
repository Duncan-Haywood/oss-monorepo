[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rollout-commons"
version = "0.1.0"
description = "Rollout sharing in decentralised RL post-training as a public-goods game: free-riding, price of anarchy, Pigouvian matching subsidies and audit deterrence"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
