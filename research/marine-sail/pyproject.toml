[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-sail"
version = "0.1.0"
description = "Polar diagram and isochrone routing for a small wing-sail drone: what tacking costs"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
