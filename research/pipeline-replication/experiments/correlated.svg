<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-x line plot of the probability that a 48-stage pipeline with no skip budget completes against the correlated-outage level rho: it falls from 0.995 at rho=0.0001 to about 0.62 at rho=0.01 whatever the replication">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Pipeline: success without skips vs correlated outages</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.2" y2="273.2" stroke="#ddd"/><text x="58" y="277.2" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="222.4" y2="222.4" stroke="#ddd"/><text x="58" y="226.4" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="171.6" y2="171.6" stroke="#ddd"/><text x="58" y="175.6" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="120.8" y2="120.8" stroke="#ddd"/><text x="58" y="124.8" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="70.0" y2="70.0" stroke="#ddd"/><text x="58" y="74.0" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.0001</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.001</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.01</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">correlated-outage level rho</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">success with s=0 (floor)</text>
<polyline points="64.0,71.2 344.0,81.9 539.7,124.3 624.0,167.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="81.9" r="3" fill="#c0392b"/>
<circle cx="539.7" cy="124.3" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="167.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">floor success</text>
</svg>
