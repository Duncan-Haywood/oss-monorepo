[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-screen"
version = "0.1.0"
description = "A surrogate screen for the cell-count objective in a three-objective chip-design search, charged per synthesis"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
