[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osrobot-plate"
version = "0.1.0"
description = "Filling a 96-well plate: gantry against two-link arm, 1 against 8 channels, and well order (stylised, stdlib only)"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
