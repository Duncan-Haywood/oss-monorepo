[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-verifier-audit"
version = "0.1.0"
description = "Many verifiers, one cheating solver: audit equilibrium, reward splitting and learning dynamics"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
