[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensing-scan2cad"
version = "0.1.0"
description = "From a noisy point-cloud scan of a plate with two holes to parametric dimensions: RANSAC planes, constrained circle fits, dimensional error against scan noise, point count and scale error"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
