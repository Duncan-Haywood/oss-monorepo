<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the fraction of synthetic plate scans that fit within 0.2 mm on all five dimensions against the number of scan points, for three noise levels; low noise is always usable, 0.5 mm noise never exceeds 0.5">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Scans within 0.2 mm on every dimension, against point count</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="273.4" y2="273.4" stroke="#ddd"/><text x="58" y="277.4" text-anchor="end" font-family="sans-serif" font-size="11">0.2</text>
<line x1="64" x2="624" y1="222.9" y2="222.9" stroke="#ddd"/><text x="58" y="226.9" text-anchor="end" font-family="sans-serif" font-size="11">0.4</text>
<line x1="64" x2="624" y1="172.3" y2="172.3" stroke="#ddd"/><text x="58" y="176.3" text-anchor="end" font-family="sans-serif" font-size="11">0.6</text>
<line x1="64" x2="624" y1="121.7" y2="121.7" stroke="#ddd"/><text x="58" y="125.7" text-anchor="end" font-family="sans-serif" font-size="11">0.8</text>
<line x1="64" x2="624" y1="71.2" y2="71.2" stroke="#ddd"/><text x="58" y="75.2" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2000</text>
<text x="203.1" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">5000</text>
<text x="413.5" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">20000</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">80000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">scan points</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">usable fraction</text>
<polyline points="64.0,71.2 203.1,71.2 413.5,71.2 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="203.1" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="413.5" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">noise 0.1 mm</text>
<polyline points="64.0,71.2 203.1,71.2 413.5,71.2 624.0,71.2" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="203.1" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="413.5" cy="71.2" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="71.2" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">noise 0.2 mm</text>
<polyline points="64.0,324.0 203.1,260.8 413.5,222.9 624.0,197.6" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="324.0" r="3" fill="#2e8b57"/>
<circle cx="203.1" cy="260.8" r="3" fill="#2e8b57"/>
<circle cx="413.5" cy="222.9" r="3" fill="#2e8b57"/>
<circle cx="624.0" cy="197.6" r="3" fill="#2e8b57"/>
<rect x="404" y="32" width="14" height="10" fill="#2e8b57"/><text x="424" y="41" font-family="sans-serif" font-size="11">noise 0.5 mm</text>
</svg>
