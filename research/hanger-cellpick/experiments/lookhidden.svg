<line x1="64" x2="624" y1="187.7" y2="187.7" stroke="#ddd"/><text x="58" y="191.7" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="119.6" y2="119.6" stroke="#ddd"/><text x="58" y="123.6" text-anchor="end" font-family="sans-serif" font-size="11">150</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="157.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">3</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">6</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">look time before each aimed grasp (s, assumed)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">garments hung or folded per hour (one arm)</text>
