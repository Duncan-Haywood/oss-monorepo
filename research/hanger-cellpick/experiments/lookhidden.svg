<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of garments hung or folded per hour against the opening detector look time in seconds, one line for each share of garments with a hidden opening: output falls from about 185 per hour with no look and no hidden openings to about 100 with a 6 second look and 80 percent hidden">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">How much does a slower look cost a one-arm laundry cell?</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
