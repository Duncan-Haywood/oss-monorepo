<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Log-log line plot of heading standard deviation against time: the white-only twin keeps a square-root slope while the real gyro with bias random walk bends upward after about 87 s">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Gyro heading std: real vs white-noise-only twin</text>
<line x1="64" x2="624" y1="281.7" y2="281.7" stroke="#ddd"/><text x="58" y="285.7" text-anchor="end" font-family="sans-serif" font-size="11">0.01</text>
<line x1="64" x2="624" y1="188.9" y2="188.9" stroke="#ddd"/><text x="58" y="192.9" text-anchor="end" font-family="sans-serif" font-size="11">0.1</text>
<line x1="64" x2="624" y1="96.1" y2="96.1" stroke="#ddd"/><text x="58" y="100.1" text-anchor="end" font-family="sans-serif" font-size="11">1</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="250.7" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">10</text>
<text x="437.3" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">100</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1000</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">time t (s)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">heading std (deg)</text>
<polyline points="64.0,308.8 250.7,263.0 437.3,199.5 526.4,142.4 624.0,70.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="308.8" r="3" fill="#c0392b"/>
<circle cx="250.7" cy="263.0" r="3" fill="#c0392b"/>
<circle cx="437.3" cy="199.5" r="3" fill="#c0392b"/>
<circle cx="526.4" cy="142.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="70.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">real (Monte Carlo)</text>
<polyline points="64.0,309.6 250.7,263.3 437.3,216.8 526.4,194.7 624.0,170.4" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="309.6" r="3" fill="#1f6fb2"/>
<circle cx="250.7" cy="263.3" r="3" fill="#1f6fb2"/>
<circle cx="437.3" cy="216.8" r="3" fill="#1f6fb2"/>
<circle cx="526.4" cy="194.7" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="170.4" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">white-only twin</text>
</svg>
