[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simdesign-rank"
version = "0.1.0"
description = "Do cheap beam and 2D models rank candidate cantilever designs like 3D finite elements?"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-fem", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
