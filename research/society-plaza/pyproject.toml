[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "society-plaza"
version = "0.1.0"
description = "Robots that keep one passing side among people in a social-force corridor: what they cost people and whether they flip the crowd"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
