[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-deviations"
version = "0.1.0"
description = "Do agent runs that record a deviation from the brief cost more or end worse? Stratified permutation tests"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
