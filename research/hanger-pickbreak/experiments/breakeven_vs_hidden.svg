<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of the break-even detector time in seconds per pick against the share of garments whose opening is hidden by the garment: about 15 s with none hidden, 9 s at 40 percent, falling to 0 when all are hidden">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">How long may an opening detector take per pick before a blind pinch is faster?</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="241.6" y2="241.6" stroke="#ddd"/><text x="58" y="245.6" text-anchor="end" font-family="sans-serif" font-size="11">5</text>
<line x1="64" x2="624" y1="159.2" y2="159.2" stroke="#ddd"/><text x="58" y="163.2" text-anchor="end" font-family="sans-serif" font-size="11">10</text>
<line x1="64" x2="624" y1="76.8" y2="76.8" stroke="#ddd"/><text x="58" y="80.8" text-anchor="end" font-family="sans-serif" font-size="11">15</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.2</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.4</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.6</text>
<text x="512.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.8</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">share of garments with the opening hidden</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">break-even detector time (s per pick, assumed times)</text>
<polyline points="64.0,71.2 176.0,120.6 288.0,171.7 400.0,221.0 512.0,272.4 624.0,324.0" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="71.2" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="120.6" r="3" fill="#c0392b"/>
<circle cx="288.0" cy="171.7" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="221.0" r="3" fill="#c0392b"/>
<circle cx="512.0" cy="272.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="324.0" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">break-even look time T*</text>
</svg>
