<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of hours to grow a printer fleet from 1 to 64 under three job-assignment policies; the focus policy is about 40 hours ahead at 64 printers, whole-copy and spread coincide">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Hours to reach a fleet size, no import limit (stylised, no noise)</text>
<line x1="64" x2="624" y1="324.0" y2="324.0" stroke="#ddd"/><text x="58" y="328.0" text-anchor="end" font-family="sans-serif" font-size="11">0</text>
<line x1="64" x2="624" y1="281.9" y2="281.9" stroke="#ddd"/><text x="58" y="285.9" text-anchor="end" font-family="sans-serif" font-size="11">50</text>
<line x1="64" x2="624" y1="239.7" y2="239.7" stroke="#ddd"/><text x="58" y="243.7" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="197.6" y2="197.6" stroke="#ddd"/><text x="58" y="201.6" text-anchor="end" font-family="sans-serif" font-size="11">150</text>
<line x1="64" x2="624" y1="155.4" y2="155.4" stroke="#ddd"/><text x="58" y="159.4" text-anchor="end" font-family="sans-serif" font-size="11">200</text>
<line x1="64" x2="624" y1="113.3" y2="113.3" stroke="#ddd"/><text x="58" y="117.3" text-anchor="end" font-family="sans-serif" font-size="11">250</text>
<line x1="64" x2="624" y1="71.2" y2="71.2" stroke="#ddd"/><text x="58" y="75.2" text-anchor="end" font-family="sans-serif" font-size="11">300</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
<text x="176.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">4</text>
<text x="288.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">8</text>
<text x="400.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">16</text>
<text x="512.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">32</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">64</text>
<text x="344.0" y="368" text-anchor="middle" font-family="sans-serif" font-size="12">fleet size (printers)</text>
<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">hours</text>
<polyline points="64.0,281.9 176.0,239.7 288.0,197.6 400.0,155.4 512.0,113.3 624.0,71.2" fill="none" stroke="#c0392b" stroke-width="2"/>
<circle cx="64.0" cy="281.9" r="3" fill="#c0392b"/>
<circle cx="176.0" cy="239.7" r="3" fill="#c0392b"/>
<circle cx="288.0" cy="197.6" r="3" fill="#c0392b"/>
<circle cx="400.0" cy="155.4" r="3" fill="#c0392b"/>
<circle cx="512.0" cy="113.3" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="71.2" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">whole copy per printer</text>
<polyline points="64.0,281.9 176.0,242.3 288.0,206.0 400.0,172.3 512.0,138.6 624.0,105.7" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<circle cx="64.0" cy="281.9" r="3" fill="#1f6fb2"/>
<circle cx="176.0" cy="242.3" r="3" fill="#1f6fb2"/>
<circle cx="288.0" cy="206.0" r="3" fill="#1f6fb2"/>
<circle cx="400.0" cy="172.3" r="3" fill="#1f6fb2"/>
<circle cx="512.0" cy="138.6" r="3" fill="#1f6fb2"/>
<circle cx="624.0" cy="105.7" r="3" fill="#1f6fb2"/>
<rect x="234" y="32" width="14" height="10" fill="#1f6fb2"/><text x="254" y="41" font-family="sans-serif" font-size="11">pooled, focus</text>
<polyline points="64.0,281.9 176.0,239.7 288.0,197.6 400.0,155.4 512.0,113.3 624.0,71.2" fill="none" stroke="#2e8b57" stroke-width="2"/>
<circle cx="64.0" cy="281.9" r="3" fill="#2e8b57"/>
<circle cx="176.0" cy="239.7" r="3" fill="#2e8b57"/>
