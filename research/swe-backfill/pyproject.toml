[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-backfill"
version = "0.1.0"
description = "Backfill the agent loop's output from git history: projects created, follow-up share, correction commits and run-log coverage"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
