[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selfrep-recyclers"
version = "0.1.0"
description = "Payback of the recycling machines of a self-replicating printer shop, with their own part lists"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
