<circle cx="204.0" cy="256.4" r="3" fill="#c0392b"/>
<circle cx="344.0" cy="256.4" r="3" fill="#c0392b"/>
<circle cx="624.0" cy="256.4" r="3" fill="#c0392b"/>
<rect x="64" y="32" width="14" height="10" fill="#c0392b"/><text x="84" y="41" font-family="sans-serif" font-size="11">phi = 0.3</text>
