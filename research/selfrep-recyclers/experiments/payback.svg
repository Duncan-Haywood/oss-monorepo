<text x="14" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12" transform="rotate(-90 14 190.0)">payback (copies)</text>
<polyline points="64.0,71.2 204.0,256.4 344.0,256.4 624.0,256.4" fill="none" stroke="#c0392b" stroke-width="2"/>
