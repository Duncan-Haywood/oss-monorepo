<line x1="64" x2="624" y1="193.2" y2="193.2" stroke="#ddd"/><text x="58" y="197.2" text-anchor="end" font-family="sans-serif" font-size="11">60</text>
<line x1="64" x2="624" y1="149.6" y2="149.6" stroke="#ddd"/><text x="58" y="153.6" text-anchor="end" font-family="sans-serif" font-size="11">80</text>
<line x1="64" x2="624" y1="106.0" y2="106.0" stroke="#ddd"/><text x="58" y="110.0" text-anchor="end" font-family="sans-serif" font-size="11">100</text>
<line x1="64" x2="624" y1="62.5" y2="62.5" stroke="#ddd"/><text x="58" y="66.5" text-anchor="end" font-family="sans-serif" font-size="11">120</text>
<text x="64.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0</text>
<text x="204.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">0.5</text>
<text x="344.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">1</text>
<text x="624.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="11">2</text>
