<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Line plot of payback in copies against retired plastic per copy for shredder plus extruder in a printer, CNC and laser shop, for two values of the recovery fraction phi: payback falls from 116 copies with no retired plastic to 31 or 12 copies at one or more units, depending on phi">
<rect width="640" height="380" fill="#fff"/>
<text x="320.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14">Selfrep-recyclers: payback vs retired plastic</text>
