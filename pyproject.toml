[project]
name = "retail-pilot-intel"
version = "0.1.0"
description = "Edge-first retail analytics for small-format pilot stores (GDPR-aware)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["edge*", "pos*", "analytics*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
