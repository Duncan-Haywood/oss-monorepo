[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shootflow"
version = "0.1.0"
description = "Safe ingest and high-throughput media production planning for photographers and videographers."
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
