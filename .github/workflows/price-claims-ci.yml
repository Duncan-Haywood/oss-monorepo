name: Price claims

# Every paid product sells from one catalog, ventures/<v>/apps/<app>/src/shared/plans.ts, and its
# prices are retyped by hand into the marketing site, llms.txt, READMEs, VENTURE.yaml and customer
# posts (PayApps' Crew price sat in 19 shipped files on 2026-11-28). This gate fails when a line
# pairs a plan's name with a dollar figure the catalog does not charge, so a price change cannot
# leave pages promising a price checkout does not charge (prompts/goals.md, "Honest marketing").
# Its first run found the CMMC site's pre-launch pricing page and pricing doc still on the
# 2026-11-24 proposal ($39/$149/$249) after the app's catalog moved to free/$249/$399.
# Pure Python standard library, no network, no secrets, a second or two.

on:
  pull_request:
    paths:
      - "ventures/**"
      - "docs/posts/**"
      - "platform/ci/check_price_claims.py"
      - "platform/ci/test_check_price_claims.py"
      - ".github/workflows/price-claims-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/**/src/shared/plans.ts"
      - "platform/ci/check_price_claims.py"
      - ".github/workflows/price-claims-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-claims-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  price-claims:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          # The checker reads text in three places: platform/ci/ (itself and
          # repo_files.py), docs/posts/, and the ventures that carry a plan
          # catalog (ventures/<v>/apps/*/src/shared/plans.ts). This first pass
          # fetches only the first two plus every catalog; the next step widens
          # it to those ventures. 583 MB of blobs became about 73 MB on
          # 2026-11-28, same findings (docs/history/ci-perf-2026-11-28-price-claims-sparse.md).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /platform/ci/
            /docs/posts/
            /ventures/*/apps/*/src/shared/plans.ts
            !*.mp3
            !*.mp4
            !*.gz
            !*.zip
            !*.png
            !*.jpg
            !*.webp
            !*.gif
            !*.ico
            !*.woff2
            !*.ttf
            !*.wasm
            !*.pdf
      # Widen to every venture with a catalog, found from the tree itself, so a
      # new paid product is scanned with nothing to wire up. Fails when it finds
      # none, so a broken glob cannot turn the gate into a silent pass.
      - name: Check out each venture with a plan catalog
        run: |
          set -euo pipefail
          ventures=$(git ls-files 'ventures/*/apps/*/src/shared/plans.ts' | cut -d/ -f2 | sort -u)
          if [ -z "$ventures" ]; then echo "no plans.ts found under ventures/" >&2; exit 1; fi
          echo "ventures with a catalog:" $ventures
          patterns=(/platform/ci/ /docs/posts/)
          for v in $ventures; do patterns+=("/ventures/$v/"); done
          for e in mp3 mp4 gz zip png jpg webp gif ico woff2 ttf wasm pdf; do patterns+=("!*.$e"); done
          git sparse-checkout set --no-cone "${patterns[@]}"
      - name: Checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_price_claims
      - name: Every stated plan price matches its plans.ts
        run: python3 platform/ci/check_price_claims.py
