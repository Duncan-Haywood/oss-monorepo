name: podcast-feed-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared classification
# logic; `feed-parser.mjs` is the hand-rolled RSS/iTunes-namespace parser;
# `fetch-feed.mjs` is the real network layer (tested against a local
# loopback server only); `check.mjs` is the CLI entry point; `page.test.mjs`
# covers all three pages' structure and disclaimers. Keep all six covered
# independently of the portfolio-wide validation workflow, which only checks
# published pages and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's `*.test.mjs`
# files land -- the same hole `redirect-chain-check-ci.yml`,
# `sitemap-lastmod-freshness-check-ci.yml`, and `hreflang-reciprocity-check-ci.yml`
# already document.
on:
  pull_request:
    paths:
      - "ventures/podcast-feed-check/**"
      - ".github/workflows/podcast-feed-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/podcast-feed-check/**"
      - ".github/workflows/podcast-feed-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podcast-feed-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/podcast-feed-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run parser, engine, network layer, CLI, usage, and page-wiring tests
        run: node --test feed-parser.test.mjs engine.test.mjs fetch-feed.test.mjs check.test.mjs usage.test.mjs page.test.mjs
