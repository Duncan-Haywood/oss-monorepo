name: ig-media-pipeline CI

on:
  pull_request:
    paths:
      - "ventures/ig-media-pipeline/**"
      - ".github/workflows/ig-media-pipeline-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ig-media-pipeline/**"
      - ".github/workflows/ig-media-pipeline-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ig-media-pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/ig-media-pipeline

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e . pytest
      - run: python3 -m pytest -q
