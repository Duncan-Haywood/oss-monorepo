name: photos-import-tools CI

on:
  pull_request:
    paths:
      - "ventures/photos-import-tools/**"
      - ".github/workflows/photos-import-tools-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/photos-import-tools/**"
      - ".github/workflows/photos-import-tools-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/photos-import-tools

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python3 -m pytest tests/ -q

  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.8 mypy==1.19.1
      - run: ruff check .
      - run: mypy .
