name: estate-tax-exemption-calculator CI

# Test runner for the browser-local estate-tax-exemption-calculator. The
# product is static ES modules with no build step and no dependencies, so
# this does no more than a contributor runs locally: `node --test`. It
# publishes nothing, registers nothing, and spends no API budget -- it is
# not the unattended-automation kind of workflow CLAUDE.md gates.
#
# Same shape as charitable-deduction-calculator-ci.yml.

on:
  pull_request:
    paths:
      - "ventures/estate-tax-exemption-calculator/**"
      - ".github/workflows/estate-tax-exemption-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/estate-tax-exemption-calculator/**"
      - ".github/workflows/estate-tax-exemption-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: estate-tax-exemption-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/estate-tax-exemption-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. Checked here so
      # the venture that needs the clause is the one that goes red, before the
      # merge, rather than the Pages job on main after it.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs estate-tax-exemption-calculator
