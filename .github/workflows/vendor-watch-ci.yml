name: vendor-watch CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ventures/vendor-watch/**"
      - ".github/workflows/vendor-watch-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/vendor-watch/**"
      - ".github/workflows/vendor-watch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/vendor-watch

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventures/vendor-watch/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
