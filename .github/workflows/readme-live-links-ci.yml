name: README live links

# Fails a pull request that adds a venture or research README with no link to
# its live Pages page (SEO: the README is what GitHub and search engines index
# first), or that titles itself with its bare slug instead of what it does.
# 3 research READMEs had drifted before this ran anywhere. Reads tracked files
# only; publishes nothing, pushes nothing, calls no paid API.

on:
  pull_request:
    paths: ["ventures/*/README.md", "research/README.md", "research/*/README.md", "research/_homepage/projects.json", "research/*/project.json", "research/_homepage/registry.py", "platform/ci/research_live_links.py", "platform/ci/venture_live_links.py", "platform/ci/readme_titles.py", "ventures/*/index.html", ".github/workflows/readme-live-links-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run; `main`
# keeps every run (platform/ci/validate_workflows.py, invariant 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The three scripts read README.md, index.html and project.json files
          # and the registry; nothing else (P048).
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /platform/ci/
            /ventures/*/README.md
            /ventures/*/index.html
            /research/README.md
            /research/*/README.md
            /research/*/project.json
            /research/_homepage/
            /pyproject.toml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Research READMEs link their live page
        run: python3 platform/ci/research_live_links.py

      - name: Venture READMEs link their live page
        run: python3 platform/ci/venture_live_links.py

      - name: Venture and research READMEs carry a real title, not the slug
        run: python3 platform/ci/readme_titles.py

      - name: Guard unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_research_live_links test_venture_live_links test_readme_titles
