name: faire-wholesale-calculator CI

# Static browser-local calculator: plain ES modules, node --test, no
# package.json, no dependencies, no network.

on:
  pull_request:
    paths:
      - "ventures/faire-wholesale-calculator/**"
      - ".github/workflows/faire-wholesale-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/faire-wholesale-calculator/**"
      - ".github/workflows/faire-wholesale-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faire-wholesale-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/faire-wholesale-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
