# Builds the portfolio's public site — every static, browser-runnable venture
# surface assembled into one GitHub Pages deployment.
#
# The build runs on every push to `main` so a broken site is caught at merge
# time, whether or not publishing is switched on. Publishing itself is gated on
# the owner-set `GITHUB_PAGES_ENABLED` variable, because `actions/deploy-pages`
# 404s until Pages is enabled in repository settings and would otherwise turn
# this workflow red on every merge.
#
# This is the workflow that owner flip publishes. See portfolio/DIRECTION.md
# ("Current priority: deploy what is already built") and platform/pages/README.md.
name: Portfolio Pages

on:
  push:
    branches: [main]
    paths:
      - "ventures/**"
      - "platform/pages/**"
      - ".github/workflows/portfolio-pages.yml"
  pull_request:
    paths:
      - "ventures/**"
      - "platform/pages/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

# GitHub serves one Pages site per repository, so two deployments must never
# race. `cancel-in-progress: false` lets an in-flight publish finish rather
# than leaving the live site half-swapped.
concurrency:
  group: portfolio-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the site builder
        run: node --test build.test.mjs
        working-directory: platform/pages

      - name: Build the site
        env:
          # Owner-overridable (a custom domain, say). The default is where
          # GitHub serves a project Pages site for this repository.
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: node build.mjs --out=dist
        working-directory: platform/pages

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: platform/pages/dist

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.GITHUB_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # A green `deploy-pages` means the artifact was accepted, not that anyone
      # can open the site. Those differ: Pages can accept a deployment and
      # still serve a 404 while the first publish propagates, and a wrong
      # `base_url` produces a site that builds, deploys, and then serves
      # sitemaps and canonical tags pointing somewhere nobody can reach.
      #
      # This portfolio's whole current priority is a URL a stranger can open,
      # so the run should not go green on anything less than having opened it.
      # `--retry-all-errors` covers first-publish propagation; a persistent
      # failure here is a real one and should stay red.
      - name: Verify the public URL actually serves the site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          base="${PAGE_URL%/}"
          echo "Checking ${base}"
          fail=0
          for path in "/" "/ebay-fee-calculator/" "/sitemap.xml" "/robots.txt"; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' \
                     --retry 8 --retry-delay 15 --retry-all-errors \
                     "${base}${path}" || echo 000)
            echo "  ${code}  ${path}"
            [ "${code}" = "200" ] || fail=1
          done
          # Not just a 200 — the 200 has to be this site. A leftover
          # deployment from another workflow would answer just as happily.
          if ! curl -sS "${base}/" | grep -q 'portfolio-hub-usage\|free calculator'; then
            echo "  the hub responded, but not with the portfolio site"
            fail=1
          fi
          if [ "${fail}" -ne 0 ]; then
            echo "::error::Pages reported a successful deployment but the public URL does not serve the site."
            exit 1
          fi
          echo "Live and serving: ${base}/"
