# Builds the portfolio's public site — every static, browser-runnable venture
# surface assembled into one GitHub Pages deployment.
#
# The build runs on every push to `main` so a broken site is caught at merge
# time. Since the owner switched the Pages source to GitHub Actions
# (2026-10-20), every such push also deploys; `PAGES_ENABLED=false` pauses it.
# The gate used to be opt-in (`== 'true'`), from when `actions/deploy-pages`
# 404'd because Pages was not enabled yet; left that way after the switch, it
# skipped every deploy and the live site stopped updating.
#
# Not `GITHUB_PAGES_ENABLED`, which this workflow's own gate carried until
# found and fixed: GitHub rejects any Actions configuration-variable name that
# starts with `GITHUB_` (case-insensitive), reserved for GitHub's own use --
# see https://docs.github.com/en/actions/learn-github-actions/variables#naming-conventions-for-configuration-variables
# -- and enforced at creation time, so the owner could never actually have
# set it. `vars.GITHUB_PAGES_ENABLED` would always have read as unset,
# `deploy` would always have been skipped, and the "one flip" the decision
# queue and every doc pointed at would have silently done nothing. Confirmed
# with `actionlint`, which flags any `vars.GITHUB_*` / `secrets.GITHUB_*`
# reference for exactly this reason.
#
# This is the workflow that owner flip publishes. See portfolio/DIRECTION.md
# ("Deploy first (resolved)") and platform/pages/README.md.
name: Portfolio Pages

on:
  push:
    branches: [main]
    # Every merge to `main`, with no path filter (owner, 2026-10-20: "if
    # something is landing in main there is probably an update worth noting
    # in the ghp site and the site should be updated automatically"). The
    # filter this replaced listed site inputs by hand and kept falling behind
    # them: `docs/podcast/` (the episode audio and scripts) and research
    # READMEs were missing, so a merge could land with the live site still
    # serving the old copy. The site also shows what landed (the development
    # dashboard, the changelog), which every merge changes anyway. Runs on a
    # busy day queue rather than pile up: GitHub keeps one pending run per
    # concurrency group and drops the older pending ones, so the deploy always
    # catches up to the newest `main`.
  # The development dashboard's CI, review and branch numbers move without a
  # merge; refresh the site every three hours.
  schedule:
    - cron: "41 */3 * * *"
  pull_request:
    paths:
      - "ventures/**"
      - "platform/pages/**"
      # The writing section (platform/pages/writing.mjs) renders docs/posts/,
      # and loadPosts throws on a malformed post, so a post-only PR is a build input.
      - "docs/posts/**"
      - "docs/podcast/**"
      - "research/_homepage/**"
      - "research/README.md"
      - "research/*/app/**"
      - "platform/daily/**"
      - "platform/devstats/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

# One slot per ref, not one slot for the whole repository.
#
# This was a single global `portfolio-pages` group covering every run. The
# constraint it was written for is real but belongs to the deploy alone (see the
# `deploy` job below); applied workflow-wide it also made every pull request
# queue behind `main`. A calculator lands on `main` here most days — several an
# hour on a busy one — and GitHub cancels a *pending* run when a newer one
# queues behind it, so pull-request builds were being cancelled seconds after
# starting rather than ever reporting. PR #1755's first run was cancelled two
# seconds in, which is how this was found: a check that never runs is
# indistinguishable from one that has not finished, and neither is a green tick
# anyone can merge on.
concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Where the site is served (owner, 2026-10-29: moving from GitHub Pages to
  # Cloudflare). With the Cloudflare secrets set, the site is built for the
  # Cloudflare Worker's origin and deployed there, and GitHub Pages serves
  # redirect pages to it (platform/pages/redirect-stubs.mjs). Without them,
  # everything stays on GitHub Pages as before. A job-level `if:` cannot read
  # secrets, hence a job. `vars.PAGES_BASE_URL` still overrides the origin (a
  # custom domain, once its route is attached).
  gate:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions: {}
    timeout-minutes: 2
    outputs:
      cloudflare: ${{ steps.check.outputs.cloudflare }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - id: check
        env:
          CONFIGURED: ${{ (secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARERESTRICTEDAPIKEY) != '' && (secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID) != '' }}
          OVERRIDE: ${{ vars.PAGES_BASE_URL }}
          # The custom domain attached in platform/pages/cloudflare/wrangler.toml
          # (2026-10-30); the workers.dev address serves the same files.
          CLOUDFLARE_BASE: https://marisstella.app/
          GITHUB_PAGES_BASE: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          if [ "$CONFIGURED" = true ]; then cf=true; base="$CLOUDFLARE_BASE"; else cf=false; base="$GITHUB_PAGES_BASE"; fi
          base="${OVERRIDE:-$base}"
          echo "cloudflare=$cf" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Cloudflare: $cf; base URL: $base"

  # The test suites run beside the build, not before it. In series they took
  # 13-15 of the build job's 20 minutes, so on a busy day a slow runner hit
  # the cap mid-build and the run ended `cancelled` with nothing deployed
  # (2026-10-20: one green run in thirty on main). The deploy waits only for
  # the build and check.mjs on the built artifact; a red test job still fails
  # the run and the PR, which is where these suites gate.
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # A glob, not a list. The list named build and check only, so
      # `clauses.test.mjs` had never run here — a suite can be added beside the
      # thing it tests and silently not be CI's problem, which is the one way a
      # test file is worse than no test file.
      #
      # The suite builds the whole site several times, and the first build
      # draws about 1,200 share-card PNGs (45 of its 60 s). The deploy's
      # cache of those cards (the `build` job saves it) is restored here
      # read-only, so a card drawn the same way is copied, not drawn
      # (docs/history/pages-test-perf-2026-10-30-card-cache.md).
      - name: Day for the share-card cache
        id: cards
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the share cards
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/share-cards
          key: share-cards-${{ hashFiles('platform/pages/sharecard.mjs', 'platform/pages/fontraster.mjs', 'platform/pages/fonts/**') }}-${{ steps.cards.outputs.day }}
          restore-keys: |
            share-cards-${{ hashFiles('platform/pages/sharecard.mjs', 'platform/pages/fontraster.mjs', 'platform/pages/fonts/**') }}-

      - name: Test the site builder
        env:
          PAGES_CARD_CACHE: ${{ runner.temp }}/share-cards
        run: node --test "*.test.mjs" "cloudflare/*.test.mjs"
        working-directory: platform/pages

      # The dashboard and the daily brief are added to the artifact after
      # check.mjs, so their own suites are the only check they get.
      - name: Test the development dashboard and the daily brief
        run: node --test platform/devstats/*.test.mjs platform/daily/*.test.mjs

  build:
    needs: gate
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      # Read-only, for the development dashboard's PR, review and CI metrics.
      actions: read
      pull-requests: read
    # Builds and checks the whole 500+-page site artifact -- measured at 173s
    # on a recent PR. See hetzner-gitops-ci.yml's timeout-minutes addition for
    # why an unbounded job is worth capping on a metered-minutes account.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The engineering page's "landed on main" view and the changelog's
          # 14 days (~100-150 merges a day) read history. A pull request only
          # needs the build to pass, so it keeps the cheap depth-1 clone.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 3000 }}
          # Full blobs, not `filter: blob:none`: the daily brief's `--numstat`
          # makes git fetch every changed blob in its 14-day window commit by
          # commit, which was slower than this clone (measured 2026-10-24,
          # docs/history/pages-build-speed-2026-10-24.md).

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # "Build the daily brief" runs portfolio/ledger/decision_queue.py.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The development dashboard needs nothing from the site build, so it
      # starts first and finishes under it rather than after it (2026-10-24:
      # its API calls were 103 s of a 7-minute merge-to-live). It is written
      # beside the artifact and copied in after check.mjs, where it always went.
      # The live `stats.json` lets it reuse the CI counts of days it already
      # counted (a few dozen API requests rather than ~170); a missing one just
      # costs the full count. Its GitHub API metrics need a token, so pull
      # requests skip it.
      - name: Start the development dashboard in the background
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ needs.gate.outputs.base }}
        run: |
          bg="$RUNNER_TEMP/background"
          mkdir -p "$bg"
          (
            prev="$bg/prev-stats.json"
            curl -fsS --retry 3 "${SITE_URL%/}/dev/stats.json" -o "$prev" || rm -f "$prev"
            node platform/devstats/build.mjs --out="$bg/dev" --previous="$prev"
            echo $? > "$bg/dashboard.status"
          ) > "$bg/dashboard.log" 2>&1 &

      # Share cards are most of the build's own time (about 2,700 PNGs drawn
      # in JS) and nearly all are the same from one deploy to the next, so
      # they are kept between runs, keyed by what they are drawn from
      # (share.mjs, renderCards). One saved entry per renderer version per day,
      # not per run: the repository's 10 GB cache is shared with every other
      # workflow, and a run a few minutes old is as good a source as this one.
      - name: Name today's share-card cache
        id: cards
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the share cards
        id: restore-cards
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/share-cards
          key: share-cards-${{ hashFiles('platform/pages/sharecard.mjs', 'platform/pages/fontraster.mjs', 'platform/pages/fonts/**') }}-${{ steps.cards.outputs.day }}
          restore-keys: |
            share-cards-${{ hashFiles('platform/pages/sharecard.mjs', 'platform/pages/fontraster.mjs', 'platform/pages/fonts/**') }}-

      # The build throws on a post whose description is over 160 characters
      # (writing.mjs, loadPost) after minutes of work and deploys nothing;
      # the checker says the same in a second. 2026-10-29: a merged post did it.
      - name: Check blog post front matter before the long build
        run: python3 platform/ci/check_post_frontmatter.py

      # The gallery's cards are searched with the prices in this checkout
      # (make-gallery.mjs, one of the build's generators in
      # platform/pages/generated-pages.mjs). Run it before the pictures are
      # redrawn so each card's picture matches the design it now shows; the
      # build's own call then finds it current (.gallery-stamp) and skips.
      - name: Search the Shed Designer gallery with this checkout's prices
        run: node ventures/shed-designer/make-gallery.mjs

      # Shed Designer's pictures (ventures/shed-designer/renders/) are drawn by
      # its own WebGL viewer and committed, but about twenty lanes change its
      # designs at once, so they can lag main (renders.test.mjs only reports
      # that outside this job). Redraw the stale ones into this checkout before
      # the build, so the published pictures, their alt text and the size pages
      # that show them match the merged designs. Nothing is committed. If
      # Playwright cannot install, the committed pictures ship as they are;
      # a redraw that ran but left anything stale fails the next step.
      - name: Redraw stale Shed Designer pictures
        id: shed-renders
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          PLAYWRIGHT_VERSION: "1.63.0"
        run: |
          set -euo pipefail
          if node ventures/shed-designer/make-renders.mjs --check; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          ./node_modules/.bin/playwright install --with-deps chromium || ./node_modules/.bin/playwright install chromium
          cd "$GITHUB_WORKSPACE"
          PLAYWRIGHT="$RUNNER_TEMP/pw/node_modules/playwright/index.js" node ventures/shed-designer/make-renders.mjs
          echo "redrawn=1" >> "$GITHUB_OUTPUT"

      - name: Check the redrawn Shed Designer pictures
        if: steps.shed-renders.outputs.redrawn == '1'
        working-directory: ventures/shed-designer
        env:
          RENDERS_STRICT: "1"
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright/index.js
        run: node --test renders.test.mjs

      - name: Build the site
        id: build-site
        env:
          # A malformed post is left off a deploy with a warning rather than
          # stopping it (writing.mjs, loadPosts); pull requests stay strict.
          PAGES_SKIP_BAD_POSTS: ${{ github.event_name != 'pull_request' && '1' || '' }}
          PAGES_CARD_CACHE: ${{ runner.temp }}/share-cards
          # Chosen by the gate job: the Cloudflare origin once its secrets
          # exist, else where GitHub serves this repository's Pages site.
          # Canonicals, sitemaps and feed enclosures must name that origin.
          PAGES_BASE_URL: ${{ needs.gate.outputs.base }}
        run: |
          echo "base URL: $PAGES_BASE_URL"
          # --audio-cdn: committed MP3s are linked from jsDelivr rather than
          # shipped in the artifact (audio-cdn.mjs); 424 MB of 776 on 2026-10-24.
          node build.mjs --out=dist --audio-cdn
        working-directory: platform/pages

      # Runs against the artifact, not the sources. A dead link, a leftover
      # placeholder origin, or a sitemap URL that 404s is created by the copy,
      # so only the output can show it — and publishing one is expensive to
      # undo once a crawler has read it.
      - name: Check the built artifact
        run: node check.mjs dist
        working-directory: platform/pages

      # The same three additions `platform/pages/publish-branch.sh` makes,
      # after `check.mjs` for the reasons given there: each is a separate app
      # or document set, not a catalogue page. Without them `/dev/`,
      # `/dev/analyses/` and `/deploy/` 404 on the live site.
      - name: Build the development analyses and the self-deploy page
        run: |
          node platform/devlog/build.mjs --out=platform/pages/dist/dev/analyses >/dev/null
          node platform/deploy/build.mjs --out=platform/pages/dist/deploy >/dev/null

      # Started in the background before the build; this waits for it.
      - name: Add the development dashboard
        if: github.event_name != 'pull_request'
        run: |
          bg="$RUNNER_TEMP/background"
          for _ in $(seq 300); do [ -f "$bg/dashboard.status" ] && break; sleep 2; done
          status=$(cat "$bg/dashboard.status" 2>/dev/null || echo "timed out after 10 minutes")
          if [ "$status" != 0 ]; then cat "$bg/dashboard.log"; exit "$status"; fi
          mkdir -p platform/pages/dist/dev
          cp -R "$bg/dev/." platform/pages/dist/dev/

      # The engineering brief and The Merge Report (platform/daily/): the last
      # seven days from git and the run records, the newest with the CI
      # snapshot the dashboard just took. Pull requests build it too (no
      # stats.json there, so the snapshot reads "not recorded") so a broken
      # generator fails the PR rather than the publish.
      - name: Build the daily brief
        env:
          PAGES_BASE_URL: ${{ needs.gate.outputs.base }}
        run: |
          asks="${RUNNER_TEMP}/asks.json"
          python3 portfolio/ledger/decision_queue.py --json > "$asks" || rm -f "$asks"
          node platform/daily/build.mjs --out=platform/pages/dist/dev/daily \
            --stats=platform/pages/dist/dev/stats.json --asks="$asks"

      # The deploy guide, the analyses, the dashboard and the daily brief are
      # written into the artifact by the steps above, after build.mjs ran its
      # share pass, so they shipped with no og:/twitter: tags and no icon
      # links. The same pass, run over just those directories.
      - name: Give the pages built after the site their share cards and tags
        env:
          PAGES_BASE_URL: ${{ needs.gate.outputs.base }}
          PAGES_CARD_CACHE: ${{ runner.temp }}/share-cards
        run: |
          node platform/pages/share.mjs platform/pages/dist --base="$PAGES_BASE_URL" --only=deploy,dev

      # Cards no build has used for a day are dropped before saving, so the
      # entry holds the current site's cards and not every card ever drawn.
      - name: Save the share cards
        if: github.event_name != 'pull_request' && steps.build-site.outcome == 'success' && steps.restore-cards.outputs.cache-hit != 'true'
        run: find "$RUNNER_TEMP/share-cards" -name '*.png' -mmin +1440 -delete

      - if: github.event_name != 'pull_request' && steps.build-site.outcome == 'success' && steps.restore-cards.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/share-cards
          key: share-cards-${{ hashFiles('platform/pages/sharecard.mjs', 'platform/pages/fontraster.mjs', 'platform/pages/fonts/**') }}-${{ steps.cards.outputs.day }}

      # One tarball, not the directory: upload-artifact refuses a file whose
      # name has a colon or other NTFS-reserved character, and one stray
      # venture file once stopped the whole deploy that way (2026-10-30).
      # upload-pages-artifact tars for the same reason.
      - name: Pack the site for Cloudflare
        if: github.event_name != 'pull_request' && needs.gate.outputs.cloudflare == 'true'
        run: tar -cf "$RUNNER_TEMP/site.tar" -C platform/pages/dist .

      - name: Upload the site for Cloudflare
        if: github.event_name != 'pull_request' && needs.gate.outputs.cloudflare == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: ${{ runner.temp }}/site.tar
          retention-days: 3

      # Once the site lives on Cloudflare, GitHub Pages serves a page per old
      # URL that redirects to the same path there.
      - name: Write the GitHub Pages redirect pages
        if: github.event_name != 'pull_request' && needs.gate.outputs.cloudflare == 'true'
        env:
          FROM: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          TO: ${{ needs.gate.outputs.base }}
        run: node platform/pages/redirect-stubs.mjs platform/pages/dist "$RUNNER_TEMP/ghp-redirects" --from="$FROM" --to="$TO"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ needs.gate.outputs.cloudflare == 'true' && format('{0}/ghp-redirects', runner.temp) || 'platform/pages/dist' }}

  # Publishes the site to the Cloudflare Worker in platform/pages/cloudflare/.
  # Runs before the GitHub Pages deploy, which only swaps in its redirect pages
  # once this one has published and answered.
  deploy-cloudflare:
    needs: [gate, build]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED != 'false' && needs.gate.outputs.cloudflare == 'true' }}
    concurrency:
      group: cloudflare-site-deploy
      cancel-in-progress: false
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 15
    environment:
      name: cloudflare
      url: ${{ needs.gate.outputs.base }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARERESTRICTEDAPIKEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Fetch the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: ${{ runner.temp }}/site-artifact

      - name: Unpack the built site
        run: |
          mkdir -p platform/pages/dist
          tar -xf "$RUNNER_TEMP/site-artifact/site.tar" -C platform/pages/dist

      - name: Install wrangler (pinned)
        run: npm install --global wrangler@4.145.0

      # The free plan deploys at most 20,000 files per Worker and the site is
      # past that, so split.mjs moves research/, writing/ and dev/ into a
      # second Worker that the site Worker reaches by a service binding
      # (platform/pages/cloudflare/router.mjs). It fails, before anything is
      # uploaded, if either half is over the limit.
      - name: Split the site across the two Workers
        run: |
          # A hard-linked copy of the whole site for IndexNow, which walks the
          # sitemaps, some of which move to the shard.
          cp -al platform/pages/dist "$RUNNER_TEMP/site-full"
          node platform/pages/cloudflare/split.mjs platform/pages/dist platform/pages/dist-shard

      # The shard first: the site Worker's binding needs it to exist.
      - name: Deploy the shard Worker
        run: wrangler deploy
        working-directory: platform/pages/cloudflare/shard

      - name: Deploy the site Worker
        run: wrangler deploy
        working-directory: platform/pages/cloudflare

      - name: Verify the published site answers
        env:
          PAGE_URL: ${{ needs.gate.outputs.base }}
        run: bash platform/pages/verify-live.sh "$PAGE_URL"

      # Announcing is a courtesy to search engines, not part of publishing:
      # a refusal (IndexNow answers 403 SiteVerificationNotCompleted while it
      # first verifies a new host's key file, as on 2026-10-30) shows red on
      # this step but must not hold back the GitHub Pages redirect deploy,
      # which waits on this job.
      - name: Announce the deployed site to IndexNow
        continue-on-error: true
        env:
          EXIT_NO_EGRESS: "3"
        run: |
          status=0
          node platform/marketing/indexnow.mjs --submit --dir "$RUNNER_TEMP/site-full" || status=$?
          case "${status}" in
            0) echo "IndexNow notified (accepted means asked, not indexed)." ;;
            "${EXIT_NO_EGRESS}") echo "::notice::This runner has no egress to api.indexnow.org; nothing was submitted." ;;
            *) echo "::error::IndexNow refused the submission -- see the log above."; exit "${status}" ;;
          esac

  deploy:
    needs: [gate, build, deploy-cloudflare]
    # `github.ref` as well as the event: `workflow_dispatch` can be run against
    # any branch, and publishing the live site from a feature branch by accident
    # is not a mistake anyone would notice quickly.
    # On by default since 2026-10-20, when the owner switched the Pages source
    # to GitHub Actions: "merging is publishing" (CLAUDE.md). The gate used to
    # be `vars.PAGES_ENABLED == 'true'`, which was never set, so every deploy
    # was skipped and the live site stopped updating at the switch. Set
    # `PAGES_ENABLED` to `false` to pause publishing.
    # With Cloudflare on, it waits for that deploy to succeed: redirect pages
    # pointing at a site that failed to publish would take both hosts down.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.gate.outputs.cloudflare != 'true' || needs.deploy-cloudflare.result == 'success') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED != 'false' }}
    # GitHub serves one Pages site per repository, so two deployments must never
    # race — this is where that constraint actually lives, and the group is
    # deliberately not keyed by ref so nothing can publish alongside `main`.
    # `cancel-in-progress: false` lets an in-flight publish finish rather than
    # leaving the live site half-swapped.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    # The actual publish step, gated to main and non-PR events above. See
    # hetzner-gitops-ci.yml's timeout-minutes addition for why an unbounded
    # job is worth capping on a metered-minutes account -- doubly so for a
    # job that holds pages: write and publishes the live site.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The verify script and IndexNow submitter below come from the checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify the published site answers
        # platform/pages/verify-live.sh says what it checks and why.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: bash platform/pages/verify-live.sh "$PAGE_URL"

      # Tell IndexNow-participating engines (Bing, Yandex, ...) which URLs the
      # deploy just published. It reads the artifact this run deployed, not the
      # `gh-pages` branch, which stopped being the serving copy when the Pages
      # source moved to GitHub Actions. IndexNow is free and this pushes
      # nothing. A runner with no egress to it (`EXIT_NO_EGRESS`) has broken
      # nothing; a genuine refusal (a bad key file) fails the step.
      - name: Fetch the deployed artifact
        if: needs.gate.outputs.cloudflare != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact

      # With Cloudflare on, deploy-cloudflare announces the real site instead.
      - name: Announce the deployed site to IndexNow
        if: needs.gate.outputs.cloudflare != 'true'
        env:
          EXIT_NO_EGRESS: "3"
          ARTIFACT: ${{ runner.temp }}/pages-artifact
        run: |
          site="${RUNNER_TEMP}/site"
          mkdir -p "$site"
          tar -xf "${ARTIFACT}/artifact.tar" -C "$site"
          status=0
          node platform/marketing/indexnow.mjs --submit --dir "$site" || status=$?
          case "${status}" in
            0) echo "IndexNow notified (accepted means asked, not indexed)." ;;
            "${EXIT_NO_EGRESS}") echo "::notice::This runner has no egress to api.indexnow.org; nothing was submitted." ;;
            *) echo "::error::IndexNow refused the submission -- see the log above."; exit "${status}" ;;
          esac
