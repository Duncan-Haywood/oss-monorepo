# Builds the portfolio's public site — every static, browser-runnable venture
# surface assembled into one GitHub Pages deployment.
#
# The build runs on every push to `main` so a broken site is caught at merge
# time, whether or not publishing is switched on. Publishing itself is gated on
# the owner-set `GITHUB_PAGES_ENABLED` variable, because `actions/deploy-pages`
# 404s until Pages is enabled in repository settings and would otherwise turn
# this workflow red on every merge.
#
# This is the workflow that owner flip publishes. See portfolio/DIRECTION.md
# ("Current priority: deploy what is already built") and platform/pages/README.md.
name: Portfolio Pages

on:
  push:
    branches: [main]
    paths:
      - "ventures/**"
      - "platform/pages/**"
      - ".github/workflows/portfolio-pages.yml"
  pull_request:
    paths:
      - "ventures/**"
      - "platform/pages/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

# GitHub serves one Pages site per repository, so two deployments must never
# race. `cancel-in-progress: false` lets an in-flight publish finish rather
# than leaving the live site half-swapped.
concurrency:
  group: portfolio-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the site builder
        run: node --test build.test.mjs
        working-directory: platform/pages

      - name: Build the site
        env:
          # Owner-overridable (a custom domain, say). The default is where
          # GitHub serves a project Pages site for this repository.
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: node build.mjs --out=dist
        working-directory: platform/pages

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: platform/pages/dist

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.GITHUB_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify the public route
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A completed deploy job is not evidence that a visitor can use the site.
      # This fetches the real public origin the way a stranger reaches it, so
      # "deployed" is a checked claim rather than a workflow status.
      - name: Fetch the live hub, catalog, and a tool page
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          echo "Verifying $base/"

          # Pages can serve the previous revision for a few seconds after the
          # deployment API reports success, so allow for propagation.
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
               "$base/catalog.json" -o catalog.json
          tools=$(python3 -c "import json;print(len(json.load(open('catalog.json'))['tools']))")
          echo "Catalog lists $tools tool(s)"
          test "$tools" -ge 20

          curl --fail --silent --show-error "$base/" | grep -qi "calculator"

          # Exercise a real product page, chosen from the live catalog rather
          # than hardcoded, so a renamed venture cannot make this pass vacuously.
          slug=$(python3 -c "import json;print(json.load(open('catalog.json'))['tools'][0]['slug'])")
          curl --fail --silent --show-error "$base/$slug/" | grep -qi "<title>"
          echo "Product page /$slug/ is reachable"

          curl --fail --silent --show-error -o /dev/null "$base/sitemap.xml"
          curl --fail --silent --show-error -o /dev/null "$base/robots.txt"
          echo "Public route verified at $base/"
