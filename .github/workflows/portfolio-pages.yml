# Builds the portfolio's public site — every static, browser-runnable venture
# surface assembled into one GitHub Pages deployment.
#
# The build runs on every push to `main` so a broken site is caught at merge
# time, whether or not publishing is switched on. Publishing itself is gated on
# the owner-set `PAGES_ENABLED` variable, because `actions/deploy-pages`
# 404s until Pages is enabled in repository settings and would otherwise turn
# this workflow red on every merge.
#
# Not `GITHUB_PAGES_ENABLED`, which this workflow's own gate carried until
# found and fixed: GitHub rejects any Actions configuration-variable name that
# starts with `GITHUB_` (case-insensitive), reserved for GitHub's own use --
# see https://docs.github.com/en/actions/learn-github-actions/variables#naming-conventions-for-configuration-variables
# -- and enforced at creation time, so the owner could never actually have
# set it. `vars.GITHUB_PAGES_ENABLED` would always have read as unset,
# `deploy` would always have been skipped, and the "one flip" the decision
# queue and every doc pointed at would have silently done nothing. Confirmed
# with `actionlint`, which flags any `vars.GITHUB_*` / `secrets.GITHUB_*`
# reference for exactly this reason.
#
# This is the workflow that owner flip publishes. See portfolio/DIRECTION.md
# ("Current priority: deploy what is already built") and platform/pages/README.md.
name: Portfolio Pages

on:
  push:
    branches: [main]
    # Every input of the published site, not only of `build.mjs`: the steps
    # after "Check the built artifact" add the development analyses, the
    # self-deploy page and the development dashboard. Kept a superset of
    # `publish-pages-branch.yml`'s list, which this workflow replaced as the
    # live route when the owner switched the Pages source to GitHub Actions
    # (2026-10-20); a path missing here is a page that silently stops updating.
    paths:
      - "ventures/**"
      - "platform/pages/**"
      # The writing section (platform/pages/writing.mjs) renders docs/posts/,
      # and loadPosts throws on a malformed post, so a post-only PR is a build input.
      - "docs/posts/**"
      - "research/_homepage/**"
      - "research/README.md"
      - "research/*/app/**"
      - "research/*/LOG.md"
      - "platform/devlog/**"
      - "platform/deploy/**"
      - "platform/devstats/**"
      - "platform/daily/**"
      - "docs/posts/**"
      - "prompts/**"
      - "portfolio/research/**"
      - "portfolio/ledger/asks.yaml"
      - ".github/workflows/portfolio-pages.yml"
  # The development dashboard's CI, review and branch numbers move without a
  # merge to the paths above; refresh the site every three hours.
  schedule:
    - cron: "41 */3 * * *"
  pull_request:
    paths:
      - "ventures/**"
      - "platform/pages/**"
      # The writing section (platform/pages/writing.mjs) renders docs/posts/,
      # and loadPosts throws on a malformed post, so a post-only PR is a build input.
      - "docs/posts/**"
      - "research/_homepage/**"
      - "research/README.md"
      - "research/*/app/**"
      - "platform/daily/**"
      - "platform/devstats/**"
      - ".github/workflows/portfolio-pages.yml"
  workflow_dispatch:

# One slot per ref, not one slot for the whole repository.
#
# This was a single global `portfolio-pages` group covering every run. The
# constraint it was written for is real but belongs to the deploy alone (see the
# `deploy` job below); applied workflow-wide it also made every pull request
# queue behind `main`. A calculator lands on `main` here most days — several an
# hour on a busy one — and GitHub cancels a *pending* run when a newer one
# queues behind it, so pull-request builds were being cancelled seconds after
# starting rather than ever reporting. PR #1755's first run was cancelled two
# seconds in, which is how this was found: a check that never runs is
# indistinguishable from one that has not finished, and neither is a green tick
# anyone can merge on.
concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      # Read-only, for the development dashboard's PR, review and CI metrics.
      actions: read
      pull-requests: read
    # Builds and checks the whole 500+-page site artifact -- measured at 173s
    # on a recent PR. See hetzner-gitops-ci.yml's timeout-minutes addition for
    # why an unbounded job is worth capping on a metered-minutes account.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The engineering page's "landed on main" view and the changelog's
          # 14 days (~100-150 merges a day) read history. A pull request only
          # needs the build to pass, so it keeps the cheap depth-1 clone.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 3000 }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # "Build the daily brief" runs decision_queue.py, so this job needs
      # Python of its own (gitops/tests/test_ci_runner.py).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A glob, not a list. The list named build and check only, so
      # `clauses.test.mjs` had never run here — a suite can be added beside the
      # thing it tests and silently not be CI's problem, which is the one way a
      # test file is worse than no test file.
      - name: Test the site builder
        run: node --test "*.test.mjs"
        working-directory: platform/pages

      # The dashboard and the daily brief are added to the artifact after
      # check.mjs, so their own suites are the only check they get.
      - name: Test the development dashboard and the daily brief
        run: node --test platform/devstats/*.test.mjs platform/daily/*.test.mjs

      - name: Build the site
        env:
          # Owner-overridable (a custom domain, say). The default is where
          # GitHub serves a project Pages site for this repository.
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: node build.mjs --out=dist
        working-directory: platform/pages

      # Runs against the artifact, not the sources. A dead link, a leftover
      # placeholder origin, or a sitemap URL that 404s is created by the copy,
      # so only the output can show it — and publishing one is expensive to
      # undo once a crawler has read it.
      - name: Check the built artifact
        run: node check.mjs dist
        working-directory: platform/pages

      # The same three additions `platform/pages/publish-branch.sh` makes,
      # after `check.mjs` for the reasons given there: each is a separate app
      # or document set, not a catalogue page. Without them `/dev/`,
      # `/dev/analyses/` and `/deploy/` 404 on the live site.
      - name: Build the development analyses and the self-deploy page
        run: |
          node platform/devlog/build.mjs --out=platform/pages/dist/dev/analyses >/dev/null
          node platform/deploy/build.mjs --out=platform/pages/dist/deploy >/dev/null

      # The dashboard's GitHub API metrics need a token, so pull requests skip
      # it. The live `stats.json` lets it reuse the CI counts of days it
      # already counted (a few dozen API requests rather than ~170); a missing
      # one just costs the full count.
      - name: Build the development dashboard
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          prev="${RUNNER_TEMP}/prev-stats.json"
          curl -fsS --retry 3 "${SITE_URL%/}/dev/stats.json" -o "$prev" || rm -f "$prev"
          node platform/devstats/build.mjs --out=platform/pages/dist/dev --previous="$prev" >/dev/null

      # The engineering brief and The Merge Report (platform/daily/): the last
      # seven days from git and the run records, the newest with the CI
      # snapshot the dashboard just took. Pull requests build it too (no
      # stats.json there, so the snapshot reads "not recorded") so a broken
      # generator fails the PR rather than the publish.
      - name: Build the daily brief
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          asks="${RUNNER_TEMP}/asks.json"
          python3 portfolio/ledger/decision_queue.py --json > "$asks" || rm -f "$asks"
          node platform/daily/build.mjs --out=platform/pages/dist/dev/daily \
            --stats=platform/pages/dist/dev/stats.json --asks="$asks"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: platform/pages/dist

  deploy:
    needs: build
    # `github.ref` as well as the event: `workflow_dispatch` can be run against
    # any branch, and publishing the live site from a feature branch by accident
    # is not a mistake anyone would notice quickly.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true' }}
    # GitHub serves one Pages site per repository, so two deployments must never
    # race — this is where that constraint actually lives, and the group is
    # deliberately not keyed by ref so nothing can publish alongside `main`.
    # `cancel-in-progress: false` lets an in-flight publish finish rather than
    # leaving the live site half-swapped.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    # The actual publish step, gated to main and non-PR events above. See
    # hetzner-gitops-ci.yml's timeout-minutes addition for why an unbounded
    # job is worth capping on a metered-minutes account -- doubly so for a
    # job that holds pages: write and publishes the live site.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published site answers
        # A completed deploy step is not evidence that anything serves. Check
        # the front page, both sitemaps, robots, and one product through the
        # real public URL, so "deployed" is a fact rather than an inference.
        #
        # The product page is named by the live catalog rather than hardcoded:
        # a hardcoded slug stops proving anything the moment that venture is
        # renamed, and the loop below would then have reported a 404 as the
        # site's fault instead of the check's. Reading the slug back off the
        # origin also proves catalog.json is the same one this build wrote.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"

          # The product page to exercise comes from the live catalog rather than
          # a literal slug: a renamed or retired venture would otherwise make
          # this step fail for the wrong reason, or -- worse, once someone
          # "fixes" it by deleting the line -- pass without touching a tool at
          # all. Pages can also serve the previous revision for a few seconds
          # after the deployment API reports success, hence the retries.
          curl --fail --silent --show-error --retry 5 --retry-delay 10 \
               --retry-all-errors "${base}/catalog.json" -o catalog.json
          # jq, not python3: this job has no setup-python step, and the
          # self-hosted runner image ships jq but no interpreter (see
          # gitops/ci/README.md) -- ubuntu-latest happening to have python3
          # available masked that until CI_RUNNER is flipped to self-hosted.
          tools=$(jq '.tools | length' catalog.json)
          echo "Catalog lists ${tools} tool(s)"
          [ "$tools" -ge 20 ] || { echo "::error::catalog.json lists only ${tools} tools"; exit 1; }
          slug=$(jq -r '.tools[0].slug' catalog.json)

          for path in "/" "/sitemap.xml" "/sitemap-hub.xml" "/robots.txt" "/catalog.json" "/llms.txt" "/feed.xml" "/${slug}/"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
                     --retry-all-errors "${base}${path}")
            echo "${code}  ${base}${path}"
            [ "$code" = "200" ] || { echo "::error::${base}${path} returned ${code}"; exit 1; }
          done
          curl -sS "${base}/sitemap.xml" | grep -q "<sitemapindex" \
            || { echo "::error::sitemap.xml served without a sitemap index"; exit 1; }
          # A 200 on llms.txt is not enough: Pages would serve an empty file
          # just as happily, and an assistant reading it would find no tools.
          curl -sS "${base}/llms.txt" | grep -q "^- \[" \
            || { echo "::error::llms.txt served without any tool entries"; exit 1; }
          # Same argument for the feed, and one more: a feed that serves 200
          # with zero entries is indistinguishable from a healthy one to every
          # subscriber, who simply never hears about a new tool again.
          curl -sS "${base}/feed.xml" | grep -q "<entry>" \
            || { echo "::error::feed.xml served without any entries"; exit 1; }
          echo "Published and verified: ${base}/ (product page /${slug}/)"

      # Tell IndexNow-participating engines (Bing, Yandex, ...) which URLs the
      # deploy just published. It reads the artifact this run deployed, not the
      # `gh-pages` branch, which stopped being the serving copy when the Pages
      # source moved to GitHub Actions. IndexNow is free and this pushes
      # nothing. A runner with no egress to it (`EXIT_NO_EGRESS`) has broken
      # nothing; a genuine refusal (a bad key file) fails the step.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch the deployed artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact

      - name: Announce the deployed site to IndexNow
        env:
          EXIT_NO_EGRESS: "3"
          ARTIFACT: ${{ runner.temp }}/pages-artifact
        run: |
          site="${RUNNER_TEMP}/site"
          mkdir -p "$site"
          tar -xf "${ARTIFACT}/artifact.tar" -C "$site"
          status=0
          node platform/marketing/indexnow.mjs --submit --dir "$site" || status=$?
          case "${status}" in
            0) echo "IndexNow notified (accepted means asked, not indexed)." ;;
            "${EXIT_NO_EGRESS}") echo "::notice::This runner has no egress to api.indexnow.org; nothing was submitted." ;;
            *) echo "::error::IndexNow refused the submission -- see the log above."; exit "${status}" ;;
          esac
