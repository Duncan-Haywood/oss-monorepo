name: invoice-payment-terms-calculator CI

# This is a dependency-free browser calculator. Keep its user-visible
# arithmetic covered independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/invoice-payment-terms-calculator/**"
      - ".github/workflows/invoice-payment-terms-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/invoice-payment-terms-calculator/**"
      - ".github/workflows/invoice-payment-terms-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoice-payment-terms-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/invoice-payment-terms-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator tests
        run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- but nothing showed the author that until the
      # Pages job went red on main, after the merge, naming a workflow they
      # never touched. Checked here so the venture that needs the clause is the
      # one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs invoice-payment-terms-calculator
