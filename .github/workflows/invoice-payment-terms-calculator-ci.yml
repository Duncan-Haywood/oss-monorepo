name: invoice-payment-terms-calculator CI

# This is a dependency-free browser calculator. Keep its user-visible
# arithmetic covered independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/invoice-payment-terms-calculator/**"
      - ".github/workflows/invoice-payment-terms-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/invoice-payment-terms-calculator/**"
      - ".github/workflows/invoice-payment-terms-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoice-payment-terms-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/invoice-payment-terms-calculator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator tests
        run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause and a
      # best-effort/no-SLA clause on every hosted page. Neither is visible to
      # this venture's own suite -- the clauses matter because the page gets
      # published, and the venture does not know it is being published. That
      # gap turned main red twice in two days (#1747, and again on the
      # sewer-line merge), each time in the Pages job rather than in the CI of
      # the venture that broke it. Checked here so the venture that needs the
      # clause is the one that goes red.
      - name: Published pages carry both liability clauses
        working-directory: .
        run: node platform/pages/clauses.mjs invoice-payment-terms-calculator
