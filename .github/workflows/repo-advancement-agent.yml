name: Repo Advancement Agent

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Maximum work items to implement'
        required: false
        default: '3'

permissions:
  contents: write
  pull-requests: write

jobs:
  advancement:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create working branch
        run: |
          git config user.name "Repo Advancement Agent"
          git config user.email "agent@monorepo.local"
          BRANCH_NAME="agent/advancement-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          echo "WORK_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run advancement agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REPO_ROOT: ${{ github.workspace }}
        run: |
          node platform/agents/repo-advancement.js 2>&1 | tee agent-output.log

      - name: Commit changes
        run: |
          git add -A
          if [[ -n $(git status -s) ]]; then
            git commit -m "chore: repo advancement agent improvements

- Implemented planned improvements
- Generated by Repo Advancement Agent
" || echo "No changes to commit"
          else
            echo "No changes made by agent"
          fi

      - name: Push branch
        if: success()
        run: |
          git push origin "$WORK_BRANCH"
          echo "PUSH_SUCCESS=true" >> $GITHUB_ENV

      - name: Create Pull Request
        if: env.PUSH_SUCCESS == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('agent-output.log', 'utf8');

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore: repo advancement updates',
              head: process.env.WORK_BRANCH,
              base: context.ref,
              body: `## Repo Advancement Agent

This PR contains improvements generated by the Repo Advancement Agent.

### Agent Output
\`\`\`
${log}
\`\`\`

### What Changed
- Code quality improvements
- Tests and documentation enhancements
- Performance optimizations

### Review Notes
Please review the changes and approve if they look good. The agent aims to improve the codebase incrementally and safely.

---
*Generated by Repo Advancement Agent (Deepseek Flash V4 + OpenCode)*
`,
              draft: false,
            });

            console.log(`Created PR #${pr.data.number}`);

      - name: Report status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('agent-output.log', 'utf8');

            core.notice(`Repo Advancement Agent Run\n\n${log.slice(-500)}`);
