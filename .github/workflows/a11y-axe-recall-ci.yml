name: a11y-axe-recall CI

# Test coverage for portfolio/research/a11y-axe-recall/, which measures
# out-of-sample recall by running axe-core against the same 118-page corpus
# a11y-own-sites/ built. The measurement itself needs Playwright + a browser
# and the built ventures — none of which this workflow has — so, same shape
# as its siblings (a11y-external-coverage-reference-ci.yml,
# a11y-own-sites-ci.yml), it does no more than a contributor runs locally
# without those: run the tests (pure Python, no subprocess, no network) and
# re-derive the committed result set offline. It publishes nothing, registers
# nothing, and spends no API budget.
#
# The load-bearing invariant this suite pins (`StylesheetMatters` in
# test_measure.py) is the bug this directory's README names as Finding 0:
# both WCAG engines silently find nothing to check for contrast (1.4.3) if
# nobody hands them the page's linked CSS, and a11y-own-sites/'s own
# adapters do not. A future edit that drops the stylesheet argument here
# fails a test instead of quietly reintroducing that bug in this directory
# too.
#
# Both engines' paths are watched, because this suite reads them directly
# and a change to either can break it without touching this directory.

on:
  pull_request:
    paths:
      - "portfolio/research/a11y-axe-recall/**"
      - "portfolio/research/a11y-own-sites/**"
      - "portfolio/research/a11y-external-coverage-reference/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-axe-recall-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/a11y-axe-recall/**"
      - "portfolio/research/a11y-own-sites/**"
      - "portfolio/research/a11y-external-coverage-reference/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-axe-recall-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: a11y-axe-recall-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/a11y-axe-recall

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install, no npm install, no
      # browser — these tests exercise the CSS/catalog logic directly and
      # read the committed results file, never `run_axe.mjs`.
      - run: python3 -m unittest discover -p 'test_*.py'
      # The committed result set must still re-derive with no network and no
      # browser. Catches a hand-edited number.
      - run: python3 measure.py --recompute-from results-2026-08-22.json
