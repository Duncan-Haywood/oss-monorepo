name: einvoice-preflight CI

# Test runner for the local e-invoice preflight CLI and browser checker.
# Python unittest covers the CLI; node --test covers the browser modules.
# It publishes nothing, registers nothing, and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/einvoice-preflight/**"
      - ".github/workflows/einvoice-preflight-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/einvoice-preflight/**"
      - ".github/workflows/einvoice-preflight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einvoice-preflight-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/einvoice-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python3 -m unittest discover -s tests

  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/einvoice-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause and a
      # best-effort/no-SLA clause on every hosted page. Neither is visible to
      # this venture's own suite -- the clauses matter because the page gets
      # published, and the venture does not know it is being published. That
      # gap turned main red twice in two days (#1747, and again on the
      # sewer-line merge), each time in the Pages job rather than in the CI of
      # the venture that broke it. Checked here so the venture that needs the
      # clause is the one that goes red.
      - name: Published pages carry both liability clauses
        working-directory: .
        run: node platform/pages/clauses.mjs einvoice-preflight

