name: einvoice-preflight CI

# Test runner for the local e-invoice preflight CLI and browser checker.
# Python unittest covers the CLI; node --test covers the browser modules.
# It publishes nothing, registers nothing, and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/einvoice-preflight/**"
      - ".github/workflows/einvoice-preflight-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/einvoice-preflight/**"
      - ".github/workflows/einvoice-preflight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einvoice-preflight-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/einvoice-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python3 -m unittest discover -s tests
      # The tests above run from `src` on PYTHONPATH, so they pass even when
      # packaging is broken. Installing and invoking the console script is what
      # actually covers the way a user gets the tool.
      - name: Install package
        run: python3 -m pip install .
      - name: Smoke test installed command
        run: einvoice-preflight examples/valid-invoice.json --format summary

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/einvoice-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install ruff==0.15.8
      - run: ruff check src tests

  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/einvoice-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- but nothing showed the author that until the
      # Pages job went red on main, after the merge, naming a workflow they
      # never touched. Checked here so the venture that needs the clause is the
      # one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs einvoice-preflight
