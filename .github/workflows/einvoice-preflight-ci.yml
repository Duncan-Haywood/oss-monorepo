name: einvoice-preflight CI

on:
  pull_request:
    paths:
      - "ventures/einvoice-preflight/**"
      - ".github/workflows/einvoice-preflight-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/einvoice-preflight/**"
      - ".github/workflows/einvoice-preflight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einvoice-preflight-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/einvoice-preflight

jobs:
  cli-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  examples:
    # The shipped examples are the tool's documentation. If a clean one starts
    # failing preflight, or the defective one stops being caught, the README
    # is lying to whoever tries the first command in it.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Discovered rather than listed: a hard-coded list silently stops
      # covering an example that is added, and fails the whole job over one
      # that is renamed or removed. Anything named *-with-defects.* must fail
      # preflight; everything else in examples/ must pass it.
      - name: Clean examples pass
        run: |
          set -eu
          found=0
          for example in examples/*; do
            case "$example" in *-with-defects.*) continue;; esac
            echo "--- $example"
            python3 -m einvoice_preflight "$example"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no clean examples found — examples/ should not be empty"
            exit 1
          fi
      - name: The defective examples are caught
        run: |
          set -eu
          found=0
          for example in examples/*-with-defects.*; do
            [ -e "$example" ] || continue
            echo "--- $example"
            if python3 -m einvoice_preflight "$example"; then
              echo "::error::$example passed preflight but must fail it"
              exit 1
            fi
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no defective example found — the failing path is then untested"
            exit 1
          fi
