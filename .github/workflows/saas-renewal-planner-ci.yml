name: saas-renewal-planner CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared parse/plan engine,
# `cli.mjs` the Node CLI, and `page.test.mjs` covers the page wiring (the page's
# worked example must be the fixture and the guide's numbers must match the
# engine). Without this file `validate_workflows.py` would fail the moment the
# venture's `*.test.mjs` files land.
on:
  pull_request:
    paths:
      - "ventures/saas-renewal-planner/**"
      - ".github/workflows/saas-renewal-planner-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/saas-renewal-planner/**"
      - ".github/workflows/saas-renewal-planner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-renewal-planner-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/saas-renewal-planner

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
