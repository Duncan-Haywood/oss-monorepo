name: actions-checkout-credentials-check CI

# Zero-dependency Python CLI; no browser page yet.
on:
  pull_request:
    paths:
      - "ventures/actions-checkout-credentials-check/**"
      - ".github/workflows/actions-checkout-credentials-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/actions-checkout-credentials-check/**"
      - ".github/workflows/actions-checkout-credentials-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-checkout-credentials-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/actions-checkout-credentials-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checker tests
        run: python3 -m unittest test_check -v
