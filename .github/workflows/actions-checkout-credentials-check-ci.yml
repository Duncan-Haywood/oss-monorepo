name: actions-checkout-credentials-check CI

# Zero-dependency Python CLI; no browser page yet.
on:
  pull_request:
    paths:
      - "ventures/actions-checkout-credentials-check/**"
      - ".github/workflows/actions-checkout-credentials-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/actions-checkout-credentials-check/**"
      - ".github/workflows/actions-checkout-credentials-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-checkout-credentials-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/actions-checkout-credentials-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Only this venture and .github (cone mode adds the root files): its steps
          # read nothing else, checked by running them in such a tree. The full
          # 51k-file checkout was 70-90% of each job (30-68 s median)
          # (docs/history/ci-perf-2026-11-25-venture-workflow-sparse.md).
          filter: blob:none
          sparse-checkout: |
            .github
            ventures/actions-checkout-credentials-check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run checker tests
        run: python3 -m unittest test_check -v
