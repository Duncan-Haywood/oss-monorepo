name: freelance-retainer-calculator CI

# This venture had no CI at all until 2026-08-26, while shipping in the
# Portfolio Pages build — a regression in its pricing math would have reached
# the public site with nothing red anywhere. Its pricing suite was also invisible
# to `node --test`: the file was named `test_app.mjs`, which matches none of
# Node's default test-file patterns, so `node --test` reported one passing file
# (`page.test.mjs`) and silently skipped 117 assertions. The file is now
# `app.test.mjs` and both run here.
#
# The product is static ES modules with no build step and no dependencies, so
# this does no more than a contributor runs locally: `node --test`. It publishes
# nothing, registers nothing, and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/freelance-retainer-calculator/**"
      - ".github/workflows/freelance-retainer-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/freelance-retainer-calculator/**"
      - ".github/workflows/freelance-retainer-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freelance-retainer-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/freelance-retainer-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause and a
      # best-effort/no-SLA clause on every hosted page. Neither is visible to
      # this venture's own suite -- the clauses matter because the page gets
      # published, and the venture does not know it is being published. That
      # gap turned main red twice in two days (#1747, and again on the
      # sewer-line merge), each time in the Pages job rather than in the CI of
      # the venture that broke it. Checked here so the venture that needs the
      # clause is the one that goes red.
      - name: Published pages carry both liability clauses
        working-directory: .
        run: node platform/pages/clauses.mjs freelance-retainer-calculator

