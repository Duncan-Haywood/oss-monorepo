name: pwa-installability-check CI

# Zero-dependency CLI/browser tool: `analyze.mjs` is the shared,
# independently-tested installability classification engine (fixture probe
# objects only, no network), `probe.mjs` is the network layer (tested
# against a real local HTTP server on loopback only, never the internet),
# `check.mjs` is the CLI entry point, and `page.test.mjs` covers the browser
# page's structure and disclaimers. Keep all four covered independently of
# the portfolio-wide validation workflow, which only checks published pages
# and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's `*.test.mjs`
# files land -- the same hole `cors-misconfig-check-ci.yml` and
# `email-auth-check-ci.yml` document.
on:
  pull_request:
    paths:
      - "ventures/pwa-installability-check/**"
      - ".github/workflows/pwa-installability-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/pwa-installability-check/**"
      - ".github/workflows/pwa-installability-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-installability-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/pwa-installability-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- bare `node --test` walks the working
      # directory, so a test file added later is never invisible to this
      # workflow. See cors-misconfig-check-ci.yml's own note on why this
      # step is not a hand-typed list of filenames.
      - name: Run every test in the venture
        run: node --test
