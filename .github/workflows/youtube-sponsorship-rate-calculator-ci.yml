name: youtube-sponsorship-rate-calculator CI
on:
  push:
    paths: ["ventures/youtube-sponsorship-rate-calculator/**", ".github/workflows/youtube-sponsorship-rate-calculator-ci.yml"]
  pull_request:
    paths: ["ventures/youtube-sponsorship-rate-calculator/**", ".github/workflows/youtube-sponsorship-rate-calculator-ci.yml"]

# The job only checks out the repo and runs the venture's tests, so a
# read-only token is all it needs. Without this the workflow inherits the
# repository default, which can be write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/youtube-sponsorship-rate-calculator
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test
