name: agentic-trading-lab CI

on:
  pull_request:
    paths:
      - "ventures/agentic-trading-lab/**"
      - ".github/workflows/agentic-trading-lab-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/agentic-trading-lab/**"
      - ".github/workflows/agentic-trading-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentic-trading-lab-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/agentic-trading-lab

jobs:
  python:
    # Offline tests only: no market data is downloaded and no broker is called.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install "numpy>=1.24" "cryptography>=41"
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  page:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test usage.test.mjs page.test.mjs
