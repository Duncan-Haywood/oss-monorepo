name: subpath-robots-check CI

# Zero-dependency browser tool + CLI sharing one engine: `analyze.mjs` is the
# canonical logic and both surfaces import it rather than reimplementing it,
# so the engine suite is the one that has to stay green. Kept independent of
# the portfolio-wide validation workflow, which only checks published pages
# and does not run venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/subpath-robots-check/**"
      - ".github/workflows/subpath-robots-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/subpath-robots-check/**"
      - ".github/workflows/subpath-robots-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subpath-robots-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/subpath-robots-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine tests (URL parsing, robots.txt grammar, verdicts)
        run: node --test analyze.test.mjs
      # The CLI suite includes the assertion that the default path opens no
      # socket at all -- a promise the page and README both make, which is
      # exactly the kind that stops being true without anything noticing.
      - name: Run CLI tests (exit codes, flags, network silence)
        run: node --test cli.test.mjs
      - name: Run page tests (disclaimers, SEO metadata, sitemap coverage)
        run: node --test page.test.mjs
