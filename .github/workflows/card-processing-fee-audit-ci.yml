name: card-processing-fee-audit CI

# Dependency-free browser calculator. Keep user-visible arithmetic covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/card-processing-fee-audit/**"
      - ".github/workflows/card-processing-fee-audit-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/card-processing-fee-audit/**"
      - ".github/workflows/card-processing-fee-audit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-processing-fee-audit-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/card-processing-fee-audit

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs card-processing-fee-audit
