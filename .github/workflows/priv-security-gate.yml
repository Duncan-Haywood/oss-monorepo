name: Security gate

# The automated review that replaced the owner's approval of control-plane
# changes (owner, 2026-11-24: "replace my review with thorough cysec and
# reliability and liability checks not my human review. also adversarial
# analysis."). Two required checks in .github/rulesets/main.json:
#
#   security-scan     pinned scanners (gitleaks, Semgrep, OSV-Scanner,
#                     Checkov, Trivy config, zizmor, liability-audit) on the
#                     files the PR changes; fails on findings the PR adds
#                     (platform/security/scan.py, tools.yaml)
#   adversarial-gate  deterministic rules for the ways a rogue agent, a fork
#                     or a compromised dependency would attack this repo
#                     (job adversarial-rules), then an LLM red-team review
#                     for control-plane and high-risk PRs (adversarial-llm),
#                     merged into one verdict (platform/ci/adversarial_gate/)
#
# Why it is safe to run on pull_request_target
# --------------------------------------------
# The gate must judge a PR with main's rules: with `pull_request` the PR's
# own copy of this file and of the scripts would run, and a PR could edit
# them to pass itself. `pull_request_target` takes this workflow from the
# base branch, and every `actions/checkout` here checks out the base branch
# (the default for this event; for a push, the commit before it). The PR is
# fetched by materialize.py into refs and detached worktrees under
# $RUNNER_TEMP, read as files and never executed: no install, build, test or
# import of PR code, git hooks off. Every script that runs is main's copy,
# and each is a control-plane path (.github/CODEOWNERS), so changing one is
# itself judged by the old one. Scanners get explicit configs from
# platform/security/; config files a PR could plant are never staged.
#
# Credentials: checkouts keep none (anonymous fetch, public repo). The scan
# job's token is read-only (zizmor's online audits). Only adversarial-llm
# sees a credential (a GitHub OIDC token for the github-llm-gate AWS role,
# Claude Platform on AWS), in the `aws-llm` environment; it runs only main's llm_review.py, on
# same-repository PRs, and its output is a JSON file the verdict job reads
# as data.
#
# No path filter: a required check a filter skips leaves the PR waiting
# forever. A normal-tier PR installs only the scanners its files need and
# skips the LLM step, so it passes in a few minutes. Every action is pinned
# to a commit SHA already on the allowlist in .github/ci-policy.yaml.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: security-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event_name == 'push' && github.event.before || '' }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install PyYAML (hash-locked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r platform/security/locks/pyyaml.txt

      - name: Fetch the PR as data
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 -I platform/ci/adversarial_gate/materialize.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            ${PR_NUMBER:+--pr "$PR_NUMBER"} --dest "$RUNNER_TEMP/pr"

      - name: Install the scanners this PR needs (pinned by version and checksum)
        run: python3 -I platform/security/scan.py install --tools-dir "$RUNNER_TEMP/tools" --changed "$RUNNER_TEMP/pr/changed.txt"

      - name: Scan base and head; fail on new findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I platform/security/scan.py pr
          --base-tree "$RUNNER_TEMP/pr/base" --head-tree "$RUNNER_TEMP/pr/head"
          --changed "$RUNNER_TEMP/pr/changed.txt" --tools-dir "$RUNNER_TEMP/tools" --out "$RUNNER_TEMP/scan"

      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-findings
          path: ${{ runner.temp }}/scan/
          retention-days: 30
          if-no-files-found: ignore

  # The deterministic rules: no secret, read-only token.
  adversarial-rules:
    name: adversarial-rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tier: ${{ steps.analyze.outputs.tier }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event_name == 'push' && github.event.before || '' }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (hash-locked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r platform/security/locks/pyyaml.txt

      - name: Fetch the PR as data
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 -I platform/ci/adversarial_gate/materialize.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            ${PR_NUMBER:+--pr "$PR_NUMBER"} --dest "$RUNNER_TEMP/pr"

      - name: Gate unit tests (main's copy)
        run: python3 -m unittest discover -s platform/ci/adversarial_gate -p 'test_*.py'

      - name: Judge the diff with main's rules
        id: analyze
        run: |
          . "$RUNNER_TEMP/pr/env"
          python3 -I platform/ci/adversarial_gate/gate.py analyze --repo . --base "$MERGE_BASE" --head "$HEAD_SHA" \
            --head-tree "$RUNNER_TEMP/pr/head" --base-tree "$RUNNER_TEMP/pr/base" --out "$RUNNER_TEMP/gate"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adversarial-rules
          path: ${{ runner.temp }}/gate/
          retention-days: 30

  # The LLM red-team, only for control-plane and high-risk PRs from this
  # repository (a fork cannot spend the owner's budget). The only job with a
  # credential: it runs in the `aws-llm` environment (limited to main, which
  # is the ref a pull_request_target run has), whose OIDC subject
  # (repo:<owner>/<repo>:environment:aws-llm) is the only one the
  # github-llm-gate role trusts (platform/aws/stacks/llm). No other workflow
  # uses that environment, so no other job can reach the role. Billing is
  # AWS's (owner, 2026-11-26: "this gets moved to aws billing"); there is no
  # Anthropic API key path. It runs main's llm_review.py on the diff file the
  # rules job wrote, and only writes llm.json.
  adversarial-llm:
    name: adversarial-llm
    needs: adversarial-rules
    if: >-
      needs.adversarial-rules.outputs.tier != 'normal' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-llm
    permissions:
      contents: read
      id-token: write  # for the github-llm-gate AWS role (Claude Platform on AWS)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            platform/ci/adversarial_gate
          ref: ${{ github.event_name == 'push' && github.event.before || '' }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: adversarial-rules
          path: ${{ runner.temp }}/gate

      - name: LLM adversarial review
        env:
          AWS_ROLE_ARN: ${{ vars.ADVERSARIAL_REVIEW_AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.ADVERSARIAL_REVIEW_AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
          # The same workspace the llm stack scopes the role to (priv-aws-apply.yml).
          ANTHROPIC_AWS_WORKSPACE_ID: ${{ vars.CLAUDE_AWS_WORKSPACE_ID }}
        run: |
          if python3 -I platform/ci/adversarial_gate/llm_review.py --out "$RUNNER_TEMP/gate" --has-credential; then
            python3 -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r platform/ci/adversarial_gate/requirements-llm.txt
          fi
          python3 -I platform/ci/adversarial_gate/llm_review.py --out "$RUNNER_TEMP/gate"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adversarial-llm
          path: ${{ runner.temp }}/gate/llm.json
          retention-days: 30

  # The required check: merges both verdicts. Fails when the rules job did not
  # produce a verdict, so a crash never reads as a pass.
  adversarial-gate:
    name: adversarial-gate
    needs: [adversarial-rules, adversarial-llm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.event.before || '' }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (hash-locked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r platform/security/locks/pyyaml.txt

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.adversarial-rules.result == 'success'
        with:
          name: adversarial-rules
          path: ${{ runner.temp }}/gate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.adversarial-llm.result == 'success'
        with:
          name: adversarial-llm
          path: ${{ runner.temp }}/llm

      - name: Verdict
        run: python3 -I platform/ci/adversarial_gate/gate.py finalize --out "$RUNNER_TEMP/gate" --llm "$RUNNER_TEMP/llm/llm.json"
