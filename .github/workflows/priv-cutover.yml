# Cloudflare -> AWS cutover (platform/aws/cutover/README.md; the owner's steps
# and calendar: docs/runbooks/aws-cutover.md, "The Cloudflare move").
#
#   plan   environment `cutover-plan` (main only, no reviewer), role
#          github-cutover-plan: runs the requested stages read-only and posts
#          what they would do as the job summary. For `export` it is the whole
#          run: the generated Cloudflare config is uploaded as an artifact for
#          an agent to commit in a PR.
#   run    environment `cutover` (main only, the owner as required reviewer),
#          role github-cutover: the same stages for real, then deletes the
#          short-lived cutover/* secrets from AWS Secrets Manager unless told
#          to keep them for a later run the same day.
#
# Manual only. No GitHub secret is used: the Cloudflare token and the Paddle
# key are read from AWS Secrets Manager through GitHub OIDC (owner, 2026-11-26:
# "secrets etc gets managed in aws not in gh"). The privileged steps run
# tofu, the aws CLI and platform/aws/cutover/cutover.py, all owner-owned
# (platform/ci/ci_policy_check.py), with python3 -I and nothing installed.
name: Cutover (Cloudflare to AWS)

on:
  workflow_dispatch:
    inputs:
      stages:
        description: Stages, in order (README.md). Run 1 is export; run 2 is prepare switch verify.
        type: choice
        default: prepare switch verify
        options:
          - export
          - prepare
          - prepare switch verify
          - switch verify
          - verify
          - rollback
          - retire
          - delete-secrets
      app:
        description: Limit prepare, switch or rollback to one app (its name in apps.json); empty for all
        type: string
        default: ''
      keep_credentials:
        description: Keep the cutover/* secrets after this run (for another run before they expire)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cutover
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.13.10
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  # One AWS account, no Organization: cutover.py assumes no member role
  # (stacks/cutover-access puts their policies on the GitHub roles).
  CUTOVER_SINGLE_ACCOUNT: ${{ vars.AWS_ACCOUNT_MODE == 'single' && 'true' || 'false' }}
  STAGES: ${{ inputs.stages }}
  ONLY_APP: ${{ inputs.app }}

jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cutover-plan
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Assume github-cutover-plan (GitHub OIDC)
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::${token}"
          umask 077
          printf '%s' "$token" > "${RUNNER_TEMP}/web-identity-token"
          {
            echo "AWS_WEB_IDENTITY_TOKEN_FILE=${RUNNER_TEMP}/web-identity-token"
            echo "AWS_ROLE_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/cutover/github-cutover-plan"
            echo "AWS_ROLE_SESSION_NAME=cutover-plan-${GITHUB_RUN_ID}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION}"
            echo "CUTOVER_STATE_BUCKET=${AWS_ACCOUNT_ID}-tofu-state-${AWS_REGION}"
          } >> "$GITHUB_ENV"
      - name: Check inputs
        run: |
          set -euo pipefail
          if [ -n "${ONLY_APP}" ] && ! [[ "${ONLY_APP}" =~ ^[a-z][a-z0-9-]{1,40}$ ]]; then
            echo "::error::app must be an app name from platform/aws/cutover/apps.json"; exit 1
          fi
          echo "CUTOVER_STATE_KMS=$(aws kms describe-key --key-id alias/tofu-state --query KeyMetadata.Arn --output text)" >> "$GITHUB_ENV"
      - name: Plan (read-only)
        run: |
          set -euo pipefail
          args=()
          if [ -n "${ONLY_APP}" ]; then args+=(--app "${ONLY_APP}"); fi
          # shellcheck disable=SC2086 # STAGES is one of the fixed choices above
          python3 -I platform/aws/cutover/cutover.py --plan "${args[@]}" ${STAGES}
      - name: Upload the export for a PR
        if: ${{ inputs.stages == 'export' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-export
          path: |
            platform/aws/stacks/cloudflare/inventory.generated.json
            platform/aws/stacks/cloudflare/imports.generated.tf
            platform/aws/stacks/cloudflare/resources.generated.tf
          retention-days: 7
          if-no-files-found: error

  run:
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' && inputs.stages != 'export' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: cutover
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      KEEP_CREDENTIALS: ${{ inputs.keep_credentials }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Assume github-cutover (GitHub OIDC)
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::${token}"
          umask 077
          printf '%s' "$token" > "${RUNNER_TEMP}/web-identity-token"
          {
            echo "AWS_WEB_IDENTITY_TOKEN_FILE=${RUNNER_TEMP}/web-identity-token"
            echo "AWS_ROLE_ARN=arn:aws:iam::${AWS_ACCOUNT_ID}:role/cutover/github-cutover"
            echo "AWS_ROLE_SESSION_NAME=cutover-${GITHUB_RUN_ID}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION}"
            echo "CUTOVER_STATE_BUCKET=${AWS_ACCOUNT_ID}-tofu-state-${AWS_REGION}"
          } >> "$GITHUB_ENV"
      - name: Check inputs
        run: |
          set -euo pipefail
          if [ -n "${ONLY_APP}" ] && ! [[ "${ONLY_APP}" =~ ^[a-z][a-z0-9-]{1,40}$ ]]; then
            echo "::error::app must be an app name from platform/aws/cutover/apps.json"; exit 1
          fi
          echo "CUTOVER_STATE_KMS=$(aws kms describe-key --key-id alias/tofu-state --query KeyMetadata.Arn --output text)" >> "$GITHUB_ENV"
      - name: Cutover
        run: |
          set -euo pipefail
          args=()
          if [ -n "${ONLY_APP}" ]; then args+=(--app "${ONLY_APP}"); fi
          # shellcheck disable=SC2086 # STAGES is one of the fixed choices above
          python3 -I platform/aws/cutover/cutover.py "${args[@]}" ${STAGES}
      - name: Delete the cutover secrets
        if: ${{ always() && (inputs.keep_credentials != true || inputs.stages == 'delete-secrets') }}
        run: python3 -I platform/aws/cutover/cutover.py delete-secrets
