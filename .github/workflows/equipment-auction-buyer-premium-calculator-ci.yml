name: equipment-auction-buyer-premium-calculator CI

# The venture is a static, browser-local calculator: plain ES modules run
# with node's built-in test runner, no package.json, no dependencies, no
# network. calc.mjs is the premium/fee/tax-stack arithmetic and the reverse
# max-bid solve; share.mjs is the shareable-link codec; usage.mjs is the
# anonymous local counter. Without this runner they could rot while the
# page still ships them.

on:
  pull_request:
    paths:
      - "ventures/equipment-auction-buyer-premium-calculator/**"
      - ".github/workflows/equipment-auction-buyer-premium-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/equipment-auction-buyer-premium-calculator/**"
      - ".github/workflows/equipment-auction-buyer-premium-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equipment-auction-buyer-premium-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/equipment-auction-buyer-premium-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs equipment-auction-buyer-premium-calculator
