name: cors-misconfig-check CI

# Zero-dependency CLI/browser tool: `analyze.mjs` is the shared,
# independently-tested classification engine, `probe.mjs` is the network
# layer (tested against a local loopback HTTP server, never the real
# internet), `check.mjs` is the CLI entry point, and `page.test.mjs`
# covers the browser report-viewer's wiring (including its worked
# example, which must exercise a real danger finding through this
# venture's own engine). Keep all five covered independently of the
# portfolio-wide validation workflow, which only checks published pages
# and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `env-example-drift-check-ci.yml`
# and `wordpress-plugin-review-check-ci.yml` document.
on:
  pull_request:
    paths:
      - "ventures/cors-misconfig-check/**"
      - ".github/workflows/cors-misconfig-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/cors-misconfig-check/**"
      - ".github/workflows/cors-misconfig-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cors-misconfig-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/cors-misconfig-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated. This step used to list the five test
      # files by name, and `vs-burp-suite.test.mjs` landed beside them
      # without being added -- so the venture's own CI would have reported
      # green while never running the guard on its newest page. That is the
      # exact failure CLAUDE.md records against `platform/proposal/` and the
      # merge checklist: a test nobody runs is worth less than no test,
      # because it also tells the next session the ground is covered. Bare
      # `node --test` walks the working directory, which is what this
      # venture's own README already tells a contributor to run, and it
      # cannot fall behind a file added later. It is also what 39 other
      # venture workflows here already do.
      - name: Run every test in the venture
        run: node --test
