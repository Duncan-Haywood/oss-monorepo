name: cron-dst-drift-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared cron-parsing
# and timezone-arithmetic engine (pure Intl/Date, no network, no tzdata
# package); `cli.mjs` is the `next`/`drift` CLI entry point; `page.test.mjs`
# covers the browser page's structure, disclaimers, and both worked examples,
# pinned against the real engine. Keep all three covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file, `validate_workflows.py`
# would fail the moment the venture's `*.test.mjs` files land -- the same
# hole `security-txt-check-ci.yml` and `sitemap-lastmod-freshness-check-ci.yml`
# already document.
#
# One thing this job cannot catch, recorded here because it is the venture's
# own subject matter: `engine.test.mjs` derives the real DST transition dates
# for its test year from the engine itself (`findOffsetSegments`) rather than
# a hardcoded calendar date, so the suite stays correct even if a future
# tzdata update ever moves the underlying transition rule -- a scheduling
# tool whose own tests assume a fixed calendar would be a poor advertisement.
on:
  pull_request:
    paths:
      - "ventures/cron-dst-drift-check/**"
      - ".github/workflows/cron-dst-drift-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/cron-dst-drift-check/**"
      - ".github/workflows/cron-dst-drift-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-dst-drift-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/cron-dst-drift-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
