name: appliance-repair-quote-calculator CI

# The calculator is a browser-local ES module with no build step or dependencies.
# Keep CI equivalent to the contributor check and do not publish or spend API budget.
on:
  pull_request:
    paths:
      - "ventures/appliance-repair-quote-calculator/**"
      - ".github/workflows/appliance-repair-quote-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/appliance-repair-quote-calculator/**"
      - ".github/workflows/appliance-repair-quote-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appliance-repair-quote-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ventures/appliance-repair-quote-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs appliance-repair-quote-calculator
