name: backup-verification-evidence CI

on:
  pull_request:
    paths:
      - "ventures/backup-verification-evidence/**"
      - ".github/workflows/backup-verification-evidence-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/backup-verification-evidence/**"
      - ".github/workflows/backup-verification-evidence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/backup-verification-evidence

# A newer push to the same pull request cancels the superseded run; `main`
# keeps every run (platform/ci/validate_workflows.py, invariant 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Only this venture and .github (cone mode adds the root files): its steps
          # read nothing else, checked by running them in such a tree. The full
          # 51k-file checkout was 70-90% of each job (30-68 s median)
          # (docs/history/ci-perf-2026-11-25-venture-workflow-sparse.md).
          filter: blob:none
          sparse-checkout: |
            .github
            ventures/backup-verification-evidence
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node --test report.test.mjs page.test.mjs

  lint:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Only this venture and .github (cone mode adds the root files): its steps
          # read nothing else, checked by running them in such a tree. The full
          # 51k-file checkout was 70-90% of each job (30-68 s median)
          # (docs/history/ci-perf-2026-11-25-venture-workflow-sparse.md).
          filter: blob:none
          sparse-checkout: |
            .github
            ventures/backup-verification-evidence
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.8
      - run: ruff check .
