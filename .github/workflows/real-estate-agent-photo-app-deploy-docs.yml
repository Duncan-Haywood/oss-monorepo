name: Deploy real-estate-agent-photo-app docs site

on:
  push:
    branches: [main]
    paths:
      - "ventures/real-estate-agent-photo-app/docs-site/**"
      - "ventures/real-estate-agent-photo-app/process/**"
      - ".github/workflows/real-estate-agent-photo-app-deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: real-estate-agent-photo-app-deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventures/real-estate-agent-photo-app/docs-site/package-lock.json

      - name: Install dependencies
        working-directory: ventures/real-estate-agent-photo-app/docs-site
        run: npm ci

      - name: Build static site
        working-directory: ventures/real-estate-agent-photo-app/docs-site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=listing-lens-docs --branch=main
          workingDirectory: ventures/real-estate-agent-photo-app/docs-site

  apply-access:
    name: Apply Cloudflare Access policy
    needs: deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Cloudflare Access policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCS_HOSTNAME: listing-lens-docs.pages.dev
        run: ventures/real-estate-agent-photo-app/docs-site/scripts/setup-cloudflare-access.sh
