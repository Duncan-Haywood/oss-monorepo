name: Deploy real-estate-agent-photo-app docs site

on:
  push:
    branches: [main]
    paths:
      - "ventures/real-estate-agent-photo-app/docs-site/**"
      - "ventures/real-estate-agent-photo-app/process/**"
      - ".github/workflows/real-estate-agent-photo-app-deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# `cancel-in-progress` flipped true -> false on 2026-09-17, found by
# `ventures/deploy-concurrency-check` scanning this repository's own workflows.
#
# Cancelling a superseded run is right for a test job, where the only cost is
# the minutes it had already spent. This job deploys. By the time the cancel
# signal arrives it may have uploaded part of a batch of files, and the run then
# stops where it is with nothing coming back to finish it -- leaving a state
# neither revision produced, which is worse than either of them being live.
#
# Queueing gets the ordering this setting was reaching for anyway: the newer run
# waits and applies last.
concurrency:
  group: real-estate-agent-photo-app-deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    # The minter secret lives in this environment, limited to main.
    environment: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventures/real-estate-agent-photo-app/docs-site/package-lock.json

      - name: Install dependencies
        working-directory: ventures/real-estate-agent-photo-app/docs-site
        run: npm ci

      - name: Build static site
        working-directory: ventures/real-estate-agent-photo-app/docs-site
        run: npm run build

      - name: Skip deploy — Cloudflare not configured
        if: vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::The CLOUDFLARE_ACCOUNT_ID variable is not set — the docs site was built but not published (platform/ci/cloudflare_mint/README.md, owner setup)."

      - name: Short-lived Cloudflare token
        id: cf
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        uses: ./platform/ci/cloudflare_mint
        with:
          minter_token: ${{ secrets.CLOUDFLARE_MINTER_TOKEN }}
          account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          profile: listing-lens-docs-deploy
          export_env: "false"

      - name: Deploy to Cloudflare Pages
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=listing-lens-docs --branch=main
          workingDirectory: ventures/real-estate-agent-photo-app/docs-site

  apply-access:
    name: Apply Cloudflare Access policy
    needs: deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    environment: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Skip access policy — Cloudflare not configured
        if: vars.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::The CLOUDFLARE_ACCOUNT_ID variable is not set — skipping the Cloudflare Access policy step."

      - name: Short-lived Cloudflare token
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        uses: ./platform/ci/cloudflare_mint
        with:
          minter_token: ${{ secrets.CLOUDFLARE_MINTER_TOKEN }}
          account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          profile: listing-lens-access

      - name: Apply Cloudflare Access policy
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          DOCS_HOSTNAME: listing-lens-docs.pages.dev
        run: ventures/real-estate-agent-photo-app/docs-site/scripts/setup-cloudflare-access.sh
