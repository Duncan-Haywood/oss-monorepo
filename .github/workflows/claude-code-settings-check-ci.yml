name: claude-code-settings-check CI

# Static browser-local calculator: plain ES modules, node --test, no
# package.json, no dependencies, no network.
# calc.mjs is the settings.json hooks/permissions linting logic; usage.mjs
# is the anonymous local counter. Each has a sibling *.test.mjs.

on:
  pull_request:
    paths:
      - "ventures/claude-code-settings-check/**"
      - ".github/workflows/claude-code-settings-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/claude-code-settings-check/**"
      - ".github/workflows/claude-code-settings-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-code-settings-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/claude-code-settings-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
