# Moved from Duncan-Haywood/private-monorepo .github/workflows/seller-books-ci.yml at cded6eaf5d8a (2026-11-26);
# actions pinned to .github/ci-policy.yaml SHAs, checkout without persisted credentials,
# the AWS CodeBuild runner switch replaced by this repository's vars.CI_RUNNER.
# PR checks for apps/seller-books; never needs a secret; Deploys: the paid-apps secrets runbook in docs/runbooks.
name: apps-seller-books-ci
on:
  pull_request:
    paths:
      - "apps/seller-books/**"
      - "packages/billing/**"
      - ".github/workflows/seller-books-*.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "biome.json"
  push:
    branches-ignore: [main]
    paths:
      - "apps/seller-books/**"
      - "packages/billing/**"
      - ".github/workflows/seller-books-*.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seller-books-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/seller-books

jobs:
  check:
    name: lint, types, tests, build, migrations
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Worker integration tests (workerd)
        run: pnpm test:worker
      - name: Deploy provisioning tests
        run: node --test scripts/provision.test.mjs
      - name: Build
        run: pnpm build
      - name: D1 migrations in sync with schema
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name drift-check
          if [[ -n "$(git status --porcelain migrations)" ]]; then
            echo "::error::Schema changed without a migration: run 'pnpm db:generate' and commit it."
            git status --porcelain migrations
            exit 1
          fi
