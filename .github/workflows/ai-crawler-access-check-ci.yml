name: ai-crawler-access-check CI

# Zero-dependency CLI/browser tool: `audit.mjs` is the shared classifier,
# `cli.mjs` is the Node gate, and `page.test.mjs` covers the page wiring.
# Keep all three covered independently of the portfolio-wide validation
# workflow, which only checks published pages and does not run venture
# unit tests. Without this file, `validate_workflows.py` would fail the
# moment the venture's `*.test.mjs` files land — the same hole
# `coverage-drop-check-ci.yml` documents for #3649.
on:
  pull_request:
    paths:
      - "ventures/ai-crawler-access-check/**"
      - ".github/workflows/ai-crawler-access-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-crawler-access-check/**"
      - ".github/workflows/ai-crawler-access-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-crawler-access-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/ai-crawler-access-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run classifier, CLI, and page-wiring tests
        run: node --test audit.test.mjs cli.test.mjs page.test.mjs
