name: ai-engineering-academy CI

on:
  pull_request:
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run; `main`
# keeps every run (platform/ci/validate_workflows.py, invariant 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --test tools.test.mjs
      # The hub-level comparison page lives directly under tools/, not inside
      # one of the per-tool directories the matrix job below scopes to, so
      # nothing else in this workflow would ever run its test.
      - run: node --test ../tools/vs-omni-calculator.test.mjs
      - run: npm run build
      # The calculators are the only part of this venture a stranger can
      # actually use, and they are reachable only through what the build emits:
      # the hub page that lists them and the nav entry that points at the hub.
      # `npm run build` succeeding says the build ran, not that either survived
      # it -- a tool directory added without a hub entry, or a nav refactor that
      # drops the link, ships a green build and an unreachable product.
      - name: Built site exposes every calculator
        run: |
          test -f dist/tools/index.html || { echo "build emitted no calculator hub"; exit 1; }
          for tool in ../tools/*/; do
            slug=$(basename "$tool")
            test -f "dist/tools/$slug/index.html" || { echo "missing built tool: $slug"; exit 1; }
            grep -q "href=\"$slug/\"" dist/tools/index.html || { echo "hub does not link: $slug"; exit 1; }
          done
          grep -q 'href="tools/"' dist/index.html || { echo "site nav does not link the calculators"; exit 1; }

  tools-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        tool:
          - resistor-calculator
          - led-resistor-calculator
          - voltage-divider-calculator
          - 555-timer-calculator
          - rc-filter-calculator
          - rc-time-calculator
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test

