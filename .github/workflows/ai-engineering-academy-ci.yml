name: ai-engineering-academy CI

on:
  pull_request:
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --test tools.test.mjs
      - run: npm run build

  tools-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        tool:
          - resistor-calculator
          - led-resistor-calculator
          - voltage-divider-calculator
          - 555-timer-calculator
          - rc-filter-calculator
          - rc-time-calculator
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- but nothing showed the author that until the
      # Pages job went red on main, after the merge, naming a workflow they
      # never touched. Checked here so the venture that needs the clause is the
      # one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs ai-engineering-academy

