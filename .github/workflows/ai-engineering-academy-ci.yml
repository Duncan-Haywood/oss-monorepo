name: ai-engineering-academy CI

on:
  pull_request:
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  tools-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [resistor-calculator, led-resistor-calculator, voltage-divider-calculator, rc-filter-calculator]
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
