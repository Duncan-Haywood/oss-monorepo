name: ai-engineering-academy CI

on:
  pull_request:
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Unit-tests the tool discovery/render layer before exercising it, so a
      # failure names the broken function instead of surfacing as a build crash.
      - run: node --test
      - run: npm run build
      # The calculators are the only part of this venture a stranger can use.
      # If the build ever stops emitting the hub that lists them, they become
      # unreachable again — which is exactly the regression this guards.
      - name: Verify the built site exposes the calculators
        run: |
          test -f dist/tools/index.html
          for tool in ../tools/*/; do
            slug=$(basename "$tool")
            test -f "dist/tools/$slug/index.html" || { echo "missing built tool: $slug"; exit 1; }
            grep -q "href=\"$slug/\"" dist/tools/index.html || { echo "hub does not link: $slug"; exit 1; }
          done
          grep -q 'href="tools/"' dist/index.html || { echo "site nav does not link the calculators"; exit 1; }

  tools-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [resistor-calculator, led-resistor-calculator, voltage-divider-calculator]
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
