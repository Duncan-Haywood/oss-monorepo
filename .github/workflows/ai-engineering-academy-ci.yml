name: ai-engineering-academy CI

on:
  pull_request:
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-engineering-academy/site/**"
      - "ventures/ai-engineering-academy/docs/**"
      - "ventures/ai-engineering-academy/PROJECT_BRIEF.md"
      - "ventures/ai-engineering-academy/tools/**"
      - ".github/workflows/ai-engineering-academy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  tools-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool:
          - resistor-calculator
          - led-resistor-calculator
          - voltage-divider-calculator
          - 555-timer-calculator
          - rc-filter-calculator
    defaults:
      run:
        working-directory: ventures/ai-engineering-academy/tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause and a
      # best-effort/no-SLA clause on every hosted page. Neither is visible to
      # this venture's own suite -- the clauses matter because the page gets
      # published, and the venture does not know it is being published. That
      # gap turned main red twice in two days (#1747, and again on the
      # sewer-line merge), each time in the Pages job rather than in the CI of
      # the venture that broke it. Checked here so the venture that needs the
      # clause is the one that goes red.
      - name: Published pages carry both liability clauses
        working-directory: .
        run: node platform/pages/clauses.mjs ai-engineering-academy

