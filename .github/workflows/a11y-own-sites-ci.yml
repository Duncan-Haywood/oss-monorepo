name: a11y-own-sites CI

# Test coverage for the own-pages accessibility pass under
# portfolio/research/a11y-own-sites/. Standard-library-only, no network, so
# this workflow does no more than a contributor runs locally: run the tests.
# It publishes nothing, registers nothing, and spends no API budget — it is a
# test runner, not the unattended-automation kind of workflow CLAUDE.md gates.
# Same shape as its siblings (a11y-engine-agreement-ci.yml,
# a11y-evidence-record-ci.yml, a11y-render-recovery-ci.yml,
# a11y-theme-resolution-ci.yml).
#
# What this suite is here to hold: the numbers in that directory's README are
# quoted from one run over 118 pages of built venture output, and the builds
# themselves are not committed. So the results file is the only record, and a
# hand-edited number in it would otherwise be invisible. The tests pin the
# corpus size, the per-app defect shape, and the agreement rate against that
# file, and the recompute step re-derives the README's summary from it offline.
#
# Both engines' paths are watched, because this suite imports them directly and
# a change to either can break it without touching this directory.

on:
  pull_request:
    paths:
      - "portfolio/research/a11y-own-sites/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-own-sites-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/a11y-own-sites/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-own-sites-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: a11y-own-sites-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/a11y-own-sites

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install step, by design.
      - run: python3 -m unittest discover -p 'test_*.py'
      # The summary in README.md must still re-derive from the committed
      # results with no network and no build. Catches a hand-edited number.
      - run: python3 audit_own_sites.py --recompute-from results-2026-08-22.json
