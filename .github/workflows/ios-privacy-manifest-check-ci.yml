name: ios-privacy-manifest-check CI

# The venture is a static, browser-local checker plus a Node CLI: plain ES
# modules run with node's built-in test runner, no package.json, no
# dependencies, no network. scan.mjs is the Required Reason API scanner and
# manifest parser, check.mjs the CLI wrapper, and usage.mjs the anonymous
# local counter. Without this runner they could rot while the page still
# ships them.

on:
  pull_request:
    paths:
      - "ventures/ios-privacy-manifest-check/**"
      - ".github/workflows/ios-privacy-manifest-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ios-privacy-manifest-check/**"
      - ".github/workflows/ios-privacy-manifest-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-privacy-manifest-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/ios-privacy-manifest-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs ios-privacy-manifest-check
