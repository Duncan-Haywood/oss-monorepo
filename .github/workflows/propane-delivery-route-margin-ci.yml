name: propane-delivery-route-margin CI

# The venture is a static, browser-local calculator: plain ES modules run with
# node's built-in test runner, no package.json, no dependencies, no network.
# calc.mjs is the route-margin arithmetic, usage.mjs the anonymous local
# counter, and share.mjs the URL <-> inputs transform behind the save/share
# feature. Each has a sibling *.test.mjs; without this runner they could rot
# while the page still ships them.

on:
  pull_request:
    paths:
      - "ventures/propane-delivery-route-margin/**"
      - ".github/workflows/propane-delivery-route-margin-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/propane-delivery-route-margin/**"
      - ".github/workflows/propane-delivery-route-margin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: propane-delivery-route-margin-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/propane-delivery-route-margin

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
