name: twitch-payout-calculator CI

# The venture is a static, browser-local calculator: plain ES modules run with
# node's built-in test runner, no package.json, no dependencies, no network.
# calc.mjs is the payout arithmetic, usage.mjs the anonymous local counter,
# and share.mjs the URL <-> inputs transform behind the save/share feature.
# Each has a sibling *.test.mjs; without this runner they could rot while the
# page still ships them.

on:
  pull_request:
    paths:
      - "ventures/twitch-payout-calculator/**"
      - ".github/workflows/twitch-payout-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/twitch-payout-calculator/**"
      - ".github/workflows/twitch-payout-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twitch-payout-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/twitch-payout-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
