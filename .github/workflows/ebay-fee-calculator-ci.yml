name: eBay fee calculator CI
on:
  push:
    paths: ['ventures/ebay-fee-calculator/**', '.github/workflows/ebay-fee-calculator-ci.yml']
  pull_request:
    paths: ['ventures/ebay-fee-calculator/**', '.github/workflows/ebay-fee-calculator-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test ventures/ebay-fee-calculator/*.test.mjs
