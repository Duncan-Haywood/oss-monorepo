name: sponsor-ready CI
on:
  push:
    paths: ["ventures/sponsor-ready/**", ".github/workflows/sponsor-ready-ci.yml"]
  pull_request:
    paths: ["ventures/sponsor-ready/**", ".github/workflows/sponsor-ready-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/sponsor-ready
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs sponsor-ready
