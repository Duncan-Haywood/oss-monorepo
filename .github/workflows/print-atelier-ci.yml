name: print-atelier CI

on:
  pull_request:
    paths:
      - "ventures/print-atelier/**"
      - ".github/workflows/print-atelier-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/print-atelier/**"
      - ".github/workflows/print-atelier-ci.yml"

permissions:
  contents: read

concurrency:
  group: print-atelier-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/print-atelier

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventures/print-atelier/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
