name: print-atelier CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ventures/print-atelier/**"
      - ".github/workflows/print-atelier-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/print-atelier/**"
      - ".github/workflows/print-atelier-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/print-atelier

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventures/print-atelier/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The static surface at `site/` is dependency-free ESM with its own
  # `node --test` suite, so it neither needs nor uses the Next.js app's
  # `npm ci` above. Without this job its 42 tests — including the parity
  # guard that pins the port against `src/lib/print-file-preflight.ts` —
  # would never run in CI, which is exactly the gap #3077 closed for
  # `real-estate-agent-photo-app`.
  site-test:
    name: site/ tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/print-atelier/site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
