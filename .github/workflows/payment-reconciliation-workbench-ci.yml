name: payment-reconciliation-workbench CI

on:
  pull_request:
    paths:
      - "ventures/payment-reconciliation-workbench/**"
      - ".github/workflows/payment-reconciliation-workbench-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/payment-reconciliation-workbench/**"
      - ".github/workflows/payment-reconciliation-workbench-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-reconciliation-workbench-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/payment-reconciliation-workbench

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs payment-reconciliation-workbench
