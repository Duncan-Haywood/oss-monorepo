# Deploys PayApps (ventures/payapps/apps/payapps, bet #1) to Cloudflare Workers.
# Ported from private-monorepo's payapps-deploy.yml on 2026-11-27 (task
# move-payapps-public; ventures/payapps/DEPLOY.md). App-side details, every
# secret and variable: ventures/payapps/apps/payapps/docs/DEPLOY.md.
#
# Manual only (workflow_dispatch) until the first deploy succeeds. The launch
# review is done (apps/payapps/docs/LAUNCH-REVIEW.md, under docs/legal/OPERATOR.md,
# 2026-11-26): agents may run this and open sign-ups. After a first good run,
# add `push: branches: [main]` here. Never runs on pull requests (PR checks are
# payapps-ci.yml). Paid plans stay dark until the owner sets
# PAYAPPS_BILLING_PROVIDER=paddle and the Paddle secrets (docs/BILLING.md).
#
# Two jobs, so the product's own code never runs next to the Cloudflare token:
#   build  - no secrets, no environment: install, checks, `pnpm build`, and the
#            built Worker + assets uploaded as an artifact.
#   deploy - the `payapps-production` environment: runs only owned scripts
#            (provision.mjs, CODEOWNERS) and a pinned global wrangler on the
#            downloaded build; never `pnpm install`.
name: payapps-deploy

on:
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Skip lint/typecheck/tests (only for a commit payapps-ci already passed)"
        type: boolean
        default: false

permissions:
  contents: read

# One Worker and one D1 database behind this: never two deploys at once, and
# never cancel one (or a migration) half-way.
concurrency:
  group: payapps-deploy
  cancel-in-progress: false

jobs:
  build:
    name: build (no secrets)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ventures/payapps/apps/payapps
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            ventures/payapps
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ventures/payapps/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/payapps/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Checks
        if: ${{ !inputs.skip_checks }}
        run: |
          pnpm exec biome ci .
          pnpm typecheck
          pnpm test:unit
          pnpm test:worker
          node --test scripts/provision.test.mjs

      - name: Build
        run: pnpm build
      - name: No source maps in the public assets (proprietary source)
        run: node ../../scripts/check-no-client-maps.mjs dist/client

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payapps-dist
          path: ventures/payapps/apps/payapps/dist
          retention-days: 7
          if-no-files-found: error
          # dist/client/.assetsignore keeps wrangler.json out of the public assets.
          include-hidden-files: true

  deploy:
    name: deploy (production)
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: payapps-production
      url: ${{ steps.urls.outputs.app_url }}
    defaults:
      run:
        shell: bash
        working-directory: ventures/payapps/apps/payapps
    env:
      WRANGLER_SEND_METRICS: "false"
      # provision.mjs calls this instead of `pnpm exec wrangler`: no install here.
      PAYAPPS_WRANGLER_BIN: wrangler
      # Optional custom domain (zone on the same Cloudflare account); empty = workers.dev.
      APP_DOMAIN: ${{ vars.PAYAPPS_DOMAIN }}
    steps:
      - name: Cloudflare credentials present
        env:
          HAS_TOKEN: ${{ (secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN) != '' }}
          HAS_ACCOUNT: ${{ (secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID || vars.CLOUDFLARE_ACCOUNT_ID) != '' }}
        working-directory: .
        run: |
          if [[ "$HAS_TOKEN" != "true" || "$HAS_ACCOUNT" != "true" ]]; then
            echo "::error title=Missing Cloudflare secrets::Need CLOUDFLARE_API_TOKEN (D1, R2, Workers Scripts edit; Zone/DNS/Routes edit for a custom domain) and CLOUDFLARE_ACCOUNT_ID. See ventures/payapps/apps/payapps/docs/DEPLOY.md. Nothing was deployed."
            exit 1
          fi

      # Migrations and provision.mjs come from the checkout;
      # the Worker and its assets come from the build job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            ventures/payapps/apps/payapps/migrations
            ventures/payapps/apps/payapps/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install wrangler (pinned, the app's own version)
        working-directory: .
        run: npm install --global wrangler@4.165.0

      - name: Fetch the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: payapps-dist
          path: ventures/payapps/apps/payapps/dist

      - name: Cloudflare credentials
        env:
          CF_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="$(printf '%s' "$CF_SECRET" | tr -d '[:space:]')"
          account="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          echo "::add-mask::$token"
          api=https://api.cloudflare.com/client/v4
          ok() { jq -e '.success == true' >/dev/null 2>&1; }
          if ! { curl -sS -H "Authorization: Bearer $token" "$api/user/tokens/verify" | ok ||
                 curl -sS -H "Authorization: Bearer $token" "$api/accounts/$account/tokens/verify" | ok; }; then
            echo "::error title=Cloudflare token rejected::CLOUDFLARE_API_TOKEN is not an active API token for account CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          { echo "CLOUDFLARE_API_TOKEN=$token"; echo "CLOUDFLARE_ACCOUNT_ID=$account"; } >>"$GITHUB_ENV"

      - name: Resolve URL
        id: urls
        run: |
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          domain="$(printf '%s' "$APP_DOMAIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -n "$domain" ]]; then
            zone="$(awk -F. '{print $(NF-1)"."$NF}' <<<"$domain")"
            zone_id="$(curl -sS "${auth[@]}" "$api/zones?name=$zone&account.id=$CLOUDFLARE_ACCOUNT_ID" | jq -r '.result[0].id // empty' 2>/dev/null || true)"
            if [[ -z "$zone_id" ]]; then
              echo "::warning title=Custom domain skipped::Zone $zone is not reachable with this token (needs Zone Read, DNS Edit, Workers Routes Edit). Deploying on workers.dev."
              domain=""
            fi
          fi
          if [[ -n "$domain" ]]; then
            url="https://$domain"
          else
            sub="$(curl -sS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' 2>/dev/null || true)"
            if [[ -z "$sub" ]]; then
              echo "::error title=No workers.dev subdomain::Open Workers & Pages once in the Cloudflare dashboard (or set PAYAPPS_DOMAIN), then re-run. Nothing was deployed."
              exit 1
            fi
            url="https://payapps.$sub.workers.dev"
          fi
          { echo "domain=$domain"; echo "app_url=$url"; } >>"$GITHUB_OUTPUT"
          echo "Deploying payapps to $url"

      - name: Provision D1 + R2 and write the deploy config
        id: provision
        env:
          DOMAIN: ${{ steps.urls.outputs.domain }}
        run: node scripts/provision.mjs --write-config dist/payapps/wrangler.deploy.json ${DOMAIN:+--domain "$DOMAIN"}

      # Migrations run BEFORE the new code goes live, so they must stay backward compatible.
      - name: Apply D1 migrations
        env:
          CONFIG: ${{ steps.provision.outputs.config }}
        run: wrangler d1 migrations apply DB --remote --config "$CONFIG"

      # Not ported: the Paddle catalog sync (packages/billing/scripts/paddle-catalog.ts). It is
      # product code that would run with the Paddle key in this job, and nothing here may run
      # unowned code next to a secret (.github/ci-policy.yaml). Paid plans are dark until the owner
      # sets the Paddle key; until a sync is ported, PAYAPPS_BILLING_PRICE_IDS carries the price ids
      # (ventures/payapps/DEPLOY.md, "Paddle").

      - name: Deploy
        id: deploy
        env:
          CONFIG: ${{ steps.provision.outputs.config }}
          APP_URL: ${{ steps.urls.outputs.app_url }}
          # The sender domain must be onboarded to Cloudflare Email Service (docs/EMAIL.md).
          EMAIL_FROM: ${{ vars.PAYAPPS_EMAIL_FROM || 'PayApps <no-reply@marisstella.app>' }}
          # Not secret ("paddle" or "none"); a var because a Worker secret cannot share a var's name.
          BILLING_PROVIDER: ${{ vars.PAYAPPS_BILLING_PROVIDER || 'none' }}
          QBO_ENVIRONMENT: ${{ vars.PAYAPPS_QBO_ENVIRONMENT || 'sandbox' }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          wrangler deploy --config "$CONFIG" \
            --var "APP_ENV:production" --var "APP_URL:${APP_URL%/}" --var "EMAIL_FROM:$EMAIL_FROM" \
            --var "BILLING_PROVIDER:$BILLING_PROVIDER" --var "QBO_ENVIRONMENT:$QBO_ENVIRONMENT" \
            --var "QBO_REDIRECT_URI:${APP_URL%/}/api/integrations/quickbooks/callback" \
            --message "${GITHUB_SHA::12} via workflow_dispatch (run ${GITHUB_RUN_ID})"
          version="$(jq -r 'select(.type=="deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -1 || true)"
          echo "version_id=$version" >>"$GITHUB_OUTPUT"

      - name: Sync secrets from GitHub (non-empty only)
        env:
          CONFIG: ${{ steps.provision.outputs.config }}
          S_AUTH_SECRET: ${{ secrets.PAYAPPS_AUTH_SECRET }}
          S_BILLING_API_KEY: ${{ secrets.PAYAPPS_BILLING_API_KEY }}
          S_BILLING_WEBHOOK_SECRET: ${{ secrets.PAYAPPS_BILLING_WEBHOOK_SECRET }}
          S_BILLING_PRICE_IDS: ${{ secrets.PAYAPPS_BILLING_PRICE_IDS }}
          S_QBO_CLIENT_ID: ${{ secrets.PAYAPPS_QBO_CLIENT_ID }}
          S_QBO_CLIENT_SECRET: ${{ secrets.PAYAPPS_QBO_CLIENT_SECRET }}
          S_QBO_TOKEN_KEY: ${{ secrets.PAYAPPS_QBO_TOKEN_KEY }}
        run: |
          umask 077
          file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$file"' EXIT
          node -e '
            const out = {};
            for (const [k, v] of Object.entries(process.env)) {
              if (k.startsWith("S_") && v && v.trim()) out[k.slice(2)] = v;
            }
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(out));
            console.log(`syncing ${Object.keys(out).length} secret(s): ${Object.keys(out).sort().join(", ") || "none"}`);
          ' "$file"
          if [[ "$(jq 'length' "$file")" -gt 0 ]]; then
            wrangler secret bulk "$file" --name payapps --config "$CONFIG"
          fi

      # The app refuses to start sessions without AUTH_SECRET. Generated once, stored only on the Worker.
      - name: Generate AUTH_SECRET if missing (never overwrites)
        env:
          CONFIG: ${{ steps.provision.outputs.config }}
        run: |
          # Fails the step (pipefail) if the list cannot be read: never guess and overwrite a secret.
          existing="$(wrangler secret list --format json --name payapps --config "$CONFIG" \
            | sed -n '/^\[/,$p' | jq -r '.[].name')"
          if grep -qx AUTH_SECRET <<<"$existing"; then
            echo "AUTH_SECRET already set: keeping it"
          else
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s' "$value" | wrangler secret put AUTH_SECRET --name payapps --config "$CONFIG" >/dev/null
            unset value
            echo "AUTH_SECRET generated and stored on the Worker (write-only)"
          fi

      - name: Smoke test /api/health
        env:
          APP_URL: ${{ steps.urls.outputs.app_url }}
        run: |
          url="${APP_URL%/}/api/health"
          deadline=$((SECONDS + 90))
          until body="$(curl -fsS --max-time 10 "$url" 2>/dev/null)" && jq -e '.ok == true and .app == "payapps"' <<<"$body" >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::$url did not answer ok within 90s (last: ${body:-no response})"
              exit 1
            fi
            sleep 3
          done
          echo "healthy: $url -> $body"
          # Sign-up needs a verified email in production: without mail nobody can finish signing up.
          if ! jq -e '.email == true' <<<"$body" >/dev/null; then
            echo "::warning title=Account mail is off::$url reports email:false, so nobody can verify an address and finish signing up. Onboard the EMAIL_FROM sender domain to Cloudflare Email Service (ventures/payapps/apps/payapps/docs/EMAIL.md) and re-run."
          fi

      - name: Summary
        if: always()
        env:
          APP_URL: ${{ steps.urls.outputs.app_url }}
          VERSION: ${{ steps.deploy.outputs.version_id }}
          R2: ${{ steps.provision.outputs.r2_enabled }}
        run: |
          {
            echo "### payapps-deploy"
            echo "- url: ${APP_URL:-n/a}"
            echo "- attachments (R2): ${R2:-n/a}"
            echo "- version: \`${VERSION:-n/a}\` (rollback: \`wrangler rollback <version-id> --name payapps\`)"
            echo "- commit: \`$GITHUB_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
