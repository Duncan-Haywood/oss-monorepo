name: a11y-external-coverage-reference CI

# Test coverage for the external-reference comparison under
# portfolio/research/a11y-external-coverage-reference/. Standard-library-only
# and offline — the axe-core catalog it measures against is committed, and
# `--refresh-catalog` (the only step that touches the network) is never run
# here. So this workflow does no more than a contributor runs locally: run the
# tests. It publishes nothing, registers nothing, and spends no API budget — it
# is a test runner, not the unattended-automation kind of workflow CLAUDE.md
# gates. Same shape as its siblings (a11y-engine-agreement-ci.yml,
# a11y-evidence-record-ci.yml).
#
# The load-bearing invariant is that neither engine reopens a silent coverage
# gap. Both were reconciled against each other and against fixtures written in
# this repository, and neither had ever been compared to anything outside it;
# compared to axe-core on 2026-08-21, eight automatable A/AA success criteria
# turned out to be in neither engine's checked list nor its not-tested list —
# six of them Level A. Those are now disclosed, and this suite fails if a
# change to either engine puts a criterion back into neither list.
#
# It also pins the separation that keeps the disclosure honest: the eight are
# disclosed, not implemented, and the tests assert both halves — that the
# engines still do not detect them, and that they are declared
# "unimplemented" rather than "manual". A pass that implements one has to move
# the label, which is the point.
#
# Both engines' paths are watched, because this suite reads them directly and a
# change to either can break it without touching this directory.

on:
  pull_request:
    paths:
      - "portfolio/research/a11y-external-coverage-reference/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-external-coverage-reference-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/a11y-external-coverage-reference/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-external-coverage-reference-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: a11y-external-coverage-reference-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/a11y-external-coverage-reference

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The as-found result set is addressed by git revision rather than
          # trusted as a file, so the comparison needs real history. At the
          # default depth of 1 those tests skip instead of running.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install step, by design.
      - run: python3 -m unittest discover -p 'test_*.py'
      # Both committed result sets must still re-derive with no network.
      # Catches a hand-edited number.
      - run: python3 measure.py --recompute-from results-2026-08-21-as-found.json
      - run: python3 measure.py --recompute-from results-2026-08-21-after-disclosure.json
      - run: python3 measure.py --recompute-from results-2026-08-22-after-rules.json
