name: seller-books CI

# PR and main checks for ventures/seller-books (the Seller Books app, its
# marketing site and the two workspace packages it imports as source). Ported
# from private-monorepo's seller-books-ci.yml on 2026-11-27 (task
# move-seller-books-public), plus the site's and the packages' tests, which had
# no CI there. The Playwright job is not ported (ventures/seller-books/DEPLOY.md).
# Read-only and secret-free: deploying is a separate workflow.
# Run locally: python3 platform/ci/run_workflow_locally.py seller-books-ci.yml

on:
  pull_request:
    branches: [main]
    paths:
      - "ventures/seller-books/**"
      - ".github/workflows/seller-books-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/seller-books/**"
      - ".github/workflows/seller-books-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run; `main`
# keeps every run (platform/ci/validate_workflows.py, invariant 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: seller-books (lint, types, tests, build, migrations)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ventures/seller-books/apps/seller-books
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            ventures/seller-books
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ventures/seller-books/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/seller-books/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:worker
      - name: Deploy provisioning script
        working-directory: .
        run: node --test ventures/seller-books/apps/seller-books/scripts/provision.test.mjs
      - run: pnpm build
      - name: No source maps in the public assets
        run: node ../../scripts/check-no-client-maps.mjs dist/client
      - name: D1 migrations in sync with schema
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name drift-check
          if [[ -n "$(git status --porcelain migrations)" ]]; then
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit it."
            git status --porcelain migrations
            exit 1
          fi

  site:
    name: seller-books-site (lint, build, tests)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ventures/seller-books
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            ventures/seller-books
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ventures/seller-books/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/seller-books/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci apps/seller-books-site
      - name: Build
        working-directory: ventures/seller-books/apps/seller-books-site
        run: node build.mjs
      - name: Tests
        working-directory: ventures/seller-books/apps/seller-books-site
        run: node --test "test/*.test.mjs"

  packages:
    name: packages (billing, admin-metrics, scripts)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ventures/seller-books
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            ventures/seller-books
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ventures/seller-books/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/seller-books/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci packages scripts
      - name: billing
        working-directory: ventures/seller-books/packages/billing
        run: pnpm typecheck && pnpm test
      - name: admin-metrics
        run: node --test packages/admin-metrics/src/*.test.ts
      - name: scripts
        run: node --test scripts/*.test.mjs
