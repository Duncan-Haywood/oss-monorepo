name: Cursor Agent scheduled agents

# Cursor Agent CLI, subscription OAuth only — no CURSOR_API_KEY fallback.
# Required CI secret: CURSOR_CLI_CONFIG (~/.cursor/cli-config.json from `agent login`).
# Runs both repo prompts hourly (stagger :40).

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work
      model:
        description: Optional Cursor model id (empty = CLI default)
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        env:
          PROMPT_KIND_INPUT: ${{ github.event.inputs.prompt_kind }}
        run: |
          # workflow_dispatch's `type: choice` is UI-only — the REST/GraphQL
          # API accepts any string, so this must not raw-interpolate
          # ${{ github.event.inputs.* }} into a run: script (script
          # injection) and must hard-reject any value outside the known set
          # rather than pass it through into $GITHUB_OUTPUT / matrix.*.
          kind="${PROMPT_KIND_INPUT:-both}"
          case "$kind" in
            both|"")
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
            dev-work|continuous-work)
              echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Unrecognized prompt_kind '${kind}', falling back to both."
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  cursor:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: cursor-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor Agent CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Cursor OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cursor/cli-config.json
            ~/.cursor/auth.json
          key: cursor-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            cursor-oauth-auth-

      - name: Seed Cursor OAuth config
        env:
          CURSOR_CLI_CONFIG: ${{ secrets.CURSOR_CLI_CONFIG }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.cursor"
          .github/scripts/restore-oauth-auth.sh "$HOME/.cursor/cli-config.json" CURSOR_CLI_CONFIG

      - name: Prepare prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "cursor-agent" \
            "${{ matrix.prompt_kind }}"

      - name: Configure git
        run: |
          git config user.name "cursor-scheduled[bot]"
          git config user.email "cursor-scheduled[bot]@users.noreply.github.com"

      - name: Run Cursor Agent (headless, OAuth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_INPUT: ${{ github.event.inputs.model || '' }}
        run: |
          set -euo pipefail
          unset CURSOR_API_KEY || true
          command -v agent || command -v cursor-agent
          AGENT_BIN="$(command -v agent || command -v cursor-agent)"
          PROMPT="$(cat "$PROMPT_FILE")"
          ARGS=(-p --force)
          if [ -n "${MODEL_INPUT:-}" ]; then
            ARGS+=(--model "$MODEL_INPUT")
          fi
          "$AGENT_BIN" "${ARGS[@]}" "$PROMPT"

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cursor/cli-config.json
            ~/.cursor/auth.json
          key: cursor-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
