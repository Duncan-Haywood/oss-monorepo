# Writes Homebrew formulas for npm-published venture CLIs into the owner's tap repo.
# Off by default: with vars.DISTRIBUTE_HOMEBREW unset this only prints a dry run.
# Free, no paid spend. Spec: portfolio/distribution/README.md
name: distribute-homebrew
on:
  schedule:
    - cron: '17 17 * * 4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formulas:
    if: ${{ vars.DISTRIBUTE_HOMEBREW == 'true' && vars.HOMEBREW_TAP_REPO != '' }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node platform/distribution/homebrew.mjs --write tap
        env:
          DISTRIBUTE_HOMEBREW: ${{ vars.DISTRIBUTE_HOMEBREW }}
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
      - name: Commit new formulas
        working-directory: tap
        run: |
          git add Formula
          if git diff --cached --quiet; then echo "no new formulas"; exit 0; fi
          git -c user.name="monorepo-projects bot" -c user.email="noreply@users.noreply.github.com" commit -m "Add formulas for newly published CLIs"
          git push
