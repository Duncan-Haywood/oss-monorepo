name: branch-protection-drift-check CI

# Zero-dependency CLI/browser tool: engine.mjs is the shared comparator and
# cli.mjs/index.html are its two front ends. Keep it covered independently
# of the portfolio-wide validation workflow, which only checks published
# pages and does not run venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/branch-protection-drift-check/**"
      - ".github/workflows/branch-protection-drift-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/branch-protection-drift-check/**"
      - ".github/workflows/branch-protection-drift-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-protection-drift-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/branch-protection-drift-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run comparison engine tests
        run: node --test engine.test.mjs
      - name: Run CLI tests (including end-to-end exit-code behavior)
        run: node --test cli.test.mjs
      - name: Run page tests (disclaimers, SEO metadata, sitemap coverage)
        run: node --test page.test.mjs
