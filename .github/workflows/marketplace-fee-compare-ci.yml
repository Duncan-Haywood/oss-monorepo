name: marketplace-fee-compare CI

# Test runner for the browser-local cross-marketplace comparison. The product
# is static ES modules with no build step and no dependencies, so this does
# no more than a contributor runs locally: `node --test`. It publishes
# nothing, registers nothing, and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/marketplace-fee-compare/**"
      - ".github/workflows/marketplace-fee-compare-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/marketplace-fee-compare/**"
      - ".github/workflows/marketplace-fee-compare-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-fee-compare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/marketplace-fee-compare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs marketplace-fee-compare
