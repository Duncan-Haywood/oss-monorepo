name: actions-minutes-estimator CI

# Zero-dependency cost estimator: `estimate.mjs` and `workflow-yaml.mjs` are
# the shared, pure modules both the browser page and the CLI import;
# `cli.mjs` is the filesystem-touching entry point (its tests write into a
# temp dir and make no network call); `page.test.mjs` covers structured data,
# disclaimers, the usage-event disclosure and the sibling link.
#
# Keep all three covered independently of the portfolio-wide validation
# workflow, which only checks published pages and does not run venture unit
# tests. Without this file, `validate_workflows.py` fails the moment the
# venture's `*.test.mjs` files land -- the same hole
# `llms-txt-generator-ci.yml` and `app-store-screenshot-check-ci.yml` already
# document.
#
# It also practises what the tool preaches, which is the point of a venture
# whose whole subject is CI cost: `push` is filtered to `main` so a commit on
# a PR branch is not built twice, `cancel-in-progress` drops superseded runs,
# `paths` keeps it out of every unrelated push in a 253-venture monorepo, and
# `timeout-minutes` caps what one wedged job can spend. Run
# `node cli.mjs .github/workflows` and this file should raise no finding.
on:
  pull_request:
    paths:
      - "ventures/actions-minutes-estimator/**"
      - ".github/workflows/actions-minutes-estimator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/actions-minutes-estimator/**"
      - ".github/workflows/actions-minutes-estimator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-minutes-estimator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/actions-minutes-estimator

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run estimator, CLI, and page-wiring tests
        run: node --test estimate.test.mjs cli.test.mjs page.test.mjs
