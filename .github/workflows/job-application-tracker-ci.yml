name: job-application-tracker CI

# Dependency-free browser tool: plain ES modules, no build step, so this runs
# exactly what a contributor runs locally (`node --test`) and nothing else. It
# publishes nothing, registers nothing, and spends no API budget. The text a
# visitor pastes into the page is never sent anywhere, including here — this
# workflow only runs the module's own unit tests against fixture strings.
#
# Every venture here gets its own workflow because the portfolio-wide
# workflows do not run venture unit tests: `portfolio-validate.yml` checks
# structure and markup, `proposal-module-ci.yml` runs only
# `ventures/*/proposal.test.mjs`, and nothing else executes `node --test`
# inside a venture. `validate_workflows.py` invariant 7 fails the build if a
# venture ships `*.test.mjs` with no workflow running it.
on:
  pull_request:
    paths:
      - "ventures/job-application-tracker/**"
      - ".github/workflows/job-application-tracker-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/job-application-tracker/**"
      - ".github/workflows/job-application-tracker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-application-tracker-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/job-application-tracker

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the venture's tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs job-application-tracker
