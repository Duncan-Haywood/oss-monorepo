name: epk-generator CI

# Dependency-free browser tool: plain ES modules, no build step, so this runs
# exactly what a contributor runs locally (`node --test`) and nothing else.
# It publishes nothing, registers nothing, and spends no API budget.
#
# Every venture here gets its own workflow because the portfolio-wide
# workflows do not run venture unit tests: `portfolio-validate.yml` checks
# structure and markup, `proposal-module-ci.yml` runs only
# `ventures/*/proposal.test.mjs`, and nothing else executes `node --test`
# inside a venture. Without this file, `validate_workflows.py` fails the
# moment the venture's `*.test.mjs` files land (see CLAUDE.md's recorded
# lesson on `locksmith-bid-calculator-ci.yml` and its ten siblings).
on:
  pull_request:
    paths:
      - "ventures/epk-generator/**"
      - ".github/workflows/epk-generator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/epk-generator/**"
      - ".github/workflows/epk-generator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epk-generator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/epk-generator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the venture's tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs epk-generator
