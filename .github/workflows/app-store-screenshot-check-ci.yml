name: app-store-screenshot-check CI

# Zero-dependency CLI/browser tool: `image.mjs` is the PNG/JPEG header reader
# and format detector; `spec.mjs` holds each store's requirements as data;
# `engine.mjs` is the shared pure classifier; `check.mjs` is the CLI entry
# point (the only file that touches the filesystem, so its tests write real
# files and assert real exit codes); `usage.test.mjs` pins the privacy claim
# the page makes about what is stored locally; `page.test.mjs` covers all three
# pages' structured data, labels and disclaimers. Keep all of them covered
# independently of the portfolio-wide validation workflow, which only checks
# published pages and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's `*.test.mjs`
# files land -- the same hole `redirect-chain-check-ci.yml`,
# `sitemap-lastmod-freshness-check-ci.yml` and `cors-misconfig-check-ci.yml`
# already document.
on:
  pull_request:
    paths:
      - "ventures/app-store-screenshot-check/**"
      - ".github/workflows/app-store-screenshot-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/app-store-screenshot-check/**"
      - ".github/workflows/app-store-screenshot-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-screenshot-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/app-store-screenshot-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run header-reader, classifier, CLI, usage, and page-wiring tests
        run: node --test image.test.mjs engine.test.mjs check.test.mjs usage.test.mjs page.test.mjs
