name: fleet-repair-or-replace-planner CI

# The venture is a static, browser-local planner: plain ES modules run with
# node's built-in test runner, no package.json, no dependencies, no network.
# calc.mjs is the keep-versus-replace arithmetic, the equivalent-annual-cost
# model and the budget ranking; usage.mjs is the anonymous local counter.
# page.test.mjs additionally pins the explainer page's worked figures against
# what calc.mjs actually computes, so changing the arithmetic without
# updating the published prose turns this red. Without this runner they could
# rot while the page still ships them.

on:
  pull_request:
    paths:
      - "ventures/fleet-repair-or-replace-planner/**"
      - ".github/workflows/fleet-repair-or-replace-planner-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/fleet-repair-or-replace-planner/**"
      - ".github/workflows/fleet-repair-or-replace-planner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-repair-or-replace-planner-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/fleet-repair-or-replace-planner

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs fleet-repair-or-replace-planner
