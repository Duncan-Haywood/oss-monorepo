name: ai-coding-plan-cost-calculator CI

# Zero-dependency cost model: `calc.mjs` is the shared, pure module the
# browser page imports (preset plans/models/usage tiers, the cost comparison
# and break-even math); `page.test.mjs` covers structured data, disclaimers,
# the usage-event disclosure, and the sibling link to mcp-supply-chain-watch.
#
# Keep both covered independently of the portfolio-wide validation workflow,
# which only checks published pages and does not run venture unit tests.
# Without this file, `validate_workflows.py` fails the moment the venture's
# `*.test.mjs` files land -- the same hole `actions-minutes-estimator-ci.yml`
# and `codeowners-shadow-check-ci.yml` already document.
on:
  pull_request:
    paths:
      - "ventures/ai-coding-plan-cost-calculator/**"
      - ".github/workflows/ai-coding-plan-cost-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-coding-plan-cost-calculator/**"
      - ".github/workflows/ai-coding-plan-cost-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-coding-plan-cost-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/ai-coding-plan-cost-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run calculator and page-wiring tests
        run: node --test calc.test.mjs page.test.mjs
