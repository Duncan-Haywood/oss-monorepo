name: flaky-test-finder CI

# Zero-dependency CLI/browser tool: `check.py` is the canonical classifier and
# `classify.mjs` is the same logic reimplemented (with its own hand-rolled XML
# parser, since Node has no DOMParser) for the in-browser page. Keep both
# covered independently of the portfolio-wide validation workflow, which only
# checks published pages and does not run venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/flaky-test-finder/**"
      - ".github/workflows/flaky-test-finder-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/flaky-test-finder/**"
      - ".github/workflows/flaky-test-finder-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flaky-test-finder-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/flaky-test-finder

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run classifier tests (Python — the canonical CLI)
        run: python3 -m unittest test_check -v
      - name: Run classifier tests (browser page logic)
        run: node --test classify.test.mjs
