name: agent-instructions-drift-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared drift rule set
# (dangling file references, `npm run` scripts absent from `package.json`, and
# the bare-`pytest`/bare-`mypy` interpreter-mismatch footguns); `cli.mjs` is
# the CLI entry point; `page.test.mjs` covers the tool page and the explainer's
# structure and disclaimers. Keep all three covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests.
#
# Without this file `validate_workflows.py` fails, and it did: the venture
# landed in #4745 with three `*.test.mjs` files and no workflow filtering on
# its path, so those assertions ran only on a contributor's machine. That
# turned `main` red on three `portfolio-validate.yml` steps at once (the
# validator, its own unit test, and — separately — the privacy switch count),
# and with Actions starved nothing surfaced it until a `--tree` sweep asked.
# Same hole `security-txt-check-ci.yml`, `sitemap-lastmod-freshness-check-ci.yml`
# and `cors-misconfig-check-ci.yml` already document.
#
# One thing worth noting because it is this venture's own subject matter: the
# repo this tool checks is supplied as input and every test builds its own
# fixture tree, so the suite does not depend on the checkout it runs in. A
# drift checker whose own tests drifted with the repository would be a poor
# advertisement.
on:
  pull_request:
    paths:
      - "ventures/agent-instructions-drift-check/**"
      - ".github/workflows/agent-instructions-drift-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/agent-instructions-drift-check/**"
      - ".github/workflows/agent-instructions-drift-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-instructions-drift-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/agent-instructions-drift-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
