name: agent-instructions-drift-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared, independently-
# tested drift-checking logic (file-reference, npm-script, and shell-footgun
# detection), `cli.mjs` is the CLI entry point (also exercised via real
# subprocess runs in cli.test.mjs), and `index.html` is the browser page.
# Keep all of it covered independently of the portfolio-wide validation
# workflow, which only checks published pages and does not run venture unit
# tests. Without this file, `validate_workflows.py` would fail the moment
# the venture's `*.test.mjs` files land -- the same hole
# `pdf-accessibility-tag-check-ci.yml` and `env-example-drift-check-ci.yml`
# document.
on:
  pull_request:
    paths:
      - "ventures/agent-instructions-drift-check/**"
      - ".github/workflows/agent-instructions-drift-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/agent-instructions-drift-check/**"
      - ".github/workflows/agent-instructions-drift-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-instructions-drift-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/agent-instructions-drift-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- see cors-misconfig-check-ci.yml's
      # comment on this same step for why a bare `node --test` (which walks
      # the whole working directory) is preferred over naming files.
      - name: Run every test in the venture
        run: node --test
