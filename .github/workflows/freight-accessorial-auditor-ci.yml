name: freight-accessorial-auditor CI

# Static browser-local auditor: plain ES modules, node --test, no
# package.json, no dependencies, no network.
# audit.mjs is invoice-line and detention arithmetic; usage.mjs is the
# anonymous local counter. Each has a sibling *.test.mjs.

on:
  pull_request:
    paths:
      - "ventures/freight-accessorial-auditor/**"
      - ".github/workflows/freight-accessorial-auditor-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/freight-accessorial-auditor/**"
      - ".github/workflows/freight-accessorial-auditor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freight-accessorial-auditor-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/freight-accessorial-auditor

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- but nothing showed the author that until the
      # Pages job went red on main, after the merge, naming a workflow they
      # never touched. Checked here so the venture that needs the clause is the
      # one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs freight-accessorial-auditor
