name: a11y-render-recovery CI

# Test coverage for the render-recovery classifier under
# portfolio/research/a11y-render-recovery/. It is standard-library-only and its
# suite needs no network, so this workflow does no more than a contributor runs
# locally: run the tests. It publishes nothing, registers nothing, and spends no
# API budget — it is a test runner, not the unattended-automation kind of
# workflow CLAUDE.md gates.
#
# The sibling research probes already have matching runners
# (a11y-evidence-record in #302, eaa-wcag-triage in #344); this one closes the
# same gap for the 22-test suite that passed only by hand until now. Its
# load-bearing invariant — every undecidable audit.py reports is matched back to
# an element, so the provenance shares are computed against the full denominator
# — is exactly the regression that must not reach main unseen, because the
# candidate's economics rest on those shares.

on:
  pull_request:
    paths:
      - "portfolio/research/a11y-render-recovery/**"
      - "portfolio/research/a11y-evidence-record/**"
      - ".github/workflows/a11y-render-recovery-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/a11y-render-recovery/**"
      - "portfolio/research/a11y-evidence-record/**"
      - ".github/workflows/a11y-render-recovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: a11y-render-recovery-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/a11y-render-recovery

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install step, by design.
      - run: python3 -m unittest discover -p 'test_*.py'
