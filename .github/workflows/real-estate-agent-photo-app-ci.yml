name: real-estate-agent-photo-app CI

on:
  pull_request:
    paths:
      - "ventures/real-estate-agent-photo-app/**"
      - ".github/workflows/real-estate-agent-photo-app-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/real-estate-agent-photo-app/**"
      - ".github/workflows/real-estate-agent-photo-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-estate-agent-photo-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline/ tests + typecheck
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventures/real-estate-agent-photo-app/pipeline/package-lock.json
      - working-directory: ventures/real-estate-agent-photo-app/pipeline
        run: npm ci
      - working-directory: ventures/real-estate-agent-photo-app/pipeline
        run: npm test
      - working-directory: ventures/real-estate-agent-photo-app/pipeline
        run: npx tsc --noEmit

  docs-site:
    name: docs-site/ build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventures/real-estate-agent-photo-app/docs-site/package-lock.json
      - working-directory: ventures/real-estate-agent-photo-app/docs-site
        run: npm ci
      - working-directory: ventures/real-estate-agent-photo-app/docs-site
        run: npm run lint
      - working-directory: ventures/real-estate-agent-photo-app/docs-site
        run: npm run build

  research:
    name: research/ build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ventures/real-estate-agent-photo-app/research/package-lock.json
      - working-directory: ventures/real-estate-agent-photo-app/research
        run: npm ci
      - working-directory: ventures/real-estate-agent-photo-app/research
        run: npm run lint
      - working-directory: ventures/real-estate-agent-photo-app/research
        run: npm run build

  site-test:
    name: site/ tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/real-estate-agent-photo-app/site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test
