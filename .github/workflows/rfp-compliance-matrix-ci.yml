name: rfp-compliance-matrix CI
on:
  push:
    paths: ["ventures/rfp-compliance-matrix/**", ".github/workflows/rfp-compliance-matrix-ci.yml"]
  pull_request:
    paths: ["ventures/rfp-compliance-matrix/**", ".github/workflows/rfp-compliance-matrix-ci.yml"]

# The job only checks out the repo and runs the venture's tests, so a
# read-only token is all it needs. Without this the workflow inherits the
# repository default, which can be write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/rfp-compliance-matrix
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - run: node --test
