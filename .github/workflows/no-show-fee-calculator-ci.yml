name: no-show-fee-calculator CI

on:
  push:
    branches: [main]
    paths:
      - "ventures/no-show-fee-calculator/**"
      - ".github/workflows/no-show-fee-calculator-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ventures/no-show-fee-calculator/**"
      - ".github/workflows/no-show-fee-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-show-fee-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/no-show-fee-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- but nothing showed the author that until the
      # Pages job went red on main, after the merge, naming a workflow they
      # never touched. Checked here so the venture that needs the clause is the
      # one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs no-show-fee-calculator
