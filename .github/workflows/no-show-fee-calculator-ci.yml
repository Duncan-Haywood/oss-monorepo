name: no-show-fee-calculator CI

on:
  push:
    branches: [main]
    paths:
      - "ventures/no-show-fee-calculator/**"
      - ".github/workflows/no-show-fee-calculator-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ventures/no-show-fee-calculator/**"
      - ".github/workflows/no-show-fee-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-show-fee-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/no-show-fee-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Only this venture and .github (cone mode adds the root files): its steps
          # read nothing else, checked by running them in such a tree. The full
          # 51k-file checkout was 70-90% of each job (30-68 s median)
          # (docs/history/ci-perf-2026-11-25-venture-workflow-sparse.md).
          filter: blob:none
          sparse-checkout: |
            .github
            ventures/no-show-fee-calculator
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
