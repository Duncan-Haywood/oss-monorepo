# Publish built docs to their own Cloudflare Worker (ventures/retail-pilot-intel/apps/docs/wrangler.toml),
# or to GitHub Pages when RETAIL_PILOT_INTEL_PAGES=true. Pair with the passcode gate (VITE_DOCS_PASSCODE)
# and, for a real login, Cloudflare Access on the Worker's host. Vercel was retired on 2026-11-24
# (docs/reports/2026-11-24-cloudflare-consolidation.md).
name: Deploy retail-pilot-intel docs

on:
  push:
    branches: [main]
    paths:
      - "ventures/retail-pilot-intel/apps/docs/**"
      - "ventures/retail-pilot-intel/docs/**"
      - "ventures/retail-pilot-intel/reports/**"
      - "ventures/retail-pilot-intel/scripts/convert-html-to-tsx.ts"
      - "ventures/retail-pilot-intel/packages/**"
      - "ventures/retail-pilot-intel/pnpm-lock.yaml"
      - ".github/workflows/retail-pilot-intel-deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: retail-pilot-intel-deploy-docs
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: ventures/retail-pilot-intel

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/retail-pilot-intel/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        env:
          VITE_DOCS_GATE_ENABLED: "true"
          VITE_DOCS_PASSCODE: ${{ secrets.DOCS_PASSCODE }}
          VITE_DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: pnpm docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ventures/retail-pilot-intel/apps/docs/dist

  deploy:
    needs: build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    # Opt-in: the deploy-pages action 404s until GitHub Pages is enabled in
    # repo settings, which turns this workflow red on every push to the docs
    # paths. Gate it on an owner-set variable (mirrors deploy-vercel below) so
    # the build always validates but publishing only fires once Pages is on.
    #
    # Deliberately NOT `PAGES_ENABLED` (originally spelled `GITHUB_PAGES_
    # ENABLED`, which GitHub rejects outright -- Actions configuration
    # variables cannot start with `GITHUB_`). GitHub serves one Pages site per
    # repository, and that variable now publishes `portfolio-pages.yml` — the
    # ~30 free calculators the portfolio's deploy-first priority is about. If
    # both workflows read the same flag, one owner flip would make two
    # deployments race and the live site would flap between them.
    #
    # These docs are passcode-gated and internal, so they are not what the
    # public origin should serve. Setting `RETAIL_PILOT_INTEL_PAGES=true` hands
    # the origin to them instead; the Vercel job below is the better route if
    # both are wanted at once.
    if: ${{ vars.RETAIL_PILOT_INTEL_PAGES == 'true' }}
    # Added 2026-09-17, found by `ventures/deploy-concurrency-check` scanning
    # this repository's own workflows. The block above already names the hazard
    # -- "one owner flip would make two deployments race and the live site would
    # flap between them" -- and mitigates it with two separate variables. That is
    # a policy mitigation: it holds exactly as long as nobody sets both flags.
    #
    # This is the mechanical one. `portfolio-pages.yml`'s Pages deploy job uses
    # the group `github-pages-deploy`, deliberately un-keyed by ref because
    # GitHub serves one Pages site per repository. Sharing that exact group name
    # is what makes these two jobs queue against each other rather than race: a
    # concurrency group is only a queue for the runs inside it, so two correct
    # workflows under two different group names have no ordering between them at
    # all. Keep this string identical to the one in `portfolio-pages.yml`.
    #
    # `cancel-in-progress: false` matches that job too -- an in-flight publish
    # should finish rather than leave the live site half-swapped.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Replaced the Vercel job on 2026-11-24 (owner: consolidate providers onto Cloudflare). That job
  # never ran: VERCEL_DEPLOY was never set. This one publishes on a manual run, or on every docs
  # push once RETAIL_PILOT_INTEL_DOCS_CLOUDFLARE=true, with the Cloudflare secrets portfolio-pages.yml
  # already uses. Free plan, static files only: no code runs, so requests are never metered.
  deploy-cloudflare:
    needs: build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.RETAIL_PILOT_INTEL_DOCS_CLOUDFLARE == 'true') }}
    concurrency:
      group: retail-pilot-intel-docs-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARERESTRICTEDAPIKEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/retail-pilot-intel/pnpm-lock.yaml

      - name: Check the Cloudflare secrets are set
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; nothing was deployed."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs for Cloudflare
        env:
          VITE_DOCS_GATE_ENABLED: "true"
          VITE_DOCS_PASSCODE: ${{ secrets.DOCS_PASSCODE }}
          VITE_DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: pnpm docs:build

      - name: Install wrangler (pinned)
        run: npm install --global wrangler@4.145.0

      - name: Deploy to Cloudflare
        id: deploy
        working-directory: ventures/retail-pilot-intel/apps/docs
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          wrangler deploy
          url="$(grep -o '"targets":\[[^]]*\]' "$WRANGLER_OUTPUT_FILE_PATH" | grep -o 'https://[^"]*workers\.dev' | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify the docs answer
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [[ -z "$URL" ]]; then echo "::warning::wrangler printed no workers.dev URL; skipped the check"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            headers="$(curl -sS -D - -o /dev/null "$URL/" || true)"
            if grep -qi '^HTTP/[0-9.]* 200' <<<"$headers" && grep -qi '^x-robots-tag: noindex' <<<"$headers"; then
              echo "Live: $URL (200, noindex)"; exit 0
            fi
            sleep 10
          done
          echo "::error::$URL did not answer 200 with X-Robots-Tag: noindex"; printf '%s\n' "$headers"; exit 1
