# Publish built docs to GitHub Pages (private repo: enable Pages in repo settings).
# Pair with passcode gate (VITE_DOCS_PASSCODE) and optional Vercel Deployment Protection.
name: Deploy retail-pilot-intel docs

on:
  push:
    branches: [main]
    paths:
      - "ventures/retail-pilot-intel/apps/docs/**"
      - "ventures/retail-pilot-intel/docs/**"
      - "ventures/retail-pilot-intel/reports/**"
      - "ventures/retail-pilot-intel/scripts/convert-html-to-tsx.ts"
      - "ventures/retail-pilot-intel/packages/**"
      - "ventures/retail-pilot-intel/pnpm-lock.yaml"
      - ".github/workflows/retail-pilot-intel-deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: retail-pilot-intel-deploy-docs
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: ventures/retail-pilot-intel

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/retail-pilot-intel/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        env:
          VITE_DOCS_GATE_ENABLED: "true"
          VITE_DOCS_PASSCODE: ${{ secrets.DOCS_PASSCODE }}
          VITE_DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: pnpm docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ventures/retail-pilot-intel/apps/docs/dist

  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      pages: write
      id-token: write
    # Opt-in: the deploy-pages action 404s until GitHub Pages is enabled in
    # repo settings, which turns this workflow red on every push to the docs
    # paths. Gate it on an owner-set variable (mirrors deploy-vercel below) so
    # the build always validates but publishing only fires once Pages is on.
    #
    # Deliberately NOT `PAGES_ENABLED` (originally spelled `GITHUB_PAGES_
    # ENABLED`, which GitHub rejects outright -- Actions configuration
    # variables cannot start with `GITHUB_`). GitHub serves one Pages site per
    # repository, and that variable now publishes `portfolio-pages.yml` — the
    # ~30 free calculators the portfolio's deploy-first priority is about. If
    # both workflows read the same flag, one owner flip would make two
    # deployments race and the live site would flap between them.
    #
    # These docs are passcode-gated and internal, so they are not what the
    # public origin should serve. Setting `RETAIL_PILOT_INTEL_PAGES=true` hands
    # the origin to them instead; the Vercel job below is the better route if
    # both are wanted at once.
    if: ${{ vars.RETAIL_PILOT_INTEL_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    if: ${{ vars.VERCEL_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/retail-pilot-intel/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs for Vercel
        env:
          VITE_DOCS_GATE_ENABLED: "true"
          VITE_DOCS_PASSCODE: ${{ secrets.DOCS_PASSCODE }}
          VITE_DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: pnpm docs:build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ventures/retail-pilot-intel/apps/docs
          vercel-args: "--prod"
