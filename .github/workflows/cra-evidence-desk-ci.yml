name: cra-evidence-desk CI

# Standard-library Python CLI. Keep exact-match SBOM/advisory drafts
# covered independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/cra-evidence-desk/**"
      - ".github/workflows/cra-evidence-desk-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/cra-evidence-desk/**"
      - ".github/workflows/cra-evidence-desk-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cra-evidence-desk-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/cra-evidence-desk

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run evidence-desk tests
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Example SBOM produces a customer-reviewed draft
        run: PYTHONPATH=src python3 -m cra_evidence_desk examples/sbom.json examples/advisories.json --product "Demo service" --version 2026.08 --format draft
      - name: A real CycloneDX export produces the same draft
        run: PYTHONPATH=src python3 -m cra_evidence_desk examples/sbom.cyclonedx.json examples/advisories.osv.json --product "Demo service" --version 2026.08 --format draft

  # The browser port. Its own job rather than a step on `test` so a drift
  # between the two surfaces names which one moved -- `parity.test.mjs` fails
  # here, and the Python rule set it is measured against fails above.
  site-test:
    name: site/ tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/cra-evidence-desk/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
