name: redirect-chain-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared classification
# logic; `fetch-chain.mjs` is the real network layer (tested against a local
# loopback server only, and deliberately never auto-follows a redirect);
# `check.mjs` is the CLI entry point; `page.test.mjs` covers all three pages'
# structure and disclaimers. Keep all five covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file, `validate_workflows.py`
# would fail the moment the venture's `*.test.mjs` files land -- the same hole
# `sitemap-lastmod-freshness-check-ci.yml`, `hreflang-reciprocity-check-ci.yml`
# and `cors-misconfig-check-ci.yml` already document.
on:
  pull_request:
    paths:
      - "ventures/redirect-chain-check/**"
      - ".github/workflows/redirect-chain-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/redirect-chain-check/**"
      - ".github/workflows/redirect-chain-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redirect-chain-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/redirect-chain-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, network layer, CLI, usage, and page-wiring tests
        run: node --test engine.test.mjs fetch-chain.test.mjs check.test.mjs usage.test.mjs page.test.mjs
