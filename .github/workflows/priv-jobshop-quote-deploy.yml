# Deploys ventures/jobshop-quote/apps/jobshop-quote (Job Shop Quote, paid bet #2) to Cloudflare Workers:
# one Worker (`jobshop-quote`) for the SPA and the API, a D1 database (`jobshop-quote`), an R2 bucket for
# drawings, CAD files and sent quote PDFs (`jobshop-quote-files`; without it files are kept in D1), Workers AI for drawing text
# and a daily cron for quote expiry. Ported on 2026-11-27 from private-monorepo's
# jobshop-quote-deploy.yml, which never ran (private-monorepo's Actions start no jobs), following
# priv-payapps-deploy.yml. What each step does and every setting:
# ventures/jobshop-quote/apps/jobshop-quote/docs/DEPLOY.md; why it lives here:
# ventures/jobshop-quote/DEPLOY.md.
#
# Runs on every merge to main that touches the venture (push, paths below) and by hand
# (workflow_dispatch), from main only. The push trigger was added 2026-11-27 after two good manual
# runs (46013246899, 46018975911): merges such as PR #19778 were reaching main but not the live app
# until someone dispatched it. Markdown-only changes (ROADMAP, docs) do not deploy, and a push run
# always runs the full checks (skip_checks is a dispatch input). Before its first run, the launch review
# ventures/jobshop-quote/docs/legal/OPERATOR.md asks for (margins at full allowance, every legal page
# read against the product) is recorded in apps/jobshop-quote/docs/LAUNCH-REVIEW.md. Paid plans stay
# dark: checkout turns on only when the owner sets JOBSHOP_BILLING_PROVIDER=paddle and the two Paddle
# secrets (apps/jobshop-quote/docs/BILLING.md). AI extraction stays off (503 on "Extract with AI")
# until the owner sets the app's own JOBSHOP_ANTHROPIC_API_KEY: unlike the private workflow, this one
# does not fall back to the shared ANTHROPIC_API_KEY, so no LLM spend starts without that choice. The
# plan ceilings and GLOBAL_DAILY_LLM_CAP_USD in wrangler.jsonc bound the spend once it does.
#
# Hardening, as in priv-payapps-deploy.yml: actions pinned by SHA, checkout without persisted
# credentials and sparse to the venture, a job-level guard that refuses any ref but main, secrets used
# exactly as stored, and Cloudflare credentials exported only after install, tests and build.
name: jobshop-quote-deploy
on:
  push:
    branches: [main]
    paths:
      - "ventures/jobshop-quote/**"
      - "!ventures/jobshop-quote/**/*.md"
      - ".github/workflows/priv-jobshop-quote-deploy.yml"
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Skip lint/typecheck/tests (only for a commit jobshop-quote CI already passed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jobshop-quote-deploy
  cancel-in-progress: false # never cancel a deploy (or a migration) half-way

jobs:
  deploy:
    name: deploy (production)
    # A dispatch from a branch could ship unreviewed code with production secrets: main only.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # Limit this environment to `main` and, if wanted, add required reviewers (Settings -> Environments).
    # The JOBSHOP_* secrets belong here; the Cloudflare ones are the repository's.
    environment:
      name: jobshop-quote-production
      url: ${{ steps.urls.outputs.app_url }}
    defaults:
      run:
        shell: bash
        working-directory: ventures/jobshop-quote/apps/jobshop-quote
    env:
      WRANGLER_SEND_METRICS: "false"
      # Custom domain (zone on the same Cloudflare account). Defaults to a subdomain of the catalogue's
      # own domain, as PayApps and Seller Books do: the workers.dev address carries the account's
      # subdomain (a person's name), which is not a link for marketing pages. If the token cannot reach
      # the zone, "Resolve URL" warns and deploys on workers.dev. Set JOBSHOP_DOMAIN to change it.
      APP_DOMAIN: ${{ vars.JOBSHOP_DOMAIN || 'jobshop-quote.marisstella.app' }}
    steps:
      - name: Cloudflare credentials present
        working-directory: .
        env:
          HAS_TOKEN: ${{ (secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARERESTRICTEDAPIKEY) != '' }}
          HAS_ACCOUNT: ${{ (secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID || vars.CLOUDFLARE_ACCOUNT_ID) != '' }}
        run: |
          if [[ "$HAS_TOKEN" != "true" || "$HAS_ACCOUNT" != "true" ]]; then
            echo "::error title=Missing Cloudflare secrets::Need CLOUDFLARE_API_TOKEN (Workers Scripts, D1, R2 and Workers AI; Zone Read, DNS and Workers Routes edit for a custom domain) and CLOUDFLARE_ACCOUNT_ID. Nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            ventures/jobshop-quote

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ventures/jobshop-quote/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/jobshop-quote/pnpm-lock.yaml
      # Cloudflare credentials are exported only after install, tests and build.
      - run: pnpm install --frozen-lockfile

      - name: Checks
        if: ${{ !inputs.skip_checks }}
        run: |
          pnpm exec biome ci .
          pnpm typecheck
          pnpm test:unit
          pnpm test:worker
      - name: Deploy script tests
        if: ${{ !inputs.skip_checks }}
        run: node --test ./scripts/provision.test.mjs ./scripts/email-routing.test.mjs

      - name: Build
        run: pnpm build
      - name: No source maps in the public assets (proprietary source)
        run: node ../../scripts/check-no-client-maps.mjs dist/client

      - name: Cloudflare credentials
        env:
          CF_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARERESTRICTEDAPIKEY }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Used exactly as stored: a transformed secret would print unmasked (actions-secret-leak-check).
          token="$CF_SECRET"
          account="$CF_ACCOUNT"
          api=https://api.cloudflare.com/client/v4
          ok() { jq -e '.success == true' >/dev/null 2>&1; }
          if ! { curl -sS -H "Authorization: Bearer $token" "$api/user/tokens/verify" | ok ||
                 curl -sS -H "Authorization: Bearer $token" "$api/accounts/$account/tokens/verify" | ok; }; then
            echo "::error title=Cloudflare token rejected::CLOUDFLARE_API_TOKEN is not an active API token for account CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          { echo "CLOUDFLARE_API_TOKEN=$token"; echo "CLOUDFLARE_ACCOUNT_ID=$account"; } >>"$GITHUB_ENV"

      - name: Resolve URL
        id: urls
        run: |
          api=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          domain="$(printf '%s' "$APP_DOMAIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -n "$domain" && ! "$domain" =~ ^[a-z0-9.-]+$ ]]; then
            echo "::error title=Bad JOBSHOP_DOMAIN::Use a bare host name such as quote.marisstella.app. Nothing was deployed."
            exit 1
          fi
          if [[ -n "$domain" ]]; then
            zone="$(awk -F. '{print $(NF-1)"."$NF}' <<<"$domain")"
            zone_id="$(curl -sS "${auth[@]}" "$api/zones?name=$zone&account.id=$CLOUDFLARE_ACCOUNT_ID" | jq -r '.result[0].id // empty' 2>/dev/null || true)"
            if [[ -z "$zone_id" ]]; then
              echo "::warning title=Custom domain skipped::Zone $zone is not reachable with this token (needs Zone Read, DNS Edit, Workers Routes Edit). Deploying on workers.dev."
              domain=""
            fi
          fi
          if [[ -n "$domain" ]]; then
            url="https://$domain"
          else
            sub="$(curl -sS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty' 2>/dev/null || true)"
            if [[ -z "$sub" ]]; then
              echo "::error title=No workers.dev subdomain::Open Workers & Pages once in the Cloudflare dashboard (or set JOBSHOP_DOMAIN), then re-run. Nothing was deployed."
              exit 1
            fi
            url="https://jobshop-quote.$sub.workers.dev"
          fi
          { echo "domain=$domain"; echo "app_url=$url"; } >>"$GITHUB_OUTPUT"
          echo "Deploying jobshop-quote to $url"

      # Without R2 (not enabled, or the token refused on it) the script warns and leaves the bucket
      # binding out; the app then keeps drawings, CAD files and sent quote PDFs in D1 (file-store.ts).
      - name: Provision D1 + R2 and write the deploy config
        id: provision
        env:
          DOMAIN: ${{ steps.urls.outputs.domain }}
        run: node ./scripts/provision.mjs --write-config dist/jobshop_quote/wrangler.deploy.json ${DOMAIN:+--domain "$DOMAIN"}

      # Migrations run BEFORE the new code goes live, so they must stay backward compatible.
      - name: Apply D1 migrations
        env:
          CONFIG: ${{ steps.provision.outputs.config }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --config "$CONFIG"

      # Products and prices as code: billing/paddle-catalog.json is synced to Paddle and the price ids
      # are read back, never pasted. Skipped (and checkout stays dark) without the Paddle key. Only items
      # tagged custom_data.app=jobshop-quote are touched; nothing is deleted.
      # A Paddle problem must not block shipping the app: a failed sync warns and leaves price_ids empty,
      # so the secret sync below falls back to JOBSHOP_BILLING_PRICE_IDS (or checkout stays dark).
      - name: Sync the Paddle catalog
        id: paddle
        env:
          BILLING_API_KEY: ${{ secrets.JOBSHOP_BILLING_API_KEY }}
        run: |
          if [[ -z "$BILLING_API_KEY" ]]; then echo "JOBSHOP_BILLING_API_KEY not set: paid plans stay dark"; exit 0; fi
          out="$RUNNER_TEMP/paddle-price-ids.json"
          if node ../../packages/billing/scripts/paddle-catalog.ts --catalog billing/paddle-catalog.json --apply --price-ids-out "$out" \
             && ids="$(jq -c . "$out")"; then
            echo "price_ids=$ids" >>"$GITHUB_OUTPUT"
          else
            echo "::warning title=Paddle catalog sync failed::The app still deploys; price ids fall back to JOBSHOP_BILLING_PRICE_IDS if set."
          fi

      # Inbound RFQ email as code (apps/jobshop-quote/email-routing.json, docs/EMAIL.md "Routing as code"):
      # Email Routing on the inbound subdomain, subaddressing, and one rule rfq@<domain> -> this worker.
      # Opt in with the variable JOBSHOP_INBOUND_EMAIL=on. A failure keeps inbound email off (the app never
      # shows an address mail cannot reach) and does not block the deploy: the step warns and succeeds
      # without writing inbound_domain, so the Deploy step below leaves RFQs by email off.
      - name: Inbound email routing
        id: routing
        if: ${{ vars.JOBSHOP_INBOUND_EMAIL == 'on' }}
        env:
          # Needs Zone: Email Routing Rules Edit + Zone Settings Edit (+ DNS Read to see the subdomain).
          # Empty = the deploy token above, which must then carry those permissions.
          ROUTING_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_ROUTING_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.MARISSTELLA_ZONE_ID }}
        run: |
          if [[ -n "$ROUTING_TOKEN" ]]; then
            # Used exactly as stored, scoped to this step.
            export CLOUDFLARE_API_TOKEN="$ROUTING_TOKEN"
          fi
          if ! APPLY=1 node ./scripts/email-routing.mjs; then
            echo "::warning title=Inbound email stays off::Email Routing could not be set up (see the log; the token needs Email Routing Rules Edit and Zone Settings Edit). RFQs by email stay off this deploy."
          fi

      - name: Deploy
        id: deploy
        env:
          CONFIG: ${{ steps.provision.outputs.config }}
          APP_URL: ${{ steps.urls.outputs.app_url }}
          # The sender domain must be onboarded to Cloudflare Email Service (apps/jobshop-quote/docs/EMAIL.md).
          EMAIL_FROM: ${{ vars.JOBSHOP_EMAIL_FROM || 'Job Shop Quote <no-reply@marisstella.app>' }}
          # Not secret ("paddle" or "none"); a var because a Worker secret cannot share a var's name.
          BILLING_PROVIDER: ${{ vars.JOBSHOP_BILLING_PROVIDER || 'none' }}
          # Inbound RFQ email (docs/EMAIL.md): the domain the routing step just set up, else a domain the
          # owner routes by hand (an apex catch-all to this worker); empty keeps it off.
          INBOUND_EMAIL_DOMAIN: ${{ steps.routing.outputs.inbound_domain || vars.JOBSHOP_INBOUND_EMAIL_DOMAIN }}
          # QuickBooks Online (docs/QUICKBOOKS.md): sandbox until the owner's Intuit app is approved for
          # production; dark until the three JOBSHOP_QBO_* secrets below are set.
          QBO_ENVIRONMENT: ${{ vars.JOBSHOP_QBO_ENVIRONMENT || 'sandbox' }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          inbound="$(printf '%s' "$INBOUND_EMAIL_DOMAIN" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ -n "$inbound" && ! "$inbound" =~ ^[a-z0-9.-]+$ ]]; then
            echo "::warning title=Bad inbound email domain::'$inbound' is not a bare host name; RFQs by email stay off this deploy."
            inbound=""
          fi
          pnpm exec wrangler deploy --config "$CONFIG" \
            --var "APP_ENV:production" --var "APP_URL:${APP_URL%/}" --var "EMAIL_FROM:$EMAIL_FROM" \
            --var "BILLING_PROVIDER:$BILLING_PROVIDER" --var "INBOUND_EMAIL_DOMAIN:$inbound" \
            --var "QBO_ENVIRONMENT:$QBO_ENVIRONMENT" \
            --var "QBO_REDIRECT_URI:${APP_URL%/}/api/integrations/quickbooks/callback" \
            --message "${GITHUB_SHA::12} via workflow_dispatch (run ${GITHUB_RUN_ID})"
          version="$(jq -r 'select(.type=="deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -1 || true)"
          echo "version_id=$version" >>"$GITHUB_OUTPUT"

      - name: Sync secrets from GitHub (non-empty only)
        env:
          CONFIG: ${{ steps.provision.outputs.config }}
          S_AUTH_SECRET: ${{ secrets.JOBSHOP_AUTH_SECRET }}
          # The app's own key only (no shared fallback), so its spend is the owner's explicit choice and
          # can be capped and rotated apart from other products'.
          S_ANTHROPIC_API_KEY: ${{ secrets.JOBSHOP_ANTHROPIC_API_KEY }}
          S_BILLING_API_KEY: ${{ secrets.JOBSHOP_BILLING_API_KEY }}
          S_BILLING_WEBHOOK_SECRET: ${{ secrets.JOBSHOP_BILLING_WEBHOOK_SECRET }}
          S_BILLING_PRICE_IDS: ${{ steps.paddle.outputs.price_ids || secrets.JOBSHOP_BILLING_PRICE_IDS }}
          S_QBO_CLIENT_ID: ${{ secrets.JOBSHOP_QBO_CLIENT_ID }}
          S_QBO_CLIENT_SECRET: ${{ secrets.JOBSHOP_QBO_CLIENT_SECRET }}
          S_QBO_TOKEN_KEY: ${{ secrets.JOBSHOP_QBO_TOKEN_KEY }}
        run: |
          umask 077
          file="$RUNNER_TEMP/worker-env.json"
          trap 'rm -f "$file"' EXIT
          node -e '
            const out = {};
            for (const [k, v] of Object.entries(process.env)) {
              if (k.startsWith("S_") && v && v.trim()) out[k.slice(2)] = v;
            }
            require("node:fs").writeFileSync(process.argv[1], JSON.stringify(out));
            console.log(`syncing ${Object.keys(out).length} secret(s): ${Object.keys(out).sort().join(", ") || "none"}`);
          ' "$file"
          if [[ "$(jq 'length' "$file")" -gt 0 ]]; then
            pnpm exec wrangler secret bulk "$file" --name jobshop-quote --config "$CONFIG"
          fi

      # The app refuses to start sessions without AUTH_SECRET. Generated once, stored only on the Worker.
      - name: Generate AUTH_SECRET if missing (never overwrites)
        env:
          CONFIG: ${{ steps.provision.outputs.config }}
        run: |
          # Fails the step (pipefail) if the list cannot be read: never guess and overwrite a secret.
          existing="$(pnpm exec wrangler secret list --format json --name jobshop-quote --config "$CONFIG" \
            | sed -n '/^\[/,$p' | jq -r '.[].name')"
          if grep -qx AUTH_SECRET <<<"$existing"; then
            echo "AUTH_SECRET already set: keeping it"
          else
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s' "$value" | pnpm exec wrangler secret put AUTH_SECRET --name jobshop-quote --config "$CONFIG" >/dev/null
            unset value
            echo "AUTH_SECRET generated and stored on the Worker (write-only)"
          fi

      - name: Smoke test /api/health
        env:
          APP_URL: ${{ steps.urls.outputs.app_url }}
        run: |
          url="${APP_URL%/}/api/health"
          # A new custom domain's certificate can take a few minutes on its first deploy.
          deadline=$((SECONDS + 300))
          until body="$(curl -fsS --max-time 10 "$url" 2>/dev/null)" && jq -e '.ok == true and .app == "jobshop-quote"' <<<"$body" >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "::error::$url did not answer ok within 300s (last: ${body:-no response})"
              exit 1
            fi
            sleep 3
          done
          echo "healthy: $url -> $body"
          # Sign-up needs a verified email in production: without mail nobody can finish signing up.
          if ! jq -e '.email == true' <<<"$body" >/dev/null; then
            echo "::warning title=Account mail is off::$url reports email:false, so nobody can verify an address and finish signing up. Onboard the EMAIL_FROM sender domain to Cloudflare Email Service (apps/jobshop-quote/docs/EMAIL.md) and re-run."
          fi

      - name: Summary
        if: always()
        env:
          APP_URL: ${{ steps.urls.outputs.app_url }}
          VERSION: ${{ steps.deploy.outputs.version_id }}
        run: |
          {
            echo "### jobshop-quote-deploy"
            echo "- url: ${APP_URL:-n/a}"
            echo "- version: \`${VERSION:-n/a}\` (rollback: \`pnpm exec wrangler rollback <version-id> --name jobshop-quote\`)"
            echo "- commit: \`$GITHUB_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
