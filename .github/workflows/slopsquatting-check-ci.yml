name: slopsquatting-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared heuristic
# engine, `cli.mjs` is the Node gate that queries the npm registry, and
# `page.test.mjs`/`vs-socket.test.mjs` cover the page wiring and the
# comparison page. Keep all four covered independently of the
# portfolio-wide validation workflow, which only checks published pages
# and does not run venture unit tests. Without this file,
# `validate_workflows.py` fails the moment the venture's `*.test.mjs`
# files land -- the same hole `license-drift-check-ci.yml` documents.
on:
  pull_request:
    paths:
      - "ventures/slopsquatting-check/**"
      - ".github/workflows/slopsquatting-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/slopsquatting-check/**"
      - ".github/workflows/slopsquatting-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slopsquatting-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/slopsquatting-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, page-wiring, and comparison-page tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs vs-socket.test.mjs
