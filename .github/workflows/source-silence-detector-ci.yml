name: source-silence-detector CI

# Test coverage for the source-silence detector probe under
# portfolio/pipeline/probes/source-silence-detector/. The test suite is
# standard-library-only and makes no network calls at all — it derives everything
# from committed JSON (register-change-rate's saved records plus this probe's own
# prior-history fetch) — so this workflow does no more than a contributor runs
# locally: run the tests. It publishes nothing, registers nothing, and spends no
# API budget; it is a test runner, not the unattended-automation kind of workflow
# CLAUDE.md gates. In particular it does NOT run fetch_prior_history.py, which is
# the one script here that clones from the network; its output is committed and
# the tests read that.
#
# Matching the runners the sibling probes already have (eaa-wcag-triage,
# npm-reachability-triage, register-change-rate).
#
# What must not reach main unseen is this probe's headline finding, because it is
# a *negative* one and negative findings rot quietly. As of the 2026-08-21
# amendment there are two, and the second reverses the first's prescription:
#
#   1. On the 180-day window, a per-source cadence threshold catches 0 of the 2
#      registers that went silent at every parameter setting, and a fallback
#      catches 2 of 2.
#   2. On full history, that same fallback configuration catches 0 of 2 — because
#      a worst-gap anchor only ever loosens — and a p99 quantile anchor catches
#      1 of 2 at 8 days with 1 nuisance alarm-day. The miss is measured to be
#      undetectable rather than mistuned.
#   3. Held out (amendment 2), that p99 setting detects 6 of 17 historical
#      dormancy episodes rather than the 8 of 17 it scores in sample, and the
#      anchor is *arithmetically identical to max* on any source with fewer than
#      100 closed gaps — which includes FDA/openfda, the source carrying 9 of the
#      17 episodes.
#
# All three are asserted directly against the saved measurements, in
# TestHeadlineNumbersAgainstRealData, TestFullHistoryFindingsAgainstRealData and
# TestAgainstTheCommittedHistory, so an edit that changes any of them fails here
# rather than in a document nobody re-runs.
#
# It also depends on a file in a different directory
# (register-change-rate/results-2026-08-20.json), so that path is a trigger too —
# otherwise a change there could invalidate this probe's tables with nothing red.

on:
  pull_request:
    paths:
      - "portfolio/pipeline/probes/source-silence-detector/**"
      - "portfolio/research/register-change-rate/results-2026-08-20.json"
      - ".github/workflows/source-silence-detector-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/pipeline/probes/source-silence-detector/**"
      - "portfolio/research/register-change-rate/results-2026-08-20.json"
      - ".github/workflows/source-silence-detector-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: source-silence-detector-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/pipeline/probes/source-silence-detector

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install step, by design.
      - run: python3 -m unittest discover -p 'test_*.py'
      # Every invocation the README documents must keep running: the first
      # reproduces the negative result it leads with, the second the config the
      # first pass recommended (now superseded, still documented), the third the
      # operating point it recommends today.
      - run: python3 detect_silence.py
      - run: python3 detect_silence.py --fallback pooled --multiplier 2.0 --min-gaps 2 --sweep
      - run: |
          python3 detect_silence.py --prior-history prior-history-2026-08-21.json \
            --anchor quantile --quantile 0.99 --sweep
      # Amendment 3's small-sample anchors. Each is reachable from the CLI, so
      # each must keep parsing and rendering — a family that only ever runs
      # inside the backtest can break in the product without CI noticing.
      - run: |
          for anchor in interpolated lognormal exponential; do
            python3 detect_silence.py --prior-history prior-history-2026-08-21.json \
              --anchor "$anchor" --quantile 0.99
          done
      # Amendment 2's held-out validation. Reads the same committed history file;
      # no network, no arguments needed for the documented invocation.
      # Amendment 3 added three sections to its report; the run covers them.
      - run: python3 holdout_backtest.py
      # The fetcher's network path is deliberately not exercised; --help is enough
      # to catch an import or argument-parsing break in a file CI otherwise never
      # loads outside its unit tests.
      - run: python3 fetch_prior_history.py --help
