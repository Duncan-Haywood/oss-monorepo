name: call-recording-consent-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared state-consent
# lookup table and interstate-assessment/disclosure-script logic; `cli.mjs`
# is the `check`/`states`/`script` CLI entry point; `page.test.mjs` covers
# the browser page's structure, disclaimers, and worked example, pinned
# against the real engine. Keep all three covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file, `validate_workflows.py`
# would fail the moment the venture's `*.test.mjs` files land -- the same
# hole `hoa-reserve-fund-calculator-ci.yml` and `cron-dst-drift-check-ci.yml`
# already document.
on:
  pull_request:
    paths:
      - "ventures/call-recording-consent-check/**"
      - ".github/workflows/call-recording-consent-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/call-recording-consent-check/**"
      - ".github/workflows/call-recording-consent-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: call-recording-consent-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/call-recording-consent-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every test in the venture
        run: node --test
