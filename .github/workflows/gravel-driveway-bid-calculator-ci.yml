name: gravel-driveway-bid-calculator CI

# Test runner for the browser-local gravel driveway bid calculator.
# The product is static ES modules with no build step and no dependencies,
# so this does no more than a contributor runs locally: `node --test`. It
# publishes nothing, registers nothing, and spends no API budget — it is
# not the unattended-automation kind of workflow CLAUDE.md gates.
#
# Same shape as janitorial-bid-calculator-ci.yml.

on:
  pull_request:
    paths:
      - "ventures/gravel-driveway-bid-calculator/**"
      - ".github/workflows/gravel-driveway-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/gravel-driveway-bid-calculator/**"
      - ".github/workflows/gravel-driveway-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: gravel-driveway-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/gravel-driveway-bid-calculator
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- but nothing showed the author that until the
      # Pages job went red on main, after the merge, naming a workflow they
      # never touched. Checked here so the venture that needs the clause is the
      # one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs gravel-driveway-bid-calculator

