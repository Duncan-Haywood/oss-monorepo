# PR checks for apps/einvoice-site (the E-invoice fix-and-explain marketing site: zero-dependency
# static site + worker; moved from the private repository, task products-to-public-repo).
# Read-only, no secrets.
name: einvoice-site-ci
on:
  pull_request:
    paths:
      - "apps/einvoice-site/**"
      - ".github/workflows/einvoice-site-ci.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "biome.json"
  push:
    branches: [main]
    paths:
      - "apps/einvoice-site/**"
      - ".github/workflows/einvoice-site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einvoice-site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: einvoice-site lint, build, tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            apps/einvoice-site
            packages
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # The root workspace (package.json, pnpm-lock.yaml) carries biome; install only the root.
      - run: pnpm install --frozen-lockfile --filter paid-apps
      - name: Biome
        run: pnpm exec biome ci apps/einvoice-site
      - name: Build (dev)
        working-directory: apps/einvoice-site
        run: node build.mjs
      - name: Tests
        working-directory: apps/einvoice-site
        run: node --test test/*.test.mjs
