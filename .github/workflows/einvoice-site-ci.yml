# PR checks for apps/einvoice-site (the E-invoice Fix & Explain marketing site, moved from the
# private repository; task products-to-public-repo): zero-dependency static site + worker.
# Read-only; it reads no secret at all. Biome runs once the root workspace (PayApps' move) is in.
name: einvoice-site-ci
on:
  pull_request:
    paths:
      - "apps/einvoice-site/**"
      - ".github/workflows/einvoice-site-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/einvoice-site/**"
      - ".github/workflows/einvoice-site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einvoice-site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/einvoice-site

jobs:
  check:
    name: einvoice-site build, tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            apps/einvoice-preflight
            apps/einvoice-site
            packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build (dev)
        run: node build.mjs
      - name: Tests
        run: node --test test/*.test.mjs
