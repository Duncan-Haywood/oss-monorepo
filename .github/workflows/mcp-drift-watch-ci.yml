name: mcp-drift-watch CI

# Test coverage for the MCP drift-watch probe under
# portfolio/pipeline/probes/mcp-drift-watch/. The suite is standard-library-only
# and makes no network calls: it derives everything from committed JSON (this
# probe's held-out corpus and its hand labels). This workflow does no more than a
# contributor runs locally. It publishes nothing, registers nothing, and spends
# no API budget — a test runner, not the unattended-automation kind of workflow
# CLAUDE.md gates. It deliberately does NOT run collect_holdout.py or
# render_sample.py, the two scripts that fetch from npm; their output is
# committed and the tests read that.
#
# Matching the runners the sibling probes already have (eaa-wcag-triage,
# npm-reachability-triage, source-silence-detector, agent-permission-harness).
#
# What must not reach main unseen is this probe's headline finding, because it is
# a negative one about a number that looks fine:
#
#   Across three corpora the shipped classifier flags 7.2% / 7.4% / 5.4% of
#   description changes, with precision 0.40 / 0.625 on the two that were
#   scored and recall 0.24–0.29 / 0.10–0.11. Nothing replicated, and the rate
#   is the figure that looked stable longest. The three rule edits the second
#   corpus argued for are worth precision 0.40 → 1.00 in sample and
#   0.625 → 0.778 out of it, ranked in the reverse order.
#
# Every figure printed in the subscriber record is re-derived here from
# holdout-labels-2026-08-22.json and holdout-labels-c3-2026-08-22.json rather
# than trusted, so a revised rate fails this build instead of going stale in
# front of a buyer. The counterfactual the README leans on — that retiring
# `secret_or_credential` would cost no true positive — is asserted too, since it
# is the first thing a rules edit would break. So is the claim that the two
# held-out corpora share no package, which is what makes the second one a
# second measurement rather than more of the first.
#
# The probe imports its classifier from portfolio/research/mcp-tool-drift/
# rather than forking it, so a change there can invalidate every number here.
# That path is a trigger for exactly that reason.

on:
  pull_request:
    paths:
      - "portfolio/pipeline/probes/mcp-drift-watch/**"
      - "portfolio/research/mcp-tool-drift/classify_drift.py"
      - "portfolio/research/mcp-tool-drift/results-2026-08-19-classified.json"
      - ".github/workflows/mcp-drift-watch-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/pipeline/probes/mcp-drift-watch/**"
      - "portfolio/research/mcp-tool-drift/classify_drift.py"
      - "portfolio/research/mcp-tool-drift/results-2026-08-19-classified.json"
      - ".github/workflows/mcp-drift-watch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: mcp-drift-watch-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/pipeline/probes/mcp-drift-watch

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python3 -m pytest -q
      # The scoring must be reproducible from the committed corpus with no
      # network at all: this is the invocation the README documents, and it
      # exits non-zero if a hand label matches no change in the corpus.
      - run: python3 build_labels.py
      # The same for the third corpus, which also re-scores the rule variants.
      - run: python3 build_labels_c3.py
      - run: python3 rule_variants.py --corpus results-holdout-c3-2026-08-22.json
      # The named-tool-relation rule's figures, including the one that matters:
      # it finds 32 of corpus 3's 44 misses and 2 of corpus 2's, so the
      # in-sample/out-of-sample gap is itself the result and must not drift.
      - run: python3 score_relation.py
      # The model pass's score is a claim in the README too, and it is derived
      # from a committed transcript rather than by calling a model here.
      - run: python3 score_model_pass.py
      # The per-publisher split of both classifiers. This also exercises
      # score_by_publisher.py, which it imports rather than forks — the whole
      # comparison rests on the two being scored by one summariser, so an edit
      # that makes them diverge must fail here.
      - run: python3 score_model_by_publisher.py
      # The two fetching scripts are never run here, but an import or
      # argument-parsing break in them would otherwise be invisible to CI.
      - run: python3 collect_holdout.py --help
      - run: python3 render_sample.py --help
