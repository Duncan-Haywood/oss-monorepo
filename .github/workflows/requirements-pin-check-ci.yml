name: requirements-pin-check CI

# Zero-dependency CLI/browser tool: `classify.mjs` is shared by the in-browser page and the CLI. Keep
# it covered independently of the portfolio-wide validation workflow, which
# only checks published pages and does not run venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/requirements-pin-check/**"
      - ".github/workflows/requirements-pin-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/requirements-pin-check/**"
      - ".github/workflows/requirements-pin-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requirements-pin-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/requirements-pin-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run checker tests (including CLI parity)
        run: node --test classify.test.mjs
      - name: Run page tests (disclaimers, SEO metadata, sitemap coverage)
        run: node --test page.test.mjs
