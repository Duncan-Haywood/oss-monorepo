name: local-site-studio CI

on:
  pull_request:
    paths:
      - "ventures/local-site-studio/**"
      - ".github/workflows/local-site-studio-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/local-site-studio/**"
      - ".github/workflows/local-site-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-site-studio-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/local-site-studio

jobs:
  verify:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventures/local-site-studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
