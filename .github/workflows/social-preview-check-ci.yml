name: social-preview-check CI

# Zero-dependency CLI/browser tool: `analyze.mjs` is the shared,
# independently-tested classification engine, `metatags.mjs` and
# `imagesize.mjs` are the pure parsers it and the network layer both rely
# on, `probe.mjs` is the network layer (tested against a local loopback
# HTTP server, never the real internet), `check.mjs` is the CLI entry
# point, and `page.test.mjs` covers the browser report-viewer's wiring
# (including its worked example, which must exercise real danger findings
# through this venture's own engine). Keep all of it covered independently
# of the portfolio-wide validation workflow, which only checks published
# pages and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `security-headers-check-ci.yml`
# and its siblings document.
on:
  pull_request:
    paths:
      - "ventures/social-preview-check/**"
      - ".github/workflows/social-preview-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/social-preview-check/**"
      - ".github/workflows/social-preview-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-preview-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/social-preview-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- bare `node --test` walks the working
      # directory, so a test file added later is covered automatically
      # rather than needing this list to be kept in sync by hand.
      - name: Run every test in the venture
        run: node --test
