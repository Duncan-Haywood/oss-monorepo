name: OpenCode high-throughput portfolio agents

# Hourly agent fleet using the cheap OpenCode model.
# Uses OPENCODE_API_KEY secret for API-based access.
# Each agent independently consults the portfolio router and claims work from
# the highest-priority venture.
#
# Default agent count is 10, down from an initial default of 20, as a
# deliberate choice to run this at a smaller scale. portfolio/router/allocate.py
# (merged 2026-08-18) now gives the "consult the router" step in
# .github/prompts/portfolio-work.md something real to read. That prompt also
# now requires each agent to check open PRs before starting work, to cut down
# on the duplicate-PR waste this fleet produced on 2026-08-18 (see CLAUDE.md).
# Watch whether that guardrail actually holds before raising agent count again.
#
# Schedule trigger disabled 2026-08-19; still disabled, but NOT for the
# reason this comment used to give. Corrected 2026-08-20 against the full
# run history (763 runs, GitHub REST /actions/runs), because the original
# text was being read as a standing instruction to go check a billing page.
#
# What actually happened: from 2026-08-18T17:23:11Z to 2026-08-19T11:33:25Z
# (18h10m) every run in the repo returned "startup_failure" with name null,
# path "BuildFailed", and zero jobs -- 519 runs, no job ever scheduled. The
# earlier text blamed commit f16fca5 (2026-08-18T18:42:33Z), which added
# this workflow. The timeline refutes that: 16 of those failures had already
# accumulated in the 17:00 hour, up to 79 minutes BEFORE f16fca5 existed.
# Whatever caused the outage predates this fleet.
#
# It is over, and it ended without anyone touching billing. Zero
# startup_failures in the 242 runs since; 170 runs in the last 12 hours, all
# scheduling jobs normally. So "confirm the Actions spending limit / abuse
# flag first" -- the instruction that used to live here -- is a check that
# now comes back clean regardless, and must NOT be read as clearance to
# re-enable the schedule.
#
# One artifact of that period is still live: GitHub lists 23 registered
# workflows against 22 files on main. The extra is
# .github/workflows/repo-advancement-agent.yml, which exists only on #19's
# branch, has never been on main, and is registered with name equal to its
# own path -- GitHub's fallback when it cannot parse the file. Comparing the
# registered-workflow count to the file count is a cheap detector for this
# class of failure and is worth re-running before trusting any CI signal.
#
# The binding reason the schedule stays off is now economic, not technical.
# This repo is private, so Actions minutes are billed. At the configured
# scale -- hourly, max-parallel 10, timeout-minutes 120 -- the fleet's
# Actions bill alone runs from roughly $288/month (if every agent job
# finished in 5 minutes) to about $6,900/month (if jobs ran to timeout), on
# top of whatever OPENCODE_API_KEY spends. Against that,
# portfolio/ledger/break-even.md puts the portfolio's best-case revenue
# ceiling at $193/month, and today's ceiling at $0 because no channel lets
# an unattended agent take money. Even the cheapest end of that range
# exceeds the best case the portfolio's own research supports.
#
# Re-enabling the schedule remains a human call, per CLAUDE.md's rule that
# unattended paid-spend automation is a deliberate, human-reviewed decision
# -- and it is a spend decision to weigh against the ceiling above, not a
# billing-page check to clear.
on:
  workflow_dispatch:
    inputs:
      num_agents:
        description: Number of parallel agents to spawn
        required: false
        default: "10"
        type: string
      model:
        description: OpenCode model ID (cheap/fast models recommended)
        required: false
        default: "opencode/deepseek-v4-flash"
        type: string

# File-level floor kept to the read-only default. It used to grant
# contents/pull-requests/id-token write at this level, which every job in the
# file inherited whether or not it asked for it -- including `resolve-config`
# below, which only computes a matrix and echoes it to $GITHUB_OUTPUT and
# never touches the API at all. `agent-permission-harness`'s R5 rule
# (portfolio/pipeline/probes/agent-permission-harness/) names this file for
# exactly that: a job silently holding a write-capable token because of where
# it lives, not because it needs one. The actual write scopes now live only on
# `opencode-agent`, the one job that pushes a branch and opens a PR.
permissions:
  contents: read

jobs:
  resolve-config:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      num_agents: ${{ steps.config.outputs.num_agents }}
      agent_ids: ${{ steps.config.outputs.agent_ids }}
    steps:
      - id: config
        shell: bash
        env:
          NUM_AGENTS_INPUT: ${{ github.event.inputs.num_agents }}
        run: |
          # Resolve agent count (default 10, cap at 100 to avoid resource explosion)
          num_agents="${NUM_AGENTS_INPUT:-10}"
          if ! [[ "$num_agents" =~ ^[0-9]+$ ]]; then
            echo "::warning::Invalid num_agents '${num_agents}', using 10"
            num_agents=10
          fi
          if (( num_agents > 100 )); then
            echo "::warning::num_agents capped at 100 (requested ${num_agents})"
            num_agents=100
          fi
          echo "num_agents=${num_agents}" >> "$GITHUB_OUTPUT"

          # Generate agent IDs as a JSON array (0..num_agents-1)
          ids=()
          for (( i=0; i<num_agents; i++ )); do
            ids+=("$i")
          done
          printf '%s\n' "agent_ids=$(printf '%s\n' "${ids[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  opencode-agent:
    # Secrets live in the `paid-agents` environment, limited to main
    # (docs/security/agent-hardening.md, step 4).
    environment: paid-agents
    needs: resolve-config
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    # The only job in this file that needs a write-capable token: it pushes a
    # branch and opens a pull request (`use_github_token: true` below).
    # Declared explicitly rather than inherited from the file-level floor --
    # same three scopes the floor granted every job before this change, just
    # now a decision this job makes rather than a side effect of the file it
    # lives in.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        agent_id: ${{ fromJSON(needs.resolve-config.outputs.agent_ids) }}
    concurrency:
      # Per-agent concurrency: each agent has its own lock to avoid claiming conflicts
      # but agents with different IDs can run in parallel
      group: opencode-agent-portfolio-${{ matrix.agent_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch latest main (for fresh router allocation)
        run: |
          # This job checks out with `fetch-depth: 0` (a full clone), and a
          # `--depth` fetch writes `.git/shallow` and truncates the WHOLE
          # repository -- so the unconditional `--depth=50` here threw away
          # the complete history the checkout had just asked for, on a runner
          # as well as locally. Deepen only what is already shallow.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch origin main --depth=50
          else
            git fetch origin main
          fi

      - name: Prepare prompt
        id: prompt
        run: |
          PROMPT_PATH="${RUNNER_TEMP:-/tmp}/agent-prompt.md"
          {
            cat ".github/prompts/portfolio-work.md"
            echo
            echo "## Run context"
            echo
            echo "- Agent: opencode-agent-${{ matrix.agent_id }}"
            echo "- Prompt: portfolio-work"
            echo "- Repository: ${GITHUB_REPOSITORY:-unknown}"
            echo "- Workflow run: ${GITHUB_RUN_ID:-unknown}"
            echo
            echo "Start now. Consult the router, claim work, implement, verify, open a PR, and merge it once it is verified. A pushed branch with no merged PR is unfinished work."
          } > "$PROMPT_PATH"

          # portfolio-work.md is REPO_WRITE, so a line equal to a fixed delimiter
          # would close this value early and the rest would parse as more outputs.
          DELIM="PROMPT_EOF_$(openssl rand -hex 16)"
          {
            echo "body<<${DELIM}"
            cat "$PROMPT_PATH"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Run OpenCode agent
        uses: anomalyco/opencode/github@e5cc278dec9294a627a7b05f47ce6a564408c1a2 # v1.18.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ github.event.inputs.model || 'opencode/deepseek-v4-flash' }}
          prompt: ${{ steps.prompt.outputs.body }}
          use_github_token: true
