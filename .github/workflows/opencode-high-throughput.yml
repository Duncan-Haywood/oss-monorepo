name: OpenCode high-throughput portfolio agents

# Hourly agent fleet using the cheap OpenCode model (GitHub Actions currently disabled).
# Uses OPENCODE_API_KEY secret for API-based access.
# Implements the entrypoint pattern to prevent duplicate work:
#   1. One sequential step analyzes state and emits work plan (entrypoint)
#   2. Parallel agents execute assigned work items (not independent discovery)
#
# The old approach: each agent independently checked open PRs and claimed work.
# Race condition: agent A checks (empty), opens PR X; agent B checks 5s later
# (A's PR not visible yet), opens duplicate PR X. Documentation alone doesn't
# prevent this; a deterministic plan does.
#
# GITHUB ACTIONS DISABLED 2026-08-19: Every workflow in the repo (all 53 runs)
# failed with "startup_failure" starting from commit f16fca5 (2026-08-18) when
# this workflow was added at 20 parallel 120-minute jobs/hour. The signature
# (zero-job "BuildFailed" on every workflow, not YAML-related) matches GitHub
# account-level Actions lockdown (spending limit or abuse flag). The schedule
# is DISABLED; workflow_dispatch still works for manual single-run testing.
#
# TO RE-ENABLE:
#   1. Check GitHub billing settings: verify spending limit is raised or
#      disabled, or that monthly reset/limit is intentional
#   2. Check Security & Analysis: verify Actions abuse flag is cleared
#   3. If clear: uncomment schedule below and re-enable workflow_dispatch
#   4. Start with a small manual run (1-2 agents) to verify it doesn't
#      immediately re-trigger the account lockdown
#
# This is not a YAML error or a script bug — it is a spending policy decision.
# Per CLAUDE.md, unattended paid-spend automation requires human review before
# re-enabling. The account lockdown is the policy enforcement mechanism.
on:
  workflow_dispatch:
    inputs:
      num_agents:
        description: Number of parallel agents to spawn
        required: false
        default: "10"
        type: string
      model:
        description: OpenCode model ID (cheap/fast models recommended)
        required: false
        default: "opencode/deepseek-v4-flash"
        type: string
  # SCHEDULE DISABLED 2026-08-19: Account lockdown still active.
  # Re-enabling requires explicit review and approval.
  # See CLAUDE.md for re-enable checklist.
  # schedule:
  #   - cron: '5 * * * *'  # Would run hourly at :05 UTC

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  guardrails:
    name: Pre-flight safety checks
    runs-on: ubuntu-latest
    outputs:
      should_proceed: ${{ steps.check.outputs.should_proceed }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Run safety checks
        id: check
        run: |
          echo "🔍 Running pre-flight safety checks..."

          # Check 1: Verify OPENCODE_API_KEY is available
          if [[ -z "${{ secrets.OPENCODE_API_KEY }}" ]]; then
            echo "should_proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=OPENCODE_API_KEY not configured" >> "$GITHUB_OUTPUT"
            echo "  ⚠️  SKIP: OPENCODE_API_KEY secret not found"
            exit 0
          fi

          # Check 2: Verify portfolio router module is available
          if ! python3 -c "import sys; sys.path.insert(0, 'portfolio/router'); from allocate import work_queue; print('OK')" 2>/dev/null | grep -q OK; then
            echo "should_proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=Portfolio router unavailable" >> "$GITHUB_OUTPUT"
            echo "  ⚠️  SKIP: Portfolio router module not found"
            exit 0
          fi

          echo "should_proceed=true" >> "$GITHUB_OUTPUT"
          echo "reason=All checks passed" >> "$GITHUB_OUTPUT"
          echo "  ✅ All checks passed, proceeding with agent fleet"

  entrypoint:
    needs: guardrails
    if: needs.guardrails.outputs.should_proceed == 'true'
    name: Analyze state and emit work plan
    runs-on: ubuntu-latest
    outputs:
      work_plan: ${{ steps.plan.outputs.plan }}
      agent_count: ${{ steps.plan.outputs.agent_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Analyze state
        id: plan
        run: |
          python3 .github/scripts/agent-entrypoint.py > /tmp/work-plan.json
          plan=$(cat /tmp/work-plan.json)
          agent_count=$(echo "$plan" | python3 -c "import sys, json; print(json.load(sys.stdin).get('next_agent_count', 0))")
          {
            echo "plan<<PLAN_EOF"
            echo "$plan"
            echo "PLAN_EOF"
            echo "agent_count=$agent_count"
          } >> "$GITHUB_OUTPUT"
          echo "Work plan: $agent_count agents recommended"
          cat /tmp/work-plan.json | python3 -m json.tool

  resolve-config:
    needs: [guardrails, entrypoint]
    if: needs.guardrails.outputs.should_proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      num_agents: ${{ steps.config.outputs.num_agents }}
      agent_ids: ${{ steps.config.outputs.agent_ids }}
    steps:
      - id: config
        shell: bash
        env:
          NUM_AGENTS_INPUT: ${{ github.event.inputs.num_agents }}
          ENTRYPOINT_AGENT_COUNT: ${{ needs.entrypoint.outputs.agent_count }}
        run: |
          echo "🔧 Resolving agent configuration..."

          # Resolve agent count: entrypoint takes precedence, input overrides on manual dispatch
          if [[ -n "$NUM_AGENTS_INPUT" ]]; then
            num_agents="$NUM_AGENTS_INPUT"
            reason="manual dispatch input"
          elif [[ -n "$ENTRYPOINT_AGENT_COUNT" && "$ENTRYPOINT_AGENT_COUNT" != "0" ]]; then
            num_agents="$ENTRYPOINT_AGENT_COUNT"
            reason="entrypoint recommendation"
          else
            num_agents="10"
            reason="default (10 agents hourly)"
          fi

          # Validation: ensure it's a valid number
          if ! [[ "$num_agents" =~ ^[0-9]+$ ]]; then
            echo "::warning::Invalid num_agents '${num_agents}', using 10"
            num_agents=10
            reason="fallback (invalid input)"
          fi

          # Guardrail: cap at 100 to avoid runaway spend
          if (( num_agents > 100 )); then
            echo "::warning::num_agents capped at 100 (requested ${num_agents})"
            num_agents=100
            reason="capped at max (100)"
          fi

          echo "num_agents=${num_agents}" >> "$GITHUB_OUTPUT"
          echo "✅ Agent count: $num_agents ($reason)"

          # Generate agent IDs as a JSON array (0..num_agents-1)
          ids=()
          for (( i=0; i<num_agents; i++ )); do
            ids+=("$i")
          done
          printf '%s\n' "agent_ids=$(printf '%s\n' "${ids[@]}" | jq -R . | jq -s .)" >> "$GITHUB_OUTPUT"

  opencode-agent:
    needs: [guardrails, resolve-config]
    if: needs.guardrails.outputs.should_proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        agent_id: ${{ fromJSON(needs.resolve-config.outputs.agent_ids) }}
    concurrency:
      # Per-agent concurrency: each agent has its own lock to avoid claiming conflicts
      # but agents with different IDs can run in parallel
      group: opencode-agent-portfolio-${{ matrix.agent_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch latest main (for fresh router allocation)
        run: |
          git fetch origin main --depth=50

      - name: Prepare prompt
        id: prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh 2>/dev/null || true
          if [[ -f .github/scripts/prepare-agent-prompt.sh ]]; then
            .github/scripts/prepare-agent-prompt.sh \
              ".github/prompts/portfolio-work.md" \
              "opencode-agent-${{ matrix.agent_id }}" \
              "portfolio-work"
            PROMPT_PATH="${RUNNER_TEMP:-/tmp}/agent-prompt.md"
          else
            # Fallback if script doesn't exist yet
            PROMPT_PATH="${RUNNER_TEMP:-/tmp}/agent-prompt.md"
            {
              cat ".github/prompts/portfolio-work.md"
              echo
              echo "## Run context"
              echo
              echo "- Agent: opencode-agent-${{ matrix.agent_id }}"
              echo "- Prompt: portfolio-work"
              echo "- Repository: ${GITHUB_REPOSITORY:-unknown}"
              echo "- Workflow run: ${GITHUB_RUN_ID:-unknown}"
              echo
              echo "Start now. Consult the router, claim work, implement, verify, and open a PR."
            } > "$PROMPT_PATH"
          fi
          {
            echo "body<<PROMPT_EOF"
            cat "$PROMPT_PATH"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run OpenCode agent
        uses: anomalyco/opencode/github@e5cc278dec9294a627a7b05f47ce6a564408c1a2 # v1.18.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ github.event.inputs.model || 'opencode/deepseek-v4-flash' }}
          prompt: ${{ steps.prompt.outputs.body }}
          use_github_token: true
