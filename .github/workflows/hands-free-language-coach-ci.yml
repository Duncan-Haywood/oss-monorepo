name: hands-free-language-coach CI

# Static browser-local voice app: plain ES modules, node --test, no
# package.json, no dependencies, no network.
# drill.mjs is the lesson logic (grading, review, streaks);
# usage.mjs is the anonymous local counter. Each has a sibling *.test.mjs.

on:
  pull_request:
    paths:
      - "ventures/hands-free-language-coach/**"
      - ".github/workflows/hands-free-language-coach-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/hands-free-language-coach/**"
      - ".github/workflows/hands-free-language-coach-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hands-free-language-coach-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/hands-free-language-coach

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
