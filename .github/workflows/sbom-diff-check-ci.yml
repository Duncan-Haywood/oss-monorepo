name: sbom-diff-check CI

# Zero-dependency CLI/browser tool: `sbom_diff.py` is the canonical
# comparison logic and `diff.mjs` is the same logic reimplemented for the
# in-browser page. Keep both covered independently of the portfolio-wide
# validation workflow, which only checks published pages and does not run
# venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/sbom-diff-check/**"
      - ".github/workflows/sbom-diff-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/sbom-diff-check/**"
      - ".github/workflows/sbom-diff-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-diff-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/sbom-diff-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run comparison tests (Python — the canonical CLI)
        run: python3 -m unittest test_sbom_diff -v
      - name: Run comparison tests (browser page logic, including CLI parity)
        run: node --test diff.test.mjs
      - name: Run usage-tracking tests
        run: node --test usage.test.mjs
      - name: Run page tests (disclaimers, SEO metadata, sitemap coverage)
        run: node --test page.test.mjs
