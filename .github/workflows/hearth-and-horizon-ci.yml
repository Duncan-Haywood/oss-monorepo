name: hearth-and-horizon CI

# Static story site: plain ES modules, node --test, no package.json, no
# dependencies, no network. stories.mjs renders the Markdown stories into
# pages and podcast feeds (generate.mjs writes them; the test fails if the
# committed output is stale); usage.mjs is the anonymous local counter.

on:
  pull_request:
    paths:
      - "ventures/hearth-and-horizon/**"
      - ".github/workflows/hearth-and-horizon-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/hearth-and-horizon/**"
      - ".github/workflows/hearth-and-horizon-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearth-and-horizon-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/hearth-and-horizon

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
