name: a11y-delivered-contrast CI

# Test coverage for portfolio/research/a11y-delivered-contrast/, which measures
# colour contrast (1.4.3) on the pages local-site-studio actually delivers —
# the corpus a11y-generated-sites/ rendered and then audited without ever
# handing either engine a stylesheet, so the criterion could not fire.
#
# Same shape as its siblings (a11y-axe-recall-ci.yml, a11y-own-sites-ci.yml):
# the full measurement needs a built venture and a browser, neither of which
# this workflow has, so it does no more than a contributor runs locally
# without them. The build-dependent tests skip themselves; the ones that
# matter here do not need a build. It publishes nothing, registers nothing,
# and spends no API budget.
#
# The load-bearing invariants this suite pins:
#   * WithoutStylesheet — on this corpus, an engine given no stylesheet
#     decides *nothing* (every element undecidable) and emits no 1.4.3
#     finding, which is byte-identical in the findings list to a page that
#     was checked and passed. That equivalence is why a real measurement was
#     published as "clean", and it is asserted rather than described.
#   * SavedResults — axe-core reports zero contrast violations here while
#     declining ~74% of the checks. A future run that stopped recording
#     axe's `incomplete` bucket would show the same zero with nothing to
#     qualify it, which is the mistake this directory exists to name.
#
# Both engines' paths are watched, because this suite imports them directly
# and a change to either can break it without touching this directory. In
# particular the CSS reader fix that made the delivered pages' gradient
# backgrounds visible at all lives in eaa-wcag-triage.

on:
  pull_request:
    paths:
      - "portfolio/research/a11y-delivered-contrast/**"
      - "portfolio/research/a11y-generated-sites/**"
      - "portfolio/research/a11y-own-sites/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-delivered-contrast-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/a11y-delivered-contrast/**"
      - "portfolio/research/a11y-generated-sites/**"
      - "portfolio/research/a11y-own-sites/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-delivered-contrast-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: a11y-delivered-contrast-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/a11y-delivered-contrast

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install, no npm install, no
      # browser. The tests that need a built venture skip themselves.
      - run: python3 -m unittest discover -p 'test_*.py'
      # This asserts that the committed file parses and its report still
      # renders. It does NOT catch a hand-edited number, as this comment claimed
      # until 2026-08-24: the file stores aggregates only, with no per-element
      # rows to re-derive them from, so there is no offline invariant to check
      # — unlike a11y-contrast-decidability and a11y-theme-resolution, whose
      # equivalent steps now do compare. The committed figures are pinned by the
      # test step above, which reads this same file; that is the real check.
      - run: python3 measure.py --recompute-from results-2026-08-21.json
