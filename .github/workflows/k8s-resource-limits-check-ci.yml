name: k8s-resource-limits-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared resource-limits
# checking engine, `yaml.mjs` is its own dependency-free YAML subset reader,
# `cli.mjs` is the Node gate, and `page.test.mjs` covers the page wiring. Keep
# all four covered independently of the portfolio-wide validation workflow,
# which only checks published pages and does not run venture unit tests.
# Without this file, `validate_workflows.py` would fail the moment the
# venture's `*.test.mjs` files land -- the same hole
# `k8s-deprecated-api-check-ci.yml` documents.
on:
  pull_request:
    paths:
      - "ventures/k8s-resource-limits-check/**"
      - ".github/workflows/k8s-resource-limits-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/k8s-resource-limits-check/**"
      - ".github/workflows/k8s-resource-limits-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-resource-limits-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/k8s-resource-limits-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run checking engine, YAML reader, CLI, and page-wiring tests
        run: node --test engine.test.mjs yaml.test.mjs cli.test.mjs page.test.mjs
