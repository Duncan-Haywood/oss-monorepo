name: cut-list-optimizer CI

# Test runner for the browser-local cut list optimizer. The product is static ES
# modules with no build step and no dependencies, so this does no more than a
# contributor runs locally: `node --test`. It publishes nothing, registers
# nothing, and spends no API budget — it is not the unattended-automation kind
# of workflow CLAUDE.md gates.
#
# Same shape as ebay-fee-calculator-ci.yml. This venture had no CI at all, which
# is how index.html shipped with an unclosed <textarea> that swallowed the app
# and stayed broken across three merged changes.

on:
  pull_request:
    paths:
      - "ventures/cut-list-optimizer/**"
      - ".github/workflows/cut-list-optimizer-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/cut-list-optimizer/**"
      - ".github/workflows/cut-list-optimizer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: cut-list-optimizer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/cut-list-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause and a
      # best-effort/no-SLA clause on every hosted page. Neither is visible to
      # this venture's own suite -- the clauses matter because the page gets
      # published, and the venture does not know it is being published. That
      # gap turned main red twice in two days (#1747, and again on the
      # sewer-line merge), each time in the Pages job rather than in the CI of
      # the venture that broke it. Checked here so the venture that needs the
      # clause is the one that goes red.
      - name: Published pages carry both liability clauses
        working-directory: .
        run: node platform/pages/clauses.mjs cut-list-optimizer

