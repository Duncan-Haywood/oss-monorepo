name: tender-bid-readiness CI
on:
  push:
    paths: ["ventures/tender-bid-readiness/**", ".github/workflows/tender-bid-readiness-ci.yml"]
  pull_request:
    paths: ["ventures/tender-bid-readiness/**", ".github/workflows/tender-bid-readiness-ci.yml"]

# The job only checks out the repo and runs the venture's tests, so a
# read-only token is all it needs. Without this the workflow inherits the
# repository default, which can be write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/tender-bid-readiness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test
