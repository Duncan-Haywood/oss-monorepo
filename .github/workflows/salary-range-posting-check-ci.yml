name: salary-range-posting-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared posting-text
# range scan and state-jurisdiction lookup table; `cli.mjs` is the
# `scan`/`states` CLI entry point; `page.test.mjs` covers the browser page's
# structure, disclaimers, and worked example, pinned against the real
# engine. Keep all five test files covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file, `validate_workflows.py`
# would fail the moment the venture's `*.test.mjs` files land -- the same
# hole `call-recording-consent-check-ci.yml` already documents.
on:
  pull_request:
    paths:
      - "ventures/salary-range-posting-check/**"
      - ".github/workflows/salary-range-posting-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/salary-range-posting-check/**"
      - ".github/workflows/salary-range-posting-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salary-range-posting-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/salary-range-posting-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every test in the venture
        run: node --test
