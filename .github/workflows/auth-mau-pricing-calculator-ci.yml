name: auth-mau-pricing-calculator CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared pricing
# engine, `cli.mjs` is the Node gate, and `page.test.mjs` covers the page
# wiring (including dogfooding the worked example through the engine). Keep
# all three covered independently of the portfolio-wide validation workflow,
# which only checks published pages and does not run venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/auth-mau-pricing-calculator/**"
      - ".github/workflows/auth-mau-pricing-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/auth-mau-pricing-calculator/**"
      - ".github/workflows/auth-mau-pricing-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-mau-pricing-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/auth-mau-pricing-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs auth-mau-pricing-calculator
