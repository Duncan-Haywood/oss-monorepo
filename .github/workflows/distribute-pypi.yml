# Publishes stdlib-only Python venture CLIs to PyPI, a few new projects per run.
# Off by default: with vars.DISTRIBUTE_PYPI unset this only prints a dry run.
# Free registry, no paid spend, no commits pushed. Spec: portfolio/distribution/README.md
name: distribute-pypi
on:
  schedule:
    - cron: '17 17 * * 4'
  workflow_dispatch:
permissions:
  contents: read
# One publish at a time: two overlapping runs could race to publish the same
# version, and a slow older run could land last.
concurrency:
  group: distribute-pypi
  cancel-in-progress: false
jobs:
  publish:
    # Secrets live in the `publish` environment, limited to main
    # (docs/security/agent-hardening.md, step 4).
    environment: publish
    permissions:
      contents: read
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install build twine
        if: ${{ vars.DISTRIBUTE_PYPI == 'true' }}
      - run: node platform/distribution/pypi.mjs
        env:
          DISTRIBUTE_PYPI: ${{ vars.DISTRIBUTE_PYPI }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
