name: wedding-florist-proposal-calculator CI

# Zero-dependency browser calculator: `calc.mjs` holds the arithmetic and is
# imported by the page rather than restated in it; `share.mjs` derives its
# field list from `calc.mjs`'s own DEFAULTS so a new input becomes shareable
# the moment it exists; `usage.mjs` is the opt-out-respecting local counter.
# `calc.test.mjs`, `page.test.mjs`, `content-pages.test.mjs` and
# `usage.test.mjs` cover all four independently of the portfolio-wide
# validation workflow, which only checks published pages and does not run
# venture unit tests. Without this file, `validate_workflows.py` fails the
# moment the venture's `*.test.mjs` files land -- the same hole
# `sql-migration-lock-check-ci.yml` and `redirect-chain-check-ci.yml` already
# document.
#
# The bunch rounding is the part most worth running on every change, and for
# the same reason those sibling workflows give: its bugs are silent. A recipe
# line mis-rounded produces a confident *wrong* wholesale figure for a
# proposal somebody is about to send a client, and a quote that is quietly
# low is indistinguishable from a correct one until the invoice arrives.
# `calc.test.mjs` pins the cases that separate the methods, including the
# pair showing a cost-percentage shrink allowance is wrong in both
# directions, and `content-pages.test.mjs` pins the three worked figures the
# comparison page quotes against the arithmetic that produces them, so the
# marketing copy cannot drift away from the tool.
on:
  pull_request:
    paths:
      - "ventures/wedding-florist-proposal-calculator/**"
      - ".github/workflows/wedding-florist-proposal-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/wedding-florist-proposal-calculator/**"
      - ".github/workflows/wedding-florist-proposal-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedding-florist-proposal-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/wedding-florist-proposal-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run arithmetic, page-wiring, content-page and usage tests
        run: node --test calc.test.mjs page.test.mjs content-pages.test.mjs usage.test.mjs
