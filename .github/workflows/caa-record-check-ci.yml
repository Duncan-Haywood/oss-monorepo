name: caa-record-check CI

# Zero-dependency browser/CLI tool: `parse.mjs` decodes both CAA wire
# formats and the RFC 8657 account-binding value grammar, `lookup.mjs` is
# the network layer (tested against an injected fake resolver, never the
# real internet), `analyze.mjs` applies RFC 8659's authorization rules
# (including the issuewild fallback and the critical-unknown-tag block),
# `check.mjs` is the CLI entry point, and `page.test.mjs` covers all three
# pages' wiring and disclaimers. Keep all six covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's `*.test.mjs`
# files land -- the same hole every sibling checker venture's own CI
# workflow documents.
on:
  pull_request:
    paths:
      - "ventures/caa-record-check/**"
      - ".github/workflows/caa-record-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/caa-record-check/**"
      - ".github/workflows/caa-record-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caa-record-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/caa-record-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- bare `node --test` walks the working
      # directory and cannot fall behind a file added later.
      - name: Run every test in the venture
        run: node --test
