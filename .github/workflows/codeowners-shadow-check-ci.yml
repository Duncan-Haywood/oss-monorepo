name: codeowners-shadow-check CI

# Zero-dependency CLI/browser tool: `codeowners.mjs` is the shared,
# independently-tested parsing/matching/resolution engine (no network, no
# filesystem), `check.mjs` is the CLI entry point (file discovery + `git
# ls-files`, tested against a real temp directory rather than this repo's
# own tree), and `page.test.mjs` covers the browser report-viewer. Keep all
# covered independently of the portfolio-wide validation workflow, which
# only checks published pages and does not run venture unit tests. Without
# this file, `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `canonical-tag-check-ci.yml` and
# its siblings document.
on:
  pull_request:
    paths:
      - "ventures/codeowners-shadow-check/**"
      - ".github/workflows/codeowners-shadow-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/codeowners-shadow-check/**"
      - ".github/workflows/codeowners-shadow-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeowners-shadow-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/codeowners-shadow-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- bare `node --test` walks the working
      # directory, so a test file added later is covered automatically
      # rather than needing this list to be kept in sync by hand.
      - name: Run every test in the venture
        run: node --test
