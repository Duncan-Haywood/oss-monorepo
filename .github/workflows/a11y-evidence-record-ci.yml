name: a11y-evidence-record CI

# Test coverage for the accessibility-audit probe under
# portfolio/research/a11y-evidence-record/ (merged in #285). It is
# standard-library-only and its suite needs no network, so this workflow does
# no more than a contributor runs locally: run the tests. It publishes nothing,
# registers nothing, and spends no API budget — it is a test runner, not the
# unattended-automation kind of workflow CLAUDE.md gates.
#
# The npm-reachability-triage probe already has a matching runner (#299); this
# one closes the same gap for the a11y probe, whose 54-test suite passed only
# by hand until now. Its two load-bearing invariants — never report an
# undecidable case as a finding, and always emit the coverage boundary — are
# exactly the kind of regression that must not land on main unseen.

on:
  pull_request:
    paths:
      - "portfolio/research/a11y-evidence-record/**"
      - ".github/workflows/a11y-evidence-record-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/a11y-evidence-record/**"
      - ".github/workflows/a11y-evidence-record-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: a11y-evidence-record-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/a11y-evidence-record

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install step, by design.
      - run: python3 -m unittest discover -p 'test_*.py'
