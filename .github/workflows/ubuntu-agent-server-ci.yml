name: ubuntu-agent-server CI

# Everything this workflow checks can and has been run locally (see
# README's "Development notes"). This exists so it happens automatically
# on every push/PR instead of relying on remembering to run it by hand —
# including for PRs the agent runner itself opens against this repo, once
# self-directed mode is enabled for it (see README's "Everything as code").

on:
  push:
    branches: [main]
    paths:
      - "ventures/ubuntu-agent-server/**"
      - ".github/workflows/ubuntu-agent-server-ci.yml"
  pull_request:
    paths:
      - "ventures/ubuntu-agent-server/**"
      - ".github/workflows/ubuntu-agent-server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/ubuntu-agent-server

# A newer push to the same pull request cancels the superseded run; `main`
# keeps every run (platform/ci/validate_workflows.py, invariant 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ansible:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ansible
        run: pip install ansible ansible-lint
      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax check
        run: ansible-playbook playbook.yml --syntax-check
      - name: ansible-lint
        run: ansible-lint

  shellcheck:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Same gap the `yaml-sanity` job below already carries a comment about,
      # one tool over: bare `shellcheck` exists on GitHub-hosted ubuntu-latest
      # and nowhere on the self-hosted runner image (curl, jq, unzip and git
      # only -- see gitops/ci/README.md), so flipping CI_RUNNER would turn
      # this job red on its own single step. shellcheck-py ships the real
      # shellcheck binary as a wheel, which is how hetzner-gitops-ci.yml's
      # `scripts` job installs it on either runner; apt-get would need sudo
      # and a package index, and the self-hosted image has neither.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: |
          # Pinned. shellcheck adds checks in minor releases, so an unpinned
          # install means a shellcheck release -- not a repo change -- can turn
          # this job red across every branch at once, with a diff that explains
          # nothing. It has already caused one misreading here: the
          # `# shellcheck disable=SC2329` in gitops/ci/runner-entrypoint.sh is
          # the >=0.10 code for the check 0.9.0 called SC2317, so a session that
          # happened to have 0.9.0 installed locally read this job as broken on
          # main when it was clean. Bump deliberately, with the findings fixed
          # in the same commit.
          pip install shellcheck-py==0.11.0.1
          shellcheck roles/agent_runner/files/runners/*.sh bootstrap.sh

  python:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt pyflakes ruff==0.15.8 mypy==1.19.1 types-PyYAML
      - name: pyflakes
        run: pyflakes roles/agent_runner/files/agent_runner.py
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest tests/ -v

  yaml-sanity:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The self-hosted runner image ships no Python (curl, jq, unzip and git
      # only -- see gitops/ci/README.md). This step used to run bare
      # `python3`, which exists on GitHub-hosted ubuntu-latest by default but
      # not there, so flipping CI_RUNNER to self-hosted would turn this job
      # red on its own first step regardless of what config/repos.yml says.
      # Same class of gap already found and fixed once in
      # garmin-world-traveler-watchface-ci.yml.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: config/repos.yml parses and has the expected shape
        run: |
          # `setup-python` above installs a *clean* interpreter from the tool
          # cache, which has no PyYAML. GitHub's system python3 does, so the
          # fix that made this job survive a CI_RUNNER flip simultaneously
          # broke it under the interpreter it had just installed -- and
          # nothing noticed, because this workflow only triggers on
          # `ventures/ubuntu-agent-server/**` or its own file and neither had
          # changed since. Install what the script imports.
          pip install pyyaml
          python3 -c "
          import yaml
          data = yaml.safe_load(open('config/repos.yml'))
          repos = data.get('repos', [])
          assert isinstance(repos, list), 'repos: must be a list'
          for r in repos:
              assert 'repo' in r and 'tool' in r, f'entry missing repo/tool: {r}'
              assert r['tool'] in ('claude', 'codex', 'antigravity', 'opencode'), f\"unknown tool: {r['tool']}\"
          print(f'{len(repos)} repo(s) configured, all well-formed')
          "
