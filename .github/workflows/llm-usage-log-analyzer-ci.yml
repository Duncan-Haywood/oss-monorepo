name: llm-usage-log-analyzer CI

# Static browser-local calculator: plain ES modules, node --test, no
# package.json, no dependencies, no network.
# calc.mjs is usage-log parsing and cost-analysis arithmetic; usage.mjs is
# the anonymous local counter. Each has a sibling *.test.mjs.

on:
  pull_request:
    paths:
      - "ventures/llm-usage-log-analyzer/**"
      - ".github/workflows/llm-usage-log-analyzer-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/llm-usage-log-analyzer/**"
      - ".github/workflows/llm-usage-log-analyzer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-usage-log-analyzer-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/llm-usage-log-analyzer

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
