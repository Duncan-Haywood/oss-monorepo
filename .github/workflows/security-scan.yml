name: Security scan

# The dev-workflow half of the security baseline (owner, 2026-11-24: "very
# heavily security scanned for the dev workflow and everything security as a
# priority"; docs/reports/2026-11-24-cloud-provider-comparison.md, section 7,
# "Scanning baseline"). Runs platform/security/scan/scan.py: gitleaks,
# Semgrep, OSV-Scanner, Checkov, Trivy (config and image), zizmor and
# tofu fmt/validate/test for changed platform/aws/** stacks, every scanner
# pinned by version and checksum (platform/security/scan/tools.json).
#
#   * pull_request: scans the paths and commits the PR changes. A new finding
#     rated high or critical, or a scanner that could not run, fails the job.
#     Accepted findings live in platform/security/scan/baseline.json, each
#     with a reason.
#   * push to main: the same scan on the merged change.
#   * weekly and on demand: the whole tree (--all), so new advisories against
#     old lockfiles and images show up without a PR touching them.
#
# CodeQL is its own workflow (.github/workflows/codeql.yml, PR 18529).
#
# No secrets: the job reads the repository and public registries only, so it
# runs the same on a fork PR with GITHUB_TOKEN read-only. Findings are a JSON
# artifact and a job summary, readable by agent sessions (files first).
# Making `security-scan` a required check and routing new findings into the
# security-alerts queue is the next task, sec-codeowners-scan-gate.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: security-scan
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      SCAN_TOOLS_DIR: ${{ github.workspace }}/../scan-tools
      # Go scanners build from module source checked against sum.golang.org;
      # GOTOOLCHAIN=auto fetches the Go version their go.mod asks for, the
      # same way (platform/security/scan/install.py).
      GOTOOLCHAIN: auto
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A PR checks out its merge commit: HEAD^1 is the base, HEAD^2 the
          # PR head. Depth 2 is enough for the diff; the PR's own commits
          # are fetched below for gitleaks.
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Restore scanners
        id: tools-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SCAN_TOOLS_DIR }}
          key: scan-tools-${{ runner.os }}-${{ hashFiles('platform/security/scan/tools.json', 'platform/security/scan/requirements/*.txt', 'platform/security/scan/install.py') }}
      - name: Install scanners (pinned, checksum-verified)
        run: python3 platform/security/scan/install.py
      - name: Save scanners
        if: steps.tools-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SCAN_TOOLS_DIR }}
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - name: Test the scanner wrapper
        run: python3 platform/security/scan/test_scan.py
      - name: Fetch the PR's own commits for gitleaks
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          # Deepen only a shallow checkout (the runner's); a full clone
          # (run_workflow_locally.py) already has the commits.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth="$((COMMITS + 1))" origin "$HEAD_SHA"
          else
            git fetch --no-tags --quiet origin "$HEAD_SHA"
          fi
      - name: Scan the pull request
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          python3 platform/security/scan/scan.py --base HEAD^1 --exact-base \
            --gitleaks-log-opts "-n ${COMMITS} ${HEAD_SHA}" \
            --out .security-scan/findings.json
      - name: Scan the merged change
        if: github.event_name == 'push'
        run: python3 platform/security/scan/scan.py --base HEAD^1 --exact-base --out .security-scan/findings.json
      - name: Scan the whole tree
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 platform/security/scan/scan.py --all --fail-on critical --out .security-scan/findings.json
      - name: Keep the findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-findings
          path: .security-scan/findings.json
          if-no-files-found: warn
          retention-days: 30
