name: irrigation-winterization-bid-calculator CI

# Test runner for the browser-local irrigation winterization bid calculator.
# The product is static ES modules with no build step and no dependencies, so
# this does no more than a contributor runs locally: `node --test`. It
# publishes nothing, registers nothing, and spends no API budget — it is not
# the unattended-automation kind of workflow CLAUDE.md gates.
#
# Same shape as janitorial-bid-calculator-ci.yml.

on:
  pull_request:
    paths:
      - "ventures/irrigation-winterization-bid-calculator/**"
      - ".github/workflows/irrigation-winterization-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/irrigation-winterization-bid-calculator/**"
      - ".github/workflows/irrigation-winterization-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: irrigation-winterization-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/irrigation-winterization-bid-calculator
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
