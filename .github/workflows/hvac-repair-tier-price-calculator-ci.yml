name: hvac-repair-tier-price-calculator CI

# Zero-dependency browser tool: `engine.mjs` is the HVAC good-better-best repair price math and
# `page.test.mjs` covers the page wiring and the guide's worked numbers.
# Without this file, `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `structured-data-drift-check-ci.yml` documents.
on:
  pull_request:
    paths:
      - "ventures/hvac-repair-tier-price-calculator/**"
      - ".github/workflows/hvac-repair-tier-price-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/hvac-repair-tier-price-calculator/**"
      - ".github/workflows/hvac-repair-tier-price-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hvac-repair-tier-price-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/hvac-repair-tier-price-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine and page-wiring tests
        run: node --test engine.test.mjs page.test.mjs
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs hvac-repair-tier-price-calculator
