name: sql-migration-lock-check CI

# Zero-dependency CLI/browser tool: `sql.mjs` is a small PostgreSQL statement
# splitter written here rather than pulled from npm; `engine.mjs` holds every
# check and is imported by both the CLI and the page, so the two can never
# disagree about a verdict; `check.mjs` is the CLI entry point; `page.test.mjs`
# covers all three pages' structure, disclaimers and FAQ/JSON-LD agreement;
# `usage.test.mjs` covers the opt-out switch and asserts no network primitive
# exists in the module. Keep all five covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file, `validate_workflows.py`
# fails the moment the venture's `*.test.mjs` files land -- the same hole
# `k8s-rollout-safety-check-ci.yml` and `redirect-chain-check-ci.yml` already
# document.
#
# The statement splitter is the part most worth running on every change, for
# the same reason the sibling workflow gives for its YAML reader: its bugs are
# silent. A `CREATE INDEX` inside a comment or a semicolon inside a
# dollar-quoted function body, mis-scanned, produces a confident *wrong*
# finding about a migration someone is about to run against production -- and
# a false finding is worse than none, because the reader stops believing the
# true ones. `sql.test.mjs` pins every one of those cases, including
# PostgreSQL's nesting block comments and unterminated literals.
on:
  pull_request:
    paths:
      - "ventures/sql-migration-lock-check/**"
      - ".github/workflows/sql-migration-lock-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/sql-migration-lock-check/**"
      - ".github/workflows/sql-migration-lock-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-migration-lock-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/sql-migration-lock-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run splitter, engine, CLI, page-wiring and usage tests
        run: node --test sql.test.mjs engine.test.mjs check.test.mjs page.test.mjs usage.test.mjs
