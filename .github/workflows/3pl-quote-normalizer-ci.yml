name: 3pl-quote-normalizer CI

# Like `freelance-retainer-calculator`, this venture shipped in the Portfolio
# Pages build with no CI workflow of its own: its 78 tests ran only when a
# contributor remembered to run them locally. Added 2026-08-26 so a regression
# in the quote-normalizing math cannot reach the public site unnoticed.
#
# Static ES modules, no build step, no dependencies: this does no more than a
# contributor runs locally. It publishes nothing and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/3pl-quote-normalizer/**"
      - ".github/workflows/3pl-quote-normalizer-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/3pl-quote-normalizer/**"
      - ".github/workflows/3pl-quote-normalizer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 3pl-quote-normalizer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ventures/3pl-quote-normalizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- but nothing showed the author that until the
      # Pages job went red on main, after the merge, naming a workflow they
      # never touched. Checked here so the venture that needs the clause is the
      # one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs 3pl-quote-normalizer

