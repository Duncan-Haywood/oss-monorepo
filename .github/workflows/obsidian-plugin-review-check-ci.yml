name: obsidian-plugin-review-check CI

# Zero-dependency CLI/browser tool: `scan.mjs` is the shared detection/
# report engine, `check.mjs` is the Node gate (with its own directory-
# walking tests against a real temp filesystem), and `page.test.mjs`
# covers both pages' wiring (including dogfooding: the venture's own
# worked example must exercise every report status through this
# venture's own engine). Keep all four covered independently of the
# portfolio-wide validation workflow, which only checks published pages
# and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `wordpress-plugin-review-check-ci.yml`
# and `chrome-extension-permission-check-ci.yml` document.
on:
  pull_request:
    paths:
      - "ventures/obsidian-plugin-review-check/**"
      - ".github/workflows/obsidian-plugin-review-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/obsidian-plugin-review-check/**"
      - ".github/workflows/obsidian-plugin-review-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obsidian-plugin-review-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/obsidian-plugin-review-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run scan, CLI, usage, and page-wiring tests
        run: node --test scan.test.mjs check.test.mjs usage.test.mjs page.test.mjs
