name: Portfolio validate

# Every venture must stay legible to the portfolio router: a valid
# VENTURE.yaml, or an explicit NOT-A-VENTURE marker saying why the directory
# is not a business.
#
# And every candidate must carry the same score wherever that score is written.
# Candidates are rescored by one session at a time, in three files that are
# edited independently, so a partial rescore is invisible in the diff of any
# single pull request and only surfaces once two of them land together. The
# score must also obey the rubric itself — recomputed composite, the two gate
# minimums, and the mitigation rule — so a hand-edited number that is merely
# self-consistent across the three files but arithmetically wrong still fails.
#
# And the probe index must keep matching the probes. `probes/README.md` is the
# table CLAUDE.md routes the recurring "research new business projects" brief
# at, so a cell naming work as outstanding after that work has landed sends
# sessions at nothing. It has happened three times: a pnpm hand-review pointer
# that pulled four sessions to one closed line, a WCAG coverage split
# advertising two buildable rules when zero remained, and a model run named as
# costing "one run" that was already committed. Figures a probe's own artifacts
# can recompute are now checked against them.
#
# A routing table can also fail by not rendering. GFM splits a cell on every
# unescaped `|`, including inside a backtick span, so quoting a regex with an
# alternation silently adds columns and mangles the row. Both documents
# CLAUDE.md routes generic sessions at -- `pipeline/probes/README.md` and
# `research/README.md` -- shipped with exactly that defect, from the same
# quoted pattern, so their table widths are checked too.
#
# And the router's ranking logic must keep working: its pure-function unit
# suite is what a rescore or a signal-source change is checked against, and it
# had been runnable only by hand.
#
# And every workflow file must stay legible to GitHub itself: an unparseable
# one registers under its own path and emits a zero-job startup_failure per
# event, which no PR check surfaces.
#
# And the consolidated egress table must keep matching what has actually been
# measured. `research/egress-reachability/` exists because nine passes each
# re-probed an overlapping host set without folding the results anywhere; four
# days after it landed it was six hosts short again, because `--ingest` is a
# command someone has to remember to run. `--probe` iterates the committed
# table, so a host missing from it is never re-measured either. The ingest is
# deterministic and needs no network, so the drift is checkable.
#
# And no decision waiting on the account owner may name a host nothing has
# probed. `asks.yaml`'s egress row asked for `www.ftc.gov` for five days with
# no verdict in that table -- it had been measured by a pass that left prose
# and no results file, which the ingest cannot see. That row also named the
# EUVD *website* host while claiming to unlock a wedge that needs the *API*
# host, so granting it as written would have spent the owner's one allowlist
# decision and unblocked nothing. Naming a host now requires having measured
# it.

on:
  push:
    branches: [main]
    paths:
      - "ventures/**/VENTURE.yaml"
      - "ventures/**/NOT-A-VENTURE"
      - "portfolio/router/**"
      - "portfolio/pipeline/**"
      - "portfolio/research/README.md"
      - "portfolio/research/egress-reachability/**"
      - "portfolio/scoring/**"
      - "portfolio/ledger/break-even.md"
      - "portfolio/ledger/break_even.py"
      - "portfolio/ledger/test_break_even.py"
      - "portfolio/ledger/results-break-even-*.json"
      - "portfolio/ledger/verification_status.py"
      - "portfolio/ledger/test_verification_status.py"
      - "portfolio/ledger/verifications.yaml"
      - "portfolio/ledger/session_gate.py"
      - "portfolio/ledger/test_session_gate.py"
      - "portfolio/ledger/decision_queue.py"
      - "portfolio/ledger/test_decision_queue.py"
      - "portfolio/ledger/asks.yaml"
      - "portfolio/ledger/2026-08.yaml"
      - "platform/ci/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "ventures/**/VENTURE.yaml"
      - "ventures/**/NOT-A-VENTURE"
      - "portfolio/router/**"
      - "portfolio/pipeline/**"
      - "portfolio/research/README.md"
      - "portfolio/research/egress-reachability/**"
      - "portfolio/scoring/**"
      - "portfolio/ledger/break-even.md"
      - "portfolio/ledger/break_even.py"
      - "portfolio/ledger/test_break_even.py"
      - "portfolio/ledger/results-break-even-*.json"
      - "portfolio/ledger/verification_status.py"
      - "portfolio/ledger/test_verification_status.py"
      - "portfolio/ledger/verifications.yaml"
      - "portfolio/ledger/session_gate.py"
      - "portfolio/ledger/test_session_gate.py"
      - "portfolio/ledger/decision_queue.py"
      - "portfolio/ledger/test_decision_queue.py"
      - "portfolio/ledger/asks.yaml"
      - "portfolio/ledger/2026-08.yaml"
      - "platform/ci/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r portfolio/router/requirements.txt pytest

      - name: Validate VENTURE.yaml schema
        run: python3 portfolio/router/validate.py

      - name: Check candidate scores agree across yaml, write-ups, and README
        run: python3 portfolio/pipeline/validate_doc_consistency.py

      - name: Check candidate scores obey the rubric rules
        run: python3 portfolio/pipeline/validate_candidates.py

      - name: Check the probe index's figures still match the probes' artifacts
        run: python3 portfolio/pipeline/probes/validate_probe_index.py

      - name: Probe-index validator unit tests
        working-directory: portfolio/pipeline/probes
        run: python3 -m unittest test_validate_probe_index

      # The evidence-boundary probes assert the rule their candidate write-ups
      # each name as the failure mode that would mislead a customer: a fetch or
      # resolver failure must never render as "nothing changed". Nothing ran
      # them until now, so that rule could regress silently.
      - name: Evidence-boundary probe tests
        run: |
          python3 -m pytest -q \
            portfolio/pipeline/probes/vendor-change-evidence/test_vendor_diff.py \
            portfolio/pipeline/probes/dns-configuration-evidence/test_dns_diff.py

      - name: Check the measurement record in candidates.yaml is still readable
        run: python3 portfolio/pipeline/score_sensitivity.py

      - name: Score-sensitivity unit tests
        working-directory: portfolio/pipeline
        run: python3 -m unittest test_score_sensitivity

      - name: Check venture merit scores obey the rubric and cover every venture
        run: python3 portfolio/scoring/score_ventures.py --check

      - name: Venture-scoring unit tests
        working-directory: portfolio/scoring
        run: python3 -m unittest test_score_ventures

      - name: Router ranking-logic unit tests
        working-directory: portfolio/router
        run: python3 -m unittest test_allocate

      - name: Validate workflow files are parseable
        run: python3 platform/ci/validate_workflows.py

      - name: Workflow-validator unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_validate_workflows

      - name: Check what a merge to main can publish still matches the snapshot
        run: python3 platform/ci/publish_surface.py --check

      - name: Publish-surface unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_publish_surface

      - name: Branch-cleanup decision-rule tests
        working-directory: platform/ci
        run: python3 -m unittest test_branch_cleanup

      - name: Check break-even.md agrees with its pinned snapshot
        run: python3 portfolio/ledger/break_even.py --check

      - name: Run break-even tests
        working-directory: portfolio/ledger
        run: python3 -m pytest test_break_even.py -q

      - name: Check the verification records are well-formed
        run: python3 portfolio/ledger/verification_status.py --check

      - name: Re-verification staleness tests
        working-directory: portfolio/ledger
        run: python3 -m unittest test_verification_status

      - name: Check the session gate still reads live
        run: python3 portfolio/ledger/session_gate.py

      - name: Session-gate tests
        working-directory: portfolio/ledger
        run: python3 -m pytest test_session_gate.py -q

      - name: Check the owner decision queue is well-formed
        run: python3 portfolio/ledger/decision_queue.py --check

      - name: Decision-queue tests
        working-directory: portfolio/ledger
        run: python3 -m unittest test_decision_queue

      - name: Check the consolidated egress table still matches a fresh ingest
        working-directory: portfolio/research/egress-reachability
        run: python3 consolidate.py --check

      - name: Check every host in an owner ask has a measured verdict
        working-directory: portfolio/research/egress-reachability
        run: python3 check_ask_hosts.py

      - name: Egress-consolidation tests
        working-directory: portfolio/research/egress-reachability
        run: python3 -m unittest test_consolidate
