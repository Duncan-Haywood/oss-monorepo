name: Portfolio validate

# Every venture must stay legible to the portfolio router: a valid
# VENTURE.yaml, or an explicit NOT-A-VENTURE marker saying why the directory
# is not a business.
#
# And every candidate must carry the same score wherever that score is written.
# Candidates are rescored by one session at a time, in three files that are
# edited independently, so a partial rescore is invisible in the diff of any
# single pull request and only surfaces once two of them land together. The
# score must also obey the rubric itself — recomputed composite, the two gate
# minimums, and the mitigation rule — so a hand-edited number that is merely
# self-consistent across the three files but arithmetically wrong still fails.
#
# And the probe index must keep matching the probes. `probes/README.md` is the
# table CLAUDE.md routes the recurring "research new business projects" brief
# at, so a cell naming work as outstanding after that work has landed sends
# sessions at nothing. It has happened three times: a pnpm hand-review pointer
# that pulled four sessions to one closed line, a WCAG coverage split
# advertising two buildable rules when zero remained, and a model run named as
# costing "one run" that was already committed. Figures a probe's own artifacts
# can recompute are now checked against them.
#
# A routing table can also fail by not rendering. GFM splits a cell on every
# unescaped `|`, including inside a backtick span, so quoting a regex with an
# alternation silently adds columns and mangles the row. Both documents
# CLAUDE.md routes generic sessions at -- `pipeline/probes/README.md` and
# `research/README.md` -- shipped with exactly that defect, from the same
# quoted pattern, so their table widths are checked too.
#
# And the router's ranking logic must keep working: its pure-function unit
# suite is what a rescore or a signal-source change is checked against, and it
# had been runnable only by hand.
#
# And every workflow file must stay legible to GitHub itself: an unparseable
# one registers under its own path and emits a zero-job startup_failure per
# event, which no PR check surfaces.
#
# And the consolidated egress table must keep matching what has actually been
# measured. `research/egress-reachability/` exists because nine passes each
# re-probed an overlapping host set without folding the results anywhere; four
# days after it landed it was six hosts short again, because `--ingest` is a
# command someone has to remember to run. `--probe` iterates the committed
# table, so a host missing from it is never re-measured either. The ingest is
# deterministic and needs no network, so the drift is checkable.
#
# And no decision waiting on the account owner may name a host nothing has
# probed. `asks.yaml`'s egress row asked for `www.ftc.gov` for five days with
# no verdict in that table -- it had been measured by a pass that left prose
# and no results file, which the ingest cannot see. That row also named the
# EUVD *website* host while claiming to unlock a wedge that needs the *API*
# host, so granting it as written would have spent the owner's one allowlist
# decision and unblocked nothing. Naming a host now requires having measured
# it.

on:
  push:
    branches: [main]
    paths:
      - "ventures/**/VENTURE.yaml"
      - "ventures/**/NOT-A-VENTURE"
      - "ventures/**/*.html"
      # The apex tool mirror is generated from whole venture directories,
      # so a venture's module, script, stylesheet or licence going stale in
      # `gitops/prod/front-door-tools/` is exactly as invisible as a page
      # would be. The mirror-staleness step below is what reads them.
      # `.css`/`.js` joined `.mjs` here on 2026-09-02: `front-door-tools.mjs`'s
      # own SERVABLE_EXTENSIONS has mirrored all four since the mirror shipped
      # (construction-evidence-log's app.js and style.css are in the mirror
      # today), but neither extension had a path here or in
      # hetzner-gitops-ci.yml, so an edit to either file triggered no workflow
      # that runs the staleness check at all -- confirmed by editing
      # ventures/construction-evidence-log/app.js locally and watching
      # `front-door-tools.test.mjs` fail with the change unreverted.
      - "ventures/**/*.mjs"
      - "ventures/**/*.css"
      - "ventures/**/*.js"
      - "ventures/**/LICENSE"
      - "platform/marketing/**"
      # `platform/marketing/*.test.mjs` (the staleness step below) checks the
      # committed front door under `gitops/prod/` and reads
      # `gitops/tests/test_*.py`. This is the only workflow that runs it since
      # hetzner-gitops-ci.yml dropped its duplicate copy, so a hand edit to a
      # generated file there has to trigger it here.
      - "gitops/prod/**"
      - "gitops/tests/**"
      - "platform/pages/**"
      - "platform/agents/**"
      - "platform/edge/**"
      - "platform/counter/**"
      - "portfolio/router/**"
      - "portfolio/pipeline/**"
      - "portfolio/research/README.md"
      - "portfolio/research/egress-reachability/**"
      - "portfolio/scoring/**"
      - "portfolio/usage/**"
      - "portfolio/ledger/break-even.md"
      - "portfolio/ledger/break_even.py"
      - "portfolio/ledger/test_break_even.py"
      - "portfolio/ledger/results-break-even-*.json"
      - "portfolio/ledger/verification_status.py"
      - "portfolio/ledger/test_verification_status.py"
      - "portfolio/ledger/verifications.yaml"
      - "portfolio/ledger/session_gate.py"
      - "portfolio/ledger/test_session_gate.py"
      - "portfolio/ledger/decision_queue.py"
      - "portfolio/ledger/test_decision_queue.py"
      - "portfolio/ledger/supersede_check.py"
      - "portfolio/ledger/test_supersede_check.py"
      - "portfolio/ledger/asks.yaml"
      - "portfolio/ledger/2026-08.yaml"
      # Post-only PRs ran no front-matter check, so posts without a description
      # or tags, and posts dated ahead, reached main (five on 2026-10-26).
      - "docs/posts/**"
      - "platform/ci/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "ventures/**/VENTURE.yaml"
      - "ventures/**/NOT-A-VENTURE"
      - "ventures/**/*.html"
      # The apex tool mirror is generated from whole venture directories,
      # so a venture's module, script, stylesheet or licence going stale in
      # `gitops/prod/front-door-tools/` is exactly as invisible as a page
      # would be. The mirror-staleness step below is what reads them. See the
      # `push:` block above for why `.css`/`.js` are here too.
      - "ventures/**/*.mjs"
      - "ventures/**/*.css"
      - "ventures/**/*.js"
      - "ventures/**/LICENSE"
      - "platform/marketing/**"
      # See the `push:` block above for why `gitops/prod/` and `gitops/tests/`.
      - "gitops/prod/**"
      - "gitops/tests/**"
      - "platform/pages/**"
      - "platform/agents/**"
      - "platform/edge/**"
      - "platform/counter/**"
      - "portfolio/router/**"
      - "portfolio/pipeline/**"
      - "portfolio/research/README.md"
      - "portfolio/research/egress-reachability/**"
      - "portfolio/scoring/**"
      - "portfolio/usage/**"
      - "portfolio/ledger/break-even.md"
      - "portfolio/ledger/break_even.py"
      - "portfolio/ledger/test_break_even.py"
      - "portfolio/ledger/results-break-even-*.json"
      - "portfolio/ledger/verification_status.py"
      - "portfolio/ledger/test_verification_status.py"
      - "portfolio/ledger/verifications.yaml"
      - "portfolio/ledger/session_gate.py"
      - "portfolio/ledger/test_session_gate.py"
      - "portfolio/ledger/decision_queue.py"
      - "portfolio/ledger/test_decision_queue.py"
      - "portfolio/ledger/supersede_check.py"
      - "portfolio/ledger/test_supersede_check.py"
      - "portfolio/ledger/asks.yaml"
      - "portfolio/ledger/2026-08.yaml"
      # Post-only PRs ran no front-matter check, so posts without a description
      # or tags, and posts dated ahead, reached main (five on 2026-10-26).
      - "docs/posts/**"
      - "platform/ci/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    # This job runs on every PR that touches any of the paths above and chains
    # roughly fifty checks and unit-test modules in sequence; it has taken
    # 3-4 minutes when the catalogue was small; with ~1,300 ventures the
    # front-door tests alone take ~8 minutes (2026-10-19), so the cap is 35.
    # Uncapped, a hung pip install or a stalled
    # step anywhere in that chain would ride GitHub's default 360-minute
    # ceiling instead of failing fast -- see hetzner-gitops-ci.yml's own
    # timeout-minutes addition for why that matters on a metered-minutes
    # account (CLAUDE.md's CI-starvation history, 2026-08-26 to 2026-09-01).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # read-only job; nothing here pushes

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # For the liability-clause check below. Everything else in this job is
      # Python; the Pages tooling that knows which pages get published is not.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r portfolio/router/requirements.txt pytest

      - name: Validate VENTURE.yaml schema
        run: python3 portfolio/router/validate.py

      # The mirror serves nothing since the k3s origin was retired
      # (portfolio/hosting/README.md), and its two checks were 7.5 of this
      # job's 10 minutes (P039). They only matter when the mirror or its
      # generator changes, so any doubt (shallow fetch fails, no base) runs them.
      - name: Does this change touch the apex mirror or its generator?
        id: mirror
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --depth=2 origin "+$(git rev-parse HEAD):refs/ci/pr-merge" 2>/dev/null || true
            fi
            base=$(git rev-parse -q --verify HEAD^1 || true)
          elif [ "$EVENT" = push ] && [ "${BEFORE#0000000}" != "$BEFORE" ]; then
            base=
          elif [ "$EVENT" = push ]; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true
            else
              git fetch --no-tags origin "$BEFORE" 2>/dev/null || true
            fi
            base=$(git rev-parse -q --verify "$BEFORE^{commit}" || true)
          fi
          run=true
          if [ -n "$base" ] && changed=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            # A PR is gated on the generator and this workflow only. Main's
            # committed mirror drifts from merges that never ran this step, and
            # failing the next PR that touches gitops/prod/ for that drift
            # (P043) made authors regenerate files for the retired apex. Push
            # runs still check gitops/prod/, so drift surfaces on main.
            paths='^(platform/marketing/|\.github/workflows/portfolio-validate\.yml$)'
            [ "$EVENT" = pull_request ] || paths='^(gitops/prod/|platform/marketing/|\.github/workflows/portfolio-validate\.yml$)'
            if ! printf '%s\n' "$changed" | grep -qE "$paths"; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # The apex serves a mirrored copy of 14 whole ventures so that the front
      # door's cards work while `portfolio-site-repo` is unsealed. The copy is
      # committed (Argo CD delivers it; no CI job builds it), so editing one of
      # those ventures without regenerating leaves the apex serving the old
      # tool. This is also the only place the generator suite runs for
      # `gitops/prod/**` and `platform/marketing/**` changes:
      # `hetzner-gitops-ci.yml` used to run a duplicate copy and dropped it on
      # 2026-10-20 when it pushed that job past its timeout.
      - name: Check the apex tool mirror is not stale
        if: steps.mirror.outputs.run == 'true'
        run: node --test "platform/marketing/*.test.mjs"

      # platform/agents/tools.mjs lets an agent call any tool's engine with no
      # browser. Its suite imports every venture's engine module, so a module
      # that touches `document` at import time (and so stops being callable)
      # fails here. Triggered by `ventures/**/*.mjs` and `*.html` above.
      - name: Every tool stays callable from the agent CLI
        run: node --test "platform/agents/*.test.mjs"

      # platform/edge is the Cloudflare Worker behind the site's feedback form
      # and page-view counts; it shares platform/counter's rules (core.mjs).
      - name: Site feedback Worker and visit counter
        run: node --test "platform/edge/*.test.mjs" "platform/counter/*.test.mjs"

      # `MIRROR_BYTE_CEILING` is a wall with no approach lights: `buildMirror`
      # throws on it, and that throw lands in the step above -- which this
      # workflow runs on every PR touching a venture page. So the first session
      # to cross it does not learn that the mirror is full, it learns that
      # *nothing in the catalogue can publish* until someone frees room, in the
      # middle of shipping something unrelated. The apex is the portfolio's
      # entire public surface and the fleet adds tools daily.
      #
      # This step fails at `MIRROR_HEADROOM_WARN_RATIO` (85%) instead, leaving
      # roughly a third of the runway to land the remedy as an ordinary
      # reviewed change. It was at 76.3% when the step was added -- 173 tools,
      # ~53 from the wall -- so it passes today and exists for the day it does
      # not. Its output also names the 18.5% of the mirror that is byte-
      # identical duplication, which is the remedy the constant's comment
      # spells out; raising the ceiling is not the first answer.
      - name: Check the apex tool mirror has room left
        if: steps.mirror.outputs.run == 'true'
        run: node platform/marketing/front-door-tools.mjs --headroom

      - name: Check candidate scores agree across yaml, write-ups, and README
        run: python3 portfolio/pipeline/validate_doc_consistency.py

      - name: Check candidate scores obey the rubric rules
        run: python3 portfolio/pipeline/validate_candidates.py

      - name: Check the probe index's figures still match the probes' artifacts
        run: python3 portfolio/pipeline/probes/validate_probe_index.py

      - name: Probe-index validator unit tests
        working-directory: portfolio/pipeline/probes
        run: python3 -m unittest test_validate_probe_index

      # The evidence-boundary probes assert the rule their candidate write-ups
      # each name as the failure mode that would mislead a customer: a fetch or
      # resolver failure must never render as "nothing changed". Nothing ran
      # them until now, so that rule could regress silently.
      - name: Evidence-boundary probe tests
        run: |
          python3 -m pytest -q \
            portfolio/pipeline/probes/vendor-change-evidence/test_vendor_diff.py \
            portfolio/pipeline/probes/dns-configuration-evidence/test_dns_diff.py

      # The index above checks a probe's *figures*; it does not run the probe.
      # A probe whose tests never execute in CI can rot while its row still
      # reads "built, tested".
      - name: Branch-hygiene probe tests
        working-directory: portfolio/pipeline/probes/repository-branch-hygiene
        run: python3 -m pytest tests -q

      - name: MLS photo-spec probe tests
        working-directory: portfolio/pipeline/probes/mls-photo-spec
        run: python3 -m pytest tests -q

      # The gate itself lives in `checklist-coverage.yml`, not here: it has to
      # fire on a new test directory *anywhere*, and this workflow's trigger
      # list is a hand-maintained enumeration of paths that would not include
      # one. These are its unit tests, which belong here because
      # `platform/ci/**` already triggers this workflow.
      - name: Checklist-coverage unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_checklist_coverage

      - name: Check the measurement record in candidates.yaml is still readable
        run: python3 portfolio/pipeline/score_sensitivity.py

      - name: Score-sensitivity unit tests
        working-directory: portfolio/pipeline
        run: python3 -m unittest test_score_sensitivity

      - name: Check venture merit scores obey the rubric and cover every venture
        run: python3 portfolio/scoring/score_ventures.py --check

      - name: Venture-scoring unit tests
        working-directory: portfolio/scoring
        run: python3 -m unittest test_score_ventures

      - name: Router ranking-logic unit tests
        working-directory: portfolio/router
        run: python3 -m unittest test_allocate

      # The check itself needs a repository to read, and builds throwaway ones
      # rather than mocking git -- so it needs an identity to commit with, which
      # a bare runner does not have.
      - name: Supersede-check unit tests
        working-directory: portfolio/ledger
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          python3 -m unittest test_supersede_check

      # usage.yaml is the portfolio's only honest signal while revenue is zero,
      # and nothing read it in CI: #1387 left it unparseable and no check
      # noticed. These two steps are that missing guard.
      - name: Validate the usage ledger is readable
        run: python3 portfolio/usage/validate_usage.py

      - name: Usage-validator unit tests
        working-directory: portfolio/usage
        run: python3 -m unittest test_validate_usage

      # `validate_usage.py` above checks the file's *shape*. This checks what
      # the tree says the file *means*: `live_url_visitors` is null on all 399
      # readings -- never measured -- and eleven places had turned that into
      # "zero observed users", which is an absence rendered as a negative
      # result. Measured-zero licenses retiring a product; never-measured
      # licenses nothing. It passes the moment either the sentence or the data
      # changes, so it is a gate that opens.
      - name: No steering document reports the unmeasured usage rows as an observed zero
        run: python3 platform/ci/usage_state.py --require-honest

      - name: Usage-state unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_usage_state

      - name: Validate workflow files are parseable
        run: python3 platform/ci/validate_workflows.py

      - name: Workflow-validator unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_validate_workflows

      - name: Agent cross-review unit tests
        working-directory: platform/ci/agent_review
        run: python3 -m unittest test_review

      # The local workflow runner is what sessions verify with while no
      # runner picks up a job here, so its own tests have to run somewhere.
      - name: Local workflow-runner unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_run_workflow_locally

      # And the tool that says whether a red check ran at all. Same reason:
      # it is what a session reaches for when CI comes back red, so it must
      # not be the thing that is broken.
      - name: CI-starvation classifier unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_ci_starvation

      # Same argument again, one route over: this reads the Pages route's
      # state for `infra_state.yaml`'s `github-pages-plan` row, and that row
      # decides whether an owner's thirty seconds in Settings is worth
      # spending. A tool that turns one API field into an owner-facing
      # verdict has to be the thing that is right.
      - name: Pages-route reader unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_pages_state

      # And the tool that says which guards did not run at all. Same reason a
      # third time: a session reads `533 passed, 25 skipped` and calls the
      # tree green, so the thing that distinguishes a skip from a pass must
      # not be the thing that is broken. Its own refusals are the behaviour
      # under test -- an unrecognised skip reason must never be filed as
      # "does not apply here", and a suite that could not run at all must
      # never exit 0 under `--require-runnable`.
      - name: Guard-state reader unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_guard_state

      # The counter-sync tool. It rewrites committed files, so the tests that
      # matter are the ones proving it can be wrong safely: a reworded
      # sentence must be reported rather than silently skipped, and a
      # derivation that breaks must raise rather than return a zero the tool
      # would then write. Both of those happened while it was being written --
      # the first draft filtered on a status string that does not exist,
      # derived 0, and would have rewritten a live constant to 0.
      - name: Tree-count sync unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_sync_tree_counts

      # And the reader for the three standalone host-mode routes. Same
      # argument as the two above, at the point where it is most expensive to
      # be wrong: this one is read while the owner is holding the private key,
      # during the single session the recovery gets, and it is the thing that
      # says which of the three drivers is worth that session. Its own
      # refusals are the behaviour under test -- it must parse the box and
      # installer out of the drivers rather than restating them (a restated
      # constant is how this repo has twice shipped a claim that went quietly
      # wrong), and it must never imply it measured whether a box answers,
      # which no session can do.
      - name: Host-route reader unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_host_routes_state

      # A calculator whose shipped defaults fail constraint validation cannot be
      # submitted at all: the browser refuses before dispatching the event, so
      # the page's own handler never runs and the button silently does nothing.
      # calc.mjs tests all pass in that state, because the arithmetic is fine.
      - name: Check every calculator's default form state can actually be submitted
        run: python3 platform/ci/check_form_defaults.py

      - name: Form-default checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_form_defaults

      # A placeholder is not an accessible name: every input, select and
      # textarea on a served page needs a label, aria-label or title.
      - name: Check every form control has an accessible name
        run: python3 platform/ci/check_control_labels.py

      - name: Control-label checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_control_labels

      # Screen-reader users jump past the header with the <main> landmark.
      - name: Check every venture page has a main landmark
        run: python3 platform/ci/check_main_landmark.py

      - name: Main-landmark checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_main_landmark

      # A script, font, frame or image from another host leaks the visitor's IP.
      - name: Check venture pages load nothing from third-party hosts
        run: python3 platform/ci/check_third_party_requests.py

      - name: Third-party-request checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_third_party_requests

      # lang, viewport, charset, img alt, rel=noopener, tabindex, http:// links.
      - name: Check venture pages for markup basics
        run: python3 platform/ci/check_markup_basics.py

      - name: Markup-basics checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_markup_basics

      # A .html file that holds source code is served as text on Pages.
      - name: Check every venture .html file starts with markup
        run: python3 platform/ci/check_html_is_html.py

      - name: HTML-is-HTML checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_html_is_html

      # Skipped heading levels (h1 straight to h3) break outline navigation.
      - name: Check venture pages do not skip heading levels
        run: python3 platform/ci/check_heading_order.py

      - name: Heading-order checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_heading_order

      # A syntax error in a single-file tool's inline script leaves a dead page.
      - name: Check inline scripts parse
        run: python3 platform/ci/check_inline_scripts.py

      - name: Inline-script checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_inline_scripts

      # Broken JSON-LD is silently dropped by search engines; Review and
      # AggregateRating markup without real reviews breaks goals.md "Honest marketing".
      - name: Check JSON-LD parses and carries no review markup
        run: python3 platform/ci/check_jsonld.py

      - name: JSON-LD checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_jsonld

      # The visible side of "Honest marketing": no "trusted by N", star
      # ratings or award claims the repo cannot back (competitor claims that
      # are attributed to the competitor are allowed).
      - name: Check page copy for unbacked social-proof claims
        run: python3 platform/ci/check_social_proof.py

      - name: Social-proof checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_social_proof

      # A page with no rel=icon makes the browser request /favicon.ico from the
      # origin root (404 on GitHub Pages) and shows a blank tab.
      # `python3 platform/ci/favicons.py --fix` inserts the missing icons.
      - name: Check every venture page has a tab icon
        run: python3 platform/ci/favicons.py

      - name: Favicon checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_favicons

      # getElementById returns the first match, so two elements sharing an id
      # silently send a script's writes to the wrong one.
      - name: Check no served page repeats an id
        run: python3 platform/ci/check_duplicate_ids.py

      - name: Duplicate-id checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_duplicate_ids

      # A relative fetch() of a file nobody committed 404s at runtime; unit
      # tests import the engine and never run the page.
      - name: Check no page fetches a missing local file
        run: python3 platform/ci/check_local_fetch.py

      - name: Local-fetch checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_local_fetch

      # A label or ARIA reference to a missing id is dropped silently, leaving
      # the control unnamed for a screen reader.
      - name: Check label and ARIA id references resolve
        run: python3 platform/ci/check_aria_refs.py

      - name: ARIA-reference checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_aria_refs

      # A table of bare <td> cells has no row or column names for a screen reader.
      - name: Check every venture table has header cells
        run: python3 platform/ci/check_table_headers.py

      - name: Table-header checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_table_headers

      # An anchor or aria reference to a renamed id fails without any error.
      - name: Check in-page anchors and aria references resolve
        run: python3 platform/ci/check_inpage_refs.py

      - name: In-page reference checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_inpage_refs

      # Posts without `tags` shipped unnoticed; this reads their front matter.
      - name: Check blog post front matter
        run: python3 platform/ci/check_post_frontmatter.py

      - name: Post front matter checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_post_frontmatter

      # Guides are added in batches; one missing from the hub is found only by search.
      - name: Check the Start here series links both ways
        run: python3 platform/ci/check_start_here.py

      - name: Start here checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_start_here

      # A calculator with both a saved draft and a shareable link restores the
      # draft first and lets the link win. That only works if the link REPLACES
      # the form: encode omits a blank, decode omits the missing key, and a
      # `hasOwnProperty` guard then skips it -- so a field the sender cleared
      # keeps the recipient's own number and the two of them read different
      # figures from the same link, with nothing on screen saying so.
      # Two products shipped that way on 2026-09-10 (#4424) from one pattern
      # being rolled out a venture at a time, which is why this is a gate and
      # not a third repair.
      - name: Check a shared link replaces the form instead of patching it
        run: python3 platform/ci/check_shared_link_clears.py

      - name: Shared-link checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_shared_link_clears

      # The other direction of the same question. `check_form_defaults.py` asks
      # whether the values a page ships with satisfy the constraints it
      # declares; this asks whether those constraints are wide enough to let a
      # visitor type something `calc.mjs` will throw on. When they are, the
      # page prints "fix the highlighted input" and highlights nothing, because
      # `invalid.mjs` finds the field by asking `checkValidity()` and a field
      # with no declared bound reports valid whatever is in it. 23 inputs
      # across four ventures were in that state on 2026-08-31.
      - name: Check no input accepts a value its own calculator throws on
        run: python3 platform/ci/check_input_bounds.py

      - name: Input-bounds checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_input_bounds

      # The third question in that family: not "is the shipped value legal" or
      # "is the bound wide enough", but "is the grid these attributes describe
      # one a human can land on at all". `min` doubles as the step base, so
      # `min="0.01" step="0.1"` accepts 0.01, 0.11, 0.21, ... and no whole
      # number -- which nobody writes on purpose, and which is fatal and silent
      # inside a `<form>`: the browser refuses the submit before dispatching
      # the event, so the page's handler never runs and the button does
      # nothing. `cam-reconciliation-check`'s occupancy gross-up shipped that
      # way and had never once worked in a browser. 58 inputs across 33 files
      # were in that state on 2026-09-06.
      - name: Check no number input's step grid excludes whole numbers
        run: python3 platform/ci/check_step_grid.py

      - name: Step-grid checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_step_grid

      # Reading the `localStorage` global throws SecurityError when a visitor
      # blocks site data, `typeof` included; 990 usage.mjs files did it bare.
      - name: Check usage.mjs never reads localStorage outside try
        run: python3 platform/ci/check_storage_guard.py

      - name: Storage-guard checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_storage_guard

      # Every venture vendors its own money() -- 322 copies of one function --
      # and it spelled a negative "$-9.24" instead of "-$9.24", and a rounded-off
      # -0 as "$-0.00". 11,172 unit tests went green over both, because not one
      # asserted on a negative rendering. A new calculator is usually a copy of
      # the nearest existing one, so the broken spelling is the one that spreads.
      - name: Check no calculator puts the minus sign inside the currency symbol
        run: python3 platform/ci/check_money_sign.py

      - name: Money-sign checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_money_sign

      # Every check above asks whether the code that is HERE is correct. None of
      # them can see a product that is no longer here: deleting a venture
      # deletes its tests along with it, so the assertions leave with the
      # thing they guarded and the suite goes green on a smaller catalogue.
      #
      # PR #3740 was that, measured 2026-09-07. An unattended agent committed a
      # working tree captured before #3727 merged onto #3727's own merge
      # commit, which deleted the venture #3727 had graduated two minutes
      # earlier -- checker, 620 lines of passing tests, landing page, guide
      # page, CI workflow, ledger entry and scoring row. `regen.mjs` then
      # re-rendered every generated surface for 197 tools instead of 198, so
      # the diff arrived as `+84 -1985` across 833 files whose only insertions
      # were counter decrements. Nothing was red.
      #
      # With up to four sessions inside a 15-minute window here, a tree older
      # than its parent commit is the ordinary case. This asks the one question
      # the rest of the suite structurally cannot.
      #
      # Needs the base branch to compare against, which `actions/checkout@v4`'s
      # shallow default does not fetch. On a pull_request event the checkout is
      # the merge commit, so this reads as "would merging this remove a live
      # venture?" -- which is the question, and is why a venture main gained
      # after the branch forked does not false-positive.
      #
      # Fetched into `refs/ci/base-main` rather than `refs/remotes/origin/main`,
      # and forced. Writing the tracking ref is what a first draft did, and
      # `run_workflow_locally.py` rejected it here: in any checkout that already
      # has `origin/main` at a different commit, a `--depth=1` fetch is a
      # non-fast-forward and the step exits 1. That is every local run and the
      # `push: branches: [main]` event. A private ref namespace cannot collide
      # with anything, so the step means the same thing everywhere it runs.
      #
      # `--depth=1` only when the clone is ALREADY shallow, and this is not a
      # micro-optimisation (measured 2026-09-17). A `--depth` fetch does not
      # just limit what it downloads -- it writes `.git/shallow` and truncates
      # the WHOLE repository. On a runner that is free, because
      # `actions/checkout@v4` already checked out depth 1. On a full clone it
      # is destructive: a 7,289-commit checkout of `main` becomes one commit,
      # `git rev-parse --is-shallow-repository` flips to `true`, and every
      # history-shaped question in the session starts lying -- `merge-base`
      # returns nothing, `git merge origin/main` refuses with "unrelated
      # histories", and `git rev-list --count origin/main..<branch>` reports a
      # branch's entire history for every branch. CLAUDE.md's "Duplicate PRs"
      # section documents that state at length as a clone artifact to recover
      # from; what it did not know is that this step CREATES it.
      #
      # The self-inflicted part is the expensive part. `check_venture_regression.py`
      # on the very next line needs `merge-base --is-ancestor` to tell "a
      # venture was deleted" from "your tree is simply behind the base", and
      # a shallow clone cannot answer that -- so it exits 1 by design rather
      # than pass an unproven removal. Run `run_workflow_locally.py --tree` on
      # a full clone and the sweep shallows the repo at this step and then
      # reports `main` RED at the next one, for a deletion that never
      # happened. That sweep is the one command CLAUDE.md prescribes for "is
      # `main` green right now?" during a starvation window -- i.e. precisely
      # when no runner is checking and a false red has nothing to contradict
      # it. It cost this session a diagnosis before the reproduction landed on
      # the step rather than on the tree.
      #
      # On a `push` to main the base is the push's own `before` commit, not
      # main's tip at run time (measured 2026-10-20, docs/parallel-agents.md).
      # At ~280 merges a day a queued run starts ~10 merges behind the tip, so
      # any venture added in between read as one this commit deleted: 77 of
      # the last 100 main runs failed here, e.g. 04d30ea92 vs the
      # `hearth-and-horizon` venture that landed 15 minutes later. A
      # pull_request run had the same race (#8765 itself, saints-by-candlelight).
      - name: Fetch the base branch for the venture-regression check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          src=refs/heads/main
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE#0000000}" = "$BEFORE" ]; then
            src=$BEFORE
          elif [ "$EVENT" = pull_request ]; then
            # The checkout is GitHub's test merge; its first parent is the
            # exact main it merged onto. main's tip at run time is later, so
            # a venture added since read as removed by this PR (2026-10-20).
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --depth=2 origin "+$(git rev-parse HEAD):refs/ci/pr-merge"
            fi
            if parent=$(git rev-parse -q --verify HEAD^1); then
              git update-ref refs/ci/base-main "$parent"
              exit 0
            fi
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=1 origin "+$src:refs/ci/base-main"
          else
            git fetch --no-tags origin "+$src:refs/ci/base-main"
          fi

      - name: Check no live venture disappears from the served catalogue
        run: python3 platform/ci/check_venture_regression.py --base refs/ci/base-main

      - name: Venture-regression checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_venture_regression

      # Payment code may ship off by default on the deployer's own keys
      # (PRODUCT_PLAYBOOK.md §6); a real account hardcoded in the tree may not.
      - name: Check no venture hardcodes a payment account
        run: python3 platform/ci/check_payment_keys.py

      - name: Payment-account checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_payment_keys

      - name: Check what a merge to main can publish still matches the snapshot
        run: python3 platform/ci/publish_surface.py --check

      # Backstop for the per-venture no-warranty check in ventures-tests.yml
      # (`clauses.mjs --changed-since`, which names the touched venture that
      # fails). That one checks only what a change touched; this walks every
      # surface the Pages site would publish, so a page that went bad some
      # other way (a renamed exemption, a widened pattern) still goes red.
      #
      # The no-SLA half is not checked here: build.mjs injects it into every
      # published page, so it holds by construction.
      - name: Every published page carries the no-warranty clause
        run: node platform/pages/clauses.mjs

      - name: Clause-checker unit tests
        run: node --test platform/pages/clauses.test.mjs

      # Sibling of the check above, budgeting the class of page that check
      # exempts. Three sessions built a comparison page for
      # `overtime-pay-calculator` on 2026-09-16, the afternoon it shipped, each
      # after an honest overlap check that was clean when it ran -- the
      # collisions landed in the window between reading open PRs and pushing.
      # This reads the tree instead, so it cannot be raced, and it budgets only
      # the generic-method page ("vs. a spreadsheet", "vs. doing it by hand"),
      # of which there is one real angle per tool. Comparisons against distinct
      # named products are unbudgeted; see the module header for why a naive
      # per-venture count gets that backwards.
      - name: No venture accumulates duplicate generic-method comparison pages
        run: node platform/pages/surface-budget.mjs --check

      - name: Surface-budget unit tests
        run: node --test platform/pages/surface-budget.test.mjs

      # The FAQ backlog was drained by six concurrent sessions on 2026-08-30,
      # each appending a "Common questions" section to whichever ventures its
      # own snapshot reported as missing. Two snapshots overlapped by five
      # ventures, and the merge auto-resolved one file into two complete FAQ
      # sections with no conflict and no failing test. `no-show-fee-calculator`
      # reached main in the same shape from an older route.
      #
      # Checked centrally because the defect is created by a *merge*: no
      # per-venture workflow fires on a file its own branch never edited.
      - name: No page carries a duplicated FAQ section or question
        run: node platform/pages/faq-duplicate.mjs

      - name: Duplicate-FAQ checker unit tests
        run: node --test platform/pages/faq-duplicate.test.mjs

      # Every venture footer offers the local usage counter's opt-out "with Do
      # Not Track / Global Privacy Control", and Global Privacy Control is a
      # valid opt-out signal under CCPA and several state privacy laws. That
      # promise held in 150 of 155 usage modules and was tested in 23: the
      # per-venture test is six boilerplate lines, so it got skipped, and five
      # ventures shipped a counter that ignored both signals.
      #
      # Checked centrally for the same reason as the clause above -- one guard
      # covers a venture that does not have its own workflow yet. The check is
      # behavioural, not a grep: reading `globalPrivacyControl` proves nothing
      # if the module never branches on it, so each recorder is called under
      # each signal with a storage spy.
      - name: Usage counters honour Do Not Track and Global Privacy Control
        run: node platform/privacy/browser-signals.mjs

      # The other half of the same promise. `browser-signals.mjs` finds its
      # subjects by filename (`usage.mjs` / `usage.js`), and 11 ventures keep
      # the counter inline in the page or in `app.mjs` instead -- so the step
      # above reported a clean run over a fifteenth of the catalogue it never
      # looked at. This checks those structurally: the signal must be consulted
      # before the write, with a branch between them.
      #
      - name: Inline usage counters honour Do Not Track and Global Privacy Control
        run: node platform/privacy/inline-signals.mjs

      # GLOBBED, and the comment this replaces is why. It said the suites were
      # "named explicitly rather than globbed, matching the steps around it",
      # and noted in the same breath that a suite not named here "would have
      # run *nowhere* in CI -- the same defect being fixed, one layer up".
      #
      # That prediction came true on 2026-09-12. `optout-persistence.test.mjs`
      # was added with a catalogue-wide assertion that all 69 ventures offering
      # an opt-out keep it across a reload, `CLAUDE.md`'s local list covered it
      # via `platform/privacy/*.test.mjs` so every session ran it, and CI ran
      # it nowhere. A reviewer caught it before the merge.
      #
      # A hand-maintained list of filenames in a directory whose whole purpose
      # is catching promises nobody checks will lose the next file too. The
      # glob cannot: `checklist_coverage.py` already fails when a new test
      # DIRECTORY appears, and this closes the same gap one level down, for
      # files inside a directory CI already knows about.
      - name: Privacy checker unit tests
        run: node --test platform/privacy/*.test.mjs

      - name: Publish-surface unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_publish_surface

      # The other half of that pair. `publish_surface.py` reads what a merge
      # *ships*; `public_surface.py` reads what the hostnames actually
      # *serve*, and only the second can contradict a stale claim. These tests
      # open no socket -- the probe itself runs in `public-surface-check.yml`,
      # which needs a runner's unrestricted egress and no credential at all.
      - name: Public-surface prober unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_public_surface

      - name: Branch-cleanup decision-rule tests
        working-directory: platform/ci
        run: python3 -m unittest test_branch_cleanup

      # Branch cleanup's blind spot, from the other side: a branch that never
      # had a pull request. `unlanded_work.py` is the gate every session runs
      # before it ends (.github/prompts/land-your-work.md); these tests build
      # throwaway repositories with real refs/pull/<n>/head refs, so they need
      # git and nothing else.
      - name: Unlanded-work gate tests
        working-directory: platform/ci
        run: python3 -m unittest test_unlanded_work

      # The scheduled half of the same gate: adopt-stranded-branches.yml opens a
      # draft PR for each branch whose session died before it could.
      - name: Adopt-stranded-branches tests
        working-directory: platform/ci
        run: python3 -m unittest test_adopt_stranded

      - name: Check break-even.md agrees with its pinned snapshot
        run: python3 portfolio/ledger/break_even.py --check

      - name: Run break-even tests
        working-directory: portfolio/ledger
        run: python3 -m pytest test_break_even.py -q

      - name: Check the verification records are well-formed
        run: python3 portfolio/ledger/verification_status.py --check

      - name: Re-verification staleness tests
        working-directory: portfolio/ledger
        run: python3 -m unittest test_verification_status

      - name: Check the session gate still reads live
        run: python3 portfolio/ledger/session_gate.py

      - name: Session-gate tests
        working-directory: portfolio/ledger
        run: python3 -m pytest test_session_gate.py -q

      - name: Check the owner decision queue is well-formed
        run: python3 portfolio/ledger/decision_queue.py --check

      - name: Decision-queue tests
        working-directory: portfolio/ledger
        run: python3 -m unittest test_decision_queue

      - name: Check the consolidated egress table still matches a fresh ingest
        working-directory: portfolio/research/egress-reachability
        run: python3 consolidate.py --check

      - name: Check every host in an owner ask has a measured verdict
        working-directory: portfolio/research/egress-reachability
        run: python3 check_ask_hosts.py

      - name: Egress-consolidation tests
        working-directory: portfolio/research/egress-reachability
        run: python3 -m unittest test_consolidate
