name: Portfolio validate

# Every venture must stay legible to the portfolio router: a valid
# VENTURE.yaml, or an explicit NOT-A-VENTURE marker saying why the directory
# is not a business.
#
# And every candidate must carry the same score wherever that score is written.
# Candidates are rescored by one session at a time, in three files that are
# edited independently, so a partial rescore is invisible in the diff of any
# single pull request and only surfaces once two of them land together. The
# score must also obey the rubric itself — recomputed composite, the two gate
# minimums, and the mitigation rule — so a hand-edited number that is merely
# self-consistent across the three files but arithmetically wrong still fails.
#
# And the probe index must keep matching the probes. `probes/README.md` is the
# table CLAUDE.md routes the recurring "research new business projects" brief
# at, so a cell naming work as outstanding after that work has landed sends
# sessions at nothing. It has happened three times: a pnpm hand-review pointer
# that pulled four sessions to one closed line, a WCAG coverage split
# advertising two buildable rules when zero remained, and a model run named as
# costing "one run" that was already committed. Figures a probe's own artifacts
# can recompute are now checked against them.
#
# A routing table can also fail by not rendering. GFM splits a cell on every
# unescaped `|`, including inside a backtick span, so quoting a regex with an
# alternation silently adds columns and mangles the row. Both documents
# CLAUDE.md routes generic sessions at -- `pipeline/probes/README.md` and
# `research/README.md` -- shipped with exactly that defect, from the same
# quoted pattern, so their table widths are checked too.
#
# And the router's ranking logic must keep working: its pure-function unit
# suite is what a rescore or a signal-source change is checked against, and it
# had been runnable only by hand.
#
# And every workflow file must stay legible to GitHub itself: an unparseable
# one registers under its own path and emits a zero-job startup_failure per
# event, which no PR check surfaces.
#
# And the consolidated egress table must keep matching what has actually been
# measured. `research/egress-reachability/` exists because nine passes each
# re-probed an overlapping host set without folding the results anywhere; four
# days after it landed it was six hosts short again, because `--ingest` is a
# command someone has to remember to run. `--probe` iterates the committed
# table, so a host missing from it is never re-measured either. The ingest is
# deterministic and needs no network, so the drift is checkable.
#
# And no decision waiting on the account owner may name a host nothing has
# probed. `asks.yaml`'s egress row asked for `www.ftc.gov` for five days with
# no verdict in that table -- it had been measured by a pass that left prose
# and no results file, which the ingest cannot see. That row also named the
# EUVD *website* host while claiming to unlock a wedge that needs the *API*
# host, so granting it as written would have spent the owner's one allowlist
# decision and unblocked nothing. Naming a host now requires having measured
# it.

on:
  push:
    branches: [main]
    paths:
      - "ventures/**/VENTURE.yaml"
      - "ventures/**/NOT-A-VENTURE"
      - "ventures/**/*.html"
      # The apex tool mirror is generated from whole venture directories,
      # so a venture's module, script, stylesheet or licence going stale in
      # `gitops/prod/front-door-tools/` is exactly as invisible as a page
      # would be. The mirror-staleness step below is what reads them.
      # `.css`/`.js` joined `.mjs` here on 2026-09-02: `front-door-tools.mjs`'s
      # own SERVABLE_EXTENSIONS has mirrored all four since the mirror shipped
      # (construction-evidence-log's app.js and style.css are in the mirror
      # today), but neither extension had a path here or in
      # hetzner-gitops-ci.yml, so an edit to either file triggered no workflow
      # that runs the staleness check at all -- confirmed by editing
      # ventures/construction-evidence-log/app.js locally and watching
      # `front-door-tools.test.mjs` fail with the change unreverted.
      - "ventures/**/*.mjs"
      - "ventures/**/*.css"
      - "ventures/**/*.js"
      - "ventures/**/LICENSE"
      - "platform/marketing/**"
      - "platform/pages/**"
      - "portfolio/router/**"
      - "portfolio/pipeline/**"
      - "portfolio/research/README.md"
      - "portfolio/research/egress-reachability/**"
      - "portfolio/scoring/**"
      - "portfolio/usage/**"
      - "portfolio/ledger/break-even.md"
      - "portfolio/ledger/break_even.py"
      - "portfolio/ledger/test_break_even.py"
      - "portfolio/ledger/results-break-even-*.json"
      - "portfolio/ledger/verification_status.py"
      - "portfolio/ledger/test_verification_status.py"
      - "portfolio/ledger/verifications.yaml"
      - "portfolio/ledger/session_gate.py"
      - "portfolio/ledger/test_session_gate.py"
      - "portfolio/ledger/decision_queue.py"
      - "portfolio/ledger/test_decision_queue.py"
      - "portfolio/ledger/supersede_check.py"
      - "portfolio/ledger/test_supersede_check.py"
      - "portfolio/ledger/asks.yaml"
      - "portfolio/ledger/2026-08.yaml"
      - "platform/ci/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "ventures/**/VENTURE.yaml"
      - "ventures/**/NOT-A-VENTURE"
      - "ventures/**/*.html"
      # The apex tool mirror is generated from whole venture directories,
      # so a venture's module, script, stylesheet or licence going stale in
      # `gitops/prod/front-door-tools/` is exactly as invisible as a page
      # would be. The mirror-staleness step below is what reads them. See the
      # `push:` block above for why `.css`/`.js` are here too.
      - "ventures/**/*.mjs"
      - "ventures/**/*.css"
      - "ventures/**/*.js"
      - "ventures/**/LICENSE"
      - "platform/marketing/**"
      - "platform/pages/**"
      - "portfolio/router/**"
      - "portfolio/pipeline/**"
      - "portfolio/research/README.md"
      - "portfolio/research/egress-reachability/**"
      - "portfolio/scoring/**"
      - "portfolio/usage/**"
      - "portfolio/ledger/break-even.md"
      - "portfolio/ledger/break_even.py"
      - "portfolio/ledger/test_break_even.py"
      - "portfolio/ledger/results-break-even-*.json"
      - "portfolio/ledger/verification_status.py"
      - "portfolio/ledger/test_verification_status.py"
      - "portfolio/ledger/verifications.yaml"
      - "portfolio/ledger/session_gate.py"
      - "portfolio/ledger/test_session_gate.py"
      - "portfolio/ledger/decision_queue.py"
      - "portfolio/ledger/test_decision_queue.py"
      - "portfolio/ledger/supersede_check.py"
      - "portfolio/ledger/test_supersede_check.py"
      - "portfolio/ledger/asks.yaml"
      - "portfolio/ledger/2026-08.yaml"
      - "platform/ci/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # This job runs on every PR that touches any of the paths above and chains
    # roughly fifty checks and unit-test modules in sequence; it has taken
    # 3-4 minutes in recent runs. Uncapped, a hung pip install or a stalled
    # step anywhere in that chain would ride GitHub's default 360-minute
    # ceiling instead of failing fast -- see hetzner-gitops-ci.yml's own
    # timeout-minutes addition for why that matters on a metered-minutes
    # account (CLAUDE.md's CI-starvation history, 2026-08-26 to 2026-09-01).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # For the liability-clause check below. Everything else in this job is
      # Python; the Pages tooling that knows which pages get published is not.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r portfolio/router/requirements.txt pytest

      - name: Validate VENTURE.yaml schema
        run: python3 portfolio/router/validate.py

      # The apex serves a mirrored copy of 14 whole ventures so that the front
      # door's cards work while `portfolio-site-repo` is unsealed. The copy is
      # committed (Argo CD delivers it; no CI job builds it), so editing one of
      # those ventures without regenerating leaves the apex serving the old
      # tool. `hetzner-gitops-ci.yml` runs the same suite but triggers on
      # `gitops/**` and `platform/marketing/**` -- neither of which a venture
      # edit touches, which is the gap this step closes.
      - name: Check the apex tool mirror is not stale
        run: node --test "platform/marketing/*.test.mjs"

      - name: Check candidate scores agree across yaml, write-ups, and README
        run: python3 portfolio/pipeline/validate_doc_consistency.py

      - name: Check candidate scores obey the rubric rules
        run: python3 portfolio/pipeline/validate_candidates.py

      - name: Check the probe index's figures still match the probes' artifacts
        run: python3 portfolio/pipeline/probes/validate_probe_index.py

      - name: Probe-index validator unit tests
        working-directory: portfolio/pipeline/probes
        run: python3 -m unittest test_validate_probe_index

      # The evidence-boundary probes assert the rule their candidate write-ups
      # each name as the failure mode that would mislead a customer: a fetch or
      # resolver failure must never render as "nothing changed". Nothing ran
      # them until now, so that rule could regress silently.
      - name: Evidence-boundary probe tests
        run: |
          python3 -m pytest -q \
            portfolio/pipeline/probes/vendor-change-evidence/test_vendor_diff.py \
            portfolio/pipeline/probes/dns-configuration-evidence/test_dns_diff.py

      # The index above checks a probe's *figures*; it does not run the probe.
      # A probe whose tests never execute in CI can rot while its row still
      # reads "built, tested".
      - name: Branch-hygiene probe tests
        working-directory: portfolio/pipeline/probes/repository-branch-hygiene
        run: python3 -m pytest tests -q

      - name: MLS photo-spec probe tests
        working-directory: portfolio/pipeline/probes/mls-photo-spec
        run: python3 -m pytest tests -q

      - name: Check the measurement record in candidates.yaml is still readable
        run: python3 portfolio/pipeline/score_sensitivity.py

      - name: Score-sensitivity unit tests
        working-directory: portfolio/pipeline
        run: python3 -m unittest test_score_sensitivity

      - name: Check venture merit scores obey the rubric and cover every venture
        run: python3 portfolio/scoring/score_ventures.py --check

      - name: Venture-scoring unit tests
        working-directory: portfolio/scoring
        run: python3 -m unittest test_score_ventures

      - name: Router ranking-logic unit tests
        working-directory: portfolio/router
        run: python3 -m unittest test_allocate

      # The check itself needs a repository to read, and builds throwaway ones
      # rather than mocking git -- so it needs an identity to commit with, which
      # a bare runner does not have.
      - name: Supersede-check unit tests
        working-directory: portfolio/ledger
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          python3 -m unittest test_supersede_check

      # usage.yaml is the portfolio's only honest signal while revenue is zero,
      # and nothing read it in CI: #1387 left it unparseable and no check
      # noticed. These two steps are that missing guard.
      - name: Validate the usage ledger is readable
        run: python3 portfolio/usage/validate_usage.py

      - name: Usage-validator unit tests
        working-directory: portfolio/usage
        run: python3 -m unittest test_validate_usage

      - name: Validate workflow files are parseable
        run: python3 platform/ci/validate_workflows.py

      - name: Workflow-validator unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_validate_workflows

      - name: Agent cross-review unit tests
        working-directory: platform/ci/agent_review
        run: python3 -m unittest test_review

      # The local workflow runner is what sessions verify with while no
      # runner picks up a job here, so its own tests have to run somewhere.
      - name: Local workflow-runner unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_run_workflow_locally

      # And the tool that says whether a red check ran at all. Same reason:
      # it is what a session reaches for when CI comes back red, so it must
      # not be the thing that is broken.
      - name: CI-starvation classifier unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_ci_starvation

      # A calculator whose shipped defaults fail constraint validation cannot be
      # submitted at all: the browser refuses before dispatching the event, so
      # the page's own handler never runs and the button silently does nothing.
      # calc.mjs tests all pass in that state, because the arithmetic is fine.
      - name: Check every calculator's default form state can actually be submitted
        run: python3 platform/ci/check_form_defaults.py

      - name: Form-default checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_form_defaults

      # The other direction of the same question. `check_form_defaults.py` asks
      # whether the values a page ships with satisfy the constraints it
      # declares; this asks whether those constraints are wide enough to let a
      # visitor type something `calc.mjs` will throw on. When they are, the
      # page prints "fix the highlighted input" and highlights nothing, because
      # `invalid.mjs` finds the field by asking `checkValidity()` and a field
      # with no declared bound reports valid whatever is in it. 23 inputs
      # across four ventures were in that state on 2026-08-31.
      - name: Check no input accepts a value its own calculator throws on
        run: python3 platform/ci/check_input_bounds.py

      - name: Input-bounds checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_input_bounds

      # Every venture vendors its own money() -- 322 copies of one function --
      # and it spelled a negative "$-9.24" instead of "-$9.24", and a rounded-off
      # -0 as "$-0.00". 11,172 unit tests went green over both, because not one
      # asserted on a negative rendering. A new calculator is usually a copy of
      # the nearest existing one, so the broken spelling is the one that spreads.
      - name: Check no calculator puts the minus sign inside the currency symbol
        run: python3 platform/ci/check_money_sign.py

      - name: Money-sign checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_money_sign

      - name: Check what a merge to main can publish still matches the snapshot
        run: python3 platform/ci/publish_surface.py --check

      # Backstop for the per-venture no-warranty check now wired into each
      # venture's own CI. A venture workflow only fires on its own paths, so it
      # cannot cover a slug whose workflow was never created -- which is
      # exactly how carpet-install-bid-calculator reached main with no CI at
      # all, already inside the Pages build. This walks every surface the Pages
      # site would publish, so a new venture is covered before anyone
      # remembers to give it a workflow.
      #
      # The no-SLA half is not checked here: build.mjs injects it into every
      # published page, so it holds by construction.
      - name: Every published page carries the no-warranty clause
        run: node platform/pages/clauses.mjs

      - name: Clause-checker unit tests
        run: node --test platform/pages/clauses.test.mjs

      # The FAQ backlog was drained by six concurrent sessions on 2026-08-30,
      # each appending a "Common questions" section to whichever ventures its
      # own snapshot reported as missing. Two snapshots overlapped by five
      # ventures, and the merge auto-resolved one file into two complete FAQ
      # sections with no conflict and no failing test. `no-show-fee-calculator`
      # reached main in the same shape from an older route.
      #
      # Checked centrally because the defect is created by a *merge*: no
      # per-venture workflow fires on a file its own branch never edited.
      - name: No page carries a duplicated FAQ section or question
        run: node platform/pages/faq-duplicate.mjs

      - name: Duplicate-FAQ checker unit tests
        run: node --test platform/pages/faq-duplicate.test.mjs

      # Every venture footer offers the local usage counter's opt-out "with Do
      # Not Track / Global Privacy Control", and Global Privacy Control is a
      # valid opt-out signal under CCPA and several state privacy laws. That
      # promise held in 150 of 155 usage modules and was tested in 23: the
      # per-venture test is six boilerplate lines, so it got skipped, and five
      # ventures shipped a counter that ignored both signals.
      #
      # Checked centrally for the same reason as the clause above -- one guard
      # covers a venture that does not have its own workflow yet. The check is
      # behavioural, not a grep: reading `globalPrivacyControl` proves nothing
      # if the module never branches on it, so each recorder is called under
      # each signal with a storage spy.
      - name: Usage counters honour Do Not Track and Global Privacy Control
        run: node platform/privacy/browser-signals.mjs

      - name: Browser-signal checker unit tests
        run: node --test platform/privacy/browser-signals.test.mjs

      - name: Publish-surface unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_publish_surface

      - name: Branch-cleanup decision-rule tests
        working-directory: platform/ci
        run: python3 -m unittest test_branch_cleanup

      - name: Check break-even.md agrees with its pinned snapshot
        run: python3 portfolio/ledger/break_even.py --check

      - name: Run break-even tests
        working-directory: portfolio/ledger
        run: python3 -m pytest test_break_even.py -q

      - name: Check the verification records are well-formed
        run: python3 portfolio/ledger/verification_status.py --check

      - name: Re-verification staleness tests
        working-directory: portfolio/ledger
        run: python3 -m unittest test_verification_status

      - name: Check the session gate still reads live
        run: python3 portfolio/ledger/session_gate.py

      - name: Session-gate tests
        working-directory: portfolio/ledger
        run: python3 -m pytest test_session_gate.py -q

      - name: Check the owner decision queue is well-formed
        run: python3 portfolio/ledger/decision_queue.py --check

      - name: Decision-queue tests
        working-directory: portfolio/ledger
        run: python3 -m unittest test_decision_queue

      - name: Check the consolidated egress table still matches a fresh ingest
        working-directory: portfolio/research/egress-reachability
        run: python3 consolidate.py --check

      - name: Check every host in an owner ask has a measured verdict
        working-directory: portfolio/research/egress-reachability
        run: python3 check_ask_hosts.py

      - name: Egress-consolidation tests
        working-directory: portfolio/research/egress-reachability
        run: python3 -m unittest test_consolidate
