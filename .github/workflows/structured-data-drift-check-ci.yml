name: structured-data-drift-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared extraction and
# divergence engine, `cli.mjs` is the Node gate, and `page.test.mjs` covers
# the page wiring (including dogfooding: the venture's own pages must pass
# their own check). Keep all three covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file, `validate_workflows.py`
# would fail the moment the venture's `*.test.mjs` files land -- the same
# hole `npm-lifecycle-script-check-ci.yml` documents.
on:
  pull_request:
    paths:
      - "ventures/structured-data-drift-check/**"
      - ".github/workflows/structured-data-drift-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/structured-data-drift-check/**"
      - ".github/workflows/structured-data-drift-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structured-data-drift-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/structured-data-drift-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run drift engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
