name: mcp-supply-chain-watch CI

# Standard-library Python CLI. Keep manifest-diff arithmetic covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/mcp-supply-chain-watch/**"
      - ".github/workflows/mcp-supply-chain-watch-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/mcp-supply-chain-watch/**"
      - ".github/workflows/mcp-supply-chain-watch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-supply-chain-watch-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/mcp-supply-chain-watch

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run manifest-diff tests
        run: python3 -m unittest discover -s tests -v
      - name: Example manifests produce a report
        run: python3 src/mcp_watch.py examples/before.json examples/after.json --format markdown

  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/mcp-supply-chain-watch/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page. Checked here so this venture goes red on its own PR, not on the
      # Pages job after the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs mcp-supply-chain-watch
