name: mcp-supply-chain-watch CI

# Standard-library Python CLI. Keep manifest-diff arithmetic covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/mcp-supply-chain-watch/**"
      - ".github/workflows/mcp-supply-chain-watch-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/mcp-supply-chain-watch/**"
      - ".github/workflows/mcp-supply-chain-watch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-supply-chain-watch-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/mcp-supply-chain-watch

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run manifest-diff tests
        run: python3 -m unittest discover -s tests -v
      - name: Example manifests produce a report
        run: python3 src/mcp_watch.py examples/before.json examples/after.json --format markdown

  site-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/mcp-supply-chain-watch/site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test
