name: construction-evidence-log CI

# Dependency-free browser evidence pack. Keep record-building covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/construction-evidence-log/**"
      - ".github/workflows/construction-evidence-log-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/construction-evidence-log/**"
      - ".github/workflows/construction-evidence-log-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construction-evidence-log-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/construction-evidence-log

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run record tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs construction-evidence-log
