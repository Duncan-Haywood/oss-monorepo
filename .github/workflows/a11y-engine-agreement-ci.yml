name: a11y-engine-agreement CI

# Test coverage for the cross-engine reconciliation under
# portfolio/research/a11y-engine-agreement/. Standard-library-only, no network,
# so this workflow does no more than a contributor runs locally: run the tests.
# It publishes nothing, registers nothing, and spends no API budget — it is a
# test runner, not the unattended-automation kind of workflow CLAUDE.md gates.
# Same shape as its siblings (a11y-evidence-record-ci.yml,
# a11y-render-recovery-ci.yml, a11y-theme-resolution-ci.yml).
#
# The load-bearing invariant is that this portfolio's *two* WCAG engines stay in
# agreement. They were built independently for the same candidate and, when
# first run on the same input on 2026-08-21, each turned out to be silently
# blind to two checks the other had — with neither listing the other's in its
# own coverage statement, so a customer-facing record could not distinguish
# "checked and passed" from "never looked at". Those four gaps are closed; this
# suite is what stops a fifth from opening quietly. A change to either engine
# that reintroduces a silent coverage gap fails here.
#
# Both engines' paths are watched, because this suite imports them directly and
# a change to either can break it without touching this directory.

on:
  pull_request:
    paths:
      - "portfolio/research/a11y-engine-agreement/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-engine-agreement-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/a11y-engine-agreement/**"
      - "portfolio/research/a11y-evidence-record/**"
      - "portfolio/pipeline/probes/eaa-wcag-triage/**"
      - ".github/workflows/a11y-engine-agreement-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: a11y-engine-agreement-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/a11y-engine-agreement

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install step, by design.
      - run: python3 -m unittest discover -p 'test_*.py'
      # The summary in README.md must still re-derive from the committed
      # results with no network. Catches a hand-edited number.
      - run: python3 reconcile.py --recompute-from results-2026-08-21.json
