name: delivery-app-margin-calculator CI

# Test runner for the browser-local restaurant delivery-margin comparison. The
# product is static ES modules with no build step and no dependencies, so this
# does no more than a contributor runs locally: `node --test`. It publishes
# nothing, registers nothing, and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/delivery-app-margin-calculator/**"
      - ".github/workflows/delivery-app-margin-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/delivery-app-margin-calculator/**"
      - ".github/workflows/delivery-app-margin-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-app-margin-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/delivery-app-margin-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
