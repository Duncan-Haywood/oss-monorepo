name: coffee-roaster-margin-calculator CI

# Venture unit tests, independent of the portfolio-wide validation workflow
# (which does not run venture unit tests).
on:
  pull_request:
    paths:
      - "ventures/coffee-roaster-margin-calculator/**"
      - ".github/workflows/coffee-roaster-margin-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/coffee-roaster-margin-calculator/**"
      - ".github/workflows/coffee-roaster-margin-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coffee-roaster-margin-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/coffee-roaster-margin-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: node --test
