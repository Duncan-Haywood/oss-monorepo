name: Prompts

# The prompt system under prompts/ and the master prompt.md: routing, every
# sub-prompt version, and every run record must stay valid for the router and
# the review track to trust them. Every guidance file anywhere (CLAUDE.md,
# AGENTS.md, .github/prompts/) must have an entry in prompts/system.json.

on:
  push:
    branches: [main]
    paths:
      - "prompt.md"
      - "prompts/**"
      - "IDEAS.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - ".github/prompts/**"
      - ".github/workflows/prompts-ci.yml"
      - "docs/taxonomy.json"
      - "docs/reports/**"
      - "platform/ci/doc_index.py"
      - "platform/ci/test_doc_index.py"
  pull_request:
    paths:
      - "prompt.md"
      - "prompts/**"
      - "IDEAS.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - ".github/prompts/**"
      - ".github/workflows/prompts-ci.yml"
      - "docs/taxonomy.json"
      - "docs/reports/**"
      - "platform/ci/doc_index.py"
      - "platform/ci/test_doc_index.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Only what the validator and prompts/ tests read (measured in
          # docs/history/ci-perf-2026-11-03-prompts-sparse.md): the tree is
          # ~900 MB, mostly audio and images this job never opens.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.md
            /prompt.md
            /prompts/
            /platform/ci/
            /docs/taxonomy.json
            /.github/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 prompts/promptctl.py validate
      - run: python3 -m unittest discover -s prompts -v
      - run: python3 -m unittest test_doc_index -v
        working-directory: platform/ci
