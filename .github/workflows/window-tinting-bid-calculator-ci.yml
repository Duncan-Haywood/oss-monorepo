name: window-tinting-bid-calculator CI

# Zero-dependency browser calculator: `calc.mjs` is the deterministic
# pane-and-film-driven pricing engine, `usage.mjs` is the opt-in local usage
# counter, and `index.html` is the single self-contained page. Keep all of it
# covered independently of the portfolio-wide validation workflow, which only
# checks published pages and does not run venture unit tests. Without this
# file, `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `land-survey-bid-calculator-ci.yml`
# and `pdf-accessibility-tag-check-ci.yml` document.
on:
  pull_request:
    paths:
      - "ventures/window-tinting-bid-calculator/**"
      - ".github/workflows/window-tinting-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/window-tinting-bid-calculator/**"
      - ".github/workflows/window-tinting-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: window-tinting-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/window-tinting-bid-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- see cors-misconfig-check-ci.yml's
      # comment on this same step for why a bare `node --test` (which walks
      # the whole working directory) is preferred over naming files.
      - name: Run every test in the venture
        run: node --test
