name: equipment-lease-buyout-calculator CI

# Dependency-free browser calculator. Keep user-visible arithmetic covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/equipment-lease-buyout-calculator/**"
      - ".github/workflows/equipment-lease-buyout-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/equipment-lease-buyout-calculator/**"
      - ".github/workflows/equipment-lease-buyout-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equipment-lease-buyout-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/equipment-lease-buyout-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs equipment-lease-buyout-calculator
