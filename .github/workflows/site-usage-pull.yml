# Copies the site's daily page-load counts and feedback-form messages from
# platform/edge into portfolio/usage/site-visits.json and site-feedback.json,
# GitHub repo traffic into portfolio/usage/github-traffic.json, and
# Cloudflare's own edge analytics into portfolio/usage/cloudflare-analytics.json,
# so agents can read them like any other committed file (owner request,
# 2026-10-20). Each step does nothing while its site.json has no url, so this
# is inert until the Worker is deployed and its address committed.
#
# Where the files land: the data branch `usage-data`, at its root, not main.
# main's ruleset (.github/rulesets/main.json) takes changes only through a PR,
# so the old `git push HEAD:main` was rejected with GH013 from 2026-10-31 on
# (run 41172448053). A PR opened from here would not help: a PR created with
# GITHUB_TOKEN starts no workflow, so the required checks (conflict-markers,
# control-plane) would never report and it could not merge unattended. Same
# pattern as security-alert-queue.yml and its `security-alerts` branch.
# Sessions read the branch with `node platform/counter/usage-data.mjs show`
# and copy it into portfolio/usage/ with `... sync` when a PR should carry it
# (portfolio/usage/README.md, "Where the daily pull lands").
name: site-usage-pull
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-usage-pull
  cancel-in-progress: false
jobs:
  pull:
    # Secrets live in the `usage` environment, limited to main
    # (docs/security/agent-hardening.md, step 4).
    environment: usage
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # The one job, and it commits the pulled files to the `usage-data` branch.
    permissions:
      contents: write
    env:
      DATA_BRANCH: usage-data
    steps:
      # The token is not left in .git/config while the pull scripts run; only
      # the clone and push steps below see it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # The pull scripts merge with the file already in portfolio/usage/, so
      # the branch's copy goes there first. On the branch's first run there is
      # nothing to copy and main's files are the starting point.
      - name: Check out the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The helper reads the token from each step's env, so it is never
          # written to disk.
          git config --global credential.helper \
            '!f() { echo username=x-access-token; echo "password=${GITHUB_TOKEN}"; }; f'
          url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$DATA_BRANCH" >/dev/null; then
            git clone --quiet --depth 1 --branch "$DATA_BRANCH" "$url" "$RUNNER_TEMP/data"
          else
            git init --quiet -b "$DATA_BRANCH" "$RUNNER_TEMP/data"
            git -C "$RUNNER_TEMP/data" remote add origin "$url"
          fi
          for f in site-visits.json site-feedback.json github-traffic.json cloudflare-analytics.json; do
            if [ -f "$RUNNER_TEMP/data/$f" ]; then cp "$RUNNER_TEMP/data/$f" "portfolio/usage/$f"; fi
          done
      - name: Pull counts
        run: |
          url=$(node -p 'require("./platform/counter/site.json").url')
          if [ -z "$url" ]; then echo "platform/counter/site.json has no url; nothing to pull."; exit 0; fi
          COUNTER_URL="$url" node platform/counter/pull.mjs
      - name: Pull feedback
        run: |
          url=$(node -p 'require("./platform/edge/site.json").url')
          if [ -z "$url" ]; then echo "platform/edge/site.json has no url; nothing to pull."; exit 0; fi
          EDGE_URL="$url" node platform/edge/pull-feedback.mjs
      # GitHub keeps repo traffic for 14 days only. The workflow token cannot
      # read it (it needs Administration: Read), so this step does nothing
      # until the owner adds a TRAFFIC_TOKEN secret. TRAFFIC_REPOS (a repo
      # variable, comma-separated) widens it beyond this repository.
      - name: Pull GitHub repo traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_REPOS: ${{ vars.TRAFFIC_REPOS || github.repository }}
        run: node platform/counter/pull-github-traffic.mjs
      # Every request to the site passes Cloudflare, so its analytics see the
      # crawlers and scripts the page's beacon cannot (pull-cloudflare.mjs).
      # CLOUDFLARE_ANALYTICS_TOKEN (Account Analytics: Read, Zone Analytics:
      # Read, Zone: Read) is tried first; the deploy token may lack those, in
      # which case the file records which datasets answered and the job stays
      # green.
      - name: Pull Cloudflare analytics
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARERESTRICTEDAPIKEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node platform/counter/pull-cloudflare.mjs
      - name: Commit to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d="$RUNNER_TEMP/data"
          for f in site-visits.json site-feedback.json github-traffic.json cloudflare-analytics.json; do
            if [ -f "portfolio/usage/$f" ]; then cp "portfolio/usage/$f" "$d/$f"; fi
          done
          cat > "$d/README.md" <<'MD'
          # usage-data

          Written daily by `.github/workflows/site-usage-pull.yml` on main. Holds only
          generated, aggregate files; never merged as a branch, never edited by hand.
          Read: `node platform/counter/usage-data.mjs show` (from a main checkout).
          Land on main: `node platform/counter/usage-data.mjs sync`, then a PR.
          See portfolio/usage/README.md, "Where the daily pull lands".
          MD
          cd "$d"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          # The Actions bot address, so GitHub credits github-actions[bot]. The old
          # noreply@users.noreply.github.com credited the stranger whose login is "noreply".
          git -c user.name="site-usage-pull (GitHub Actions)" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "usage: daily site page-load counts, feedback, GitHub repo traffic and Cloudflare analytics"
          git push --quiet origin "HEAD:refs/heads/${DATA_BRANCH}"
