name: actions-permissions-check CI

# Zero-dependency CLI/browser tool: `check.py` is the canonical classifier and
# `classify.mjs` is the same logic reimplemented for the in-browser page. Keep
# both covered independently of the portfolio-wide validation workflow, which
# only checks published pages and does not run venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/actions-permissions-check/**"
      - ".github/workflows/actions-permissions-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/actions-permissions-check/**"
      - ".github/workflows/actions-permissions-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-permissions-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/actions-permissions-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run classifier tests (Python — the canonical CLI)
        run: python3 -m unittest test_check -v
      - name: Run classifier tests (browser page logic, including CLI parity)
        run: node --test classify.test.mjs
      - name: Run page tests (disclaimers, SEO metadata, sitemap coverage)
        run: node --test page.test.mjs
