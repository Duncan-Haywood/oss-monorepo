name: Secrets inventory

# Fails when a workflow reads a secret that docs/security/secrets-inventory.yaml
# does not list, when the inventory lists one nothing reads, when an entry's
# workflows/environments drift, or when a retired secret is read again
# (platform/ci/secrets_inventory.py). Owner, 2026-11-24: keys managed as code.
# Reads the repository only; no secrets, no pushes, no paid APIs.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "docs/security/secrets-inventory.yaml"
      - "platform/ci/secrets_inventory.py"
      - "platform/ci/test_secrets_inventory.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docs/security/secrets-inventory.yaml"
      - "platform/ci/secrets_inventory.py"
      - "platform/ci/test_secrets_inventory.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            docs/security
            platform/ci

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: python3 -m pip install pyyaml

      - name: Checker unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_secrets_inventory

      - name: Every secret the workflows read is in the inventory, and nothing else
        run: python3 platform/ci/secrets_inventory.py
