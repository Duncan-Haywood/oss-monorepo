# Build and check the portfolio Pages artifact. This workflow does NOT publish.
#
# Why it no longer deploys
# ------------------------
# Two sessions built a portfolio Pages pipeline within hours of each other on
# 2026-08-26 and both landed on `main`: #1718 (`platform/pages/build.mjs`, driven
# by `portfolio-pages.yml`) and #1724 (this one, `platform/ci/build_pages_site.py`).
# Neither could see the other in flight.
#
# GitHub serves ONE Pages site per repository. Both workflows triggered on
# `ventures/**`, both gated their deploy on the same `GITHUB_PAGES_ENABLED`
# variable, and their concurrency groups differed -- so they did not serialise
# against each other. The owner flip everyone is waiting on would therefore have
# started two `actions/deploy-pages` runs on every push and left the live origin
# flapping between two different builds of the same products. That defeats the
# flip rather than delivering it.
#
# `portfolio/DIRECTION.md` names `platform/pages/` and `portfolio-pages.yml` as
# the site the flip publishes, and DIRECTION.md is explicitly the document that
# wins when instructions conflict. That is the tiebreak used here: publishing
# lives in `portfolio-pages.yml`, and this workflow keeps building and checking.
#
# Nothing here is deleted. `platform/ci/build_pages_site.py`, its tests, and
# `check_pages_links.py` still run on every push and pull request, so this code
# stays exercised and its checks still guard `ventures/**`. Consolidating the two
# builders into one is worth doing, but it is a judgement about which of two
# tested, merged implementations survives -- it should be made deliberately, not
# as a side effect of fixing the race. Do not re-add a deploy job here without
# first removing the one in `portfolio-pages.yml`.

name: Portfolio Pages artifact check

on:
  push:
    branches: [main]
    paths:
      - "ventures/**"
      - "platform/ci/build_pages_site.py"
      - "platform/ci/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "ventures/**"
      - "platform/ci/build_pages_site.py"
      - "platform/ci/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Serialised so two builds of the same tree do not interleave. This workflow no
# longer publishes, so nothing here can reach the live site.
concurrency:
  group: pages-artifact-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Site-builder unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_build_pages_site

      - name: Validate what would be published
        run: python3 platform/ci/build_pages_site.py --check

      - name: Build the site
        run: |
          python3 platform/ci/build_pages_site.py \
            --base-url "${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"

      # A published site whose links 404 is worse than no site: it burns the
      # crawl budget and the first visitor. Check the artifact before it ships.
      - name: Check every hub link resolves in the built artifact
        run: python3 platform/ci/check_pages_links.py _site

      - name: Upload Pages artifact
        # Only the deploy job consumes this, but uploading unconditionally keeps
        # the artifact inspectable on a PR run where deploying is not wanted.
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
