# Publish every browser product in `ventures/` to GitHub Pages.
#
# Why this workflow exists
# ------------------------
# As of 2026-08-26 this repo carries 32 finished browser calculators and not one
# of them has a public URL. `platform/ci/publish_surface.py` reports that no
# workflow publishes anything on a push to `main`, and the only Pages workflow
# in the repo ships one venture's docs (`retail-pilot-intel-deploy-docs.yml`).
#
# That is the gap this closes. The owner flip everyone has been waiting on --
# `GITHUB_PAGES_ENABLED` -- would, on its own, have published none of the
# products, because nothing built them into a Pages artifact. Now it publishes
# all of them at once.
#
# This deliberately reuses the SAME owner variable the existing Pages workflow
# gates on rather than introducing a second switch. `portfolio/hosting/README.md`
# is explicit that `deploy-settings` is the one remaining owner flip and that no
# second platform ask should be opened.
#
# The build job runs unconditionally so that a broken site build is a red check
# on the PR that broke it, whether or not Pages is switched on yet.
#
# 2026-08-26: this workflow no longer deploys.
# ---------------------------------------------------------------------------
# Two sessions independently built a portfolio Pages site the same day: this one
# (`platform/ci/build_pages_site.py`, #1720-era) and `portfolio-pages.yml`
# (`platform/pages/build.mjs`, #1718). Both deployed on a push to `main` behind
# the same `GITHUB_PAGES_ENABLED` flip, from *different* concurrency groups — so
# the flip everyone is waiting on would have started two deployments of two
# different sites to the one origin GitHub gives a repository. They would have
# raced on every merge, and the live site would have flapped between them.
#
# Neither implementation is discarded. The deploy is kept on the Node build
# because it is the superset — same automatic discovery, plus cross-tool
# navigation, offline support, an offline/404 fallback, link repair, and the
# artifact checks — and because `asks.yaml`, `portfolio/DIRECTION.md` and
# `platform/pages/README.md` all describe that artifact as what the queued
# `deploy-settings` flip publishes.
#
# This build and its checks still run on every push and PR, so a break here is
# still a red check. To publish THIS site instead, set `PORTFOLIO_PAGES_PY` to
# `true` and unset `GITHUB_PAGES_ENABLED` — never both at once.

name: Deploy portfolio Pages site

on:
  push:
    branches: [main]
    paths:
      - "ventures/**"
      - "platform/ci/build_pages_site.py"
      - "platform/ci/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "ventures/**"
      - "platform/ci/build_pages_site.py"
      - "platform/ci/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Pages allows one deployment at a time. Do not cancel a running publish --
# an interrupted deploy can leave the live site on a half-uploaded artifact.
#
# The group is shared with `portfolio-pages.yml` on purpose: GitHub serialises
# by group name, and two groups both deploying to the one Pages origin is how
# the live site ends up half from one build and half from the other.
concurrency:
  group: github-pages-origin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Site-builder unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_build_pages_site

      - name: Validate what would be published
        run: python3 platform/ci/build_pages_site.py --check

      - name: Build the site
        run: |
          python3 platform/ci/build_pages_site.py \
            --base-url "${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"

      # A published site whose links 404 is worse than no site: it burns the
      # crawl budget and the first visitor. Check the artifact before it ships.
      - name: Check every hub link resolves in the built artifact
        run: python3 platform/ci/check_pages_links.py _site

      - name: Upload Pages artifact
        # Only the deploy job consumes this, but uploading unconditionally keeps
        # the artifact inspectable on a PR run where deploying is not wanted.
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Never publish from a pull request: a PR build is untrusted code, and a
    # fork PR must not be able to overwrite the live site.
    # See the note at the top of this file: the origin is published by
    # `portfolio-pages.yml`. This job is the deliberate opt-in to publishing the
    # Python-built site instead, and must never be on at the same time.
    if: >-
      github.event_name != 'pull_request' &&
      vars.PORTFOLIO_PAGES_PY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the public URL
        run: |
          echo "### Portfolio site published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
