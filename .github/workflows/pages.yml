# Publish every browser product in `ventures/` to GitHub Pages.
#
# Why this workflow exists
# ------------------------
# As of 2026-08-26 this repo carries 32 finished browser calculators and not one
# of them has a public URL. `platform/ci/publish_surface.py` reports that no
# workflow publishes anything on a push to `main`, and the only Pages workflow
# in the repo ships one venture's docs (`retail-pilot-intel-deploy-docs.yml`).
#
# That is the gap this closes. The owner flip everyone has been waiting on --
# `GITHUB_PAGES_ENABLED` -- would, on its own, have published none of the
# products, because nothing built them into a Pages artifact. Now it publishes
# all of them at once.
#
# This deliberately reuses the SAME owner variable the existing Pages workflow
# gates on rather than introducing a second switch. `portfolio/hosting/README.md`
# is explicit that `deploy-settings` is the one remaining owner flip and that no
# second platform ask should be opened.
#
# The build job runs unconditionally so that a broken site build is a red check
# on the PR that broke it, whether or not Pages is switched on yet.

name: Deploy portfolio Pages site

on:
  push:
    branches: [main]
    paths:
      - "ventures/**"
      - "platform/ci/build_pages_site.py"
      - "platform/ci/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "ventures/**"
      - "platform/ci/build_pages_site.py"
      - "platform/ci/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# GitHub serves one Pages site per repository, so every workflow that can deploy
# to it shares this one concurrency group — `github-pages-site`. Different groups
# would let two publishes run at the same moment and interleave on one site.
# `cancel-in-progress: false` lets an in-flight publish finish rather than
# leaving the live site on a half-uploaded artifact.
concurrency:
  group: github-pages-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Site-builder unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_build_pages_site

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: One Pages site, one publisher
        # This workflow is the one most likely to break the invariant, since
        # re-enabling its deploy job is a one-line edit. Check it here too, so
        # the edit turns this workflow red rather than silently arming a race.
        working-directory: platform/pages
        run: node --test publishers.test.mjs

      - name: Validate what would be published
        run: python3 platform/ci/build_pages_site.py --check

      - name: Build the site
        run: |
          python3 platform/ci/build_pages_site.py \
            --base-url "${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"

      # A published site whose links 404 is worse than no site: it burns the
      # crawl budget and the first visitor. Check the artifact before it ships.
      - name: Check every hub link resolves in the built artifact
        run: python3 platform/ci/check_pages_links.py _site

      - name: Upload Pages artifact
        # Only the deploy job consumes this, but uploading unconditionally keeps
        # the artifact inspectable on a PR run where deploying is not wanted.
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Never publish from a pull request: a PR build is untrusted code, and a
    # fork PR must not be able to overwrite the live site.
    #
    # Held off 2026-08-26. This job and `portfolio-pages.yml`'s deploy job read
    # the SAME `GITHUB_PAGES_ENABLED` variable, from different `concurrency`
    # groups (`pages-deploy` here, `portfolio-pages` there). A repository serves
    # exactly one Pages site, so the owner flip everyone is waiting on would
    # have started two deployments at once, racing for that one site, and the
    # public URL would have shown whichever finished last — a coin toss on every
    # push to `ventures/**`, which is most days.
    #
    # `portfolio-pages.yml` keeps the flip because `platform/pages/` is the more
    # developed line: it carries the cross-tool navigation (#1726), the hub
    # description fix (#1730), the artifact check, and a post-deploy check of
    # the real public URL. Nothing here is deleted and this workflow's build,
    # unit tests, and link check still run on every push, so the Python builder
    # stays green, inspectable, and one line from being the publisher again.
    #
    # If this becomes the publisher, hold off `portfolio-pages.yml`'s deploy in
    # the same way and give both jobs the same `concurrency` group. Do not let
    # two `deploy-pages` jobs read one variable.
    if: >-
      github.event_name != 'pull_request' &&
      vars.PAGES_PUBLISHER == 'platform-ci' &&
      vars.GITHUB_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the public URL
        run: |
          echo "### Portfolio site published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
