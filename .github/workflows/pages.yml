# Publish every browser product in `ventures/` to GitHub Pages.
#
# Why this workflow exists
# ------------------------
# As of 2026-08-26 this repo carries 32 finished browser calculators and not one
# of them has a public URL. `platform/ci/publish_surface.py` reports that no
# workflow publishes anything on a push to `main`, and the only Pages workflow
# in the repo ships one venture's docs (`retail-pilot-intel-deploy-docs.yml`).
#
# That is the gap this closes. The owner flip everyone has been waiting on --
# `GITHUB_PAGES_ENABLED` -- would, on its own, have published none of the
# products, because nothing built them into a Pages artifact. Now it publishes
# all of them at once.
#
# The build job runs unconditionally so that a broken site build is a red check
# on the PR that broke it, whether or not Pages is switched on yet.
#
# Superseded as the publisher, 2026-08-26
# ---------------------------------------
# Three sessions built a portfolio Pages site within hours of each other. Two
# landed: this one and `portfolio-pages.yml`. Both deployed a *different*
# artifact, and both were gated on the same `GITHUB_PAGES_ENABLED` under
# different `concurrency:` groups (`pages-deploy` and `portfolio-pages`) — and a
# concurrency group is per-workflow, so they would not have queued behind each
# other. A repository serves one Pages site, so the owner's single flip would
# have started two publishes on every push to `ventures/**` and left the live
# site as whichever job finished last. Nothing was red; the defect would only
# have appeared at the flip, which is the worst possible moment.
#
# `portfolio-pages.yml` is the publisher, on the merits rather than on arrival
# order: building both, it produced 41 tools to this one's 40 (it reaches the
# five electronics calculators under `ai-engineering-academy`), it injects
# cross-page navigation so a visitor arriving from a search result can reach the
# other tools, and it ships a 404 page.
#
# This workflow is kept rather than deleted — it is a complete, tested
# implementation and the two are worth consolidating deliberately rather than in
# the same rushed hour that produced them. Its deploy now needs its own
# `PAGES_PY_BUILDER` variable, which nothing sets. That is not a second owner
# ask: `deploy-settings` is unchanged and still publishes the site, through
# `portfolio-pages.yml`. `publish_surface.py --check` now fails if two Pages
# deployers ever share a gate again.

name: Deploy portfolio Pages site

on:
  push:
    branches: [main]
    paths:
      - "ventures/**"
      - "platform/ci/build_pages_site.py"
      - "platform/ci/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "ventures/**"
      - "platform/ci/build_pages_site.py"
      - "platform/ci/test_build_pages_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Pages allows one deployment at a time. Do not cancel a running publish --
# an interrupted deploy can leave the live site on a half-uploaded artifact.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Site-builder unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_build_pages_site

      - name: Validate what would be published
        run: python3 platform/ci/build_pages_site.py --check

      - name: Build the site
        run: |
          python3 platform/ci/build_pages_site.py \
            --base-url "${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"

      # A published site whose links 404 is worse than no site: it burns the
      # crawl budget and the first visitor. Check the artifact before it ships.
      - name: Check every hub link resolves in the built artifact
        run: python3 platform/ci/check_pages_links.py _site

      - name: Upload Pages artifact
        # Only the deploy job consumes this, but uploading unconditionally keeps
        # the artifact inspectable on a PR run where deploying is not wanted.
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # Never publish from a pull request: a PR build is untrusted code, and a
    # fork PR must not be able to overwrite the live site.
    # `PAGES_PY_BUILDER`, not `GITHUB_PAGES_ENABLED` — see the header. One flip
    # must not start two publishes of two different sites to the one Pages
    # origin this repository has. Setting this to `true` hands the origin to
    # this builder instead of `portfolio-pages.yml`; leaving it unset (the
    # default) is what makes `deploy-settings` unambiguous.
    if: >-
      github.event_name != 'pull_request' &&
      vars.PAGES_PY_BUILDER == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the public URL
        run: |
          echo "### Portfolio site published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
