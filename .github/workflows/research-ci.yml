name: Research

# The research portfolio under research/. Builds its homepage, which fails if a
# project is missing from research/README.md or research/_homepage/projects.json.

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/research-ci.yml"
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homepage:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Default depth 1: build.py reads only the working tree. A full
          # clone here took a median 96s of a 101s job
          # (docs/history/ci-perf-2026-10-21.md).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 research/_homepage/build.py
