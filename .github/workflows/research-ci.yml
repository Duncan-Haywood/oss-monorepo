name: Research

# The research portfolio under research/. Builds its homepage, which fails if a
# project is missing from research/README.md or research/_homepage/projects.json.

on:
  push:
    branches: [main]
    paths:
      - "research/**"
      - ".github/workflows/research-ci.yml"
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homepage:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mirror.py check needs the synced upstream commit in history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 research/_homepage/build.py
      - run: python3 -m unittest discover -s research/_mirror -v
      # Fails a pull request that edits the mirrored copy by hand. --allow-behind: upstream may
      # be ahead of state.json (that is a sync to do, not an error in this PR).
      - run: python3 research/_mirror/mirror.py check --allow-behind
