name: npm-lifecycle-script-check CI

# Zero-dependency Node tool: `engine.mjs` is the classifier, `cli.mjs` wraps it
# for the terminal, and the page runs the same engine in the browser. Keep all
# three covered independently of the portfolio-wide validation workflow, which
# only checks published pages and does not run venture unit tests.
#
# Added because `platform/ci/validate_workflows.py` went red on `main` when the
# venture merged (#3856) with no workflow filtering on its path: its three test
# files ran only on a contributor's machine.
on:
  pull_request:
    paths:
      - "ventures/npm-lifecycle-script-check/**"
      - ".github/workflows/npm-lifecycle-script-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/npm-lifecycle-script-check/**"
      - ".github/workflows/npm-lifecycle-script-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-lifecycle-script-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/npm-lifecycle-script-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run classifier tests (the engine both surfaces share)
        run: node --test engine.test.mjs
      - name: Run CLI tests (argument handling, exit codes, output)
        run: node --test cli.test.mjs
      - name: Run page tests (disclaimers, SEO metadata, sitemap coverage)
        run: node --test page.test.mjs
