name: hetzner-gitops CI

# Validate the IaC + GitOps tree. Never tofu apply. Never start a Codex
# Job. HETZNERREADAPIKEY (Read token) is probed via empty POST /servers.
# SSH preflight is workflow_dispatch only and uses HETZNERSSHKEY.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "bootstrap/**"
      - "gitops/**"
      # test_site_usage.py builds a real site with this and asserts the usage
      # aggregator can still parse the URLs it emits. A layout change here is
      # exactly the regression that gate exists for, so it has to trigger it.
      - "platform/pages/build.mjs"
      # test_manifests.py::test_portfolio_site_build_uses_flags_the_build_
      # scripts_accept reads this file's own text to confirm it still parses
      # the `--dist=` flag portfolio-site.yaml's build script passes it —
      # the same cross-check build.mjs gets above, and for the same reason: a
      # renamed flag would crash-loop the site the moment the owner seals the
      # clone token. That check runs only when this workflow does, so a PR
      # touching check.mjs alone has to trigger it too.
      - "platform/pages/check.mjs"
      # The apex front door. `gitops/prod/front-door/index.html` is generated
      # from these two by `platform/marketing/front-door.mjs`, and
      # `front-door.test.mjs` fails when the commit is stale — so a change to
      # the generator, or a new venture arriving in `launched.json` and moving
      # the tool count the page states, has to trigger this workflow even
      # though neither file is under `gitops/`.
      - "platform/marketing/**"
      - "platform/pages/launched.json"
      - ".sops.yaml"
      - ".github/workflows/hetzner-gitops-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - "bootstrap/**"
      - "gitops/**"
      - "platform/pages/build.mjs"
      - "platform/pages/check.mjs"
      - "platform/marketing/**"
      - "platform/pages/launched.json"
      - ".sops.yaml"
      - ".github/workflows/hetzner-gitops-ci.yml"
  workflow_dispatch:
    inputs:
      preflight:
        description: SSH to the two hel1 boxes (read-only). Uses HETZNERSSHKEY.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitops:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # test_site_usage.py runs platform/pages/build.mjs to check the usage
      # aggregator against real published URLs, and skips itself when node is
      # missing. GitHub's image happens to ship node; the self-hosted image
      # has no apt and no sudo, so nothing guarantees it there. Installing it
      # explicitly is what keeps that gate from silently skipping the day
      # CI_RUNNER flips to self-hosted.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps
        run: pip install -r gitops/tests/requirements.txt pyflakes
      # `test_front_door_serving.py` boots a real nginx over the front door's
      # own built ConfigMaps and fetches from it. That is the only check in the
      # tree that can tell whether the apex actually serves a tool page — the
      # rest read the config as text, and both ways the gz-only mirror could go
      # dark (`try_files` on an absent uncompressed name, a positional capture
      # in a `rewrite`) are textually clean. It skips with a reason when nginx
      # is missing, so this step is what stops it skipping here.
      #
      # `|| true` because the self-hosted image has no apt and no sudo (same
      # reason `setup-node` is explicit above). There the test skips, which is
      # the honest answer; `test_it_did_not_skip_on_the_runner_that_is_supposed
      # _to_run_it` fails if it ever skips on a *hosted* runner instead.
      - name: Install nginx
        run: sudo apt-get install -y --no-install-recommends nginx-light || true
      - name: pyflakes governor
        run: pyflakes gitops/agents/governor/governor.py
      - name: pytest
        run: pytest gitops/tests -v
      # The generator behind `gitops/prod/front-door/index.html`. Run here
      # rather than in portfolio-pages.yml because the page it produces is a
      # GitOps input, not part of the Pages artifact — and because this is the
      # workflow that already triggers on the directory it lands in.
      - name: front door generator
        run: node --test "platform/marketing/*.test.mjs"
      - name: infra layout
        run: |
          python3 infra/tests/test_infra_layout.py
          python3 infra/tests/test_hcloud_scope.py
      - name: kustomize build
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          kustomize build gitops/apps >/tmp/apps.yaml
          kustomize build gitops/platform >/tmp/platform.yaml
          kustomize build gitops/prod >/tmp/prod.yaml
          kustomize build gitops/staging >/tmp/staging.yaml
          kustomize build gitops/agents >/tmp/agents.yaml
          kustomize build gitops/ci >/tmp/ci.yaml
          python3 -c "import yaml; [list(yaml.safe_load_all(open(p))) for p in ['/tmp/apps.yaml','/tmp/platform.yaml','/tmp/prod.yaml','/tmp/staging.yaml','/tmp/agents.yaml','/tmp/ci.yaml']]"
      # Parsing as YAML only proves it is YAML. This proves the manifests are
      # things Kubernetes would actually accept: right field names, right
      # types, no typo'd key silently ignored on apply. -strict rejects
      # unknown fields, which is the class this catches — a misspelled
      # `readOnlyRootFilesystem` parses fine and protects nothing.
      # CRDs (Argo Applications, cert-manager ClusterIssuers) have no schema
      # here and are skipped rather than failed.
      - name: kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          kubeconform -strict -summary -verbose \
            -kubernetes-version 1.31.0 -ignore-missing-schemas \
            /tmp/apps.yaml /tmp/platform.yaml /tmp/prod.yaml /tmp/staging.yaml /tmp/agents.yaml /tmp/ci.yaml

  tofu:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - name: fmt and validate
        working-directory: infra
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate

  scripts:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # shellcheck-py ships the real shellcheck binary as a wheel. apt-get
      # would need sudo and a package index, and the self-hosted runner image
      # has neither -- this installs the same tool on either runner.
      - name: shellcheck
        run: |
          pip install shellcheck-py
          shellcheck bootstrap/install-k3s-server.sh \
            bootstrap/install-k3s-agent.sh \
            bootstrap/install-argocd.sh \
            bootstrap/preflight.sh \
            bootstrap/label-existing.sh \
            bootstrap/scripts/gen-age-key.sh \
            bootstrap/scripts/seal-owner-secrets.sh \
            infra/scripts/discover.sh \
            infra/scripts/assert_hcloud_read_only.sh \
            gitops/agents/workers/worker.sh \
            gitops/ci/runner-entrypoint.sh

  hcloud-scope:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prove HETZNERREADAPIKEY is Read-only
        env:
          HCLOUD_TOKEN: ${{ secrets.HETZNERREADAPIKEY }}
        run: |
          if [ -z "${HCLOUD_TOKEN}" ]; then
            echo "HETZNERREADAPIKEY unset — skip. A Read token belongs here; a Write token does not."
            exit 0
          fi
          infra/scripts/assert_hcloud_read_only.sh

  preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.preflight == true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH preflight (read-only)
        env:
          HETZNERSSHKEY: ${{ secrets.HETZNERSSHKEY }}
        run: |
          set -euo pipefail
          KEY="${HETZNERSSHKEY:-}"
          if [ -z "${KEY}" ]; then
            echo "HETZNERSSHKEY is unset." >&2
            exit 1
          fi
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/id_hetzner"
          chmod 600 "${HOME}/.ssh/id_hetzner"
          ssh-keygen -y -f "${HOME}/.ssh/id_hetzner" >/dev/null
          eval "$(ssh-agent -s)"
          ssh-add "${HOME}/.ssh/id_hetzner"
          ssh-keyscan -H 89.167.29.39 157.180.80.188 >> "${HOME}/.ssh/known_hosts"
          export CP=root@89.167.29.39 AG=root@157.180.80.188
          bootstrap/preflight.sh
