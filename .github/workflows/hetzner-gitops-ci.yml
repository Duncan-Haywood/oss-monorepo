name: hetzner-gitops CI

# Validate the IaC + GitOps tree. Never tofu apply. Never call Hetzner.
# Never start a Codex Job.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "bootstrap/**"
      - "gitops/**"
      - ".sops.yaml"
      - ".github/workflows/hetzner-gitops-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - "bootstrap/**"
      - "gitops/**"
      - ".sops.yaml"
      - ".github/workflows/hetzner-gitops-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r gitops/tests/requirements.txt pyflakes
      - name: pyflakes governor
        run: pyflakes gitops/agents/governor/governor.py
      - name: pytest
        run: pytest gitops/tests -v
      - name: infra layout
        run: python3 infra/tests/test_infra_layout.py
      - name: kustomize build
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz | tar -xz
          sudo mv kustomize /usr/local/bin/
          kustomize build gitops/apps >/tmp/apps.yaml
          kustomize build gitops/platform >/tmp/platform.yaml
          kustomize build gitops/prod >/tmp/prod.yaml
          kustomize build gitops/staging >/tmp/staging.yaml
          kustomize build gitops/agents >/tmp/agents.yaml
          python3 -c "import yaml; [list(yaml.safe_load_all(open(p))) for p in ['/tmp/apps.yaml','/tmp/platform.yaml','/tmp/prod.yaml','/tmp/staging.yaml','/tmp/agents.yaml']]"

  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - name: fmt and validate
        working-directory: infra
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck bootstrap/install-k3s-server.sh \
            bootstrap/install-k3s-agent.sh \
            bootstrap/install-argocd.sh \
            bootstrap/scripts/gen-age-key.sh \
            infra/scripts/discover.sh \
            gitops/agents/workers/worker.sh
