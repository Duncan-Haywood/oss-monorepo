name: hetzner-gitops CI

# Validate the IaC + GitOps tree. Never tofu apply. Never start a Codex
# Job. An optional HCLOUD_TOKEN is probed as Read-only (empty POST
# /servers). SSH preflight is workflow_dispatch only.

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "bootstrap/**"
      - "gitops/**"
      - ".sops.yaml"
      - ".github/workflows/hetzner-gitops-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - "bootstrap/**"
      - "gitops/**"
      - ".sops.yaml"
      - ".github/workflows/hetzner-gitops-ci.yml"
  workflow_dispatch:
    inputs:
      preflight:
        description: SSH to the two hel1 boxes (read-only). Uses HETZNER_SSH_PRIVATE_KEY or SSH_PRIVATE_KEY.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install -r gitops/tests/requirements.txt pyflakes
      - name: pyflakes governor
        run: pyflakes gitops/agents/governor/governor.py
      - name: pytest
        run: pytest gitops/tests -v
      - name: infra layout
        run: |
          python3 infra/tests/test_infra_layout.py
          python3 infra/tests/test_hcloud_scope.py
      - name: kustomize build
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz | tar -xz
          sudo mv kustomize /usr/local/bin/
          kustomize build gitops/apps >/tmp/apps.yaml
          kustomize build gitops/platform >/tmp/platform.yaml
          kustomize build gitops/prod >/tmp/prod.yaml
          kustomize build gitops/staging >/tmp/staging.yaml
          kustomize build gitops/agents >/tmp/agents.yaml
          python3 -c "import yaml; [list(yaml.safe_load_all(open(p))) for p in ['/tmp/apps.yaml','/tmp/platform.yaml','/tmp/prod.yaml','/tmp/staging.yaml','/tmp/agents.yaml']]"

  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - name: fmt and validate
        working-directory: infra
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck bootstrap/install-k3s-server.sh \
            bootstrap/install-k3s-agent.sh \
            bootstrap/install-argocd.sh \
            bootstrap/preflight.sh \
            bootstrap/label-existing.sh \
            bootstrap/scripts/gen-age-key.sh \
            infra/scripts/discover.sh \
            infra/scripts/assert_hcloud_read_only.sh \
            gitops/agents/workers/worker.sh

  hcloud-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove HCLOUD_TOKEN is Read-only when present
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          if [ -z "${HCLOUD_TOKEN}" ]; then
            echo "HCLOUD_TOKEN secret unset — skip. A Read token is optional; a Write token is not allowed."
            exit 0
          fi
          infra/scripts/assert_hcloud_read_only.sh

  preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.preflight == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH preflight (read-only)
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY="${HETZNER_SSH_PRIVATE_KEY:-${SSH_PRIVATE_KEY:-}}"
          if [ -z "${KEY}" ]; then
            echo "No private key in HETZNER_SSH_PRIVATE_KEY or SSH_PRIVATE_KEY." >&2
            echo "The key already in Actions secrets needs one of those names as an alias." >&2
            exit 1
          fi
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/id_hetzner"
          chmod 600 "${HOME}/.ssh/id_hetzner"
          ssh-keygen -y -f "${HOME}/.ssh/id_hetzner" >/dev/null
          eval "$(ssh-agent -s)"
          ssh-add "${HOME}/.ssh/id_hetzner"
          ssh-keyscan -H 89.167.29.39 157.180.80.188 >> "${HOME}/.ssh/known_hosts"
          export CP=root@89.167.29.39 AG=root@157.180.80.188
          bootstrap/preflight.sh
