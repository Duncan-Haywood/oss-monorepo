# Deploys platform/edge (the Cloudflare Worker behind the site's feedback form
# and page-view counts) on the free plan. Off until the owner sets
# vars.EDGE_DEPLOY_ENABLED to 'true' and adds the secrets platform/edge/README.md
# lists. Free plan: going over a daily limit fails requests, never bills.
name: edge-deploy
on:
  push:
    branches: [main]
    paths:
      - 'platform/edge/**'
      - '!platform/edge/site.json'
      - 'platform/counter/core.mjs'
      - '.github/workflows/edge-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ vars.EDGE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.145.0
      DB_NAME: monorepo-projects-edge
    defaults:
      run:
        working-directory: platform/edge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test worker.test.mjs
      - name: Find or create the D1 database
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.env.DB_NAME);process.stdout.write(db?db.uuid:"")})')
          if [ -z "$id" ]; then
            $WRANGLER d1 create "$DB_NAME"
            id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.env.DB_NAME);process.stdout.write(db?db.uuid:"")})')
          fi
          test -n "$id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Apply the schema (idempotent)
        run: $WRANGLER d1 execute "$DB_NAME" --remote --file schema.sql
      - name: Deploy
        run: $WRANGLER deploy
