# Deploys platform/edge (the Cloudflare Worker behind the site's feedback form
# and page-view counts) on the free plan. Does nothing until the repository
# variable CLOUDFLARE_ACCOUNT_ID is set; the deploy job then mints a 30-minute
# token from CLOUDFLARE_MINTER_TOKEN (platform/ci/cloudflare_mint, profile
# edge-deploy). See platform/edge/README.md. Free plan: going over a daily limit fails
# requests, never bills.
name: edge-deploy
on:
  push:
    branches: [main]
    paths:
      - 'platform/edge/**'
      - '!platform/edge/site.json'
      - 'platform/counter/core.mjs'
      - '.github/workflows/edge-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: edge-deploy
  cancel-in-progress: false
jobs:
  # A job-level `if:` cannot read secrets, so a first job reports whether the
  # Cloudflare ones exist; without them the deploy is skipped, not failed.
  gate:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          # The account-id variable is the switch: set once the minter secret is in
          # place (platform/ci/cloudflare_mint/README.md, owner setup).
          CONFIGURED: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CONFIGURED" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not set; skipping the deploy."
          fi
  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.ready == 'true' }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # The minter secret lives in this environment, limited to main.
    environment: cloudflare
    env:
      DB_NAME: monorepo-projects-edge
    defaults:
      run:
        working-directory: platform/edge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install wrangler (pinned)
        run: npm install --global wrangler@4.145.0
      - name: Test
        run: node --test worker.test.mjs
      # A token for this job only, gone when it ends (platform/ci/cloudflare_mint).
      - name: Short-lived Cloudflare token
        uses: ./platform/ci/cloudflare_mint
        with:
          minter_token: ${{ secrets.CLOUDFLARE_MINTER_TOKEN }}
          account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          profile: edge-deploy
      - name: Find or create the D1 database
        run: |
          id=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.env.DB_NAME);process.stdout.write(db?db.uuid:"")})')
          if [ -z "$id" ]; then
            wrangler d1 create "$DB_NAME"
            id=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.env.DB_NAME);process.stdout.write(db?db.uuid:"")})')
          fi
          test -n "$id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Apply the schema (idempotent)
        run: wrangler d1 execute "$DB_NAME" --remote --file schema.sql
      - name: Deploy
        run: wrangler deploy
