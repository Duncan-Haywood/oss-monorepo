name: android-data-safety-check CI

# The venture is a static, browser-local checker plus a Node CLI: plain ES
# modules run with node's built-in test runner, no package.json, no
# dependencies, no network. scan.mjs is the shared permission/SDK-to-category
# detector and cross-checker, check.mjs the CLI wrapper, and usage.mjs the
# anonymous local counter. Without this runner they could rot while the page
# still ships them.

on:
  pull_request:
    paths:
      - "ventures/android-data-safety-check/**"
      - ".github/workflows/android-data-safety-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/android-data-safety-check/**"
      - ".github/workflows/android-data-safety-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-data-safety-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/android-data-safety-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run module tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs android-data-safety-check
