name: carpet-install-bid-calculator CI

# Shipped in #1577 without a CI workflow, so its 31 tests ran only when a
# contributor remembered to run them locally — while the venture was already
# in the Portfolio Pages build. Added 2026-08-26, closing the last gap of this
# kind: every venture with an `index.html` now has a workflow.
#
# Static ES modules, no build step, no dependencies: this does no more than a
# contributor runs locally. It publishes nothing and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/carpet-install-bid-calculator/**"
      - ".github/workflows/carpet-install-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/carpet-install-bid-calculator/**"
      - ".github/workflows/carpet-install-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carpet-install-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/carpet-install-bid-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
