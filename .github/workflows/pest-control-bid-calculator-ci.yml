name: pest-control-bid-calculator CI

# Test runner for the browser-local pest control bid calculator. The product
# is static ES modules with no build step and no dependencies, so this does
# no more than a contributor runs locally: `node --test`. It publishes
# nothing, registers nothing, and spends no API budget — it is not the
# unattended-automation kind of workflow CLAUDE.md gates.
#
# Same shape as janitorial-bid-calculator-ci.yml.

on:
  pull_request:
    paths:
      - "ventures/pest-control-bid-calculator/**"
      - ".github/workflows/pest-control-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/pest-control-bid-calculator/**"
      - ".github/workflows/pest-control-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: pest-control-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ventures/pest-control-bid-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page. Checked here so the venture that needs the clause is the one that
      # goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs pest-control-bid-calculator
