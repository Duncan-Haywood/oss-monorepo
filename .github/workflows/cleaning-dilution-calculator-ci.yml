name: cleaning-dilution-calculator CI

# Dependency-free browser calculator. Keep user-visible arithmetic covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/cleaning-dilution-calculator/**"
      - ".github/workflows/cleaning-dilution-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/cleaning-dilution-calculator/**"
      - ".github/workflows/cleaning-dilution-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleaning-dilution-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/cleaning-dilution-calculator

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs cleaning-dilution-calculator
