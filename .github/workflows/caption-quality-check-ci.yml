name: caption-quality-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared parsing and
# classification logic (no I/O, no network); `check.mjs` is the CLI entry
# point that reads a local .srt/.vtt file; `usage.mjs` is the opt-out-capable
# local usage counter; `page.test.mjs` covers the page's structure and
# disclaimers. Keep all four covered independently of the portfolio-wide
# validation workflow, which only checks published pages and does not run
# venture unit tests. Without this file, `validate_workflows.py` would fail
# the moment the venture's `*.test.mjs` files land -- the same hole
# `redirect-chain-check-ci.yml`, `hreflang-reciprocity-check-ci.yml` and
# `sitemap-lastmod-freshness-check-ci.yml` already document.
on:
  pull_request:
    paths:
      - "ventures/caption-quality-check/**"
      - ".github/workflows/caption-quality-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/caption-quality-check/**"
      - ".github/workflows/caption-quality-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caption-quality-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/caption-quality-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, usage, and page-wiring tests
        run: node --test engine.test.mjs check.test.mjs usage.test.mjs page.test.mjs
