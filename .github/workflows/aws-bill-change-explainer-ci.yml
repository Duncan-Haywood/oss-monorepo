name: aws-bill-change-explainer CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared bill-comparison
# engine, `cli.mjs` is the Node gate, and `page.test.mjs` covers the page
# wiring. Keep all three covered independently of the portfolio-wide
# validation workflow, which only checks published pages and does not run
# venture unit tests. Without this file, `validate_workflows.py` would fail
# the moment the venture's `*.test.mjs` files land -- the same hole
# `terraform-plan-secret-exposure-check-ci.yml` documents.
on:
  pull_request:
    paths:
      - "ventures/aws-bill-change-explainer/**"
      - ".github/workflows/aws-bill-change-explainer-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/aws-bill-change-explainer/**"
      - ".github/workflows/aws-bill-change-explainer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-bill-change-explainer-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/aws-bill-change-explainer

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
