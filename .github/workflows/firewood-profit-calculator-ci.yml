name: firewood-profit-calculator CI

# Zero-dependency browser tool: `engine.mjs` is the firewood profit math and
# `page.test.mjs` covers the page wiring and the guide's worked numbers.
# Without this file, `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `structured-data-drift-check-ci.yml` documents.
on:
  pull_request:
    paths:
      - "ventures/firewood-profit-calculator/**"
      - ".github/workflows/firewood-profit-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/firewood-profit-calculator/**"
      - ".github/workflows/firewood-profit-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firewood-profit-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/firewood-profit-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run engine and page-wiring tests
        run: node --test engine.test.mjs page.test.mjs
