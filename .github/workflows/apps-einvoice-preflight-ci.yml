# Moved from Duncan-Haywood/private-monorepo .github/workflows/einvoice-preflight-ci.yml at cded6eaf5d8a (2026-11-26);
# actions pinned to .github/ci-policy.yaml SHAs, checkout without persisted credentials,
# the AWS CodeBuild runner switch replaced by this repository's vars.CI_RUNNER.
# PR checks for apps/einvoice-preflight: the imported checker's suite and the paid layer (pro/).
# No npm dependencies, so no install step (pro/ imports packages/billing's TypeScript through
# Node 22's type stripping); never needs secrets.
name: apps-einvoice-preflight-ci
on:
  pull_request:
    paths:
      - "apps/einvoice-preflight/**"
      - "apps/einvoice-site/content/pricing.mjs"
      - "packages/billing/**"
      - ".github/workflows/apps-einvoice-preflight-ci.yml"
  push:
    branches-ignore: [main]
    paths:
      - "apps/einvoice-preflight/**"
      - "apps/einvoice-site/content/pricing.mjs"
      - "packages/billing/**"
      - ".github/workflows/apps-einvoice-preflight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einvoice-preflight-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/einvoice-preflight

jobs:
  test:
    name: checker + paid layer tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Paid layer (fixes re-validate, explanations, API, tenant isolation)
        run: node --test pro/*.test.mjs
      - name: Imported checker suite
        run: node --test --test-concurrency=4 *.test.mjs
