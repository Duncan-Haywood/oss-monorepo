name: saints-by-candlelight CI

# Static podcast site: plain ES modules, node --test, no package.json,
# no dependencies, no network.
# episodes.mjs renders pages, feed and sitemap from the scripts (and the
# tests fail if they are stale); usage.mjs is the anonymous local counter.

on:
  pull_request:
    paths:
      - "ventures/saints-by-candlelight/**"
      - ".github/workflows/saints-by-candlelight-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/saints-by-candlelight/**"
      - ".github/workflows/saints-by-candlelight-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saints-by-candlelight-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/saints-by-candlelight

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- checked here so the venture that needs the
      # clause is the one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs saints-by-candlelight
