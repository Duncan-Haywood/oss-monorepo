name: Doc references

# Fails a pull request that leaves a dead pointer in the Markdown the agents
# are routed by: a `[text](path)` link (check_md_links.py) or a backticked repo
# path (check_code_refs.py). Both were written as local-only checks, so a moved
# file went unnoticed until a run failed to read it. Reads tracked files only;
# publishes nothing, pushes nothing, calls no paid API.

on:
  pull_request:
    paths: ["**/*.md", "platform/ci/check_md_links.py", "platform/ci/check_code_refs.py", ".github/workflows/doc-refs-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Both guards read Markdown and the scripts; link targets are checked
          # against `git ls-files`, so absent PNG/MP3 blobs still count as present.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.md
            /platform/ci/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Dead Markdown links
        run: python3 platform/ci/check_md_links.py

      - name: Dead backticked repo paths
        run: python3 platform/ci/check_code_refs.py

      - name: Guard unit tests
        working-directory: platform/ci
        run: python3 -m unittest test_check_md_links test_check_code_refs
