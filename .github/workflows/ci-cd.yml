name: Monorepo Production & Staging CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow || 'ci' }}-${{ github.ref || 'ref' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-monorepo:
    name: Universal CI Verification (Security, Typecheck, Lint, Tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c3800040652e742e88a38b1f # v4.1.0
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@a268e37604f358ed4a7428807d4b47eb02e1c953 # v5.3.0
        with:
          python-version: "3.11"

      - name: Run Monorepo Universal Verification Suite
        run: |
          chmod +x scripts/verify-all.sh
          ./scripts/verify-all.sh

  build-and-push:
    name: Build & Push Container Images
    needs: verify-monorepo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49ed15265ed6fac70d2bbf0e227447d402d47435 # v3.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Pairwise Container
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ventures/quick-pick-survey
          file: ventures/quick-pick-survey/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/pairwise:${{ github.sha }}

      - name: Build & Push Homepage Container
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: portfolio/marisstella-homepage
          file: portfolio/marisstella-homepage/nginx.conf
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/marisstella-homepage:${{ github.sha }}
