name: node-version-drift-check CI

# Zero-dependency CLI + browser tool: cli.mjs and the browser page share one
# engine.mjs (no hand-ported second implementation to drift). Keep it covered
# independently of the portfolio-wide validation workflow, which only checks
# published pages and does not run venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/node-version-drift-check/**"
      - ".github/workflows/node-version-drift-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/node-version-drift-check/**"
      - ".github/workflows/node-version-drift-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-version-drift-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/node-version-drift-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI and page tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs node-version-drift-check
