name: gig-driver-net-pay-calculator CI

# Test runner for the browser-local gig driver net-pay calculator. The
# product is static ES modules with no build step and no dependencies, so
# this does no more than a contributor runs locally: `node --test`. It
# publishes nothing, registers nothing, and spends no API budget — it is not
# the unattended-automation kind of workflow CLAUDE.md gates.
#
# Same shape as owner-operator-cpm-calculator-ci.yml.

on:
  pull_request:
    paths:
      - "ventures/gig-driver-net-pay-calculator/**"
      - ".github/workflows/gig-driver-net-pay-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/gig-driver-net-pay-calculator/**"
      - ".github/workflows/gig-driver-net-pay-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: gig-driver-net-pay-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/gig-driver-net-pay-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs gig-driver-net-pay-calculator
