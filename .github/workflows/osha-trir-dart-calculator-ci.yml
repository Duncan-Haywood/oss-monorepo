name: osha-trir-dart-calculator CI

# Dependency-free browser tool: plain ES modules, no build step, so this runs
# exactly what a contributor runs locally (`node --test`) and nothing else. It
# publishes nothing, registers nothing, and spends no API budget.
#
# Every venture here gets its own workflow because the portfolio-wide
# workflows do not run venture unit tests: `portfolio-validate.yml` checks
# structure and markup, `proposal-module-ci.yml` runs only
# `ventures/*/proposal.test.mjs`, and nothing else executes `node --test`
# inside a venture. Without this file, `validate_workflows.py`'s
# `check_venture_tests_run` invariant fails the moment this venture's
# `*.test.mjs` files exist and no workflow runs them.
on:
  pull_request:
    paths:
      - "ventures/osha-trir-dart-calculator/**"
      - ".github/workflows/osha-trir-dart-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/osha-trir-dart-calculator/**"
      - ".github/workflows/osha-trir-dart-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osha-trir-dart-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/osha-trir-dart-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the venture's tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs osha-trir-dart-calculator
