# PR checks for apps/payapps (bet #1, moved from the private repository; task
# products-to-public-repo). Read-only and secret-free; the deploy is separate.
name: payapps-ci
on:
  pull_request:
    paths:
      - "apps/payapps/**"
      - "packages/billing/**"
      - "packages/lien-waivers/**"
      - "packages/qbo-sync/**"
      - "packages/admin-metrics/**"
      - "scripts/check-no-client-maps.mjs"
      - ".github/workflows/payapps-ci.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "biome.json"
      - "tsconfig.base.json"
  push:
    branches: [main]
    paths:
      - "apps/payapps/**"
      - "packages/billing/**"
      - "packages/lien-waivers/**"
      - "packages/qbo-sync/**"
      - "packages/admin-metrics/**"
      - ".github/workflows/payapps-ci.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payapps-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/payapps

jobs:
  check:
    name: payapps lint, types, tests, build, migrations
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            apps/payapps
            packages
            scripts
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:worker
      - run: pnpm build
      - name: No source maps in the public assets
        working-directory: .
        run: node scripts/check-no-client-maps.mjs apps/payapps/dist/client
      - name: deploy provisioning script
        working-directory: .
        run: node --test apps/payapps/scripts/provision.test.mjs
      - name: lien-waivers package (statutory text checked against its official snapshot)
        working-directory: packages/lien-waivers
        run: node --test "test/**/*.test.ts"
      - name: D1 migrations in sync with schema
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name drift-check
          if [[ -n "$(git status --porcelain migrations)" ]]; then
            echo "::error::Schema changed without a migration. Run 'pnpm db:generate' and commit it."
            git status --porcelain migrations
            exit 1
          fi
