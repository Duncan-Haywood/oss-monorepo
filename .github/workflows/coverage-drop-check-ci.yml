name: coverage-drop-check CI

# Zero-dependency CLI/browser tool: `check.py` is the canonical comparator and
# `compare.mjs` is the same logic reimplemented for the in-browser page, with
# `page.test.mjs` covering the page wiring on top. Keep all three covered
# independently of the portfolio-wide validation workflow, which only checks
# published pages and does not run venture unit tests.
#
# Added 2026-09-07, one merge after the venture graduated in #3649. Between the
# two, `validate_workflows.py` was red on `main` -- `compare.test.mjs` and
# `page.test.mjs` ran in no workflow at all, so 15 assertions guarding a live
# tool executed only on whichever contributor's machine last happened to type
# `node --test`. That is the "a guard nobody runs is worth less than no guard"
# defect CLAUDE.md records against `platform/proposal/`, `platform/privacy/`
# and the browser checks; the validator exists precisely so a venture cannot
# graduate into that state unnoticed, and here it worked.
on:
  pull_request:
    paths:
      - "ventures/coverage-drop-check/**"
      - ".github/workflows/coverage-drop-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/coverage-drop-check/**"
      - ".github/workflows/coverage-drop-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-drop-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/coverage-drop-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run comparator tests (Python — the canonical CLI)
        run: python3 -m unittest test_check -v
      - name: Run comparator tests (browser page logic)
        run: node --test compare.test.mjs
      - name: Run page-wiring tests
        run: node --test page.test.mjs
