name: aba-authorization-tracker CI

# Test runner for the browser-local aba-authorization-tracker.
# The product is static ES modules with no build step and no dependencies,
# so this does no more than a contributor runs locally: `node --test`. It
# publishes nothing, registers nothing, and spends no API budget -- it is
# not the unattended-automation kind of workflow CLAUDE.md gates.
#
# Same shape as tip-pool-compliance-calculator-ci.yml. It exists from the
# venture's first commit rather than after the fact: `platform/ci/validate_workflows.py`
# fails the moment a venture carries `*.test.mjs` that no workflow filters on,
# because portfolio-validate.yml does not run venture unit tests and an unrun
# suite is worth less than no suite.

on:
  pull_request:
    paths:
      - "ventures/aba-authorization-tracker/**"
      - ".github/workflows/aba-authorization-tracker-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/aba-authorization-tracker/**"
      - ".github/workflows/aba-authorization-tracker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: aba-authorization-tracker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/aba-authorization-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. Checked here so
      # the venture that needs the clause is the one that goes red, before the
      # merge, rather than the Pages job on main after it.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs aba-authorization-tracker
