name: agent-permission-harness CI

# Test coverage for the agent-permission-harness probe under
# portfolio/pipeline/probes/agent-permission-harness/. Standard-library
# unittest plus PyYAML, no network calls at all: the probe reads
# .github/workflows and .github/prompts out of the checkout and derives
# everything from them. It publishes nothing, registers nothing and spends no
# API budget — a test runner, not the unattended-automation kind of workflow
# CLAUDE.md gates.
#
# Matching the runners the sibling probes already have (eaa-wcag-triage,
# npm-reachability-triage, source-silence-detector).
#
# This one has a trigger the siblings do not need, and it is the reason the
# workflow is worth having. The probe's subject *is* .github/workflows, so its
# README's numbers are claims about the very directory this file lives in:
#
#   1. R3 — the canonical GitHub Actions script-injection class — finds zero
#      here, which is why the README's headline is R7 rather than R3.
#   2. Nothing the probe finds requires a running agent; all 7 findings are
#      decided from the artifact.
#   3. R1, R2 and R4 now find nothing. R1/R2 were the fleet workflow, and both
#      were fixed rather than re-stated: the guarded call to the never-present
#      .github/scripts/prepare-agent-prompt.sh is gone (the fallback it always
#      took is now the only path), and the prompt no longer rides into
#      $GITHUB_OUTPUT behind a fixed delimiter. R4's three third-party
#      actions receiving deploy secrets on mutable tags are now pinned to
#      commit SHAs.
#   4. The agent's instruction closure is still an order of magnitude larger
#      than the one prompt file handed to it, is strictly larger than its own
#      first hop, and still reaches files the prompt never names. The closure
#      became transitive on 2026-08-23; before that it measured one hop while
#      the rule's prose claimed a fixed point, so what it walks through is now
#      pinned rather than described.
#
# All four are asserted in TestHeadlineNumbersAgainstThisRepo. Any edit to a
# workflow file, or to the agent prompt, can invalidate them — so both paths
# are triggers here. Without that, adding the very script R1 reports as missing
# would leave the README stating a finding that had been fixed, with nothing
# red to say so.

# The trigger below is wider than the probe's own inputs, and 2026-08-24 is why.
# R7's committed number is a function of the repository's *prose*, not of this
# directory: a document in the closure that names a new path enlarges the
# measurement. #699 added a row to portfolio/research/README.md mentioning
# `package.json` in passing, two research package.json files entered the closure
# at depth 3, and the committed results file read as current while being wrong —
# because none of the four paths this workflow used to watch had changed. It
# surfaced only when an unrelated pull request added a workflow file and tripped
# the trigger by accident.
#
# The prose roots below are the documents the closure actually walks through
# (see instruction_closure's CLOSURE_WALKABLE_SUFFIXES). This is still an
# approximation of "any prose in this repository" — a path named from a document
# outside these roots would slip through the same way — and it is written down
# rather than assumed away.
on:
  pull_request:
    paths:
      - "portfolio/pipeline/probes/agent-permission-harness/**"
      - ".github/workflows/**"
      - ".github/prompts/**"
      - ".github/scripts/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "IMPROVEMENT-PLAN.md"
      - "README.md"
      - "PRODUCT_PLAYBOOK.md"
      - "DEVELOPMENT_QUALITY.md"
      - "portfolio/**"
      - "ventures/**/AGENTS.md"
      - "ventures/**/VENTURE.yaml"
  push:
    branches: [main]
    paths:
      - "portfolio/pipeline/probes/agent-permission-harness/**"
      - ".github/workflows/**"
      - ".github/prompts/**"
      - ".github/scripts/**"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "IMPROVEMENT-PLAN.md"
      - "README.md"
      - "PRODUCT_PLAYBOOK.md"
      - "DEVELOPMENT_QUALITY.md"
      - "portfolio/**"
      - "ventures/**/AGENTS.md"
      - "ventures/**/VENTURE.yaml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: agent-permission-harness-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/pipeline/probes/agent-permission-harness

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Default checkout on a pull_request event fetches the ephemeral
      # merge-with-base preview, not the PR's own tree. In a repo where main
      # is pushed to continuously, that preview drifts underneath a single PR
      # commit as unrelated PRs land, making the closure count computed here
      # nondeterministic per re-run even though this probe reads only the
      # checked-out tree. Pinning to the PR's actual head SHA (falling back to
      # github.sha on push/workflow_dispatch, where head_sha is unset) makes
      # the result a pure function of the commit under test.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install -r ../../../router/requirements.txt
      - run: python3 -m unittest discover -p 'test_*.py'
      # Both documented invocations must keep working. The JSON path is what a
      # future consumer would read, and it is the one a rendering-only change
      # can break without any test noticing.
      - run: python3 harness.py
      - run: python3 harness.py --json
      # A workflow edit that changes the permission posture should fail here
      # rather than leave a document quietly describing a repository that no
      # longer exists.
      #
      # This used to diff the rendered markdown of `results-2026-08-23.md`.
      # That check could not hold: R7's prose quotes the size of the
      # repository's documentation closure, so *any* commit that added a
      # markdown file to that closure -- a venture write-up, a candidate
      # write-up -- changed the rendered text and turned this step red on every
      # open PR at once, while the permission posture it exists to guard was
      # untouched. Regenerating the snapshot only moved the number, and the next
      # merge invalidated it again; the repository burned several PRs a day on
      # that loop. The fingerprint compares the findings themselves -- rule,
      # severity, workflow, job, writer set, privilege, replay visibility --
      # which move only when a workflow does.
      - name: Workflow permission posture is unchanged
        run: python3 harness.py --check-fingerprint findings-fingerprint.json
