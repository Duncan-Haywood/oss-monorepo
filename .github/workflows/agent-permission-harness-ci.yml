name: agent-permission-harness CI

# Test coverage for the agent-permission-harness probe under
# portfolio/pipeline/probes/agent-permission-harness/. Standard-library
# unittest plus PyYAML, no network calls at all: the probe reads
# .github/workflows and .github/prompts out of the checkout and derives
# everything from them. It publishes nothing, registers nothing and spends no
# API budget — a test runner, not the unattended-automation kind of workflow
# CLAUDE.md gates.
#
# Matching the runners the sibling probes already have (eaa-wcag-triage,
# npm-reachability-triage, source-silence-detector).
#
# This one has a trigger the siblings do not need, and it is the reason the
# workflow is worth having. The probe's subject *is* .github/workflows, so its
# README's numbers are claims about the very directory this file lives in:
#
#   1. R3 — the canonical GitHub Actions script-injection class — finds zero
#      here, which is why the README's headline is R7 rather than R3.
#   2. Nothing the probe finds requires a running agent; all 13 findings are
#      decided from the artifact.
#   3. .github/scripts/prepare-agent-prompt.sh is still absent, so the agent
#      fleet's prompt is assembled by the fallback path rather than the script
#      the workflow appears to call.
#   4. The agent's instruction closure is still an order of magnitude larger
#      than the one prompt file handed to it.
#
# All four are asserted in TestHeadlineNumbersAgainstThisRepo. Any edit to a
# workflow file, or to the agent prompt, can invalidate them — so both paths
# are triggers here. Without that, adding the very script R1 reports as missing
# would leave the README stating a finding that had been fixed, with nothing
# red to say so.

on:
  pull_request:
    paths:
      - "portfolio/pipeline/probes/agent-permission-harness/**"
      - ".github/workflows/**"
      - ".github/prompts/**"
      - ".github/scripts/**"
  push:
    branches: [main]
    paths:
      - "portfolio/pipeline/probes/agent-permission-harness/**"
      - ".github/workflows/**"
      - ".github/prompts/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: agent-permission-harness-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/pipeline/probes/agent-permission-harness

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install -r ../../../router/requirements.txt
      - run: python3 -m unittest discover -p 'test_*.py'
      # Both documented invocations must keep working. The JSON path is what a
      # future consumer would read, and it is the one a rendering-only change
      # can break without any test noticing.
      - run: python3 harness.py
      - run: python3 harness.py --json
      # The committed results file must match what the probe produces against
      # this checkout. A workflow edit that changes a finding should either
      # update the file or fail here; a stale results file that still reads as
      # a measurement is the exact failure mode this repository keeps hitting.
      - name: Committed results file is current
        run: |
          { echo "<!-- Generated by harness.py against main. Regenerate: python3 harness.py > results-2026-08-21.md -->"; echo; python3 harness.py; } > /tmp/regenerated.md
          diff -u results-2026-08-21.md /tmp/regenerated.md
