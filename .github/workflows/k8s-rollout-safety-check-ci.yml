name: k8s-rollout-safety-check CI

# Zero-dependency CLI/browser tool: `yaml.mjs` is a small YAML *subset* reader
# written here rather than pulled from npm; `engine.mjs` holds every check and
# is imported by both the CLI and the page, so the two can never disagree about
# a verdict; `check.mjs` is the CLI entry point; `page.test.mjs` covers all
# three pages' structure, disclaimers and FAQ/JSON-LD agreement. Keep all four
# covered independently of the portfolio-wide validation workflow, which only
# checks published pages and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's `*.test.mjs`
# files land -- the same hole `redirect-chain-check-ci.yml`,
# `sitemap-lastmod-freshness-check-ci.yml` and `cors-misconfig-check-ci.yml`
# already document.
#
# The YAML reader is the part most worth running on every change. It is the
# one component whose bugs are silent: a manifest it mis-parses produces a
# confident *wrong* verdict about whether a rollout drops traffic, which is
# worse than no answer. Its first draft rejected two of this repository's own
# production manifests over a cron string and a shell `&&`; `yaml.test.mjs`
# pins both cases.
on:
  pull_request:
    paths:
      - "ventures/k8s-rollout-safety-check/**"
      - ".github/workflows/k8s-rollout-safety-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/k8s-rollout-safety-check/**"
      - ".github/workflows/k8s-rollout-safety-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k8s-rollout-safety-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/k8s-rollout-safety-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run YAML reader, engine, CLI, and page-wiring tests
        run: node --test yaml.test.mjs engine.test.mjs check.test.mjs page.test.mjs
