name: consent-change-record CI

on:
  pull_request:
    paths:
      - "ventures/consent-change-record/**"
      - ".github/workflows/consent-change-record-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/consent-change-record/**"
      - ".github/workflows/consent-change-record-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/consent-change-record/tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
