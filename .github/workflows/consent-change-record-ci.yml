name: consent-change-record CI

# Dependency-free browser comparator. Keep user-visible diffs covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/consent-change-record/**"
      - ".github/workflows/consent-change-record-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/consent-change-record/**"
      - ".github/workflows/consent-change-record-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consent-change-record-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/consent-change-record

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run comparator tests
        run: node --test
      - name: Run HAR-diff tool tests
        working-directory: ventures/consent-change-record/tool
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs consent-change-record
