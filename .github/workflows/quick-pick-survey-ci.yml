name: CI

on:
  push:
    branches: [main]
    paths:
      - "ventures/quick-pick-survey/**"
      - ".github/workflows/quick-pick-survey-ci.yml"
  pull_request:
    paths:
      - "ventures/quick-pick-survey/**"
      - ".github/workflows/quick-pick-survey-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: quick-pick-survey-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/quick-pick-survey

jobs:
  verify:
    # NOT the CI_RUNNER switch (see gitops/README.md and gitops/ci/README.md).
    # `services:` needs a Docker daemon to run postgres:16 alongside the job,
    # and the self-hosted runner pod (gitops/ci/runner.yaml) has none: no
    # docker.sock mount, no DinD sidecar, and its securityContext sets
    # allowPrivilegeEscalation: false and capabilities.drop: ["ALL"], which
    # rules out running one inside that pod too. Once an owner flips
    # CI_RUNNER to self-hosted, a job that read the switch here would not
    # fail with the runner-starvation signature (runner_id: 0) -- it would
    # register on a real runner and then fail to reach 127.0.0.1:5432 in
    # Integration tests, which reads as a new, unrelated break. Staying on
    # ubuntu-latest keeps this job on Docker-capable GitHub-hosted runners
    # regardless of the switch. gitops/tests/test_ci_runner.py pins this as a
    # named exception.
    runs-on: ubuntu-latest
    env:
      # The build only needs these to be present and well-formed — nothing is
      # queried at build time. Real credentials live in the deploy environment.
      POSTGRES_PRISMA_URL: postgresql://postgres@127.0.0.1:5432/ci?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://postgres@127.0.0.1:5432/ci?schema=public
      ADMIN_KEY: ci-placeholder
      ADMIN_SESSION_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - run: npm ci

      # Run the gates individually rather than through `npm run verify`, so a
      # failure names the gate that failed instead of one opaque red step.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The routes against the service container above. Kept after the build
      # so an environment failure here can't be mistaken for a code failure in
      # the fast gates.
      - name: Integration tests
        run: |
          # A database of its own: the migration-parity step below uses
          # `shadow` as a scratch database and drops objects in it.
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d shadow \
            -c "CREATE DATABASE integration"
          npx prisma migrate deploy
          npx prisma db seed
          npm run test:integration
        env:
          POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:5432/integration?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/integration?schema=public
          # The job-level ADMIN_KEY above is a placeholder for the build/lint
          # steps, which only need it present and well-formed. This step's
          # tests actually authenticate against it, so it needs the real
          # value `src/test/integration/env.ts` expects — that file's
          # `??=` only fills in a default when nothing is already set, and
          # the job-level placeholder would otherwise win and desync from
          # what the tests send.
          ADMIN_KEY: integration-admin-key
          ADMIN_SESSION_SECRET: integration-session-secret

      # A schema edit with no migration behind it deploys cleanly and then
      # fails on the first query, so it is worth catching here even though it
      # needs a database to compare against.
      - name: Migrations match the schema
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shadow

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
