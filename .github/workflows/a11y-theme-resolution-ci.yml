name: a11y-theme-resolution CI

# Test coverage for the theme resolver under
# portfolio/research/a11y-theme-resolution/. It is standard-library-only and its
# suite needs no network, so this workflow does no more than a contributor runs
# locally: run the tests. It publishes nothing, registers nothing, and spends no
# API budget — it is a test runner, not the unattended-automation kind of
# workflow CLAUDE.md gates. Same shape as its two siblings
# (a11y-evidence-record-ci.yml, a11y-render-recovery-ci.yml).
#
# The load-bearing invariant here is faithfulness of the population: this pass
# resolves exactly the 248 theme-recoverable undecidables a11y-render-recovery
# classified, and TestPopulationFaithfulness asserts the committed rows still
# agree with that directory's committed rows, package by package. If an edit to
# either side silently changes which elements are in scope, every share in the
# write-up moves without the diff showing it — which is the regression that must
# not reach main unseen, because the top candidate's build-step economics rest
# on those shares.
#
# The sibling paths are watched too: this suite imports audit.py and classify.py
# directly, so a change to either can break it without touching this directory.

on:
  pull_request:
    paths:
      - "portfolio/research/a11y-theme-resolution/**"
      - "portfolio/research/a11y-render-recovery/**"
      - "portfolio/research/a11y-evidence-record/**"
      - ".github/workflows/a11y-theme-resolution-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/a11y-theme-resolution/**"
      - "portfolio/research/a11y-render-recovery/**"
      - "portfolio/research/a11y-evidence-record/**"
      - ".github/workflows/a11y-theme-resolution-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: a11y-theme-resolution-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/a11y-theme-resolution

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install step, by design.
      - run: python3 -m unittest discover -p 'test_*.py'
      # The committed `summary` is exactly summarise(packages), so it must
      # re-derive from the committed rows with no network. Until 2026-08-24 this
      # step derived the summary, printed it, and returned 0 without ever
      # comparing it to the stored one — unfailable, while this comment called it
      # the check that catches a hand-edited number. It now exits 1 naming each
      # field that disagrees.
      - run: python3 resolve.py --recompute-from results-2026-08-20.json
