name: quote-margin-check CI

on:
  pull_request:
    paths:
      - "ventures/quote-margin-check/**"
      - ".github/workflows/quote-margin-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/quote-margin-check/**"
      - ".github/workflows/quote-margin-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quote-margin-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/quote-margin-check

jobs:
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  cli-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.8
      - run: ruff check .

  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/quote-margin-check/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
