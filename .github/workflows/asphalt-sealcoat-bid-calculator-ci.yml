name: asphalt-sealcoat-bid-calculator CI

# Test runner for the browser-local sealcoating bid calculator. The product
# is static ES modules with no build step and no dependencies, so this does
# no more than a contributor runs locally: `node --test`. It publishes
# nothing, registers nothing, and spends no API budget — it is not the
# unattended-automation kind of workflow CLAUDE.md gates.
#
# Same shape as janitorial-bid-calculator-ci.yml.

on:
  pull_request:
    paths:
      - "ventures/asphalt-sealcoat-bid-calculator/**"
      - ".github/workflows/asphalt-sealcoat-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/asphalt-sealcoat-bid-calculator/**"
      - ".github/workflows/asphalt-sealcoat-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: asphalt-sealcoat-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/asphalt-sealcoat-bid-calculator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test
