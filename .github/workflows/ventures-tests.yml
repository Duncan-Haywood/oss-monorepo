name: ventures tests

# One workflow for every venture's `node --test` suite. 421 ventures had no
# per-venture workflow, so their tests ran only on a contributor's machine
# (validate_workflows.py invariant 7). Rather than 421 copies, this runs the
# suites of just the ventures a change touches. It publishes nothing,
# registers nothing, and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/**"
      - ".github/workflows/ventures-tests.yml"
  push:
    branches: [main]
    paths:
      - "ventures/**"
      - ".github/workflows/ventures-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ventures-tests-${{ github.ref }}
  # PR branches drop superseded runs; on main a run in flight finishes, so each
  # merge does not cancel the last one's verdict (P038). GitHub still keeps
  # only the newest pending run per group.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-ventures:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Every step below only diffs BASE against HEAD, which needs the two
      # commits' trees, not the history between them. A full clone (5.3 GB)
      # was a median 95s of a 107s job; depth 1 plus this one-commit fetch is
      # ~16s (docs/history/ci-perf-2026-10-21.md). A BASE that cannot be
      # fetched (a force-pushed `before`) makes `git diff` fail loudly below,
      # as it did with a full clone.
      - name: Fetch the base commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE:-}" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              exit 0
            elif [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --quiet --no-tags --depth=1 origin "$BASE" || echo "::warning::could not fetch base $BASE"
            else
              git fetch --quiet --no-tags origin "$BASE" || echo "::warning::could not fetch base $BASE"
            fi
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: node --test in each touched venture
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -u
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            slugs=$(ls ventures)
          else
            slugs=$(git diff --name-only "$BASE" HEAD -- ventures | cut -d/ -f2 | sort -u)
          fi
          rc=0
          for s in $slugs; do
            [ -d "ventures/$s" ] || continue
            files=$(find "ventures/$s" -name '*.test.mjs' -not -path '*/node_modules/*')
            [ -n "$files" ] || continue
            echo "::group::$s"
            # shellcheck disable=SC2086
            node --test $files || { echo "FAILED $s"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      # PRODUCT_PLAYBOOK.md 5b/5f: every published page carries the no-warranty
      # clause, and a vs-<competitor> page the not-affiliated one. Runs for
      # every venture the change touched, tests or not, so the PR that breaks a
      # page goes red before the merge, names the venture, and annotates the
      # file in its diff. This replaced a step copied into 281 <slug>-ci.yml
      # files (docs/history/venture-clause-check-2026-10-20.md); the
      # unscoped run in portfolio-validate.yml is the portfolio-wide backstop.
      - name: Published pages carry the no-warranty clause (each touched venture)
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node platform/pages/clauses.mjs --changed-since "$BASE"
      - name: tsc over each touched venture's // @ts-check files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -u
          # PRODUCT_PLAYBOOK.md 4: a file that opts in with // @ts-check stays
          # type-clean. Installs a pinned typescript outside the tree only when
          # a touched venture has an opted-in file.
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            slugs=$(ls ventures)
          else
            slugs=$(git diff --name-only "$BASE" HEAD -- ventures | cut -d/ -f2 | sort -u)
          fi
          [ -n "$slugs" ] || exit 0
          # shellcheck disable=SC2086
          node platform/pages/typecheck.mjs $slugs
