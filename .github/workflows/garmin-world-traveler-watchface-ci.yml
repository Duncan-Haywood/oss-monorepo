name: garmin-world-traveler-watchface CI

# Full Monkey C compilation needs the Garmin Connect IQ SDK, which isn't
# available in GitHub Actions (see this venture's README). This job covers
# what can be checked without it: the manifest and resource files are XML
# that the Connect IQ build tooling parses directly, so a well-formedness
# check here catches a broken edit before it reaches a local SDK build.

on:
  push:
    branches: [main]
    paths:
      - "ventures/garmin-world-traveler-watchface/manifest.xml"
      - "ventures/garmin-world-traveler-watchface/resources/**"
      - ".github/workflows/garmin-world-traveler-watchface-ci.yml"
  pull_request:
    paths:
      - "ventures/garmin-world-traveler-watchface/manifest.xml"
      - "ventures/garmin-world-traveler-watchface/resources/**"
      - ".github/workflows/garmin-world-traveler-watchface-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garmin-world-traveler-watchface-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/garmin-world-traveler-watchface

jobs:
  xml-sanity:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # The self-hosted runner image (gitops/ci/runner.yaml, upstream
      # ghcr.io/actions/actions-runner) installs only sudo, lsb-release,
      # gpg-agent, software-properties-common, curl, jq, unzip and git --
      # no Python, no Node (confirmed against actions/runner's own
      # images/Dockerfile). This step used to run bare `python3`, which
      # exists on GitHub-hosted ubuntu-latest by default but not here, so
      # flipping CI_RUNNER to self-hosted would have turned this job red on
      # its own first step, on every push and PR that touches this
      # venture -- a break with nothing to do with the runner-starvation
      # outage. Every other Python-only job in this repo (e.g.
      # a11y-axe-recall-ci.yml) already downloads its own interpreter this
      # way rather than relying on what the runner ships.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: manifest.xml and resources/**/*.xml are well-formed
        run: |
          python3 -c "
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = ['manifest.xml'] + sorted(glob.glob('resources/**/*.xml', recursive=True))
          assert files, 'no XML files found'
          errors = []
          for f in files:
              try:
                  ET.parse(f)
              except ET.ParseError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'{len(files)} XML file(s) well-formed')
          "
