name: vendor-change-watch CI

on:
  pull_request:
    paths:
      - "ventures/vendor-change-watch/**"
      - ".github/workflows/vendor-change-watch-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/vendor-change-watch/**"
      - ".github/workflows/vendor-change-watch-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/vendor-change-watch

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: python3 -m pytest -q

  lint:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff==0.15.8 mypy==1.19.1
      - run: ruff check .
      - run: mypy .

  # Added 2026-09-07. This venture started as a Python tool and later gained a
  # browser page with its own `*.test.mjs` suites, but the workflow was never
  # widened and no portfolio-wide workflow runs `node --test` inside a venture
  # -- so those assertions ran in no CI job at all. `validate_workflows.py`
  # invariant 7 now fails when a venture ships `*.test.mjs` that nothing runs.
  page-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the page module tests
        run: node --test
