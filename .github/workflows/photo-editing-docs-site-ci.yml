name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "ventures/photo-editing/docs-site/**"
      - "ventures/photo-editing/docs/*.html"
      - "ventures/photo-editing/docs/*.md"
      - ".github/workflows/photo-editing-docs-site-ci.yml"
  pull_request:
    paths:
      - "ventures/photo-editing/docs-site/**"
      - "ventures/photo-editing/docs/*.html"
      - "ventures/photo-editing/docs/*.md"
      - ".github/workflows/photo-editing-docs-site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/photo-editing/docs-site

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventures/photo-editing/docs-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          DOCS_SITE_PASSWORD: ci-docs-password
          DOCS_SITE_TOKEN: ci-build-placeholder-token-32chars
