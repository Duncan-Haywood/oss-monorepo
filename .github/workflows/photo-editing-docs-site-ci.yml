name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "ventures/photo-editing/docs-site/**"
      - "ventures/photo-editing/docs/*.html"
      - "ventures/photo-editing/docs/*.md"
      - ".github/workflows/photo-editing-docs-site-ci.yml"
  pull_request:
    paths:
      - "ventures/photo-editing/docs-site/**"
      - "ventures/photo-editing/docs/*.html"
      - "ventures/photo-editing/docs/*.md"
      - ".github/workflows/photo-editing-docs-site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/photo-editing/docs-site

# A newer push to the same pull request cancels the superseded run; `main`
# keeps every run (platform/ci/validate_workflows.py, invariant 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventures/photo-editing/docs-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          DOCS_SITE_PASSWORD: ci-docs-password
          DOCS_SITE_TOKEN: ci-build-placeholder-token-32chars
