# TRANSITIONAL (platform/aws/stacks/app-identity): puts the current access key
# of the `transitional-worker` IAM user into the secrets of the Cloudflare
# Workers that call Claude Platform on AWS or SES, once a day and on demand.
# The key itself lives only in AWS Secrets Manager and is rotated there every
# 30 days; the previous key stays valid until the next rotation, so a daily
# sync always lands well inside the overlap.
#
# Skipped, not failed, until both values below are set (an agent fills them
# in a PR after the first apply prints the apps account ID; this file is
# owner-reviewed, so that PR is the owner's approval):
#   APPS_ACCOUNT_ID  the apps account (priv-aws-apply.yml run summary)
#   WORKER_SCRIPTS   space-separated Worker script names to update
#
# Delete this workflow with stacks/app-identity when the products run on AWS.
# Calls: one Secrets Manager read and one Cloudflare API call per Worker a
# day (Cloudflare's API is free; Secrets Manager bills per 10,000 calls).
name: AWS worker secret sync

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-worker-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.AWS_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare
    permissions:
      contents: read
      id-token: write
    env:
      APPS_ACCOUNT_ID: ''
      WORKER_SCRIPTS: ''
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
      # stacks/app-identity puts the sync role under /ci/ in single-account mode
      # (the bootstrap closes /github/ to github-apply in its own account).
      SYNC_ROLE_PATH: ${{ vars.AWS_ACCOUNT_MODE == 'single' && 'ci' || 'github' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN || secrets.CLOUDFLARERESTRICTEDAPIKEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID }}
    steps:
      - name: Sync the transitional key into Worker secrets
        run: |
          set -euo pipefail
          if [ -z "${APPS_ACCOUNT_ID}" ] || [ -z "${WORKER_SCRIPTS}" ]; then
            echo "APPS_ACCOUNT_ID or WORKER_SCRIPTS is not set in this workflow yet; nothing to sync."; exit 0
          fi
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::${token}"
          umask 077
          printf '%s' "$token" > "${RUNNER_TEMP}/web-identity-token"
          export AWS_WEB_IDENTITY_TOKEN_FILE="${RUNNER_TEMP}/web-identity-token"
          export AWS_ROLE_ARN="arn:aws:iam::${APPS_ACCOUNT_ID}:role/${SYNC_ROLE_PATH}/github-worker-secret-sync"
          export AWS_ROLE_SESSION_NAME="worker-sync-${GITHUB_RUN_ID}"
          export AWS_DEFAULT_REGION="${AWS_REGION}"
          aws secretsmanager get-secret-value --secret-id transitional/worker-aws-credentials \
            --version-stage AWSCURRENT --query SecretString --output text > "${RUNNER_TEMP}/key.json"
          python3 -I - "${RUNNER_TEMP}/key.json" <<'PY'
          import json, os, sys, urllib.request

          key = json.load(open(sys.argv[1]))
          os.remove(sys.argv[1])
          for v in (key["access_key_id"], key["secret_access_key"]):
              print(f"::add-mask::{v}")
          values = {
              "AWS_ACCESS_KEY_ID": key["access_key_id"],
              "AWS_SECRET_ACCESS_KEY": key["secret_access_key"],
              "AWS_REGION": os.environ["AWS_REGION"],
          }
          acct, token = os.environ["CLOUDFLARE_ACCOUNT_ID"], os.environ["CLOUDFLARE_API_TOKEN"]
          for script in os.environ["WORKER_SCRIPTS"].split():
              for name, text in values.items():
                  req = urllib.request.Request(
                      f"https://api.cloudflare.com/client/v4/accounts/{acct}/workers/scripts/{script}/secrets",
                      method="PUT",
                      data=json.dumps({"name": name, "text": text, "type": "secret_text"}).encode(),
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                  )
                  try:
                      urllib.request.urlopen(req, timeout=30).read()
                  except urllib.error.HTTPError as e:
                      sys.exit(f"{script} {name}: HTTP {e.code}")
              print(f"synced {script} (key ...{key['access_key_id'][-4:]})")
          PY
