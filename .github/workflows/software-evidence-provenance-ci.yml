name: software-evidence-provenance CI

on:
  pull_request:
    paths:
      - "ventures/software-evidence-provenance/**"
      - ".github/workflows/software-evidence-provenance-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/software-evidence-provenance/**"
      - ".github/workflows/software-evidence-provenance-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/software-evidence-provenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.8
      - run: ruff check .
