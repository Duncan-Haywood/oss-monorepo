name: shopify-a11y-evidence CI

# Test runner for the browser-local Shopify accessibility evidence report
# and remediation quote. Static ES modules, no build step, no dependencies.

on:
  pull_request:
    paths:
      - "ventures/shopify-a11y-evidence/**"
      - ".github/workflows/shopify-a11y-evidence-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/shopify-a11y-evidence/**"
      - ".github/workflows/shopify-a11y-evidence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-a11y-evidence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/shopify-a11y-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
