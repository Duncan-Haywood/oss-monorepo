name: shopify-a11y-evidence CI

# Test runner for the browser-local Shopify accessibility evidence report,
# remediation quote, theme-area router, and before/after compare. Static ES
# modules, no build step, no dependencies.

on:
  pull_request:
    paths:
      - "ventures/shopify-a11y-evidence/**"
      - ".github/workflows/shopify-a11y-evidence-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/shopify-a11y-evidence/**"
      - ".github/workflows/shopify-a11y-evidence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-a11y-evidence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/shopify-a11y-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause and a
      # best-effort/no-SLA clause on every hosted page. Neither is visible to
      # this venture's own suite -- the clauses matter because the page gets
      # published, and the venture does not know it is being published. That
      # gap turned main red twice in two days (#1747, and again on the
      # sewer-line merge), each time in the Pages job rather than in the CI of
      # the venture that broke it. Checked here so the venture that needs the
      # clause is the one that goes red.
      - name: Published pages carry both liability clauses
        working-directory: .
        run: node platform/pages/clauses.mjs shopify-a11y-evidence

