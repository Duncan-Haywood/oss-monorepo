name: sri-check CI

# Zero-dependency CLI/browser tool: `sri.mjs` is the shared, independently
# tested hashing and classification core (used by the CLI, the browser page
# checker, and the browser's own standalone hash generator), `probe.mjs` is
# the network layer (tested against a local loopback HTTP server, never the
# real internet), `check.mjs` is the CLI entry point, and `page.test.mjs`
# covers both pages' wiring (including the worked example, which must
# exercise a real danger finding through this venture's own engine). Keep
# all five covered independently of the portfolio-wide validation workflow,
# which only checks published pages and does not run venture unit tests.
# Without this file, `validate_workflows.py` would fail the moment the
# venture's `*.test.mjs` files land -- the same hole
# `cors-misconfig-check-ci.yml` and its own named predecessors document.
on:
  pull_request:
    paths:
      - "ventures/sri-check/**"
      - ".github/workflows/sri-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/sri-check/**"
      - ".github/workflows/sri-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sri-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/sri-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run sri, probe, check, usage, and page-wiring tests
        run: node --test sri.test.mjs probe.test.mjs check.test.mjs usage.test.mjs page.test.mjs
