name: Security scan (full repository)

# The pinned scanners of the `security-scan` check (platform/security/scan.py,
# tools.yaml) over the whole repository, with their blocking findings
# sent to code scanning. From there priv-security-alert-queue.yml mirrors them
# to the `security-alerts` branch next to CodeQL's, and prompt.md ("0.
# Security alerts first") sends the scheduled sessions to fix them. Until
# this file the PR gate saw only what a PR adds, so findings already on main
# reached no queue (portfolio/work/tasks.yaml, sec-codeowners-scan-gate).
#
# Only findings at or above each tool's block_at that baseline.yaml does not
# accept are uploaded: what would fail a PR that added them. Secrets are
# redacted by the parser before anything is written.
#
# Two jobs, least privilege: `scan` runs repository code with a read-only
# token and no secret; `upload` holds security-events: write and runs no
# repository code, only the pinned upload action on the scan job's SARIF.
# Free for a public repository; nothing paid is called; nothing is pushed.

# Weekly since 2026-11-28, and by hand. The first reading, from a cloud session
# on 2026-11-27, found 121 blocking findings on main, 97 of them gitleaks
# matches in test fixtures and sample pages; uploaded as they were, they would
# have sat at the top of the queue every session works first. baseline.yaml
# now accepts those with reasons, and the real ones are fixed, so a reading is
# 0 blocking for every tool (portfolio/work/tasks.yaml, scan-repo-baseline;
# docs/reports/2026-11-27-full-repo-security-scan.md and
# docs/reports/2026-11-28-full-repo-scan-osv-trivy-zizmor.md).
on:
  schedule:
    - cron: "29 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-scan-repo
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install PyYAML (hash-locked)
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary :all: --no-deps -r platform/security/locks/pyyaml.txt

      - name: Install the scanners (pinned by version and checksum)
        run: python3 -I platform/security/scan.py install --tools-dir "$RUNNER_TEMP/tools"

      - name: Scan the repository
        run: >-
          python3 -I platform/security/scan.py repo --root . --tools-dir "$RUNNER_TEMP/tools"
          --out "$RUNNER_TEMP/scan" --sarif "$RUNNER_TEMP/scan/scan.sarif"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-repo
          path: ${{ runner.temp }}/scan/
          retention-days: 7

  upload:
    needs: scan
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the upload action reads the run's workflow file
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-scan-repo
          path: scan
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scan/scan.sarif
