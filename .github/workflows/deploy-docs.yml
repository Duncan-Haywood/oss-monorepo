# Publish built docs to GitHub Pages (private repo: enable Pages in repo settings).
# Pair with passcode gate (VITE_DOCS_PASSCODE) and optional Vercel Deployment Protection.
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "reports/**"
      - "scripts/convert-html-to-tsx.ts"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation site
        env:
          VITE_DOCS_GATE_ENABLED: "true"
          VITE_DOCS_PASSCODE: ${{ secrets.DOCS_PASSCODE }}
          VITE_DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: pnpm docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs for Vercel
        env:
          VITE_DOCS_GATE_ENABLED: "true"
          VITE_DOCS_PASSCODE: ${{ secrets.DOCS_PASSCODE }}
          VITE_DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: pnpm docs:build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/docs
          vercel-args: "--prod"
