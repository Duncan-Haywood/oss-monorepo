# Deploy private pilot docs to Vercel (static site + optional platform password).
#
# Required repo secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   DOCS_PASSCODE (optional; defaults to atelier-docs in the app if unset)
#
# Required repo variable: DOCS_DEPLOY_ENABLED = true
#
# See docs/HOSTING.md for Vercel password protection and env vars.

name: Deploy docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "vercel.json"
      - ".github/workflows/deploy-docs.yml"

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: vars.DOCS_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Vercel secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::DOCS_DEPLOY_ENABLED is true but VERCEL_TOKEN is not set."
            exit 1
          fi

      - name: Build documentation site
        run: pnpm docs:build
        env:
          VITE_DOCS_PASSCODE: ${{ secrets.DOCS_PASSCODE }}

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod"
          vercel-version: latest
