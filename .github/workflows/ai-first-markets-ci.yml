name: AI-First Markets CI

on:
  pull_request:
    paths:
      - "ventures/ai-first-markets/**"
      - ".github/workflows/ai-first-markets-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-first-markets/**"
      - ".github/workflows/ai-first-markets-ci.yml"

defaults:
  run:
    working-directory: ventures/ai-first-markets

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventures/ai-first-markets/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run cf:build
