name: AI-First Markets CI

on:
  pull_request:
    paths:
      - "ventures/ai-first-markets/**"
      - ".github/workflows/ai-first-markets-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-first-markets/**"
      - ".github/workflows/ai-first-markets-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ventures/ai-first-markets

jobs:
  verify:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventures/ai-first-markets/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run cf:build
