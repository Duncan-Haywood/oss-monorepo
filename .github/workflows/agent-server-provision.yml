name: Provision agent server

# Runs `ventures/ubuntu-agent-server/`'s playbook against the repository's own
# Hetzner box, from CI, using an SSH key held in repository secrets.
#
# `workflow_dispatch` only, deliberately. This is a button a human presses, not
# unattended automation: per CLAUDE.md, anything that runs unattended and can
# spend is the account owner's decision. It also does **not** enable the agent
# runner -- `agent_runner_start_disabled` stays true unless someone overrides
# it on purpose, which is a separate decision from having a box at all.
#
# Required before the first run:
#   secret AGENT_SERVER_SSH_KEY      private half of a key used for nothing else
#   secret AGENT_SERVER_KNOWN_HOSTS  the box's host key, read out of band from
#                                    the provider console. Required, not
#                                    optional: the first run is the one that
#                                    may carry TAILSCALE_AUTHKEY, and a key
#                                    pinned afterwards cannot authenticate a
#                                    connection already made.
#   var    AGENT_SERVER_HOST         IP or hostname to reach the box on
#   var    AGENT_SERVER_PUBKEY       public half, installed as an authorized key
# Optional:
#   var    AGENT_SERVER_SSH_USER     login used to connect (default: root --
#                                    a fresh cloud image has no other account)
#   var    AGENT_SERVER_AGENT_USER   unprivileged account the playbook creates
#                                    and the agents run as (default: deploy)
#   secret TAILSCALE_AUTHKEY         joins the box to the tailnet unattended

on:
  workflow_dispatch:
    inputs:
      enable_agent_runner:
        description: "Start the agent fleet on the box (owner decision -- leave false)"
        type: boolean
        default: false
      check_mode:
        description: "Dry run (re-runs only -- cannot work on an unprovisioned box)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-server-provision
  cancel-in-progress: false

defaults:
  run:
    working-directory: ventures/ubuntu-agent-server

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the required configuration is present
        env:
          HOST: ${{ vars.AGENT_SERVER_HOST }}
          PUBKEY: ${{ vars.AGENT_SERVER_PUBKEY }}
          KEY: ${{ secrets.AGENT_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AGENT_SERVER_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -n "$HOST" ]        || missing+=("var AGENT_SERVER_HOST")
          [ -n "$PUBKEY" ]      || missing+=("var AGENT_SERVER_PUBKEY")
          [ -n "$KEY" ]         || missing+=("secret AGENT_SERVER_SSH_KEY")
          [ -n "$KNOWN_HOSTS" ] || missing+=("secret AGENT_SERVER_KNOWN_HOSTS -- read the fingerprint from the Hetzner console, do not trust it on first use")
          if [ ${#missing[@]} -ne 0 ]; then
            printf '::error::not configured yet -- missing: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Write the SSH key and pin the host key
        env:
          KEY: ${{ secrets.AGENT_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AGENT_SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/agent_server
          chmod 600 ~/.ssh/agent_server
          # No accept-new fallback. The run that would have used it is the
          # same run that may hand TAILSCALE_AUTHKEY to whatever answered, and
          # a key pinned afterwards cannot authenticate a connection already
          # made. The step above refuses to start without this secret.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run the playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "1"
          HOST: ${{ vars.AGENT_SERVER_HOST }}
          # Two accounts, and conflating them was a real bug: the login must
          # already exist to connect at all (a fresh cloud image has only
          # root), while agent_user is the unprivileged account this playbook
          # creates and the agents run as. One name for both either cannot
          # connect or installs the whole agent stack as root.
          SSH_USER: ${{ vars.AGENT_SERVER_SSH_USER || 'root' }}
          AGENT_USER: ${{ vars.AGENT_SERVER_AGENT_USER || 'deploy' }}
          PUBKEY: ${{ vars.AGENT_SERVER_PUBKEY }}
          AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          ENABLE_RUNNER: ${{ inputs.enable_agent_runner }}
          CHECK_MODE: ${{ inputs.check_mode }}
        run: |
          printf '[agent_server]\nagent-server ansible_host=%s ansible_user=%s\n' \
            "$HOST" "$SSH_USER" > inventory.ci.ini

          # `run:` executes under `bash -e`, and `[ test ] && cmd` exits the
          # step when the test is false -- the && list's status is the step's.
          # Explicit ifs, so a dry run that is *not* requested does not abort.
          args=(-i inventory.ci.ini playbook.yml)
          # --check cannot provision a fresh box: Ansible's `user` module only
          # *predicts* the account in check mode, so every later task targeting
          # it fails against a user that does not exist. Useful for re-runs
          # against a box already up; useless for the first run.
          if [ "$CHECK_MODE" = "true" ]; then
            echo "::notice::Dry run -- meaningful only against an already-provisioned box."
            args+=(--check --diff)
          fi
          if [ -n "$AUTHKEY" ]; then
            args+=(-e "tailscale_authkey=$AUTHKEY")
          fi

          # The fleet stays off unless someone deliberately asks for it.
          if [ "$ENABLE_RUNNER" = "true" ]; then
            echo "::warning::Starting the agent runner -- this is the owner-gated switch in CLAUDE.md."
            args+=(-e "agent_runner_start_disabled=false")
          else
            args+=(-e "agent_runner_start_disabled=true")
          fi

          # The public key is not secret; passing it as a var keeps the
          # playbook's default (read the operator's own key off their machine)
          # working for a human run, which has no repository variables.
          args+=(-e "agent_user=$AGENT_USER")
          args+=(-e "agent_user_passwordless_sudo=true")
          args+=(-e "{\"agent_user_authorized_keys\": [\"$PUBKEY\"]}")

          ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/agent_server \
          ANSIBLE_SSH_COMMON_ARGS="-o StrictHostKeyChecking=yes" \
          ansible-playbook "${args[@]}"
