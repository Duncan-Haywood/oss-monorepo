name: Provision agent server

# Runs `ventures/ubuntu-agent-server/`'s playbook against the repository's own
# Hetzner box, from CI, using an SSH key held as an **environment** secret on
# the protected `agent-server` environment -- not a repository secret. The
# difference is the whole gate: see the `environment:` note on the job below.
#
# `workflow_dispatch` only, deliberately -- a button a human presses, not
# unattended automation.
#
# It has **no switch for starting the agent fleet**, and that is a correction
# rather than an oversight. An earlier version exposed one as a boolean input,
# on the reasoning that a human would have to flip it. But `workflow_dispatch`
# is not an owner-only boundary: anyone with write access can dispatch a
# workflow and set its inputs, so the input would have been a route around the
# gate CLAUDE.md reserves to the account owner, wearing the gate's own label.
# `agent_runner_start_disabled` is therefore pinned true here with no way to
# override it from this workflow. Starting the fleet is a separate decision and
# needs its own mechanism -- an Environment with the owner as required
# reviewer, or a hand-run playbook -- not a checkbox on the box's installer.
#
# Required before the first run:
#   secret AGENT_SERVER_SSH_KEY      private half of a key used for nothing else
#   secret AGENT_SERVER_KNOWN_HOSTS  the box's host key, read out of band from
#                                    the provider console. Required, not
#                                    optional: the first run is the one that
#                                    may carry TAILSCALE_AUTHKEY, and a key
#                                    pinned afterwards cannot authenticate a
#                                    connection already made.
#   var    AGENT_SERVER_HOST         IP or hostname to reach the box on
#   var    AGENT_SERVER_PUBKEY       public half, installed as an authorized key
# Optional:
#   var    AGENT_SERVER_SSH_USER     login used to connect (default: root --
#                                    a fresh cloud image has no other account)
#   var    AGENT_SERVER_AGENT_USER   non-root account the playbook creates and
#                                    the agents run as (default: deploy). Not
#                                    unprivileged: it holds NOPASSWD sudo, so
#                                    this key is root-equivalent on the box.
#   secret TAILSCALE_AUTHKEY         joins the box to the tailnet unattended
#
# One constraint to understand before closing anything down. A GitHub-hosted
# runner is not on your tailnet, and this workflow does not join it. So while
# CI is the thing that provisions the box, the box needs a public SSH route for
# CI to use -- `ssh_public_access` must stay true. Setting it false is correct
# *once you stop provisioning from CI* and run the playbook from a machine
# already on the tailnet; do it before that and the next dispatch simply cannot
# reach the host, whether HOST names the blocked public address or a tailnet
# one. The two are alternatives, not a sequence: CI-provisioned and
# publicly-reachable, or tailnet-only and provisioned by hand.

on:
  workflow_dispatch:
    inputs:
      check_mode:
        description: "Dry run (re-runs only -- cannot work on an unprovisioned box)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-server-provision
  cancel-in-progress: false

defaults:
  run:
    working-directory: ventures/ubuntu-agent-server

jobs:
  provision:
    runs-on: ubuntu-latest
    # The real gate. Removing the fleet-enable input was necessary but not
    # sufficient: a write-access collaborator can push a branch that edits this
    # workflow and dispatch *that* ref, and the edited workflow reads the same
    # repository secrets -- enough to start the fleet or exfiltrate a
    # root-equivalent SSH key. Binding the job to an Environment is what makes
    # the owner a required approver of the run itself.
    #
    # NOTE: this binding does nothing until the Environment exists *with a
    # required reviewer*. GitHub creates an unprotected Environment implicitly
    # otherwise. Configure `agent-server` under Settings -> Environments with
    # the account owner as required reviewer, and move AGENT_SERVER_SSH_KEY,
    # AGENT_SERVER_KNOWN_HOSTS and TAILSCALE_AUTHKEY into it as environment
    # secrets, before treating this as gated.
    environment: agent-server
    steps:
      - uses: actions/checkout@v4

      - name: Check the required configuration is present
        env:
          HOST: ${{ vars.AGENT_SERVER_HOST }}
          PUBKEY: ${{ vars.AGENT_SERVER_PUBKEY }}
          KEY: ${{ secrets.AGENT_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AGENT_SERVER_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -n "$HOST" ]        || missing+=("var AGENT_SERVER_HOST")
          [ -n "$PUBKEY" ]      || missing+=("var AGENT_SERVER_PUBKEY")
          [ -n "$KEY" ]         || missing+=("secret AGENT_SERVER_SSH_KEY")
          [ -n "$KNOWN_HOSTS" ] || missing+=("secret AGENT_SERVER_KNOWN_HOSTS -- read the fingerprint from the Hetzner console, do not trust it on first use")
          if [ ${#missing[@]} -ne 0 ]; then
            printf '::error::not configured yet -- missing: %s\n' "${missing[*]}"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        # Pinned, because the next step hands this toolchain a root-equivalent
        # SSH key and possibly a Tailscale auth key. Installing whatever
        # `ansible-core` and Galaxy happen to publish that morning puts an
        # unreviewed upstream inside the privileged path.
        run: |
          pip install --quiet 'ansible-core==2.19.12'
          ansible-galaxy collection install -r requirements.yml

      - name: Write the SSH key and pin the host key
        env:
          KEY: ${{ secrets.AGENT_SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AGENT_SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/agent_server
          chmod 600 ~/.ssh/agent_server
          # No accept-new fallback. The run that would have used it is the
          # same run that may hand TAILSCALE_AUTHKEY to whatever answered, and
          # a key pinned afterwards cannot authenticate a connection already
          # made. The step above refuses to start without this secret.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run the playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "1"
          HOST: ${{ vars.AGENT_SERVER_HOST }}
          # Two accounts, and conflating them was a real bug: the login must
          # already exist to connect at all (a fresh cloud image has only
          # root), while agent_user is the non-root account this playbook
          # creates and the agents run as. One name for both either cannot
          # connect or installs the whole agent stack as root. "Non-root" is
          # the accurate word, not "unprivileged" -- that account holds
          # NOPASSWD sudo, so the key reaching it is root-equivalent here.
          SSH_USER: ${{ vars.AGENT_SERVER_SSH_USER || 'root' }}
          AGENT_USER: ${{ vars.AGENT_SERVER_AGENT_USER || 'deploy' }}
          PUBKEY: ${{ vars.AGENT_SERVER_PUBKEY }}
          AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          CHECK_MODE: ${{ inputs.check_mode }}
        run: |
          printf '[agent_server]\nagent-server ansible_host=%s ansible_user=%s\n' \
            "$HOST" "$SSH_USER" > inventory.ci.ini

          # `run:` executes under `bash -e`, and `[ test ] && cmd` exits the
          # step when the test is false -- the && list's status is the step's.
          # Explicit ifs, so a dry run that is *not* requested does not abort.
          args=(-i inventory.ci.ini playbook.yml)
          # --check cannot provision a fresh box: Ansible's `user` module only
          # *predicts* the account in check mode, so every later task targeting
          # it fails against a user that does not exist. Useful for re-runs
          # against a box already up; useless for the first run.
          if [ "$CHECK_MODE" = "true" ]; then
            echo "::notice::Dry run -- meaningful only against an already-provisioned box."
            args+=(--check --diff)
          fi
          if [ -n "$AUTHKEY" ]; then
            args+=(-e "tailscale_authkey=$AUTHKEY")
          fi

          # Pinned, not defaulted. See the header: a dispatch input would have
          # been an owner gate that any write-access collaborator could open.
          args+=(-e "agent_runner_start_disabled=true")

          # The public key is not secret; passing it as a var keeps the
          # playbook's default (read the operator's own key off their machine)
          # working for a human run, which has no repository variables.
          args+=(-e "agent_user=$AGENT_USER")
          args+=(-e "agent_user_passwordless_sudo=true")
          args+=(-e "{\"agent_user_authorized_keys\": [\"$PUBKEY\"]}")

          ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/agent_server \
          ANSIBLE_SSH_COMMON_ARGS="-o StrictHostKeyChecking=yes" \
          ansible-playbook "${args[@]}"
