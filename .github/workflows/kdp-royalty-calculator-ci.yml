name: kdp-royalty-calculator CI

# The venture is a static, browser-local calculator: plain ES modules run with
# node's built-in test runner, no package.json, no dependencies, no network.
# calc.mjs is the royalty arithmetic and usage.mjs the anonymous local counter.
# Without this runner they could rot while the page still ships them.

on:
  pull_request:
    paths:
      - "ventures/kdp-royalty-calculator/**"
      - ".github/workflows/kdp-royalty-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/kdp-royalty-calculator/**"
      - ".github/workflows/kdp-royalty-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kdp-royalty-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/kdp-royalty-calculator

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs kdp-royalty-calculator
