name: cloud-bucket-exposure-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared,
# independently-tested URL-parsing and classification engine, `probe.mjs`
# is the network layer (tested against a local loopback HTTP server, never
# the real internet), `check.mjs` is the CLI entry point, and
# `page.test.mjs` covers the browser report-viewer's wiring (including its
# worked example, which must exercise a real danger finding through this
# venture's own engine). Keep all five covered independently of the
# portfolio-wide validation workflow, which only checks published pages
# and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `git-exposure-check-ci.yml`
# and its siblings document.
on:
  pull_request:
    paths:
      - "ventures/cloud-bucket-exposure-check/**"
      - ".github/workflows/cloud-bucket-exposure-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/cloud-bucket-exposure-check/**"
      - ".github/workflows/cloud-bucket-exposure-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-bucket-exposure-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/cloud-bucket-exposure-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- bare `node --test` walks the working
      # directory, so a test file added later is covered automatically
      # rather than needing this list to be kept in sync by hand.
      - name: Run every test in the venture
        run: node --test
