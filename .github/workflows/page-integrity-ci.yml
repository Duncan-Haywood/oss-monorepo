name: Page integrity

# Every browser-local product in this portfolio is static HTML plus ES modules,
# and every venture's tests import `calc.mjs` directly without ever loading the
# page. That gap shipped a completely dead product: cut-list-optimizer's
# index.html opened `<textarea id="cuts">` and never closed it, so the parser
# swallowed the results panel, the disclaimer, the opt-out and the entire
# `<script type="module">` as literal text. The calculator never ran once, and
# three pull requests merged green over the top of it.
#
# This job answers the one question those unit tests cannot: would a browser
# actually run this page. It sweeps every .html under ventures/, so a new
# venture is covered the day it lands with nothing to wire up — the venture that
# broke had no CI at all, and a guard you must opt into would not have caught it.
#
# It runs `node --test` (the checker's own tests, including the real broken
# blobs from git history) and then the sweep. No dependencies, no build step, no
# network, no publishing — it is not the unattended-automation kind of workflow
# CLAUDE.md gates.

on:
  pull_request:
    paths:
      - "ventures/**/*.html"
      - "platform/webcheck/**"
      - ".github/workflows/page-integrity-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/**/*.html"
      - "platform/webcheck/**"
      - ".github/workflows/page-integrity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: page-integrity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-integrity:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    # A one-commit checkout plus a node --test sweep over every venture
    # page -- normally under 30s. See hetzner-gitops-ci.yml's timeout-minutes
    # addition for why an unbounded job is worth capping on a
    # metered-minutes account; the checkout below is the one step here with
    # any real network variance.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # One commit, blob-less. The checker's tests once read historical
          # blobs of pages that shipped broken with `git show`, which needed
          # every commit and tree (fetch-depth: 0; 33s instead of 279s,
          # docs/history/ci-perf-2026-10-21.md). Those blobs now live in
          # platform/webcheck/fixtures/, pinned by git blob id, so nothing here
          # reads history: checkout is the job's largest step
          # (docs/history/ci-perf-2026-11-27-page-integrity-shallow.md).
          fetch-depth: 1
          filter: blob:none
          # Sparse and blob-less: the job reads HTML, JS, JSON and YAML under
          # ventures/, platform/ and portfolio/ (build.mjs imports
          # portfolio/requests). research/, docs/, prompts/ and binary media
          # are never read, so they are not fetched: 505 MB on disk instead of
          # 2.3 GB, identical output (docs/history/ci-perf-2026-11-25-page-sweeps-sparse.md).
          # A future check that reads a skipped path fails loudly here; add it
          # to the list rather than dropping the sparse checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/research/
            !/docs/
            !/prompts/
            !*.mp3
            !*.mp4
            !*.gz
            !*.zip
            !*.png
            !*.jpg
            !*.webp
            !*.gif
            !*.ico
            !*.woff2
            !*.ttf
            !*.step
            !*.stl
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Checker unit tests
        run: node --test platform/webcheck/*.test.mjs
      - name: Sweep every product page
        run: node platform/webcheck/check_pages.mjs
