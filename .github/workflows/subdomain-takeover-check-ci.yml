name: subdomain-takeover-check CI

# Zero-dependency browser/CLI tool: `fingerprints.mjs` is the provider
# table, `analyze.mjs` is the shared, independently-tested classification
# engine (including the guarantee that a finding is never confirmed from a
# DNS-only match), `lookup.mjs` and `probe.mjs` are the network layers
# (tested against a fake resolver and a local fake HTTP server, never the
# real internet), `check.mjs` is the CLI entry point, and `page.test.mjs`
# covers both pages' wiring and disclaimers. Keep all six covered
# independently of the portfolio-wide validation workflow, which only checks
# published pages and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's `*.test.mjs`
# files land -- the same hole `dotenv-exposure-check-ci.yml` and its
# siblings document.
on:
  pull_request:
    paths:
      - "ventures/subdomain-takeover-check/**"
      - ".github/workflows/subdomain-takeover-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/subdomain-takeover-check/**"
      - ".github/workflows/subdomain-takeover-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subdomain-takeover-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/subdomain-takeover-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- bare `node --test` walks the working
      # directory and cannot fall behind a file added later.
      - name: Run every test in the venture
        run: node --test
