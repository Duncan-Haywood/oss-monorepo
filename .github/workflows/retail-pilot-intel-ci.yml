name: retail-pilot-intel CI

on:
  push:
    branches: [main]
    paths:
      - "ventures/retail-pilot-intel/**"
      - ".github/workflows/retail-pilot-intel-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ventures/retail-pilot-intel/**"
      - ".github/workflows/retail-pilot-intel-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-pilot-intel-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/retail-pilot-intel

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ventures/retail-pilot-intel/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI pipeline
        run: pnpm run ci

      - name: Upload docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-dist
          path: ventures/retail-pilot-intel/apps/docs/dist
          if-no-files-found: error

      - name: Upload portal artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portal-dist
          path: ventures/retail-pilot-intel/apps/portal/dist
          if-no-files-found: error
