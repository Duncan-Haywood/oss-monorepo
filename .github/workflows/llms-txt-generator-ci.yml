name: llms-txt-generator CI

# Zero-dependency CLI/browser tool: `generator.mjs` is the shared, pure
# build/validate/parse module both the browser page and the CLI import;
# `cli.mjs` is the filesystem/network-touching CLI entry point (its tests
# stub fs and fetch, so no real disk or network access runs here);
# `page.test.mjs` covers structured data, disclaimers and the sibling link.
# Keep all three covered independently of the portfolio-wide validation
# workflow, which only checks published pages and does not run venture unit
# tests. Without this file, `validate_workflows.py` would fail the moment
# the venture's `*.test.mjs` files land -- the same hole
# `app-store-screenshot-check-ci.yml`, `redirect-chain-check-ci.yml` and
# `sitemap-lastmod-freshness-check-ci.yml` already document.
on:
  pull_request:
    paths:
      - "ventures/llms-txt-generator/**"
      - ".github/workflows/llms-txt-generator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/llms-txt-generator/**"
      - ".github/workflows/llms-txt-generator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llms-txt-generator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/llms-txt-generator

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run generator, CLI, and page-wiring tests
        run: node --test generator.test.mjs cli.test.mjs page.test.mjs
