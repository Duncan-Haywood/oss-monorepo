name: substitute-supply CI

# Test coverage for the free-substitute-supply probe under
# portfolio/research/substitute-supply/. It is standard-library-only and its
# suite needs no network — the tests exercise the tokenizer and the relevance
# rule that decide whether an npm package counts as a free substitute for a
# candidate's function, using fixture packages defined inline.
#
# Mirrors the sibling probes' runners (a11y-evidence-record in #302,
# eaa-wcag-triage in #344, a11y-render-recovery in #346). Publishes nothing,
# registers nothing, spends no API budget — a test runner, not the
# unattended-automation kind of workflow CLAUDE.md gates.
#
# The load-bearing invariants tested here are the two documented
# false-positive regressions in the probe's docstring: 'jest' must not count
# as an agent-eval harness, 'helmet' must not count as prompt-injection
# testing, iOS App Attest must not count as VEX supply-chain attestation, and
# device-detection libraries must not count as web change-monitors. Every
# headline number in the probe's README depends on these staying rejected.

on:
  pull_request:
    paths:
      - "portfolio/research/substitute-supply/**"
      - ".github/workflows/substitute-supply-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/research/substitute-supply/**"
      - ".github/workflows/substitute-supply-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: substitute-supply-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: portfolio/research/substitute-supply

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library unittest only: no pip install step, by design.
      - run: python3 -m unittest discover -p 'test_*.py'
