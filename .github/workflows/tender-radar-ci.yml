name: tender-radar CI

on:
  pull_request:
    paths:
      - "ventures/tender-radar/**"
      - ".github/workflows/tender-radar-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/tender-radar/**"
      - ".github/workflows/tender-radar-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tender-radar-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/tender-radar/site

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run shortlist tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs tender-radar
