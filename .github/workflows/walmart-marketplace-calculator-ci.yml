name: walmart-marketplace-calculator CI

# Test runner for the browser-local Walmart Marketplace WFS vs
# seller-fulfilled profit calculator. The product is static ES modules with
# no build step and no dependencies, so this does no more than a contributor
# runs locally: `node --test`. It publishes nothing, registers nothing, and
# spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/walmart-marketplace-calculator/**"
      - ".github/workflows/walmart-marketplace-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/walmart-marketplace-calculator/**"
      - ".github/workflows/walmart-marketplace-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: walmart-marketplace-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/walmart-marketplace-calculator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --test

