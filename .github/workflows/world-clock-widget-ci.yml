name: world-clock-widget CI

on:
  pull_request:
    paths:
      - "ventures/world-clock-widget/Package.swift"
      - "ventures/world-clock-widget/Sources/WorldClockCore/**"
      - "ventures/world-clock-widget/Tests/**"
      - "ventures/world-clock-widget/site/**"
      - ".github/workflows/world-clock-widget-ci.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ventures/world-clock-widget/Package.swift"
      - "ventures/world-clock-widget/Sources/WorldClockCore/**"
      - "ventures/world-clock-widget/Tests/**"
      - "ventures/world-clock-widget/site/**"
      - ".github/workflows/world-clock-widget-ci.yml"

permissions:
  contents: read

concurrency:
  group: world-clock-widget-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/world-clock-widget

jobs:
  test-core:
    # Only WorldClockCore (pure Foundation) is covered here. WorldClockApp and
    # WorldClockWidgetExtension depend on SwiftUI/WidgetKit/AppIntents and need Xcode + a
    # simulator, so they still require a manual build via the XcodeGen project (see README.md).
    # NOT the CI_RUNNER switch (see gitops/README.md and gitops/ci/README.md).
    # `container:` needs a Docker daemon to pull and run swift:5.9, and the
    # self-hosted runner pod (gitops/ci/runner.yaml) has none: no docker.sock
    # mount, no DinD sidecar, and its securityContext sets
    # allowPrivilegeEscalation: false and capabilities.drop: ["ALL"], which
    # rules out running one inside that pod too. Once an owner flips
    # CI_RUNNER to self-hosted, a job that read the switch here would not
    # fail with the runner-starvation signature (runner_id: 0) -- it would
    # register on a real runner and then hang or error inside `container:`,
    # which reads as a new, unrelated break. Staying on ubuntu-latest keeps
    # this job on Docker-capable GitHub-hosted runners regardless of the
    # switch. gitops/tests/test_ci_runner.py pins this as a named exception.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The official image rather than swift-actions/setup-swift@v2, which 404s fetching the
    # 5.9 toolchain and so failed this job before a single file was compiled.
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift build
      - run: swift test

  test-web:
    # The browser surface in site/ is plain ES modules and needs no container,
    # so unlike test-core above it *does* read the CI_RUNNER switch and can run
    # on a self-hosted runner once one exists.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/world-clock-widget/site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Solar core and page tests
        run: node --test
      - name: The browser catalogue still matches the Swift one
        # solar.test.mjs reads CityCatalog.swift directly, so this step is what
        # fails if the two surfaces' city lists ever drift apart.
        run: node --test solar.test.mjs
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs world-clock-widget
