name: dotenv-exposure-check CI

# Zero-dependency browser/CLI tool: `analyze.mjs` is the shared,
# independently-tested classification engine (including the guarantee that a
# variable VALUE never appears in its output), `probe.mjs` is the network
# layer (tested against a local fake HTTP server, never the real internet),
# `check.mjs` is the CLI entry point, and `page.test.mjs` covers both pages'
# wiring and disclaimers. Keep all five covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file, `validate_workflows.py`
# would fail the moment the venture's `*.test.mjs` files land -- the same
# hole `git-exposure-check-ci.yml` and its siblings document.
on:
  pull_request:
    paths:
      - "ventures/dotenv-exposure-check/**"
      - ".github/workflows/dotenv-exposure-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/dotenv-exposure-check/**"
      - ".github/workflows/dotenv-exposure-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotenv-exposure-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/dotenv-exposure-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- bare `node --test` walks the working
      # directory and cannot fall behind a file added later.
      - name: Run every test in the venture
        run: node --test
