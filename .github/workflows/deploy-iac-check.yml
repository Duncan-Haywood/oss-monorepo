# Our own CI for the self-deploy OpenTofu modules (platform/deploy/templates):
# a broken module should fail here, not in a stranger's account.
name: Deploy IaC check
on:
  pull_request:
    paths: ['platform/deploy/**']
  push:
    branches: [main]
    paths: ['platform/deploy/**']

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run; `main`
# keeps every run (platform/ci/validate_workflows.py, invariant 9).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tofu:
    timeout-minutes: 20
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.8.5
      - name: tofu fmt -check
        run: tofu fmt -check -recursive platform/deploy/templates
      - name: tofu validate (aws module)
        working-directory: platform/deploy/templates/aws/tofu
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - name: tofu validate (gcp module)
        working-directory: platform/deploy/templates/gcp/tofu
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - name: tofu validate (azure module)
        working-directory: platform/deploy/templates/azure/tofu
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: node tests
        run: node --test platform/deploy/*.test.mjs
