# PR checks for apps/einvoice-preflight (the paid app; ventures/einvoice-preflight, the free edition, is
# einvoice-preflight-ci.yml) (E-invoice fix-and-explain, bet #3; moved from the private
# repository, task products-to-public-repo). The imported checker's suite and the paid layer (pro/).
# No npm dependencies, so no install step: pro/ imports packages/billing's and
# packages/admin-metrics' TypeScript through Node 22's type stripping. Read-only; reads no secret values.
name: einvoice-pro-ci
on:
  pull_request:
    paths:
      - "apps/einvoice-preflight/**"
      # The app's plans are tested against the site's pricing (pro/plans.test.mjs).
      - "apps/einvoice-site/content/pricing.mjs"
      - "packages/billing/**"
      - "packages/admin-metrics/**"
      - ".github/workflows/einvoice-pro-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/einvoice-preflight/**"
      - "apps/einvoice-site/content/pricing.mjs"
      - "packages/billing/**"
      - "packages/admin-metrics/**"
      - ".github/workflows/einvoice-pro-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einvoice-pro-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/einvoice-preflight

jobs:
  test:
    name: einvoice-preflight checker + paid layer tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            .github
            apps/einvoice-preflight
            apps/einvoice-site
            packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Paid layer (fixes re-validate, explanations, API, tenant isolation)
        run: node --test pro/*.test.mjs
      - name: Worker deploy provisioning (config, wrangler output)
        run: node --test worker/*.test.mjs
      - name: Imported checker suite
        run: node --test --test-concurrency=4 *.test.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Python CLI tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests
