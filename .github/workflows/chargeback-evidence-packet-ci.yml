name: chargeback-evidence-packet CI

on:
  pull_request:
    paths:
      - "ventures/chargeback-evidence-packet/**"
      - ".github/workflows/chargeback-evidence-packet-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/chargeback-evidence-packet/**"
      - ".github/workflows/chargeback-evidence-packet-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chargeback-evidence-packet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ventures/chargeback-evidence-packet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs chargeback-evidence-packet
