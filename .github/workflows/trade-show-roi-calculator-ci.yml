name: trade-show-roi-calculator CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared parse/model
# engine, `cli.mjs` is the Node gate (with its own directory-walking tests
# against a real temp filesystem), and `page.test.mjs` covers the page wiring
# (including dogfooding: the venture's own worked example must demonstrate
# a real gain through this venture's own engine). Keep all three covered
# independently of the portfolio-wide validation workflow, which only checks
# published pages and does not run venture unit tests. Without this file,
# `validate_workflows.py` would fail the moment the venture's `*.test.mjs`
# files land -- the same hole `structured-data-drift-check-ci.yml` documents.
on:
  pull_request:
    paths:
      - "ventures/trade-show-roi-calculator/**"
      - ".github/workflows/trade-show-roi-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/trade-show-roi-calculator/**"
      - ".github/workflows/trade-show-roi-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade-show-roi-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/trade-show-roi-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
