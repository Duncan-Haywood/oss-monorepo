# Weekly GitHub release listing the tools launched in the last 7 days.
# Off by default: with vars.DISTRIBUTE_RELEASES unset this only prints a dry run.
# Free API, no paid spend, no commits pushed. Spec: portfolio/distribution/README.md
name: distribute-releases
on:
  schedule:
    - cron: '17 16 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  announce:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node platform/distribution/releases.mjs
        env:
          DISTRIBUTE_RELEASES: ${{ vars.DISTRIBUTE_RELEASES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
