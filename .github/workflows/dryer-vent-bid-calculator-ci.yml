name: dryer-vent-bid-calculator CI

# Test runner for the browser-local dryer vent bid calculator.
# The product is static ES modules with no build step and no
# dependencies, so this does no more than a contributor runs locally:
# `node --test`. It publishes nothing, registers nothing, and spends
# no API budget — it is not the unattended-automation kind of
# workflow CLAUDE.md gates.
#
# Same shape as janitorial-bid-calculator-ci.yml.

on:
  pull_request:
    paths:
      - "ventures/dryer-vent-bid-calculator/**"
      - ".github/workflows/dryer-vent-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/dryer-vent-bid-calculator/**"
      - ".github/workflows/dryer-vent-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: dryer-vent-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/dryer-vent-bid-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
