name: ci-test-shard-balancer CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared JUnit parsing and
# shard-partitioning engine, `cli.mjs` is the Node gate, and `page.test.mjs`
# covers the page wiring. Keep all three covered independently of the
# portfolio-wide validation workflow, which only checks published pages and does
# not run venture unit tests. Without this file, `validate_workflows.py` would
# fail the moment the venture's `*.test.mjs` files land -- the same hole
# `aws-bill-change-explainer-ci.yml` documents.
on:
  pull_request:
    paths:
      - "ventures/ci-test-shard-balancer/**"
      - ".github/workflows/ci-test-shard-balancer-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ci-test-shard-balancer/**"
      - ".github/workflows/ci-test-shard-balancer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-test-shard-balancer-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/ci-test-shard-balancer

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
