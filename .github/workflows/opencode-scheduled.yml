name: OpenCode scheduled agents

# OpenCode via GitHub Copilot subscription (Pro/Pro+/Business/Enterprise) OAuth,
# NOT OpenCode's own Zen gateway (opencode/* models bill metered credits, not a
# subscription) and not a raw provider API key.
# Seed OPENCODE_AUTH from ~/.local/share/opencode/auth.json after authenticating
# to the "GitHub Copilot" provider in `opencode auth login` (device-code flow).
# Runs both repo prompts hourly (stagger :20).

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work
      model:
        description: OpenCode provider/model id
        required: false
        default: github-copilot/gpt-5.5

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        run: |
          kind="${{ github.event.inputs.prompt_kind || 'both' }}"
          if [ "$kind" = "both" ] || [ "$kind" = "" ]; then
            echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
          else
            echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
          fi

  opencode:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: opencode-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore OpenCode OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/opencode/auth.json
          key: opencode-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            opencode-oauth-auth-

      - name: Seed OpenCode OAuth auth.json
        env:
          OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.local/share/opencode"
          .github/scripts/restore-oauth-auth.sh "$HOME/.local/share/opencode/auth.json" OPENCODE_AUTH

      - name: Prepare prompt
        id: prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "opencode" \
            "${{ matrix.prompt_kind }}"
          PROMPT_PATH="${RUNNER_TEMP:-/tmp}/agent-prompt.md"
          {
            echo "body<<PROMPT_EOF"
            cat "$PROMPT_PATH"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run OpenCode (GitHub Copilot subscription OAuth)
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ github.event.inputs.model || 'github-copilot/gpt-5.5' }}
          prompt: ${{ steps.prompt.outputs.body }}
          use_github_token: true

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/opencode/auth.json
          key: opencode-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
