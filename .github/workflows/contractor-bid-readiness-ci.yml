name: contractor-bid-readiness CI

# Dependency-free browser checklist. Keep readiness arithmetic covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/contractor-bid-readiness/**"
      - ".github/workflows/contractor-bid-readiness-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/contractor-bid-readiness/**"
      - ".github/workflows/contractor-bid-readiness-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contractor-bid-readiness-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/contractor-bid-readiness

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checklist tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs contractor-bid-readiness
