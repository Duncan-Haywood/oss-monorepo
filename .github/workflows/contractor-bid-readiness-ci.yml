name: contractor-bid-readiness CI

# Dependency-free browser checklist. Keep readiness arithmetic covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/contractor-bid-readiness/**"
      - ".github/workflows/contractor-bid-readiness-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/contractor-bid-readiness/**"
      - ".github/workflows/contractor-bid-readiness-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contractor-bid-readiness-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/contractor-bid-readiness

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run checklist tests
        run: node --test
