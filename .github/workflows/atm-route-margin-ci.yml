name: atm-route-margin CI

# Dependency-free browser tool: plain ES modules, no build step, so this runs
# exactly what a contributor runs locally (`node --test`) and nothing else. It
# publishes nothing, registers nothing, and spends no API budget.
#
# Added 2026-09-07, with ten siblings. Every venture here gets its own
# workflow because the portfolio-wide workflows do not run venture unit tests:
# `portfolio-validate.yml` checks structure and markup, `proposal-module-ci.yml`
# runs only `ventures/*/proposal.test.mjs`, and nothing else executes
# `node --test` inside a venture. This venture shipped without one, so its
# unit tests ran on contributors' machines and in no CI job at all.
# `validate_workflows.py` invariant 7 now fails when that happens again.
on:
  pull_request:
    paths:
      - "ventures/atm-route-margin/**"
      - ".github/workflows/atm-route-margin-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/atm-route-margin/**"
      - ".github/workflows/atm-route-margin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atm-route-margin-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/atm-route-margin

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the venture's tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs atm-route-margin
