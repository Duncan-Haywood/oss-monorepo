# Builds unsigned offline desktop apps (Tauri v2) for one venture or one catalogue
# suite on macOS, Windows and Linux runners and attaches them to a pre-release.
# Manual only, and off unless the repository variable DISTRIBUTE_DESKTOP is 'true'.
# No paid API, no commits pushed, no secrets read: signing and notarisation are
# owner steps (see the generated BUILD.md). Spec: portfolio/distribution/README.md
name: distribute-desktop
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'A venture slug or a suite id (node platform/distribution/desktop.mjs --suites lists them)'
        required: true
        default: 'research-algorithms'
permissions:
  contents: read
concurrency:
  group: distribute-desktop-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  build:
    if: vars.DISTRIBUTE_DESKTOP == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: msi,nsis
          # 22.04 so the AppImage runs on older glibc too.
          - os: ubuntu-22.04
            bundles: appimage,deb
    # Off the CI_RUNNER switch: macOS and Windows installers need those runners
    # (gitops/tests/test_ci_runner.py, OS_MATRIX_JOBS).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev file
      - name: Generate the Tauri project
        run: node platform/distribution/desktop.mjs --build "$TARGET" "$RUNNER_TEMP/desktop"
      - name: Build unsigned installers
        working-directory: ${{ runner.temp }}/desktop/${{ inputs.target }}
        run: |
          rustup update stable --no-self-update
          npm install --no-audit --no-fund
          npx tauri build --bundles "${{ matrix.bundles }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/desktop/${{ inputs.target }}/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/desktop/${{ inputs.target }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ runner.temp }}/desktop/${{ inputs.target }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/desktop/${{ inputs.target }}/src-tauri/target/release/bundle/appimage/*.AppImage
            ${{ runner.temp }}/desktop/${{ inputs.target }}/src-tauri/target/release/bundle/deb/*.deb

  release:
    needs: build
    if: vars.DISTRIBUTE_DESKTOP == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARGET: ${{ inputs.target }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/out
          merge-multiple: true
      - name: Create the pre-release and attach installers
        run: |
          set -euo pipefail
          tag="desktop-${TARGET}-${GITHUB_RUN_NUMBER}"
          cd "$RUNNER_TEMP/out"
          shopt -s nullglob
          files=(*.dmg *.msi *.exe *.AppImage *.deb)
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat > notes.md <<EOF
          Unsigned offline desktop builds of \`${TARGET}\`, generated by \`platform/distribution/desktop.mjs\` at ${GITHUB_SHA}.

          macOS shows an "unverified developer" warning (right-click > Open once); Windows SmartScreen asks once (More info > Run anyway). Nothing here reaches the network. Checksums are in SHA256SUMS.txt.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Desktop apps: ${TARGET} (unsigned, run ${GITHUB_RUN_NUMBER})" --notes-file notes.md \
            "${files[@]}" SHA256SUMS.txt
      - name: Attach winget manifests for the .msi
        run: |
          set -euo pipefail
          tag="desktop-${TARGET}-${GITHUB_RUN_NUMBER}"
          shopt -s nullglob
          msis=("$RUNNER_TEMP"/out/*.msi)
          if [ ${#msis[@]} -eq 0 ]; then echo "no .msi (the Windows build failed?); no winget manifests"; exit 0; fi
          msi="${msis[0]}"
          name=$(basename "$msi")
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${name// /.}"
          node platform/distribution/desktop.mjs --winget "$TARGET" "$url" "$(sha256sum "$msi" | cut -d' ' -f1)" "$RUNNER_TEMP/winget"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP"/winget/*.yaml
