name: ny-llc-transparency-act-tracker CI

# Zero-dependency browser tool: `calc.mjs` is the shared classification,
# deadline, and worksheet-organizer logic; `page.test.mjs` covers the
# entry page's structure, disclaimers, and privacy posture, pinned against
# the real calc functions. Keep all three covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests. Without this file, `validate_workflows.py`
# would fail the moment the venture's `*.test.mjs` files land -- the same
# hole `call-recording-consent-check-ci.yml` and `hoa-reserve-fund-calculator-ci.yml`
# already document.
on:
  pull_request:
    paths:
      - "ventures/ny-llc-transparency-act-tracker/**"
      - ".github/workflows/ny-llc-transparency-act-tracker-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ny-llc-transparency-act-tracker/**"
      - ".github/workflows/ny-llc-transparency-act-tracker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ny-llc-transparency-act-tracker-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/ny-llc-transparency-act-tracker

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run every test in the venture
        run: node --test
