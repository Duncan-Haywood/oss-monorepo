name: security-txt-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared RFC 9116
# parsing and rule set; `fetch-url.mjs` is the real network layer (tested
# against a local loopback server only, so this job needs no egress);
# `check.mjs` is the CLI entry point; `page.test.mjs` covers all three pages'
# structure and disclaimers, and pins the worked example against the real
# engine. Keep all five covered independently of the portfolio-wide validation
# workflow, which only checks published pages and does not run venture unit
# tests. Without this file, `validate_workflows.py` would fail the moment the
# venture's `*.test.mjs` files land -- the same hole
# `sitemap-lastmod-freshness-check-ci.yml` and `cors-misconfig-check-ci.yml`
# already document.
#
# One thing this job cannot catch, recorded here because it is the venture's
# own subject matter: the engine's `now` is always an argument and every test
# pins it, so the suite does not start failing on a date. A checker for
# expiry that expires would be a poor advertisement.
on:
  pull_request:
    paths:
      - "ventures/security-txt-check/**"
      - ".github/workflows/security-txt-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/security-txt-check/**"
      - ".github/workflows/security-txt-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-txt-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/security-txt-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, network layer, CLI, usage, and page-wiring tests
        run: node --test engine.test.mjs fetch-url.test.mjs check.test.mjs usage.test.mjs page.test.mjs
