name: cloud-egress-calculator CI

# Static browser-local calculator: plain ES modules, node --test, no
# package.json, no dependencies, no network.
# calc.mjs is storage / request / egress arithmetic; usage.mjs is the
# anonymous local counter. Each has a sibling *.test.mjs.

on:
  pull_request:
    paths:
      - "ventures/cloud-egress-calculator/**"
      - ".github/workflows/cloud-egress-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/cloud-egress-calculator/**"
      - ".github/workflows/cloud-egress-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-egress-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/cloud-egress-calculator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
