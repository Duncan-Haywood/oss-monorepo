name: cloud-egress-calculator CI

# Static browser-local calculator: plain ES modules, node --test, no
# package.json, no dependencies, no network.
# calc.mjs is storage / request / egress arithmetic; usage.mjs is the
# anonymous local counter. Each has a sibling *.test.mjs.

on:
  pull_request:
    paths:
      - "ventures/cloud-egress-calculator/**"
      - ".github/workflows/cloud-egress-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/cloud-egress-calculator/**"
      - ".github/workflows/cloud-egress-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-egress-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/cloud-egress-calculator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause and a
      # best-effort/no-SLA clause on every hosted page. Neither is visible to
      # this venture's own suite -- the clauses matter because the page gets
      # published, and the venture does not know it is being published. That
      # gap turned main red twice in two days (#1747, and again on the
      # sewer-line merge), each time in the Pages job rather than in the CI of
      # the venture that broke it. Checked here so the venture that needs the
      # clause is the one that goes red.
      - name: Published pages carry both liability clauses
        working-directory: .
        run: node platform/pages/clauses.mjs cloud-egress-calculator
