name: npm-provenance-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared parsing and
# report-building logic, `cli.mjs` is the Node gate, and `page.test.mjs`
# covers the page wiring. Keep all three covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests -- the same hole npm-lifecycle-script-check-ci.yml
# documents, and validate_workflows.py requires this file the moment the
# venture's *.test.mjs files land.
on:
  pull_request:
    paths:
      - "ventures/npm-provenance-check/**"
      - ".github/workflows/npm-provenance-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/npm-provenance-check/**"
      - ".github/workflows/npm-provenance-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-provenance-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/npm-provenance-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests (no live network calls)
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
