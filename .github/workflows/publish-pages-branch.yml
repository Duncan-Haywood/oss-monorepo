# Keeps the `gh-pages` branch snapshot in step with `main`.
#
# Why this exists
# ---------------
# There are two GitHub Pages routes in this repository and they are served by
# different mechanisms:
#
#   - `portfolio-pages.yml` publishes through `actions/deploy-pages`. That is
#     the "GitHub Actions" Pages source, gated on `vars.PAGES_ENABLED`.
#   - `platform/pages/publish-branch.sh` commits the same built artifact to an
#     orphan `gh-pages` branch, for the "Deploy from a branch" source. That
#     route is downstream of neither an Actions runner nor the k3s cluster,
#     which is why `platform/ci/pages_state.py` recommends it while both are
#     down.
#
# The branch route has one cost, stated plainly in `publish-branch.sh`'s own
# header: a committed artifact is a snapshot, so **nothing refreshes it when
# `main` moves**. Until this workflow existed, the only thing keeping it
# current was a session remembering to run the script by hand after a merge --
# and CLAUDE.md's instruction to do so was already being missed. The snapshot
# was found stale on 2026-09-06 (built from 1afe50c5 while `main` was at
# 565cc635).
#
# That is a quiet failure. If the owner has flipped Settings -> Pages -> Source
# to `gh-pages / (root)`, a stale snapshot is not a staging detail: it is the
# live site silently lagging `main`, with nothing anywhere turning red to say
# so. This workflow closes that hole.
#
# Why it ships switched off
# -------------------------
# CLAUDE.md, "Automation": *do not add or re-enable unattended workflows that
# push commits without owner approval.* Pushing a generated artifact to a
# dedicated orphan branch is a deploy rather than a source commit -- it is the
# same act `actions/deploy-pages` already performs in `portfolio-pages.yml` --
# but it is still a push, so it is gated the same way that workflow's deploy
# is, on an owner-set configuration variable.
#
# With `vars.PAGES_BRANCH_PUBLISH` unset (the default), this workflow **builds
# and verifies the artifact and pushes nothing**. That is deliberately useful
# on its own: `check.mjs` runs against the built output, so a dead link or a
# stale canonical introduced by the copy step turns this red at merge time
# rather than after a crawler has read it. Setting the variable to `true` is
# the owner's one flip that makes the branch self-refreshing.
#
# Not `GITHUB_PAGES_BRANCH_PUBLISH`: GitHub reserves the `GITHUB_` prefix and
# refuses to create a configuration variable carrying it, so such a gate would
# read as unset forever. `portfolio-pages.yml` shipped exactly that bug, and
# `platform/ci/validate_workflows.py` invariant 5 now fails any workflow that
# reintroduces it.
name: Publish Pages branch

on:
  push:
    branches: [main]
    # The same inputs `platform/pages/build.mjs` reads. It walks `ventures/`
    # for surfaces (via its own ENTRY_OVERRIDES) and takes everything else
    # from `platform/pages/`; it does not read `platform/marketing/`, whose
    # generated pages land inside `ventures/` and so are already covered here.
    paths:
      # The development analyses (platform/devlog/) read the prompt system's
      # logs and reports and the portfolio studies, so a new report or run
      # record republishes them.
      - "platform/devlog/**"
      # The writing section (platform/pages/writing.mjs) renders docs/posts/.
      - "docs/posts/**"
      - "prompts/**"
      - "portfolio/research/**"
      - "ventures/**"
      - "platform/pages/**"
      - "research/_homepage/**"
      - "research/README.md"
      # The engineering status page (`platform/pages/engineering.mjs`) reads
      # these: a run record lands with nearly every PR, so the page tracks main.
      - "research/*/LOG.md"
      - "prompts/runs/**"
      - "prompts/derived/**"
      - "prompts/process/backlog/**"
      - "portfolio/ledger/asks.yaml"
      - ".github/workflows/publish-pages-branch.yml"
      # The development dashboard reads run records and its own code.
      - "prompts/runs/**"
      - "platform/devstats/**"
  # The dashboard's CI, review and branch numbers move without a merge to
  # these paths; refresh them every three hours. Publishing is still gated on
  # vars.PAGES_BRANCH_PUBLISH below.
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

# One publisher at a time, repository-wide rather than per-ref: every run
# force-pushes the same branch, so two overlapping merges racing here could
# leave `gh-pages` built from the older of the two.
#
# `cancel-in-progress: false` on purpose. Cancelling the queued run of a newer
# merge would leave the branch permanently behind `main` with a green check --
# the precise failure this workflow exists to prevent.
concurrency:
  group: publish-pages-branch
  cancel-in-progress: false

permissions:
  contents: write
  # Read-only, for the development dashboard's PR, review and CI metrics.
  actions: read
  pull-requests: read

jobs:
  publish:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    # The build is ~2000 files and `check.mjs` crawls the whole artifact for
    # dead links; it takes a couple of minutes on a warm runner. Fifteen is
    # generous without letting a wedged build ride the 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history for the engineering page's "landed on main" view.
          # Depth 1 would still build; the page would say history is missing.
          fetch-depth: 400

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `publish-branch.sh` builds its commit with `git commit-tree`, which
      # needs a committer identity. `actions/checkout` does not set one, so
      # without this the script dies on "Committer identity unknown" *after*
      # a full build -- a slow way to discover a two-line omission.
      - name: Configure the committer identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Two mutually exclusive steps rather than one step with the gate in an
      # `env:` expression. Exactly one of them runs, so the site is built once
      # either way -- and the gate is a real `if:`, which matters for more than
      # legibility: `platform/ci/publish_surface.py` derives "what does a merge
      # to main publish?" from job- and step-level `if:` conditions only. A
      # publish gated inside an `env:` expression reads to that tool as an
      # *ungated* one, so this workflow would have been classified `live` --
      # a false claim that a merge publishes unconditionally, in the one tool
      # the repo uses to answer that question.
      - name: Build and verify the snapshot (publishing off)
        if: vars.PAGES_BRANCH_PUBLISH != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIRM: publish-pages-branch
          PUSH: "0"
        run: ./platform/pages/publish-branch.sh

      - name: Build, verify, and publish the snapshot
        if: vars.PAGES_BRANCH_PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONFIRM: publish-pages-branch
          PUSH: "1"
        run: ./platform/pages/publish-branch.sh

      # `publish-branch.sh` announces the snapshot itself, in
      # `announce_to_indexnow`, immediately after the push it just made. Both
      # steps above invoke that script, so this workflow announces on a real
      # publish -- through the one definition of "publishing includes
      # announcing" instead of a second copy. That de-duplication (#4379) was
      # right, and the step below is its exact complement rather than a
      # reversal of it.
      #
      # **Why a step is needed here anyway, measured 2026-09-11.** Folding the
      # announcement into the push path made it reachable only on a run that
      # *pushes*, and on this repository's actual configuration no such run
      # exists:
      #
      #   - `vars.PAGES_BRANCH_PUBLISH` is not `true`, so the two steps above
      #     resolve to the PUSH=0 one and this workflow never reaches
      #     `announce_to_indexnow`. Read from evidence rather than from the
      #     variable, which a workflow cannot print: every commit on `gh-pages`
      #     is authored `CI <ci@example.com>`, an agent session's identity, and
      #     none by `github-actions[bot]`. The branch is kept current by hand.
      #   - the by-hand route pushes, so it *does* call the script's announce --
      #     from an agent sandbox, whose egress proxy answers `403 to CONNECT`
      #     for `api.indexnow.org`. It exits `EXIT_NO_EGRESS` every time,
      #     correctly and without announcing anything.
      #
      # So between them the two routes cover every publish and announce none of
      # them: the route with egress never reaches the call, and the route that
      # reaches the call has no egress. Verified against run history -- every
      # `Publish Pages branch` run since IndexNow landed in #4366 came back
      # `runner_id: 0` in 3-5s, so the runner route has not executed a step at
      # all, let alone this one.
      #
      # This step closes that by announcing what is *live* rather than what
      # this run built, which is the correct subject either way and the only
      # available one when the run did not push. It is gated on the exact
      # complement of the publish above, so precisely one of the two announces
      # and re-introducing a double-submit is not possible: with the variable
      # `true` the script announces what it pushed and this is skipped; with it
      # unset this announces the snapshot a session pushed and the script is
      # never reached.
      #
      # Not gated on owner approval, deliberately. CLAUDE.md's "Automation"
      # rule covers unattended workflows that *push commits* or *spend paid API
      # budget*; this pushes nothing and IndexNow is free. It tells search
      # engines that already-public URLs exist -- the ordinary SEO act this
      # catalogue has been unable to perform since it shipped.
      - name: Announce the live snapshot to IndexNow
        if: vars.PAGES_BRANCH_PUBLISH != 'true'
        env:
          # Fail the step on a genuine refusal (an invalid or unpublished key
          # file is a real defect that would silently cost every submission),
          # but not on `EXIT_NO_EGRESS` -- a host that cannot reach IndexNow
          # has broken nothing, and the site is published either way.
          EXIT_NO_EGRESS: "3"
        run: |
          # `actions/checkout` fetches only the pushed ref, and both
          # `indexnow.mjs --ref gh-pages` and `published-base-url.mjs` read the
          # *local* ref by name (`git show gh-pages:...`). Fetch it as a local
          # branch so they see the real serving snapshot rather than reporting
          # `assumed-default`.
          # `--depth=1` only when the clone is already shallow. A `--depth`
          # fetch writes `.git/shallow` and truncates the whole repository, not
          # just `gh-pages` -- free on a runner (checkout is depth 1 anyway),
          # destructive on a full clone. Same guard as
          # `portfolio-validate.yml`'s base-ref fetch.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            fetch_gh_pages() { git fetch --depth=1 origin gh-pages:gh-pages; }
          else
            fetch_gh_pages() { git fetch origin gh-pages:gh-pages; }
          fi
          if ! fetch_gh_pages; then
            echo "::notice::gh-pages is not published yet; nothing to announce."
            exit 0
          fi

          status=0
          node platform/marketing/indexnow.mjs --submit --ref gh-pages || status=$?

          case "${status}" in
            0)
              echo "### IndexNow notified" >> "${GITHUB_STEP_SUMMARY}"
              echo "" >> "${GITHUB_STEP_SUMMARY}"
              echo "The live \`gh-pages\` snapshot was announced to IndexNow-participating" >> "${GITHUB_STEP_SUMMARY}"
              echo "engines. Accepted means *asked*, not indexed -- there is no confirmation" >> "${GITHUB_STEP_SUMMARY}"
              echo "API, and Google does not participate (Search Console is still the owner's)." >> "${GITHUB_STEP_SUMMARY}"
              ;;
            "${EXIT_NO_EGRESS}")
              echo "::notice::This runner has no egress to api.indexnow.org; nothing was submitted and nothing broke."
              echo "### IndexNow not reached" >> "${GITHUB_STEP_SUMMARY}"
              echo "" >> "${GITHUB_STEP_SUMMARY}"
              echo "The request never left the runner, so nothing was submitted. The site is" >> "${GITHUB_STEP_SUMMARY}"
              echo "published regardless." >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "::error::IndexNow refused the submission -- see the log above. This is a real" \
                   "defect in the payload or the published key file, not an environment limit."
              exit "${status}"
              ;;
          esac
      - name: Say what happened
        if: always()
        env:
          PUBLISHED: ${{ vars.PAGES_BRANCH_PUBLISH == 'true' }}
        run: |
          {
            if [ "${PUBLISHED}" = 'true' ]; then
              echo "### gh-pages refreshed from \`${GITHUB_SHA}\`"
              echo
              echo "The branch snapshot now matches this commit. If Settings ->"
              echo "Pages -> Source is \`gh-pages / (root)\`, the live site is current."
            else
              echo "### Built and verified; nothing pushed"
              echo
              echo "\`vars.PAGES_BRANCH_PUBLISH\` is not \`true\`, so this run checked the"
              echo "artifact and stopped. The \`gh-pages\` branch is unchanged and may be"
              echo "behind \`main\` -- \`platform/ci/pages_state.py\` reports which."
              echo
              echo "To make the branch self-refreshing, set the repository variable"
              echo "\`PAGES_BRANCH_PUBLISH\` to \`true\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
