name: actions-transitive-pin-check CI

# Zero-dependency CLI/browser tool (Node only — no Python half like its
# sibling pinned-actions-check). Keep it covered independently of the
# portfolio-wide validation workflow, which only checks published pages and
# does not run venture unit tests.
on:
  pull_request:
    paths:
      - "ventures/actions-transitive-pin-check/**"
      - ".github/workflows/actions-transitive-pin-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/actions-transitive-pin-check/**"
      - ".github/workflows/actions-transitive-pin-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-transitive-pin-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/actions-transitive-pin-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run classifier and transitive-analysis unit tests
        run: node --test classify.test.mjs analyze.test.mjs usage.test.mjs
      - name: Run CLI tests (--no-network only — no live network calls in CI)
        run: node --test check.test.mjs
      - name: Run page tests (disclaimers, SEO metadata, sitemap coverage, sibling links)
        run: node --test page.test.mjs
