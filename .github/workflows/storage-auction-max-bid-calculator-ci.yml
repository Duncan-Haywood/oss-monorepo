name: storage-auction-max-bid-calculator CI

# Zero-dependency browser calculator: `calc.mjs` holds the arithmetic and is
# imported by the page rather than restated in it; `share.mjs` derives its
# field list from `calc.mjs`'s own DEFAULTS so a new input becomes shareable
# the moment it exists; `usage.mjs` is the opt-out-respecting local counter.
# `calc.test.mjs`, `page.test.mjs` and `usage.test.mjs` cover all three
# independently of the portfolio-wide validation workflow, which only checks
# published pages and does not run venture unit tests. Without this file,
# `validate_workflows.py` fails the moment the venture's `*.test.mjs` files
# land -- the same hole `sql-migration-lock-check-ci.yml` and
# `redirect-chain-check-ci.yml` already document.
#
# The break-even/target-margin split is the part most worth running on every
# change, and for the same reason those sibling workflows give: its bugs are
# silent. A miscalculated max bid produces a confident wrong ceiling for
# money someone is about to raise a hand for at auction, and a bid that is
# quietly too high is indistinguishable from a safe one until the buyer's
# premium invoice arrives. `calc.test.mjs` pins the cases that separate the
# real cost stack from the flat percent-of-value rule of thumb, including the
# pair showing the rule is wrong in both directions (overshoot on a
# cost-heavy unit, undershoot on a cheap-to-clean one).
on:
  pull_request:
    paths:
      - "ventures/storage-auction-max-bid-calculator/**"
      - ".github/workflows/storage-auction-max-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/storage-auction-max-bid-calculator/**"
      - ".github/workflows/storage-auction-max-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-auction-max-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/storage-auction-max-bid-calculator

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run arithmetic, page-wiring and usage tests
        run: node --test calc.test.mjs page.test.mjs usage.test.mjs
