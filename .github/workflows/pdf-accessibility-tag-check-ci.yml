name: pdf-accessibility-tag-check CI

# Zero-dependency CLI/browser tool: `pdf-parser.mjs` is the lenient
# byte-level PDF object scanner, `engine.mjs` is the shared, independently-
# tested accessibility-structure checking logic, `check.mjs` is the CLI
# entry point (also exercised via real subprocess runs in check.test.mjs),
# and `inflate-node.mjs`/`inflate-browser.mjs` are the two environment-
# specific FlateDecode implementations the engine takes as an injected
# argument. Keep all of it covered independently of the portfolio-wide
# validation workflow, which only checks published pages and does not run
# venture unit tests. Without this file, `validate_workflows.py` would fail
# the moment the venture's `*.test.mjs` files land -- the same hole
# `env-example-drift-check-ci.yml` and `cors-misconfig-check-ci.yml`
# document.
on:
  pull_request:
    paths:
      - "ventures/pdf-accessibility-tag-check/**"
      - ".github/workflows/pdf-accessibility-tag-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/pdf-accessibility-tag-check/**"
      - ".github/workflows/pdf-accessibility-tag-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-accessibility-tag-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/pdf-accessibility-tag-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- see cors-misconfig-check-ci.yml's
      # comment on this same step for why a bare `node --test` (which walks
      # the whole working directory) is preferred over naming files.
      - name: Run every test in the venture
        run: node --test
