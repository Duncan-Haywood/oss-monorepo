name: fifo-pick-evidence CI

# Standard-library Python CLI. Keep FIFO exception arithmetic covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/fifo-pick-evidence/**"
      - ".github/workflows/fifo-pick-evidence-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/fifo-pick-evidence/**"
      - ".github/workflows/fifo-pick-evidence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fifo-pick-evidence-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/fifo-pick-evidence

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run FIFO checker tests
        run: python3 -m unittest -v
      - name: Example CSV produces a report
        # fifo_pick_evidence.py exits 1 by design when it finds an
        # observation -- the bundled example deliberately contains one FIFO
        # exception, so a plain `run:` here failed on every green run. Only
        # an exit above 1 (a crash, or argparse rejecting bad input) is a
        # real CI failure.
        run: |
          set +e
          python3 fifo_pick_evidence.py examples/picks.csv --format json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "unexpected exit code $status" >&2
            exit 1
          fi

  # Added 2026-09-07. The venture began as a Python CLI and later gained a
  # browser page with its own `*.test.mjs` suites; this workflow was never
  # widened, and no portfolio-wide workflow runs `node --test` inside a
  # venture, so those assertions ran in no CI job at all. CLAUDE.md records
  # "a CLI acquiring a page" as a routine event here, which is exactly why
  # the gap is easy to miss. `validate_workflows.py` invariant 7 now fails
  # when a venture ships `*.test.mjs` that no workflow runs.
  page-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the page module tests
        run: node --test
