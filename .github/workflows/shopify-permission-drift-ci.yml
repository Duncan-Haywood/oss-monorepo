name: shopify-permission-drift CI

on:
  pull_request:
    paths:
      - "ventures/shopify-permission-drift/**"
      - ".github/workflows/shopify-permission-drift-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/shopify-permission-drift/**"
      - ".github/workflows/shopify-permission-drift-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-permission-drift-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/shopify-permission-drift

jobs:
  cli-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ventures/shopify-permission-drift/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause on every published
      # page, and it is the half build.mjs cannot inject: what a tool is not
      # advice *about* is written in the venture's own voice. So it stays the
      # venture's to get right -- but nothing showed the author that until the
      # Pages job went red on main, after the merge, naming a workflow they
      # never touched. Checked here so the venture that needs the clause is the
      # one that goes red, before the merge.
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs shopify-permission-drift

