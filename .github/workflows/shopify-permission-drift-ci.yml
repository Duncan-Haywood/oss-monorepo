name: shopify-permission-drift CI

on:
  pull_request:
    paths:
      - "ventures/shopify-permission-drift/**"
      - ".github/workflows/shopify-permission-drift-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/shopify-permission-drift/**"
      - ".github/workflows/shopify-permission-drift-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-permission-drift-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/shopify-permission-drift

jobs:
  cli-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  site-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/shopify-permission-drift/site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test

