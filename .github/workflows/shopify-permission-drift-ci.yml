name: shopify-permission-drift CI

on:
  pull_request:
    paths:
      - "ventures/shopify-permission-drift/**"
      - ".github/workflows/shopify-permission-drift-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/shopify-permission-drift/**"
      - ".github/workflows/shopify-permission-drift-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopify-permission-drift-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/shopify-permission-drift

jobs:
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  site-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventures/shopify-permission-drift/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
