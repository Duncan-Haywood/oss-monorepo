name: etsy-profit-calculator CI

# The venture is a static, browser-local calculator: plain ES modules run with
# node's built-in test runner, no package.json, no dependencies, no network.
# calc.mjs is the fee arithmetic, usage.mjs the anonymous local counter, and
# share.mjs the URL <-> inputs transform behind the save/share feature. Each
# has a sibling *.test.mjs; without this runner they could rot while the page
# still ships them.

on:
  pull_request:
    paths:
      - "ventures/etsy-profit-calculator/**"
      - ".github/workflows/etsy-profit-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/etsy-profit-calculator/**"
      - ".github/workflows/etsy-profit-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: etsy-profit-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/etsy-profit-calculator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
      # PRODUCT_PLAYBOOK.md 5b requires a no-warranty clause and a
      # best-effort/no-SLA clause on every hosted page. Neither is visible to
      # this venture's own suite -- the clauses matter because the page gets
      # published, and the venture does not know it is being published. That
      # gap turned main red twice in two days (#1747, and again on the
      # sewer-line merge), each time in the Pages job rather than in the CI of
      # the venture that broke it. Checked here so the venture that needs the
      # clause is the one that goes red.
      - name: Published pages carry both liability clauses
        working-directory: .
        run: node platform/pages/clauses.mjs etsy-profit-calculator
