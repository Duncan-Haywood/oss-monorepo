name: sitemap-lastmod-freshness-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared parsing,
# validation, and classification logic; `fetch-url.mjs` is the real network
# layer (tested against a local loopback server only); `check.mjs` is the CLI
# entry point; `page.test.mjs` covers all three pages' structure and
# disclaimers. Keep all four covered independently of the portfolio-wide
# validation workflow, which only checks published pages and does not run
# venture unit tests. Without this file, `validate_workflows.py` would fail
# the moment the venture's `*.test.mjs` files land -- the same hole
# `hreflang-reciprocity-check-ci.yml`, `structured-data-drift-check-ci.yml`
# and `cors-misconfig-check-ci.yml` already document.
on:
  pull_request:
    paths:
      - "ventures/sitemap-lastmod-freshness-check/**"
      - ".github/workflows/sitemap-lastmod-freshness-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/sitemap-lastmod-freshness-check/**"
      - ".github/workflows/sitemap-lastmod-freshness-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitemap-lastmod-freshness-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/sitemap-lastmod-freshness-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run engine, network layer, CLI, usage, and page-wiring tests
        run: node --test engine.test.mjs fetch-url.test.mjs check.test.mjs usage.test.mjs page.test.mjs
