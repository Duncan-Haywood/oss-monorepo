name: hood-cleaning-bid-calculator CI

# Test runner for the browser-local kitchen hood cleaning bid calculator.
# The product is static ES modules with no build step and no dependencies,
# so this does no more than a contributor runs locally: `node --test`.
# It publishes nothing, registers nothing, and spends no API budget.

on:
  pull_request:
    paths:
      - "ventures/hood-cleaning-bid-calculator/**"
      - ".github/workflows/hood-cleaning-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/hood-cleaning-bid-calculator/**"
      - ".github/workflows/hood-cleaning-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hood-cleaning-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/hood-cleaning-bid-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
