name: vendor-change-evidence CI

# Standard-library Python CLI. Keep snapshot-diff status covered
# independently of the portfolio-wide validation workflow.
on:
  pull_request:
    paths:
      - "ventures/vendor-change-evidence/**"
      - ".github/workflows/vendor-change-evidence-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/vendor-change-evidence/**"
      - ".github/workflows/vendor-change-evidence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-change-evidence-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/vendor-change-evidence

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run snapshot-diff tests
        run: python3 -m unittest discover -s tests -v
      - name: Example snapshots produce a report
        run: python3 src/vendor_change.py examples/before.json examples/after.json --format markdown

  # Added 2026-09-07. This venture started as a Python tool and later gained a
  # browser page with its own `*.test.mjs` suites, but the workflow was never
  # widened and no portfolio-wide workflow runs `node --test` inside a venture
  # -- so those assertions ran in no CI job at all. `validate_workflows.py`
  # invariant 7 now fails when a venture ships `*.test.mjs` that nothing runs.
  page-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run the page module tests
        run: node --test
