name: grant-deadline-tracker CI

# Static browser-local tracker: plain ES modules, node --test, no
# package.json, no dependencies, no network.
# calc.mjs is deadline and balance arithmetic; usage.mjs is the anonymous
# local counter. Each has a sibling *.test.mjs.

on:
  pull_request:
    paths:
      - "ventures/grant-deadline-tracker/**"
      - ".github/workflows/grant-deadline-tracker-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/grant-deadline-tracker/**"
      - ".github/workflows/grant-deadline-tracker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grant-deadline-tracker-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/grant-deadline-tracker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run module tests
        run: node --test
