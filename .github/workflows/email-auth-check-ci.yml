name: email-auth-check CI

# Zero-dependency CLI/browser tool: `analyze.mjs` is the shared,
# independently-tested SPF/DKIM/DMARC/BIMI classification engine (fixture
# DNS responses only, no network), `lookup.mjs` is the DNS-over-HTTPS
# network layer (tested against an injected fake transport, never the real
# internet), `cli.mjs` is the CLI entry point, and `page.test.mjs` covers
# the browser page's structure and disclaimers. Keep all five covered
# independently of the portfolio-wide validation workflow, which only
# checks published pages and does not run venture unit tests. Without this
# file, `validate_workflows.py` would fail the moment the venture's
# `*.test.mjs` files land -- the same hole `cors-misconfig-check-ci.yml`
# and `ai-crawler-access-check-ci.yml` document.
on:
  pull_request:
    paths:
      - "ventures/email-auth-check/**"
      - ".github/workflows/email-auth-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/email-auth-check/**"
      - ".github/workflows/email-auth-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-auth-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/email-auth-check

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Discovered, not enumerated -- bare `node --test` walks the working
      # directory, so a test file added later is never invisible to this
      # workflow. See cors-misconfig-check-ci.yml's own note on why this
      # step is not a hand-typed list of filenames.
      - name: Run every test in the venture
        run: node --test
