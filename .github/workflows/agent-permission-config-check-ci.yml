name: agent-permission-config-check CI

# Zero-dependency CLI/browser tool: `engine.mjs` is the shared rule set
# (blanket Bash allow-all, unscoped destructive-command allow with no
# matching deny, plain-http MCP server url, hardcoded-looking secret in a
# server's env/headers); `cli.mjs` is the CLI entry point (auto-discovers
# config files, plus a best-effort `git ls-files` check); `page.test.mjs`
# covers the tool page and the docs/comparison pages' structure and
# disclaimers. Keep all three covered independently of the portfolio-wide
# validation workflow, which only checks published pages and does not run
# venture unit tests -- see platform/ci/validate_workflows.py invariant 7 and
# this repo's own agent-instructions-drift-check-ci.yml, which documents the
# same requirement landing red on `main` the one time it was skipped.
on:
  pull_request:
    paths:
      - "ventures/agent-permission-config-check/**"
      - ".github/workflows/agent-permission-config-check-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/agent-permission-config-check/**"
      - ".github/workflows/agent-permission-config-check-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-permission-config-check-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/agent-permission-config-check

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run engine, CLI, and page-wiring tests
        run: node --test engine.test.mjs cli.test.mjs page.test.mjs
