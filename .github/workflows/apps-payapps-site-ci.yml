# Moved from Duncan-Haywood/private-monorepo .github/workflows/payapps-site-ci.yml at b1b7c3f63ce2 (2026-11-26);
# actions pinned to .github/ci-policy.yaml SHAs, checkout without persisted credentials.
# PR checks for apps/payapps-site (the PayPencil marketing site). No deploy workflow yet: see
# apps/payapps-site/README.md "Deploying". Never needs secrets.
name: apps-payapps-site-ci
on:
  pull_request:
    paths:
      - "apps/payapps-site/**"
      # The pricing page mirrors these (test/unit/plans-sync.test.ts): a price change there runs it.
      - "apps/payapps/src/shared/plans.ts"
      - "packages/billing/src/pricing.ts"
      - ".github/workflows/payapps-site-*.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "biome.json"
  push:
    branches-ignore: [main]
    paths:
      - "apps/payapps-site/**"
      # The pricing page mirrors these (test/unit/plans-sync.test.ts): a price change there runs it.
      - "apps/payapps/src/shared/plans.ts"
      - "packages/billing/src/pricing.ts"
      - ".github/workflows/payapps-site-*.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payapps-site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: apps/payapps-site

jobs:
  check:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (pages, SEO files, plans, validation)
        run: pnpm test:unit
      - name: Worker integration tests (workerd, local D1, fake email)
        run: pnpm test:worker
      - name: Build
        run: pnpm build
