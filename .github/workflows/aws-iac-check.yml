# Validates every platform/aws stack on PRs: fmt, init without a backend,
# validate, tests against a mocked provider, Checkov and cfn-lint. Needs no
# AWS credentials and no secrets. Source of truth: platform/aws/bootstrap/ci/.
# provider, and Checkov. Needs no AWS credentials and no secrets.
name: AWS IaC check
on:
  pull_request:
    paths: ['platform/aws/**']
  push:
    branches: [main]
    paths: ['platform/aws/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tofu:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: 1.10.7
          tofu_wrapper: false
      - name: validate and test every stack and module
        run: |
          set -euo pipefail
          for dir in $(find platform/aws -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            (cd "$dir" && tofu init -backend=false -input=false && tofu validate && { [ ! -d tests ] || tofu test; })
            echo "::endgroup::"
          done
      - name: tofu fmt -check (prints the diff)
        if: always()
        run: tofu fmt -check -diff -recursive platform/aws
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: checkov and cfn-lint
        if: always()
        run: |
          python -m pip install --quiet 'checkov==3.4.10' 'cfn-lint==1.61.0'
          checkov -d platform/aws --framework terraform cloudformation --compact --quiet --skip-download
          find platform/aws -path '*/cfn/*.yaml' -print0 | xargs -0 -r cfn-lint
