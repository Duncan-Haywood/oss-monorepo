name: lawn-care-bid-calculator CI

# Test runner for the browser-local lawn-care bid calculator. The product is
# static ES modules with no build step and no dependencies, so this does no
# more than a contributor runs locally: `node --test`. It publishes nothing,
# registers nothing, and spends no API budget — it is not the
# unattended-automation kind of workflow CLAUDE.md gates.

on:
  pull_request:
    paths:
      - "ventures/lawn-care-bid-calculator/**"
      - ".github/workflows/lawn-care-bid-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/lawn-care-bid-calculator/**"
      - ".github/workflows/lawn-care-bid-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lawn-care-bid-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ventures/lawn-care-bid-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
