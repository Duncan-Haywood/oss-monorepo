name: medical-courier-route-margin CI
on:
  pull_request:
    paths: ['ventures/medical-courier-route-margin/**', '.github/workflows/medical-courier-route-margin-ci.yml']
  push:
    branches: [main]
    paths: ['ventures/medical-courier-route-margin/**', '.github/workflows/medical-courier-route-margin-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/medical-courier-route-margin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - run: node --test
