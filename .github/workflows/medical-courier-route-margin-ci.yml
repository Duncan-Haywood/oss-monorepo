name: medical-courier-route-margin CI
on:
  pull_request:
    paths: ['ventures/medical-courier-route-margin/**', '.github/workflows/medical-courier-route-margin-ci.yml']
  push:
    branches: [main]
    paths: ['ventures/medical-courier-route-margin/**', '.github/workflows/medical-courier-route-margin-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ventures/medical-courier-route-margin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs medical-courier-route-margin
