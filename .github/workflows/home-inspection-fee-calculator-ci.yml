name: home-inspection-fee-calculator CI

# Dependency-free browser tool: plain ES modules, no build step, so this runs
# exactly what a contributor runs locally (`node --test`) and nothing else. It
# publishes nothing, registers nothing, and spends no API budget.
#
# Added the same day the venture graduated -- the portfolio-wide workflows do
# not run venture unit tests: `portfolio-validate.yml` checks structure and
# markup, `proposal-module-ci.yml` runs only `ventures/*/proposal.test.mjs`,
# and nothing else executes `node --test` inside a venture.
# `validate_workflows.py` invariant 7 fails without this file.
on:
  pull_request:
    paths:
      - "ventures/home-inspection-fee-calculator/**"
      - ".github/workflows/home-inspection-fee-calculator-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/home-inspection-fee-calculator/**"
      - ".github/workflows/home-inspection-fee-calculator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-inspection-fee-calculator-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/home-inspection-fee-calculator

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the venture's tests
        run: node --test
      - name: Published pages carry the no-warranty clause
        working-directory: .
        run: node platform/pages/clauses.mjs home-inspection-fee-calculator
