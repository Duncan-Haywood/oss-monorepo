# CI policy data, read by platform/ci/ci_policy_check.py (the `ci-policy`
# required check). Owner-only in .github/CODEOWNERS: adding an action, a
# runner or an accepted privileged path here is a trust decision.
# Model and reasons: docs/security/agent-hardening.md, "Two tiers of CI".

# Actions any workflow may use, each pinned to full commit SHAs. A key is
# `owner/repo` (any action path inside it) or `owner/repo/path`.
actions:
  actions/cache:
    - 0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
  actions/checkout:
    - 11d5960a326750d5838078e36cf38b85af677262 # v4
  actions/create-github-app-token:
    - d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
  actions/deploy-pages:
    - d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  actions/download-artifact:
    - d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
  actions/setup-node:
    - 49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
  actions/setup-python:
    - a26af69be951a213d495a4c3e4e4022e16d87065 # v5
  actions/upload-artifact:
    - ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
  actions/upload-pages-artifact:
    - 56afc609e74202658d3ffba0e8f6dda462b719fa # v3
  amondnet/vercel-action:
    - 16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25
  anomalyco/opencode/github:
    - e5cc278dec9294a627a7b05f47ce6a564408c1a2 # v1.18.5
  cloudflare/wrangler-action:
    - 9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
  docker/login-action:
    - c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
  opentofu/setup-opentofu:
    - 9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
  pypa/gh-action-pypi-publish:
    - 7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (PR #18671)
  pnpm/action-setup:
    - b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
  # CodeQL analysis and SARIF upload (priv-codeql.yml: needs security-events: write).
  github/codeql-action:
    - 1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

runners:
  # GitHub-hosted labels only: a self-hosted runner keeps state between jobs,
  # so an unprivileged job could leave something behind for a privileged one.
  labels:
    - ubuntu-latest
    - ubuntu-24.04
    - ubuntu-22.04
    - ubuntu-24.04-arm
    - macos-latest
    - macos-15
    - macos-14
    - windows-latest
    - windows-2025
    - windows-2022
  # Exact expressions allowed as `runs-on`. `vars.CI_RUNNER` is a repository
  # variable only the owner can set (Settings > Variables); unset, both fall
  # back to ubuntu-latest. Fork PRs never get it.
  expressions:
    - "${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}"
    - "${{ vars.CI_RUNNER || 'ubuntu-latest' }}"

# Repo code that a secret- or write-holding job in a priv- workflow runs but
# that CODEOWNERS deliberately does not own, because owning it would put a
# whole product under owner review. Each is a known residual risk: an agent
# could change this code, and the next run on `main` would execute it with the
# job's secrets. What limits it: the secrets sit in GitHub Environments that
# only `main` may use, and the tokens are scoped (see agent-hardening.md).
# The fix is to split such a job into an unprivileged build and a privileged
# deploy that only uploads the built artifact.
privileged_code_accepted:
  # The catalogue site builder. platform/marketing/indexnow.mjs (both Pages
  # deploy jobs) and platform/distribution/{desktop,hub}.mjs import
  # platform/pages/build.mjs, which pulls in most of the site generator and
  # the ventures it renders. Owning all of it would put the whole catalogue
  # under owner review. Fix: move the constants they need into a small owned
  # module so the deploy and publish steps stop importing the builder.
  - workflow: "*"
    path: platform/pages/
    why: site generator imported by indexnow.mjs, desktop.mjs and hub.mjs
  - workflow: "*"
    path: platform/marketing/indexnow.mjs
    why: imports platform/pages/build.mjs, so owning it alone would add nothing
  - workflow: "*"
    path: platform/devlog/
    why: imported by the site generator
  - workflow: "*"
    path: portfolio/requests/
    why: imported by the site generator and the edge Worker; website-request work edits it daily
  - workflow: "*"
    path: ventures/hearth-and-horizon/
    why: imported by the site generator
  - workflow: "*"
    path: ventures/saints-by-candlelight/
    why: imported by the site generator

  # Product trees a deploy job builds (npm ci / npm run deploy / pnpm build)
  # with the deploy token in the job.
  - workflow: priv-ai-first-markets-deploy.yml
    path: ventures/ai-first-markets/
    why: the product the job builds and deploys
  - workflow: priv-real-estate-agent-photo-app-deploy-docs.yml
    path: ventures/real-estate-agent-photo-app/docs-site/
    why: the docs site the job builds and deploys (its Access script is owned)
  - workflow: priv-retail-pilot-intel-deploy-docs.yml
    path: ventures/retail-pilot-intel/
    why: the docs site the job builds and deploys
  - workflow: priv-edge-deploy.yml
    path: platform/edge/
    why: the Worker the job tests and deploys
  - workflow: priv-site-usage-pull.yml
    path: platform/counter/
    why: usage readers that share code with the counter Worker
  - workflow: priv-site-usage-pull.yml
    path: platform/edge/
    why: feedback reader that shares code with the edge Worker
  - workflow: priv-site-usage-pull.yml
    path: platform/seo/probe.py
    why: the Search Console reader, also run by hand in SEO work
  - workflow: priv-uitest-ci.yml
    path: platform/uitest/
    why: the uitest tool itself; the paid job is manual-dispatch only
  - workflow: priv-uitest-ci.yml
    path: platform/llm/byok.mjs
    why: imported by uitest's agent driver
  - workflow: priv-direction-report.yml
    path: portfolio/direction/LATEST.json
    why: the report this job writes, not code it runs
  - workflow: priv-security-gate.yml
    path: ventures/liability-audit/
    why: the liability scanner the security-scan job runs (main's copy, files only, read-only token, no secret); owning it would put a product under the control-plane tier
