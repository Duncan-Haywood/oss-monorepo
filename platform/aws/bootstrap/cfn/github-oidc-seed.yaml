# The one console step before CI can do everything else.
#
# The owner launches this once, in the management account, in us-east-1
# (CloudFormation > Create stack > Upload this file). It creates:
#   - the GitHub Actions OIDC identity provider for this account;
#   - gha-oss-monorepo-foundation-plan: read-only, for pull-request plans of
#     the management-account stacks (bootstrap, org, baseline, github-oidc);
#   - gha-oss-monorepo-foundation-apply: administrator, for applying them,
#     assumable only from a job in the `aws-prod` GitHub environment, which
#     the owner restricts to the main branch.
# No access keys exist anywhere; both roles issue one-hour sessions.
# platform/aws/github-oidc reads the provider created here (it does not
# manage it) and creates every other stack's roles.
AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub OIDC seed for platform/aws foundation stacks (oss-monorepo)

Parameters:
  GitHubOwner:
    Type: String
    Default: Duncan-Haywood
    AllowedPattern: "^[A-Za-z0-9-]+$"
  GitHubRepo:
    Type: String
    Default: oss-monorepo
    AllowedPattern: "^[A-Za-z0-9._-]+$"
  ApplyEnvironment:
    Type: String
    Default: aws-prod
    AllowedPattern: "^[A-Za-z0-9_-]+$"
  StateKeyAlias:
    Type: String
    Default: alias/oss-monorepo-tfstate

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - { Key: managed_by, Value: cloudformation-seed }
        - { Key: repo, Value: oss-monorepo }

  FoundationPlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "gha-${GitHubRepo}-foundation-plan"
      Description: Read-only plans of the foundation stacks from pull requests
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOwner}/${GitHubRepo}:pull_request"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      Policies:
        - PolicyName: read-state
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ReadOnlyAccess has no kms:Decrypt; plans must read state.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    "kms:ViaService": !Sub "s3.${AWS::Region}.amazonaws.com"
                  "ForAnyValue:StringEquals":
                    "kms:ResourceAliases": !Ref StateKeyAlias
              # Plans never write: no lock, no state, no secrets.
              - Effect: Deny
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameter*
                Resource: "*"
      Tags:
        - { Key: managed_by, Value: cloudformation-seed }
        - { Key: repo, Value: oss-monorepo }

  FoundationApplyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "gha-${GitHubRepo}-foundation-apply"
      Description: Applies the foundation stacks from main through the aws-prod environment
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOwner}/${GitHubRepo}:environment:${ApplyEnvironment}"
      ManagedPolicyArns:
        # Creating the organization, accounts, SCPs and delegated admins
        # needs it. Kept to the management account; the SCPs from
        # platform/aws/org bound everything it can do in member accounts.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      Tags:
        - { Key: managed_by, Value: cloudformation-seed }
        - { Key: repo, Value: oss-monorepo }

Outputs:
  OidcProviderArn:
    Value: !Ref GitHubOidcProvider
  FoundationPlanRoleArn:
    Value: !GetAtt FoundationPlanRole.Arn
  FoundationApplyRoleArn:
    Value: !GetAtt FoundationApplyRole.Arn
