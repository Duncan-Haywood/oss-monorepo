# Route auth-posture contract registry
#
# `scripts/ci/route_posture_contract.py` enforces this file and fails closed.
#
# Every venture that serves HTTP route handlers must appear here with a
# contract test that makes each handler declare whether it answers anonymous
# callers. A venture that grows its first route fails the audit until it has
# one — that is the whole point, and it is why this file exists rather than
# three hand-written tests nobody is obliged to imitate.
#
# `execution` is the field that does the work. A contract that exists is not a
# contract that runs, and this repository has been burned by exactly that
# before. It names how CI reaches the file, and the audit proves the wiring
# rather than believing the label:
#
#   venture-test-gate  scripts/test-ci.sh runs `npm --prefix .../<venture> test`
#                      AND that script's arguments expand to the contract file.
#                      Expansion is checked under `sh` semantics — no globstar —
#                      because npm runs scripts under sh.
#   coverage-ratchet   platform/coverage-baseline.yaml declares a component for
#                      this venture AND its command expands to the contract file.
#   none               nothing runs it. Requires `owner`, `reason` and a dated
#                      `exempt_until` no more than 180 days out, so the gap
#                      expires into a failure instead of into silence.
#
# `route_files` and `handlers` are exact measured counts, checked in both
# directions like `count` in platform/exception-register.yaml. Above declared
# means a route was added and nobody declared its posture — the case the
# contract exists to catch. Below means one was deleted and the contract still
# claims it. Re-measure with:
#
#     python3 scripts/ci/route_posture_contract.py --report

ventures:
  - venture: print-atelier
    contract: ventures/print-atelier/tests/api-route-guard-contract.test.ts
    execution: coverage-ratchet
    route_files: 14
    handlers: 21
    owner: duncan
    # The only one of the three original contracts that actually runs in CI,
    # and only incidentally: it sits inside the `tests/*.test.ts` glob that the
    # coverage component already measures. Writing it found SEC-019 — four
    # unguarded handlers, including `GET /api/stripe/webhook` and
    # `GET /api/stripe/checkout` reporting which secrets were configured.
    # Its companion `tests/operator-route-authorization.test.ts` is the
    # behavioural half: it invokes handlers and asserts anonymous callers are
    # refused, where this one asserts the guard is present.

  - venture: ai-first-markets
    contract: ventures/ai-first-markets/src/lib/routeAuthPosture.test.ts
    execution: venture-test-gate
    route_files: 4
    handlers: 5
    owner: duncan

  - venture: photo-editing
    contract: ventures/photo-editing/docs-site/src/lib/routeAuthPosture.test.ts
    execution: venture-test-gate
    route_files: 4
    handlers: 4
    owner: duncan

  - venture: quick-pick-survey
    contract: ventures/quick-pick-survey/src/lib/routeAuthPosture.test.ts
    execution: venture-test-gate
    route_files: 32
    handlers: 34
    owner: duncan

  - venture: local-site-studio
    contract: ventures/local-site-studio/src/lib/routeAuthPosture.test.ts
    execution: venture-test-gate
    route_files: 13
    handlers: 39
    owner: duncan
