    path: ventures/photo-editing/tests/test_assembly.py
    count: 1
    status: reviewed
    owner: duncan
    issue: docs/SAST.md#sast-004
    expires: 2027-01-28
    reason: >-
      `hardcoded_tmp_directory` matches the string `/tmp/instagram_reel.mp4`,
      which is test input to a negative case: the assertion immediately after it
      is that `load_render_tasks_manifest` *rejects* that path with "Unsafe
      render task output path". The literal is the attack being tested, so
      removing it would delete the test's subject.

