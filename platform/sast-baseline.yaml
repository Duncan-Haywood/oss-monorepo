# SAST baseline
#
# Static application security testing runs zero-tolerance: `scripts/ci/sast_scan.py`
# fails on any Semgrep or Bandit finding that is not registered below, and it
# fails just as hard when a registered finding disappears. See
# `docs/SAST.md` for the process.
#
# Required fields: id, tool, rule, path, count, owner, issue, reason, expires,
# status.
#
# `status` is either `reviewed` or `inherited`, and the difference is the point
# of this file.
#
# `reviewed` means somebody read the finding, established why it is not
# exploitable, and wrote that down; the gate enforces a minimum length on the
# reason, because "false positive" is not one.
#
# `inherited` means the finding was already there when SAST was switched on and
# has been counted but not yet assessed. There were 191 of those across 73
# rule/file pairs, and claiming each had been individually cleared would have
# been untrue. They carry a `plan` instead of a justification, and a shorter
# expiry, so the register describes the real state of the code rather than a
# tidier one. Working the list down is tracked in `docs/SAST.md`.
#
# Both are enforced identically: exact counts, so nothing new hides among them.
#
# `path` is an exact repository-relative path, deliberately not a glob. A glob
# would let a brand-new file inherit an existing waiver, which is the failure
# mode this register exists to prevent. `count` is the exact number of findings
# of that rule in that file: a higher real count means a new finding slipped in,
# a lower one means the entry is stale and the waiver has outlived its subject.
#
# Line numbers are deliberately not matched. They churn on every unrelated edit,
# which would make the baseline a merge-conflict generator that everybody
# regenerates blindly — a register nobody reads is worse than no register.
#
# `expires` may be at most 180 days out, same rule as
# `platform/exception-register.yaml`.
#
# This file is not a place to park a vulnerability you have understood and
# decided to keep: a genuine finding goes to `docs/SECURITY_AUDIT_LOG.md` as a
# SEC-xxx and gets fixed. `inherited` is for findings not yet triaged, not for
# ones triaged and accepted.

# Semgrep scans a file it cannot fully parse — it stops at the construct its
# grammar rejects and leaves the rest of that file unscanned, while reporting a
# warning rather than an error. So a file that stops parsing quietly stops being
# covered with every gate still green.
#
# The count is therefore declared rather than tolerated, and it is matched
# exactly, not as an upper bound: raising it is a deliberate statement that more
# code is unscanned, and lowering happens automatically the moment someone fixes
# one, because a ceiling above the real number fails too.
#
# All 49 are Semgrep grammar limitations, not defects in this repository:
# `>()` on a generic arrow function, and a bare `&` in JSX text. They are listed
# in `sast-report.md` on every run.
coverage:
  semgrep_unparsed_max: 49

baseline:
  - id: SAST-001
    tool: semgrep
    rule: javascript.express.security.injection.raw-html-format.raw-html-format
    path: ventures/local-site-studio/src/app/api/contact/[slug]/route.ts
    count: 1
    status: reviewed
    owner: duncan
    issue: docs/SAST.md#sast-001
    expires: 2027-01-28
    reason: >-
      The rule flags user data interpolated into a manually built HTML string,
      and the notification email does build its HTML by interpolation. Every one
      of the seven interpolated values is wrapped in `escapeHtmlForEmail` first
      (`src/lib/inquiries/reply.ts:33`), which replaces `&`, `<`, `>`, `"` and
      `'` with entities before the value reaches the template. Semgrep does not
      recognise the project's own sanitizer, so it sees the interpolation and
      not the escape. Verified by reading every interpolation site in the
      template on 2026-08-01; there is no unescaped one.

  - id: SAST-002
    tool: semgrep
    rule: typescript.react.security.audit.react-dangerouslysetinnerhtml.react-dangerouslysetinnerhtml
    path: ventures/local-site-studio/src/app/preview/[slug]/page.tsx
    count: 1
    status: reviewed
    owner: duncan
    issue: docs/SAST.md#sast-002
    expires: 2027-01-28
    reason: >-
      `dangerouslySetInnerHTML` here emits a `application/ld+json` structured
      data block, which is the one case where React offers no alternative — JSON-LD
      has to be script content. The value goes through `safeJsonLdScript`
      (`src/lib/seo.ts:69`), which is `JSON.stringify(...).replace(/</g, "\\u003c")`:
      the standard defence, because the only escape from a JSON string inside a
      script element is a literal `</script>`, and escaping every `<` makes that
      unrepresentable. The rule fires on any non-constant argument and cannot see
      that the helper is total.

