  - id: IMG-001
    path: platform/k8s/apps/*/deployment.yaml
    count: 2
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2027-01-15
    claims:
      # Re-derived by `scripts/ci/image_release_path.py`, which measures which
      # images have a producer. The sentence below used to be the whole
      # justification and lived in `reason`, a required field nothing reads: it
      # was written when all six had no producer, and stayed on the page after
      # print-atelier and marisstella-homepage got one. Stating it as a checked
      # claim means the register fails when the argument stops being true
      # instead of when someone happens to re-read it.
      no_build_path: true
    reason: >-
      real-estate-photo-app and retail-pilot-intel. Neither of the two can be
      pinned today, because for each of them nothing in this repository builds
      and pushes the image the manifest names — there is no Dockerfile and no
      workflow that publishes any of them. Writing a digest now would pin these
      Deployments to an artifact that does not exist, which is a worse failure
      than a mutable tag: it fails at pull time in the cluster rather than at
      review time here. That is not hypothetical — it is exactly what
      local-site-studio's hand-typed `sha256:a1b2c3d4e5f6…` did until 2026-08-05,
      and the reason `check_digest_provenance` now asks where a digest came from.
      The tag is a symptom of the missing image pipeline, and it is the pipeline
      that has to land first.
      Lowered 6 -> 4 on 2026-08-05 when print-atelier and marisstella-homepage
      gained producers and moved to IMG-009 and IMG-010.
      Lowered 4 -> 3 later the same day when ai-first-markets' manifests were deleted.
      Lowered 3 -> 2 on 2026-08-08 when ai-engineering-academy gained a producer
      and moved to IMG-012.
      describing a service Kubernetes never ran — the one case where the honest
      fix is that the deployment stops existing, not that it gains a pipeline.
    compensating_control: >-
      None of the three is reachable from the public internet through this
      manifest, and `links.production` is `null` in every one of their
      VENTURE.yaml files. The single venture that does deploy from its
      manifest, quick-pick-survey, is digest-pinned and is excluded from this
      entry, so the count cannot be quietly satisfied by the service that
      matters most.

  - id: IMG-006
    path: platform/terraform/agent_platform.tf
    count: 1
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2026-12-15
    claims:
      # Corrected 2026-08-06, both fields. `compensating_control` said
      # "Restricted to internal cluster admin access" of a remote shell on a
      # public Traefik ingress with a Let's Encrypt production certificate —
      # and `scripts/ci/image_tags.py`'s own module docstring had been saying
      # so, in this repository, two entries away from the sentence that denied
      # it. `reason` said the tag "defaults to a mutable tag at runtime", which
      # stopped being true on 2026-08-04 when the variable lost its default and
      # gained a validation. Neither correction moves the count: the reference
      # is still unresolvable from tracked sources, which is what this register
      # accepts.
      ingress_is_public:
        sentence: >-
          reachable from the public internet on `code.marisstella.dev`
        present:
          path: platform/terraform/agent_platform.tf
          pattern: 'host\s+=\s+"code\.marisstella\.dev"'
      gate_is_a_password_not_the_network:
        sentence: >-
          gated by a `PASSWORD` env var rather than by the network
        present:
          path: platform/terraform/agent_platform.tf
          pattern: 'PASSWORD\s+=\s+var\.code_server_password'
      no_network_restriction_exists:
        sentence: >-
          no NetworkPolicy or source-range allowlist exists anywhere in this
          configuration
        absent:
          path: platform/terraform/*.tf
          pattern: '(?i)networkpolicy|ipallowlist|ipwhitelist|sourceRange'
      tag_variable_is_validated_immutable:
        sentence: >-
          refuses any value that is not a digest or a version
        present:
          path: platform/terraform/agent_platform.tf
          pattern: 'sha256:\[0-9a-f\]\{64\}'
    reason: >-
      `codercom/code-server` on `helm_release.code_server`.
      `tag = var.code_server_image_tag` is unresolved from tracked sources, so
      this audit cannot name the release the cluster runs. It is not a floating
      default: since 2026-08-04 the variable has had no default at all and
      carries a validation that refuses any value that is not a digest or a
      version, so an unset tag is a `terraform plan` failure. What remains
      unverifiable here is only which permitted value was supplied.
    compensating_control: >-
      Not the network. This is a remote shell reachable from the public internet
      on `code.marisstella.dev` — a Traefik ingress with a `letsencrypt-prod`
      certificate — and gated by a `PASSWORD` env var rather than by the network;
      no NetworkPolicy or source-range allowlist exists anywhere in this
      configuration, and ports 80 and 443 are open to `0.0.0.0/0` in
      `firewall.tf`. The real control is the tag validation named above: it
      bounds what can be running to one identifiable release, which is the whole
      of what this entry can honestly claim. It said "Restricted to internal
      cluster admin access" until 2026-08-06.

