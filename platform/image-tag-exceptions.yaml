  - id: IMG-008
    path: platform/terraform/services.tf
    count: 1
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2026-12-15
    claims:
      # Corrected 2026-08-06. "Overrides are validated at deploy time" named a
      # validation that has never existed: `platform/terraform/variables.tf`
      # contains no `validation` block at all, for `var.services` or for
      # anything else. Seven other variables in this directory do carry one —
      # including `code_server_image_tag`, whose regex is exactly the check this
      # entry claimed — so the sentence described a pattern implemented next
      # door and not here. The `absent` claim below is deliberately the shape
      # that goes red when someone fixes it: adding the validation is the
      # remedy, and it must rewrite this entry rather than pass under it.
      tag_is_a_required_field:
        sentence: >-
          `tag` is a required `string`
        present:
          path: platform/terraform/variables.tf
          pattern: '^\s+tag\s+=\s+string\s*$'
      no_validation_constrains_the_value:
        sentence: >-
          nothing validates the value
        absent:
          path: platform/terraform/variables.tf
          pattern: '^\s*validation\s*\{'
    reason: >-
      `each.value.image` / `each.value.tag` on `helm_release.web_service`.
      Evaluated from `var.services` map which is populated at deploy time via
      tfvars.
    compensating_control: >-
      Weaker than it read until 2026-08-06, when this said "Overrides are
      validated at deploy time". They are not. What is true is that `tag` is a
      required `string` in the object type — it was `optional(string, "latest")`
      until 2026-08-04 — so a service that declares no tag fails `terraform
      plan` at review time instead of floating. Beyond that, nothing validates
      the value: `variables.tf` carries no `validation` block, so `latest` is
      accepted here as readily as a digest. The remedy is the regex
      `code_server_image_tag` already uses in `agent_platform.tf`.
