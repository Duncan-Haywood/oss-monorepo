# Mutable container image tags, accepted with an expiry
#
# `scripts/ci/image_tags.py` enforces this file and fails closed;
# `tests/test_image_tags.py` runs the same audit under pytest.
#
# The audit reads the *effective* reference — the manifest's `image:` after its
# directory's Kustomize `images:` overlay — because that is what Argo CD renders
# and the cluster pulls. A mutable reference means the running code cannot be
# named: `:latest` resolves to whatever was pushed last, so a rollback has no
# target, an audit has no answer, and an accidental or hostile push deploys
# without a diff. An image with no tag is the same defect spelled differently,
# since Kubernetes supplies `:latest` for it.
#
# `count` is the exact number of mutable references the entry accepts, and the
# ratchet is two-directional, like `count` in `platform/exception-register.yaml`:
#
#   * More than `count` fails — the gap grew and nobody decided that.
#   * Fewer than `count` fails — images were pinned and the register is stale.
#
# `expires` may be at most 180 days out, capped in `image_tags.py`
# (MAX_EXPIRY_DAYS), so this file cannot be widened into permanent silence.
#
# The fix these entries are waiting for already exists in this repository.
# `platform/k8s/apps/quick-pick-survey/kustomization.yaml` carries
# `digest: sha256:…`, which `platform/ci/promote-pairwise-gitops.sh` rewrites on
# each promotion after validating the digest's shape. That venture is not
# registered below because it does not need to be — it is the worked example.

exceptions:
  # Entries are matched in file order and each reference is claimed once, so a
  # specific path above a broad glob behaves the way it reads. IMG-002 sits
  # above IMG-001 for exactly that reason: `platform/k8s/apps/*/deployment.yaml`
  # would otherwise swallow it and IMG-001's count of 7 would silently become 8.
  - id: IMG-002
    path: platform/k8s/apps/service-template/deployment.yaml
    count: 1
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2026-12-15
    reason: >-
      `image: nginx:alpine # Replace with your docker image registry URL/tag`.
      Surfaced on 2026-08-04 when `scripts/ci/image_tags.py` stopped asking
      whether a tag is one of ten bad words and started asking whether it is
      immutable evidence: `:alpine` names no build and no version, it is
      whatever Alpine nginx was published last. The old constant's own docstring
      claimed `alpine` was "caught by the digest rule instead" — it was not,
      which is the failure mode a denylist has by construction.
      This is not deployed: `platform/k8s/argocd-apps/` has an Application for
      each of the eight ventures and none for `service-template`, and the file
      is the skeleton a new venture is copied from. It cannot be pinned here
      without picking an nginx version, and no nginx version appears anywhere in
      this repository to pick from — `portfolio/marisstella-homepage/Dockerfile`
      says `FROM nginx:alpine` too. Naming a version nobody has read is how a
      manifest ends up pointing at an artifact that does not exist.
    compensating_control: >-
      A template that no Argo CD Application references cannot pull an image
      into the cluster. The exposure is that the next venture copied from this
      skeleton inherits a floating tag, which is a review problem rather than a
      running one, and this gate now sees it either way.

  - id: IMG-003
    path: platform/terraform/dashboard_portal.tf
    count: 1
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2026-12-15
    reason: >-
      `nginxdemos/hello:plain-text` on `helm_release.cluster_dashboard`.
      Surfaced on 2026-08-04 when this audit began reading
      `platform/terraform/` at all — the second deployment surface, applied by
      `.gitea/workflows/terraform-apply.yml`, previously read by no control in
      the repository. `plain-text` is a variant selector, not a version: it
      floats with every upstream push. Upstream publishes no version tag that
      appears in any tracked file here, so pinning it means an operator choosing
      a digest against the live registry, which is a deploy-time act and not one
      this branch can perform.
    compensating_control: >-
      Stated plainly, because the register has been wrong about this before:
      this one IS publicly reachable. `dashboard_portal.tf` gives it a Traefik
      ingress on `dashboard.marisstella.dev` with a Let's Encrypt certificate.
      What limits the exposure is the workload, not the network — `nginxdemos/hello`
      is a static hello-world with no credentials, no persistence and no mounted
      secret, and the release declares no `env`. A hostile upstream push would
      get a pod with nothing in it. That is a genuinely weaker mitigation than
      "not reachable", and it is the true one.

  - id: IMG-004
    path: platform/terraform/tailscale.tf
    count: 1
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2026-12-15
    reason: >-
      `tailscale/tailscale:stable`. `stable` is a channel, not a release — it is
      precisely the shape `:latest` has, spelled in a word the previous
      ten-word denylist did not contain, and it is why that denylist was
      replaced by a rule about what immutability looks like. No tailscale
      version is recorded in any tracked file here, so pinning it requires an
      operator to name one.
    compensating_control: >-
      None that removes the class. This pod mounts `kubernetes_secret.tailscale_auth`
      and joins the cluster network, so an upstream push does reach a
      credentialed workload — the exposure is real and this entry exists to keep
      it counted and dated rather than to argue it away. It expires 2026-12-15.

  - id: IMG-005
    path: platform/terraform/helm/web-service/values.yaml
    count: 1
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2026-12-15
    claims:
      # Corrected 2026-08-06 and enrolled in the same edit. The sentence used to
      # read "Every `helm_release` in `platform/terraform/` renders this chart",
      # which was true of no measurement ever taken here: five of fourteen do.
      # It sat in `reason`, a required field nothing reads, and overstated the
      # blast radius by nine releases while every count in this file stayed
      # green. The two numbers below are now the sentence.
      helm_releases_total:
        sentence: >-
          Five of the fourteen `helm_release` resources
        count:
          path: platform/terraform/*.tf
          pattern: '^resource "helm_release"'
          equals: 14
      helm_releases_rendering_this_chart:
        sentence: >-
          Five of the fourteen
        count:
          path: platform/terraform/*.tf
          pattern: 'chart\s+=\s+"\$\{path\.module\}/helm/web-service"'
          equals: 5
      every_render_overrides_image:
        sentence: >-
          this audit reads all five of those overrides
        count:
          path: platform/terraform/*.tf
          pattern: '^\s{8}repository\s*='
          equals: 5
    reason: >-
      The `helm/web-service` chart's default `image: {repository: nginx, tag: alpine}`.
      Five of the fourteen `helm_release` resources in `platform/terraform/`
      render this chart, so for those five this is the reference any release
      that forgets to set `image` actually ships — the same class of defect as
      `variables.tf`'s `tag = optional(string, "latest")`, which was removed on
      2026-08-04 rather than registered. This one is not removable the same way:
      a chart's values file must supply a default for every key its templates
      read, and Helm has no "required" for a plain value. Same nginx-version
      problem as IMG-002.

      Said "Every `helm_release` … renders this chart" until 2026-08-06. The
      other nine install upstream charts — cert-manager, argo-cd, gitea,
      kube-prometheus-stack, loki-stack, metrics-server, sealed-secrets, the
      Gitea runner — or the local `helm/cluster-issuers`, and this values file
      is nothing to any of them.
    compensating_control: >-
      Every release that renders this chart overrides `image` explicitly, so the
      default is a fallback rather than a live reference — and this audit reads
      all five of those overrides, so a release that stopped overriding it would
      be caught at its own line rather than inherited silently from here. The
      figure was "six" until 2026-08-06, which was one more override than exists
      and would have absorbed a release that dropped one without the count
      moving.

  # IMG-009 and IMG-010 sit above IMG-001 because its glob would otherwise
  # swallow them, and the argument for accepting them is no longer the same
  # argument. Both have a producer now; IMG-001's three do not, and conflating
  # the two states is what let IMG-001's reason go false unnoticed for a day.
  - id: IMG-009
    path: platform/k8s/apps/print-atelier/deployment.yaml
    count: 1
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2026-12-15
    reason: >-
      `newTag: latest`, and — unlike IMG-001's three — an image that exists.
      `.gitea/workflows/print-atelier-image.yml` verifies the venture through
      the shared component gate, builds the exact deployable image, smoke tests
      that it answers "/" , and publishes `print-atelier:${sha}` on main. What
      is missing is the other half: nothing rewrites this overlay to that
      digest, so the manifest still names a tag the build deliberately does not
      push. The blocker is a promotion step, not a missing pipeline, and the
      worked example for it is `platform/ci/promote-pairwise-gitops.sh` —
      except that script rewrites an existing `digest:` line and this
      kustomization carries `newTag: latest`, so it needs a first-promotion
      path. That is an owner's decision about releasing a venture holding live
      Stripe Connect and payout code, which is why the build workflow stops
      where it does.
    compensating_control: >-
      Not reachable: `links.production` is `null`, and the published tag is
      immutable and unreferenced by any manifest, so nothing pulls it. The
      exposure is that the Deployment, if ever synced, resolves `:latest` to
      whatever was pushed last — and no `:latest` is pushed at all, so today it
      resolves to nothing and the pod would fail at pull time rather than run
      unidentified code.

  - id: IMG-010
    path: platform/k8s/apps/marisstella-homepage/deployment.yaml
    count: 1
    owner: duncan
    issue: docs/ENGINEERING-ROADMAP.md#next-30-days-prove-releases-and-operations
    expires: 2026-12-15
    claims:
      # Corrected 2026-08-06. `compensating_control` read "The public site does
      # not come from this image, so a mutable tag here cannot change what a
      # visitor gets" — which was the entire argument for accepting the mutable
      # tag, and was contradicted by three tracked files, one of which says the
      # opposite in a comment. This is the worst direction for a register
      # sentence to be wrong in: it converted a live release lever into a
      # documentation defect, and nothing read the sentence to notice.
      argocd_reconciles_this_manifest:
        sentence: >-
          Argo CD syncs this manifest with `selfHeal`
        present:
          path: platform/k8s/argocd-apps/marisstella-homepage.yaml
          pattern: 'selfHeal:\s*true'
      workflow_moves_the_tag:
        sentence: >-
          `homepage-ci.yml` moves `:latest` and calls that the release
        present:
          path: .gitea/workflows/homepage-ci.yml
          pattern: 'docker push .*marisstella-homepage:latest'
      manifest_is_behind_the_apex_ingress:
        sentence: >-
          fronted by the apex ingress
        present:
          path: platform/k8s/apps/marisstella-homepage/ingress.yaml
          pattern: 'host:\s*(www\.)?marisstella\.dev'
    reason: >-
      `newTag: latest` on the manifest for the apex site. `homepage-ci.yml`
      builds and pushes the image, so this is not the missing pipeline IMG-001
      describes. Two publication paths exist for this venture — this Deployment,
      and `platform/ci/deploy-homepage.sh`, which serves a ConfigMap — and the
      honest fix is still to reconcile them so one stops existing. That is an
      owner's call about the only venture with a customer surface.

      Until 2026-08-06 this entry argued the Deployment was "a second, unsynced
      description of a service that already runs from somewhere else". It is
      synced. `platform/k8s/argocd-apps/marisstella-homepage.yaml` is a live
      Argo CD Application over `platform/k8s/apps/marisstella-homepage` with
      `automated: {prune: true, selfHeal: true}`, and the Deployment sits behind
      an ingress claiming `marisstella.dev` and `www.marisstella.dev`.
    compensating_control: >-
      There is none worth the name, and saying so is the point of this revision.
      Argo CD syncs this manifest with `selfHeal`, it is fronted by the apex
      ingress, and `homepage-ci.yml` moves `:latest` and calls that the release
      in its own comment: "The cluster follows `:latest` for this image, so
      moving that tag is the release". So whoever moves that tag in the registry
      releases to the public site, without a commit and without a review — which
      is what `platform/k8s/apps/marisstella-homepage/kustomization.yaml` has
      also said in a comment the whole time. What bounds the exposure is that
      the tag is only moved by the `deploy` job, after this register is
      validated; what does not bound it is anything about this image being
      unreachable.

  # IMG-011 sits above IMG-001 for the same reason IMG-009 and IMG-010 do: it has
