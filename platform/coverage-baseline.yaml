# Coverage baseline
#
# `scripts/ci/coverage_ratchet.py` enforces this file and fails closed; see
# `docs/COVERAGE-RATCHET.md` for the process and the onboarding plan.
#
# Each component declares the coverage it measurably has *today*, not the
# coverage anyone wants it to have. `ENGINEERING-PRINCIPLES.md` sets a 90%
# target; these numbers are the starting point of the climb toward it, and
# writing 90 here before it is true would only mean the gate is switched off.
#
# The check runs in both directions, like `count` in
# `platform/exception-register.yaml`:
#
#   * below `baseline - tolerance` fails — a test was removed or bypassed
#   * above `baseline + tolerance` fails — the baseline is stale, raise it
#
# `tolerance` is the width in percentage points that needs no review. It exists
# because adding an unrelated source line moves a percentage slightly, and a
# baseline rewritten on every commit is a baseline nobody reads. It is capped
# at 2.0 points by the audit. It is not permission to regress.
#
# `command` is an argv list, never a shell string. The audit substitutes
# $COVERAGE_LCOV_DESTINATION with a temp path and reads the lcov written there,
# so a component that reports nothing fails rather than passing silently.
#
# `command` must also pin *what* it measures rather than inheriting the runner's
# default. Every Node component here passes `--test-coverage-include=src/**`,
# and that flag is load-bearing: Node 22 counts a component's own test files as
# covered source and Node 24 does not. `.gitea/workflows/ci-cd.yml` pins Node 22
# while local machines run newer ones, so without the flag the same commit is
# measured over two different surfaces and the gate's verdict depends on who ran
# it. Test files execute themselves and so score near 100%, which does not
# describe the code under test.
#
# `measured` records the size of the report each `baseline` was taken from, and
# the audit checks it. Percentages are ratios; comparing them cannot notice the
# denominator moving underneath. `drift_percent` defaults to 10 and is capped at
# 25 — enough for routine file churn, not enough to hide a component measuring a
# different surface than the one its floor was set over.

components:
  - id: print-atelier
    path: ventures/print-atelier
    owner: duncan
    runner: node-test
    command:
      - node
      - --import
      - tsx
      - --test
      - --experimental-test-coverage
      - --test-coverage-include=src/**
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - tests/*.test.ts
    sources:
      - "src/**/*.ts"
      - "src/**/*.tsx"
    exclude:
      - "*.test.ts"
      - "*.test.tsx"
      - "*.d.ts"
    # Measured 2026-08-02 on Node 22.22.3 across 54 source files / 13502 lines,
    # and identically on Node 26.4.0 (branches differ by 0.05 pt, inside the
    # tolerance below).
    #
    # The figures directly above this line were 94.07/89.04/81.31 over "113 files
    # / 18749 lines". That report was 54 source files plus all 59 files of
    # `tests/`, whose 5247 lines score near 100% by construction. Backed out
    # rather than lowered: the suites that commit credited were real, but the
    # number was never the coverage of the code. The 2026-07-31 figures below it
    # (91.70/87.46/79.31 over 49 files) were source-only and comparable, so the
    # honest reading is that this component moved roughly a point, not three.
    # Branch coverage remains the weakest of the three and is where the climb to
    # the 90% target continues.
    # Re-measured 2026-08-04 on Node 22.22.3. `unexercised` falls 52 -> 50:
    # `tests/checkout-tax-disclosure.test.ts` renders the checkout route, so
    # `src/app/checkout/page.tsx` and `src/components/CheckoutLab.tsx` are now
    # loaded by a test where before nothing loaded them. That is the count this
    # ratchet exists to hold — a percentage floor cannot see a file no test
    # imports at all, and two of them were on the path that decides what a buyer
    # is charged. All three percentages rose over a larger basis at the same
    # time, so this is coverage added rather than surface removed.
    # Re-measured 2026-08-05 on Node 22.22.3 after payment-path fixes and listing-sellability landed.
    # Lines and branches rose over a larger basis (143 files) while unexercised held at 49.
    # The recovered capability-claims chain measured 88.69/83.19 on its own base; both readings
    # sit inside the 0.5 tolerance, so the higher floor here is kept rather than nudged down.
    # `functions` does move: the capability-claims control and the B2B margin-guardrail suite
    # exercise 91.73% of functions, clearing the 0.5 pt tolerance over the 91.22 floor. The
    # chain's own author left this figure alone because on that base it did not clear tolerance;
    # on top of the payment-path work already in main it does, so it is raised here rather than
    # left trailing. Re-measured on Node 22.22.3 by scripts/ci/coverage_ratchet.py itself.
    baseline:
      unexercised: 49
      lines: 88.70
      functions: 91.73
      branches: 83.28
    measured:
      files: 143
      lines: 31733
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5

  - id: platform-ci
    path: platform/ci
    owner: duncan
    runner: node-test
    command:
      - node
      - --test
      - --experimental-test-coverage
      - --test-coverage-include=src/**
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - test/*.test.mjs
    sources:
      - "src/**/*.mjs"
    exclude:
      - "*.test.mjs"
    # Measured 2026-08-03 at 5711c17 on Node 22.22.3, across the component's two
    # source files: `src/pipeline.mjs` (805 lines) and `src/gate-contract.mjs`
    # (290), 1095 together — `wc -l platform/ci/src/*.mjs` exactly.
    #
    # The basis moved because the source did. `src/gate-contract.mjs` was added by
    # e582e0f and is the component's second source file; the previous basis of
    # 1 file / 805 lines predates it. This is the benign direction of the drift
    # check and it was still worth stopping on: the same symptom — a denominator
    # that grew — is what the 13-file/3436-line report below turned out to be,
    # where the extra files were the component's own tests. The distinction is
    # that `--test-coverage-include=src/**` scopes this report to `src/`, and
    # 805 + 290 accounts for the new total with nothing left over, so the added
    # surface is real source and the percentages below are measured over it.
    #
    # Measured 2026-08-02 across `src/pipeline.mjs` alone, 805 lines, identically
    # on Node 22.22.3 and Node 26.4.0.
    #
    # The figures directly above this line were 87.60/93.36/80.68 over "13 files
    # / 3436 lines". This component has one source file; the other 12 were its own
    # tests, and `wc -l test/*.test.mjs src/pipeline.mjs` is 3436 exactly. Their
    # 2631 lines of self-executing code carried 805 lines of 63.98% coverage up to
    # an apparent 87.60%. Comparable to the 2026-07-31 figures of 52.11/57.14/61.54
    # over 639 lines, which were source-only: the engine really did gain coverage
    # from the gate-contract, route-auth-posture and homepage-release-surface
    # suites — about 12 points of it, not 35.
    #
    # This is the engine that decides whether every other component passes, and at
    # 69.86% it is still the least covered thing in the repository. The rise from
    # 63.98% is not pipeline.mjs getting better tested: gate-contract.mjs arrived
    # with its own suite and covers well, which lifts the combined ratio while the
    # contiguous uncovered span in pipeline.mjs (roughly lines 556-805) is exactly
    # where it was. That span is still where raising this should start.
    # Re-measured 2026-08-05 on Node 22.22.3 after control audit fixes landed:
    # 86.06/90.70/88.00 over 2 files, 1248 lines.
    baseline:
      unexercised: 0
      lines: 86.06
      functions: 90.70
      branches: 88.00
    measured:
      files: 2
      lines: 1248
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5

  # Enrolled 2026-08-05. Before this commit the file held two components, only
  # one of which (`print-atelier`) is in `VENTURE_CATALOG` in
  # `platform/ci/src/pipeline.mjs` — so fifteen of the sixteen catalog
  # components had no coverage floor at all, and deleting every test in them
  # could not turn any gate red. `scripts/ci/coverage_ratchet.py` now audits
  # enrollment as well as the numbers: every catalog component is either
  # declared here or registered in `UNMEASURED_COMPONENTS` with a predicate a
  # test evaluates.
  #
  # `docs/COVERAGE-RATCHET.md` claimed all three of the ventures below were
  # already "Onboarded & Ratcheted", at numbers 20-30 points above what they
  # measure. They were never in this file. The figures here are the ones the
  # ratchet itself printed on 2026-08-05.
  - id: quick-pick-survey
    path: ventures/quick-pick-survey
    owner: duncan
    runner: vitest
    # `--coverage.include`/`--coverage.exclude` are the vitest equivalent of the
    # `--test-coverage-include=src/**` the Node components pass, and they are
    # load-bearing for the same reason: without them the measured surface is
    # whatever the suite happened to import, which is a denominator that moves
    # with the tests rather than with the code.
    #
    # `--coverage.reportsDirectory` takes $COVERAGE_LCOV_DESTINATION_DIR because
    # vitest writes `lcov.info` into a directory rather than to a named file;
    # `run_coverage` falls back to `lcov.info` in that directory.
    command:
      - npx
      - vitest
      - run
      - --coverage
      - --coverage.provider=v8
      - --coverage.reporter=lcovonly
      - --coverage.reportsDirectory=$COVERAGE_LCOV_DESTINATION_DIR
      - --coverage.include=src/**
      - --coverage.exclude=**/*.test.*
    sources:
      - "src/**/*.ts"
      - "src/**/*.tsx"
    exclude:
      - "*.test.ts"
      - "*.test.tsx"
      - "*.d.ts"
    # Measured 2026-08-05 on Node 22.22.3, vitest 4.1.10, 59 test files / 434
    # tests passing. `unexercised` is the number that matters here: 58 of the
    # 112 declared source files are loaded by no test, including every route
    # under src/app/api/admin/. 53.90% is the coverage of the other 54 files,
    # and deleting the last test of any of those 58 would not move it at all.
    baseline:
      unexercised: 58
      lines: 53.90
      functions: 54.79
      branches: 45.63
    measured:
      files: 111
      lines: 4024
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5

  - id: local-site-studio
    path: ventures/local-site-studio
    owner: duncan
    runner: vitest
    command:
      - npx
      - vitest
      - run
      - --coverage
      - --coverage.provider=v8
      - --coverage.reporter=lcovonly
      - --coverage.reportsDirectory=$COVERAGE_LCOV_DESTINATION_DIR
      - --coverage.include=src/**
      - --coverage.exclude=**/*.test.*
    sources:
      - "src/**/*.ts"
      - "src/**/*.tsx"
    exclude:
      - "*.test.ts"
      - "*.test.tsx"
      - "*.d.ts"
    # Measured 2026-08-05 on Node 22.22.3, vitest 4.1.10, 140 test files / 1380
    # tests passing. 64 of 173 declared source files are loaded by no test, and
    # the whole of src/app/checkout/ is among them — the surface that takes a
    # payment is exercised by nothing.
    baseline:
      unexercised: 64
      lines: 65.47
      functions: 55.73
      branches: 61.45
    measured:
      files: 173
      lines: 4866
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5

  - id: ai-first-markets
    path: ventures/ai-first-markets
    owner: duncan
    runner: node-test
    command:
      - node
      - --experimental-strip-types
      - --test
      - --experimental-test-coverage
      - --test-coverage-include=src/**
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - src/**/*.test.ts
    sources:
      - "src/**/*.ts"
      - "src/**/*.tsx"
    exclude:
      - "*.test.ts"
      - "*.test.tsx"
      - "*.d.ts"
    # Measured 2026-08-05 on Node 22.22.3. This entry is the argument for
    # `unexercised` in one component: the percentages read 98.37/95.92/89.26 —
    # the best line coverage in this file — and they are computed over the 7
    # source files a test loads. The other 24, every API route and every page
    # among them, are absent from the report and therefore absent from the
    # ratio. A percentage floor alone would have called this component done.
    baseline:
      unexercised: 24
      lines: 98.37
      functions: 95.92
      branches: 89.26
    measured:
      files: 7
      lines: 1408
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5

  - id: photo-editing-docs-site
    path: ventures/photo-editing/docs-site
    owner: duncan
    runner: node-test
    command:
      - node
      - --test
      - --experimental-test-coverage
      - --test-coverage-include=src/**
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - scripts/test-html-to-jsx.mjs
      - scripts/test-generated-docs-current.mjs
      - src/lib/routeAuthPosture.test.ts
    sources:
      - "src/**/*.ts"
      - "src/**/*.tsx"
    exclude:
      - "*.test.ts"
      - "*.test.tsx"
      - "*.d.ts"
      # src/generated/doc-content/ is rewritten wholesale by
      # scripts/generate-docs.mjs from the markdown in docs/, so counting those
      # files here would make `unexercised` move on every documentation edit —
      # a gate that fails on ordinary work is one that gets widened. That they
      # are current is checked by scripts/test-generated-docs-current.mjs, which
      # is in the command above.
      - "src/generated/*"
      - "src/generated/**/*"
    # Measured 2026-08-05 on Node 22.22.3. One of the 26 non-generated source
    # files is loaded by a test — `src/lib/routeAuthPosture.ts`, which the route
    # auth-posture contract reaches — and the other 25, including every API
    # route, are loaded by nothing. `branches: 100.00` is over that one file and
    # says nothing about the component; `unexercised: 25` is the honest reading
    # and is the number a deleted test would move.
    baseline:
      unexercised: 25
      lines: 23.33
      functions: 6.25
      branches: 100.00
    measured:
      files: 1
      lines: 180
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5
