# Coverage baseline
#
# `scripts/ci/coverage_ratchet.py` enforces this file and fails closed; see
# `docs/COVERAGE-RATCHET.md` for the process and the onboarding plan.
#
# Each component declares the coverage it measurably has *today*, not the
# coverage anyone wants it to have. `ENGINEERING-PRINCIPLES.md` sets a 90%
# target; these numbers are the starting point of the climb toward it, and
# writing 90 here before it is true would only mean the gate is switched off.
#
# The check runs in both directions, like `count` in
# `platform/exception-register.yaml`:
#
#   * below `baseline - tolerance` fails — a test was removed or bypassed
#   * above `baseline + tolerance` fails — the baseline is stale, raise it
#
# `tolerance` is the width in percentage points that needs no review. It exists
# because adding an unrelated source line moves a percentage slightly, and a
# baseline rewritten on every commit is a baseline nobody reads. It is capped
# at 2.0 points by the audit. It is not permission to regress.
#
# `command` is an argv list, never a shell string. The audit substitutes
# $COVERAGE_LCOV_DESTINATION with a temp path and reads the lcov written there,
# so a component that reports nothing fails rather than passing silently.
#
# `command` must also pin *what* it measures rather than inheriting the runner's
# default. Every Node component here passes `--test-coverage-include=src/**`,
# and that flag is load-bearing: Node 22 counts a component's own test files as
# covered source and Node 24 does not. `.gitea/workflows/ci-cd.yml` pins Node 22
# while local machines run newer ones, so without the flag the same commit is
# measured over two different surfaces and the gate's verdict depends on who ran
# it. Test files execute themselves and so score near 100%, which does not
# describe the code under test.
#
# `measured` records the size of the report each `baseline` was taken from, and
# the audit checks it. Percentages are ratios; comparing them cannot notice the
# denominator moving underneath. `drift_percent` defaults to 10 and is capped at
# 25 — enough for routine file churn, not enough to hide a component measuring a
# different surface than the one its floor was set over.

components:
  - id: print-atelier
    path: ventures/print-atelier
    owner: duncan
    runner: node-test
    command:
      - node
      - --import
      - tsx
      - --test
      - --experimental-test-coverage
      - --test-coverage-include=src/**
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - tests/*.test.ts
    # Measured 2026-08-02 on Node 22.22.3 across 54 source files / 13502 lines,
    # and identically on Node 26.4.0 (branches differ by 0.05 pt, inside the
    # tolerance below).
    #
    # The figures directly above this line were 94.07/89.04/81.31 over "113 files
    # / 18749 lines". That report was 54 source files plus all 59 files of
    # `tests/`, whose 5247 lines score near 100% by construction. Backed out
    # rather than lowered: the suites that commit credited were real, but the
    # number was never the coverage of the code. The 2026-07-31 figures below it
    # (91.70/87.46/79.31 over 49 files) were source-only and comparable, so the
    # honest reading is that this component moved roughly a point, not three.
    # Branch coverage remains the weakest of the three and is where the climb to
    # the 90% target continues.
    baseline:
      lines: 91.81
      functions: 87.53
      branches: 79.76
    measured:
      files: 54
      lines: 13502
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5

  - id: platform-ci
    path: platform/ci
    owner: duncan
    runner: node-test
    command:
      - node
      - --test
      - --experimental-test-coverage
      - --test-coverage-include=src/**
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - test/*.test.mjs
    # Measured 2026-08-02 across `src/pipeline.mjs` alone, 805 lines, identically
    # on Node 22.22.3 and Node 26.4.0.
    #
    # The figures directly above this line were 87.60/93.36/80.68 over "13 files
    # / 3436 lines". This component has one source file; the other 12 were its own
    # tests, and `wc -l test/*.test.mjs src/pipeline.mjs` is 3436 exactly. Their
    # 2631 lines of self-executing code carried 805 lines of 63.98% coverage up to
    # an apparent 87.60%. Comparable to the 2026-07-31 figures of 52.11/57.14/61.54
    # over 639 lines, which were source-only: the engine really did gain coverage
    # from the gate-contract, route-auth-posture and homepage-release-surface
    # suites — about 12 points of it, not 35.
    #
    # This is the engine that decides whether every other component passes, and at
    # 63.98% it is again the least covered thing in the repository. The uncovered
    # span is contiguous and large (roughly lines 556-805), which is where raising
    # it should start.
    baseline:
      lines: 63.98
      functions: 77.78
      branches: 78.72
    measured:
      files: 1
      lines: 805
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5
