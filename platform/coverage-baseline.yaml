# Coverage baseline
#
# `scripts/ci/coverage_ratchet.py` enforces this file and fails closed; see
# `docs/COVERAGE-RATCHET.md` for the process and the onboarding plan.
#
# Each component declares the coverage it measurably has *today*, not the
# coverage anyone wants it to have. `ENGINEERING-PRINCIPLES.md` sets a 90%
# target; these numbers are the starting point of the climb toward it, and
# writing 90 here before it is true would only mean the gate is switched off.
#
# The check runs in both directions, like `count` in
# `platform/exception-register.yaml`:
#
#   * below `baseline - tolerance` fails — a test was removed or bypassed
#   * above `baseline + tolerance` fails — the baseline is stale, raise it
#
# `tolerance` is the width in percentage points that needs no review. It exists
# because adding an unrelated source line moves a percentage slightly, and a
# baseline rewritten on every commit is a baseline nobody reads. It is capped
# at 2.0 points by the audit. It is not permission to regress.
#
# `command` is an argv list, never a shell string. The audit substitutes
# $COVERAGE_LCOV_DESTINATION with a temp path and reads the lcov written there,
# so a component that reports nothing fails rather than passing silently.

components:
  - id: print-atelier
    path: ventures/print-atelier
    owner: duncan
    runner: node-test
    command:
      - node
      - --import
      - tsx
      - --test
      - --experimental-test-coverage
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - tests/*.test.ts
    # Measured 2026-07-31 across 49 files / 13146 lines. Branch coverage is the
    # weakest of the three and is where the climb to the 90% target starts.
    baseline:
      lines: 91.70
      functions: 87.46
      branches: 79.31
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5

  - id: platform-ci
    path: platform/ci
    owner: duncan
    runner: node-test
    command:
      - node
      - --test
      - --experimental-test-coverage
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - test/*.test.mjs
    # Measured 2026-07-31 across `src/pipeline.mjs` / 639 lines. This is the
    # engine that decides whether every other component passes, and it is the
    # least covered thing in the repository. Half of it has never been executed
    # by a test — including, until recently, the paths that report PASSED for a
    # component that was never verified. Raising this is the priority.
    #
    # Re-measured 2026-08-03. The 2026-07-31 figures were the last ones this
    # component could produce: `ai-engineering-academy-site` claimed a `test`
    # script its package.json did not define, so two contract tests failed, the
    # suite exited non-zero, and the audit reported `coverage-command-failed`
    # rather than a percentage. The gate on the engine that gates everything
    # else was therefore unmeasurable, not merely stale. Restoring that script
    # let the whole suite run, and these are the numbers it actually reports.
    baseline:
      lines: 58.99
      functions: 64.29
      branches: 63.33
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5
