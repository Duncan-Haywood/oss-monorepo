# Coverage baseline
#
# `scripts/ci/coverage_ratchet.py` enforces this file and fails closed; see
# `docs/COVERAGE-RATCHET.md` for the process and the onboarding plan.
#
# Each component declares the coverage it measurably has *today*, not the
# coverage anyone wants it to have. `ENGINEERING-PRINCIPLES.md` sets a 90%
# target; these numbers are the starting point of the climb toward it, and
# writing 90 here before it is true would only mean the gate is switched off.
#
# The check runs in both directions, like `count` in
# `platform/exception-register.yaml`:
#
#   * below `baseline - tolerance` fails — a test was removed or bypassed
#   * above `baseline + tolerance` fails — the baseline is stale, raise it
#
# `tolerance` is the width in percentage points that needs no review. It exists
# because adding an unrelated source line moves a percentage slightly, and a
# baseline rewritten on every commit is a baseline nobody reads. It is capped
# at 2.0 points by the audit. It is not permission to regress.
#
# `command` is an argv list, never a shell string. The audit substitutes
# $COVERAGE_LCOV_DESTINATION with a temp path and reads the lcov written there,
# so a component that reports nothing fails rather than passing silently.

components:
  - id: print-atelier
    path: ventures/print-atelier
    owner: duncan
    runner: node-test
    command:
      - node
      - --import
      - tsx
      - --test
      - --experimental-test-coverage
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - tests/*.test.ts
    # Measured 2026-08-02 across 113 files / 18749 lines, up from 49 files /
    # 13146 lines on 2026-07-31, when the figures were 91.70/87.46/79.31. The
    # route-authorization, payout-reconciliation and artist-cohort suites
    # carried the surface up with the code. Branch coverage is still the weakest
    # of the three and is where the climb to the 90% target continues.
    baseline:
      lines: 94.07
      functions: 89.04
      branches: 81.31
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5

  - id: platform-ci
    path: platform/ci
    owner: duncan
    runner: node-test
    command:
      - node
      - --test
      - --experimental-test-coverage
      - --test-reporter=lcov
      - --test-reporter-destination=$COVERAGE_LCOV_DESTINATION
      - test/*.test.mjs
    # Measured 2026-08-02 across 13 files / 3436 lines. The 2026-07-31 figures
    # below this line were 52.11/57.14/61.54, taken when the component was
    # `src/pipeline.mjs` alone at 639 lines. It is no longer the least covered
    # thing in the repository: the gate-contract, route-auth-posture and
    # homepage-release-surface checks that landed since then execute the paths
    # that used to report PASSED for a component nothing verified. This is the
    # engine that decides whether every other component passes, so the floor is
    # pinned to what is actually measured — a floor that trails reality
    # ratchets nothing.
    baseline:
      lines: 87.60
      functions: 93.36
      branches: 80.68
    tolerance:
      lines: 0.5
      functions: 0.5
      branches: 0.5
