apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quick-pick-survey
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.marisstella.dev/giteaadmin/monorepo-projects.git
    targetRevision: gitops-production
    path: platform/k8s/apps/quick-pick-survey
  destination:
    server: https://kubernetes.default.svc
    namespace: web-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: quick-pick-survey-web-service
      jsonPointers:
        - /spec/replicas
