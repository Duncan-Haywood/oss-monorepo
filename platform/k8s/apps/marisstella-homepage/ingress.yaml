apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marisstella-homepage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - marisstella.dev
    - www.marisstella.dev
    secretName: marisstella-homepage-tls
  rules:
  - host: marisstella.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: marisstella-homepage
            port:
              number: 80
  - host: www.marisstella.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: marisstella-homepage
            port:
              number: 80
