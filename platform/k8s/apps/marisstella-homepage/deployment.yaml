apiVersion: apps/v1
kind: Deployment
metadata:
  name: marisstella-homepage
  labels:
    app: marisstella-homepage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marisstella-homepage
  template:
    metadata:
      labels:
        app: marisstella-homepage
    spec:
      containers:
      - name: marisstella-homepage
        image: git.marisstella.dev/giteaadmin/marisstella-homepage:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
