apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engineering-academy
  labels:
    app: ai-engineering-academy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-engineering-academy
  template:
    metadata:
      labels:
        app: ai-engineering-academy
    spec:
      containers:
      - name: ai-engineering-academy
        image: git.marisstella.dev/giteaadmin/ai-engineering-academy:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
