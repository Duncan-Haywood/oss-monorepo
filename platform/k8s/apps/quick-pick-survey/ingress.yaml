apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quick-pick-survey-web-service
  namespace: web-services
  labels:
    app.kubernetes.io/name: web-service
    app.kubernetes.io/instance: quick-pick-survey
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pairwise.marisstella.dev
      secretName: quick-pick-survey-web-service-tls
  rules:
    - host: pairwise.marisstella.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quick-pick-survey-web-service
                port:
                  number: 3000
