apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-pick-survey
  labels:
    app: quick-pick-survey
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quick-pick-survey
  template:
    metadata:
      labels:
        app: quick-pick-survey
    spec:
      containers:
      - name: quick-pick-survey
        image: ghcr.io/marisstella/pairwise-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: POSTGRES_PRISMA_URL
          valueFrom:
            secretKeyRef:
              name: quick-pick-secrets
              key: POSTGRES_PRISMA_URL
        - name: POSTGRES_URL_NON_POOLING
          valueFrom:
            secretKeyRef:
              name: quick-pick-secrets
              key: POSTGRES_URL_NON_POOLING
        - name: ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: quick-pick-secrets
              key: ADMIN_KEY
        - name: ADMIN_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: quick-pick-secrets
              key: ADMIN_SESSION_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
