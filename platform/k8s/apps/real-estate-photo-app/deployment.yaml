apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-estate-photo-app
  labels:
    app: real-estate-photo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: real-estate-photo-app
  template:
    metadata:
      labels:
        app: real-estate-photo-app
    spec:
      containers:
      - name: real-estate-photo-app
        image: git.marisstella.dev/giteaadmin/real-estate-photo-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
