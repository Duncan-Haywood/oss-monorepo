# The public site (owner, 2026-10-29: moving from GitHub Pages to Cloudflare),
# served as static files on the free plan. Deployed by
# .github/workflows/priv-portfolio-pages.yml after split.mjs has moved the
# directories in router.mjs's SHARD_DIRS into the shard Worker (shard/), which
# keeps each Worker under the free plan's 20,000-file limit.
name = "monorepo-projects-site"
main = "router.mjs"
compatibility_date = "2025-09-01"
workers_dev = true
# The site's own domain, https://marisstella.app/, is attached to this Worker
# as a Custom Domain in the Cloudflare dashboard (owner, 2026-10-30), not
# here: with no `routes` key, `wrangler deploy` leaves it as it is, and the
# deploy token needs no zone permissions. The workers.dev address keeps
# serving the same files, with every canonical link naming the domain.

[assets]
directory = "../dist"
binding = "ASSETS"
# /slug/ serves slug/index.html and /slug redirects to /slug/, as GitHub Pages did.
html_handling = "auto-trailing-slash"
# Unknown paths get the site's 404.html with a 404 status.
not_found_handling = "404-page"
# Only these paths run router.mjs; everything else is served from assets
# without invoking any code.
run_worker_first = ["/research", "/research/*", "/writing", "/writing/*", "/dev", "/dev/*", "/changepoint-detector", "/changepoint-detector/*", "/hearth-and-horizon", "/hearth-and-horizon/*", "/open-tennis-robots", "/open-tennis-robots/*", "/chant-forge", "/chant-forge/*", "/saints-by-candlelight", "/saints-by-candlelight/*", "/open-house-plans", "/open-house-plans/*", "/open-floor-robots", "/open-floor-robots/*", "/blog", "/blog/*", "/engineering", "/engineering/*", "/grants", "/grants/*"]

[[services]]
binding = "SHARD"
service = "monorepo-projects-site-shard"

# Grant Autopilot (private repo, Worker `grant-autopilot`) at /grants/; see
# APP_DIRS in router.mjs.
[[services]]
binding = "GRANTS"
service = "grant-autopilot"
