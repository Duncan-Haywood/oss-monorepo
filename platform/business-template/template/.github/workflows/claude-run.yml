name: claude-run

# One scheduled-style run of prompt.md on GitHub Actions (SETUP.md, option C).
# Uses paid API budget or your Claude plan, so the hourly schedule ships
# commented out: the owner turns it on.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "7 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-run-${{ github.run_id }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read ./prompt.md and follow it."
