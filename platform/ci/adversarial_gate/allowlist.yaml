    reason: a conditional skip, taken only when the compiled Peppol SEF file has not been built; byte-identical to the copy already on main in ventures/einvoice-preflight, moved with the paid app to ventures/einvoice-pro (PR #19635; first moved in PR #19220)
    added: 2026-11-26
  - rule: test-skipped
    path: ventures/einvoice-pro/apps/einvoice-preflight/plain-schematron.test.mjs
    contains: saxon-js not installed
    reason: a conditional skip, taken only when the optional saxon-js dependency is absent; byte-identical to the copy already on main in ventures/einvoice-preflight, moved with the paid app to ventures/einvoice-pro (PR #19635; first moved in PR #19220)
    added: 2026-11-26
  - rule: test-skipped
    path: ventures/einvoice-pro/apps/einvoice-preflight/official-good-cases.test.mjs
    contains: npm i --no-sa
    reason: a conditional skip, taken only when the optional plain Schematron files are not installed; byte-identical to the copy already on main in ventures/einvoice-preflight, moved with the paid app to ventures/einvoice-pro (PR #19635; first moved in PR #19220)
    added: 2026-11-26
  - rule: aws-guardrail-weakened
    path: platform/aws/stacks/org/rcps.tf
    contains: '"repo:${local.public_repo_owner}@*/${local.public_repo_name}@*:*",'
    reason: a widening of a Deny, not an Allow - the payments RCP also refuses the public repository's ID-qualified OIDC subject (repo:owner@id/name@id:context), which GitHub issued for it on 2026-11-26 (apply run 45905276526) and which the name-only pattern above it does not match; no trust or Allow uses it
    added: 2026-11-26
  - rule: aws-guardrail-weakened
    path: platform/aws/stacks/org/rcps.tf
    contains: '"repo:*/*@${var.public_repository_id}:*",'
    reason: a widening of a Deny, not an Allow - the payments RCP refuses any ID-qualified OIDC subject carrying the public repository's numeric ID, so a rename of the public repository cannot slip past it; it can only refuse more, and no trust or Allow uses it
    added: 2026-11-26
  - rule: aws-guardrail-weakened
    path: platform/aws/stacks/baseline/security.tf
    contains: "# detector (aws_guardduty_detector.security, whose alias is this account),"
    reason: a comment renamed to aws_guardduty_detector.security[0] when the resource gains count (single-account mode only); GuardDuty stays on in every account, and organization mode reads the detector AWS creates for the delegated admin instead of failing to create a second one (apply run 45929949287)
    added: 2026-11-27
  - rule: aws-guardrail-weakened
    path: platform/aws/stacks/baseline/security.tf
    contains: "detector_id                      = aws_guardduty_detector.security.id"
    reason: aws_guardduty_organization_configuration keeps auto_enable_organization_members = "ALL"; only its detector_id source changes, to the delegated admin's existing detector (data source) in organization mode, because CreateDetector fails there with "a detector already exists" (apply run 45929949287)
    added: 2026-11-27
  - rule: aws-guardrail-weakened
    path: platform/aws/stacks/baseline/tests/mock.tftest.hcl
    contains: "condition     = aws_guardduty_detector.security.enable && length(aws_securityhub_standards_subscription.single) == 2"
