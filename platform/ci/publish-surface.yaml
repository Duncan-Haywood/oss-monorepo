gitops:
- application: agents
  path: gitops/agents
  classification: none
  hosts: []
  unmet_secrets: []
  redirects: {}
- application: ci
  path: gitops/ci
  classification: none
  hosts: []
  unmet_secrets: []
  redirects: {}
- application: platform
  path: gitops/platform
  classification: none
  hosts: []
  unmet_secrets: []
  redirects: {}
- application: prod
  path: gitops/prod
  classification: live
  hosts:
  - host: marisstella.dev
    serves: workload
    unmet_secrets: &id001 []
  - host: tools.marisstella.dev
    serves: workload
    unmet_secrets:
    - portfolio-site-repo
  - host: www.marisstella.dev
    serves: workload
    unmet_secrets: *id001
  unmet_secrets:
  - portfolio-site-repo
  redirects: {}
- application: root
  path: gitops/apps
  classification: none
  hosts: []
  unmet_secrets: []
  redirects: {}
- application: staging
  path: gitops/staging
  classification: none
  hosts: []
  unmet_secrets: []
  redirects: {}
