- workflow: priv-portfolio-pages.yml
  classification: gated
  publishes:
  - job: deploy-cloudflare
    step: runs 'wrangler deploy'
    gates:
    - ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED
      != 'false' && needs.gate.outputs.cloudflare == 'true' }}
  - job: deploy-cloudflare
    step: runs 'wrangler deploy'
    gates:
    - ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED
      != 'false' && needs.gate.outputs.cloudflare == 'true' }}
  - job: deploy
    step: uses actions/deploy-pages
    gates:
    - ${{ !cancelled() && needs.build.result == 'success' && (needs.gate.outputs.cloudflare != 'true'
      || needs.deploy-cloudflare.result == 'success') && github.ref == 'refs/heads/main' && github.event_name
      != 'pull_request' && vars.PAGES_ENABLED != 'false' }}
