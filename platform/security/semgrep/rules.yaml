# Local Semgrep rules for platform/security/scan.py (tool `semgrep`): offline
# and pinned with the code. ERROR is high (blocks a NEW finding), WARNING is
# medium (reported). The registry's rules run as `semgrep-registry` in CI.
# The eval rules skip tests and research/ (tests evaluate page scripts with
# new Function on purpose; research scripts run their own configs).
# Each rule has a positive and a negative sample in fixtures/semgrep/.
rules:
  - id: py-eval-exec-dynamic
    languages: [python]
    severity: ERROR
    paths:
      exclude: ["*.test.mjs", "*.test.js", "*.test.ts", "test_*.py", "tests/", "research/", "dist/", "*.min.js"]
    message: eval/exec of a value that is not a literal runs whatever that value holds.
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: py-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: yaml.load without a safe loader runs code embedded in the YAML. Use yaml.safe_load.
    pattern-either:
      - pattern: yaml.load($X)
      - pattern: yaml.load($X, Loader=yaml.Loader)
      - pattern: yaml.load($X, Loader=yaml.UnsafeLoader)
      - pattern: yaml.unsafe_load(...)

  - id: py-pickle-load
    languages: [python]
    severity: WARNING
    message: pickle/marshal on data runs code embedded in the data; fine for files this code wrote itself, never for anything a user or the network supplies.
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: marshal.loads(...)

  - id: py-shell-injection
    languages: [python]
    severity: ERROR
    message: A shell command built from a variable with shell=True (or os.system) lets that variable run commands. Pass an argument list.
    pattern-either:
      - patterns:
          - pattern: subprocess.$F($CMD, ..., shell=True, ...)
          - pattern-not: subprocess.$F("...", ..., shell=True, ...)
      - patterns:
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
          - pattern-not: os.system("...")
          - pattern-not: os.popen("...", ...)

  - id: py-tls-verify-off
    languages: [python]
    severity: ERROR
    message: Certificate verification is off; anyone on the network path can read or change the traffic.
    pattern-either:
      - pattern: requests.$F(..., verify=False, ...)
      - pattern: httpx.$F(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)

  - id: py-tarfile-extractall-unfiltered
    languages: [python]
    severity: WARNING
    message: extractall without filter= lets an archive write outside the target directory. Pass filter="data".
    patterns:
      - pattern: $T.extractall(...)
      - pattern-not: $T.extractall(..., filter=..., ...)

  - id: js-child-process-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: A shell command built from a value (template or concatenation) lets that value run commands. Use execFile/spawn with an argument array.
    pattern-either:
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)
      - pattern: exec(`...${$X}...`, ...)
      - pattern: execSync(`...${$X}...`, ...)
      - pattern: $CP.exec("..." + $X, ...)
      - pattern: $CP.execSync("..." + $X, ...)
      - pattern: execSync("..." + $X, ...)

  - id: js-eval-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    paths:
      exclude: ["*.test.mjs", "*.test.js", "*.test.ts", "test_*.py", "tests/", "research/", "dist/", "*.min.js"]
    message: eval / new Function on a value runs whatever that value holds.
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
      - pattern-not: eval("...")
      - pattern-not: new Function("...")

  - id: js-tls-verify-off
    languages: [javascript, typescript]
    severity: ERROR
    message: Certificate verification is off.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: js-inner-html-dynamic
    languages: [javascript, typescript]
    severity: WARNING
    message: innerHTML from a value is an XSS sink. Use textContent, or build nodes.
    patterns:
      - pattern: $EL.innerHTML = $X
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.innerHTML = ``

  - id: sh-curl-pipe-shell
    languages: [bash]
    severity: ERROR
    message: Downloads code and runs it without checking a pinned checksum.
    pattern-either:
      - pattern: curl ... | sh
      - pattern: curl ... | bash
      - pattern: wget ... | sh
      - pattern: wget ... | bash
