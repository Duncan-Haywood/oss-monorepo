# Exception register
#
# Every inline suppression in tracked source must be covered by an entry here.
# `scripts/ci/audit_exceptions.py` enforces it and fails closed; see
# `docs/EXCEPTION-REGISTER.md` for the process and the remediation plan.
#
# Required fields: id, kind, path, owner, issue, reason, compensating_control,
# expires, count.
#
# `path` is an fnmatch glob against the repository-relative path, where `*`
# also matches `/`. `code` is an optional substring that must appear in the
# matched line. `count` is the exact number of occurrences the entry accepts —
# the audit fails if the real number is higher (a new suppression slipped in)
# or lower (the register is stale). Entries are matched in file order and each
# occurrence is claimed once, so put specific entries above broad ones.
#
# `expires` may be at most 180 days out. An exception nobody re-reads is a
# policy change made without review.

exceptions:
  - id: EXC-001
    kind: lint-suppression
    path: ventures/photo-editing/docs-site/*
    code: eslint-disable
    count: 26
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-001
    expires: 2027-01-27
    claims:
      # Corrected 2026-08-06. This said "The generator itself is linted and
      # typechecked". Neither half was true, and the first was not true of
      # anything: `ventures/photo-editing` has no ESLint configuration at all
      # and does not depend on ESLint, so `"lint": "next lint"` resolves to
      # nothing runnable. The suppression this entry accepts is an
      # `eslint-disable`, which made the argument "the linting happens
      # elsewhere" for a venture where linting happens nowhere. The half that
      # was true — `next build` typechecks the generated TSX — is the whole
      # compensating control, and is now the only thing claimed.
      no_lint_config_exists:
        sentence: >-
          venture has no ESLint configuration
        no_file:
          path: ventures/photo-editing/*eslint*
      eslint_is_not_a_dependency:
        sentence: >-
          does not depend on ESLint
        absent:
          path: ventures/photo-editing/docs-site/package.json
          pattern: '"eslint'
      generator_is_outside_the_typecheck_program:
        sentence: >-
          a `.mjs` file that the tsconfig `include` does not name
        absent:
          path: ventures/photo-editing/docs-site/tsconfig.json
          pattern: 'mjs'
      generator_runs_before_every_build:
        sentence: >-
          `prebuild` regenerates the TSX before every `next build`
        present:
          path: ventures/photo-editing/docs-site/package.json
          pattern: '"prebuild":\s*"node scripts/build-docs\.mjs"'
      build_typechecks_the_generated_output:
        sentence: >-
          Next's type check is not disabled
        absent:
          path: ventures/photo-editing/docs-site/next.config.ts
          pattern: 'ignoreBuildErrors'
    reason: >-
      `docs-site/scripts/build-docs.mjs` converts the venture's markdown docs
      into TSX at build time and emits a file-level `/* eslint-disable */` into
      each one. Linting machine-generated markup reports on prose, not on code
      anyone wrote, and no edit to a generated file survives the next build.
    compensating_control: >-
      `prebuild` regenerates the TSX before every `next build`, Next's type
      check is not disabled, and the generated files land under `src/`, which
      the tsconfig `include` covers — so a generator that emits broken TSX
      still fails the build. Only the style rules are suppressed, never types.

      Said "The generator itself is linted and typechecked" until 2026-08-06,
      and it is neither. This venture has no ESLint configuration and does not
      depend on ESLint, so the `eslint-disable` this entry registers is
      suppressing a linter that does not run; and the generator is a `.mjs`
      file that the tsconfig `include` does not name, so `tsc --noEmit` executes
      it and then typechecks everything except it. Both are real gaps, recorded
      here rather than argued away — the remedy is a lint config for the venture
      and `"**/*.mjs"` with `checkJs` for the generator.

  - id: EXC-002
    kind: lint-suppression
    path: ventures/local-site-studio/src/lib/db.ts
    code: "@typescript-eslint/no-explicit-any"
    count: 1
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-002
    expires: 2026-10-31
    reason: >-
      The Convex function names are declared as a hand-written `any` map so the
      SQLite fallback path compiles without the generated Convex client. This is
      real lost type safety on a database-touching module, not a style waiver.
    compensating_control: >-
      Every call through the shim goes to a named string constant in this one
      object, so a typo is a runtime 404 from Convex rather than silent data
      loss. Shorter expiry than the rest: the fix is to generate the client and
      delete the shim.

  - id: EXC-003
    kind: lint-suppression
    path: ventures/quick-pick-survey/src/components/AdminView.tsx
    code: react-hooks/set-state-in-effect
    count: 1
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-003
    expires: 2027-01-27
    reason: >-
      `load()` only calls `setState` after awaiting a fetch. The rule cannot see
      through the async boundary and reports a synchronous set that does not
      happen. Restructuring to satisfy the rule reintroduced the bug the comment
      above it describes, where a failed fetch left the screen on "Checking…".
    compensating_control: >-
      `docs/decisions/0005-session-state-without-effects.md` records the
      decision, and the admin view's tests cover both the success and the
      fetch-failure path that this code exists to fix.

  - id: EXC-004
    kind: lint-suppression
    path: ventures/photo-editing/tests/*
    code: "BLE001"
    count: 1
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-004
    expires: 2027-01-27
    reason: >-
      A test harness catches broad `Exception` to capture failures raised on a
      worker thread. Narrowing it would drop the very failures the test exists
      to observe.
    compensating_control: >-
      The captured exception is re-raised into the assertion, so a swallowed
      failure still fails the test rather than passing quietly.

  - id: EXC-005
    kind: lint-suppression
    path: ventures/ubuntu-agent-server/*
    code: "BLE001"
    count: 1
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-005
    expires: 2027-01-27
    reason: >-
      The agent runner's poll loop catches broad `Exception` so one bad poll
      cannot kill the long-running daemon. This is the documented supervisor
      pattern, not an unexamined catch-all.
    compensating_control: >-
      The handler logs the exception with context before continuing, so failures
      remain visible in the runner's telemetry instead of being discarded.

  - id: EXC-006
    kind: coverage-suppression
    path: ventures/photo-editing/tests/*
    code: "pragma: no cover"
    count: 2
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-006
    expires: 2027-01-27
    reason: >-
      Two `except` clauses in test helpers exist only to re-raise a background
      thread's failure through the assertion. They are uncovered whenever the
      code under test works, which is the normal case.
    compensating_control: >-
      Both are in test code, not production paths, so they cannot inflate the
      production coverage figure the roadmap ratchets.

  - id: EXC-007
    kind: type-suppression
    path: ventures/photo-editing/src/*
    count: 8
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-007
    expires: 2026-10-31
    claims:
      # Corrected 2026-08-06. This said "Every one of the eight raises
      # `AnalysisLoaderError`". Two do. The other six raise their own module's
      # error — `RenderWorkerError`, `ProductionWorkerError`,
      # `ProductionStatusError`, `RenderStatusError` and `AssemblyPlanError`
      # twice — which is a better design than the sentence described, and the
      # sentence was still false. That matters because a reader auditing this
      # entry would grep for `AnalysisLoaderError`, find two, and have no way to
      # tell whether six guards were missing or six names were wrong.
      #
      # The `precedes` predicate is the sentence itself rather than a proxy for
      # it: every `# type: ignore` in the tree must have a guard raising one of
      # the six named errors within six lines above it. Removing a guard fails
      # this, adding an unguarded ignore fails this, and renaming an error
      # without updating the entry fails this.
      every_ignore_sits_behind_a_raising_guard:
        sentence: >-
          Every one of the eight raises on the failing branch before the ignored
          line runs
        precedes:
          path: ventures/photo-editing/src/*.py
          before: 'raise (AnalysisLoaderError|RenderWorkerError|ProductionWorkerError|ProductionStatusError|RenderStatusError|AssemblyPlanError)\('
          after: '#\s*type:\s*ignore'
          within: 6
          equals: 8
      two_of_the_eight_raise_analysis_loader_error:
        sentence: >-
          Two of them — both in `analysis.py` — raise `AnalysisLoaderError`
        precedes:
          path: ventures/photo-editing/src/shootflow/analysis.py
          before: 'raise AnalysisLoaderError\('
          after: '#\s*type:\s*ignore'
          within: 6
          equals: 2
    reason: >-
      Eight `# type: ignore` narrowing casts in production `shootflow` code.
      Six sit immediately after a runtime membership check that mypy cannot use
      to narrow a `str` to a `Literal`; the two in `render_worker.py` and
      `production_worker.py` are `arg-type` ignores on a constructor keyword
      guarded the same way. The check is real; the type system just cannot see
      it.
    compensating_control: >-
      Every one of the eight raises on the failing branch before the ignored
      line runs, so an unexpected value is a loud runtime failure, not a silent
      bad cast. Two of them — both in `analysis.py` — raise
      `AnalysisLoaderError`; the other six raise the error their own module
      defines: `RenderWorkerError`, `ProductionWorkerError`,
      `ProductionStatusError`, `RenderStatusError`, and `AssemblyPlanError`
      twice. This entry claimed all eight raised `AnalysisLoaderError` until
      2026-08-06. Shorter expiry than the rest: these are in production code and
      a `TypeGuard` would remove the need for all of them.

  - id: EXC-008
    kind: type-suppression
    path: ventures/photo-editing/tests/*
    count: 15
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-008
    expires: 2027-01-27
    reason: >-
      Negative type tests. Each line deliberately calls a function with the
      wrong argument type to assert that runtime validation rejects it, so the
      suppression is what makes the test compile at all. Removing them would
      delete the boundary tests, not fix them.
    compensating_control: >-
      Each suppressed call is inside an assertion that the call raises. If
      runtime validation were removed the tests would fail, which is the
      opposite of a suppression hiding a defect.

  - id: EXC-009
    kind: type-suppression
    path: ventures/local-site-studio/src/lib/process/prompt_process.tsx
    count: 1
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-009
    expires: 2027-01-27
    reason: >-
      Not a suppression. A stored engineering lesson quotes the string
      `@ts-expect-error` while explaining the outage one caused. The detector
      matches text and does not parse TypeScript, which is the safe direction to
      be wrong in.
    compensating_control: >-
      The match is inside a string literal in a data file. If it ever became a
      real suppression the count would rise and the audit would fail.

  - id: EXC-011
    kind: lint-suppression
    path: scripts/*
    code: shellcheck disable=SC2016
    count: 3
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-011
    expires: 2027-01-27
    reason: >-
      SC2016 warns that single-quoted `$` and backticks do not expand. These
      three scripts emit Markdown reports where backticks and dollar signs are
      literal output, so the non-expansion is the intent rather than the bug.
    compensating_control: >-
      All three are covered by ShellCheck for every other rule, and
      `scripts/security/test-security-scan.sh` asserts against the generated
      report text, so a genuinely broken interpolation changes the output the
      tests compare.

  - id: EXC-012
    kind: lint-suppression
    path: .gitea/workflows/pairwise-ci.yml
    code: shellcheck disable=SC2317
    count: 1
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-012
    expires: 2027-01-27
    reason: >-
      SC2317 reports the container-smoke `cleanup()` body as unreachable code.
      It is reached through a `trap`, which ShellCheck does not follow.
    compensating_control: >-
      Narrowly scoped to the one function. If the trap were removed the cleanup
      really would be dead, and the smoke step leaks its container, which the
      job's own teardown surfaces.

  - id: EXC-013
    kind: agent-permission-bypass
    path: ventures/local-site-studio/.github/workflows/*-scheduled.yml
    count: 3
    owner: duncan
    expires: 2026-10-29
    issue: docs/EXCEPTION-REGISTER.md#exc-013
    reason: >-
      The Claude, Gemini and Grok scheduled workflows each start their CLI with
      every confirmation gate disabled (`--dangerously-skip-permissions` with
      `--permission-mode bypassPermissions`, `--yolo`, and `--always-approve`
      respectively). Unattended agents cannot answer a prompt, so a scheduled
      run either bypasses the gates or does nothing.
    claims:
      # Corrected 2026-08-06. This said "the workflows unset the provider API
      # keys before handing control to the agent", of three workflows, and it
      # was true of two. The Claude one injects `ANTHROPIC_API_KEY` into the
      # environment of the `--dangerously-skip-permissions
      # --permission-mode bypassPermissions` step and unsets it only inside the
      # `if` branch taken when an OAuth token is *also* present. On the fallback
      # path the file's own header documents, the `else` branch unsets
      # `ANTHROPIC_AUTH_TOKEN` alone and the API key stays live in the bypassed
      # process. So the register generalised a control that two of three
      # workflows implement into one all three were credited with — over the
      # single entry in this file whose own text calls it "the weakest
      # compensating control in the register".
      #
      # Fixed 2026-08-16. `ANTHROPIC_API_KEY` no longer appears anywhere in
      # `claude-scheduled.yml`: the unset is unconditional, and the API-key
      # fallback it was the credential for is gone, so the seed step refuses to
      # start the job without an OAuth credential. The two claims that recorded
      # the exposure — `claude_injects_the_api_key_into_the_bypassed_step`
      # (`count: 2`) and `claude_unset_is_conditional` — went red on the fix, as
      # they were shaped to. They are replaced by their successors below rather
      # than deleted, and `platform/ci/test/agent-credential-exposure.test.mjs`
      # now enforces the same rule structurally over every tracked workflow,
      # which is what makes a *new* bypassed step with a key in it fail rather
      # than only these three files staying clean.
      gemini_and_grok_unset_unconditionally:
        sentence: >-
          The Gemini and Grok workflows unset their provider key unconditionally
        present:
          path: ventures/local-site-studio/.github/workflows/*-scheduled.yml
          pattern: '^\s+unset (GEMINI_API_KEY|XAI_API_KEY)\b'
          at_least: 2
      no_provider_key_reaches_the_bypassed_step:
        sentence: >-
          the Claude workflow no longer names `ANTHROPIC_API_KEY` in any step's
          environment
        absent:
          path: ventures/local-site-studio/.github/workflows/claude-scheduled.yml
          pattern: '^\s+ANTHROPIC_API_KEY:\s+\$\{\{\s*secrets\.'
      claude_unsets_unconditionally:
        sentence: >-
          clears it before the CLI starts on every path, not only the OAuth one
        count:
          path: ventures/local-site-studio/.github/workflows/claude-scheduled.yml
          pattern: '^\s+unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN \|\| true\s*$'
          equals: 1
      opencode_action_holds_no_provider_key:
        sentence: >-
          the OpenCode action step holds no provider key either
        absent:
          path: ventures/local-site-studio/.github/workflows/opencode-scheduled.yml
          pattern: '^\s+[A-Z0-9_]*API_KEY:\s+\$\{\{\s*secrets\.'
      runners_are_github_hosted:
        sentence: >-
          non-interactive on ephemeral GitHub-hosted runners
        absent:
          path: ventures/local-site-studio/.github/workflows/*-scheduled.yml
          pattern: 'runs-on:.*self-hosted'
    compensating_control: >-
      Runs are non-interactive on ephemeral GitHub-hosted runners. The Gemini
      and Grok workflows unset their provider key unconditionally before handing
      control to the agent, and never place it in the step's environment at all.
      Since 2026-08-16 the Claude workflow matches them: it clears it before the
      CLI starts on every path, not only the OAuth one, and the Claude workflow
      no longer names `ANTHROPIC_API_KEY` in any step's environment — the
      API-key fallback it was the credential for is gone, and the seed step
      fails the job when no OAuth credential is configured rather than falling
      back to a key that would travel into the bypassed process. Between
      2026-08-06 and 2026-08-16 this entry recorded the exposure honestly: the
      key was injected into two steps, one of them the bypassed one, and unset
      only when an OAuth token was also present, so on the API-key fallback path
      it was live in a process running with every confirmation gate disabled.
      Until 2026-08-06 the entry instead claimed all three workflows unset the
      key, which was true of two. On the same day the OpenCode workflow was
      cleaned up: the OpenCode action step holds no provider key either, where
      it had carried three — the seeded `auth.json` was already mandatory, so
      the keys the comment called fallbacks were never reachable as fallbacks.

      What no register entry can do is keep this true of the *next* workflow, so
      `platform/ci/test/agent-credential-exposure.test.mjs` enumerates every
      tracked workflow file and fails when a step that disables its
      confirmation gates also declares a provider API key in `env:`. It records
      the two `cursor-agent` steps as the remaining sites, because
      `CURSOR_API_KEY` is that CLI's only credential and removing it would stop
      the workflow rather than harden it; that is a stated position with an
      exact count behind it, not an exemption that grows.

      This is still the weakest compensating control in the register and the
      reason this entry expires in 90 days rather than 180: the bypass is real
      and the blast radius is a writable checkout plus whatever the workflow
      token can reach, and `ventures/ubuntu-agent-server` already documents a
      narrower per-tool allowlist as the pattern these three should adopt.

  - id: EXC-014
    kind: lint-suppression
    path: ventures/quick-pick-survey/src/components/UnifiedRunner.tsx
    code: react-hooks/exhaustive-deps
    count: 1
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-014
    expires: 2026-10-31
    reason: >-
      The keydown handler in UnifiedRunner listens to global window key presses during active survey trial phases.
      Event handlers like handleAnswer, handleSkip, handleUndo update state without useCallback wrappers;
      including them in the effect dependencies causes the event listener to bind and unbind on every render.
    compensating_control: >-
      State variables phase, trial, submitting, undoableSlug are tracked in the dependency array to ensure
      listener correctness without unnecessary re-subscription.

  - id: EXC-015
    kind: lint-suppression
    path: ventures/print-atelier/src/*
    code: react-hooks/set-state-in-effect
    count: 4
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-015
    expires: 2027-01-31
    reason: >-
      Three mount-only effects hydrate state from localStorage — recent capture
      sessions, the checkout cart, and saved artist intakes. localStorage does
      not exist during SSR, so the alternative the rule wants, a lazy useState
      initializer, would make the server's first render and the client's
      disagree and produce a hydration mismatch. The effect is the reason the
      pattern is correct, not an oversight. Same rule and same shape as EXC-003.

      Raised 3 -> 4 on 2026-08-04. The fourth is `setHydrated(true)` on the
      line after the checkout cart's `setCart(...)`, in the same mount-only
      effect and covered by the same argument, added with the fix that stopped
      an empty cart falling back to `buildSampleCheckoutCart()` — which had
      been showing a shopper two priced prints they never chose with a live pay
      button under them. The flag exists because the persist effect beside it
      has to distinguish "cart is empty" from "storage has not been read yet";
      without it, removing the last line never persisted and the removed print
      came back on the next visit. So this is one more line of the same
      pattern, not a new kind of suppression.
    compensating_control: >-
      Each disable is a single next-line suppression sitting on the setState
      call itself, never a file-level one, so any other state set in those
      components is still checked. All four effects have an empty dependency
      array and run once. The one pair that shares an effect writes `cart` and
      `hydrated`, and the effect that reads `hydrated` only ever writes to
      storage — no suppressed setState feeds another effect's state.

  - id: EXC-016
    kind: lint-suppression
    path: ventures/print-atelier/src/components/ProductDetailPreviewCTA.tsx
    code: react-hooks/preserve-manual-memoization
    count: 1
    owner: duncan
    issue: docs/EXCEPTION-REGISTER.md#exc-016
    expires: 2027-01-31
    reason: >-
      React Compiler reports "Compilation Skipped: Existing memoization could not
      be preserved" for this component. It is a statement about what the compiler
      declined to optimise, not a defect: the useMemo it could not prove it
      preserves is hand-written, has a complete dependency array, and behaves
      identically compiled or not.
    compensating_control: >-
      The memoized value feeds a pure comparison function with no side effects,
      so a stale or recomputed result changes render cost and nothing else. The
      component's behaviour is covered by tests/product-detail-preview.test.ts.

