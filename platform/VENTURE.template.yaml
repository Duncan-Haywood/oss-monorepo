# Copy to ventures/<name>/VENTURE.yaml and fill in.
# This file is the contract between a venture and the portfolio router.

name: example-venture
description: One line on what this business actually sells and to whom.

# idea | prototype | launched | revenue | scaling | winding-down
# Stage gates how much the router is willing to spend before demanding
# an outcome signal.
stage: prototype

owner: duncan

# What has to be true for this to be worth continuing. The router does not
# read prose, but you do — keep these honest and dated.
hypotheses:
  - claim: Shops will pay for this monthly.
    status: untested        # untested | supported | refuted
    checked: null           # YYYY-MM-DD

# Where the money is. Nulls are fine early; the router treats an unmeasured
# venture differently from one measured at zero.
economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

# Caps agent spend so one venture cannot drain the portfolio.
# Unit is USD of model spend per month.
budget:
  monthly_cap: 50
  # Explore budget is protected: early ventures get funded even when their
  # measured return is zero, otherwise the router starves everything new.
  protected: true

# Dates that start a clock. A criterion saying "60 days post-launch" needs one
# of these, or it can never fire however the venture performs. Null means the
# event has not happened; `days_since:<name>` then reads NOT_MEASURABLE rather
# than quietly passing.
anchors:
  launched: null
  outreach_started: null

# Stop conditions. When one trips, `portfolio/router/allocate.py` zeroes the
# allocation and flags it.
#
# A criterion is evaluated by `portfolio/router/kill_criteria.py` only if it
# declares `when` conditions. A plain string is accepted, but nothing can
# evaluate it, so it must be parked in `portfolio/kill-criteria-register.yaml`
# with the signal it needs, an owner and an expiry — the gate fails otherwise.
# Prefer the structured form:
kill_criteria:
  - id: no-paying-customer-post-launch
    description: No paying customer 90 days after launch.
    when:
      - metric: days_since:launched
        op: ">="
        value: 90
      - metric: mrr
        op: "=="
        value: 0

  # Metrics available today: mrr, customers, monthly_cost,
  # cumulative_agent_spend_usd, months_recorded,
  # consecutive_months_negative_net, and days_since:<anchor>. A metric outside
  # that set fails as a broken rule rather than becoming a registered gap.
  - id: sustained-negative-unit-economics
    description: Cost exceeded revenue for 3 consecutive recorded months.
    when:
      - metric: consecutive_months_negative_net
        op: ">="
        value: 3

links:
  production: null
  analytics: null

# Engineering controls are part of venture definition, not launch cleanup.
engineering:
  verify_command: null
  coverage:
    lines: 90
    functions: 90
    statements: 90
    branches: 85
  critical_paths:
    - customer outcome or integrity path that needs 95% line / 90% branch coverage
  slo:
    availability: null
    latency: null
    correctness: null
  gitops:
    desired_state: null
    immutable_artifact: true
  security:
    threat_model: null
    data_classification: null
    scan_profile: source, history, dependencies, licenses, IaC, container, image
  measurement:
    outcome: null
    decision_supported: null
    event_schema: null
    data_quality_tests: null
  customer_feedback:
    channels: []
    satisfaction_measure: null
    review_cadence: null
    owner: null
  privacy:
    purpose: null
    lawful_basis: null
    notice_or_consent: null
    retention: null
    deletion: null
    access_owner: null
