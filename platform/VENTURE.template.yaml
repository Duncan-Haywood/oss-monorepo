# Copy to ventures/<name>/VENTURE.yaml and fill in.
# This file is the contract between a venture and the portfolio router.

name: example-venture
description: One line on what this business actually sells and to whom.

# idea | prototype | launched | revenue | scaling | winding-down
# Stage gates how much the router is willing to spend before demanding
# an outcome signal.
stage: prototype

owner: duncan

# What has to be true for this to be worth continuing. The router does not
# read prose, but you do — keep these honest and dated.
hypotheses:
  - claim: Shops will pay for this monthly.
    status: untested        # untested | supported | refuted
    checked: null           # YYYY-MM-DD

# Where the money is. Nulls are fine early; the router treats an unmeasured
# venture differently from one measured at zero.
economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

# Caps agent spend so one venture cannot drain the portfolio.
# Unit is USD of model spend per month.
budget:
  monthly_cap: 50
  # Explore budget is protected: early ventures get funded even when their
  # measured return is zero, otherwise the router starves everything new.
  protected: true

# Stop conditions. When one trips, the router stops allocating and flags it.
# The conditions under which the portfolio stops funding this venture.
#
# A criterion written as prose states intent but cannot be evaluated, and
# `scripts/ci/kill_criteria_ratchet.py` counts a venture whose criteria are all
# prose as having no stopping rule at all. Declare at least one against a metric.
#
# Metrics are read from portfolio/ledger/*.yaml and the vocabulary is fixed in
# portfolio/router/kill_criteria.py: cumulative_agent_spend_usd,
# cumulative_revenue_usd, months_recorded, latest_mrr_usd,
# consecutive_months_zero_mrr. An unrecognised name is unevaluable, not a pass.
kill_criteria:
  - No paying customer after 90 days post-launch.
  - description: >-
      Spend passed the point where this venture has to show revenue, and the
      ledger records none.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 150
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  production: null
  analytics: null

# Engineering controls are part of venture definition, not launch cleanup.
engineering:
  verify_command: null
  coverage:
    lines: 90
    functions: 90
    statements: 90
    branches: 85
  critical_paths:
    - customer outcome or integrity path that needs 95% line / 90% branch coverage
  slo:
    availability: null
    latency: null
    correctness: null
  gitops:
    desired_state: null
    immutable_artifact: true
  security:
    threat_model: null
    data_classification: null
    scan_profile: source, history, dependencies, licenses, IaC, container, image
  measurement:
    outcome: null
    decision_supported: null
    event_schema: null
    data_quality_tests: null
  customer_feedback:
    channels: []
    satisfaction_measure: null
    review_cadence: null
    owner: null
  privacy:
    purpose: null
    lawful_basis: null
    notice_or_consent: null
    retention: null
    deletion: null
    access_owner: null
