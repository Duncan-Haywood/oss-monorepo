# Generated by platform/distribution/ghaction.mjs from ventures/actions-runtime-deprecation-check/check.py. Do not edit.
name: 'Actions Runtime Deprecation Check'
description: 'Free, read-only CLI that scans GitHub Actions workflows for first-party actions (checkout, setup-node, cache,…'
author: oss-monorepo contributors
branding:
  icon: shield
  color: gray-dark
inputs:
  path:
    description: Space-separated files or directories to scan, relative to the workspace.
    required: false
    default: '.'
  fail-on-risk:
    description: Exit non-zero (2) when the tool reports a finding. Set to 'false' to only report.
    required: false
    default: 'true'
  format:
    description: Output format (text or json; some tools also support sarif).
    required: false
    default: text
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOOL: ${{ github.action_path }}/../../../../ventures/actions-runtime-deprecation-check/check.py
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON_RISK: ${{ inputs.fail-on-risk }}
        OUT_FORMAT: ${{ inputs.format }}
      run: |
        set -f
        args=(--format "$OUT_FORMAT")
        if [ "$FAIL_ON_RISK" = "true" ]; then args+=(--fail-on-risk); fi
        # $SCAN_PATH is split on spaces on purpose (several paths); globbing is off.
        python3 "$TOOL" "${args[@]}" $SCAN_PATH
