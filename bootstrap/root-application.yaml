# The only snowflake Application. After this exists, 100% of cluster
# desired state is gitops/ on main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hel1-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Duncan-Haywood/monorepo-projects.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
