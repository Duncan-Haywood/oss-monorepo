name: CI

on:
  push:
    branches-ignore: []
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline/ tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - working-directory: pipeline
        run: npm ci
      - working-directory: pipeline
        run: npm test
      - working-directory: pipeline
        run: npx tsc --noEmit

  docs-site:
    name: docs-site/ build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - working-directory: docs-site
        run: npm ci
      - working-directory: docs-site
        run: npm run build

  research:
    name: research/ build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: research/package-lock.json
      - working-directory: research
        run: npm ci
      - working-directory: research
        run: npm run build
