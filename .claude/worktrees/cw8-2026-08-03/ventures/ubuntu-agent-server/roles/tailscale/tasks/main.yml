---
- name: Add Tailscale apt repo
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: "https://pkgs.tailscale.com/stable/ubuntu"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
  register: tailscale_repo

- name: Update apt cache after adding tailscale repo
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo.changed

- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Bring up tailscale with an authkey (non-interactive)
  ansible.builtin.command:
    cmd: "tailscale up --authkey={{ tailscale_authkey }} --ssh"
  when: tailscale_authkey | length > 0
  changed_when: true

- name: Tailscale manual-auth reminder
  ansible.builtin.debug:
    msg: >-
      No tailscale_authkey was provided, so tailscaled is installed and running
      but NOT joined to your tailnet yet. SSH in over LAN/console and run
      `sudo tailscale up` once, interactively, to authorize this node.
  when: tailscale_authkey | length == 0
