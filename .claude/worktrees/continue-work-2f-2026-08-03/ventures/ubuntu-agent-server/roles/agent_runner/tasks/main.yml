---
- name: Install PyYAML (agent_runner.py needs it, no venv — keep this simple)
  ansible.builtin.apt:
    name: python3-yaml
    state: present

- name: Add GitHub CLI apt repo
  ansible.builtin.deb822_repository:
    name: github-cli
    types: deb
    uris: "https://cli.github.com/packages"
    suites: stable
    components: main
    signed_by: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
  register: ghcli_repo

- name: Update apt cache after adding GitHub CLI repo
  ansible.builtin.apt:
    update_cache: true
  when: ghcli_repo.changed

- name: Install gh CLI
  ansible.builtin.apt:
    name: gh
    state: present

- name: Check whether gitleaks is already installed
  ansible.builtin.command: gitleaks version
  register: gitleaks_check
  failed_when: false
  changed_when: false

# gitleaks isn't in Ubuntu's apt repos, and as of writing the project
# itself is winding down (maintainer departed, "feature complete," a
# spiritual successor called Betterleaks has emerged) — not confident
# enough in any specific pinned version number to hardcode one without it
# plausibly being stale already. Resolving "latest" via the GitHub API at
# playbook-run time instead. Worth revisiting which secret scanner this
# should be in a few months; this is a reasonable default today, not a
# permanent choice.
- name: Install gitleaks (secret scan before any push — see agent_runner.py)
  when: (gitleaks_check.rc | default(1)) != 0
  block:
    - name: Resolve latest gitleaks release
      ansible.builtin.uri:
        url: https://api.github.com/repos/gitleaks/gitleaks/releases/latest
        return_content: true
      register: gitleaks_latest

    - name: Download gitleaks
      ansible.builtin.get_url:
        url: >-
          https://github.com/gitleaks/gitleaks/releases/download/{{ gitleaks_latest.json.tag_name }}/gitleaks_{{
          gitleaks_latest.json.tag_name | regex_replace('^v', '') }}_linux_x64.tar.gz
        dest: /tmp/gitleaks.tar.gz
        mode: "0644"

    - name: Extract gitleaks binary
      ansible.builtin.unarchive:
        src: /tmp/gitleaks.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: gitleaks
        mode: "0755"

    - name: Clean up gitleaks archive
      ansible.builtin.file:
        path: /tmp/gitleaks.tar.gz
        state: absent

- name: Create /srv/agents directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"
  loop:
    - /srv/agents
    - /srv/agents/config
    - /srv/agents/workspaces
    - /srv/agents/logs
    - /srv/agents/state
    - /srv/agents/bin
    - /srv/agents/bin/runners

- name: Deploy agent_runner.py
  ansible.builtin.copy:
    src: agent_runner.py
    dest: /srv/agents/bin/agent_runner.py
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"

- name: Deploy per-tool runner scripts
  ansible.builtin.copy:
    src: "runners/{{ item }}"
    dest: "/srv/agents/bin/runners/{{ item }}"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"
  loop:
    - claude.sh
    - codex.sh
    - antigravity.sh
    - opencode.sh

# repos.yml is real, version-controlled config now (config/repos.yml in
# this repo) — not something you SSH in and hand-edit. Overwriting it on
# every run is the point: the box's config always matches what's in git.
- name: Deploy repos.yml from this repo's config/repos.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/config/repos.yml"
    dest: /srv/agents/config/repos.yml
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0644"

# The kill switch is directly driven by agent_runner_start_disabled every
# run — not just on first install. Set true in group_vars/all.yml (or -e)
# to durably pause everything; set false to durably resume. A manual
# `touch`/`rm` on the box works too but gets overwritten back to whatever
# the var says next time you run this playbook — the var in git is meant
# to be the actual source of truth, not server-side state.
- name: Enforce kill switch state
  ansible.builtin.file:
    path: /srv/agents/DISABLED
    state: "{{ 'touch' if agent_runner_start_disabled else 'absent' }}"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0644"

- name: Deploy agent-runner systemd service
  ansible.builtin.template:
    src: agent-runner.service.j2
    dest: /etc/systemd/system/agent-runner.service
    mode: "0644"
  notify: Reload systemd

- name: Deploy agent-runner systemd timer
  ansible.builtin.template:
    src: agent-runner.timer.j2
    dest: /etc/systemd/system/agent-runner.timer
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so the timer unit is known before we enable it
  ansible.builtin.meta: flush_handlers

- name: Enable and start the agent-runner timer
  ansible.builtin.systemd:
    name: agent-runner.timer
    enabled: true
    state: started

- name: Check gh auth status
  ansible.builtin.command: gh auth status
  become: true
  become_user: "{{ agent_user }}"
  register: gh_auth_status
  changed_when: false
  failed_when: false

- name: Gh auth reminder
  ansible.builtin.debug:
    msg: >-
      `gh` is not authenticated as {{ agent_user }} yet — the agent runner
      can't create PRs or read issues until you fix that. SSH in and run
      `gh auth login` (device-code flow works fine over SSH), then
      `gh auth setup-git` so plain `git clone`/`push` also use it.
  when: "'Logged in' not in gh_auth_status.stdout"

- name: Load repos.yml for status reporting
  ansible.builtin.set_fact:
    configured_repos: "{{ (lookup('file', playbook_dir + '/config/repos.yml') | from_yaml).repos | default([]) }}"

- name: Repos.yml status
  ansible.builtin.debug:
    msg: >-
      config/repos.yml (in this repo) currently has no repos configured —
      the agent runner has nothing to do until you add some there and
      re-run this playbook.
  when: configured_repos | length == 0

- name: Kill switch status
  ansible.builtin.debug:
    msg: >-
      {{ 'Agent runner is DISABLED (agent_runner_start_disabled: true in group_vars) — '
         + 'the timer runs on schedule but the script exits immediately and touches nothing.'
         if agent_runner_start_disabled
         else 'Agent runner is ENABLED — it will act on whatever is in config/repos.yml.' }}
