apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-first-markets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.marisstella.dev/giteaadmin/monorepo-projects.git
    targetRevision: HEAD
    path: platform/k8s/apps/ai-first-markets
  destination:
    server: https://kubernetes.default.svc
    namespace: web-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
