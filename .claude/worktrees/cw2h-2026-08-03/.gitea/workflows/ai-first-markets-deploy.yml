name: Deploy AI-First Markets

on:
  push:
    branches: [main]
    paths:
      - "ventures/ai-first-markets/**"
      - ".gitea/workflows/ai-first-markets-*.yml"
      - "scripts/ci/verify-component.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-first-markets-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: ventures/ai-first-markets

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventures/ai-first-markets/package-lock.json
      - name: Install dependencies
        run: npm ci
      # The gate sequence used to be inlined here, and it had lost `npm test`.
      # Typecheck, lint, build and cf:build ran; the venture's unit tests did
      # not, so a failing test never stopped a production release. The CI
      # workflow on the same push paths does run them, but this job carries no
      # `needs:` on it, so the two race and the deploy does not wait.
      #
      # Calling the shared script instead of restating its steps is the fix:
      # scripts/ci/verify-component.sh is the one declaration CI, the pre-push
      # hook and a developer's terminal all execute, so this job cannot drift
      # below it again. platform/ci/test/deploy-gate-contract.test.mjs fails
      # closed if a deploy step reappears without it.
      - name: Run the same fail-closed application gate used locally and in CI
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/verify-component.sh ai-first-markets
      - name: Deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
