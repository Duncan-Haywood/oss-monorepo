name: eu-packaging-regulation-checker
description: >-
  Free browser tool that gives a first read of the EU Packaging and Packaging Waste Regulation (PPWR, Regulation (EU) 2025/40) for a maker, importer or online seller of packaged goods: which duties reach the packaging, the date each applies from (PFAS and heavy-metal limits, producer registration, labelling, recyclability, recycled content, empty space), whether an EU operator stands behind it, and what is still open. Nothing is uploaded. Not legal advice.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; no packaging-regulation tool in ventures/ (duplicate_check top hit 0.09, import-landed-cost-calculator). Not in screened-out.md.
#
# First visitor: an online shop owner, brand or packaging buyer asking "does PPWR apply to me", "EU packaging EPR as a non-EU seller", "PPWR 12 August 2026",
# "50% empty space rule e-commerce". The Regulation applies from 12 August 2026, so questions are current. Volume not measured with an external tool.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: per-SKU packaging data sheet and per-country EPR registration
# checklist, behind an env-var switch.
#
# Liability: first read of the Regulation's scope and dates; rejects bad input, says plainly that delegated and implementing acts and national enforcement decide,
# does not model micro-enterprise derogations, carries no-warranty and not-legal-advice clauses. Dates and Article numbers were written from memory without
# network access to EUR-Lex in the building session and must be verified; ethical risk is false comfort from an "out" result or a stale date.

hypotheses:
  - claim: >-
      Online sellers, brands and packaging makers facing the 12 August 2026 start of the PPWR will use a free checker to learn which duties reach their packaging and by when.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a date, scope or Article reference differs from the Regulation's text (or a later implementing act) on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/eu-packaging-regulation-checker/
  analytics: null
