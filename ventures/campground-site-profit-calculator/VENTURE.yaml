name: campground-site-profit-calculator
description: >-
  Free browser tool for campground and RV park owners: enter sites, months open, occupancy, nightly rate, stay length,
  per-stay fee, utilities, turnover labour, booking commission and yearly fixed costs, and see yearly profit,
  break-even occupancy, the nightly rate that breaks even or reaches your target, and profit at each occupancy level.
  Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06. No campground or RV park operator tool in ventures/ (rv-rental-host-profit-calculator is the
# adjacent rental-unit tool; mobile-detailing and storage are unrelated), not in screened-out.md.
# First visitor: an owner or prospective buyer searching "is a campground profitable", "RV park break even occupancy",
# "how much to charge per campsite"; also r/campgrounds-style owner threads and listings of parks for sale.
#
# Who: small independent campground and RV park owners and buyers who treat fixed costs as monthly while income is seasonal.
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. A direct-booking page and
# seasonal-pricing tool for independent parks is the possible paid version, not built.
# Liability: arithmetic on the user's own figures with visible rules; carries the no-warranty and not-advice clauses
# and lists what is not decided (zoning, permits, taxes, seasonality mix).
# Unverified: no market rate is claimed; the sample figures are illustrative only.

hypotheses:
  - claim: >-
      A campground owner or buyer will enter sites, season length, occupancy and costs to find break-even occupancy and
      the nightly rate they need, because yearly fixed costs against a short season hide how thin the margin is.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool by 2027-03-15.
  - A report that the profit arithmetic differs from the stated rules on the same inputs.
