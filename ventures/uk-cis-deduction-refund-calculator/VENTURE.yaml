name: uk-cis-deduction-refund-calculator
description: >-
  Free browser tool for UK construction subcontractors on the Construction Industry Scheme: enter an invoice to see the 20% or 30% deduction, or a year of labour and costs to estimate Self Assessment tax, Class 4 NI and the CIS refund due. Flags the cost of being unregistered and the gross payment status turnover test. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; duplicate_check.py top match scored 0.11 (no CIS tool in ventures/).
#
# First visitor: UK bricklayer, sparky, plasterer or labour-only subcontractor searching "CIS refund calculator", "CIS tax deduction calculator", "how much CIS tax will I get back".
# Audience: well over a hundred thousand UK CIS subcontractors file each year; volume not measured.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: monthly statement tracker and refund-timing planner behind an env-var switch.
#
# Liability: rules written from memory without network access; every result names HMRC as the source to verify, carries no-warranty and not-tax-advice clauses,
# and says what it does not decide (Scottish rates, other income, partnerships/companies, the HMRC gross payment tests, VAT reverse charge). Ethical risk is a wrong refund expectation, mitigated by "estimate" wording and verification notes.
hypotheses:
  - claim: >-
      UK CIS subcontractors will use a free calculator to estimate their refund and spot a wrong deduction rate.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a rate or threshold differs from HMRC guidance on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-cis-deduction-refund-calculator/
  analytics: null
