name: Cursor Agent scheduled agents

# Cursor Agent CLI, authenticated by OAuth cli-config from `agent login`
# (CURSOR_CLI_CONFIG → ~/.cursor/cli-config.json).
#
# CURSOR_API_KEY is deliberately NOT accepted here — see the run step below.
# Runs both repo prompts hourly (stagger :40).

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work
      model:
        description: Optional Cursor model id (empty = CLI default)
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        run: |
          kind="${{ github.event.inputs.prompt_kind || 'both' }}"
          if [ "$kind" = "both" ] || [ "$kind" = "" ]; then
            echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
          else
            echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
          fi

  cursor:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: cursor-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Cursor Agent CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Cursor OAuth cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cursor/cli-config.json
            ~/.cursor/auth.json
          key: cursor-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            cursor-oauth-auth-

      - name: Seed Cursor OAuth config
        env:
          CURSOR_CLI_CONFIG: ${{ secrets.CURSOR_CLI_CONFIG }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.cursor"
          if [ -n "${CURSOR_CLI_CONFIG:-}" ]; then
            .github/scripts/restore-oauth-auth.sh "$HOME/.cursor/cli-config.json" CURSOR_CLI_CONFIG
          fi
          # Fail here rather than let the run step start without a credential.
          # This is the shape `claude-scheduled.yml` was moved to on 2026-08-16
          # and the reason is the same: CURSOR_API_KEY used to satisfy this
          # check and then travel into the gate-disabling run step below as the
          # fallback credential. It no longer goes there, so accepting it here would
          # only move the failure later and make it harder to read. The cache
          # restore above can supply either file, so a warm run needs no secret.
          if [ ! -s "$HOME/.cursor/cli-config.json" ] && [ ! -s "$HOME/.cursor/auth.json" ]; then
            echo "::error::Set CURSOR_CLI_CONFIG (from ~/.cursor/cli-config.json after \`agent login\`). CURSOR_API_KEY is not accepted: this job runs the CLI with every confirmation gate disabled, so a provider key in that step is readable by the agent it is supervising."
            exit 1
          fi
          echo "Cursor OAuth credential is present for this job."

      - name: Prepare prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "cursor-agent" \
            "${{ matrix.prompt_kind }}"

      - name: Configure git
        run: |
          git config user.name "cursor-scheduled[bot]"
          git config user.email "cursor-scheduled[bot]@users.noreply.github.com"

      - name: Run Cursor Agent (headless)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_INPUT: ${{ github.event.inputs.model || '' }}
        run: |
          set -euo pipefail
          # No provider API key reaches this step. The ARGS below run the Cursor
          # CLI with every confirmation gate disabled, so anything in this
          # environment is readable by the agent it is supervising, and a
          # dashboard API key is a standing charge on an account rather than one
          # repository's token. Until 2026-08-17 `CURSOR_API_KEY` sat in this
          # `env:` unconditionally, on every path, with no `unset` anywhere in
          # the file — worse than the Claude defect that motivated the rule,
          # because there was no branch on which it was absent. The credential
          # is now the seeded ~/.cursor/cli-config.json alone, and the seed step
          # above refuses to start the job without one. The `unset` is the
          # unconditional shape the Gemini and Grok workflows use: it is
          # defence in depth against a repository- or organisation-level
          # variable of the same name, which no `env:` block here would show.
          #
          # These comments deliberately do not spell out the bypass flag itself.
          # The detector in scripts/ci/audit_exceptions.py counts matching lines,
          # so naming it in prose would raise EXC-013's count with comments that
          # bypass nothing — and "raise the count to match" is how a ratchet ends
          # up aligned to a pile rather than to reality.
          unset CURSOR_API_KEY || true
          command -v agent || command -v cursor-agent
          AGENT_BIN="$(command -v agent || command -v cursor-agent)"
          PROMPT="$(cat "$PROMPT_FILE")"
          ARGS=(-p --force)
          if [ -n "${MODEL_INPUT:-}" ]; then
            ARGS+=(--model "$MODEL_INPUT")
          fi
          "$AGENT_BIN" "${ARGS[@]}" "$PROMPT"

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cursor/cli-config.json
            ~/.cursor/auth.json
          key: cursor-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
