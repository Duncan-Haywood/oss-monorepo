name: Codex scheduled agents

# ChatGPT OAuth (not API key). Seed CODEX_AUTH_JSON from ~/.codex/auth.json
# after `codex login` with cli_auth_credentials_store = "file".
# Model: gpt-5.6-luna. Runs both repo prompts hourly (stagger :00).

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        env:
          PROMPT_KIND_INPUT: ${{ github.event.inputs.prompt_kind }}
        run: |
          # workflow_dispatch's `type: choice` is UI-only — the REST/GraphQL
          # API accepts any string, so this must not raw-interpolate
          # ${{ github.event.inputs.* }} into a run: script (script
          # injection) and must hard-reject any value outside the known set
          # rather than pass it through into $GITHUB_OUTPUT / matrix.*.
          kind="${PROMPT_KIND_INPUT:-both}"
          case "$kind" in
            both|"")
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
            dev-work|continuous-work)
              echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Unrecognized prompt_kind '${kind}', falling back to both."
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  codex:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: codex-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    env:
      CODEX_HOME: ${{ github.workspace }}/.codex-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Restore Codex OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CODEX_HOME }}/auth.json
          key: codex-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            codex-oauth-auth-

      - name: Seed Codex OAuth auth.json
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$CODEX_HOME"
          printf '%s\n' 'cli_auth_credentials_store = "file"' 'model = "gpt-5.6-luna"' > "$CODEX_HOME/config.toml"
          .github/scripts/restore-oauth-auth.sh "$CODEX_HOME/auth.json" CODEX_AUTH_JSON

      - name: Prepare prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "codex-gpt-5.6-luna" \
            "${{ matrix.prompt_kind }}"

      - name: Configure git
        run: |
          git config user.name "codex-scheduled[bot]"
          git config user.email "codex-scheduled[bot]@users.noreply.github.com"

      - name: Run Codex (gpt-5.6-luna, OAuth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PROMPT="$(cat "$PROMPT_FILE")"
          # GitHub-hosted runners are already isolated; agents need network for gh/npm.
          # `--ask-for-approval` is no longer accepted by the current Codex CLI
          # (`codex exec --help` doesn't list it); use the config-key override
          # instead, verified against the CLI's own --help output.
          codex exec \
            --model gpt-5.6-luna \
            --sandbox danger-full-access \
            -c 'approval_policy="never"' \
            -c 'cli_auth_credentials_store="file"' \
            "$PROMPT"

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CODEX_HOME }}/auth.json
          key: codex-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
