name: Claude Code scheduled agents

# Claude Code subscription OAuth only — no ANTHROPIC_API_KEY fallback.
# Required CI secret: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN
# Optional file seed (Linux layout): CLAUDE_CREDENTIALS_JSON → ~/.claude/.credentials.json
#   On macOS, interactive login stores tokens in Keychain, so use setup-token for CI.
# Do not pass --bare (it skips OAuth / CLAUDE_CODE_OAUTH_TOKEN).
# Runs both repo prompts hourly (stagger :50).

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work
      model:
        description: Optional Claude model id (empty = CLI default)
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        env:
          PROMPT_KIND_INPUT: ${{ github.event.inputs.prompt_kind }}
        run: |
          # workflow_dispatch's `type: choice` is UI-only — the REST/GraphQL
          # API accepts any string, so this must not raw-interpolate
          # ${{ github.event.inputs.* }} into a run: script (script
          # injection) and must hard-reject any value outside the known set
          # rather than pass it through into $GITHUB_OUTPUT / matrix.*.
          kind="${PROMPT_KIND_INPUT:-both}"
          case "$kind" in
            both|"")
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
            dev-work|continuous-work)
              echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Unrecognized prompt_kind '${kind}', falling back to both."
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  claude:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: claude-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Restore Claude OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.claude/.credentials.json
          key: claude-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            claude-oauth-auth-

      - name: Seed Claude OAuth credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.claude"
          if [ -n "${CLAUDE_CREDENTIALS_JSON:-}" ]; then
            .github/scripts/restore-oauth-auth.sh "$HOME/.claude/.credentials.json" CLAUDE_CREDENTIALS_JSON
          fi
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ ! -s "$HOME/.claude/.credentials.json" ]; then
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN (from \`claude setup-token\`) or CLAUDE_CREDENTIALS_JSON (Linux ~/.claude/.credentials.json). This workflow is subscription-only; it does not fall back to ANTHROPIC_API_KEY."
            exit 1
          fi
          echo "CLAUDE_CODE_OAUTH_TOKEN/credentials file present for this job."

      - name: Prepare prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "claude-code" \
            "${{ matrix.prompt_kind }}"

      - name: Configure git
        run: |
          git config user.name "claude-scheduled[bot]"
          git config user.email "claude-scheduled[bot]@users.noreply.github.com"

      - name: Run Claude Code (headless, OAuth)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_INPUT: ${{ github.event.inputs.model || '' }}
        run: |
          set -euo pipefail
          # Subscription OAuth only — never let a stray API key override it.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN || true
          PROMPT="$(cat "$PROMPT_FILE")"
          ARGS=(-p --dangerously-skip-permissions --permission-mode bypassPermissions)
          if [ -n "${MODEL_INPUT:-}" ]; then
            ARGS+=(--model "$MODEL_INPUT")
          fi
          claude "${ARGS[@]}" "$PROMPT"

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.claude/.credentials.json
          key: claude-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
