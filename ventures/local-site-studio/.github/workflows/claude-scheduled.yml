name: Claude Code scheduled agents

# Claude Code subscription OAuth (not ANTHROPIC_API_KEY).
# Required CI secret: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN
# Or file seed (Linux layout): CLAUDE_CREDENTIALS_JSON → ~/.claude/.credentials.json
#   On macOS, interactive login stores tokens in Keychain, so use setup-token for CI.
# ANTHROPIC_API_KEY is deliberately NOT accepted here — see the run step below.
# Do not pass --bare (it skips OAuth / CLAUDE_CODE_OAUTH_TOKEN).
# Runs both repo prompts hourly (stagger :50).

on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work
      model:
        description: Optional Claude model id (empty = CLI default)
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        run: |
          kind="${{ github.event.inputs.prompt_kind || 'both' }}"
          if [ "$kind" = "both" ] || [ "$kind" = "" ]; then
            echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
          else
            echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
          fi

  claude:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: claude-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Restore Claude OAuth cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.claude/.credentials.json
          key: claude-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            claude-oauth-auth-

      - name: Seed Claude OAuth credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CREDENTIALS_JSON: ${{ secrets.CLAUDE_CREDENTIALS_JSON }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.claude"
          if [ -n "${CLAUDE_CREDENTIALS_JSON:-}" ]; then
            .github/scripts/restore-oauth-auth.sh "$HOME/.claude/.credentials.json" CLAUDE_CREDENTIALS_JSON
          fi
          # Fail here rather than let the run step start without a credential.
          # ANTHROPIC_API_KEY used to satisfy this check and then travel into the
          # bypassed step as the fallback credential; the whole point of the
          # change is that it no longer goes there, so accepting it here would
          # only move the failure later and make it harder to read.
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] && [ ! -s "$HOME/.claude/.credentials.json" ]; then
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN (from \`claude setup-token\`) or CLAUDE_CREDENTIALS_JSON (Linux ~/.claude/.credentials.json). ANTHROPIC_API_KEY is not accepted: this job runs the CLI with every confirmation gate disabled, so a provider key in that step is readable by the agent it is supervising."
            exit 1
          fi
          echo "Claude OAuth credential is present for this job."

      - name: Prepare prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "claude-code" \
            "${{ matrix.prompt_kind }}"

      - name: Configure git
        run: |
          git config user.name "claude-scheduled[bot]"
          git config user.email "claude-scheduled[bot]@users.noreply.github.com"

      - name: Run Claude Code (headless, OAuth)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_INPUT: ${{ github.event.inputs.model || '' }}
        run: |
          set -euo pipefail
          # No provider API key reaches this step. It runs the CLI with every
          # confirmation gate disabled, so anything in its environment is
          # readable by the agent it is supervising, and a Console API key is a
          # standing charge on an account rather than one repository's token.
          # This is the unconditional shape the Gemini and Grok workflows use;
          # until 2026-08-16 the unset here fired only inside
          # `if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]`, so on the API-key fallback
          # path — the one the file's own header documented — the key stayed
          # live in the bypassed process. The fallback is gone with it: the
          # credential is the subscription OAuth token or the seeded
          # ~/.claude/.credentials.json, and the seed step above refuses to
          # start the job without one.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN || true
          PROMPT="$(cat "$PROMPT_FILE")"
          ARGS=(-p --dangerously-skip-permissions --permission-mode bypassPermissions)
          if [ -n "${MODEL_INPUT:-}" ]; then
            ARGS+=(--model "$MODEL_INPUT")
          fi
          claude "${ARGS[@]}" "$PROMPT"

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.claude/.credentials.json
          key: claude-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
