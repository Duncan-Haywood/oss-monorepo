name: Gemini scheduled agents

# Google discontinued individual/personal OAuth for Gemini Code Assist (the old
# `gemini` CLI) on 2026-06-18 — IneligibleTierError, migrate to Antigravity CLI
# (`agy`). This workflow now runs `agy` with Google subscription OAuth instead
# (not GEMINI_API_KEY / ANTIGRAVITY_API_KEY — those are metered, not subscription).
# Seed ANTIGRAVITY_OAUTH_TOKEN from ~/.gemini/antigravity-cli/antigravity-oauth-token
# after `agy auth login`.
# Known upstream issue: file-based token restore in fresh headless Linux
# containers can be write-only (google-antigravity/antigravity-cli#479) — if
# this job starts failing auth after a clean cache, re-run `agy auth login`
# locally and reseed the secret; do not add an API key fallback.
# Runs both repo prompts hourly (stagger :10).

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        env:
          PROMPT_KIND_INPUT: ${{ github.event.inputs.prompt_kind }}
        run: |
          # workflow_dispatch's `type: choice` is UI-only — the REST/GraphQL
          # API accepts any string, so this must not raw-interpolate
          # ${{ github.event.inputs.* }} into a run: script (script
          # injection) and must hard-reject any value outside the known set
          # rather than pass it through into $GITHUB_OUTPUT / matrix.*.
          kind="${PROMPT_KIND_INPUT:-both}"
          case "$kind" in
            both|"")
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
            dev-work|continuous-work)
              echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Unrecognized prompt_kind '${kind}', falling back to both."
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  gemini:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: gemini-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Antigravity OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.gemini/antigravity-cli/antigravity-oauth-token
          key: antigravity-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            antigravity-oauth-auth-

      - name: Seed Antigravity OAuth token
        env:
          ANTIGRAVITY_OAUTH_TOKEN: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.gemini/antigravity-cli"
          .github/scripts/restore-oauth-auth.sh \
            "$HOME/.gemini/antigravity-cli/antigravity-oauth-token" ANTIGRAVITY_OAUTH_TOKEN

      - name: Prepare prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "antigravity" \
            "${{ matrix.prompt_kind }}"

      - name: Configure git
        run: |
          git config user.name "gemini-scheduled[bot]"
          git config user.email "gemini-scheduled[bot]@users.noreply.github.com"

      - name: Run Antigravity (headless, subscription OAuth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Subscription OAuth only — never let a stray API key override it.
          unset GEMINI_API_KEY GOOGLE_API_KEY ANTIGRAVITY_API_KEY || true
          agy --headless --approve all \
            -p "$(cat "$PROMPT_FILE")"

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.gemini/antigravity-cli/antigravity-oauth-token
          key: antigravity-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
