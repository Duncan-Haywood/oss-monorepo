name: OpenCode scheduled agents

# OpenCode OAuth via ~/.local/share/opencode/auth.json.
# Seed OPENCODE_AUTH from a local `opencode auth login` session.
# Runs both repo prompts hourly (stagger :20).

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work
      model:
        description: OpenCode provider/model id
        required: false
        default: opencode/deepseek-v4-flash

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        run: |
          kind="${{ github.event.inputs.prompt_kind || 'both' }}"
          if [ "$kind" = "both" ] || [ "$kind" = "" ]; then
            echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
          else
            echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
          fi

  opencode:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: opencode-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore OpenCode OAuth cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/opencode/auth.json
          key: opencode-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            opencode-oauth-auth-

      - name: Seed OpenCode OAuth auth.json
        env:
          OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.local/share/opencode"
          .github/scripts/restore-oauth-auth.sh "$HOME/.local/share/opencode/auth.json" OPENCODE_AUTH

      - name: Prepare prompt
        id: prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "opencode" \
            "${{ matrix.prompt_kind }}"
          PROMPT_PATH="${RUNNER_TEMP:-/tmp}/agent-prompt.md"
          {
            echo "body<<PROMPT_EOF"
            cat "$PROMPT_PATH"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run OpenCode (OAuth)
        uses: anomalyco/opencode/github@a105350812f05f914c768e468559dbd6bd508d8e # v1.18.13
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Three provider API keys — OPENAI_API_KEY, ANTHROPIC_API_KEY and
          # GOOGLE_GENERATIVE_AI_API_KEY — were declared here until 2026-08-16,
          # commented "optional API keys are fallbacks only". They were never
          # fallbacks: the seed step above calls restore-oauth-auth.sh, which
          # exits 1 when OPENCODE_AUTH is unset and no cached auth.json exists,
          # so the job cannot reach this step without the OAuth credential the
          # comment calls primary. What they were was three account-level
          # credentials handed to an unattended third-party agent action, in a
          # step whose `run:` is somebody else's code and where no `unset` is
          # even possible — the Claude, Gemini and Grok steps at least get to
          # clear their own environment before the agent starts.
        with:
          model: ${{ github.event.inputs.model || 'opencode/deepseek-v4-flash' }}
          prompt: ${{ steps.prompt.outputs.body }}
          use_github_token: true

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/opencode/auth.json
          key: opencode-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
