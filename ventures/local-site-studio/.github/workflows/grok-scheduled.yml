name: Grok Build scheduled agents

# Grok Build SuperGrok / X Premium+ OAuth (not XAI_API_KEY).
# Seed GROK_AUTH_JSON from ~/.grok/auth.json after `grok login`.
# Runs both repo prompts hourly (stagger :30).

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      prompt_kind:
        description: Which prompt to run
        required: true
        default: both
        type: choice
        options:
          - both
          - dev-work
          - continuous-work

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-prompts:
    runs-on: ubuntu-latest
    outputs:
      prompts: ${{ steps.set.outputs.prompts }}
    steps:
      - id: set
        shell: bash
        env:
          PROMPT_KIND_INPUT: ${{ github.event.inputs.prompt_kind }}
        run: |
          # workflow_dispatch's `type: choice` is UI-only — the REST/GraphQL
          # API accepts any string, so this must not raw-interpolate
          # ${{ github.event.inputs.* }} into a run: script (script
          # injection) and must hard-reject any value outside the known set
          # rather than pass it through into $GITHUB_OUTPUT / matrix.*.
          kind="${PROMPT_KIND_INPUT:-both}"
          case "$kind" in
            both|"")
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
            dev-work|continuous-work)
              echo "prompts=[\"${kind}\"]" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Unrecognized prompt_kind '${kind}', falling back to both."
              echo 'prompts=["dev-work","continuous-work"]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  grok:
    needs: resolve-prompts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        prompt_kind: ${{ fromJSON(needs.resolve-prompts.outputs.prompts) }}
    concurrency:
      group: grok-scheduled-${{ matrix.prompt_kind }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Grok Build CLI
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          command -v grok || ls -la "$HOME/.local/bin" "$HOME/bin" 2>/dev/null || true

      - name: Restore Grok OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.grok/auth.json
          key: grok-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
          restore-keys: |
            grok-oauth-auth-

      - name: Seed Grok OAuth auth.json
        env:
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.grok"
          .github/scripts/restore-oauth-auth.sh "$HOME/.grok/auth.json" GROK_AUTH_JSON

      - name: Prepare prompt
        run: |
          chmod +x .github/scripts/prepare-agent-prompt.sh
          .github/scripts/prepare-agent-prompt.sh \
            ".github/prompts/${{ matrix.prompt_kind }}.md" \
            "grok-build" \
            "${{ matrix.prompt_kind }}"

      - name: Configure git
        run: |
          git config user.name "grok-scheduled[bot]"
          git config user.email "grok-scheduled[bot]@users.noreply.github.com"

      - name: Run Grok Build (OAuth headless)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          unset XAI_API_KEY || true
          grok --no-auto-update \
            -p "$(cat "$PROMPT_FILE")" \
            --always-approve

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.grok/auth.json
          key: grok-oauth-auth-${{ github.run_id }}-${{ matrix.prompt_kind }}
