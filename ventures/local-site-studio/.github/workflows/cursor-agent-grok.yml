# Run Cursor Agent CLI pinned to Grok 4.5 (manual dispatch).
# Auth: CURSOR_CLI_CONFIG subscription OAuth (~/.cursor/cli-config.json from `agent login`),
# same secret as cursor-scheduled.yml. Not GROK_AUTH_JSON — that is for the Grok Build CLI.
name: Cursor Agent (Grok 4.5)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for the Cursor agent
        required: true
        type: string
      force:
        description: Allow the agent to modify files and run commands without confirmation
        required: false
        type: boolean
        default: false
      mode:
        description: Agent mode (empty = full agent; ask/plan are read-only)
        required: false
        type: choice
        options:
          - ""
          - ask
          - plan
        default: ""

permissions:
  contents: read

jobs:
  cursor-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Restore Cursor OAuth cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cursor/cli-config.json
            ~/.cursor/auth.json
          key: cursor-oauth-auth-${{ github.run_id }}-grok
          restore-keys: |
            cursor-oauth-auth-

      - name: Seed Cursor OAuth config
        env:
          CURSOR_CLI_CONFIG: ${{ secrets.CURSOR_CLI_CONFIG }}
        run: |
          chmod +x .github/scripts/restore-oauth-auth.sh
          mkdir -p "$HOME/.cursor"
          .github/scripts/restore-oauth-auth.sh "$HOME/.cursor/cli-config.json" CURSOR_CLI_CONFIG

      - name: Run Cursor Agent
        env:
          AGENT_PROMPT: ${{ inputs.prompt }}
          AGENT_FORCE: ${{ inputs.force }}
          AGENT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          unset CURSOR_API_KEY || true

          args=(-p --trust --model cursor-grok-4.5-high --output-format text)
          if [ "$AGENT_FORCE" = "true" ]; then
            args+=(--force)
          fi
          if [ -n "$AGENT_MODE" ]; then
            args+=(--mode "$AGENT_MODE")
          fi

          agent "${args[@]}" "$AGENT_PROMPT"

      - name: Persist refreshed OAuth auth
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cursor/cli-config.json
            ~/.cursor/auth.json
          key: cursor-oauth-auth-${{ github.run_id }}-grok
