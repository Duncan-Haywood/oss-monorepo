name: local-site-studio
description: Pre-built websites for local businesses with instant client previews and flat $500 pricing.
stage: prototype
verify: npm run typecheck && npm run lint && npm test && npm run build

owner: duncan

hypotheses:
  - claim: Local service businesses prefer paying a flat $500 fee for a verified pre-built website preview over custom agency quotes.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 50
  protected: true

kill_criteria:
  - No client checkout or inquiry converted after 60 days post-launch.
  - Customer acquisition cost (CAC) exceeds $150 per client.
  - description: >-
      $150 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 150
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  production: null
  analytics: null

engineering:
  verify_command: npm run typecheck && npm run lint && npm test && npm run build
  ci_component: local-site-studio
  coverage:
    lines: 90
    functions: 90
    statements: 90
    branches: 85
  critical_paths: []
  slo:
    availability: null
    latency: null
    correctness: null
  gitops:
    desired_state: null
    immutable_artifact: true
  security:
    threat_model: null
    data_classification: customer-pii, payment
    scan_profile: source, history, dependencies, licenses, IaC, container, image
  measurement:
    outcome: null
