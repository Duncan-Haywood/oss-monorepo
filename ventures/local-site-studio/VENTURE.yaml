  - Checkout/Stripe integration cannot be completed and verified end-to-end.
  - >-
      EAA evidence product line: fewer than two of ten qualified
      (non-microenterprise) shops take a paid audit, or AT verification
      finds generated fixes close less than half of blocking issues.

