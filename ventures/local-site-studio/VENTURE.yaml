    checked: null
    evidence: customer-contact
  - claim: >-
      Obligated EU shops (≥10 employees or >€2M turnover) will pay a
      fixed-price accessibility evidence job (€900–€1800) through this
      venture's existing surfaces, buying a dated record rather than a
      compliance certificate.
    status: untested
    checked: null
