name: local-site-studio
description: Pre-built preview websites for local businesses, sold self-serve via Stripe checkout for $500 flat plus optional monthly marketing/voice/commerce add-ons.

# idea | prototype | launched | revenue | scaling | winding-down
# Stage gates how much the router is willing to spend before demanding
# an outcome signal.
stage: prototype

owner: duncan

# What has to be true for this to be worth continuing. The router does not
# read prose, but you do — keep these honest and dated.
hypotheses:
  - claim: Local businesses will pay $500 flat for a pre-built preview website with zero human sales friction.
    status: untested        # untested | supported | refuted
    checked: null           # YYYY-MM-DD
  - claim: A self-serve funnel (auto-generated preview → email/voice outreach → Stripe checkout → automated deploy) can convert leads without manual sales calls.
    status: untested
    checked: null

# Where the money is. Nulls are fine early; the router treats an unmeasured
# venture differently from one measured at zero.
economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

# Caps agent spend so one venture cannot drain the portfolio.
# Unit is USD of model spend per month.
budget:
  monthly_cap: 50
  # Explore budget is protected: early ventures get funded even when their
  # measured return is zero, otherwise the router starves everything new.
  protected: true

# Stop conditions. When one trips, the router stops allocating and flags it.
kill_criteria:
  - No first paying customer within 90 days of completing the launch checklist (Stripe live, dashboard auth, outreach configured).
  - Monthly agent/infra spend exceeds $50 for 3 consecutive months with zero paying customers.

links:
  production: null
  analytics: null
