# Deliberately vulnerable demo workflow for devsec-toolkit's tests.
# It lives under ventures/devsec-toolkit/tests/fixtures, so GitHub never runs it.
name: pr
on:
  pull_request_target:
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - run: echo "Title: ${{ github.event.pull_request.title }}"
      - run: echo "${{ secrets.DEPLOY_TOKEN }}" | base64
  reuse:
    uses: some-org/shared/.github/workflows/build.yml@main
    secrets: inherit
