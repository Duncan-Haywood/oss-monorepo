name: paver-patio-bid-calculator
description: A private browser calculator for hardscape contractors that prices an interlocking paver patio from pattern waste, compacted-base cubic yards, edge restraint, and spoil haul-away — and shows the price per finished square foot, crew hours, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Hardscape contractors will use a waste-and-base bid calculator because the generic price-per-square-foot rules of thumb they are shopped on cannot see that a 45° herringbone driveway pad on 10 inches of base is a different job from a running-bond patio of the same face.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the price per finished square foot are the two numbers a contractor actually decides on when a homeowner asks them to match a cheaper per-foot quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating pattern waste as material and extra cuts as labor, instead of one blended "add 15%", changes the bid enough that contractors notice which part of a high number is stone.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified hardscape contractors use the calculator twice within 90 days.
  - Contractors report that splitting waste, base, and edge is more work than their existing per-foot method without changing the price they would have bid.
  - The starting waste and base depths prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
