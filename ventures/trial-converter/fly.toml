# Fly.io self-deploy, in your own account (needs flyctl and a card on file with Fly):
#   fly launch --copy-config --no-deploy --dockerfile Dockerfile
#   fly volumes create state --size 1
#   fly secrets set ADMIN_KEY=$(openssl rand -hex 16) LINK_SECRET=$(openssl rand -hex 16) STRIPE_SECRET_KEY=rk_... STRIPE_WEBHOOK_SECRET=whsec_...
#   (DRY_RUN stays true until you watch the log, then set DRY_RUN=false plus PUBLIC_URL, RESEND_API_KEY, MAIL_FROM, COMPANY_NAME, COMPANY_ADDRESS)
#   fly deploy
# One machine that never auto-stops: a stopped server misses Stripe webhooks.
app = "trial-converter-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STATE = "/data/state.json"
  DRY_RUN = "true"

[mounts]
  source = "state"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
