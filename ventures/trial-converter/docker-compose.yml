# Any box with Docker (the server refuses to start without the Stripe key and webhook secret):
#   STRIPE_SECRET_KEY=rk_... STRIPE_WEBHOOK_SECRET=whsec_... ADMIN_KEY=$(openssl rand -hex 16) LINK_SECRET=$(openssl rand -hex 16) docker compose up -d
# Starts in DRY_RUN=true. Watch the log, then add your Resend key and set DRY_RUN=false.
services:
  trial-converter:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      STATE: /data/state.json
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY (16+ characters)}
      LINK_SECRET: ${LINK_SECRET:?set LINK_SECRET (16+ characters)}
      DRY_RUN: ${DRY_RUN:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set a restricted Stripe key (rk_...)}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set the whsec_... signing secret}
      PUBLIC_URL: ${PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      COMPANY_NAME: ${COMPANY_NAME:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      EXTEND_DAYS: ${EXTEND_DAYS:-0}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
volumes:
  state:
