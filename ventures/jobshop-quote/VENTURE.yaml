name: jobshop-quote
description: >-
  Hosted RFQ-to-quote for CNC machining and fabrication job shops: paste the RFQ email or forward it,
  attach drawings and STEP, IGES, STL or DXF files, check what the AI extracted against the RFQ's own
  words, and send a quote priced only from the shop's rate card, with revisions, follow-ups, win/loss
  and QuickBooks Online invoices. Sold by subscription ($0 early access, Shop $199, Shop Plus $399 a
  month; apps/jobshop-quote/src/shared/plans.ts).
stage: prototype
owner: duncan

