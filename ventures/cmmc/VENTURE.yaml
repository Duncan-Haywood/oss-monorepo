name: cmmc
description: >-
  Hosted CMMC Level 1 and Level 2 self-assessment workspace with an ISO 9001 checklist for small
  defense and aerospace shops: per-requirement status and evidence, SSP, POA&M, SPRS score,
  affirmation dates, asset and provider scoping, personnel and training, supplier flow-down,
  security policies, document control and internal audits. Sold by subscription (Level 1 free,
  Level 2 $249, Level 2 + Quality $399 a month; apps/cmmc/src/shared/plans.ts). Not a
  certification; never submits to SPRS.
stage: prototype
owner: duncan

