budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report) engage with the tool within 90 days of it being reachable from the published site.
  - A user shows a config where the tool's values disagree with git config --list --show-origin and the cause is the engine, twice after fixes.

