name: pressure-washing-bid-calculator
description: A private browser calculator for pressure-washing and soft-wash contractors that prices a job from per-surface production rates — wash hours, travel, setup, loaded wage, chemicals, overhead, and a minimum job — and shows the after-travel hourly, the walk-away price, and a paste-ready bid summary.
stage: prototype
owner: duncan
hypotheses:
  - claim: Pressure-washing contractors will use a calculator that prices travel and setup as billed hours, because the flat per-square-foot quotes they find online cannot see that a 40-minute drive each way turns a profitable driveway into a minimum-wage day.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing house-siding hours next to the driveway the homeowner called about changes the bid, because the siding is usually most of the labor and a blended square-foot price hides it.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The after-travel hourly and the walk-away price are the two numbers a contractor decides on when a homeowner asks them to sharpen their pencil, more than the per-square-foot figure itself.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified pressure-washing contractors use the calculator twice within 90 days.
  - Contractors report that splitting surfaces and entering travel is more work than their existing method without changing the price they would have bid.
  - The starting production rates prove so far from real crews' rates that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/pressure-washing-bid-calculator/
  analytics: null
