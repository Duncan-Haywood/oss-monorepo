name: photos-import-tools
description: High-performance photo library metadata extraction and automated ingestion utility.
stage: prototype
verify: pytest tests

owner: duncan

hypotheses:
  - claim: Ingestion tools provide foundation for photo-editing and real-estate studio pipelines.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 20
  protected: true

kill_criteria:
  - Ingest throughput drops below 500 images/min.
  - description: >-
      $80 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 80
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0
  - description: >-
      $100 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 100
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  production: null
  analytics: null
