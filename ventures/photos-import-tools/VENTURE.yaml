name: photos-import-tools
description: Resumable and observable macOS tooling for safely importing and offloading photo libraries.
stage: prototype

owner: duncan

hypotheses:
  - claim: Stateful imports and explicit duplicate-risk handling materially reduce failed or duplicated photo transfers.
    status: supported
    checked: 2026-07-29
    evidence: in-repo
  - claim: Content-hash verification on SD offload catches same-size corruption that a byte-count check reports as a clean copy, closing a silent data-loss path.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: The SD offload can recover from an interrupted transfer; a half-copied file left by --partial is completed on the next run rather than frozen at its truncated size.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: A run that offloads nothing because no card was mounted exits non-zero, so a wrapper that ejects or reformats the card on success cannot destroy the originals believing they were copied.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: The observability JSON records (import status, completion report, offload manifest/summary) are written atomically, so a crash mid-write or the watchdog polling status.json during a rewrite never reads a torn document that json.loads rejects and the watchdog silently treats as empty.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: A single unreadable file during SD offload verification (e.g. a previously-evicted iCloud-only placeholder that fails to re-download) does not abort the whole card's verification pass; the failure is recorded against that one file and every other file already checked in the same run still gets verified and still lands in the manifest.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: The source-side read used to seed each manifest entry (source_bytes) is as resilient to a flaky card reader or a card ejected mid-verification as the dest-side reads are; it does not crash the whole card's verification pass and lose every already-verified entry in the same run.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: Running the unattended watchdog with --include-raws never reports "complete" while the raw manifest was never initialized (init not yet run); it distinguishes "raw phase finished" from "raw phase was never even attempted" and refuses to report success for the latter.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: A file that disappears or becomes unreadable between the initial directory scan and the pre-copy size estimate does not crash the whole card's offload before a single file is copied; it is skipped from the estimate and the offload proceeds.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: The Photos importer's iCloud-readiness check does not crash the whole run when a file (e.g. an iCloud placeholder) vanishes between its exists() check and the following stat() call; the file is treated as not-ready-yet and retried like any other not-yet-downloaded file.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: One card's offload failing outright (rsync error from a card ejected mid-copy, a network drop, a permission error) does not abort a multi-card run before other cards are attempted, and does not lose the summary for cards already offloaded in the same run.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: Within a single card's offload, one include_path's copy stage failing outright (disk-full on staging, source card ejected mid-copy, a permission error on the whole volume) does not abort that card's other include_paths; the failure is recorded in the card's stats and the manifest still gets written.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: The background iCloud-eviction thread that runs concurrently with rsync during an SD offload never targets a file rsync still has open for write; it is scoped to the same finished, media-extension files iter_media_files already restricts verification to, so it cannot race rsync's own in-flight temp file for whatever it is mid-transfer on.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: A failure while staging a file into scratch_dir (a flaky source read or a full/unwritable scratch volume) is retried like any other per-item import failure instead of crashing the run, and a failure while cleaning up the scratch copy afterward never undoes an already-successful import's "imported" marking -- which would otherwise leave the item stuck unrecorded and set up a duplicate re-import on the next run.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: Matching a source file against the Photos library by filename alone does not silently mark a distinct file "imported" (and drop it forever) just because some other tracked file shares its basename -- camera-generated names like DSC00001.JPG or IMG_0001.JPG are not unique across cards/folders, so an ambiguous basename is never treated as authoritative proof that a particular file is already in Photos.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: A transient stat failure while checking free disk space on state_dir (an iCloud-synced path where a sync hiccup or momentarily unreachable network mount can make the check itself fail) does not crash the whole run; it is treated the same as confirmed-low disk space and the loop retries instead of aborting.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: When the watchdog tries to kill a stalled or phase-switching worker and the worker survives SIGKILL (stuck in an uninterruptible I/O wait on a wedged network share or a stalled iCloud volume), the watchdog neither crashes nor starts a second worker alongside the still-alive one; it keeps retrying the kill instead of racing two importer processes against Photos.app on the same manifest.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: The unattended watchdog does not leak a file descriptor on every worker (re)start, so a long run that restarts the worker repeatedly (on each exit or stall) never exhausts the process's open-file limit and crashes the watchdog itself before the import finishes.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: The watchdog's overall status.json, written when a run is blocked (a manifest was never initialized) or complete, always reflects every phase's real progress rather than only the last phase's; it does not silently overwrite an already-accurate completed-phase summary with an all-zero one just because a later phase's manifest db does not exist yet.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: SD offload's background iCloud-eviction thread is always signaled to stop when its rsync copy finishes, including when rsync itself fails to launch (e.g. the binary is temporarily missing or unreachable) rather than merely returning a nonzero exit code; a long unattended multi-card run therefore cannot accumulate leaked daemon threads that poll and evict from an abandoned destination tree for the rest of the process's life.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: Clearing a stale leftover scratch-dir file from a killed prior attempt does not crash the whole run if the removal itself fails (e.g. a network/iCloud-backed scratch mount hiccup); the failure is treated like any other per-item staging failure and the item is retried, not left stuck in "importing" with the exception escaping the run() loop uncaught.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: When an exception that is not a PhotosImportError escapes import_batch_with_split entirely (e.g. osascript itself being transiently missing from PATH, which subprocess.run reports as a bare FileNotFoundError that only PhotosImportError-catching call sites are guarded against), the run() loop's own top-level handler resets every item in that batch out of "importing" instead of leaving them permanently stuck and unretried while the run goes on to report "Complete".
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: The unattended watchdog installs its own SIGINT/SIGTERM handlers, so an operator's Ctrl-C or a supervisor's kill/launchd stop (start_import.sh execs the watchdog directly, making it the signal's direct target) terminates the current worker's process group before the watchdog exits instead of leaving the worker running as an unsupervised orphan that a later watchdog run has no way to see and would start a second worker alongside, racing two importer processes against Photos.app on the same manifest.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: Two independent importer processes sharing one manifest (a manual run started while the watchdog's worker is still alive, or a duplicate launch) cannot both claim the same pending file and import it twice; nothing in this codebase locked the manifest against a second writer, so a select-then-mark-importing race let two processes each see a file as "pending" and both import it with duplicate detection disabled.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: The importer's scratch_dir staging copy is cleaned up after every import attempt, not only a successful one, so a file Photos permanently rejects (or one that exhausts its retry budget) does not leave its staged copy orphaned in scratch_dir forever; scratch_dir cannot silently accumulate an unbounded, unrecovered disk-space leak from every file that ever fails permanently.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: The SD offload's pre-flight disk-space check inspects the actual destination filesystem, not the boot volume, so pointing --staging-root at a separate drive (the normal way to offload a card's worth of RAW/video onto storage the boot volume doesn't have room for) cannot make the tool hang forever waiting on free space that was never the constraint, nor skip the wait when the boot volume has room but the real destination does not.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: When the watchdog is asked to stop (the operator's Ctrl-C/SIGTERM, or a STOP file) while the worker is stuck in an uninterruptible I/O wait and survives SIGKILL, the watchdog does not report "stopped" with worker_running false until the worker is actually confirmed dead; it does not exit believing the worker is gone while an orphaned importer process keeps driving Photos.app, unsupervised, with a status file that says otherwise.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: classify_error's pattern-based taxonomy in photos_import_errors.py does not silently misclassify a specific failure as a more generic one just because a later, more specific pattern happens to share a substring with an earlier, broader pattern -- every transient pattern is reachable and gets to fire for the message it was written to catch instead of being permanently shadowed by list order. (Found refuted, then fixed -- _TRANSIENT_PATTERNS listed the generic "timed out|timeout" pattern before the specific "duplicate preflight timed out" pattern; since classify_error returns on the first regex match and that message contains the substring "timed out", the specific pattern, and its RUN_PREFLIGHT recovery action, was completely unreachable. Fixed by moving the specific pattern ahead of the generic one.)
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: When the watchdog's STOP/SIGTERM shutdown lands during the raw phase of an --include-raws run, it still writes the terminal status to phases[0].status_path ("status.json", the file external tooling watches as the whole run's status) using the combined summary across every phase, the same convention the "complete" and "blocked" terminal writes already follow -- it does not write only the currently-active phase's own summary to that phase's own status file (status_raw.json), which left status.json unwritten/stale at the exact moment the watchdog actually stopped. (Found refuted, then fixed -- the STOP-handling branch in run_watchdog was the one terminal exit path combined_summary's earlier fix was not applied to.)
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: A packaged, priced version of these tools (e.g. a paid macOS utility, or a Setapp/App-Store-style listing) would attract paying customers among Mac-based photographers and videographers who shoot on removable media and import into Apple Photos or a DAM, beyond this repo's own single-user use -- i.e. the reliability work already done here is worth someone else paying for, not just worth having for its own import runs.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: When import_batch_with_split recurses on a failing batch and one half's osascript call genuinely succeeds (committing "imported" for its items) before the other half raises an exception that escapes the whole call (e.g. osascript transiently missing from PATH), the run() loop's top-level handler does not relabel the already-succeeded half back to "failed"/"skipped_permanent"; only items still actually left "importing" by the escape are reset for retry.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: The permanent "file_missing" pattern in classify_error matches the literal message wait_for_file() generates when it gives up on an iCloud placeholder that never finishes downloading, so that skip is logged and reported as a legitimate permanent file_missing skip rather than an unclassified error. (Found refuted, then fixed -- the pattern required the word "retries" ("file missing after.*retries"), but wait_for_file's actual message says "file missing after N iCloud wait attempts"; the wording never matched, so the message fell through to ErrorCategory.UNKNOWN/RETRY_BACKOFF and was misreported in the error log and in `status`'s "Recent errors" listing, even though mark_skipped_permanent still ran correctly at that call site regardless of classification. Fixed by widening the pattern to accept both "retries" and "attempts".)
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: run()'s while loop does not report "Complete" and exit while pending or in-progress items remain in the manifest just because the batch prepare_batch() claimed this pass resolved to zero importable items -- e.g. every claimed item matched an existing Photos.app entry via preflight, or timed out in wait_for_file() waiting on an undownloaded iCloud placeholder, either of which resolves the item to a terminal status without adding it to the ready-to-import list.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: When a per-item import attempt fails with a transient error, handle_item_error()'s retry-limit check agrees with claim_next_batch()'s own claimability filter about exactly when an item has exhausted MAX_TRANSIENT_ATTEMPTS retries -- an item does not get permanently excluded from being reclaimed while still sitting at status "failed" (as opposed to "skipped_permanent"), which would leave it silently uncounted-as-claimable yet still counted in summary()["remaining"] forever. (Found refuted, then fixed -- handle_item_error() checked the pre-increment attempts count claim_next_batch() had handed it with the claimed item, one claim behind the query's own post-increment "attempts < MAX_TRANSIENT_ATTEMPTS" filter, so an item's last retry was recorded as "failed" one claim after the filter would already have started excluding it from further claims.)
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: When a card is unmounted or ejected partway through offload_card() -- after being confirmed mounted at the start of the run -- the offload is not reported as a clean, verified success (exit 0); the disappearance is recorded as an error so offload_exit_code() reports "offloaded with errors" (1) instead of the false "safe to eject" signal its own docstring warns against. (Found refuted, then fixed -- every remaining include_paths iteration silently no-opped via the per-path `source.exists()` guard, and verify_and_manifest()'s iter_media_files() returned an empty list for the vanished source root rather than raising, so stats.errors stayed empty.)
    status: supported
    checked: 2026-08-21
    evidence: in-repo

