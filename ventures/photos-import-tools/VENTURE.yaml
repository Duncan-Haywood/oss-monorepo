name: photos-import-tools
description: Resumable and observable macOS tooling for safely importing and offloading photo libraries.
stage: prototype

owner: duncan

hypotheses:
  - claim: Stateful imports and explicit duplicate-risk handling materially reduce failed or duplicated photo transfers.
    status: supported
    checked: 2026-07-29
    evidence: in-repo
  - claim: Content-hash verification on SD offload catches same-size corruption that a byte-count check reports as a clean copy, closing a silent data-loss path.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
  - claim: An interrupted offload can be recovered by re-running, because partial transfers are parked in a side directory (--partial-dir) instead of at the final path where --ignore-existing would skip completing them forever.
    status: supported
    checked: 2026-08-20
    evidence: in-repo

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 20
  protected: false

kill_criteria:
  - The tools cannot recover safely from an interrupted import.
  - Import automation creates duplicate or lost media during controlled testing.

links:
