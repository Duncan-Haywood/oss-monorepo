name: french-drain-bid-calculator
description: A private browser calculator for drainage and excavation contractors that prices an exterior French-drain install from trench depth, pipe size, soil, daylight versus drywell versus storm tie-in, catch basins, downspout ties, and driveway crossings — and shows the hours the first deep clay run actually consumes and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent drainage and excavation contractors will use a trench-and-outlet bid calculator because the generic "$25 a foot installed" special they are shopped on cannot see that a 40-foot shallow daylight trench in dirt is a different job from an 80-foot deep 6-inch drywell run in clay with basins and a driveway.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-foot special) are the two figures a contractor actually decides on when a homeowner asks them to match a cheaper French-drain quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating depth, clay, a drywell, catch basins, and a driveway crossing as their own hours, instead of a blended add-on to a $25/ft special, changes the bid enough that contractors notice which part of a high number is the first extra foot of depth.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified drainage or excavation contractors use the calculator twice within 90 days.
  - Contractors report that splitting the trench and extras versus a $25/ft special is more work than their existing per-foot method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/french-drain-bid-calculator/
  analytics: null
