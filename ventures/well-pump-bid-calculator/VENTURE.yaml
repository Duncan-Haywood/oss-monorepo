name: well-pump-bid-calculator
description: A private browser calculator for well-service and plumbing shops that prices a well-pump replacement from extra drop-pipe footage past the included run, seized versus free pitless, stuck-pump pull, extra well cable, a new pressure tank, and a constant-pressure drive — and shows the price per extra foot, the hours the first seized adapter actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent well-service shops will use a depth-and-pitless bid calculator because the generic "$1,495 well-pump special" they are shopped on cannot see that a 60-foot 1/2 HP swap with a good pitless is a different job from a 280-foot 1.5 HP pull with a seized adapter, a stuck pump, and a new tank.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-job special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper pump-swap quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra footage, pitless condition, stuck pull, extra cable, tank, and a constant-pressure drive as their own hours, instead of a blended add-on to a trip charge, changes the bid enough that shops notice which part of a high number is the first seized adapter.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified well-service or plumbing shops use the calculator twice within 90 days.
  - Shops report that splitting depth, pitless, and tank versus pump-only is more work than their existing trip-charge method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
