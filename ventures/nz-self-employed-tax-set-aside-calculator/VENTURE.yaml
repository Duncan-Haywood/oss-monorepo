name: nz-self-employed-tax-set-aside-calculator
description: >-
  Free browser tool for New Zealand sole traders and contractors: enter income and expenses to see income tax, ACC earners' levy, optional student loan repayment and how much of every invoice to set aside, with provisional tax and GST flags. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-14 in a new-venture-first session; the portfolio has a New Zealand GST registration checker but no NZ income-tax set-aside tool for the self-employed.
#
# First visitor: New Zealand freelancers, contractors and sole traders searching "how much tax should I set aside self employed NZ". Evergreen, peaks around the 31 March year end and the 7 July return season; volume not measured. Rivals are accountant and bank blog calculators that want an email.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Not built: ACC work levy by industry classification, other income, 2026-27 rates, invoice-by-invoice tracker behind an env-var switch.
#
# Liability: 2025-26 IRD resident rates, ACC earners' levy and student loan threshold written from memory; every result tells the reader to verify on ird.govt.nz, carries no-warranty and not-tax-advice clauses and says what it does not decide.
hypotheses:
  - claim: >-
      New Zealand sole traders will use a free private calculator to learn what share of each invoice to set aside, because rules of thumb ignore their own expense level and ACC levy.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: NZD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that an IRD figure differs from ird.govt.nz.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/nz-self-employed-tax-set-aside-calculator/
  analytics: null
