name: floor-flatness
description: Free browser tool and CLI that works out FF flatness and FL levelness F-numbers (after ASTM E1155) from sample-line readings, 12-inch elevation grids or laser-scan point clouds, checks them against a slab spec, lays a straightedge along every line, maps high and low spots and estimates the grinding a miss would take.
stage: prototype
owner: duncan

hypotheses:
  - claim: Concrete flatwork contractors on FF/FL-specified slabs (warehouses, cold stores, retail) who own a laser level, total station or scanner but no flatness software will run their own readings through a free tool before the testing agency's report, measured as the share of flatness_measured events that also set a specification.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The grind estimate is the feature that brings people back, because a failed number turns into a remediation price; measured as the share of sessions with grind_estimated after a failed spec check.
    status: untested
    checked: null
    evidence: in-repo
  - claim: Point-cloud input reaches scanning and VDC people who otherwise pay for a flatness plugin; measured as the share of flatness_measured events from point_cloud_read.
    status: untested
    checked: null
    evidence: in-repo

economics:
  currency: USD
  mrr: null
  # Every calculation runs in the visitor's browser; one more visitor costs a static file.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - No real survey file (profiler export, laser-level grid or scan) parses and agrees with a testing agency's reported FF/FL to within a few points after three attempts.
  - Fewer than three contractors, testers or scanning firms use it on a real slab within 90 days of it being discoverable.

links:
  production: https://marisstella.app/floor-flatness/
  analytics: null
