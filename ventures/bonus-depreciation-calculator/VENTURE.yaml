kill_criteria:
  - No measurable return usage or organic referral traffic within 6 months
    of the 2026 tax-filing season closing (October 2027, covering extended
    2025 and 2026 returns), by which point most businesses planning a
    year-end equipment purchase around this decision should already have
    filed.
  - Fewer than three unsolicited signals (star, fork, referral, or
    feedback) within 90 days of that filing season closing.

