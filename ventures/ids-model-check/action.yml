name: IDS model check
description: Check IFC models (STEP, ifcXML, ifcZIP) against buildingSMART IDS 1.0 files on every commit. JUnit, BCF, annotations and a job summary; no upload, no dependencies.
author: ids-model-check contributors
branding:
  icon: check-square
  color: blue
inputs:
  models:
    description: Glob(s) of model files, comma or newline separated, relative to the workspace (e.g. "models/**/*.ifc").
    required: true
  ids:
    description: Glob(s) of IDS files (e.g. "requirements/*.ids").
    required: true
  pairing:
    description: '"all" checks every model against every IDS; "name" checks wall.ifc only against IDS files named wall*.ids (all when none match).'
    default: all
  fail-on:
    description: '"error" fails the step when a required or prohibited specification fails, an IDS is invalid or a file cannot be read; "warning" also on optional ones; "never" only reports.'
    default: error
  fail-on-unchecked:
    description: '"true" also fails the step when a specification left elements unchecked because its entity facet names a parent class (IFCWALL) and not theirs (IFCWALLSTANDARDCASE); IDS entity names do not include subclasses. Off by default: a warning annotation either way.'
    default: 'false'
  fail-on-audit-warnings:
    description: '"true" also fails the step when the IDS audit warns that a specification is valid but probably does not check what was meant (an entity facet naming an abstract class such as IFCBUILDINGELEMENT selects nothing; a value no enumeration member can equal). Off by default: a warning annotation on the specification''s line in the IDS file either way.'
    default: 'false'
  fail-on-duplicate-globalids:
    description: '"true" also fails the step when two elements of a model share a GlobalId (IFC requires them unique; BCF viewpoints and model diffs find elements by it). Off by default: a warning annotation on the model either way.'
    default: 'false'
  junit:
    description: Path for a JUnit XML report (empty for none).
    default: ids-report.xml
  bcf-dir:
    description: Directory for one BCF 2.1 file per failing pair, to open in a BIM viewer (empty for none).
    default: ''
  json:
    description: Path for the full JSON results (empty for none).
    default: ''
  max-failures:
    description: Failing elements kept per specification in the reports (counts stay exact), so one specification matching every entity of a large export cannot exhaust memory.
    default: '1000'
outputs:
  result:
    description: '"pass" or "fail".'
    value: ${{ steps.check.outputs.result }}
  passed:
    description: Specification checks that passed.
    value: ${{ steps.check.outputs.passed }}
  failed:
    description: Required or prohibited specification checks that failed.
    value: ${{ steps.check.outputs.failed }}
  warnings:
    description: Optional specification checks that failed.
    value: ${{ steps.check.outputs.warnings }}
  invalid:
    description: Specifications the IDS itself gets wrong.
    value: ${{ steps.check.outputs.invalid }}
  elements-failed:
    description: Failing element results summed over all checks.
    value: ${{ steps.check.outputs.elements-failed }}
  not-checked:
    description: Elements left unchecked because the entity facet names a parent class and not theirs, summed over all checks.
    value: ${{ steps.check.outputs.not-checked }}
  audit-warnings:
    description: IDS audit warnings, counted once per IDS file and specification however many models it was checked against.
    value: ${{ steps.check.outputs.audit-warnings }}
  duplicate-globalids:
    description: GlobalIds shared by more than one element, counted once per model however many IDS files it was checked against.
    value: ${{ steps.check.outputs.duplicate-globalids }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        IDS_MODELS: ${{ inputs.models }}
        IDS_IDS: ${{ inputs.ids }}
        IDS_PAIRING: ${{ inputs.pairing }}
        IDS_FAIL_ON: ${{ inputs.fail-on }}
        IDS_JUNIT: ${{ inputs.junit }}
        IDS_BCF: ${{ inputs.bcf-dir }}
        IDS_JSON: ${{ inputs.json }}
        IDS_MAX_FAILURES: ${{ inputs.max-failures }}
        IDS_FAIL_ON_UNCHECKED: ${{ inputs.fail-on-unchecked }}
        IDS_FAIL_ON_AUDIT: ${{ inputs.fail-on-audit-warnings }}
        IDS_FAIL_ON_DUPLICATES: ${{ inputs.fail-on-duplicate-globalids }}
      run: |
        major=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
        if [ "$major" -lt 18 ]; then echo "::error title=IDS model check::needs Node 18 or newer (add actions/setup-node before this step)"; exit 2; fi
        set -- --models "$IDS_MODELS" --ids "$IDS_IDS" --pairing "$IDS_PAIRING" --fail-on "$IDS_FAIL_ON" --max-failures "${IDS_MAX_FAILURES:-1000}"
        [ -n "$IDS_JUNIT" ] && set -- "$@" --junit "$IDS_JUNIT"
        [ -n "$IDS_BCF" ] && set -- "$@" --bcf-dir "$IDS_BCF"
        [ -n "$IDS_JSON" ] && set -- "$@" --json "$IDS_JSON"
        [ "$IDS_FAIL_ON_UNCHECKED" = "true" ] && set -- "$@" --fail-on-unchecked
        [ "$IDS_FAIL_ON_AUDIT" = "true" ] && set -- "$@" --fail-on-audit-warnings
        [ "$IDS_FAIL_ON_DUPLICATES" = "true" ] && set -- "$@" --fail-on-duplicate-globalids
        node "$GITHUB_ACTION_PATH/ci-cli.mjs" "$@"
