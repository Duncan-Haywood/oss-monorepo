# Watch a metric for changes, in your own GitHub repository, on GitHub's free runners.
# Made by deploy/make-watch-repo.sh from https://marisstella.app/changepoint-detector/ (MIT).
#
# Set in your repository (Settings > Secrets and variables > Actions); the README says more about each:
#   variable METRIC_CSV      a CSV in this repository (data/metric.csv) or an https:// link to one, rows oldest first
#   variable WATCH_OPTIONS   optional, e.g. "--column orders --model poisson", "--columns orders:poisson,revenue",
#                            "--detector auto --alerts-per 1/month"
#   variable WATCH_WEEKLY    optional: "on" adds a watch on Monday-to-Sunday totals (slow climbs, heard weeks in)
#   secret   WATCH_WEBHOOK_URL  optional: a Slack, Discord, Teams or Mattermost incoming-webhook URL
# Or, with METRIC_CSV unset, one source fetched each run into data/<source>.csv (cached, never committed):
#   Stripe     secret STRIPE_API_KEY (restricted, read Charges); variable STRIPE_OPTIONS. Use a PRIVATE repository.
#   Shopify    secret SHOPIFY_ACCESS_TOKEN (read_orders), variable SHOPIFY_SHOP; SHOPIFY_OPTIONS. PRIVATE repository.
#   Search Console  secret GSC_SERVICE_ACCOUNT_JSON, variable GSC_SITE (sc-domain:example.com); GSC_OPTIONS
#   GA4        secret GA4_SERVICE_ACCOUNT_JSON, variable GA4_PROPERTY (numeric ID); GA4_OPTIONS
#   Plausible  secret PLAUSIBLE_API_KEY, variable PLAUSIBLE_SITE; PLAUSIBLE_URL, PLAUSIBLE_OPTIONS ('--goal Signup')
#   PostHog    secret POSTHOG_API_KEY (personal, Query: Read), variable POSTHOG_PROJECT; POSTHOG_HOST (eu or an
#              https address), POSTHOG_OPTIONS ('--event $pageview --event signed_up')
#   Mixpanel   secret MIXPANEL_SERVICE_ACCOUNT (user:secret), variable MIXPANEL_PROJECT; MIXPANEL_HOST (eu, in),
#              MIXPANEL_OPTIONS ('--event "Sign Up"')
# The first source set, in that order, is watched with its defaults (counts as poisson, revenue as a level).
# With no webhook, a new change fails the run and GitHub emails you (--fail-on-alert).
name: watch-metric
on:
  schedule:
    - cron: '17 7 * * *'   # daily at 07:17 UTC; change to suit how often a row arrives
  workflow_dispatch:
permissions:
  contents: write          # to commit watch-state.json (and weekly-state.json), which remember what was already reported
concurrency: watch-metric
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Keeps the fetched data/*.csv between runs, so a run fetches a few days, not all 400.
      - uses: actions/cache@v4
        with:
          path: |
            data/stripe.csv*
            data/shopify.csv
            data/gsc.csv
            data/ga4.csv
            data/plausible.csv
            data/posthog.csv
            data/mixpanel.csv
          key: metrics-${{ github.run_id }}
          restore-keys: metrics-
      - name: Fetch Stripe metrics
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_OPTIONS: ${{ vars.STRIPE_OPTIONS }}
        run: |
          set -u
          if [ -z "$STRIPE_API_KEY" ]; then exit 0; fi
          # word-splitting of STRIPE_OPTIONS is intended
          node stripe-metrics.mjs --out data/stripe.csv $STRIPE_OPTIONS
      - name: Fetch Shopify metrics
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP: ${{ vars.SHOPIFY_SHOP }}
          SHOPIFY_OPTIONS: ${{ vars.SHOPIFY_OPTIONS }}
        run: |
          set -u
          if [ -z "$SHOPIFY_ACCESS_TOKEN" ]; then exit 0; fi
          # word-splitting of SHOPIFY_OPTIONS is intended
          node shopify-metrics.mjs --out data/shopify.csv $SHOPIFY_OPTIONS
      - name: Fetch Search Console metrics
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          GSC_OPTIONS: ${{ vars.GSC_OPTIONS }}
        run: |
          set -u
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then exit 0; fi
          if [ -z "$GSC_SITE" ]; then echo "Set the GSC_SITE variable (sc-domain:example.com or https://www.example.com/)."; exit 2; fi
          # word-splitting of GSC_OPTIONS is intended
          node search-console-metrics.mjs --site "$GSC_SITE" --out data/gsc.csv $GSC_OPTIONS
      - name: Fetch Google Analytics metrics
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY: ${{ vars.GA4_PROPERTY }}
          GA4_OPTIONS: ${{ vars.GA4_OPTIONS }}
        run: |
          set -u
          if [ -z "$GA4_SERVICE_ACCOUNT_JSON" ]; then exit 0; fi
          if [ -z "$GA4_PROPERTY" ]; then echo "Set the GA4_PROPERTY variable (the numeric ID in Admin > Property details)."; exit 2; fi
          # word-splitting of GA4_OPTIONS is intended
          node ga4-metrics.mjs --property "$GA4_PROPERTY" --out data/ga4.csv $GA4_OPTIONS
      - name: Fetch Plausible metrics
        env:
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          PLAUSIBLE_SITE: ${{ vars.PLAUSIBLE_SITE }}
          PLAUSIBLE_URL: ${{ vars.PLAUSIBLE_URL }}
          PLAUSIBLE_OPTIONS: ${{ vars.PLAUSIBLE_OPTIONS }}
        run: |
          set -u
          if [ -z "$PLAUSIBLE_API_KEY" ]; then exit 0; fi
          if [ -z "$PLAUSIBLE_SITE" ]; then echo "Set the PLAUSIBLE_SITE variable (the domain as named in Plausible)."; exit 2; fi
          # PLAUSIBLE_OPTIONS is read the way a shell reads it, so a quoted goal name with a space stays one argument
          eval "set -- $PLAUSIBLE_OPTIONS"
          node plausible-metrics.mjs --site "$PLAUSIBLE_SITE" --out data/plausible.csv "$@"
      - name: Fetch PostHog metrics
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT: ${{ vars.POSTHOG_PROJECT }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          POSTHOG_OPTIONS: ${{ vars.POSTHOG_OPTIONS }}
        run: |
          set -u
          if [ -z "$POSTHOG_API_KEY" ]; then exit 0; fi
          if [ -z "$POSTHOG_PROJECT" ]; then echo "Set the POSTHOG_PROJECT variable (the project ID in Settings > Project)."; exit 2; fi
          # POSTHOG_OPTIONS is read the way a shell reads it, so a quoted event name with a space stays one argument;
          # single quotes keep a $ in '$pageview' as written
          eval "set -- $POSTHOG_OPTIONS"
          node posthog-metrics.mjs --project "$POSTHOG_PROJECT" --out data/posthog.csv "$@"
      - name: Fetch Mixpanel metrics
        env:
          MIXPANEL_SERVICE_ACCOUNT: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT }}
          MIXPANEL_PROJECT: ${{ vars.MIXPANEL_PROJECT }}
          MIXPANEL_HOST: ${{ vars.MIXPANEL_HOST }}
          MIXPANEL_OPTIONS: ${{ vars.MIXPANEL_OPTIONS }}
        run: |
          set -u
          if [ -z "$MIXPANEL_SERVICE_ACCOUNT" ]; then exit 0; fi
          if [ -z "$MIXPANEL_PROJECT" ]; then echo "Set the MIXPANEL_PROJECT variable (the project ID)."; exit 2; fi
          eval "set -- $MIXPANEL_OPTIONS"
          node mixpanel-metrics.mjs --project "$MIXPANEL_PROJECT" --out data/mixpanel.csv "$@"
      - name: Check for a new change
        env:
          METRIC_CSV: ${{ vars.METRIC_CSV }}
          WATCH_OPTIONS: ${{ vars.WATCH_OPTIONS }}
          WATCH_WEEKLY: ${{ vars.WATCH_WEEKLY }}
          WATCH_WEBHOOK_URL: ${{ secrets.WATCH_WEBHOOK_URL }}
        run: |
          set -u
          # The weekly watch's default per source: the money or traffic total, where a season builds.
          WEEKLY_DEFAULT="--detector drift"
          if [ -z "$METRIC_CSV" ] && [ -f data/stripe.csv ]; then
            METRIC_CSV=data/stripe.csv
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns payments:poisson,revenue,failed:poisson"
            WEEKLY_DEFAULT="--columns revenue,payments --detector drift"
          elif [ -z "$METRIC_CSV" ] && [ -f data/shopify.csv ]; then
            METRIC_CSV=data/shopify.csv
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns orders:poisson,revenue,cancelled:poisson"
            WEEKLY_DEFAULT="--columns revenue,orders --detector drift"
          elif [ -z "$METRIC_CSV" ] && [ -f data/gsc.csv ]; then
            METRIC_CSV=data/gsc.csv
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns clicks:poisson,impressions:poisson"
            WEEKLY_DEFAULT="--columns clicks,impressions --detector drift"
          elif [ -z "$METRIC_CSV" ] && [ -f data/ga4.csv ]; then
            METRIC_CSV=data/ga4.csv
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns sessions:poisson,activeUsers:poisson,keyEvents:poisson"
            WEEKLY_DEFAULT="--columns sessions,keyEvents --detector drift"
          elif [ -z "$METRIC_CSV" ] && [ -f data/plausible.csv ]; then
            METRIC_CSV=data/plausible.csv
            # visitors, page views and each goal_ column the fetch wrote (header line of the CSV)
            COLS=$(head -n 1 data/plausible.csv | tr ',' '\n' | grep -E '^(visitors|pageviews|goal_.*)$' | sed 's/$/:poisson/' | paste -sd, -)
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns $COLS"
            WEEKLY_DEFAULT="--columns visitors --detector drift"
          elif [ -z "$METRIC_CSV" ] && [ -f data/posthog.csv ]; then
            METRIC_CSV=data/posthog.csv
            # every event_ column the fetch wrote, and users (header line of the CSV)
            COLS=$(head -n 1 data/posthog.csv | tr ',' '\n' | grep -E '^(event_.*|users)$' | sed 's/$/:poisson/' | paste -sd, -)
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns $COLS"
            WEEKLY_DEFAULT="--columns users --detector drift"
          elif [ -z "$METRIC_CSV" ] && [ -f data/mixpanel.csv ]; then
            METRIC_CSV=data/mixpanel.csv
            COLS=$(head -n 1 data/mixpanel.csv | tr ',' '\n' | grep -E '^(event_.*|users)$' | sed 's/$/:poisson/' | paste -sd, -)
            # the middle setting: users (the first event's uniques) falls less than views (README "Mixpanel as a source")
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns $COLS --detector pelt --overdispersion nb --trend gated"
            WEEKLY_DEFAULT="--columns users --detector drift"
          fi
          if [ -z "$METRIC_CSV" ]; then echo "Set the METRIC_CSV variable, or the STRIPE_API_KEY, SHOPIFY_ACCESS_TOKEN, GSC_SERVICE_ACCOUNT_JSON, GA4_SERVICE_ACCOUNT_JSON, PLAUSIBLE_API_KEY, POSTHOG_API_KEY or MIXPANEL_SERVICE_ACCOUNT secret (see the top of this file)."; exit 2; fi
          HOOK=""; [ -n "$WATCH_WEBHOOK_URL" ] && HOOK="--webhook-env WATCH_WEBHOOK_URL"
          FAIL="--fail-on-alert"; [ -n "$HOOK" ] && FAIL=""
          # Both watches run even when the first fails (a new change, or a webhook that answered an error); the step
          # fails if either did, and each watch's record is saved by the next step either way.
          DAILY=0; WEEKLY=0
          # word-splitting of WATCH_OPTIONS is intended
          node watch.mjs "$METRIC_CSV" --state watch-state.json $HOOK $WATCH_OPTIONS $FAIL | tee -a "$GITHUB_STEP_SUMMARY" || DAILY=$?
          if [ -n "$WATCH_WEEKLY" ]; then
            [ "$WATCH_WEEKLY" = "on" ] && WATCH_WEEKLY="$WEEKLY_DEFAULT"
            echo "" | tee -a "$GITHUB_STEP_SUMMARY"
            # word-splitting of WATCH_WEEKLY is intended
            node watch.mjs "$METRIC_CSV" --state weekly-state.json --weekly $HOOK $WATCH_WEEKLY $FAIL | tee -a "$GITHUB_STEP_SUMMARY" || WEEKLY=$?
          fi
          [ "$DAILY" -ne 0 ] && exit "$DAILY"
          exit "$WEEKLY"
      - name: Save what was reported
        if: always()
        run: |
          [ -f watch-state.json ] || [ -f weekly-state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in watch-state.json weekly-state.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "watch: state after $(date -u +%F)"
          # Another job (or you) may have pushed rows since the checkout; a plain push would then be refused, the
          # state lost and the same change reported again tomorrow. Replay this one commit on top and push again.
          for wait in 0 5 15 30; do
            sleep $wait
            git pull --rebase --quiet && git push --quiet && exit 0
          done
          echo "Could not push the watch state after 4 tries; the next run may report the same change again."
          exit 1
