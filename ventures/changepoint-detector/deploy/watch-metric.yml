# Watch a metric for changes, in your own GitHub repository, on GitHub's free runners.
# Made by deploy/make-watch-repo.sh from https://marisstella.app/changepoint-detector/ (MIT).
#
# Set in your repository (Settings > Secrets and variables > Actions):
#   variable METRIC_CSV         a CSV file in this repository (data/metric.csv) or an https:// link to one
#                               (a published Google Sheet's CSV link works); rows oldest first
#   variable WATCH_OPTIONS      optional, e.g. "--column orders --model poisson --period 7"
#                               "--detector auto --alerts-per 1/month" picks how eager to be from your history
#                               at the first run, within about one alert a month, and keeps that pick
#                               "--columns orders:poisson,revenue,signups:poisson" (or "--columns all") watches several
#                               metrics of one CSV, each with its own record, new changes in one message;
#                               "orders:poisson:bocpd-window" gives one column its own detector, and
#                               "orders:poisson:bocpd" the count default before 2026-11-20 (a count column that
#                               names nothing gets bocpd-window with a clumped-count cost at threshold 0.3)
#   secret   WATCH_WEBHOOK_URL  optional: a Slack, Discord, Teams or Mattermost incoming-webhook URL
#   secret   STRIPE_API_KEY     optional: a Stripe restricted key with read access to Charges. Each run then writes
#                               data/stripe.csv (date,payments,revenue,failed per complete day; stripe-metrics.mjs) and,
#                               with METRIC_CSV unset, watches it: payments and failed payments as counts, revenue as a
#                               level. Use a PRIVATE repository: watch-state.json records your revenue around each change.
#   variable STRIPE_OPTIONS     optional, e.g. "--time-zone America/New_York --currency usd --customers"
#   secret   SHOPIFY_ACCESS_TOKEN  optional: the Admin API access token of a custom app in your Shopify store (scope
#                               read_orders; read_all_orders for more than 60 days of history). With the variable
#                               SHOPIFY_SHOP (my-store or my-store.myshopify.com) each run writes data/shopify.csv
#                               (date,orders,revenue,cancelled per complete day; shopify-metrics.mjs) and, with
#                               METRIC_CSV unset and no Stripe key, watches it: orders and cancellations as counts,
#                               revenue as a level. Use a PRIVATE repository.
#   variable SHOPIFY_OPTIONS    optional, e.g. "--customers" (days follow the store's own time zone)
#   secret   GSC_SERVICE_ACCOUNT_JSON  optional: a Google service account's JSON key, added in Search Console as a
#                               Restricted user of your property. With the variable GSC_SITE (sc-domain:example.com or
#                               https://www.example.com/) each run writes data/gsc.csv (date,clicks,impressions,ctr,position
#                               per finished day; search-console-metrics.mjs) and, with METRIC_CSV unset and no Stripe or
#                               Shopify credentials, watches clicks and impressions as counts.
#   variable GSC_OPTIONS        optional, e.g. "--type discover"
#   secret   GA4_SERVICE_ACCOUNT_JSON  optional: a Google service account's JSON key, added in Google Analytics as a
#                               Viewer of your GA4 property. With the variable GA4_PROPERTY (the numeric property ID)
#                               each run writes data/ga4.csv (date,sessions,activeUsers,screenPageViews,keyEvents per
#                               day; ga4-metrics.mjs) and, with METRIC_CSV unset and no Stripe, Shopify or Search
#                               Console credentials, watches sessions, active users and key events as counts.
#   variable GA4_OPTIONS        optional, e.g. "--lag 2" or "--metrics sessions,keyEvents,totalRevenue"
# With no webhook, a new change fails the run and GitHub emails you (--fail-on-alert).
name: watch-metric
on:
  schedule:
    - cron: '17 7 * * *'   # daily at 07:17 UTC; change to suit how often a row arrives
  workflow_dispatch:
permissions:
  contents: write          # to commit watch-state.json, which remembers what was already reported
concurrency: watch-metric
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Keeps data/stripe.csv, data/shopify.csv, data/gsc.csv and data/ga4.csv between runs, so a run fetches a few days, not all 400.
      - uses: actions/cache@v4
        with:
          path: |
            data/stripe.csv*
            data/shopify.csv
            data/gsc.csv
            data/ga4.csv
          key: metrics-${{ github.run_id }}
          restore-keys: metrics-
      - name: Fetch Stripe metrics
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_OPTIONS: ${{ vars.STRIPE_OPTIONS }}
        run: |
          set -u
          if [ -z "$STRIPE_API_KEY" ]; then exit 0; fi
          # word-splitting of STRIPE_OPTIONS is intended
          node stripe-metrics.mjs --out data/stripe.csv $STRIPE_OPTIONS
      - name: Fetch Shopify metrics
        env:
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP: ${{ vars.SHOPIFY_SHOP }}
          SHOPIFY_OPTIONS: ${{ vars.SHOPIFY_OPTIONS }}
        run: |
          set -u
          if [ -z "$SHOPIFY_ACCESS_TOKEN" ]; then exit 0; fi
          # word-splitting of SHOPIFY_OPTIONS is intended
          node shopify-metrics.mjs --out data/shopify.csv $SHOPIFY_OPTIONS
      - name: Fetch Search Console metrics
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          GSC_OPTIONS: ${{ vars.GSC_OPTIONS }}
        run: |
          set -u
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then exit 0; fi
          if [ -z "$GSC_SITE" ]; then echo "Set the GSC_SITE variable (sc-domain:example.com or https://www.example.com/)."; exit 2; fi
          # word-splitting of GSC_OPTIONS is intended
          node search-console-metrics.mjs --site "$GSC_SITE" --out data/gsc.csv $GSC_OPTIONS
      - name: Fetch Google Analytics metrics
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY: ${{ vars.GA4_PROPERTY }}
          GA4_OPTIONS: ${{ vars.GA4_OPTIONS }}
        run: |
          set -u
          if [ -z "$GA4_SERVICE_ACCOUNT_JSON" ]; then exit 0; fi
          if [ -z "$GA4_PROPERTY" ]; then echo "Set the GA4_PROPERTY variable (the numeric ID in Admin > Property details)."; exit 2; fi
          # word-splitting of GA4_OPTIONS is intended
          node ga4-metrics.mjs --property "$GA4_PROPERTY" --out data/ga4.csv $GA4_OPTIONS
      - name: Check for a new change
        env:
          METRIC_CSV: ${{ vars.METRIC_CSV }}
          WATCH_OPTIONS: ${{ vars.WATCH_OPTIONS }}
          WATCH_WEBHOOK_URL: ${{ secrets.WATCH_WEBHOOK_URL }}
        run: |
          set -u
          if [ -z "$METRIC_CSV" ] && [ -f data/stripe.csv ]; then
            METRIC_CSV=data/stripe.csv
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns payments:poisson,revenue,failed:poisson"
          elif [ -z "$METRIC_CSV" ] && [ -f data/shopify.csv ]; then
            METRIC_CSV=data/shopify.csv
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns orders:poisson,revenue,cancelled:poisson"
          elif [ -z "$METRIC_CSV" ] && [ -f data/gsc.csv ]; then
            METRIC_CSV=data/gsc.csv
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns clicks:poisson,impressions:poisson"
          elif [ -z "$METRIC_CSV" ] && [ -f data/ga4.csv ]; then
            METRIC_CSV=data/ga4.csv
            [ -z "$WATCH_OPTIONS" ] && WATCH_OPTIONS="--columns sessions:poisson,activeUsers:poisson,keyEvents:poisson"
          fi
          if [ -z "$METRIC_CSV" ]; then echo "Set the METRIC_CSV variable, or the STRIPE_API_KEY, SHOPIFY_ACCESS_TOKEN, GSC_SERVICE_ACCOUNT_JSON or GA4_SERVICE_ACCOUNT_JSON secret (see the top of this file)."; exit 2; fi
          HOOK=""; [ -n "$WATCH_WEBHOOK_URL" ] && HOOK="--webhook-env WATCH_WEBHOOK_URL"
          FAIL="--fail-on-alert"; [ -n "$HOOK" ] && FAIL=""
          # word-splitting of WATCH_OPTIONS is intended
          node watch.mjs "$METRIC_CSV" --state watch-state.json $HOOK $WATCH_OPTIONS $FAIL | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save what was reported
        if: always()
        run: |
          [ -f watch-state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch-state.json
          git diff --cached --quiet && exit 0
          git commit -m "watch: state after $(date -u +%F)"
          # Another job (or you) may have pushed rows since the checkout; a plain push would then be refused, the
          # state lost and the same change reported again tomorrow. Replay this one commit on top and push again.
          for wait in 0 5 15 30; do
            sleep $wait
            git pull --rebase --quiet && git push --quiet && exit 0
          done
          echo "Could not push watch-state.json after 4 tries; the next run may report the same change again."
          exit 1
