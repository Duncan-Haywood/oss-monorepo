name: courier-van-route-profit-calculator
description: >-
  Free browser tool for independent last-mile delivery contractors who own or lease a
  van: enter route pay (flat, per stop or per package), stops, hours, miles, fuel,
  van payment, insurance and a tax set-aside and see true profit per route, per hour
  and per stop, cost per mile, break-even stops, the lowest route pay that hits a
  target hourly, weekly and annual take-home, and a two-offer comparison. Copy, CSV,
  save and load. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-11 in a new-venture session. duplicate_check.py scored 0.26
# against gig-driver-earnings-report-analyzer, which parses a platform's exported
# earnings report for rideshare/delivery drivers; this tool is a forward-looking
# per-route offer check for van owners paid by route, stop or package.
#
# Why this niche: contractor delivery routes are offered as a flat day rate or a
# per-stop/per-package rate, and the van payment, insurance, depreciation and claims
# reserve are easy to leave out, so a route that pays $28 an hour gross can take
# home under half of that. Searches like "delivery van contractor profit per route"
# and "cost per mile for a cargo van" recur. Willingness to pay exists (route and
# expense apps cost $10-30 a month), so this is the lead magnet for a later paid
# multi-route / multi-driver fleet view (payment rails stay off for now).
#
# First visitor: independent-contractor delivery forums and subreddits, cargo-van
# owner groups. Volume not measured with an external tool.
#
# Liability boundary: arithmetic on user-typed numbers. Not tax, legal or financial
# advice; says so. Names no platform, carrier or brand. No data fetched, no
# accounts, nothing stored.

hypotheses:
  - claim: >-
      Van-owning delivery contractors will enter an offer's pay and their van costs
      into a no-signup tool and use the true profit and minimum-pay numbers to
      accept, counter or decline a route.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a minimum route pay that does not reproduce the tool's own take-home per hour when typed back in as the route pay.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/courier-van-route-profit-calculator/
  analytics: null
