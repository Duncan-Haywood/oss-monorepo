name: student-loan-rap-ibr-standard-calculator
description: >-
  Free browser tool for federal student loan borrowers choosing a repayment plan: runs the tiered Standard
  plan, the new Repayment Assistance Plan (RAP) and Income-Based Repayment (IBR) month by month with income
  growth, shows first payment, total paid, amount forgiven, tax on forgiveness and net cost, plus a PSLF mode
  and an income-growth sensitivity grid. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-08 in a scheduled new-venture session. duplicate_check.py "student loan repayment plan
# comparison RAP IBR standard forgiveness" scored 0.29 at best (pslf-vs-refinance-calculator, a different
# question: PSLF against private refinancing).
#
# Why this niche: the 2025 budget law ended SAVE and PAYE for new borrowers and created RAP from July 2026,
# so tens of millions of borrowers are now being asked to pick between plans whose rules just changed. The
# servicer simulator and the Department of Education estimator are single-plan, slow and gated behind a login;
# the commercial planners are lead generation for refinance and consolidation firms. A private,
# login-free side-by-side with the net cost after tax on forgiveness is the gap. Rules changing again is the
# recurring reason to return, which makes it a good lead magnet and donation play.
#
# First visitor: someone searching "RAP vs IBR", "repayment assistance plan calculator" or "which student loan
# repayment plan is best". Volume not measured.
#
# Liability boundary: arithmetic on typed assumptions; no servicer or NSLDS lookups; no recommendation; every
# statutory figure is an editable default dated in the README; not tax or financial advice; nothing stored or
# uploaded.
#
# Path to revenue (payment rails stay off): donations; later a shareable scenario link, married-filing-
# separately modelling and a per-loan (not pooled) mode (not built).

hypotheses:
  - claim: >-
      Student loan borrowers will use a private, login-free comparison of RAP, IBR and Standard because the
      servicer tools show one plan at a time and none show the net cost after tax on forgiveness.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that a figure disagrees with the same inputs done by hand or with the Department of Education estimator.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/student-loan-rap-ibr-standard-calculator/
  analytics: null
