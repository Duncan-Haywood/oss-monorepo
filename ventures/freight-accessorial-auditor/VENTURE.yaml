name: freight-accessorial-auditor
description: A private browser tool that finds duplicate and over-billed freight accessorial charges before a shipper pays, compares a detention line to the dock clock, and shows whether eating an extra, billing the customer, or reviewing for a credit still keeps cash.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small shippers lose money to duplicate or unexpected accessorial invoice lines they currently review by hand.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A deterministic local audit with a downloadable review queue and a detention clock check can save enough review time to earn repeat use.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three shippers run two audits within 90 days.
  - Users cannot identify a real duplicate, overage, or clock mismatch on a supplied invoice.
links:
  production: null
  analytics: null
