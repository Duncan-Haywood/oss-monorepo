kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - A materially better free tool covering the same last-match-wins
    resolution against a real file list becomes the obvious default, such
    that this tool's differentiation (shadowed-vs-unmatched distinction,
    shared classification core tested independently of the CLI) no longer
    holds.

