# Any box with Docker:  ADMIN_KEY=$(openssl rand -hex 16) TEAM_TOKEN=$(openssl rand -hex 16) docker compose up -d
services:
  roster-hub:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      TEAM_TOKEN: ${TEAM_TOKEN:?set TEAM_TOKEN}
volumes:
  state:
