name: childcare-tuition-calculator
description: A private browser calculator for childcare center directors and family child care providers that prices a classroom from their own child:staff ratio, staffing cost, and overhead, and reports what an empty seat is actually costing them at every occupancy level.
stage: prototype
owner: duncan
# Not a <trade>-bid-calculator: it never asserts a state's licensed ratio (they
# vary by state and age group and go stale in a committed file), it takes the
# operator's own ratio as an input the same way it takes their own room
# capacity. First visitor channel: r/daycare and r/ECEProfessionals threads on
# tuition pricing and enrollment, and the search phrases "daycare tuition
# calculator", "how to price daycare tuition", and "childcare break even
# calculator".
hypotheses:
  - claim: Childcare center directors and family child care providers repeatedly need to check a classroom's real break-even and target tuition against staffing cost and occupancy, and currently do it in a spreadsheet or not at all.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The dollar cost of an empty seat -- not just the per-child tuition figure in isolation -- is what makes the arithmetic worth returning to, because staffing cost is fixed to the room's ratio and does not fall when enrollment drops.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: r/daycare, r/ECEProfessionals, and the search phrases "daycare tuition calculator" and "how to price daycare tuition" are a reachable, free channel for this -- measurable only once the tool is live and discoverable in the apex catalogue's sitemap.
    status: untested
    checked: null
    evidence: in-repo

economics:
  currency: USD
  mrr: null
  # Zero, and structurally so: every calculation runs in the visitor's own
  # browser from numbers they type. Serving one more visitor costs a static
  # file and nothing else.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three qualified childcare directors or family child care providers use the tool to check a real classroom within 90 days of it being discoverable.
  - Operators report that staffing cost and occupancy figures are not something they track closely enough to make the arithmetic usable without a POS or enrollment-management integration this tool does not have.
  - The empty-seat framing is read as pressure to overenroll past a safe ratio rather than a pricing check, making it unusable as a shared, non-punitive tool.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/childcare-tuition-calculator/
  analytics: null
