name: eu-csrd-scope-checker
description: >-
  Free browser tool for EU companies, non-EU groups with EU activity, and their advisers: enter headcount, turnover, balance sheet and company type to see whether the CSRD (Directive 2022/2464) applies under the original thresholds and under the Omnibus thresholds (1,000 employees and EUR 450M turnover), the first reporting financial year, and the VSME route if out of scope. Nothing is uploaded. Not legal advice.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; no CSRD/ESRS scope tool in ventures/ (cbam-cost-estimator, eu-green-claims-checker cover other regulations).
#
# First visitor: finance or sustainability lead at an EU mid-cap, or a consultant, searching "CSRD scope checker", "am I in scope for CSRD omnibus",
# "CSRD thresholds 1000 employees". Search interest spiked through the Omnibus news cycle. Volume not measured.
#
# Path to revenue (payment rails stay off): lead magnet into the other EU checkers; GitHub Sponsors. Paid version, not built: a VSME data-pack
# generator and customer-questionnaire answer bank, behind an env-var switch.
#
# Liability: first read of a law that is mid-amendment; shows the original and Omnibus readings side by side, names a verify source on every result,
# carries no-warranty and not-legal-advice clauses. Rules were written from memory without network access and must be verified;
# ethical risk is false comfort from a not-in-scope result, mitigated by the trickle-down finding and the side-by-side reading.

hypotheses:
  - claim: >-
      Mid-cap finance and sustainability leads confused by the Omnibus will use a free scope checker to learn whether they must report and what to prepare.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a threshold or date differs from the cited Directive on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/eu-csrd-scope-checker/
  analytics: null
