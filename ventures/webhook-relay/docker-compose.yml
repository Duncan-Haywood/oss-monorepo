# Any box with Docker:
#   ADMIN_KEY=$(openssl rand -hex 16) ROUTES_JSON='[...]' docker compose up -d
services:
  webhook-relay:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      STATE: /data/state.json
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      ROUTES_JSON: ${ROUTES_JSON:?set ROUTES_JSON}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
volumes:
  state:
