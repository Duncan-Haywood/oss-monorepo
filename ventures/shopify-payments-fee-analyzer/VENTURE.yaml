name: shopify-payments-fee-analyzer
description: >-
  Free browser tool that turns a Shopify Payments Transactions export CSV into
  a fee waterfall by transaction type, effective rate by card brand, card
  source and payment method, refund and dispute cost, a foreign-currency
  premium, a monthly table and editable what-if rates. The file is read
  locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session, the third data-file
# archetype after amazon-seller-profit-analyzer and
# etsy-statement-profit-analyzer. shopify-fee-calculator models one typed
# order; this reads the merchant's own Payments Transactions export and shows
# the blended rate they actually paid and why it exceeds the plan headline
# (international cards, currency conversion, AmEx, small orders, refunds whose
# fee is not returned, dispute fees). Paid alternatives are Shopify-app
# profit dashboards that need store access; this needs only a CSV.
# duplicate_check.py checked before building (top hit 0.37, a Stripe recovery
# analyzer, not a Shopify Payments one).
#
# First visitor: Shopify merchants asking r/shopify and the Shopify Community
# why their effective fee is above 2.9% + 30c, what refunds and chargebacks
# cost, or whether international sales are worth it. Search phrases "shopify
# payments effective rate", "shopify payments fees higher than expected",
# "shopify payments transactions export". Volume not measured with an
# external tool.
#
# Overlap note: shopify-payout-profit-analyzer landed the same day and reads
# the same file for a waterfall and per-product profit (Orders join). This
# venture is the fee-rate side: rate by brand, source, method and currency,
# refund and dispute cost, editable what-ifs. The two cross-link.
#
# Privacy is the differentiator and the liability boundary: the file never
# leaves the browser (a test asserts the page has no network calls), so the
# portfolio holds no order or customer data. Page carries an
# independent-of-Shopify trademark clause and the what-if rates are typed by
# the user, never asserted as Shopify's current rates.
#
# Column matching was written from Shopify's documented Payments transactions
# export, not from a live store; unknown transaction types land in an "other"
# bucket and unreadable rows are listed with line and reason, so a format
# drift shows up as a visible bucket rather than a wrong total.
#
# Path to revenue (payments stay off): free tool -> lead magnet for a
# donation-supported open-source repo. If it earns repeat visitors the
# natural paid step is multi-year comparison and a plan-switch recommendation,
# still local-only.

hypotheses:
  - claim: >-
      Shopify merchants who want to know why their real fee rate exceeds the
      headline will prefer a no-signup tool that reads their own Transactions
      export locally over installing an app with store access.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing international, currency-conversion, refund and dispute costs as
      dollars and a share of sales changes pricing, market and refund-policy
      decisions and is the reason to return after each monthly export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in file) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong figure from a real Transactions export, at which point the type classification or column mapping needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/shopify-payments-fee-analyzer/
  analytics: null
