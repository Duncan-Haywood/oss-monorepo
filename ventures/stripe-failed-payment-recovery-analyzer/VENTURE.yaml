name: stripe-failed-payment-recovery-analyzer
description: >-
  Free browser tool that turns a Stripe payments CSV export into a failed-payment
  recovery report: recovery rate, revenue lost, decline reasons grouped by what to
  do about them (new card, retry later, do not retry), time to recovery and a
  what-if. The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. The paid category is real
# (Churnkey, Baremetics Recover, ProfitWell Retain / Paddle, Stripe's own Smart
# Retries) and sells "recover failed payments" to the same founders who buy
# churn analytics; this is the free diagnostic that comes before buying any of
# them, and the first thing they need is the number: how much is actually lost
# and how much of it is fixable. duplicate_check.py top score 0.28
# (duplicate-payment-audit, a different problem: paying vendors twice).
#
# First visitor: micro-SaaS and indie founders on r/SaaS, r/microsaas, Indie
# Hackers and Stripe-focused communities asking "how many failed payments do I
# recover" and "is my retry schedule any good"; search phrases "stripe failed
# payments recovery rate", "involuntary churn stripe export", "stripe decline
# codes what to do". Volume not measured with an external tool.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts the page has no network calls), so the portfolio
# holds no customer data.
#
# Path to revenue (payment rails stay off): this is the lead magnet. The paid
# version, if usage appears, is a hosted monthly report and a Stripe-connected
# retry-schedule tester; neither is built.
#
# Liability: arithmetic on the user's file, stated model and omissions on the
# page, no advice, no warranty.

hypotheses:
  - claim: >-
      Founders who suspect involuntary churn will run a no-signup, no-API-key
      analysis of an exported Stripe payments CSV before connecting a
      dunning vendor to their billing account.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Splitting lost revenue into new-card, retry-later and do-not-retry changes
      what a founder fixes first, which is the reason to return after each
      monthly export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong recovery or lost-revenue figure from a real Stripe export, at which point the parser or model needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/stripe-failed-payment-recovery-analyzer/
  analytics: null
