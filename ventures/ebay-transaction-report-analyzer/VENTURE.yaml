name: ebay-transaction-report-analyzer
description: >-
  Free browser tool that turns an eBay Seller Hub Transaction report CSV into a
  fee waterfall (final value fees, Promoted Listings, shipping labels, refunds),
  profit per item once the seller enters a unit cost, the free-shipping label
  gap, and plain-language findings. The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session, the fifth data-file archetype
# after the Amazon, Etsy, Shopify and Airbnb analyzers. eBay is the largest
# reseller population of the marketplaces the portfolio covers, and the paid
# alternatives (profit dashboards for eBay, bookkeeping syncs) all want account
# access first. The seller already has the file: Seller Hub -> Payments ->
# Reports -> Transaction report. This is the free diagnostic that answers "which
# item, after the label I bought, the ad I paid for and the return I took, made
# money" before a subscription is bought.
# duplicate_check.py run against the venture set; ebay-fee-calculator models one
# typed sale and now links here.
#
# First visitor: resellers on r/Flipping, r/eBaySellerAdvice and r/Ebay asking
# "how do I see my real profit", "why do I make less than sale minus fees";
# search phrases "ebay transaction report profit", "ebay profit per item",
# "ebay true profit calculator". Volume not measured with an external tool.
#
# What makes it more than a pivot table: label, refund and ad rows carry no
# item title, so the tool ties them back through the order number; the label gap
# compares shipping buyers paid with labels bought; refunded orders return units
# to stock only if the seller says so; anything that does not reconcile is shown
# as "tax and adjustments" rather than dropped.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts the page has no network calls), so the portfolio
# holds no seller or buyer data and needs no eBay API access or developer approval.
#
# Path to revenue (payment rails stay off): lead magnet. The paid version, if
# usage appears, is a month-over-month diff and multi-marketplace merge behind
# an env-var switch; neither is built.
#
# Liability: arithmetic on the user's file, stated model and omissions on the
# page, no tax or legal advice, no warranty, independent-of-eBay clause.
#
# Unverified: the column names are from memory of eBay's Transaction report and
# matched tolerantly (aliases, header row searched below the preamble, day-first
# and short-year dates); no real export was available to test against, so the
# first user report of an unread file is the priority fix.

hypotheses:
  - claim: >-
      eBay resellers will run a no-signup, no-account-access analysis of the
      Transaction report they already downloaded before connecting a profit
      dashboard to their eBay account.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing the shipping-label gap and Promoted Listings cost per item in dollars
      changes at least one price, free-shipping or ad-rate decision, which is the
      reason to come back after each monthly export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong profit figure, or a real eBay export the tool cannot read, at which point the parser needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/ebay-transaction-report-analyzer/
  analytics: null
