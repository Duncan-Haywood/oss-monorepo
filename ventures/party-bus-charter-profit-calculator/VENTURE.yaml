name: party-bus-charter-profit-calculator
description: >-
  Free browser tool for party bus, limo and shuttle charter operators: enter the charter
  price, hours booked and minimum, driver and deadhead hours, miles, fuel, cleaning,
  gratuity share, card fees, vehicle cost and yearly overhead and see true profit per
  charter, margin, profit per vehicle hour, the lowest quote that earns a target margin,
  how many charters a vehicle needs to pay for itself, break-even charters a year, and a
  two-charter comparison. Copy, CSV, save and load. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-12 in a new-venture session. No party-bus, limo or charter-vehicle venture
# existed (`ls ventures | grep -iE 'limo|bus|charter'` found only fishing-charter-trip-pricing-calculator,
# a boat trade, and unrelated "business" names). Why this niche: small party bus, limo and shuttle
# operators quote a price for a block of hours, but the vehicle and driver are tied up for more than
# the billed time (positioning from the garage, empty miles, a minimum-hours rule) and a $85k bus is a
# purchase decision with a payback nobody computes. Searches like "how to price a party bus charter"
# and "limo business profit per trip" recur. Fleet dispatch software costs money per vehicle and does
# not answer the pricing question, so this is the lead magnet for a later paid multi-vehicle season
# planner (payment rails stay off for now).
#
# First visitor: party bus and limo operator groups and forums. Volume not measured with an
# external tool.
#
# Liability boundary: arithmetic on user-typed numbers. Not tax, legal, insurance or financial
# advice; says so. Names no vendor or brand. No data fetched, no accounts, nothing stored.

hypotheses:
  - claim: >-
      Small party bus, limo and shuttle operators will enter a quote and their driver, deadhead
      and vehicle costs into a no-signup tool and use the lowest-quote and payback numbers to
      raise prices, set a minimum, or decide whether to buy another vehicle.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a lowest quote that does not reproduce the tool's own target margin when typed back in as the charter price.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/party-bus-charter-profit-calculator/
  analytics: null
