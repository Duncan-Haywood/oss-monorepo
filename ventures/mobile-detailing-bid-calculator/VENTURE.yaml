name: mobile-detailing-bid-calculator
description: Free browser calculator for mobile detailers to price a profitable job after labor, travel, supplies, overhead, payment fees, and target margin.

stage: prototype
owner: duncan

hypotheses:
  - claim: Mobile detailers will return to a private calculator that turns a job's real travel, labor, and supply burden into a defensible minimum quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Searchers for mobile detailing pricing and minimum charge calculators are underserved by generic hourly-rate tools that omit vehicle travel and setup time.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 10
  protected: true

kill_criteria:
  - No return usage or organic referral signal within 60 days of publishing.
  - No unsolicited feedback, star, fork, or referral within 90 days of publishing.

links:
  production: null
  analytics: null
