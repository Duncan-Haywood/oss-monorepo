name: residential-takeoff
description: >-
  Paid edition of Wall Framing Takeoff for remodelers, framers and small builders: a house typed,
  drawn or read from IFC/DXF in the browser gives the stud layout, cut list, cheapest board order with
  a lower bound, wall and roof sheathing, outline and hip roofs, and one supplier material list. Sold
  per house as a $29 Job report (apps/wall-framing-takeoff/docs/PRICING.md); dark until a checkout
  link is set.
stage: prototype
owner: duncan

