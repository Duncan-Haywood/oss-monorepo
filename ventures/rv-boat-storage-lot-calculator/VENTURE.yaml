name: rv-boat-storage-lot-calculator
description: >-
  Free browser tool for people planning an outdoor RV, boat and trailer storage lot: enter acres, usable share, space size, land,
  surfacing, fencing and permit cost, rent per space, occupancy and lease-up, operating costs and a loan, and see how many spaces
  fit, net operating income, yield on cost, debt coverage, break-even occupancy, the rent that reaches a target yield, a
  month-by-month lease-up with payback, and the equity IRR if the lot is sold after a number of years. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-12 in a new-venture-first session. duplicate_check.py nearest was forestry-mulching-bid-calculator (0.18, shared
# words only); self-storage-unit-mix-optimizer is indoor climate-controlled unit mix, mobile-home-park-valuation-calculator values an
# existing park, pickleball-facility-pro-forma is a different asset. No outdoor vehicle-storage lot tool existed. Not in screened-out.md.
#
# First visitor: a landowner or small investor pricing an RV/boat storage lot before buying land or paving; search phrases "RV storage
# business calculator", "boat storage lot profit", "RV storage ROI". Volume not measured with an external tool.
#
# Who: landowners and small investors. Land plus surfacing plus a loan is a six-figure commitment, so a free, private pro forma that
# shows the lease-up cash dip and the break-even occupancy before buying is worth more than a spreadsheet template.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. Saved scenarios and a multi-lot comparison
# behind an env-var switch is the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with every rule visible on the page. No market rent or occupancy is claimed, sample
# figures are labelled illustrative, bad input is rejected instead of clamped, and the page carries the no-warranty and not-advice
# clauses and lists what it does not decide (zoning, permits, build-period interest, tax, lender terms).

hypotheses:
  - claim: >-
      A prospective storage-lot investor will enter acres, land, surfacing cost, rent and occupancy before buying land, because the
      lease-up cash dip and the break-even occupancy are hard to see in a headline rent-per-space number.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that the NOI, debt-coverage or IRR arithmetic differs from the stated rules on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/rv-boat-storage-lot-calculator/
  analytics: null
