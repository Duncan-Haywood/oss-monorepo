name: sales-export-to-journal
description: >-
  Free browser tool: drop any Airbnb, Amazon, eBay, Etsy, Gumroad, PayPal, Shopify, Square or Stripe sales or payout export
  and it works out which platform wrote the file, proves the rows add up to the payout, splits sales, shipping, tax,
  fees and refunds, and downloads balanced month-split journals for Xero, QuickBooks Online and QuickBooks Desktop
  (IIF). One front door for fifteen single-platform journal tools (Ko-fi, Buy Me a Coffee and Teachable share one export layout, as do Patreon and Lemon Squeezy); the file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05. The commercial analogues are A2X, Synder and Link My Books (sales-channel sync into Xero and
# QuickBooks, sold per month); this is the no-account, no-upload, one-file-at-a-time version. It exists because the
# fifteen single-platform tools each rank for one narrow phrase, while a seller who sells on several platforms, or a
# bookkeeper with clients on different ones, searches for the job ("sales report to QuickBooks journal", "import
# sales into Xero") and does not know in advance which tool fits. The hub removes that choice: it runs all fifteen
# readers over the file and keeps the best fit, with header-word signatures to break ties between look-alike exports
# (Stripe/Shopify/Gumroad all carry gross, fee, net, payout id).
# Search phrases: "import sales into QuickBooks", "marketplace sales to journal entry", "multi channel ecommerce
# bookkeeping QuickBooks", "sales report to Xero manual journal". Volume not measured with an external tool.
#
# Who: multi-channel sellers who keep their own books, and bookkeepers serving several of them.
#
# Path to revenue (payment rails stay off): lead magnet for the seller and bookkeeper audience. If usage appears,
# the paid version is what a browser page cannot do: batch many payouts and clients, remember the account mapping
# per client, pull exports on a schedule (behind an env-var switch). Not built.
#
# Liability: it writes a journal from the user's own export, shows the check it ran and states what it does not
# check (tax treatment, revenue recognition, currency conversion), with the no-warranty, independent-of-vendors and
# financial-data clauses.
#
# Unverified: every platform's column names and every importer layout are from memory of public help documents; the
# detector is proved only against each engine's own synthetic sample, never against a real export. A real export it
# misdetects, or a journal an importer refuses, is the priority fix. engines/*.mjs are copies of the per-platform
# calc.mjs files and drift unless re-copied.

hypotheses:
  - claim: >-
      A seller on more than one platform, or a bookkeeper with clients on several, will drop whatever export they
      have onto one page and let it pick the platform, because they search for the job rather than for one platform's
      tool.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a real export this page misdetects or a journal Xero or QuickBooks refuses, at which point the signatures and layouts need revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/sales-export-to-journal/
  analytics: null
