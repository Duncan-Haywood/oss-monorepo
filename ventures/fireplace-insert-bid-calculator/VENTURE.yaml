name: fireplace-insert-bid-calculator
description: A private browser calculator for hearth and chimney shops that prices a fireplace-insert install from fuel, liner footage, hearth, gas run, dedicated circuit, surround, and stack height — and shows the hours the first liner actually consumes and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent hearth shops will use a liner-and-extras bid calculator because the generic "$2,499 installed" gas-insert special they are shopped on cannot see that a small cassette in an existing firebox is a different job from a large wood insert with a 30-foot liner, a new hearth, and a two-story stack.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published installed special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper insert quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating liner footage, a hearth, a gas run, a dedicated circuit, a surround, and stack height as their own hours, instead of a blended add-on to a $2,499 special, changes the bid enough that shops notice which part of a high number is the first liner.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified hearth or chimney shops use the calculator twice within 90 days.
  - Shops report that splitting the liner and extras versus a small gas special is more work than their existing per-insert method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
