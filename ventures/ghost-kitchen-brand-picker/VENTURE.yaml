name: ghost-kitchen-brand-picker
description: >-
  Free browser tool for ghost kitchens and delivery-only restaurants running several virtual brands out of one line: enter the
  kitchen hours you can staff, your labour cost, and each brand's weekly orders, order value, food cost, delivery-app fees,
  packaging, prep minutes and own monthly cost, and get the set of brands that earns the most inside those hours. Checks every
  combination exactly (up to 14 brands), compares it with best-profit-per-hour, biggest-profit and best-margin rules, shows each
  brand's profit per order, per kitchen hour and break-even orders, what 25, 50 and 100 percent more kitchen hours would add, and
  re-solves with orders 30 percent lower and higher. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-09 in a scheduled session. duplicate_check.py: closest rows delivery-app-margin-calculator (one menu item's
# margin on the apps) and food-truck-prep-mix-optimizer (what to prep for one service); neither chooses which virtual brands a
# shared kitchen should keep under a labour-hours limit.
#
# Why this niche: virtual-brand operators are told to "add another brand" by the platforms and by consultants selling brand
# packs, but every brand takes kitchen hours, packaging and a monthly cost, and the fee stack on delivery apps is 25-30%. Which
# set to keep is a knapsack problem owners solve by feel.
#
# First visitor: people searching "ghost kitchen profitability", "virtual brand worth it", "how many virtual brands can one
# kitchen run"; r/ghostkitchen, r/restaurateur, ghost-kitchen operator groups. Volume not measured.
#
# Liability boundary: arithmetic on typed figures; not business or financial advice; nothing stored or sent.
#
# Path to revenue (payment rails stay off): lead magnet and donations; natural front end for a paid menu-and-labour optimiser
# reading a POS or delivery-app export.

hypotheses:
  - claim: >-
      Ghost-kitchen and delivery-only operators with several virtual brands will use a free tool that picks which brands to
      keep under a kitchen-hours limit, and will return when they consider adding or dropping a brand.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that a figure disagrees with the same inputs done by hand.

links:
