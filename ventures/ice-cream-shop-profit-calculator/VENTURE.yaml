name: ice-cream-shop-profit-calculator
description: >-
  Free browser tool for people planning or running an ice cream shop or seasonal scoop stand: enter scoops per day on weekdays and
  weekends, a hot season and an off season, price, cones, cups, shakes, toppings and pints, mix and cone cost, crew, rent, equipment,
  build-out and a loan, and see break-even scoops per day, cost of goods, labor and prime cost, operating profit, yield on start-up cost,
  the scoop price that reaches a target yield, a month-by-month cash table with the lowest point and payback month, and an equity view
  with an optional sale. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-12 in a new-venture-first session. duplicate_check.py "ice cream shop" scored nothing above 0.16 (the nearest was
# shaved-ice-stand-profit-calculator, which prices a festival booth cup by cup and event by event, with no weekly traffic, seasons, build-out,
# loan or payback). pour-cost-calculator and recipe-costing-calculator price one recipe, not a shop. No venture models a scoop shop with a hot
# season, an off season, a pint line and a start-up loan. Not in screened-out.md.
#
# First visitor: someone pricing an ice cream shop or seasonal stand before signing a lease; search phrases "ice cream shop business plan",
# "ice cream shop profit margin", "how many scoops to break even". Volume not measured with an external tool.
#
# Who: prospective and early-stage owners. Cabinets, build-out and a seasonal cash dip are a five-figure commitment, so a free private pro
# forma that shows break-even scoops per day, prime cost and the off-season cash low point before signing is worth more than a template.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. Saved scenarios and a multi-location comparison behind
# an env-var switch is the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with every rule visible on the page. No market price or sales volume is claimed, sample
# figures are labelled illustrative, bad input is rejected instead of clamped, and the page carries the no-warranty and not-advice clauses and
# lists what it does not decide (zoning, health-department and dairy or frozen-dessert licensing, tax, lender terms).

hypotheses:
  - claim: >-
      A prospective ice cream shop owner will enter scoops per day, price, mix cost, crew, rent and build-out before signing a lease, because
      break-even scoops, prime cost and the off-season cash dip are hard to see in a headline price-per-scoop number.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that the break-even, prime cost or payback arithmetic differs from the stated rules on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/ice-cream-shop-profit-calculator/
  analytics: null
