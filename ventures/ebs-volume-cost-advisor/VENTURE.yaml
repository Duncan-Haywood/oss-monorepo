name: ebs-volume-cost-advisor
description: 'Free, zero-network, zero-dependency CLI + browser tool that reads a list of EBS volumes (type, size, provisioned and observed peak IOPS/throughput, attached or not) and prices each as gp2, gp3, io1/io2, st1 or sc1, names the cheapest type that still covers the peak with headroom, prints the live `aws ec2 modify-volume` command, and flags gp2 volumes that depend on burst credits, HDD volumes above their IOPS limit, over-provisioned io1/gp3 IOPS and unattached volumes; usable as a CI check. Peaks are supplied by the user and prices are editable list prices, not a bill.'
stage: prototype

owner: duncan

# CLI/checker archetype (portfolio/pipeline/README.md "archetype itself").
# Sibling of dynamodb-capacity-mode-advisor and lambda-memory-rightsizer in the
# cloud-cost-from-pasted-numbers family. Checked 2026-10-02: nothing in
# ventures/ prices EBS (the S3 sibling s3-storage-class-savings landed hours
# earlier from another session; an S3 version of this tool was parked for that
# reason). Not in screened-out.md.
#
# Where the first real visitor would come from: the search phrases "gp2 vs
# gp3", "migrate gp2 to gp3", "ebs gp3 iops throughput cost", "io1 vs gp3",
# "unattached ebs volumes cost"; r/aws and Stack Overflow threads about an EBS
# line on the bill. The reader is a platform engineer or FinOps owner with a
# four- to six-figure monthly EBS bill. Adjacent tools (AWS pricing calculator,
# Compute Optimizer's EBS recommendations, vendor FinOps suites) need an AWS
# account, an opt-in, or a paid contract; this works on pasted rows with no
# access and emits the exact modify-volume command -- the wedge. A hosted
# multi-account monitor with PR comments on Terraform volume changes is the
# natural paid upgrade.
hypotheses:
  - claim: An engineer with an EBS line on the bill will search gp2 to gp3, paste a volume list, and leave with a modify-volume command per volume and a monthly saving.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A platform team will add the CLI to a scheduled job against describe-volumes plus CloudWatch peaks with --fail-on warn so a new gp2, an over-provisioned io1 or an unattached volume is flagged before the invoice.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool analyses only pasted text in the
  # visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No external repository is found wiring cli.mjs into its own CI within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/ebs-volume-cost-advisor/
  analytics: null
