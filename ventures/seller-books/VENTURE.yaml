name: seller-books
description: >-
  Hosted profit and Schedule C books for resellers on eBay, Poshmark, Mercari, Whatnot, Depop, Etsy,
  Shopify, Amazon, TikTok Shop and Square: report imports, cost of goods per item and lot, mileage,
  expenses, a Schedule C worksheet (not a filing, not tax advice), quarterly estimates and a QuickBooks
  journal export, sold by subscription ($0/$15/$35/$69 a month by orders; apps/seller-books/src/shared/plans.ts).
