name: pole-barn-bid-calculator
description: A private browser calculator for post-frame and pole-barn builders that prices a building from bay spacing, eave height, overhead doors, lean-to, and gravel versus slab — and shows the extra-work share and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent post-frame shops will use a bay-and-eave bid calculator because the generic "$45 a square foot" Facebook special they are shopped on cannot see that a 30×40×10 ag shell on gravel is a different job from a 40×60×16 shop with two overhead doors, a lean-to, and a 6-inch slab.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the extra-work share (not the published per-foot dump) are the two figures a shop actually decides on when an owner asks them to match a cheaper 10-foot gravel quote on a 16-foot slab shop.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing gravel, a 4-inch slab, and a 6-inch reinforced slab on the same barn, with extra eave hours from the height, changes the bid enough that shops notice which floor keeps the margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified post-frame or pole-barn shops use the calculator twice within 90 days.
  - Shops report that splitting bays, eave, doors, and floor is more work than their existing per-foot method without changing the price they would have bid.
  - The starting hours and lumber rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/pole-barn-bid-calculator/
  analytics: null
