[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-trading-lab"
version = "0.1.0"
description = "Backtest, research and carefully trade rules-based strategies on your own account, with overfitting controls"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
robinhood = ["cryptography>=41"]

[project.scripts]
tradelab = "tradelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
