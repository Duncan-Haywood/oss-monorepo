name: lemon-squeezy-payout-to-journal
description: >-
  Free browser tool that turns a Lemon Squeezy orders or payouts export into balanced accounting journals
  for Xero, QuickBooks Online and QuickBooks Desktop (IIF). It splits every order into product sales income,
  shipping income, tax collected and Lemon Squeezy's fee, books refunds separately instead of the net payout,
  proves the rows add up to the payout (from a payout row, a payout ID column, or a deposit typed in from the
  bank), splits a payout that straddles a month end into one journal per month, and balances each to a Lemon
  Squeezy clearing account. Differences no rule explains are journalled to an uncategorised account rather
  than dropped. The export is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05. The commercial analogue is A2X and Synder (payment-platform sync into Xero and
# QuickBooks, sold per month); this is the no-account, no-upload, one-export-at-a-time version for indie
# software, template and course sellers who sell through Lemon Squeezy (a merchant of record, so the deposit
# is net of its fee and of tax it remits itself) and book the net payout as income. Sibling of
# patreon-payout-to-journal, gumroad-sales-to-journal and the other *-to-journal ventures: same engine and
# journal shape, different export. Paddle and FastSpring exports use similar columns and are matched by alias.
# Search phrases: "Lemon Squeezy to QuickBooks", "Lemon Squeezy to Xero", "Lemon Squeezy accounting journal",
# "how to record Lemon Squeezy payouts in QuickBooks", "Lemon Squeezy bookkeeping fees".
# Volume not measured with an external tool.
#
# Path to revenue (payment rails stay off): lead magnet for the indie-seller and bookkeeper audience. If usage
# appears, the paid version is what a browser page cannot do: batch many payouts and clients, remember the
# account mapping per client, pull exports on a schedule (behind an env-var switch). Not built.
#
# Liability: it writes a journal from the user's own export, shows the check it ran, states what it does not
# check (tax treatment, revenue recognition, currency conversion), and carries the no-warranty, independent-
# of-Lemon-Squeezy and financial-data clauses.
#
# Unverified: the column names of the Lemon Squeezy export, how its fee is stated, and the Xero, QuickBooks
# Online and IIF import layouts are from memory of public help documents; nothing ran against a real export
# or a live import. The first export this misreads is the priority fix.

hypotheses:
  - claim: >-
      A Lemon Squeezy seller or their bookkeeper will paste an orders or payouts export into a no-upload page to get a month-split
      journal, because the alternatives are booking the net payout (hiding fees and refunds) or paying a monthly
      sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a payout this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

