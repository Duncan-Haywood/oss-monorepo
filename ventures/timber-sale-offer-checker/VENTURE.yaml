name: timber-sale-offer-checker
description: >-
  Free browser tool and CLI for landowners selling timber: list your logs, price each species per MBF, enter a logger's offer and
  see board feet under Doyle, Scribner and International rules, the value at your prices, the price per MBF the offer implies,
  and what a consulting forester must add to pay for themselves. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. No venture covers timber sales (repo search for "stumpage", "board feet",
# "Doyle", "log rule", "timber" in ventures/ and portfolio/pipeline/ found nothing relevant); nearest is firewood-profit-calculator,
# which prices cordwood, not a standing-timber sale. Not in screened-out.md.
#
# Why this niche: a mature hardwood stand is often the largest single cheque a rural landowner receives, offers are commonly
# lump-sum, and the buyer scales the logs. The Doyle rule undercounts small logs by tens of percent against International, so
# price-per-MBF quotes are not comparable across rules. Paid answers are consulting foresters (a percentage of the sale) and
# regional extension spreadsheets; a paste-the-logs checker is the missing first-look tool and a lead magnet for foresters.
#
# First visitor: private woodland owners searching "is this timber offer fair", "Doyle vs Scribner vs International",
# "how much is my timber worth", "timber sale forester fee worth it". Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user enters. No market data is shipped; prices are the user's. Not forestry,
# legal or tax advice, not a valuation or appraisal; the page says so, notes that Scribner is a formula approximation, and
# carries the no-warranty and no-SLA clauses. No data leaves the browser; no buyer or forester is named or ranked.
#
# Path to revenue (payment rails stay off): lead magnet and donations. The natural paid layer is a hosted bid-request room that
# sends the same log list to several local buyers and collects comparable bids, which needs accounts and payments and so an
# owner decision; not built. Written to be open-sourced as is.

hypotheses:
  - claim: >-
      Landowners with a logger's offer in hand will paste their log list into a no-signup checker to test it.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Showing the same logs under Doyle and International side by side is the moment that makes owners ask for a second bid.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Foresters report that the Scribner approximation or the missing defect deductions make the output misleading, at which point the tool should load printed tables and a cull percentage.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/timber-sale-offer-checker/
  analytics: null
