name: hay-sale-price-calculator
description: >-
  Free browser tool and CLI for hay producers: break-even price per ton and per bale, net per acre, and a ranking of small
  squares, large squares and round bales on the producer's own costs and prices. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. Repo search of ventures/ for "hay", "forage", "bale" found hay-baling-own-vs-hire
# (buy a baler vs hire) and grazing-lease-rate-calculator (rent a pasture); neither prices hay for sale. Not in screened-out.md.
#
# Why this niche: small hay producers sell by the bale at a price set by a neighbour or a buyer's offer, with no view of cost per
# ton or of which bale type nets most after baling cost and storage loss. Income tool for a land-based operator.
#
# First visitor: producers searching "hay price per bale calculator", "small square vs round bale profit", "hay break-even".
# Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user enters. No price data is shipped. Not tax or financial advice; the page says
# so and carries the no-warranty and no-SLA clauses. No data leaves the browser.
#
# Path to revenue (payment rails stay off): lead magnet and donations. A paid layer (hosted hay inventory and buyer list) needs
# accounts and payments, so an owner decision; not built.

hypotheses:
  - claim: >-
      Hay producers with a buyer's offer in hand will type their costs into a no-signup calculator to see break-even and compare bale types.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing net per acre by bale type changes which product a small producer makes.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Users report that hay quality (RFV, moisture) drives price far more than bale type, at which point the tool should model quality tiers.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/hay-sale-price-calculator/
  analytics: null
