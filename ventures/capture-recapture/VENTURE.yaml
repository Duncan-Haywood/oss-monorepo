name: capture-recapture
description: >-
  Free browser tool, CLI and agent call for closed-population size from
  capture-recapture data: Lincoln-Petersen and Chapman, models M0, Mt and Mb
  by maximum likelihood with profile-likelihood intervals and AIC weights,
  Chao's heterogeneity estimator and the jackknife, one estimate per group.
  Nothing is uploaded.
stage: prototype
owner: duncan

# Built 2026-11-18 on an explore run as a research-algorithm tool: no
# venture README mentioned capture-recapture or Lincoln-Petersen (searched
# all 1,403 venture directories' READMEs). Implemented from Otis et al. 1978,
# Darroch 1958, Chapman 1951, Seber 1982, Chao 1987 and Burnham & Overton
# 1978; no third-party code was ported.
#
# First visitor: searches such as "lincoln petersen calculator", "mark
# recapture population estimate calculator", "chapman estimator", "schnabel
# method calculator", "capture recapture defects code review". Volume not
# measured with an external tool.
#
# Alternatives: Program MARK and CAPTURE (free, Windows, steep), R packages
# (Rcapture, RMark), spreadsheet templates (usually Lincoln-Petersen only).
# Differentiators: no install, histories or counts, profile intervals, model
# weights, Chao and the jackknife side by side, a coverage check that shows
# where each estimator fails.
#
# Liability: a statistical estimate, not wildlife-management or regulatory
# advice; the page states the closed-population assumptions. Data never
# leave the browser (tests assert no network calls).

hypotheses:
  - claim: >-
      Ecology students, field technicians and instructors will use a
      no-install page that takes capture histories and shows M0/Mt/Mb, Chao
      and their intervals side by side.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports an estimate that differs from Program MARK or Rcapture with the same model and data, and the cause is a bug that cannot be fixed.

links:
  production: https://marisstella.app/capture-recapture/
  analytics: null
