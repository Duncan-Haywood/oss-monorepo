name: teachable-payout-to-journal
description: >-
  Free browser tool that turns a Teachable transactions export into balanced accounting journals for Xero,
  QuickBooks Online and QuickBooks Desktop (IIF). It books course sales, bundles, memberships and coaching
  to separate income accounts by product type, derives the Teachable and PayPal or Stripe fee as Given minus
  Received, proves the rows add up to the deposit typed in from PayPal, Stripe or the bank, splits an export
  that straddles a month end into one journal per month, and balances each to a Teachable clearing account.
  Types no rule recognises are journalled to an uncategorised account rather than dropped. The export is
  read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06. The commercial analogues are A2X and Synder (marketplace and payment-platform sync into
# Xero and QuickBooks, sold per month); this is the no-account, no-upload, one-export-at-a-time version for
# Teachable course creators, whose money lands in PayPal or Stripe net of fees and mixed across courses, bundles, memberships and
# coaching. Sibling of ko-fi-payout-to-journal, buymeacoffee-payout-to-journal, patreon-payout-to-journal, gumroad-sales-to-journal and the rest of the
# journal family; differs in that the fee is derived as amount minus net when the export has no fee column, and a course/bundle/membership/coaching type that drives which income account a row lands in.
# Search phrases: "Teachable to QuickBooks", "Teachable to Xero", "how to record Teachable course sales in QuickBooks",
# "Teachable bookkeeping", "Teachable income accounting". Volume not measured with an external tool.
#
# Who: Teachable course creators (course creators, coaches, schools) who keep their own books, and the
# bookkeepers serving several of them, who today book the net PayPal or Stripe deposit as income.
#
# Path to revenue (payment rails stay off): lead magnet for the creator and bookkeeper audience. If usage
# appears, the paid version is what a browser page cannot do: batch many clients, remember the account mapping
# per client, and add Kajabi, Podia and Thinkific exports. Not built.
#
# Liability: writes a journal from the user's own export, shows the check it ran, states what it does not
# check (tax treatment, currency conversion), and carries the no-warranty, independent-of-Teachable and
# financial-data clauses.
#
# Unverified: the column names of the Teachable transactions export, how the fee is split between Teachable and the
# processor, and the Xero, QuickBooks Online and IIF import layouts are from memory of public help documents;
# nothing ran against a real Teachable export or a live import. The first export this misreads is the priority fix.

hypotheses:
  - claim: >-
      A Teachable creator or their bookkeeper will paste a transactions export into a no-upload page to get a
      month-split journal, because the alternatives are booking the net deposit (hiding fees, mixing course sales with
      sales) or paying a monthly sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a payout this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

links:
