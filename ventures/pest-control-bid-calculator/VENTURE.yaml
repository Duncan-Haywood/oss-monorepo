name: pest-control-bid-calculator
description: A private browser calculator for independent pest control operators that prices a route stop from on-site minutes, bait stations, and drive time — not house size — and shows the initial vs recurring invoices, the hourly rate once drive is inside the stop, and how many later visits recover a waived initial.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent pest control operators will use a stop-time calculator because the generic house-size quotes they find online cannot see that eight rodent stations and a 22-minute drive are a different job from an exterior-only spray next door, which is how a quarterly that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The hourly rate including drive, and the number of later stops needed to recover a free initial, are the two numbers an operator actually decides on when a homeowner asks them to match a cheap quarterly, more than the house-size price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Station count and one-way drive are the two inputs most often left out of a small operator's own quote, so making both required, explained inputs changes the resulting bid materially.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified pest control operators use the calculator twice within 90 days.
  - Operators report that splitting stations and drive from house size is more work than their existing method without changing the price they would have bid.
  - The starting minutes prove so far from real route times that the tool cannot be used without data we have no way to gather.
