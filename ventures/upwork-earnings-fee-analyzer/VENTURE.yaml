name: upwork-earnings-fee-analyzer
description: >-
  Free browser tool that turns an Upwork-style transaction history CSV into the
  service fee actually paid, Connects, membership and withdrawal costs, take-home
  by contract and by month, and net pay per hour after fees. The file is read
  locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. Freelancers on Upwork, and
# agencies that bill through it, are a large earn-more-minded market whose only
# fee report is a raw transaction CSV nobody pivots. Paid neighbours (Bonsai,
# Hectic, Wave, QuickBooks Self-Employed) all want an account first. This is the
# free diagnostic that answers "what did the platform actually cost me, and which
# client is worth it per hour" from a file the freelancer already holds.
# duplicate_check.py top score 0.36 (airbnb-earnings-report-analyzer; different
# platform and ledger shape, no overlap in what is analysed).
#
# First visitor: r/Upwork and r/freelance threads asking "how much does Upwork
# really take" and "is Connects worth it", plus search phrases "upwork fee
# calculator", "upwork earnings after fees", "upwork transaction history csv".
# Volume not measured with an external tool.
#
# What makes it more than a sum: the fee rate is observed per contract from the
# file (schedules changed over time and differ by contract start date), service
# fees are matched to their payment through the shared Ref ID, net per hour uses
# only payments where hours exist, and Connects/membership are reported as the
# cost of finding work rather than smeared across contracts.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts no network calls), so the portfolio holds no client
# names or earnings and needs no partner API.
#
# Path to revenue (payment rails stay off): lead magnet with tie-ins to the tax
# calendar and invoice-terms tools; a multi-platform merged view (Fiverr, Toptal,
# Stripe payouts) and a period-over-period diff are the natural later versions.
#
# Liability: arithmetic on the user's file, stated model and omissions on the
# page, no fee-schedule claims (only what the file shows), no tax advice, no
# warranty, independent-of-every-platform clause.
#
# Unverified: column names and type wording are from memory of the export and
# matched by alias and keyword; no real export was available, so the first user
# report of an unread file or a misclassified row is the priority fix.

hypotheses:
  - claim: >-
      Freelancers will run a no-signup analysis of a transaction history they
      already exported before trusting a finance app with their account.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing observed fees and net pay per hour by contract changes at least one
      decision about which clients to keep or reprice, which is the reason to
      come back with each new export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong fee or pay figure, or a real export the tool cannot read, at which point the parser needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/upwork-earnings-fee-analyzer/
  analytics: null
