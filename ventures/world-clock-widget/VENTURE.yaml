name: world-clock-widget
description: Local time, sunrise, sunset, daylight length and a waking-hours band for several world cities at once — as a free browser tool, and as an iPhone/iPad/Mac app and home-screen widget.

stage: prototype

owner: duncan

# Two surfaces over one tested core. The Swift target in Sources/ needs an
# Apple developer account to reach anybody, which is an owner action and has
# never been taken; the browser surface in site/ is downstream of neither an
# account nor a runner, so it is the one that actually reaches users today.
# site/solar.mjs is a direct port of Sources/WorldClockCore/SolarCalculator.swift
# and site/solar.test.mjs re-asserts that suite's own reference values, so the
# two cannot silently disagree about a sunrise.
product_lines:
  - id: web
    surface: site/index.html
    status: shipped
    note: Free browser tool. No account, no upload, no network request at all.
  - id: ios
    surface: Sources/WorldClockApp
    status: blocked-on-owner
    note: >-
      Needs an Apple Developer account and App Store Connect listing to reach
      anyone. Queued as an owner action; the code is complete and tested.

hypotheses:
  - claim: People who work or have family across time zones want a widget that's information-dense by default (time + sunrise/sunset for several cities), not a single minimalist clock face.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: People will pay for a "pro" tier (more cities, custom locations, lock-screen complications) once they're using the free widget daily.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 50
  protected: true

kill_criteria:
  - No one (including the owner) uses the widget daily 30 days after the first TestFlight build.
  - No paying customer after 90 days post-launch, if a paid tier ships.

links:
  production: https://duncan-haywood.github.io/oss-monorepo/world-clock-widget/
  analytics: null
