# XcodeGen project spec — run `xcodegen generate` to produce WorldClock.xcodeproj.
# See README.md for the full setup flow (signing, App Group, generating the project).
name: WorldClock
options:
  bundleIdPrefix: com.duncanhaywood.worldclock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad; iPad idiom is also what unlocks "Mac (Designed for iPad)"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  WorldClockCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/WorldClockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duncanhaywood.worldclock.core
        PRODUCT_NAME: WorldClockCore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  WorldClockCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WorldClockCoreTests
    dependencies:
      - target: WorldClockCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duncanhaywood.worldclock.core.tests
        GENERATE_INFOPLIST_FILE: YES

  WorldClockWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/WorldClockWidget
    dependencies:
      - target: WorldClockCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duncanhaywood.worldclock.widget
        PRODUCT_NAME: WorldClockWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/WorldClockWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/WorldClockWidget/WorldClockWidget.entitlements
    info:
      path: Sources/WorldClockWidget/Info.plist
      properties:
        CFBundleDisplayName: World Clock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/WorldClockWidget/WorldClockWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.duncanhaywood.worldclock

  WorldClockApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/WorldClockApp
    dependencies:
      - target: WorldClockCore
        embed: true
      - target: WorldClockWidgetExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duncanhaywood.worldclock
        PRODUCT_NAME: World Clock
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: World Clock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Sources/WorldClockApp/WorldClockApp.entitlements
    entitlements:
      path: Sources/WorldClockApp/WorldClockApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.duncanhaywood.worldclock
    resources:
      - path: Sources/WorldClockApp/Assets.xcassets

schemes:
  WorldClock:
    build:
      targets:
        WorldClockApp: all
        WorldClockWidgetExtension: all
        WorldClockCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WorldClockCoreTests
