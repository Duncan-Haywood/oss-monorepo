name: sports-official-game-fee-calculator
description: >-
  Free browser calculator for referees, umpires and other game officials: enter the fee, assignor cut, drive and season, and get
  pay per hour after the drive, what a doubleheader or tournament is worth, season take-home after self-employment tax, games
  needed for a take-home goal and the lowest fee worth driving for. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check scored the nearest venture at 0.26 (league-schedule-generator,
# a lexical false match); no venture models an official's per-hour pay after travel. mileage-deduction-calculator and
# gig-driver-net-pay-calculator cover drivers, not a fee-per-game worker with an assignor and multi-game trips.
#
# Why this niche: hundreds of thousands of part-time youth, high-school and adult-league officials are paid a flat fee per game
# as 1099 contractors. The decision they repeat weekly -- is this site worth the drive, and should I ask for the tournament --
# turns on pay per hour after mileage, which no assignor platform shows.
#
# First visitor: officials searching "referee pay calculator", "is refereeing worth it", "umpire mileage deduction"; r/Referees,
# r/baseball umpire threads and r/SoccerReferee threads about low fees and long drives. Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored. Page says it is not tax advice, lists what is not
# modelled (state tax, QBI, wage cap) and carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet into the contractor-tax cluster plus donations; sponsor/affiliate for
# officiating gear is a later, owner-approved step.

hypotheses:
  - claim: >-
      Officials will enter their own fee and distance into a no-signup tool to see pay per hour, because assignor platforms show
      the fee and the schedule but never what the drive leaves.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing the per-hour value of a second game on the same trip changes which tournaments and doubleheaders officials ask for.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Officials report that state tax and per-league fee schedules are the common reason the numbers feel wrong, at which point the tool should model them.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/sports-official-game-fee-calculator/
  analytics: null
