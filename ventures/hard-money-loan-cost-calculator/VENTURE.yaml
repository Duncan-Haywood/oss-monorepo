name: hard-money-loan-cost-calculator
description: >-
  Free browser tool for house flippers: compare two hard money lenders on interest charged only on drawn rehab money,
  points, flat and per-draw fees, minimum-interest clauses and extension fees, with each lender's effective annual rate,
  deal profit, return on cash, a late-flip table and the hold length where the cheaper lender changes. Nothing leaves
  the browser.
stage: prototype
owner: duncan

# Screened 2026-10-09 in a scheduled session. ventures/ has fix-and-flip-deal-analyzer, whose own FAQ says it leaves
# out draw fees, minimum-interest clauses and extension fees; rental-dscr-calculator and mortgage-points-break-even-
# calculator price long-term loans, not a short interest-only draw loan. No hard-money, bridge or draw-schedule tool.
#
# Why this niche: flippers choose between lenders on a quoted rate, then pay points on the rehab commitment, a fee per
# draw and sometimes six months of minimum interest on a three-month job. "Hard money loan calculator" is a steady
# search; incumbents are lender-side calculators that show one loan and want a lead form. A two-lender comparison with
# a crossover month is the thing a lender will not publish. Free tool is a lead magnet; a lender-referral path would need
# a disclosure and owner approval and is not built.
#
# First visitor: a flipper with two term sheets open, searching "hard money loan calculator" or "points vs rate hard
# money". Volume not measured.
#
# Liability boundary: arithmetic on typed terms; not lending, legal, tax or financial advice; nothing stored or sent.

hypotheses:
  - claim: >-
      Fix-and-flip investors will use a private two-lender comparison, because lender calculators show only one loan
      and headline rates hide points, draw fees and minimum interest.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that a figure disagrees with the same inputs done by hand.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/hard-money-loan-cost-calculator/
  analytics: null
