name: app-store-sales-report-analyzer
description: >-
  Free browser tool that turns an App Store Connect Summary Sales report into net
  proceeds by product, type of sale, country and month, refund rates, the share of
  the customer price the developer keeps, subscription units at the after-one-year
  rate, downloads against paid units and a Small Business Program check, with
  exchange rates the developer types for the payout currencies. The file is read
  locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. Independent iOS developers
# and small app studios live on proceeds per product and per country, and Sales
# and Trends shows charts and a per-day download, not a reconciled net-of-refunds
# view across payout currencies. The summary report holds units, per-unit proceeds,
# country, product type, customer price and proceeds reason per row, which is
# enough for all of it. Existing answers are spreadsheets and paid app-analytics
# products that ask for an App Store Connect API key.
#
# First visitor: r/iOSProgramming and indie-developer communities asking "how do I
# add up my App Store proceeds across currencies" and "am I in the small business
# program"; search phrases "app store connect sales report analysis", "app store
# proceeds by country", "app store small business program check". Volume not
# measured with an external tool.
#
# What makes it more than a total: every table reconciles to one net figure using
# rates the developer types (a currency with no rate is excluded and named, never
# guessed); refund rates are per product and need five sold units; the proceeds to
# customer price ratio compares only same-currency rows and is labelled as including
# tax, not as the commission rate; the Small Business Program hint fires only when
# the file has a proceeds-reason column and none of the paid sales carry it.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts no network calls), so the portfolio holds no
# developer or customer data.
#
# Path to revenue (payment rails stay off): lead magnet, with a tie-in to the
# Gumroad sales fee analyzer already published. A paid version, if usage appears,
# is a month-over-month report diff behind an env-var switch; not built.
#
# Liability: arithmetic on the user's file and stated assumptions, model and
# omissions stated on the page, no tax or financial advice, no warranty,
# independent-of-Apple clause.
#
# Unverified: column names, product type identifiers and the proceeds-reason wording
# are from memory of Apple's summary report and matched by alias; no real report was
# available, so the first user report of an unread file is the priority fix.

hypotheses:
  - claim: >-
      Independent iOS developers will run a no-login analysis of the sales report
      they already hold to see net proceeds by product and country, refunds and the
      Small Business Program signal before paying for an app-analytics tool.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing a refund-heavy product or a weak storefront leads at least one
      developer to change a paywall or regional price, which is the reason to return
      with each new report.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong figure, or a real report the tool cannot read, at which point the parser needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/app-store-sales-report-analyzer/
  analytics: null
