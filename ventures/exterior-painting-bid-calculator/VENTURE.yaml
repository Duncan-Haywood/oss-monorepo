name: exterior-painting-bid-calculator
description: A private browser calculator for exterior painting contractors that prices a two-coat repaint, scrape-and-prime, bare-wood, or elastomeric masonry job from extra stories, extra elevation square footage, extra trim, shutters, a scrape of failing paint, a primer coat, occupied-home protection, and hard second-story access — and shows the price per elevation square foot, the hours the first extra story actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent exterior painting contractors will use an elevation-and-story bid calculator because the generic $3,999 house special or $1.50/sqft-of-wall rule they are shopped on cannot see that a 1,800-square-foot one-story ranch with sound paint is a different job from a 2,800-square-foot two-story colonial with extra trim and hard access.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published house special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper ranch quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra stories, extra elevation, extra trim, scrape, primer, shutters, occupied-home protection, and hard access as their own hours, instead of a blended add-on to the special, changes the bid enough that shops notice which part of a high number is the first extra story.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified exterior painting contractors use the calculator twice within 90 days.
  - Shops report that splitting elevation, stories, and extras is more work than their existing special without changing the price they would have bid.
  - The starting hours and paint rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
