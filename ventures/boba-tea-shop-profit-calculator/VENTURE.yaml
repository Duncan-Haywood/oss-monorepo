name: boba-tea-shop-profit-calculator
description: >-
  Free browser tool for people opening or running a boba, bubble tea or specialty drink shop: enter price, topping attach, cup
  costs, delivery share, staff, rent, a loan and a ramp-up, and see profit per cup, monthly profit, break-even cups a day with the
  loan, the drink price that reaches a target margin, volume and ingredient-cost sensitivity, and a sixty-month ramp-up with the
  working-capital reserve and payback. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a scheduled new-venture session. Nearest in ventures/ are cafe-drink-margin-calculator (per-drink margin,
# no fixed costs, loan or ramp), shaved-ice-stand-profit-calculator (event stand, not a leased store) and coffee-roaster-margin-calculator.
# None models break-even cups a day with a lease and loan, delivery-app commission or ramp-up cash. Not in screened-out.md.
#
# First visitor: a would-be or new owner sizing a lease; search phrases "boba shop profit margin", "how many cups a day to break even
# bubble tea", "bubble tea shop business plan calculator". Volume not measured with an external tool.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. Saved scenarios and a multi-location
# comparison behind an env-var switch is the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with every rule visible on the page. No price, yield or market is claimed, sample
# figures are labelled made up, bad input is rejected instead of clamped, and the page carries the no-warranty and not-advice clauses.

hypotheses:
  - claim: >-
      A prospective or new drink-shop owner will enter price, cup costs, rent and loan before signing a lease, because the break-even
      cups a day with delivery commission and the ramp-up cash reserve are hard to see in a generic startup-cost article.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that the profit, break-even or payback arithmetic differs from the stated rules on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/boba-tea-shop-profit-calculator/
  analytics: null
