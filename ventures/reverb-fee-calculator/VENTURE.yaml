name: reverb-fee-calculator
description: A private browser calculator for Reverb sellers to see cash at list, cash on a buyer offer, whether that offer still beats the same sale on eBay, whether Reverb Safe Shipping still beats an own label after expected claims, and whether a shop consignment cut or cash offer still beats listing it themselves.
stage: prototype
owner: duncan
hypotheses:
  - claim: Musicians and gear sellers will return to a fast offer-versus-list calculator because Reverb inboxes fill with lowballs and the 5% marketplace fee hides the cash they leave on the table.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Comparing the same item to eBay's final-value fee is the decision they actually make, not a single Reverb profit number.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Sellers will return to see whether free shipping or local pickup still beats charging postage, because marketplace fee sits on the item and folding shipping into the list hides a cash leak.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Sellers who keep the typed list and click free shipping will use an absorb-the-label row because that path is not the same sale as folding postage into the item.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Sellers will return to see whether Reverb Safe Shipping still beats their own label, because the extra postage is a sure cost and the unprotected claim is a maybe.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Sellers will return to see whether a shop consignment cut or cash offer still beats listing it themselves, because a 30% shop cut hides how much Reverb list cash they leave.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Sellers will return to see whether a bump still pays, because a bump is cash out of this sale and only pays if it changes the price they take.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified Reverb sellers use the calculator twice within 90 days.
  - Users do not find at least one offer whose net differs materially from waiting for list or listing on eBay.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/reverb-fee-calculator/
  analytics: null
