name: payoneer-statement-to-journal
description: >-
  Free browser tool that turns a Payoneer (multi-currency account) balance statement into balanced accounting journals for
  Xero, QuickBooks Online and QuickBooks Desktop (IIF), valued in the currency the books are kept in. Rates are typed
  in by the user; each foreign balance is tracked at average cost, so money received, sent, spent on the card, paid as
  fees or converted is booked to its own account and the realised exchange gain or loss lands on its own line. The
  running balance is proved row by row (newest-first order is detected, fee rows are booked as fees, unfinished rows skipped), a typed
  closing balance is checked, conversions go to a clearing account that nets across balances, and a workings CSV shows
  rate, value, cost and gain per row. The statement is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06: wise-statement-to-journal covers Wise; no venture covers Payoneer, whose statement has a
# different shape (Credit and Debit columns, fees as their own rows, a Status column, Balance).
# Payoneer is the payout rail for marketplace sellers (Amazon, Upwork, Fiverr) and freelancers paid in USD/EUR/GBP.
# Commercial analogues: Xero's and QuickBooks' bank feeds + multi-currency modules, and per-month sync apps (Synder, A2X
# style); the no-account, no-upload, one-statement-at-a-time version with realised FX on its own line is the gap.
# Search phrases: "Payoneer to Xero", "Payoneer to QuickBooks journal", "Payoneer multi-currency accounting",
# "realised FX gain Payoneer". Volume not measured with an external tool.
#
# Who: agencies, freelancers and small exporters holding EUR/GBP/USD in Payoneer and bookkeepers serving them.
#
# Path to revenue (payment rails stay off): lead magnet. If usage appears, the paid layer is what a browser page cannot
# do: stored ECB daily rates, several currency accounts in one run with automatic clearing matches, FIFO/specific-lot
# cost, year-end unrealised revaluation, and a bookkeeper batch mode. Not built.
#
# Liability: arithmetic on the user's own file and typed rates; shows the checks it ran, states what it does not check,
# and carries the no-warranty, independent-of-Payoneer and financial-data clauses.
#
# Unverified: Payoneer column names are from memory of public help documents;
# the running balance proves each file rather than trusting the layout. Nothing ran against a real statement or live import.
# The first statement this misreads is the priority fix.

hypotheses:
  - claim: >-
      A freelancer or bookkeeper with a Payoneer foreign-currency balance will paste a statement into a no-upload page to
      get month-split journals with the realised FX booked, because the alternatives are ignoring FX or building a
      per-row cost spreadsheet.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted statement structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a statement this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

