kill_criteria:
  - >-
    No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - >-
    A materially better free tool covering the same "Vary: star" and
    "Cache-Control: public plus Set-Cookie" patterns with the same
    zero-install bar becomes the obvious default, such that this tool's
    differentiation (one command, plain-English report, shared
    classification core tested independently of the network layer) no
    longer holds.

