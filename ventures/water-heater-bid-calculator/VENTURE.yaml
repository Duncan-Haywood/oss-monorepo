name: water-heater-bid-calculator
description: A private browser calculator for plumbers and water-heater installers that prices a residential replacement from the tank or tankless type, the location, the vent, and the gas or electrical path — and shows the walk-away price plus how many times a typical 50-gallon electric garage swap this house really is.
stage: prototype
owner: duncan
hypotheses:
  - claim: Plumbers will use a water-heater bid calculator because the flat "$1,200 installed" number homeowners bring from a search result cannot see that an attic condensing tankless plus a 3/4-inch gas upsize is several times a 50-gallon electric garage swap, which is how a bid that looked like the last house turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the "times a typical 50-gallon electric garage swap" comparison are the two numbers an installer actually decides on when a homeowner asks them to match the search-result price, more than the installed total itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Flagging a tankless on an existing 1/2-inch gas line, an attic heater without a pan, and an electric tankless without panel work changes the bid materially, so making those required, explained outputs is what separates this from a generic job-costing spreadsheet.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified plumbers or water-heater installers use the calculator twice within 90 days.
  - Contractors report that entering heater type, vent, and gas path is more work than their existing method without changing the price they would have bid.
  - The starting hours or material dollars prove so far from real trucks that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/water-heater-bid-calculator/
  analytics: null
