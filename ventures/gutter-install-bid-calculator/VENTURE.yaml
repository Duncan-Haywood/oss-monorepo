name: gutter-install-bid-calculator
description: A private browser calculator for gutter shops that prices a new gutter hang from inside and outside miters, extra downspouts past the included first two, extra downspout footage past ten feet per drop, second-story hours, fascia repair, and tear-off — and shows the price per gutter foot, the hours the first two-story colonial actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent gutter shops will use a corners-and-drops bid calculator because the generic "$4.50 a foot installed" special they are shopped on cannot see that a 140-foot one-story ranch with two included downspouts is a different job from a 220-foot two-story colonial with six-inch trough, extra drops, inside miters, fascia, and tear-off.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-foot special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper gutter-install quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating miters, extra drops, stories, fascia, and tear-off as their own hours, instead of a blended add-on to a per-foot special, changes the bid enough that shops notice which part of a high number is the first inside miter.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified gutter shops use the calculator twice within 90 days.
  - Shops report that splitting corners, drops, and stories versus a ranch-only special is more work than their existing per-foot method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/gutter-install-bid-calculator/
  analytics: null
