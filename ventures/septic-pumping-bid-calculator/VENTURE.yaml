name: septic-pumping-bid-calculator
description: A private browser calculator for licensed septic pumpers that prices a tank pump from buried-lid locate-and-dig, hose beyond the included run, extra tanks, baffles, risers, inspection, dump tickets, and after-hours dispatch — and shows the price per gallon pumped, the hours the first buried lid actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent septic pumpers will use a lid-and-gallon bid calculator because the generic pump-special or dollars-per-gallon rules of thumb they are shopped on cannot see that a 1,000-gallon exposed-lid driveway stop is a different job from a two-tank buried system with a 150-foot hose, baffles, and an inspection.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published special) are the two figures a pumper actually decides on when a homeowner asks them to match a cheaper driveway quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra gallons, buried lids, hose feet, extra tanks, baffles, risers, and after-hours dispatch as their own hours, instead of a blended add-on to the special, changes the bid enough that shops notice which part of a high number is the first buried lid.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified septic pumpers use the calculator twice within 90 days.
  - Pumpers report that splitting lids, hose, and extra gallons is more work than their existing special without changing the price they would have bid.
  - The starting hours and dump rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
