name: siding-bid-calculator
description: A private browser calculator for siding contractors that prices a vinyl, fiber-cement, engineered-wood, or aluminum job from wall area, waste, openings, stories, and tear-off — labor hours, loaded wage, linear trim, dumpster, overhead, and margin — and shows the price per square, the effective hourly rate, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent siding contractors will use a squares-and-waste bid calculator because the flat price-per-square-foot specials they compete with cannot see that a two-story fiber-cement tear-off with gables is a different job from a one-story vinyl wrap, which is how a bid that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the effective hourly rate are the two numbers a contractor actually decides on when a homeowner asks them to match a neighborhood special, more than the job price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Waste, linear trim, and payroll burden are the three costs most often left out of a small siding crew's own quote, so making all three required, explained inputs changes the resulting bid materially.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified siding contractors use the calculator twice within 90 days.
  - Contractors report that the squares-and-waste model is more work than their existing method without changing the price they would have bid.
  - The starting hours prove so far from real crews that the tool cannot be used without data we have no way to gather.
