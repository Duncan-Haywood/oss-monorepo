name: pwa-installability-check
description: >-
  A free CLI (+ a browser report viewer) for web developers: fetches a page,
  its linked Web App Manifest, and every icon that manifest lists, then
  classifies the result against Chrome's documented installability criteria
  -- manifest present and parseable, name/short_name, an installable display
  mode, a secure origin, and a reachable 192x192-or-larger icon, plus notices
  for a missing 512x512 icon, start_url, or theme/background color. The same
  checks Lighthouse's installable-manifest audit runs, with no Chrome or
  Puppeteer dependency. The browser page can only render a pasted report,
  never fetch a third-party URL on its own, because that would be a
  cross-origin request almost no target site opts into via CORS headers.
stage: prototype
owner: duncan

hypotheses:
  - claim: >-
      A web developer debugging "Add to Home Screen" not appearing, or a
      developer who wants a CI gate on manifest installability without
      installing Chrome/Puppeteer/Lighthouse CI, will search the exact
      terminology ("pwa not installable", "add to home screen not showing",
      "manifest display browser not installable", "lighthouse installable
      manifest check cli") and find this tool, since the canonical way to
      run this exact check today requires a full Lighthouse/Chrome
      installation.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      r/webdev, r/PWA (small but active), the web.dev/Lighthouse GitHub issue
      tracker, and Stack Overflow's "progressive-web-apps" and
      "web-app-manifest" tags carry real, recurring questions about exactly
      this failure mode -- a manifest that looks right but Chrome still won't
      offer to install the page -- because the criteria (display defaulting
      to "browser", icon size, secure origin) are scattered across
      documentation rather than in one checklist a developer can run.
    status: untested
    checked: null
    evidence: in-repo
  - claim: >-
      A developer or team that gets a clean report will wire the CLI into
      their own CI as a regression gate against a manifest edit or an icon
      asset that silently stops resolving, producing return usage without
      any action from this portfolio.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - Chrome/Lighthouse ships a standalone, zero-dependency CLI for this exact
    check (Lighthouse CI still requires a Chrome binary as of this writing),
    such that this tool's differentiation (no browser dependency, plain-
    English report, shared classification core tested independently of the
    network layer) no longer holds.

