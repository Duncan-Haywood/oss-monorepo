channel_notes: >-
  Named first-visitor channels: JWTs are used by nearly every modern web and
  mobile authentication system (OAuth2/OIDC access tokens, session tokens,
  API tokens), so the developer audience that searches "jwt decoder", "jwt
  debugger", "jwt security checklist", "alg none vulnerability", "jwt
  algorithm confusion", and "is my jwt secure" is orders of magnitude larger
  than a niche AI-agent-tooling audience -- this is a mainstream web/mobile
  security topic, not a narrow one. Organic search for those terms, plus
  r/netsec, r/webdev, and general AppSec/OWASp-adjacent communities where the
  JWT Cheat Sheet and RFC 8725 are already commonly cited reference material.
  Stack Overflow's own "jwt" tag is one of the most active auth-related tags
  on the site, a channel with demonstrable, sustained search volume rather
  than an inferred one. The mcp-config-risk-check and hidden-unicode-check
  footer cross-links are themselves a secondary channel: a visitor arriving
  at either for a paste-and-check structural security tool is a plausible
  visitor for this one too, and vice versa (reciprocal links added the same
  commit).
