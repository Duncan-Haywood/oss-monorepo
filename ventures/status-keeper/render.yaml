# One-click self-deploy: https://render.com/deploy?repo=<your fork URL>
# Render builds the Dockerfile in YOUR account; nothing runs on the author's.
# Host it on a different provider from what it watches, or it goes down with it.
services:
  - type: web
    name: status-keeper
    runtime: docker
    dockerContext: ventures/status-keeper
    dockerfilePath: ventures/status-keeper/Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: STATE
        value: /data/state.json
      - key: ADMIN_KEY
        generateValue: true
      - key: MONITORS_JSON
        sync: false
      - key: TITLE
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
