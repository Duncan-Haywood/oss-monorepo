# Any box with Docker:
#   ADMIN_KEY=$(openssl rand -hex 16) MONITORS_JSON='...' docker compose up -d
# Put it behind HTTPS (Caddy, nginx, a tunnel) before real use.
services:
  status-keeper:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      MONITORS_JSON: ${MONITORS_JSON:?set MONITORS_JSON}
      STATE: /data/state.json
      TITLE: ${TITLE:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
volumes:
  state:
