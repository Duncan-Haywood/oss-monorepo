name: shopify-payout-to-journal
description: >-
  Free browser tool that turns a Shopify Payments payout transactions export into balanced accounting
  journals for Xero, QuickBooks Online and QuickBooks Desktop (IIF). It proves the transactions add up to
  the payout (from a payout row, or a deposit typed in from the bank), books gross order payments, Shopify
  fees, refunds, chargebacks and shipping-label purchases separately instead of the net deposit, splits a
  payout that straddles a month end into one journal per month, and balances each to a Shopify clearing
  account. Rows no rule recognises are journalled to an uncategorised account rather than dropped. The
  export is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05. The commercial analogue is A2X (payout-to-journal sync for Shopify, Amazon, Etsy and
# others, sold per month to merchants and their bookkeepers) plus Shopify's own accounting app integrations;
# this is the no-account, no-upload, one-payout-at-a-time version. Sibling of stripe-payout-to-journal,
# paypal-activity-to-journal and amazon-settlement-to-journal, same engine, different export. Shopify is the
# largest of the four seller populations and the portfolio already had Shopify fee and payout profit
# analysers, but nothing that produces the journal an accountant actually posts.
# Search phrases: "Shopify payout to Xero", "Shopify payout to QuickBooks", "Shopify payout journal entry",
# "reconcile Shopify payouts", "Shopify Payments accounting entry", "Shopify clearing account".
# Volume not measured with an external tool.
#
# Who: store owners who keep their own books and the bookkeepers serving several stores, who today book the
# net deposit as income (wrong: fees, refunds, chargebacks and shipping labels are hidden, and a payout
# across a month end lands in the wrong month) or pay a monthly sync fee.
#
# Path to revenue (payment rails stay off): lead magnet for the store-owner and bookkeeper audience. If usage
# appears, the paid version is what a browser page cannot do: batch many payouts, remember the account
# mapping per client, pull exports on a schedule (behind an env-var switch), split sales tax and shipping
# income out of the order payment using the orders export, and add Etsy and Square payouts. Not built.
#
# Liability: it writes a journal from the user's own export, shows the check it ran, states what it does not
# check (tax split, revenue recognition), and carries the no-warranty, independent-of-Shopify and financial-
# data clauses.
#
# Unverified: the column names and Type values of the Shopify Payments transactions export, and the Xero,
# QuickBooks Online and IIF import layouts, are from memory of public help documents; nothing ran against a
# real Shopify export or a live import. The first export this misreads, or a journal an importer refuses, is
# the priority fix.

hypotheses:
  - claim: >-
      A Shopify merchant or their bookkeeper will paste a payout transactions export into a no-upload page to get a
      month-split journal, because the alternatives are booking the net deposit (hiding fees, refunds and
      disputes) or paying a monthly sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a payout this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

