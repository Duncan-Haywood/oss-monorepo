name: csshound
description: Free, source available (FSL-1.1-MIT) unused-CSS finder written in Rust. Reads every HTML page under a folder and lists the CSS rules each page never uses, by PurgeCSS's selector rules, following the page's local scripts and their imports. One engine runs as a native CLI (a CI gate with --fail) and, compiled to WebAssembly, in a browser page that uploads nothing. On this repository's 3,915 venture pages it ran in 0.5 s and found 8,815 unused rules, 8.0% of 8.1 MB of CSS (BENCHMARK.md).
stage: prototype

owner: duncan

# Third tool of the "dev tools in Rust, common and niche" direction the owner
# set on 2026-10-29 (prompts/goals.md), chosen in an explore run. Screened with
# `python3 portfolio/pipeline/duplicate_check.py "unused css selector finder
# purgecss dead css rust"`: top score 0.11 (agent-workroom, unrelated); nothing
# in the portfolio finds unused CSS. crates.io has css-purify 0.0.15, a
# purifycss-style crate; no Rust port of PurgeCSS's rules was found.
# Measured against PurgeCSS 9.1.0 on 2026-11-16: same 15,632 rejected
# selectors on 3,923 pages, no difference (BENCHMARK.md).
hypotheses:
  - claim: >-
      A developer with a multi-page static site, or a docs site of many
      generated pages, will use csshound to find the CSS each page carries but
      never uses, because PurgeCSS works per bundle and needs a config.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      A team will run `csshound --fail` in CI on the pages they own, because
      at under a second for thousands of pages it costs nothing per commit.
    status: untested
    checked: null
    evidence: customer-contact

