# Any box with Docker:
#   ADMIN_KEY=$(openssl rand -hex 16) BASE_URL=https://mail.example.com docker compose up -d
services:
  drip-keeper:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data", "./examples:/examples:ro"]
    environment:
      STATE: /data/state.json
      SEQUENCES_FILE: /examples/sequences.json
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      BASE_URL: ${BASE_URL:?set BASE_URL}
      PRODUCT_NAME: ${PRODUCT_NAME:-}
      POSTAL_ADDRESS: ${POSTAL_ADDRESS:-}
      DRY_RUN: ${DRY_RUN:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
volumes:
  state:
