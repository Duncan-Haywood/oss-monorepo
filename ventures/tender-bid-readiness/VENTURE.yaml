name: tender-bid-readiness
description: Free local-first tender bid readiness checker for small contractors. Paste a solicitation and get an evidence-linked checklist of deadlines, bonds, insurance, certifications, and submission instructions before spending hours on a bid.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small contractors will use a fast local checklist to decide whether a public tender is worth pursuing before assembling a full bid.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Tender readiness searches are distinct from bid-price calculators because the painful first decision is qualification and paperwork, not arithmetic.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: check.mjs's signals cover every readiness category the venture's own guide page (should-i-bid-on-this-tender.html) tells a bidder to verify.
    status: supported
    checked: 2026-09-01
    evidence: in-repo
    note: >-
      The guide page's own checklist names a mandatory pre-bid meeting or
      site visit as something that can silently disqualify a bid ("a
      mandatory pre-bid visit that has already taken place cannot be
      recovered"), but check.mjs had no signal for it -- a solicitation
      with a mandatory site visit could score 100% readiness while that
      requirement went undetected. Added a dedicated site-visit signal
      (mandatory pre-bid meeting/conference, or a plain "site visit"
      mention) alongside the existing six, and updated the FAQ copy and
      its matching JSON-LD from "six" to "seven" in index.html. Verified
      with node --test in this venture (4/4, 1 new, covering both the
      "mandatory pre-bid meeting" and "site visit is mandatory" phrasings
      and the negative case).
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - No repeat use or organic repository traffic after 60 days of public availability.
  - Users report that the extracted checklist misses more time than it saves.
links:
  production: null
  analytics: null
