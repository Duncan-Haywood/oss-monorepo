  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - Firebase changes the Realtime Database or Firestore REST API's CORS
    policy or default authorization model such that this exact client-side
    check no longer works, and no equivalent read-only introspection route
    replaces it -- at which point the check would need server-side
    infrastructure this portfolio does not run, changing its cost and
    liability profile.

