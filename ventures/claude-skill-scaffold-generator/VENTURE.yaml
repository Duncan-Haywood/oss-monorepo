name: claude-skill-scaffold-generator
description: >-
  Free browser tool that turns a plain-language description of a Claude
  Agent Skill -- what it does, when Claude should use it, and any scripts,
  references, or assets it bundles -- into a starter SKILL.md with valid
  YAML frontmatter and a suggested folder layout. Flags the common
  authoring mistakes that keep a skill from ever triggering: a name that
  isn't a clean slug, a description written in the first person instead of
  third, a missing trigger condition, and a name/description outside the
  practical length this tool documents. No network call, no LLM call -- the
  frontmatter and body are assembled from the typed fields by a fixed
  template.
stage: prototype

owner: duncan

# Shape and gates (run 2026-09-24)
#
# Niche sourced by this session, not from a pipeline candidate list, per
# portfolio/pipeline/README.md's "screening is done" instruction and
# DIRECTION.md's standing invitation to graduate a genuinely new niche
# when one clears the bars below. Same distinguishing-context argument as
# this session's sibling AI-agent-tooling ventures (hidden-unicode-check,
# mcp-config-risk-check, skill-manifest-check, claude-code-settings-check,
# all graduated 2026-09-24): this session is Claude Code itself, giving
# it unusually direct and current knowledge of the exact format this tool
# generates -- SKILL.md's YAML frontmatter shape, and the practical
# reasons a skill fails to trigger (a vague or first-person description
# with no concrete trigger condition).
#
# This is the *generator* half of a pair skill-manifest-check already
# started as the *checker* half (skill-manifest-check validates an
# existing SKILL.md; this tool produces a starting one). PRODUCT_PLAYBOOK.md
# section 1 explicitly ranks a generator alongside a checker/CLI above a
# browser calculator on cost and novelty grounds; this is the first
# generator-shaped AI-agent-tooling venture in this cluster, not a fifth
# instance of the checker shape.
#
# duplicate_check.py (run before building) against "Claude Agent Skill
# scaffold generator: enter a skill's purpose, trigger conditions (when
# Claude should use it), and any scripts/references/assets it bundles,
# and get a starter SKILL.md with valid YAML frontmatter plus a suggested
# folder layout, checked for common authoring mistakes (first-person
# description, missing trigger wording, non-slug name, oversized
# name/description)":
#
#   score  source                    label
#    0.25  venture                   skill-manifest-check
#    0.08  venture                   k8s-resource-limits-check
#    0.08  venture                   graphql-introspection-exposure-check
#    0.07  venture                   hidden-unicode-check
#    0.07  pipeline candidate        sitemap-lastmod-freshness-check
#    0.06  venture                   oidc-trust-policy-check
#    0.06  venture                   subdomain-takeover-check
#    0.05  venture                   security-txt-check
#    0.05  venture                   wordpress-plugin-review-check
#    0.05  venture                   source-map-leak-check
#
# Nothing scored >= 0.45 (the review bar). Read the top hit anyway per the
# tool's own instruction: skill-manifest-check (0.25) checks an existing
# SKILL.md's frontmatter for trigger-reliability problems after it's
# written; this tool produces the first draft of that same file before it
# exists. Different direction of the same authoring workflow, not the
# same object -- and each links to the other in its footer as the
# complementary tool, the same reciprocal-cross-link pattern the other
# three AI-agent-tooling siblings already use.
# Also checked git log --oneline -30 origin/main and open PRs
# (mcp__github__search_pull_requests, "skill scaffold generator SKILL.md")
# for this niche: zero venture-directory or open-PR hits. No open PR or
# recent merge builds this.
#
# LIABILITY CONTAINMENT: every check and every generated byte is
# deterministic template assembly against text the user types -- no
# network call of any kind, no call to an LLM, and no claim that the
# generated skill will actually be loaded or invoked correctly by Claude
# at runtime. The two checks with any time-dependence (the practical
# name/description length limits) are dated against this tool's own
# documented reference and framed as a caution ("commonly documented as
# of [date] -- verify against Anthropic's current skill-authoring
# reference"), never as an authoritative, exhaustive claim on Anthropic's
# behalf -- the same discipline claude-code-settings-check,
# mcp-config-risk-check, and skill-manifest-check already use for their
# own dated thresholds. The UI/README/footer all say plainly that the
# tool is "template-generated, not model-verified" and that a clean
# result is not a guarantee of runtime behaviour.
#
# Bring-your-own-data compliance: the tool asserts nothing about a live,
# time-varying vendor fact -- it assembles text from exactly the fields
# the user types, the same discipline every generator/checker venture in
# this portfolio uses.
#
# ETHICAL ROBUSTNESS: strictly beneficial as it scales -- it exists only
# to help a Claude Skill author start from a correctly-shaped file and
# catch the description mistakes that silently cost them a debugging
# session, with no adverse incentive on our side (no affiliate link, no
# referral fee, donations-only same as the rest of the portfolio). It
# does not scan, fingerprint, or contact any third-party system or agent
# runtime -- it only reads the fields typed directly into the page.
#
# JUDGMENT CALLS flagged for review:
#  - The name/description length limits (NAME_MAX_CHARS, DESCRIPTION_MAX_
#    CHARS, DESCRIPTION_MIN_CHARS in calc.mjs) are this tool's own
#    documented reference, not fetched from or verified against
#    Anthropic's live documentation at generation time -- they can go
#    stale if Anthropic changes the practical limits, which is exactly
#    why every finding against them is worded as a caution rather than an
#    error. Dated explicitly (SKILL_LIMITS_AS_OF) so a future session can
#    tell at a glance whether the constants need updating.
#  - The first-person-description check is a heuristic (a regex over the
#    opening words), not a semantic judgment -- it can miss a first-person
#    opening phrased unusually, and it can flag a legitimate "I" appearing
#    mid-sentence only if that sentence happens to start with it. It is
#    framed as a caution to reread, not a hard block on generating the
#    file.
#  - The generated SKILL.md body is always a placeholder naming the
#    bundled files, never an attempt to write the skill's actual
#    instructions -- doing that well would require exactly the kind of
#    task-specific judgment this deterministic tool deliberately does not
#    attempt, per PRODUCT_PLAYBOOK.md 4's "traditional software first."
hypotheses:
  - claim: A developer who has decided to build a new Claude Agent Skill wants a correctly-shaped starter SKILL.md (valid YAML frontmatter, a sensible folder layout for the files they already know they'll bundle) rather than hand-copying a sibling skill's frontmatter and editing it, and currently gets the shape wrong often enough that skill-manifest-check exists to catch it after the fact.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Flagging a first-person or trigger-less description at generation time -- before the author has written anything else -- prevents more silently-unloaded skills than catching the same mistake later with skill-manifest-check, because the author is still in the frame of mind to fix the one field that matters most.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, and structurally so: every check and every generated byte is
  # client-side, nothing is uploaded, and there is no server of ours in
  # the loop. Serving one more visitor costs a static file.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct visitors generate a SKILL.md and copy it within 90 days.
  - The generated frontmatter or folder layout is wrong for a real skill a user builds from it, and cannot be fixed by tightening the template.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/claude-skill-scaffold-generator/
  analytics: null

channel_notes: >-
  Named first-visitor channels: r/ClaudeAI and r/LocalLLaMA agent-tooling
  threads (where "my skill isn't triggering" and "how do I structure a
  SKILL.md" are recurring, currently-active questions), Anthropic's own
  developer community/Discord, GitHub topic/code search for repositories
  committing a SKILL.md or a .claude/skills/ directory, HN Show threads
  about Claude Code / Agent Skills tooling, and organic search for "claude
  skill md template", "how to write a claude agent skill", and "skill.md
  frontmatter generator". The hidden-unicode-check, mcp-config-risk-check,
  skill-manifest-check, and claude-code-settings-check footer cross-links
  are themselves a channel: a visitor arriving at any AI-agent-tooling
  tool in this cluster is a plausible visitor for the others, and this
  tool links reciprocally with skill-manifest-check, claude-code-settings-
  check, and mcp-config-risk-check from its first commit.
