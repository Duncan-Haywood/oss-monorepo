# One-click self-deploy: https://render.com/deploy?repo=<your fork URL>
# Render builds the Dockerfile in YOUR account; nothing runs on the author's.
# The key you paste needs Invoices: read and Credit notes: read, nothing else. This server never writes to Stripe.
services:
  - type: web
    name: rev-rec
    runtime: docker
    dockerContext: ventures/rev-rec
    dockerfilePath: ventures/rev-rec/Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: STATE
        value: /data/state.json
      - key: ADMIN_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: CURRENCY
        sync: false
