name: stripe-churn-cohort-analyzer
description: >-
  Free browser tool that turns a Stripe subscriptions CSV export into an MRR
  waterfall, monthly logo and revenue churn, a cohort retention table and
  plain-language findings (early-life churn, rising churn, concentration, plan
  gaps). The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session, deliberately NOT another
# arithmetic calculator: the input is the user's own data file, so the value is
# the analysis a paid vendor (ChartMogul, ProfitWell/Paddle, Baremetrics) does,
# minus giving that vendor read access to billing. duplicate_check.py top
# score 0.22 (saas-annual-plan-discount-calculator); mrr-waterfall-calculator
# takes hand-typed totals, this one derives the waterfall and cohorts from rows.
#
# First visitor: indie-hacker and micro-SaaS founders on r/SaaS, r/microsaas,
# Indie Hackers and X asking "how do I see churn/cohorts from Stripe without a
# paid tool"; search phrases "stripe cohort analysis csv", "calculate churn
# from stripe export". Volume not measured with an external tool.
#
# Privacy is the differentiator and the liability boundary: the file never
# leaves the browser (a test asserts the page has no network calls), so the
# portfolio holds no customer data.
#
# Liability: arithmetic on the user's file, stated model and omissions on the
# page, no advice, no warranty.

hypotheses:
  - claim: >-
      Founders who want churn and cohort retention from Stripe will prefer a
      no-signup, no-API-key tool that reads an exported CSV locally over
      connecting a third-party analytics product to their billing account.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      The early-life-churn and plan-gap findings change what a founder works on
      first, which is the reason to return after each monthly export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong MRR or churn figure from a real Stripe export, at which point the parser or model needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/stripe-churn-cohort-analyzer/
  analytics: null
