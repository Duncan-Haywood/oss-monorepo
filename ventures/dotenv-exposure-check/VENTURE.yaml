  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - Hosting platforms and frameworks converge on never reading a project-root
    dotenv file in production by default (several already push toward
    platform-native environment variable injection instead), at which point
    this check would be validating a misconfiguration that can no longer
    happen by default on those platforms rather than one many self-managed
    deployments still ship.

