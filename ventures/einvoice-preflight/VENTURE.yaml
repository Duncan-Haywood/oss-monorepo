name: einvoice-preflight
description: A local checker for UBL 2.1 and UN/CEFACT CII e-invoices that catches arithmetic and structural defects, with EN 16931 rule references, before a bookkeeper submits.
stage: alpha
owner: duncan
hypotheses:
  - claim: Bookkeepers and ERP integrators will use a fast local preflight to catch invoice defects before submission.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Reading the UBL/CII file the ERP already emits, rather than a bespoke JSON shape, is what makes the tool reachable at all.
    status: untested
    checked: null
    evidence: usage-counter
  - claim: Explainable rule IDs and downloadable JSON are useful enough for repeated integration checks.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: EUR
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified bookkeepers or integrators run the checker twice within 90 days.
  - Users do not report catching a defect before submission within 90 days.
links:
  production: null
  analytics: null
