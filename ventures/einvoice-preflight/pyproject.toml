[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "einvoice-preflight"
version = "0.1.0"
description = "Local, explainable preflight checks for structured e-invoice JSON"
requires-python = ">=3.10"

[project.scripts]
einvoice-preflight = "einvoice_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
