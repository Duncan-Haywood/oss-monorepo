[project]
name = "igmp"
version = "0.1.0"
description = "Turn an organised photo/video library into edited Instagram photos and 15-second reels, with Claude making the judgment calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.70",
    "librosa>=0.10",       # music: beat, tempo and character analysis (local, cached)
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2.7",
    "rawpy>=0.21",
    "scipy>=1.11",         # astro: star detection and matching (astro_core)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Apple Vision on-device signals (aesthetics, faces, labels, feature prints): macOS 15+ only
mac = [
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]
# phone-GPS matching: the Apple Photos library as a track (macOS) and offline reverse geocoding
geo = [
    "osxphotos>=0.70; sys_platform == 'darwin'",
    "reverse_geocoder>=1.5",
]

[project.scripts]
igmp = "igmp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
