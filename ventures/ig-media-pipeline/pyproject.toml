[project]
name = "igmp"
version = "0.1.0"
description = "Turn an organised photo/video library into edited Instagram photos and 15-second reels, with Claude making the judgment calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.70",
    "numpy>=1.26",
    "pillow>=10",
    "pydantic>=2.7",
    "rawpy>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
igmp = "igmp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
