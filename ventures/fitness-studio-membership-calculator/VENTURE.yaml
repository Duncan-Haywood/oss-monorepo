name: fitness-studio-membership-calculator
description: >-
  Free browser tool for boutique fitness studio owners (gym, yoga, pilates, CrossFit, cycling): enter members, price, churn,
  joins, marketing spend and costs, and get member lifetime value, CAC and payback, where the member count settles, break-even
  members, class-capacity utilization, a month-by-month projection and what a point of churn or $10 of price is worth.
  Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-09 in a scheduled session. duplicate_check.py: saas-cac-payback-calculator (0.34, software not studios),
# personal-trainer-package-pricing-calculator (0.19, one trainer's packages), car-wash-membership-calculator (0.31, a different
# membership business). boutique-fitness-studio-pricing-planner exists but prices unlimited vs class packs and breakage; it has no
# churn, lifetime value, CAC, payback or steady-state member model. This one is the retention/acquisition side of the same owner.
#
# Why this niche: boutique studios live on recurring revenue and churn. Owners watch Mindbody/Glofox/Mariana Tek dashboards that
# report members and revenue but not lifetime value or what a churn point is worth. Real money: a 1-point churn change is worth
# thousands a month at 200 members. Paying customers for adjacent software already exist.
#
# First visitor: searches "gym membership lifetime value calculator", "boutique fitness churn rate", "yoga studio break even members",
# "how many members to break even gym"; r/gymowners, r/yogateachers. Volume not measured.
#
# Liability boundary: arithmetic on typed numbers; placeholder values labelled as such; "Not decided" section; no-advice footer.
# Nothing stored or sent.
#
# Path to revenue (payment rails stay off): lead magnet and donations. Natural front end for a paid studio-CSV (Mindbody, Glofox,
# Zen Planner export) cohort-retention analyzer -- needs an owner decision on payment.

hypotheses:
  - claim: >-
      Studio owners will type their member numbers into a free tool to see lifetime value and what churn costs them.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a modelling error that changes whether their studio looks profitable on their numbers.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/fitness-studio-membership-calculator/
  analytics: null
