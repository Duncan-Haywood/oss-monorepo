  - claim: >-
      A developer who gets a clean report from the CLI will wire it into
      their own release checklist or CI as a pre-submission gate, producing
      return usage without any action from this portfolio.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Google Play's 2026-08-31 target API level enforcement deadline drives
      an Android developer to search a phrase this tool's target API level
      checker ranks for ("targetsdkversion deadline", "google play target
      api level requirement"), since no existing free tool in this
      portfolio or elsewhere reads a project's declared targetSdkVersion
      against the published per-form-factor floor.
    status: untested
    checked: null
    evidence: customer-contact

