name: android-data-safety-check
description: >-
  Free, browser-local and CLI checker for Android developers: scans an
  AndroidManifest.xml's permissions and a project's Gradle dependencies for
  known analytics/ads/crash SDKs (Firebase, AdMob, Facebook, and others),
  maps each one to a Google Play Data safety category (Location, Contacts,
  Photos and videos, App activity, Device or other IDs, and ten more), and
  cross-checks the result against a plain list of the categories the
  developer says they've already declared in Play Console's App content >
  Data safety form -- naming the exact permission or SDK, file, and line
  behind a category the app looks like it collects but the declaration
  doesn't mention. A reference cross-check against a fixed mapping table,
  never a determination that Play Console will accept a submission -- not
  advice-of-record, no compliance warranty, and it says so on every page.

  Second tool, added 2026-09-23, same buyer and delivery folder: a target
  API level checker (`target-sdk-check.mjs` / `target-api-level.html`) reads
  a project's declared `targetSdkVersion` and checks it against Google
  Play's separate target API level enforcement requirement (a different
  Play Console gate than Data safety) for the app's form factor, naming the
  file/line found and the days remaining to Google's published enforcement
  and extension deadlines.
stage: prototype
owner: duncan

# Second tool added 2026-09-23 (target-sdk-check.mjs / target-api-level.html):
# a genuinely different Play Console gate from Data safety -- Google Play's
# target API level enforcement requirement, which restricts an app update
# from reaching devices on newer Android versions once its declared
# targetSdkVersion falls too far behind a published per-form-factor floor.
# Added as a second tool inside this venture rather than a new `ventures/`
# directory per portfolio/pipeline/README.md rule 3 ("a candidate that fits
# an existing venture is a product line first"): same buyer (an Android
# developer preparing a Google Play submission/update), same delivery
# mechanism (point it at the project's AndroidManifest.xml/Gradle files),
# same CLI-and-browser-checker shape, same usage counter and license.
#
# grep -ril "targetsdkversion\|target api level\|target sdk" ventures/
# portfolio/ turned up nothing before this change -- no existing venture or
# pipeline candidate reads this gate. duplicate_check.py against the
# one-line description scored every venture, screened-out row,
# ai-first-markets idea, and pipeline candidate at or below 0.26 (closest:
# this venture's own pre-change description, sharing only "Android" and
# "Play Store" -- a different Play Console mechanism entirely: an
# enforcement deadline restricting visibility to new users on newer OS
# versions, not a Data safety declaration mismatch).
#
# Deadline data (target-sdk-scan.mjs's TARGET_API_REQUIREMENT/FORM_FACTORS)
# is reproduced from Google's own "Meet Google Play's target API level
# requirement" page (developer.android.com/google/play/requirements/
# target-sdk) as fetched 2026-09-23, dated in the source and on every page
# that shows it, with an explicit "re-check the live page" caveat -- the
# same disclosed-staleness pattern as the Data safety checker's SDK mapping
# table above.
#
# Distribution channel: the same one already established for this venture
# (r/androiddev, Stack Overflow's `android` tag) plus the deadline itself --
# the 2026-08-31 primary date (already passed as of this change, with a
# 2026-11-01 extension window still open) is a recurring, high-search-intent
# event every Android developer with a live app must act on, unlike most of
# this portfolio's evergreen checkers. Organic search terms with plausible
# recurring volume: "google play target api level requirement",
# "targetsdkversion deadline", "play console target api 35". No external
# search-volume tool was queried to confirm magnitude, matching this
# venture's own standing caveat.

# CLI/checker archetype, chosen deliberately per portfolio/pipeline/README.md's
# "archetype itself" section (2026-09-07, widened 2026-09-11 for the
# -check/-checker shape specifically): this is the same "read a manifest you
# already have, name the exact undeclared/unused entry" shape as
# ios-privacy-manifest-check and chrome-extension-permission-check, but for a
# genuinely different platform review gate that neither of those two, nor any
# other venture, reads at all -- Google Play's Data safety declaration against
# AndroidManifest.xml permissions and Gradle SDK dependencies. It is the
# direct Android-side counterpart the iOS venture's own README already
# gestures at (a sibling checker "for a different supply chain"), closing the
# obvious remaining gap in that pair rather than opening a new one.
#
# duplicate_check.py, run against this description before VENTURE.yaml
# existed, scored every other venture, screened-out row, ai-first-markets
# idea, and pipeline candidate at or below 0.13 -- nowhere near the 0.45
# read-this-first bar (re-run after graduation naturally scores 1.00 against
# this venture's own now-committed description; the pre-graduation reading
# is the one that matters). Closest by score: chrome-extension-permission-check
# (0.13, shares only the "manifest permissions vs detected API usage" shape,
# a different store and a different declaration mechanism entirely --
# Play Console's Data safety form vs. a manifest.json's permissions list),
# ios-privacy-manifest-check and obsidian-plugin-review-check (0.12, the iOS
# App Store side of the same "catch it before the store does" idea, not the
# Android side, and pure lexical overlap on "review check" respectively),
# wordpress-plugin-review-check and app-store-screenshot-check (0.09). A
# hand grep of every VENTURE.yaml and screened-out.md for "android", "play
# console", "data safety", and "google play" turned up nothing already
# covering this.
#
# Liability is scored conservatively for a different reason than the
# statutory-damages cases elsewhere in this pipeline: Google's Data safety
# taxonomy and a given SDK's actual collected data can both change without
# notice, and the worst case of relying on a stale reading here is a wrong
# Play Console declaration -- app suspension exposure, not a lawsuit against
# the user. The mitigation is the same disclosure pattern as
# ios-privacy-manifest-check: every page states this is pattern-matching
# against known symbols, not a determination; the permission/SDK list is
# dated and stated as reproduced from public documentation as of 2026-09; an
# unrecognised permission or SDK is silently *not* flagged rather than
# guessed at (documented in the README as "silence is a gap in this list,
# not a clean bill of health"); and the tool never picks a collection
# purpose or sharing status on the developer's behalf -- only the developer
# knows the real answer to those questions.
#
# Distribution channel, named rather than assumed: r/androiddev (one of
# Reddit's largest active developer subreddits) and Stack Overflow's
# `android` + `google-play-console` tags carry frequent, recurring threads
# about Play Console Data safety mismatches and the resulting policy
# warnings or listing suspensions -- a long-documented pain point since the
# section became mandatory. Organic search terms with plausible recurring
# volume: "google play data safety rejected", "data safety section
# mismatch", "play console policy warning data safety". No external
# search-volume tool was queried to confirm magnitude, matching this
# pipeline's standing caveat for every checker at graduation.
