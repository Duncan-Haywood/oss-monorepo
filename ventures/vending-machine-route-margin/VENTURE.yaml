name: vending-machine-route-margin
description: Free browser calculator for independent vending-machine route operators to find real profit per location after commission, card fees, shrink, drive time, and machine cost, then check a location list against a monthly income goal.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent vending-machine route operators will use a per-location profit calculator that nets out commission, card fees, and shrink, since judging a location by gross sales alone hides which stops are actually unprofitable.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Searchers asking how to price vending machine locations or calculate vending route profit are underserved by generic markup calculators because commission splits, shrink, and machine amortization change the real economics.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Operators who price one location will also want to see whether their whole route clears a monthly income goal, not just whether one stop clears a margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 5
  protected: true
kill_criteria:
  - No repeat usage or organic traffic within 60 days of a public URL.
  - No unsolicited feedback, star, fork, or referral within 90 days of publishing.
links:
  production: null
  analytics: null
