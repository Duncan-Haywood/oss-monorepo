# The real, live config for the agent runner — deployed to
# /srv/agents/config/repos.yml by the agent_runner Ansible role on every
# run. This IS the source of truth now (not something you SSH in and edit
# by hand): add a repo, commit, `make provision`, and the change is both
# live and reviewable in git history.
#
# Every entry starts as safely as possible: dry_run: true. Flip it once
# you've watched a few runs and trust the behavior for that repo.
#
# Multiple entries can point at the same `repo` with different `tool`s —
# that's how tools "collaborate": each polls the same labeled issues, the
# first to claim an issue (via the in-progress label) does the work, so
# they naturally divide labor without colliding.

repos:
  # This monorepo itself. tool: codex uses the OpenAI Codex CLI's
  # subscription-based OAuth login (ChatGPT Plus/Pro's included usage,
  # not metered API billing — see README's "What this does NOT do": the
  # login itself still has to happen once, interactively, on the box).
  # self_directed_prompt points it at this repo's own product-portfolio
  # conventions (CLAUDE.md, portfolio/DIRECTION.md) instead of the generic
  # default below.
  #
  # The owner asked (2026-08-29) for this loop to spend the subscription
  # quota on the same kind of work the scheduled cloud sessions do, and
  # named deployment/CI-CD and marketing surfaces as priorities. The prompt
  # below was widened to match: it may now work on CI, deployment manifests,
  # and SEO/landing content, which the earlier version excluded outright.
  #
  # Three boundaries were deliberately NOT widened, because "similar prompt"
  # is not the same as "same authority" and this path is unattended:
  #
  #   1. PR-only. The cloud-session mandate authorises merging on green CI;
  #      agent_runner cannot merge and this does not change that. Nothing
  #      here reaches `main` without a session or a human merging it.
  #   2. Money and law stay out of scope — billing, pricing, payment rails,
  #      licences, disclaimers-as-legal-text. Those are the owner's, and an
  #      unattended loop editing them is a liability, not a feature.
  #   3. Secrets stay out of scope. It may write a manifest that *reads* a
  #      secret; it may not create, move, or print one.
  #
  # dry_run stays true — and the master switch
  # (agent_runner_start_disabled in group_vars/all.yml) stays true — until
  # a human has actually provisioned a box, logged the codex CLI in
  # interactively, and watched a few dry runs behave. Flipping either is
  # an owner action, not something this entry does by itself.
  - repo: "Duncan-Haywood/monorepo-projects"
    tool: codex
    trigger_label: agent
    base_branch: main
    dry_run: true
    self_directed: true
    self_directed_cooldown_hours: 24
    model_tier: null
    self_directed_prompt: |
      There is no specific issue assigned — you're finding your own next
      task, following this repo's own working agreement: read README.md,
      AGENTS.md, and CLAUDE.md at the repo root first.

      This is a product portfolio. Its job is to ship free tools people
      actually use, not to write plans about tools. Review recent commits,
      portfolio/ledger/, and open issues, then use your judgment to make
      ONE complete, high-value improvement and open a PR for it.

      Pick the highest-value work available, in roughly this order:

      1. Getting built products in front of users. 164 finished tools
         under ventures/ are assembled into a public site by
         platform/pages/build.mjs and deployed to Cloudflare by
         .github/workflows/portfolio-pages.yml. Anything that makes that
         path more reliable, or fixes a tool that is broken once
         published, beats new features nobody can reach.
      2. CI and deployment. GitHub Actions is in scope. A workflow that
         is red for a real reason, or a deploy step that only works by
         hand, is a product problem here.
      3. Core usefulness of a shipped venture: a real bug, a half-built
         slice finished end to end (logic, UI, tests, usage tracking), a
         test-coverage gap, a small feature the existing code clearly
         implies but never got.
      4. Discoverability of something already live: page titles, meta
         descriptions, structured data, sitemap and robots correctness,
         landing copy that states plainly what the tool does. Describe
         only what the product actually does — no invented benchmarks,
         testimonials, traction, or endorsements.

      Boundaries. These are narrower than the mandate a supervised
      session runs under, on purpose, because nobody is watching this one:

      - You only ever produce a PR. You cannot merge and cannot deploy.
        A session or a human reviews it through the normal pipeline.
      - Do not touch billing, pricing, payment rails, licences, or legal
        and liability text. Those are the owner's.
      - Do not create, move, rename, or print a secret, and do not add a
        step that would. Referencing an existing secret by name from a
        manifest is fine; handling its value is not.
      - Do not enable, unsuspend, or widen the schedule of any automation
        that spends money or pushes on its own — including this runner.
      - Prefer leaving the repo unchanged over guessing at something
        ambiguous. One finished, verified change beats three speculative
        ones, and an honest "I found nothing worth doing" is a fine
        outcome for a run.

      Run whatever tests cover what you touched and say in the PR what
      you ran and what it printed. Explain your reasoning so review can
      evaluate the judgment call, not just the diff.

# --- examples, commented out ---
#
# - repo: "your-github-username/example-repo"
#   tool: claude                     # claude | codex | antigravity | opencode
#   trigger_label: agent             # issues with this label get picked up
#   base_branch: main                # PRs target this branch; never pushed to directly
#   dry_run: true
#   self_directed: false             # true: when no labeled issues are waiting, the
#                                     # agent creates its own (see README's "How it runs")
#   self_directed_cooldown_hours: 24 # minimum gap between self-directed issues, per repo
#   model_tier: null                 # null: auto-pick low/high by heuristic; or force "low"/"high"
#
# - repo: "your-github-username/example-repo"
#   tool: codex                      # a second tool working the SAME repo
#   trigger_label: agent
#   base_branch: main
#   dry_run: true
#
# Self-improvement: this very repo (ubuntu-agent-server) can be a target
# too — agents proposing changes to their own orchestration system through
# the same PR-reviewed pipeline as anything else, no special unreviewed
# self-modification path. Only turn this on once you trust the system on
# other repos first.
#
# - repo: "your-github-username/ubuntu-agent-server"
#   tool: claude
#   trigger_label: agent
#   base_branch: main
#   dry_run: true
#   self_directed: true
#   self_directed_cooldown_hours: 168  # weekly at most — this repo controls its own guardrails, go slow
