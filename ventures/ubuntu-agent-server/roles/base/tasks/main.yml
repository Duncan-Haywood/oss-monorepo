---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

- name: Ensure hostname resolves in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1\t{{ server_hostname }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

# The playbook was written for a box whose Ubuntu *installer* created this
# account. A cloud image has only root, so provisioning one from CI would fail
# at the first authorized_key task with a user that does not exist. Creating it
# here is idempotent on the hand-installed case.
- name: Ensure agent_user exists
  ansible.builtin.user:
    name: "{{ agent_user }}"
    shell: /bin/bash
    create_home: true
    groups: "{{ 'sudo' if ansible_os_family == 'Debian' else 'wheel' }}"
    append: true
    state: present

# Off by default: a hand-run playbook should not silently hand out passwordless
# root. CI sets it true because a runner cannot answer --ask-become-pass, which
# this venture's README already identifies as the prerequisite for unattended
# runs. `validate` matters more than it looks -- a malformed sudoers file locks
# every account out of sudo, and on a box reached only by SSH that is fatal.
# Both branches are declared, not just the enabling one. A `when:` that only
# skips the task leaves a drop-in written by an earlier run in place, so the
# host would keep NOPASSWD while the configuration said it was off -- the role
# would not converge to its declared state, and the drift would be silent and
# security-relevant.
- name: Manage agent_user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ agent_user }}-nopasswd"
    content: "{{ agent_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: agent_user_passwordless_sudo | bool

# Removes the *documented* drop-in as well as the managed one. This README
# tells operators to run `echo '<user> ALL=(ALL) NOPASSWD:ALL' | sudo tee
# /etc/sudoers.d/<user>-nopasswd` by hand for unattended runs, so a host set up
# that way keeps NOPASSWD while the role reports the feature disabled. Removing
# only the file this role wrote would converge the role's own state and not the
# host's, which is the failure the `when: false` branch was added to fix.
- name: Remove agent_user passwordless sudo when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/sudoers.d/90-{{ agent_user }}-nopasswd"
    - "/etc/sudoers.d/{{ agent_user }}-nopasswd"
  when: not (agent_user_passwordless_sudo | bool)

- name: Ensure agent_user has the expected authorized keys
  ansible.posix.authorized_key:
    user: "{{ agent_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ agent_user_authorized_keys }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - build-essential
      - curl
      - wget
      - unzip
      - jq
      - ripgrep
      - htop
      - tmux
      - ca-certificates
      - gnupg
      - software-properties-common
      - python3-debian  # required by the deb822_repository module (tailscale/nodejs roles)
      - gnome-keyring    # Antigravity CLI (agy) wants a Secret Service/dbus keyring for
      - dbus-user-session # credential storage, which headless servers don't run by default.
      - openssh-server
      - ufw
      - unattended-upgrades
    state: present

- name: Ensure openssh-server is enabled and running
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

# --- never sleep: this is what took the box down mid-setup last time ---

- name: Mask sleep/suspend/hibernate targets
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
  when: disable_sleep

- name: Disable logind idle/lid actions (belt and braces on server hardware)
  ansible.builtin.lineinfile:
    path: /etc/systemd/logind.conf
    regexp: "^#?{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: "HandleLidSwitch", value: "ignore" }
    - { key: "HandleLidSwitchExternalPower", value: "ignore" }
    - { key: "IdleAction", value: "ignore" }
  when: disable_sleep
  notify: Restart systemd-logind

# --- firewall: SSH from anywhere (needed before tailscale is up), full trust on tailnet ---
#
# Public SSH is a *bootstrap* requirement, not a steady state: the box cannot be
# reached over the tailnet until this playbook has installed and authed
# Tailscale. Leaving the rule in place afterwards is what makes "private by
# default" untrue, so closing it is a variable rather than a manual step nobody
# remembers. Default `true` preserves the previous behaviour exactly -- flipping
# the default would lock out anyone re-running this against a box whose tailnet
# handoff has not happened.
- name: Allow OpenSSH through ufw
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: ssh_public_access | bool

- name: Close public SSH once the tailnet is the way in
  community.general.ufw:
    rule: allow
    name: OpenSSH
    delete: true
  when: not (ssh_public_access | bool)

- name: Allow all traffic on the tailscale interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny

# --- unattended security upgrades, no surprise reboots ---

- name: Configure unattended-upgrades reboot behavior
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^Unattended-Upgrade::Automatic-Reboot\b'
    line: 'Unattended-Upgrade::Automatic-Reboot "{{ unattended_upgrades_auto_reboot | lower }}";'
    create: true
    mode: "0644"
  when: unattended_upgrades_enabled

- name: Enable unattended-upgrades periodic runs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  when: unattended_upgrades_enabled
