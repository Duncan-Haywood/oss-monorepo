---
- name: Add NodeSource apt repo
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ nodejs_major_version }}.x"
    suites: nodistro
    components: main
    signed_by: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"
  notify: Update apt cache after adding NodeSource repo

- name: Flush handlers so the just-added apt repo is usable immediately
  ansible.builtin.meta: flush_handlers

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Configure npm global prefix for agent_user (avoid needing sudo for -g installs)
  ansible.builtin.file:
    path: "/home/{{ agent_user }}/.npm-global"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0755"

- name: Check npm's current global prefix
  ansible.builtin.command: npm config get prefix
  become: true
  become_user: "{{ agent_user }}"
  register: nodejs_npm_prefix
  changed_when: false

- name: Point npm's global prefix at the user-writable dir
  ansible.builtin.command: "npm config set prefix /home/{{ agent_user }}/.npm-global"
  become: true
  become_user: "{{ agent_user }}"
  when: nodejs_npm_prefix.stdout.strip() != '/home/' + agent_user + '/.npm-global'
  changed_when: true

- name: Add npm global bin to PATH in .profile
  ansible.builtin.lineinfile:
    path: "/home/{{ agent_user }}/.profile"
    line: 'export PATH="$HOME/.npm-global/bin:$PATH"'
    create: true
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0644"
