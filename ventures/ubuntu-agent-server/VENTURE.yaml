name: ubuntu-agent-server
description: Ansible playbook provisioning a 24/7 Ubuntu host that runs coding agents unattended across the portfolio's repos. Internal platform infrastructure, not itself a customer-facing venture.
stage: idea

owner: duncan

hypotheses:
  - claim: Unattended, guardrailed agent runners (issue-triggered, dry-run-first, PR-only) increase agent throughput across ventures without a proportional rise in review burden or incidents.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 10
  protected: false

kill_criteria:
  - Not applicable in revenue terms — this is shared infrastructure. Practical stop condition: a real run causes an unreviewed push/merge, a secret leak past gitleaks, or repeated agent:failed runs without a fixable root cause.

