# Lint/type configuration only. This venture is Ansible + a standalone
# Python script, not a packaged/installed project — deliberately no
# [project] or [build-system] table.

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.mypy]
python_version = "3.12"
files = ["roles/agent_runner/files/agent_runner.py", "tests"]
ignore_missing_imports = true
