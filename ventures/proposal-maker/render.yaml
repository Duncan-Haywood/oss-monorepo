# One-click self-deploy: https://render.com/deploy?repo=<your fork URL>
# Render builds the Dockerfile in YOUR account; nothing runs on the author's.
# No third-party key is required. Add RESEND_API_KEY + MAIL_FROM + NOTIFY_EMAIL and set DRY_RUN=false to send real email.
services:
  - type: web
    name: proposal-maker
    runtime: docker
    dockerContext: ventures/proposal-maker
    dockerfilePath: ventures/proposal-maker/Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: STATE
        value: /data/state.json
      - key: ADMIN_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
