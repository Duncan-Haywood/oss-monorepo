# Any box with Docker:
#   ADMIN_KEY=$(openssl rand -hex 16) docker compose up -d
# Starts in DRY_RUN=true (no email or webhook). Add RESEND_API_KEY + MAIL_FROM + NOTIFY_EMAIL and DRY_RUN=false to go live.
services:
  proposal-signing:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      STATE: /data/state.json
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY (16+ characters)}
      BASE_URL: ${BASE_URL:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      DRY_RUN: ${DRY_RUN:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
volumes:
  state:
