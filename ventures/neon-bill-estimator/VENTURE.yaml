name: neon-bill-estimator
description: 'Free, zero-network, zero-dependency browser tool + CLI that estimates a monthly Neon serverless Postgres bill from the user''s own console usage numbers (compute CU-hours, storage, restore history, extra branches, data transfer) at editable approximate list prices, allowances and plan minimum, and ranks the changes that cut it most (scale to zero, autoscaling limits, stale branches, restore window, storage pruning, data transfer) with a dollar saving each; accepts a product,usage CSV and a --budget CI gate. A deterministic calculator over the user''s inputs, not a bill reader and not a guarantee of spend.'
stage: prototype

owner: duncan

# CLI/checker archetype, sibling of vercel-bill-estimator, supabase-bill-estimator
# and datadog-bill-estimator, not a trade-bid calculator. No existing venture
# prices Neon or ranks its savings levers (ls ventures | grep -i neon is empty).
#
# Where the first real visitor would come from: the search phrases "neon
# postgres bill too high", "neon compute hours cost", "neon pricing calculator",
# "reduce neon database cost"; r/node, r/postgresql and Hacker News threads
# about a branch-per-PR workflow quietly running up CU-hours. The reader is a
# founder or lead dev on a usage-based Neon plan whose compute or branch line
# surprised them. Neon's own pricing page is a rate card and the console shows
# usage after the fact; this takes the usage numbers, ranks what to change first
# and fits a CI budget gate -- that is the wedge. A hosted usage-trend monitor
# is the natural paid upgrade path later.
hypotheses:
  - claim: A developer whose Neon invoice just jumped will search for how to cut it, enter their usage, and learn which lever saves the most dollars.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A platform team will add the CLI to CI with --budget so a usage change that pushes the estimate over budget fails review instead of the invoice.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool calculates only from typed numbers in
  # the visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No external repository is found wiring cli.mjs into its own CI within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/neon-bill-estimator/
  analytics: null
