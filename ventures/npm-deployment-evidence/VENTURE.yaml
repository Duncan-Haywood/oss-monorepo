name: npm-deployment-evidence
description: Local evidence reports showing which npm lockfile dependencies reach a deployed runtime.
stage: prototype
owner: duncan

hypotheses:
  - claim: JavaScript maintainers waste review time on vulnerable packages that are installed only for builds or development.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
  - claim: A portable, source-linked deployment-surface report is useful without uploading repository contents.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      A CLI-only tool has no public URL and no way to prove itself to a
      stranger without a clone and a Python install; a browser front end
      that runs the identical classification logic client-side (no upload)
      removes that friction while keeping the same privacy posture.
    status: supported
    checked: 2026-08-30
    evidence: in-repo
    note: >-
      evidence.js ports npm_deployment_evidence.py's classification rules
      (declared-dependency, transitive-production, dev-only-nested,
      multi-location version merge) and evidence.test.js pins the same
      verdicts the CLI's tests/test_tool.py already covers, so the two
      surfaces cannot silently diverge. 21/21 node --test passing;
      platform/pages build+check picked it up as product 165/165 with no
      dead links and full FAQPage coverage.

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three maintainers identify a recurring deployment-surface review workflow after ten conversations.
  - No repeat use of the local report or CI action after a two-week pilot.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/npm-deployment-evidence/
  analytics: null
