name: eu-green-claims-checker
description: >-
  Free browser tool that gives a first read of the EU Empowering Consumers for the Green Transition Directive (EU) 2024/825 for a brand, retailer, platform or marketing agency: tick the eco, climate and durability claims you use in consumer marketing and see which are banned from 27 September 2026 (generic "eco-friendly", offset-based "climate neutral", self-made labels, whole-product claims, false repairability and durability) or allowed only on a condition (future "net zero" claims, long durability guarantees), with a safer wording for each. Nothing is uploaded. Not legal advice.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; no green-claims tool in ventures/ (checked by name). Not in screened-out.md.
#
# First visitor: a shop, brand or agency that heard the greenwashing ban starts in September 2026; search phrases
# "greenwashing ban EU 2026", "can I say eco-friendly EU", "climate neutral claim ban", "Directive 2024/825", "EU green claims what is banned".
# Volume not measured with an external tool.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: claim-evidence register per SKU and
# listing scan for banned phrases, behind an env-var switch.
#
# Liability: first read of a consumer-protection directive; rejects bad input, says plainly that national transposition, regulators and courts decide,
# carries no-warranty and not-legal-advice clauses. The claim list and dates were written from memory without network access to EUR-Lex in the building
# session and must be verified (notably the 27 September 2026 date and the conditions on future claims); article and annex numbers are deliberately omitted.
# Ethical risk is false comfort from a clean result, which the page says is not a bill of health.

hypotheses:
  - claim: >-
      Online sellers and brands facing the 27 September 2026 greenwashing ban will use a free checker to find which of their eco and durability claims to remove or reword.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a claim's status or the date differs from the Directive's text or a national transposition on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/eu-green-claims-checker/
  analytics: null
