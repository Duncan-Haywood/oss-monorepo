name: ai-first-markets
description: Market-selection intelligence and evaluated AI-first business ideas for a solo founder.
stage: prototype

owner: duncan

hypotheses:
  - claim: A unified market map and idea-scoring system improves which AI-first venture to validate next.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
    note: >-
      getValidationDecision() now turns the map into a single auditable pick:
      for $100k ARR it returns AI PR Review Agent, which is both rank-1 and the
      top composite dimension score (scoreAgreesWithRank=true), with a concrete
      first experiment. Both kill criteria are non-triggered — a decision
      workflow uses the platform, and every top-ranked idea carries a testable
      customer experiment. The test pass also caught two integrity gaps now
      fixed: rank1m was not a 1..N permutation (no rank 1, an out-of-range 9),
      and the hand-assigned ranks diverge from the dimension scores below the
      top slot (e.g. AI QA for E-commerce is joint-top by score but rank 7 for
      $100k). Rank integrity is now guarded by a test.
  - claim: >-
      Scoring the portfolio's own 11 ventures on the same six dimensions ranks
      them consistently with the router's dispatchable-vs-blocked split, so the
      map's method transfers from the 8 hypothetical ideas to real ventures.
    status: refuted
    checked: 2026-08-20
    evidence: in-repo
    note: >-
      Refuted. src/data/ventures.ts scores all 11 real ventures on the same
      six dimensions ideas.ts uses; assessMethodTransfer() (src/lib/transfer.ts,
      guarded by transfer.test.ts) compares the composite-score ranking against
      the router's dispatchable split (allocate.py: ai-first-markets and
      photos-import-tools dispatchable, 9 blocked). The two dispatchable
      ventures rank 7 and 11 of 11 by business score, not 1 and 2 — the split is
      not reproduced. This is structural, not an artifact of the exact scores:
      dispatchability is a function of a hypothesis's evidence type
      (in-repo vs customer-contact) and publication status, and none of the six
      dimensions (ai-leverage, automation, time-to-revenue, margin,
      defensibility, distribution) measures either. photos-import-tools, a free
      macOS utility with no AI, is dispatchable and scores lowest of all 11. So
      the map's ranking method answers "which is the better business," which is
      a different question from the router's "which can a session start now";
      the two should not be conflated. A synthetic-control test confirms the
      assessor returns transfer=true when the top scorers are the dispatchable
      set, so the false result is a property of the portfolio, not the code.

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 50
  protected: true

kill_criteria:
  - No decision or validation workflow uses the platform within 90 days.
  - The research cannot produce a testable customer experiment for a top-ranked idea.

