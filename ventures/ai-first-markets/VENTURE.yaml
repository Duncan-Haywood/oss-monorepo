name: ai-first-markets
description: Market-selection intelligence and evaluated AI-first business ideas for a solo founder.
stage: prototype

owner: duncan

hypotheses:
  - claim: A unified market map and idea-scoring system improves which AI-first venture to validate next.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
    note: >-
      getValidationDecision() now turns the map into a single auditable pick:
      for $100k ARR it returns AI PR Review Agent, which is both rank-1 and the
      top composite dimension score (scoreAgreesWithRank=true), with a concrete
      first experiment. Both kill criteria are non-triggered — a decision
      workflow uses the platform, and every top-ranked idea carries a testable
      customer experiment. The test pass also caught two integrity gaps now
      fixed: rank1m was not a 1..N permutation (no rank 1, an out-of-range 9),
      and the hand-assigned ranks diverge from the dimension scores below the
      top slot (e.g. AI QA for E-commerce is joint-top by score but rank 7 for
      $100k). Rank integrity is now guarded by a test.
  - claim: >-
      Scoring the portfolio's own 11 ventures on the same six dimensions ranks
      them consistently with the router's dispatchable-vs-blocked split, so the
      map's method transfers from the 8 hypothetical ideas to real ventures.
    status: refuted
    checked: 2026-08-20
    evidence: in-repo
    note: >-
      evaluatePortfolioTransfer() (src/lib/portfolio-transfer.ts, tested) shows
      the six-dimension composite does NOT transfer, but for a reason that is
      itself the portfolio's standing finding. Five of the six dimensions
      (AI Leverage, Zero-Employee Ops, Time to Revenue, Gross Margin,
      Defensibility) have no recorded value for any real venture -- every
      VENTURE.yaml has economics.mrr: null and no dimension scores -- so a
      composite cannot be computed without inventing five of its six inputs,
      which the router's "Unmeasured is not zero" rule forbids. The one
      dimension with a repo-observable value, Distribution (market-access),
      scored as "is the venture's next result settleable in-repo", reproduces
      the router's dispatchable-vs-blocked split exactly (2 dispatchable:
      ai-first-markets, photos-import-tools; 9 blocked). So the method transfers
      on the single binding axis and not as a composite -- distribution, not
      idea quality, is what separates the portfolio's ventures, the same
      conclusion the pipeline reaches independently. A drift guard re-derives
      published status and next-work evidence from each VENTURE.yaml on disk, so
      a newly published or reclassified venture fails the test and forces a
      re-check here.

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 50
  protected: true

kill_criteria:
  - No decision or validation workflow uses the platform within 90 days.
  - The research cannot produce a testable customer experiment for a top-ranked idea.

links:
  production: null
  analytics: null
