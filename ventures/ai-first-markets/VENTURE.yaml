name: ai-first-markets
description: Quantitative research platform evaluating economic leverage and AI market opportunities across vertical sectors.
stage: prototype
verify: npm run typecheck && npm run lint && npm test && npm run build

owner: duncan

hypotheses:
  - claim: Proprietary market efficiency reports will attract premium newsletter/research subscribers at $29/mo.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 30
  protected: true

kill_criteria:
  - Fewer than 100 newsletter signups within 30 days of release.
  - description: >-
      $120 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 120
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  production: null
  analytics: null

engineering:
  verify_command: npm run typecheck && npm run lint && npm test && npm run build
  ci_component: ai-first-markets
  coverage:
    lines: 90
    functions: 90
    statements: 90
    branches: 85
