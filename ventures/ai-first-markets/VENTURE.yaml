name: ai-first-markets
description: Market-selection intelligence and evaluated AI-first business ideas for a solo founder.
stage: prototype

owner: duncan

hypotheses:
  - claim: A unified market map and idea-scoring system improves which AI-first venture to validate next.
    status: untested
    checked: null
  - claim: Scoring liability, capital, and agent-operability explicitly changes which ideas rank, not just how they are described.
    status: supported
    checked: 2026-08-18
    note: >-
      The 2026-08 screen rejected eleven categories outright on liability or
      ethics grounds and moved two new candidates above five of the original
      eight. Supported as a ranking effect; still untested against a customer.

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 50
  protected: true

kill_criteria:
  - No decision or validation workflow uses the platform within 90 days.
  - The research cannot produce a testable customer experiment for a top-ranked idea.

links:
  production: null
  analytics: null
