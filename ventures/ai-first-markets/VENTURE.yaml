name: ai-first-markets
description: Market-selection intelligence and evaluated AI-first business ideas for a solo founder.
stage: prototype

owner: duncan

hypotheses:
  - claim: A unified market map and idea-scoring system improves which AI-first venture to validate next.
    status: supported
    checked: 2026-08-20
    evidence: in-repo
    note: >-
      getValidationDecision() now turns the map into a single auditable pick:
      for $100k ARR it returns AI PR Review Agent, which is both rank-1 and the
      top composite dimension score (scoreAgreesWithRank=true), with a concrete
      first experiment. Both kill criteria are non-triggered — a decision
      workflow uses the platform, and every top-ranked idea carries a testable
      customer experiment. The test pass also caught two integrity gaps now
      fixed: rank1m was not a 1..N permutation (no rank 1, an out-of-range 9),
      and the hand-assigned ranks diverge from the dimension scores below the
      top slot (e.g. AI QA for E-commerce is joint-top by score but rank 7 for
      $100k). Rank integrity is now guarded by a test.
  - claim: >-
      Scoring the portfolio's own 11 ventures on the same six dimensions ranks
      them consistently with the router's dispatchable-vs-blocked split, so the
      map's method transfers from the 8 hypothetical ideas to real ventures.
    status: refuted
    checked: 2026-08-20
    evidence: in-repo
    note: >-
      evaluateMethodTransfer() scores all 11 ventures on the six dimensions and
      tests whether the two dispatchable ventures cluster at the top of the
      score ranking (exact one-tailed rank-sum test, alpha 0.05). They do not:
      dispatchable rank sum is 15 against an expected-by-chance 12 — they score
      slightly *worse* than random, p=0.836. The method does not transfer,
      and the reason is structural, not a scoring error: dispatchability
      measures publish-state (is there a links.production for a customer to
      respond to), while the six dimensions measure business merit. The two
      dispatchable ventures (ai-first-markets, photos-import-tools) are
      dispatchable precisely because they are internal tools with in-repo
      hypotheses and nothing to publish — not because they are the best
      businesses. The scoring map still produces a usable output where the two
      rankings disagree: the top-scoring venture whose next claim needs a
      customer is local-site-studio (composite 34/60), the shortest real path
      to a first dollar. So the map ranks *what to build toward*; the router
      ranks *what a session can start today*. They answer different questions
      and should not be expected to agree.

      Independently replicated the same day by a second session that had not
      seen this one, scoring the same 11 ventures from the same repository
      evidence into portfolio/scoring/venture-scores.yaml. It reached the same
      refutation, the same structural explanation, and the same rank 1
      (local-site-studio) and rank 11 (print-atelier); no venture's composite
      differs between the two raters by more than 0.34 of a point. That
      accidental inter-rater agreement is the best evidence available that
      these hand-assigned scores are not arbitrary. The two datasets are kept
      separate on purpose: this one is the venture's own transfer experiment,
      portfolio/scoring/ is the portfolio's operational score and is what
      allocate.py reads.
  - claim: >-
      This venture has a commercial thesis at all — a buyer, a price, and a
      route to one — rather than being internal decision infrastructure the
      portfolio counts as a business.
    status: refuted
    checked: 2026-08-20
    evidence: in-repo
    note: >-
      Tested by inspection against the three parts of the claim — a buyer, a
      price, a route to one — and none is present.

      Buyer: the only access is the Cloudflare Access policy in
      cloudflare/access-policy.json, which is a single-email whitelist for the
      owner ("Private business evaluation reports — single authorized user").
      No second user, prospect, or waitlist exists anywhere in the repo.

      Price: grepping src/ for stripe/checkout/billing/subscribe/purchase
      returns only strings describing the eight *evaluated ideas* and their
      hypothetical Stripe billing (src/data/ideas.ts, src/app/reports), never a
      price, plan, or purchase surface for this tool itself. The app's own
      scoring data says so in as many words:
      src/data/portfolio-ventures.ts:144 scores this venture's own
      time_to_revenue and records "There is no pricing, no buyer and no
      purchase surface — it is an internal decision tool."

      Route: no listing, no distribution channel, and — per the portfolio's
      repeatedly verified finding — no channel it could publish to from here
      anyway. Its own distribution dimension scores 3/10: "competes against an
      enormous supply of free idea lists with no distinguishing channel."

      The clinching structural evidence is that this venture's
      src/lib/evaluation.ts is not a product feature but the portfolio's own
      scoring engine: portfolio/scoring/venture-scores.yaml records
      `method: ventures/ai-first-markets/src/lib/evaluation.ts`, and ~17 files
      across the router, scoring, research, and pipeline reference this path.
      It is decision infrastructure the rest of the repo depends on, not a
      business with customers.

      Conclusion: the claim is refuted. This is internal decision
      infrastructure, and counting it under ventures/ makes the portfolio look
      one business larger than it is and draws $50/mo of protected explore
      budget it can never convert to revenue. Recommended follow-up (a
      deliberate, standalone change, not bundled here because it ripples
      through the router, scoring, CI path filters, and docs): reclassify this
      directory from ventures/ to platform/ so allocate.py stops ranking it as
      a revenue-explore candidate. Touch-points to update in that move:
      .github/workflows/ai-first-markets-{ci,deploy}.yml,
      portfolio/router/{allocate.py,test_allocate.py,README.md},
      portfolio/scoring/{score_ventures.py,venture-scores.yaml,README.md},
      README.md, and the portfolio/research + portfolio/pipeline docs that cite
      the ventures/ai-first-markets/... path. Kept out of this change because a
      whole-directory move conflicts with the hourly router/scoring/ledger
      churn and deserves to land on its own.

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 50
  protected: true

kill_criteria:
  - No decision or validation workflow uses the platform within 90 days.
  - The research cannot produce a testable customer experiment for a top-ranked idea.

links:
  production: null
  analytics: null
