name: pool-plaster-bid-calculator
description: A private browser calculator for pool plaster and resurfacing contractors that prices a drain-and-replaster from floor-plus-wall surface (not the homeowner's length × width), finish (white plaster, quartz, pebble, glass), chip-out, spa, steps, waterline tile, and coping — and shows the price per square foot of plaster, the water-surface number the homeowner is shopping, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent pool plasterers will use a floor-plus-wall bid calculator because the generic price-per-square-foot rules of thumb they are shopped on use the water surface (length × width) and cannot see that a 16×32 rectangle is about 1,064 square feet of plaster, not 512, and that a pebble job with a full chip-out, spa, waterline tile, and coping is a different job from a white-plaster overlay.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the water-surface versus plaster-surface split (not the published per-square-foot number) are the two figures a plasterer actually decides on when a homeowner asks them to match a cheaper water-surface quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating chip-out, spa, tile, and coping as their own hours, instead of a blended add-on to water-surface square footage, changes the bid enough that shops notice which part of a high number is the first drain-and-chip day.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified pool plaster or resurfacing contractors use the calculator twice within 90 days.
  - Contractors report that splitting plaster surface from water surface, plus chip-out, spa, and tile, is more work than their existing per-square-foot method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/pool-plaster-bid-calculator/
  analytics: null
