name: popcorn-ceiling-bid-calculator
description: A private browser calculator for painting and drywall contractors that prices popcorn ceiling removal from ceiling area, scrape-and-prime versus Level 4 skim versus Level 5 plus paint, 8-foot versus vaulted versus two-story access, and extras — and shows the extra-work share and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent painting and drywall contractors will use a scrape-and-skim bid calculator because the generic "$1.50 / sq ft popcorn removal special" they are shopped on cannot see that an 8-foot first-floor light scrape-and-prime is a different job from a two-story painted-over heavy cottage-cheese with a Level 5 skim, two coats of paint, an asbestos test, and interior scaffolding.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the extra-work share (not the published scrape dump) are the two figures a contractor actually decides on when an owner asks them to match a cheaper scrape-and-prime quote on a skim-and-paint job.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing scrape-and-prime, Level 4 skim, and Level 5 plus paint on the same ceiling, with height hours and an asbestos invoice, changes the bid enough that contractors notice which scope keeps the margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified painting or drywall contractors use the calculator twice within 90 days.
  - Contractors report that splitting scrape, skim, and extras is more work than their existing per-foot method without changing the price they would have bid.
  - The starting hours and finish rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/popcorn-ceiling-bid-calculator/
  analytics: null
