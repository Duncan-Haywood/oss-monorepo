name: padel-club-profit-calculator
description: >-
  Free browser tool for people planning or running a padel club: enter courts, opening hours, peak and off-peak court-hour prices and utilisation, member discount, coaching, food and drink, pro shop, staff hours, rent, court and fit-out cost and a loan, and see monthly profit at planned bookings, break-even court utilisation, the price change that reaches a target margin, booking, price and wage sensitivity tables, a sixty-month ramp-up with the lowest cash point and payback, and loan coverage. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session. Nearest in ventures/ are pickleball-facility-pro-forma (pickleball court pro forma), golf-simulator-bay-profit-calculator
# (bay hours) and climbing-gym-profit-calculator (memberships and day passes). None models padel's four-player court-hour with peak and off-peak utilisation,
# members, coaching with a coach share and food and drink together with staffing, break-even utilisation, ramp-up reserve and payback. No padel tool in ventures/;
# not in screened-out.md.
#
# First visitor: a would-be club owner, a pickleball or tennis operator weighing padel courts, or an investor sizing a lease and a loan; search phrases
# "padel club business plan calculator", "how much does a padel club make", "padel court utilisation break even", "padel court ROI". Padel is among the fastest-growing
# racket sports in the US, Europe and Latin America, so demand is current. Volume not measured with an external tool.
#
# Who: small independent operators and first-time owners raising money. Utilisation by peak and off-peak, the coach share and the months of ramp-up are the
# numbers a generic startup template leaves out, and peak evenings are the hours that decide whether the club carries its lease.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. Saved scenarios, seasonality by month and a lender-ready
# export behind an env-var switch is the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with every rule visible on the page. No price, utilisation or market is claimed, sample figures
# are labelled illustrative, bad input is rejected instead of clamped, and the page carries the no-warranty and not-advice clauses and lists what
# it does not decide (catchment demand, seasonality, planning and zoning, building and fire codes, noise, court dimensions, licensing, coach qualifications, insurance, tax, lender terms).

hypotheses:
  - claim: >-
      A prospective or current padel club operator will enter court, price and utilisation figures before signing a lease or borrowing,
      because break-even utilisation and the ramp-up cash reserve are hard to see in a generic startup spreadsheet.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that the profit, break-even or payback arithmetic differs from the stated rules on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/padel-club-profit-calculator/
  analytics: null
