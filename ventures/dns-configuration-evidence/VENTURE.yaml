name: dns-configuration-evidence
description: Free browser tool that captures what public resolvers answer for a customer domain before and after a DNS change, and reports what changed, what did not, and what could not be observed — with a matching Python CLI for scripted capture.
stage: prototype
owner: duncan

hypotheses:
  - claim: MSPs and web agencies repeatedly need portable, source-linked DNS change records for customer domains.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Resolver-aware history is more useful in operational reviews than a green/red DNS monitoring alert.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The reason the first two hypotheses stayed untested is that the only interface was a Python CLI, so an MSP mid-cutover had to clone a repo to try it. A browser surface on a public URL is what makes them testable at all.
    status: untested
    checked: null
    evidence: in-repo

economics:
  currency: USD
  mrr: null
  # Zero, and structurally so: the browser surface makes its DNS queries from
  # the visitor's own browser to public DoH endpoints, so serving one more user
  # costs a static file and nothing else.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 20
  protected: true

kill_criteria:
  - Fewer than three qualified practitioners identify a recurring DNS review workflow after ten conversations.
  - No practitioner values portable evidence history over existing DNS tools in the first pilot.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/dns-configuration-evidence/
  analytics: null
