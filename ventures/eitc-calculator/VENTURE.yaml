kill_criteria:
  - No measurable return usage or organic referral traffic within 6 months
    of the first tax-filing season in which this calculator has been live
    a full season (April 2027).
  - Fewer than three unsolicited signals (star, fork, referral, or feedback)
    within 90 days of that filing season closing.

