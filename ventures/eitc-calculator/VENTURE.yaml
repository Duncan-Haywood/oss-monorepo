name: eitc-calculator
description: >-
  Free browser calculator for the federal Earned Income Tax Credit (EITC)
  -- applies the phase-in/plateau/phase-out formula by number of
  qualifying children and filing status, the $12,200 investment income
  limit, the married-filing-separately living-apart exception, and IRS
  Publication 596's own rule of computing the credit twice (earned income
  and AGI) and keeping the smaller result. Entirely client-side, nothing
  uploaded.
stage: prototype
owner: duncan

# Screened during a 2026-09-25 new-venture-first session (session_gate.py:
# build-now queue empty, PROCEED verdict; no open PRs and no in-progress
# venture work at the time; DIRECTION.md's 2026-09-06 owner direction ranks
# a fresh gate-cleared niche ahead of a parity feature in that situation).
# duplicate_check.py scored every venture, screened-out row, and pipeline
# candidate at 0.19 or below for "Calculate the federal Earned Income Tax
# Credit (EITC) for 2025/2026: the phase-in, plateau, and phase-out by
# number of qualifying children and filing status, the investment income
# limit, and the credit amount at a given earned income and AGI" -- well
# under the 0.45 review bar, and the closest match
# (senior-deduction-calculator, 0.19) is a different federal provision
# entirely (a temporary age-65+ deduction vs. a permanent earned-income
# credit). Not in portfolio/pipeline/screened-out.md: no row mentions the
# EITC, Earned Income Tax Credit, or Schedule EIC.
#
# The EITC is the largest federal anti-poverty tax credit by dollar volume
# and is claimed by tens of millions of filers every season -- a
# fundamentally different, much larger search population than this
# portfolio's narrower OBBBA-provision calculators (senior deduction, auto
# loan interest, SALT cap), which each target a specific new 2025 tax
# change rather than a decades-old, mass-claimed credit. Mechanics
# verified via WebSearch on 2026-09-25 against multiple independent CPA/
# payroll-firm summaries of IRS Revenue Procedure 2025-32's 2026 inflation
# adjustments (search snippets for one figure disagreed -- "$664" vs.
# "$649" for the no-children maximum -- cross-checked against five
# independent sources favoring $664 before using it), and WebFetch access
# to irs.gov, kiplinger.com, and ustax.tools was blocked by the agent
# egress proxy, so every figure below is WebSearch-cross-validated across
# at least three independent sources rather than fetched from a single
# primary source: the phase-in/phase-out rates and dollar figures per
# child-count bracket, the shared phase-out threshold across 1/2/3+
# children (only 0-children has its own lower threshold), the $12,200
# investment income cliff, the age 25-64 requirement with no children, and
# the MFS living-apart exception.
#
# Differentiation from existing EITC calculators found during research
# (several independent finance-blog and CPA-firm calculators, most
# ad-supported or omitting the AGI comparison entirely): this is
# privacy-first with no upsell, and explicitly implements IRS Publication
# 596's own two-lookup method (earned income AND AGI, take the smaller) --
# the detail most naive online calculators skip by using earned income
# alone, which can materially overstate the credit for a filer with
# investment income, unemployment, or a working spouse.

hypotheses:
  - claim: >-
      Filers and the tax-prep professionals fielding their questions will
      search plain-language phrases ("eitc calculator 2026", "earned
      income credit calculator", "eitc income limits 2026") every tax
      season, at a volume much larger than this portfolio's narrower
      OBBBA-provision calculators, and some will prefer a free, private,
      no-signup, no-upsell calculator that models the AGI comparison
      correctly over a static explainer or a calculator that uses earned
      income alone.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      The existence of several already-published EITC calculators and
      explainer sites (found during WebSearch research 2026-09-25) is
      evidence of real, proven, very high search volume for these
      phrases; the explicit AGI-vs-earned-income dual lookup (matching IRS
      Publication 596's own worksheet method rather than a simplified
      earned-income-only approximation) is real differentiation, not just
      a duplicate entrant into an already-crowded field.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Visitors who look the credit up from earned income alone, ignore the
      investment income limit, or assume married filing separately always
      disqualifies the EITC, will get a materially wrong estimate from a
      naive hand calculation, and a calculator that surfaces all three
      distinctions explicitly prevents those specific, high-consequence
      mistakes.
    status: untested
    checked: null
    evidence: customer-contact

