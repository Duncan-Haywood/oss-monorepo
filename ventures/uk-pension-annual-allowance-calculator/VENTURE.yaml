name: uk-pension-annual-allowance-calculator
description: >-
  Free browser tool for UK high earners and final salary (NHS, teachers, civil service) members: your tapered pension annual allowance, carry forward from the last three tax years, how much more you can pay in before a charge, and the annual allowance tax charge on any excess. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-14 in a new-venture-first session; duplicate_check.py best match uk-100k-tax-trap-calculator at 0.31 (it models the income tax taper, not the pension annual allowance); no pension allowance tool in ventures/.
#
# First visitor: UK consultant, GP partner or senior professional searching "tapered annual allowance calculator", "annual allowance carry forward calculator", "pension annual allowance charge NHS".
# NHS pension tax is a well-known pain point with recurring forum threads (Doctors.net, r/UKPersonalFinance, r/doctorsUK); the HMRC and scheme calculators are separate, partial and slow. Volume not measured.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: multi-year planner and pension savings statement upload behind an env-var switch.
#
# Liability: rules written from memory without network access; every result names GOV.UK as the source to verify, carries no-warranty and not-tax-advice clauses,
# and says what it does not decide (Scottish rates, lump-sum inputs, Scheme Pays, alternative annual allowance). Ethical risk is a user relying on an estimated charge to skip a tax return; mitigated by the Self Assessment and pension savings statement steps in every result.
hypotheses:
  - claim: >-
      UK high earners and defined benefit scheme members will use a free calculator to size their tapered annual allowance and carry forward before they pay in.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a threshold, allowance or taper differs from GOV.UK guidance on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-pension-annual-allowance-calculator/
  analytics: null
