name: upwork-earnings-to-journal
description: >-
  Free browser tool that turns an Upwork transaction history into balanced accounting journals for Xero,
  QuickBooks Online and QuickBooks Desktop (IIF). It books hourly, fixed-price and bonus earnings gross to
  separate income accounts, Upwork's service fee, withdrawal fees and Connects as expenses and withdrawals as
  money moving to the bank, proves the export is complete by walking the running Balance column row to row,
  splits a history that straddles a month end into one journal per month, and shows what Upwork took as a
  share of what was billed. Types no rule recognises are journalled to an uncategorised account rather than
  dropped. The export is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06 (duplicate_check: nearest is the journal family at 0.38, freelance-platform-fee-calculator
# at 0.29 -- that one predicts fees, this one books them). The commercial analogues are A2X, Synder and
# Bookkeeper-for-Upwork services (marketplace and payment-platform sync into Xero and QuickBooks, sold per
# month); this is the no-account, no-upload, one-export-at-a-time version for freelancers whose money sits in an
# Upwork balance net of fees and is withdrawn in lumps that match no invoice.
# Search phrases: "Upwork to QuickBooks", "Upwork to Xero", "how to record Upwork income in QuickBooks",
# "Upwork bookkeeping", "Upwork fees accounting", "Upwork service fee journal entry". Volume not measured with
# an external tool.
#
# First visitor: freelancers and their bookkeepers searching the phrases above, r/Upwork and r/freelance threads
# on "how do I book Upwork fees", and the QuickBooks and Xero community forums where the question recurs.
#
# Who: Upwork freelancers (and small agencies) who keep their own books, and bookkeepers serving several of
# them, who today book the net withdrawal as income.
#
# Path to revenue (payment rails stay off): lead magnet for the freelancer and bookkeeper audience. If usage
# appears, the paid version is what a browser page cannot do: batch many clients, remember the account mapping
# per client, and add Fiverr, Freelancer.com and Toptal exports. Not built.
#
# Liability: writes a journal from the user's own export, shows the check it ran, states what it does not
# check (tax treatment, currency conversion), and carries the no-warranty, independent-of-Upwork and
# financial-data clauses.
#
# Unverified: the column names of the Upwork transaction history, its Type labels, whether it lists newest or
# oldest first, and the Xero, QuickBooks Online and IIF import layouts are from memory of public help documents;
# nothing ran against a real Upwork export or a live import. The first export this misreads is the priority fix.

hypotheses:
  - claim: >-
      An Upwork freelancer or their bookkeeper will paste a transaction history into a no-upload page to get a
      month-split journal and a fee-share figure, because the alternatives are booking the net withdrawal as
      income (hiding fees, putting income in the wrong month) or paying a monthly sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a payout this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

links:
