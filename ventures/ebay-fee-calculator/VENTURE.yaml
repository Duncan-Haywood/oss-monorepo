name: ebay-fee-calculator
description: A private browser calculator for eBay resellers to see order profit, margin, ROI, break-even resale price, expected profit after returns, whether a partial refund still beats taking the return, whether Authenticity Guarantee still pays after the hub label, whether local pickup still beats the label after no-shows, whether keeping a lot still beats splitting it into singles, whether a Standard Envelope still beats a tracked label after item-not-received claims, whether combining two already-sold items still beats two labels, whether a seller-initiated offer still beats waiting for Buy It Now, whether Promoted Offsite still pays after a bill that is charged even if they bounce, whether a seller coupon still beats staying listed, whether requiring immediate payment still beats unpaid checkouts, whether Top Rated Plus still covers free returns after the fee discount, whether Managed Returns still beats buying the return label yourself, whether Global Shipping Program still beats buying the international label, whether free shipping still beats charging the buyer after a typed sell-through lift, and whether auction still beats Buy It Now after sell-through.
stage: prototype
owner: duncan
hypotheses:
  - claim: eBay resellers will return to a fast profit calculator that includes their cost of goods, because generic fee calculators stop at the fee and never show ROI or break-even resale price.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Return on invested cash is the number resellers actually decide on when sourcing, more than the raw profit figure.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Resellers will change listing format when they can see expected profit after sell-through, because a cheaper auction hammer still beats a Buy It Now that does not sell.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Resellers will skip or keep Top Rated Plus when they can see the 10% final-value discount against seller-paid return labels and 1-day handling, because the badge looks free until free returns wipe it.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Resellers will skip or keep Managed Returns when they can see a cheaper program fee against the extra returns an easier path usually brings, because the fee line looks like a save until the rate rises.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Resellers will keep or skip Global Shipping Program when they can see a hub label against international postage plus a typed claim rate, because “I can ship cheaper” ignores boxes that never arrive.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Resellers will offer or skip free shipping when they can see that baking the exact shipping charged into the item is leftover-identical on eBay, because leaving the list put and still buying the label is the leak.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified eBay resellers use the calculator twice within 90 days.
  - Users do not find at least one item whose break-even resale price differs materially from their expectation.
