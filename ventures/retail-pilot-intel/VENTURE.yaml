name: retail-pilot-intel
description: Privacy-first retail foot-traffic and POS analytics for small-format pilot boutiques.
stage: prototype
verify: pnpm run ci

owner: duncan

hypotheses:
  - claim: Small boutiques in Europe will pay €99/mo for door-to-POS conversion insights that increase sales by 1 unit/month.
    status: untested
    checked: null

economics:
  currency: EUR
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 50
  protected: true

kill_criteria:
  - Zero store pilot deployments after 90 days of sales demo availability.
  - CAC exceeds €300 per store location.
  - description: >-
      $150 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 150
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  # Was https://retail-pilot-intel.pages.dev until 2026-08-02. That host is
  # NXDOMAIN, so the venture was declaring a production surface that has never
  # been reachable: the name follows the Cloudflare Pages convention while
  # `.github/workflows/deploy-docs.yml` publishes to GitHub Pages, and that
  # workflow sits in a venture subdirectory of a Gitea repository, so it has
  # never run. There is no deployed docs site to point at yet. Restore this only
  # with a URL that answers — the validator requires the hostname to be named by
  # a workflow, deploy script, or infrastructure config.
  production: null
  analytics: null

