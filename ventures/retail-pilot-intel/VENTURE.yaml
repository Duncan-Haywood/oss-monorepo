# Copy to ventures/<name>/VENTURE.yaml and fill in.
# This file is the contract between a venture and the portfolio router.

name: retail-pilot-intel
description: >-
  Privacy-first door-count + POS join analytics for small-format retail
  stores, sold to independent shop owners (initial design-partner wedge:
  ~10 m² leather boutique in Italy).

# idea | prototype | launched | revenue | scaling | winding-down
# Stage gates how much the router is willing to spend before demanding
# an outcome signal.
stage: prototype

owner: duncan

# What has to be true for this to be worth continuing. The router does not
# read prose, but you do — keep these honest and dated.
hypotheses:
  - claim: Independent shop owners will pay monthly for door+POS conversion KPIs and a weekly ranked € action.
    status: untested        # untested | supported | refuted
    checked: null           # YYYY-MM-DD
  - claim: One live design-partner store (door counts + POS join) can be reached without a signed DPIA blocking pilot launch.
    status: untested
    checked: null

# Where the money is. Nulls are fine early; the router treats an unmeasured
# venture differently from one measured at zero.
economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

# Caps agent spend so one venture cannot drain the portfolio.
# Unit is USD of model spend per month.
budget:
  monthly_cap: 50
  # Explore budget is protected: early ventures get funded even when their
  # measured return is zero, otherwise the router starves everything new.
  protected: true

# Stop conditions. When one trips, the router stops allocating and flags it.
kill_criteria:
  - No design-partner store live (door counts + POS join reading real data, gates G1-G4 green) within 120 days of M1 start.
  - No signed pilot agreement or paying customer within 90 days of first pilot-live (M4) deployment.

links:
  production: null
  analytics: null
