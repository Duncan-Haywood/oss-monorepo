name: mailchimp-audience-csv-check
description: >-
  Free browser tool that checks a Mailchimp audience import CSV before it is uploaded: rows with no
  email address, invalid and duplicate emails (capitals ignored), unquoted commas inside Tags that
  shift every later column, birthdays with a year or mixing DD/MM and MM/DD, phones Excel turned
  into scientific notation, headers like Mobile or DOB that will not map to the default field, date
  columns that mix day-first and month-first, and semicolon-separated files, each with its line
  number, plus a safe-fixes pass that cleans formatting only and never touches a name, a tag, a
  birthday or anything about consent. The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-04 in a new-venture-first session. Mailchimp is the email platform with the
# largest base of small-business users, and every migration into it, from a spreadsheet, a POS, a
# form tool or another ESP, is a CSV import. The portfolio checks Klaviyo, HubSpot, Shopify and
# generic email lists; nothing reads the file Mailchimp's importer expects. Its costly faults are
# the quiet ones: "Mobile" or "DOB" offered as a new audience field instead of the default one, a
# Tags cell with an unquoted comma that shifts the columns, a Birthday with a year or mixing DD/MM
# and MM/DD.
#
# First visitor: small-business owners, freelancers and agencies searching literal symptoms
# ("Mailchimp import skipped contacts", "Mailchimp CSV tags comma", "Mailchimp birthday import
# format", "Mailchimp import phone number scientific notation"). Volume not measured with an
# external tool.
#
# Privacy is the liability boundary: a contact list is personal data, so the file never leaves the
# browser (a test asserts no network calls). Consent is the second boundary: the page says formatting
# is all it checks, never creates or changes consent, and its safe fixes never touch a consent or
# status column (a test pins it).
#
# Rules are read from memory of Mailchimp's public CSV import help, shown on the page with an
# explicit not-checked list (deliverability, existing contacts, field limits, size limits).
#
# Path to revenue (payment rails stay off): lead magnet for the small-business email audience and
# agencies, cross-linked to the Klaviyo, HubSpot, Shopify and email-list checkers. A paid version,
# if usage appears, is bulk checks across client files with saved rules behind an env-var switch;
# not built.
#
# Liability: format checks on the user's own file, rules stated as read from memory, no warranty,
# not legal advice on messaging law, independent-of-Mailchimp clause, trademark used nominatively.
