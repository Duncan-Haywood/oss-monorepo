[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-verification-evidence"
version = "0.1.0"
description = "Local evidence checks for whether backup artifacts are structurally intact"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[project.scripts]
backup-evidence = "backup_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
