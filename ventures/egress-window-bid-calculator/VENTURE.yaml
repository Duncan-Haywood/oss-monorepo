name: egress-window-bid-calculator
description: A private browser calculator for foundation and basement contractors that prices an egress-window install from window count, hopper versus slider versus casement versus fiberglass, retrofit-existing versus wood-cut versus masonry-cut versus poured-cut, plastic versus steel versus stone well, extras, contractor-supplied versus customer-supplied sash and well, and weekday versus they-stay-in-the-basement versus Saturday / after-hours — and shows the extra-work share and the walk-away price below which the $1,800 just-set special loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent foundation and basement contractors will use an opening-versus-cut bid calculator because the generic "$1,800 installed" special they are shopped on cannot see that a vinyl hopper into an existing hole with a plastic well is a different job from a casement in a new poured-wall cut with a stone well, a drain, a cover, a ladder, and a dirt haul.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the extra-work share (not the published installed dump) are the two figures a contractor actually decides on when an owner asks them to match a cheaper retrofit quote on a poured-wall new-cut.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing hopper, slider, casement, and fiberglass on the same opening, next to retrofit versus poured-cut, changes the bid enough that contractors quote the legal-bedroom job instead of matching the $1,800 special.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified foundation or basement contractors use the calculator twice within 90 days.
  - Contractors report that splitting opening, cut, and extras is more work than their existing installed-price method without changing the price they would have bid.
  - The starting hours and window invoices prove so far from real crews that the tool cannot be used without data we have no way to gather.
