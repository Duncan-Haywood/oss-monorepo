name: arcade-game-payback-calculator
description: >-
  Free browser tool for arcade and family-entertainment-center owners: enter each game with its cost, credits per play, plays per week,
  tickets paid per play and floor space, then see weekly profit after card fees, prize cost, rent, power and upkeep, payback, break-even
  plays, plays needed for a payback target, profit per square foot and a keep, watch or cut verdict, with credit-price and prize-cost
  sweeps for the whole floor. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-12 in a new-venture-first session. portfolio/pipeline/duplicate_check.py scored the nearest venture 0.27
# (trampoline-park-profit-calculator). amusement-route-location-calculator is the route operator's commission split; this is the
# venue owner's per-game redemption economics. Not in screened-out.md.
#
# First visitor: an arcade or FEC owner deciding which cabinets to keep; search phrases "arcade game ROI", "arcade redemption game
# profit", "how much does an arcade game make per week". Volume not measured with an external tool.
#
# Who: independent arcades, bowling-alley and pizza-venue game rooms, small FECs. Card-swipe systems already report plays per game, so
# the input is a copy-paste away; the decision (what to replace) costs five figures per game.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. Importing a card-system report and a saved
# multi-venue comparison behind an env-var switch is the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with every rule visible on the page. No market rate or play count is claimed, sample
# figures are labelled illustrative, bad input is rejected instead of clamped, and the page carries the no-warranty and not-advice
# clauses and lists what it does not decide (play counts, game interactions, licences, local prize rules).

hypotheses:
  - claim: >-
      An arcade owner will paste one line per game into a worksheet to decide which cabinets to replace, because the card system reports
      plays but not payback net of prize cost and floor space.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that the profit, payback or break-even arithmetic differs from the stated rules on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/arcade-game-payback-calculator/
  analytics: null
