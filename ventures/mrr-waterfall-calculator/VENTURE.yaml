name: mrr-waterfall-calculator
description: A browser-local calculator that breaks starting MRR into new, expansion, reactivation, contraction, and churned MRR, then reports gross and net revenue retention and the growth-to-loss quick ratio.
stage: prototype
owner: duncan
hypotheses:
  - claim: SaaS founders and operators without a subscription-analytics platform need a fast, no-signup way to compute gross and net revenue retention from their own numbers without exporting customer data.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing gross and net revenue retention side by side from one waterfall is more useful than a single retention percentage, because a strong NRR next to a weak GRR reveals real churn that expansion is masking.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three SaaS operators use the calculator twice within 90 days.
  - Users cannot distinguish gross from net revenue retention after using the tool once.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/mrr-waterfall-calculator/
  analytics: null
