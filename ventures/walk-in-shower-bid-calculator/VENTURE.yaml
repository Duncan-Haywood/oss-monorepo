name: walk-in-shower-bid-calculator
description: A private browser calculator for tile and bathroom contractors that prices a tiled walk-in shower or tub-to-shower conversion from wall and floor tile, waterproofing, linear drain, curbless slope, valve relocate, niches, bench, and glass — and shows the price per square foot of tile, whether matching a brochure alcove per-SF number still pays on a curbless walk-in, whether Saturday / after-hours still pays after overtime, whether a customer-supplied tile set still pays against the $45 / SF labor-only special, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent tile and bathroom contractors will use a drain-and-glass bid calculator because the generic price-per-square-foot-of-tile rules of thumb they are shopped on cannot see that a 5x5 curbless walk-in with a linear drain and frameless glass is a different job from a 5x3 alcove tub-to-shower with the existing valve.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-SF number) are the two figures a contractor actually decides on when a homeowner asks them to match a cheaper tile quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating linear drain, curbless slope, valve relocate, niches, bench, and glass as their own hours, instead of a blended add-on to tile square footage, changes the bid enough that shops notice which part of a high number is the first curbless floor.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing you-supply versus they-bought-it versus they-bought-too-little on the same shower, next to the $45 / SF labor-only special, changes the bid enough that contractors refuse the "just set what I bought" number instead of matching it.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing the brochure alcove, the curbless walk-in, and the steam shower on the same crew rates, next to matching the alcove's price per tile square foot, changes the bid enough that contractors refuse the "just match the $78 / SF special" number on the walk-in they are actually standing in.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing weekday-they-leave versus only-bath-still-in-use versus Saturday / after-hours on the same shower, next to the weekday number they asked you to keep, changes the bid enough that contractors refuse the "just start Saturday" special instead of matching it.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified tile or bathroom contractors use the calculator twice within 90 days.
  - Contractors report that splitting drain, slope, niches, bench, and glass is more work than their existing per-SF method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
