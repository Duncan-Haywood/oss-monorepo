name: real-estate-photographer-shoot-profit-calculator
description: >-
  Free browser calculator for real estate photographers: true hourly earnings of each listing package after drive, shoot, editing and
  admin time, the fee that hits a target hourly rate, add-on (drone, twilight, floor plan) profit and edit-versus-outsource break-even.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check.py top score 0.24 (wedding-photographer-profit-calculator, event work with
# no listing packages, drive-heavy per-shoot economics or editing outsourcing). commercial-photo-license-calculator prices usage licences.
#
# Why this niche: listing photographers sell fixed-price packages by home size but their real constraint is total time per shoot (drive,
# on-site, 1-2 minutes of editing per photo, delivery). Packages are routinely underpriced at the small end and the edit-or-outsource
# decision is made on gut feel. Owner-operators have money (hundreds of shoots a year) and no free worksheet that shows per-hour pay.
#
# First visitor: working listing photographers on r/RealEstatePhotography, Facebook photographer groups and agent-photographer forums
# asking "what should I charge" and "should I outsource editing". Volume not measured with an external tool.
#
# Liability boundary: arithmetic on numbers the user types. No stated market rates, nothing uploaded.
#
# Path to revenue (payment rails stay off): lead magnet and donations. The natural paid layer is a quote-and-booking page with
# package-by-square-footage pricing; not built.

hypotheses:
  - claim: >-
      Listing photographers deciding package prices or whether to outsource editing will use a no-signup worksheet that shows
      earnings per total hour for each tier, and return when prices or editing costs change.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a figure that differs from the stated formulas for the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/real-estate-photographer-shoot-profit-calculator/
  analytics: null
