name: google-contacts-csv-check
description: >-
  Free browser tool that checks a Google Contacts CSV before it is imported: headings Google silently
  skips (Email 1 - Value vs E-mail 1 - Value), mixed current/older layouts, several emails in one cell
  separated the wrong way, malformed emails and phone numbers, numbers Excel turned into scientific
  notation, impossible birthdays, blank rows and rows with nothing to build a contact from, exact
  duplicate rows and emails shared across contacts, each with its line number, plus a safe-fixes pass
  and a splitter. The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05 in a new-venture-first session. Sibling of vcard-contacts-check (same audience,
# the CSV half of the same migration). No venture covers Google Contacts CSV: xero/hubspot/brevo cover
# CRM and accounting imports, vcard covers .vcf. First visitor: someone moving contacts between a
# phone, Outlook, a CRM or a spreadsheet and Google Contacts whose import "came in blank", "skipped
# the email column" or "duplicated everyone"; search phrases like "google contacts csv import not
# working", "google contacts csv format", "import csv google contacts duplicates". Volume not measured
# with an external tool.
#
# What makes it more than a CSV linter: it models Google's two column layouts and numbered groups
# (E-mail N, Phone N, Address N...), the ::: multi-value separator, and the fact that an unrecognised
# heading drops its whole column without any message. It refuses to repair what cannot be recovered
# (4.41E+11 phone numbers, ZIPs that lost a zero, ambiguous 03/04 birthdays) and never merges people.
#
# Privacy is the liability boundary: a contacts file is personal data about third parties, so the file
# never leaves the browser (a test asserts no network calls).
#
# Path to revenue (payment rails stay off): lead magnet for the IT-support and CRM-migration audience,
# sibling to the vCard, HubSpot and Xero contacts checkers. A paid version, if usage appears, is bulk
# checks across client files behind an env-var switch; not built.
#
# Liability: format checks on the user's own file, rules stated as read from memory, no warranty,
# independent-of-Google clause, trademark used nominatively.
