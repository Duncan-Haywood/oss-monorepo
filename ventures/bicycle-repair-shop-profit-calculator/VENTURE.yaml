name: bicycle-repair-shop-profit-calculator
description: >-
  Free browser calculator for independent bike shops: enter repair, tune-up and overhaul prices, bench minutes, parts, mechanic pay, tools and rent, and see
  profit per job and per bench hour, the price each job needs for a target margin, what a prepaid service plan earns per visit, break-even volume and the
  season at different volumes against the bench hours available. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-11 in a scheduled session. No venture models a bicycle repair shop (checked ventures/ by name and by the machine-and-bench neighbours,
# ski-snowboard-tune-shop-profit-calculator and mobile-mechanic-visit-pricing-calculator). A bike shop sells a short, weather-driven season of flat
# repairs, tune-ups and overhauls that share one mechanic's bench hours, and increasingly a prepaid service plan consumed later. Not in screened-out.md.
#
# First visitor: independent bike shop owners and mobile bike mechanics searching "how much to charge for a bike tune-up", "bike shop profit margin" and
# "bike service plan pricing". Timing: spring tune-up rush. Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; says it is not an estimate of record; says what is not modelled; carries
# the no-warranty and no-SLA clauses. Gives no bicycle-safety or repair advice.
#
# Path to revenue (payment rails stay off): lead magnet and donations.

hypotheses:
  - claim: >-
      Bike shop owners will type a season's jobs, bench minutes and fixed costs into a no-signup calculator to set repair and tune-up prices and to decide
      on a prepaid service plan, because most price by copying the shop down the road and never cost the bench hour.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/bicycle-repair-shop-profit-calculator/
  analytics: null
