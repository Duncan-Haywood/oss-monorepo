name: sewer-hydrojet-bid-calculator
description: A private browser calculator for drain-cleaning and plumbing shops that prices a sewer camera inspection or hydro-jet from extra footage past the included run, access (cleanout versus toilet pull versus new cleanout), roots and grease, hose distance from the truck, and a camera warranty pass — and shows the price per extra foot, the hours the first toilet-pull actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent drain-cleaning shops will use a footage-and-access bid calculator because the generic "$149 drain special" or published hydro-jet price they are shopped on cannot see that a 50-foot cable from an existing cleanout is a different job from a 140-foot main with a toilet pull, roots, and a camera pass.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-job special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper cable-machine quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra footage, access method, roots, grease, hose run, and a camera warranty pass as their own hours, instead of a blended add-on to a trip charge, changes the bid enough that shops notice which part of a high number is the first toilet pull.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified drain-cleaning or plumbing shops use the calculator twice within 90 days.
  - Shops report that splitting footage, access, and jet versus cable is more work than their existing trip-charge method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
