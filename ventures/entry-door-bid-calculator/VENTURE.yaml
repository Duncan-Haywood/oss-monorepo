name: entry-door-bid-calculator
description: A private browser calculator for door and carpentry shops that prices an entry-door replacement from sidelights, transom, out-of-square openings, jamb and sill rot, brickmold, storm door, and paint — and shows the hours the first sidelight unit actually consumes and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent door shops will use an opening-and-extras bid calculator because the generic "$1,200 installed" steel-entry-door special they are shopped on cannot see that a 36-inch prehung in a square one-story opening is a different job from a fiberglass unit with two sidelights, a transom, eight feet of rot, brickmold, and a storm door.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published installed special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper entry-door quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating sidelights, an out-of-square opening, rot, brickmold, a storm door, and paint as their own hours, instead of a blended add-on to a $1,200 special, changes the bid enough that shops notice which part of a high number is the first sidelight.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified door or carpentry shops use the calculator twice within 90 days.
  - Shops report that splitting the opening and extras versus a 36-inch steel special is more work than their existing per-door method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/entry-door-bid-calculator/
  analytics: null
