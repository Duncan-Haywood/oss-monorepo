name: backyard-honey-profit-calculator
description: 'Free, zero-network browser calculator for backyard beekeepers who sell honey: enter hives, yield per hive, winter losses, mite treatment, equipment, jars, hours and your wage, and get cost per pound, profit per hour, the price per pound you need to earn a wage, and what a poor honey year and a bad winter do to it. Arithmetic on the numbers the user types, not accounting, tax or food-safety advice.'
stage: prototype

owner: duncan

# Calculator archetype, earn-more: hobby beekeepers price honey by feel and never count winter-loss replacements, mite treatment, equipment or their own hours.
# Checked 2026-10-03: no honey or beekeeping venture exists in ventures/; not in screened-out.md; closest are backyard-egg-profit-calculator and farmers-market-booth-calculator.
#
# First visitor: searches "how much to charge for a pound of honey", "is selling honey profitable", "cost of beekeeping";
# r/Beekeeping, local beekeeping club forums, Facebook groups and farmers-market sellers. Volume not measured with an external tool.
# A hosted version that logs hive inspections, harvest weights and customer orders is the natural paid upgrade.
hypotheses:
  - claim: A hobby beekeeper will enter their own winter losses, treatment and hours, see profit per hour far below the wage they wanted, and raise the price or change how they sell.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Visitors arrive for what to charge per pound at least as often as for profit per hour.
    status: untested
    checked: null
    evidence: in-repo

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the page computes only typed values in the visitor's own browser; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - No beekeeper reports changing a price or a sales channel because of what the tool showed within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/backyard-honey-profit-calculator/
  analytics: null
