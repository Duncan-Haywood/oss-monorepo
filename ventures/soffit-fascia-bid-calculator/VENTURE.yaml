name: soffit-fascia-bid-calculator
description: A private browser calculator for roofing and siding contractors that prices soffit and fascia from eave lineal feet, aluminum wrap versus vinyl replace versus wood replace, 1-story versus 2-story versus 3-story access, and extras — and shows the extra-work share and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent roofing and siding contractors will use a wrap-versus-replace bid calculator because the generic "$12 / LF soffit and fascia wrap special" they are shopped on cannot see that a 1-story ranch wrap-over-existing is a different job from a two-story wood replace with rot, gutter detach, extra corners, and pump jacks.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the extra-work share (not the published wrap dump) are the two figures a contractor actually decides on when an owner asks them to match a cheaper wrap quote on a wood-replace job.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing wrap, vinyl replace, and wood replace on the same eave, with story hours and a rot invoice, changes the bid enough that contractors notice which scope keeps the margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified roofing or siding contractors use the calculator twice within 90 days.
  - Contractors report that splitting wrap, replace, and extras is more work than their existing per-foot method without changing the price they would have bid.
  - The starting hours and coil rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/soffit-fascia-bid-calculator/
  analytics: null
