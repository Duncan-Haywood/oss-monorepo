name: mini-split-bid-calculator
description: A private browser calculator for HVAC installers that prices a ductless mini-split job from indoor heads, line-set extras, head type, story height, electrical extras a per-head quote hides, and margin — then shows price per head, crew hours, and the walk-away number.
stage: prototype
owner: duncan
hypotheses:
  - claim: Mini-split installers will use a bid calculator that prices line-set extras, head type, and story height separately because a flat per-head rule treats a first-floor 12k wall-mount as the same job as a second-story cassette with a 50 ft run and a new 240 V circuit.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the price per head that still covers extras are the two numbers an installer decides on when a homeowner asks them to match a cheaper quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Electrical and condensate extras that do not scale with head count change the bid materially on single-zone jobs, which is where per-head matching is most common.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified mini-split installers use the calculator twice within 90 days.
  - Installers report that splitting line-set extras and head type is more work than their existing per-head method without changing the price they would have bid.
  - The starting head-type or story factors prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
