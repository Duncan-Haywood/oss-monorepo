name: uk-pension-withdrawal-tax-calculator
description: >-
  Free browser tool for UK over-55s taking money from a defined-contribution pension: enter the withdrawal and other income to see the 25% tax-free share, the tax actually owed, the emergency-tax overpayment to reclaim (P55/P53Z/P50Z), the money purchase annual allowance trigger and how much spreading it over tax years saves. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-14 in a new-venture-first session; duplicate_check.py closest match was retirement-withdrawal-sequencer (0.29, US account-order planner) -- no UK pension tax tool exists in ventures/.
#
# First visitor: a UK 55-70 year old about to take a lump sum, searching "pension withdrawal tax calculator UK", "UFPLS tax calculator", "emergency tax pension refund P55", "how much tax on 40000 pension withdrawal". Large, evergreen, high-intent query family fed by MoneySavingExpert and r/UKPersonalFinance threads on emergency tax; volume not measured. Rivals are provider and adviser calculators (Hargreaves Lansdown, Aviva, MoneyHelper) that gate behind a login or lead capture.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: multi-year drawdown planner with state pension and ISA ordering behind an env-var switch; referral to FCA-regulated advisers would need owner approval.
#
# Liability: 2026/27 thresholds (personal allowance, bands, lump sum allowance 268,275, MPAA 10,000, taper from 100,000) were written from memory without network access and are flagged for GOV.UK verification on the page. Emergency tax is an approximation of the 1257 M1 treatment. Scotland is refused. The page states it is not tax or financial advice, points to Pension Wise and regulated advisers, and warns about pre-55 withdrawals and scams guidance.
hypotheses:
  - claim: >-
      UK people about to withdraw pension money will use a free calculator to see the tax, the emergency tax refund and the saving from spreading withdrawals.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a rate or threshold differs from GOV.UK guidance on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-pension-withdrawal-tax-calculator/
  analytics: null
