name: saas-renewal-planner
description: 'Free, zero-network, zero-dependency browser tool and CLI for founders, finance and IT leads: paste your SaaS subscriptions (renewal date, cancellation notice days, auto-renew, seats paid and used, proposed price increase) and get the last day to give notice for each auto-renewal, the renewals ranked by what negotiating could save, floor and stretch target prices (right-sized seats at today''s per-seat price, no uplift, then your extra ask), an email draft per vendor and an .ics calendar of the deadlines. Numbers are the ones the user supplies, not a quote.'
stage: prototype

owner: duncan

# Calculator/CLI archetype, save-money for businesses: the buyer-side view across a whole renewal list.
# Checked 2026-10-02: ventures/ has saas-seat-true-up (seat waste for one subscription), subscription-price-impact
# (seller-side price rises vs churn) and saas-annual-plan-discount-calculator (seller-side prepay discount); none
# tracks auto-renewal notice deadlines across many vendors or ranks which renewal to negotiate first. duplicate_check.py
# scored the nearest venture 0.19. Not in screened-out.md.
#
# First visitor: searches "SaaS renewal calendar", "auto-renewal notice period tracker", "how to negotiate SaaS renewal",
# "reduce SaaS spend"; r/sysadmin, r/startups and finance-ops communities. Volume not measured with an external tool.
# Paid tools (Vendr, Tropic, Zylo) target larger buyers with a percentage-of-savings or per-seat fee; a free, local,
# no-integration planner is the lead magnet, and a hosted version that reads invoices and pings Slack before each notice
# date is the natural paid upgrade.
hypotheses:
  - claim: A founder or ops lead will paste their subscription list, see which notice windows are about to close and what right-sizing is worth, and act on at least one renewal.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Users will download the .ics deadlines and return before the next renewal cycle.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool analyses only pasted text in the
  # visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No user reports changing a renewal, a seat count or a price because of what the tool showed within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/saas-renewal-planner/
  analytics: null
