name: databricks-cluster-cost-advisor
description: 'Free, zero-network, zero-dependency CLI + browser tool that reads a list of Databricks clusters (kind, DBUs used, autotermination, DBU rate, starts), prices them in dollars, flags scheduled work running on pricier all-purpose compute instead of Jobs compute, clusters with autotermination off and long autotermination tails, and prints the setting to change; usable as a CI check. Numbers are supplied by the user and DBU prices are editable, not a bill.'
stage: prototype

owner: duncan

# CLI/checker archetype (portfolio/pipeline/README.md "archetype itself").
# Sibling of snowflake-warehouse-cost-advisor, bigquery-query-cost-advisor and
# cloudwatch-logs-cost-advisor in the cloud-cost-from-pasted-numbers family.
# Checked 2026-10-02: nothing in ventures/ prices Databricks clusters. Not in
# screened-out.md. Same archetype as snowflake-warehouse-cost-advisor on a
# different vendor.
#
# Where the first real visitor would come from: the search phrases "databricks
# cost optimization", "databricks jobs compute vs all purpose", "databricks
# autotermination", "reduce databricks dbu cost"; r/databricks and
# r/dataengineering threads about a surprise DBU bill. The reader is a data or
# platform engineer whose Databricks line is five or six figures a year.
# Adjacent tools (Databricks' own usage dashboards, Sync Computing, Unravel,
# Revefi and other FinOps vendors) need workspace access or a contract; this
# works on pasted rows with no access and names the setting to change -- the
# wedge. A hosted monitor reading system.billing.usage read-only and alerting
# on new all-purpose scheduled work is the natural paid upgrade.
hypotheses:
  - claim: A data engineer with a Databricks bill will search for it, paste a cluster list, and leave knowing which scheduled workloads should move to Jobs compute and which clusters never terminate, with the setting to change.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A platform team will run the CLI on a schedule against a system.billing.usage export with --fail-on warn so new scheduled work on all-purpose compute is flagged before the invoice.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool analyses only pasted text in the
  # visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No external repository is found wiring cli.mjs into its own CI within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/databricks-cluster-cost-advisor/
  analytics: null
