name: winery-excise-tax-calculator
description: >-
  Free browser calculator for wineries and cideries: enter cases, bottles and bulk gallons removed in a year by category (still,
  fortified, sparkling, carbonated, hard cider) and get the federal excise tax before and after the Craft Beverage Modernization
  Act credit ($1.00, $0.90, $0.535 per wine gallon across 30,000 / 130,000 / 750,000 gallons), the effective rate, the tax inside
  each bottle, and a growth table showing the credit stepping down. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. Nearest ventures are the beverage-tax siblings brewery-excise-tax-calculator and
# distillery-excise-tax-calculator (beer barrels and spirits proof gallons); wine gallons, five rate bands and cider credits
# are a different computation. vineyard-grape-vs-wine-calculator is a grower decision, not a tax tool.
#
# Why this niche: roughly 11,000 US bonded wineries and a growing cider sector pay federal excise tax on removals, and the CBMA
# credit turns a $1.07 gallon into $0.07 and then steps back up as volume grows. Owners rarely know the per-bottle tax or what
# crossing 30,000 and 130,000 gallons costs; TTB's return computes tax but not per-bottle cost or growth.
#
# First visitor: winemakers, cidermakers and bookkeepers searching "wine excise tax calculator", "CBMA wine tax credit",
# "federal excise tax per bottle of wine", "hard cider tax rate". Volume not measured with an external tool.
#
# Liability boundary: arithmetic over volumes the user types in; nothing stored; not tax advice; states what is not modelled
# (state tax, wine over 24% ABV, importers, drawback, losses, controlled-group apportionment detail, actual filing) and carries
# the no-warranty and no-SLA clauses. Rates cited from IRC 5041 as amended by the CBMA; verify against current TTB guidance.
#
# Path to revenue (payment rails stay off): lead magnet into the beverage-maker cluster plus donations. A paid layer (TTB Form
# 5000.24 worksheet export, multi-site controlled-group tracking, state tax tables, wine-club sales-tax) needs accounts, so an
# owner decision; not built.

hypotheses:
  - claim: >-
      Winemakers, cidermakers and bookkeepers will type cases and bottles into a no-signup calculator to see excise tax per
      bottle and the cost of growing past the CBMA credit tiers, because their TTB return computes the tax but not what it adds
      to a bottle price or to growth.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing the credit step down at 30,000 and 130,000 gallons changes how wineries and cideries plan expansion and price
      wholesale.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Winemakers report that state tax or controlled-group apportionment is the common need, at which point the tool should model it.

