name: ai-engineering-academy
description: Hands-on AI engineering interactive sandbox and agent architecture learning platform.
stage: prototype
verify: npm --prefix site test && npm --prefix site run build

owner: duncan

hypotheses:
  - claim: Software engineers and teams will pay $49/mo subscription for interactive multi-agent and tool-calling sandbox tracks.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 40
  protected: true

kill_criteria:
  - Fewer than 50 active learners after 60 days post-launch.
  - description: >-
      $150 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 150
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  production: null
  analytics: null

engineering:
