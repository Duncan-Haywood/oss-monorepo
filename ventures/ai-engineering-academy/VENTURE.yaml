# Copy to ventures/<name>/VENTURE.yaml and fill in.
# This file is the contract between a venture and the portfolio router.

name: ai-engineering-academy
description: >-
  An AI-mentored, project-first engineering education platform (starting with
  Electrical Engineering) that helps undergrad/grad engineering students,
  software-to-hardware career-changers, and self-directed adult learners
  worldwide become world-class engineers by building real, portfolio-worthy
  products instead of sitting through lectures and exams.

# idea | prototype | launched | revenue | scaling | winding-down
# Stage gates how much the router is willing to spend before demanding
# an outcome signal.
stage: idea

owner: duncan

# What has to be true for this to be worth continuing. The router does not
# read prose, but you do — keep these honest and dated.
hypotheses:
  - claim: >-
      Software engineers and engineering students moving into physical
      engineering will pay for an AI-mentored, project-first curriculum that
      produces real, demo-able hardware portfolio pieces (vs. free
      alternatives like MIT OCW, Coursera, or Hackster.io).
    status: untested        # untested | supported | refuted
    checked: null           # YYYY-MM-DD
  - claim: >-
      An AI mentor can give engineering design feedback (schematic review,
      calculation checking, cost/manufacturability critique) that learners
      trust and act on without a human double-checking it, on the large
      majority of interactions.
    status: untested
    checked: null

# Where the money is. Nulls are fine early; the router treats an unmeasured
# venture differently from one measured at zero.
economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

# Caps agent spend so one venture cannot drain the portfolio.
# Unit is USD of model spend per month.
budget:
  monthly_cap: 50
  # Explore budget is protected: early ventures get funded even when their
  # measured return is zero, otherwise the router starves everything new.
  protected: true

# Stop conditions. When one trips, the router stops allocating and flags it.
kill_criteria:
  - >-
    No working MVP (Electrical Engineering track — Circuits, Electronics,
    Embedded Systems — with a functioning AI mentor and portfolio system)
    shipped to any real learner within 12 months of active build start.
  - >-
    Fewer than 100 committed founding-cohort learners recruited and actively
    building within 90 days of the MVP/waitlist going live publicly.

links:
  production: null
  analytics: null
