# Any box with Docker:
#   ADMIN_KEY=$(openssl rand -hex 16)  docker compose up -d
# Put it behind HTTPS (Caddy, nginx, a tunnel) before real use.
services:
  support-agent:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      STATE: /data/state.json
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      HANDOFF_WEBHOOK_URL: ${HANDOFF_WEBHOOK_URL:-}
      KB_SOURCE_URL: ${KB_SOURCE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LOG_DAYS: ${LOG_DAYS:-90}
volumes:
  state:
