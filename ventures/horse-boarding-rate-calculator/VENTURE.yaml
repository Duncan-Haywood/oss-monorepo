name: horse-boarding-rate-calculator
description: >-
  Free browser tool for horse boarding barn owners: enter stalls, occupancy, hay, grain, bedding, chore labour, land,
  insurance, utilities, repairs and a profit target, and see the monthly board rate per stall, the break-even rate,
  the rate needed at each occupancy, and how the rate you charge now performs. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06 in a new-venture-first session. duplicate_check scored the nearest existing venture 0.22; no
# equine boarding tool in ventures/, not in screened-out.md. Neighbour: farrier-visit-pricing-calculator (same buyer
# community). Searches by barn owners: "how much to charge for horse boarding", "horse boarding rates calculator",
# "is a boarding barn profitable".
#
# Who: small boarding barn owners (8-30 stalls) and people considering opening one. Rates are usually copied from the
# nearest barn, and feed, labour and vacancy are not priced in. First visitor: an owner facing a hay price rise.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. A boarder billing and
# feed-schedule tool is the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with visible rules; carries the no-warranty and not-advice
# clauses and lists what is not decided (market rates, waivers, insurance, tax, zoning).
#
# Unverified: no market rate is claimed; the sample figures are illustrative only.

hypotheses:
  - claim: >-
      A boarding barn owner facing higher hay prices will enter feed, labour and occupancy to see the break-even
      occupancy at the current rate, because rates are normally copied from neighbouring barns.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool by 2027-03-15.
  - A report that the rate arithmetic differs from the stated rules on the same inputs.
