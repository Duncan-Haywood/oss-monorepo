name: uk-self-employed-tax-set-aside-calculator
description: >-
  Free browser tool for UK sole traders and freelancers: enter income and expenses to see income tax, Class 4 NIC, student loan, payments on account and how much of every invoice to set aside. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-14 in a new-venture-first session; sibling set-aside tools exist for Australia, Canada, Ireland and New Zealand, none for the UK, the largest freelancer market of the five.
#
# First visitor: UK freelancers and contractors searching "how much tax should I set aside self employed UK". Evergreen, peaks before the 31 January self assessment deadline; volume not measured. Rivals are accountant blog calculators and HMRC's own tools, none of which show the payments-on-account cash call next to the set-aside figure.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Not built: Scottish bands, pension relief, Marriage Allowance, invoice-by-invoice tracker behind an env-var switch.
#
# Liability: 2025/26 and 2026/27 HMRC rates and student loan thresholds written from published figures and memory; every result tells the reader to verify on gov.uk, carries no-warranty and not-tax-advice clauses and says what it does not decide.
hypotheses:
  - claim: >-
      UK self-employed people will use a free private calculator to learn what share of each invoice to set aside, because rules of thumb ignore their own expense level, Class 4 NIC, payments on account and student loan.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: GBP
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that an HMRC figure differs from the official source.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-self-employed-tax-set-aside-calculator/
  analytics: null
