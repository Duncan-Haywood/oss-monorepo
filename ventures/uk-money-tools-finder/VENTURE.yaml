name: uk-money-tools-finder
description: >-
  Free browser page that routes a UK taxpayer, landlord, contractor, director or small employer to the right one of 45 free UK tax, pay and employment calculators: tick the situations that apply and get a ranked list with a one-line description of each. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Built 2026-10-14. ventures/ held 27 uk-* calculators and no page that connected them: each is a separate landing page for one long-tail query, so a visitor with a neighbouring question had no route to the right sibling.
#
# First visitor: someone who searched a broad query ("UK tax calculators", "which tax calculator do I need", "self employed tax tools UK") or arrived on one UK tool and needs the next. Volume not measured. Its second job is internal linking: every UK tool now has a crawlable, ItemList-marked hub to be linked from.
#
# Path to revenue (payment rails stay off): lead magnet and traffic router for the UK cluster; GitHub Sponsors. Paid version, not built: an accountant-referral or bookkeeping-software affiliate slot per situation behind an env-var switch.
#
# Liability: it computes nothing and states no rate; each linked tool carries its own sources and disclaimers. This page has the no-warranty, not-tax-advice and no-SLA clauses. Ethical risk is sending someone to a tool that does not fit their facts; mitigated by saying each tool lists what it does not model.
hypotheses:
  - claim: >-
      UK visitors with a tax or pay question will use a situation checklist to reach the right calculator, and will open a second tool they did not search for.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that the finder sends a situation to a tool that cannot answer it.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-money-tools-finder/
  analytics: null
