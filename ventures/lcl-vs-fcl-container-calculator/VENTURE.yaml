name: lcl-vs-fcl-container-calculator
description: >-
  Free browser calculator for importers and small sellers: enter cargo CBM and weight, a forwarder's LCL quote and full-container quotes
  (20', 40', 40' high cube) and see which is cheaper, the break-even volume at your cargo's density, the extra stock-carrying cost of LCL
  transit days and the freight cost per unit. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check scored the nearest ventures 0.18 (container-demurrage-detention-calculator,
# which is post-arrival fees) and lower; none compares shared versus full-container ocean freight.
#
# First visitor: importers and Amazon FBA / Shopify sellers searching "LCL vs FCL", "LCL vs FCL calculator", "when is FCL cheaper than LCL",
# "how many CBM fit in a 20ft container", and the r/FulfillmentByAmazon, r/importing and r/ecommerce threads asking whether to book
# a full container. Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; not legal, tax or financial advice; says what is not
# modelled (surcharges, duty, insurance, drayage, demurrage) and carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations; a freight-forwarder or sourcing-platform referral would need owner approval.

hypotheses:
  - claim: >-
      Small importers will type their LCL and full-container quotes into a no-signup calculator to find the break-even volume and cost per
      unit, because forwarders quote LCL per CBM and containers per box and never show where one overtakes the other.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/lcl-vs-fcl-container-calculator/
  analytics: null
