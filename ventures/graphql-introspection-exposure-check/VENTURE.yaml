  protected: true

kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - Every major GraphQL server library switches its default to
    introspection-off in production (Apollo Server has already done this in
    current major versions) and no equivalent regression risk (a config
    flag flipped back on, a third-party server library that hasn't
    followed) remains to check for -- at which point the check would be
    testing a problem that no longer exists by default.

