name: wheelchair-ramp-bid-calculator
description: A private browser calculator for accessibility and deck crews that prices a residential wheelchair ramp from rise-to-run geometry, the landings a lineal-foot special cannot see, both-side handrails, surface, demo, and permit — and shows the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Accessibility and deck crews will use a landing-aware ramp bid calculator because a published price-per-lineal-foot special cannot see the 5×5 landings, rest platforms, and switchback turns that are a third or more of the walking surface.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the landing share of walking surface are the two numbers a contractor actually decides on when a prospect asks them to match an $85/lf coupon, more than the job price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A 36-inch rise that forces a rest landing changes the resulting bid materially versus the same coupon written for a 24-inch straight run, so making that landing a required, explained output changes the price they send.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified accessibility or deck contractors use the calculator twice within 90 days.
  - Contractors report that counting landings is more work than their existing lineal-foot method without changing the price they would have bid.
  - The starting slope and landing figures prove so far from real crews' practice that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/wheelchair-ramp-bid-calculator/
  analytics: null
