name: teachers-pay-teachers-earnings-analyzer
description: >-
  Free browser tool that turns a Teachers Pay Teachers seller sales CSV into the
  service fee actually observed, take-home per order, net revenue per product and
  buyer, repeat-buyer share, refunds, withdrawal costs, funds still clearing and
  the price needed for a target take-home. The file is read locally and never
  uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-04 in a new-venture-first session. duplicate_check.py closest hits:
# fiverr-earnings-fee-analyzer (0.57) and gumroad-sales-fee-analyzer, same archetype on other
# platforms; nothing reads a Teachers Pay Teachers seller's sales file. Engine adapted from
# gumroad-sales-fee-analyzer (tested CSV reader, per-product net, repeat buyers, break-even).
#
# First visitor: teacher-authors in the TPT seller communities (r/TeachersPayTeachers, TPT
# seller Facebook groups) asking "how much does TPT take", "TPT fee calculator", "is premium
# worth it". Volume not measured with an external tool.
#
# What makes it more than a sum: the observed fee rate (percentage plus the flat per-sale fee
# that bites hardest on $1-$4 resources) read from the file, not assumed; per-resource net and
# take-home; repeat buyers; the price needed for a target take-home. The file never leaves the
# browser, so the portfolio holds no seller data.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Nothing paid.
#
# Liability: arithmetic on the user's file and typed costs; default 20% + $0.30 is an
# assumption stated on the page and editable; no tax or financial advice; independent-of-TPT clause.
#
# Unverified: column names are guesses matched by alias; no real TPT export was available.
# First user report of an unread file is the priority fix.

hypotheses:
  - claim: >-
      Teachers Pay Teachers sellers will run a no-signup analysis of an earnings export they
      already hold to see their real take-home and what to charge, before building
      a spreadsheet.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing net per product, repeat-buyer share and the price needed for a target
      take-home changes at least one product price or product priority, which is the
      reason to come back with each new export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong take-home figure, or a real export the tool cannot read, at which point the parser needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/teachers-pay-teachers-earnings-analyzer/
  analytics: null
