name: brrrr-calculator
description: >-
  Free browser tool for real estate investors running the BRRRR method (buy,
  rehab, rent, refinance, repeat). Turns price, rehab, hard-money terms, ARV
  and refinance terms into cash invested, refinance cash-out, cash left in the
  deal, post-refinance cash flow and DSCR, the highest purchase price that
  pulls every dollar out, and appraisal, rehab-overrun and rate stress tables.
  Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-30 in a new-venture-first session. duplicate_check.py: top
# match 0.14 (storage-auction-max-bid-calculator, unrelated); the sibling
# rental-dscr-calculator scores 0.12 and covers a different decision (sizing a
# long-term loan on a finished rental, not the rehab-to-refinance cash math).
# BRRRR investors decide whether a deal recycles their capital on one number,
# cash left in the deal, and the failure that hurts is a low appraisal or a
# rehab overrun, which the refinance does not cover. The tool's edge is
# solving for the max purchase price and stressing the appraisal, with no
# signup and no lead capture.
#
# First visitor: r/BRRRR, r/realestateinvesting and r/Flipping threads asking
# "does this BRRRR deal work", BiggerPockets forum threads, searches "BRRRR
# calculator" and "BRRRR method calculator"; volume not measured with an
# external tool.
#
# Privacy is the liability boundary: deal numbers never leave the browser (tests
# assert no network calls). No lender is named. Refinance limits are numbers the
# user enters; the tool states no lender rule.
#
# Path to revenue (payment rails stay off): lead magnet and donations only.
# Liability: illustrative estimates, not advice; omissions stated on the page.
# Unverified: hand calculation and unit tests only.

hypotheses:
  - claim: >-
      BRRRR investors will use a no-signup tool that solves for the highest
      purchase price that leaves no cash in the deal and stresses the appraisal.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      The appraisal and rehab-overrun stress tables are what people screenshot
      or quote when discussing a deal.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that cash left in the deal contradicts their own arithmetic on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/brrrr-calculator/
  analytics: null
