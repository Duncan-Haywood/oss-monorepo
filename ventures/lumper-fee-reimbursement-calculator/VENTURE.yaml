name: lumper-fee-reimbursement-calculator
description: >-
  Free browser calculator for owner-operators, small carriers and dispatchers: enter the lumper receipt, the dock wait and each way a broker
  might reimburse it (advance code, pay and bill the invoice, partial or capped), and see what you are out on each route, the request that
  would make you whole, and what the wait cost. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check scored the nearest ventures at 0.17 (ucr-fee-calculator) and below;
# truck-detention-pay-calculator covers detention time only, not the lumper receipt, advance fees, caps or days until repaid.
#
# First visitor: owner-operators and drivers searching "lumper fee reimbursement", "who pays lumper fees", "comchek lumper fee", and the
# r/Truckers and r/FreightBrokers threads asking whether a broker must pay a lumper. Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; not legal, tax or financial advice; says what is not
# modelled (taxes, factoring, short-pays, contract terms, state law) and carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations; a fuel-card or factoring referral would need owner approval.

hypotheses:
  - claim: >-
      Owner-operators will type a lumper receipt and a broker's reimbursement terms into a no-signup calculator to see what the stop
      really cost them, because brokers quote "we'll reimburse with a receipt" and never the fee, cap or wait.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/lumper-fee-reimbursement-calculator/
  analytics: null
