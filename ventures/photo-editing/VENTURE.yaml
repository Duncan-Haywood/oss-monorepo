name: photo-editing
description: Batch automated photography editing, color calibration, and catalog processing service.
stage: prototype
verify: pytest tests && npm --prefix docs-site run typecheck && npm --prefix docs-site test && npm --prefix docs-site run build

owner: duncan

hypotheses:
  - claim: Professional photographers will pay $0.25/photo for automated raw color calibration and catalog delivery.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 35
  protected: true

kill_criteria:
  - Batch render throughput fails to process 1,000 images per hour.
  - description: >-
      $100 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 100
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  production: null
  analytics: null
