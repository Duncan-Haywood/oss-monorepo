  monthly_cap: 30
  protected: true

kill_criteria:
  - No end-to-end run (real card ingest through a rendered Instagram deliverable) completed on real footage within 90 days.
  - A dry-run/adapter boundary fails to hold once a real renderer (ffmpeg/Core Image/Metal) is wired in, i.e. source media is ever modified or deleted.

