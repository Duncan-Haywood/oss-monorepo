name: docs-site

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/*.html"
      - "docs/*.md"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "docs/*.html"
      - "docs/*.md"
      - ".github/workflows/docs-site.yml"

defaults:
  run:
    working-directory: docs-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci

      # The catalog entry for ventures/photo-editing/docs-site declares
      # typecheck, test and build. This workflow ran build alone until
      # 2026-08-04 — it sat outside every workflow control's input, so the two
      # missing gates cost nothing to leave out. Both scripts exist in
      # docs-site/package.json; `typecheck` regenerates the docs before tsc,
      # and `test` covers the HTML-to-JSX conversion, the generated-docs
      # freshness check and the route auth posture.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DOCS_SITE_PASSWORD: ci-docs-password
          DOCS_SITE_TOKEN: ci-build-placeholder-token-32chars
