# Lint/type configuration only. ShootFlow is stdlib-only and is not packaged
# or installed — there is deliberately no [project] or [build-system] table.

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/shootflow"]
ignore_missing_imports = true
