name: pool-route-pricing
description: Free browser-local recurring pool service route pricing calculator that includes service labor, drive time, chemicals, overhead, and target margin.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent pool service operators will use a route-level calculator to set a minimum monthly account price instead of pricing only the minutes spent at the pool.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Searchers asking how to price weekly pool service are underserved by generic hourly calculators because route density, chemical allowance, and recurring visits change the economics.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 10
  protected: true
kill_criteria:
  - No repeat usage or organic repository traffic within 60 days of a public URL.
  - No unsolicited feedback, star, fork, or referral within 90 days of publishing.
links:
  production: null
  analytics: null
