name: quick-pick-survey
description: Pairwise-comparison preference engine (Glicko-2 + Bradley-Terry) that infers a person's — or a couple's — preference ordering, including trade-offs they couldn't state directly.
stage: prototype

owner: duncan

hypotheses:
  - claim: People (individually or as linked couples) will use, and eventually pay for, a pairwise-comparison tool that reveals preferences and cross-partner mismatches they couldn't state directly.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 20
  protected: true

kill_criteria:
  - No real (non-test) respondent completes a full survey within 90 days of a public deploy.
  - CI never allocating a runner and the unmerged-PR queue are not resolved within 90 days, blocking further agent-driven progress.

