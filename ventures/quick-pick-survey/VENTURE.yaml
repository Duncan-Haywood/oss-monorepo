kill_criteria:
  - No real (non-test) users complete enough comparisons to produce a converged, usable ranking (see docs/CONVERGENCE.md).
  - CI never actually runs (GitHub Actions never allocates a runner per README) and this is not resolved, leaving quality enforcement solely manual indefinitely.
  - No linked-couple pair ever uses the partner-perception comparison feature that is the product's sharpest differentiator.

