name: quick-pick-survey
description: Adaptive pairwise-comparison preference engine that infers a person's preference ordering, including where linked partners misjudge each other, from paired choices.
stage: prototype

owner: duncan

hypotheses:
  - claim: People will complete enough pairwise comparisons, alone or as a linked couple, that the resulting preference and partner-gap output is worth paying for or sharing.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 30
  protected: true

kill_criteria:
  - No couple completes both linked surveys and views the comparison output within 90 days.
  - The CI pipeline remains unable to allocate a runner (see README) for more than 60 days, leaving `npm run verify` as the only enforcement.

links:
  production: null
  analytics: null
