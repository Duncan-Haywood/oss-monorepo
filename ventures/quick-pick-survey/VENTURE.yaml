# Copy to ventures/<name>/VENTURE.yaml and fill in.
# This file is the contract between a venture and the portfolio router.

name: quick-pick-survey
description: Pairwise-comparison preference engine (Quick Pick) — surfaces a person's preference ordering, and where linked partners disagree about each other, from a short sequence of two-option picks.
stage: prototype

owner: duncan

hypotheses:
  - claim: People will complete enough pairwise comparisons, alone or as a linked couple, to produce a preference result worth paying for or sharing.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 20
  protected: true

kill_criteria:
  - CI (.github/workflows/ci.yml) has not been sorted out and `npm run verify` becomes the sole enforcement for 90+ days without owner action.
  - No linked-couple session is completed by anyone outside the owner within 90 days.

links:
