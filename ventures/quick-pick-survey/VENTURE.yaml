name: quick-pick-survey
description: Pairwise-comparison preference engine using Glicko-2 and Bradley-Terry rating models.
stage: prototype
verify: npm run typecheck && npm run lint && npm test && npm run build

owner: duncan

hypotheses:
  - claim: Pairwise comparisons yield higher user engagement and more accurate preference rankings than standard rating forms.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 30
  protected: false

kill_criteria:
  - Unmaintained infrastructure or unmerged PR backlog prevents automated deployments.
  - Active participant retention drops below 10% after 30 days.
  - description: >-
      $100 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 100
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  production: https://pairwise.marisstella.dev
  analytics: null

engineering:
  verify_command: npm run typecheck && npm run lint && npm test && npm run build
  ci_component: quick-pick-survey
  coverage:
    lines: 90
    functions: 90
    statements: 90
    branches: 85
  critical_paths: []
  slo:
    availability: null
    latency: null
    correctness: null
  gitops:
    desired_state: null
    immutable_artifact: true
  security:
    threat_model: null
    data_classification: human-subject, credentials
    scan_profile: source, history, dependencies, licenses, IaC, container, image
  measurement:
    outcome: >-
      Per-browser-session funnel over a rolling 30 days: route view, survey
      start, question load, answer save, insights reached, feedback opened;
      plus the referral loop — invite created, invite entered, invite or
      insight shared — with failures recorded separately from successes.
    decision_supported: >-
      Whether the couples tier is worth a payment path. hypotheses[0] is
      untested and the $9/month on the pricing page is labelled planned; the
      answer-to-insight rate and the invite-to-join rate are the inputs that
      would justify building billing or dropping the tier. Until 2026-08-06
      neither could be computed: five of the six events they rest on were
      declared in the vocabulary and emitted by nothing.
    event_schema: >-
      src/lib/usage.ts — USAGE_EVENTS is a closed vocabulary and
      parseUsageBatch bounds every optional field; unknown names are rejected
      at /api/usage rather than stored.
    data_quality_tests: >-
      src/lib/usageVocabulary.test.ts (a declared event has an emitter or a
      registered reason whose predicate still holds; the operator funnel shows
      no step nothing can populate), src/lib/usage.test.ts (parser and field
      bounds), src/app/api/usage/usage.integration.test.ts (idempotent
      retries and 30-day expiry).
  customer_feedback:
    channels: []
    satisfaction_measure: null
    review_cadence: null
    owner: duncan
  privacy:
    purpose: >-
      Run the comparison service, and find where people are held up or lost.
      docs/DATA-COLLECTION.md is the single statement of what is stored and is
      checked against prisma/schema.prisma and, for the usage vocabulary,
      against the emitters.
    # An owner decision with a legal determination attached, not one an
    # engineering change should record on its behalf. Left open deliberately.
    lawful_basis: null
    notice_or_consent: >-
      Notice at /privacy, which names every category collected. No third-party
      analytics, no advertising trackers, one cookie (the sign-in session).
    retention: >-
      Usage events 30 days, enforced in the same transaction that writes them;
      anonymous-write IP digests at most 24 hours; sign-in attempt digests at
      most 30 days. Answers and account data are kept until deletion is asked
      for.
    deletion: >-
      Operator-executed on request by email, as stated at /privacy; there is no
      self-serve delete route. Usage events additionally expire on their own.
    access_owner: duncan
