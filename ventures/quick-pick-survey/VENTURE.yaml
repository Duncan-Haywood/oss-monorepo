name: quick-pick-survey
description: Quick Pick — a pairwise-comparison preference engine (Glicko-2 / Davidson-Bradley-Terry) that infers a person's real preference ordering, including couple-comparison insights.
stage: prototype

owner: duncan

hypotheses:
  - claim: People will complete enough pairwise comparisons to produce a usable preference ranking, and linked couples will pay for the comparison view.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 30
  protected: true

kill_criteria:
  - No real (non-owner) respondent completes a full survey session after the app is deployed to production.
  - CI never runs (runner never allocated) for 6 months and the manual `npm run verify` gate is not kept as the enforced substitute.

links:
