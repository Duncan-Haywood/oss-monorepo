name: ppf-ceramic-coating-price-calculator
description: >-
  Free browser calculator for paint protection film and ceramic coating shops: enter the vehicle size, film package, roll cost and waste, paint
  correction, techs, cure days, bay overhead and redo rate, and see the price, the film to buy, the bay days, and which package earns the most per
  bay day. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-11 in a scheduled session. vehicle-wrap-bid-calculator and window-tinting-bid-calculator price adjacent film trades; none models
# PPF coverage packages, film waste, correction stage, cure days blocking the bay, or profit per bay day. PPF is a high-ticket, fast-growing install
# trade with many small independent shops pricing from competitors' menus.
#
# First visitor: shop owners searching "how much to charge for PPF", "paint protection film pricing for installers" and "ceramic coating pricing
# formula", and detailing / PPF installer forums. Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; says it is not legal advice; says what is not modelled; carries the
# no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations.

hypotheses:
  - claim: >-
      PPF and coating shops will type a car's size, package, film cost and bay overhead into a no-signup calculator to set a price, because most
      price from a competitor's menu that ignores film waste, correction and cure days.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/ppf-ceramic-coating-price-calculator/
  analytics: null
