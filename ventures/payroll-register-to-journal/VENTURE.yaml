kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted register structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a register this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

