name: pension-lump-sum-vs-annuity-calculator
description: >-
  Free browser tool for anyone offered a pension buyout: type the monthly pension, the lump sum, your
  age and how long you expect to live, and see what the pension is worth today, the return the lump
  sum must earn every year to match it, the break-even age and the chance of reaching it, a survivor
  benefit for a spouse, and what the lump sum could pay each month instead. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-08 in a scheduled new-venture session. duplicate_check.py "pension buyout lump sum vs
# annuity decision" scored 0.38 against cell-tower-lease-buyout-calculator and the mineral-rights tool
# (lexical overlap on "buyout lump sum" only); no venture values a monthly pension stream with mortality
# against a lump sum, and social-security-claiming-age-calculator is a different instrument.
#
# Why this niche: employers de-risking their pension plans mail lump-sum offers to retirees and
# former employees on a deadline, and the choice is irreversible and worth six figures to someone with no
# actuary. "Pension lump sum vs monthly payment calculator" and "should I take the pension buyout" are
# searched by people holding an election form, and spike when a large employer announces a window.
#
# First visitor: someone in r/personalfinance, r/retirement or the Bogleheads forum asking whether to take
# a lump sum, or a retiree/ex-employee of a firm that just announced a buyout window. Volume not measured.
#
# Liability boundary: arithmetic on user-typed figures with a stylised survival curve, not a life table;
# not legal, tax, actuarial or financial advice; embeds no plan data, rates or employer names; says the
# plan's own assumptions may differ and to read plan documents; nothing stored or uploaded.
#
# Path to revenue (payment rails stay off): lead magnet and donations; later a printable one-page
# comparison for an adviser or spouse, a 417(e) rate lookup the user pastes in, and a Social Security
# bridge variant (not built).

hypotheses:
  - claim: >-
      People holding a pension lump-sum election form will type their offer into a private page to see the
      return the lump sum must earn to match the pension, because the plan's own materials show only the
      two dollar figures.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user or adviser reports that a worked present value or required return disagrees with the same inputs done by hand.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/pension-lump-sum-vs-annuity-calculator/
  analytics: null
