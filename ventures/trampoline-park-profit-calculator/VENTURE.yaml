name: trampoline-park-profit-calculator
description: >-
  Free browser tool for people planning or running a trampoline park or family entertainment
  center: enter jumper capacity, sessions, fill, ticket price, birthday parties, members, snacks,
  floor staff, rent, insurance, the build cost and any loan and see monthly profit, margin, months
  to pay back the build, break-even fill, the lowest ticket for a target margin and for a payback
  target, a sensitivity check at 10% and 20% fewer visits, and a two-scenario comparison. Copy,
  CSV, save and load. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-12 in a new-venture session with duplicate_check.py (nearest 0.45,
# kids-birthday-party-package-profit-calculator, which prices one party package; no whole-park
# venture existed). Why this niche: a trampoline park costs $300k-$1M to build in a 15,000-30,000
# sq ft lease, and its owners price the ticket by copying the park down the road. The money
# question is fill: how many of the jumper slots must sell, at what ticket, before rent, floor
# staff, insurance and the loan are covered, and how much of the margin rests on weekend
# birthday parties. Franchise pro formas answer it only after a sales call.
# This is the lead magnet for a later paid multi-attraction planner (payment rails stay off).
#
# First visitor: prospective and new trampoline park or FEC owners searching how much a
# trampoline park makes. Volume not measured with an external tool.
#
# Liability boundary: arithmetic on user-typed numbers. Not tax, legal, lending or financial
# advice; says so. Names no park chain, franchise or equipment maker. No data fetched, no
# accounts, nothing stored.

hypotheses:
  - claim: >-
      Prospective trampoline park owners will enter their capacity, ticket price and costs into a
      no-signup tool and use the break-even fill and payback numbers to decide on a lease or
      the size of the build.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a lowest ticket that does not reproduce the tool's own target margin when typed back in as the ticket price.
  - A user reports a lowest payback ticket that does not reproduce their payback target when typed back in as the ticket price.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/trampoline-park-profit-calculator/
  analytics: null
