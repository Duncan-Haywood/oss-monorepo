name: irrigation-install-bid-calculator
description: A private browser calculator for irrigation and landscape contractors that prices a new sprinkler-system install from zones, extra heads, trench footage, soil, controller, 3/4-inch PVB versus 1-inch versus 1.5-inch RPZ, drip conversion, rain sensor, and a master valve — and shows the hours the first rock backyard actually consumes and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent irrigation contractors will use a zone-and-trench bid calculator because the generic "$400 a zone installed" special they are shopped on cannot see that a 6-zone front-yard spray system with a 3/4-inch PVB in dirt is a different job from a 10-zone backyard with extra heads, a 1.5-inch RPZ, rock trench, drip, and a master valve.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-zone special) are the two figures a contractor actually decides on when a homeowner asks them to match a cheaper sprinkler-system quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra heads, trench footage, backflow size, and soil as their own hours, instead of a blended add-on to a $400/zone special, changes the bid enough that contractors notice which part of a high number is the first extra hundred feet of trench.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified irrigation or landscape contractors use the calculator twice within 90 days.
  - Contractors report that splitting the zones and extras versus a $400/zone special is more work than their existing per-zone method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
