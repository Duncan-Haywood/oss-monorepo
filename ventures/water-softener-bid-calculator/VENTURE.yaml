name: water-softener-bid-calculator
description: A private browser calculator for plumbing and water-treatment shops that prices a water-softener install from extra pipe past the included run, copper versus PEX, an iron filter or under-sink RO, the brine drain, haul-away of the old unit, and a brine receptacle — and shows the price per extra foot, the hours the first soldered cut-in actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent plumbing shops will use a pipe-and-iron bid calculator because the generic "$799 installed" water-softener special they are shopped on cannot see that a 32k PEX garage hang with ten included feet is a different job from a 64k copper cut-in with an iron filter, a long drain, and haul-away.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-job special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper softener-install quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra pipe, copper versus PEX, iron, drain, haul-away, and a brine receptacle as their own hours, instead of a blended add-on to a trip charge, changes the bid enough that shops notice which part of a high number is the first soldered cut-in.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified plumbing or water-treatment shops use the calculator twice within 90 days.
  - Shops report that splitting pipe, copper, and iron versus a hang-only special is more work than their existing trip-charge method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/water-softener-bid-calculator/
  analytics: null
