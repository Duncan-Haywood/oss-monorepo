name: activecampaign-import-csv-check
description: >-
  Free browser tool that checks an ActiveCampaign import CSV of contacts, accounts or deals before it
  is uploaded: contacts with no email or an invalid one, duplicate emails, tags separated by
  semicolons or pipes, deals with a Value written as $12,000, currencies that are not 3-letter
  codes, a Status that is not Open, Won or Lost, duplicate deals and accounts, phone numbers Excel
  damaged (scientific notation), date formats the import will misread, headings that do not match
  field names and semicolon-delimited files, each with its line number, plus a formatting-only
  safe-fixes pass that lists every change. The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-04 in a new-venture-first session. The portfolio has HubSpot, Salesforce, Zoho CRM,
# Pipedrive, Xero, QuickBooks and generic email-list import checkers; none covers ActiveCampaign, the
# email-automation CRM small businesses and agencies move lists into from Mailchimp, spreadsheets and
# other CRMs. The faults are the ones a spreadsheet round trip produces plus ones specific to a
# marketing platform: a contact row with no email, tags separated by semicolons so the whole cell
# becomes one tag, "$12,000" in a deal Value, a Status of "won" or "closed".
#
# First visitor: people searching the literal problems ("ActiveCampaign import contacts CSV error",
# "ActiveCampaign import tags CSV", "ActiveCampaign import deals CSV", "ActiveCampaign import date
# format") and ActiveCampaign community threads, r/ActiveCampaign, r/marketingautomation. Volume not
# measured.
#
# Privacy is the liability boundary: a contact list names people, emails and phones, so the file never
# leaves the browser (a test asserts no network calls).
#
# Rules are read from memory of ActiveCampaign's public import help, with an explicit not-checked list
# shown on the page and returned with every result: custom fields, pipelines and stages, owner
# matching, existing contacts and the update setting, suppression and consent status, enabled
# currencies, the date and number formats chosen at import, deliverability. Consent and the right to
# email a list are out of scope and the page says so.
#
# Path to revenue (payment rails stay off): lead magnet for the email-marketing migration and agency
# audience, sibling to the other CRM import checkers. A paid version, if usage appears, is bulk checks
# across client files with saved rules behind an env-var switch; not built.
#
# Liability: format checks on the user's own file, rules stated as read from memory, no warranty,
# independent-of-ActiveCampaign clause, trademark used nominatively, no consent or compliance advice.
