# Any box with Docker:  ADMIN_KEY=$(openssl rand -hex 16) LEAGUE_TOKEN=$(openssl rand -hex 16) docker compose up -d
services:
  league-hub:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      LEAGUE_TOKEN: ${LEAGUE_TOKEN:?set LEAGUE_TOKEN}
volumes:
  state:
