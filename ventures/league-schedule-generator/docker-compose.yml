# Any box with Docker:  ADMIN_KEY=$(openssl rand -hex 16) LEAGUE_TOKEN=$(openssl rand -hex 16) docker compose up -d
services:
  league-hub:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      LEAGUE_TOKEN: ${LEAGUE_TOKEN:?set LEAGUE_TOKEN}
      # Optional reminder emails on your own mail account; empty SMTP_HOST leaves them off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REMINDER_TO: ${REMINDER_TO:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
volumes:
  state:
