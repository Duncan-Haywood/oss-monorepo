# Fly.io self-deploy, in your own account (needs flyctl and a card on file with Fly):
#   fly launch --copy-config --no-deploy --dockerfile Dockerfile
#   fly volumes create state --size 1
#   fly secrets set ADMIN_KEY=$(openssl rand -hex 16) LEAGUE_TOKEN=$(openssl rand -hex 16)
#   fly deploy
# Optional reminder emails: fly secrets set SMTP_HOST=... SMTP_USER=... SMTP_PASS=... SMTP_FROM=... REMINDER_TO=...
# The check runs at start and hourly, so with min_machines_running = 0 it runs whenever the page wakes;
# set it to 1 if no one opens the page in the two days before a game.
app = "league-hub-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STATE = "/data/state.json"

[mounts]
  source = "state"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
