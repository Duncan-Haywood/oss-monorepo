name: actions-cache-poisoning-check
description: 'Free, read-only checker that scans GitHub Actions workflow YAML for an actions/cache (or actions/cache/save) write reachable from a pull_request_target/workflow_run trigger, and for an unscoped restore-keys fallback on actions/cache or actions/cache/restore -- the two patterns behind the May 2026 TanStack Router cache-poisoning incident -- each finding printed with the exact fix, browser or zero-dependency CLI, no upload, no network calls of its own.'
stage: prototype

owner: duncan

# Not a scored pipeline candidate: same graduation shape as
# actions-injection-check, pinned-actions-check, and
# actions-runner-starvation-check -- a direct, obvious, low-risk dev-tool
# idea tied to a dated, verifiable incident rather than a pipeline-candidate
# write-up.
# Not a duplicate of actions-injection-check: that venture flags checkout of
# an untrusted ref and shell interpolation of untrusted event-context
# expressions; this flags a different sink entirely (the Actions cache) and
# a config pattern (restore-keys fallback) neither existing checker reads.
# duplicate_check.py's top match against actions-injection-check scored 0.28,
# below the 0.45 flag bar. Confirmed 2026-09-07.
#
# Gate self-assessment: liability_containment and ethical_robustness are both
# high -- a mechanical, read-only linter with no advice-of-record, no
# compliance claim, no data leaving the user's device, and no scraping. It
# makes no network calls of its own anywhere in the code (check.py,
# classify.mjs): findings are printed with a suggested fix for the user to
# apply themselves. This is defensive security tooling (detecting a
# documented CI/CD supply-chain risk in the user's own repository), not an
# offensive or dual-use capability.
hypotheses:
  - claim: A maintainer who read about the TanStack Router cache-poisoning incident, or the underlying ActionsCacheBlasting/Hive Security research, will paste their workflow YAML here and find a fork-writable cache step no existing local-only tool flags.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A team will wire check.py --fail-on-risk into their own CI to block a newly-added fork-writable cache step or unscoped restore-keys fallback before it merges.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users engage with the tool within 90 days of it being reachable from the published site.
  - No external repository is found using check.py or classify.mjs within 90 days.

