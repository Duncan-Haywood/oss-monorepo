name: gpx-track-check
description: >-
  Free browser tool that checks a GPX track file for what makes Strava, Garmin Connect and Komoot reject or
  mis-read it: missing creator, version and namespace, points at 0,0, GPS jumps, timestamps out of order,
  tracks with no times, impossible elevations, truncated files and empty segments, each with its line number.
  It writes the file back with every provable fix applied and leaves the rest untouched. The file is read
  locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05 in a new-venture-first session (build-now pipeline empty). duplicate_check.py top
# match 0.16 (caption-quality-check). Archetype: paste-your-file pre-flight checker, same family as
# ics-calendar-check and vcard-contacts-check, aimed at runners, cyclists, hikers and route-planning hobbyists.
#
# First visitor: someone whose GPX export from a watch, phone app or route planner "failed to upload" or
# "has no time data" on Strava; search phrases like "gpx file upload failed", "strava gpx no timestamps",
# "fix gpx file online". Volume not measured with an external tool.
#
# Privacy is the liability boundary: a GPX file reveals home and training locations, so the file never
# leaves the browser (a test asserts no network calls). Acceptance by any service is out of scope and said so.
#
# Path to revenue (payment rails stay off): lead magnet; a paid version, if usage appears, is a batch CLI /
# CI check for people who publish route libraries. None built.
#
# Liability: format checks on the user's own file, no warranty, independent-of-every-service clause,
# trademarks used nominatively, no acceptance promise, no route-safety claim.

# 2026-10-20: built the CLI half of the stated revenue path (`cli.mjs`: check/fix files and folders,
# --json/--strict, CI exit codes). No npm publish (owner gate).
# Hypothesis to test: people who publish route libraries reach the CLI section of the README from search;
# reading is the opt-in usage counter on the page, not a download count.

# 2026-10-20: added track thinning (page button and `cli.mjs thin`): Ramer-Douglas-Peucker to a user-set
# point cap, kept points byte-identical. Device point limits are not asserted; the user sets the cap.
hypotheses:
  - claim: >-
      People whose watch or head unit refuses a long imported course will search for how to reduce the
      points in a GPX file and use a free, local thinning tool that keeps times and elevations on the
      points it keeps.
    status: untested
    checked: null
    evidence: customer-contact
