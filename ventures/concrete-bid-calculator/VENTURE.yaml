name: concrete-bid-calculator
description: A private browser calculator for independent concrete contractors that prices a driveway, patio, or slab from cubic yards, form footage, finish labor, and access — not a flat price per square foot — and shows the walk-away price, the price per yard, and whether a quoted number is underwater.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent concrete contractors will use a yards-and-forms calculator because the generic price-per-square-foot quotes they find online cannot see that a 6-inch RV pad is 50% more material than a 4-inch driveway of the same size, which is how a bid that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the price per cubic yard are the two numbers a contractor actually decides on when a homeowner asks them to match a cheap square-foot quote, more than the square-foot number itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Thickness, access (chute vs wheelbarrow vs pump), and the plant's short-load fee are the three inputs most often left out of a small contractor's own quote, so making them required, explained inputs changes the resulting bid materially.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified concrete contractors use the calculator twice within 90 days.
  - Contractors report that splitting yards, forms, and finish from square footage is more work than their existing method without changing the price they would have bid.
  - The starting finish-hour rates prove so far from real crews' times that the tool cannot be used without data we have no way to gather.
