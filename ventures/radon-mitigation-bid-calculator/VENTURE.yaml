name: radon-mitigation-bid-calculator
description: A private browser calculator for licensed radon mitigators that prices a sub-slab or crawl depressurization install from extra suction points, crawl membrane, roof discharge, high-suction fan, new circuit, firestops, permit, and post-mitigation test — and shows the price per square foot of footprint, the hours the first extra suction actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent radon mitigators will use a suction-and-membrane bid calculator because the generic radon-special or dollars-per-square-foot rules of thumb they are shopped on cannot see that a 1,200-square-foot walk-out basement with one suction and a sidewall discharge is a different job from a 2,400-square-foot slab-and-crawl combo with two suction points, a crawl membrane, and a new circuit.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published special) are the two figures a mitigator actually decides on when a homeowner asks them to match a cheaper basement quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra suction, crawl poly, a roof stack, a high-suction fan, a new circuit, firestops, a permit, and a post-mitigation test as their own hours, instead of a blended add-on to the special, changes the bid enough that shops notice which part of a high number is the first extra suction pit.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified radon mitigators use the calculator twice within 90 days.
  - Mitigators report that splitting suction, membrane, and circuit is more work than their existing special without changing the price they would have bid.
  - The starting hours and kit rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
