name: distillery-excise-tax-calculator
description: >-
  Free browser calculator for craft distillers: enter bottles by size and ABV removed in a year and get the federal distilled
  spirits excise tax at the Craft Beverage Modernization Act rates ($2.70 on the first 100,000 proof gallons, $13.34 to 22.23
  million, $13.50 above), the effective rate, the tax inside each bottle size, and a growth table showing the rate cliff.
  Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check scored the nearest venture at 0.29
# (brewery-excise-tax-calculator, the beer sibling; distilled spirits use proof gallons and different rates).
#
# Why this niche: the US has roughly 2,500 craft distilleries. The CBMA reduced rate turns a $2.70 proof gallon into a $13.34
# proof gallon at 100,000 proof gallons, about $0.43 vs $2.11 on a 750 mL bottle at 40% ABV. Owners price bottles and plan
# expansion without a view of that cliff; the TTB return computes tax but does not show per-bottle cost or growth effects.
#
# First visitor: distillers and bookkeepers searching "distillery excise tax calculator", "federal excise tax per proof
# gallon", "CBMA distilled spirits reduced rate", "TTB spirits tax per bottle". Volume not measured with an external tool.
#
# Liability boundary: arithmetic over volumes the user types in; nothing stored; not tax advice; states what is not modelled
# (state tax, importers, drawback, losses, actual filing period) and carries the no-warranty and no-SLA clauses. Rates cited
# from IRC 5001 as amended by the CBMA; verify against current TTB guidance.
#
# Path to revenue (payment rails stay off): lead magnet into the spirits/brewery cluster plus donations. A paid layer (TTB
# return worksheet export, controlled-group allotment tracking) needs accounts, so an owner decision; not built.

hypotheses:
  - claim: >-
      Craft distillers and bookkeepers will type annual bottle counts into a no-signup calculator to see the excise tax per
      bottle and the cost of crossing 100,000 proof gallons, because their TTB return computes the tax but not what it adds
      to a bottle price or to growth.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing the effective rate jump past 100,000 proof gallons changes whether a distillery grows volume or raises price.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Distillers report that state tax or contract-distilling assignment is the common need, at which point the tool should model it.

