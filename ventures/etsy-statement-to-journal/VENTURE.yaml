name: etsy-statement-to-journal
description: >-
  Free browser tool that turns an Etsy Payment account statement CSV into balanced monthly accounting
  journals for Xero, QuickBooks Online and QuickBooks Desktop (IIF). It checks every row (amount plus fees
  and taxes equals net), books gross sales, listing and transaction fees, ads, shipping labels, refunds and
  bank deposits separately instead of the net deposit, writes one journal per calendar month balanced to an
  Etsy clearing account, and can prove a month against a net total typed in from Etsy. Rows no rule
  recognises are journalled to an uncategorised account rather than dropped. The statement is read locally
  and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05 in a new-venture-first session. The commercial analogue is A2X, Webgility and
# Etsy-to-QuickBooks sync apps, sold per month; this is the no-account, no-upload, one-statement-at-a-time
# version. Sibling of stripe-payout-to-journal, shopify-payout-to-journal and amazon-settlement-to-journal,
# same engine family, different export. Etsy sellers are a large, bookkeeping-poor audience (millions of
# active shops, most sole proprietors who file a Schedule C and see only the net deposit).
# Search phrases: "Etsy statement to QuickBooks", "Etsy payment account to Xero", "Etsy fees accounting
# entry", "Etsy deposit journal entry", "Etsy bookkeeping spreadsheet", "Etsy to QuickBooks Online".
# Volume not measured with an external tool.
#
# Who: Etsy sellers who keep their own books, and the bookkeepers who serve several of them, who today book
# the net deposit as income (wrong: fees, ads and refunds are hidden) or pay a monthly sync fee.
#
# Path to revenue (payment rails stay off): lead magnet for the seller and bookkeeper audience. If usage
# appears, the paid version is what a browser page cannot do: batch many months, remember the account
# mapping per client, pull statements on a schedule (behind an env-var switch) and add Printful, PayPal and
# Square. Not built.
#
# Liability: it writes a journal from the user's own statement, shows the check it ran, states what it does
# not check (sales tax and VAT treatment), and carries the no-warranty, independent-of-Etsy and
# financial-data clauses.
#
# Unverified: the column names, Type values, date and amount formats of the Etsy statement CSV, what the
# Fees & Taxes column holds on a Sale row, and the Xero, QuickBooks Online and IIF import layouts are from
# memory of public help documents; nothing ran against a real Etsy export or a live import. The first
# statement this misreads, or a journal an importer refuses, is the priority fix.

hypotheses:
  - claim: >-
      An Etsy seller or their bookkeeper will paste a Payment account statement into a no-upload page to get
      a monthly journal, because the alternatives are booking the net deposit (hiding fees, ads and refunds)
      or paying a monthly sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a payout this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

