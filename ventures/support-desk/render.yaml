# One-click self-deploy: https://render.com/deploy?repo=<your fork URL>
# Render builds the Dockerfile in YOUR account; nothing runs on the author's.
# No third-party key is required to start. ALERT_WEBHOOK_URL (Slack/Discord) and Resend email (RESEND_API_KEY, MAIL_FROM, DRY_RUN=false) are optional.
services:
  - type: web
    name: support-desk
    runtime: docker
    dockerContext: ventures/support-desk
    dockerfilePath: ventures/support-desk/Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: STATE
        value: /data/state.json
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_KEY
        generateValue: true
      - key: COMPANY_NAME
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: AUTO_CLOSE_DAYS
        value: "7"
