name: construction-delay-claim-calculator
description: >-
  Free browser calculator for subcontractors, general contractors and owner's reps: list delay events by cause and see the time
  extension earned, the compensable days, a field plus Eichleay home-office overhead claim, and the liquidated damages left, netted into
  one position. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check scored the nearest ventures low (0.14 subcontractor-cashflow-planner,
# 0.12 construction-evidence-log; no venture computes a delay claim or liquidated damages).
#
# First visitor: subcontractors and project managers searching "construction delay claim calculator", "Eichleay formula calculator",
# "liquidated damages calculator", "concurrent delay time extension no money". Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; not legal advice; says what is not modelled (notice and
# waiver clauses, no-damages-for-delay clauses, critical path, acceleration, state rules) and carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations; a claims-consultant or scheduling-software referral would need
# owner approval.

hypotheses:
  - claim: >-
      Subcontractors and project managers on a delayed job will type their delay events into a no-signup calculator to see the time
      extension, claim and liquidated damages together, because the owner's letter arrives with the withholding figure and nothing to set
      against it.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/construction-delay-claim-calculator/
  analytics: null
