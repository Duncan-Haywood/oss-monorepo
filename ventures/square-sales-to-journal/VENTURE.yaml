name: square-sales-to-journal
description: >-
  Free browser tool that turns a Square Transactions CSV into balanced monthly accounting journals for
  Xero, QuickBooks Online and QuickBooks Desktop (IIF). It checks every payment (Total Collected plus Fees
  equals Net Total), books gross sales, discounts, sales tax and tips (as liabilities, not income), gift
  card sales, refunds and Square processing fees separately instead of the net deposit, writes one journal
  per calendar month balanced to a Square clearing account, totals each Deposit ID so it can be matched to
  the bank feed, and can prove a month against a Net Total typed in from Square. Money no column explains
  is journalled to an uncategorised account rather than dropped. The file is read locally and never
  uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05 in a new-venture-first session. The commercial analogue is A2X, Webgility and the
# Square-to-QuickBooks sync apps, sold per month; this is the no-account, no-upload, one-export-at-a-time
# version. Sibling of stripe-payout-to-journal, shopify-payout-to-journal, etsy-statement-to-journal,
# paypal-activity-to-journal and amazon-settlement-to-journal: same engine family, different export, and
# the largest remaining gap in it -- Square is the default processor for cafes, salons, food trucks and
# market stalls, owners who keep their own books and book the bank deposit as sales.
# Search phrases: "Square to QuickBooks", "Square sales to Xero", "Square deposit journal entry",
# "Square fees accounting entry", "Square sales tax and tips accounting", "Square bookkeeping spreadsheet".
# Volume not measured with an external tool.
#
# Who: small retail and service businesses on Square who keep their own books, and the bookkeepers who
# serve several of them. Today they book the net deposit as income (wrong: fees, tax and tips are hidden or
# overstated) or pay a monthly sync fee.
#
# Path to revenue (payment rails stay off): lead magnet for the owner and bookkeeper audience. If usage
# appears, the paid version is what a browser page cannot do: batch many months and locations, remember the
# account mapping per client, pull exports on a schedule (behind an env-var switch) and add tip payout
# and payroll splits. Not built.
#
# Liability: it writes a journal from the user's own export, shows the check it ran, states what it does
# not check (sales tax treatment, staff tips owed), and carries the no-warranty, independent-of-Square and
# financial-data clauses.
#
# Unverified: the column names and number formats of the Square Transactions export, whether Partial
# Refunds and Discounts print negative, which Transaction Status values appear, and the Xero, QuickBooks
# Online and IIF import layouts are from memory of public help documents; nothing ran against a real
# Square export or a live import. The first export this misreads, or a journal an importer refuses, is the
# priority fix.

hypotheses:
  - claim: >-
      A Square merchant or their bookkeeper will paste a Transactions export into a no-upload page to get a
      monthly journal, because the alternatives are booking the net deposit (hiding fees and mixing in tax
      and tips) or paying a monthly sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports an export this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

