name: class-price-and-minimum-optimizer
description: >-
  Free browser tool for tutoring centers, music schools, studios and workshops: enter past prices and average sign-ups, plus
  seats, the minimum to run a class and what a class costs, and get the per-seat price with the highest expected profit per
  class offered. Fits constant price elasticity from the past terms (full terms are lower bounds and left out), sums the exact
  Poisson chance of every enrolment, and shows the chance the class runs, fills, and the gain over the current price. Nothing
  leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-09 in a scheduled session. duplicate_check.py: closest rows were studio-class-slot-optimizer 0.34 (which
# slot to run, not what to charge) and tutor-package-pricing-calculator (one tutor, prepaid packages). Neither sets a seat
# price against a cancel-below-minimum rule.
#
# Why this niche: a class that is cancelled under a minimum makes price a two-sided bet. Too high and it does not run; too
# low and a full room leaves money on the table. Owners price by habit or by copying the centre down the road.
#
# First visitor: searches like "how much to charge for a group class", "minimum students to run a class", r/tutoring,
# r/musicteachers, r/smallbusiness, studio-owner groups. Volume not measured with an external tool.
#
# Liability boundary: arithmetic on typed figures; not business, accounting or legal advice; nothing stored or sent.
#
# Path to revenue (payment rails stay off): lead magnet and donations; natural front end for a paid enrolment-forecasting
# add-on that reads a booking system.

hypotheses:
  - claim: >-
      Owners of small schools and studios will use a free tool that turns their own price and sign-up history into a seat
      price, and will return each term.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that a figure disagrees with the same inputs done by hand.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/class-price-and-minimum-optimizer/
  analytics: null
