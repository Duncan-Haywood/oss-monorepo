name: CI

on:
  # `branches-ignore: []` was here until 2026-08-05. An empty sequence is not
  # valid against GitHub's workflow schema — actionlint rejects it — and the
  # branch set it names is the empty set, which is what omitting the key means.
  # So this runs on every branch either way, and now it parses. No control saw
  # it because actionlint's input was `.gitea/workflows/` alone until the same
  # commit widened it.
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# All three jobs pinned Node 20 until 2026-08-04, against a repository `.nvmrc`
# of 22 that this venture inherits — it ships no `.nvmrc` of its own, and the
# monorepo pipeline already runs `pipeline/`'s tests on 22. Nothing compared the
# two, because every workflow control read `.gitea/workflows` only
# (docs/CONTROL-AUDIT-2026-08-04.md finding 2). The pins are 22 here so the
# venture's own CI and the monorepo pipeline agree on the interpreter.
jobs:
  pipeline:
    name: pipeline/ tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - working-directory: pipeline
        run: npm ci
      - working-directory: pipeline
        run: npm test
      - working-directory: pipeline
        run: npx tsc --noEmit

  docs-site:
    name: docs-site/ build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - working-directory: docs-site
        run: npm ci
      - working-directory: docs-site
        run: npm run build

  research:
    name: research/ build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: research/package-lock.json
      - working-directory: research
        run: npm ci
      - working-directory: research
        run: npm run build
