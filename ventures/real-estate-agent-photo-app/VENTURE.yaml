name: real-estate-agent-photo-app
description: AI-first mobile real estate photography app and concierge enhancement pipeline for agents.
stage: prototype
verify: npm --prefix pipeline test

owner: duncan

hypotheses:
  - claim: Mid-market real estate agents will pay $19/listing concierge or $49/mo for instant MLS-ready photo enhancement and property microsites.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 30
  protected: true

kill_criteria:
  - Fewer than 5 agent shoots booked after 30 days of active concierge outreach.
  - description: >-
      $100 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        comparator: ">="
        threshold: 100
      - metric: cumulative_revenue_usd
        comparator: "=="
        threshold: 0

links:
  # Was https://listing-lens-docs.pages.dev until 2026-08-02. That host answers,
  # but it serves internal documentation — its own description says "Private
  # documentation for Listing Lens" — not a surface a customer uses. Declaring
  # it as production made the venture look shipped and made the homepage look
  # like it was withholding a live product. The docs stay where they are; this
  # field means the customer-facing surface, and there is not one yet.
  production: null
  analytics: null

engineering:
  verify_command: npm --prefix pipeline test
  ci_component: real-estate-agent-photo-app
  coverage:
    lines: 90
    functions: 90
    statements: 90
    branches: 85
  critical_paths: []
  slo:
    availability: null
    latency: null
    correctness: null
  gitops:
    desired_state: null
    immutable_artifact: true
  security:
    threat_model: null
    data_classification: photos, agent-pii
    scan_profile: source, history, dependencies, licenses, IaC, container, image
  measurement:
    outcome: null
    decision_supported: null
    event_schema: null
    data_quality_tests: null
  customer_feedback:
    channels: []
    satisfaction_measure: null
    review_cadence: null
    owner: duncan
  privacy:
    purpose: null
    lawful_basis: null
    notice_or_consent: null
    retention: null
    deletion: null
    access_owner: duncan
