name: real-estate-agent-photo-app
description: "Listing Lens: AI-first iPhone real estate photography — guided capture, instant AI enhancement, MLS-ready delivery, lightweight 3D/video, and agent branding in about 30 minutes."
stage: idea

owner: duncan

hypotheses:
  - claim: Mid-market real estate agents will pay a recurring fee for a guided-capture, AI-enhanced listing-media workflow instead of hiring photographers or shooting DIY.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Agents will pay for a dated photo-spec evidence record that states what was checked, not that a portal will accept the listing.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 20
  protected: true

kill_criteria:
  - No concierge listing delivered to a real agent within 90 days of process/booking-link.ts existing (see process/blockers.ts: first-concierge-delivery, unconfirmed since 2026-06-13).
  - Phase 1 interviews (process/interview-script.ts) never run, leaving the core pricing/demand hypothesis untested.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/real-estate-agent-photo-app/
  analytics: null

# Session-gate marker. mls-photo-spec-preflight graduates as a product
# line here, not as a new ventures/ directory. session_gate.py reads this
# list; allocate.py does not. The first experiment's software half is the
# probe in portfolio/pipeline/probes/mls-photo-spec/.
product_lines:
  - slug: mls-photo-spec-preflight
