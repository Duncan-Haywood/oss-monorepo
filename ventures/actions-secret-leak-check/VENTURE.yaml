name: actions-secret-leak-check
description: 'Free, read-only checker that scans GitHub Actions workflow YAML for the two documented ways a secret reaches a log or a later step unmasked: a step that transforms (base64/hex/substring) a secret-derived value before it can be printed, and a step that writes a secret-derived value to $GITHUB_ENV/$GITHUB_OUTPUT/$GITHUB_STATE without registering it with ::add-mask:: -- each finding printed with the exact fix, browser or zero-dependency CLI, no upload, no network calls of its own.'
stage: prototype

owner: duncan

# Not a scored pipeline candidate: same graduation shape as
# actions-injection-check, actions-runner-starvation-check and
# pinned-actions-check -- a direct, obvious, low-risk dev-tool idea rather
# than a pipeline-candidate write-up.
# Not a duplicate of any existing actions-* checker: duplicate_check.py
# scored this description at or below 0.11 against every venture (closest:
# actions-artifact-poisoning-check at 0.11, sharing only the "actions-*
# security checker" family, not the finding shape). actions-injection-check
# is about untrusted-input reaching a checkout ref or a shell command;
# actions-cache-poisoning-check and actions-artifact-poisoning-check are
# about a fork tampering with a cache or artifact a privileged job later
# trusts; actions-permissions-check is about an overbroad GITHUB_TOKEN
# grant. This is a distinct bug class -- a legitimate, already-declared
# secret leaking into a log or a later step despite GitHub's own masking --
# with no overlapping detection code.
#
# Gate self-assessment: liability_containment and ethical_robustness are
# both high -- a mechanical, read-only line scanner with no advice-of-
# record, no compliance claim, no data leaving the user's device, and no
# scraping. It makes no network calls of its own anywhere in the code
# (check.py, classify.mjs): findings are printed with a suggested fix for
# the user to apply themselves.
hypotheses:
  - claim: A maintainer who has read about a leaked secret incident, or who is hardening CI after a security review, will paste their workflow YAML here and find a transformed-secret or unmasked-env-export finding no existing local-only tool flags for them.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A team will wire check.py --fail-on-risk into their own CI to block a newly-added secret-leak pattern before it merges.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users engage with the tool within 90 days of it being reachable from the published site.
  - No external repository is found using check.py or classify.mjs within 90 days.

links:
  production: https://duncan-haywood.github.io/oss-monorepo/actions-secret-leak-check/
  analytics: null
