name: tsconfig-ts7-check
description: >-
  A free browser tool and Node CLI for TypeScript developers: paste a
  tsconfig.json and see which options TypeScript 7.0 rejects (with the error
  code tsc 6.0 and 7.0 print), which TypeScript 6.0 default changes reach the
  project (strict, types, target, module, moduleResolution, rootDir,
  noUncheckedSideEffectImports), and a suggested compilerOptions that both
  compilers accept. Rules confirmed against tsc 5.9.3, 6.0.3 and 7.0.2.
  Nothing is uploaded.
stage: prototype
owner: duncan

hypotheses:
  - claim: >-
      Developers upgrading to TypeScript 7 search for the error they hit
      ("Option 'baseUrl' has been removed", TS5108, "process is not
      defined" after the upgrade) and a page that checks their own tsconfig
      is used more than the release notes; measured as config_checked events
      once the page is indexed.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Monorepo maintainers run the CLI over every package's tsconfig in CI
      before switching the compiler, because extends chains hide removed
      options in shared base configs (7 of 25 current @tsconfig/bases
      packages are rejected by tsc 7.0.2).
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - No organic traffic or CLI engagement after being listed and indexed for a
    fair run (portfolio/usage/README.md's "fair run" definition).
  - The TypeScript 6 to 7 migration is over (most configs already clean) and
    nobody extends the rules to the next major release.

links:
  production: https://marisstella.app/tsconfig-ts7-check/
  analytics: null
