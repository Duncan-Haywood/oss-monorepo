name: cdn-bandwidth-pricing-calculator
description: 'Free, zero-network, zero-dependency browser tool + CLI that prices CDN bandwidth (Amazon CloudFront, Fastly, Bunny CDN, KeyCDN) at a monthly GB-delivered volume from editable approximate list prices, projects 12 months of spend under a monthly growth rate, and finds the volumes where the cheapest CDN changes; has a --budget CI gate. A deterministic calculator over the user''s inputs, not a quote and not a guarantee of spend.'
stage: prototype

owner: duncan

# CLI/checker archetype, sibling of log-management-pricing-calculator and
# ci-minutes-pricing-calculator. cloud-egress-calculator prices cloud-provider egress;
# nothing compares CDN vendors at one monthly GB-delivered volume.
#
# Where the first real visitor would come from: search phrases "cloudfront vs bunny
# cdn pricing", "cheapest cdn per gb", "bunny vs cloudfront cost", "cdn
# bandwidth cost calculator"; r/webdev and Hacker News threads after an egress bill shock.
# The reader is a founder or lead dev choosing or leaving a CDN. Vendor pages are rate
# cards per vendor; none shows all of them at one volume with growth and the
# crossover, which is the wedge. A hosted pricing-change monitor is the natural paid path later.
hypotheses:
  - claim: A founder choosing or leaving a CDN will search for a price comparison at their GB-delivered-per-month volume, enter volume and growth, and use the crossover table to decide.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A platform team will add the CLI to CI with --budget so growth that pushes CDN spend over budget fails review instead of the invoice.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool calculates only from typed numbers in
  # the visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No external repository is found wiring cli.mjs into its own CI within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/cdn-bandwidth-pricing-calculator/
  analytics: null
