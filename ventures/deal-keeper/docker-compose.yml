# Any box with Docker:
#   API_KEY=$(openssl rand -hex 16) ADMIN_KEY=$(openssl rand -hex 16) docker compose up -d
services:
  deal-keeper:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["state:/data"]
    environment:
      STATE: /data/state.json
      API_KEY: ${API_KEY:?set API_KEY (16+ characters)}
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY (16+ characters)}
      STAGES: ${STAGES:-lead,qualified,proposal,negotiation}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
volumes:
  state:
