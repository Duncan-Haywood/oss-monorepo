kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, forks or build reports) engage within 120 days of the page being reachable from the published site.
  - A builder reports that the cliff handling cannot be made to stop the robot before an edge at a useful speed, and no sensor layout in the CAD fixes it.

