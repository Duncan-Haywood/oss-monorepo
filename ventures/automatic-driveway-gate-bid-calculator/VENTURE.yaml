name: automatic-driveway-gate-bid-calculator
description: A private browser calculator for gate contractors that prices an automatic driveway gate from single swing, dual swing, or slide — opening width, leaf material, columns, power, loops, and access — and shows the operator count, the extra-work share, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent gate shops will use a style-and-column bid calculator because the generic "$4,500 automatic gate" Facebook special they are shopped on cannot see that a 12-foot single aluminum swing on existing posts is a different job from a 16-foot dual steel swing with masonry columns, two loops, and a solar kit.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the extra-work share (not the published kit special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper single-swing quote on a dual masonry gate.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing single swing, dual swing, and slide on the same opening, with operators from leaf count and columns from post type, changes the bid enough that shops notice which style keeps the margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified gate shops use the calculator twice within 90 days.
  - Shops report that splitting style, columns, power, and loops is more work than their existing per-opening method without changing the price they would have bid.
  - The starting hours and kit rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
