<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grant Autopilot · Grant applications for small nonprofits</title>
    <meta name="description" content="Grant Autopilot helps small nonprofits find grants and draft applications where every fact cites your own documents. Anything unverified is flagged, and you approve before anything is sent." />
    <meta name="application-name" content="Grant Autopilot" />
    <meta name="theme-color" content="#0e5862" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!--
      Social previews. https://grantautopilot.example is a placeholder: scripts/prerender.mjs replaces it
      with SITE_URL (https://marisstella.app/grants in production, matching SITE_URL in
      src/client/components/marketing/meta.ts). Crawlers need absolute image URLs, and most do not
      accept SVG, so og.png is a rasterized copy of public/og.svg.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://grantautopilot.example/" />
    <meta property="og:site_name" content="Grant Autopilot" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Grant Autopilot · Grant applications for small nonprofits" />
    <meta property="og:description" content="Find grants and get drafts written only from your own records. Every fact is cited, anything unverified is flagged, and you approve before anything is sent." />
    <meta property="og:image" content="https://grantautopilot.example/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Grant Autopilot: apply for more grants with the team you already have. Drafts written only from your own records, every fact cited, and you approve before it's sent." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grant Autopilot · Grant applications for small nonprofits" />
    <meta name="twitter:description" content="Find grants and get drafts written only from your own records. Every fact is cited, anything unverified is flagged, and you approve before anything is sent." />
    <meta name="twitter:image" content="https://grantautopilot.example/og.png" />
    <meta name="twitter:image:alt" content="Grant Autopilot: apply for more grants with the team you already have. Drafts written only from your own records, every fact cited, and you approve before it's sent." />
  </head>
  <body>
    <noscript>Grant Autopilot needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
