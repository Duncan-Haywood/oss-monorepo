<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Grant Autopilot</title>
  <desc id="og-desc">Apply for more grants with the team you already have. Drafts written only from your own records, every fact cited, and you approve before anything is sent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003034"/>
      <stop offset="1" stop-color="#004549"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#77cfd0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#77cfd0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#001b1e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Wordmark -->
  <g transform="translate(72 64)">
    <rect width="52" height="52" rx="13" fill="#ffffff"/>
    <path d="M14.6 34.9 24.7 15.6a1.6 1.6 0 0 1 2.9 0L37.4 34.9" fill="none" stroke="#005a5f" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19.5 28.4h13" stroke="#005a5f" stroke-width="3.9" stroke-linecap="round"/>
    <circle cx="38.2" cy="14.6" r="4.1" fill="#e48233"/>
    <text x="70" y="36" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Grant Autopilot</text>
  </g>

  <!-- Headline -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="222" font-size="56" font-weight="600" fill="#ffffff" letter-spacing="-1.2">
      <tspan x="72" dy="0">Apply for more grants</tspan>
      <tspan x="72" dy="68">with the team you</tspan>
      <tspan x="72" dy="68">already have.</tspan>
    </text>
    <text x="72" y="430" font-size="25" fill="#d1f3f3">
      <tspan x="72" dy="0">Drafts written only from your own records.</tspan>
      <tspan x="72" dy="38">Every fact cited. You approve before it's sent.</tspan>
    </text>
    <g transform="translate(72 528)">
      <rect width="440" height="40" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="22" cy="20" r="5" fill="#e48233"/>
      <text x="38" y="27" font-size="18" font-weight="500" fill="#ffd39d">For small nonprofits and tribal organizations</text>
    </g>
  </g>

  <!-- Example draft card -->
  <g transform="translate(790 130)" filter="url(#shadow)">
    <rect width="338" height="372" rx="22" fill="#ffffff"/>
    <!-- header -->
    <rect x="24" y="26" width="18" height="22" rx="3" fill="none" stroke="#007479" stroke-width="2.5"/>
    <rect x="54" y="30" width="128" height="12" rx="6" fill="#334155" fill-opacity="0.85"/>
    <rect x="246" y="24" width="68" height="26" rx="13" fill="#f1f5f9"/>
    <rect x="260" y="34" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="0" y="72" width="338" height="1.5" fill="#f1f5f9"/>

    <!-- cited lines -->
    <rect x="24" y="96" width="250" height="11" rx="5.5" fill="#cbd5e1"/>
    <rect x="284" y="92" width="22" height="19" rx="5" fill="#d1f3f3"/>
    <text x="295" y="106" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#004549" text-anchor="middle">1</text>
    <rect x="24" y="122" width="290" height="11" rx="5.5" fill="#cbd5e1"/>
    <rect x="24" y="148" width="176" height="11" rx="5.5" fill="#cbd5e1"/>
    <rect x="210" y="144" width="22" height="19" rx="5" fill="#d1f3f3"/>
    <text x="221" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#004549" text-anchor="middle">2</text>

    <!-- flagged line -->
    <rect x="16" y="178" width="306" height="64" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="30" y="194" width="236" height="11" rx="5.5" fill="#94a3b8"/>
    <path d="M32 220v14M32 221h11l-2.5 4 2.5 4H32" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="221" width="150" height="9" rx="4.5" fill="#d97706" fill-opacity="0.7"/>

    <!-- sources -->
    <rect x="0" y="262" width="338" height="1.5" fill="#f1f5f9"/>
    <rect x="24" y="282" width="18" height="18" rx="4" fill="#d1f3f3"/>
    <rect x="52" y="286" width="150" height="9" rx="4.5" fill="#94a3b8"/>
    <rect x="24" y="310" width="18" height="18" rx="4" fill="#d1f3f3"/>
    <rect x="52" y="314" width="112" height="9" rx="4.5" fill="#94a3b8"/>

    <!-- approve button -->
    <rect x="186" y="304" width="128" height="40" rx="9" fill="#007479"/>
    <path d="M206 324.5l6 6 12-12" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="234" y="320" width="64" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
