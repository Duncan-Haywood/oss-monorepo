components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: "Better Auth session cookie (named `__Secure-better-auth.session_token` over HTTPS). State-changing requests that send an Origin header must match APP_URL or the request origin (403 bad_origin)."
    internalToken:
      type: http
      scheme: bearer
      description: INTERNAL_API_TOKEN (constant-time compared). Endpoints return 404 when it is not configured.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization id (org_...). Non-members get 404 not_found, never 403.
      schema:
        type: string
  responses:
    InternalError:
      description: "Unexpected error: `internal_error` (500), or an HTTPException rendered as `bad_request` / `unauthorized` / `http_error`."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    MemberRole:
      type: string
      enum:
        - owner
        - admin
        - editor
        - reviewer
        - viewer
    OrgType:
      type: string
      enum:
        - nonprofit_501c3
        - tribal_government
        - tribal_organization
        - faith_based
        - community_based
        - educational
        - government
        - fiscally_sponsored
        - other
    DocumentKind:
      type: string
      enum:
        - mission_statement
        - charter_bylaws
        - annual_report
        - financial_statement
        - budget
