# Grant Autopilot — OpenAPI 3.1 spec of the IMPLEMENTED API (src/worker/routes/**, mounted in src/worker/app.ts).
# Not the planned contract: see docs/ARCHITECTURE.md for that and docs/api/README.md for conventions.
# Check route coverage with: node scripts/check-openapi.mjs (from apps/grants).
# Format note: block-style YAML subset (no anchors/flow collections) so the checker's tiny parser can read it.
openapi: "3.1.0"
info:
  title: Grant Autopilot API
  version: "0.1.0"
  description: |-
    The API as implemented in src/worker/routes/** (not the planned contract in docs/ARCHITECTURE.md). See docs/api/README.md for auth, tenancy, errors, pagination, idempotency, limits and webhooks. Keep in sync with `node scripts/check-openapi.mjs`.

    All JSON timestamps are ISO-8601 strings; money is integer US cents; ids are prefixed strings (doc_, fct_, app_ ...). Every response carries `x-request-id`; API responses default to `Cache-Control: no-store`.

    Extensions: `x-required-role` (minimum org role, or public / authenticated / internal-token / webhook-signature), `x-error-codes` (the `error.code` values a status can carry), `x-body-limit` (request-limits rule), `x-rate-limit` (limiters that apply).
servers:
  - url: "/"
    description: Same origin as the SPA (one Cloudflare Worker)
tags:
  - name: public
  - name: auth
  - name: account
  - name: orgs
  - name: members
  - name: documents
  - name: knowledge
    description: Search, facts, projects
  - name: interviews
    description: Interviews, transcripts, dictation
  - name: opportunities
    description: Catalog, imports, matches
  - name: applications
  - name: reviews
  - name: submissions
    description: Submissions, follow-ups, dashboard
  - name: privacy
  - name: billing
  - name: internal
    description: Operator endpoints (bearer token)
paths:
  "/api/health":
    get:
      tags:
        - public
      summary: Liveness + D1 check
      operationId: getHealth
      description: "Access: No authentication."
      x-required-role: public
      security: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  env:
                    type: string
                  fake:
                    type: boolean
                    description: "FAKE_EXTERNALS=true"
                required:
                  - ok
                  - env
                  - fake
        default:
          $ref: "#/components/responses/InternalError"
  "/api/health/deep":
    get:
      tags:
        - internal
      summary: Deep health checks (monitoring)
      operationId: getDeepHealth
      description: |-
        Runs the production checks (D1 latency, R2 head, discovery freshness, stuck applications and documents, LLM error rate, global LLM spend) and reports each as ok/warn/fail. Platform-wide counts only, never tenant data. 503 when any check fails. Thresholds: docs/MONITORING.md. Returns 404 `not_found` when INTERNAL_API_TOKEN is not configured.

        Access: `Authorization: Bearer <INTERNAL_API_TOKEN>`; no session.
      x-required-role: internal-token
      security:
        - internalToken: []
      responses:
        "200":
          description: No check failed (status ok or warn)
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/DeepHealth"
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found: `not_found`"
          x-error-codes:
            - not_found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: At least one check failed (status fail)
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/DeepHealth"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/auth/{betterAuthPath}":
    get:
      tags:
        - auth
      summary: Better Auth (GET)
      operationId: betterAuthGet
      description: |-
        Better Auth handler (`routes.on(["GET","POST"], "/*")`). Request/response bodies and errors are Better Auth's own (not the `{error:{...}}` envelope). Commonly used: `POST /api/auth/sign-up/email` {name,email,password(10-128)}, `POST /api/auth/sign-in/email` {email,password} (refused until the email is verified), `POST /api/auth/sign-out`, `GET /api/auth/get-session`, `GET /api/auth/verify-email?token=`, `POST /api/auth/send-verification-email`, `POST /api/auth/request-password-reset`, `POST /api/auth/reset-password`, `POST /api/auth/change-password`, `POST /api/auth/update-user`, `POST /api/auth/sign-in/social` {provider:"google"} and `GET /api/auth/callback/google` (only when Google OAuth is configured). `/list-sessions` is disabled (use GET /api/me/sessions). Sets the `better-auth.session_token` cookie (HttpOnly, SameSite=Lax; Secure + `__Secure-` prefix on HTTPS).

        Rate limits: every POST passes our authLimiter first (20/60 s per client IP, 429 `rate_limited` + Retry-After, our envelope); on hardened (HTTPS/production) deployments Better Auth also limits per IP in its own format: 100/60 s overall, sign-in 10/60 s, sign-up 5/60 s, send-verification-email 3/60 s, request-password-reset 3/60 s, reset-password 10/60 s. Only GET and POST are routed; other methods get 404.

        Access: No authentication.
      x-required-role: public
      security: []
      parameters:
        - name: betterAuthPath
          in: path
          required: true
          schema:
            type: string
            description: "Rest of the path (may contain `/`)."
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                description: Better Auth response.
        default:
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - auth
      summary: Better Auth (POST)
      operationId: betterAuthPost
      description: |-
        Better Auth handler (`routes.on(["GET","POST"], "/*")`). Request/response bodies and errors are Better Auth's own (not the `{error:{...}}` envelope). Commonly used: `POST /api/auth/sign-up/email` {name,email,password(10-128)}, `POST /api/auth/sign-in/email` {email,password} (refused until the email is verified), `POST /api/auth/sign-out`, `GET /api/auth/get-session`, `GET /api/auth/verify-email?token=`, `POST /api/auth/send-verification-email`, `POST /api/auth/request-password-reset`, `POST /api/auth/reset-password`, `POST /api/auth/change-password`, `POST /api/auth/update-user`, `POST /api/auth/sign-in/social` {provider:"google"} and `GET /api/auth/callback/google` (only when Google OAuth is configured). `/list-sessions` is disabled (use GET /api/me/sessions). Sets the `better-auth.session_token` cookie (HttpOnly, SameSite=Lax; Secure + `__Secure-` prefix on HTTPS).

        Rate limits: every POST passes our authLimiter first (20/60 s per client IP, 429 `rate_limited` + Retry-After, our envelope); on hardened (HTTPS/production) deployments Better Auth also limits per IP in its own format: 100/60 s overall, sign-in 10/60 s, sign-up 5/60 s, send-verification-email 3/60 s, request-password-reset 3/60 s, reset-password 10/60 s. Only GET and POST are routed; other methods get 404.

        Access: No authentication.
      x-required-role: public
      x-body-limit: "auth: max 64 KiB"
      x-rate-limit:
        - "auth: 20 requests / 60 s per client IP (AUTH_LIMITER)"
      security: []
      parameters:
        - name: betterAuthPath
          in: path
          required: true
          schema:
            type: string
            description: "Rest of the path (may contain `/`)."
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                description: Better Auth response.
        "403":
          description: "Forbidden: `bad_origin`"
          x-error-codes:
            - bad_origin
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Payload too large: `payload_too_large`"
          x-error-codes:
            - payload_too_large
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Too many requests: `rate_limited`"
          x-error-codes:
            - rate_limited
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/legal":
    get:
      tags:
        - public
      summary: List legal documents
      operationId: listLegalDocs
      description: |-
        `Cache-Control: public, max-age=300`.

        Access: No authentication.
      x-required-role: public
      security: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegalDocSummary"
                required:
                  - items
        default:
          $ref: "#/components/responses/InternalError"
  "/api/legal/{key}":
    get:
      tags:
        - public
      summary: Get one legal document (markdown)
      operationId: getLegalDoc
      description: "Access: No authentication."
      x-required-role: public
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              - terms
              - privacy
              - data-use
              - refunds
              - acceptable-use
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/LegalDoc"
        "404":
          description: "Not found: `not_found`"
          x-error-codes:
            - not_found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/billing/webhook":
    post:
      tags:
        - billing
      summary: Merchant-of-record webhook
      operationId: billingWebhook
      description: |-
        Mounted before the Origin check and session middleware. Trust comes only from the signature: `Paddle-Signature: ts=<unix>;h1=<hex HMAC-SHA256 of "ts:rawBody">` (Paddle) or `x-fake-signature: <hex HMAC-SHA256(secret, body)>` (fake provider). Idempotent per provider event id (`billing_events` unique index): a replay returns `outcome: duplicate`.

        Access: Provider signature header; no session.
      x-required-role: webhook-signature
      x-body-limit: "webhook: max 1 MiB"
      security: []
      requestBody:
        required: true
        description: "Raw provider event (any content type; verified before parsing)."
        content:
          "application/json":
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    const: true
                  outcome:
                    type: string
                    enum:
                      - applied
                      - duplicate
                      - ignored
                required:
                  - received
                  - outcome
        "400":
          description: "Bad request: `bad_request`"
          x-error-codes:
            - bad_request
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized: `invalid_signature`"
          x-error-codes:
            - invalid_signature
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Payload too large: `payload_too_large`"
          x-error-codes:
            - payload_too_large
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Service unavailable: `billing_unavailable`"
          x-error-codes:
            - billing_unavailable
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/internal/discovery/run":
    post:
      tags:
        - internal
      summary: Queue a discovery run
      operationId: internalRunDiscovery
      description: |-
        Returns 404 `not_found` when INTERNAL_API_TOKEN is not configured (endpoint disabled). Body optional; without `source` it queues grants_gov (+ simpler_grants when SIMPLER_GRANTS_API_KEY is set).

        Access: `Authorization: Bearer <INTERNAL_API_TOKEN>`; no session.
      x-required-role: internal-token
      x-body-limit: "json: max 1 MiB, JSON only"
      security:
        - internalToken: []
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum:
                    - grants_gov
                    - simpler_grants
      responses:
        "202":
          description: Queued
          content:
            "application/json":
              schema:
                type: object
                properties:
                  queued:
                    type: boolean
                    const: true
                  sources:
                    type: array
                    items:
                      type: string
                      enum:
                        - grants_gov
                        - simpler_grants
                required:
                  - queued
                  - sources
        "400":
          description: "Bad request: `validation_error`"
          x-error-codes:
            - validation_error
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found: `not_found`"
          x-error-codes:
            - not_found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Payload too large: `payload_too_large`"
          x-error-codes:
            - payload_too_large
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "Unsupported media type: `unsupported_media_type`"
          x-error-codes:
            - unsupported_media_type
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/internal/discovery/runs":
    get:
      tags:
        - internal
      summary: Recent discovery runs
      operationId: internalListDiscoveryRuns
      description: "Access: `Authorization: Bearer <INTERNAL_API_TOKEN>`; no session."
      x-required-role: internal-token
      security:
        - internalToken: []
      parameters:
        - in: query
          required: false
          name: limit
          description: "1-200, default 50 (clamped; non-numeric -> 50)."
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscoveryRun"
                required:
                  - items
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found: `not_found`"
          x-error-codes:
            - not_found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/internal/discovery/seed-samples":
    post:
      tags:
        - internal
      summary: Upsert the bundled sample opportunities
      operationId: internalSeedSamples
      description: "Access: `Authorization: Bearer <INTERNAL_API_TOKEN>`; no session."
      x-required-role: internal-token
      x-body-limit: "json: max 1 MiB, JSON only"
      security:
        - internalToken: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  found:
                    type: integer
                  created:
                    type: integer
                  updated:
                    type: integer
                  unchanged:
                    type: integer
                required:
                  - found
                  - created
                  - updated
                  - unchanged
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found: `not_found`"
          x-error-codes:
            - not_found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Payload too large: `payload_too_large`"
          x-error-codes:
            - payload_too_large
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "Unsupported media type: `unsupported_media_type`"
          x-error-codes:
            - unsupported_media_type
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/me":
    get:
      tags:
        - account
      summary: Current user + memberships
      operationId: getMe
      description: "Access: Any signed-in user (session cookie); no org membership needed."
      x-required-role: authenticated
      security:
        - cookieSession: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  memberships:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"
                required:
                  - user
                  - memberships
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - account
      summary: Delete my account
      operationId: deleteMyAccount
      description: |-
        Re-authentication: accounts with a password must send it (403 `invalid_password`); password-less (Google) accounts must have signed in within the last 10 minutes (403 `reauth_required`). Refused while the caller is the only owner of any org (409 `last_owner`, details.orgs). Clears the session cookie.

        Access: Any signed-in user (session cookie); no org membership needed.
      x-required-role: authenticated
      x-body-limit: "json: max 1 MiB, JSON only"
      x-rate-limit:
        - "account-delete: 5 attempts / 15 min per user (in-isolate)"
      security:
        - cookieSession: []
      requestBody:
        required: false
        content:
          "application/json":
            schema:
              type: object
              properties:
                password:
                  type: string
                  maxLength: 256
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    const: true
                required:
                  - deleted
        "400":
          description: "Bad request: `validation_error`, `bad_request`"
          x-error-codes:
            - validation_error
            - bad_request
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Forbidden: `invalid_password`, `reauth_required`, `bad_origin`"
          x-error-codes:
            - invalid_password
            - reauth_required
            - bad_origin
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Conflict: `last_owner`"
          x-error-codes:
            - last_owner
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Payload too large: `payload_too_large`"
          x-error-codes:
            - payload_too_large
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "Unsupported media type: `unsupported_media_type`"
          x-error-codes:
            - unsupported_media_type
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "Too many requests: `rate_limited`"
          x-error-codes:
            - rate_limited
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/me/invitations":
    get:
      tags:
        - account
      summary: Pending invitations addressed to my email
      operationId: listMyInvitations
      description: |-
        Pending, unexpired, newest first (max 50). Always empty when the account email is not verified (invitation ids are bearer secrets).

        Access: Any signed-in user (session cookie); no org membership needed.
      x-required-role: authenticated
      security:
        - cookieSession: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyInvitation"
                required:
                  - items
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/me/invitations/{id}":
    get:
      tags:
        - account
      summary: One invitation by the id from the emailed link
      operationId: getMyInvitation
      description: |-
        404 both for unknown ids and invitations sent to another email.

        Access: Any signed-in user (session cookie); no org membership needed.
      x-required-role: authenticated
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MyInvitation"
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found: `not_found`"
          x-error-codes:
            - not_found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/InternalError"
  "/api/me/invitations/{id}/accept":
    post:
      tags:
        - account
      summary: Accept an invitation (single use)
      operationId: acceptInvitation
      description: |-
        If already a member, keeps the existing role.

        Access: Any signed-in user (session cookie); no org membership needed.
      x-required-role: authenticated
      x-body-limit: "json: max 1 MiB, JSON only"
      security:
        - cookieSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          description: "Unauthorized: `unauthorized`"
          x-error-codes:
            - unauthorized
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Forbidden: `forbidden`, `bad_origin`"
          x-error-codes:
            - forbidden
            - bad_origin
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found: `not_found`"
          x-error-codes:
            - not_found
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Conflict: `conflict`"
          x-error-codes:
            - conflict
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: "Gone: `invitation_expired`"
          x-error-codes:
            - invitation_expired
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Payload too large: `payload_too_large`"
          x-error-codes:
            - payload_too_large
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "Unsupported media type: `unsupported_media_type`"
          x-error-codes:
            - unsupported_media_type
          content:
