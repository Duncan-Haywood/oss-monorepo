# OWNER: infra agent. Nightly D1 export of apps/grants (Grant Autopilot) into R2 under backups/d1/,
# keeping the newest N copies. Runbook: apps/grants/docs/RUNBOOK.md ("Backups and the restore drill").
#   schedule           -> production, keep 30
#   workflow_dispatch  -> production or demo, keep N
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; without them the run is skipped
# (green, with a notice). Optional repository variable GRANTS_BACKUP_BUCKET moves the copies to a
# dedicated bucket (recommended; default grant-autopilot-files).
name: grants-backup
on:
  schedule:
    # 09:43 UTC = 02:43 in Gallup, NM (MST): low traffic, clear of the Worker's */30 and 13:17 crons.
    # A running export blocks other D1 queries, so keep it away from busy hours.
    - cron: "43 9 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment's D1 to back up"
        type: choice
        options: [production, demo]
        default: production
      keep:
        description: "Backups of this database to keep in R2 (newest first; 0 = no prune)"
        type: number
        default: 30

# Nothing by default; the backup job only needs to read the repository.
permissions: {}

concurrency:
  group: grants-backup-${{ inputs.environment || 'production' }}
  cancel-in-progress: false # never cancel an export or an upload half-way

jobs:
  gate:
    name: check secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          # Only the default branch's copy of the script gets the Cloudflare token.
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          if [[ "$ON_DEFAULT_BRANCH" != "true" ]]; then
            echo "::notice title=grants-backup skipped::Backups run only from the default branch (got $GITHUB_REF)."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          elif [[ "$HAS_TOKEN" == "true" && "$HAS_ACCOUNT" == "true" ]]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice title=grants-backup skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable nightly D1 backups."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          fi

  backup:
    name: d1 export -> r2 (${{ inputs.environment || 'production' }})
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash # -eo pipefail
        working-directory: apps/grants
    env:
      BACKUP_ENV: ${{ inputs.environment || 'production' }}
      # format() keeps an explicit 0 (a bare `inputs.keep || 30` would turn 0 into 30).
      KEEP: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.keep) || '30' }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Cloudflare credentials are passed only to the step that calls Cloudflare.
      - run: pnpm install --frozen-lockfile

      - name: Export D1, upload to R2, prune old copies
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_BUCKET: ${{ vars.GRANTS_BACKUP_BUCKET }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/d1-backup"
          trap 'rm -rf "$dir"' EXIT
          # d1-backup.mjs redacts the presigned export URL that wrangler prints, so the log never
          # carries a working link to the full dump. BACKUP_BUCKET (if set) overrides the bucket.
          node scripts/ops/d1-backup.mjs --env "$BACKUP_ENV" --out-dir "$dir" \
            --upload --keep "$KEEP" --delete-local | tee "$RUNNER_TEMP/backup.log"

      - name: Summary
        if: always()
        run: |
          {
            echo "### grants-backup ($BACKUP_ENV)"
            if [[ -f "$RUNNER_TEMP/backup.log" ]]; then
              echo '```'
              grep -E '^(d1-backup:|exported|gzipped|uploaded|retention:)' "$RUNNER_TEMP/backup.log" || true
              echo '```'
            fi
            echo "Restore drill and restore steps: apps/grants/docs/RUNBOOK.md"
          } >>"$GITHUB_STEP_SUMMARY"
