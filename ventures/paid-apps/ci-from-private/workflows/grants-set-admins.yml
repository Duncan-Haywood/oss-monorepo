# Sets PLATFORM_ADMIN_EMAILS (comma-separated) directly on the live worker(s), without storing the
# addresses in the repository. The deploy's secret sync only writes non-empty GitHub secrets, so a value
# set here persists until a PLATFORM_ADMIN_EMAILS repository secret is added (which then wins).
name: grants-set-admins
on:
  workflow_dispatch:
    inputs:
      emails:
        description: "Platform admin email(s), comma-separated"
        type: string
        required: true
      target:
        description: "Which worker(s)"
        type: choice
        options: [both, production, demo]
        default: both

permissions:
  contents: read

concurrency:
  group: grants-set-admins
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        shell: bash
        working-directory: apps/grants
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Validate and mask input
        working-directory: .
        env:
          EMAILS: ${{ inputs.emails }}
        run: |
          emails="$(printf '%s' "$EMAILS" | tr -d '[:space:]')"
          echo "::add-mask::$emails"
          IFS=',' read -ra list <<<"$emails"
          for e in "${list[@]}"; do
            echo "::add-mask::$e"
            [[ "$e" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]] || { echo "::error::Not an email address (entry ${#e} chars)"; exit 1; }
          done
          echo "Validated ${#list[@]} address(es)"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Store on worker(s)
        env:
          EMAILS: ${{ inputs.emails }}
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_API_KEY || secrets.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          emails="$(printf '%s' "$EMAILS" | tr -d '[:space:]')"
          echo "::add-mask::$emails"
          case "$TARGET" in
            both) workers=(grant-autopilot grant-autopilot-demo) ;;
            production) workers=(grant-autopilot) ;;
            demo) workers=(grant-autopilot-demo) ;;
          esac
          for w in "${workers[@]}"; do
            printf '%s' "$emails" | pnpm exec wrangler secret put PLATFORM_ADMIN_EMAILS --name "$w" >/dev/null
            echo "PLATFORM_ADMIN_EMAILS set on $w"
          done
