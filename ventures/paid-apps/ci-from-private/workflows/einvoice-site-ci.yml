# PR checks for apps/einvoice-site (zero-dependency static site + worker). Never needs secrets.
name: einvoice-site-ci
on:
  pull_request:
    paths:
      - "apps/einvoice-site/**"
      - ".github/workflows/einvoice-site-ci.yml"
  push:
    branches-ignore: [main]
    paths:
      - "apps/einvoice-site/**"
      - ".github/workflows/einvoice-site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: einvoice-site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter private-monorepo
      - name: Biome
        run: pnpm exec biome ci apps/einvoice-site
      - name: Build (dev)
        working-directory: apps/einvoice-site
        run: node build.mjs
      - name: Tests
        working-directory: apps/einvoice-site
        run: node --test test/*.test.mjs
