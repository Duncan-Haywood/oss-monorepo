# Fails when a workflow reads a secret docs/security/secrets-inventory.yaml does
# not list, when the inventory lists one nothing reads, or when an entry's
# workflows/environments drift (owner, 2026-11-24: keys managed as code).
# The checker lives in the public oss-monorepo; it is fetched at a pinned commit,
# so no token is needed and a later change there cannot alter this check
# without a PR here. Reads only; no secrets.
name: secrets-inventory
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "docs/security/secrets-inventory.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "docs/security/secrets-inventory.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the checker (oss-monorepo, pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Duncan-Haywood/oss-monorepo
          ref: 234ac3be531bd1244e9abfb3f3b40bce5c6c88f5
          path: .checker
          persist-credentials: false
          sparse-checkout: platform/ci/secrets_inventory.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - name: Every secret the workflows read is in the inventory, and nothing else
        run: python3 .checker/platform/ci/secrets_inventory.py --root .
