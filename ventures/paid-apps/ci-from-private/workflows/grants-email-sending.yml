# Applies apps/grants/email-sending.json: the Cloudflare Email Service sending domain(s) for Grant
# Autopilot (apps/grants/docs/EMAIL.md). On demand only; a dry run unless "apply" is ticked.
name: grants-email-sending
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the changes (unticked: dry run that prints the plan and the DNS records)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: grants-email-sending
  cancel-in-progress: false

jobs:
  sending-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test the plan logic
        working-directory: apps/grants
        run: node --test scripts/email-sending.test.mjs
      - name: Sync sending domains
        working-directory: apps/grants
        env:
          # A token with the zone permission "Email Sending Write" (+ Zone Read unless
          # CLOUDFLARE_ZONE_ID is set). The deploy token is tried last; it may lack the permission.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_SENDING_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.MARISSTELLA_ZONE_ID }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: node scripts/email-sending.mjs
