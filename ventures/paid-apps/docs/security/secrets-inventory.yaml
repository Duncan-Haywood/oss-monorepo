# Every secret a workflow in this repository can read: who issues it, what it
# can do, where it is read and stored, how it rotates, and what the owner
# still has to do. Names only; values never go in this file.
#
# Same format and check as oss-monorepo's docs/security/secrets-inventory.yaml.
# The checker lives in the public repository; from a sibling checkout:
#
#   python3 ../oss-monorepo/platform/ci/secrets_inventory.py --root .
#
# It fails when a workflow reads a secret not listed here, when an entry lists
# one no workflow reads, or when `workflows` / `environments` drift.
#
# `environments`: `production` and `demo` are the GitHub environments
# grants-deploy.yml can run in (its environment is chosen by a workflow_dispatch
# input); `repository` means a job with no environment, which reads repository
# secrets only. Store each secret where its jobs can see it.
# `rotation`: short-lived (minted per job), scheduled (rotated by code) or
# manual (a long-lived value someone replaces by hand).
#
# None of these can move to OIDC today: Cloudflare, Anthropic, Resend, Paddle,
# Slack and Google have no GitHub Actions identity federation for these APIs.
# The work left is fewer names (six spellings of one Cloudflare token),
# expiries where the provider allows them, and no Global API Key.
# Last full review: 2026-11-24.

repo: duncan-haywood/private-monorepo

secrets:
- name: CLOUDFLARE_API_TOKEN
  provider: Cloudflare API token
  scope: Account Workers Scripts, D1, R2, Queues and Vectorize edit; Workers AI and Account Settings read;
    zone Workers Routes and DNS edit for the APP_DOMAIN zone (apps/grants/docs/DEPLOY.md, section 2).
  workflows:
  - grants-backup.yml
  - grants-deploy.yml
  - grants-email-sending.yml
  - grants-set-admins.yml
  environments:
  - demo
  - production
  - repository
  rotation: manual
  owner_action: Cloudflare has no OIDC federation for GitHub Actions, so this stays a long-lived token.
    Give it an expiry and keep it to the DEPLOY.md permissions. Store it under this name only.
- name: CLOUDFLARE_API_KEY
  provider: Cloudflare API token or Global API Key
  scope: A fallback spelling of the deploy credential. grants-deploy.yml also accepts a Global API Key
    here (with CLOUDFLARE_EMAIL), which can do anything the Cloudflare login can, on every account and
    zone.
  alias_of: CLOUDFLARE_API_TOKEN
  workflows:
  - grants-deploy.yml
  - grants-set-admins.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: If this holds a Global API Key, replace it with a scoped token in CLOUDFLARE_API_TOKEN
    and delete this name. Check Settings for which of the six token spellings holds the value; keep it
    under CLOUDFLARE_API_TOKEN and delete the rest. A later workflow PR then drops the fallbacks.
- name: CF_API_TOKEN
  provider: Cloudflare API token
  scope: Fallback spelling of CLOUDFLARE_API_TOKEN.
  alias_of: CLOUDFLARE_API_TOKEN
  workflows:
  - grants-deploy.yml
  - grants-set-admins.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Check Settings for which of the six token spellings holds the value; keep it under CLOUDFLARE_API_TOKEN
    and delete the rest. A later workflow PR then drops the fallbacks.
- name: CLOUDFLARE_TOKEN
  provider: Cloudflare API token
  scope: Fallback spelling of CLOUDFLARE_API_TOKEN.
  alias_of: CLOUDFLARE_API_TOKEN
  workflows:
  - grants-deploy.yml
  - grants-set-admins.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Check Settings for which of the six token spellings holds the value; keep it under CLOUDFLARE_API_TOKEN
    and delete the rest. A later workflow PR then drops the fallbacks.
- name: CF_API_KEY
  provider: Cloudflare API token or Global API Key
  scope: Fallback spelling; may hold a Global API Key like CLOUDFLARE_API_KEY.
  alias_of: CLOUDFLARE_API_TOKEN
  workflows:
  - grants-deploy.yml
  - grants-set-admins.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Check Settings for which of the six token spellings holds the value; keep it under CLOUDFLARE_API_TOKEN
    and delete the rest. A later workflow PR then drops the fallbacks.
- name: CF_TOKEN
  provider: Cloudflare API token
  scope: Fallback spelling of CLOUDFLARE_API_TOKEN.
  alias_of: CLOUDFLARE_API_TOKEN
  workflows:
  - grants-deploy.yml
  - grants-set-admins.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Check Settings for which of the six token spellings holds the value; keep it under CLOUDFLARE_API_TOKEN
    and delete the rest. A later workflow PR then drops the fallbacks.
- name: CLOUDFLARE_EMAIL
  provider: Cloudflare
  scope: Not a credential; the login email used only with a Global API Key. A repository variable works
    too.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Delete once no Global API Key is stored.
- name: CLOUDFLARE_ACCOUNT_ID
  provider: Cloudflare
  scope: Not a credential; the account the deploy targets. vars.CLOUDFLARE_ACCOUNT_ID also works.
  workflows:
  - grants-backup.yml
  - grants-deploy.yml
  - grants-set-admins.yml
  environments:
  - demo
  - production
  - repository
  rotation: manual
  owner_action: none. Could be a variable.
- name: CF_ACCOUNT_ID
  provider: Cloudflare
  scope: Fallback spelling of CLOUDFLARE_ACCOUNT_ID.
  alias_of: CLOUDFLARE_ACCOUNT_ID
  workflows:
  - grants-deploy.yml
  - grants-set-admins.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Delete once CLOUDFLARE_ACCOUNT_ID (secret or variable) holds the value.
- name: CF_ACCESS_TEAM_DOMAIN
  provider: Cloudflare Access (configuration)
  scope: Not a credential; the Access team domain for the /api/admin gate. vars.CF_ACCESS_TEAM_DOMAIN
    also works.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none. Could be a variable.
- name: CF_ACCESS_AUD
  provider: Cloudflare Access (configuration)
  scope: Not a credential; the Access application audience tag. vars.CF_ACCESS_AUD also works.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none. Could be a variable.
- name: CF_ACCESS_PROTECT_ALL
  provider: Cloudflare Access (configuration)
  scope: Not a credential; true puts the whole host behind Access. vars.CF_ACCESS_PROTECT_ALL also works.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none. Could be a variable.
- name: TURNSTILE_SECRET_KEY
  provider: Cloudflare Turnstile
  scope: Server-side key that verifies the bot check on the auth forms (apps/grants/docs/AUTH.md). Pushed
    to the Worker.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none required; rotate in the Turnstile dashboard if it leaks.
- name: ANTHROPIC_API_KEY
  provider: Anthropic API key
  scope: Claude API calls billed to the owner; pushed to the production Worker only (the demo runs on
    fakes).
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Keep a workspace spend limit on the key. Anthropic keys do not expire.
- name: AWS_ACCESS_KEY_ID
  provider: AWS IAM access key (transitional Worker identity)
  scope: The scoped IAM user from oss-monorepo platform/aws (app-identity stack) that may only call
    Claude Platform on AWS and SES SendEmail. Pushed to the production Worker only (the demo runs on
    fakes). Replaced by role credentials once the app runs on AWS.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: scheduled
  owner_action: None once the AWS account exists; the app-identity stack creates and rotates it.
- name: AWS_SECRET_ACCESS_KEY
  provider: AWS IAM secret key (transitional Worker identity)
  scope: Secret half of AWS_ACCESS_KEY_ID; same limits.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: scheduled
  owner_action: None once the AWS account exists; the app-identity stack creates and rotates it.
- name: GOOGLE_CLIENT_ID
  provider: Google OAuth client
  scope: Not a secret on its own; identifies the Google sign-in client.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none
- name: GOOGLE_CLIENT_SECRET
  provider: Google OAuth client
  scope: Lets the Worker complete Google sign-in for the configured redirect URL only.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none required; rotate in Google Cloud console if it leaks.
- name: CLOUDFLARE_EMAIL_SENDING_TOKEN
  provider: Cloudflare API token
  scope: Zone Email Sending Write (and Zone Read) for the sending domain's zone, to onboard the sending
    domain (apps/grants/docs/EMAIL.md, "Switching over"). Optional; grants-email-sending.yml falls back
    to CLOUDFLARE_API_TOKEN.
  workflows:
  - grants-email-sending.yml
  environments:
  - production
  rotation: manual
  owner_action: none required unless created; keep it limited to the one zone.
- name: RESEND_API_KEY
  provider: Resend API key
  scope: Sends email (verification, invitations) from the verified domain. Resend keys can be limited
    to sending access; the files do not say which was chosen.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Make sure it is a sending-access key limited to the one domain.
- name: BILLING_PROVIDER
  provider: Paddle (configuration)
  scope: Not a credential; names the billing provider.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none. Could be a variable.
- name: BILLING_API_KEY
  provider: Paddle API key
  scope: Server-side Paddle Billing API access (apps/grants/docs/PRICING.md). Production only. Also used
    by grants-deploy to sync the product and price catalog (packages/billing/scripts/paddle-catalog.ts),
    which needs product and price read and write permissions on the key.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: Paddle API keys can carry an expiry and per-entity permissions; set both.
- name: BILLING_WEBHOOK_SECRET
  provider: Paddle notification secret
  scope: Verifies the signature on Paddle webhooks to /api/billing/webhook. Production only.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none required; rotate in Paddle if it leaks.
- name: BILLING_PRICE_IDS
  provider: Paddle (configuration)
  scope: Not a credential; maps plans to Paddle price IDs. Since 2026-11-25 grants-deploy reads them back
    from Paddle after syncing apps/grants/billing/paddle-catalog.json, so this secret is only a fallback.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none. Can be deleted once a production deploy has synced the catalog.
- name: SIMPLER_GRANTS_API_KEY
  provider: Simpler.Grants.gov API key
  scope: Read access to the public grants search API. Production only.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none
- name: SLACK_SIGNING_SECRET
  provider: Slack app signing secret
  scope: Verifies requests to the /grants slash command (apps/grants/docs/INTEGRATIONS.md). Production
    only.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none required; regenerate in the Slack app settings if it leaks.
- name: INTEGRATIONS_KEY
  provider: Self-generated
  scope: Root key for encrypting stored integration secrets (HKDF-SHA-256; falls back to AUTH_SECRET when
    unset).
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none. Rotating it makes stored integration secrets unreadable; there is no re-encryption
    step.
- name: PLATFORM_ADMIN_EMAILS
  provider: Configuration
  scope: Not a credential; the comma-separated platform admin addresses, kept out of the repository.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: none
- name: AUTH_SECRET
  provider: Self-generated
  scope: Signs Better Auth sessions. Generated on first deploy when absent; a GitHub secret of this name
    overrides it.
  workflows:
  - grants-deploy.yml
  environments:
  - demo
  - production
  rotation: manual
  owner_action: 'none. Leave it unset and let the deploy generate it (DEPLOY.md, ''Secrets: where they
    come from''). Rotating it signs everyone out.'
- name: INTERNAL_API_TOKEN
  provider: Self-generated
  scope: Bearer token for /api/internal; grants-monitor.yml uses it to probe the deep health endpoint.
  workflows:
  - grants-deploy.yml
  - grants-monitor.yml
  environments:
  - demo
  - production
  - repository
  rotation: manual
  owner_action: Set it only if scripts outside the Worker need it. grants-monitor reads it as a repository
    secret, while the deploy reads it from the environment, so a copy in the environment alone leaves
    the monitor without it.
retired: []
