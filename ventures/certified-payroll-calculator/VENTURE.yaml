name: certified-payroll-calculator
description: Free browser calculator for Davis-Bacon / prevailing-wage government contractors that checks a worker classification's weekly pay against the wage determination and computes overtime correctly when part of the required fringe is paid in cash instead of a bona fide plan, plus an apprentice-to-journeyman ratio check.
stage: prototype
owner: duncan
hypotheses:
  - claim: Certified payroll clerks and compliance staff at Davis-Bacon subcontractors will use a free calculator that separates bona fide fringe from cash-in-lieu-of-fringe for overtime purposes, because most payroll systems apply time-and-a-half to the base rate only and silently underpay whenever cash fringe is in the mix.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Searchers asking whether Davis-Bacon overtime includes fringe benefits, or how the apprentice ratio works on certified payroll, are underserved by existing paid certified-payroll software (LCPtracker, eMars, ELB Consulting), which assumes a subscription and a live project rather than a one-off compliance check.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A contractor checking one worker's week before submitting certified payroll will also want the apprentice-to-journeyman ratio flagged in the same pass, since an excess apprentice paid the reduced rate is the other common finding in a Davis-Bacon audit.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three government contractors or certified payroll clerks use the calculator twice within 90 days.
  - No unsolicited feedback, star, fork, or referral within 90 days of publishing.
  - Feedback indicates existing paid certified-payroll software already answers this well enough for anyone willing to pay, with no gap for a free one-off check.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/certified-payroll-calculator/
  analytics: null
