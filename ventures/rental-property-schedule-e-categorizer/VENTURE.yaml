name: rental-property-schedule-e-categorizer
description: >-
  Free browser tool that reads a bank or card CSV export and sorts every
  transaction into an IRS Schedule E (Form 1040), Part I line per rental
  property, holding mortgage principal, capital improvements, transfers and
  security deposits out of the expenses. Flags repairs that may be
  improvements, months with no rent deposit, duplicate rows and mortgage
  payments with no interest typed, and downloads every row with its category
  for a preparer. The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. Small landlords (one to
# ten doors) have real money and a yearly deadline, and the work is the same
# every February: export the bank CSV, sort a year of transactions into
# Schedule E lines by hand in a spreadsheet, per property. The paid answers are
# Stessa, Baselane, Buildium and Hemlane (rent collection and bookkeeping,
# built around connecting a bank login) or a CPA's hourly bookkeeping. Nothing
# free does the one-off job of "here is my bank file, give me the Schedule E
# lines" without an account and a bank link.
#
# Distinct from ventures/rent-roll-delinquency-analyzer (who paid rent late)
# and the tax calculators (depreciation, recapture): this is the categorising
# step between the bank file and those.
#
# First visitor: r/landlord, r/realestateinvesting, BiggerPockets threads on
# "how do I do Schedule E from my bank statements", and searches like "bank
# statement to Schedule E", "categorize rental expenses csv". Search volume not
# measured.
#
# What makes it more than a keyword sorter: it holds out what is NOT an expense
# (mortgage principal, improvements, transfers, deposits) instead of dumping it
# in the totals; a mortgage payment stays out until the owner types the year's
# interest from Form 1098; nothing ambiguous is guessed, it is listed as
# uncategorised; equal-and-opposite rows pair off as transfers; every row in
# the CSV names the rule that decided it, so a preparer can audit it.
#
# Privacy is the liability boundary: the file never leaves the browser (a test
# asserts no network calls), so the portfolio holds no bank data and needs no
# bank credential or aggregator.
#
# Path to revenue (payment rails stay off): lead magnet into the depreciation,
# security-deposit and rent-roll tools; GitHub Sponsors. A paid tier, if usage
# appears, is saved rule sets and multi-year comparison, local-only, behind an
# env-var switch; not built. Not built: bank aggregation (Plaid), which needs
# credentials and terms review.
#
# Liability: arithmetic and keyword matching on the user's file, model and
# omissions stated on the page, no tax advice, no warranty, independent-of-
# every-bank-and-the-IRS clause, repair-versus-improvement flagged and never
# decided, depreciation not modelled.
#
# Unverified: column names are matched by alias and no real bank export was
# available; the Schedule E line numbers are those of the 2024-era form and the
# page tells the reader to check their year's form. The first user report of an
# unread file is the priority fix.

hypotheses:
  - claim: >-
      Small landlords will drop a year of bank CSVs into a no-signup tool to get
      Schedule E line totals per property rather than build the pivot by hand or
      pay for a bookkeeping subscription.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Landlords come back every tax season and add their own keyword rules, so
      the rule box, not the built-in list, is what makes the second visit
      faster than the first.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong line, or a real bank export the tool cannot read, at which point the parser or the rules need revisiting.

