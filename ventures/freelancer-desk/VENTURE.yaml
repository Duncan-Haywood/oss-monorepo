name: freelancer-desk
description: >-
  Free freelancer dashboard that runs in the browser with no account: reads the
  data Estimate Maker, Time Tracker, Invoice Maker and Expense Tracker keep on
  the device and shows what clients owe (aged, overdue first), time worked but
  not billed, open quotes, net profit, a tax set-aside and the next quarterly
  estimated date, a per-client table with effective hourly rate, a to-do list
  ranked by dollars, and one backup file for all four tools. Data stays on the
  device.
stage: prototype
owner: duncan

# Screened 2026-10-07 in a new-venture-first session, as the hub of the
# freelancer loop: estimate-maker -> time-tracker -> invoice-maker ->
# expense-tracker -> freelancer-desk. Each of the four answers one question;
# nothing answered "what do I do first today?" across all of them, and a user
# of one tool had no reason to find the others.
#
# Paid market is real: FreshBooks (about $19-60 a month), Bonsai, HoneyBook,
# Wave and QuickBooks Self-Employed sell exactly this joined-up view. The wedge
# is private, no signup, no client limit, and it is built on top of tools that
# already hold the data, so there is nothing to import.
#
# First visitor: the four sibling tools' visitors (each links here), plus
# searches such as "freelancer dashboard", "how much do my clients owe me",
# "freelance income tracker free". Volume not measured with an external tool.
#
# Honest limits, stated on the page: reads one browser's storage (data kept on
# another device is invisible), set-aside is a chosen share not a tax
# calculation, income counts the paid share of invoices issued this year.
#
# Path to revenue (payments stay off): free tool -> lead magnet that makes the
# four siblings stickier; donations via GitHub Sponsors. Natural next steps if
# it earns repeat visitors: a PWA/Android wrapper with a weekly "who owes you"
# reminder, a client page with a mailto-ready overdue nudge, a year-end
# accountant export, and an optional BYO-key AI summary of the week.

hypotheses:
  - claim: >-
      A freelancer who has used one sibling tool will open the desk to see the
      combined number, and will then start using a second tool to fill in a
      blank card.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      A ranked "do this first" list with dollars attached brings users back
      weekly, where the single-purpose tools bring them back only at invoice
      or tax time.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong figure (owed, unbilled, income) relative to the sibling tools, or a restore that overwrote data they did not expect.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/freelancer-desk/
  analytics: null
