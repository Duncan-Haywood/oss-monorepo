name: fishing-charter-trip-pricing-calculator
description: >-
  Free browser tool for fishing charter captains: enter trip length, fuel burn and price, deckhand pay, bait and
  supplies, yearly fixed costs, trips booked, weather cancellations, card fee and a take-home target, and see the
  break-even price, the target price per trip and per angler, the effect of weather and fuel moves, and how the price
  you charge now performs. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06 in a new-venture-first session. Not in ventures/ (food-truck-event-margin-calculator and
# dj-gig-profit-calculator are neighbours in per-event pricing; no marine or guide-trip tool), not in screened-out.md.
# Searches by captains and guides: "charter fishing pricing calculator", "how much to charge for a fishing charter",
# "charter boat break-even".
#
# Who: inshore and offshore charter captains, guides, and part-time owner-operators setting a first rate card.
# First visitor: a captain deciding next season's half-day and full-day rates.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. A season planner with
# booking calendar and deposit templates is a possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with visible rules; carries the no-warranty and not-advice clauses
# and lists what is not decided (licensing, insurance, tax, gratuities).
#
# Unverified: no market rate is claimed; the sample figures are illustrative only.

hypotheses:
  - claim: >-
      A charter captain setting next season's rates will enter fuel, crew, fixed costs and expected cancellations to
      get a break-even and target price per trip, because rule-of-thumb pricing ignores fixed costs spread over
      weather-cancelled days.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool by 2027-03-15.
  - A report that the price arithmetic differs from the stated rules on the same inputs.
