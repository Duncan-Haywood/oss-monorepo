name: uk-maternity-pay-calculator
description: >-
  Free browser tool for UK expecting parents: enter due date, start date and average weekly pay to see Statutory Maternity Pay or Statutory Paternity Pay eligibility, the qualifying week, week-by-week pay for 39 weeks, the total and the gap against normal pay. Nothing is uploaded. Not tax or legal advice.
stage: prototype
owner: duncan

# Screened 2026-10-14 in a new-venture-first session; no UK maternity pay tool in ventures/ (uk-statutory-sick-pay-calculator is a sibling, not an overlap).
#
# First visitor: an expecting UK employee searching "maternity pay calculator", "statutory maternity pay 2026", "how much is paternity pay".
# Very high-volume, evergreen, planning-driven (people budget months ahead), with a natural link to take-home pay and child benefit tools here.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Competes with the GOV.UK and Money Helper calculators by adding week-by-week pay, the qualifying-week dates and the gap against normal pay in one result.
#
# Liability: rules written from memory without network access; the 2026/27 flat rate (194.32) and lower earnings limit (129) are the least certain figures. Every result names GOV.UK as the source to verify,
# carries no-warranty and not-tax-or-legal-advice clauses, and says what it does not decide (Northern Ireland, shared parental pay, Maternity Allowance, contractual schemes, tax). Ethical risk is a wrong amount relied on for a household budget; mitigated by sourcing and "ask your employer for the calculation" steps.
hypotheses:
  - claim: >-
      Expecting UK parents will use a free calculator to see their week-by-week statutory pay and plan the income drop before telling their employer.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a cap, rate or date differs from GOV.UK guidance on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-maternity-pay-calculator/
  analytics: null
