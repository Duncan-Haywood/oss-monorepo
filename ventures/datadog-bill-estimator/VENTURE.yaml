name: datadog-bill-estimator
description: 'Free, zero-network, zero-dependency browser tool + CLI that estimates a monthly Datadog bill from the user''s own usage numbers (hosts by plan, containers, custom metrics, log GB ingested and million events indexed with retention, APM hosts, synthetics runs) at editable approximate list prices, and ranks the changes that cut it most (log exclusion filters, shorter retention, flex or archive, custom-metric tags, rightsizing, annual billing) with a dollar saving each; accepts a product,usage CSV and a --budget CI gate. A deterministic calculator over the user''s inputs, not a bill reader and not a guarantee of spend.'
stage: prototype

owner: duncan

# CLI/checker archetype, not a trade-bid calculator (portfolio/pipeline/
# README.md "archetype itself"). duplicate_check.py (run 2026-10-03) scored the
# closest ventures: prometheus-cardinality-cost 0.31 (series count from one
# scrape, not a bill model), terraform-plan-cost-estimate 0.22, aws-bill-change-
# explainer 0.22 -- nothing prices Datadog or ranks observability-bill levers.
# Not in screened-out.md.
#
# Where the first real visitor would come from: the search phrases "datadog
# bill too high", "reduce datadog costs", "datadog pricing calculator", "datadog
# log indexing cost"; r/devops, r/sre and r/aws threads titled "our Datadog bill
# doubled"; Hacker News posts about observability cost. The buyer-ish reader is a
# platform/SRE lead with a five-figure monthly Datadog invoice and a finance
# deadline. Datadog's own pricing page is a rate card, not a "what should I
# change first" ranking, and vendor cost tools live inside the paid account;
# this works from typed numbers with no account and fits a CI budget gate --
# that is the wedge. A hosted usage-trend monitor is the natural paid upgrade
# path later. Cross-links prometheus-cardinality-cost (the custom-metrics lever).
hypotheses:
  - claim: An engineer whose Datadog invoice just jumped will search for how to cut it, enter their usage, and learn which lever saves the most dollars.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A platform team will add the CLI to CI with --budget so a usage change that pushes the estimate over budget fails review instead of the invoice.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool calculates only from typed numbers in
  # the visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No external repository is found wiring cli.mjs into its own CI within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/datadog-bill-estimator/
  analytics: null
