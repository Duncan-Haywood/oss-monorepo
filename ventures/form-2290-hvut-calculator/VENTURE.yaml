name: form-2290-hvut-calculator
description: >-
  Free browser calculator for truckers and small fleets: list trucks with taxable gross weight and first-use month and get the Form 2290
  heavy highway vehicle use tax per truck ($100 at 55,000 lb plus $22 per 1,000 lb, $550 cap, 75% for logging), prorated by month for the
  July-June period, with filing deadlines, 5,000-mile suspended trucks and cost per mile. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. No existing venture covers Form 2290 / HVUT; nearest are owner-operator-cpm-calculator
# (operating cost per mile) and owner-operator-per-diem-calculator. Neither computes this annual federal tax.
#
# Why this niche: roughly 500,000 trucks file Form 2290 each year and every owner-operator and fleet owner has to, every July. The IRS
# rate table is a lookup and the proration is month counting; paid e-file sites sell the filing, not the plan. Searches like
# "form 2290 calculator" and "hvut tax for 80000 lbs" are exactly this.
#
# First visitor: owner-operators, small fleet owners and dispatchers searching "form 2290 calculator", "heavy highway vehicle use tax",
# "2290 tax for 80000 lbs". Volume not measured with an external tool.
#
# Liability boundary: arithmetic over weights and months the user types in; nothing stored; not tax advice; states what is not modelled
# (credits for sold or destroyed vehicles, exempt vehicles, penalties, actual filing) and carries the no-warranty and no-SLA clauses.
# Rates from IRC 4481; verify against the current Form 2290 instructions.
#
# Path to revenue (payment rails stay off): lead magnet into the owner-operator cluster plus donations. A paid layer (IRS-authorized
# e-file provider integration, fleet reminders) needs accounts and IRS authorization, so an owner decision; not built.

hypotheses:
  - claim: >-
      Owner-operators and small fleet owners will type their trucks into a no-signup calculator to see what Form 2290 costs per truck
      and when it is due, because filing sites only show the number after account creation.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing the cost of the next weight bracket and the 5,000-mile suspension changes purchase and registration decisions for spare trucks.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Truckers report that mileage-use amended returns or credits for sold vehicles are the common need, at which point the tool should model it.

