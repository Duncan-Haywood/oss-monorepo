name: appointment-deposit-calculator
description: Free browser calculator for small service businesses that sets an appointment deposit, shows cash secured and balance due, and drafts a clear deposit and cancellation policy.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small appointment businesses will use a deposit calculator to choose a service-specific upfront amount and copy its policy draft into their booking workflow.
    status: untested
    checked: null
    evidence: customer-contact
