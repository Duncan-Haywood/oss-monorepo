name: appointment-deposit-calculator
description: Free browser calculator for small service businesses that sets an appointment deposit, shows cash secured and balance due, compares a year of revenue with and without the deposit against their no-show rate to show whether it pays for itself and at what break-even booking rate, and drafts a clear deposit and cancellation policy.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small appointment businesses will use a deposit calculator to choose a service-specific upfront amount and copy its policy draft into their booking workflow.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Searchers asking how much deposit to charge need a decision tool distinct from no-show fee calculators.
    status: untested
    checked: null
    evidence: in-repo
  - claim: Owners deciding whether to require a deposit at all need a net-revenue comparison, not a cash-secured total — "secured cash" reads as new money when it is revenue moved earlier, so a tool that only reports it can talk someone into a policy that costs them bookings.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The break-even booking rate is the number owners act on, because it converts an unknowable judgement ("will a deposit put people off?") into one they can sanity-check against their own experience ("would I still keep 9 in 10 enquiries?").
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - No return usage or organic referral signal within 60 days of public deployment.
  - No unsolicited feedback, star, fork, or referral within 90 days of publishing.
links:
  production: null
  analytics: null
