name: appointment-deposit-calculator
description: Free browser calculator for small service businesses that sets an appointment deposit, shows cash secured and balance due, compares a year of revenue with and without the deposit against their no-show rate to show whether it pays for itself and at what break-even booking rate, and drafts a clear deposit and cancellation policy. A dedicated tattoo-shop page (tattoo-deposit-and-touchup-calculator.html) adds touch-up-specific math the generic recurring-appointment model cannot answer -- whether a given client's touch-up falls inside the shop's free window, and what it costs by percent, flat fee, or hourly rate once that window has closed.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small appointment businesses will use a deposit calculator to choose a service-specific upfront amount and copy its policy draft into their booking workflow.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Independent tattoo artists and shops will use a dedicated deposit-and-touch-up calculator, distinct from the generic appointment-deposit tool, because their real friction is a single-client touch-up decision (is this specific client still inside my free window, and what do they owe if not) rather than an annual recurring-booking model. Searched from r/TattooArtists, tattoo-industry business forums, and Facebook shop-owner groups, and via search terms like "tattoo touch up pricing" and "tattoo deposit policy calculator".
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Searchers asking how much deposit to charge need a decision tool distinct from no-show fee calculators.
    status: untested
    checked: null
    evidence: in-repo
  - claim: Owners deciding whether to require a deposit at all need a net-revenue comparison, not a cash-secured total — "secured cash" reads as new money when it is revenue moved earlier, so a tool that only reports it can talk someone into a policy that costs them bookings.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The break-even booking rate is the number owners act on, because it converts an unknowable judgement ("will a deposit put people off?") into one they can sanity-check against their own experience ("would I still keep 9 in 10 enquiries?").
    status: untested
    checked: null
    evidence: customer-contact
economics:
