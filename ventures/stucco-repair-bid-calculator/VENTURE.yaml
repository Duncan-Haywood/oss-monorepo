name: stucco-repair-bid-calculator
description: A private browser calculator for stucco and EIFS contractors that prices a repair from crack linear feet, hollow area, tear-off to the substrate, stories and scaffolding, window flashing, color match, and moisture investigation — and shows the price per square foot of hollow-plus-tear-off, the hours the first second-story lift actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent plasterers will use a crack-and-tear-off bid calculator because the generic price-per-square-foot rules of thumb they are shopped on cannot see that 40 feet of first-story hairline crack is a different job from 180 square feet of second-story EIFS torn back to the substrate with new mesh, four window flashings, and a moisture investigation.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-square-foot number) are the two figures a plasterer actually decides on when a homeowner asks them to match a cheaper crack-patch quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating scaffolding, tear-off, flashing, and color match as their own hours, instead of a blended add-on to repair square footage, changes the bid enough that shops notice which part of a high number is the first second-story lift.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified stucco or EIFS contractors use the calculator twice within 90 days.
  - Contractors report that splitting crack feet, tear-off, stories, and flashing is more work than their existing per-square-foot method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/stucco-repair-bid-calculator/
  analytics: null
