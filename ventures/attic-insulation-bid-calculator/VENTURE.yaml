name: attic-insulation-bid-calculator
description: A private browser calculator for insulation contractors that prices a blown-in attic job from floor areas, existing versus target R-value, bag yield, air-sealing penetrations, and baffles — labor hours, loaded wage, bags, dumpster, overhead, and margin — and shows the bag count, the inches added, the share of labor that is air sealing, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent insulation contractors will use an R-delta bag calculator because the flat price-per-square-foot specials they compete with cannot see that an attic already at R-30 going to R-38 is a different truckload from the same attic sitting at R-13 going to R-49, which is how a bid that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the bag count are the two numbers a contractor actually decides on when a homeowner asks them to match a neighborhood special, more than the job price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Air sealing, bag yield, and payroll burden are the three costs most often left out of a small insulation crew's own quote, so making all three required, explained inputs changes the resulting bid materially.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified insulation contractors use the calculator twice within 90 days.
  - Contractors report that the R-delta bag model is more work than their existing method without changing the price they would have bid.
  - The starting bag yields prove so far from real products that the tool cannot be used without data we have no way to gather.
