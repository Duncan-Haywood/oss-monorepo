name: music-lesson-studio-room-rent-profit-calculator
description: >-
  Free browser calculator for independent music teachers and small music schools that rent room time by the hour: enter private, paired and group lesson prices, class sizes,
  lesson minutes, room rent rate, hours rented, teacher pay, cancellations and card fees, and see profit per lesson and per room hour, the price each format needs for a target margin,
  the students per class needed to break even, and what rented-but-empty room hours cost per week. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-11 in a scheduled session. `duplicate_check.py` top match 0.30 (driving-teacher-lesson-pricing-calculator); no venture models room rent against lesson format.
# The recurring decision of an independent music teacher renting a room by the hour: a private lesson puts the whole room hour on one student, a group spreads it, and unfilled rented hours are
# paid for regardless. Not in screened-out.md.
#
# First visitor: independent music teachers and small music-school owners searching "how much to charge for private music lessons", "group vs private music lessons profit" and
# "music teacher room rent cost per hour"; music-teacher and studio-owner communities (private-teacher forums, r/musicteachers). Volume not measured with an external tool.
# Timing: peaks in late August to September (new school-year enrolment) and again in January.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; says it is not an estimate of record; says what is not modelled; tips are ignored;
# carries the no-warranty and no-SLA clauses. It does not advise on child-safeguarding rules, background checks or teacher certification.
#
# Path to revenue (payment rails stay off): lead magnet and donations.

hypotheses:
  - claim: >-
      Independent music teachers who rent room time will type a typical week's classes and the room rate into a no-signup calculator to set lesson prices and choose between private,
      paired and group formats, because most price by what other teachers charge and never cost the rented room hour or the empty ones.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

