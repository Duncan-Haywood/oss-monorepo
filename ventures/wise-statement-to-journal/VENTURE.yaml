name: wise-statement-to-journal
description: >-
  Free browser tool that turns a Wise (multi-currency account) balance statement into balanced accounting journals for
  Xero, QuickBooks Online and QuickBooks Desktop (IIF), valued in the currency the books are kept in. Rates are typed
  in by the user; each foreign balance is tracked at average cost, so money received, sent, spent on the card, paid as
  fees or converted is booked to its own account and the realised exchange gain or loss lands on its own line. The
  running balance is proved row by row (newest-first order and fees inside or on top of Amount are detected), a typed
  closing balance is checked, conversions go to a clearing account that nets across balances, and a workings CSV shows
  rate, value, cost and gain per row. The statement is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06: no existing venture covers multi-currency bank statements with FX. The family of *-to-journal
# ventures covers single-currency payout platforms (Stripe, PayPal, Ko-fi...) and bank-csv-to-qbo-converter covers
# ordinary single-currency bank files; none values a foreign balance in a base currency or books realised FX.
# Commercial analogues: Xero's and QuickBooks' own multi-currency modules, Wise's own accounting integrations and
# A2X / Synder style sync sold per month; the no-account, no-upload, one-statement-at-a-time version is the gap.
# Search phrases: "Wise to QuickBooks", "Wise to Xero", "record Wise multi-currency in QuickBooks", "realised FX gain
# loss Wise", "Wise bookkeeping foreign exchange". Volume not measured with an external tool.
#
# Who: freelancers, agencies and small exporters paid in EUR/GBP/etc. into Wise who keep books in USD (or the reverse),
# and the bookkeepers serving them, who today book the converted deposit and let FX disappear into the bank line.
#
# Path to revenue (payment rails stay off): lead magnet. If usage appears, the paid layer is what a browser page
# cannot do: stored rates (ECB daily series), multiple balances in one run with automatic clearing matches,
# FIFO/specific-lot cost, year-end unrealised revaluation entries, and a bookkeeper batch mode. Not built.
#
# Liability: arithmetic on the user's own file and typed rates; shows the checks it ran, states what it does not check
# (tax treatment of FX, unrealised gains), and carries the no-warranty, independent-of-Wise and financial-data clauses.
#
# Unverified: the Wise statement column names, whether Total fees sit inside or on top of Amount (detected from the
# running balance instead of assumed), the DD-MM-YYYY date format, and the Xero, QuickBooks Online and IIF import
# layouts are from memory of public help documents; nothing ran against a real statement or a live import. The first
# statement this misreads is the priority fix.

hypotheses:
  - claim: >-
      A freelancer or bookkeeper with a Wise foreign-currency balance will paste a statement into a no-upload page to
      get month-split journals with the realised FX booked, because the alternatives are ignoring FX or building a
      per-row cost spreadsheet.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted statement structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a statement this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

