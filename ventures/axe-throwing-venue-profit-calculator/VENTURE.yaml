name: axe-throwing-venue-profit-calculator
description: >-
  Free browser tool for people planning or running an axe-throwing or throwing-sports venue:
  enter lanes, hours, fill, price per thrower, league nights, corporate events, drinks and
  snacks, coaches, rent, insurance, the build cost and any loan and see monthly profit, margin,
  months to pay back the build, break-even fill, the lowest price for a target margin and for a
  payback target, a sensitivity check at 10% and 20% fewer walk-in visits, and a two-scenario
  comparison. Copy, CSV, save and load. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-12 in a new-venture session with duplicate_check.py (nearest 0.33, so the
# niche was clear). Why this niche: an axe-throwing venue costs $150k-$500k to build in a small
# lease, and its owners price the lane by copying the venue down the road. The money question is
# fill: how many walk-in lane slots must sell, at what price per thrower, before rent, coaches,
# insurance and the loan are covered, and how much of the margin rests on recurring league seasons
# and corporate events (which also take lane time from walk-ins). Franchise pro formas answer it
# only after a sales call.
# This is the lead magnet for a later paid multi-attraction planner (payment rails stay off).
#
# First visitor: prospective and new axe-throwing venue owners searching how much an
# axe-throwing business makes. Volume not measured with an external tool.
#
# Liability boundary: arithmetic on user-typed numbers. Not tax, legal, lending or financial
# advice; says so. Names no league, franchise or equipment maker. No data fetched, no
# accounts, nothing stored.

hypotheses:
  - claim: >-
      Prospective axe-throwing venue owners will enter their lanes, price and costs into a
      no-signup tool and use the break-even fill and payback numbers to decide on a lease or
      the size of the build.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a lowest price that does not reproduce the tool's own target margin when typed back in as the price per thrower.
  - A user reports a lowest payback price that does not reproduce their payback target when typed back in as the price per thrower.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/axe-throwing-venue-profit-calculator/
  analytics: null
