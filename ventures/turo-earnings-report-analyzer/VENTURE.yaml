name: turo-earnings-report-analyzer
description: >-
  Free browser tool that turns a Turo host earnings or trip-history CSV into
  per-vehicle and per-trip profit after Turo's fee, cleaning, fuel and delivery
  costs and each car's monthly loan, insurance and depreciation, with
  utilization, revenue per rented day and the cars losing money. The file is
  read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. Turo hosts running several
# cars are a small-business market with real money at stake (loan, insurance and
# depreciation on each car) and one recurring question: "which of my cars is
# actually profitable?" Existing answers are host-tracking apps and spreadsheets
# (Portier-style fleet tools, Hurdlr, hand-built sheets) that want an account or
# an afternoon. Hosts already hold the file: Turo's earnings and trip-history
# exports. duplicate_check.py-style overlap: turo-host-payout-calculator prices one
# trip's fee matrix; nothing reads a host's own history. Linked both ways.
#
# First visitor: r/TuroHosts, r/Turo, host Facebook groups asking "is my car
# making money after the loan and insurance"; search phrases "turo profit
# calculator", "turo host earnings spreadsheet", "is turo worth it per car".
# Volume not measured with an external tool.
#
# What makes it more than a sum: per-car fixed cost is charged for every month of
# the period, so an idle car shows its real loss; utilization and break-even
# utilization are shown per car; cancelled trips are handled by whether they paid;
# the fee is read from the file and only assumed (stated) when the file lacks it;
# weekday and booking-length findings ignore groups under five trips.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts the page has no network calls), so the portfolio
# holds no host or guest data and needs no partner API.
#
# Path to revenue (payment rails stay off): lead magnet, with a tie-in to the
# turo-host-payout-calculator already published. A paid version, if usage appears,
# is a month-over-month fleet diff behind an env-var switch; not built.
#
# Liability: arithmetic on the user's file and typed costs, model and omissions
# stated on the page, default fee percentage stated as an assumption to check
# against the Host Hub, no tax or insurance advice, no warranty, independent-of-Turo
# clause.
#
# Unverified: column names are from memory of Turo exports and matched by alias;
# no real export was available, so the first user report of an unread file is the
# priority fix.

hypotheses:
  - claim: >-
      Turo hosts with more than one car will run a no-signup analysis of an
      earnings export they already hold before building a spreadsheet or paying
      for a fleet tracker.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing utilization and net per rented day after fixed costs changes at
      least one decision about a car (reprice, delist or sell), which is the
      reason to come back with each new export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong profit figure, or a real export the tool cannot read, at which point the parser needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/turo-earnings-report-analyzer/
  analytics: null
