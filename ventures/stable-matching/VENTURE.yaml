name: stable-matching
description: >-
  Free browser tool, CLI and agent call for anyone matching two sides that
  rank each other (residents and programmes, students and schools, mentees
  and mentors, volunteers and shifts) and for students of matching theory:
  Gale-Shapley deferred acceptance with capacities and either side
  proposing, every stable matching with the egalitarian and minimum-regret
  picks, and a blocking-pair check for a matching you already have. Checked
  against the Python matching package and a brute-force search. Nothing is
  uploaded.
stage: prototype
owner: duncan

# Built 2026-11-17 on an explore run as a research-algorithm tool: no
# venture README mentioned stable matching or Gale-Shapley (searched all
# venture READMEs). Implemented from Gale & Shapley 1962, McVitie & Wilson
# 1971, Gusfield & Irving 1989, Irving, Leather & Gusfield 1987, Gusfield
# 1987 and Roth 1982, 1984, 1986; no third-party code was ported. The
# Python matching package 1.4.3 (MIT) was used only to produce
# eval/reference.json. Example data are made up and labelled so
# (data/SOURCE.md).
#
# First visitor: searches such as "stable matching calculator", "Gale
# Shapley algorithm online", "deferred acceptance calculator", "residency
# match simulator", "mentor mentee matching tool", "stable marriage problem
# solver". Volume not measured with an external tool.
#
# Alternatives: the Python matching package and R's matchingR (need code),
# NRMP's own explainer (one fixed instance), online Gale-Shapley demos (not
# surveyed for this file). Differentiators here: no install, capacities,
# every stable matching with the compromises plotted, a check of a matching
# made by hand.
#
# Liability: arithmetic on supplied lists, not legal or professional
# advice; the page says real admissions and hiring processes have rules of
# their own and that it is not affiliated with any matching programme. Data
# never leave the browser (tests assert no network calls).

hypotheses:
  - claim: >-
      Small organisers (mentoring schemes, volunteer rotas, course
      allocations) and students of matching theory will use a no-install
      tool that both runs a match and checks one made by hand.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a matching that differs from an established implementation on the same lists, and the cause is a bug that cannot be fixed.

links:
  production: https://marisstella.app/stable-matching/
  analytics: null
