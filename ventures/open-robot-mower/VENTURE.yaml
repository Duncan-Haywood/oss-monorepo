  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, forks or build reports) engage within 120 days of the page being reachable from the published site.
  - A builder reports that the blade cannot be made to stop within the 1 s design target with the specified relay brake, and no change to the design fixes it.

