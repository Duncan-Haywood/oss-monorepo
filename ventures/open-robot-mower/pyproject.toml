[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mowerbot"
version = "0.1.0"
description = "Open-source robot lawn mower: lawn coverage planner, RTK mowing simulation, battery sessions, blade stop-time and slope calculators, ESP32 protocol"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["robot lawn mower", "robotic mower", "DIY", "RTK GNSS", "coverage planning", "raspberry pi", "esp32", "open hardware"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
serial = ["pyserial"]

[project.scripts]
mowerbot = "mowerbot.cli:main"

[project.urls]
Homepage = "https://duncan-haywood.github.io/monorepo-projects/open-robot-mower/"
Source = "https://github.com/duncan-haywood/oss-monorepo/tree/main/ventures/open-robot-mower"

[tool.setuptools.packages.find]
where = ["src"]
