name: brevo-contacts-csv-check
description: >-
  Free browser tool that checks a Brevo (formerly Sendinblue) contacts import CSV before it is
  uploaded: rows with neither an email address nor an SMS number, invalid and duplicate emails
  (capitals ignored), SMS numbers with no country code, more than 15 digits or turned into scientific
  notation by Excel, unquoted commas that shift every later column, headers like Mobile or Prenom that
  will not map to the built-in attribute, and date columns that mix day-first and month-first, each
  with its line number, plus a safe-fixes pass that cleans formatting only and never adds a country
  code or touches a name, a custom value or anything about consent. The file is read locally and never
  uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05 in a new-venture-first session. Brevo is the largest European email + SMS
# platform for small businesses, and every migration into it (from a spreadsheet, a shop, a CRM or
# Mailchimp) is a CSV import. The portfolio checks Mailchimp, Klaviyo, HubSpot, Shopify and generic
# email lists; nothing reads the file Brevo's importer expects. Brevo's distinguishing faults are the
# SMS ones: a national number with a leading 0 and no country code, and Excel turning long numbers into
# scientific notation, plus French/EU spreadsheets saved with semicolons and day-first dates.
#
# First visitor: small-business owners, agencies and freelancers in Europe/Canada searching literal
# symptoms ("Brevo import contacts error", "Sendinblue CSV SMS country code", "Brevo import semicolon").
# Volume not measured with an external tool.
#
# Privacy is the liability boundary: a contact list is personal data, so the file never leaves the
# browser (a test asserts no network calls). Consent is the second boundary: the page says formatting
# is all it checks, never creates or changes consent, and its safe fixes never touch a consent or
# status column or add a country code (tests pin both).
#
# Rules are read from memory of Brevo's public CSV import help, shown on the page with an explicit
# not-checked list (deliverability, existing contacts, blocklists, limits).
#
# Path to revenue (payment rails stay off): lead magnet for the small-business email/SMS audience and
# agencies, cross-linked to the Mailchimp, Klaviyo, HubSpot and email-list checkers. A paid version, if
# usage appears, is bulk checks across client files with saved rules behind an env-var switch; not built.
#
# Liability: format checks on the user's own file, rules stated as read from memory, no warranty, not
# legal advice on messaging law, independent-of-Brevo clause, trademark used nominatively.
