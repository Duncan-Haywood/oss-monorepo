<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cut List Optimizer | Reduce Wood and Material Waste</title>
  <meta name="description" content="Free cut list optimizer for woodworking and sign shops. Turn stock lengths, kerf, and required cuts into a low-waste cutting plan in your browser.">
  <meta property="og:title" content="Cut List Optimizer for Woodworkers"><meta property="og:description" content="Plan stock cuts, reduce offcuts, and see material utilization without uploading your project.">
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"Cut List Optimizer","applicationCategory":"BusinessApplication","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"featureList":"quantity-aware cut list, kerf allowance, stock utilization, waste estimate"}</script>
  <style>
    :root{font-family:ui-sans-serif,system-ui,sans-serif;color:#20241d;background:#f1eee6}body{max-width:1040px;margin:auto;padding:34px 18px}header{max-width:760px}.eyebrow{color:#b44f2a;font-weight:800;letter-spacing:.12em;font-size:.75rem}h1{font:800 clamp(2.4rem,7vw,5rem)/.94 Georgia,serif;letter-spacing:-.06em;margin:8px 0 18px}p{line-height:1.55}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}section{background:#fffdf8;border:1px solid #d6d0c3;border-radius:16px;padding:22px;box-shadow:0 10px 30px #3328170d}h2{margin-top:0;font-size:1.1rem}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;font-size:.88rem;font-weight:700}input,textarea{font:inherit;border:1px solid #aaa394;border-radius:8px;padding:11px;background:#fff}textarea{min-height:200px;resize:vertical}.wide{grid-column:1/-1}.summary{background:#24392b;color:#f8f5eb;border-color:#24392b}.big{font:800 3.5rem Georgia,serif;margin:4px 0 18px;color:#e9be76}dl{display:grid;grid-template-columns:1fr auto;gap:10px}dt,dd{margin:0}dd{font-variant-numeric:tabular-nums;font-weight:700}.bar{border-top:1px solid #ffffff30;padding:11px 0}.bar strong{display:block}.muted{opacity:.75;font-size:.84rem}footer{font-size:.8rem;color:#5c5b52;margin-top:24px}@media(max-width:700px){.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><p class="eyebrow">FOR WOODWORKERS, SIGN SHOPS, AND MAKERS</p><h1>Buy less stock. Cut with a plan.</h1><p>Paste the pieces you need, add your stock length and saw kerf, and get a bar-by-bar cutting plan that exposes offcuts before you buy material. Everything runs in this browser.</p></header>
   <main class="layout"><section><h2>Stock and required cuts</h2><div class="fields"><label>Stock length<input id="stock" type="number" min="0.01" step="0.01" value="96"></label><label>Saw kerf per cut<input id="kerf" type="number" min="0" step="0.01" value="0.125"></label><label class="wide">Required cuts, one per line<br><span class="muted">Use <code>24 x 3</code> for three pieces at 24</span><textarea id="cuts">48
   <button type="button" id="copy-plan" disabled>Copy cut plan</button> <span id="copy-status" role="status"></span>
   <footer><label><input id="optout" type="checkbox" style="width:auto;display:inline"> Do not keep anonymous local usage counts</label><p><strong>No warranty.</strong> This free tool is provided as-is. It is not engineering, financial, or business advice and does not replace a qualified professional. Review and verify the plan, dimensions, tool setup, and material before cutting. To the maximum extent permitted by law, the authors accept no liability for loss or damage arising from its use.</p><p>Everything runs in your browser. Your cut list is never uploaded. Anonymous calculation events are counted only in local storage, can be switched off above, and are never sent to an analytics vendor.</p></footer>
   </main>
  <script type="module">
     import { parseCuts, optimizeCutList, formatCutPlan } from './calc.mjs'; import { recordUsage } from './usage.mjs';
     const $ = id => document.getElementById(id); const format = n => `${n.toFixed(2)} units`; const copy = $('copy-plan');
     function update() { try { const result = optimizeCutList({ stockLength: Number($('stock').value), kerf: Number($('kerf').value), cuts: parseCuts($('cuts').value) }); $('headline').textContent = `${result.bars.length} stock piece${result.bars.length === 1 ? '' : 's'}`; $('message').textContent = 'Largest cuts are placed first to keep the plan compact. Confirm against your actual saw and stock.'; $('bars').textContent = result.bars.length; $('used').textContent = format(result.totalCuts); $('waste').textContent = format(result.waste); $('utilization').textContent = `${(result.utilization * 100).toFixed(1)}%`; $('plan').innerHTML = result.bars.map((bar, i) => `<div class="bar"><strong>Stock ${i + 1}: ${bar.cuts.map(format).join(' + ')}</strong><span class="muted">${format(bar.remaining)} remaining after kerf allowance</span></div>`).join(''); copy.disabled = false; copy.dataset.plan = formatCutPlan(result); recordUsage(localStorage, $('optout').checked); } catch (error) { $('headline').textContent = 'Check your list'; $('message').textContent = error.message; $('bars').textContent = $('used').textContent = $('waste').textContent = $('utilization').textContent = '—'; $('plan').textContent = ''; copy.disabled = true; copy.dataset.plan = ''; } }
      copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(copy.dataset.plan); $('copy-status').textContent = 'Plan copied.'; recordUsage(localStorage, $('optout').checked); } catch { $('copy-status').textContent = 'Clipboard access was blocked. Select the plan above and copy it manually.'; } setTimeout(() => { $('copy-status').textContent = ''; }, 4000); }); ['stock','kerf','cuts'].forEach(id => $(id).addEventListener('input', update)); ['stock','kerf','cuts'].forEach(id => $(id).addEventListener('change', () => recordUsage(localStorage, $('optout').checked))); $('optout').addEventListener('change', update); update();
  </script>
</body>
</html>
