name: cut-list-optimizer
description: A local browser tool for woodworking and sign shops that turns stock lengths and required cuts into a low-waste cutting plan.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small woodworking and sign shops will use a quick cut-list optimizer before buying stock because reducing offcuts saves material and setup time.
    status: untested
    checked: null
    evidence: customer-contact
economics:
