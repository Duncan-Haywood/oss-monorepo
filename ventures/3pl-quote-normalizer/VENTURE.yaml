name: 3pl-quote-normalizer
description: A browser calculator that compares third-party logistics quotes with in-house fulfillment costs.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small ecommerce brands need a neutral way to normalize opaque 3PL quotes.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing minimum charges and in-house break-even volume improves fulfillment decisions.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing leftover pallets at the long-term storage rate changes a quote that looked cheap at the fresh-storage line.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing restock vs destroy vs customer-keeps on a just-arrived return changes a policy that priced every return as inbound plus restock.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing 3PL assembly plus extra picks against pre-kitting and skipping the bundle changes a kit that looked profitable on AOV lift alone.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing pallet, carton, and loose inbound on the same quote changes a rate card that looked interchangeable on three receiving lines.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified brands use the calculator twice within 90 days.
  - Users do not identify at least one hidden fee or minimum in a real quote.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/3pl-quote-normalizer/
  analytics: null
