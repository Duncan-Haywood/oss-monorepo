name: dryer-vent-bid-calculator
description: A private browser calculator for dryer-vent techs that prices a wall-cap, roof-cap, or multi-dryer clean from extra stories, extra feet of duct, extra dryers, camera inspection, crushed-flex replacement, nest or blockage, and occupied-home access — and shows the price per dryer, the hours the first extra story actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent dryer-vent techs will use a stories-and-run bid calculator because the generic $99 special or flat-house rules of thumb they are shopped on cannot see that an 8-foot one-story wall cap is a different job from a 28-foot two-story roof cap with a camera pass.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published special) are the two figures a tech actually decides on when a homeowner asks them to match a cheaper wall-cap quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra stories, extra feet, extra dryers, a roof cap, a camera pass, crushed flex, a nest, and occupied-home access as their own hours, instead of a blended add-on to the special, changes the bid enough that shops notice which part of a high number is the first extra story.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified dryer-vent techs use the calculator twice within 90 days.
  - Techs report that splitting stories, run, and extras is more work than their existing special without changing the price they would have bid.
  - The starting hours and kit rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
