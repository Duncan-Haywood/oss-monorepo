name: ko-fi-payout-to-journal
description: >-
  Free browser tool that turns a Ko-fi transactions export into balanced accounting journals for Xero,
  QuickBooks Online and QuickBooks Desktop (IIF). It books donations, memberships, shop orders and commissions
  to separate income accounts by TransactionType, derives the Ko-fi and PayPal or Stripe fee as Given minus
  Received, proves the rows add up to the deposit typed in from PayPal, Stripe or the bank, splits an export
  that straddles a month end into one journal per month, and balances each to a Ko-fi clearing account.
  Types no rule recognises are journalled to an uncategorised account rather than dropped. The export is
  read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05. The commercial analogues are A2X and Synder (marketplace and payment-platform sync into
# Xero and QuickBooks, sold per month); this is the no-account, no-upload, one-export-at-a-time version for
# Ko-fi creators, whose money lands in PayPal or Stripe net of fees and mixed across tips, memberships, shop
# orders and commissions. Sibling of patreon-payout-to-journal, gumroad-sales-to-journal and the rest of the
# journal family; differs in that Ko-fi's export has Given and Received instead of a fee column (the fee is
# derived) and a TransactionType that drives which income account a row lands in.
# Search phrases: "Ko-fi to QuickBooks", "Ko-fi to Xero", "how to record Ko-fi donations in QuickBooks",
# "Ko-fi bookkeeping", "Ko-fi income accounting". Volume not measured with an external tool.
#
# Who: Ko-fi creators (artists, writers, streamers, commission takers) who keep their own books, and the
# bookkeepers serving several of them, who today book the net PayPal or Stripe deposit as income.
#
# Path to revenue (payment rails stay off): lead magnet for the creator and bookkeeper audience. If usage
# appears, the paid version is what a browser page cannot do: batch many clients, remember the account mapping
# per client, and add Substack, Buy Me a Coffee and Twitch exports. Not built.
#
# Liability: writes a journal from the user's own export, shows the check it ran, states what it does not
# check (tax treatment, currency conversion), and carries the no-warranty, independent-of-Ko-fi and
# financial-data clauses.
#
# Unverified: the column names of the Ko-fi transactions export, how the fee is split between Ko-fi and the
# processor, and the Xero, QuickBooks Online and IIF import layouts are from memory of public help documents;
# nothing ran against a real Ko-fi export or a live import. The first export this misreads is the priority fix.

hypotheses:
  - claim: >-
      A Ko-fi creator or their bookkeeper will paste a transactions export into a no-upload page to get a
      month-split journal, because the alternatives are booking the net deposit (hiding fees, mixing tips with
      sales) or paying a monthly sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a payout this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

