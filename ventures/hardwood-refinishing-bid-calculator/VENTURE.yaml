name: hardwood-refinishing-bid-calculator
description: A private browser calculator for hardwood floor refinishers that prices a sand-and-finish or screen-and-recoat job from field square footage, stair treads, closets, stain, and extra coats — and shows the price per square foot, the share of hours eaten by stairs, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Hardwood refinishers will use a stairs-and-closets bid calculator because the generic price-per-square-foot rules of thumb they are shopped on cannot see that fourteen treads, two closets, and a stain change are a different job from the same living-room field of screen-and-recoat.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the share of hours eaten by stairs (not the published per-square-foot number) are the two figures a contractor actually decides on when a homeowner asks them to match a cheaper floor-only quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating stain and extra coats as labor on the finish area, including treads and risers, instead of one blended "add 20%", changes the bid enough that contractors notice which part of a high number is stairs.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified hardwood refinishers use the calculator twice within 90 days.
  - Contractors report that splitting field, stairs, closets, and stain is more work than their existing per-square-foot method without changing the price they would have bid.
  - The starting hours prove so far from real crews that the tool cannot be used without data we have no way to gather.
