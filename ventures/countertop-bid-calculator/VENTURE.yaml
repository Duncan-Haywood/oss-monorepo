name: countertop-bid-calculator
description: A private browser calculator for stone fabricators that prices a quartz or granite countertop job from finished square footage, layout waste into whole slabs, sink and cooktop cutouts, edge profile, backsplash, and waterfall ends — and shows the price per finished square foot, the slabs the takeoff actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent stone fabricators will use a slabs-and-cutouts bid calculator because the generic price-per-finished-square-foot rules of thumb they are shopped on cannot see that a 28 sq ft waterfall island is a different job from a 40 sq ft galley with a drop-in sink.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the slab count (not the published per-square-foot number) are the two figures a fabricator actually decides on when a homeowner asks them to match a cheaper kitchen quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating waterfall ends as extra stone plus their own hours, instead of a blended add-on to finished footage, changes the bid enough that shops notice which part of a high number is the second slab.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified stone fabricators use the calculator twice within 90 days.
  - Fabricators report that splitting slabs, cutouts, edges, and waterfalls is more work than their existing per-square-foot method without changing the price they would have bid.
  - The starting hours and slab yields prove so far from real shops that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/countertop-bid-calculator/
  analytics: null
