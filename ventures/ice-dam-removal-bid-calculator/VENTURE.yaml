name: ice-dam-removal-bid-calculator
description: Free browser calculator for independent ice dam removal contractors (steam-based winter roof service) to price a job from linear feet of roof edge, crew size, an emergency/storm-call premium, and a minimum service charge floor, flag when a per-linear-foot rate card would fall short of what the job's largely fixed labor and equipment cost demands on a short run, and check the real profit once actual on-site hours (ice removal time is unpredictable) come in against the quote.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent ice dam removal contractors will use a calculator that separates the per-linear-foot rate card from the job's real cost, since a two-person crew, truck, and steam machine cost nearly the same to dispatch whether the eave needing ice cleared is 15 feet or 150 feet, and a rate that comfortably covers a long run can lose money on a short one.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Operators will use the break-even-rate-per-foot check specifically, because it tells them before the truck rolls whether their existing rate card and minimum service charge actually clear this specific job's fixed cost, rather than discovering it after an unprofitable short call.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Operators will use the actual-hours reconciliation after a job more than they will re-run the estimate before quoting, since ice thickness is unknown until the crew is on the roof and the phone-quote footage estimate is only ever a planning number.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - No repeat usage or organic traffic within 60 days of a public URL.
  - No unsolicited feedback, star, fork, or referral within 90 days of publishing.
  - Operators report that separating the rate card from the job's fixed cost is more work than their existing flat per-foot pricing without changing the number they would have quoted.
