name: pet-boarding-daycare-profit-calculator
description: >-
  Free browser tool for people planning or running a dog boarding and daycare business: enter kennel runs, daycare spots, prices, occupancy,
  the dogs-per-attendant ratio, rent, fit-out and a loan, and see monthly profit with staffing that steps up as dogs are added, break-even
  occupancy, the price change that reaches a target margin, a wage sensitivity table, a sixty-month ramp-up with the lowest cash point and
  payback, and loan coverage. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session. Nearest in ventures/ is dog-boarding-daycare-pricing (prices one reservation; this one is the whole-business pro forma with startup, loan and ramp-up), then self-serve-dog-wash-profit-calculator and
# coworking-space-profit-calculator (different business; neither models a staffing ratio). No pet boarding or kennel venture existed.
# Not in screened-out.md.
#
# First visitor: an aspiring or current kennel / dog daycare owner sizing a build or a lease; search phrases "dog boarding business plan
# calculator", "how much does a dog daycare make", "dog kennel break even occupancy". Volume not measured with an external tool.
#
# Who: owners and would-be owners of boarding kennels and dog daycares, a business with real fixed cost where staffing steps up one
# attendant at a time. Spreadsheet templates assume a straight line; the step and the ramp-up reserve are what they leave out.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. Saved scenarios and multi-location comparison
# behind an env-var switch is the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with every rule visible on the page. No price, occupancy or market is claimed, sample
# figures are labelled illustrative, bad input is rejected instead of clamped, and the page carries the no-warranty and not-advice
# clauses and lists what it does not decide (demand, licensing, zoning, noise, vaccination and bite liability, insurer ratio, tax).

hypotheses:
  - claim: >-
      A prospective or current kennel or daycare owner will enter runs, prices, occupancy and staffing ratio before signing a lease or
      expanding, because the break-even occupancy is hard to see when staffing costs step up one attendant at a time.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that the output, profit, break-even or payback arithmetic differs from the stated rules on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/pet-boarding-daycare-profit-calculator/
  analytics: null
