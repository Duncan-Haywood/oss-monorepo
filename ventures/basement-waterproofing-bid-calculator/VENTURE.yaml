name: basement-waterproofing-bid-calculator
description: A private browser calculator for waterproofing contractors that prices an interior French drain, exterior excavation, or crawl-space encapsulation from perimeter, wall height, window wells, crack repair, sump pit, backup pump, and freeze-protected discharge — and shows the price per lineal foot, the hours the wells and pit actually consume, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent waterproofing contractors will use a wells-and-pit bid calculator because the generic price-per-lineal-foot rules of thumb they are shopped on cannot see that a 55 lf seepage house with four window wells and a new sump is a different job from an 80 lf finished basement with an existing pit.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published per-lineal-foot number) are the two figures a contractor actually decides on when a homeowner asks them to match a cheaper drain-tile quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating window wells, a new pit, battery backup, and freeze-proof discharge as their own hours, instead of a blended add-on to lineal footage, changes the bid enough that shops notice which part of a high number is the first well.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified waterproofing contractors use the calculator twice within 90 days.
  - Contractors report that splitting wells, pits, backups, and discharge is more work than their existing per-lineal-foot method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
