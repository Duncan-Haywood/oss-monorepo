name: payment-reconciliation-workbench
description: Free browser workbench for matching payment-processor payouts to bank deposits and exporting a discrepancy review without accounting software.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small businesses using multiple payment processors will return to a local CSV matcher to reconcile deposits faster than spreadsheet formulas.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Matching only on amount-to-the-cent and a date window is more trustworthy than a fuzzy bank-feed importer that silently drops rows.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - No organic visits, forks, or repeat local usage after 60 days of availability.
links:
  production: null
  analytics: null
