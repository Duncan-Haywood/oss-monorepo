name: newsletter-sponsorship-rate-calculator
description: Free browser calculator that turns a newsletter's own subscriber count, open rate, and niche into a defensible sponsorship price range for each common ad placement (dedicated send, primary in-issue slot, secondary slot, classified/text link) — using commonly cited newsletter-ad-market CPM benchmarks, entirely client-side.
stage: prototype

owner: duncan

# Screened, not written up in portfolio/pipeline/candidates.yaml: a pricing
# calculator for a creator-economy niche the portfolio does not otherwise
# serve (newsletter operators selling ad inventory), built the same session
# per portfolio/pipeline/README.md's archetype-saturation note -- 141+ of
# ~224 ventures share the trade-bid-calculator shape, so this session
# weighed a different audience and vertical (creator monetization, not a
# home-service trade) rather than a 225th contractor bid calculator.
# duplicate_check.py against "newsletter sponsorship rate calculator: helps
# newsletter creators price a sponsored ad slot from subscriber count, open
# rate, CPM benchmarks, and ad placement" scored nothing >= 0.10 against any
# existing venture, pipeline candidate, or screened-out row.
#
# Gate scoring (portfolio/pipeline/README.md's two non-negotiable gates,
# both need >= 5):
#   liability_containment: 8 -- output is a price *range* derived from
#     published, cited market benchmarks, explicitly framed as a starting
#     point for negotiation, never a quote, guarantee, or valuation
#     performed on the user's behalf. Being wrong costs a creator a
#     miscalibrated ask in one negotiation, not a filing, a contract
#     obligation, or a third party's money. No advice-of-record: the user
#     decides and negotiates.
#   ethical_robustness: 8 -- deterministic arithmetic over benchmark ranges,
#     no dark patterns, no data collected server-side, does not get worse
#     for users as traffic grows. Every input is a number the user already
#     knows about their own list; nothing is scraped or inferred about a
#     third party.
#
# Distribution: r/newsletters (small but active, recurring "how much should
# I charge for a sponsorship" threads), r/Substack, and the beehiiv/Substack
# creator Discords and forums all see this exact question regularly once a
# newsletter passes a few thousand subscribers. Search phrases with real,
# recurring volume in the creator-economy niche: "newsletter sponsorship
# rates", "how much to charge for newsletter sponsorship", "newsletter ad
# rate calculator", "cost per 1000 opens newsletter". Incumbents
# (Swapstack, Paved, Sponsy) are marketplaces that take a cut and require
# listing your newsletter with them first; this is a free, standalone
# calculator with nothing to sign up for and nothing to list.
hypotheses:
  - claim: A newsletter operator who lands here from a "how much to charge for newsletter sponsorship" search or an r/newsletters thread will get a price range they did not already have and use it to set or defend an ask.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Newsletters below the size marketplaces like Swapstack or Paved actively court (roughly under 5,000-10,000 subscribers) are underserved for pricing guidance and will use a free, no-signup calculator instead of guessing from a competitor's public rate card.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct engagements (a GitHub issue, a star, an unsolicited mention, or a measurable return visit) within 90 days of being reachable from the published site.
  - No organic search or subreddit-referred traffic detectable within 90 days once a free, owner-approved traffic signal exists (see portfolio/usage/README.md).

links:
  production: https://duncan-haywood.github.io/monorepo-projects/newsletter-sponsorship-rate-calculator/
  analytics: null
