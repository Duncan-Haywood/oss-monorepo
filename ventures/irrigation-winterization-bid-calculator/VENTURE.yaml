name: irrigation-winterization-bid-calculator
description: A private browser calculator for irrigation contractors that prices a sprinkler blowout / winterization stop from spray, rotor, and drip zone counts, backflow drain-and-insulate time, travel, and a freeze-warning premium — labor hours, loaded wage, compressor cost, overhead, and margin — and shows the price per zone, the effective hourly rate, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent irrigation contractors will use a zones-and-backflow bid calculator because the flat "$75 blowout" specials they compete with cannot see that drip zones take longer than spray, that a backflow drain-and-insulate is a second job, and that the drive is most of a four-zone house, which is how a bid that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the price per zone are the two numbers a contractor actually decides on when a homeowner asks them to match a neighborhood special, more than the job price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Drip-zone minutes, backflow winterization, and round-trip travel are the three costs most often left out of a small crew's own quote, so making them required, explained inputs changes the resulting bid materially.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified irrigation contractors use the calculator twice within 90 days.
  - Contractors report that the zones-and-backflow model is more work than their existing method without changing the price they would have bid.
  - The starting minutes-per-zone figures prove so far from real systems that the tool cannot be used without data we have no way to gather.
