name: law-firm-realization-rate-calculator
description: >-
  Free browser calculator for law firms and solo lawyers that turns three columns every billing system
  already prints (value of time recorded at standard rates, amount billed, amount collected) into
  realization, collection rate and yield per timekeeper and for the firm, splits the loss into
  write-downs before the invoice and discounts or unpaid balances after it, ranks lawyers by dollars
  lost rather than by rate, reports lockup days from WIP and receivables, prices one point of
  realization per year, and answers a collections target as hours needed versus yield needed. Figures
  are used locally and never uploaded; no client or matter data is an input.
stage: prototype
owner: duncan
hypotheses:
  - claim: Law firm managing partners and solo lawyers will use a per-timekeeper realization calculator because billing systems print recorded, billed and collected dollars as separate columns and never divide them per lawyer, so the leak between the timesheet and the bank is a total that names no one.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Ranking by dollars lost instead of by rate is what makes the output actionable, because the lowest-yield lawyer is routinely not the biggest loss.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three lawyers or practice managers complete a calculation and read a result within 90 days.
  - Firms report their billing system will not produce recorded, billed and collected totals per timekeeper for one period, so the table cannot be filled from a report they already run.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/law-firm-realization-rate-calculator/
  analytics: null

# Screened 2026-10-05 in a new-venture-first session. No venture, ledger entry or screened-out row covers law-firm
# billing economics (grep "realization rate" found nothing); the nearest are service-hourly-yield-analyzer
# (hour yield for service trades), client-profitability-time-analyzer and invoice-payment-terms-calculator.
# Buyer: managing partners and solo practitioners, a segment with high hourly value and a well-known leak
# (recorded -> billed -> collected) that practice-management vendors sell dashboards for. Search phrases:
# "law firm realization rate calculator", "billing realization vs collection rate", "lawyer utilization
# realization collection". Volume not measured with an external tool.
#
# Deterministic and local: no client data, no matter data, no upload, no cost per user, no protected
# information (period totals only).
#
# Path to revenue (payment rails stay off): lead magnet and donation-supported free tool; if usage appears, a
# batch import of a billing-system timekeeper export behind an env-var switch; none built.
#
# Liability: arithmetic on the user's own totals; not legal, ethics or accounting advice; no statement about
# what a client may be charged; no benchmark claimed; trademarks used nominatively.
