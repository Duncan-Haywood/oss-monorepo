name: shed-install-bid-calculator
description: A private browser calculator for shed dealers and backyard-building crews that prices an install from pad, delivery miles, crane versus forklift, and extras — and shows the extra-work share and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent shed dealers will use a pad-and-delivery bid calculator because the generic "$2,499 installed 10×12" Facebook special they are shopped on cannot see that a factory drop-and-set onto an existing pad is a different job from a 12×16 lofted kit with a new gravel pad, a crane, a ramp, and old-shed haul-away.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the extra-work share (not the published drop-and-set dump) are the two figures a dealer actually decides on when an owner asks them to match a cheaper existing-pad quote on a kit-plus-pad job.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing existing pad, new gravel, and a new slab on the same shed, with delivery miles and crane hours, changes the bid enough that dealers notice which pad keeps the margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified shed dealers or backyard-building crews use the calculator twice within 90 days.
  - Dealers report that splitting pad, delivery, and extras is more work than their existing drop-and-set method without changing the price they would have bid.
  - The starting hours and kit rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
