name: invoice-factoring-cost-calculator
description: >-
  Free browser calculator for freelancers, contractors, agencies and small carriers: enter an invoice, days to pay and one or more
  invoice factoring offers and get the true cost, percent of invoice, annualised rate, rebate and yearly cost side by side. Nothing
  leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. No existing venture covers invoice factoring; nearest are
# merchant-cash-advance-true-cost-calculator (MCA) and invoice-payment-terms-calculator (terms, not financing).
#
# First visitor: small business owners and owner-operators searching "invoice factoring calculator", "factoring fee calculator",
# "factoring rate vs apr". Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; not financial advice; says what is not modelled
# (setup and minimum fees, recourse, disputed invoices) and carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations; a factor-referral model would need owner approval.

hypotheses:
  - claim: >-
      Small businesses will type a quote into a no-signup calculator to see the annual rate behind a "2-3% per 30 days" factoring fee,
      because factors quote per period and not per year.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/invoice-factoring-cost-calculator/
  analytics: null
