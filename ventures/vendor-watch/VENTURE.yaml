name: vendor-watch
description: Free tool that lets a visitor paste a public vendor page (terms, privacy policy, subprocessor list) and get a timestamped, source-linked diff when the text changes — an evidence feed, not legal or compliance advice.
stage: prototype

owner: duncan

hypotheses:
  - claim: Practitioners who check a watched vendor page once will come back and re-check the same URL later without being prompted or reminded.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: checkUrl() always labels a failed or non-2xx fetch as inconclusive rather than unchanged, and a failed fetch never overwrites the last good snapshot (so a later successful fetch of unchanged content still reports unchanged, not changed).
    status: supported
    checked: 2026-08-24
    evidence: in-repo
    note: >-
      Verified two ways. Unit tests (tests/check-url.test.ts) mock a 503
      response and a throwing fetch mid-sequence and assert outcome ===
      "inconclusive" with the prior snapshot still referenced; a further
      test re-fetches the original unchanged text after the failure and
      asserts outcome === "unchanged" (not "changed"), confirming the
      failed fetch did not corrupt the stored snapshot. Also verified live
      against a local fixture HTTP server (not a mock): first check ->
      first_snapshot, second check with edited fixture text -> changed with
      a correct word-level diff, third check with same text -> unchanged,
      a 503 fixture route -> inconclusive with httpStatus 503, and an
      unreachable host (127.0.0.1:1) -> inconclusive with httpStatus null
      and a fetch-failed error message. Full suite: 18/18 tests pass.

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - No repeat visitor re-checks the same URL within 90 days of launch (first check without a follow-up check suggests the "come back later" loop doesn't work without prompting).
  - No inbound interest (traffic, sponsor click, or comment) from a security/procurement/privacy practitioner within 90 days of launch.

