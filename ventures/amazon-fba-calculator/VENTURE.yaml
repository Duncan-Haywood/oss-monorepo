name: amazon-fba-calculator
description: A private browser calculator for Amazon sellers to compare FBA vs FBM profit on the same listing after referral, fulfillment, storage, inbound, and cost of goods — including the maximum inventory buy cost, whether Low-Price FBA still beats raising the list price, whether a coupon still hits the target after the redemption fee, whether Subscribe & Save still pays after only some units enroll, whether a website order shipped MCF still beats selling the unit on Amazon, whether a supplier MOQ still pays after extra FBA storage, whether paying Amazon to prep inbound still beats you-prep, whether Individual or Professional still pays at the seller's monthly volume — including a 10/20/40/80/200 volume ladder — whether an Amazon Vine enrollment still pays after gifted leftover units versus units that would have sold, whether keeping aged FBA inventory still beats a return removal or dispose after storage and the aged-inventory surcharge, whether Amazon inbound placement still beats extra freight on a split shipment, whether sending inventory before Q4 still beats waiting until January, and whether a return rate still leaves expected profit after handling and unsellable units.
stage: prototype
owner: duncan
hypotheses:
  - claim: Amazon sellers will return to a calculator that compares FBA against FBM on the same SKU, because generic FBA fee pages hide inbound, storage, and the merchant-fulfilled alternative.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Seeing the maximum buy cost next to both fulfillment paths changes a sourcing decision before the seller pays for inventory.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Sellers will skip or keep Amazon inbound placement when they can see one-warehouse freight plus the placement fee against extra freight on the optimized split.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing January versus a Q4 storage stay changes whether a seller inbounds before peak rates.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified Amazon sellers use the calculator twice within 90 days.
  - Users do not find the FBA vs FBM comparison materially different from a single-path FBA fee estimate.
