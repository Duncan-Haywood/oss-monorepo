# One-click self-deploy: https://render.com/deploy?repo=<your fork URL>
# Render builds the Dockerfile in YOUR account; nothing runs on the author's.
services:
  - type: web
    name: error-keeper
    runtime: docker
    dockerContext: ventures/error-keeper
    dockerfilePath: ventures/error-keeper/Dockerfile
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: state
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: STATE
        value: /data/state.json
      - key: INGEST_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_WEBHOOK_SECRET
        sync: false
