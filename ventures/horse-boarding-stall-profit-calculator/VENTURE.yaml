name: horse-boarding-stall-profit-calculator
description: >-
  Free browser tool for horse boarding barn owners: enter stalls, occupancy, board price, feed, bedding, care minutes,
  an hourly value for your own labour and monthly fixed costs, and see monthly profit, break-even occupancy, the board
  price that breaks even or reaches your target, and profit at each occupancy level. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06. duplicate_check scored 0.18 against massage-therapist-profit-calculator; no equine boarding tool
# in ventures/ (farrier-visit-pricing-calculator is the adjacent equine tool), not in screened-out.md.
# First visitor: a barn owner searching "is horse boarding profitable", "how much to charge for horse board",
# "horse boarding business break even"; also r/Horses and r/equestrian threads on board rates and barn costs.
#
# Who: owners of small boarding barns (5-30 stalls) who count their own care time as free and so underprice board.
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. A boarder invoicing, autopay
# and late-fee reminder tool for barn managers is the possible paid version, not built.
# Liability: arithmetic on the user's own figures with visible rules; carries the no-warranty and not-advice clauses
# and lists what is not decided (zoning, licences, liability insurance, boarding contracts, tax).
# Unverified: no market rate is claimed; the sample figures are illustrative only.

hypotheses:
  - claim: >-
      A boarding barn owner will enter stalls, occupancy and costs, including a wage for their own care time, to find
      break-even occupancy and the board price they need, because many barns only look profitable with free labour.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool by 2027-03-15.
  - A report that the profit arithmetic differs from the stated rules on the same inputs.
