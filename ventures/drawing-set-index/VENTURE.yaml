name: drawing-set-index
description: Drop a construction drawing set PDF and get the sheet index (number, title, discipline), checked against the cover sheet's drawing index; compare two issues sheet by sheet. Browser or CLI, nothing uploaded.
stage: prototype
owner: duncan
hypotheses:
  - claim: Project engineers, document controllers and permit expediters who retype a sheet index or hunt for changed sheets between issues will search "sheet index from PDF" or "compare drawing set revisions" and use a free in-browser reader, measured as the share of set_read events followed by csv_downloaded or compare_run.
