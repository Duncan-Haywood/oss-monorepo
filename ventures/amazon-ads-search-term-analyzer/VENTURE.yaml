name: amazon-ads-search-term-analyzer
description: >-
  Free browser tool that turns an Amazon Ads (Sponsored Products) search term
  report CSV into spend on search terms with no orders graded by evidence, a
  downloadable negative-keyword list, converting terms running above break-even
  ACOS, and exact-match harvest candidates. The file is read locally and never
  uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. Amazon sellers are a large
# paying market for PPC tooling (Helium 10 Adtomic, Perpetua, Teikametrics,
# Jungle Scout, Pacvue, plus agencies selling "PPC audits"), and nearly all of it
# wants advertising-account access first. The buyer, a marketplace seller or a
# freelance Amazon PPC manager spending real money per day, already has the file:
# Ads console -> Sponsored ads reports -> Search term. This is the free diagnostic
# that answers "which search terms burned money and what should be a negative"
# before any tool is connected. duplicate_check.py top score 0.38
# (google-ads-wasted-spend-analyzer, the Google search-terms sibling; different
# platform, report layout, and Amazon-specific ACOS / match-type / harvest logic;
# linked both ways). amazon-seller-profit-analyzer reads the seller's payment
# report, not ad data.
#
# First visitor: Amazon FBA sellers and PPC freelancers on r/FulfillmentByAmazon,
# r/AmazonSeller and seller Facebook groups asking "how do I find wasted ad
# spend", "which search terms to negate", "what is a good ACOS"; search phrases
# "amazon ppc search term report analysis", "amazon negative keywords wasted
# spend", "amazon break even acos calculator". Volume not measured with an
# external tool.
#
# What makes it more than a pivot table: no-order spend is graded by the account's
# own click-to-order rate (a term with 8 clicks and no order is not called waste,
# one with 60 is), the cost of one order is set by the seller's break-even ACOS
# rather than a folklore benchmark, negatives are kept per campaign and ad group
# because that is where Amazon applies them, and harvest candidates exclude terms
# already run as exact match. All tested.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts the page has no network calls), so the portfolio
# holds no advertiser data and needs no Amazon Advertising API access or
# developer-program approval.
#
# Path to revenue (payment rails stay off): lead magnet. The paid version, if
# usage appears, is a recurring search-term diff between reports and an
# Advertising API connected version behind an env-var switch; neither is built.
#
# Liability: arithmetic on the user's file, stated model and omissions on the
# page, no advice, no warranty, independent-of-Amazon clause.
#
# Unverified: the column names are from memory of the report and matched
# tolerantly (aliases, currency column, month-name dates, UTF-16); no real report
# was available, so the first user report of an unread file is the priority fix.

hypotheses:
  - claim: >-
      Amazon sellers and freelance PPC managers will run a no-signup,
      no-account-access analysis of a downloaded search term report before
      connecting a PPC automation tool to their advertising account.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      A negative-keyword list graded by the account's own click-to-order rate,
      with the order cost set by the seller's break-even ACOS, is trusted more
      than a fixed "10 clicks no sale" rule, which is the reason to come back
      after each report.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong figure, or a wasted-spend, ACOS or harvest flag that contradicts a real report, at which point the model needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/amazon-ads-search-term-analyzer/
  analytics: null
