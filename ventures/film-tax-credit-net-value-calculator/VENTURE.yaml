name: film-tax-credit-net-value-calculator
description: >-
  Free browser tool for film and TV producers: type the incentive programme's rate, uplift, minimum and
  cap, the budget, and the sale price, fees and wait, and see the net cash the credit really puts in the
  budget, cents kept per credit dollar, its value in today's money, what one more qualified dollar is
  worth, and sensitivity grids by sale price and wait. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-08 in a scheduled new-venture session. duplicate_check.py "film production tax
# incentive credit estimator" scored 0.22 at best (no related venture); no venture values a production
# incentive as net cash after cap, minimum, sale discount, fees and wait.
#
# Why this niche: independent producers and line producers decide where to shoot and whether to take a
# credit bid on a number that is quoted at face value ("30% back") while the cash that reaches the budget
# is a fraction of it. Paid services exist for programme incentive consulting (e.g. production accounting
# and payroll vendors); a free, private, rate-agnostic what-if is the gap. Buyers are small, so this is
# a lead magnet and a donation play, not a sales-led product.
#
# First visitor: a producer or line producer in r/Filmmakers, r/Screenwriting production threads, Stage 32
# or a state film-office FAQ asking "is the tax credit worth shooting there" or "what do credits sell for".
# Volume not measured.
#
# Liability boundary: arithmetic on user-typed rates; embeds no programme, rate table or eligibility rule;
# does not determine qualification; not tax, legal or financial advice; nothing stored or uploaded.
#
# Path to revenue (payment rails stay off): donations; later a printable one-page bid comparison for a
# financier or completion guarantor, a multi-location comparison, and a cash-flow schedule (not built).

hypotheses:
  - claim: >-
      Producers weighing a shoot location or a credit-purchase bid will type the programme terms into a
      private page to see net cash and cents per credit dollar, because quotes and film-office materials
      state only the headline rate.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A producer or accountant reports that a worked net-cash or marginal-dollar figure disagrees with the same inputs done by hand.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/film-tax-credit-net-value-calculator/
  analytics: null
