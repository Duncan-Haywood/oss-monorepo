name: bank-statement-pdf-to-csv
description: >-
  Free browser tool that converts a text-based bank or credit card statement PDF into CSV for Xero,
  QuickBooks Online or a spreadsheet, and proves the result against the statement itself: opening balance
  plus every row must equal the closing balance, each row is checked against the printed running balance,
  and a gap is reported with its amount, the line where the balance first breaks, and the likeliest cause
  (a missing row, a row on the wrong side, a flipped sign). The PDF is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05 in a new-venture-first session. The bank-export cluster in this tree (OFX, QIF, MT940,
# camt.053, Xero CSV, QuickBooks IIF) all start from a file the bank already wrote in a data format; the far
# larger real-world case is the PDF statement, and it is the first thing a bookkeeper or small-business owner
# searches for. Search phrases: "bank statement PDF to CSV", "convert bank statement to Excel",
# "credit card statement PDF to CSV", "PDF to QuickBooks CSV", "PDF bank statement to Xero". Volume not
# measured with an external tool.
#
# Who: bookkeepers, accountants' clients and small-business owners whose bank gives a PDF (or whose older
# statements exist only as PDFs) and whose accounting package wants a CSV. Existing answers are paid
# per-page converters (several of them funded and sold on bank-statement conversion) and free converters
# that upload the statement to a server. The wedge is the combination nobody ships free: no upload, and a
# proof that the output adds up, because a converter that silently drops or flips one row is worse than none.
#
# Shape: static page, no dependency. pdf-parser.mjs is the dependency-free object scanner copied from
# pdf-accessibility-tag-check; pdf-text.mjs adds text extraction with positions (Flate, object streams,
# ToUnicode CMaps, cm/Tm/Td positioning); calc.mjs finds rows and does the arithmetic in integer cents.
#
# Path to revenue (payment rails stay off): lead magnet for bookkeeping audiences, usage-counted. A paid
# version, if usage appears, is batch conversion of many statements, saved bank profiles for layouts that
# need hints, and OCR for scans behind a bring-your-own-key switch; none of it is built.
#
# Liability: it writes a file from the user's own statement, shows every check it ran and what it cannot
# check, and carries the no-warranty, independent-of-banks-and-vendors and financial-data clauses.
#
# Unverified, and stated on the page: tested on PDFs generated by the test suite in three encodings
# (plain fonts, Type0 with ToUnicode, compressed object streams) and on synthetic statements. No real bank's
# PDF was available, so every bank's column layout is untested until someone reports one. The Xero and
# QuickBooks CSV layouts are from memory of public import help; nothing ran against a live import. The first
# report of a statement that is misread, or a CSV that is refused, is the priority fix.

hypotheses:
  - claim: >-
      A bookkeeper or small-business owner holding a statement PDF will use a no-upload converter, because
      the common alternatives are paid per-page tools or sending the statement to a stranger's server.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      A balance proof (opening plus rows equals closing, with the amount and line of any gap) is what makes
      a converted statement trusted enough to import, because the risk of a converter is a silently wrong row.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted statement layout) engage with the tool within 90 days of it being reachable from the published site.
  - Real bank PDFs show the reader misreading most statements even with the balance check flagging it, at which point the extraction approach needs revisiting.

