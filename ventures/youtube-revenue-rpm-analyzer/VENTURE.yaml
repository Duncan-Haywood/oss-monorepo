name: youtube-revenue-rpm-analyzer
description: >-
  Free browser tool that turns a YouTube Studio analytics export CSV into revenue
  per thousand views for every video, country or day, where income concentrates,
  which videos pay under half the median, which pay well but get little traffic,
  click-through gaps and RPM by video length. The file is read locally and never
  uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. YouTube creators earning
# from the Partner Programme are a large, earn-more-minded market whose only
# per-video report is a Studio export nobody pivots; paid neighbours (vidIQ,
# TubeBuddy, Social Blade) are subscription products that want channel access.
# This is the free diagnostic that answers "which of my videos pay per view and
# which are worth making more of" from a file the creator already holds.
# duplicate_check.py top score 0.17 (stripe-failed-payment-recovery-analyzer;
# nothing in the portfolio touches video-platform revenue).
#
# First visitor: r/NewTubers, r/youtubers and r/PartneredYoutube threads asking
# "why is my RPM so low" and "which videos make money", plus search phrases
# "youtube rpm calculator", "youtube revenue by video", "youtube analytics csv".
# Volume not measured with an external tool.
#
# What makes it more than a sum: RPM is recomputed from revenue and views per
# row rather than trusting a column; the benchmark is a median over rows with
# enough views to be meaningful; the RPM gap is sized as a ceiling and labelled
# one; click-through is impression-weighted; the file's own Total row is used to
# say how much of the channel the exported rows cover (Studio caps export rows).
# Country, traffic-source and by-day exports are read too, so one tool covers
# the four tables a creator can export.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts no network calls), so the portfolio holds no
# channel data and needs no YouTube API or OAuth scope.
#
# Path to revenue (payment rails stay off): lead magnet with tie-ins to the
# sponsorship-rate and tax-calendar tools; a merged view across a channel's
# exports, a sponsorship-versus-AdSense per-video comparison and a
# period-over-period diff are the natural later versions.
#
# Liability: arithmetic on the user's file, stated model and omissions on the
# page, no claims about what causes a rate, no earnings promises, no tax advice,
# no warranty, independent-of-YouTube-and-Google clause.
#
# Unverified: column names are from memory of the Studio export and matched by
# alias; no real export was available, so the first user report of an unread
# file or a misread column is the priority fix.

hypotheses:
  - claim: >-
      Creators will run a no-signup analysis of a Studio export they already
      downloaded before granting a third-party channel tool access.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing RPM by video changes at least one decision about what to make
      next or which video to retitle, which is the reason to come back with
      each new export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong RPM or revenue figure, or a real export the tool cannot read, at which point the parser needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/youtube-revenue-rpm-analyzer/
  analytics: null
