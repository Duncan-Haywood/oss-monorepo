kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - AWS or GitHub changes the OIDC subject-claim format or IAM's condition
    semantics such that the classification rules here stop being correct and
    cannot be updated to match.
  - A materially better free tool covering the same operator-semantics and
    multi-value-breadth rules with the same zero-install, zero-credential bar
    becomes the obvious default.

