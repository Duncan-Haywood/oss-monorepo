# Fly.io self-deploy, in your own account (needs flyctl):
#   fly launch --copy-config --no-deploy --dockerfile Dockerfile
#   fly deploy
app = "uk-srt-checker-CHANGE-ME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
