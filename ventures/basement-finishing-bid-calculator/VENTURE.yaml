name: basement-finishing-bid-calculator
description: A private browser calculator for basement remodelers that prices a basement finish from finished square feet, rec-room versus framed-finish versus legal-living, drop ceiling versus drywall, carpet versus LVP, bath, egress, and extras — and shows the extra-work share and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent basement remodelers will use a rec-room-versus-legal-living bid calculator because the generic "$30 a square foot finished basement" special they are shopped on cannot see that 800 SF of paint, drop ceiling, and carpet is a different job from 1,000 SF of legal living with a full bath, two bedrooms, two egress windows, HVAC, and a permit.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the extra-work share (not the published per-SF dump) are the two figures a remodeler actually decides on when an owner asks them to match a cheaper rec-room quote on a bedroom-suite finish.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing rec-room, framed-finish, and legal-living on the same basement, with bath, egress, and HVAC hours, changes the bid enough that remodelers notice which scope keeps the margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified basement remodelers use the calculator twice within 90 days.
  - Contractors report that splitting finished SF, scope, and extras is more work than their existing per-SF method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/basement-finishing-bid-calculator/
  analytics: null
