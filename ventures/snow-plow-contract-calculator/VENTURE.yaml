name: snow-plow-contract-calculator
description: 'Free, zero-network, zero-dependency browser tool and CLI for independent snow plowing and ice-management contractors: list your sites (hours per push, per-push, per-inch and seasonal flat prices, trigger depth, salt) and the storms you expect in a low, normal and high snow year, plus your truck, driver, fuel, blade, deadhead and salt costs and a target hourly, and get each contract model''s (per push, per inch, seasonal flat, capped flat, hybrid) expected season revenue and effective hourly in each year, the storm count where it stops paying, the seasonal flat price that clears target in a low year versus the price that loses money in a high year, and a walk-away price; paste past site-seasons and see which contract model paid best per hour. Numbers are the ones the user supplies, not market rates or advice.'
stage: prototype

owner: duncan

# Calculator/CLI archetype, earn-more: raises what a plow contractor earns per hour by showing, before a seasonal is signed, what it pays in a mild winter and what it costs in a heavy one, and which past contracts underpaid.
# Checked 2026-10-03: ventures/ has snow-removal-bid-calculator (one property's winter: route minutes, a loaded hourly, salt, per-push vs
# seasonal and the break-even storm count) and ice-dam-removal-bid-calculator (roof-edge steam work). This venture does not repeat
# either: it works across a whole route of sites at once, prices low/normal/high snow years from storm counts by depth band, adds
# per-inch tiered, capped-flat and hybrid models, reports the flat price that clears target in a low year against the price that
# loses money in a high year plus a walk-away price, and audits past site-seasons by contract model. Not in screened-out.md.
#
# First visitor: searches "how to price snow plowing contracts", "per push vs seasonal snow plow contract", "snow plow seasonal
# contract price", "how much to charge per inch snow removal"; plow-contractor groups and forums, season starting October.
# Volume not measured with an external tool. Contractors choose seasonal or per-push on habit and on what the neighbour charges;
# nothing multiplies out their own storm counts, hours and costs against each model for a low and a high year. A hosted version that
# reads GPS or invoicing exports is the natural paid upgrade.
hypotheses:
  - claim: A plow contractor will enter their sites and expected storms, see what a seasonal flat earns in a low and a high year, and change the price or switch to a capped or hybrid contract.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A plow contractor will paste past site-seasons, see which contract model underpaid per hour, and re-price or drop the worst accounts.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool analyses only typed or pasted values in the
  # visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No contractor reports changing a seasonal price, contract model or account because of what the tool showed within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/snow-plow-contract-calculator/
  analytics: null
