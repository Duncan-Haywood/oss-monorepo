name: gravel-driveway-bid-calculator
description: A private browser calculator for excavation and landscape shops that prices a gravel driveway from crusher-run, clean stone, recycled concrete, or pea gravel — drive size, compacted depth, truckloads, soil prep, fabric, and apron — and shows the leftover tons, the dirt-work share, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent excavation and landscape shops will use a truck-and-depth bid calculator because the generic "$4 a square foot installed" Facebook special they are shopped on cannot see that 600 sq ft of 4-inch crusher-run on ready grade is a different job from 1,120 sq ft of 8-inch recycled stone that needs the existing surface excavated, hauled off, and fabric.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the extra-work share (not the published per-foot or per-ton dump) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper 4-inch pickup quote on an 8-inch excavate-and-haul drive.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing crusher-run, clean stone, recycled, and pea gravel on the same drive, with whole truckloads and prep hours from the dirt, changes the bid enough that shops notice which stone keeps the margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified excavation or landscape shops use the calculator twice within 90 days.
  - Shops report that splitting stone, trucks, depth, and prep is more work than their existing per-foot method without changing the price they would have bid.
  - The starting hours and quarry rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/gravel-driveway-bid-calculator/
  analytics: null
