name: ie-sole-trader-tax-set-aside-calculator
description: >-
  Free browser tool for Irish sole traders and freelancers: enter income and expenses to see income tax, USC, Class S PRSI and how much of every invoice to set aside, with preliminary tax and VAT flags. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-14; the portfolio has Australian, Canadian and New Zealand set-aside tools and UK tax tools, but no Irish one.
#
# First visitor: Irish freelancers and contractors searching "how much tax should I set aside self employed Ireland". Peaks near the 31 October preliminary tax / Form 11 deadline; volume not measured.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Not built: spouse credits, capital allowances, invoice tracker.
#
# Liability: 2026 rates written from public Budget 2026 summaries, not checked against Revenue directly (band widening, Class S minimum uncertain); every result tells the reader to verify on revenue.ie and carries no-warranty and not-tax-advice clauses.
hypotheses:
  - claim: >-
      Irish self-employed people will use a free private calculator to learn what share of each invoice to set aside, because rules of thumb ignore their own expense level and USC and PRSI.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: EUR
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that an Revenue figure differs from the official source.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/ie-sole-trader-tax-set-aside-calculator/
  analytics: null
