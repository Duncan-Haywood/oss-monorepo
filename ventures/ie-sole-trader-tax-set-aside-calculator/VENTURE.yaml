name: ie-sole-trader-tax-set-aside-calculator
description: >-
  Free browser tool for Irish sole traders and freelancers: enter income and expenses to see income tax, USC, PRSI (Class S), optional pension relief and how much of every invoice to set aside, with preliminary tax and VAT flags. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-14 in a new-venture-first session; the portfolio has Australian, Canadian and New Zealand set-aside tools and a UK Self Assessment calculator, but no Irish one. duplicate_check scored the nearest at 0.44.
#
# First visitor: Irish freelancers and contractors searching "how much tax should I set aside self employed Ireland" ahead of the 31 October preliminary tax date. Volume not measured. Rivals are accountant and bank blog calculators and Revenue's own tools.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Not built: other income, married credits, age-based pension limits, 2026 rates, invoice-by-invoice tracker behind an env-var switch.
#
# Liability: 2025 Revenue rates, USC bands and Class S PRSI written from memory; every result tells the reader to verify on revenue.ie, carries no-warranty and not-tax-advice clauses and says what it does not decide.
hypotheses:
  - claim: >-
      Irish self-employed people will use a free private calculator to learn what share of each invoice to set aside, because rules of thumb ignore their own expense level, USC and PRSI.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: EUR
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a Revenue figure differs from the official source.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/ie-sole-trader-tax-set-aside-calculator/
  analytics: null
