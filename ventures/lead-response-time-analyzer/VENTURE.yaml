name: lead-response-time-analyzer
description: >-
  Free browser tool for home-service, agency and other lead-driven businesses:
  paste or upload inbound leads as minutes to first reply, won or lost and
  optional job value, and get the win rate by reply-time band with intervals,
  a fitted curve, and the extra jobs and monthly revenue that answering within
  a target time would have won, with a bootstrap range and a warning when the
  trend is not distinguishable from noise. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-30 in a new-venture-first session. duplicate_check.py on
# "contractor lead response time speed to lead win rate from your own lead log":
# closest home-service-lead-roi-analyzer at 0.22 (cost per lead, close rate and
# profit per paid source; does not look at how fast the lead was answered).
# Adjacent: quote-follow-up-timing (open quotes already sent), bid-win-rate-optimizer
# (markup vs win). Alternatives: vendor "speed to lead" blog statistics about other
# businesses, CRM response-time dashboards locked inside the CRM, and a spreadsheet.
#
# First visitor: owner of a one to ten person HVAC, plumbing, roofing, cleaning or
# legal/agency shop who buys leads (Thumbtack, Angi, Google LSA) or takes web forms and
# searches "does answering leads faster win more jobs", "speed to lead statistics",
# "how fast should I respond to a lead"; r/HVAC, r/smallbusiness, contractor Facebook
# groups. Volume not measured with an external tool.
#
# Privacy is the liability boundary: lead lists (names are not even asked for) never
# leave the browser. No vendor is ranked.
#
# Path to revenue (payment rails stay off): lead magnet and donations only. A later
# paid tier could be a saved log with an alert for unanswered leads; not built.
# Liability: arithmetic on supplied numbers, not advice; the page labels the result an
# association and shows a range. Unverified: tested against simulated logs with a known
# slope, not validated against a real change in response practice.

hypotheses:
  - claim: >-
      Owners who buy or receive inbound leads will use a private, no-signup tool that
      shows from their own log what slow first replies cost, and will return after
      changing how fast they answer.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that a band win rate or interval disagrees with the arithmetic documented in the README.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/lead-response-time-analyzer/
  analytics: null
