name: error-tracking-pricing-calculator
description: 'Free, zero-network, zero-dependency browser tool + CLI that prices error-tracking tools (Sentry, Rollbar, Bugsnag, Honeybadger, GlitchTip) at a monthly event volume from editable approximate list prices, projects 12 months of spend under a monthly growth rate, and finds the volumes where the cheapest provider changes; has a --budget CI gate. A deterministic calculator over the user''s inputs, not a quote and not a guarantee of spend.'
stage: prototype

owner: duncan

# CLI/checker archetype, sibling of email-api-pricing-calculator and
# datadog-bill-estimator. No existing venture compares error-tracking tools (ls ventures |
# grep -iE "sentry|rollbar|bugsnag|error-track" is empty).
#
# Where the first real visitor would come from: search phrases "sentry vs rollbar
# pricing", "sentry alternative cheaper", "sentry pricing 100k errors", "bugsnag vs
# honeybadger cost", "glitchtip vs sentry"; r/webdev, r/devops and Hacker News threads
# after a Sentry quota overage or plan change. The reader is a founder or lead dev choosing
# or leaving an error-tracking vendor. Vendor pages are rate cards per vendor; none shows
# all of them at one event volume with growth and the crossover, which is the wedge. A
# hosted pricing-change monitor is the natural paid path later.
hypotheses:
  - claim: A founder choosing or leaving an error-tracking vendor will search for a price comparison at their event volume, enter volume and growth, and use the crossover table to decide.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A platform team will add the CLI to CI with --budget so growth that pushes error-tracking spend over budget fails review instead of the invoice.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool calculates only from typed numbers in
  # the visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No external repository is found wiring cli.mjs into its own CI within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/error-tracking-pricing-calculator/
  analytics: null
