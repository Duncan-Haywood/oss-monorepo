name: oyster-farm-grow-out-calculator
description: >-
  Free browser tool and CLI for oyster growers: cost per market oyster from seed, gear wear, labor, lease, boat and cost of money,
  profit per cycle, break-even price and break-even survival, a survival-by-price profit grid, and seed to buy for a sales target.
  Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check.py against "oyster farm gear and seed cost per market oyster" scored
# 0.33 at best (custom-farm-rate-calculator, a pipeline candidate for field work); no venture prices aquaculture. Not in
# screened-out.md.
#
# Why this niche: small-scale oyster growers (US and Canadian coasts, a fast-growing cohort of new farms) price a crop that takes
# 12-30 months to mature, and the numbers that decide whether a lease pays - survival, grade, bag handling labor - are tracked in
# notebooks. A grower who sees break-even survival before buying seed can pick price, density and site with the cost in view.
#
# First visitor: growers searching "oyster farm startup cost", "how much does it cost to grow an oyster", "oyster farm profit per
# acre", and members of state shellfish growers' associations and the r/aquaculture subreddit. Volume not measured with an
# external tool.
#
# Liability boundary: arithmetic over numbers the user enters. No seed prices, survival data or market data is shipped. Leases,
# licences, harvest-area classification and food safety are the grower's state's rules; the page says so, is not legal, tax or
# financial advice, and carries the no-warranty and no-SLA clauses. No data leaves the browser.
#
# Path to revenue (payment rails stay off): lead magnet and donations. A natural paid layer is a hosted multi-batch crop ledger
# with harvest planning for oyster farms; needs accounts and payments, so an owner decision; not built.

hypotheses:
  - claim: >-
      Oyster growers planning or reviewing a crop will type their numbers into a no-signup calculator to see cost per oyster and break-even survival.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing break-even survival beside their own past survival changes the price they ask or the seed they buy.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Growers report that a single survival rate misses how losses really arrive (stage-by-stage mortality, nursery phases), at which point the tool should model those.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/oyster-farm-grow-out-calculator/
  analytics: null
