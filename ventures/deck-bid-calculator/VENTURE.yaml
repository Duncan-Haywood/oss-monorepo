name: deck-bid-calculator
description: A private browser calculator for deck builders that prices a residential job from per-surface height, material, railing lineal feet, and stairs — labor hours, loaded wage, footings, demo, overhead, and margin — and shows the price per square foot, the railing share of the ticket, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent deck builders will use a height-and-railing calculator because the flat price-per-square-foot specials they compete with cannot see that a patio platform 10 inches off grade is a different job from an elevated deck 8 feet up with guardrail and a stair run, which is how a bid that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the price per square foot are the two numbers a contractor actually decides on when a homeowner asks them to match a neighborhood special, more than the job price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Railing lineal feet, height, and payroll burden are the three costs most often left out of a small deck crew's own quote, so making all three required, explained inputs changes the resulting bid materially.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified deck builders use the calculator twice within 90 days.
  - Contractors report that the height-and-railing model is more work than their existing method without changing the price they would have bid.
  - The starting material prices prove so far from real lumberyard tickets that the tool cannot be used without data we have no way to gather.
