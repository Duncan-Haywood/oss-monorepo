kill_criteria:
  - No measurable return usage or organic referral traffic within 6 months
    of the first wave of post-OBBBA QSBS sales reaching a 3-year holding
    milestone (stock acquired shortly after July 4, 2025 first reaches 3
    years in mid-2028), by which point search interest in the new tiered
    rule should have picked up if it is going to.
  - Fewer than three unsolicited signals (star, fork, referral, or
    feedback) within 90 days of that milestone.

