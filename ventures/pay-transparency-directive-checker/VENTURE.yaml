name: pay-transparency-directive-checker
description: >-
  Free browser tool for employers affected by the EU Pay Transparency Directive (EU) 2023/970: gender pay gap reporting schedule by headcount, always-on duties still open (applicant pay information, no pay-history questions, pay criteria, right to information, no secrecy clauses) and a pay table tested against the 5% joint-pay-assessment trigger. Nothing is uploaded. Not legal advice.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; no pay-transparency tool in ventures/ (siblings: eu-ai-act-risk-checker, gpsr-product-safety-checker). Not in screened-out.md.
#
# First visitor: HR lead or founder of a 100-300 person EU company before the first report (7 June 2027); search phrases "pay transparency directive
# reporting", "EU pay gap 5% joint pay assessment", "pay transparency directive checklist". Transposition deadline was 7 June 2026, so demand is current.
# Volume not measured with an external tool.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: Art 9 indicator workbook (mean/median gap, quartiles,
# bonus gap) from an HRIS CSV, plus job-evaluation worksheet, behind an env-var switch. Pay-gap analysis is the deeper product.
#
# Liability: first read of the Directive's duties; rejects bad input, says plainly that national law decides, carries no-warranty and not-legal-advice
# clauses. Article numbers and dates were written from memory of the published text without network access and must be verified; ethical risk is false
# comfort from a "below 5%" result when categories are drawn wrongly.

hypotheses:
  - claim: >-
      HR leads at 100-300 person EU employers will use a free checker to learn their reporting dates and test their pay table against the 5% trigger before building a full pay analysis.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a reporting tier, date or the 5% rule differs from the Directive's text on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/pay-transparency-directive-checker/
  analytics: null
