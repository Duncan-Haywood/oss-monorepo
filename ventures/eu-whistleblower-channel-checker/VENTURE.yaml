name: eu-whistleblower-channel-checker
description: >-
  Free browser tool for EU employers under the Whistleblower Directive (EU) 2019/1937: whether an internal reporting channel is required at your headcount, which channel requirements (written and oral reporting, confidentiality, impartial handler, 7-day acknowledgement, 3-month feedback, records, no retaliation) are still open, and the deadlines for a live report. Nothing is uploaded. Not legal advice.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; no whistleblower tool in ventures/ (siblings: pay-transparency-directive-checker, nis2-scope-checker). Not in screened-out.md.
#
# First visitor: HR, compliance or founder at a 50-249 person EU company (duty applied from 17 Dec 2023) setting up or auditing a channel; search phrases
# "whistleblower directive 50 employees", "whistleblowing channel requirements", "whistleblower report acknowledge 7 days". Volume not measured with an external tool.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: a hosted anonymous intake form plus case log with the two
# clocks, behind an env-var switch. Sensitive data would then be held, so it needs its own liability review first.
#
# Liability: first read; rejects bad input, says national law decides, carries no-warranty and not-legal-advice clauses, tells users never to type a reporter's
# identity. Article numbers, thresholds and periods were written from memory without network access and must be verified; ethical risk is false comfort that a
# channel is compliant when only a checklist box was ticked.

hypotheses:
  - claim: >-
      Compliance leads at 50-249 person EU employers will use a free checker to confirm they need a channel and to see what their current one lacks before buying a hosted whistleblowing product.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a threshold, deadline or period differs from the Directive's text on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/eu-whistleblower-channel-checker/
  analytics: null
