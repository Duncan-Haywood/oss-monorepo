name: lawn-care-bid-calculator
description: A private browser calculator for independent lawn-care operators that prices a recurring property stop from per-service production rates — turf, beds, edging, travel, fuel, dump, and margin — and shows the price per visit, the in-season monthly, the honest annual at the growing-season week count, and the walk-away number.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent lawn-care operators will use a per-service bid calculator because the lot-size rules of thumb they find online cannot see that beds and windshield time often take more of the stop than the mow itself, which is how a route that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing annual as service-weeks times the per-visit price, rather than monthly times twelve, changes the number an operator quotes when a homeowner asks for a year-round contract.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Travel minutes as a first-class input changes the bid materially on suburban routes, because round-trip drive time is loaded labor and is the cost most often left out of a "price per acre" guess.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified lawn-care operators use the calculator twice within 90 days.
  - Operators report that splitting turf, beds, and travel is more work than their existing method without changing the price they would have bid.
  - The starting production rates prove so far from real crews' rates that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/lawn-care-bid-calculator/
  analytics: null
