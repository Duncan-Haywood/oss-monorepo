name: window-replacement-bid-calculator
description: A private browser calculator for window replacement contractors that prices a residential job from per-opening United Inches, story, tear-out, and frame — labor hours, loaded wage, unit material, scaffolding, disposal, overhead, and margin — and shows the average per opening, the share of labor that is second-story or higher, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent window replacement contractors will use a United-Inches-and-story calculator because the flat price-per-window specials they compete with cannot see that a first-floor 3040 insert is a different job from a second-floor 6048 picture with a rotten sill, which is how a bid that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the average per opening are the two numbers a contractor actually decides on when a homeowner asks them to match a neighborhood special, more than the job price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Story access, rot, and payroll burden are the three costs most often left out of a small replacement crew's own quote, so making all three required, explained inputs changes the resulting bid materially.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified window replacement contractors use the calculator twice within 90 days.
  - Contractors report that the United-Inches-and-story model is more work than their existing method without changing the price they would have bid.
  - The starting unit prices prove so far from real distributor quotes that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/window-replacement-bid-calculator/
  analytics: null
