name: airbnb-earnings-report-analyzer
description: >-
  Free browser tool that turns an Airbnb Transaction history CSV into per-listing
  net earnings, fee share, ADR, net per night and occupancy, monthly seasonality,
  and profit per night by length of stay once the host enters a turnover cost. The
  file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. Short-term-rental hosts are
# a paying market (Hostaway, Guesty, Beyond, AirDNA, Stessa, Hospitable, plus
# bookkeeping services sold to hosts) and every one of them wants account access
# or an integration first. The host already has the file: Payments -> Transaction
# history -> Download CSV. This is the free diagnostic that answers "which listing,
# which month and which stay length actually earn" before a dashboard is bought.
# duplicate_check.py top score 0.21 (no venture reads a host's own history;
# str-host-payout-calculator and str-cleaning-fee-pricing-calculator model one
# typed booking and link here).
#
# First visitor: hosts on r/airbnb_hosts and r/AirBnBHosts, Facebook host groups
# and BiggerPockets STR threads asking "how do I see what I actually made",
# "is my cleaning fee covering my cleaner"; search phrases "airbnb earnings
# report", "airbnb transaction history analysis", "airbnb net earnings per
# listing". Volume not measured with an external tool.
#
# What makes it more than a pivot table: profit per night by length of stay
# charges the host's own turnover cost to every stay, which is what makes 1-2 night
# stays look better on gross and worse on profit; the cleaning-fee finding compares
# what guests paid with what the host says a clean costs; occupancy is stated
# with its limit (blocked nights are invisible) and can be overridden.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts the page has no network calls), so the portfolio holds
# no host or guest data and needs no Airbnb API access or partner approval.
#
# Path to revenue (payment rails stay off): lead magnet. The paid version, if usage
# appears, is a month-over-month diff and a multi-platform (Vrbo, Booking.com)
# merged view behind an env-var switch; neither is built.
#
# Liability: arithmetic on the user's file, stated model and omissions on the page,
# no tax or legal advice (occupancy taxes are shown for reference only), no
# warranty, independent-of-Airbnb clause.
#
# Unverified: the column names are from memory of Airbnb's export and matched
# tolerantly (aliases, day-first dates, UTF-16); no real export was available to
# test against, so the first user report of an unread file is the priority fix.

hypotheses:
  - claim: >-
      Short-term-rental hosts will run a no-signup, no-account-access analysis of
      the Transaction history they already downloaded before connecting a host
      dashboard to their Airbnb account.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Profit per night by stay length, after the host's own turnover cost, changes
      at least one pricing or minimum-stay decision, which is the reason to come
      back after each monthly export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong earnings figure, or a real Airbnb export the tool cannot read, at which point the parser needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/airbnb-earnings-report-analyzer/
  analytics: null
