name: cake-pricing-calculator
description: >-
  Free browser calculator for home bakers and cake decorators: ingredients, decoration, hours, delivery, overhead, fees and a target margin in,
  a price per cake and per serving out, with break-even, target and premium tiers, a deposit, and a check of what a price you already quoted
  really paid per hour. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. Nearest existing venture is cottage-food-pricing-calculator, which prices batch goods per unit from a pasted
# product table; this one prices a single custom order (servings, decoration, delivery, deposit) and checks a quote already given. No cake or decorator tool existed.
#
# First visitor: home bakers searching "cake pricing calculator", "how much to charge for a custom cake", "price per serving cake".
# Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; not business or legal advice; says what is not modelled
# (cottage-food law, licences, insurance, sales tax) and carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations; a printable quote/contract template pack would be the first paid product if it earns visits.

hypotheses:
  - claim: >-
      Home cake makers will type a cake's costs and hours into a no-signup calculator to find a price that pays their time,
      because ingredient-multiple rules of thumb hide the labor that dominates custom cakes.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/cake-pricing-calculator/
  analytics: null
