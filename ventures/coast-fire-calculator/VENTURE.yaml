name: coast-fire-calculator
description: >-
  Free browser calculator for people planning early or flexible retirement: enter age, savings, target retirement age,
  spending and a real return, and get the Coast FIRE number today, whether you have reached it, the age you cross the line
  if you keep saving, and the part-time (Barista FIRE) income needed while you coast. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check scored the nearest ventures at 0.19 (cafe-drink-margin-calculator,
# a lexical false match); no venture models coast or barista FIRE. retirement-withdrawal-sequencer and
# social-security-claiming-age-calculator cover the drawdown phase, not the accumulation-then-coast decision.
#
# Why this niche: a large personal-finance audience asks one question -- "can I stop saving and just cover my bills?" --
# and answers it in forum spreadsheets. The arithmetic (discount the retirement number at a real return) is simple but
# the barista draw and the crossing age are not, and most free calculators stop at the single coast number.
#
# First visitor: people searching "coast fire calculator", "barista fire calculator", "how much do I need to coast";
# r/coastFIRE, r/financialindependence and r/Fire threads that paste a spreadsheet. Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; no account data, nothing stored. Page says it is an
# illustration, not financial advice, lists what is not modelled (taxes, sequence risk, healthcare, Social Security timing)
# and carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet into the retirement-planning cluster plus donations.

hypotheses:
  - claim: >-
      People who have heard of Coast FIRE will enter their own numbers into a no-signup tool to learn whether they have
      reached the line, because forum spreadsheets give a single number and not the crossing age or the barista gap.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing the barista income needed (spending minus the sustainable draw) changes whether a person considers stepping
      down to part-time work.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Users report that tax drag and Social Security timing are the common reason the numbers feel wrong, at which point the tool should model them.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/coast-fire-calculator/
  analytics: null
