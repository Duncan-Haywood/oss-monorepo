name: drywall-bid-calculator
description: A private browser calculator for drywall contractors that prices a hang-and-finish job from rooms, waste, openings, ceiling height, and Gypsum Association finish levels 0–5 — labor hours, loaded wage, tape and mud, texture, dumpster, overhead, and margin — and shows the price per hung square foot, the share of labor that is finish, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent drywall contractors will use a finish-level bid calculator because the flat price-per-square-foot specials they compete with cannot see that a Level 5 skim under a skylight is a different job from a basement hang-and-texture, which is how a bid that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the finish-versus-hang hour split are the two numbers a contractor actually decides on when a homeowner asks them to match a neighborhood special, more than the job price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Finish hours, waste, and payroll burden are the three costs most often left out of a small drywall crew's own quote, so making all three required, explained inputs changes the resulting bid materially.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified drywall contractors use the calculator twice within 90 days.
  - Contractors report that the hang-versus-finish model is more work than their existing method without changing the price they would have bid.
  - The starting hours prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
