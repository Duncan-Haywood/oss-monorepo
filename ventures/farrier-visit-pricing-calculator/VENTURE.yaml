name: farrier-visit-pricing-calculator
description: >-
  Free browser tool for mobile farriers: enter horses per stop, minutes per horse, setup and drive time, miles,
  materials, working days, yearly fixed costs and a take-home target, and see a trip charge plus a per-horse rate,
  the price for each stop size, and how the flat per-horse rate you charge now performs. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06 in a new-venture-first session. Not in ventures/ (tow-truck-rate-calculator and
# fishing-charter-trip-pricing-calculator are neighbours in mobile-trade pricing; no equine tool), not in
# screened-out.md. Searches by farriers: "how much to charge for horse shoeing", "farrier trip charge",
# "farrier pricing per horse".
#
# Who: self-employed mobile farriers and new graduates setting a first rate card. Flat per-horse pricing is the
# norm in the trade, and it underprices one- and two-horse stops because drive and setup are fixed per stop.
# First visitor: a farrier deciding whether to add a trip charge or a minimum-horse rule.
#
# Path to revenue (payment rails stay off): lead magnet; donations via GitHub Sponsors. A route planner that
# clusters clients by drive time and a client reminder/invoice tool are the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with visible rules; carries the no-warranty and not-advice
# clauses and lists what is not decided (licensing, insurance, tax, emergency calls).
#
# Unverified: no market rate is claimed; the sample figures are illustrative only.

hypotheses:
  - claim: >-
      A mobile farrier setting next year's rates will enter drive time, minutes per horse and fixed costs to split
      the price into a trip charge and a per-horse rate, because one flat rate per horse loses money on small stops.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool by 2027-03-15.
  - A report that the price arithmetic differs from the stated rules on the same inputs.
