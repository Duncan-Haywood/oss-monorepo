name: testimonial-keeper
description: >-
  Self-hosted testimonial collection and embeddable wall: a link customers use
  to write a testimonial with an explicit publish consent, an approve/hide
  admin page, and a shadow-DOM widget that shows only what you approved.
  Zero-dependency server with a one-click Render deploy.
stage: prototype
owner: duncan

# Screened 2026-10-15. Paid market is real: Testimonial.to, Senja, Shoutout,
# Famewall and Endorsal sell testimonial collection and "wall of love" widgets
# to SaaS, agencies and course creators, usually as tiers that cap testimonials,
# forms or widget use. The gap: a solo founder who wants unlimited forms, a
# stored consent record and the data in a file they own, with no per-seat fee.
# duplicate_check.py top score 0.20 (feedback-board collects feature requests,
# not publishable proof).
#
# First visitor: indie founders, freelancers, course creators on Indie Hackers,
# r/SaaS, r/Entrepreneur and Hacker News asking "testimonial.to alternative",
# "collect testimonials free", "wall of love widget self hosted". Volume not
# measured with an external tool.
#
# Path to revenue (payments stay off): free and MIT as the lead magnet; a hosted
# version, done-for-you setup or GitHub Sponsors are the paid steps -- hosting
# under the public name and billing are owner-gated.

hypotheses:
  - claim: >-
      Solo founders will deploy their own testimonial collector once the demo
      wall shows how little there is to it, because the paid tools cap
      testimonials and forms behind tiers and keep the data.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      A stored consent tick plus never-edited text is what makes owners willing
      to publish customer words, and the embed (not the CSV) is what they keep
      using.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: false

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report) engage within 90 days of the page being reachable from the published site.
  - A user reports an unapproved testimonial or an email address appearing on the public wall, or markup from a testimonial executing; the approval gate and textContent-only rendering come before any new feature.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/testimonial-keeper/
  analytics: null
