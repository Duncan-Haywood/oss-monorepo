name: veterinarian-associate-pay-calculator
description: >-
  Free browser tool for veterinarians weighing associate offers: compares two
  contracts (salary, greater of a base or a percentage of production, or a base
  plus a percentage above a threshold) at the visitor's expected production, and
  reports yearly value, the real percentage after excluded production, value per
  hour, the crossover production, and each offer's pay if production runs low or
  high. No benchmark data is embedded. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-30 in a new-venture-first session. No veterinary venture
# exists in ventures/ (pet-grooming-bid-calculator is a different buyer) and
# "veterinar" is absent from screened-out.md. Buyers have money and a real
# decision: an associate offer is a five-to-six-figure yearly choice, usually
# read from a headline "X% of production". The edge is the excluded-production
# adjustment (lab, outside services) that turns the headline into a smaller real
# percentage, and the point where a percentage beats a guaranteed base.
#
# First visitor: new-graduate and associate vets in contract-review threads
# (r/veterinaryprofession, r/vetschool, vet finance blogs), searches "veterinary
# associate pay percentage of production" and "vet associate contract calculator";
# volume not measured with an external tool.
#
# Privacy is the liability boundary: offers never leave the browser (tests assert
# no network calls). No practice, consolidator or survey publisher is named and no
# market rate is asserted: the visitor supplies every number.
#
# Path to revenue (payment rails stay off): lead magnet and donations only.
# Liability: illustrative estimates, not advice; omissions stated on the page;
# points the reader to a contract attorney.
# Unverified: hand calculation and unit tests only.

hypotheses:
  - claim: >-
      Associate veterinarians holding a percentage-of-production offer will use a
      no-signup tool that shows the real percentage after excluded production
      and the crossover against another offer, not just the headline percentage.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that the result contradicts their own arithmetic on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/veterinarian-associate-pay-calculator/
  analytics: null
