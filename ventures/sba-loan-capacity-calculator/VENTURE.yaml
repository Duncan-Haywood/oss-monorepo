name: sba-loan-capacity-calculator
description: >-
  Free browser tool for small-business owners seeking an SBA-style loan. Enter cash flow, existing debt, rate, term and
  fees; get the largest loan a DSCR floor supports, business and global coverage on the loan you want, cash to bring,
  and term, rate and downturn sensitivity. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-07. No loan-capacity/DSCR sizer for a small business exists in ventures/ (business-loan-offer-comparator
# compares offers already held; rental-dscr-calculator is real-estate only). Not in screened-out.md.
# Who: owners applying for an SBA 7(a)/504 or bank term loan, and brokers/packagers sizing deals. First visitor: searches like
# "how much SBA loan can I qualify for", "SBA loan DSCR calculator", "debt service coverage ratio calculator small business".
# Volume not measured.
#
# Liability: arithmetic on the user's own numbers; no personal data, stores nothing; not a lender decision or advice. Eligibility,
# credit, collateral and fee schedules are explicitly out of scope on the page (fee is user-entered, not hard-coded).
#
# Unverified: no owner has used it. Defaults are placeholders. Path to revenue (payment rails stay off): lead magnet and
# donations; if usage appears, a printable lender-ready cash-flow summary, then a packager/broker tier behind an env switch.

hypotheses:
  - claim: >-
      Small-business owners preparing a loan application will use a private cash-flow-to-loan-size calculator because
      lenders size loans from DSCR and owners otherwise only learn their capacity after a banker runs the numbers.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/sba-loan-capacity-calculator/
  analytics: null
