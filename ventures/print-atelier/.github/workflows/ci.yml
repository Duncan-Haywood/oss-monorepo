name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 22 is the repository pin in `.nvmrc`, which this venture inherits: it
      # ships no `.nvmrc` of its own and the monorepo pipeline builds it on 22.
      # This job pinned 20 until 2026-08-04, so the only workflow that gated
      # this venture's merges ran on a major nothing else in the repository
      # runs — and `npm test` here loads `--import tsx`, which is exactly the
      # kind of thing the interpreter difference shows up in.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # The four gates VENTURE.yaml declares and the CI catalog executes, run
      # individually so a failure names the gate rather than one opaque step.
      #
      # Until 2026-08-04 this job ran `npm ci && npm run build` and nothing
      # else, so print-atelier's tests gated nothing on the path that merges
      # print-atelier's code. Adding a gate here without adding it to
      # VENTURE.yaml and the catalog is caught by
      # platform/ci/test/verify-contract.test.mjs; dropping one from here is
      # caught by the same test.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
