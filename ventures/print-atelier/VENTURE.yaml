name: print-atelier
description: AI-first, software-driven marketplace that digitizes physical art, sells prints via print-on-demand, and pays artists 30% of net profit.
stage: prototype

owner: duncan

hypotheses:
  - claim: Artists will supply work and buyers will purchase prints through a software-first, AI-automated marketplace with a 30% artist payout.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 50
  protected: true

kill_criteria:
  - No paying customer after 90 days post-launch.
  - Monthly cost exceeds MRR for 3 consecutive months past `revenue` stage.
  - Payout guardrails cannot keep a marketing channel's LTV:CAC above the required floor.

links:
  production: null
  analytics: null
