name: print-atelier
description: AI-first software marketplace digitizing physical art with POD fulfillment and 30% net profit payouts to artists.
stage: prototype
verify: npm run typecheck && npm run lint && npm test && npm run build

owner: duncan

hypotheses:
  - claim: Automated artist outreach and print-on-demand (Printful/Gelato) sustain positive unit economics with 30% net profit splits.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: 0
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 60
  protected: true

kill_criteria:
  - Unit economics remain negative post-payout for 3 consecutive months.
  - Zero artist onboarding or catalog additions within 60 days of active outreach.
  # The two criteria above are prose. Nothing in this repository measures artist
  # onboarding or post-payout unit economics, so neither can ever fire, and
  # until 2026-08-03 nothing read them at all. The one below is stated against
  # the ledger, which is recorded history, so the allocator can evaluate it.
  #
  # THRESHOLD NOT YET RATIFIED. $150 is roughly 2.5 months of this venture's $60
  # monthly cap, chosen by the change that made criteria evaluable rather than
  # by the portfolio owner. It is deliberately conservative: recorded spend is
  # $18.18 against $0 revenue, so this does not fire today. Confirm or replace
  # the figure — see docs/ENGINEERING-ROADMAP.md#portfolio-stopping-rules.
  - id: spend-without-revenue
    description: >-
      $150 of recorded agent spend accumulated with no revenue ever recorded
      against this venture in portfolio/ledger/.
    when:
      - metric: cumulative_agent_spend_usd
        op: ">="
        value: 150
      - metric: cumulative_revenue_usd
        op: "=="
        value: 0

links:
  production: null
  analytics: null

engineering:
  verify_command: npm run typecheck && npm run lint && npm test && npm run build
  ci_component: print-atelier
  coverage:
    lines: 90
    functions: 90
    statements: 90
    branches: 85
  critical_paths: []
  slo:
    availability: null
    latency: null
    correctness: null
  gitops:
    desired_state: null
    immutable_artifact: true
  security:
    threat_model: null
    data_classification: payment, customer-pii, consent
    scan_profile: source, history, dependencies, licenses, IaC, container, image
  measurement:
    outcome: null
    decision_supported: null
    event_schema: null
    data_quality_tests: null
  customer_feedback:
    channels: []
    satisfaction_measure: null
    review_cadence: null
    owner: duncan
  privacy:
    purpose: null
    lawful_basis: null
    notice_or_consent: null
    retention: null
    deletion: null
    access_owner: duncan
