# This file is the contract between a venture and the portfolio router.

name: print-atelier
description: AI-first, software-driven marketplace that digitizes physical art, sells prints via print-on-demand, and pays artists 30% of net profit; sells to both artists (supply) and print buyers (demand).

# idea | prototype | launched | revenue | scaling | winding-down
# Stage gates how much the router is willing to spend before demanding
# an outcome signal.
#
# All "orders," "onboarding," "payouts," and outreach are simulated or
# in-memory (docs/PRODUCT.md: "Database: — Not started"; .env.example has
# no live API keys — Stripe, Printful, Gelato, Meta, Google, and Pinterest
# credentials are all blank placeholders). No real artist has been onboarded
# and no real buyer order has occurred. This is an interactive prototype,
# not a launched product.
stage: prototype

owner: duncan

# What has to be true for this to be worth continuing. The router does not
# read prose, but you do — keep these honest and dated.
hypotheses:
  - claim: Artists will list artwork on Print Atelier in exchange for a 30%-of-net-profit POD payout instead of using or in addition to established marketplaces (Society6, Redbubble, Saatchi, Artfinder).
    status: untested        # untested | supported | refuted
    checked: null           # YYYY-MM-DD
  - claim: Buyers will purchase prints from a new, unbranded marketplace over established POD competitors when shown room-preview visualization and artist payout transparency.
    status: untested
    checked: null
  - claim: AI-first automation (capture, cataloging, outreach, ad creative) can keep customer acquisition cost and operating cost low enough to run without headcount.
    status: untested
    checked: null

# Where the money is. Nulls are fine early; the router treats an unmeasured
# venture differently from one measured at zero.
economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

# Caps agent spend so one venture cannot drain the portfolio.
# Unit is USD of model spend per month.
budget:
  monthly_cap: 50
  # Explore budget is protected: early ventures get funded even when their
  # measured return is zero, otherwise the router starves everything new.
  protected: true

# Stop conditions. When one trips, the router stops allocating and flags it.
kill_criteria:
  - No real (non-simulated) artist has a live, consent-cleared listing that produces a real buyer order within 90 days of shipping a persistence layer (database) to replace the current in-memory/localStorage mocks.
  - Monthly agent/automation spend exceeds the $50 cap for 3 consecutive months while economics.mrr remains null or zero.

links:
  production: null
  analytics: null
