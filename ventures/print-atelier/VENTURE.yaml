name: print-atelier
description: AI-first, software-driven marketplace that digitizes physical art, sells prints via print-on-demand, and pays artists 30% of net profit.
stage: idea

owner: duncan

hypotheses:
  - claim: Artists will onboard through an automated, software-driven prospecting/outreach flow at meaningful volume.
    status: untested
    checked: null
  - claim: Buyers will purchase POD prints of digitized art at a price point that clears the 30% artist share and platform costs.
    status: untested
    checked: null

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 30
  protected: true

kill_criteria:
  - No artist accepts an automated onboarding offer within 90 days of outreach automation shipping.
  - No print sells to a real buyer within 90 days of the storefront going live.

links:
  production: null
  analytics: null
