name: print-atelier
description: AI-first, software-driven marketplace that digitizes physical art, sells prints via print-on-demand, and pays artists 30% of net profit.
stage: idea

owner: duncan

hypotheses:
  - claim: Artists will onboard through an automated, software-driven prospecting/outreach flow at meaningful volume.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Buyers will purchase POD prints of digitized art at a price point that clears the 30% artist share and platform costs.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Artists will use a dated print-file evidence record that states what was checked, not that a lab will print the file.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: recordStripeWebhookToLedger and buildStripePayoutLedgerSummary give the investor dashboard an accurate running total of revenue and artist transfers, not inflated by webhook redelivery.
    status: supported
    checked: 2026-08-21
    evidence: in-repo
    note: >-
      recordStripeWebhookToLedger (src/lib/stripe-ledger.ts) appended a new
      ledger entry on every call with no check against eventId, unlike
      recordOrderFromPaymentWebhook (src/lib/orders.ts) which already dedupes
      on stripeEventId. Stripe webhooks are delivered at-least-once and are
      retried on timeout or any non-2xx response, so the same event id can
      reach the webhook route more than once in normal operation. Each
      redelivery of a transfer.created/payout.paid/payment_intent.succeeded
      event was appended as a second ledger row, and
      buildStripePayoutLedgerSummary sums amountCents across all rows, so
      totalTransferCents/totalPaymentCents (and the /investor dashboard that
      reads them via src/lib/investor.ts) would inflate by the duplicate
      amount. Reproduced with a standalone test: two
      recordStripeWebhookToLedger calls carrying the same eventId produced
      transferCount=2, totalTransferCents=5000 instead of 1/2500. Fixed by
      returning the existing entry when eventId is already present in the
      ledger, mirroring the orders.ts pattern; added a regression test
      (recordStripeWebhookToLedger ignores a redelivered event id instead of
      double-counting) to tests/stripe-ledger.test.ts. Full suite (129
      tests, was 128) passes after the fix.

economics:
  currency: USD
  mrr: null
  monthly_cost: null
  customers: null

budget:
  monthly_cap: 30
  protected: true

kill_criteria:
  - No artist accepts an automated onboarding offer within 90 days of outreach automation shipping.
  - No print sells to a real buyer within 90 days of the storefront going live.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/print-atelier/
  analytics: null

# Session-gate marker. pod-print-file-preflight graduates as a product
# line here, not as a new ventures/ directory. The first customer-facing
# slice is /print-file-preflight — a private, no-upload technical check.
product_lines:
  - slug: pod-print-file-preflight
