name: babysitting-business-kit
description: >-
  Back office for a one-person babysitting business: lead scoring with reply
  drafts, rate quotes, a schedule with double-booking checks and a calendar
  feed, unpaid-sit reminders, self-employment tax set-aside with quarterly due
  dates, year-end child care statements for families, reference and testimonial
  tracking with consent, a generated website and a content calendar. Browser
  app plus an optional zero-dependency self-hosted server that turns the
  website form into scored leads with auto-reply email and alerts.
stage: prototype
owner: duncan

# Started 2026-10-30 on a direct request: tools for a one-person
# babysitting business (taxes, scheduling, lead gen and
# qualification, references, website, automated sales and marketing, content).
# Built as a general product for any self-employed babysitter; the faith
# section is optional and never scores families. No user's personal data
# is in the repository; each sitter's desk stays in their browser or server.
#
# Alternatives: marketplaces (Care.com, Sittercity, UrbanSitter) find families
# but do not run the business; daycare software (Brightwheel, Procare) is for
# centers; generic CRMs and booking apps (HoneyBook, Calendly) charge monthly
# and know nothing of babysitting rates or sitter taxes.
# duplicate_check: nanny-tax-calculator is the family's side (household
# employer); childcare-* calculators price centers; ai-bookkeeper does general
# books. None runs a sitter's leads, schedule and references.
#
# First visitor: babysitters searching "babysitting taxes", "how much to
# charge for babysitting", "babysitting business tracker", "babysitter
# website"; teen and college sitters, church-nursery workers. Volume not measured.
#
# Path to revenue (payments stay off): free and MIT; done-for-you setup and
# hosting for sitters are the paid steps, owner-gated.

hypotheses:
  - claim: >-
      A self-employed babysitter will keep using the app weekly if the Today
      list shows the inquiries, follow-ups and unpaid sits they would otherwise
      forget, each with a message ready to copy.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      The tax set-aside and quarterly reminders, plus a year-end statement
      families ask for, are the features that bring a sitter back at tax time.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: false

kill_criteria:
  - The first real sitter using it stops using it within 60 days and the reasons cannot be fixed.
  - Any report that the generated website published a testimonial without consent; consent comes before any new feature.

links:
  production: https://duncan-haywood.github.io/oss-monorepo/babysitting-business-kit/
  analytics: null
