name: kdp-royalty-to-journal
description: >-
  Free browser tool that turns an Amazon KDP royalty report or payments export (CSV) into balanced accounting
  journals for Xero, QuickBooks Online and QuickBooks Desktop (IIF). It books royalties gross by marketplace
  and format (eBook, paperback, hardcover, KENP page reads), printing costs and tax withheld as expenses,
  keeps each currency in its own journal without converting anything, splits a report that straddles a month
  end into one journal per month, and checks each row's Total column and any Total row against the rows.
  Rows no rule recognises are journalled to an uncategorised account rather than dropped. The export is read
  locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-06 (sibling of kdp-royalty-report-analyzer, which reads the same kind of report to analyse
# net royalty per book, and kdp-royalty-calculator, which prices a book before it is published; this one books
# the same money into the ledger). The commercial analogues are author-royalty bookkeeping services and
# marketplace sync tools (A2X, Synder) that post platform payouts into Xero and QuickBooks, sold per month;
# this is the no-account, no-upload, one-report-at-a-time version for self-publishers whose KDP payments land
# in lumps by marketplace and currency and match no invoice.
# Search phrases: "KDP to QuickBooks", "KDP to Xero", "how to record KDP royalties in QuickBooks",
# "KDP royalties bookkeeping", "self-publishing accounting", "KDP printing cost journal entry". Volume not
# measured with an external tool.
#
# First visitor: self-publishing authors and their bookkeepers searching the phrases above, r/selfpublish and
# r/KDP threads on "how do I book KDP royalties", and the QuickBooks and Xero community forums where the
# question recurs.
#
# Who: self-publishing authors who keep their own books, and bookkeepers serving several of them, who today
# book each bank deposit as income.
#
# Path to revenue (payment rails stay off): lead magnet for the author and bookkeeper audience. If usage
# appears, the paid version is what a browser page cannot do: batch many authors or imprints, remember the
# account mapping per client, and add IngramSpark and Draft2Digital reports. Not built.
#
# Liability: writes a journal from the user's own export, shows the checks it ran, states what it does not
# check (tax treatment, currency conversion, when Amazon pays), and carries the no-warranty,
# independent-of-Amazon and financial-data clauses.
#
# Unverified: the column names of the KDP royalty report and payments export (matched here by alias), its
# format and transaction-type labels, whether its Royalty column is before or after printing cost (the page
# asks), whether it carries a Total column or Total row at all, how tax withheld is shown, and the Xero,
# QuickBooks Online and IIF import layouts are from memory of public help documents; nothing ran against a
# real KDP export or a live import. The first export this misreads is the priority fix.

hypotheses:
  - claim: >-
      A self-publishing author or their bookkeeper will paste a KDP royalty report into a no-upload page to get
      a month-split journal by marketplace and format, because the alternatives are booking each bank deposit as
      income (hiding printing cost, mixing currencies, putting income in the wrong month) or paying a monthly
      sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a report this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

