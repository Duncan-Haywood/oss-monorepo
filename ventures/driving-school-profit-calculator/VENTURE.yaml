name: driving-school-profit-calculator
description: >-
  Free browser calculator for independent driving-school owners: enter standard lesson, long block lesson and road-test package prices, car minutes, fuel and wear, late-cancellation rate, office
  rent, the car's cost and insurance, and road-test car hire, and see profit per lesson and per car hour, the price each offer needs for a target margin, break-even lessons per week, what
  cancellations cost, and what the same car nets instructed by the owner, with an employed instructor on a share of each lesson, or leased weekly to an independent instructor. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-11 in a scheduled session. No venture models a driving school (checked ventures/ by name: `ls ventures | grep -iE "driving|driver-ed"` finds only gig-driver tools, which are rideshare earnings,
# not a driving-instruction business). Not in screened-out.md. A school's scarce resource is the dual-control car's hours: lessons, long blocks and road-test packages share them, students cancel late,
# insurance and the car are large fixed costs, and the recurring decision is whether to instruct, employ an instructor or lease the car to an independent one. Sits beside barbershop-chair-profit-calculator
# (same chair-hour logic, different trade) rather than duplicating it.
#
# First visitor: independent driving-school owners searching "driving school profit per lesson", "how much to charge for driving lessons" and "driving instructor employee vs contractor car lease".
# Timing: year-round, with summer and pre-licence-age peaks. Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; says it is not an estimate of record; says what is not modelled; does not decide whether an instructor may be treated as
# independent (it says so on the page); carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations.

hypotheses:
  - claim: >-
      Independent driving-school owners will type a typical week's lessons, car minutes, insurance and rent into a no-signup calculator to set lesson and road-test prices and to decide between
      instructing, employing an instructor and leasing the car, because most set prices by copying the school down the road and never cost the car hour or the late cancellations.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/driving-school-profit-calculator/
  analytics: null
