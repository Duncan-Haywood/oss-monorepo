name: eu-pay-gap-report-calculator
description: >-
  Free browser calculator for the EU Pay Transparency Directive (2023/970) Art. 9 indicators: paste a payroll table (gender,
  category, base, bonus, hours) and get the mean and median gender pay gap, variable pay gap, share receiving bonuses, pay
  quartiles and the gap per job category with the 5% joint pay assessment flag. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. duplicate_check.py scored the nearest ventures (boi-reporting-exemption-checker,
# salary-range-posting-check, exempt-salary-threshold-checker) at 0.29 or below: salary-range-posting-check is US posting
# rules, the others unrelated. Nothing in the tree computes pay gap indicators.
#
# Why this niche: the Directive's transposition deadline was 7 June 2026 and employers with 150+ workers file a first report
# on 7 June 2027 (100-149 in 2031). Tens of thousands of EU employers, and non-EU firms with EU staff, must compute seven
# indicators from payroll data; consultancies and HRIS vendors sell this at four-figure prices. Most mid-size employers have
# a payroll export and no tool. A free calculator that never uploads payroll is a credible first step.
#
# First visitor: HR managers, payroll and finance leads searching "gender pay gap calculator EU", "pay transparency directive
# reporting", "pay quartiles calculator", "5% pay gap joint pay assessment". Volume not measured with an external tool.
#
# Liability boundary: arithmetic over a table the user pastes, following the Directive's published indicators; nothing stored
# or uploaded; not legal advice; states what is not modelled (equal-value evaluation, national transposition, filing formats)
# and carries the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations. A paid layer (multi-year trends, job-evaluation helper,
# formatted national report exports, joint pay assessment workpapers) needs accounts or per-country legal review, so an owner
# decision; not built.

hypotheses:
  - claim: >-
      HR and payroll leads at EU employers will paste a payroll export into a no-signup calculator to see their Art. 9 indicators
      and 5% category flags, because the alternatives are a consultancy or a hand-built spreadsheet and they cannot upload
      payroll to an unknown vendor.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      The 5% category flag is the feature that drives return use and sharing, since it names the categories needing a joint
      pay assessment.
    status: untested
    checked: null
    evidence: in-repo

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - National transposition laws diverge from the Art. 9 indicators enough that employers need country-specific formats, at which point the tool should model them or be retired.

links:
