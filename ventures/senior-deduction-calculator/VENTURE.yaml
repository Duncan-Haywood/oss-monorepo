      A taxpayer age 65+ (or with a spouse who is), searching for how the new
      2025 OBBBA senior deduction and its income phase-out apply to their own
      numbers, will prefer a free, private, no-signup, no-upsell calculator
      over an ad-supported finance blog's embedded widget or a paid tax-prep
      marketing page.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      The married-filing-separately-is-fully-excluded framing, and the
      same-MAGI-zero-crossing-for-one-or-two-spouses finding, are genuine
      differentiators a visitor cannot get from a generic phase-out
      description alone -- not just a duplicate entrant into an already-
      searched niche.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Visitors who land here from this portfolio's own
      auto-loan-interest-deduction-calculator or
      no-tax-on-tips-overtime-calculator (or vice versa) -- three new 2025
      OBBBA deductions a filer may claim in the same season -- will follow
      the cross-links between the three, a cross-venture return-visit signal
      this portfolio does not yet have evidence for.
    status: untested
    checked: null
    evidence: customer-contact

