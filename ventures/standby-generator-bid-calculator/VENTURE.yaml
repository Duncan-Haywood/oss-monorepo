name: standby-generator-bid-calculator
description: A private browser calculator for electrical contractors and generator dealers that prices a residential standby-generator install from the 240 V nameplate feeder, the transfer switch, the pad, the gas or propane line, and the setback — and shows the walk-away price plus how many times a typical 22 kW natural-gas hang this house really is.
stage: prototype
owner: duncan
hypotheses:
  - claim: Electrical contractors and generator dealers will use a standby-install bid calculator because the flat "$8,000 installed" number homeowners bring from a search result cannot see that a far-yard propane set plus a 400 A ATS is several times a 22 kW natural-gas hang beside the house, which is how a bid that looked like the last house turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the "times a typical 22 kW NG hang" comparison are the two numbers an installer actually decides on when a homeowner asks them to match the Facebook-ad price, more than the installed total itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Sizing the feeder from nameplate current and flagging an ATS that is smaller than the service changes the bid materially on 400 A houses and long setbacks, so making both required, explained outputs is what separates this from a generic job-costing spreadsheet.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified electrical contractors or generator dealers use the calculator twice within 90 days.
  - Contractors report that entering fuel, setback, and transfer-switch type is more work than their existing method without changing the price they would have bid.
  - The starting hours or material dollars prove so far from real trucks that the tool cannot be used without data we have no way to gather.
