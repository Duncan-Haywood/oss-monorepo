name: pergola-bid-calculator
description: A private browser calculator for deck and outdoor-living crews that prices a residential pergola or patio cover from post count, shade, height, and attachment — the extras a square-foot special cannot see — and shows the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Deck and outdoor-living crews will use a post-and-shade-aware pergola bid calculator because a published price-per-square-foot special cannot see that a 12×16 louvered cover is a different job than a 10×10 open cedar frame.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the shade share of direct cost are the two numbers a contractor actually decides on when a prospect asks them to match a $45/sf coupon, more than the job price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Switching from an open frame to slats or a louvered roof changes the resulting bid materially versus the same coupon written for footprint square feet, so making that shade layer a required, explained output changes the price they send.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified deck or outdoor-living contractors use the calculator twice within 90 days.
  - Contractors report that counting posts and shade is more work than their existing square-foot method without changing the price they would have bid.
  - The starting post-spacing and shade figures prove so far from real crews' practice that the tool cannot be used without data we have no way to gather.
links:
