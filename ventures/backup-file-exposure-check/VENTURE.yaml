  protected: true

kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - Hosting platforms and deploy tooling converge on never writing a backup
    artifact anywhere under a web-served document root by default (several
    already push toward managed, off-box backup services instead), at which
    point this check would be validating a misconfiguration that can no
    longer happen by default on those platforms rather than one many
    self-managed deployments still ship.

