kill_criteria:
  - No measurable return usage or organic referral traffic within 90 days
    of the 2027 January-April tax-filing season (the first full annual
    salary-setting cycle after this tool's 2026-09-24 launch that an
    S-corp owner or preparer would plausibly use it during).
  - Fewer than three unsolicited signals (star, fork, referral, or
    feedback) within that same 90-day window.

