name: uk-mtd-income-tax-checker
description: >-
  Free browser tool for UK sole traders and landlords: enter gross self-employment and property income for 2024-25, 2025-26 and 2026-27 to see whether Making Tax Digital for Income Tax is mandatory (more than GBP 50,000 from April 2026, 30,000 from April 2027, 20,000 from April 2028), your start date, the four quarterly update deadlines and the final declaration date. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; no MTD tool in ventures/ (uk-sole-trader-vs-limited-company-calculator is the only UK sibling).
#
# First visitor: UK sole trader, landlord or bookkeeper searching "do I need Making Tax Digital", "MTD income tax threshold 2027", "MTD quarterly update deadlines".
# Audience is millions of people with a dated legal deadline; volume not measured.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: a quarterly-update spreadsheet bridge or reminder pack behind an env-var switch.
#
# Liability: rules written from memory without network access; every result names GOV.UK as the source to verify, carries no-warranty and not-tax-advice clauses,
# and says what it does not decide (individual exemptions, trusts, partnerships, penalty amounts). Ethical risk is false comfort from a "not required" result, mitigated by the re-test note and the near-threshold warning.
hypotheses:
  - claim: >-
      UK sole traders and landlords unsure whether and when MTD applies will use a free checker to get their start date and quarterly deadlines.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a threshold or date differs from HMRC guidance on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-mtd-income-tax-checker/
  analytics: null
