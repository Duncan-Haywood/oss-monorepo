name: solar-land-lease-offer-calculator
description: >-
  Free browser tool and CLI for landowners weighing a solar developer's lease offer: present value of the option period and term
  against what the land earns now, break-even rent and escalator, inflation erosion of flat rent, and rent as a share of project
  revenue. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-10 in a scheduled session. Repo search of ventures/ for "solar farm", "solar land", "wind turbine" found no
# landowner lease pricer; nearest are commercial-solar-ppa-lease-buy-calculator (a business buying power), solar-pv-bid-calculator
# (installer bids) and cell-tower-lease-buyout-calculator. Not in screened-out.md.
#
# Why this niche: utility-scale solar developers are approaching rural landowners with 30-40 year leases; the offer is quoted per
# acre per year and the landowner has no neutral way to see its present value, the escalator that matters, or what to counter with.
# The decision is worth hundreds of thousands of dollars per owner, which is why a free tool earns attention.
#
# First visitor: landowners and farm families searching "solar lease per acre", "is a solar lease worth it", "solar lease
# escalator". Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user enters. No rate survey ships. Not legal, tax or financial advice; the page
# says so, tells the owner to have an energy-lease attorney review the document, and carries the no-warranty and no-SLA clauses.
# No data leaves the browser.
#
# Path to revenue (payment rails stay off): lead magnet and donations. A natural paid layer is a hosted offer-comparison
# workspace for ag-law firms and land agents; needs accounts and payments, so an owner decision; not built.

hypotheses:
  - claim: >-
      Landowners with a solar lease offer will type the numbers into a no-signup calculator before answering the developer.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing the present-value gap and the break-even escalator changes what a landowner counters with.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - Users report that the lease structures they are offered (revenue share, tiered rent, per-MW payments) do not fit a per-acre escalating rent, at which point the tool should model those.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/solar-land-lease-offer-calculator/
  analytics: null
