name: w2-efw2-file-validator
description: >-
  Free browser tool that checks a W-2 electronic wage file (SSA EFW2 format) before it is
  uploaded to Business Services Online: 512-character record lengths, record order, EINs,
  employee SSN validity, the seven money boxes, Social Security wage base and rate sanity,
  RT employer totals against the wage lines and the RF count, each with its line number,
  plus a rebuild of the RT and RF records after a hand edit. The file is read locally and
  never uploaded; SSNs are masked in the report.
stage: prototype
owner: duncan

# Screened 2026-10-04 in a new-venture-first session. duplicate_check.py: top score 0.11,
# nothing near the 0.45 bar. Payroll preparers, bookkeepers and small employers file W-2s
# by wage file when volume passes the paper limits or the software exports one, and edit
# the file by hand when a name or wage changes. SSA's upload either accepts the file or
# returns a terse rejection. Existing answers are SSA's own Windows desktop checker,
# payroll-software validators that only exist inside that software, and paid services;
# nothing is a free page that explains each fault with its line and fixes the totals.
#
# First visitor: payroll preparers searching "EFW2 file rejected", "SSA wage file format
# error", "W-2 electronic file validator", "RT record totals do not match". Volume not
# measured with an external tool. Seasonal: January peak.
#
# What makes it more than a format check: every finding names the line, the likely cause
# and the fix; RT sums are recomputed from the RW lines so a hand-edited wage shows as a
# total mismatch; SSN rules and the per-year Social Security wage base catch keying errors
# before SSA does; and the repair step rebuilds only RT and RF, never a wage line.
#
# Privacy is the liability boundary: wage files carry SSNs, so the file never leaves the
# browser (a test asserts no network calls), SSNs are masked in output, and the page says
# it is not a security assessment.
#
# Path to revenue (payment rails stay off): lead magnet for payroll and tax-prep
# audiences. A paid version, if usage appears, is bulk validation across clients and a
# saved W-2 box 12/13 rule set behind an env-var switch; not built.
#
# Liability: arithmetic on the user's own file, model and omissions stated on the page, no
# payroll or tax advice, no warranty, independent-of-SSA-and-IRS clause, wage data note.
#
# Unverified: every field position beyond RA 3-11/29-35, RE 3-6/8-16, RW 3-11/42-61 and the
# seven money boxes at 188-264, RT 3-9 and the 15-digit sums at 10-114, and RF 8-16; the
# EIN prefix list; the wage-base table for 2026; and whether SSA rejects (rather than
# warns on) lowercase text are from memory of the public specification. The first user
# report of a file that passes here and is rejected by SSA, or the reverse, is the
# priority fix.

hypotheses:
  - claim: >-
      A payroll preparer whose W-2 wage file was rejected will paste it into a no-login
      page, because the alternative is a rejection notice and a re-run of the whole export.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      Seeing the exact line and cause, and getting a corrected file, leads the same person
      to validate the next client's file before uploading, which is the reason to return.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted file structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports SSA rejecting a file this tool passed, or this tool failing a file SSA accepted, at which point the rules need revisiting.

