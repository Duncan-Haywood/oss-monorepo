name: payroll-hours-csv-check
description: >-
  Free browser tool that checks a payroll hours or timesheet CSV before it is keyed or imported into a
  payroll service: 8:30 mixed with 8.5 in one column, unit text like 8h, dates Excel turned into
  serial numbers or mixed day-first and month-first, the same person and day twice, hours over 24,
  Start and End times that disagree with the hours typed, overnight shifts, weekly totals over 40
  with no overtime entered, and unquoted commas in names that shift every column, each with its line
  number, plus a safe-fixes pass that cleans formatting only and never changes an hour, a date or a
  break. The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-04 in a new-venture-first session. duplicate_check.py found no payroll or timesheet
# checker in the tree (closest were the CRM and accounting import checkers). Every small employer who
# runs payroll from a spreadsheet, or exports hours from a time clock and fixes them in Excel before
# keying them into a payroll service, hits the same quiet faults: 8:30 pasted into a decimal column,
# an Excel serial where a date was, a person entered twice for one day, a week total typed in a daily
# row. A wrong payroll costs the employer real money and the employee a late or short paycheque.
#
# First visitor: bookkeepers, office managers and owners of small trades, restaurants and care
# businesses searching literal symptoms ("payroll import hours wrong", "timesheet csv 8:30 decimal
# hours", "excel date turned into number csv payroll", "convert hh:mm to decimal hours timesheet").
# Volume not measured with an external tool.
#
# Scope is deliberately the sheet, not a vendor: the exact column names of each payroll service's
# importer are not known here, so none are claimed. Rules for overtime, breaks and minimum wage are
# jurisdiction-specific, so they are noted and never applied. The page says it is not wage-and-hour
# advice, and the safe fixes never touch an hour, a date, a break or a name (a test pins it).
#
# Privacy is the liability boundary: employee names and hours are personal data, so the file never
# leaves the browser (a test asserts no network calls).
#
# Path to revenue (payment rails stay off): lead magnet for the small-employer audience, cross-linked
# to the overtime pay calculator and the import checkers. A paid version, if usage appears, is bulk
# checks across client files with saved column maps for bookkeepers behind an env-var switch; not
# built.
#
# Liability: format and arithmetic checks on the user's own file, no warranty, not payroll, tax or
# legal advice, no vendor named so no trademark use.
