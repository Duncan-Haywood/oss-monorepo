name: duct-cleaning-bid-calculator
description: A private browser calculator for HVAC and air-duct-cleaning contractors that prices a residential, two-system, heavy-debris, or light-commercial duct cleaning from extra air handlers, extra supply vents, extra returns, extra stories, crawl access, an occupied home, an evaporator-coil clean, sanitizer, and heavy debris — and shows the price per vent, the hours the first extra system actually consumes, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent duct-cleaning contractors will use a system-and-vent bid calculator because the generic $99 whole-house special they are shopped on cannot see that a one-system ten-vent ranch is a different job from a two-system colonial with extra returns, crawl access, and a coil clean.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the hour split (not the published $99 special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper ranch quote.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating extra systems, extra vents, extra stories, crawl access, coil clean, sanitizer, and heavy debris as their own hours, instead of a blended add-on to the special, changes the bid enough that shops notice which part of a high number is the first extra air handler.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified duct-cleaning contractors use the calculator twice within 90 days.
  - Shops report that splitting systems, vents, and extras is more work than their existing special without changing the price they would have bid.
  - The starting hours and filter rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/duct-cleaning-bid-calculator/
  analytics: null
