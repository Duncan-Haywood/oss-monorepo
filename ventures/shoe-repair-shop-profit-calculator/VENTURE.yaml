name: shoe-repair-shop-profit-calculator
description: >-
  Free browser calculator for independent shoe repair shops: enter heel, repair and rework prices, bench minutes, supplies, cobbler pay, machines and rent, and see
  profit per job and per bench hour, the price each job needs for a target margin, what a prepaid repair package earns per visit, break-even volume and the
  season at different volumes against the bench hours available. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-11 in a scheduled session. No venture models a cobbler or clothing shoe repair shop (checked ventures/ by name). Hems, standard
# repairs and full restorations share one cobbler's bench hours, demand spikes before fall boot and winter salt seasons, and some shops sell a
# prepaid repair package. Not in screened-out.md.
#
# First visitor: independent shoe repair shops owners searching "how much to charge for resoling boots", "shoe repair shop profit" and
# "shoe repair shop pricing". Timing: fall and winter boot season. Volume not measured with an external tool.
#
# Liability boundary: arithmetic over numbers the user types; nothing stored; says it is not an estimate of record; says what is not modelled; carries
# the no-warranty and no-SLA clauses.
#
# Path to revenue (payment rails stay off): lead magnet and donations.

hypotheses:
  - claim: >-
      Alterations shop owners will type a season's jobs, bench minutes and fixed costs into a no-signup calculator to set heel, repair and rework prices and to decide
      on a prepaid repair package, because most price by copying the shop down the road and never cost the bench hour.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/shoe-repair-shop-profit-calculator/
  analytics: null
