name: niit-calculator
description: >-
  Free browser tool for investors and high earners: fills in Form 8960 for the 3.8% net investment income tax,
  shows the headroom or excess against the $200,000 / $250,000 / $125,000 threshold, prices an extra gain,
  compares realizing it in one year against two, and shows what a $10,000 MAGI cut or loss is worth.
  Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-08 in a scheduled new-venture session. ventures/ had no NIIT / Form 8960 tool (grep for niit,
# net-investment found only mentions inside crypto, depreciation-recapture, inherited-ira and nua tools).
#
# Why this niche: "NIIT calculator" and "net investment income tax" are searched every spring and every
# December by people with six-figure incomes and a pending sale of stock, a rental or a business. The
# thresholds have never been indexed, so the audience grows every year. Incumbents are tax-prep software
# (which shows the number only at filing) and a few lead-gen blog calculators. A year-end what-if for one
# extra gain and a two-year split is the gap. Free tool is a lead magnet; a paid year-end tax-planning
# worksheet pack is the later revenue path (not built).
#
# First visitor: someone searching "NIIT calculator", "3.8% investment tax" or "does the net investment
# income tax apply". Volume not measured.
#
# Liability boundary: arithmetic on typed assumptions; no filing, no payments; thresholds editable and the page
# points to the Form 8960 instructions. Not tax advice.

hypotheses:
  - claim: >-
      Investors approaching a large sale will use a private what-if that prices an extra gain and a two-year
      split against the NIIT threshold, because tax-prep software only reveals the 3.8% after the year has closed.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that a figure disagrees with the same inputs done by hand.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/niit-calculator/
  analytics: null
