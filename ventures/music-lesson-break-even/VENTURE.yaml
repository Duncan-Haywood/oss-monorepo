name: music-lesson-break-even
description: A private browser calculator for independent music teachers to price lessons after cancellations, travel, preparation, and studio costs.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent music teachers need a transparent way to find the minimum lesson price that pays for their real teaching week.
    status: untested
    checked: null
    evidence: customer-contact
