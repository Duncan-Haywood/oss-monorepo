  protected: true

kill_criteria:
  - No measurable return usage or organic referral traffic within 90 days
    of the 2027 January filing season (the first full quarterly/annual
    sales cycle after this tool's 2026-09-24 launch that a seller would
    plausibly check their running totals against).
  - Fewer than three unsolicited signals (star, fork, referral, or
    feedback) within 90 days of that same window.

