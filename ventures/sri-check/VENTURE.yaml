kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - A materially better free tool covering the same generator-plus-drift-check
    shape with the same zero-install bar becomes the obvious default, such
    that this tool's differentiation no longer holds.

