name: wedding-venue-date-pricing-optimizer
description: >-
  Free browser tool for wedding venue owners: per date type (peak Saturday, off-peak, Friday/Sunday, weekday) enter dates,
  current price, bookings, turned-away enquiries and price sensitivity, and get the exact price that earns the most after
  hosting cost, expected bookings, sold-out flags and a price-sensitivity stress test. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-09 in a scheduled session. duplicate_check.py: closest rows were escape-room-pricing-capacity-planner 0.19
# and bridal-hair-makeup-pricing-calculator 0.17 (different industries); no venue-side pricing tool exists in the tree.
#
# Why this niche: independent wedding and event venues set a rate card once and rarely revisit it, while the same calendar
# sells out on peak Saturdays (money left on the table) and sits empty midweek. Dynamic-pricing software exists for hotels and
# airlines; venue owners get spreadsheets. An exact free pricer that uses turned-away enquiries as a demand signal is a lead
# magnet toward paid revenue-management consulting or a booking-calendar add-on.
#
# First visitor: people searching "how much to charge for a wedding venue", "wedding venue pricing Saturday vs Friday";
# venue-owner Facebook groups and forums. Volume not measured with an external tool.
#
# Liability boundary: arithmetic on typed figures; not pricing, financial or legal advice; nothing stored or sent.
#
# Path to revenue (payment rails stay off): lead magnet and donations; natural front end for a paid multi-venue yield
# manager that learns elasticity from booking history.

hypotheses:
  - claim: >-
      Independent venue owners will use a free tool that turns turned-away enquiries and a price-sensitivity guess into a
      price per date type, and will act on the sold-out flags.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that a figure disagrees with the same inputs done by hand.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/wedding-venue-date-pricing-optimizer/
  analytics: null
