name: commercial-solar-ppa-lease-buy-calculator
description: >-
  Free browser tool for businesses, farms, nonprofits and landlords: enter a commercial solar purchase quote, a PPA quote and a
  lease quote plus the utility rate, and get all three on one set of after-tax cash flows -- NPV, payback, IRR, the PPA rate at which
  buying stops winning, and a utility-escalation sensitivity table. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-09 in a scheduled session. duplicate_check.py: nothing close; solar-payback-calculator is the homeowner
# net-metering tool and solar-pv-bid-calculator is the installer's bid. Dropped before this one because the tree already has
# them: invoice factoring cost, SAFE dilution, ISO/AMT, RSU withholding, rent-increase notice, grant indirect rate, cost
# segregation, HOA reserves, podcast sponsorship rate, no-show cost.
#
# Why this niche: a commercial rooftop job is $100k-$2M and the buyer gets three differently-shaped quotes from an installer who
# profits from steering the choice. Installers' own proposal tools (Aurora, OpenSolar, Energy Toolbase) serve the seller; the
# buyer-side check is a spreadsheet. Facility managers, farmers, church and school finance staff, and property owners are the
# first visitors.
#
# First visitor: searches "solar PPA vs lease vs buy commercial", "should we buy or lease solar panels for our business",
# "solar PPA escalator calculator"; r/solar, r/CommercialRealEstate, farm and nonprofit finance forums. Volume not measured.
#
# Liability boundary: arithmetic on typed numbers; credit and depreciation percentages are user inputs, a "Not decided" section
# names the legal and tax questions it does not answer, no-advice footer. Nothing stored or sent.
#
# Path to revenue (payment rails stay off): lead magnet and donations. Natural front end for a paid quote-review or a
# referral-free comparison report -- needs an owner decision.

hypotheses:
  - claim: >-
      Commercial solar buyers will type three installer quotes into a free tool to compare them before signing.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a modelling error that changes which option wins on their numbers.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/commercial-solar-ppa-lease-buy-calculator/
  analytics: null
