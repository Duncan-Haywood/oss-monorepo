name: google-ads-wasted-spend-analyzer
description: >-
  Free browser tool that turns a Google Ads search terms report into a wasted-spend
  report: spend on terms that never converted split by strength of evidence, negative
  keyword candidates that never appear in a converting term, converting terms worth
  promoting to exact match, and match type and campaign breakdowns. The file is read
  locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-29 in a new-venture-first session. The paid category is large
# and real (Optmyzr, Adalysis, WordStream/LocaliQ, Opteo, Google's own
# recommendations tab, plus agencies selling "account audits"), and every one of
# them wants account access first. The buyer, a small advertiser or one-person
# agency paying per click, already has the file: Search terms -> Download. This is
# the free diagnostic that answers "how much is leaking" before any audit is
# bought. duplicate_check.py top score 0.21 (no venture analyses ad data).
#
# First visitor: local-service owners and freelance PPC managers on r/PPC,
# r/googleads and agency Slack communities asking "how do I find negative keywords",
# "how much of my spend is wasted"; search phrases "google ads wasted spend
# calculator", "search terms report negative keywords", "google ads negative
# keyword finder". Volume not measured with an external tool.
#
# What makes it more than a pivot table: the "proven waste" line is derived from
# the account's own conversion rate ((1-p)^n < 5%), so a term with 4 clicks and no
# conversion is not called waste and one with 60 is; word-level negatives are
# gated on never appearing in any converting term, so the list cannot block the
# terms that pay. Both are tested against the synthetic sample.
#
# Privacy is the differentiator and the liability boundary: the file never leaves
# the browser (a test asserts the page has no network calls), so the portfolio
# holds no advertiser data and needs no Google API access or OAuth review.
#
# Path to revenue (payment rails stay off): lead magnet. The paid version, if
# usage appears, is a recurring audit that diffs month over month and a Google
# Ads API connected version behind an env-var switch; neither is built.
#
# Liability: arithmetic on the user's file, stated model and omissions on the page,
# no advice, no warranty, independent-of-Google clause.

hypotheses:
  - claim: >-
      Small advertisers and freelance PPC managers will run a no-signup,
      no-account-access analysis of a downloaded search terms report before
      connecting an audit tool to their Google Ads account.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: >-
      An evidence-graded waste figure (proven vs. overspent vs. too little data)
      is trusted more than a flat "zero-conversion spend" number, which is the
      reason to come back after each monthly export.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a materially wrong waste figure or a negative keyword suggestion that would have blocked a converting query from a real export, at which point the model needs revisiting.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/google-ads-wasted-spend-analyzer/
  analytics: null
