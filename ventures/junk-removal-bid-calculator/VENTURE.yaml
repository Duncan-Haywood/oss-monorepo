name: junk-removal-bid-calculator
description: A private browser calculator for independent junk haulers that prices a cleanout from material weight — dump ticket, special item fees, labor, travel, and margin — and shows the job price, the price per cubic yard, and the walk-away number below which the scale ticket already lost the job.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent junk haulers will use a weight-based bid calculator because the truck-fraction specials they advertise cannot see that concrete, dirt, and appliances print a different dump ticket than couches of the same volume, which is how a job that looked profitable turns out not to be.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the dump-ticket line are the two numbers a hauler actually decides on when a customer asks for the half-truck special, more than the cubic-yard price itself.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Treating stairs, long carries, and a second dump run as first-class loaded labor changes the bid materially on basement and construction-debris jobs.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified junk haulers use the calculator twice within 90 days.
  - Haulers report that splitting materials by density is more work than their existing truck-fraction method without changing the price they would have bid.
  - The starting densities prove so far from real scale tickets that the tool cannot be used without data we have no way to gather.
links:
