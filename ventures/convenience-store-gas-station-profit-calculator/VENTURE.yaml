name: convenience-store-gas-station-profit-calculator
description: >-
  Free browser tool for convenience store and gas station owners and buyers: enter gallons, pump price, delivered fuel cost, card fees, inside
  sales by category, labor, fixed costs and loan payments, and see net fuel margin in cents a gallon after card fees, monthly operating
  profit, break-even gallons, debt coverage, the share of profit that rides on fuel, and margin and volume sensitivity. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; portfolio/pipeline/duplicate_check.py top score 0.28 (no convenience-store or gas-station
# tool in ventures/; nearest are card-processing-fee-audit and laundromat-acquisition-offer-calculator). Not in screened-out.md.
#
# First visitor: an independent c-store or gas station owner, or someone sizing a purchase and a loan; search phrases "gas station profit
# calculator", "convenience store profit margin", "how much do gas stations make per gallon". Volume not measured with an external tool.
#
# Who: independent operators and first-time buyers, where card fees on pump-price sales quietly take a fifth of the fuel margin and fuel
# is most of the profit. Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Saved scenarios and POS-export import
# behind an env-var switch is the possible paid version, not built.
#
# Liability: arithmetic on the user's own figures with every rule visible on the page. No margin, rate or market is claimed, sample figures
# are labelled illustrative, bad input is rejected instead of clamped, and the page carries the no-warranty and not-advice clauses and lists
# what it does not decide (market margins, tobacco/alcohol/lottery/fuel licensing and tax, tank compliance, lender terms, tax).

hypotheses:
  - claim: >-
      Independent c-store and gas station owners and buyers will enter gallons, price, cost and card fees to see cents a gallon kept after
      fees and break-even gallons, because POS and fuel-supplier reports show gross margin and card fees on separate statements and never
      divide them.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that the margin, profit, break-even or debt-coverage arithmetic differs from the stated rules on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/convenience-store-gas-station-profit-calculator/
  analytics: null
