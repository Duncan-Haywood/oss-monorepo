name: uk-mortgage-overpayment-calculator
description: >-
  Free browser tool for UK homeowners with a repayment mortgage: enter balance, rate and term plus a monthly overpayment or lump sum to see interest saved, years cut off, whether overpaying beats saving the same money, whether you stay inside the 10% early repayment charge allowance, and the overpayment needed to hit a target payoff date. Nothing is uploaded. Not financial advice.
stage: prototype
owner: duncan

# Screened 2026-10-14 in a new-venture-first session. The UK cluster (43 tax and pay tools) had no mortgage tool outside stamp duty; this is the highest-volume consumer search in that gap.
#
# First visitor: a UK homeowner searching "mortgage overpayment calculator", "should I overpay my mortgage or save", "how much interest will I save overpaying". Volume not measured. Rivals are lender and broker calculators that push their own products and rarely compare against savings or flag the ERC allowance.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: a remortgage planner across fixed-rate expiry dates and multiple overpayment strategies behind an env-var switch.
#
# Liability: repayment mortgages at a single rate only. Interest-only, offset, variable-rate changes, fees, tax on savings and lender-specific overpayment handling are refused and named. The page states it is not financial advice.
hypotheses:
  - claim: >-
      UK homeowners will use a free calculator to see what overpaying a mortgage saves and whether it beats saving, because lender calculators show only the headline interest saved and never the savings comparison or the early repayment charge limit.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true
