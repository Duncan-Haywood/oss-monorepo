name: veterinary-wellness-plan-pricing-calculator
description: >-
  Free browser tool for veterinary practices: list the services in an in-house wellness plan and see the monthly fee for a target
  margin, margin if members use more than planned, what members save, and yearly plan profit after churn. Nothing leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-09 in a scheduled session. duplicate_check.py: nothing scored above 0.23 for the vet wellness plan niche;
# med-spa-treatment-profit-calculator and boutique-fitness-studio-pricing-planner are neighbours (different buyer and cost structure).
#
# Why this niche: US vet practices increasingly sell monthly preventive-care plans, usually priced by copying a competitor or a
# corporate chain. The real risk is utilisation (members who use the whole bundle), which a spreadsheet seldom stresses.
#
# First visitor: searches "veterinary wellness plan pricing", "how to price a pet wellness plan", "vet membership plan profit";
# practice owners and managers, vet practice-management communities. Volume not measured.
#
# Liability boundary: arithmetic on typed numbers; placeholder example values labelled as such; no client or patient data; "Not
# decided" section names state plan regulation and tax; no-advice footer. Nothing stored or sent.
#
# Path to revenue (payment rails stay off): lead magnet and donations. Natural front end for a paid plan-management or
# plan-billing tool -- needs an owner decision on payment handling.

hypotheses:
  - claim: >-
      Vet practice owners and managers will enter their plan services and costs into a free tool to find a monthly fee and see how much utilisation risk the plan carries.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a figure that differs from the model in README.md for the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/veterinary-wellness-plan-pricing-calculator/
  analytics: null
