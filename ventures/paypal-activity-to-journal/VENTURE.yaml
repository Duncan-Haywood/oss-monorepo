name: paypal-activity-to-journal
description: >-
  Free browser tool that turns a PayPal Activity download (CSV) into balanced accounting journals for Xero,
  QuickBooks Online and QuickBooks Desktop (IIF). It walks the running Balance column row by row to prove no
  transaction is missing or out of order (naming the row where the chain breaks), books the gross payment to
  sales and the fee to PayPal fees so refunds and disputes come out right, groups chargebacks and holds,
  payments sent, bank transfers and currency conversion, and splits at month end into one journal per month
  per currency, each balanced to a PayPal account line. Rows no rule recognises are journalled to an
  uncategorised account rather than dropped. The file is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05 in a new-venture-first session, as the PayPal sibling of amazon-settlement-to-journal and
# stripe-payout-to-journal (shared journal builder). Commercial analogues: A2X, Link My Books, Synder and the
# PayPal connectors inside Xero and QuickBooks Online, which sync per month or lose multi-currency and fee
# detail. This is the no-account, no-upload, one-download-at-a-time version, and its edge is the Balance-column
# continuity proof, which PayPal's own file makes possible and which most connectors do not show the user.
# Search phrases: "PayPal to Xero journal", "PayPal activity report to QuickBooks", "reconcile PayPal fees
# accounting", "PayPal balance does not match bookkeeping", "PayPal CSV to journal entry".
# Volume not measured with an external tool.
#
# Who: sole traders, Etsy/eBay/Shopify sellers and small firms that take PayPal and keep their own books, and
# the bookkeepers who serve several of them, who today book the bank withdrawals as income (wrong: fees,
# refunds and disputes are hidden) or pay a monthly connector fee.
#
# Path to revenue (payment rails stay off): lead magnet for the small-business-finance audience. If usage
# appears, the paid version is what a browser page cannot do: batch many months and clients, remember the
# account mapping per client, and cover more processors behind an env-var switch. Not built.
#
# Liability: it writes a journal from the user's own file, shows the balance check it ran, states what it does
# not check, and carries the no-warranty, independent-of-PayPal and financial-data clauses.
#
# Unverified: the Activity download column names, the transaction type names and the Xero, QuickBooks Online and
# IIF import layouts are from memory of public help documents; nothing ran against a real PayPal download or a
# live import. The first download this misreads, or a journal an importer refuses, is the priority fix.

hypotheses:
  - claim: >-
      A small business that takes PayPal, or its bookkeeper, will paste an Activity download into a no-upload page
      to get a month-split journal, because the alternatives are booking bank withdrawals as income (hiding fees,
      refunds and disputes) or paying a monthly connector fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted download structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a download this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

