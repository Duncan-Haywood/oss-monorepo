[package]
name = "clonescan"
version = "0.1.0"
edition = "2021"
description = "Fast copy-paste (code clone) detector: token-based, parallel, jscpd-compatible defaults"
license = "MIT"
readme = "README.md"
repository = "https://github.com/duncan-haywood/oss-monorepo"
homepage = "https://duncan-haywood.github.io/oss-monorepo/clonescan/"
# What crates.io gets: the crate, its tests and the docs. The page, the
# WebAssembly build and the benchmark scripts live in the repository only.
include = ["src/**", "tests/detect.rs", "tests/fixtures/**", "README.md", "BENCHMARK.md", "LICENSE", "Cargo.toml"]
keywords = ["copy-paste", "duplicate-code", "clone-detection", "jscpd", "lint"]
categories = ["command-line-utilities", "development-tools"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "clonescan"
required-features = ["cli"]

[features]
default = ["cli"]
# The directory walker; the browser build reads files the page hands it.
cli = ["dep:ignore"]

[dependencies]
ignore = { version = "0.4", optional = true }
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
