name: ebay-payout-to-journal
description: >-
  Free browser tool that turns an eBay Transaction report (Seller Hub, Payments, Reports) into balanced
  accounting journals for Xero, QuickBooks Online and QuickBooks Desktop (IIF). It proves each payout's rows
  add up to its Payout row (or a deposit typed in from the bank), splits every order into item sales,
  shipping income, sales tax collected and fees, books Promoted Listings, insertion and store fees, shipping
  labels, refunds and disputes separately instead of the net deposit, splits a payout that straddles a month
  end into one journal per month, and balances each to an eBay clearing account. Rows no rule recognises are
  journalled to an uncategorised account rather than dropped. The report is read locally and never uploaded.
stage: prototype
owner: duncan

# Screened 2026-10-05. The commercial analogue is A2X (marketplace payout-to-journal sync, with eBay as one
# of its channels, sold per month to sellers and their bookkeepers) plus eBay-to-QuickBooks sync apps such as
# Webgility and Synder; this is the no-account, no-upload, one-report-at-a-time version. Sibling of
# shopify-payout-to-journal, stripe-payout-to-journal, paypal-activity-to-journal, amazon-settlement-to-
# journal, etsy-statement-to-journal and square-sales-to-journal, same journal shape, different export. The
# portfolio already had ebay-transaction-report-analyzer (profit per item from this same file) and the
# eBay fee calculator, but nothing that produces the journal an accountant actually posts.
# Search phrases: "eBay payout to QuickBooks", "eBay to Xero", "eBay transaction report journal entry",
# "how to record eBay sales and fees in QuickBooks", "eBay bookkeeping payouts".
# Volume not measured with an external tool.
#
# Who: eBay sellers who keep their own books and the bookkeepers serving several sellers, who today book the
# net deposit as income (wrong: final value fees, ads, labels and refunds are hidden, and sales tax the
# seller collected is income) or pay a monthly sync fee.
#
# Path to revenue (payment rails stay off): lead magnet for the eBay-seller and bookkeeper audience, linked
# from the transaction report analyzer. If usage appears, the paid version is what a browser page cannot do:
# batch many payouts and sellers, remember the account mapping per client, pull reports on a schedule
# (behind an env-var switch), and add Walmart and TikTok Shop settlements. Not built.
#
# Liability: it writes a journal from the user's own export, shows the check it ran, states what it does not
# check (tax treatment, revenue recognition, currency conversion), and carries the no-warranty, independent-
# of-eBay and financial-data clauses.
#
# Unverified: the column names, Type and Description wording of the eBay Transaction report, whether a
# Payout row's Net amount is signed, how eBay-collected marketplace tax appears, and the Xero, QuickBooks
# Online and IIF import layouts are from memory of public help documents; nothing ran against a real eBay
# report or a live import. The first report this misreads, or a journal an importer refuses, is the
# priority fix.

hypotheses:
  - claim: >-
      An eBay seller or their bookkeeper will paste a Transaction report into a no-upload page to get a
      month-split journal, because the alternatives are booking the net deposit (hiding fees, ads and
      refunds) or paying a monthly sync fee.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a pasted report structure) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a payout this tool misreads, or a journal that Xero or QuickBooks refuses, at which point the layouts need revisiting.

