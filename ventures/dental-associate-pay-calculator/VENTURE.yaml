name: dental-associate-pay-calculator
description: >-
  Free browser tool for associate dentists weighing job offers: compares two
  contracts (percent of production or collections, a daily guarantee, and a
  share of lab fees) at the visitor's expected production, and reports yearly
  value, effective percentage, where the guarantee stops mattering, the
  crossover, and each offer's pay if production runs low or high. No benchmark
  data is embedded. Nothing is uploaded.
stage: prototype
owner: duncan

# Screened 2026-09-30 in a new-venture-first session. duplicate_check.py: top
# match 0.16 (self-employed-schedule-c-categorizer, unrelated). The only dental
# venture is dental-ppo-writeoff-calculator (owner-dentist payer write-offs); no
# associate compensation tool exists. Buyers have money and a real decision: an
# associate offer is a six-figure yearly choice usually read from a headline
# "30%". The tool's edge is the effective percentage after lab fees and
# collections, and the guarantee breakeven, which the headline hides.
#
# First visitor: dental student and new-associate forums and subreddits
# (r/dentistry, r/askdentists), contract-review threads, searches "dental
# associate pay calculator" and "percent of collections vs production";
# volume not measured with an external tool.
#
# Privacy is the liability boundary: offers never leave the browser (tests assert
# no network calls). No practice, DSO or recruiter is named and no market
# percentage is asserted: the visitor supplies every number.
#
# Path to revenue (payment rails stay off): lead magnet and donations only.
# Liability: illustrative estimates, not advice; omissions stated on the page;
# points the reader to a healthcare contract attorney.
# Unverified: hand calculation and unit tests only.

hypotheses:
  - claim: >-
      Associate dentists holding a percentage-plus-guarantee offer will use a
      no-signup tool that shows the effective percentage after lab fees and
      collections, and the crossover against another offer, not just the
      headline percentage.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports that the result contradicts their own arithmetic on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/dental-associate-pay-calculator/
  analytics: null
