  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a layout that overlaps two SKUs, moves a locked SKU, or a walking figure that disagrees with the same inputs done by hand.

