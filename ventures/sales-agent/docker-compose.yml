# IMAP_HOST=imap.example.com IMAP_USER=you@example.com IMAP_PASS=app-password ADMIN_TOKEN=$(openssl rand -hex 16) docker compose up -d
services:
  sales-agent:
    build: .
    ports: ["127.0.0.1:8787:8787"]   # put a TLS proxy in front before exposing it
    volumes: ["agent-data:/data"]
    environment: [IMAP_HOST, IMAP_USER, IMAP_PASS, ADMIN_TOKEN, "IMAP_BOX=INBOX", SEND_ENABLED, SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_FROM]
    restart: unless-stopped
volumes: { agent-data: {} }
