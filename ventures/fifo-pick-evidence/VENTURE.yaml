name: fifo-pick-evidence
description: A local CSV checker that gives small 3PL warehouses a portable FIFO pick-order evidence report.
stage: prototype
owner: duncan
hypotheses:
  - claim: Small 3PL warehouses need a fast way to identify and explain FIFO pick-order exceptions before customer audits.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A local, source-linked report is useful enough to replace a recurring spreadsheet review.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified warehouse operators run two reports within 90 days.
  - Operators do not identify at least one useful exception or missing-data issue in pilot use.
