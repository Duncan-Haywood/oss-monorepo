kill_criteria:
  - No measurable return usage or organic referral traffic within 90 days
    of the 2027 January filing season (the first full plan-year cycle
    after this tool's 2026-09-24 launch that a saver would plausibly
    re-check their running totals against).
  - Fewer than three unsolicited signals (star, fork, referral, or
    feedback) within 90 days of that same window.

