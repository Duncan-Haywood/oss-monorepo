name: tent-rental-job-profit-calculator
description: >-
  Free browser tool for tent, party and event rental companies: enter the rental price,
  delivery fee, crew hours, truck miles, supplies, damage reserve, card fees, tent cost and
  yearly overhead and see true profit per job, margin, profit per crew hour, the lowest
  quote that earns a target margin, how many rentals a tent needs to pay for itself,
  break-even jobs a year, and a two-job comparison. Copy, CSV, save and load. Nothing
  leaves the browser.
stage: prototype
owner: duncan

# Screened 2026-10-12 in a new-venture session. No tent/party/event-rental venture
# existed (photo-booth, mobile-bartender and coffee-cart event quotes cover other
# trades). Why this niche: small tent and party rental firms quote a rental price plus
# delivery, but the cost is mostly crew hours (load, drive, setup, takedown, clean) the
# quote never counted, and a $5k frame tent is a purchase decision with a payback nobody
# computes. Searches like "how to price a tent rental" and "party rental business profit
# per job" recur. Rental software (booking/inventory) costs $50-300 a month and does not
# answer the pricing question, so this is the lead magnet for a later paid multi-job
# season planner (payment rails stay off for now).
#
# First visitor: party/tent rental owner groups and forums. Volume not measured with an
# external tool.
#
# Liability boundary: arithmetic on user-typed numbers. Not tax, legal, insurance or
# financial advice; says so. Names no vendor or brand. No data fetched, no accounts,
# nothing stored.

hypotheses:
  - claim: >-
      Small tent and party rental owners will enter a quote and their crew and truck
      costs into a no-signup tool and use the lowest-quote and payback numbers to raise
      prices or decide whether to buy another tent.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - A user reports a lowest quote that does not reproduce the tool's own target margin when typed back in as the rental price.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/tent-rental-job-profit-calculator/
  analytics: null
