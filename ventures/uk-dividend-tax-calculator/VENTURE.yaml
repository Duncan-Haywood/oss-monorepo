name: uk-dividend-tax-calculator
description: >-
  Free browser tool for UK company directors, investors and side-earners: enter your other income and your dividends to see dividend tax for 2025/26 and 2026/27 by band, the 500 GBP dividend allowance, the cost of the next 1,000 GBP of dividends and what to report. Nothing is uploaded. Not tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-13 in a new-venture-first session; no UK dividend tax tool in ventures/ (closest: uk-sole-trader-vs-limited-company-calculator, a different question). Sibling in the UK personal-tax cluster.
#
# First visitor: UK limited-company director or investor searching "dividend tax calculator uk", "how much tax on 40000 dividends", "dividend tax 2026/27".
# Dividend rates rise by 2 points in April 2026 and the allowance is only 500, so far more directors and landlords-with-companies now ask; recurring annual search. Volume not measured.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Paid version, not built: a salary-vs-dividend optimiser for directors behind an env-var switch.
#
# Liability: rules written from memory without network access; every result names GOV.UK as the source to verify, carries no-warranty and not-tax-advice clauses,
# and says what it does not decide (Scottish bands, band extensions, savings income). The 2026/27 rates are flagged as announced, to be confirmed. Ethical risk is an understated bill; mitigated by naming the unmodelled items and sourcing.
hypotheses:
  - claim: >-
      UK directors and investors will use a free calculator to see their dividend tax by band before they take a dividend.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a threshold, rate or date differs from HMRC guidance on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-dividend-tax-calculator/
  analytics: null
