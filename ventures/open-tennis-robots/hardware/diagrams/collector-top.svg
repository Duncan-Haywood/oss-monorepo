<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Ball-collecting rover, top view (v0.1)</title>
  <rect width="640" height="420" fill="#ffffff"/>
  <!-- chassis 0.60 x 0.55 m at 500 px/m -->
  <rect x="170" y="80" width="275" height="300" rx="16" fill="#eef2f7" stroke="#333" stroke-width="2"/>
  <!-- hopper -->
  <rect x="200" y="170" width="215" height="150" rx="8" fill="#fff3bf" stroke="#8a6d00"/>
  <text x="250" y="250" fill="#8a6d00">hopper ~75 balls</text>
  <!-- ramp + roller at front (top of drawing) -->
  <rect x="195" y="60" width="225" height="30" fill="#c9d7ee" stroke="#3b6fb6"/>
  <text x="440" y="70" fill="#3b6fb6">paddle roller, 0.45 m</text>
  <path d="M200 92 L 415 92 L 405 165 L 210 165 Z" fill="#e3ecf8" stroke="#3b6fb6"/>
  <text x="250" y="135" fill="#3b6fb6">curved ramp</text>
  <!-- balls -->
  <circle cx="250" cy="30" r="16" fill="#d4e157" stroke="#7a8a00"/>
  <circle cx="340" cy="20" r="16" fill="#d4e157" stroke="#7a8a00"/>
  <!-- wheels -->
  <rect x="140" y="200" width="28" height="90" rx="6" fill="#333"/>
  <rect x="447" y="200" width="28" height="90" rx="6" fill="#333"/>
  <text x="20" y="250">drive wheel</text>
  <text x="485" y="250">drive wheel</text>
  <circle cx="307" cy="360" r="12" fill="#666"/>
  <text x="325" y="365">caster</text>
  <!-- mast + bumpers -->
  <circle cx="307" cy="340" r="8" fill="#333"/>
  <text x="330" y="345">camera mast (1 m)</text>
  <path d="M168 95 Q 168 52 210 52" fill="none" stroke="#c0392b" stroke-width="5"/>
  <path d="M447 95 Q 447 52 405 52" fill="none" stroke="#c0392b" stroke-width="5"/>
  <text x="20" y="60" fill="#c0392b">bumper skirt</text>
  <!-- dimension -->
  <line x1="140" y1="400" x2="475" y2="400" stroke="#888"/>
  <text x="285" y="415" fill="#888">~0.60 m</text>
  <text x="560" y="40" fill="#555">forward ↑</text>
</svg>
