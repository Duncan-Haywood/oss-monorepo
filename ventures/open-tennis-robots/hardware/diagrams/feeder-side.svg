<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Feeder with moving catch net, side view (v0.1)</title>
  <rect width="760" height="420" fill="#ffffff"/>
  <!-- ground -->
  <line x1="20" y1="360" x2="740" y2="360" stroke="#555" stroke-width="2"/>
  <text x="600" y="380" fill="#555">court surface</text>
  <!-- baseline marker -->
  <line x1="420" y1="352" x2="420" y2="368" stroke="#1a7f37" stroke-width="4"/>
  <text x="425" y="380" fill="#1a7f37">baseline</text>
  <!-- net plane frame: 2.5 m tall at 100 px/m -->
  <line x1="340" y1="360" x2="340" y2="110" stroke="#333" stroke-width="5"/>
  <path d="M340 110 Q 365 235 340 330" fill="none" stroke="#3b6fb6" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="365" y="125" fill="#3b6fb6">catch net (3.0 m wide x 2.5 m tall, slack netting)</text>
  <!-- trough -->
  <path d="M300 330 L 345 345 L 300 352 Z" fill="#c9d7ee" stroke="#3b6fb6"/>
  <text x="352" y="340" fill="#3b6fb6">trough to hopper</text>
  <!-- base -->
  <rect x="150" y="300" width="170" height="40" fill="#e6e6e6" stroke="#333"/>
  <circle cx="175" cy="345" r="15" fill="#333"/>
  <circle cx="295" cy="345" r="15" fill="#333"/>
  <text x="60" y="392">lateral base (moves sideways, in/out of page)</text>
  <!-- hopper -->
  <path d="M170 180 L 260 180 L 235 240 L 195 240 Z" fill="#fff3bf" stroke="#8a6d00"/>
  <text x="150" y="172" fill="#8a6d00">hopper ~120 balls</text>
  <line x1="215" y1="240" x2="250" y2="258" stroke="#8a6d00" stroke-width="6"/>
  <!-- launcher head at 1.0 m -->
  <rect x="245" y="235" width="60" height="55" rx="6" fill="#f1f1f1" stroke="#333"/>
  <circle cx="290" cy="248" r="14" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="290" cy="277" r="14" fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="305" y1="262" x2="520" y2="215" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="540" cy="210" r="7" fill="#d4e157" stroke="#7a8a00"/>
  <text x="480" y="300" fill="#c0392b">feed (through padded sleeve)</text>
  <text x="60" y="262" fill="#c0392b">two-wheel launcher</text>
  <text x="60" y="278" fill="#c0392b">150 mm wheels, -15..45 deg</text>
  <!-- cameras -->
  <rect x="325" y="92" width="30" height="16" fill="#333"/>
  <text x="170" y="98">stereo cameras on top bar</text>
  <!-- return path -->
  <path d="M740 180 Q 560 120 470 352 Q 430 250 350 240" fill="none" stroke="#7a8a00" stroke-width="2"/>
  <text x="540" y="150" fill="#7a8a00">player's return, after bounce</text>
  <!-- dimensions -->
  <line x1="40" y1="110" x2="40" y2="360" stroke="#888"/>
  <text x="46" y="230" fill="#888">2.5 m</text>
  <line x1="340" y1="405" x2="420" y2="405" stroke="#888"/>
  <text x="352" y="418" fill="#888">0.8 m</text>
</svg>
