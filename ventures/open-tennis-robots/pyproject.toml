[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisbots"
version = "0.1.0"
description = "Open-source tennis robots: ball machine shot planner, moving catch-net simulation, ball-collector route planning, ESP32 protocol, Amazon listing tool for sellers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["tennis", "ball machine", "robotics", "ball collector", "raspberry pi", "esp32", "open hardware"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
vision = ["opencv-python-headless", "numpy"]
serial = ["pyserial"]

[project.scripts]
tennisbots = "tennisbots.cli:main"

[project.urls]
Homepage = "https://duncan-haywood.github.io/monorepo-projects/open-tennis-robots/"
Source = "https://github.com/duncan-haywood/oss-monorepo/tree/main/ventures/open-tennis-robots"

[tool.setuptools.packages.find]
where = ["src"]
