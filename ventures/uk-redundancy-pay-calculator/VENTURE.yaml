name: uk-redundancy-pay-calculator
description: >-
  Free browser tool for UK employees facing redundancy: enter age, years of service and pay to see statutory redundancy pay for 2025/26 and 2026/27 by age band, the weekly pay cap, and how much is tax-free (first 30,000 pounds). Nothing is uploaded. Not legal or tax advice.
stage: prototype
owner: duncan

# Screened 2026-10-14 in a new-venture-first session; no UK redundancy pay tool in ventures/ (au-redundancy-pay-calculator is Australian; checked by name and content).
#
# First visitor: a UK employee told they are at risk of redundancy, searching "redundancy pay calculator", "statutory redundancy pay 2026", "is redundancy pay taxed".
# Evergreen with spikes around layoff news; high search volume against dominated-by-GOV.UK and law-firm lead-gen calculators; volume not measured. Adjacent to the other UK tax tools here for cross-links.
#
# Path to revenue (payment rails stay off): lead magnet; GitHub Sponsors. Commercial calculators in this space are lead-generation for employment solicitors; the honest edge is a private one with the cap, bands and tax-free limit shown line by line.
#
# Liability: rules written from memory without network access; every result names GOV.UK as the source to verify, carries no-warranty and not-legal-or-tax-advice clauses,
# and says what it does not decide (Northern Ireland, contractual schemes, notice and holiday pay). Ethical risk is a wrong amount shown to someone in a stressful situation; mitigated by naming the unmodelled items, sourcing, and telling users to get the calculation in writing.
hypotheses:
  - claim: >-
      UK employees facing redundancy will use a free calculator to check their statutory redundancy pay and the tax-free portion before accepting an offer.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or feedback) engage with the tool within 90 days of it being reachable from the published site.
  - A report that a cap, rate or limit differs from GOV.UK guidance on the same inputs.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/uk-redundancy-pay-calculator/
  analytics: null
