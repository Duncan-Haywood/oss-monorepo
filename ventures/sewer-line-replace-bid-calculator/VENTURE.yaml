name: sewer-line-replace-bid-calculator
description: A private browser calculator for plumbing and sewer-repair shops that prices replacing a sewer line from open-cut, pipe bursting, or CIPP lining — footage, bury depth, laterals, and the surface that has to go back — and shows the price per foot, the restoration share, and the walk-away price below which the job loses money.
stage: prototype
owner: duncan
hypotheses:
  - claim: Independent plumbing shops will use a method-and-restore bid calculator because the generic "$125 a foot" or published open-cut price they are shopped on cannot see that 40 feet under a lawn is a different job from 80 feet under a driveway with two laterals.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The walk-away price and the restoration share (not the published per-foot special) are the two figures a shop actually decides on when a homeowner asks them to match a cheaper yard-job quote on a driveway run.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: Showing open-cut, pipe bursting, and CIPP on the same run, with restoration as its own cost, changes the bid enough that shops notice which method keeps the margin.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified plumbing or sewer-repair shops use the calculator twice within 90 days.
  - Shops report that splitting method, surface, and laterals is more work than their existing per-foot method without changing the price they would have bid.
  - The starting hours and material rates prove so far from real crews that the tool cannot be used without data we have no way to gather.
links:
  production: https://duncan-haywood.github.io/monorepo-projects/sewer-line-replace-bid-calculator/
  analytics: null
