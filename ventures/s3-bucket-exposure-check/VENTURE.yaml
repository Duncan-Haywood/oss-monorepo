  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - No organic traffic or CLI/repo engagement after being listed and indexed
    for a fair run (per portfolio/usage/README.md's "fair run" definition).
  - AWS changes S3's default anonymous-access behaviour so an unsigned
    ListBucket/GetBucketAcl request can no longer distinguish a public
    bucket from a private one (e.g. anonymous requests are refused
    account-wide regardless of ACL/policy state), at which point this
    check would be validating a misconfiguration that can no longer be
    observed this way rather than one many accounts still carry.

