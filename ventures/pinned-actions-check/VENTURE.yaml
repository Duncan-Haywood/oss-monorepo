name: pinned-actions-check
description: Free, read-only checker that scans a repository's GitHub Actions workflow files and flags third-party actions referenced by a mutable tag (@v4, @main) instead of a pinned 40-character commit SHA, printing the git ls-remote command to look up the SHA yourself.
stage: prototype

owner: duncan

# Not a scored pipeline candidate: screened this session with
# `python3 portfolio/pipeline/duplicate_check.py` against every existing
# venture, pipeline candidate, screened-out row, and ai-first-markets idea --
# top score 0.11, well below the 0.45 read-this-first bar. Not a duplicate of
# mcp-supply-chain-watch (that's about MCP servers a customer has connected,
# not the customer's own CI config) or actions-runner-starvation-check (CI
# runner starvation, unrelated). Like that same sibling, this is a direct
# graduation of an already-obvious, low-risk dev-tool idea, not a pipeline
# candidate write-up.
#
# Shape rationale: portfolio/pipeline/README.md's "archetype itself" section
# found 141 of 200 ventures are <trade>-bid-calculator clones with zero
# measured visitors, and told sessions to weigh a CLI/checker shape over a
# 142nd calculator when there is no unusually strong named channel -- this is
# exactly that recommended shape, following actions-runner-starvation-check's
# precedent (a generalized dev-tool CLI + browser port + SEO landing page,
# not a pipeline-candidate write-up).
#
# Gate self-assessment: liability_containment and ethical_robustness are both
# high -- this is a mechanical, read-only linter with no advice-of-record, no
# compliance claim, no data leaving the user's device, and no scraping. It
# makes no network calls of its own anywhere in the code (check.py, classify.mjs):
# a mutable finding prints a git ls-remote command for the user to run
# themselves, it never resolves anything on our behalf. Comparable to
# repository-branch-hygiene and actions-runner-starvation-check, both already
# graduated and live on this exact reasoning.
hypotheses:
  - claim: A maintainer whose repo has third-party actions pinned to a tag will run this after reading about an actions-supply-chain incident (tj-actions/changed-files, or similar) and finding no existing tool that stays entirely local -- no upload, no API call, no token needed.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A team will wire `check.py --fail-on-risk` into their own CI to block a newly-added unpinned action before it merges, the same way actions-runner-starvation-check's CLI convention is meant to be used.
    status: untested
    checked: null
    evidence: customer-contact

economics:
