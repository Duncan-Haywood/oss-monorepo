name: pool-service-route-calculator
description: 'Free, zero-network, zero-dependency browser tool and CLI for independent pool service route owners: enter each account (monthly price, visit minutes, drive minutes between stops, chemical cost per month, equipment and repair callbacks per year) plus truck and helper costs and a target hourly, and get the true effective hourly of every account, which to keep, reprice or drop, the price that clears the target, what dropping or adding a stop a given number of minutes away does to the whole route''s hourly, and a CSV audit of the route. Numbers are the ones the user supplies, not market rates or advice.'
stage: prototype

owner: duncan

# Calculator/CLI archetype, earn-more: raises what a pool route owner earns per hour by showing which accounts are paid for the drive and the callbacks and which are not, before the next price letter or the next new stop.
# Checked 2026-10-03: ventures/ has pool-route-pricing (prices ONE account from labour, drive, chemicals and margin; vs-skimmer and
# flat-rate pages), route-account-pruner (generic route CSV for lawn, pool, pest, cleaning; keep/reprice/drop with a typed cancellation
# rate, explicitly no route density, no callbacks) and pool-plaster-bid-calculator (resurfacing job bids). This venture does not repeat
# them: it is pool-specific (chemical cost, equipment/repair callbacks as unpaid trips with their parts), computes route-density effect
# (what dropping a stop does to the remaining route's hourly; what a new stop N minutes away must charge and does to the route) and
# exports a CSV audit. pool-route-pricing and route-account-pruner are linked from the page. Not in screened-out.md.
#
# First visitor: searches "how much to charge for pool service", "is my pool route profitable", "which pool service customers to drop",
# "pool route buying price per stop"; pool-route owner groups and forums, pre-season price-letter time. Volume not measured with an
# external tool. Route owners usually know their monthly revenue and not their per-account hourly once drive and callbacks count.
# A hosted version that imports from Skimmer or Pool Brain exports is the natural paid upgrade.
hypotheses:
  - claim: A pool route owner will paste their accounts, see which ones earn under target per hour after drive and callbacks, and raise or drop at least one.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A pool route owner will use the new-stop table to decide what to charge for a stop on the far side of their route.
    status: untested
    checked: null
    evidence: customer-contact

economics:
  currency: USD
  mrr: null
  # Zero, structurally: the browser tool analyses only typed or pasted values in the
  # visitor's own browser and the CLI reads only local input; no network call.
  monthly_cost: 0
  customers: null

budget:
  monthly_cap: 1
  protected: true

kill_criteria:
  - Fewer than three distinct GitHub users (issues, stars, or a paste-in report) engage with the tool within 90 days of it being reachable from the published site.
  - No route owner reports raising a price, dropping an account or changing what they charge a new stop because of what the tool showed within 90 days.

links:
  production: https://duncan-haywood.github.io/monorepo-projects/pool-service-route-calculator/
  analytics: null
