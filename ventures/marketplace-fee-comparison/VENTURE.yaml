name: marketplace-fee-comparison
description: A private browser tool that ranks what one item nets on eBay, Etsy, Amazon, Shopify and a seller's own site after fees and cost of goods, and shows the price each channel needs to match the best one.
stage: prototype
owner: duncan
hypotheses:
  - claim: Sellers who list on more than one channel will use a single comparison page rather than re-entering the same cost of goods into a separate calculator per marketplace.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: The spread between the best and worst channel on one order is the number that changes a listing decision, more than any single channel's fee total.
    status: untested
    checked: null
    evidence: customer-contact
  - claim: A comparison page routes multi-channel sellers into the deeper single-channel calculators, making it the portfolio's entry point rather than a seventh competing one.
    status: untested
    checked: null
    evidence: customer-contact
economics:
  currency: USD
  mrr: null
  monthly_cost: 0
  customers: null
budget:
  monthly_cap: 1
  protected: true
kill_criteria:
  - Fewer than three qualified multi-channel sellers use the comparison twice within 90 days.
  - No user reports that the comparison changed where they listed an item, or what they priced it at, within 90 days.
links:
  production: null
  analytics: null
