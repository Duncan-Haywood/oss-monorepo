# The worker's tool cache, kept between Jobs.
#
# Two things live here: `bin/gh` (a checksum-pinned release binary) and
# `npm-global/` (the `@openai/codex` global install). Both are pinned in
# `workers/worker.sh` and both are re-fetched from the network on every Job
# without somewhere to keep them.
#
# Why it is worth a volume rather than a fresh download each tick:
#
#   * **Size.** `@openai/codex` resolves to one platform package,
#     `@openai/codex-linux-x64`, which is 320 MB unpacked; `gh` adds an 11 MB
#     tarball. `governor/cronjob.yaml` ticks every five minutes, so an uncached
#     fleet pulls roughly a third of a gigabyte before each Job can spend a
#     single token of the owner's ChatGPT quota.
#   * **Reliability**, which matters more. `policy.json` sets
#     `maxConcurrent: 1`, so there is one Codex Job in flight at a time, and
#     `worker.sh` runs under `set -euo pipefail`. A registry blip during
#     `install_codex` therefore kills the whole tick — a governor slot spent on
#     a failed download, on a queue item that never ran. With a cache, the npm
#     registry and github.com are a dependency of the first Job after a version
#     bump instead of a dependency of every Job.
#
# A pin bump still invalidates this: `install_tools` checks a *cached* binary's
# reported version against the pin and reinstalls on a mismatch. Anything found
# on PATH from outside this volume is left alone, exactly as before the cache
# existed. See the `cached` helper in `workers/worker.sh` for why that
# asymmetry is deliberate — a cache that served a stale binary past a reviewed
# version bump would silently defeat the pins it caches.
#
# Losing this volume costs nothing but one slow Job: the fallback in
# `worker.sh` downloads into a throwaway directory and the run still completes.
# That is what makes it a cache rather than state, and why it is a separate
# claim from `codex-home` — that one holds the rotating credential and cannot
# be recreated by re-downloading anything.
#
# k3s's default local-path provisioner binds this to whichever node first
# consumes it. Every Codex Job carries the `hcloud/node-role: agents`
# nodeSelector and the `dedicated=agents` toleration, so that is always the
# cpx22 — the same node `codex-home` lands on.
#
# 2Gi against a ~332 MB working set: headroom for a version bump that leaves
# the old npm tree partly in place, and for npm's own cache metadata, on a box
# with 80 GB of disk. `agents/quota.yaml` sets no storage ceiling, so this
# competes with nothing.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-tools
  namespace: agents
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
