# Real, enabled queue item. Does not run until the governor's own kill
# switch (gitops/agents/governor/policy.json "enabled") is also true and
# the CronJob is unsuspended -- both still owner-only. See
# infra/OWNER_CHECKLIST.md.
#
# Lowest priority of the three real items on purpose: branch-pr-drain and
# seo-discoverability-audit land existing work and metadata first; this one
# is the next-in-line item once those are caught up or disabled, so it does
# not compete with either for the governor's single pick.
id: product-feature-improvement
repo: Duncan-Haywood/monorepo-projects
ref: main
workdir: ""
modelClass: chore
priority: 2
enabled: true
# This item's prompt opens its own PR and merges it, so worker.sh must not
# fold the tree into one commit and open a second one.
delivery: agent
prompt: |
  Read this repo's CLAUDE.md, AGENTS.md, and portfolio/DIRECTION.md first;
  follow them exactly.

  Pick ONE shipped venture under `ventures/` that already has a live user
  path (an index.html, a CLI, or an API) and make one real, valuable
  improvement to its product logic: fix a bug, complete a half-built
  workflow, handle a missing edge case, or add depth to its core feature.
  This is not metadata work (that is `seo-discoverability-audit`) and not
  a stale-branch rescue (that is `branch-pr-drain`) -- leave those to the
  items that own them. Check for an open PR touching that venture first
  and pick a different one if one already exists.

  Ship the smallest complete, mergeable slice: real product logic, not a
  placeholder or a document about the idea. Add or update the relevant
  tests and run them. Keep any existing liability disclaimer and usage
  tracking intact -- extend, don't remove.

  Verify locally per CLAUDE.md before opening a PR. A check that fails in
  3-6 seconds with no runner assigned is the known Actions outage
  (decision-queue item actions-runners-unavailable), not your regression.

  Open the PR, note what you verified, and merge it yourself once sound,
  per this repo's no-review-gate rule for product PRs. Do not start
  unrelated new work in this run.
