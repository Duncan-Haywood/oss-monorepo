# Real, enabled queue item. Does not run until the governor's own kill
# switch (gitops/agents/governor/policy.json "enabled") is also true and
# the CronJob is unsuspended -- both still owner-only. See
# infra/OWNER_CHECKLIST.md.
id: branch-pr-drain
repo: Duncan-Haywood/monorepo-projects
ref: main
workdir: ""
modelClass: chore
priority: 5
enabled: true
prompt: |
  Read this repo's CLAUDE.md and AGENTS.md first; follow them exactly.

  Pick ONE remote branch that has commits not reachable from `main` and
  is not already covered by an open pull request (`git branch -r`,
  compare with `git rev-list --count origin/main..origin/<branch>`,
  then check open PRs). Prefer a `ventures/*` product branch over a
  `session/*` or `tmp/*` one. Skip a branch you cannot tell is safe to
  land in one pass.

  For that branch: diff it against `main` to confirm the work is not
  already superseded (this repo has a documented history of wrongly
  closing PRs as "already on main" -- verify with an actual diff, never
  a guess). If it is genuinely new: open a pull request, merge `main`
  into the branch to resolve any conflicts (never rebase or force-push
  someone else's history), run the venture's own tests/build and record
  what you ran, confirm it has the required liability disclaimer and
  usage-tracking per PRODUCT_PLAYBOOK.md, and merge it yourself once
  sound -- this repo's rules say agents merge product PRs without a
  human review gate once checks are green or verified locally (GitHub
  Actions may still show red/absent from the known runner outage; that
  is not a reason to hold).

  Make the smallest correct change that lands that one branch. Do not
  start unrelated new work in this run.
