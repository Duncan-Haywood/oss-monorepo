# Real, enabled queue item. Does not run until the governor's own kill
# switch (gitops/agents/governor/policy.json "enabled") is also true and
# the CronJob is unsuspended -- both still owner-only. See
# infra/OWNER_CHECKLIST.md.
id: seo-discoverability-audit
repo: Duncan-Haywood/monorepo-projects
ref: main
workdir: ""
modelClass: chore
priority: 3
enabled: true
# This item's prompt opens its own PR and merges it, so worker.sh must not
# fold the tree into one commit and open a second one.
delivery: agent
prompt: |
  Read this repo's CLAUDE.md, AGENTS.md, and PRODUCT_PLAYBOOK.md
  section 5e (the SEO/AI-discovery checklist) first.

  Pick ONE shipped venture under `ventures/` whose `index.html` (or
  `site/index.html`) is missing one or more of: a `<title>` and meta
  description carrying the niche's actual search phrase, `schema.org`
  JSON-LD (`SoftwareApplication` / `HowTo` / `FAQPage` as fits the
  product), Open Graph tags, or a one-line repo-topic-style description
  a search result would show. Do not touch a venture whose slug matches
  one already being worked by another agent this run -- check for an
  open PR on that venture first and skip it if one exists.

  Measure before you pick. Two tools report the coverage backlogs, and
  each one names its own missing rows:

    node platform/pages/faq-coverage.mjs     # entry pages with no derived FAQPage schema
    node platform/pages/guide-coverage.mjs   # published tools with no secondary guide page

  Run both and take a named row if either has one. Do not assume which
  backlog is larger -- read the output. An earlier revision of this item
  hard-coded "the largest measured gap is FAQ content" and sent runs to
  `faq-coverage.mjs` as the default choice; both tools now report full
  coverage (169 of 169 on 2026-08-31), so that pointer aimed at an empty
  list. A run that follows a stale pointer either flounders or invents a
  gap to fill, and inventing one is the worse outcome.

  If a row exists, fix that one. For a missing FAQ, write a "Common
  questions" section of `<h3>`-and-`<p>` pairs answering what a real
  buyer in that niche would actually ask, with the answers derived from
  what that venture's own `calc.mjs` does -- the real starting rates,
  hours, and thresholds, quoted accurately. Do not hand-write a
  `FAQPage` JSON-LD block beside it: `build.mjs` derives the schema from
  the visible copy, and that is what keeps the two from drifting apart.

  If both tools report full coverage, the presence-or-absence phase is
  done and the remaining work is depth, not another surface. Pick one
  venture and make its existing copy answer more of what its buyer
  actually searches: a question its FAQ does not cover yet, a guide page
  that answers its title thinly, a title or meta description carrying a
  phrase nobody types. Depth means a question a real buyer has and this
  page does not answer -- not a longer version of an answer already
  there. If you cannot name that question, change nothing and let the
  run finish empty; the governor counts an empty run and moves the
  budget to an item that has work. Filler is worse than a clean no-op:
  a thin second answer competes with the tool's own page for the same
  query and dilutes it.

  Fix the gaps for that one venture: real search phrases a niche user
  would type, accurate JSON-LD, working Open Graph tags. Do not fabricate
  traction, testimonials, or benchmarks.

  Verify before opening the PR. **The maintained list is the block in
  CLAUDE.md under "Ship without review ceremony" -- read it there and run
  it**, rather than treating the line below as the whole set. This item
  edits what a page emits, so two of that block's lines apply directly and
  this prompt used to name neither:

    node platform/marketing/regen.mjs   # then commit whatever it rewrites
    node --test platform/marketing/*.test.mjs platform/pages/*.test.mjs

  Metadata work changes the mirrored copy of a page as well as the page,
  and `front-door-tools.test.mjs` is what catches a surface that landed
  without the generator being re-run. Run `python3 -m pytest gitops/tests
  -q` too whenever your commit ends up containing changes under `gitops/`,
  including ones `regen.mjs` made for you.

  Then the pages build itself:
  `node platform/pages/build.mjs --out=dist && node platform/pages/check.mjs dist`
  (dead links, stale origins). Record exactly what you ran and what it
  said. Open the PR, note what you verified, and merge it yourself once
  sound, per this repo's no-review-gate rule for product PRs.

  Make the smallest correct change for that one venture. Do not start
  unrelated new work in this run.
