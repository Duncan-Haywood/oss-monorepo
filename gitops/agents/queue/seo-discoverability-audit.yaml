# Real, enabled queue item. Does not run until the governor's own kill
# switch (gitops/agents/governor/policy.json "enabled") is also true and
# the CronJob is unsuspended -- both still owner-only. See
# infra/OWNER_CHECKLIST.md.
id: seo-discoverability-audit
repo: Duncan-Haywood/monorepo-projects
ref: main
workdir: ""
modelClass: chore
priority: 3
enabled: true
# This item's prompt opens its own PR and merges it, so worker.sh must not
# fold the tree into one commit and open a second one.
delivery: agent
prompt: |
  Read this repo's CLAUDE.md, AGENTS.md, and PRODUCT_PLAYBOOK.md
  section 5e (the SEO/AI-discovery checklist) first.

  Pick ONE shipped venture under `ventures/` whose `index.html` (or
  `site/index.html`) is missing one or more of: a `<title>` and meta
  description carrying the niche's actual search phrase, `schema.org`
  JSON-LD (`SoftwareApplication` / `HowTo` / `FAQPage` as fits the
  product), Open Graph tags, or a one-line repo-topic-style description
  a search result would show. Do not touch a venture whose slug matches
  one already being worked by another agent this run -- check for an
  open PR on that venture first and skip it if one exists.

  The largest measured gap is FAQ content, and there is a tool for it:
  `node platform/pages/faq-coverage.mjs` names every entry page with no
  question-shaped heading, so `build.mjs` derives no `FAQPage` schema for
  it. Picking one of those pages is usually the highest-value choice
  here. Write a "Common questions" section of `<h3>`-and-`<p>` pairs
  answering what a real buyer in that niche would actually ask, with the
  answers derived from what that venture's own `calc.mjs` does -- the
  real starting rates, hours, and thresholds, quoted accurately. Do not
  hand-write a `FAQPage` JSON-LD block beside it: `build.mjs` derives the
  schema from the visible copy, and that is what keeps the two from
  drifting apart.

  Fix the gaps for that one venture: real search phrases a niche user
  would type, accurate JSON-LD, working Open Graph tags. Do not fabricate
  traction, testimonials, or benchmarks. Verify the change with
  `node platform/pages/build.mjs --out=dist && node platform/pages/check.mjs dist`
  (dead links, stale origins) before opening the PR. Open the PR, note
  what you verified, and merge it yourself once sound, per this repo's
  no-review-gate rule for product PRs.

  Make the smallest correct change for that one venture. Do not start
  unrelated new work in this run.
