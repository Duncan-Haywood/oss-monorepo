# Real, enabled queue item. Does not run until the governor's own kill
# switch (gitops/agents/governor/policy.json "enabled") is also true and
# the CronJob is unsuspended -- both still owner-only. See
# infra/OWNER_CHECKLIST.md.
#
# Priority 6. **Changed 2026-09-01**, from 4, on the account owner's own
# direction: "I want to make sure deployment and cicd is a priority and
# building and deploying marketing materials on the hetzner vms". This item
# is the "building and deploying marketing materials" half of that sentence,
# so it now sits second, directly below deploy-cicd-readiness (7).
#
# It stays *below* deploy-cicd-readiness, but **the reason changed on
# 2026-09-06 and the old one is now false.** It used to be "a distribution
# asset for a site nobody can reach yet is worth less than the path that makes
# it reachable". The site is reachable: GitHub's managed builder ran the
# `gh-pages` branch and succeeded (`platform/ci/pages_state.py`, `deployed:
# served`), so every asset this item ships lands in front of strangers as soon
# as the snapshot is refreshed. The ranking survives on a different argument --
# the owner named deployment first in the same sentence, and a committed
# artifact does not rebuild itself, so keeping the delivery path correct still
# gates whether anything this item builds actually reaches anyone.
# It stays above seo-discoverability-audit (3), because that
# item now reports full coverage on both of its backlogs (169/169 FAQ,
# 169/169 guide pages on 2026-08-31) and has been reduced to depth work.
#
# What moved is what it overtook: the two backlog items (open-pr-repair-merge,
# branch-pr-drain) that used to hold the top two slots. See
# deploy-cicd-readiness.yaml's header for the full reasoning.
#
# All four candidates below had a baseline shipped by 2026-08-31 (embed
# widget #2561, several venture compare pages, the /c/ hub copy, and the
# /about/ press kit) -- this item too is now depth work, same as the SEO one,
# not "whole mechanisms missing" as an earlier revision of this comment said.
# Kept above seo-discoverability-audit anyway: a distribution gap (nobody
# finding a page at all) still costs more per run than a crawler-legibility
# gap on a page already found, once genuine gaps of each kind exist.
#
# Why this item exists separately from the SEO one: seo-discoverability-audit
# improves how a page reads to a crawler that has already found it. This item
# is about how anyone finds the site in the first place -- organic search
# rankings take months, while an embed or a comparison page can earn a link
# the week it ships.
id: marketing-distribution
repo: Duncan-Haywood/monorepo-projects
ref: main
workdir: ""
modelClass: deep
priority: 6
enabled: true
# This item's prompt opens its own PR and merges it, so worker.sh must not
# fold the tree into one commit and open a second one.
delivery: agent
prompt: |
  Read this repo's CLAUDE.md, AGENTS.md, PRODUCT_PLAYBOOK.md and
  `portfolio/DIRECTION.md` first, and re-read the "Getting it in front of
  people" section of the mandate above. Its two absolute limits govern this
  entire item: **every claim must be true**, and **you never publish
  outward**. Building the asset is yours; putting the portfolio's name on a
  public forum, directory, listing or social account is the owner's, and is
  already tracked in the decision queue. Do not open an account, submit the
  site anywhere, or draft a post for immediate publication as though it were
  going out.

  Ship ONE distribution asset that lives in this repository and deploys with
  the site. **It goes in front of strangers as soon as you refresh the
  snapshot, so build it against the origin that actually serves.**

  The two lines below used to read
  `PAGES_BASE_URL=https://tools.marisstella.dev/`, and that was the sharpest
  defect this item ever carried. That host has been refusing connections since
  2026-09-04 (`Outage triage` run 33889983086: `:443` refused on both boxes),
  while `build.mjs` bakes the base URL into every canonical tag, every
  `og:url` and every `<loc>` in the sitemap. A run following the old line
  built a correct asset, measured it against a dead origin, and would have
  published canonicals pointing at a host no crawler can fetch -- poisoning
  the indexing of the live site in the name of promoting it. Do not
  reintroduce a `PAGES_BASE_URL` override: `build.mjs`'s `DEFAULT_BASE_URL` is
  the live origin, and `publish-branch.sh` derives it from the branch's own
  CNAME. Overriding it is how the wrong origin gets baked in.

  Measure before you pick, the same discipline seo-discoverability-audit
  learned the hard way -- an earlier revision of that item hard-coded which
  backlog was largest and kept sending runs at an empty list. Build the site
  and look at what is actually there:

    node platform/pages/build.mjs --out=/tmp/pages-dist
    node platform/pages/check.mjs /tmp/pages-dist

  Candidates, best first. **All four below had a baseline already shipped as
  of 2026-08-31** -- confirm the gap is still real, and past that, look for
  the depth or coverage gap within the candidate rather than re-building the
  mechanism from scratch:

  **Re-verified 2026-09-02, all four, by a dedicated research pass -- none
  had a genuine shippable gap.** Read this before spending a run re-checking
  the same four:

  1. **An embeddable widget.** Done in #2561 (`platform/pages/embed.mjs`,
     `injectEmbedWidget`, `pf-embed.js`/`pf-embed.css` at the site root,
     17 passing tests in `embed.test.mjs`). Every entry page already carries
     a copyable `<iframe>` snippet in its footer chrome. **Do not re-pick
     this** unless you find entry pages it is silently skipping (check
     `result.embedded.length` against the entry-page count in a real
     `build.mjs` run) or a defect in the framing detection. **Checked
     2026-09-02: 169/169, none skipped** (`Added an embed offer to 169 tool
     entry page(s)` on a fresh build).
  2. **A comparison or "alternatives" page** for a tool whose niche has an
     obvious incumbent people search by name. High search intent, and the
     honest version is genuinely useful. Compare on facts you can verify from
     public documentation and cite them; if you cannot verify a competitor's
     number, leave the row out rather than estimating it. Never disparage.
     **This list undercounted badly and is corrected 2026-09-02: it is not
     6, it is 78 and climbing** (a snapshot -- re-run
     `find ventures -maxdepth 2 -iname "vs-*.html" -not -iname "*test*" | wc -l`
     rather than trusting this number for long). The convention is a
     `vs-<competitor>.html` page (not
     `compare.mjs`, which only a handful use), e.g.
     `cash-runway-planner/vs-quickbooks-cash-flow-planner.html`,
     `str-host-payout-calculator/vs-airbnb-earnings-estimator.html`,
     `amazon-fba-calculator/vs-amazon-revenue-calculator.html`. Every
     household-name incumbent a search turned up already has one --
     ServiceTitan/Jobber/JobNimbus/AcuLynx across ~15 trade-software
     ventures, QuickBooks x2, Airbnb, Amazon's own Revenue Calculator,
     Buildertrend, Bonsai, LevelSet, Baremetrics. The ~110 ventures still
     without one were checked individually: none has a household-name
     third-party competitor that is both distinct from the venture itself
     (`seller-net-sheet` computes a marketplace's *own* fee schedule, not a
     rival product) and verifiable without outbound web access, which this
     environment does not have. **Do not re-pick this** without a specific
     new incumbent name and a citable public source for its facts --
     "find a comparison gap" alone will not turn up work.
  3. **A category hub that reads as a landing page** rather than a list. The
     7 hubs under `/c/` (`CATEGORY_PAGE_COPY` in `build.mjs`) already each
     carry a `title`/`description`/`intro`/`audience` naming the problem and
     who it is for. Re-read all 7 against a fresh `check.mjs` run before
     calling any of them weak -- the copy is deliberately data, not prose, so
     a "gap" here is more likely a stale reading of this file than a real one.
     **Checked 2026-09-02: all 7 (including `more`, a genuine 4-tool
     catch-all with no shared theme) read as substantive, not stale.**
  4. **A press kit section on `/about/`** -- `renderAboutPage` in `build.mjs`
     already has the one-liner, the paragraph, the facts list, the licence
     and source link, and share-card meta tags (`og:image`, `SOCIAL_CARD_FILE`).
     A real remaining gap here is narrow (e.g. a claim that has drifted from
     what the build actually emits), not a missing section. **Checked
     2026-09-02: its numeric claims are computed live from `surfaces`/
     `groups`, not hardcoded, so nothing has drifted.**

  Whatever you pick, it has to be finished, not scaffolded: real content or
  real behaviour, the liability disclaimer every user-facing surface here
  carries, usage tracking consistent with `portfolio/usage/`, tests for the
  parts whose failure would matter, and no new third-party script, font, CDN
  or network call -- `/about/` promises there are none and that promise is
  load-bearing.

  Verify before you open anything. **The maintained list is the block in
  CLAUDE.md under "Ship without review ceremony" -- read it there and run
  it.** The lines below are this item's additions to that list, not a
  replacement for it; an earlier revision of this prompt restated a subset
  inline and it went stale, which is the restate-instead-of-import defect
  CLAUDE.md records twice against the front-door mirror.

  Two things this prompt used to omit, both of which bite a run that ships
  a page:

    node platform/marketing/regen.mjs   # then commit whatever it rewrites
    node --test platform/marketing/*.test.mjs platform/pages/*.test.mjs

  `front-door-tools.test.mjs` is the guard that fails with a page `missing
  from the commit` -- the venture page lands, `regen.mjs` never runs, and
  the apex 404s on a page its own sitemap advertises. CLAUDE.md records
  that exact defect costing live product twice (#3256-#3258, and again
  across #3324-#3326). A distribution asset is precisely the shape that
  trips it, so run the generator first and commit what it rewrites.

  And run `python3 -m pytest gitops/tests -q` **whenever your commit
  contains changes under `gitops/`, including ones `regen.mjs` made for
  you** -- not only when you edited that tree on purpose. That condition
  was widened in CLAUDE.md on 2026-09-05 because "only if you touched
  `gitops/`" reads as "only if you meant to": giving a venture a browser
  surface touches nothing there by hand, yet the generator rewrites
  several hundred files and `test_manifests.py` carries a mirrored-tool
  count typed out in four places. #3407 merged red on exactly that.

  Add the venture's own `node --test` if it has one, plus a full
  `build.mjs` and `check.mjs` run (dead links, stale origins, MIME
  coverage). Record exactly what you ran and what it said. A check that
  fails in 3-6 seconds with `runner_id: 0` is the known Actions outage,
  not your regression -- confirm with
  `python3 platform/ci/ci_starvation.py --run <id>`.

  Before starting, check open PRs and recent commits for work on the same
  asset and extend it instead of duplicating it; if an open PR already does
  this, repair and merge that one and let this run end there. Open the PR,
  note what you verified, and merge it yourself once sound, per this repo's
  no-review-gate rule for product PRs.

  **Then deploy it, in the same run.** The owner's sentence that promoted this
  item says "building *and deploying* marketing materials", and on this route
  those are two separate acts: GitHub Pages serves the `gh-pages` branch,
  which is a committed artifact, so nothing rebuilds it when `main` moves. An
  asset merged and not published is an asset no stranger will ever see, and
  the gap is invisible -- there is no error anywhere to say the live site is
  behind. After your merge lands:

    python3 platform/ci/pages_state.py --require-current   # exits 1 if stale
    CONFIRM=publish-pages-branch PUSH=1 ./platform/pages/publish-branch.sh
    python3 platform/ci/pages_state.py --require-current   # must exit 0 now

  That script rebuilds from `main`'s tip, runs `check.mjs` against the
  artifact before it pushes anything, and refuses to publish a broken one. It
  needs no runner, no cluster and no credential beyond the push you already
  have -- which is why it is your job and not the owner's. Re-run
  `pages_state.py` afterwards and record that it reports `current`.

  Make the smallest correct change that ships one working asset. Do not start
  unrelated new work in this run, and do not produce a marketing plan,
  campaign document, or candidate list -- an asset that deploys, or nothing.
