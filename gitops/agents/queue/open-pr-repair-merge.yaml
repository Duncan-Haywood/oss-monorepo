# Real, enabled queue item. Does not run until the governor's own kill
# switch (gitops/agents/governor/policy.json "enabled") is also true and
# the CronJob is unsuspended -- both still owner-only. See
# infra/OWNER_CHECKLIST.md.
#
# Priority 5. **Changed 2026-09-01**, from 7 (where this comment called it
# "the highest of the real items"), on the account owner's direction that
# deployment/CI-CD and marketing come first -- see
# deploy-cicd-readiness.yaml's header.
#
# Demoted, deliberately not disabled. Everything this comment says below is
# still true and still the reason this item exists; the weights are
# (priority + 1), so at 5 it still takes 6/33 of the queue -- roughly one
# run in five -- which is enough to keep the drain real. Two things make
# that safe rather than a regression: the four items above and below it all
# open *and merge* their own PRs (`delivery: agent`), so the ordinary case
# needs no separate drain at all, and this item is the safety net for the
# exception -- a run whose verification did not come out clean and which
# therefore left its PR open. A safety net does not need the top slot; it
# needs to fire reliably, which at 6/33 it does.
#
# It is also the item with the least to do right now: the repo has zero
# open PRs as of 2026-09-01. Do not read that as permanent -- it is exactly
# the transient state the `noops` damping exists to track, and this item
# should climb back if the backlog returns and the owner's direction
# changes. It closes a hole the other items leave open:
# every one of them *ends* by opening a pull request,
# and three of them actively steer around PRs that already exist --
# `branch-pr-drain` picks only branches "not already covered by an open
# pull request", and `product-feature-improvement` and
# `seo-discoverability-audit` each skip a venture that already has one.
# Nothing reviewed, repaired, or merged an open PR. A fleet that only ever
# opens PRs has no drain: the first run whose verification does not come out
# clean leaves a PR nobody returns to, and the backlog grows by exactly one
# per tick from then on.
#
# This is the "finish what is already started before starting more" rule
# applied to the queue itself, and it is why this item outranks even
# branch-pr-drain: a branch with an open PR is further along than a branch
# without one, so it is the cheaper thing to finish.
id: open-pr-repair-merge
repo: Duncan-Haywood/monorepo-projects
ref: main
workdir: ""
modelClass: deep
priority: 5
enabled: true
# This item's prompt opens, repairs and merges pull requests directly, so
# worker.sh must not fold the tree into one commit and open a second one.
delivery: agent
prompt: |
  Read this repo's CLAUDE.md and AGENTS.md first; follow them exactly.
  Pay particular attention to CLAUDE.md's "Duplicate PRs" section -- it is
  a record of specific closes that destroyed finished work, and the rules
  in it are not optional.

  Your job this run is to take existing open pull requests from wherever
  they are to merged. Not to review them, not to comment on them, not to
  triage the queue: to finish them.

  List the open PRs. If there are none, stop and say so -- do not invent
  work, and do not fall through to opening a new PR of your own. That is
  what the other queue items are for.

  Otherwise merge as many as you can, to a minimum of three:

  - Three or more open PRs: merge at least three before you stop, and keep
    going past three while repairable ones remain.
  - Fewer than three: process all of them.
  - Only merges count. A review, a comment, a draft conversion, or a PR
    "left for the author" does not.
  - A PR whose only blocker is an owner action you cannot take (a sealed
    secret, a repository variable, an account) does not count toward the
    three. Say which PR and which action, then pick another.

  Take them in order: a PR that is closest to mergeable, then one carrying
  real user-facing product value, then the one open longest.

  Then carry each one:

  1. Read the whole diff for correctness, user value, security, privacy,
     and whether it keeps the liability disclaimer and usage tracking
     every user-facing surface here carries.
  2. Fix what is wrong yourself, on the PR's branch. Do not leave a
     repairable defect as a comment for its author. `git fetch
     --unshallow` first -- the clone is shallow and without it `git merge`
     refuses with "unrelated histories" and a diff against `main` reports
     thousands of files. That is the clone, not the branch.
  3. Resolve conflicts by merging `main` into the branch. Never rebase,
     amend, or force-push a branch you did not create -- a merge commit
     keeps the author's checkout valid. A conflict means the work is still
     wanted where someone else is editing; it is never a reason to close.
  4. Run the venture's own tests and whatever else CLAUDE.md says applies,
     and record exactly what you ran and what it said.
  5. Merge it, per this repo's rule that agents merge product PRs with no
     human review gate.

  Reading CI here needs care and the repo documents why:

  - A check that fails in 3-6 seconds with `runner_id: 0` and no steps is
    the known Actions starvation, not a regression in the PR. Confirm with
    `python3 platform/ci/ci_starvation.py --run <run_id>`; exit 1 means no
    runner was ever assigned.
  - No checks at all is not failed checks either -- but do not *expect* a
    blank list. An agent PR here authenticates with a fine-grained PAT
    (`GH_TOKEN`), not the in-workflow `secrets.GITHUB_TOKEN` that GitHub's
    no-recursion rule applies to, so it triggers `pull_request` workflows
    exactly as a human's PR does. Measured twice: #2856 created 13 check
    runs, and #3033 created 9, all on real runners. So a blank check list
    is a thing to go and verify, never the state to assume; when it really
    is blank, verify locally and record what you ran.
  - Use the check-runs endpoint, not `/commits/<sha>/status`. The commit
    status API reports `total_count: 0` on a PR that has red check runs,
    and absent CI and red CI call for different handling.

  Either way, verify locally and say what you ran.

  Closing without merging is an exceptional outcome, not a tidy one. Age,
  inactivity, red or absent CI, conflicts, and rough initial quality are
  repair tasks. Before any close as "already on main" you must run
  `python3 portfolio/ledger/supersede_check.py <pr-number>` and get exit 0;
  exit 1 prints the lines the close would destroy. A RENAME SUSPECTED
  section is evidence to read, not a verdict -- the one word that differs
  between two 93%-alike lines can be the fix the branch exists to make. If
  you close in favour of another PR, confirm that PR is still open
  immediately before closing and again after: two sessions have each
  closed their PR pointing at the other's, and nothing shipped.

  Do not start unrelated new work in this run. Merged PRs, not triage.
