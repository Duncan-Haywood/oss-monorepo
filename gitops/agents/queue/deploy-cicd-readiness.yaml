# Real, enabled queue item. Does not run until the governor's own kill
# switch (gitops/agents/governor/policy.json "enabled") is also true and
# the CronJob is unsuspended -- both still owner-only. See
# infra/OWNER_CHECKLIST.md.
#
# Priority 7, the highest of the real items. **Changed 2026-09-01**, from 5,
# on the account owner's own direction: "I want to make sure deployment and
# cicd is a priority and building and deploying marketing materials on the
# hetzner vms". That is a statement about what the fleet is *for*, so it
# outranks the ordering argument this comment used to carry (below
# open-pr-repair-merge and branch-pr-drain, "because landing work that
# already exists still comes first").
#
# That older argument was not wrong when it was written -- it was written
# while the PR/branch backlog was the bottleneck. It is not the bottleneck
# now: the repo has zero open PRs (verified twice on 2026-09-01), so the
# two items that outranked this one were between them holding 13/25ths of
# the weight over provably empty work. The `noops` damping in pick_item
# corrects that, but only *after* spending the runs that discover it, and
# the first window after an owner flips the governor on is the most
# valuable quota this fleet will ever spend.
#
# The portfolio has 169 finished tools and no public URL, so the delivery
# path is worth more per run than anything else here -- but only the parts
# an agent can actually finish. The credential steps are owner-only and
# already queued; this item exists to keep the code half complete and
# correct so that nothing but the flip is missing when it comes.
id: deploy-cicd-readiness
repo: Duncan-Haywood/monorepo-projects
ref: main
workdir: ""
modelClass: deep
priority: 7
enabled: true
# This item's prompt opens its own PR and merges it, so worker.sh must not
# fold the tree into one commit and open a second one.
delivery: agent
prompt: |
  Read this repo's CLAUDE.md, AGENTS.md, `gitops/README.md`,
  `gitops/ci/README.md` and `portfolio/hosting/README.md` first. Delivery
  here is GitOps: Argo CD syncs `gitops/` from `main`, so a correct
  manifest merged to `main` is the deploy. You have no cluster access and
  must not attempt any.

  **Read that last paragraph as conditional, not as today's state.** As of
  2026-09-06 the cluster is down (`:6443` refused on both boxes), so a
  manifest merged to `main` syncs nothing and "the deploy" deploys
  nothing. A run that treats it as current spends itself on an inert path.
  Re-measure before believing either way --
  `portfolio/ledger/infra_state.yaml` carries the dated readings and the
  command behind each, and a reading past its staleness window is
  *unknown*, never "up".

  What is *not* downstream of the cluster is host mode: the same work
  installed onto a box's own systemd, which is where this repository's
  execution capacity actually lives right now. There are three, and they
  are siblings by design -- read the one nearest your change before
  starting, because between them they already cover most of what "fix the
  delivery path" used to mean here:

  - `gitops/agents/host/` -- the Codex worker (this fleet's own scheduler)
  - `gitops/ci/host/`     -- a self-hosted GitHub Actions runner
  - `gitops/prod/host/`   -- **serving the catalogue itself**: nginx plus a
    ten-minute pull-and-rebuild timer, fail-closed on `check.mjs`, so a
    merge to `main` is the deploy again with neither a runner nor the
    cluster in the path

  Do not rebuild any of those. If you extend one, extend it where it is;
  if you find a defect in one, that is an excellent pick for this item.
  All three are blocked on the same single owner action and no other --
  `HETZNERSSHKEY` holds a public key, so nothing installs until it is
  rotated. Do not add a second ask for it, and do not treat it as a reason
  to skip work: the code half being complete is what makes that one
  rotation buy a served catalogue instead of only a diagnosis.

  Pick ONE concrete, finishable defect or gap in the delivery path and fix
  it. Candidates, best first:

  1. A manifest under `gitops/` that is wrong, stale, or would not apply
     cleanly -- an image tag, a probe, a resource limit, an RBAC rule
     broader than the thing it guards, a Role that names a resource that
     no longer exists.
  2. A workflow under `.github/workflows/` that is broken for a reason
     other than the runner outage: a step that cannot work on a
     self-hosted runner, a dead action version, a check that passes
     without testing anything.
  3. A gap between what `gitops/tests/` asserts and what the manifests
     actually say, in either direction.
  4. A documented ordinary-code-change follow-up that is being waited on
     unnecessarily -- a step some doc calls "last" whose stated
     precondition has since been met, so the wait is now the only thing
     holding it.

     The worked example used to be this item's own suggestion: flip the
     portfolio-site Ingress from `letsencrypt-staging` to
     `letsencrypt-prod`. **That is done (#2545, 2026-08-31) -- do not pick
     it again.** It is kept here because how it resolved is the shape to
     look for. The doc gated it on "once a staging certificate has
     actually issued", and no session could observe the cluster to confirm
     that, so it sat. What moved it was noticing the gate had the cost
     backwards: staging is not a trusted root, so the one owner action
     left would have published all 508 pages behind a browser
     interstitial, and cert-manager leaves an existing Secret's contents
     alone until a new certificate is ready, making the flip
     non-worsening even if issuance failed.

     So: do not make a flip on a guess, but do check whether "we cannot
     confirm X" is actually load-bearing, or whether waiting costs more
     than acting and acting is reversible. Say which of the two you
     established, in the PR.

  **Re-verified 2026-09-02** by a dedicated research pass across all four
  candidate categories (RBAC, NetworkPolicies, image tags, kustomizations,
  workflow triggers/needs/if-conditions, gitops/tests-vs-manifest drift,
  "waiting on X" follow-ups): none turned up a genuine untracked defect.
  `pytest gitops/tests -q` was 267 passed / 7 skipped (all skips
  environment-only), `check_duplicate_symbols.py` and
  `publish_surface.py --check` were both clean. The one real finding was
  cosmetic prose drift (comments in `portfolio-front.yaml` and
  `front-door.mjs` still said "156 tools" where the mirror is 159) -- fixed
  the same day, not a delivery-path defect. Do not re-run this exact
  exhaustive sweep on a routine tick; look for something that changed since
  2026-09-02 instead.

  Hard limits. Never seal, invent, echo, or work around a secret, and
  never relax a manifest's fail-closed state to make something start:
  crash-looping on an absent Secret is the intended behaviour until an
  owner seals it. Do not enable the governor, unsuspend its CronJob, or
  set `CI_RUNNER` -- those are owner flips with real spend behind them.
  Do not add a new host, cloud, or vendor. Do not bind an Ingress to
  `marisstella.dev` itself.

  If the gap you find is genuinely owner-only, do not add a decision-queue
  row for it: run `python3 portfolio/ledger/decision_queue.py` first and
  confirm it is almost certainly already there. Pick a different gap
  instead.

  Verify before you open anything. **The maintained list is the block in
  CLAUDE.md under "Ship without review ceremony" -- read it there and run
  it, rather than treating the lines below as the whole set.** This item
  used to restate a two-command subset here, which is the same
  restate-instead-of-import defect CLAUDE.md records twice against the
  front-door mirror: a frozen copy cannot learn, and on 2026-09-05 that
  list gained `platform/ci/`, `platform/proposal/`, `platform/privacy/`
  and `platform/webcheck/` while this prompt went on naming two commands.

  Two of those matter specifically to *this* item, because they guard the
  code it is most likely to touch:

    python3 -m pytest gitops/tests -q
    (cd platform/ci && for m in test_*.py; do python3 -m unittest "${m%.py}" || break; done)

  The second is the one this prompt was missing outright, and candidate 2
  above sends every run straight at it: `platform/ci/` holds the 15
  `unittest` modules guarding `ci_starvation.py`, `pages_state.py`,
  `publish_surface.py`, `public_surface.py` and `validate_workflows.py` --
  the tools this repo uses to decide whether a red check is real and
  whether a route to a user exists. A run that edits one of those and
  follows the old two-line list executed no guard on the thing it just
  changed. Note the `cd`: those modules import each other by bare name, so
  `pytest platform/ci` from the repo root fails collection.

  Add `kubeconform` or `kustomize build` on any manifest you touched.
  Record exactly what you ran and what it said. A check that fails in 3-6
  seconds with `runner_id: 0` is the known Actions outage, not your
  regression -- confirm with
  `python3 platform/ci/ci_starvation.py --run <id>`. While runners are
  starved, CI running these suites is the same as nothing running them,
  which is why the local run is the real gate rather than a formality.

  Open the PR, note what you verified, and merge it yourself once sound,
  per this repo's no-review-gate rule. Make the smallest correct change.
  Do not start unrelated new work in this run.
