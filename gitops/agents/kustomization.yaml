apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agents
resources:
  - rbac.yaml
  - networkpolicy.yaml
  - quota.yaml
  - codex-home.yaml
  - governor/rbac.yaml
  - governor/cronjob.yaml
  - governor/state.yaml
configMapGenerator:
  - name: governor-policy
    files:
      - policy.json=governor/policy.json
  - name: governor-script
    files:
      - governor.py=governor/governor.py
  - name: codex-worker-script
    files:
      - worker.sh=workers/worker.sh
      - mandate.md=workers/mandate.md
  - name: governor-queue
    files:
      - example.item.yaml=queue/example.item.yaml
      - open-pr-repair-merge.yaml=queue/open-pr-repair-merge.yaml
      - branch-pr-drain.yaml=queue/branch-pr-drain.yaml
      - deploy-cicd-readiness.yaml=queue/deploy-cicd-readiness.yaml
      - seo-discoverability-audit.yaml=queue/seo-discoverability-audit.yaml
      - product-feature-improvement.yaml=queue/product-feature-improvement.yaml
generatorOptions:
  disableNameSuffixHash: true
