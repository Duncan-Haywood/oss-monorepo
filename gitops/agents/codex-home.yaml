# The Codex CLI's own home, kept between Jobs.
#
# Only one thing lives here: `home/auth.json`, the subscription credential.
# Codex rotates it on use, so a Job that started from the sealed Secret every
# time would present an already-spent refresh token and fail to authenticate
# from the second run onward. Persisting the file is what lets the plan quota
# actually be drawn down across a week of ticks.
#
# k3s's default local-path provisioner binds this to whichever node first
# consumes it. Every Codex Job carries the `hcloud/node-role: agents`
# nodeSelector and the `dedicated=agents` toleration, so that is always the
# cpx22 — the volume cannot drift to the control-plane box.
#
# 128Mi because the content is one small JSON file; the floor exists so a
# runaway write cannot fill the agent node's disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-home
  namespace: agents
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
