# Sized for the cpx22 (2 vCPU / 4 GB). One Codex Job plus pause leftover.
#
# `count/jobs.batch` and `pods` are OBJECT-COUNT quotas, not resource quotas --
# a finished Job's Pod costs no CPU or memory once its container has exited, so
# these two lines cost the cpx22 nothing extra. `requests.*` and `limits.*`
# above are the actual node-capacity guard and are unaffected by either number.
#
# They used to be "4" and "6", sized only against "one Codex Job plus pause
# leftover" -- i.e. against what can be *running* at once, which is a separate
# question from how many *finished* Job/Pod objects the namespace is allowed
# to still be holding. It was too small for that second question by itself,
# with zero Codex work ever needing to run:
#
#   governor/cronjob.yaml creates a Job every tick (`schedule: "*/5 * * * *"`)
#   and keeps `successfulJobsHistoryLimit: 6` + `failedJobsHistoryLimit: 6` of
#   them around -- 12 finished Jobs (and their Pods) as ordinary, expected
#   steady state, plus whichever one is currently running. That floor of 13
#   already exceeds the old "4"/"6", so within roughly 20-60 minutes of the
#   owner flipping `suspend: false`, the API server starts rejecting the
#   CronJob's own routine ticks with "exceeded quota: count/jobs.batch" --
#   `governor.py` never even gets to look at the queue.
#
# `governor.py`'s `build_job_manifest` adds a second, workload-dependent
# source on top: each Codex worker Job it creates directly (not through a
# CronJob, so no history-limit GC of its own) carries
# `ttlSecondsAfterFinished: 86400` -- a day. `policy.json`'s
# `targetUtilization: 0.9` against `windowSeconds: 18000` budgets up to ~4.5
# hours of measured job runtime per 5-hour window, so a fully-utilized queue
# can complete well into the double digits of worker Jobs a day, all sitting
# in the namespace for a full day before their TTL clears them.
#
# 40 covers the deterministic 13-Job governor floor with real margin and gives
# genuine room for a day's worth of worker-Job history on top, at no resource
# cost either way. It is an estimate against the policy's stated pacing, not a
# measurement from a live cluster (nothing here has one) -- if real usage ever
# needs more, raising these two costs nothing but the number itself.
# `gitops/tests/test_manifests.py::test_agents_job_count_quota_covers_governor_history_retention`
# pins the deterministic half so the governor's own bookkeeping can never
# silently exceed this again.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agents
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "2"
    limits.memory: 3500Mi
    count/jobs.batch: "40"
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agents
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 1Gi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "2"
        memory: 3Gi
