# Sized for the cpx22 (2 vCPU / 4 GB). One Codex Job plus pause leftover.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agents
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "2"
    limits.memory: 3500Mi
    count/jobs.batch: "4"
    pods: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agents
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 1Gi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "2"
        memory: 3Gi
