# Template only — not applied. Replace CHANGE_ME and seal.
#
# Seal ONE of the two credentials, plus GH_TOKEN. Both work; they spend
# different budgets, and the choice is the owner's:
#
#   OPENAI_API_KEY   metered project key on a separate OpenAI org with a
#                    dashboard hard spend limit — the path
#                    infra/OWNER_CHECKLIST.md walks through. Costs money,
#                    with a ceiling.
#   CODEX_AUTH_JSON  the whole contents of ~/.codex/auth.json after a
#                    `codex login`. One line of JSON; paste it as-is. Draws on
#                    a ChatGPT plan's included usage, so a tick costs nothing
#                    extra — but a plan has no euro hard stop and shares its
#                    5-hour/weekly quota with whoever is logged in, so use a
#                    seat that is not the owner's day-to-day login.
#
# Seal both and the subscription wins (it is the one that does not bill). The
# worker logs which mode it used on every run.
apiVersion: v1
kind: Secret
metadata:
  name: codex-secrets
  namespace: agents
type: Opaque
stringData:
  OPENAI_API_KEY: CHANGE_ME
  GH_TOKEN: CHANGE_ME
  # CODEX_AUTH_JSON: CHANGE_ME
