# Suspended until an owner flips this in git *and* seals Codex + GitHub
# secrets. Unattended spend of the personal Codex quota is owner-only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: governor
  labels:
    app.kubernetes.io/name: governor
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: governor
        spec:
          serviceAccountName: governor
          restartPolicy: Never
          nodeSelector:
            hcloud/node-role: control-plane
          containers:
            - name: governor
              image: python:3.12-slim-bookworm
              command: ["python3", "/opt/governor/governor.py"]
              env:
                - name: GOVERNOR_POLICY
                  value: /etc/governor/policy.json
                - name: GOVERNOR_QUEUE
                  value: /etc/governor/queue
                - name: GOVERNOR_NAMESPACE
                  value: agents
                - name: GOVERNOR_STATE_CONFIGMAP
                  value: governor-state
              volumeMounts:
                - name: script
                  mountPath: /opt/governor
                  readOnly: true
                - name: policy
                  mountPath: /etc/governor
                  readOnly: true
                - name: queue
                  mountPath: /etc/governor/queue
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: governor-script
                defaultMode: 0555
            - name: policy
              configMap:
                name: governor-policy
            - name: queue
              configMap:
                name: governor-queue
