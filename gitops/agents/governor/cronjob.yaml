# Suspended until an owner flips this in git *and* seals Codex + GitHub
# secrets. Unattended spend of the personal Codex quota is owner-only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: governor
  labels:
    app.kubernetes.io/name: governor
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: governor
        spec:
          serviceAccountName: governor
          restartPolicy: Never
          nodeSelector:
            hcloud/node-role: control-plane
          # Every other workload in this repo (portfolio-site, its refresh and
          # usage CronJobs, the CI runner) runs allowPrivilegeEscalation: false,
          # capabilities.drop: [ALL] and readOnlyRootFilesystem: true. governor
          # was the one exception, despite being the single workload in `agents`
          # that actually holds a live ServiceAccount token with RBAC to create
          # Jobs and patch a ConfigMap -- the workload most worth narrowing.
          # runAsUser 65532 on this exact python:3.12-slim-bookworm image is
          # already proven by prod/site-usage.yaml's aggregate CronJob.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: governor
              image: python:3.12-slim-bookworm
              command: ["python3", "/opt/governor/governor.py"]
              env:
                - name: GOVERNOR_POLICY
                  value: /etc/governor/policy.json
                - name: GOVERNOR_QUEUE
                  value: /etc/governor/queue
                - name: GOVERNOR_NAMESPACE
                  value: agents
                - name: GOVERNOR_STATE_CONFIGMAP
                  value: governor-state
              volumeMounts:
                - name: script
                  mountPath: /opt/governor
                  readOnly: true
                - name: policy
                  mountPath: /etc/governor
                  readOnly: true
                - name: queue
                  mountPath: /etc/governor/queue
                  readOnly: true
                # governor.py's _save_state() always writes a local copy to
                # GOVERNOR_STATE (default /var/run/governor/state.json) before
                # it ever touches the ConfigMap -- the in-cluster fallback
                # _load_state() reads back if the ConfigMap GET fails. That
                # write is unconditional, so readOnlyRootFilesystem below needs
                # this path to still be writable, the same way the refresh and
                # usage CronJobs mount a writable emptyDir under a read-only
                # root.
                - name: state-tmp
                  mountPath: /var/run/governor
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: governor-script
                defaultMode: 0555
            - name: policy
              configMap:
                name: governor-policy
            - name: queue
              configMap:
                name: governor-queue
            - name: state-tmp
              emptyDir:
                sizeLimit: 16Mi
