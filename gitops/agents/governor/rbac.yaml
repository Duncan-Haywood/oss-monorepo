apiVersion: v1
kind: ServiceAccount
metadata:
  name: governor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: governor
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["governor-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: governor
subjects:
  - kind: ServiceAccount
    name: governor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: governor
