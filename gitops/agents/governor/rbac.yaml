apiVersion: v1
kind: ServiceAccount
metadata:
  name: governor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: governor
rules:
  # `_load_cluster_jobs` issues exactly one call against this resource: a GET
  # on the collection endpoint (`/apis/batch/v1/namespaces/{ns}/jobs?labelSelector=...`),
  # which RBAC authorizes via `list`, not `get` -- `get` only covers a GET on
  # a *named* Job (`.../jobs/<name>`), and nothing in this file ever builds
  # that URL. `build_job_manifest`'s own POST is the other call, needing
  # `create`. Nothing here ever opens a watch: `_k8s` is a single
  # `urllib.request` round trip with a 30s timeout, not a long-lived stream,
  # so `watch` -- which would let this ServiceAccount hold open a live feed
  # of every Job's status in the namespace -- was pure unused reach, the
  # same class of gap the ConfigMap rule below was already cut down for.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "create"]
  # The only ConfigMap the governor ever touches is governor-state. Normal
  # ticks GET then PUT/PATCH it by name -- `governor/state.yaml` seeds it in
  # git, mirroring `portfolio-site-usage`, precisely so that path is the
  # common case. There used to be a second, namespace-wide `configmaps` rule
  # here (verbs get/list/create, no resourceNames) that granted read access
  # to every ConfigMap in `agents` -- governor-policy, governor-script,
  # governor-queue, codex-worker-script -- none of which governor.py ever
  # requests over the API (it reads them from mounted volumes instead), plus
  # a `list` verb `_load_state`/`_save_state` never call. That rule was cut
  # down to bare `create`, below, rather than removed outright: if the
  # ConfigMap is ever missing (pruned, first deploy, corruption),
  # `_save_state` falls back to POSTing the collection endpoint, and losing
  # that verb would turn a 404-then-fixed create path into a silent-ish 403
  # instead -- the very first budget window would go unpersisted. `create`
  # cannot be scoped with resourceNames (the object doesn't exist yet to
  # name), but it's still safe unnamed: create only returns the object it
  # made, never one it didn't, so it leaks nothing about sibling ConfigMaps
  # the way an unnamed get/list would.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["governor-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # `_load_cluster_jobs` also GETs the pod collection, unfiltered, to match
  # each Job's pod by its `job-name` label -- again a `list` call, never a
  # GET on a named pod (`.../pods/<name>`), so `get` guarded nothing here
  # either.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: governor
subjects:
  - kind: ServiceAccount
    name: governor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: governor
