apiVersion: v1
kind: ServiceAccount
metadata:
  name: governor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: governor
rules:
  # `_load_cluster_jobs` makes exactly one call against this resource: a GET
  # on the collection endpoint with a labelSelector query string, which is
  # the `list` verb, not `get` -- `get` authorizes GET on a *named* object
  # (`/jobs/{name}`), and governor.py never builds that URL. `watch` was
  # never used either: every tick is a one-shot poll, not a long-lived watch
  # stream, and grep across this file confirms no caller ever asks for one.
  # Both sat here ungranted-against by any code path, on the same
  # ServiceAccount CLAUDE.md's own history flags as "the workload most worth
  # narrowing" -- the one holding a live token with RBAC to create Jobs and
  # patch a ConfigMap. `create` is the only verb besides `list` this rule's
  # own code (`main()`'s POST to this same endpoint) actually calls.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "create"]
  # The only ConfigMap the governor ever touches is governor-state. Normal
  # ticks GET then PUT/PATCH it by name -- `governor/state.yaml` seeds it in
  # git, mirroring `portfolio-site-usage`, precisely so that path is the
  # common case. There used to be a second, namespace-wide `configmaps` rule
  # here (verbs get/list/create, no resourceNames) that granted read access
  # to every ConfigMap in `agents` -- governor-policy, governor-script,
  # governor-queue, codex-worker-script -- none of which governor.py ever
  # requests over the API (it reads them from mounted volumes instead), plus
  # a `list` verb `_load_state`/`_save_state` never call. That rule was cut
  # down to bare `create`, below, rather than removed outright: if the
  # ConfigMap is ever missing (pruned, first deploy, corruption),
  # `_save_state` falls back to POSTing the collection endpoint, and losing
  # that verb would turn a 404-then-fixed create path into a silent-ish 403
  # instead -- the very first budget window would go unpersisted. `create`
  # cannot be scoped with resourceNames (the object doesn't exist yet to
  # name), but it's still safe unnamed: create only returns the object it
  # made, never one it didn't, so it leaks nothing about sibling ConfigMaps
  # the way an unnamed get/list would.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["governor-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # `_load_cluster_jobs` calls this resource once too, the same way: a bare
  # GET on `/pods` with no name in the path, which is `list`. Nothing here
  # ever fetches one pod by name, so `get` authorized a call this Role's own
  # ServiceAccount never makes.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: governor
subjects:
  - kind: ServiceAccount
    name: governor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: governor
