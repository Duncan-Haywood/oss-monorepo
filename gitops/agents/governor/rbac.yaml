apiVersion: v1
kind: ServiceAccount
metadata:
  name: governor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: governor
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["governor-state"]
    verbs: ["get", "update", "patch"]
  # "create" cannot be scoped by resourceNames (the object doesn't exist yet
  # to name) and is only needed once, the very first tick before
  # governor-state exists. governor.py never lists or gets any configmap by
  # name other than governor-state -- the rule above already covers that --
  # so "get"/"list" here would only ever grant read access to configmaps the
  # governor has no code path that reads.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: governor
subjects:
  - kind: ServiceAccount
    name: governor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: governor
