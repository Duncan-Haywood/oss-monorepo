# Live budget counters. Argo must not reset /data on sync — see
# ignoreDifferences on the agents Application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: governor-state
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: RespectIgnoreDifferences=true
data:
  state.json: "{}"
