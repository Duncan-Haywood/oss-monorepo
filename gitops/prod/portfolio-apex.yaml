# The portfolio's front door: `marisstella.dev` and `www.marisstella.dev`.
#
# WHY THIS EXISTS
#
# Issue #1925, filed by the owner on 2026-08-28: "https://marisstella.dev/
# does not resolve. no clear unified presence for the portfolio." Three
# status comments on that issue have answered the *deploy* half of it — the
# site is built, it is one sealed clone token from serving — and none of them
# answered the half the title actually asks about. `portfolio-site.yaml`
# claims `tools.marisstella.dev` and nothing else, so even after that token
# is sealed, someone who types the portfolio's domain still gets nothing.
# This is the manifest that makes the domain itself land somewhere.
#
# WHY IT NO LONGER REDIRECTS (changed 2026-09-02)
#
# It was a 301 to `https://tools.marisstella.dev/` from 2026-08-28 until now,
# and the argument for that was sound as far as it went: `build.mjs` stamps
# `PAGES_BASE_URL` into the canonical link, the og:url and every sitemap entry
# of all 544 pages, `portfolio-site.yaml` sets that to the tools host, and
# serving the same bytes on three hostnames would put two uncanonical
# duplicates in front of crawlers for the `rel=canonical` tag to undo.
#
# What that argument never covered is the state the cluster has actually been
# in for every day of those five: the redirect target serves nothing. The
# tools host fails closed on the unsealed Secret `portfolio-site-repo`, so the
# portfolio's own domain has been spending a TLS handshake to hand every
# visitor a redirect into a dead end — which `platform/ci/publish_surface.py
# --check` prints as a note under both hostnames rather than letting the two
# "+" marks read as content.
#
# So these two names now serve `portfolio-front` (see `portfolio-front.yaml`):
# a generated front-door page — positioning, one card per category, the two
# §5b clauses — held in a ConfigMap and therefore needing no clone token, no
# runner and no Pages flip. It goes live on merge.
#
# This does NOT reintroduce the duplicate the old comment guarded against.
# The front door is a different document from the hub: its own canonical
# (`https://marisstella.dev/`), its own copy, and no per-tool listing at all.
# `platform/marketing/front-door.test.mjs` fails if either property is lost.
# The 524 tool pages still exist on exactly one host.
#
# Restoring the redirect is putting the two `permanent-redirect` annotations
# back; the backend below then stops being reached and nothing else changes.
# Note the one thing that would differ from the old behaviour: ingress-nginx's
# `permanent-redirect` emits a literal `return 301 <target>` and does not
# carry `$request_uri`, which was acceptable while the apex had never served a
# page. It has served one from this commit on, so a later restore should
# expect the apex's own indexed URL to be redirected to the hub root.
#
# WHY THIS CANNOT HIJACK ANYTHING
#
# `portfolio-site.yaml` says in a comment that it stays off the apex because
# "marisstella.dev already resolves to this box for something else", citing
# `infra/README.md`. That file says something narrower than the inference
# drawn from it: "`marisstella.dev` A records already point at the cpx52 —
# this stack will not rewrite them." It records where DNS points, not that a
# process is answering.
#
# Nothing else can be answering. `gitops/apps/ingress-nginx.yaml` runs the
# controller as a DaemonSet with `hostNetwork: true` on the control-plane
# node, so ingress-nginx holds :80 and :443 in the host's own network
# namespace. A second listener on those ports would have failed to bind. The
# owner's issue reports the observed consequence: the name resolves to the
# box, the box's only listener has no rule for it, and the request falls to
# the default backend.
#
# That argument also makes this manifest safe under its own negation. This
# Ingress can only take effect if ingress-nginx owns the port; if some
# non-Kubernetes service somehow owns it instead, ingress-nginx never sees
# the request and this file changes nothing. There is no state in which it
# displaces a live service.
#
# Rollback is deleting this file and `portfolio-front.yaml` from
# `kustomization.yaml`. Between them they add one Deployment, one Service and
# two generated ConfigMaps — no secret, no volume that outlives a pod, no
# state to unwind — and they do not touch the Ingress that serves the tools
# host. (Before 2026-09-02 this file added no workload at all; it does now,
# because the redirect it used to carry pointed at one that cannot start.
# Reverting only the annotations, without also removing `portfolio-front`,
# leaves a running Deployment nothing routes to — harmless, and worth
# noticing.)
#
# TLS
#
# `letsencrypt-prod`, matching `portfolio-site.yaml`, which moved off staging
# on 2026-08-31 once DNS for `tools.marisstella.dev` was confirmed — the full
# reasoning is on that Ingress's annotation. Both move together — a browser
# has to accept the certificate for `marisstella.dev` before it is ever shown
# the redirect, so an apex on staging while the target is on prod would put
# the warning interstitial on the front door only. Flipping one and not the
# other is the mistake this paragraph exists to stop, in either direction:
# a revert has to take both back too.
#
# cert-manager solves HTTP-01 by creating its own `cm-acme-http-solver-*`
# Ingress for `/.well-known/acme-challenge/<token>` (see `solvers.http01.
# ingress.class: nginx` in `gitops/platform/cert-manager/issuer.yaml`). That
# is a separate, more specific location than the `/` Prefix below and it does
# not inherit these annotations, so the redirect does not swallow the
# challenge.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # The name is kept as-is on purpose even though it no longer redirects.
  # Renaming an Ingress deletes and recreates it, and cert-manager keys the
  # `portfolio-apex-tls` Secret and any in-flight HTTP-01 order to the object
  # that requested it — so a rename for tidiness would drop the certificate
  # for the portfolio's front door and re-order it from Let's Encrypt, whose
  # rate limits are per registered domain. The name is not worth that.
  name: portfolio-apex-redirect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - marisstella.dev
        - www.marisstella.dev
      secretName: portfolio-apex-tls
  rules:
    # Both names get their own rule rather than sharing one: ingress-nginx
    # matches on the exact Host header, so `www` is not covered by the apex.
    - host: marisstella.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            # `portfolio-front`, not `portfolio-site`: this is the one place
            # in the tree where pointing at the site would be wrong even
            # though the site is the more finished thing. `portfolio-site`
            # cannot start without the sealed clone token, so a backend
            # pointing there would keep the apex answering 503 for exactly as
            # long as it has been answering a dead redirect. The front door
            # depends on nothing that is not already in git.
            backend:
              service:
                name: portfolio-front
                port:
                  name: http
    - host: www.marisstella.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-front
                port:
                  name: http
