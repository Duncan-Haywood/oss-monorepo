# Cluster-internal status page. No Ingress on marisstella.dev — that name
# already points at this box and this stack must not hijack it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <title>hel1-k3s prod</title>
    <body>
    <h1>hel1-k3s prod</h1>
    <p>This namespace is the GitOps destination for products. It does not
    serve marisstella.dev. Add an Ingress in a follow-up PR when a product
    is ready to take that name.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      nodeSelector:
        hcloud/node-role: control-plane
      priorityClassName: prod-high
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: landing
---
apiVersion: v1
kind: Service
metadata:
  name: landing
spec:
  selector:
    app: landing
  ports:
    - port: 80
      targetPort: 80
