# Cluster-internal status page. This ConfigMap/Deployment/Service carry no
# Ingress of their own and never have.
#
# The comment here used to stop at that and say "marisstella.dev already
# points at this box and this stack must not hijack it" -- true when #1486
# first adopted this namespace and nothing in gitops claimed that name yet.
# It stopped being the whole story on #2481: portfolio-apex.yaml, in this
# same directory, now binds an Ingress to marisstella.dev and www on
# purpose, 301-redirecting both to tools.marisstella.dev. That is not this
# file hijacking the name -- it is the deliberate, documented follow-up the
# original comment was waiting for, landed elsewhere. Leaving this page's
# text saying "add an Ingress in a follow-up PR when ready" after that PR
# merged would read as marisstella.dev still being unclaimed in this tree,
# which is the one way to get a second, conflicting Ingress opened for it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <title>hel1-k3s prod</title>
    <body>
    <h1>hel1-k3s prod</h1>
    <p>This namespace is the GitOps destination for products. This page
    itself has no public Ingress. marisstella.dev and www.marisstella.dev
    are already claimed in this directory by portfolio-apex.yaml, which
    301-redirects both to tools.marisstella.dev -- do not add a second
    Ingress for either host.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      nodeSelector:
        hcloud/node-role: control-plane
      priorityClassName: prod-high
      # Nothing here talks to the Kubernetes API, same posture as
      # portfolio-site.yaml's Deployment.
      automountServiceAccountToken: false
      # Every other workload in this repo (portfolio-site's three containers,
      # its refresh and usage CronJobs, the governor, the CI runner) runs
      # unprivileged with a read-only root filesystem. This Deployment was the
      # one exception: it has carried no securityContext at all since the
      # namespace was first adopted (#1486), so the container ran as root
      # (UID 0) the whole time -- unnoticed because nothing here is reachable
      # from outside the cluster (no Ingress; see the comment at the top of
      # this file), not because it was safe to skip.
      #
      # `nginx:1.27-alpine`'s master process needs root to bind port 80, so
      # hardening it means switching images rather than just adding a
      # securityContext: nginxinc/nginx-unprivileged is the same build
      # portfolio-site.yaml already runs, listening on 8080 with no root step
      # at any point, proven by that Deployment's own probes and tests.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx-unprivileged writes its temp dirs and pid under /tmp --
            # see the identical comment on portfolio-site.yaml's nginx
            # container -- which is what lets the root filesystem stay
            # read-only below.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Every other workload in this namespace (portfolio-site,
          # portfolio-site-usage) declares both probes; this one has carried
          # neither since the namespace was first adopted (#1486). Without a
          # liveness probe a hung nginx master is never restarted -- the
          # kubelet has nothing telling it to. The ConfigMap above serves
          # index.html at "/" with no separate health path, so probe that.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: landing
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: landing
spec:
  selector:
    app: landing
  ports:
    - port: 80
      targetPort: 8080
