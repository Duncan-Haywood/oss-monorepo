# Cluster-internal status page. No Ingress on marisstella.dev — that name
# already points at this box and this stack must not hijack it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <meta charset="utf-8">
    <title>hel1-k3s prod</title>
    <body>
    <h1>hel1-k3s prod</h1>
    <p>This namespace is the GitOps destination for products. It does not
    serve marisstella.dev. Add an Ingress in a follow-up PR when a product
    is ready to take that name.</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      nodeSelector:
        hcloud/node-role: control-plane
      priorityClassName: prod-high
      # Nothing here talks to the Kubernetes API, same posture as
      # portfolio-site.yaml's Deployment.
      automountServiceAccountToken: false
      # Every other workload in this repo (portfolio-site's three containers,
      # its refresh and usage CronJobs, the governor, the CI runner) runs
      # unprivileged with a read-only root filesystem. This Deployment was the
      # one exception: it has carried no securityContext at all since the
      # namespace was first adopted (#1486), so the container ran as root
      # (UID 0) the whole time -- unnoticed because nothing here is reachable
      # from outside the cluster (no Ingress; see the comment at the top of
      # this file), not because it was safe to skip.
      #
      # `nginx:1.27-alpine`'s master process needs root to bind port 80, so
      # hardening it means switching images rather than just adding a
      # securityContext: nginxinc/nginx-unprivileged is the same build
      # portfolio-site.yaml already runs, listening on 8080 with no root step
      # at any point, proven by that Deployment's own probes and tests.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx-unprivileged writes its temp dirs and pid under /tmp --
            # see the identical comment on portfolio-site.yaml's nginx
            # container -- which is what lets the root filesystem stay
            # read-only below.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Every other workload in this namespace (portfolio-site,
          # portfolio-site-usage) declares both probes; this one has carried
          # neither since the namespace was first adopted (#1486). Without a
          # liveness probe a hung nginx master is never restarted -- the
          # kubelet has nothing telling it to. The ConfigMap above serves
          # index.html at "/" with no separate health path, so probe that.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: landing
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: landing
spec:
  selector:
    app: landing
  ports:
    - port: 80
      targetPort: 8080
