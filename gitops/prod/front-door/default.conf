# nginx for the apex front door. One page, one health path, nothing else.
#
# Deliberately a near-copy of `portfolio-site.yaml`'s server block rather than
# a minimal config: the two hostnames are one brand, so a visitor who follows
# the call-to-action from here to the tools host must not cross a boundary
# where the referrer policy, the sniffing protection or the framing rule
# changes. What is dropped is only what has no content to apply to — the
# per-extension `location` blocks for `.webmanifest`, `.csv` and `sw.js`, none
# of which this ConfigMap serves.
#
# `feed.xml` was on that dropped list until this host grew a feed of its own
# over the mirrored tools — see the `location = /feed.xml` block below and
# `renderFrontDoorFeed` in `platform/marketing/front-door.mjs`.
#
# `.mjs` was on that dropped list until the tool mirror landed, and came back
# with it: `front-door-tools.mjs` serves each venture's `calc.mjs` and
# `usage.mjs`, and an ES module with the wrong content type is refused rather
# than merely mistyped. See the block below.

# The same privacy log the site uses, embed bit included.
#
# `$remote_addr`, `$http_user_agent` and `$http_referer` are absent for the
# reason spelled out at length on the site's own `log_format`: a static page
# with no account and no cookie has no business writing a visitor's address,
# device fingerprint or browsing history into a pod log, and leaving the field
# out is what makes that claim structural rather than a promise.
#
# **The embed field arrived 2026-09-03, with the thing it measures.** This
# comment used to say the field was omitted "because nothing embeds this page —
# the widget in `platform/pages/embed.mjs` points at a tool's own URL on the
# tools host". That was true and was the defect: the widget calls itself
# Priority 1 of the marketing-distribution queue item, and it shipped only on
# `tools.marisstella.dev`, which fails closed on the unsealed
# `portfolio-site-repo` Secret and has never served a byte. The apex serves all
# 175 tools and offered no embed at all. `injectMirrorEmbed` now puts the offer
# on every mirrored entry page with a snippet pointing here, so this host is
# the one being framed and the bit is worth writing down.
#
# It is `$portfolio_embed_view` and NOT `$arg_pfEmbed`, for the safety property
# the site's own `log_format` states at length: `$arg_` would write whatever a
# caller put in the URL into the one file this manifest promises carries no
# caller-supplied content. The map below has exactly two outcomes, neither of
# them from the request.
#
# `usage/aggregate.py` already reads this field — optional in its `LOG_LINE`
# pattern, counted under its `EMBED_PREFIX` — so no aggregator change ships
# with this one, and the rollout that replaces these pods one at a time reads
# three-field lines from the old pod and four from the new without dropping
# either.
#
# `usage/aggregate.py` reads this pod as of 2026-09-02. Its selector covers
# both public workloads and its `APP_KEYS` puts these lines on `_front` rather
# than on the hub's row — `slug_for("/index.html")` returns the hub key for
# this page and for the catalogue's front page alike, so a shared row would
# have answered "did anyone find the portfolio" and "did anyone browse the
# catalogue" with one number. Nothing about this format changed to allow that;
# it was written in the aggregator's shape from the start.
log_format privacy '$time_iso8601 $status $uri $portfolio_embed_view';

# The bit above. Two rows, two possible values, nothing from the caller.
map $arg_pfEmbed $portfolio_embed_view {
  default "-";
  1       "embed";
}

# The one exception to "every content location ships X-Frame-Options: DENY",
# and the reason it has to be a `map`: `add_header` cannot branch on a query
# string by itself. `X-Frame-Options: DENY` is enforced before any page script
# runs, so without this the mirror would ship correct HTML, a correct runtime
# and a passing test suite while every browser still refused to render the
# iframe — which is exactly the defect `portfolio-site.yaml` documents having
# hit, one host over.
#
# An empty mapped value is nginx's documented way to make `add_header` skip a
# header entirely, so the default row (no parameter, or any value other than
# `1`) reproduces today's DENY exactly — for every path on this host, and for
# a tool's own plain URL as much as for the front page. Only the deliberate
# `?pfEmbed=1` the copied snippet carries is framable, and only on the entry
# page block below; nothing else in this file references these maps.
#
# Framing these pages is safe in a way it would not be for an application:
# every mirrored tool is static, computes in the visitor's own browser, and has
# no account, no cookie and no server-side state, so there is no authenticated
# action for a clickjacking overlay to borrow.
map $arg_pfEmbed $portfolio_frame_options {
  default DENY;
  1       "";
}
map $arg_pfEmbed $portfolio_frame_ancestors {
  default "";
  1       "frame-ancestors *;";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Every `return 301` below sends a path, and this is what keeps it a path.
  #
  # nginx defaults to `absolute_redirect on`, which rebuilds a relative
  # `Location` as `$scheme://$host:$server_port…`. This pod sits behind
  # ingress-nginx, which terminates TLS and proxies plaintext to :8080 — so
  # `$scheme` here is `http` whatever the visitor used, and the six redirects
  # in this file would hand an `https://` visitor an `http://marisstella.dev/…`
  # Location. It still arrives (the Ingress bounces it back to https), but by
  # way of one plaintext request the visitor did not ask for. A relative
  # Location is resolved against the origin the browser is already on, which is
  # the https one, and needs no claim about how the proxy in front sets
  # headers.
  absolute_redirect off;

  access_log /dev/stdout privacy;

  gzip on;
  # `text/javascript` joins the list with the tool mirror below, for the same
  # reason `portfolio-site.yaml` lists it: a `.mjs` module is content a visitor
  # waits on before the calculator does anything.
  #
  # `text/css`, `application/javascript` and `text/plain` joined on
  # 2026-09-02, when this comment's own claim stopped being true. It used to
  # end here: "its `.mjs` modules are the only non-HTML text this server
  # sends" — wrong even at the time for every mirrored venture's `LICENSE`
  # (`text/plain`, per the `location` block below, and at 1071 bytes already
  # over `gzip_min_length`), and wrong a second way once
  # `construction-evidence-log` mirrored `style.css` and `app.js` (#2739),
  # which nginx's stock `mime.types` serves as `text/css` and
  # `application/javascript` respectively. None of the three was in this
  # list, so all shipped uncompressed with nothing here failing: a correct
  # `Content-Type` and a 200, just a larger response than gzip would have
  # sent. `front-door-tools.test.mjs`'s `the front door compresses every
  # non-HTML type the mirror actually serves` derives the real extension set
  # from `STARTER_SET` on every test run rather than trusting a fixed list,
  # so a future venture bringing a new servable type here fails the build
  # instead of quietly shipping uncompressed.
  #
  # `application/atom+xml` joined the same day, for a file that test cannot
  # see: `STARTER_SET` is the *mirror*, and `/feed.xml` is this host's own
  # generated document, not a mirrored venture file — the two live in
  # different generators (`front-door-tools.mjs` vs `front-door.mjs`) and nothing
  # ties this list to the second one. The feed (`renderFrontDoorFeed`) is
  # 26 KB the day this line was added, more than 25x `gzip_min_length`, and it
  # was shipping every byte of that uncompressed to every reader that polls
  # it. `/sitemap.xml` (`application/xml`) and `/favicon.svg`
  # (`image/svg+xml`) are the same shape of gap and are not fixed here: both
  # sit under `gzip_min_length` today (measured 2026-09-02), so nginx would
  # not compress them even if their types were listed, and adding a type
  # nothing here yet needs is exactly the untested-claim mistake this
  # sentence is otherwise warning against. Revisit if either grows past 1024
  # bytes.
  #
  # `text/html` is deliberately *not* listed even though it is the bulk of what
  # this server sends. nginx always gzips it and warns `duplicate MIME type
  # "text/html"` when it is named — which this line did until the mirror gave
  # it a second type to carry, putting a warning in the log of every pod start.
  #
  # This list stopped governing the mirror on the day the mirror went gz-only.
  # `gzip_static` serves a stored `.gz` directly and never consults
  # `gzip_types`, so every mirrored page is now compressed whatever this line
  # says — including the types it never listed, and including files under
  # `gzip_min_length`. The list still governs this host's own documents that
  # remain plain in `portfolio-front-html` and are compressed at request time
  # (`/feed.xml`, `/index.html`) — `/sitemap.xml`, `/catalog.json` and
  # `/llms.txt` moved to stored `.gz` (see each one's own `location` block
  # above for why) and are no longer in that set. The `front-door-tools.test.mjs`
  # case that derives the mirror's extension set from the built mirror stays for
  # the same reason it was written: it is cheap, and it fails loudly if a future
  # change puts an uncompressed path back.
  gzip_types text/css application/javascript text/javascript text/plain application/atom+xml;
  gzip_min_length 1024;

  # Every path lands on the one page this ConfigMap holds. The apex has never
  # served a deep link — `portfolio-apex.yaml` redirected all of them to the
  # tools root for its whole life — so there is no URL anyone holds that a 404
  # here would honour, and a stranger who mistypes gets the front door rather
  # than an error page that would have to be written and kept.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # The share card this page's own `og:image` names.
  #
  # An exact-match `location` because the catch-all at the foot of this file
  # answers *every* path with `index.html` — that is deliberate for a mistyped
  # URL, and exactly wrong for this one. Without this block a scraper asking
  # for `/social-card.png` is handed 15 KB of HTML with a 200, which is the
  # worst of the three possible outcomes: a 404 at least tells Slack to fall
  # back to a text card, whereas a successful fetch of a non-image leaves the
  # unfurl broken with nothing in any log to say why. `= ` beats every regex
  # and prefix match below, so this stays true no matter what is added later.
  #
  # `types { }` + `default_type` for the same reason the `.mjs` block below
  # gives: a populated `types` block would REPLACE nginx's inherited map, not
  # extend it. The stock map does know `.png`, so this is belt-and-braces
  # rather than load-bearing — but an og:image served as anything but an image
  # type is rejected by several scrapers, and this is the one file on the host
  # whose whole job is to be read by a scraper.
  #
  # No `X-Robots-Tag` here. The mirror sets it because those pages are copies
  # of pages canonical elsewhere; this card is the apex's own, referenced by
  # an indexable page, and telling a crawler not to index the image named by
  # `og:image` is how a link preview stops rendering in search results too.
  location = /social-card.png {
    types { }
    default_type image/png;
    try_files /social-card.png =404;
    add_header X-Content-Type-Options nosniff always;
    # Inert on an image — `X-Frame-Options` governs `<frame>`/`<iframe>`/
    # `<object>`, not `<img>`, so no scraper's unfurl is affected either way.
    # Sent regardless, because `add_header` does not inherit across levels and
    # the rule this file keeps is "every content location repeats it": a
    # blanket header with no holes is worth more than the two bytes saved by
    # reasoning about which responses can be framed.
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # A day, not the five minutes every HTML path here uses. The card is
    # regenerated only when the mark itself changes, and the clients fetching
    # it are scrapers that re-fetch on their own schedule rather than readers
    # who need a corrected sentence the same session.
    add_header Cache-Control "public, max-age=86400" always;
  }

  # The tab mark the page declares with `rel="icon"`.
  #
  # Exact-match for the same reason the card above is: the catch-all at the
  # foot of this file would otherwise hand a browser asking for the icon 16 KB
  # of HTML with a 200, and a browser given HTML where an image was promised
  # shows no icon while logging nothing useful.
  #
  # `types { }` + `default_type` because a populated `types` block replaces
  # nginx's inherited map rather than extending it. Unlike `.png`, `.svg` is
  # *not* in the stock map on every build, so here this is load-bearing rather
  # than belt-and-braces: served as `application/octet-stream` the icon is
  # ignored and the tab stays blank.
  #
  # No `X-Robots-Tag`, on the same reasoning as the card: this is the apex's
  # own asset, referenced by an indexable page.
  location = /favicon.svg {
    types { }
    default_type image/svg+xml;
    try_files /favicon.svg =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # An SVG is a document, and one served from this origin could script
    # against it if it were ever framed or opened directly. This icon is
    # generated from a constant in `front-door.mjs` and contains no script, but
    # the header costs nothing and keeps that true if the mark is ever redrawn.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # A day, matching the card above and for the same reason: the mark changes
    # only when it is redrawn, and a browser re-fetching its tab icon every
    # five minutes is spending a request on something that never moves.
    add_header Cache-Control "public, max-age=86400" always;
  }

  # The embed runtime and its stylesheet, one copy for all 175 mirrored tools.
  #
  # Written by `front-door.mjs --write` from `platform/pages/embed.mjs`'s own
  # `renderEmbedModule`/`renderEmbedStyle`, and linked absolutely (`/pf-embed.js`,
  # `/pf-embed.css`) from every mirrored entry page — absolute because a page can
  # be served from `/tools/<slug>/` or `/tools/<slug>/<dir>/` and a relative path
  # would resolve to a different, missing file depending on the page's depth.
  #
  # Exact-match for the same reason as the icon above, and it matters more here
  # than for any document: the catch-all would answer both with the front page's
  # HTML, and a browser refuses a stylesheet and an ES module served as
  # `text/html` rather than merely mistyping them. The offer box would render
  # unstyled and the copy button would do nothing, with a `200` in the log.
  #
  # `types { }` + `default_type` for the reason the `.mjs` block below gives at
  # length: a populated `types` block in this context REPLACES the inherited
  # map rather than extending it. nginx's stock `mime.types` does type `.js` and
  # `.css` correctly, so this is belt-and-braces for the two files whose whole
  # job is to be executed and applied by a browser.
  location = /pf-embed.js {
    types { }
    default_type text/javascript;
    try_files /pf-embed.js =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Five minutes, matching every other served document here rather than the
    # day the icon and card take: this file changes whenever `embed.mjs` does,
    # and a stale copy in a visitor's cache is a copy button that does nothing.
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  location = /pf-embed.css {
    types { }
    default_type text/css;
    try_files /pf-embed.css =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # The embed resizer — the one file here that a browser loads from somebody
  # else's page. The embed snippet's second line names it absolutely, so this
  # block is what stands between "the frame sizes itself to the tool" and a
  # 404 on every site that pasted the snippet.
  #
  # `X-Frame-Options: DENY` still applies and is still correct: it governs
  # whether *this* response may be framed, and a script never is. Being loaded
  # cross-origin by a `<script src>` is not framing and is not affected by it.
  #
  # No CORS header, deliberately. A classic `<script src>` is a cross-origin
  # *load*, not a fetch — the host page executes it without reading it, so
  # `Access-Control-Allow-Origin` would grant a permission nothing needs.
  location = /pf-embed-host.js {
    types { }
    default_type text/javascript;
    try_files /pf-embed-host.js =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Five minutes like its siblings. This one is cached on sites this
    # portfolio does not control, so a long max-age would pin a stale copy of
    # the one file here that runs on someone else's page.
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # The two paths every crawler asks for by convention.
  #
  # Exact-match for the same reason the card and the icon above are: the
  # catch-all at the foot of this file answers every path with `index.html`, so
  # before these blocks existed a crawler fetching `/robots.txt` was handed
  # 16 KB of HTML with a `200` and `Content-Type: text/html`. That is the worst
  # of the three possible answers — a 404 is a clean "no restrictions, no
  # sitemap" that every crawler understands, whereas a successful fetch of a
  # document that does not parse as directives leaves the discovery handshake
  # broken with nothing in any log to say why. This is the `/social-card.png`
  # defect on the one file a crawler reads before it reads a single page.
  #
  # `types { }` + `default_type` because a populated `types` block would
  # REPLACE nginx's inherited map rather than extend it. Load-bearing for
  # neither extension on a stock build, but kept in the idiom this file uses
  # everywhere else so the two blocks cannot drift from their neighbours.
  #
  # No `X-Robots-Tag` on either: these are the apex's own files, describing the
  # apex's own indexable page. Telling a crawler not to index the sitemap it
  # was just pointed at is self-defeating in the same way the comment on
  # `/social-card.png` describes.
  #
  # `robots.txt` is generated by `platform/marketing/front-door.mjs`, not
  # written here, so the `Sitemap:` line and the `<loc>` below are stamped from
  # the same `FRONT_DOOR_URL` constant as the page's own canonical and cannot
  # disagree with it.
  location = /robots.txt {
    types { }
    default_type text/plain;
    try_files /robots.txt =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # An hour rather than the five minutes the HTML paths use. A crawl
    # directive that changes needs to reach a crawler on its own re-fetch
    # schedule, not within one reader's session, and re-serving this file from
    # origin every five minutes spends requests on a file that almost never
    # moves. Well short of the 24h several crawlers cache it for anyway.
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Stored gzip-only since 2026-09-23 -- the ConfigMap holds `sitemap.xml.gz`
  # and no plain sibling, because this was the fastest-growing key in
  # `portfolio-front-html` and it took the object over the etcd budget. See
  # the note on this file's entry in `gitops/prod/kustomization.yaml`, and
  # `sitemapStoredKey` in `platform/marketing/front-door.mjs`.
  #
  # So `try_files /sitemap.xml =404` had to go, for the identical trap
  # `/catalog.json` below documents at length: `try_files` stats the
  # *uncompressed* name, which is on disk nowhere now, so it would answer 404
  # in the rewrite phase before `gzip_static` ever ran in the content phase --
  # this document dark behind a config that still reads correctly. No
  # `rewrite` is needed either: `gzip_static` appends `.gz` to `$uri` by
  # itself, and `$uri` is already `/sitemap.xml` here.
  #
  # `always` rather than plain `on`, for the same reason: plain `on` consults
  # the stored `.gz` only when the client sent `Accept-Encoding: gzip`, and a
  # crawler fetching a sitemap frequently does not. `gunzip on` then inflates
  # in the worker for those clients.
  location = /sitemap.xml {
    types { }
    default_type application/xml;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # The apex's own Atom feed over the mirrored tools, generated by
  # `platform/marketing/front-door.mjs`. The header comment on this file used
  # to name `feed.xml` among the per-extension blocks dropped from the site's
  # config as having "no content to apply to"; that stopped being true when
  # this host grew a feed of its own, and the comment is corrected above.
  #
  # Exact-match for the reason `/robots.txt` and `/sitemap.xml` are: the
  # catch-all `location /` answers every path with `index.html`, so without
  # this block a feed reader asking for `/feed.xml` is handed 16 KB of HTML
  # with a 200. That is the failure mode the `/social-card.png` comment
  # describes, on the one path whose whole purpose is to be polled by software
  # that cannot ask a human what went wrong.
  #
  # `application/atom+xml` rather than the `application/xml` the sitemap uses.
  # Both parse, but several aggregators dispatch on the content type before
  # they look at the root element, and `<link rel="alternate"
  # type="application/atom+xml">` in the page's head promises this exact
  # string — a document served as something else is a mismatch a validator
  # reports and some readers refuse. nginx's stock `mime.types` has no
  # `.atom`/`atom+xml` entry for `.xml`, so this is load-bearing rather than
  # belt-and-braces.
  #
  # No `X-Robots-Tag`: this is the apex's own document, describing the apex's
  # own pages, and it is exactly what we want an aggregator or an AI crawler to
  # pick up. The mirrored pages it links to carry their own `noindex`, which is
  # where that policy belongs.
  #
  # An hour, matching `robots.txt` and the sitemap. A feed's readers poll on
  # their own schedule and a new tool appears here at most a few times a week,
  # so re-serving from origin every five minutes would spend requests on a
  # document that rarely moves.
  location = /feed.xml {
    types { }
    default_type application/atom+xml;
    try_files /feed.xml =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # The AI-discovery half of the same handshake, generated by
  # `renderFrontDoorLlms`. `llms.txt` (llmstxt.org) is a well-known path, so a
  # model fetches it without having to discover it first — which
  # `portfolio/DIRECTION.md` names as half the growth plan, the other half
  # being organic search. Exact-match for the reason every block above is: the
  # catch-all would otherwise answer a model's fetch with 22 KB of HTML and a
  # 200, and a model handed HTML where markdown was promised reports nothing
  # and simply does not cite the tools.
  #
  # `text/plain` rather than `text/markdown`: the file is markdown by
  # convention, but llmstxt.org specifies no content type and `text/markdown`
  # is not in nginx's stock map, so the honest default is the one every client
  # renders rather than downloads.
  #
  # `charset utf-8` is load-bearing here and is the one thing this block does
  # that the `robots.txt` block above does not need. That file is held to plain
  # ASCII by a test, precisely so no client has to guess an encoding. This one
  # cannot be: it carries the ventures' own titles and meta descriptions, and
  # 30-odd of them contain an em dash. nginx defaults to `charset off`, which
  # sends `text/plain` with no charset parameter — and a client that then
  # assumes Latin-1 renders every one of those as `â€"`. Declaring it is what
  # keeps a model reading a mojibake'd title from citing it that way.
  #
  # No `X-Robots-Tag`, matching robots.txt and the sitemap: this is the apex's
  # own document, describing the apex's own pages, and it exists precisely to
  # be read by the crawlers a noindex would turn away.
  #
  # Stored gzip-only since 2026-09-24 -- the ConfigMap holds `llms.txt.gz` and
  # no plain sibling, because this was one of the keys that grows with the
  # catalogue and it took the object over the etcd budget. See the note on
  # this file's entry in `gitops/prod/kustomization.yaml`, and `llmsStoredKey`
  # in `platform/marketing/front-door.mjs`.
  #
  # So `try_files /llms.txt =404` had to go, for the identical trap
  # `/sitemap.xml` above and `/catalog.json` below document at length:
  # `try_files` stats the *uncompressed* name, which is on disk nowhere now,
  # so it would answer 404 in the rewrite phase before `gzip_static` ever ran
  # in the content phase -- this document dark behind a config that still
  # reads correctly. No `rewrite` is needed either: `gzip_static` appends
  # `.gz` to `$uri` by itself, and `$uri` is already `/llms.txt` here.
  #
  # `always` rather than plain `on`, for the same reason the sitemap block
  # gives: plain `on` consults the stored `.gz` only when the client sent
  # `Accept-Encoding: gzip`, and a crawler fetching this file frequently does
  # not. `gunzip on` then inflates in the worker for those clients.
  location = /llms.txt {
    types { }
    default_type text/plain;
    charset utf-8;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # The structured half of the same handshake, generated by
  # `renderFrontDoorCatalog`. `llms.txt` above is markdown for a model to read;
  # this is JSON for a client to parse — a directory, an aggregator, or an
  # assistant that wants to filter 1321 tools by category rather than read them.
  #
  # Exact-match for the reason every block above is, and the stakes are the
  # highest here: the catch-all answers an unmatched path with `index.html` and
  # a 200, so without this block a client fetching `/catalog.json` gets 49 KB of
  # HTML under a 200 and fails at `JSON.parse`. Unlike a model handed the wrong
  # markdown, it has no way to report what went wrong — it just drops the
  # collection.
  #
  # `charset utf-8` for the same reason `llms.txt` needs it, one step stricter:
  # this file carries the ventures' own titles and meta descriptions, 30-odd of
  # which contain an em dash. RFC 8259 requires JSON be UTF-8, and while a
  # conforming parser assumes it regardless, declaring it costs nothing and
  # keeps a lenient client from guessing Latin-1 and citing `â€"`.
  #
  # No `X-Robots-Tag`, matching `robots.txt`, the sitemap and `llms.txt`: this
  # is the apex's own document describing the apex's own pages, and it exists
  # precisely to be fetched by the clients a noindex would turn away.
  # Stored gzip-only since 2026-09-12 -- the ConfigMap holds `catalog.json.gz`
  # and no plain sibling, because this was the largest and fastest-growing key
  # in `portfolio-front-html` and it took the object over the etcd budget. See
  # the note on this file's entry in `gitops/prod/kustomization.yaml`.
  #
  # So `try_files /catalog.json =404` had to go, and that line is exactly the
  # trap the mirror's blocks document at length: `try_files` stats the
  # *uncompressed* name, which is on disk nowhere now, so it would answer 404
  # in the rewrite phase before `gzip_static` ever ran in the content phase --
  # this document dark behind a config that still reads correctly. No `rewrite`
  # is needed in its place either: `gzip_static` appends `.gz` to `$uri` by
  # itself, and `$uri` is already `/catalog.json` here.
  #
  # `always` rather than plain `on`, for the reason the mirror gives: plain
  # `on` consults the stored `.gz` only when the client sent
  # `Accept-Encoding: gzip`, and every client that did not would fall through
  # to a plain file that does not exist. `gunzip on` then inflates in the
  # worker for those clients -- which for a machine-readable catalogue is the
  # common case, since a scripted fetch frequently sends no encoding header
  # at all.
  location = /catalog.json {
    types { }
    default_type application/json;
    charset utf-8;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # The mirrored tools, from `platform/marketing/front-door-tools.mjs`.
  #
  # ConfigMap keys cannot contain `/`, so the generator flattens each file to
  # `<slug>__<file>` and these two rules map the URL back. The alternative was
  # an explicit `items:` list on the volume, one entry per mirrored file, to
  # rebuild the tree at mount time -- ~90 lines of YAML in the Deployment that
  # would have to stay in step with `STARTER_SET` by hand. These rules cannot
  # drift from it because they name no venture.
  #
  # ## `X-Robots-Tag`, and why the page blocks no longer carry it
  #
  # Every `/tools/` block used to send `X-Robots-Tag: noindex`, matching the
  # `noindex` meta the mirror stamped into each page. Both were on behalf of
  # `tools.marisstella.dev`: these pages are copies, and `portfolio-apex.yaml`
  # is right that two hosts serving the same bytes undoes the consolidation
  # `build.mjs` stamps in.
  #
  # That host serves nothing, and is blocked on an owner-only seal. So the two
  # directives were excluding the portfolio's entire catalogue from search on
  # behalf of a host that does not exist, while this one served all 1321 tools.
  # `TOOLS_HOST_SERVES` in `platform/marketing/front-door-tools.mjs` is now the
  # single premise both halves read; it is `false`, so the pages are indexable
  # here and carry a canonical naming this host.
  #
  # A header set here would override the markup silently and in the direction
  # that costs traffic, so the page-serving blocks below set none at all.
  # Flip `TOOLS_HOST_SERVES` and restore these four lines in the same commit
  # that seals the tools host; a test in `front-door-tools.test.mjs` fails if
  # the two ever disagree.
  #
  # The `.mjs` and `LICENSE` blocks keep theirs. Those are source files rather
  # than pages: nobody searches for them, and a raw module in an index is noise
  # whichever host is canonical.
  #
  # The trailing-slash form is separate because a flattened key cannot have
  # `index.html` appended to it -- `/tools/<slug>/` has to become the key
  # `<slug>__index.html`, not `<slug>__/index.html`.
  #
  # ## Why these blocks `rewrite` instead of `try_files`, and why the captures
  # ## are named
  #
  # The mirror stores only the gzipped copy of each file: the ConfigMap holds
  # `<slug>__<file>.gz` and no plain sibling. See the compression section at the
  # top of `platform/marketing/front-door-tools.mjs` for why (3.13x, which is
  # what took the mirror from 53 tools to the whole eligible catalogue).
  #
  # `gzip_static always` is what serves it -- nginx looks for `$uri.gz`, sends
  # it with `Content-Encoding: gzip` to a client that accepts it, and `gunzip
  # on` inflates it in the worker for one that does not. `always` rather than
  # plain `on` because `on` only consults the `.gz` when the client sent
  # `Accept-Encoding: gzip`, and for every other client it would fall through
  # to a plain file that does not exist.
  #
  # `try_files` cannot be used to reach it. `try_files /$1__$2 =404` stats the
  # *uncompressed* name, which is absent for every file in a gz-only mirror, so
  # it would answer 404 before `gzip_static` ever ran -- the whole mirror dark,
  # with a correct-looking config. `rewrite ... break` sets the URI and hands it
  # to the content phase, where `gzip_static` is.
  #
  # The captures are named (`?<slug>`) rather than positional, and that is
  # load-bearing rather than style: `$1` inside a `rewrite` *replacement* refers
  # to the rewrite's own regex -- here `^`, which captures nothing -- not to the
  # enclosing `location`'s. Written positionally these rules ask for
  # `__index.html` and every tool 404s. Verified against nginx 1.29 by serving
  # this file over the real mirror; both spellings were tried and only the named
  # one works.
  # The slashless spelling redirects rather than serving, and that is not
  # tidiness -- it is the difference between a working calculator and a dead
  # one.
  #
  # This block used to be `/?$`, so `/tools/<slug>` answered `200` with the
  # entry page's bytes. A browser then resolves that page's relative references
  # against `/tools/`, one directory above where the mirror keeps them: measured
  # against this file over the real mirror, all 175 mirrored entry pages answer
  # 200 at the slashless URL and every one of them loses at least one
  # same-directory reference there -- 693 in total, and 15 pages lose a
  # stylesheet or an ES module outright. `where-to-sell-calculator` is typical:
  # its three FAQ pages, its comparison page and its LICENSE all 404, because
  # `does-it-actually-sell-there.html` becomes `/tools/does-it-actually-sell-there.html`.
  # The page still renders, so the failure is invisible in the log -- the same
  # shape of silent break the `.mjs` block below exists to prevent.
  #
  # Nothing in the mirror links this spelling; a person truncating an address,
  # a pasted link and an external inbound link produce it, which is exactly the
  # traffic worth not breaking. The canonical host does not have the problem
  # (`portfolio-site.yaml` serves a real directory tree, and nginx redirects a
  # directory request to its trailing-slash form on its own), so this restores
  # the behaviour the mirror was flattened out of rather than inventing one.
  #
  # `$is_args$args` because `return` does not carry the query string on its own,
  # and the embed snippet's URL is `?pfEmbed=1` -- dropping it would frame the
  # non-embed page. The capture is named for the reason spelled out above.
  location ~ "^/tools/(?<rslug>[a-z0-9][a-z0-9-]*)$" {
    return 301 /tools/$rslug/$is_args$args;
  }

  location ~ "^/tools/(?<slug>[a-z0-9][a-z0-9-]*)/$" {
    root /usr/share/nginx/tools;
    rewrite ^ /${slug}__index.html break;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    # The only framable block on this host, and only for `?pfEmbed=1` — see the
    # `$portfolio_frame_options` map at the top of this file. A tool's entry
    # page is what the copied snippet points at; every deep subpage, asset and
    # root document below and above keeps its unconditional DENY.
    add_header X-Frame-Options $portfolio_frame_options always;
    add_header Content-Security-Policy $portfolio_frame_ancestors always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # `.mjs` before the general file rule, because nginx takes the first regex
  # location that matches and only this one can set the type.
  #
  # Every mirrored calculator loads its arithmetic with `<script type="module"
  # src="./calc.mjs">`, and a module served as anything but a JavaScript type is
  # *refused* by the browser -- the page renders and then does nothing, with a
  # 200 in the log. nginx's stock `mime.types` has no `.mjs` entry, so without
  # this block every tool in the mirror is a dead form. `portfolio-site.yaml`
  # carries the same block for the same reason and its comment is the long
  # version; the short version is that `types { }` empty plus `default_type` is
  # the idiom, because a populated `types` block here would REPLACE the
  # inherited map rather than extend it.
  location ~ "^/tools/(?<mjs_slug>[a-z0-9][a-z0-9-]*)/(?<mjs_file>[A-Za-z0-9._-]+\.mjs)$" {
    root /usr/share/nginx/tools;
    # Resolve an aliased duplicate to the one stored copy. `$fd_stored`
    # defaults to `$fd_flat`, so a file with no alias routes unchanged.
    set $fd_flat "${mjs_slug}__${mjs_file}";
    rewrite ^ /$fd_stored break;
    gzip_static always;
    gunzip on;
    types { }
    default_type text/javascript;
    add_header X-Robots-Tag "noindex" always;  # source file, not a page -- see the note above
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # Every venture's footer links to its own `LICENSE`, which has no extension
  # and would otherwise fall through to `default_type` and download instead of
  # opening. It is plain text; say so.
  #
  # `X-Frame-Options` was missing here until it was found to be the one
  # content-serving location in this file not carrying it — `add_header` does
  # not merge across levels (see the comment on `location /` below), so a
  # location that sets any `add_header` drops the server block's default
  # instead of inheriting it. The tools host's own `LICENSE` response (the
  # `location /` fallback in `portfolio-site.yaml`'s nginx conf, since a bare
  # `LICENSE` matches no extension there) does carry the header, so the
  # mirror was quietly weaker than the page it mirrors on the one property
  # this file's own header comment calls unconditional.
  location ~ "^/tools/(?<lic_slug>[a-z0-9][a-z0-9-]*)/(?<lic_file>LICENSE)$" {
    root /usr/share/nginx/tools;
    # Resolve an aliased duplicate to the one stored copy. `$fd_stored`
    # defaults to `$fd_flat`, so a file with no alias routes unchanged.
    set $fd_flat "${lic_slug}__${lic_file}";
    rewrite ^ /$fd_stored break;
    gzip_static always;
    gunzip on;
    types { }
    default_type text/plain;
    add_header X-Robots-Tag "noindex" always;  # source file, not a page -- see the note above
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # 18 mirrored ventures offer a specific `.py` CLI as a same-origin download
  # (`DOWNLOADABLE_CLI_FILES` in `platform/pages/build.mjs`, imported rather
  # than restated by `ventureFiles` in `front-door-tools.mjs`). nginx's stock
  # `mime.types` has no `.py` entry either, same gap as `.mjs` above; typed as
  # text/plain rather than left to fall through so a visitor's browser can
  # open and read it before running it, matching `portfolio-site.yaml`'s own
  # `.py` block for the canonical site.
  location ~ "^/tools/(?<py_slug>[a-z0-9][a-z0-9-]*)/(?<py_file>[A-Za-z0-9._-]+\.py)$" {
    root /usr/share/nginx/tools;
    # Resolve an aliased duplicate to the one stored copy. `$fd_stored`
    # defaults to `$fd_flat`, so a file with no alias routes unchanged.
    set $fd_flat "${py_slug}__${py_file}";
    rewrite ^ /$fd_stored break;
    gzip_static always;
    gunzip on;
    types { }
    default_type text/plain;
    add_header X-Robots-Tag "noindex" always;  # source file, not a page -- see the note above
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  location ~ "^/tools/(?<any_slug>[a-z0-9][a-z0-9-]*)/(?<any_file>[A-Za-z0-9._-]+)$" {
    root /usr/share/nginx/tools;
    # Resolve an aliased duplicate to the one stored copy. `$fd_stored`
    # defaults to `$fd_flat`, so a file with no alias routes unchanged.
    set $fd_flat "${any_slug}__${any_file}";
    rewrite ^ /$fd_stored break;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # ## One page subdirectory deep
  #
  # A handful of ventures carry a second tool in a subdirectory of their own —
  # `consent-change-record/tool/` is the HAR before/after diff its front page
  # links to as an alternative input format. `ventureFiles` in
  # `front-door-tools.mjs` mirrors such a directory (and only such a directory:
  # the rule is that it holds its own `index.html`, which no `src/` or `tests/`
  # tree does), encoding the separator the same way the venture separator is
  # encoded — `consent-change-record__tool__index.html`.
  #
  # Decoding it needs its own blocks because the flat rules above cannot match
  # a path with two slashes in it: their filename class `[A-Za-z0-9._-]+`
  # excludes `/` by construction. That is also why these can sit *after* the
  # flat rules without shadowing anything — nginx takes the first matching
  # regex location, and no request can match both a two-segment and a
  # three-segment pattern. The reverse is worth stating too: the directory
  # class below is `ROUTABLE_SLUG`'s, which forbids `.` and uppercase, so
  # `/tools/<slug>/calc.mjs` and `/tools/<slug>/LICENSE` cannot be captured
  # here as a directory even if these blocks were moved above the flat ones.
  #
  # The trailing slash is required on the directory-index form for the same
  # reason the venture-root rule requires it: a flattened key cannot have
  # `index.html` appended to it. `/tools/<slug>/<dir>` with no slash falls
  # through to the flat rule above and 404s, which is the honest answer — the
  # mirror stores no such file, and the links every mirrored page actually
  # carries are written `<dir>/index.html`. It is deliberately left a 404 and
  # not given the venture-root rule's redirect: that redirect exists because
  # `/tools/<slug>` was answering 200 with a page whose relative references
  # then broke, and a 404 breaks nothing.
  #
  # `.mjs` first, for the reason the flat `.mjs` block gives: nginx's stock
  # `mime.types` has no `.mjs` entry, and the sub-tool loads its arithmetic
  # with `import ... from "./har-diff.mjs"`. Served as anything but a
  # JavaScript type the module is refused and the page renders inert with a
  # 200 in the log.
  location ~ "^/tools/(?<sd_slug>[a-z0-9][a-z0-9-]*)/(?<sd_dir>[a-z0-9][a-z0-9-]*)/$" {
    root /usr/share/nginx/tools;
    rewrite ^ /${sd_slug}__${sd_dir}__index.html break;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  location ~ "^/tools/(?<sdm_slug>[a-z0-9][a-z0-9-]*)/(?<sdm_dir>[a-z0-9][a-z0-9-]*)/(?<sdm_file>[A-Za-z0-9._-]+\.mjs)$" {
    root /usr/share/nginx/tools;
    # Resolve an aliased duplicate to the one stored copy. `$fd_stored`
    # defaults to `$fd_flat`, so a file with no alias routes unchanged.
    set $fd_flat "${sdm_slug}__${sdm_dir}__${sdm_file}";
    rewrite ^ /$fd_stored break;
    gzip_static always;
    gunzip on;
    types { }
    default_type text/javascript;
    add_header X-Robots-Tag "noindex" always;  # source file, not a page -- see the note above
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  location ~ "^/tools/(?<sdl_slug>[a-z0-9][a-z0-9-]*)/(?<sdl_dir>[a-z0-9][a-z0-9-]*)/(?<sdl_file>LICENSE)$" {
    root /usr/share/nginx/tools;
    # Resolve an aliased duplicate to the one stored copy. `$fd_stored`
    # defaults to `$fd_flat`, so a file with no alias routes unchanged.
    set $fd_flat "${sdl_slug}__${sdl_dir}__${sdl_file}";
    rewrite ^ /$fd_stored break;
    gzip_static always;
    gunzip on;
    types { }
    default_type text/plain;
    add_header X-Robots-Tag "noindex" always;  # source file, not a page -- see the note above
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  location ~ "^/tools/(?<sda_slug>[a-z0-9][a-z0-9-]*)/(?<sda_dir>[a-z0-9][a-z0-9-]*)/(?<sda_file>[A-Za-z0-9._-]+)$" {
    root /usr/share/nginx/tools;
    # Resolve an aliased duplicate to the one stored copy. `$fd_stored`
    # defaults to `$fd_flat`, so a file with no alias routes unchanged.
    set $fd_flat "${sda_slug}__${sda_dir}__${sda_file}";
    rewrite ^ /$fd_stored break;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # The ten category browse pages, generated by `renderCategoryPage` in
  # `platform/marketing/front-door.mjs` and mounted at the document root.
  #
  # A regex rather than ten exact-match blocks because the set is generated:
  # a category that gains its first mirrored tool starts being rendered, and a
  # hand-kept list of `location =` lines would answer its URL with the front
  # page until someone noticed.
  #
  # The capture is named (`?<cat>`) for the reason spelled out at length on the
  # `/tools/` blocks above: `$1` inside a `rewrite` argument does not refer to
  # the enclosing location's regex, and written positionally this asks for
  # `c__.html` and every category 404s.
  #
  # The ConfigMap key cannot be `c/<id>/index.html` — a ConfigMap key must match
  # `[-._a-zA-Z0-9]+`, so the `/` is rejected by the API server. `categoryPageKey`
  # is the other half of this rewrite; the two have to agree or the pages are
  # dark, and `front-door.test.mjs` pins them together.
  #
  # `rewrite` rather than `try_files`, and `gzip_static` rather than a plain
  # file: **since 2026-09-24** these ten pages are the only ones in
  # `portfolio-front-html` stored gzipped besides `compare.html.gz` and the
  # `vs__<product>.html.gz` pages below, for the identical reason those give —
  # they were the largest still-plain block left and took the object over the
  # etcd budget. `categoryPageStoredKey` in `front-door.mjs` carries the
  # measurement.
  #
  # `try_files /c__${cat}.html =404` stats the *uncompressed* name, which is
  # no longer stored, so it would answer 404 before `gzip_static` ever ran —
  # the same trap the `/compare/` block above documents. `rewrite ... break`
  # sets the URI to the plain name and hands it to the content phase, where
  # `gzip_static` looks for `$uri.gz`.
  #
  # The one behaviour this costs is the `=404` the plain form gave for free,
  # same as the `/compare/(?<vs>…)/?$` block below: an unknown category used
  # to 404 on the `try_files`, and now the rewrite always succeeds and the
  # request reaches the content phase with no file behind it. nginx answers
  # 404 there anyway — there is no `.gz` and no plain sibling for an id with
  # no rendered page — so an unknown category still 404s rather than serving
  # the front page with a 200.
  # `always` rather than plain `on` because `on` consults the `.gz` only when
  # the client sent `Accept-Encoding: gzip`, and every other client would fall
  # through to a plain file that does not exist. `gunzip on` inflates it in
  # the worker for those clients.
  location ~ "^/c/(?<cat>[a-z0-9][a-z0-9-]*)/?$" {
    rewrite ^ /c__${cat}.html break;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # The About and press-kit page, `renderFrontDoorAbout` in
  # `platform/marketing/front-door.mjs`, mounted flat at the document root as
  # `about.html` for the same reason the category pages are `c__<id>.html`: a
  # ConfigMap key must match `[-._a-zA-Z0-9]+`, so `about/index.html` cannot be
  # one however much it is the URL.
  #
  # An exact-ish regex rather than a prefix `location /about`, because the
  # catch-all below answers every unmatched path with the front page — so a
  # prefix match would quietly serve the front page for `/aboutanything`, and
  # a bare `location = /about/` would miss the slashless `/about` that a person
  # typing the address by hand produces. `/?$` accepts both spellings and
  # nothing else, matching the `^/c/(?<cat>…)/?$` block above.
  #
  # `rewrite` rather than `try_files`, and `gzip_static` rather than a plain
  # file, since 2026-09-24: this key joined `compare.html` and the fourteen
  # `vs__<product>.html` pages as the ones stored gzipped in
  # `portfolio-front-html`. `COMPRESSED_SUFFIX` in
  # `platform/marketing/front-door.mjs` carries the measurement and the
  # reason `about.html` was the one compressed this time.
  #
  # `try_files /about.html =404` stats the *uncompressed* name, which is not
  # stored, so it would answer 404 before `gzip_static` ever ran — the same
  # trap the `/compare/` block's own comment documents at length.
  #
  # `always` rather than plain `on` because `on` consults the `.gz` only when
  # the client sent `Accept-Encoding: gzip`, and every other client would fall
  # through to a plain file that does not exist. `gunzip on` inflates it in
  # the worker for those clients.
  location ~ "^/about/?$" {
    rewrite ^ /about.html break;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # The comparison index — `renderFrontDoorComparisons` in
  # `platform/marketing/front-door.mjs` — mounted flat at the document root as
  # `compare.html`, for the same ConfigMap-key reason as `about.html` and the
  # eight `c__<id>.html` pages above.
  #
  # The `/?$` regex rather than a prefix `location /compare` matches the About
  # block exactly, and for the same two reasons: a prefix would quietly serve
  # this page for `/comparefoo`, and a bare `location = /compare/` would miss
  # the slashless `/compare` a person typing the address produces.
  #
  # `COMPARE_KEY` in `front-door.mjs` is the other half of this rewrite and
  # `front-door.test.mjs` pins the two together — they have to agree or the
  # index, which is the only cross-venture route between the mirrored
  # `vs-<product>.html` pages, is dark.
  # `rewrite` rather than `try_files`, and `gzip_static` rather than a plain
  # file: this key and the fourteen below are the only ones in
  # `portfolio-front-html` stored gzipped, because they are the largest and the
  # fastest-growing things in it. `COMPRESSED_SUFFIX` in
  # `platform/marketing/front-door.mjs` carries the measurement and the reason.
  #
  # `try_files /compare.html =404` stats the *uncompressed* name, which is not
  # stored, so it would answer 404 before `gzip_static` ever ran — the whole
  # comparison layer dark behind a config that reads correctly. This is the
  # same trap the mirror blocks above document; `rewrite ... break` sets the
  # URI and hands it to the content phase, where `gzip_static` is.
  #
  # `always` rather than plain `on` because `on` consults the `.gz` only when
  # the client sent `Accept-Encoding: gzip`, and every other client would fall
  # through to a plain file that does not exist. `gunzip on` inflates it in the
  # worker for those clients.
  location ~ "^/compare/?$" {
    rewrite ^ /compare.html break;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # One page per product compared by more than one tool —
  # `renderFrontDoorCompareProduct` in `platform/marketing/front-door.mjs`,
  # mounted flat as `vs__<product>.html` for the same ConfigMap-key reason as
  # everything above.
  #
  # It has to sit *below* the `^/compare/?$` block: nginx tries regex locations
  # in file order and takes the first that matches, and while these two cannot
  # both match one URI (that block requires the path to end at `/compare`),
  # keeping the index first means the most-visited path is also the first
  # tested. The named capture excludes `/` and `.`, so it can only ever name a
  # sibling of the document root and never `../` out of it — a `try_files`
  # built from an unconstrained capture is a path-traversal read.
  #
  # `=404` rather than a fallback to `/compare.html`: a product page that was
  # swept because it dropped below two comparisons should say it is gone, not
  # quietly serve a different page with a 200 and let the URL sit in a sitemap
  # looking healthy. `compareProductKey` in `front-door.mjs` is the other half
  # of this rewrite and `front-door.test.mjs` pins the two together.
  # `rewrite` + `gzip_static` for the reason the index block above gives.
  #
  # The one behaviour this costs is the `=404` the plain form gave for free: a
  # swept product used to 404 on the `try_files`, and now the rewrite always
  # succeeds and the request reaches the content phase with no file behind it.
  # nginx answers 404 there anyway — there is no `.gz` and no plain sibling to
  # find — so a swept product still says it is gone rather than serving the
  # index with a 200, which is what would tell a crawler a dead URL is alive.
  # `test_a_swept_product_page_404s_rather_than_serving_a_different_one` pins
  # that, against real nginx, precisely because it is now emergent rather than
  # stated.
  location ~ "^/compare/(?<vs>[a-z0-9][a-z0-9-]*)/?$" {
    rewrite ^ /vs__${vs}.html break;
    gzip_static always;
    gunzip on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # The front page itself, and only it.
  #
  # This used to be the catch-all `location /` below, which meant one block
  # answered both "the visitor asked for the front page" and "the visitor asked
  # for something that does not exist" — with a `200` either way. Splitting the
  # exact match out is what lets the two cases keep the same *body* (see the
  # catch-all) while differing in *status*, which is the half that was wrong.
  location = / {
    try_files /index.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Five minutes, matching every other page this portfolio serves. Long
    # enough that a burst of traffic is one origin hit per visitor, short
    # enough that a corrected claim on this page reaches a returning reader
    # the same session rather than the next day.
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
  }

  # The parents a person truncates a URL to, and the second spelling of the
  # front page.
  #
  # `/tools/` and `/c/` are not typos: they are what a reader gets by deleting
  # the last segment of `/tools/<slug>/` or `/c/<id>/`, which is a thing people
  # do in an address bar. A `404` there would be technically correct and
  # useless — the front page *is* the index of both, so say so with a redirect
  # rather than serving a second copy of it under a non-canonical address.
  # `/index.html` gets the same treatment for the ordinary duplicate-content
  # reason: it is the front page at an address the canonical tag does not name.
  location = /index.html { return 301 /; }
  location = /tools      { return 301 /; }
  location = /tools/     { return 301 /; }
  location = /c          { return 301 /; }
  location = /c/         { return 301 /; }

  # Everything else: the front page's body, with a `404` status.
  #
  # Serving the front page for a mistyped URL is deliberate and stays that way
  # — it is the one page here with a search box, so it is a better answer than
  # a bare error. `robots.txt`'s own comment in `platform/marketing/front-door.mjs`
  # records that choice.
  #
  # What was wrong is that it came with a `200`. That is a soft 404, and this
  # portfolio's only growth channel is organic search and AI answers: a `200`
  # tells a crawler every typo, every dead inbound link and every probe for
  # `/wp-login.php` is a real page, so an unbounded set of URLs enters the
  # index as duplicates of the front page and the crawl budget for 638 real
  # ones is spent on them. It also makes the site unlinkcheckable — nothing
  # downstream can tell a live URL from a dead one.
  #
  # `error_page` preserves the original status unless overridden with `=<code>`,
  # so the named location below returns the front page's bytes under the `404`
  # this block sets. `no-store` because a cache holding a "page not found" for
  # five minutes outlives the typo that produced it.
  location / {
    error_page 404 @front_page_not_found;
    return 404;
  }

  location @front_page_not_found {
    internal;
    try_files /index.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-store" always;
  }
}
