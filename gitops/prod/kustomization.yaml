apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - quota.yaml
  - networkpolicy.yaml
  - landing.yaml
  - portfolio-site.yaml
  - portfolio-front.yaml
  - portfolio-apex.yaml
  - site-usage.yaml
  # front-door-tools/ (generated mirror) is no longer committed: P024. The k3s origin it fed was retired 2026-10-01.
configMapGenerator:
  - name: portfolio-site-usage-script
    files:
      - aggregate.py=usage/aggregate.py
    options:
      # No content hash. The CronJob in `site-usage.yaml` names this ConfigMap
      # directly, so a hashed name would leave it referring to an object that
      # no longer exists. Nothing long-running mounts it, so editing the script
      # does not need to roll anything — the next scheduled run picks it up.
      #
      # This used to be a namespace-wide `generatorOptions:` block at the foot
      # of this file. It moved here on 2026-09-02, when the front door below
      # became the first generated ConfigMap that a Deployment mounts: a global
      # `disableNameSuffixHash: true` cannot be overridden back to `false` by a
      # per-generator `options` (kustomize 5.4 merges the two, and a `false`
      # there is indistinguishable from unset), so the only way to have both
      # behaviours in one kustomization is to state the exception per generator
      # rather than globally. Verified with `kustomize build gitops/prod`:
      # this one stays bare, the two below carry hashes.
      disableNameSuffixHash: true
  # The apex front door: one generated page and the nginx config that serves
  # it. Both take the content hash, because a long-running Deployment mounts
  # them and a change has to produce a new ConfigMap name for the rollout to
  # happen at all. Without it a regenerated page would sit in the ConfigMap
  # while both pods went on serving the old one until something unrelated
  # restarted them.
  #
  # Regenerate the page with:
  #   node platform/marketing/front-door.mjs --write
  # `platform/marketing/front-door.test.mjs` fails if the commit is stale.
  #
  # The `sync-options` below is not optional decoration, and this generator
  # crossed the line that makes it load-bearing when `catalog.json` joined the
  # set: the serialised ConfigMap went from ~226 KB to ~314 KB, past the
  # 262144-byte cap the API server puts on an object's annotations. Argo CD
  # applies client-side by default, which copies the whole object into
  # `kubectl.kubernetes.io/last-applied-configuration` — so without this the
  # apply fails with `metadata.annotations: Too long`, the hashed ConfigMap
  # `portfolio-front.yaml` mounts is never created, the new pods sit in
  # ContainerCreating, and `maxUnavailable: 0` leaves the *old* front door
  # serving while `prod` stays permanently Degraded. Server-side apply writes
  # no such annotation and is bounded only by etcd's 1 MiB.
  #
  # Same reasoning and same option as every shard in `front-door-tools/`, which
  # crossed the same line first;
  # `gitops/tests/test_manifests.py::test_a_configmap_too_large_for_client_side_apply_asks_for_server_side`
  # is what fails if a future generator crosses it without saying so.
  - name: portfolio-front-html
    options:
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
    files:
      - index.html=front-door/index.html
      # The page's own `og:image`. Not valid UTF-8, so kustomize puts it under
      # `binaryData` rather than `data` and the kubelet writes the decoded
      # bytes into the volume — the file nginx serves is the PNG, not its
      # base64. It rides in this ConfigMap rather than a second one because
      # two ConfigMaps cannot mount at one `mountPath`, and the card has to
      # sit at the document root beside `index.html` for `/social-card.png`
      # to resolve. ~6 KB base64'd against a 1 MiB object ceiling.
      - social-card.png=front-door/social-card.png
      # The tab mark the page declares with `rel="icon"`. Text, so it lands in
      # `data` rather than `binaryData`, and a few hundred bytes either way.
      # Same reason as the card for riding in this ConfigMap: it has to sit at
      # the document root for `/favicon.svg` to resolve.
      - favicon.svg=front-door/favicon.svg
      # The crawler handshake's first half. Rides in this ConfigMap for the
      # same reason the card and the icon do: it has to sit at the document
      # root for `/robots.txt` to resolve, and two ConfigMaps cannot mount at
      # one `mountPath`. Text, so it lands in `data`. Under a kilobyte against
      # a 1 MiB object ceiling.
      - robots.txt=front-door/robots.txt
      # The apex's own Atom feed over the mirrored tools. Same reason as the
      # three above for riding in this ConfigMap: the page declares it at
      # `/feed.xml` in `<link rel="alternate">` and links it from the footer,
      # so it has to sit at the document root, and two ConfigMaps cannot mount
      # at one `mountPath`. Text, so it lands in `data`. A few kilobytes
      # against a 1 MiB object ceiling.
      - feed.xml=front-door/feed.xml
      # The embed runtime and its stylesheet, generated from
      # `platform/pages/embed.mjs` by `front-door.mjs --write`. Same reason
      # again for riding here: every mirrored entry page links them absolutely
      # at `/pf-embed.js` and `/pf-embed.css`, so they have to sit at the
      # document root, and two ConfigMaps cannot mount at one `mountPath`.
      #
      # These are the only keys in this ConfigMap that a *mirrored* page
      # references rather than the front page — the mirror's shards mount
      # elsewhere, but the browser resolves these two against the document
      # root, which is this volume. Shipping the mirror without them would
      # serve 173 pages whose embed box is unstyled and whose copy button is
      # dead. ~4 KB together; `front-door.test.mjs` holds the whole generated
      # set under the 1 MiB object ceiling.
      - pf-embed.js=front-door/pf-embed.js
      - pf-embed.css=front-door/pf-embed.css
      # The resizer, which is here for a different reason than the two above:
      # no page on this host links it at all. It is named by the `<script src>`
      # in the embed snippet each of the 173 entry pages offers for copying, so
      # it is fetched from a stranger's site or not at all. Absent from this
      # ConfigMap, every published snippet's second line 404s and every embed
      # silently stays at its fallback height -- a failure with no symptom
      # anywhere we can see it.
      - pf-embed-host.js=front-door/pf-embed-host.js
      # The ten category browse pages. Same reason as everything above for
      # riding in this ConfigMap: they are served from the document root (the
      # `^/c/(?<cat>…)/?$` block in `front-door/default.conf` rewrites
      # `/c/trades/` to `/c__trades.html`), and two ConfigMaps cannot mount at
      # one `mountPath`.
      #
      # Listed one line per file rather than generated, unlike `front-door-tools/`,
      # because the set is ten and changes only when a category gains or
      # loses its last mirrored tool — a generated nested kustomization would
      # be more machinery than the thing it manages. `front-door.test.mjs`
      # asserts this list against what the generator writes, so a category
      # added without a line here fails CI rather than going dark.
      #
      # **Stored gzipped since 2026-09-24** — same reason and same mechanism
      # as `compare.html.gz` below: at ~148 KB plain together, the largest
      # being `c__trades.html` at ~55 KB for 116 tools, this was the largest
      # still-plain block left in the ConfigMap and the one every new trades
      # venture grows fastest. It took the built object to 943,895 bytes
      # against the 943,718-byte budget `gitops/tests/test_manifests.py`
      # enforces — over by 177 bytes, on a commit that touched none of these
      # ten pages; the comparison pages and new ventures merged that hour did
      # it by themselves. See `categoryPageStoredKey` in
      # `platform/marketing/front-door.mjs` for the full reasoning.
      #
      # A `.gz` key is not valid UTF-8, so kustomize files it under
      # `binaryData` as base64 — the 4/3 expansion the ceiling tests already
      # model. `gzip_static always; gunzip on;` in the `^/c/(?<cat>…)/?$`
      # block of `front-door/default.conf` is what serves it: `try_files`
      # would stat the uncompressed name, which is no longer on disk.
      - c__trades.html.gz=front-door/c__trades.html.gz
      - c__evidence.html.gz=front-door/c__evidence.html.gz
      - c__marketplace.html.gz=front-door/c__marketplace.html.gz
      - c__backoffice.html.gz=front-door/c__backoffice.html.gz
      - c__food-service.html.gz=front-door/c__food-service.html.gz
      - c__services.html.gz=front-door/c__services.html.gz
      - c__logistics.html.gz=front-door/c__logistics.html.gz
      - c__ci.html.gz=front-door/c__ci.html.gz
      - c__solo-earner.html.gz=front-door/c__solo-earner.html.gz
      - c__self-hosted.html.gz=front-door/c__self-hosted.html.gz
      - c__more.html.gz=front-door/c__more.html.gz
      # The About and press-kit page, served from the document root by the
      # `^/about/?$` block in `front-door/default.conf`. Same ConfigMap for the
      # same reason as the nine above, and unlike them it is not conditional
      # on any category having mirrored tools, so it is always present.
      #
      # **Stored gzipped since 2026-09-24** — ~15 KB plain, ~5 KB on disk. It
      # was the largest key here not already compressed that does not grow
      # with the catalogue the way `llms.txt` and the category pages do, so
      # compressing it was the one-key fix for `depop-fee-calculator` and
      # `hidden-unicode-check` graduating in the same window taking
      # `portfolio-front-html` to 945,123 bytes against the 943,718-byte
      # budget in `gitops/tests/test_manifests.py`. See `aboutStoredKey` in
      # `platform/marketing/front-door.mjs`.
      #
      # A `.gz` key is not valid UTF-8, so kustomize files it under
      # `binaryData` as base64. The URL is unchanged: nginx still answers
      # `/about/`, via `gzip_static always; gunzip on;` and a `rewrite`, never
      # a `try_files` — the `location = /catalog.json` block's comment in
      # `front-door/default.conf` carries the long version of why.
      - about.html.gz=front-door/about.html.gz
  # Second half of the front door's document root, split out of
  # `portfolio-front-html` on 2026-10-04. That object was 48 bytes under the
  # 943,718-byte etcd budget in `gitops/tests/test_manifests.py`, so every new
  # venture (~690 bytes of card, catalog and llms.txt entries) failed it until
  # someone trimmed text elsewhere. The keys that grow with the catalogue --
  # sitemap, llms.txt, catalog.json, the comparison index and every `vs__` page
  # -- live here instead; `portfolio-front.yaml` mounts both as one projected
  # volume at the same path, so no URL changes. Two ConfigMaps cannot mount at
  # one `mountPath`, but one projected volume can merge them.
  - name: portfolio-front-html-index
    options:
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
    files:
      # The sitemap `robots.txt` above points at.
      #
      # **Stored gzipped since 2026-09-23**, same reason and same mechanism as
      # `catalog.json.gz` below: it is almost pure repeated
      # `<url><loc>…</loc></url>` structure, one entry per published page, so
      # it is both the fastest-growing key in this ConfigMap and the one that
      # compresses hardest — gzip -9 took it from 137,891 bytes to 14,679, about
      # a ninth, before the 4/3 base64 expansion `binaryData` imposes. It was
      # the key that took the object over the 943,718-byte budget in
      # `gitops/tests/test_manifests.py` that day (944,243 bytes, over by 525).
      # See `sitemapStoredKey` in `platform/marketing/front-door.mjs`.
      #
      # A `.gz` key is not valid UTF-8, so kustomize files it under
      # `binaryData` as base64. The URL is unchanged: nginx still answers
      # `/sitemap.xml`, via `gzip_static always; gunzip on;` and *no*
      # `try_files`, for the identical reason `catalog.json`'s entry below
      # gives — `try_files` stats the uncompressed name and there is no
      # longer a plain sibling on disk. The `location = /sitemap.xml` block in
      # `front-door/default.conf` carries the long version of that trap.
      - sitemap.xml.gz=front-door/sitemap.xml.gz
      # `llms.txt`, the AI-discovery counterpart to the feed.
      #
      # **Stored gzipped since 2026-09-24**, same reason and same mechanism as
      # `sitemap.xml.gz` above and `catalog.json.gz` below: it is one of the
      # keys that grows with the catalogue, and it was the key that took the
      # object over the 943,718-byte budget in
      # `gitops/tests/test_manifests.py` that day (945,297 bytes, over by
      # 1,579 — measured with `main` itself already 109 bytes over budget
      # before this session's venture existed). See `llmsStoredKey` in
      # `platform/marketing/front-door.mjs`.
      #
      # A `.gz` key is not valid UTF-8, so kustomize files it under
      # `binaryData` as base64. The URL is unchanged: nginx still answers
      # `/llms.txt`, via `gzip_static always; gunzip on;` and *no*
      # `try_files`, for the identical reason `sitemap.xml`'s entry above
      # gives — `try_files` stats the uncompressed name and there is no
      # longer a plain sibling on disk. The `location = /llms.txt` block in
      # `front-door/default.conf` carries the long version of that trap.
      - llms.txt.gz=front-door/llms.txt.gz
      # `catalog.json`, the structured counterpart to `llms.txt` — the same
      # tools as JSON for a client that filters rather than reads. Same reason
      # again for riding here, with one extra: `llms.txt` above links it, so
      # shipping that file without this one would publish a document pointing
      # at a path the catch-all answers with the front page.
      #
      # **Stored gzipped since 2026-09-12.** It was the largest key in this
      # ConfigMap and the fastest-growing one — 148,099 bytes plain for 269
      # tools, gaining ~550 with every venture — and on that day it took the
      # built object to 943,974 bytes against the 943,718-byte budget in
      # `gitops/tests/test_manifests.py`. Over that budget is not a degraded
      # document, it is the whole `prod` Application: the hashed ConfigMap name
      # `portfolio-front.yaml` mounts never gets created, new pods sit in
      # ContainerCreating, and Argo reports Degraded.
      #
      # A `.gz` key is not valid UTF-8, so kustomize files it under
      # `binaryData` as base64 — the 4/3 expansion the ceiling tests already
      # model. The URL is unchanged: nginx still answers `/catalog.json`, via
      # `gzip_static always; gunzip on;` and *no* `try_files`, because
      # `try_files` stats the uncompressed name and there is no longer a plain
      # sibling on disk. The `location = /catalog.json` block in
      # `front-door/default.conf` carries the long version of that trap.
      - catalog.json.gz=front-door/catalog.json.gz
      # The comparison index, served from the document root by the
      # `^/compare/?$` block in `front-door/default.conf`. Same ConfigMap for
      # the same reason as everything above it.
      #
      # **Stored gzipped** — ~95 KB of HTML on 2026-09-05, ~20 KB on disk. It
      # was the second-largest key here after `c__trades.html`, and the one
      # that grows without anybody deciding to grow it: it lists every
      # `vs-<product>` page in the catalogue, so the fleet adds ~570 bytes to
      # it with each one written. See the block on the product pages below for
      # the measurement, and `COMPRESSED_SUFFIX` in
      # `platform/marketing/front-door.mjs` for why only these keys are
      # compressed and what nginx needs in order to serve them.
      - compare.html.gz=front-door/compare.html.gz
      # One page per product compared by more than one tool, served from the
      # document root by the `^/compare/(?<vs>…)/?$` block in
      # `front-door/default.conf`. Same ConfigMap for the same reason as
      # everything above it.
      #
      # These exist because `compare.html` above is one URL carrying every
      # comparison in the catalogue: its title has to be true of ~120 products
      # at once, so it competes for "Jobber alternatives" against pages that
      # are about nothing else, and the thirty-two Jobber comparisons were an
      # anchor part-way down a 95 KB document. Each of these is about one
      # product and nothing else.
      #
      # **Stored gzipped**, unlike every other key in this ConfigMap, and so is
      # `compare.html.gz` above. These are the largest and fastest-growing
      # things here — 226 KB uncompressed, the largest being `vs__jobber.html`
      # at ~30 KB for 32 tools, and 80 KB of that total is one identical copy
      # of `STYLE` per page. `COMPRESSED_SUFFIX` in
      # `platform/marketing/front-door.mjs` carries the full reasoning; the
      # short version is that plain they cost 81.3% of etcd's 1 MiB ceiling and
      # gzipped they cost 60.3%.
      #
      # Measured, not estimated, on 2026-09-05: `portfolio-front-html`
      # serialises to 631,774 bytes against a 943,718-byte test budget — 312 KB
      # of headroom, where the same fourteen pages stored plain left 91 KB.
      # `gitops/tests/test_manifests.py` measures the built object against 90%
      # of the cap and the ceiling test in `front-door.test.mjs` reads this
      # file's own list, so neither can grow past unnoticed.
      #
      # A `.gz` key is not valid UTF-8, so kustomize files it under
      # `binaryData` as base64 — the 4/3 expansion the ceiling tests already
      # model for the tool mirror. nginx serves them with `gzip_static always;
      # gunzip on;` reached by a `rewrite`, never a `try_files`: the plain name
      # is on disk nowhere, so `try_files` would stat a missing file and 404
      # the whole comparison layer behind a config that reads correctly.
      #
      # Listed one line per file rather than generated, matching the eight
      # `c__<id>.html` pages above, and with the same guard: `front-door.mjs`
      # sweeps a `vs__*.html.gz` whose product drops below two comparisons, and
      # `front-door.test.mjs` asserts this list against what the generator
      # writes — so a product page added without a line here fails CI instead
      # of going dark, and one removed without deleting its line fails here
      # instead of leaving kustomize pointing at a file that is gone.
      - vs__jobber.html.gz=front-door/vs__jobber.html.gz
      - vs__servicetitan.html.gz=front-door/vs__servicetitan.html.gz
      - vs__aspire.html.gz=front-door/vs__aspire.html.gz
      - vs__buildxact.html.gz=front-door/vs__buildxact.html.gz
      - vs__jobnimbus.html.gz=front-door/vs__jobnimbus.html.gz
      - vs__quoteiq.html.gz=front-door/vs__quoteiq.html.gz
      - vs__acculynx.html.gz=front-door/vs__acculynx.html.gz
      - vs__housecall-pro.html.gz=front-door/vs__housecall-pro.html.gz
      - vs__bonsai.html.gz=front-door/vs__bonsai.html.gz
      - vs__govwin-iq.html.gz=front-door/vs__govwin-iq.html.gz
      - vs__jobtread.html.gz=front-door/vs__jobtread.html.gz
      - vs__paintscout.html.gz=front-door/vs__paintscout.html.gz
      - vs__servicecore.html.gz=front-door/vs__servicecore.html.gz
      - vs__servicemonster.html.gz=front-door/vs__servicemonster.html.gz
      - vs__crest-capital-s-lease-calculator.html.gz=front-door/vs__crest-capital-s-lease-calculator.html.gz
      - vs__workiz.html.gz=front-door/vs__workiz.html.gz
      - vs__accessibe.html.gz=front-door/vs__accessibe.html.gz
      - vs__openssf-scorecard.html.gz=front-door/vs__openssf-scorecard.html.gz
      - vs__socket.html.gz=front-door/vs__socket.html.gz
      - vs__zizmor.html.gz=front-door/vs__zizmor.html.gz
      - vs__pestpac.html.gz=front-door/vs__pestpac.html.gz
      - vs__booqable.html.gz=front-door/vs__booqable.html.gz
      - vs__screaming-frog-seo-spider.html.gz=front-door/vs__screaming-frog-seo-spider.html.gz
      - vs__cookiebot.html.gz=front-door/vs__cookiebot.html.gz
      - vs__spreadsheet.html.gz=front-door/vs__spreadsheet.html.gz
      - vs__honeybook.html.gz=front-door/vs__honeybook.html.gz
      - vs__flat-rate-per-square-foot.html.gz=front-door/vs__flat-rate-per-square-foot.html.gz
      - vs__gitleaks.html.gz=front-door/vs__gitleaks.html.gz
      - vs__doing-it-by-hand.html.gz=front-door/vs__doing-it-by-hand.html.gz
      - vs__tracking-payouts-in-a-spreadsheet.html.gz=front-door/vs__tracking-payouts-in-a-spreadsheet.html.gz
      - vs__tracking-it-in-a-spreadsheet.html.gz=front-door/vs__tracking-it-in-a-spreadsheet.html.gz
      - vs__flat-day-rate.html.gz=front-door/vs__flat-day-rate.html.gz
      - vs__flat-price-per-square-foot.html.gz=front-door/vs__flat-price-per-square-foot.html.gz
      - vs__flat-price-per-window.html.gz=front-door/vs__flat-price-per-window.html.gz
      - vs__doing-the-math-yourself.html.gz=front-door/vs__doing-the-math-yourself.html.gz
      - vs__checking-by-hand.html.gz=front-door/vs__checking-by-hand.html.gz
      - vs__flat-per-acre-quote.html.gz=front-door/vs__flat-per-acre-quote.html.gz
      - vs__reading-a-dockerfile-by-hand.html.gz=front-door/vs__reading-a-dockerfile-by-hand.html.gz
      - vs__flat-rate-per-lineal-foot.html.gz=front-door/vs__flat-rate-per-lineal-foot.html.gz
      - vs__reading-the-workflow-yaml-by-hand.html.gz=front-door/vs__reading-the-workflow-yaml-by-hand.html.gz
      - vs__checking-headers-by-eye-in-devtools.html.gz=front-door/vs__checking-headers-by-eye-in-devtools.html.gz
      - vs__checking-it-by-eye.html.gz=front-door/vs__checking-it-by-eye.html.gz
      - vs__mcp-scan.html.gz=front-door/vs__mcp-scan.html.gz
      - vs__assembling-one-by-hand-in-a-document-editor.html.gz=front-door/vs__assembling-one-by-hand-in-a-document-editor.html.gz
      - vs__reviewing-workflows-by-eye.html.gz=front-door/vs__reviewing-workflows-by-eye.html.gz
  - name: portfolio-front-nginx
    files:
      - default.conf=front-door/default.conf
      # The generated `map` that resolves an aliased mirror key to the one
      # stored copy of its bytes. Ventures ship their own copies of the shared
      # helpers, so the flattened mirror held `proposal.mjs` 104 times and
      # `LICENSE` 161 times identically; `dedupeMirror` in
      # `platform/marketing/front-door-tools.mjs` now stores one of each and
      # this map points the other names at it, which is 1,186,041 stored bytes
      # (18.5% of the mirror) recovered from git, etcd and both replicas' tmpfs.
      #
      # It rides in *this* ConfigMap rather than in `front-door-tools/` because
      # it is configuration for nginx, not content nginx serves, and it has to
      # land in `/etc/nginx/conf.d` beside the `default.conf` whose six asset
      # `location` blocks read `$fd_stored`. Both files are regenerated by
      # `node platform/marketing/front-door-tools.mjs --write`; a stale one
      # fails `front-door-tools.test.mjs`.
      #
      # Ordering inside `conf.d` does not matter: `map` is an http-context
      # directive and nginx resolves the variable at request time, so the map
      # may be parsed after the server block that uses it.
      - 00-mirror-alias.conf=front-door/00-mirror-alias.conf
# `front-door-tools/` in the resource list above is the mirrored tools the apex
# serves itself, so the front door's cards lead somewhere while
# `portfolio-site-repo` is unsealed. It is a nested kustomization rather than
# another generator here because its file list is generated, one line per
# mirrored file — regenerate the directory and its kustomization together with:
#   node platform/marketing/front-door-tools.mjs --write
# `platform/marketing/front-door-tools.test.mjs` fails if the commit is stale.
# `secrets/portfolio-repo-token.sealed.yaml` joins the resource list once the
# owner has sealed the read-only clone token — see secrets/*.template.yaml.
# Until then the site's `fetch` init container fails closed. The apex does not
# wait on it: `portfolio-front.yaml` serves marisstella.dev from the ConfigMap
# generated above, with nothing sealed.
