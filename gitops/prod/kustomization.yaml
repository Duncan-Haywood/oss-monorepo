apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - quota.yaml
  - networkpolicy.yaml
  - landing.yaml
  - portfolio-site.yaml
  - portfolio-front.yaml
  - portfolio-apex.yaml
  - site-usage.yaml
  - front-door-tools/
configMapGenerator:
  - name: portfolio-site-usage-script
    files:
      - aggregate.py=usage/aggregate.py
    options:
      # No content hash. The CronJob in `site-usage.yaml` names this ConfigMap
      # directly, so a hashed name would leave it referring to an object that
      # no longer exists. Nothing long-running mounts it, so editing the script
      # does not need to roll anything — the next scheduled run picks it up.
      #
      # This used to be a namespace-wide `generatorOptions:` block at the foot
      # of this file. It moved here on 2026-09-02, when the front door below
      # became the first generated ConfigMap that a Deployment mounts: a global
      # `disableNameSuffixHash: true` cannot be overridden back to `false` by a
      # per-generator `options` (kustomize 5.4 merges the two, and a `false`
      # there is indistinguishable from unset), so the only way to have both
      # behaviours in one kustomization is to state the exception per generator
      # rather than globally. Verified with `kustomize build gitops/prod`:
      # this one stays bare, the two below carry hashes.
      disableNameSuffixHash: true
  # The apex front door: one generated page and the nginx config that serves
  # it. Both take the content hash, because a long-running Deployment mounts
  # them and a change has to produce a new ConfigMap name for the rollout to
  # happen at all. Without it a regenerated page would sit in the ConfigMap
  # while both pods went on serving the old one until something unrelated
  # restarted them.
  #
  # Regenerate the page with:
  #   node platform/marketing/front-door.mjs --write
  # `platform/marketing/front-door.test.mjs` fails if the commit is stale.
  #
  # The `sync-options` below is not optional decoration, and this generator
  # crossed the line that makes it load-bearing when `catalog.json` joined the
  # set: the serialised ConfigMap went from ~226 KB to ~314 KB, past the
  # 262144-byte cap the API server puts on an object's annotations. Argo CD
  # applies client-side by default, which copies the whole object into
  # `kubectl.kubernetes.io/last-applied-configuration` — so without this the
  # apply fails with `metadata.annotations: Too long`, the hashed ConfigMap
  # `portfolio-front.yaml` mounts is never created, the new pods sit in
  # ContainerCreating, and `maxUnavailable: 0` leaves the *old* front door
  # serving while `prod` stays permanently Degraded. Server-side apply writes
  # no such annotation and is bounded only by etcd's 1 MiB.
  #
  # Same reasoning and same option as every shard in `front-door-tools/`, which
  # crossed the same line first;
  # `gitops/tests/test_manifests.py::test_a_configmap_too_large_for_client_side_apply_asks_for_server_side`
  # is what fails if a future generator crosses it without saying so.
  - name: portfolio-front-html
    options:
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
    files:
      - index.html=front-door/index.html
      # The page's own `og:image`. Not valid UTF-8, so kustomize puts it under
      # `binaryData` rather than `data` and the kubelet writes the decoded
      # bytes into the volume — the file nginx serves is the PNG, not its
      # base64. It rides in this ConfigMap rather than a second one because
      # two ConfigMaps cannot mount at one `mountPath`, and the card has to
      # sit at the document root beside `index.html` for `/social-card.png`
      # to resolve. ~6 KB base64'd against a 1 MiB object ceiling.
      - social-card.png=front-door/social-card.png
      # The tab mark the page declares with `rel="icon"`. Text, so it lands in
      # `data` rather than `binaryData`, and a few hundred bytes either way.
      # Same reason as the card for riding in this ConfigMap: it has to sit at
      # the document root for `/favicon.svg` to resolve.
      - favicon.svg=front-door/favicon.svg
      # The crawler handshake. Both ride in this ConfigMap for the same reason
      # the card and the icon do: they have to sit at the document root for
      # `/robots.txt` and `/sitemap.xml` to resolve, and two ConfigMaps cannot
      # mount at one `mountPath`. Text, so both land in `data`. Under a
      # kilobyte together against a 1 MiB object ceiling.
      - robots.txt=front-door/robots.txt
      - sitemap.xml=front-door/sitemap.xml
      # The apex's own Atom feed over the mirrored tools. Same reason as the
      # three above for riding in this ConfigMap: the page declares it at
      # `/feed.xml` in `<link rel="alternate">` and links it from the footer,
      # so it has to sit at the document root, and two ConfigMaps cannot mount
      # at one `mountPath`. Text, so it lands in `data`. A few kilobytes
      # against a 1 MiB object ceiling.
      - feed.xml=front-door/feed.xml
      # `llms.txt`, the AI-discovery counterpart to the feed. Same reason again
      # for riding here: a well-known path has to resolve at the document root.
      - llms.txt=front-door/llms.txt
      # `catalog.json`, the structured counterpart to `llms.txt` — the same
      # tools as JSON for a client that filters rather than reads. Same reason
      # again for riding here, with one extra: `llms.txt` above links it, so
      # shipping that file without this one would publish a document pointing
      # at a path the catch-all answers with the front page. The largest single
      # key in this ConfigMap at ~88 KB; `front-door.test.mjs` holds the whole
      # generated set under the 1 MiB object ceiling so this cannot grow past
      # it unnoticed.
      - catalog.json=front-door/catalog.json
      # The embed runtime and its stylesheet, generated from
      # `platform/pages/embed.mjs` by `front-door.mjs --write`. Same reason
      # again for riding here: every mirrored entry page links them absolutely
      # at `/pf-embed.js` and `/pf-embed.css`, so they have to sit at the
      # document root, and two ConfigMaps cannot mount at one `mountPath`.
      #
      # These are the only keys in this ConfigMap that a *mirrored* page
      # references rather than the front page — the mirror's shards mount
      # elsewhere, but the browser resolves these two against the document
      # root, which is this volume. Shipping the mirror without them would
      # serve 173 pages whose embed box is unstyled and whose copy button is
      # dead. ~4 KB together; `front-door.test.mjs` holds the whole generated
      # set under the 1 MiB object ceiling.
      - pf-embed.js=front-door/pf-embed.js
      - pf-embed.css=front-door/pf-embed.css
      # The resizer, which is here for a different reason than the two above:
      # no page on this host links it at all. It is named by the `<script src>`
      # in the embed snippet each of the 173 entry pages offers for copying, so
      # it is fetched from a stranger's site or not at all. Absent from this
      # ConfigMap, every published snippet's second line 404s and every embed
      # silently stays at its fallback height -- a failure with no symptom
      # anywhere we can see it.
      - pf-embed-host.js=front-door/pf-embed-host.js
      # The seven category browse pages. Same reason as everything above for
      # riding in this ConfigMap: they are served from the document root (the
      # `^/c/(?<cat>…)/?$` block in `front-door/default.conf` rewrites
      # `/c/trades/` to `/c__trades.html`), and two ConfigMaps cannot mount at
      # one `mountPath`.
      #
      # Listed one line per file rather than generated, unlike `front-door-tools/`,
      # because the set is seven and changes only when a category gains or
      # loses its last mirrored tool — a generated nested kustomization would
      # be more machinery than the thing it manages. `front-door.test.mjs`
      # asserts this list against what the generator writes, so a category
      # added without a line here fails CI rather than going dark.
      #
      # ~136 KB together, the largest being `c__trades.html` at ~55 KB for 116
      # tools. Measured with `kustomize build gitops/prod`, the serialised
      # object goes from ~350 KB to 487 KiB against the 1 MiB ceiling; the
      # ceiling test in `front-door.test.mjs` covers the whole generated set,
      # so this cannot grow past it unnoticed.
      #
      # Well past the 262144-byte annotation cap that makes the
      # `ServerSideApply=true` above load-bearing rather than decoration —
      # these seven keys roughly double the margin by which that is true.
      - c__trades.html=front-door/c__trades.html
      - c__evidence.html=front-door/c__evidence.html
      - c__marketplace.html=front-door/c__marketplace.html
      - c__backoffice.html=front-door/c__backoffice.html
      - c__services.html=front-door/c__services.html
      - c__logistics.html=front-door/c__logistics.html
      - c__more.html=front-door/c__more.html
      # The About and press-kit page, served from the document root by the
      # `^/about/?$` block in `front-door/default.conf`. Same ConfigMap for the
      # same reason as the seven above; ~9 KB, and unlike them it is not
      # conditional on any category having mirrored tools, so it is always
      # present.
      - about.html=front-door/about.html
  - name: portfolio-front-nginx
    files:
      - default.conf=front-door/default.conf
# `front-door-tools/` in the resource list above is the mirrored tools the apex
# serves itself, so the front door's cards lead somewhere while
# `portfolio-site-repo` is unsealed. It is a nested kustomization rather than
# another generator here because its file list is generated, one line per
# mirrored file — regenerate the directory and its kustomization together with:
#   node platform/marketing/front-door-tools.mjs --write
# `platform/marketing/front-door-tools.test.mjs` fails if the commit is stale.
# `secrets/portfolio-repo-token.sealed.yaml` joins the resource list once the
# owner has sealed the read-only clone token — see secrets/*.template.yaml.
# Until then the site's `fetch` init container fails closed. The apex does not
# wait on it: `portfolio-front.yaml` serves marisstella.dev from the ConfigMap
# generated above, with nothing sealed.
