# The public site's usage signal: one integer per tool per day.
#
# WHY THIS EXISTS
#
# `portfolio/DIRECTION.md` makes usage the metric while everything ships free,
# and every reading in `portfolio/usage/usage.yaml` is still `null`. That is
# usually explained by "nothing is live yet", but publishing the site would not
# on its own change it. Every venture's `usage.mjs` counts into the visitor's
# own `localStorage` and deliberately never transmits — correct for a
# contractor's pricing, and it means the portfolio would go on learning nothing
# about which of its 168 tools anyone opens.
#
# nginx already receives every request. The whole mechanism here is: log three
# fields instead of nginx's default nine (see the `log_format privacy` block in
# `portfolio-site.yaml`), then reduce a day of those lines to a count.
#
# WHAT IT COLLECTS
#
# Page views per tool per UTC day, and nothing else. The upstream log line
# carries no client address, no user agent, no referrer and no query string, so
# there is no personal field for this job to discard — none is ever written.
# `portfolio/usage/README.md` rule 1 is "count events, never people"; this is
# that rule enforced by what nginx is configured to remember rather than by a
# promise about what happens afterwards.
#
# The result is a JSON blob in the `portfolio-site-usage` ConfigMap holding the
# last 30 days. Read it with:
#
#   kubectl -n prod get configmap portfolio-site-usage -o jsonpath='{.data.usage\.json}'
#
# and copy the numbers that matter into `portfolio/usage/usage.yaml`, which is
# what the router and the next session read. That last hop is manual on
# purpose: writing to this repository from inside the cluster would need a
# GitHub token with write access, and `gitops/README.md` keeps write
# credentials out of `prod`.
---
# Seeded empty so the CronJob's Role can be narrowed to `update` on a
# ConfigMap that already exists — `create` cannot be restricted by name, and
# this job has no business creating anything.
#
# Argo must not sync `/data` back over the counts on the next reconcile; the
# `ignoreDifferences` entry in `gitops/apps/prod.yaml` is what prevents that,
# the same way `governor-state` is protected in the agents Application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-site-usage
data:
  usage.json: |
    {
      "schema": 1,
      "note": "Seeded empty. Populated nightly by the portfolio-site-usage CronJob.",
      "days": {}
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-site-usage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-site-usage
rules:
  # Pod names change on every rollout, so the log read cannot be narrowed by
  # name the way the refresh Role is. It is narrowed the two ways that remain:
  # to this namespace, and to reading only. `prod` holds this site and the
  # placeholder landing page, neither of which logs anything about a person
  # once the format above is in place.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The one thing it may write, by name. No create, no delete, nothing else in
  # the namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["portfolio-site-usage"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-site-usage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portfolio-site-usage
subjects:
  - kind: ServiceAccount
    name: portfolio-site-usage
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: portfolio-site-usage
spec:
  # 00:31 UTC: yesterday has just closed, and the 25-hour log window the job
  # asks for still reaches back past its first second. The job counts by the
  # date written in each line rather than by that window, so a late or retried
  # run records the same row instead of a doubled one.
  schedule: "31 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: portfolio-site-usage
          nodeSelector:
            hcloud/node-role: control-plane
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: aggregate
              image: python:3.12-slim-bookworm
              command: ["python3", "/opt/usage/aggregate.py"]
              env:
                - name: USAGE_NAMESPACE
                  value: prod
                - name: USAGE_SELECTOR
                  value: app=portfolio-site
                - name: USAGE_CONTAINER
                  value: nginx
                - name: USAGE_CONFIGMAP
                  value: portfolio-site-usage
              volumeMounts:
                - name: script
                  mountPath: /opt/usage
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # aggregate.py imports only the standard library, so there is no
              # install step and the whole run is one pass over a day of log
              # lines held as strings. A day of traffic this site could
              # plausibly see is a few MB.
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: portfolio-site-usage-script
                defaultMode: 0555
