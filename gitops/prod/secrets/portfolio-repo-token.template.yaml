# Template only — not applied, and not referenced by kustomization.yaml.
#
# Easier: `./bootstrap/scripts/seal-owner-secrets.sh site` does everything
# below, checks the token's scope against the GitHub API first, and never puts
# a live value in a file. The manual steps stay here because they are what it
# automates, and because reading them is how you check what it did.
#
# By hand: replace CHANGE_ME, seal it, commit the SealedSecret beside this file.
#
# This exists because the repository is private, so the `fetch` init container
# in ../portfolio-site.yaml cannot clone anonymously. It is the only secret
# the public site needs.
#
# Mint it as a FINE-GRAINED personal access token, not a classic one:
#
#   Repository access : only Duncan-Haywood/monorepo-projects
#   Permissions       : Contents -> Read-only     (nothing else)
#   Expiration        : 90 days is plenty; the CronJob will start failing
#                       loudly when it lapses, which is the reminder.
#
# Read-only on contents is genuinely all it can do: it cannot push, cannot
# open or merge a pull request, cannot read Actions secrets, and cannot reach
# any other repository. If it leaked, the blast radius is a copy of source
# that is already being served publicly as a built site.
#
# Seal and commit:
#
#   kubeseal --format yaml \
#     --controller-namespace sealed-secrets \
#     --controller-name sealed-secrets \
#     < portfolio-repo-token.template.yaml \
#     > portfolio-repo-token.sealed.yaml
#
# --controller-name matters here: kubeseal defaults to
# "sealed-secrets-controller", but ../../apps/sealed-secrets.yaml deploys the
# Helm chart as an Argo Application named "sealed-secrets" with no
# releaseName override, so the controller's actual Service in this cluster is
# named "sealed-secrets" (Argo's release name defaults to the Application
# name). The default kubeseal invocation 404s looking up a Service that does
# not exist, before it seals anything.
#
# then add `secrets/portfolio-repo-token.sealed.yaml` to ../kustomization.yaml.
# Never commit this file with a real token in it.
apiVersion: v1
kind: Secret
metadata:
  name: portfolio-site-repo
  namespace: prod
type: Opaque
stringData:
  token: CHANGE_ME
