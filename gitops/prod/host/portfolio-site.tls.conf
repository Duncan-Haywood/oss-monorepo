# Portfolio site, host mode -- the served server block.
#
# Installed by `bootstrap/scripts/install-portfolio-site-host.sh --tls` once a
# certificate exists. This is the configuration a visitor actually reaches:
# `.dev` is HSTS-preloaded in every mainstream browser, so port 80 is only ever
# a redirect and an ACME challenge path, and everything real happens on 443.
#
# Placeholders (same doubled-at-sign convention) are substituted by the
# installer; see the note in
# portfolio-site.http.conf about the test that enforces that.

server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAME@@;

    # Renewal re-runs an HTTP-01 challenge every 60 days, and it must work on a
    # box whose certificate has already expired. If this location sat below the
    # redirect, an expired cert would make renewal unreachable through the very
    # server that needs renewing -- the failure would be self-sealing. `^~`
    # stops nginx considering the regex-free prefix below it.
    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_WEBROOT@@;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @@SERVER_NAME@@;

    ssl_certificate     @@CERT_FULLCHAIN@@;
    ssl_certificate_key @@CERT_PRIVKEY@@;

    # TLS 1.2 is kept because it costs nothing here and some link-preview and
    # feed-reader clients still negotiate it; everything below 1.2 is refused.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:portfolio_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root @@WEBROOT@@;
    index index.html;

    absolute_redirect off;
    port_in_redirect off;

    charset utf-8;
    charset_types text/css application/javascript text/plain application/atom+xml image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript text/plain application/atom+xml application/xml text/xml image/svg+xml application/json;

    # See the long note on the same block in portfolio-site.http.conf: nginx's
    # stock mime.types has no `.mjs` entry, and a browser refuses an ES module
    # served as application/octet-stream, so without this every calculator on
    # the site is inert while every request still returns 200.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;

        # `add_header` does not inherit into a location that sets any of its
        # own, so the full set is repeated here rather than declared once at
        # server level. That is the same rule gitops/prod/portfolio-site.yaml
        # keeps, and for the same reason: a future location block that adds one
        # header must not silently drop the other four.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Served only over TLS, so the max-age commits nothing the preload list
        # has not already committed for every `.dev` name. No `preload`
        # directive: that is a submission to a browser-vendor list, which is
        # exactly the kind of outward publication that stays the owner's
        # decision -- and the TLD's own preload entry already covers this host.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
