# Portfolio site, host mode -- the pre-TLS server block.
#
# This is what `bootstrap/scripts/install-portfolio-site-host.sh` installs on a
# box that has no certificate yet. It does two jobs: serve the ACME HTTP-01
# challenge so a certificate can be obtained, and serve the site over plain
# HTTP so the install can be verified with `curl` before anything is public.
#
# It is NOT the config this domain runs on long-term. `marisstella.dev` is a
# `.dev` name, and the whole `.dev` TLD ships in the browsers' HSTS preload
# list, so every mainstream browser rewrites http:// to https:// before it
# ever opens a socket. A visitor cannot reach this server block at all. That
# is why `--tls` exists and why the installer says so rather than reporting a
# clean HTTP install as if it were a serving site: an owner who stopped here
# would have curl working, the site "up", and every real browser refusing it.
#
# Placeholders are substituted by the installer; each is an upper-case name
# wrapped in doubled at-signs. The test
# `gitops/tests/test_portfolio_site_host.py` fails if a template ever carries
# one the installer does not substitute, so adding a placeholder here without
# teaching the installer about it cannot ship silently.

server {
    listen 80;
    listen [::]:80;
    server_name @@SERVER_NAME@@;

    root @@WEBROOT@@;
    index index.html;

    # Absolute paths only in redirects. `try_files` below can rewrite to a
    # directory, and without this nginx would answer that with an absolute
    # redirect naming the internal port rather than the request's own host.
    absolute_redirect off;
    port_in_redirect off;

    charset utf-8;
    charset_types text/css application/javascript text/plain application/atom+xml image/svg+xml;

    # The ACME HTTP-01 challenge. Kept above every other location and served
    # with no added headers and no redirect, because the CA fetches it as a
    # plain unconditional GET. This block stays present in the TLS config too
    # -- renewal re-runs the same challenge every 60 days, and a redirect to
    # HTTPS on a box whose certificate has expired is a renewal that cannot
    # recover itself.
    location ^~ /.well-known/acme-challenge/ {
        root @@ACME_WEBROOT@@;
        default_type "text/plain";
        access_log off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript text/plain application/atom+xml application/xml text/xml image/svg+xml application/json;
    # The build writes plain files, not pre-compressed shards (that is the tool
    # *mirror*'s trick in gitops/prod/front-door, which this path does not use
    # -- it serves build.mjs's dist directly). So gzip_static has nothing to
    # find here and compression happens on the fly, above.

    # nginx's stock mime.types carries no `.mjs` entry (checked against
    # 1.24.0's own file), so without this block every module is served as
    # application/octet-stream -- and a browser REFUSES to execute a
    # `<script type="module">` whose response has a non-JavaScript MIME type,
    # rather than merely mistyping it. Every tool page here loads
    # `pf-invalid.mjs` that way, plus each venture's own calc/share/proposal/
    # usage modules, so the failure mode is: 200 on every request, and every
    # calculator on the site silently inert. Measured on this artifact before
    # this block existed.
    #
    # `types { }` plus `default_type`, not a populated `types` block, because a
    # populated one REPLACES the inherited map for this location instead of
    # extending it -- the same idiom and the same reasoning as the `.mjs` block
    # in gitops/prod/front-door/default.conf.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Same routing rule as the in-cluster site (gitops/prod/portfolio-site.yaml,
    # `location /`): a bare path, then the directory, then the `.html` file of
    # that name. `=404` rather than a fallback to index.html -- this is a
    # catalogue of separate documents, not a single-page app, and silently
    # answering a mistyped tool URL with the front page would make a dead link
    # look alive to a crawler.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
