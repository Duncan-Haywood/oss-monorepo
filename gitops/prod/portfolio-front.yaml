# The workload behind `marisstella.dev` and `www.marisstella.dev`.
#
# WHY THIS EXISTS
#
# `portfolio-apex.yaml` claimed both names on 2026-08-28 and answered them
# with a 301 to `https://tools.marisstella.dev/`. Every word of its reasoning
# still holds — one canonical host, one indexed copy of the 524 tool pages —
# and it has nonetheless spent its whole life redirecting strangers into a
# hostname that serves nothing, because `portfolio-site.yaml`'s pods fail
# closed on the unsealed Secret `portfolio-site-repo`.
# `platform/ci/publish_surface.py --check` prints exactly that dead end:
#
#   + https://marisstella.dev/       301s to https://tools.marisstella.dev/,
#   + https://www.marisstella.dev/   which is waiting on Secret
#                                    portfolio-site-repo.
#   No stranger can reach content yet, despite the hosts marked + above.
#
# This Deployment is what those two names answer with instead: a generated
# front-door page describing the collection, served from a ConfigMap.
#
# WHY IT NEEDS NOTHING SEALED
#
# That is the entire point. The page is committed at
# `gitops/prod/front-door/index.html`, kustomize reads it into a ConfigMap,
# and Argo CD — which already holds this repository's credentials to sync
# `gitops/` at all — applies it. No clone at pod start, so no token; no
# GitHub Actions run, so no runner; no Pages flip. A merge to `main` is the
# deploy, and the owner does nothing.
#
# It is 11 KB, so the 1 MiB ConfigMap ceiling that makes this impossible for
# the 34 MB tool site (measured 2026-09-01, and re-measured 2026-08-31 at
# 14.4 MB gzipped) is not a constraint here.
#
# WHY IT IS NOT A SECOND COPY OF THE SITE
#
# `portfolio-apex.yaml` warns at length against serving the same bytes on
# three hostnames: `build.mjs` stamps one canonical host into all 544 pages,
# and a duplicate in front of a crawler undoes that consolidation. This page
# is a different document — positioning, seven category cards, the two §5b
# clauses — with its own canonical (`https://marisstella.dev/`) and no
# per-tool listing at all. `platform/marketing/front-door.test.mjs` pins both
# halves of that: the canonical, and the absence of any tool URL.
#
# WHAT HAPPENS WHEN THE CLONE TOKEN IS SEALED
#
# Nothing here changes and nothing here becomes dead weight. The apex keeps
# serving the front door, the call-to-action links start working, and the
# tools host serves the catalogue it was always meant to. If a later session
# would rather consolidate the apex onto the hub after all, the rollback is
# `portfolio-apex.yaml`'s two redirect annotations and this file leaving
# `kustomization.yaml` — it holds no volume, no secret and no state.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-front
  labels:
    app: portfolio-front
spec:
  # Two, matching portfolio-site: this is the portfolio's front door, and a
  # single replica means an evicted pod takes the domain down for the length
  # of a reschedule. Both fit inside the prod ResourceQuota with room —
  # 20m/64Mi requested each against 4 CPU and 8Gi. (The request rose with the
  # memory limit when the tool mirror was sharded; see `resources` below for
  # why the mirror, not nginx, is what sizes this pod.)
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: portfolio-front
  template:
    metadata:
      labels:
        app: portfolio-front
    spec:
      nodeSelector:
        hcloud/node-role: control-plane
      priorityClassName: prod-high
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      # Same posture as `landing.yaml` and `portfolio-site.yaml`'s nginx:
      # `nginxinc/nginx-unprivileged` listens on 8080 as uid 101 with no root
      # step at any point, which is what lets the root filesystem stay
      # read-only below.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Named `nginx` to match the other two web workloads in this
        # namespace, so `kubectl logs -c nginx` means the same thing across
        # all of them.
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            # The mirrored tools, on their own path rather than merged into
            # `html`: the `location ~ ^/tools/` blocks in
            # `front-door/default.conf` set `root` to this directory. (The
            # original reason given here — "two ConfigMaps cannot mount at one
            # mountPath" — is true of a `configMap` volume and is exactly what
            # the `projected` volume below exists to work around; it is no
            # longer why these are separate. `html` and `tools` stay apart
            # because nginx routes them differently, not because it is forced.)
            - name: tools
              mountPath: /usr/share/nginx/tools
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # nginx-unprivileged writes its temp dirs and pid under /tmp —
            # the identical comment sits on portfolio-site.yaml's nginx
            # container — which is the reason the root filesystem can be
            # read-only.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # `/healthz` rather than `/`, so a probe every few seconds is not
          # written into the access log as a page view. The site's own nginx
          # makes the same split for the same reason.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          # Memory is sized by the mirror, not by nginx.
          #
          # A ConfigMap volume is tmpfs, and tmpfs pages are charged to the
          # pod's memory cgroup — so every byte of the projected `tools` volume
          # is resident in each replica and counts against this limit. nginx
          # itself serving static files is ~10 MiB.
          #
          # The mirror is 5.4 MB today — 174 tools, 65% of the 8 MiB
          # `MIRROR_BYTE_CEILING` (raised from 5 MiB by #2886, which also grew
          # the mirror from 53 tools) — so the 192Mi limit is 24x the ceiling
          # even once the mirror grows to fill it, well past the 2x floor
          # `test_portfolio_front_fits_the_prod_quota` enforces. The old 64Mi
          # predates the mirror having a ceiling worth the name and would have
          # been ~10 MiB from OOMKilling both replicas at full growth. Two pods
          # at these numbers are noise against the `prod` ResourceQuota
          # (4 CPU / 8Gi requested, 8 CPU / 16Gi limit).
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 192Mi
      volumes:
        - name: html
          # Projected so two ConfigMaps can share one mountPath: see the
          # `portfolio-front-html-index` generator in `kustomization.yaml`.
          # Kustomize rewrites both hashed names, so either one changing rolls
          # these pods.
          projected:
            sources:
              - configMap:
                # Generated by `kustomization.yaml` from
                # `front-door/index.html`, with the name suffix hash left ON
                # (the namespace-wide `generatorOptions` disables it) so that
                # regenerating the page rolls these pods. Without the hash a new
                # front door would sit in the ConfigMap while both pods went on
                # serving the old one until something unrelated restarted them.
                  name: portfolio-front-html
              - configMap:
                  name: portfolio-front-html-index
        - name: tools
          # A `projected` volume, and that is the whole reason the apex can
          # serve more than about twenty tools.
          #
          # etcd caps a stored object at 1 MiB. While the mirror was one
          # ConfigMap, that cap *was* the cap on the mirror: it had reached
          # 767,450 bytes — 93.7% of the ceiling the generator allowed itself —
          # with 20 of the 153 eligible ventures served, and the next
          # comparison page merged into a mirrored venture would have failed
          # the build with a message advising that a working tool be removed
          # from the live front door to make room.
          #
          # Several ConfigMaps merged into one directory have no such shared
          # cap. Each shard is bounded separately, the union is bounded by
          # `MIRROR_BYTE_CEILING`, and nothing downstream can tell: the keys
          # are `slug__file.gz` either way, they land in one flat directory
          # either way, and the `location` blocks in
          # `front-door/default.conf` name no venture.
          #
          # The keys gained their `.gz` when the mirror went gzip-only, which
          # is also why there are ten sources here rather than seven while the
          # mirror serves three times the tools. nginx serves the stored bytes
          # with `gzip_static always` and inflates them with `gunzip on` for a
          # client that did not ask for gzip; `front-door-tools.mjs`'s
          # compression section carries the measurements.
          #
          # The property that had to survive is the content hash. Kustomize's
          # name-reference transformer rewrites
          # `volumes[].projected.sources[].configMap.name` exactly as it
          # rewrites `volumes[].configMap.name`, so a changed shard still
          # produces a new pod spec and still rolls these pods — verified
          # against kustomize v5.6.0, the version `hetzner-gitops-ci.yml`
          # installs.
          #
          # Two failure modes to know about before editing this list:
          #
          #   * A duplicate key across two sources makes the volume fail to
          #     mount. `assertUniqueKeys` in `front-door-tools.mjs` proves
          #     there are none.
          #   * A source naming a ConfigMap no kustomization generates leaves
          #     the pods in ContainerCreating, and `maxUnavailable: 0` means
          #     the old front door keeps serving while `prod` sits Degraded —
          #     a silent stale mirror rather than a loud failure. So this list
          #     and `front-door-tools/kustomization.yaml` must agree exactly,
          #     which `test_portfolio_front_mounts_every_generated_mirror_shard`
          #     enforces in both directions.
          #
          # This list is generated. `--write` rewrites the shards and these
          # entries in the same call, so the two files cannot be committed
          # disagreeing; it prints whether the count moved. Do not hand-edit:
          #   node platform/marketing/front-door-tools.mjs --write
          projected:
            sources:
              - configMap:
                  name: portfolio-front-tools-0
              - configMap:
                  name: portfolio-front-tools-1
              - configMap:
                  name: portfolio-front-tools-2
              - configMap:
                  name: portfolio-front-tools-3
              - configMap:
                  name: portfolio-front-tools-4
              - configMap:
                  name: portfolio-front-tools-5
              - configMap:
                  name: portfolio-front-tools-6
              - configMap:
                  name: portfolio-front-tools-7
              - configMap:
                  name: portfolio-front-tools-8
              - configMap:
                  name: portfolio-front-tools-9
              - configMap:
                  name: portfolio-front-tools-10
              - configMap:
                  name: portfolio-front-tools-11
              - configMap:
                  name: portfolio-front-tools-12
              - configMap:
                  name: portfolio-front-tools-13
              - configMap:
                  name: portfolio-front-tools-14
              - configMap:
                  name: portfolio-front-tools-15
              - configMap:
                  name: portfolio-front-tools-16
              - configMap:
                  name: portfolio-front-tools-17
              - configMap:
                  name: portfolio-front-tools-18
              - configMap:
                  name: portfolio-front-tools-19
              - configMap:
                  name: portfolio-front-tools-20
              - configMap:
                  name: portfolio-front-tools-21
              - configMap:
                  name: portfolio-front-tools-22
              - configMap:
                  name: portfolio-front-tools-23
              - configMap:
                  name: portfolio-front-tools-24
              - configMap:
                  name: portfolio-front-tools-25
              - configMap:
                  name: portfolio-front-tools-26
              - configMap:
                  name: portfolio-front-tools-27
              - configMap:
                  name: portfolio-front-tools-28
              - configMap:
                  name: portfolio-front-tools-29
              - configMap:
                  name: portfolio-front-tools-30
              - configMap:
                  name: portfolio-front-tools-31
              - configMap:
                  name: portfolio-front-tools-32
              - configMap:
                  name: portfolio-front-tools-33
              - configMap:
                  name: portfolio-front-tools-34
              - configMap:
                  name: portfolio-front-tools-35
              - configMap:
                  name: portfolio-front-tools-36
              - configMap:
                  name: portfolio-front-tools-37
              - configMap:
                  name: portfolio-front-tools-38
              - configMap:
                  name: portfolio-front-tools-39
              - configMap:
                  name: portfolio-front-tools-40
              - configMap:
                  name: portfolio-front-tools-41
              - configMap:
                  name: portfolio-front-tools-42
              - configMap:
                  name: portfolio-front-tools-43
              - configMap:
                  name: portfolio-front-tools-44
              - configMap:
                  name: portfolio-front-tools-45
              - configMap:
                  name: portfolio-front-tools-46
              - configMap:
                  name: portfolio-front-tools-47
              - configMap:
                  name: portfolio-front-tools-48
              - configMap:
                  name: portfolio-front-tools-49
              - configMap:
                  name: portfolio-front-tools-50
              - configMap:
                  name: portfolio-front-tools-51
              - configMap:
                  name: portfolio-front-tools-52
              - configMap:
                  name: portfolio-front-tools-53
              - configMap:
                  name: portfolio-front-tools-54
              - configMap:
                  name: portfolio-front-tools-55
              - configMap:
                  name: portfolio-front-tools-56
        - name: conf
          configMap:
            name: portfolio-front-nginx
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-front
spec:
  selector:
    app: portfolio-front
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Egress default-deny.
#
# `networkpolicy.yaml` restricts `portfolio-site` because that pod mounts a
# GitHub clone token. This pod mounts no credential — but it also has no
# reason to open a connection to anything at all: it serves one file from a
# ConfigMap and answers a kubelet probe. A workload whose correct egress set
# is empty is the cheapest possible one to lock down, and leaving it open
# would make it the softest landing spot in the namespace for anything that
# did get in.
#
# `policyTypes` names Egress only, for the same reason the site's policy does:
# ingress-nginx runs `hostNetwork: true`, so its connections to a backend pod
# are attributed to the node's address rather than to a pod identity a
# selector can match, and an Ingress rule written without cluster access to
# verify it would take the front door dark with the pods still Ready.
#
# No DNS rule: nothing here resolves a name. nginx does not need DNS for a
# static root with no upstream, and the kubelet reaches the probe port
# directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio-front-egress
spec:
  podSelector:
    matchLabels:
      app: portfolio-front
  policyTypes:
    - Egress
  egress: []
