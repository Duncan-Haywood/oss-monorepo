# The portfolio's public site: every static, browser-runnable venture
# surface, served from the Hetzner control-plane box.
#
# WHY THIS EXISTS
#
# `platform/pages/build.mjs` assembles 164 finished tools into one static
# site (hub, per-tool pages, sitemaps, robots.txt, social cards). Until now
# the only way to publish it was `.github/workflows/portfolio-pages.yml` ->
# GitHub Pages, which is blocked twice over: Pages is not enabled on the
# repository (owner flip `deploy-settings`), and every GitHub Actions run
# has failed without a runner since 2026-08-26, so the artifact is not even
# being built in CI. Meanwhile this cluster already runs ingress-nginx,
# cert-manager and an auto-syncing `prod` Application with nothing in it but
# a placeholder that says "add an Ingress when a product is ready".
#
# 164 products are ready. This is that Ingress, plus the workload behind it.
#
# It deliberately does NOT depend on GitHub Actions: Argo syncs this file
# straight from `main`, and the site is built inside the cluster. That is
# the whole point — it routes around the runner outage rather than waiting
# on it.
#
# HOW THE CONTENT GETS HERE
#
# Two init containers, then nginx:
#
#   1. `fetch`  shallow-clones this repository into an emptyDir.
#   2. `build`  runs `platform/pages/build.mjs` over that checkout and
#               writes the finished site into a second emptyDir.
#   3. `nginx`  serves that second emptyDir, read-only.
#
# The build needs no npm install: build.mjs imports only Node builtins
# (node:fs, node:crypto, node:path, node:url, node:zlib). That is what makes
# an in-cluster build cheap enough to do on every pod start.
#
# The clone needs a credential because this repository is private. See
# `secrets/portfolio-repo-token.template.yaml` — one read-only, contents-only
# fine-grained token, seal it, commit the SealedSecret. Nothing else in this
# file is secret and no token is stored here.
#
# WHY THERE IS A CACHE VOLUME
#
# Building on every pod start is cheap, but it makes the site's availability
# depend on three things being healthy *at the moment a pod starts*: GitHub
# reachable, the clone token valid, and `main` producing a `check.mjs`-clean
# build. Any one of them failing used to fail the init container, so the pod
# never became ready.
#
# `maxUnavailable: 0` hides that. A rollout into a broken build stalls with
# the old pods still serving, so nothing looks wrong from outside — and the
# clone token is a 90-day fine-grained PAT, so the ordinary way to enter this
# state is for it to expire on a Tuesday and for nobody to find out. The site
# then sits un-restartable for as long as it takes someone to notice, and the
# next node reboot, eviction or drain takes all 169 tools to zero with no
# path back until a human mints a new token.
#
# So a pod no longer needs a successful build to serve. `portfolio-site-cache`
# holds the last site that built AND passed `check.mjs`; when the fetch or the
# build fails, `build` restores that copy instead of failing the pod. The site
# survives a broken `main`, a GitHub outage and an expired token — it goes
# stale rather than dark, which for a set of static calculators is the right
# trade.
#
# Only a genuinely empty cache (a first-ever start that also cannot build)
# still fails the pod. There is nothing to serve in that case.
#
# The other half of the fix is making the silence audible: the refresh CronJob
# at the bottom now waits for the rollout it triggers and fails if it does not
# complete, so a stall shows up as a failed Job instead of nothing at all.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-site-nginx
data:
  # nginx-unprivileged listens on 8080 as uid 101; it cannot bind 80.
  default.conf: |
    # The access log, narrowed to what a page count needs and nothing else.
    #
    # This file is included from nginx.conf's `http` block, which is the only
    # context `log_format` is valid in — hence its position above `server`
    # rather than inside it.
    #
    # The stock `combined` format this replaces records `$remote_addr`,
    # `$http_user_agent` and `$http_referer`. That is a visitor's IP address,
    # device fingerprint and browsing history sitting in a pod log, for a
    # static site that has no account, no cookie and no reason to know any of
    # it — and it contradicts this manifest's own claim below that the site
    # "carries no user data". Three fields are enough to count page views:
    #
    #   $time_iso8601  the day, for bucketing
    #   $status        so a 404 or a 5xx is not counted as a visit
    #   $uri           the page, post-`try_files`, with NO query string
    #
    # `$uri` rather than `$request` is deliberate twice over: `$request`
    # carries the raw query string, and `$uri` is already resolved to the file
    # served, which is what `usage/aggregate.py` buckets on. Shared bids
    # travel in the URL fragment (`share.mjs`), which a browser never sends,
    # so a contractor's pricing is not in this log by any route.
    #
    # Dropping a field here is what makes the privacy claim structural: a
    # later change to the aggregator cannot start reporting an address that
    # was never written down.
    log_format privacy '$time_iso8601 $status $uri';

    server {
      listen 8080;
      server_name _;
      root /site;
      index index.html;

      # /dev/stdout so the lines are readable through the Kubernetes API,
      # which is how `portfolio-site-usage` collects them without a shared
      # volume between the two replicas.
      access_log /dev/stdout privacy;

      gzip on;
      gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/atom+xml text/xml;
      gzip_min_length 1024;

      error_page 404 /404.html;

      # .mjs is NOT in nginx's mime.types. Without this it is served as
      # application/octet-stream, and a browser refuses to execute an ES
      # module with a non-JavaScript MIME type — `nosniff` below makes that
      # refusal absolute rather than merely likely. The site ships 551 .mjs
      # files loaded with <script type="module"> on 261 pages, including the
      # calc.mjs / share.mjs / usage.mjs behind every calculator, so getting
      # this wrong serves 200s for pages that render and then do nothing.
      # GitHub Pages types .mjs correctly, which is why it never showed there.
      #
      # `types { }` empty plus default_type is the idiom that works here: a
      # populated types block in this context would REPLACE the inherited map
      # rather than extend it, taking every other content type with it.
      location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
      }

      # Same class of gap: the PWA manifest that every page links with
      # rel="manifest".
      location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
      }

      # Third of the same class, found by generalizing the two above rather
      # than by it breaking: nginx's mime.types has no `csv` entry either
      # (verified against 1.27.0). `fifo-pick-evidence` ships `examples/
      # picks.csv` as the sample a visitor loads into the tool, and without
      # this it arrives as application/octet-stream — a file the browser can
      # only save, never preview, and which no spreadsheet handler claims.
      #
      # `platform/pages/check.mjs` now fails the build if the site emits an
      # extension nothing here types, so a fourth one cannot reach production
      # the quiet way these two did.
      location ~ \.csv$ {
        types { }
        default_type text/csv;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
      }

      # Not the same class as the three above: nginx's mime.types *does* have
      # an `xml` entry, so the feed already serves as text/xml and every reader
      # accepts it. This is the narrower correctness fix — `application/
      # atom+xml` is the registered type (RFC 4287), and the aggregators that
      # take a site URL and go looking for a feed match on it rather than
      # parsing every text/xml document they find. Scoped with `=` to the one
      # file, because `~ \.xml$` would also catch the 170 sitemaps, which are
      # not Atom.
      location = /feed.xml {
        types { }
        default_type application/atom+xml;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Shorter than the pages: a reader polls this on its own schedule and a
        # new tool sitting behind a stale cache is the one thing the surface
        # exists to prevent.
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
      }

      # The service worker controls every page under its scope, so a stale
      # copy outlives a deploy. Browsers revalidate it anyway; this makes it
      # explicit rather than relying on that.
      location = /sw.js {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
      }

      # Whether the pod serving this request built from `main` or came up on
      # the cached site. The refresh CronJob reads it after every rollout, so
      # it must never be cached — a 300s copy would let a stale deploy report
      # itself fresh for the whole window the alarm runs in. Written by the
      # `build` init container; see "WHY THERE IS A CACHE VOLUME" above.
      location = /buildinfo.txt {
        access_log off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store" always;
      }

      # The site is wholly static and carries no user data: no cookies, no
      # login, no analytics beacon that needs a permissive frame policy.
      # These headers cost nothing and close the obvious classes.
      #
      # add_header does not merge across levels — a location that sets any
      # add_header drops every one inherited from the server block — which is
      # why each location above repeats them rather than relying on these.
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;

      # Hashed asset names are not used here, so do not tell a browser to
      # hold a calculator for a year — a fix would never reach anyone.
      location / {
        try_files $uri $uri/ $uri.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
      }

      # Kubelet probes. Kept out of the access log so a readiness check every
      # few seconds does not bury real traffic in the logs.
      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# The last site that built cleanly, kept across pod restarts.
#
# ReadWriteOnce is correct rather than merely tolerated. RWO is scoped to a
# *node*, not a pod, and both replicas carry the `hcloud/node-role:
# control-plane` nodeSelector below, so they always land on the same box and
# can both mount it. k3s's default local-path provisioner binds the volume to
# that node the first time it is consumed, which is the same node — the volume
# cannot drift.
#
# 1Gi against a 32Mi site (measured 2026-08-30, 1596 files): one live copy,
# one staging copy mid-write, and room for the tool count to keep growing.
# The floor exists so a runaway write cannot fill the control-plane disk out
# from under ingress.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-site-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-site
  annotations:
    # Bump to force a rebuild of the site from the current `main` without
    # otherwise changing this manifest. The refresh CronJob below does the
    # same thing on a schedule.
    portfolio/rebuild-nonce: "1"
spec:
  # Two replicas so a rebuild (or a lost node) never takes the site to zero.
  # Each builds independently, so during a rollout the two can briefly serve
  # different commits — acceptable for a static tool site, and the rolling
  # update below keeps at least one serving at all times.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: portfolio-site
  template:
    metadata:
      labels:
        app: portfolio-site
    spec:
      nodeSelector:
        hcloud/node-role: control-plane
      priorityClassName: prod-high
      # Nothing here talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: fetch
          image: alpine/git:2.47.2
          # --depth 1 keeps this to seconds and a few tens of MB; the build
          # reads the worktree, never the history.
          #
          # This container reports rather than decides. It exits 0 even when
          # the clone fails, and leaves `/workspace/repo` absent for `build`
          # to notice — because `build` is the only step that can see whether
          # a cached site exists to fall back on, and a fetch failure is only
          # fatal when there is not one. An `exit 1` here would take the pod
          # down before that question could be asked, which is the behaviour
          # the cache exists to remove.
          #
          # The token and the network are the two things that fail here, and
          # both are named in the log line so `kubectl logs -c fetch` says
          # which one it was.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -z "${GH_TOKEN}" ]; then
                echo "fetch: GH_TOKEN empty; see secrets/portfolio-repo-token.template.yaml" >&2
                echo "fetch: not cloning — build will fall back to the cached site" >&2
                exit 0
              fi
              # The token goes in the credential store, not the remote URL,
              # so it cannot leak through `git remote -v`, the process list,
              # or an error message that echoes the URL back.
              git config --global credential.helper store
              printf 'https://x-access-token:%s@github.com\n' "${GH_TOKEN}" > "${HOME}/.git-credentials"
              chmod 600 "${HOME}/.git-credentials"
              # `set -e` is on, so guard the clone explicitly. A partial clone
              # left behind by a mid-transfer failure would look like a usable
              # worktree to `build`, so remove it on any non-zero exit.
              if git clone --depth 1 --branch main \
                   https://github.com/Duncan-Haywood/monorepo-projects.git /workspace/repo; then
                rm -f "${HOME}/.git-credentials"
                echo "fetched $(git -C /workspace/repo rev-parse --short HEAD)"
              else
                rm -f "${HOME}/.git-credentials"
                rm -rf /workspace/repo
                echo "fetch: clone failed (expired token, revoked access, or GitHub unreachable)" >&2
                echo "fetch: build will fall back to the cached site" >&2
              fi
          env:
            - name: HOME
              value: /workspace
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-site-repo
                  key: token
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

        - name: build
          image: node:22-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # Build into a scratch directory, not into /site. /site is what
              # nginx will serve, so a build that dies half way through must
              # never have written into it — the fallback below would then be
              # restoring on top of a partial site rather than instead of one.
              BUILD_OK=0
              if [ -d /workspace/repo ]; then
                cd /workspace/repo
                # build.mjs reads PAGES_BASE_URL from the environment; --out=
                # is the only flag it needs here. Both are `--name=value`.
                #
                # check.mjs is the same integrity gate the Pages workflow runs
                # before upload: it exits non-zero on dead links, a collapsed
                # product count, or an extension nginx has no MIME type for.
                # A build that fails it is not published and not cached.
                if node platform/pages/build.mjs --out=/build/site \
                   && node platform/pages/check.mjs --dist=/build/site; then
                  BUILD_OK=1
                else
                  echo "build: build.mjs or check.mjs failed on this commit" >&2
                fi
              else
                echo "build: no checkout — the fetch step could not clone" >&2
              fi

              if [ "$BUILD_OK" = 1 ]; then
                cp -a /build/site/. /site/
                echo "built $(find /site -type f | wc -l) files"
                # Served at /buildinfo.txt. The refresh CronJob reads it to
                # tell a rollout that republished `main` apart from one whose
                # pods came up on the cache — those look identical from the
                # Deployment's status, because a cache-served pod is a healthy
                # pod. Deliberately minimal: no commit SHA, because this file
                # is public and the repository is not.
                printf 'status=fresh\nbuilt_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /site/buildinfo.txt

                # Publish to the cache only now, with the build already
                # proven — a build that fails check.mjs must never become the
                # thing a later pod falls back to.
                #
                # Both replicas run this, seconds apart, against one shared
                # volume, so the write is serialised by a lock. `mkdir` is the
                # portable atomic test-and-set: it succeeds for exactly one
                # caller and fails for the other, with no flag busybox lacks.
                # (Everything here has to be busybox: the image is
                # node:22-alpine. That rules out `mv -T`, which is what the
                # obvious symlink swap would need.)
                #
                # A pod killed mid-write would otherwise leave the lock held
                # for good, so a lock older than the slowest plausible build
                # is treated as abandoned. Publishing is skipped rather than
                # forced when the lock is live: the loser's bytes are
                # identical to the winner's, so there is nothing to lose by
                # not writing them twice.
                find /cache -maxdepth 1 -name .writelock -type d -mmin +30 \
                  -exec rm -rf {} + 2>/dev/null || true
                if mkdir /cache/.writelock 2>/dev/null; then
                  # Testing this group with `if` is what keeps `set -e` from
                  # turning a cache problem into an outage. This pod has
                  # already built and already populated /site; a full or
                  # read-only volume is a reason to lose the safety net,
                  # never a reason to refuse to serve the site sitting right
                  # there.
                  #
                  # Chained with `&&` rather than written as plain lines,
                  # and that is not style. `set -e` is *suppressed* inside a
                  # command whose status an `if` is testing, so as separate
                  # lines a failed `cp` here kept going and the group still
                  # exited 0 — reporting a cache that had not been written.
                  # `gitops/tests/test_portfolio_site.py` fails on that
                  # exact shape.
                  #
                  # The swap at the end is two renames on one filesystem. The
                  # window in which /cache/site does not exist is those two
                  # calls, not the second the copy takes — and a reader that
                  # lands in it fails its init container, which the kubelet
                  # then retries. Nothing is ever served from a half-written
                  # cache.
                  if (
                    rm -rf /cache/.stage /cache/.old \
                    && mkdir -p /cache/.stage \
                    && cp -a /build/site/. /cache/.stage/ \
                    && { mv /cache/site /cache/.old 2>/dev/null || true; } \
                    && mv /cache/.stage /cache/site \
                    && rm -rf /cache/.old
                  ); then
                    echo "build: cached this build for future pod starts"
                  else
                    echo "build: could NOT write the cache — serving this build, but the next pod has no fallback." >&2
                    echo "build: check the portfolio-site-cache volume (full, or not writable by uid 101)." >&2
                  fi
                  # Always, on both paths: a leaked lock would silently stop
                  # every later build from refreshing the fallback.
                  rmdir /cache/.writelock 2>/dev/null || rm -rf /cache/.writelock || true
                else
                  echo "build: the sibling replica is writing the cache — skipping (same bytes)"
                fi
              elif [ -d /cache/site ]; then
                # Stale beats dark.
                cp -a /cache/site/. /site/
                printf 'status=stale\nrestored_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /site/buildinfo.txt
                echo "build: SERVING THE CACHED SITE — this pod did not build from main." >&2
                echo "build: $(find /site -type f | wc -l) files restored from cache" >&2
                echo "build: the site is now stale. Check the fetch log above for the cause." >&2
              else
                echo "build: no build and no cached site — nothing to serve." >&2
                echo "build: this is a first start that could not clone or could not build." >&2
                exit 1
              fi
          env:
            # Names the staging directory this replica writes, so the two
            # pods cannot collide in the cache volume.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Must match the Ingress host below, with the trailing slash.
            # build.mjs stamps this into every canonical link, og:url and
            # sitemap entry; a mismatch tells crawlers the real page is
            # somewhere it is not.
            - name: PAGES_BASE_URL
              value: https://tools.marisstella.dev/
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: site
              mountPath: /site
            # Where build.mjs actually writes. Kept off /site so a failed
            # build cannot leave a half-written site for nginx to serve.
            - name: build-out
              mountPath: /build
            # The last site that built and passed check.mjs, surviving pod
            # restarts. See "WHY THERE IS A CACHE VOLUME" at the top.
            - name: cache
              mountPath: /cache
            # check.mjs parses every emitted script through
            # `fs.mkdtemp(os.tmpdir(), ...)`, so it needs a writable /tmp.
            # Without this the read-only root filesystem below fails the pod.
            - name: build-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Measured on 2026-08-30 against `main` at fa041f0, running both
          # commands above exactly as this container does (165 tools, 482
          # pages, 1596 files emitted):
          #
          #   build.mjs   25s, peak RSS 134Mi
          #   check.mjs   11s, peak RSS  99Mi
          #
          # So the request is ~4x the observed peak and the limit ~11x. That
          # headroom is deliberate: both numbers scale with the tool count,
          # which has grown all month, and an OOM here fails the pod rather
          # than degrading — the site would go to zero on a rollout.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi

      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # nginx-unprivileged writes its temp dirs and pid under /tmp,
            # which is what lets the root filesystem stay read-only.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        # The finished site measured 32Mi across 1596 files on 2026-08-30,
        # so this is ~16x what it holds today. An emptyDir that fills does
        # not fail the write — the kubelet evicts the pod — so this is sized
        # for a year of growth rather than for the current build.
        - name: site
          emptyDir:
            sizeLimit: 512Mi
        # The build's own output, copied into `site` only once check.mjs has
        # passed. Same sizing reasoning as `site`, because it holds the same
        # bytes.
        - name: build-out
          emptyDir:
            sizeLimit: 512Mi
        - name: cache
          persistentVolumeClaim:
            claimName: portfolio-site-cache
        - name: build-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-conf
          configMap:
            name: portfolio-site-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-site
spec:
  selector:
    app: portfolio-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The Ingress that serves the site's content, on the canonical public name.
#
# `tools.marisstella.dev`, NOT the apex — but no longer for the reason this
# comment used to give. It said `infra/README.md` records that
# marisstella.dev "already resolves to this box for something else", so
# whatever serves the apex keeps serving it. That inference was wider than
# the source: `infra/README.md` records where the A records point, not that
# anything answers, and ingress-nginx runs `hostNetwork: true` on this node
# and therefore holds :80/:443 itself. Nothing else was serving the apex; it
# was falling to the default backend, which is what the owner reported in
# issue #1925.
#
# The host below stays `tools.` anyway, because it is the canonical host
# stamped into all 508 pages' canonical links, og:urls and sitemap entries
# via PAGES_BASE_URL. The apex and `www` are handled next door in
# `portfolio-apex.yaml`, which 301s them here rather than serving a second
# uncanonical copy. Keep this Ingress single-host: the test in
# `gitops/tests/test_manifests.py` pins that split so a later change cannot
# quietly turn the canonical host into three.
#
# Publishing needs one DNS record — see gitops/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-site
  annotations:
    # Staging on purpose, and it must stay staging until DNS resolves.
    #
    # Argo auto-syncs this namespace, so this Ingress exists the moment the
    # manifest lands — before the A record for the host below. cert-manager
    # will then start HTTP-01 challenges that cannot succeed, and against
    # the prod issuer those failures count towards Let's Encrypt's
    # per-account limits for a name nobody can reach yet.
    #
    # Staging issues an untrusted certificate, which is exactly right for a
    # host that is not serving anyone. Flip to `letsencrypt-prod` as the
    # last step, once `tools.marisstella.dev` resolves to this box and a
    # staging certificate has actually issued — see gitops/README.md.
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tools.marisstella.dev
      secretName: portfolio-site-tls
  rules:
    - host: tools.marisstella.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-site
                port:
                  name: http
---
# Keeping the published site current without GitHub Actions.
#
# The pods build from `main` at start-up, so they only pick up new tools when
# something restarts them. Argo will not do that — this manifest does not
# change when a venture does. A nightly rollout restart is the cheapest way
# to keep the public site within a day of `main` while the runners are down.
#
# THIS JOB DESTROYS THE USAGE LOG. READ BEFORE CHANGING THE SCHEDULE.
#
# `site-usage.yaml` counts page views by reading the nginx access log back out
# of the *running* pods (`GET /pods/<name>/log`). A rollout restart replaces
# both pods with new ones under new names, so the old pods — and every access
# line they held — are deleted. Nothing recovers them: `?previous=true` returns
# the previous container in the *same* pod, and a rollout does not reuse pods.
#
# So this job's schedule sets how much of each day the usage signal can see.
# Until 2026-08-31 it ran at 04:17 while the aggregator ran at 00:31 and
# counted *yesterday*: at 00:31 the only pods alive had started at 04:17 the
# previous morning, so every daily row silently lost 00:00–04:17 — a little
# over four hours, 18% of every day, always the same hours, biased against
# whichever timezones are awake in them. Not noise that averages out: a
# systematic undercount in the one number `portfolio/DIRECTION.md` says the
# portfolio steers by. Found by reading, before the site was ever public, so
# no collected data is affected.
#
# Two rules keep it honest, and `gitops/tests/test_site_usage.py` pins both:
#
#   1. This job must run AFTER the aggregator on the same day, never before.
#      Restarting first throws away the day it was about to count.
#   2. The residual loss is midnight → this job's start (now ~1h). It cannot
#      reach zero: the aggregator can only count a day once that day has
#      closed, so the restart is always some minutes into the new day.
#
# And the change this comment exists to stop: **do not make this more
# frequent to publish faster.** Restarting hourly would cut publish lag to an
# hour and cut the usage signal to roughly nothing, because each restart
# discards the hour before it. If the site needs to be fresher than daily, the
# fix is to stop rebuilding on pod start (bake the site into an image, or have
# the aggregator ship lines somewhere durable first) — not a tighter cron.
#
# THIS JOB IS ALSO THE SITE'S ONLY BUILD ALARM.
#
# It used to run `kubectl rollout restart` and exit, which reports whether the
# *request* was accepted, never whether the rollout finished. With
# `maxUnavailable: 0`, a rollout into pods that cannot start does not finish
# and does not disturb anything: the old pods keep serving and the Job goes
# green. That is the state described at the top of this file — the site
# quietly un-restartable, one node event away from going dark, with no signal
# anywhere. Waiting for the rollout is what converts that silence into a
# failed CronJob an operator can see.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-site-refresh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portfolio-site-refresh
rules:
  # Namespaced, and narrowed by name: this can restart the site and nothing
  # else. It cannot create, delete, or read any other workload in `prod`.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["portfolio-site"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portfolio-site-refresh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portfolio-site-refresh
subjects:
  - kind: ServiceAccount
    name: portfolio-site-refresh
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: portfolio-site-refresh
spec:
  # 01:00 UTC, chosen against `site-usage.yaml`'s 00:31 aggregation rather
  # than for its own sake: late enough that the aggregator has read yesterday
  # out of the pods before they are replaced (its startingDeadlineSeconds is
  # 600, so it cannot begin after 00:41, leaving a 19-minute cushion), and as
  # early as that constraint allows, because everything before this time is
  # the part of today the usage log will not survive to report.
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: portfolio-site-refresh
          nodeSelector:
            hcloud/node-role: control-plane
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: bitnami/kubectl:1.31
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  kubectl rollout restart deployment/portfolio-site

                  # `kubectl rollout status` is the obvious wait and is not
                  # used, for one reason: it opens a WATCH, and RBAC
                  # `resourceNames` cannot restrict `list`/`watch`. Granting
                  # it would widen this ServiceAccount from "may read and
                  # restart one named Deployment" to "may watch every
                  # Deployment in prod". Polling `get` needs no new verb at
                  # all, so the Role below is unchanged by this wait.
                  #
                  # go-template rather than jsonpath because the counters are
                  # absent (not zero) on a Deployment mid-rollout, and an
                  # absent field in a space-separated jsonpath shifts every
                  # field after it — silently comparing the wrong numbers.
                  # `or ... 0` substitutes the zero jsonpath cannot.
                  TEMPLATE='{{.metadata.generation}} {{or .status.observedGeneration 0}} {{.spec.replicas}} {{or .status.updatedReplicas 0}} {{or .status.availableReplicas 0}}'
                  DEADLINE=$(( $(date +%s) + 600 ))

                  while :; do
                    STATE="$(kubectl get deployment portfolio-site -o go-template="${TEMPLATE}" 2>/dev/null || true)"
                    # shellcheck disable=SC2086
                    set -- ${STATE:-}
                    GEN="${1:-0}"; OBS="${2:-0}"; WANT="${3:-0}"; UPD="${4:-0}"; AVAIL="${5:-0}"

                    # A rollout is done when the controller has caught up with
                    # the spec (observed >= generation) AND every replica is
                    # both on the new pod template and passing its readiness
                    # probe. `updatedReplicas` alone would go green while the
                    # new pods were still in Init.
                    case "${GEN}${OBS}${WANT}${UPD}${AVAIL}" in
                      *[!0-9]*) ;;
                      *)
                        if [ "$OBS" -ge "$GEN" ] && [ "$UPD" -eq "$WANT" ] && [ "$AVAIL" -eq "$WANT" ] && [ "$WANT" -gt 0 ]; then
                          echo "refresh: rollout complete — ${AVAIL}/${WANT} pods updated and available"

                          # A completed rollout is not the same as a published
                          # one. Since the cache fallback exists, a pod that
                          # could not clone or could not build still starts,
                          # still passes its probes, and still counts as
                          # available — serving yesterday's site. That is the
                          # right behaviour for visitors and the wrong thing
                          # to report as success, so ask the site itself.
                          #
                          # Best-effort by construction: no HTTP client is
                          # guaranteed in this image, and a missing one must
                          # not turn a good nightly refresh red. The check is
                          # skipped loudly instead.
                          if command -v curl >/dev/null 2>&1; then
                            INFO="$(curl -fsS --max-time 15 http://portfolio-site/buildinfo.txt 2>/dev/null || true)"
                          elif command -v wget >/dev/null 2>&1; then
                            INFO="$(wget -qO- --timeout=15 http://portfolio-site/buildinfo.txt 2>/dev/null || true)"
                          else
                            INFO=""
                            echo "refresh: no curl or wget in this image — skipping the freshness check" >&2
                          fi

                          case "$INFO" in
                            *status=fresh*)
                              echo "refresh: the site rebuilt from main"
                              echo "$INFO" | sed 's/^/refresh:   /'
                              exit 0
                              ;;
                            *status=stale*)
                              echo "refresh: the rollout completed but the pods came up on the CACHED site." >&2
                              echo "refresh: visitors are served, and what they are served is out of date." >&2
                              echo "refresh: kubectl logs -l app=portfolio-site -c fetch, then -c build, names the cause." >&2
                              echo "refresh: usually an expired clone token (90-day PAT), GitHub unreachable, or a commit on main failing check.mjs." >&2
                              exit 1
                              ;;
                            *)
                              # Unreachable or unparseable. The rollout itself
                              # succeeded, which is the fact this Job exists to
                              # establish, so do not fail on the weaker signal.
                              echo "refresh: could not read /buildinfo.txt — reporting the rollout only" >&2
                              exit 0
                              ;;
                          esac
                        fi
                        ;;
                    esac

                    if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                      echo "refresh: rollout did NOT complete within 600s." >&2
                      echo "refresh: generation=${GEN} observed=${OBS} replicas=${WANT} updated=${UPD} available=${AVAIL}" >&2
                      echo "refresh: the old pods are still serving (maxUnavailable: 0), so the site is up but STALE and un-restartable." >&2
                      echo "refresh: read the new pod's init containers — kubectl logs -l app=portfolio-site -c fetch, then -c build." >&2
                      echo "refresh: the usual causes are an expired clone token (90-day PAT), GitHub unreachable, or a commit on main that fails check.mjs." >&2
                      exit 1
                    fi
                    sleep 10
                  done
              env:
                # kubectl caches API discovery under $HOME/.kube/cache. The
                # root filesystem is read-only, so point both at the emptyDir
                # rather than let it warn on every run.
                - name: HOME
                  value: /tmp
                - name: KUBECACHEDIR
                  value: /tmp/.kube/cache
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
