apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: prod-high
value: 100000
globalDefault: false
description: Ingress and prod on the cpx52 win over Codex Jobs.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: agents-low
value: 1000
globalDefault: false
description: Codex Jobs yield to prod. They run on the tainted cpx22 anyway.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ci-low
value: 900
globalDefault: false
description: >-
  Actions runners yield to prod and to Codex Jobs. Unlike Codex Jobs these
  share the cpx52 with marisstella.dev, so the ordering has to be explicit:
  a CI burst is never a reason for the public site to lose a pod.

