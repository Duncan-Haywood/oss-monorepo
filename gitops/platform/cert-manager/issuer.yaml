# Staging issuer first so we do not burn Let's Encrypt prod rate limits
# against a host nobody has confirmed can reach it yet.
#
# Two Ingress objects use these issuers today, not one -- this comment named
# a single Ingress (`tools.marisstella.dev` only) until 2026-09-02, which
# went stale the moment `gitops/prod/portfolio-apex.yaml` picked up its own
# `letsencrypt-prod` annotation on 2026-08-31; the paragraph below already
# said so, this opening line just never caught up:
#
#   - `gitops/prod/portfolio-site.yaml`  -> tools.marisstella.dev
#   - `gitops/prod/portfolio-apex.yaml`  -> marisstella.dev, www.marisstella.dev
#
# (Not `cluster.duncanhaywood.dev`, which an earlier revision of this comment
# named and which nothing in this repo binds an Ingress to.) All three
# hostnames' DNS already resolves (verified 2026-08-29, see gitops/README.md),
# so the stale reason above was also wrong on its own terms: staging stays the
# default because Argo auto-syncs `prod`, so an Ingress exists (and
# cert-manager starts HTTP-01 challenges against the prod issuer, were it
# wired here) before anyone has confirmed a certificate actually issues --
# not because DNS is missing.
#
# Both ClusterIssuers stay defined; which one an Ingress uses is that
# Ingress's annotation. As of 2026-08-31 both Ingresses above point at
# `letsencrypt-prod` -- DNS for all three hostnames resolved on 2026-08-29,
# retiring the reason for the staging default, and staging had to go before
# either serves anyone rather than after (an untrusted root would meet every
# visitor with an interstitial). See gitops/README.md. `letsencrypt-staging`
# is kept here as the revert target and for any future host that lands
# before its DNS does.
#
# HTTP-01 uses ingress-nginx on the control-plane node.
#
# NO `email:` CONTACT, ON PURPOSE.
#
# Both issuers used to carry `replace-me@duncanhaywood.dev`, and
# `infra/OWNER_CHECKLIST.md` listed replacing it as an owner action standing
# between this portfolio and a live site. It does not need to be one. ACME
# account contacts are optional (RFC 8555 §7.3 makes `contact` optional, and
# cert-manager's `email` field is likewise optional), so an issuer with no
# contact registers and issues normally.
#
# Leaving the placeholder in was the worse of the two failure modes. Either
# Let's Encrypt rejects the address at registration and no certificate ever
# issues, or — if `duncanhaywood.dev` resolves — it accepts it and files
# expiry warnings at a mailbox nobody reads. Omitting the field is the only
# option that neither blocks issuance nor hands an external certificate
# authority an address the portfolio does not actually monitor. Which address
# to hand a CA stays the owner's call; declining to guess one is not the same
# as guessing.
#
# What is given up: Let's Encrypt's "your certificate expires in N days"
# emails. cert-manager renews at two-thirds of the certificate lifetime
# without them, and the cluster's own alerting is the right place to notice a
# renewal that did not happen. If the owner later wants those emails, adding
# `email:` back to both issuers is a one-line change per issuer that
# cert-manager applies by updating the existing ACME account registration —
# no reissue, no downtime, and it can happen long after the site is live.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
