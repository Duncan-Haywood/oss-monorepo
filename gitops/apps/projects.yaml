# AppProjects are the hard wall. Agents can only dest namespace agents.
# Prod cannot see agent Secrets. Argo itself uses project `default` only
# for the root Application.
#
# Every `namespaceResourceWhitelist` entry below should name a group Argo
# actually has to sync a resource from -- the same discipline `bitnami.com/
# SealedSecret` and the two `rbac.authorization.k8s.io` kinds already get
# (named explicitly rather than wildcarded, and added only once a manifest
# needing them existed). `group: policy` sat wildcarded in prod, staging,
# agents and ci since the namespace was first adopted (#1486) despite no
# manifest in this tree ever shipping a `policy/v1` resource (no
# PodDisruptionBudget, no PodSecurityPolicy) -- every other convenience
# group here (`""`, `apps`, `networking.k8s.io`, `batch`) is exercised by a
# real manifest and `policy` was the one that was not, so it is removed
# rather than narrowed. `test_appproject_wildcard_groups_are_actually_used`
# in gitops/tests/test_manifests.py pins this so an unused group cannot sit
# wildcarded again unnoticed. Add it back, in whichever project needs it,
# the same commit a PodDisruptionBudget lands.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: ingress, cert-manager, sealed-secrets, cluster policies
  sourceRepos:
    - https://github.com/Duncan-Haywood/monorepo-projects.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://bitnami-labs.github.io/sealed-secrets
  destinations:
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: sealed-secrets
      server: https://kubernetes.default.svc
    - namespace: platform
      server: https://kubernetes.default.svc
    - namespace: kube-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: User-facing workloads on the cpx52. Cannot dest agents.
  sourceRepos:
    - https://github.com/Duncan-Haywood/monorepo-projects.git
  destinations:
    - namespace: prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    # prod/secrets/portfolio-repo-token.template.yaml is sealed and added to
    # prod/kustomization.yaml as the site's read-only clone token -- without
    # this, Argo refuses to sync that SealedSecret the moment it lands,
    # blocking the launch on a rule mismatch instead of the actual owner
    # steps. agents and ci already whitelist this kind for the same reason.
    - group: bitnami.com
      kind: SealedSecret
    # prod/portfolio-site.yaml's nightly refresh CronJob and its narrowly
    # scoped Role/RoleBinding (restart this one Deployment, nothing else)
    # ship in this venture too. Without these two entries Argo refuses to
    # sync all three the same way it refused the SealedSecret above -- named
    # by kind rather than "*" for this group, since rbac.authorization.k8s.io
    # is the one whitelist that should not be wider than the resources it
    # actually needs to admit.
    - group: batch
      kind: CronJob
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Staging namespace on the same cluster. Cannot dest prod or agents.
  sourceRepos:
    - https://github.com/Duncan-Haywood/monorepo-projects.git
  destinations:
    - namespace: staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  # `apps` (Deployment/ReplicaSet/...) and `networking.k8s.io` (Ingress/
  # NetworkPolicy) sat wildcarded here since the namespace was first adopted
  # (#1486), same as every sibling project -- but `gitops/staging/` has never
  # shipped anything but quota.yaml's ResourceQuota (group ""; see
  # kustomization.yaml, one resource). Nothing here has ever exercised
  # either group: the same shape of gap #2771 closed for `policy` on this
  # exact list, just per-namespace rather than tree-wide, because `apps` and
  # `networking.k8s.io` are real, load-bearing groups elsewhere (prod and ci
  # both ship a Deployment and a NetworkPolicy) and were only ever unused
  # *here*. Narrowed per the header comment's own rule -- add a group back
  # in the same commit that first ships a resource needing it in this
  # namespace. test_appproject_whitelist_carries_no_group_its_own_namespace_never_ships
  # in gitops/tests/test_manifests.py pins this (generalized 2026-09-02 to
  # cover every venture namespace, not just this one -- see that test).
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: agents
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Governor + Codex Jobs. Cannot dest prod or touch cluster-scoped objects.
  sourceRepos:
    - https://github.com/Duncan-Haywood/monorepo-projects.git
  destinations:
    - namespace: agents
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    # `apps` (Deployment/ReplicaSet/StatefulSet/DaemonSet) sat wildcarded
    # here since the namespace was first adopted (#1486), same as every
    # sibling project -- but `gitops/agents/` has never shipped a resource in
    # that group: the governor runs as a `batch/v1` CronJob, and neither it
    # nor the Codex worker is a long-running workload of its own. This is the
    # same shape of gap #2771 closed for `policy` tree-wide and the one just
    # above closed for `staging`'s own `apps`/`networking.k8s.io` -- a
    # convenience group real elsewhere (prod and ci both ship a Deployment)
    # left wildcarded here purely because nothing had occasion to narrow it,
    # widening what a compromised sync could place in this namespace (an
    # unreviewed Deployment or DaemonSet) beyond anything a real manifest
    # needs. `networking.k8s.io` stays wildcarded below: it is real and
    # load-bearing here (three NetworkPolicies in `gitops/agents/
    # networkpolicy.yaml`). Narrowed per the header comment's own rule -- add
    # `apps` back, in this project, the same commit that first ships a
    # Deployment (or sibling kind) under `gitops/agents/`.
    # test_appproject_whitelist_carries_no_group_its_own_namespace_never_ships
    # in gitops/tests/test_manifests.py pins this.
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    # Named explicitly rather than "*", matching the `prod` AppProject just
    # above: rbac.authorization.k8s.io is the one whitelist group that should
    # not be wider than the resources it actually needs to admit. `agents/`
    # ships exactly one RBAC manifest -- governor/rbac.yaml -- and it is a
    # namespaced ServiceAccount + Role + RoleBinding, nothing cluster-scoped
    # (which `clusterResourceWhitelist: []` above blocks anyway). A wildcard
    # here let Argo sync a ClusterRole or ClusterRoleBinding dropped into this
    # namespace's directory by a future commit without the AppProject ever
    # objecting -- the one place in the repo where "no cluster-scoped RBAC
    # from agents" was a stated design intent (this AppProject's own
    # description: "Cannot dest prod or touch cluster-scoped objects") but not
    # an enforced one.
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: bitnami.com
      kind: SealedSecret
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Self-hosted Actions runners. Cannot dest prod, agents or staging.
  sourceRepos:
    - https://github.com/Duncan-Haywood/monorepo-projects.git
  destinations:
    - namespace: ci
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
    - group: bitnami.com
      kind: SealedSecret
