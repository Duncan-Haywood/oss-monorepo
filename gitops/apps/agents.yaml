apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agents
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: agents
  source:
    repoURL: https://github.com/Duncan-Haywood/monorepo-projects.git
    targetRevision: main
    path: gitops/agents
  destination:
    server: https://kubernetes.default.svc
    namespace: agents
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: governor-state
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
