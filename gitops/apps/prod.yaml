apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: prod
  source:
    repoURL: https://github.com/Duncan-Haywood/monorepo-projects.git
    targetRevision: main
    path: gitops/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  ignoreDifferences:
    # The nightly usage CronJob writes the site's page counts into this
    # ConfigMap's `/data`. Git holds an empty seed, so without this a sync
    # would erase the history on every reconcile — the same reason the agents
    # Application ignores `governor-state`. ignoreDifferences by itself only
    # changes what Argo calls OutOfSync in the diff view; the
    # RespectIgnoreDifferences=true syncOption below is what actually stops
    # an automated sync (selfHeal is on) from overwriting /data — the entry
    # here did nothing on its own until that option was added.
    - group: ""
      kind: ConfigMap
      name: portfolio-site-usage
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
