apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ci
resources:
  - quota.yaml
  - networkpolicy.yaml
  - runner.yaml
configMapGenerator:
  - name: actions-runner-script
    files:
      - runner-entrypoint.sh=runner-entrypoint.sh
generatorOptions:
  disableNameSuffixHash: true
