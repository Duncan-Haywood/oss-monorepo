# Sized so two runners at full tilt cannot take the cpx52 out from under prod.
# The 24 GB box carries the control plane, ingress, marisstella.dev and this;
# 6 Gi and 4 CPU is the ceiling CI is allowed to reach for.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ci
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 3Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 3Gi
