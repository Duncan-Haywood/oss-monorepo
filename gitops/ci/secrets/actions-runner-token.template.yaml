# Template only -- not applied, and not the file to put a real token in.
#
# Easier: `./bootstrap/scripts/seal-owner-secrets.sh ci` does everything below.
# It proves the PAT can actually mint a registration token before sealing it,
# which is the failure this file's closing paragraph warns you to recognise.
#
# By hand: replace CHANGE_ME, seal it with kubeseal, commit the *sealed* output.
#
# RUNNER_TOKEN is a GitHub Personal Access Token used for exactly one call:
# minting a short-lived runner registration token at pod start. It is never
# exposed to a workflow -- jobs receive the per-run GITHUB_TOKEN GitHub
# injects, not this.
#
# Scope it as narrowly as GitHub allows:
#
#   Classic PAT           `repo` scope. This is the only classic scope that
#                         can mint a registration token for a private repo.
#   Fine-grained PAT      Repository access limited to
#                         Duncan-Haywood/monorepo-projects, with the
#                         "Administration" repository permission set to
#                         Read and write. Prefer this one: it cannot touch
#                         any other repository on the account.
#
# Give it an expiry and a calendar reminder. When it lapses the runner pods
# CrashLoopBackOff with "Could not read a registration token" and CI goes
# quiet again -- the same symptom as the outage this stack exists to end, so
# it is worth being able to recognise.
apiVersion: v1
kind: Secret
metadata:
  name: actions-runner-secrets
  namespace: ci
type: Opaque
stringData:
  RUNNER_TOKEN: CHANGE_ME
