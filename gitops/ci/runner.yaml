# Self-hosted GitHub Actions runners on the cpx52.
#
# Why this exists: this repository is private and owned by a user account, so
# GitHub-hosted Actions minutes are metered. From 2026-08-26 to 2026-09-01
# every workflow run came back red in 3-6 seconds with `runner_id: 0`,
# `runner_name: ""` and zero steps -- the signature of a job that was never
# assigned a runner at all, not of a job that ran and failed.
#
# That window closed on its own: runner *assignment* resumed from
# 2026-09-01T00:00:53Z, and the PRs that have run since went green on merit
# (#2601, #2603, #2605 -- real runner ids, real steps). That is the claim the
# evidence supports; it is not "every workflow is green". Runs still fail here
# for their own reasons -- `Claude routine trigger`, for one, gets a real
# runner, reaches the API and comes back `HTTP 401 ... "OAuth access token has
# been revoked"` (run 33547527610). Its `CLAUDETRIGGERAPIKEY` secret is set;
# the token behind it is revoked, which is decision-queue item
# `routine-trigger-cadence` and not a runner problem. This stack is therefore
# insurance rather than a fix today. It is still worth deploying,
# because the recovery arrived at midnight on the first of the month, which is
# what a metered allowance resetting looks like -- so the ceiling appears to
# cycle rather than to be gone. Self-hosted runners are not metered, so they
# make the next cycle a non-event, whichever account-level condition it is
# (the sub-cause is not observable from here; only the owner's billing page
# settles it).
#
# Two replicas, not one: a PR here typically triggers a handful of workflows
# (Portfolio validate, Page integrity, Conflict markers, the touched venture's
# own CI). One ephemeral runner would serialise them and each pod restart costs
# a fresh registration. Two is enough to keep a normal PR moving without
# crowding prod on the shared box.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actions-runner
  labels:
    app.kubernetes.io/name: actions-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: actions-runner
  # Ephemeral runners exit on purpose after each job, so a rolling update has
  # nothing to roll: replace them and let the next job land on new pods.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actions-runner
    spec:
      # ci-low yields to prod-high. marisstella.dev shares this node, and a CI
      # burst must never be the reason the public site loses a pod.
      priorityClassName: ci-low
      # The cpx22 is tainted for Codex Jobs and has 4 GB; a node --test sweep
      # across 220 workflows does not fit beside a Codex worker there.
      nodeSelector:
        hcloud/node-role: control-plane
      # Nothing in CI talks to the Kubernetes API, so it gets no token to talk
      # with. This is the same posture the governor's Job template takes.
      automountServiceAccountToken: false
      # Every other workload in this repo (portfolio-site's three containers,
      # its refresh and usage CronJobs, the governor, prod's landing page) sets
      # runAsNonRoot -- this Deployment was the one exception, carrying no pod
      # securityContext at all. `ghcr.io/actions/actions-runner` already runs
      # as its baked-in unprivileged `runner` user by default (the entrypoint
      # above never chowns, sudos or su's into another account, and it `cd`s
      # straight into /home/runner, that user's own home), so this asserts
      # what the image already does rather than changing it -- and fails the
      # pod closed instead of silently running as root if a future image
      # revision ever changed that default.
      #
      # readOnlyRootFilesystem stays off here, unlike every sibling above, and
      # not by oversight: a workflow step can `npm ci`, `pip install`, or run
      # `actions/setup-node`, all of which write into $RUNNER_TOOL_CACHE and
      # other paths outside the one `work` emptyDir this pod mounts. That is
      # inherent to running arbitrary job code, not something to narrow away.
      securityContext:
        runAsNonRoot: true
      restartPolicy: Always
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.328.0
          command: ["/bin/bash", "/opt/runner/runner-entrypoint.sh"]
          env:
            - name: GITHUB_REPOSITORY
              value: Duncan-Haywood/monorepo-projects
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: actions-runner-secrets
                  key: RUNNER_TOKEN
          volumeMounts:
            - name: entrypoint
              mountPath: /opt/runner
              readOnly: true
            - name: work
              mountPath: /home/runner/_work
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: entrypoint
          configMap:
            name: actions-runner-script
            defaultMode: 0555
        # emptyDir, not a PVC: a job's checkout is garbage the moment the job
        # ends, and an ephemeral runner must not inherit the last one's tree.
        - name: work
          emptyDir:
            sizeLimit: 8Gi
