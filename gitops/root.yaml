# Mirror of bootstrap/root-application.yaml so the snowflake is also
# visible in the GitOps tree. Bootstrap applies this (or the copy under
# bootstrap/) once. Argo then syncs gitops/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hel1-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/Duncan-Haywood/monorepo-projects.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
