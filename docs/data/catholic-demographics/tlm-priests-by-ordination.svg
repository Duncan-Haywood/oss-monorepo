<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 203" width="760" height="203" role="img" aria-label="Younger priests want the Latin Mass more" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif"><title>Younger priests want the Latin Mass more</title><rect width="760" height="203" fill="#fcfcfb"/><text x="20" y="30" font-size="17" font-weight="600" fill="#0b0b0b">Younger priests want the Latin Mass more</text><text x="20" y="50" font-size="12.5" fill="#52514e">% of US priests who call access to the TLM a priority, by year of ordination</text><line x1="170.0" y1="66" x2="170.0" y2="155" stroke="#e4e3df"/><text x="170.0" y="167" font-size="10.5" fill="#52514e" text-anchor="middle">0%</text><line x1="300.0" y1="66" x2="300.0" y2="155" stroke="#e4e3df"/><text x="300.0" y="167" font-size="10.5" fill="#52514e" text-anchor="middle">10%</text><line x1="430.0" y1="66" x2="430.0" y2="155" stroke="#e4e3df"/><text x="430.0" y="167" font-size="10.5" fill="#52514e" text-anchor="middle">20%</text><line x1="560.0" y1="66" x2="560.0" y2="155" stroke="#e4e3df"/><text x="560.0" y="167" font-size="10.5" fill="#52514e" text-anchor="middle">30%</text><line x1="690.0" y1="66" x2="690.0" y2="155" stroke="#e4e3df"/><text x="690.0" y="167" font-size="10.5" fill="#52514e" text-anchor="middle">40%</text><text x="162" y="80.5" font-size="12" fill="#0b0b0b" text-anchor="end">Ordained 2000 or later</text><rect x="170" y="70" width="507.0" height="13" rx="3" fill="#2a78d6"/><text x="682.0" y="80.5" font-size="10.5" fill="#0b0b0b">39%</text><text x="162" y="107.5" font-size="12" fill="#0b0b0b" text-anchor="end">Ordained 1980-1999</text><rect x="170" y="97" width="260.0" height="13" rx="3" fill="#2a78d6"/><text x="435.0" y="107.5" font-size="10.5" fill="#0b0b0b">20%</text><text x="162" y="134.5" font-size="12" fill="#0b0b0b" text-anchor="end">Ordained before 1980</text><rect x="170" y="124" width="143.0" height="13" rx="3" fill="#2a78d6"/><text x="318.0" y="134.5" font-size="10.5" fill="#0b0b0b">11%</text><text x="20" y="191" font-size="11" fill="#52514e">Source: The Catholic Project (Catholic University of America) 2025 survey of priests, fielded by Gallup, via EWTN News</text></svg>
