<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-label="A 2018 Latin Mass survey vs Catholics generally" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif"><title>A 2018 Latin Mass survey vs Catholics generally</title><rect width="760" height="312" fill="#fcfcfb"/><text x="20" y="30" font-size="17" font-weight="600" fill="#0b0b0b">A 2018 Latin Mass survey vs Catholics generally</text><text x="20" y="50" font-size="12.5" fill="#52514e">Self-selected survey of TLM attendees (n about 1,770) vs figures it cites from Pew and CARA, %</text><rect x="20" y="62" width="11" height="11" rx="2" fill="#2a78d6"/><text x="36" y="72" font-size="12" fill="#0b0b0b">TLM attendees (survey)</text><rect x="195.2" y="62" width="11" height="11" rx="2" fill="#eb6834"/><text x="211.2" y="72" font-size="12" fill="#0b0b0b">Catholics generally (as cited)</text><line x1="200.0" y1="88" x2="200.0" y2="264" stroke="#e4e3df"/><text x="200.0" y="276" font-size="10.5" fill="#52514e" text-anchor="middle">0%</text><line x1="322.5" y1="88" x2="322.5" y2="264" stroke="#e4e3df"/><text x="322.5" y="276" font-size="10.5" fill="#52514e" text-anchor="middle">25%</text><line x1="445.0" y1="88" x2="445.0" y2="264" stroke="#e4e3df"/><text x="445.0" y="276" font-size="10.5" fill="#52514e" text-anchor="middle">50%</text><line x1="567.5" y1="88" x2="567.5" y2="264" stroke="#e4e3df"/><text x="567.5" y="276" font-size="10.5" fill="#52514e" text-anchor="middle">75%</text><line x1="690.0" y1="88" x2="690.0" y2="264" stroke="#e4e3df"/><text x="690.0" y="276" font-size="10.5" fill="#52514e" text-anchor="middle">100%</text><text x="192" y="110.0" font-size="12" fill="#0b0b0b" text-anchor="end">Attend Mass weekly</text><rect x="200" y="92" width="485.1" height="13" rx="3" fill="#2a78d6"/><text x="690.1" y="102.5" font-size="10.5" fill="#0b0b0b">99%</text><rect x="200" y="107" width="107.8" height="13" rx="3" fill="#eb6834"/><text x="312.8" y="117.5" font-size="10.5" fill="#0b0b0b">22%</text><text x="192" y="152.0" font-size="12" fill="#0b0b0b" text-anchor="end">Approve of contraception</text><rect x="200" y="134" width="9.8" height="13" rx="3" fill="#2a78d6"/><text x="214.8" y="144.5" font-size="10.5" fill="#0b0b0b">2%</text><rect x="200" y="149" width="436.1" height="13" rx="3" fill="#eb6834"/><text x="641.1" y="159.5" font-size="10.5" fill="#0b0b0b">89%</text><text x="192" y="194.0" font-size="12" fill="#0b0b0b" text-anchor="end">Approve of abortion</text><rect x="200" y="176" width="4.9" height="13" rx="3" fill="#2a78d6"/><text x="209.9" y="186.5" font-size="10.5" fill="#0b0b0b">1%</text><rect x="200" y="191" width="249.9" height="13" rx="3" fill="#eb6834"/><text x="454.9" y="201.5" font-size="10.5" fill="#0b0b0b">51%</text><text x="192" y="236.0" font-size="12" fill="#0b0b0b" text-anchor="end">Approve of same-sex marriage</text><rect x="200" y="218" width="9.8" height="13" rx="3" fill="#2a78d6"/><text x="214.8" y="228.5" font-size="10.5" fill="#0b0b0b">2%</text><rect x="200" y="233" width="328.3" height="13" rx="3" fill="#eb6834"/><text x="533.3" y="243.5" font-size="10.5" fill="#0b0b0b">67%</text><text x="20" y="300" font-size="11" fill="#52514e">Source: Fr. Donald Kloster, 2018 survey (liturgyguy.com, 24 Feb 2019); comparisons Pew 2016/2018, CARA 2018, Daily Wire 2017</text></svg>
