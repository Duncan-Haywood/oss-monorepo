<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="The Jesuit Volunteer Corps has shrunk" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif"><title>The Jesuit Volunteer Corps has shrunk</title><rect width="760" height="230" fill="#fcfcfb"/><text x="20" y="30" font-size="17" font-weight="600" fill="#0b0b0b">The Jesuit Volunteer Corps has shrunk</text><text x="20" y="50" font-size="12.5" fill="#52514e">Volunteers serving in a year</text><line x1="150.0" y1="66" x2="150.0" y2="182" stroke="#e4e3df"/><text x="150.0" y="194" font-size="10.5" fill="#52514e" text-anchor="middle">0</text><line x1="285.0" y1="66" x2="285.0" y2="182" stroke="#e4e3df"/><text x="285.0" y="194" font-size="10.5" fill="#52514e" text-anchor="middle">150</text><line x1="420.0" y1="66" x2="420.0" y2="182" stroke="#e4e3df"/><text x="420.0" y="194" font-size="10.5" fill="#52514e" text-anchor="middle">300</text><line x1="555.0" y1="66" x2="555.0" y2="182" stroke="#e4e3df"/><text x="555.0" y="194" font-size="10.5" fill="#52514e" text-anchor="middle">450</text><line x1="690.0" y1="66" x2="690.0" y2="182" stroke="#e4e3df"/><text x="690.0" y="194" font-size="10.5" fill="#52514e" text-anchor="middle">600</text><text x="142" y="80.5" font-size="12" fill="#0b0b0b" text-anchor="end">Historical high</text><rect x="150" y="70" width="450.0" height="13" rx="3" fill="#2a78d6"/><text x="605.0" y="80.5" font-size="10.5" fill="#0b0b0b">500</text><text x="142" y="107.5" font-size="12" fill="#0b0b0b" text-anchor="end">2006</text><rect x="150" y="97" width="315.0" height="13" rx="3" fill="#2a78d6"/><text x="470.0" y="107.5" font-size="10.5" fill="#0b0b0b">350</text><text x="142" y="134.5" font-size="12" fill="#0b0b0b" text-anchor="end">About 2022</text><rect x="150" y="124" width="167.4" height="13" rx="3" fill="#2a78d6"/><text x="322.4" y="134.5" font-size="10.5" fill="#0b0b0b">186</text><text x="142" y="161.5" font-size="12" fill="#0b0b0b" text-a