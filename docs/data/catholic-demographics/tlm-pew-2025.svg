<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 354" width="760" height="354" role="img" aria-label="Who has been to a Latin Mass? (Pew, 2025)" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif"><title>Who has been to a Latin Mass? (Pew, 2025)</title><rect width="760" height="354" fill="#fcfcfb"/><text x="20" y="30" font-size="17" font-weight="600" fill="#0b0b0b">Who has been to a Latin Mass? (Pew, 2025)</text><text x="20" y="50" font-size="12.5" fill="#52514e">% of US Catholics, by how often they attend any Mass</text><rect x="20" y="62" width="11" height="11" rx="2" fill="#2a78d6"/><text x="36" y="72" font-size="12" fill="#0b0b0b">Attended a TLM in the last 5 years</text><rect x="274.4" y="62" width="11" height="11" rx="2" fill="#eb6834"/><text x="290.4" y="72" font-size="12" fill="#0b0b0b">Attend a TLM weekly now</text><line x1="200.0" y1="88" x2="200.0" y2="306" stroke="#e4e3df"/><text x="200.0" y="318" font-size="10.5" fill="#52514e" text-anchor="middle">0%</text><line x1="322.5" y1="88" x2="322.5" y2="306" stroke="#e4e3df"/><text x="322.5" y="318" font-size="10.5" fill="#52514e" text-anchor="middle">10%</text><line x1="445.0" y1="88" x2="445.0" y2="306" stroke="#e4e3df"/><text x="445.0" y="318" font-size="10.5" fill="#52514e" text-anchor="middle">20%</text><line x1="567.5" y1="88" x2="567.5" y2="306" stroke="#e4e3df"/><text x="567.5" y="318" font-size="10.5" fill="#52514e" text-anchor="middle">30%</text><line x1="690.0" y1="88" x2="690.0" y2="306" stroke="#e4e3df"/><text x="690.0" y="318" font-size="10.5" fill="#52514e" text-anchor="middle">40%</text><text x="192" y="110.0" font-size="12" fill="#0b0b0b" text-anchor="end">All US Catholics</text><rect x="200" y="92" width="159.2" height="13" rx="3" fill="#2a78d6"/><text x="364.2" y="102.5" font-size="10.5" fill="#0b0b0b">13%</text><rect x="200" y="107" width="24.5" height="13" rx="3" fill="#eb6834"/><text x="229.5" y="117.5" font-size="10.5" fill="#0b0b0b">2%</text><text x="192" y="152.0" font-size="12" fill="#0b0b0b" text-anchor="end">Attend Mass weekly</text><rect x="200" y="134" width="269.5" height="13" rx="3" fill="#2a78d6"/><text x="474.5" y="144.5" font-size="10.5" fill="#0b0b0b">22%</text><rect x="200" y="149" width="49.0" height="13" rx="3" fill="#eb6834"/><text x="254.0" y="159.5" font-size="10.5" fill="#0b0b0b">4%</text><text x="192" y="194.0" font-size="12" fill="#0b0b0b" text-anchor="end">Once or twice a month</text><rect x="200" y="176" width="183.8" height="13" rx="3" fill="#2a78d6"/><text x="388.8" y="186.5" font-size="10.5" fill="#0b0b0b">15%</text><rect x="200" y="191" width="12.2" height="13" rx="3" fill="#eb6834"/><text x="217.2" y="201.5" font-size="10.5" fill="#0b0b0b">1%</text><text x="192" y="236.0" font-size="12" fill="#0b0b0b" text-anchor="end">A few times a year / seldom</text><rect x="200" y="218" width="98.0" height="13" rx="3" fill="#2a78d6"/><text x="303.0" y="228.5" font-size="10.5" fill="#0b0b0b">8%</text><rect x="200" y="233" width="6.1" height="13" rx="3" fill="#eb6834"/><text x="211.1" y="243.5" font-size="10.5" fill="#0b0b0b"><1%</text><text x="192" y="278.0" font-size="12" fill="#0b0b0b" text-anchor="end">Never attend Mass</text><rect x="200" y="260" width="85.8" height="13" rx="3" fill="#2a78d6"/><text x="290.8" y="270.5" font-size="10.5" fill="#0b0b0b">7%</text><rect x="200" y="275" width="12.2" height="13" rx="3" fill="#eb6834"/><text x="217.2" y="285.5" font-size="10.5" fill="#0b0b0b">1%</text><text x="20" y="342" font-size="11" fill="#52514e">Source: Pew Research Center, survey of US adults 3-9 Feb 2025 (1,787 Catholics), published 16 Jun 2025</text></svg>
