  verdict: minor
  findings:
  - level: L
    quote: Philip the deacon is remembered in both traditions on the eleventh of October
    issue: Eleven October is the Orthodox date. The Roman Martyrology commemorates Philip the deacon on
      6 June, so "both traditions" on 11 October is wrong for Catholics, even with the hedge that follows.
    fix: Say "the Orthodox keep him on the eleventh of October and the Roman Martyrology on the sixth
      of June".
