- id: saints-by-candlelight/056-the-wedding-at-cana-and-the-six-stone-jars
  title: The Wedding at Cana and the Six Stone Jars
  verdict: minor
  findings:
  - level: L
    quote: in the year of the cycle that uses John
    issue: Imprecise. On the Second Sunday in Ordinary Time every year of the Sunday cycle reads from
      John (1:29-34 in Year A, 1:35-42 in Year B, 2:1-11 in Year C); Cana is Year C, which is otherwise
      Luke's year, so no year is "the year that uses John". The traditional Roman Missal reads Cana every
      year on the Second Sunday after Epiphany, the date a strict reader would expect.
    fix: Say "the Second Sunday in Ordinary Time in Year C" and add "and, in the older Roman Missal, every
      year on the Second Sunday after Epiphany".
  - level: T
    quote: with his mother and his brothers and his disciples
    issue: John 2:12 is quoted with no gloss, so a modern listener may take "brothers" to mean other sons
      of Mary. A strict reader expects the perpetual virginity to be guarded, and both traditions read
      "brothers" as kinsmen.
    fix: Add a half-sentence saying that both traditions understand these "brothers" as kinsmen of Jesus,
      not other children of Mary.
  notes: The Marian handling is strong. "Woman" is explained as respectful and tied to the cross, Mary's
    intercession ("brings the need of the people to her son") is named as the reading of both traditions,
    and "do whatever he tells you" is at the centre. The miracle is stated plainly ("the water had become
    wine") and linked to the Word made flesh.
