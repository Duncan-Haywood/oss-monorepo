    quote: A mother to be made clean, and a firstborn to be presented.
    issue: The traditional reading (Aquinas and the old feast of the Purification) holds that Mary, a
      virgin who conceived without seed and bore the child without loss of her virginity, was not bound
      by the purification law of Leviticus 12 and kept it out of humility. The narration treats her as
      simply one more mother to be made clean. Ritual impurity is not sin, so no dogma is broken.
    fix: Add one line saying that the Church has long held Mary was not bound by this law but kept it
      in humility.
  - level: T
    quote: In the Catholic Church it is the Presentation of the Lord, kept on the second of February
    issue: Only the post-1969 title is given. The traditional Roman calendar keeps 2 February as the Purification
      of the Blessed Virgin Mary (Candlemas), the name a strict reader would expect.
    fix: Add "long called the Purification of the Blessed Virgin Mary".
  notes: The Nunc Dimittis is quoted accurately and placed correctly at Catholic Night Prayer and Orthodox
    Vespers. The sword prophecy is tied to the sorrows of Mary without overreach. The Septuagint-translator
    legend about Simeon is labelled impossible on dates. The Orthodox dates (2/15 February, Simeon and
    Anna on 3 February) are right.
