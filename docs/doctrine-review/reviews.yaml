    quote: many Catholics honour him and are very welcome to
    issue: Correctly says Rome has not canonised Herman, but then gives unqualified permission to "honour"
      him. Canon law (canon 1187) restricts public cult to persons the Church has listed among the saints
      or blessed. Private admiration and reading his life are fine, but "very welcome to honour" overstates
      this. The front matter's "free to admire him" is the accurate wording.
    fix: Say "Catholics are free to admire him and read his life" instead of "honour him".
