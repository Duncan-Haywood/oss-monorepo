- id: saints-by-candlelight/069-thomas-and-the-locked-room-in-jerusalem
  title: Thomas and the Locked Room in Jerusalem
  verdict: faithful
  findings:
  - level: T
    quote: most readers think it was the original end of the whole book, before the last chapter was added
    issue: A historical-critical aside treating John 21 as a later appendix. The Church receives John
      21 as canonical and part of the Gospel, and a strict reader would leave out the theory.
    fix: Say only that John here speaks to the reader directly, and drop the claim about an added chapter.
  - level: T
    quote: Both our traditions have a great deal to say about those words, and they are not tonight's
      business.
    issue: John 20:22-23 is the text Trent defined as the institution of the power to forgive and retain
      sins in the sacrament of penance. Saying nothing about it fits the house rule, but a strict reader
      would want at least a nod to the sacrament.
    fix: Add one clause saying that both traditions see here the Lord giving his apostles the power to
      forgive sins in confession.
  - level: T
    quote: If you ever need a reason to think that honest doubt is not the enemy of faith
    issue: The reading of Thomas is generous. The Fathers (for example Gregory the Great) treat his unbelief
      as a fault that God turned to our good, and "Do not be unbelieving" is a mild rebuke. The episode
      quotes that rebuke but leans toward praising the doubt.
    fix: Add that the Lord gently corrected Thomas, and that his doubt became a gift to us because it
      was answered.
  notes: The Christology is the strongest in the batch. The risen Lord shows "the same body that was nailed
    there", and "My Lord and my God" is tied to John 1:1 as the high point of the Gospel. The episode
    honestly notes that John does not say Thomas touched the wounds. The "fear of the Jews" phrase is
    explained to head off antisemitic misreading.
