- id: hearth-and-horizon/aim-off
  title: Aim Off
  verdict: minor
  depth: scene
  findings:
  - level: L
    quote: The vigil Mass for Saints Peter and Paul was at six. It was the twenty-ninth of June.
    issue: The Missal's Vigil Mass of Saints Peter and Paul is celebrated on the evening of 28 June; 29
      June 2047 is the solemnity itself and a Saturday, so a six o'clock Mass that evening is not the
      solemnity's vigil (it would be the Mass of the day or the anticipated Mass of the Thirteenth Sunday).
    fix: Set the crossing on 28 June, or call it 'the evening Mass' on the feast.
  notes: Read the opening and the arrival scene; the priest's joke about Saint Peter is labelled as a
    joke in the end note.
  reviewed: '2026-11-07'
  batch: 1
  sha256: b18e09d3f2b15c64
- id: hearth-and-horizon/the-third-list
  title: The Third List
  verdict: faithful
  depth: scene
  findings:
  - level: T
    quote: already blessed by the Methodist chaplain
    issue: The Saint Blaise blessing of throats is a Catholic sacramental normally given by a priest or
      deacon (a lay minister uses a different formula); here a Methodist chaplain gives it, and the narration
      does not mark the difference. No doctrine is broken, since the woman leaves her own blessing 'for
      later', but a strict reader would note the ecumenical framing.
    fix: 'Optional: have the shelter''s Catholic deacon or priest give the Saint Blaise blessing, or say
      the Methodist chaplain prayed for them.'
  notes: Read the scene on Saint Blaise's day only; the end note states Candlemas and the Saint Blaise
    blessing correctly.
  reviewed: '2026-11-07'
