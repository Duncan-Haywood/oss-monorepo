- id: hearth-and-horizon/clare-and-the-loaves-with-a-cross
  title: Clare and the Loaves with a Cross
  verdict: minor
  findings:
  - level: P
    quote: This is a legend. People wrote it down some years after Clare died.
    issue: The story of soldiers (the Saracen troops of 1240) turned back while Clare prayed before the
      Eucharist is, to my knowledge, attested by several sisters under oath in the 1253 Process of Canonisation,
      and is not only a later Life. Calling it 'a legend' understates the best-attested miracle in her
      life. I am fairly confident of this; check the Process text.
    fix: Call it something her sisters swore to at her canonisation, while still saying we cannot check
      how it happened.
  - level: P
    quote: the sign of the cross on the loaves is reported in the sisters' own testimonies
    issue: As far as I know, the crosses appearing on blessed loaves (at the Pope's request, in most tellings)
      come from later Franciscan chronicles, not the Process. What the sisters testified to was a single
      loaf that fed the community. The note seems to have the sourcing of the two episodes reversed. This
      is uncertain and needs checking.
    fix: Check the Process testimonies and relabel the loaves as later tradition if they are not in it.
  notes: The Eucharist is handled reverently and the deliverance is put down to her prayer and trust in
    God. The dates (Innocent IV's approval on 9 August 1253, canonisation in 1255, the 11 August feast)
    are right. The prayer correctly asks 'Pray for us'.
  depth: full
  reviewed: '2026-11-07'
