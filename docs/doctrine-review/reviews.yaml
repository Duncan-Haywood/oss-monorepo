- id: hearth-and-horizon/benedict-and-the-raven
  title: Benedict and the Raven
  verdict: minor
  findings:
  - level: P
    quote: He called it a *rule*
    issue: The narration places the giving of a rule at Subiaco, in the early cave years. The Rule of
      Saint Benedict is generally dated to his later years at Monte Cassino (c. 530-540), so this is an
      anachronism told as history.
    fix: Say he taught them a way of living together, and that years later, at Monte Cassino, he wrote
      it down as his Rule.
  notes: Follows Gregory's Dialogues II closely, including the command 'In the name of Jesus Christ',
    so the raven obeys at Christ's name, not Benedict's power. Softening the poison to 'not good to eat'
    is disclosed in the note.
