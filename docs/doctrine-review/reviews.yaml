- id: saints-by-candlelight/063-peter-and-the-knock-at-the-gate-of-mary-mother-of-mark
  title: Peter and the Knock at the Gate of Mary, Mother of Mark
  verdict: concern
  findings:
  - level: D
    quote: It is an odd belief, and we will not go into it, because Luke does not.
    issue: The disciples' "It is his angel" (Acts 12:15) is a classic scriptural witness to guardian angels,
      which the Church teaches (CCC 336). The narration calls it "an odd belief" and glosses it as "a
      kind of guardian of Peter, come to give them a sign that he had died". That waves aside, and partly
      misdescribes, a teaching a strict reader holds as certain. It can be read orthodoxly as "odd in
      the moment", hence concern, not error.
    fix: Say instead that the disciples spoke of Peter's guardian angel, whom the Church teaches stands
      beside each believer, and drop "odd belief" and the death gloss.
  - level: T
    quote: one of the leaders of the community in Jerusalem, a man the others look to
    issue: This keeps the house rule's silence on the papacy but plays down Peter's place among the apostles.
      Acts itself shows him as their spokesman and head, and a strict reader expects at least "first among
      the apostles". It is not a denial.
    fix: Use Luke's own picture, "the first of the apostles, the one who speaks for them", which both
      traditions accept.
  - level: L
    quote: Catholic calendars keep the feast of Saint Peter in Chains on the first of August
    issue: The feast was dropped from the General Roman Calendar by the 1960 rubrics. It survives in the
      Roman Martyrology, at San Pietro in Vincoli and on pre-1960 calendars, so "Catholic calendars keep"
      overstates the present Roman calendar.
    fix: Say "the Roman Martyrology and the older Roman calendar keep Saint Peter's Chains on the first
      of August".
  notes: The angel is a creature, the miracle is God's ("God did it, through his messenger"), and the
    chains are treated as a later devotion, not as magic. The "James ... the brother, or kinsman, of the
    Lord" gloss handles the brothers question well. Unflagged and uncertain is the sign-off "a blessing,
    from an old prayer", which does not look like a known prayer, so the attribution may be invented.
  depth: full
