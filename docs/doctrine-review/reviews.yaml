    quote: That verse is found in the Bibles that the Orthodox Church uses and in many old translations
    issue: Acts 8:37, the eunuch's profession "I believe that Jesus Christ is the Son of God", is also
      in the Clementine Vulgate and the Douay-Rheims, the Bible of the traditional Latin Church. Leaving
      it out drops the profession of faith before baptism, which a strict reader values.
    fix: Name the Vulgate and Douay alongside the Orthodox Bibles, or keep the verse marked as a disputed
      reading.
