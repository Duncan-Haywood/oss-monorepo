- id: saints-by-candlelight/068-mary-magdalene-and-the-gardener-at-the-tomb
  title: Mary Magdalene and the Gardener at the Tomb
  verdict: minor
  findings:
  - level: L
    quote: the Sunday of the Myrrh-Bearers, the third Sunday after Easter
    issue: The Sunday of the Myrrh-Bearers is the third Sunday of Pascha, counting Pascha itself, so it
      is the second Sunday after Easter. The series' own Thomas episode calls Thomas Sunday "the first
      Sunday after Easter", which makes this an off-by-one.
    fix: Say "the second Sunday after Easter (the third Sunday of Pascha)".
  - level: T
    quote: The mixing of the two women into one came much later, and it has been repeated for so long
      that many people take it for the text.
    issue: The Western identification of Mary Magdalene with the sinful woman of Luke 7 and with Mary
      of Bethany comes from Gregory the Great. It shaped the traditional Roman liturgy of 22 July, whose
      Gospel was Luke 7:36-50. The episode presents the Eastern and post-conciliar view as the only one
      and implies the Latin tradition was a mistake.
    fix: Say that the Latin Church long read the women as one and the East did not, and that tonight follows
      the text.
  - level: T
    quote: The four tellings do not match in every detail, and the Church has never pretended that they
      do.
    issue: The Church has a long tradition of harmonising the Resurrection accounts (Augustine's work
      on the agreement of the evangelists), and a strict reader would object to the dismissive tone. The
      episode does stress what the accounts agree on.
    fix: Say that "the Church has long shown how the four accounts fit together, and they agree on what
      matters".
  notes: The bodily Resurrection is clear. He comes "not as a ghost ... but as himself", Mary takes hold
    of him, the folded head cloth argues against theft, and her "I have seen the Lord" is kept. Both titles,
    apostle to the apostles and equal to the apostles, are honoured.
  depth: full
  reviewed: '2026-11-07'
