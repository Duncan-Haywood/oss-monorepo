- id: saints-by-candlelight/047-joshua-and-the-woman-with-the-scarlet-cord
  title: Joshua and the Woman with the Scarlet Cord
  verdict: concern
  findings:
  - level: M
    quote: Some of the Fathers thought she was wrong and God was merciful, and others thought she was
      right to protect the innocent
    issue: On Rahab's lie the narration presents lying-to-protect as an open question ('We have not tried
      to settle it'). Catholic moral teaching, following Augustine and Aquinas (who discuss Rahab explicitly),
      holds that a lie is never permitted; Rahab is praised for faith and hospitality, not for the lie.
      A strict reader would object to leaving it unsettled.
    fix: State that the Church teaches lying is always wrong and that Scripture praises Rahab's faith
      and welcome, not her false words.
  - level: M
    quote: the churches have not agreed about what to make of it
    issue: Same issue in the body; it suggests the Church has no settled teaching on the morality of lying.
    fix: Say 'the Fathers discussed it, and the Church's teaching is that her faith, not her lie, is praised'.
  - level: P
    quote: by the book's own count nearly eighty
    issue: Joshua 14:10 has Caleb say he is eighty-five, so 'by the book's own count nearly eighty' misstates
      the text.
