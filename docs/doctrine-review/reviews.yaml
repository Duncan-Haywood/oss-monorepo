- id: hearth-and-horizon/one-in-eleven
  title: One in Eleven
  verdict: concern
  depth: full
  findings:
  - level: D
    quote: That is not mine to say, and I think it is true, and I think it is also what the whole parish
      believes.
    issue: The AI endorses the grandmother's line "He is a child of God whichever way the card falls"
      as true and as the parish's belief, in the scene where it talks her out of an early baptism. Strictly,
      divine adoptive sonship is given in baptism (Catechism 1265), and the Church urges infant baptism
      without undue delay; read loosely (every child is God's creature and loved) it is orthodox, but
      the narration lets the stronger sense stand unanswered.
    fix: 'Have Father Aonghas distinguish: God''s child by creation and love, made his adopted son in
      baptism, which is why the Church asks it be done in the first weeks and at once in danger of death.'
  notes: 'Otherwise sound: the priest, not the AI, decides; baptism follows on the Sunday at Mass with
    water poured; the end note declines to settle the necessity of baptism and children who die unbaptised.'
