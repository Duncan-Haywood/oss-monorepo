- id: saints-by-candlelight/006-columba-and-the-beast-in-the-river-ness
  title: Columba and the Beast in the River Ness
  verdict: concern
  findings:
  - level: M
    quote: in the eyes of the Church, then and now, a person is a person, and cannot be owned
    issue: The Church now condemns enslavement, but it did not teach "then" that no one can be owned.
      Through the manual tradition and as late as the Holy Office instruction of 1866, servitude under
      a just title was held not to be against natural law. The narration therefore misstates the Church's
      past moral teaching, and a strict reader would object.
    fix: Say that Columba, as a Christian and an Irishman, pressed for a captive's freedom, and leave
      out the claim about what the Church held then.
  notes: Otherwise exemplary. "A saint prays. God acts." The white stone heals "only when God willed it
    ... the stone itself had no power of its own", and Adomnán is labelled clearly as a source written
    a century later. The Psalm 33/34 deathbed scene is accurate.
  depth: full
