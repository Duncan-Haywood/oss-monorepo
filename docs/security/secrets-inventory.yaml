# Every secret a workflow in this repository can read: who issues it, what it
# can do, where it is read and stored, how it rotates, and what the owner
# still has to do. Names only. Values never go in this file; the check below
# fails on anything shaped like one.
#
# Kept honest by platform/ci/secrets_inventory.py, which fails when a workflow
# reads a secret not listed here, when an entry lists one no workflow reads,
# or when `workflows` / `environments` drift from the files:
#
#   python3 platform/ci/secrets_inventory.py           # check
#   python3 platform/ci/secrets_inventory.py --usage   # where each secret is read
#
# Fields
#   provider      who issues the credential
#   scope         what it can do, as far as the repository's own files say.
#                 "not recorded" means no file states the permissions the
#                 owner chose when creating it; check in the provider's UI.
#   workflows     files under .github/workflows/ that read it (checked)
#   environments  GitHub environments of the jobs that read it, or
#                 `repository` for a job with none (checked). Store the secret
#                 in exactly these: an environment secret is invisible to a
#                 job outside that environment, and a repository secret is
#                 visible to every workflow on every branch.
#   rotation      short-lived  minted per job, expires within hours, nothing to rotate
#                 scheduled    rotated by code on a schedule
#                 manual       a long-lived value someone has to replace by hand
#   alias_of      this name is a fallback spelling of another entry
#   owner_action  what the owner should do, or "none"
#
# `retired` lists secrets the workflows no longer read and the owner should
# delete from Settings; the check fails if a workflow reads one again.
#
# Background and the plan to shrink the `manual` list:
# docs/security/trusted-publishing-setup.md and docs/security/agent-hardening.md.
# Last full review: 2026-11-24.

repo: duncan-haywood/oss-monorepo

secrets:
  # --- GitHub -------------------------------------------------------------
  - name: GITHUB_TOKEN
    provider: GitHub (built in)
    scope: The job's own installation token, limited by each workflow's `permissions:` block.
    workflows: [priv-adopt-stranded-branches.yml, priv-agent-pr-auto-merge.yml, priv-branch-cleanup.yml, priv-distribute-desktop.yml, priv-distribute-ghcr.yml, priv-distribute-releases.yml, priv-distribute-tool-releases.yml, priv-opencode-high-throughput.yml, priv-research-archive.yml, priv-security-alert-queue.yml, priv-site-usage-pull.yml]
    environments: [paid-agents, repository, usage]
    rotation: short-lived
    owner_action: none

  - name: AGENT_REVIEWER_GH_APP_ID
    provider: GitHub App (agent reviewer "gh")
    scope: Not a credential; the numeric App ID, paired with the private key below.
    workflows: [priv-agent-cross-review.yml]
    environments: [repository]
    rotation: manual
    owner_action: none. Could be a repository variable instead of a secret; harmless as is.
  - name: AGENT_REVIEWER_GH_PRIVATE_KEY
    provider: GitHub App (agent reviewer "gh")
    scope: Signs JWTs for an installation token with Pull requests read/write, Contents read, Metadata read (platform/ci/agent_review/README.md). The tokens it mints last one hour.
    workflows: [priv-agent-cross-review.yml]
    environments: [repository]
    rotation: manual
    owner_action: none required. The key itself does not expire; regenerate it in the App's settings if it leaks.
  - name: AGENT_REVIEWER_KILO_APP_ID
    provider: GitHub App (agent reviewer "kilo")
    scope: Not a credential; the numeric App ID.
    workflows: [priv-agent-cross-review.yml]
    environments: [repository]
    rotation: manual
    owner_action: none
  - name: AGENT_REVIEWER_KILO_PRIVATE_KEY
    provider: GitHub App (agent reviewer "kilo")
    scope: Same permissions as the gh reviewer app; mints one-hour installation tokens.
    workflows: [priv-agent-cross-review.yml]
    environments: [repository]
    rotation: manual
    owner_action: none required
  - name: AGENT_REVIEWER_CURSOR_APP_ID
    provider: GitHub App (agent reviewer "cursor")
    scope: Not a credential; the numeric App ID.
    workflows: [priv-agent-cross-review.yml]
    environments: [repository]
    rotation: manual
    owner_action: none
  - name: AGENT_REVIEWER_CURSOR_PRIVATE_KEY
    provider: GitHub App (agent reviewer "cursor")
    scope: Same permissions as the gh reviewer app; mints one-hour installation tokens.
    workflows: [priv-agent-cross-review.yml]
    environments: [repository]
    rotation: manual
    owner_action: none required
  - name: AGENT_REVIEWER_CLAUDE_APP_ID
    provider: GitHub App (agent reviewer "claude")
    scope: Not a credential; the numeric App ID.
    workflows: [priv-agent-cross-review.yml]
    environments: [repository]
    rotation: manual
    owner_action: none
  - name: AGENT_REVIEWER_CLAUDE_PRIVATE_KEY
    provider: GitHub App (agent reviewer "claude")
    scope: Same permissions as the gh reviewer app; mints one-hour installation tokens.
    workflows: [priv-agent-cross-review.yml]
    environments: [repository]
    rotation: manual
    owner_action: none required

  - name: TRAFFIC_TOKEN
    provider: GitHub fine-grained personal access token
    scope: Administration read-only on the repositories in TRAFFIC_REPOS, to read the traffic API (portfolio/usage/README.md). The workflow's own token cannot be given that permission.
    workflows: [priv-site-usage-pull.yml]
    environments: [usage]
    rotation: manual
    owner_action: Fine-grained PATs carry an expiry; renew it before it lapses or the traffic pull skips. A GitHub App with Administration read installed on those repositories would replace it with one-hour tokens.


  - name: HOMEBREW_TAP_APP_PRIVATE_KEY
    provider: GitHub App (Homebrew tap writer)
    scope: Mints a one-hour installation token with Contents read/write on the tap repository only (the app is installed there and nowhere else). Acts as the app, not as the owner's account.
    workflows: [priv-distribute-homebrew.yml]
    environments: [publish]
    rotation: manual
    owner_action: Create the app and store the key (docs/security/trusted-publishing-setup.md, "Homebrew tap"). The key does not expire; regenerate it on the app's page if it leaks. The tokens it mints are short-lived.

  # --- Cloudflare ---------------------------------------------------------
  - name: CLOUDFLARE_API_TOKEN
    provider: Cloudflare API token
    scope: Account Workers Scripts edit for the site and edge Worker deploys (platform/pages/cloudflare/README.md), plus Email Routing edit for priv-cloudflare-email.yml and, as the usage pull's fallback, Account Analytics read. One token serves every deploy.
    workflows: [priv-ai-first-markets-deploy.yml, priv-aws-apply.yml, priv-aws-worker-secret-sync.yml, priv-cloudflare-email.yml, priv-edge-deploy.yml, priv-email-deploy.yml, priv-payapps-deploy.yml, priv-portfolio-pages.yml, priv-real-estate-agent-photo-app-deploy-docs.yml, priv-retail-pilot-intel-deploy-docs.yml, priv-seller-books-deploy.yml, priv-site-usage-pull.yml]
    environments: [cloudflare, payapps-production, repository, seller-books-production, usage]
    rotation: manual
    owner_action: Cloudflare has no OIDC federation for GitHub Actions, so this stays a long-lived token. Give it an expiry (Cloudflare tokens take a TTL) and an IP filter if wanted; split the Email Routing permission into its own token if the deploy token should not hold it. Store it under this one name and delete the aliases below.
  - name: CLOUDFLAREAPITOKEN
    provider: Cloudflare API token
    scope: Same as CLOUDFLARE_API_TOKEN; an older spelling the workflows still fall back to.
    alias_of: CLOUDFLARE_API_TOKEN
    workflows: [priv-aws-apply.yml, priv-aws-worker-secret-sync.yml, priv-cloudflare-email.yml, priv-edge-deploy.yml, priv-email-deploy.yml, priv-payapps-deploy.yml, priv-portfolio-pages.yml, priv-retail-pilot-intel-deploy-docs.yml, priv-seller-books-deploy.yml, priv-site-usage-pull.yml]
    environments: [cloudflare, payapps-production, repository, seller-books-production, usage]
    rotation: manual
    owner_action: Check Settings for which spelling actually holds the token. Once CLOUDFLARE_API_TOKEN does, delete this one; a later workflow PR can then drop the fallback.
  - name: CLOUDFLARERESTRICTEDAPIKEY
    provider: Cloudflare API token
    scope: Same as CLOUDFLARE_API_TOKEN; the token was saved under this name on 2026-10-24 (docs/posts/2026-10-24-free-site-analytics-on-a-cloudflare-worker.md).
    alias_of: CLOUDFLARE_API_TOKEN
    workflows: [priv-aws-apply.yml, priv-aws-worker-secret-sync.yml, priv-cloudflare-email.yml, priv-edge-deploy.yml, priv-email-deploy.yml, priv-payapps-deploy.yml, priv-portfolio-pages.yml, priv-retail-pilot-intel-deploy-docs.yml, priv-seller-books-deploy.yml, priv-site-usage-pull.yml]
    environments: [cloudflare, payapps-production, repository, seller-books-production, usage]
    rotation: manual
    owner_action: Copy the value to CLOUDFLARE_API_TOKEN (or rotate and store the new one there), then delete this name.
  - name: CLOUDFLARE_ACCOUNT_ID
    provider: Cloudflare
    scope: Not a credential; the account ID that API calls are made against.
    workflows: [priv-ai-first-markets-deploy.yml, priv-aws-worker-secret-sync.yml, priv-cloudflare-email.yml, priv-edge-deploy.yml, priv-email-deploy.yml, priv-payapps-deploy.yml, priv-portfolio-pages.yml, priv-real-estate-agent-photo-app-deploy-docs.yml, priv-retail-pilot-intel-deploy-docs.yml, priv-seller-books-deploy.yml, priv-site-usage-pull.yml]
    environments: [cloudflare, payapps-production, repository, seller-books-production, usage]
    rotation: manual
    owner_action: none. Could be a variable.
  - name: CLOUDFLAREACCOUNTID
    provider: Cloudflare
    scope: Older spelling of CLOUDFLARE_ACCOUNT_ID.
    alias_of: CLOUDFLARE_ACCOUNT_ID
    workflows: [priv-aws-worker-secret-sync.yml, priv-cloudflare-email.yml, priv-edge-deploy.yml, priv-email-deploy.yml, priv-payapps-deploy.yml, priv-portfolio-pages.yml, priv-retail-pilot-intel-deploy-docs.yml, priv-seller-books-deploy.yml, priv-site-usage-pull.yml]
    environments: [cloudflare, payapps-production, repository, seller-books-production, usage]
    rotation: manual
    owner_action: Delete once CLOUDFLARE_ACCOUNT_ID holds the value.
  # --- PayApps (ventures/payapps, priv-payapps-deploy.yml) -------------------
  # All optional: the first deploy needs none of them (AUTH_SECRET is generated on the
  # Worker; checkout stays dark). Each is pushed to the payapps Worker with wrangler
  # secret bulk only when set. Store them in the payapps-production environment.
  - name: PAYAPPS_AUTH_SECRET
    provider: Self-generated (PayApps Worker)
    scope: Session-signing key for the PayApps Worker. Optional override; without it the deploy generates one on the Worker once and never overwrites it.
    workflows: [priv-payapps-deploy.yml]
    environments: [payapps-production]
    rotation: manual
    owner_action: none. Leave unset unless rotating (setting it signs everyone out).
  - name: PAYAPPS_BILLING_API_KEY
    provider: Paddle API key
    scope: Paddle Billing API, product and price read and write, to sync billing/paddle-catalog.json and for the Worker's checkout calls.
    workflows: [priv-payapps-deploy.yml]
    environments: [payapps-production]
    rotation: manual
    owner_action: After Paddle account verification (decision queue, payout-rail), create a key with product and price permissions and an expiry, and store it here with PAYAPPS_BILLING_PROVIDER=paddle (a variable).
  - name: PAYAPPS_BILLING_WEBHOOK_SECRET
    provider: Paddle notification destination
    scope: Signing secret the PayApps Worker verifies Paddle webhooks with.
    workflows: [priv-payapps-deploy.yml]
    environments: [payapps-production]
    rotation: manual
    owner_action: With the API key, from the notification destination for <APP_URL>/api/billing/webhook (ventures/payapps/apps/payapps/docs/BILLING.md).
  - name: PAYAPPS_BILLING_PRICE_IDS
    provider: Paddle (configuration)
    scope: Not a credential; fallback price ids for when the catalog sync returns none.
    workflows: [priv-payapps-deploy.yml]
    environments: [payapps-production]
    rotation: manual
    owner_action: none. The deploy reads the ids back from Paddle.
  - name: PAYAPPS_QBO_CLIENT_ID
    provider: Intuit developer app
    scope: OAuth client id for the QuickBooks Online connection.
    workflows: [priv-payapps-deploy.yml]
    environments: [payapps-production]
    rotation: manual
    owner_action: Only when turning QuickBooks on (ventures/payapps/apps/payapps/docs/QUICKBOOKS.md).
  - name: PAYAPPS_QBO_CLIENT_SECRET
    provider: Intuit developer app
    scope: OAuth client secret for the QuickBooks Online connection.
    workflows: [priv-payapps-deploy.yml]
    environments: [payapps-production]
    rotation: manual
    owner_action: Only when turning QuickBooks on (ventures/payapps/apps/payapps/docs/QUICKBOOKS.md).
  - name: PAYAPPS_QBO_TOKEN_KEY
    provider: Self-generated (PayApps Worker)
    scope: Key the Worker encrypts stored QuickBooks tokens with.
    workflows: [priv-payapps-deploy.yml]
    environments: [payapps-production]
    rotation: manual
    owner_action: Only with QuickBooks; `openssl rand -hex 32`.
  # --- Seller Books (ventures/seller-books, priv-seller-books-deploy.yml) -----
  # All optional: the first deploy needs none of them (AUTH_SECRET is generated on the
  # Worker; checkout stays dark). Each is pushed to the seller-books Worker with wrangler
  # secret bulk only when set. Store them in the seller-books-production environment.
  - name: SELLER_BOOKS_AUTH_SECRET
    provider: Self-generated (Seller Books Worker)
    scope: Session-signing key for the Seller Books Worker. Optional override; without it the deploy generates one on the Worker once and never overwrites it.
    workflows: [priv-seller-books-deploy.yml]
    environments: [seller-books-production]
    rotation: manual
    owner_action: none. Leave unset unless rotating (setting it signs everyone out).
  - name: SELLER_BOOKS_BILLING_API_KEY
    provider: Paddle API key
    scope: Paddle Billing API, product and price read and write, to sync billing/paddle-catalog.json and for the Worker's checkout calls.
    workflows: [priv-seller-books-deploy.yml]
    environments: [seller-books-production]
    rotation: manual
    owner_action: After Paddle account verification (decision queue, payout-rail), create a key with product and price permissions and an expiry, and store it here with SELLER_BOOKS_BILLING_PROVIDER=paddle (a variable).
  - name: SELLER_BOOKS_BILLING_WEBHOOK_SECRET
    provider: Paddle notification destination
    scope: Signing secret the Seller Books Worker verifies Paddle webhooks with.
    workflows: [priv-seller-books-deploy.yml]
    environments: [seller-books-production]
    rotation: manual
    owner_action: With the API key, from the notification destination for <APP_URL>/api/billing/webhook (ventures/seller-books/apps/seller-books/docs/BILLING.md).
  - name: SELLER_BOOKS_BILLING_PRICE_IDS
    provider: Paddle (configuration)
    scope: Not a credential; fallback price ids for when the catalog sync returns none.
    workflows: [priv-seller-books-deploy.yml]
    environments: [seller-books-production]
    rotation: manual
    owner_action: none. The deploy reads the ids back from Paddle.
  - name: CLOUDFLARE_ANALYTICS_TOKEN
    provider: Cloudflare API token
    scope: Read-only analytics. Zone Analytics read, Zone read and Account Analytics read (portfolio/usage/README.md).
    workflows: [priv-site-usage-pull.yml]
    environments: [usage]
    rotation: manual
    owner_action: Unset as of 2026-11 (the pull falls back to the deploy token and misses zone totals). When creating it, give it an expiry.
  - name: EMAIL_FORWARD_TO
    provider: Cloudflare Email Routing (configuration)
    scope: Not a credential; the owner's personal address. Email Routing verifies it as a destination, and the mail Worker (platform/email) forwards privacy@/security@ to it and sends flag alerts and the daily digest there. Kept out of the public tree.
    workflows: [priv-cloudflare-email.yml, priv-email-deploy.yml]
    environments: [cloudflare]
    rotation: manual
    owner_action: none

  - name: MAIL_AGENT_TOKEN
    provider: Self-generated (platform/email mail Worker)
    scope: Bearer token for the agent inbox API (read, label, classify, flag, draft, send through the guardrails); pushed to the Worker as AGENT_TOKEN. Agent sessions hold the same value.
    workflows: [priv-email-deploy.yml]
    environments: [cloudflare]
    rotation: manual
    owner_action: Create with `openssl rand -hex 32` (platform/email/README.md, Owner steps).
  - name: MAIL_READ_TOKEN
    provider: Self-generated (platform/email mail Worker)
    scope: Read-only bearer token for the agent inbox API; pushed to the Worker as READ_TOKEN.
    workflows: [priv-email-deploy.yml]
    environments: [cloudflare]
    rotation: manual
    owner_action: Create with `openssl rand -hex 32`.
  - name: MAIL_OWNER_TOKEN
    provider: Self-generated (platform/email mail Worker)
    scope: Owner bearer token; the only one that resolves owner flags and records marketing opt-ins. Pushed to the Worker as OWNER_TOKEN; never given to agent sessions.
    workflows: [priv-email-deploy.yml]
    environments: [cloudflare]
    rotation: manual
    owner_action: Create with `openssl rand -hex 32`; keep it to yourself.
  - name: MAIL_UNSUBSCRIBE_SECRET
    provider: Self-generated (platform/email mail Worker)
    scope: HMAC key for one-click unsubscribe links; pushed to the Worker as UNSUBSCRIBE_SECRET. Rotating it breaks links already sent.
    workflows: [priv-email-deploy.yml]
    environments: [cloudflare]
    rotation: manual
    owner_action: Create with `openssl rand -hex 32`.

  # --- Other deploy targets -----------------------------------------------
  - name: AUTH_SECRET
    provider: Self-generated (ai-first-markets Worker)
    scope: Signs the ai-first-markets Worker's session cookies; pushed to the Worker as a Wrangler secret on deploy.
    workflows: [priv-ai-first-markets-deploy.yml]
    environments: [repository]
    rotation: manual
    owner_action: none required. Rotating it logs every user out. Move it into the `cloudflare` environment when that workflow next changes.
  - name: DOCS_PASSCODE
    provider: Self-generated (retail-pilot-intel docs site)
    scope: Baked into the built docs bundle as VITE_DOCS_PASSCODE, so anyone who loads the site can read it. It is a speed bump, not access control.
    workflows: [priv-retail-pilot-intel-deploy-docs.yml]
    environments: [repository]
    rotation: manual
    owner_action: none. Do not reuse this value anywhere that needs to stay secret.

  # --- Analytics ----------------------------------------------------------
  - name: GSC_SERVICE_ACCOUNT_JSON
    provider: Google Cloud service account key (Search Console API)
    scope: Read access to the Search Console properties the service account is added to (platform/seo/README.md).
    workflows: [priv-site-usage-pull.yml]
    environments: [usage]
    rotation: manual
    owner_action: Not set yet (blocked on search-engine-verification in portfolio/ledger/asks.yaml). When setting it up, prefer Workload Identity Federation (google-github-actions/auth with an OIDC provider) over a JSON key; no long-lived key is then stored.

  # --- Paid model APIs ----------------------------------------------------
  - name: ANTHROPIC_API_KEY
    provider: Anthropic API key
    scope: Calls the Claude API on the owner's billing; used by the manual uitest job when use-model-key is ticked. (The adversarial gate's LLM review no longer reads it; it calls Claude Platform on AWS through the github-llm-gate role, owner 2026-11-26.)
    workflows: [priv-uitest-ci.yml]
    environments: [paid-agents]
    rotation: manual
    owner_action: Keep a workspace spend limit on the key. Anthropic keys do not expire; rotate if it is ever printed.
  - name: OPENCODE_API_KEY
    provider: OpenCode API key
    scope: Model calls billed to the OpenCode account.
    workflows: [priv-opencode-high-throughput.yml]
    environments: [paid-agents]
    rotation: manual
    owner_action: Keep a spend limit on the account.

  # --- Social and newsletter accounts -------------------------------------
  - name: BSKY_HANDLE
    provider: Bluesky
    scope: Not a credential; the account handle the app password logs in as.
    workflows: [priv-distribute-bluesky.yml, priv-distribute-hub.yml]
    environments: [publish]
    rotation: manual
    owner_action: none. Could be a variable.
  - name: BSKY_APP_PASSWORD
    provider: Bluesky app password
    scope: Posts as the bot account. An app password cannot change the account's password or delete it.
    workflows: [priv-distribute-bluesky.yml]
    environments: [publish]
    rotation: manual
    owner_action: none required; revoke and recreate in Bluesky settings if it leaks.
  - name: MASTODON_TOKEN
    provider: Mastodon application token
    scope: write:statuses and read:accounts on the bot account (portfolio/distribution/SETUP.md).
    workflows: [priv-distribute-mastodon.yml]
    environments: [publish]
    rotation: manual
    owner_action: none
  - name: DEVTO_API_KEY
    provider: dev.to API key
    scope: Full API access to the dev.to account (dev.to keys have no scopes).
    workflows: [priv-distribute-devto.yml, priv-distribute-hub.yml]
    environments: [publish]
    rotation: manual
    owner_action: none
  - name: HASHNODE_TOKEN
    provider: Hashnode personal access token
    scope: Full API access to the Hashnode account.
    workflows: [priv-distribute-hashnode.yml]
    environments: [publish]
    rotation: manual
    owner_action: none
  - name: THREADS_TOKEN
    provider: Meta (Threads API)
    scope: The permissions granted to the Meta app (listed by node platform/distribution/hub.mjs platforms).
    workflows: [priv-distribute-hub.yml]
    environments: [publish]
    rotation: manual
    owner_action: Meta's long-lived user tokens expire unless refreshed and nothing here refreshes them, so expect to renew it by hand.
  - name: FACEBOOK_PAGE_TOKEN
    provider: Meta (Facebook Page)
    scope: Posts to the one Page, with the permissions granted to the Meta app.
    workflows: [priv-distribute-hub.yml]
    environments: [publish]
    rotation: manual
    owner_action: none required
  - name: INSTAGRAM_TOKEN
    provider: Meta (Instagram Graph API)
    scope: Publishes to the linked Instagram professional account.
    workflows: [priv-distribute-hub.yml]
    environments: [publish]
    rotation: manual
    owner_action: Same expiry caveat as THREADS_TOKEN.
  - name: BUTTONDOWN_API_KEY
    provider: Buttondown API key
    scope: Full API access to the newsletter, including sending once EMAIL_SEND=true.
    workflows: [priv-distribute-hub.yml]
    environments: [publish]
    rotation: manual
    owner_action: none

retired:
  - name: VERCEL_TOKEN
    replaced_by: the Cloudflare deploy in priv-retail-pilot-intel-deploy-docs.yml (PR #18670); the Vercel job never ran
    owner_action: Delete the secret, then the Vercel project and account (docs/reports/2026-11-24-cloudflare-consolidation.md).
  - name: VERCEL_ORG_ID
    replaced_by: nothing (Vercel deploy removed in PR #18670)
    owner_action: Delete the secret.
  - name: VERCEL_PROJECT_ID
    replaced_by: nothing (Vercel deploy removed in PR #18670)
    owner_action: Delete the secret.
  - name: PYPI_TOKEN
    replaced_by: PyPI trusted publishing (OIDC) in priv-distribute-pypi.yml and priv-distribute-pypi-packages.yml
    owner_action: After the pending publishers are added and a run is green, delete it from the publish environment (and repository secrets) and revoke the token on pypi.org.
  - name: NPM_TOKEN
    replaced_by: npm trusted publishing (OIDC) in priv-distribute-npm.yml and priv-distribute-mcp.yml
    owner_action: After the first publishes and trusted publishers are done, delete it and revoke the token on npmjs.com.
  - name: HOMEBREW_TAP_TOKEN
    replaced_by: HOMEBREW_TAP_APP_PRIVATE_KEY (GitHub App installation token)
    owner_action: Once the app is installed and a run is green, delete it and revoke the fine-grained PAT.
