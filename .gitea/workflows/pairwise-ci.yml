name: Pairwise CI

on:
  pull_request:
    paths:
      - "ventures/quick-pick-survey/**"
      - ".gitea/workflows/pairwise-ci.yml"
      - "platform/ci/deploy-pairwise.sh"
      - "platform/ci/promote-pairwise-gitops.sh"
      - "platform/ci/wait-for-pairwise-release.sh"
      - "platform/ci/report-pairwise-release-failure.sh"
      - "platform/ci/smoke-test-pairwise.sh"
      - "platform/k8s/argocd-apps/quick-pick-survey.yaml"
      - "platform/k8s/apps/quick-pick-survey/**"
      - "platform/terraform/helm/web-service/**"
      - "platform/terraform/services.tf"
      - "platform/terraform/autoscaling.tf"
      - "platform/terraform/gitea_runner.tf"
  push:
    # Every Pairwise change merged to main must pass the release gates and deploy.
    branches: [main]
    paths:
      - "ventures/quick-pick-survey/**"
      - ".gitea/workflows/pairwise-ci.yml"
      - "platform/ci/deploy-pairwise.sh"
      - "platform/ci/promote-pairwise-gitops.sh"
      - "platform/ci/smoke-test-pairwise.sh"
      - "platform/k8s/argocd-apps/quick-pick-survey.yaml"
      - "platform/k8s/apps/quick-pick-survey/**"
      - "platform/terraform/helm/web-service/**"
      - "platform/terraform/services.tf"
      - "platform/terraform/autoscaling.tf"
      - "platform/terraform/gitea_runner.tf"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: pairwise-ci-${{ github.workflow }}-${{ github.ref }}
  # A newer commit must not cancel a production migration or rolling update.
  cancel-in-progress: false

defaults:
  run:
    working-directory: ventures/quick-pick-survey

env:
  POSTGRES_PRISMA_URL: postgresql://postgres:postgres@postgres:5432/integration?schema=public
  POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@postgres:5432/integration?schema=public
  ADMIN_KEY: integration-admin-key
  ADMIN_SESSION_SECRET: integration-session-secret
  RATE_LIMIT_SECRET: integration-rate-limit-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Integration tests and migration drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations and seed disposable database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Database integration tests
        run: npm run test:integration

      - name: Verify migration history matches Prisma schema
        run: |
          printf 'CREATE DATABASE shadow;' |
            npx prisma db execute \
              --url postgresql://postgres:postgres@postgres:5432/postgres \
              --stdin
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@postgres:5432/shadow \
            --exit-code

  container:
    name: Build and publish deployable container
    needs: [app, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the exact deployable image
        env:
          IMAGE: git.marisstella.dev/giteaadmin/pairwise-app:${{ github.sha }}
        run: >-
          docker build
          --file Dockerfile
          --tag "$IMAGE"
          .

      - name: Smoke test the exact deployable image
        env:
          IMAGE: git.marisstella.dev/giteaadmin/pairwise-app:${{ github.sha }}
        run: |
          # shellcheck disable=SC2317
          cleanup() {
            if docker ps --all --quiet \
              --filter name=pairwise-container-smoke |
                grep -q .; then
              docker rm --force pairwise-container-smoke >/dev/null
            fi
          }
          trap cleanup EXIT
          docker run --detach \
            --name pairwise-container-smoke \
            --env POSTGRES_PRISMA_URL=postgresql://unused:unused@127.0.0.1:5432/unused \
            --env POSTGRES_URL_NON_POOLING=postgresql://unused:unused@127.0.0.1:5432/unused \
            --env ADMIN_KEY=container-smoke-admin \
            --env ADMIN_SESSION_SECRET=container-smoke-session \
            --env RATE_LIMIT_SECRET=container-smoke-rate-limit \
            "$IMAGE"
          for _ in $(seq 1 30); do
            if docker exec pairwise-container-smoke \
              wget --quiet --output-document=- \
                http://127.0.0.1:3000/api/health |
                grep -Fq '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs pairwise-container-smoke
          exit 1

      - name: Publish immutable main image
        id: publish
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: git.marisstella.dev/giteaadmin/pairwise-app:${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.PAIRWISE_REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login git.marisstella.dev \
              --username giteaadmin \
              --password-stdin
          docker push "$IMAGE"
          docker tag "$IMAGE" git.marisstella.dev/giteaadmin/pairwise-app:latest
          docker push git.marisstella.dev/giteaadmin/pairwise-app:latest
          digest="$(
            docker manifest inspect --verbose "$IMAGE" |
              jq -r '
                if type == "array"
                then .[0].Descriptor.digest
                else .Descriptor.digest // .digest
                end
              '
          )"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Registry returned an invalid digest: $digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "${GITHUB_OUTPUT:-$GITEA_OUTPUT}"

  promote:
    name: Promote verified digest to GitOps production
    needs: container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Commit the verified digest to the production branch
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          git config user.name "Pairwise GitOps promoter"
          git config user.email "pairwise-gitops@marisstella.dev"
          if git fetch origin gitops-production; then
            git switch --force-create gitops-production origin/gitops-production
            git merge --no-edit "$RELEASE_REVISION"
          else
            git switch --create gitops-production
          fi
          platform/ci/promote-pairwise-gitops.sh
          git add \
            platform/k8s/apps/quick-pick-survey/deployment.yaml \
            platform/k8s/apps/quick-pick-survey/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production already records $IMAGE_DIGEST"
            exit 0
          fi
          git commit -m "deploy(pairwise): promote ${RELEASE_REVISION}"
          git push origin HEAD:gitops-production

  verify-production:
    name: Verify exact production release
    needs: promote
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for the promoted revision to serve traffic
        run: platform/ci/wait-for-pairwise-release.sh "${{ github.sha }}"

      - name: Run database-backed production smoke tests
        run: platform/ci/smoke-test-pairwise.sh

      - name: Queue a bounded AI repair task
        if: failure()
        env:
          GITEA_API_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          GITEA_RUN_ID: ${{ github.run_id }}
          PAIRWISE_RELEASE_REVISION: ${{ github.sha }}
          PAIRWISE_FAILED_GATE: exact-revision production smoke
        run: platform/ci/report-pairwise-release-failure.sh
