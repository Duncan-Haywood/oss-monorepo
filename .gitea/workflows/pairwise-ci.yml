name: Pairwise CI

on:
  pull_request:
    paths:
      - "ventures/quick-pick-survey/**"
      - ".gitea/workflows/pairwise-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/quick-pick-survey/**"
      - ".gitea/workflows/pairwise-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pairwise-ci-${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/quick-pick-survey

env:
  POSTGRES_PRISMA_URL: postgresql://postgres:postgres@127.0.0.1:5432/integration?schema=public
  POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/integration?schema=public
  ADMIN_KEY: ci-placeholder
  ADMIN_SESSION_SECRET: ci-placeholder-session-secret
  RATE_LIMIT_SECRET: ci-placeholder-rate-limit-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c3800040652e742e88a38b1f # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Integration tests and migration drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c3800040652e742e88a38b1f # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations and seed disposable database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Database integration tests
        run: npm run test:integration

      - name: Verify migration history matches Prisma schema
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres shadow
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@127.0.0.1:5432/shadow \
            --exit-code

  container:
    name: Build deployable container
    needs: [app, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build the Dockerfile without publishing
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ventures/quick-pick-survey
          file: ventures/quick-pick-survey/Dockerfile
          push: false
          tags: pairwise-ci:${{ gitea.sha }}
          cache-from: type=gha,scope=pairwise
          cache-to: type=gha,mode=max,scope=pairwise
