name: Pairwise CI

on:
  pull_request:
    paths:
      - "ventures/quick-pick-survey/**"
      - ".gitea/workflows/pairwise-ci.yml"
      - "platform/ci/deploy-pairwise.sh"
      - "platform/k8s/apps/quick-pick-survey/**"
  push:
    # Every Pairwise change merged to main must pass the release gates and deploy.
    branches: [main]
    paths:
      - "ventures/quick-pick-survey/**"
      - ".gitea/workflows/pairwise-ci.yml"
      - "platform/ci/deploy-pairwise.sh"
      - "platform/k8s/apps/quick-pick-survey/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pairwise-ci-${{ github.workflow }}-${{ github.ref }}
  # A newer commit must not cancel a production migration or rolling update.
  cancel-in-progress: false

defaults:
  run:
    working-directory: ventures/quick-pick-survey

env:
  POSTGRES_PRISMA_URL: postgresql://postgres:postgres@postgres:5432/integration?schema=public
  POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@postgres:5432/integration?schema=public
  ADMIN_KEY: integration-admin-key
  ADMIN_SESSION_SECRET: integration-session-secret
  RATE_LIMIT_SECRET: integration-rate-limit-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Integration tests and migration drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations and seed disposable database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Database integration tests
        run: npm run test:integration

      - name: Verify migration history matches Prisma schema
        run: |
          printf 'CREATE DATABASE shadow;' |
            npx prisma db execute \
              --url postgresql://postgres:postgres@postgres:5432/postgres \
              --stdin
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@postgres:5432/shadow \
            --exit-code

  container:
    name: Build and publish deployable container
    needs: [app, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the exact deployable image
        env:
          IMAGE: git.marisstella.dev/giteaadmin/pairwise-app:${{ github.sha }}
        run: >-
          docker build
          --file Dockerfile
          --tag "$IMAGE"
          .

      - name: Publish immutable main image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: git.marisstella.dev/giteaadmin/pairwise-app:${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.PAIRWISE_REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login git.marisstella.dev \
              --username "${{ github.actor }}" \
              --password-stdin
          docker push "$IMAGE"
          docker tag "$IMAGE" git.marisstella.dev/giteaadmin/pairwise-app:latest
          docker push git.marisstella.dev/giteaadmin/pairwise-app:latest

  deploy:
    name: Migrate and deploy to production
    needs: container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
        run: |
          install -d -m 0755 "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/bin/kubectl.sha256" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          printf '%s  %s\n' \
            "$(cat "$RUNNER_TEMP/bin/kubectl.sha256")" \
            "$RUNNER_TEMP/bin/kubectl" |
            sha256sum --check
          chmod 0755 "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "${GITHUB_PATH:-$GITEA_PATH}"
          "$RUNNER_TEMP/bin/kubectl" version --client

      - name: Configure production cluster access
        shell: bash
        env:
          HETZNER_KUBECONFIG: ${{ secrets.HETZNER_KUBECONFIG }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/kube"
          printf '%s' "$HETZNER_KUBECONFIG" > "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "${GITHUB_ENV:-$GITEA_ENV}"

      - name: Deploy the verified commit with zero unavailable replicas
        env:
          IMAGE: git.marisstella.dev/giteaadmin/pairwise-app:${{ github.sha }}
          REGISTRY_SERVER: git.marisstella.dev
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.PAIRWISE_REGISTRY_TOKEN }}
          RELEASE_REVISION: ${{ github.sha }}
        run: platform/ci/deploy-pairwise.sh
