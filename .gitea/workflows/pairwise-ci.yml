name: Pairwise CI

on:
  pull_request:
    paths:
      - "ventures/quick-pick-survey/**"
      - ".gitea/workflows/pairwise-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/quick-pick-survey/**"
      - ".gitea/workflows/pairwise-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pairwise-ci-${{ gitea.workflow }}-${{ gitea.ref }}
  # A newer commit must not cancel a production migration or rolling update.
  cancel-in-progress: false

defaults:
  run:
    working-directory: ventures/quick-pick-survey

env:
  POSTGRES_PRISMA_URL: postgresql://postgres:postgres@postgres:5432/integration?schema=public
  POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@postgres:5432/integration?schema=public
  ADMIN_KEY: integration-admin-key
  ADMIN_SESSION_SECRET: integration-session-secret
  RATE_LIMIT_SECRET: integration-rate-limit-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Integration tests and migration drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      - name: Install locked dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations and seed disposable database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Database integration tests
        run: npm run test:integration

      - name: Install PostgreSQL client for migration drift check
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends postgresql-client

      - name: Verify migration history matches Prisma schema
        run: |
          PGPASSWORD=postgres createdb -h postgres -U postgres shadow
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@postgres:5432/shadow \
            --exit-code

  container:
    name: Build and publish deployable container
    needs: [app, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to the Gitea container registry
        if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: >-
          printf '%s' "$REGISTRY_TOKEN" |
          docker login git.marisstella.dev
          --username "${{ gitea.actor }}"
          --password-stdin

      - name: Build the Dockerfile and publish immutable main images
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ventures/quick-pick-survey
          file: ventures/quick-pick-survey/Dockerfile
          push: ${{ gitea.event_name == 'push' && gitea.ref == 'refs/heads/main' }}
          tags: |
            git.marisstella.dev/giteaadmin/pairwise-app:${{ gitea.sha }}
            git.marisstella.dev/giteaadmin/pairwise-app:latest
          cache-from: type=gha,scope=pairwise
          cache-to: type=gha,mode=max,scope=pairwise

  deploy:
    name: Migrate and deploy to production
    needs: container
    if: gitea.event_name == 'push' && gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure production cluster access
        shell: bash
        env:
          HETZNER_KUBECONFIG: ${{ secrets.HETZNER_KUBECONFIG }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/kube"
          printf '%s' "$HETZNER_KUBECONFIG" > "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "${GITHUB_ENV:-$GITEA_ENV}"

      - name: Deploy the verified commit with zero unavailable replicas
        env:
          IMAGE: git.marisstella.dev/giteaadmin/pairwise-app:${{ gitea.sha }}
          REGISTRY_SERVER: git.marisstella.dev
          REGISTRY_USERNAME: ${{ gitea.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_REVISION: ${{ gitea.sha }}
        run: platform/ci/deploy-pairwise.sh
