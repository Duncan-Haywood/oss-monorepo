name: Service Release Configuration Validation

on:
  pull_request:
    paths:
      - "platform/terraform/helm/web-service/**"
      - "platform/k8s/apps/**"
      - ".gitea/workflows/deploy-services.yml"
  push:
    branches: [main]
    paths:
      - "platform/terraform/helm/web-service/**"
      - "platform/k8s/apps/**"
      - ".gitea/workflows/deploy-services.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render and inspect deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@fe7a050d3815f1915087c0bf0d6f217823f6e1f0 # v4.2.0
        with:
          version: "v3.14.0"
      - name: Lint chart
        run: helm lint platform/terraform/helm/web-service
      - name: Render chart without cluster credentials
        run: >-
          helm template web-service platform/terraform/helm/web-service
          --namespace web-services
          --set image.repository=example.invalid/service
          --set image.tag=ci-${{ github.sha }}
          --set ingress.host=service.example.invalid
          > "$RUNNER_TEMP/web-service.yaml"
      - name: Reject mutable image tags
        run: |
          if grep -Eq 'image:.*:(latest|main|master)([[:space:]]|$)' "$RUNNER_TEMP/web-service.yaml"; then
            printf 'mutable image tag found in rendered manifests\n' >&2
            exit 1
          fi
