name: Service Release Configuration Validation

on:
  pull_request:
    paths:
      # Was `platform/terraform/helm/web-service/**`. The image-tag audit now
      # reads every `.tf` source too, so a `:latest` added to
      # `agent_platform.tf` has to trigger the gate that would catch it — a
      # correct control on a path the workflow never fires for is not a gate.
      - "platform/terraform/**"
      - "platform/k8s/**"
      - "platform/image-tag-exceptions.yaml"
      - "scripts/ci/image_tags.py"
      - "scripts/ci/terraform_images.py"
      - ".gitea/workflows/deploy-services.yml"
  push:
    branches: [main]
    paths:
      # Was `platform/terraform/helm/web-service/**`. The image-tag audit now
      # reads every `.tf` source too, so a `:latest` added to
      # `agent_platform.tf` has to trigger the gate that would catch it — a
      # correct control on a path the workflow never fires for is not a gate.
      - "platform/terraform/**"
      - "platform/k8s/**"
      - "platform/image-tag-exceptions.yaml"
      - "scripts/ci/image_tags.py"
      - "scripts/ci/terraform_images.py"
      - ".gitea/workflows/deploy-services.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render and inspect deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "v3.14.0"
      - name: Lint chart
        run: helm lint platform/terraform/helm/web-service
      - name: Render chart without cluster credentials
        run: >-
          helm template web-service platform/terraform/helm/web-service
          --namespace web-services
          --set image.repository=example.invalid/service
          --set image.tag=ci-${{ github.sha }}
          --set ingress.host=service.example.invalid
          > "$RUNNER_TEMP/web-service.yaml"
      # 3.11 is the interpreter the suite is developed against, and the same
      # pinned action ci-cd.yml uses for its Python gates.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install Python gate dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Reject mutable image tags
        # This step used to grep the render above for `latest|main|master`. The
        # render is produced with `--set image.tag=ci-${{ github.sha }}`, so the
        # string it searched for was one the same step had just made impossible:
        # it passed on every run ever made, and never opened the manifests in
        # platform/k8s that describe what actually runs. Seven of those carried
        # `:latest` throughout.
        run: python3 scripts/ci/image_tags.py
