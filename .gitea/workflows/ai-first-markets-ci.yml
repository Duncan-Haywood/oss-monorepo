name: AI-First Markets CI

on:
  pull_request:
    paths:
      - "ventures/ai-first-markets/**"
      - ".gitea/workflows/ai-first-markets-ci.yml"
  push:
    branches: [main]
    paths:
      - "ventures/ai-first-markets/**"
      - ".gitea/workflows/ai-first-markets-ci.yml"

permissions:
  contents: read

concurrency:
  group: ai-first-markets-ci-${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ventures/ai-first-markets

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c3800040652e742e88a38b1f # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ventures/ai-first-markets/package-lock.json
      - run: npm ci
      - name: Run the same fail-closed application gate used locally
        working-directory: ${{ gitea.workspace }}
        run: bash scripts/ci/verify-component.sh ai-first-markets
