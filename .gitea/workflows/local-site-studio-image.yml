# Builds the container image platform/k8s/apps/local-site-studio/ has always
# pointed at and nothing could produce.
#
# This workflow deliberately stops at publishing an immutable tag. It does not
# push `:latest` and it does not promote anything to the cluster — see the
# comment on the publish step. Turning this into a release chain like
# pairwise-ci.yml is an owner's decision, not a side effect of adding a build.
name: Local Site Studio image

on:
  pull_request:
    paths:
      - "ventures/local-site-studio/**"
      - ".gitea/workflows/local-site-studio-image.yml"
      - "platform/k8s/apps/local-site-studio/**"
      - "scripts/ci/verify-component.sh"
  push:
    branches: [main]
    paths:
      - "ventures/local-site-studio/**"
      - ".gitea/workflows/local-site-studio-image.yml"
      - "platform/k8s/apps/local-site-studio/**"
      - "scripts/ci/verify-component.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: local-site-studio-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify through the shared component gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # src/lib/db.ts imports node:sqlite, added in 22.5.0. On Node 20 the
          # build fails at "Collecting page data", so this must stay >= 22 and
          # match ventures/local-site-studio/.nvmrc.
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/local-site-studio/package-lock.json

      # The gate sequence is not restated here on purpose. Restating it is how
      # ai-first-markets' deploy workflow lost `npm test`; this delegates to the
      # one shared arm so the two cannot drift.
      - name: Run the shared verify-component gate
        env:
          CI_INSTALL_DEPENDENCIES: "1"
        run: scripts/ci/verify-component.sh local-site-studio

  container:
    name: Build and smoke test the deployable image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the exact deployable image
        env:
          IMAGE: git.marisstella.dev/giteaadmin/local-site-studio:${{ github.sha }}
        working-directory: ventures/local-site-studio
        run: docker build --file Dockerfile --tag "$IMAGE" .

      # The Deployment's liveness and readiness probes both GET "/", so that is
      # what is proven here. The app boots with no environment configured —
      # Stripe and Convex degrade rather than crash — so no secrets are needed
      # to establish that the container serves traffic.
      - name: Smoke test the exact deployable image
        env:
          IMAGE: git.marisstella.dev/giteaadmin/local-site-studio:${{ github.sha }}
        run: |
          # shellcheck disable=SC2317
          cleanup() {
            if docker ps --all --quiet \
              --filter name=local-site-studio-smoke |
                grep -q .; then
              docker rm --force local-site-studio-smoke >/dev/null
            fi
          }
          trap cleanup EXIT
          docker run --detach --name local-site-studio-smoke "$IMAGE"
          for _ in $(seq 1 30); do
            if docker exec local-site-studio-smoke \
              wget --quiet --spider http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 1
          done
          docker logs local-site-studio-smoke
          exit 1

      # Immutable tag only. platform/k8s/apps/local-site-studio/deployment.yaml
      # currently pins `:latest`, so publishing that tag would put an
      # unreviewed build of a venture holding live Stripe code into the cluster
      # the moment this merged. Promotion stays a separate, deliberate step.
      - name: Publish immutable main image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: git.marisstella.dev/giteaadmin/local-site-studio:${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.LOCAL_SITE_STUDIO_REGISTRY_TOKEN || secrets.PAIRWISE_REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login git.marisstella.dev \
              --username giteaadmin \
              --password-stdin
          docker push "$IMAGE"
