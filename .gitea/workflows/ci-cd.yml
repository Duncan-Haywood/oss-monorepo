name: Monorepo Production & Staging CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned by version and verified by checksum, because this is a binary
  # fetched from the network into a job that then lints the workflows.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256_LINUX_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  verify:
    name: Verify Monorepo via Dagger CI Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history and every remote branch. `scripts/ci/release_lag.py`
          # measures how far committed work sits from `origin/main`, which is
          # what production serves, and it fails closed when that ref does not
          # resolve. The default shallow checkout fetches only the ref being
          # built, so `origin/main` is absent and the audit could report nothing
          # but "cannot measure" — a gate that can only fail is one someone
          # eventually deletes. Confirmed against a real `--depth 1` clone.
          fetch-depth: 0

      # This job runs scripts/verify-all.sh, which runs scripts/test-ci.sh (12
      # gates) and then the Dagger engine. Until now the only tool it installed
      # was Node, so six of those gates could not pass and two more silently
      # skipped. The steps below exist to make each named gate executable;
      # platform/ci/test/ci-workflow-tooling.test.mjs holds them to that list,
      # so a new gate that needs new tooling fails until this file provides it.

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ventures/quick-pick-survey/package-lock.json

      # Gates 6-10: the portfolio router suite, the repo-wide pytest run, the
      # allocation report, the venture contract validator and the exception
      # register audit. 3.11 is the interpreter the suite is developed against.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Python gate dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      # Gate 1 runs `npm --prefix ventures/quick-pick-survey test`, which is
      # `vitest run`. node_modules is gitignored and nothing installed it, so
      # this gate failed first and `set -e` in verify-all.sh aborted the rest of
      # the pipeline before the Dagger engine was ever reached.
      - name: Install Pairwise venture dependencies
        working-directory: ventures/quick-pick-survey
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Generate Prisma Client
        working-directory: ventures/quick-pick-survey
        run: npx prisma generate

      # The Coverage Baseline Ratchet gate runs each component's coverage
      # command from platform/coverage-baseline.yaml. print-atelier's is
      # `node --import tsx ...`, and tsx resolves out of its own gitignored
      # node_modules — without this the gate reports coverage-tool-missing.
      - name: Install print-atelier dependencies for the coverage gate
        working-directory: ventures/print-atelier
        run: npm ci --ignore-scripts --no-audit --fund=false

      # Gate 11. Available from apt, unlike actionlint.
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      # Gate 12.
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256_LINUX_AMD64}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint "${archive}"

      # The IaC gate in platform/ci/src/pipeline.mjs. Without the CLI that
      # verifier returns true having checked nothing, so platform/terraform was
      # reported verified on every CI run.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd790757a3e7828004f2f9ff0ed28987ec854b # v3.1.2
        with:
          terraform_wrapper: false

      - name: Run Monorepo Unified Dagger Verification Engine
        run: |
          chmod +x scripts/verify-all.sh
          ./scripts/verify-all.sh
