name: Homepage CI

on:
  pull_request:
    paths:
      - "portfolio/marisstella-homepage/**"
      - ".gitea/workflows/homepage-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/marisstella-homepage/**"
      - ".gitea/workflows/homepage-ci.yml"

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build deployable container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: portfolio/marisstella-homepage
          push: false
          tags: marisstella-homepage-ci:${{ github.sha }}
          cache-from: type=gha,scope=homepage
          cache-to: type=gha,mode=max,scope=homepage
