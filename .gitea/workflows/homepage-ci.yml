name: Homepage CI/CD

on:
  pull_request:
    paths:
      - "portfolio/marisstella-homepage/**"
      - ".gitea/workflows/homepage-ci.yml"
      - "platform/ci/deploy-homepage.sh"
  push:
    branches: [main]
    paths:
      - "portfolio/marisstella-homepage/**"
      - ".gitea/workflows/homepage-ci.yml"
      - "platform/ci/deploy-homepage.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: homepage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify through the shared component gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # This workflow used to build and deploy with no gate in the chain at all.
      # The component's suite was declared in platform/ci/src/pipeline.mjs, which
      # ci-cd.yml runs — a separate workflow, triggered by the same push, with no
      # ordering relationship to this one. So a red suite and a production
      # rollout raced, and the rollout usually won. Every other release chain in
      # this repository reaches production behind a gate job; this was the one
      # that did not, on the one venture with live customers.
      - name: Run the shared verify-component gate
        run: scripts/ci/verify-component.sh marisstella-homepage

  container:
    name: Build and publish deployable container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build local container artifact
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: portfolio/marisstella-homepage
          push: false
          tags: git.marisstella.dev/giteaadmin/marisstella-homepage:${{ github.sha }}
          cache-from: type=gha,scope=homepage
          cache-to: type=gha,mode=max,scope=homepage

      - name: Publish immutable main image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: git.marisstella.dev/giteaadmin/marisstella-homepage:${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.HOMEPAGE_REGISTRY_TOKEN || secrets.PAIRWISE_REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login git.marisstella.dev \
              --username giteaadmin \
              --password-stdin
          docker push "$IMAGE"
          docker tag "$IMAGE" git.marisstella.dev/giteaadmin/marisstella-homepage:latest
          docker push git.marisstella.dev/giteaadmin/marisstella-homepage:latest

  deploy:
    name: Deploy to production cluster
    needs: container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Kubernetes client
        shell: bash
        env:
          KUBECTL_VERSION: v1.36.2
        run: |
          install -d -m 0755 "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod 0755 "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "${GITHUB_PATH:-$GITEA_PATH}"

      - name: Configure production cluster access
        shell: bash
        env:
          HETZNER_KUBECONFIG_B64: ${{ secrets.HETZNER_KUBECONFIG_B64 }}
        run: |
          test -n "$HETZNER_KUBECONFIG_B64" || {
            echo "HETZNER_KUBECONFIG_B64 is not configured" >&2
            exit 1
          }
          install -d -m 0700 "$RUNNER_TEMP/kube"
          printf '%s' "$HETZNER_KUBECONFIG_B64" |
            base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "${GITHUB_ENV:-$GITEA_ENV}"

      - name: Execute rolling update
        env:
          KUBECONFIG: ${{ runner.temp }}/kube/config
          IMAGE: git.marisstella.dev/giteaadmin/marisstella-homepage:${{ github.sha }}
          REGISTRY_SERVER: git.marisstella.dev
          REGISTRY_USERNAME: giteaadmin
          REGISTRY_TOKEN: ${{ secrets.HOMEPAGE_REGISTRY_TOKEN || secrets.PAIRWISE_REGISTRY_TOKEN }}
          RELEASE_REVISION: ${{ github.sha }}
        run: platform/ci/deploy-homepage.sh
