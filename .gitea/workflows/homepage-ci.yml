name: Homepage CI

on:
  pull_request:
    paths:
      - "portfolio/marisstella-homepage/**"
      - ".gitea/workflows/homepage-ci.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/marisstella-homepage/**"
      - ".gitea/workflows/homepage-ci.yml"

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build deployable container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: portfolio/marisstella-homepage
          push: false
          tags: marisstella-homepage-ci:${{ github.sha }}
          cache-from: type=gha,scope=homepage
          cache-to: type=gha,mode=max,scope=homepage
