# Pilot edge stack. Build docs first: pnpm docs:build
# Serve at http://localhost:8080 — see docs/README.md for passcode + optional nginx auth.
services:
  docs:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./apps/docs/dist:/usr/share/nginx/html:ro
      - ./docker/docs.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  analytics-sync:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - pilot-data:/app/data
    command: sh -c "corepack enable && pnpm exec tsx packages/analytics/src/cli.ts sync"
    environment:
      - STORE_ID=${STORE_ID:-pilot-leather-01}
    restart: unless-stopped

volumes:
  pilot-data:
